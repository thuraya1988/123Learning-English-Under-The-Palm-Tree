/* ===== SCENE ===== */
.scene{
  position:relative; width:100%; height:100%; overflow:hidden;
  background:linear-gradient(180deg,#dff2ff 0%,#cde8ff 45%,#b9dcff 100%);
}

/* الشمس */
.sun{
  position:absolute; top:14px; right:130px; transform:none;
  width:78px; height:78px; border-radius:50%; z-index:2;
  background:radial-gradient(circle at 35% 35%,#fffde0 0%,#ffe566 35%,#fdd835 70%,#f9a825 100%);
  box-shadow:0 0 24px rgba(255,220,50,.9),0 0 58px rgba(255,210,30,.55),0 0 105px rgba(255,200,20,.28);
  animation:sunPulse 4s ease-in-out infinite;
}
.sun::before{content:"";position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,80,.18),transparent 65%);z-index:-1;}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* الغيوم */
.cloud{position:absolute;pointer-events:none;z-index:5;animation:cloudDrift 20s ease-in-out infinite;}
.cloud .cb{position:relative;background:rgba(255,255,255,.95);border-radius:999px;}
.cloud .cb1,.cloud .cb2,.cloud .cb3{position:absolute;background:rgba(255,255,255,.95);border-radius:50%;}
.cloud1{top:52px;left:22%;}
.cloud2{top:110px;right:5%;animation-duration:28s;animation-direction:reverse;}
@keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}

/* الشخصية - يسار اللوحة */
.happy-girl{display:none !important;
  position:absolute; left:18px; bottom:118px;
  width:100px; height:188px;
  pointer-events:none; z-index:3;
  animation:girlBob 3s ease-in-out infinite;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.15));
}
.girl-hair{
  width:66px; height:30px;
  background:linear-gradient(135deg,#7ed8ff,#38b6e8);
  border-radius:50% 50% 0 0;
  margin:0 auto -5px; position:relative;
  box-shadow:0 -3px 8px rgba(62,180,230,.35);
}
.girl-hair::after{
  content:"";position:absolute;left:-7px;top:6px;
  width:9px;height:26px;
  background:linear-gradient(160deg,#7ed8ff,#38b6e8);
  border-radius:0 0 8px 50%;
}
.girl-face{
  width:58px;height:58px;
  background:radial-gradient(circle at 38% 35%,#ffe8cc,#ffd0a0);
  border-radius:50%; margin:0 auto; position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
}
.girl-neck{width:14px;height:10px;background:#ffd0a0;margin:0 auto;}
.girl-body-wrap{position:relative;display:flex;justify-content:center;}
.girl-body{
  width:54px;height:60px;
  background:linear-gradient(180deg,#ff8fab,#e0396a);
  border-radius:14px 14px 8px 8px;
  position:relative;
  box-shadow:0 4px 10px rgba(200,40,90,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.girl-arm{
  position:absolute;top:5px;
  width:13px;height:42px;
  background:linear-gradient(180deg,#ff8fab,#e0396a);
  border-radius:8px;
}
.girl-arm.left{right:-11px;transform:rotate(14deg);animation:waveArm .9s ease-in-out infinite alternate;}
.girl-arm.right{left:-11px;transform:rotate(-14deg);}
.girl-legs{display:flex;gap:5px;justify-content:center;margin-top:2px;}
.girl-leg{width:18px;height:48px;background:linear-gradient(180deg,#ce93d8,#9c27b0);border-radius:6px 6px 4px 4px;}
.girl-shoes{display:flex;gap:5px;justify-content:center;}
.girl-shoe{width:23px;height:11px;background:linear-gradient(180deg,#ffb300,#e65100);border-radius:8px 8px 4px 4px;}
@keyframes girlBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes waveArm{from{transform:rotate(14deg)}to{transform:rotate(38deg)}}

/* البيت الوردي */
.house-pink{
  position:absolute;right:3%;bottom:108px;
  width:148px;height:148px;
  transform:perspective(600px) rotateY(-12deg) rotateX(2deg);
  transform-origin:center bottom; z-index:3; pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(180,60,120,.2));
}
.pr{position:absolute;left:10px;top:0;width:0;height:0;border-left:64px solid transparent;border-right:64px solid transparent;border-bottom:50px solid #e85fa0;}
.prs{position:absolute;left:10px;top:32px;width:128px;height:18px;background:linear-gradient(180deg,#c8336e,#a02858);border-radius:0 0 4px 4px;}
.pb{position:absolute;left:16px;top:48px;width:116px;height:86px;border-radius:10px;background:linear-gradient(180deg,#ffd6f0,#ffb8e0);box-shadow:inset 0 -7px 0 rgba(200,80,150,.18),inset 0 6px 0 rgba(255,255,255,.5);border:2px solid rgba(200,80,150,.22);}
.pd{position:absolute;bottom:0;left:40px;width:28px;height:50px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#a0522d,#7a3820);}
.pd::after{content:"";position:absolute;top:10px;left:50%;width:5px;height:5px;border-radius:50%;background:#ffd700;transform:translateX(-50%);}
.pw{position:absolute;top:15px;width:23px;height:19px;border-radius:5px;background:#c8f0ff;border:2px solid rgba(80,160,200,.45);}
.pw1{left:12px;}.pw2{right:12px;}
.p-tree{position:absolute;right:calc(3% + 146px);bottom:108px;width:46px;height:74px;z-index:2;pointer-events:none;}
.pt-top{position:absolute;top:0;left:3px;width:40px;height:46px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 38% 35%,#7ae05a,#3da832);}
.pt-trunk{position:absolute;bottom:0;left:17px;width:12px;height:30px;border-radius:4px;background:linear-gradient(180deg,#8B5E3C,#6b3e1e);}

/* الأزهار */
.flowers{position:absolute;left:0;right:0;bottom:68px;height:104px;z-index:2;pointer-events:none;}
.flower{position:absolute;bottom:0;font-size:26px;animation:flowerBob 3.2s ease-in-out infinite;transform-origin:bottom center;}
.flower.side{bottom:22px;}
@keyframes flowerBob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-4px)}}

/* الفراشات */
.butterfly{position:absolute;font-size:26px;z-index:3;pointer-events:none;}
.butterfly .wing{display:inline-block;animation:flap .13s infinite alternate;}
.butterfly .wing.r{animation-delay:.08s;}
@keyframes flap{from{transform:scaleY(1) rotate(-12deg)}to{transform:scaleY(.5) rotate(12deg)}}
.bf1{animation:bfOrbit1 5s linear infinite;}
.bf2{animation:bfOrbit2 7s linear infinite reverse;}
@keyframes bfOrbit1{
  0%  {top:calc(50% - 180px);left:30px;}
  25% {top:calc(50% - 80px); left:200px;}
  50% {top:calc(50% + 80px); left:220px;}
  75% {top:calc(50% + 40px); left:10px;}
  100%{top:calc(50% - 180px);left:30px;}
}
@keyframes bfOrbit2{
  0%  {top:calc(50% - 120px);left:180px;}
  25% {top:calc(50% + 60px); left:240px;}
  50% {top:calc(50% + 100px);left:20px;}
  75% {top:calc(50% - 60px); left:-10px;}
  100%{top:calc(50% - 120px);left:180px;}
}

/* العشب */
.grass{position:absolute;left:-3%;right:-3%;bottom:-18px;height:145px;background:linear-gradient(180deg,#9ae27c,#78cb5f);z-index:1;border-top-left-radius:52% 70px;border-top-right-radius:52% 70px;animation:meadowWave 6s ease-in-out infinite;}
.grass::before{content:"";position:absolute;inset:0;opacity:.6;background:radial-gradient(circle at 10% 25%,rgba(255,255,255,.15),transparent 16%),radial-gradient(circle at 70% 30%,rgba(255,255,255,.12),transparent 14%);}
@keyframes meadowWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ===== PANEL ===== */
.panel{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(480px,54vw);
  background:rgba(255,253,248,.97);
  border-radius:38px;padding:26px 24px 22px;
  box-shadow:0 24px 42px rgba(73,109,153,.22),0 12px 0 rgba(255,255,255,.9) inset,0 -10px 0 rgba(171,194,220,.22) inset;
  border:2px solid rgba(255,255,255,.8);
  text-align:center;z-index:4;
  transition:opacity .4s,transform .4s;
}
.panel.hidden{opacity:0;transform:translate(-50%,-48%) scale(.98);pointer-events:none;}

.title{margin:-4px 0 10px;font-size:clamp(1.4rem,2.1vw,2.1rem);line-height:1.25;color:#bf8a2f;font-weight:800;}
.title .num{display:block;font-size:.7em;letter-spacing:2px;color:#c8922a;margin-bottom:2px;}

.row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.btn{
  position:relative;border:none;border-radius:14px;padding:10px 15px;min-width:86px;
  font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;
  transition:transform .15s,box-shadow .2s;overflow:hidden;user-select:none;
}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 48%);pointer-events:none;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(2px);}
.btn-soft{background:linear-gradient(180deg,#e8f8e4,#d4f0ce);color:#35572f;box-shadow:0 5px 0 #8dcb86,0 9px 16px rgba(75,131,74,.15);}
.btn-soft:hover{background:linear-gradient(180deg,#d4f0ce,#c2e8ba);}
.btn-soft.active{background:linear-gradient(180deg,#5cb85c,#3e9444);color:#fff;box-shadow:0 5px 0 #2d7b34,0 9px 16px rgba(45,120,50,.25);}
.btn-start{min-width:138px;background:linear-gradient(180deg,#4caf50,#3b9440);color:#fff;box-shadow:0 6px 0 #2d7b34,0 12px 20px rgba(45,123,52,.2);}
.grade-btn{min-width:48px;padding:9px 0;}

.field{
  cursor:text;width:100%;border-radius:12px;border:1.5px solid #e7dcc8;
  background:#fff;padding:11px 13px;font-family:inherit;font-size:.9rem;
  color:#6f624b;outline:none;box-shadow:0 3px 0 #f1eadb inset;transition:border-color .2s;
}
.field:focus{border-color:#d8bd7c;box-shadow:0 0 0 3px rgba(215,189,124,.1);}

.tools{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.tool-btn{
  width:100%;background:linear-gradient(180deg,#f3fbf1,#e6f6e1);color:#647258;
  border:none;border-radius:14px;padding:11px 14px;font-size:.9rem;
  font-family:inherit;font-weight:700;box-shadow:0 5px 0 #d8ead2;
  cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;
}
.tool-btn:hover{transform:translateY(-2px);}
.tool-btn:active{transform:translateY(2px);}
.tool-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 48%);pointer-events:none;}

/* أزرار اللغة */
.lang-btn{min-width:100px;background:linear-gradient(180deg,#c7edbf,#e5f7df);color:#35613a;box-shadow:0 5px 0 #8fca84;}
.lang-btn.selected{background:linear-gradient(180deg,#9bdd8e,#c8efbf);color:#234c28;}
#arBtn{position:fixed;top:10px;right:10px;z-index:9999;}
#enBtn{position:fixed;top:10px;left:10px;z-index:9999;}

.top-note{
  position:fixed;bottom:10px;left:10px;color:#111;font-size:11px;
  z-index:9999;padding:4px 10px;border:1px solid rgba(255,255,255,.28);
  border-radius:10px;background:rgba(255,255,255,.12);backdrop-filter:blur(1px);
  font-weight:600;white-space:nowrap;pointer-events:none;
}

/* ===== VILLAGE ===== */
#dreamLandView{
  position:fixed;inset:0;display:none;z-index:5;overflow:hidden;
  background:linear-gradient(180deg,#4fc8f8 0%,#74d8ff 30%,#a8e8ff 60%,#c8f0ff 100%);
}
#dreamLandView.show{display:block;}

/* القمر */
.v-sun{
  position:absolute;top:4%;right:16%;
  width:55px;height:55px;border-radius:50%;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 38% 35%,#fffde8 0%,#fff9c4 40%,#fef08a 75%,#fde047 100%);
  box-shadow:0 0 18px rgba(255,240,120,.8),0 0 45px rgba(255,230,80,.45),0 0 90px rgba(255,220,50,.2);
  animation:moonGlow 4s ease-in-out infinite;
  display:block !important;
}
@keyframes moonGlow{
  0%,100%{box-shadow:0 0 18px rgba(255,240,120,.8),0 0 45px rgba(255,230,80,.45),0 0 90px rgba(255,220,50,.2);}
  50%{box-shadow:0 0 26px rgba(255,245,130,1),0 0 60px rgba(255,235,90,.6),0 0 110px rgba(255,225,60,.3);}
}

/* النجوم */
.v-cloud{ display:none; }
#dreamLandView .stars{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle at 8% 5%, rgba(255,255,255,.95) 0%, transparent 0.4%),
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.8) 0%, transparent 0.3%),
    radial-gradient(circle at 28% 4%, rgba(255,255,255,.9) 0%, transparent 0.35%),
    radial-gradient(circle at 38% 9%, rgba(255,255,255,.75) 0%, transparent 0.3%),
    radial-gradient(circle at 48% 3%, rgba(255,255,255,.9) 0%, transparent 0.35%),
    radial-gradient(circle at 58% 8%, rgba(255,255,255,.8) 0%, transparent 0.3%),
    radial-gradient(circle at 68% 5%, rgba(255,255,255,.85) 0%, transparent 0.35%),
    radial-gradient(circle at 78% 11%, rgba(255,255,255,.75) 0%, transparent 0.3%),
    radial-gradient(circle at 88% 4%, rgba(255,255,255,.9) 0%, transparent 0.35%),
    radial-gradient(circle at 95% 9%, rgba(255,255,255,.8) 0%, transparent 0.3%),
    radial-gradient(circle at 12% 20%, rgba(255,255,255,.7) 0%, transparent 0.28%),
    radial-gradient(circle at 33% 17%, rgba(255,255,255,.75) 0%, transparent 0.3%),
    radial-gradient(circle at 55% 15%, rgba(255,255,255,.7) 0%, transparent 0.28%),
    radial-gradient(circle at 72% 19%, rgba(255,255,255,.75) 0%, transparent 0.3%),
    radial-gradient(circle at 90% 16%, rgba(255,255,255,.7) 0%, transparent 0.28%);
  animation:starsTwinkle 3s ease-in-out infinite alternate;
}
@keyframes starsTwinkle{0%{opacity:.7}100%{opacity:1}}

/* فراشات الليل - فوانيس */
.v-bf{ display:none; }

/* فوانيس تومض */
.lantern{
  position:absolute;z-index:4;pointer-events:none;
  border-radius:50%;
  animation:lanternPulse 2s ease-in-out infinite;
}
.ln-a{width:7px;height:7px;background:rgba(255,200,50,.9);box-shadow:0 0 10px 3px rgba(255,180,30,.7),0 0 20px 6px rgba(255,160,20,.4);bottom:12%;left:18%;animation-delay:0s;}
.ln-b{width:6px;height:6px;background:rgba(255,160,80,.9);box-shadow:0 0 9px 3px rgba(255,140,60,.7),0 0 18px 5px rgba(255,120,40,.4);bottom:10%;left:32%;animation-delay:.5s;}
.ln-c{width:6px;height:6px;background:rgba(200,220,255,.9);box-shadow:0 0 9px 3px rgba(180,200,255,.7),0 0 18px 5px rgba(160,180,255,.4);bottom:11%;right:28%;animation-delay:.8s;}
.ln-d{width:6px;height:6px;background:rgba(255,200,50,.9);box-shadow:0 0 9px 3px rgba(255,180,30,.7),0 0 18px 5px rgba(255,160,20,.4);bottom:9%;right:15%;animation-delay:1.2s;}
.ln-e{width:5px;height:5px;background:rgba(180,255,180,.9);box-shadow:0 0 8px 3px rgba(150,240,150,.7),0 0 16px 4px rgba(120,220,120,.4);bottom:13%;left:50%;animation-delay:1.6s;}
@keyframes lanternPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* model-viewer */
#dreamLandViewer{
  position:absolute;width:100%;height:100%;background:transparent;
  filter:saturate(1.5) contrast(1.1);
  pointer-events:none;z-index:1;
}

/* طبقة خفيفة جداً */
#dreamLandView::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background:rgba(0,0,0,0.04);
}
/* طبقة زرقاء خفيفة */
#villageBlueLayer{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:rgba(20,40,120,.08);
  mix-blend-mode:multiply;
}

/* شخصية Happy في الواجهة الرئيسية */
#happyCharLanding{
  position:absolute;left:-30px;bottom:55px;
  width:280px;height:480px;
  pointer-events:none;z-index:3;
  animation:happyBob 3s ease-in-out infinite;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.2));
}
@keyframes happyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* شخصية jojo في القرية - عند البحيرة */
#jojoCharVillage{
  position:absolute;left:2%;bottom:15%;
  width:180px;height:340px;
  pointer-events:none;z-index:8;
  animation:jojoBob 3.5s ease-in-out infinite;
  filter:drop-shadow(0 8px 20px rgba(0,80,200,.5));
}
@keyframes jojoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* شخصية Happy في القرية - عند الطاولة */
#happyCharVillage{
  position:absolute;left:40%;bottom:10%;
  width:150px;height:280px;
  pointer-events:none;z-index:8;
  animation:happyBobVillage 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 16px rgba(255,120,0,.4));
}
@keyframes happyBobVillage{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* زر رجوع يمين فوق */
#tourControls{position:fixed;top:14px;right:14px;z-index:9999;display:none;}
#tourControls.show{display:flex;gap:10px;}
.tour-btn{
  border:none;border-radius:50px;padding:10px 20px;
  background:rgba(255,255,255,.95);color:#2d3561;
  font-family:inherit;font-weight:800;font-size:.95rem;
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2);
  display:flex;align-items:center;gap:7px;
  transition:transform .15s;
}
.tour-btn:hover{transform:translateY(-2px);}
.tour-btn:active{transform:translateY(1px);}
#backBtn::before{content:"↩️";}
#exitBtn::before{content:"🚪";}

/* أزرار يسار - بطاقات جميلة */
#sideNav{
  position:fixed;left:16px;top:50%;transform:translateY(-50%);
  z-index:9999;display:none;flex-direction:column;gap:10px;
}
#sideNav.show{display:flex;}
.side-btn{
  border:none;border-radius:18px;padding:12px 16px;
  font-family:inherit;font-weight:800;font-size:.88rem;
  cursor:pointer;text-align:right;direction:rtl;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  transition:transform .15s,box-shadow .2s;
  display:flex;align-items:center;gap:8px;
  min-width:150px;white-space:nowrap;
  position:relative;overflow:hidden;
}
.side-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);pointer-events:none;}
.side-btn:hover{transform:translateX(5px);box-shadow:0 8px 22px rgba(0,0,0,.28);}
.side-btn:active{transform:translateX(2px);}
.sb-tour{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;}
.sb-lib{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;}
.sb-school{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a4a2e;}
.sb-shop{background:linear-gradient(135deg,#fa709a,#fee140);color:#5a2d00;}

/* إخفاء أسهم التنقل */
#moveControls{ display:none !important; }
#moveUp{grid-column:2;grid-row:1;}#moveLeft{grid-column:1;grid-row:2;}
#moveRight{grid-column:3;grid-row:2;}#moveDown{grid-column:2;grid-row:3;}

/* شاشة التحميل */
#dreamLoading{
  position:absolute;inset:0;z-index:7;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 40%,#ffecd2 100%);
  color:#7b2d8b;font-weight:800;
}
#dreamLoading.show{display:flex;}
.loading-icon{font-size:72px;animation:loadSpin 0.8s ease-in-out infinite alternate;}
.loading-text{font-size:1.4rem;color:#7b2d8b;font-weight:800;animation:loadPulse 0.6s ease-in-out infinite alternate;}
.loading-sub{font-size:1rem;color:#c0392b;font-weight:700;animation:loadPulse 0.8s ease-in-out infinite alternate;}
.loading-dots{display:flex;gap:8px;}
.loading-dots span{width:14px;height:14px;border-radius:50%;background:#e91e8c;opacity:.4;animation:dotPulse 0.7s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:.15s;background:#9c27b0;}
.loading-dots span:nth-child(3){animation-delay:.3s;background:#3f51b5;}
@keyframes loadSpin{from{transform:rotate(-15deg) scale(1)}to{transform:rotate(15deg) scale(1.25)}}
@keyframes loadPulse{from{transform:scale(1)}to{transform:scale(1.06)}}

  <script>
    // ===== متغيرات =====
    const panel       = document.getElementById('panel');
    const landingScene= document.getElementById('landingScene');
    const dreamView   = document.getElementById('dreamLandView');
    const dreamViewer = document.getElementById('dreamLandViewer');
    const dreamLoad   = document.getElementById('dreamLoading');
    const dreamFall   = document.getElementById('dreamLandFallback');
    const tourCtrl    = document.getElementById('tourControls');
    const sideNav     = document.getElementById('sideNav');
    const moveCtrl    = document.getElementById('moveControls');
    const bookReader  = document.getElementById('bookReader');
    const readerFrame = document.getElementById('readerFrame');
    const clickSound  = document.getElementById('clickSound');
    const bgSound     = document.getElementById('bgSound');
    const cheerSound  = document.getElementById('cheerSound');
    const happySnd    = document.getElementById('happySound');

    let currentLang = 'ar';
    let currentBookPath = '';
    let currentBookPage = 1;
    const cam = { x:2.2, z:-1.8 };
    let moveLocked = false;

    const dict = {
      ar:{
        'role.student':'طالب','role.teacher':'معلم','role.parent':'ولي أمر',
        'access':'آلية الوصول للكتب الرقمية','usage':'آلية استخدام الكتب الرقمية',
        'survey':'شارك رأيك','school':'اكتب اسم المدرسة',
        'back':'رجوع','exit':'خروج',
        'loading':'جاري تحميل القرية...','adventure':'✨ استعدوا للمغامرة! ✨'
      },
      en:{
        'role.student':'Student','role.teacher':'Teacher','role.parent':'Parent',
        'access':'How to access digital books','usage':'How to use digital books',
        'survey':'Share your feedback','school':'Enter school name',
        'back':'Back','exit':'Exit',
        'loading':'Loading the village...','adventure':'✨ Get ready for the adventure! ✨'
      }
    };

    function beep(){
      if(clickSound){ try{ clickSound.currentTime=0; clickSound.play().catch(()=>{}); }catch(_){} }
    }
    function beepGlobal(){ beep(); }

    function applyLang(lang){
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        el.textContent = dict[lang][el.dataset.i18n] || el.textContent;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        el.placeholder = dict[lang][el.dataset.i18nPlaceholder] || el.placeholder;
      });
      document.getElementById('mainTitle').innerHTML =
        `<span class="num">123</span>Let's Learn English Under The Big Tree`;
    }

    // أزرار الدور
    document.querySelectorAll('.role-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        beep();
        document.querySelectorAll('.role-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      });
    });

    // أزرار الصف
    document.querySelectorAll('.grade-btn').forEach(b=>{
      b.addEventListener('click',()=>{
        beep();
        document.querySelectorAll('.grade-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      });
    });

    // اللغة
    document.getElementById('arBtn').addEventListener('click',()=>{
      beep();
      document.getElementById('arBtn').classList.add('selected');
      document.getElementById('enBtn').classList.remove('selected');
      applyLang('ar');
    });
    document.getElementById('enBtn').addEventListener('click',()=>{
      beep();
      document.getElementById('enBtn').classList.add('selected');
      document.getElementById('arBtn').classList.remove('selected');
      applyLang('en');
    });

    // الأدوات
    document.getElementById('accessBtn').addEventListener('click',()=>{ beep(); window.open('https://qrs.ly/mrh15ao','_blank'); });
    document.getElementById('usageBtn').addEventListener('click',()=>{ beep(); window.open('https://qrs.ly/yph1fu5','_blank'); });
    document.getElementById('surveyBtn').addEventListener('click',()=>{ beep(); window.open('https://form.jotform.com/260694846196068','_blank'); });

    // START
    document.getElementById('startBtn').addEventListener('click',()=>{
      beep();

      // 1. وقف صوت الشخصية Happy
      if(happySnd){ try{ happySnd.pause(); happySnd.currentTime=0; }catch(_){} }

      // 2. شغّل صوت الأطفال (cheering) ووقف صوت الخلفية بعده
      if(cheerSound){
        try{
          cheerSound.currentTime=0;
          cheerSound.play().catch(()=>{});
          // وقف البكغراوند لما ينتهي صوت الأطفال
          cheerSound.onended = ()=>{
            if(bgSound){ try{ bgSound.pause(); bgSound.currentTime=0; }catch(_){} }
          };
        }catch(_){}
      }

      const L = currentLang;
      document.getElementById('loadingText').textContent  = dict[L]['loading'];
      document.getElementById('loadingSub').textContent   = dict[L]['adventure'];
      document.getElementById('backBtn').textContent      = dict[L]['back'];
      document.getElementById('exitBtn').textContent      = dict[L]['exit'];

      panel.classList.add('hidden');
      landingScene.style.display = 'none';
      document.getElementById('arBtn').style.display = 'none';
      document.getElementById('enBtn').style.display = 'none';
      dreamView.classList.add('show');
      dreamLoad.classList.add('show');
      tourCtrl.classList.add('show');
      sideNav.classList.add('show');

      // لا يشتغل صوت الخلفية في القرية
      updateCam();
    });

    function goBack(){
      beep();
      dreamView.classList.remove('show');
      landingScene.style.display = 'block';
      panel.classList.remove('hidden');
      tourCtrl.classList.remove('show');
      sideNav.classList.remove('show');
      moveCtrl.classList.remove('show');
      bookReader.classList.remove('show');
      document.getElementById('arBtn').style.display = '';
      document.getElementById('enBtn').style.display = '';
      if(bgSound){ try{ bgSound.pause(); }catch(_){} }
    }

    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('exitBtn').addEventListener('click',()=>{ goBack(); try{ window.close(); }catch(_){} });

    // أحداث القرية
    if(dreamViewer){
      dreamViewer.addEventListener('load',()=>{
        dreamFall.style.display='none';
        dreamLoad.classList.remove('show');
      });
      dreamViewer.addEventListener('error',()=>{
        dreamFall.style.display='block';
        dreamLoad.classList.remove('show');
      });
    }

    function updateCam(){
      if(!dreamViewer) return;
      dreamViewer.cameraTarget = `${cam.x.toFixed(2)}m 2.8m ${cam.z.toFixed(2)}m`;
    }
    function step(dx,dz){
      if(moveLocked) return;
      moveLocked=true;
      cam.x = Math.max(-3.5, Math.min(3.5, cam.x+dx));
      cam.z = Math.max(-3.5, Math.min(3.5, cam.z+dz));
      updateCam(); beep();
      setTimeout(()=>{ moveLocked=false; },120);
    }
    document.getElementById('moveUp').addEventListener('click',()=>step(0,-0.22));
    document.getElementById('moveDown').addEventListener('click',()=>step(0,0.22));
    document.getElementById('moveLeft').addEventListener('click',()=>step(-0.22,0));
    document.getElementById('moveRight').addEventListener('click',()=>step(0.22,0));

    // قارئ الكتب
    document.getElementById('prevPageBtn').addEventListener('click',()=>{
      if(!currentBookPath) return;
      currentBookPage=Math.max(1,currentBookPage-1);
      readerFrame.src=`${currentBookPath}#page=${currentBookPage}`;
    });
    document.getElementById('nextPageBtn').addEventListener('click',()=>{
      if(!currentBookPath) return;
      currentBookPage++;
      readerFrame.src=`${currentBookPath}#page=${currentBookPage}`;
    });
    document.getElementById('closeReaderBtn').addEventListener('click',()=>{
      bookReader.classList.remove('show');
      readerFrame.src='about:blank';
      currentBookPath=''; currentBookPage=1;
    });

    // تهيئة
    applyLang('ar');

    // صوت الشخصية Happy عند تحميل الصفحة
    const happySound = document.getElementById('happySound');
    document.addEventListener('click', function startHappySound(){
      if(happySound){
        try{ happySound.volume=0.3; happySound.play().catch(()=>{}); }catch(_){}
      }
      document.removeEventListener('click', startHappySound);
    }, {once:true});
  </script>
