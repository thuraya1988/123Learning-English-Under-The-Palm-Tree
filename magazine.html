<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Under the Palm Tree — Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1613;
    --panel:#33191D;
    --line:#4A2A30;
    --beige:#E7D9BE;
    --beige-dim:#A8927A;
    --accent:#7C2334;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Karla', sans-serif;
    background:#100D0B;
    display:flex;
    justify-content:center;
    color:var(--beige);
  }
  #shell{
    width:100%;
    max-width:480px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
    overflow:hidden;
  }
  @media (min-width:520px){
    body{ align-items:center; }
    #shell{
      height:calc(100vh - 48px);
      border-radius:10px;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
    }
  }
  button{ font-family:'Karla', sans-serif; }

  /* ================= HOME VIEW ================= */
  #homeView{ flex:1; display:flex; flex-direction:column; min-height:0; }

  #homeView header{
    flex-shrink:0;
    display:flex; align-items:center; gap:12px;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .ghost-btn{
    background:none; border:1px solid var(--line);
    color:var(--beige);
    width:32px; height:32px;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
  }
  .home-logo{ width:28px; height:28px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .home-title{ font-family:'Zilla Slab', serif; font-size:15px; font-weight:700; letter-spacing:.5px; }
  .header-spacer{ flex:1; }

  #homeScroll{ flex:1; overflow-y:auto; padding:18px; }

  .ph-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }
  .ph-block::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(135deg, transparent 46%, var(--line) 47%, var(--line) 53%, transparent 54%);
    opacity:.6;
  }
  .ph-block.has-photo::after{ display:none; }

  .tag-pill{
    display:inline-block;
    background:var(--accent);
    border:1px solid var(--accent);
    color:var(--beige);
    font-size:9.5px;
    font-weight:700;
    letter-spacing:1px;
    padding:3px 9px;
    border-radius:4px;
    margin-bottom:9px;
  }

  .featured-card{ margin-bottom:26px; }
  .featured-card .ph-block{ height:140px; margin-bottom:12px; }
  .featured-card h2{ font-family:'Zilla Slab', serif; font-size:19px; font-weight:700; margin-bottom:6px; line-height:1.3; }
  .featured-card p{ font-size:12.5px; color:var(--beige-dim); line-height:1.5; margin-bottom:12px; }
  .read-btn{
    background:var(--accent);
    border:1px solid var(--accent);
    color:var(--beige);
    font-weight:700;
    font-size:12.5px;
    padding:9px 18px;
    border-radius:6px;
    cursor:pointer;
  }
  .dots{ display:flex; gap:6px; margin-top:14px; }
  .dot{
    width:7px; height:7px; border-radius:50%;
    border:1px solid var(--beige-dim);
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .dot.active{ background:var(--beige); border-color:var(--beige); }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:22px 0 12px;
  }
  .section-head h3{ font-family:'Zilla Slab', serif; font-size:15px; font-weight:700; }
  .view-all{ font-size:11.5px; color:var(--beige-dim); font-weight:700; cursor:pointer; background:none; border:none; text-decoration:underline; }

  .latest-scroll{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
  .latest-card{ width:120px; flex-shrink:0; cursor:pointer; }
  .latest-card .ph-block{ height:76px; margin-bottom:7px; }
  .lc-title{ font-size:12px; font-weight:700; line-height:1.35; }
  .lc-date{ font-size:10px; color:var(--beige-dim); margin-top:3px; }

  .quick-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quick-item{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 10px;
    text-align:center;
    cursor:pointer;
    background:none;
    color:var(--beige);
  }
  .quick-item .qi-label{ font-size:11.5px; font-weight:700; line-height:1.3; }

  .list-row{
    display:flex; gap:12px; align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .list-row:last-child{ border-bottom:none; }
  .list-row .ph-block{ width:52px; height:52px; flex-shrink:0; }
  .lr-title{ font-size:13.5px; font-weight:700; line-height:1.35; }
  .lr-meta{ font-size:10.5px; color:var(--beige-dim); margin-top:3px; }

  #bottomNav{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  #bottomNav button{
    flex:1;
    background:none; border:none;
    padding:12px 4px;
    font-size:11px;
    color:var(--beige-dim);
    cursor:pointer;
  }
  #bottomNav button.current{ color:var(--beige); font-weight:700; border-top:2px solid var(--accent); margin-top:-1px; }

  /* ================= READER VIEW ================= */
  #readerView{ flex:1; display:none; flex-direction:column; min-height:0; }

  #pageContainer{
    flex:1;
    overflow-y:auto;
    padding:30px 26px 26px;
    transition:transform .2s ease, opacity .2s ease;
  }
  .slide-out-left{ transform:translateX(-22px); opacity:0; }
  .slide-out-right{ transform:translateX(22px); opacity:0; }
  .slide-in-right{ transform:translateX(22px); opacity:0; transition:none; }
  .slide-in-left{ transform:translateX(-22px); opacity:0; transition:none; }

  .art-tag{ font-size:10.5px; letter-spacing:2px; color:var(--beige-dim); margin-bottom:14px; display:block; }
  .art-title{ font-family:'Zilla Slab', serif; font-size:24px; font-weight:700; line-height:1.25; margin-bottom:8px; }
  .art-byline{ font-size:11.5px; color:var(--beige-dim); margin-bottom:22px; }
  .art-rule{ height:1px; background:var(--line); margin-bottom:20px; }
  .art-body p{ font-size:15px; line-height:1.85; margin-bottom:16px; color:var(--beige); }

  .art-actions{ display:flex; gap:22px; margin-top:8px; padding-top:18px; border-top:1px solid var(--line); }
  .art-actions button{
    background:none; border:none;
    color:var(--beige-dim);
    font-size:12.5px; font-weight:700; letter-spacing:.3px;
    cursor:pointer; padding:4px 0;
  }
  .art-actions button.active{ color:var(--beige); text-decoration:underline; }

  #navBar{
    flex-shrink:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    display:flex; align-items:center;
    padding:12px 18px;
    gap:14px;
  }
  #homeBtn{
    background:none; border:1px solid var(--line);
    color:var(--beige);
    font-size:12px; font-weight:700;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .nav-spacer{ flex:1; }
  #navBar .flip-group{ display:flex; align-items:center; gap:14px; }
  #prevBtn, #nextBtn{
    background:none; border:none;
    color:var(--beige);
    font-size:20px;
    width:30px; height:30px;
    cursor:pointer;
  }
  #prevBtn:disabled, #nextBtn:disabled{ color:var(--line); cursor:default; }
  #pageCounter{ font-size:11.5px; color:var(--beige-dim); white-space:nowrap; }

  button:focus{ outline:1px solid var(--beige-dim); outline-offset:2px; }

  /* ================= COMMENTS MODAL ================= */
  #commentsModal{
    position:absolute; inset:0;
    background:rgba(15,5,5,.7);
    display:none;
    align-items:flex-end;
    z-index:30;
  }
  #commentsModal .sheet{
    background:var(--panel);
    width:100%;
    max-height:78%;
    border-radius:14px 14px 0 0;
    padding:20px;
    display:flex;
    flex-direction:column;
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-head h4{ font-family:'Zilla Slab', serif; font-size:16px; }
  #closeComments{ background:none; border:none; color:var(--beige-dim); font-size:15px; cursor:pointer; }
  #commentsList{ overflow-y:auto; flex:1; margin-bottom:12px; }
  .comment{ margin-bottom:12px; font-size:13px; line-height:1.5; }
  .c-name{ font-weight:700; color:var(--beige); display:block; font-size:12px; }
  .c-text{ color:var(--beige-dim); }
  .no-comments{ font-size:12.5px; color:var(--beige-dim); }
  #commentName, #commentInput{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--beige);
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    outline:none;
    margin-bottom:8px;
  }
  .comment-row{ display:flex; gap:8px; }
  .comment-row input{ margin-bottom:0; flex:1; }
  .comment-row button{
    background:var(--beige);
    color:var(--bg);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ================= TOAST ================= */
  #toast{
    position:absolute;
    left:50%; bottom:70px;
    transform:translateX(-50%) translateY(10px);
    background:var(--beige);
    color:var(--bg);
    padding:9px 16px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:40;
    white-space:nowrap;
    max-width:88%;
    text-align:center;
    white-space:normal;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= SPLASH / COVER ================= */
  /* Approved cover — do not swap this image or restyle this screen. */
  #splashView{
    position:absolute; inset:0; z-index:50;
    overflow:hidden;
    transition:opacity .4s ease, visibility .4s ease;
  }
  #splashView.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #splashImg{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .splash-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(16,13,11,0) 38%, rgba(16,13,11,.94) 90%);
  }
  .splash-content{
    position:absolute; left:0; right:0; bottom:32px;
    display:flex; justify-content:center; padding:0 24px;
  }
  #enterMagazineBtn{
    width:100%; max-width:320px;
    background:var(--accent);
    color:var(--beige);
    border:none;
    border-radius:10px;
    padding:15px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    font-family:'Karla', sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
</style>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
</head>
<body>
<div id="shell">

  <!-- ===== SPLASH / COVER (approved cover image — fixed, do not change) ===== -->
  <div id="splashView">
    <img id="splashImg" src="public/gallery/magazine/cover-official.png" alt="Under the Palm Tree" />
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <button id="enterMagazineBtn">Explore Magazine · اكتشفي المجلة</button>
    </div>
  </div>

  <!-- ===== HOME ===== -->
  <div id="homeView">
    <header>
      <button class="ghost-btn" id="menuBtn">☰</button>
      <img src="public/gallery/magazine/logo-badge-96.png" alt="Under the Palm Tree" class="home-logo" />
      <div class="home-title">UNDER THE PALM TREE</div>
      <span class="header-spacer"></span>
    </header>

    <div id="homeScroll">
      <div id="homeLoading" style="padding:50px 0;text-align:center;color:var(--beige-dim);font-size:12.5px;">Loading articles…</div>
      <div class="featured-card">
        <span class="tag-pill" id="featTag">FEATURED</span>
        <div class="ph-block" id="featImage"></div>
        <h2 id="featTitle"></h2>
        <p id="featExcerpt"></p>
        <button class="read-btn" id="featReadBtn">Read Article</button>
        <div class="dots" id="featDots"></div>
      </div>

      <div class="section-head">
        <h3>Latest Articles</h3>
        <button class="view-all" id="viewAllBtn">View All</button>
      </div>
      <div class="latest-scroll" id="latestScroll"></div>

      <div class="section-head"><h3>What would you like to do?</h3></div>
      <div class="quick-grid">
        <button class="quick-item" id="qChat"><div class="qi-label">Live Chat Bot</div></button>
        <button class="quick-item" id="qPhoto"><div class="qi-label">Take a Picture of Your Mud House</div></button>
        <button class="quick-item" id="qCafes"><div class="qi-label">Retro Restaurants &amp; Cafes</div></button>
        <button class="quick-item" id="qWriters"><div class="qi-label">Writers of The Palm</div></button>
      </div>

      <div class="section-head" id="allAnchor"><h3>All Articles</h3></div>
      <div id="allList"></div>
    </div>

    <nav id="bottomNav">
      <button id="navHome" class="current">Home</button>
      <button id="navArticles">Articles</button>
      <button id="navCommunity">Community</button>
      <button id="navProfile">Profile</button>
    </nav>
  </div>

  <!-- ===== READER ===== -->
  <div id="readerView">
    <div id="pageContainer"></div>
    <div id="navBar">
      <button id="homeBtn">Home</button>
      <span class="nav-spacer"></span>
      <div class="flip-group">
        <button id="prevBtn" aria-label="Previous article">‹</button>
        <span id="pageCounter"></span>
        <button id="nextBtn" aria-label="Next article">›</button>
      </div>
    </div>
  </div>

  <div id="commentsModal">
    <div class="sheet">
      <div class="sheet-head">
        <h4 id="commentsHeading">Comments</h4>
        <button id="closeComments">Close ✕</button>
      </div>
      <div id="commentsList"></div>
      <input id="commentName" placeholder="Your name (optional)" maxlength="25" />
      <div class="comment-row">
        <input id="commentInput" placeholder="Write a comment..." maxlength="400" />
        <button id="commentSendBtn">Send</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
  const STARTER_ARTICLES = [
    {
      id: "life-1970s", tag: "HERITAGE", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/life-1970s.jpg", order: 1,
      title: "Life in the 1970s Oman", date: "Jul 2, 2026", readTime: 5, featured: true,
      excerpt: "The 1970s in Oman were a time of simplicity, strong communities, and deep connection with nature.",
      body: [
        "The day began early in Al-Qarwashiya. Before sunrise, the call to prayer echoed across the village, and families rose together. Children walked to the falaj to fetch water while the morning air was still cool.",
        "Life moved at the pace of the sun and the seasons, not the clock. Neighbors shared dates, milk, and news. In the evenings, families gathered outside their homes, and elders told stories passed down for generations.",
        "There were few possessions, but there was rarely loneliness. A shared meal, a shared roof, a shared palm grove - these were the foundations of daily life. Even simple days felt full.",
        "Looking back now, these memories are more than nostalgia. They are a reminder of how much strength a small community can hold, and why that spirit is still worth carrying forward today."
      ]
    },
    {
      id: "palm-tree", tag: "HERITAGE", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/palm-tree.jpg", order: 2,
      title: "The Palm Tree: More Than a Tree", date: "Jun 28, 2026", readTime: 4, featured: true,
      excerpt: "In Oman, the palm tree is a source of food, shelter, and meaning - and it still shapes village life.",
      body: [
        "In Al-Qarwashiya, almost nothing from the palm tree went to waste. Its fronds became roofs and baskets. Its trunk supported ceilings. Its dates fed families through the year and were traded for other goods.",
        "But the palm tree meant more than its materials. It became a symbol of patience, since a young palm can take years before it bears fruit. It became a symbol of generosity, offering shade to anyone who needed rest.",
        "Villagers often say a palm tree grows old beside its owner, like a quiet companion who asks for very little and gives so much in return."
      ]
    },
    {
      id: "teaching-shade", tag: "EDUCATION", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/teaching-shade.jpg", order: 3,
      title: "Teaching Under the Shade", date: "Jun 24, 2026", readTime: 4, featured: false,
      excerpt: "Long before real classrooms existed, some of the most important lessons happened under one tree.",
      body: [
        "Before proper school buildings arrived, children in Al-Qarwashiya gathered under the shade of a large tree. There was no blackboard - just a wooden slate, a piece of chalk, and a patient teacher.",
        "Students sat together in a circle, repeating letters out loud and practicing their handwriting in the sand before paper became common. Lessons often mixed reading, memorization, and simple arithmetic.",
        "The lack of walls never stopped anyone's determination to learn. Some of the village's most respected teachers and leaders today began their education in exactly this way."
      ]
    },
    {
      id: "memories-shape-us", tag: "REFLECTIONS", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/memories-shape-us.jpg", order: 4,
      title: "Memories That Shape Us", date: "Jun 18, 2026", readTime: 3, featured: false,
      excerpt: "A single smell or sound can carry us back to childhood in an instant.",
      body: [
        "The smell of fresh bread. The sound of rain on dry earth. A specific song heard once, long ago. These small moments can bring back an entire childhood in a matter of seconds.",
        "It is often the smallest rituals - a grandmother's evening tea, a walk to the well with a cousin - that quietly build the foundation of who we become as adults.",
        "Writing these memories down is one way to keep them alive, especially for the next generation, who may never see the village exactly as it once was."
      ]
    },
    {
      id: "traditional-homes", tag: "HERITAGE", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/traditional-homes.jpg", order: 5,
      title: "Traditional Omani Homes", date: "Jun 12, 2026", readTime: 4, featured: true,
      excerpt: "Built from mud brick and palm wood, traditional homes were designed to survive Oman's heat.",
      body: [
        "Homes in Al-Qarwashiya were built using materials found right in the surrounding land: mud brick for the walls and palm wood for the beams and ceilings.",
        "Thick walls kept the inside cool during the hottest months, while a central courtyard allowed air to move freely and gave the family a private outdoor space to gather.",
        "Every home told the story of the people who built it - often added to slowly, one room at a time, as families grew larger across the years."
      ]
    },
    {
      id: "old-schools", tag: "EDUCATION", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/old-schools.jpg", order: 6,
      title: "Old Schools, Big Dreams", date: "Jun 6, 2026", readTime: 4, featured: false,
      excerpt: "Resources were few, and the walk to school was often long, but ambition was never in short supply.",
      body: [
        "Many children in the village walked long distances just to reach a school building, sometimes no more than a single simple room.",
        "Books were shared. Pencils were borrowed. Yet none of this reduced the size of anyone's dreams. Students studied by any light available, determined to learn.",
        "Teachers often became lifelong mentors, remembered decades later by students who went on to become doctors, engineers, and teachers themselves."
      ]
    },
    {
      id: "songs-of-land", tag: "CULTURE", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/songs-of-land.jpg", order: 7,
      title: "The Songs of Our Land", date: "May 30, 2026", readTime: 3, featured: false,
      excerpt: "Work in the village had its own rhythm - and its own soundtrack, carried by voice alone.",
      body: [
        "In Al-Qarwashiya, work often came with music. There were songs sung while digging the falaj channels, and songs sung during the date harvest under the hot sun.",
        "These songs carried more than rhythm. They held practical wisdom, gentle humor, and shared history, passed down by voice alone, long before anyone wrote them on paper.",
        "Even today, one familiar tune can instantly carry a person back to a warm evening in the village square, surrounded by family and friends."
      ]
    },
    {
      id: "thuraya-book-of-thoughts", tag: "WRITER'S NOTES", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/thuraya-book-of-thoughts.jpg", order: 8,
      title: "Thuraya's Book of Thoughts", date: "May 24, 2026", readTime: 3, featured: false,
      excerpt: "Every story starts somewhere quieter than the page - in a notebook, on a walk, in a moment that refuses to be forgotten.",
      body: [
        "Long before Al-Qarwashiya had a name on any page, it lived in a notebook - pages filled in cafes and quiet corners, in a language stitched together from memory and imagination.",
        "\"Kitab Afkar Thuraya,\" the cover reads: Thuraya's Book of Thoughts. Not every page became a chapter. Some stayed just as they were - a sketch of a street, a line overheard, a question with no answer yet.",
        "Writing a village back into existence means returning to it again and again on paper, until the palm trees, the falaj, and the voices feel close enough to touch."
      ]
    },
    {
      id: "songs-voices-of-heritage", tag: "CULTURE", image: "https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tree/main/public/gallery/magazine/songs-voices-of-heritage.jpg", order: 9,
      title: "Songs: Voices of Our Heritage", date: "May 18, 2026", readTime: 4, featured: false,
      excerpt: "Songs are stories with melodies - they carry heritage, memory, and feeling across time.",
      body: [
        "A song is a story that learned to travel. Long before anyone wrote them down, traditional songs passed from generation to generation - sung in villages, at gatherings, during work, and in celebration.",
        "They came in many forms: work songs to keep hands and feet in rhythm, lullabies to carry a child to sleep, celebration songs for weddings and holidays, and story songs that taught history without a single book.",
        "Their purpose was never just entertainment. Songs brought people together, gave shape to feelings words alone couldn't hold, and made ordinary moments impossible to forget. In every note, a little of the past still lives - our roots, our rhythm, our voice, our legacy."
      ]
    },
    {

      body: [

        "Every chapter, every game, and every photograph on this platform passed through her hands first - reviewed, corrected, and cared for, the way you would care for something that carries your own village's name."
      ]
    }
  ];

  const DB_URL = "https://under-palm-tree-default-rtdb.europe-west1.firebasedatabase.app";
  let ARTICLES = [];
  let FEATURED = [];
  let featuredIndex = 0;
  let currentIndex = 0;
  let reader = null;
  let likedSet = new Set();
  let savedSet = new Set();
  const storageOk = (typeof window.storage !== "undefined" && window.storage !== null);

  const $ = sel => document.querySelector(sel);

  async function loadArticles(){
    try{
      const res = await fetch(DB_URL + "/articles.json");
      const data = await res.json();
      if(!data){
        // Nothing in Firebase yet — seed it once with the starter set
        const seed = {};
        STARTER_ARTICLES.forEach(a => { seed[a.id] = a; });
        await fetch(DB_URL + "/articles.json", { method: "PUT", body: JSON.stringify(seed) });
        ARTICLES = STARTER_ARTICLES.slice();
      }else{
        ARTICLES = Object.keys(data).map(key => Object.assign({ id: key }, data[key]));
      }
      ARTICLES.sort((a, b) => (a.order || 0) - (b.order || 0));
    }catch(e){
      console.error("could not load articles from Firebase, using starter set", e);
      ARTICLES = STARTER_ARTICLES.slice();
    }
    FEATURED = ARTICLES.filter(a => a.featured);
    if(FEATURED.length === 0 && ARTICLES.length){ FEATURED = [ARTICLES[0]]; }
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  const BLOCKED_WORDS = ["كلبة", "حقير", "stupid idiot", "shut up"];
  function containsBlocked(t){
    const l = t.toLowerCase();
    return BLOCKED_WORDS.some(w => l.includes(w));
  }

  function uid(){ return "r_" + Math.random().toString(36).slice(2, 10); }

  let toastTimer = null;
  function showToast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }

  function phBlockHTML(a){
    if(a && a.image){
      return '<div class="ph-block has-photo" style="background-image:url(\'' + a.image + '\')"></div>';
    }
    return '<div class="ph-block"></div>';
  }

  function cardHTML(a, index){
    return (
      '<div class="latest-card" data-open="' + index + '">' +
      phBlockHTML(a) +
      '<div class="lc-title">' + a.title + '</div>' +
      '<div class="lc-date">' + a.date + '</div>' +
      '</div>'
    );
  }

  function bindOpenHandlers(container){
    container.querySelectorAll("[data-open]").forEach(el => {
      el.addEventListener("click", () => openReader(parseInt(el.dataset.open, 10)));
    });
  }

  /* ---------- HOME rendering ---------- */
  function renderFeatured(){
    const a = FEATURED[featuredIndex];
    const realIndex = ARTICLES.indexOf(a);
    $("#featTag").textContent = a.tag;
    $("#featTitle").textContent = a.title;
    $("#featExcerpt").textContent = a.excerpt;
    const featImg = $("#featImage");
    if(a.image){
      featImg.style.backgroundImage = 'url("' + a.image + '")';
      featImg.classList.add("has-photo");
    }else{
      featImg.style.backgroundImage = "";
      featImg.classList.remove("has-photo");
    }
    $("#featDots").innerHTML = FEATURED.map((_, i) =>
      '<button class="dot ' + (i === featuredIndex ? "active" : "") + '" data-i="' + i + '" aria-label="Slide ' + (i + 1) + '"></button>'
    ).join("");
    $("#featDots").querySelectorAll(".dot").forEach(d => {
      d.addEventListener("click", () => { featuredIndex = parseInt(d.dataset.i, 10); renderFeatured(); });
    });
    $("#featReadBtn").onclick = () => openReader(realIndex);
  }

  function renderLatest(){
    const list = ARTICLES.slice(0, 4);
    $("#latestScroll").innerHTML = list.map((a) => cardHTML(a, ARTICLES.indexOf(a))).join("");
    bindOpenHandlers($("#latestScroll"));
  }

  function renderAllList(){
    $("#allList").innerHTML = ARTICLES.map((a, i) =>
      '<div class="list-row" data-open="' + i + '">' +
      phBlockHTML(a) +
      '<div class="lr-info">' +
      '<div class="lr-title">' + a.title + '</div>' +
      '<div class="lr-meta">' + a.tag + ' · ' + a.date + ' · ' + a.readTime + ' min read</div>' +
      '</div></div>'
    ).join("");
    bindOpenHandlers($("#allList"));
  }

  function bindHomeChrome(){
    $("#menuBtn").addEventListener("click", () => showToast("Menu coming soon"));
    $("#navHome").addEventListener("click", () => { $("#homeScroll").scrollTo({ top: 0, behavior: "smooth" }); });
    $("#navArticles").addEventListener("click", () => { $("#allAnchor").scrollIntoView({ behavior: "smooth" }); });
    $("#viewAllBtn").addEventListener("click", () => { $("#allAnchor").scrollIntoView({ behavior: "smooth" }); });
    $("#navCommunity").addEventListener("click", () => { location.href = "community-chat.html"; });
    $("#navProfile").addEventListener("click", () => showToast("Profile page coming soon"));
    $("#qChat").addEventListener("click", () => { location.href = "community-chat.html"; });
    $("#qPhoto").addEventListener("click", () => showToast("Coming soon"));
    $("#qCafes").addEventListener("click", () => showToast("Coming soon"));
    $("#qWriters").addEventListener("click", () => showToast("Coming soon"));
  }

  /* ---------- READER rendering ---------- */
  function articleHTML(a){
    return (
      '<span class="art-tag">' + a.tag + '</span>' +
      '<h1 class="art-title">' + a.title + '</h1>' +
      '<div class="art-byline">By Thuraya Al Naabia · ' + a.date + ' · ' + a.readTime + ' min read</div>' +
      '<div class="art-rule"></div>' +
      '<div class="art-body">' + a.body.map(p => "<p>" + p + "</p>").join("") + "</div>" +
      '<div class="art-actions">' +
      '<button id="likeBtn">Like</button>' +
      '<button id="saveBtn">Save</button>' +
      '<button id="commentsBtn">Comments</button>' +
      '<button id="shareBtn">Share</button>' +
      "</div>"
    );
  }

  function renderPage(index){
    const a = ARTICLES[index];
    const container = $("#pageContainer");
    container.scrollTop = 0;
    container.innerHTML = articleHTML(a);

    $("#likeBtn").classList.toggle("active", likedSet.has(a.id));
    $("#saveBtn").classList.toggle("active", savedSet.has(a.id));
    $("#likeBtn").addEventListener("click", () => toggleLike(a.id));
    $("#saveBtn").addEventListener("click", () => toggleSave(a.id));
    $("#commentsBtn").addEventListener("click", () => openComments(a.id));
    $("#shareBtn").addEventListener("click", () => shareArticle(a));

    $("#pageCounter").textContent = (index + 1) + " / " + ARTICLES.length;
    $("#prevBtn").disabled = index === 0;
    $("#nextBtn").disabled = index === ARTICLES.length - 1;
  }

  function openReader(index){
    currentIndex = index;
    $("#homeView").style.display = "none";
    $("#readerView").style.display = "flex";
    renderPage(currentIndex);
  }
  function goHome(){
    $("#readerView").style.display = "none";
    $("#homeView").style.display = "flex";
  }

  function goToPage(newIndex, direction){
    if(newIndex < 0 || newIndex >= ARTICLES.length || newIndex === currentIndex) return;
    const container = $("#pageContainer");
    const outClass = direction === "next" ? "slide-out-left" : "slide-out-right";
    container.classList.add(outClass);
    setTimeout(() => {
      currentIndex = newIndex;
      renderPage(currentIndex);
      const inClass = direction === "next" ? "slide-in-right" : "slide-in-left";
      container.classList.remove(outClass);
      container.classList.add(inClass);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => container.classList.remove(inClass));
      });
    }, 190);
  }
  function goNext(){ goToPage(currentIndex + 1, "next"); }
  function goPrev(){ goToPage(currentIndex - 1, "prev"); }

  function toggleLike(id){
    if(likedSet.has(id)) likedSet.delete(id); else likedSet.add(id);
    persistPersonal();
    $("#likeBtn").classList.toggle("active", likedSet.has(id));
  }
  function toggleSave(id){
    if(savedSet.has(id)) savedSet.delete(id); else savedSet.add(id);
    persistPersonal();
    $("#saveBtn").classList.toggle("active", savedSet.has(id));
  }
  async function persistPersonal(){
    if(!storageOk) return;
    try{
      await window.storage.set("reader-liked", JSON.stringify([...likedSet]), false);
      await window.storage.set("reader-saved", JSON.stringify([...savedSet]), false);
    }catch(e){ console.error("could not save reader state", e); }
  }

  async function shareArticle(a){
    if(navigator.share){
      try{ await navigator.share({ title: a.title, text: a.excerpt }); }catch(e){ /* cancelled */ }
    }else{
      try{
        await navigator.clipboard.writeText(a.title);
        showToast("Copied to clipboard");
      }catch(e){
        showToast("Could not share on this device");
      }
    }
  }

  let openArticleId = null;
  let commentsES = null;

  async function openComments(articleId){
    openArticleId = articleId;
    $("#commentsModal").style.display = "flex";
    fetchAndRenderComments(articleId);

    if(commentsES) commentsES.close();
    try{
      commentsES = new EventSource(DB_URL + "/magazine-comments/" + articleId + ".json");
      commentsES.addEventListener("put", () => fetchAndRenderComments(articleId));
      commentsES.addEventListener("patch", () => fetchAndRenderComments(articleId));
    }catch(e){ console.error("comments live-update not available", e); }
  }

  function closeCommentsModal(){
    $("#commentsModal").style.display = "none";
    if(commentsES){ commentsES.close(); commentsES = null; }
  }

  async function fetchAndRenderComments(articleId){
    try{
      const res = await fetch(DB_URL + "/magazine-comments/" + articleId + ".json");
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const list = data ? Object.keys(data).map(k => data[k]) : [];
      list.sort((a, b) => a.ts - b.ts);
      renderComments(list);
    }catch(e){
      console.error("could not load comments", e);
      $("#commentsList").innerHTML = '<div class="no-comments">Could not reach the database. Check your connection.</div>';
    }
  }

  function renderComments(list){
    $("#commentsHeading").textContent = "Comments (" + list.length + ")";
    if(list.length === 0){
      $("#commentsList").innerHTML = '<div class="no-comments">Be the first to share a thought.</div>';
      return;
    }
    $("#commentsList").innerHTML = list.map(c =>
      '<div class="comment"><span class="c-name">' + escapeHtml(c.name) + '</span><span class="c-text">' + escapeHtml(c.text) + '</span></div>'
    ).join("");
  }

  async function postComment(){
    if(!openArticleId) return;
    const textInput = $("#commentInput");
    const text = textInput.value.trim();
    if(!text) return;
    if(containsBlocked(text)){
      showToast("Please keep comments respectful");
      return;
    }
    const name = ($("#commentName").value.trim() || "A reader").slice(0, 25);
    if(reader){
      reader.name = name;
      if(storageOk){
        try{ await window.storage.set("reader-profile", JSON.stringify(reader), false); }catch(e){}
      }
    }
    textInput.value = "";

    const payload = { name: name, text: text.slice(0, 400), ts: Date.now() };
    try{
      const res = await fetch(DB_URL + "/magazine-comments/" + openArticleId + ".json", {
        method: "POST",
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error("write failed: " + res.status);
      // EventSource listener re-fetches and re-renders automatically
    }catch(e){
      console.error("post comment failed", e);
      showToast("Could not post comment, try again");

    }
  }

  async function init(){
    if(storageOk){
      try{
        const p = await window.storage.get("reader-profile", false);
        reader = p && p.value ? JSON.parse(p.value) : null;
      }catch(e){ reader = null; }
      if(!reader){
        reader = { id: uid(), name: "" };
        try{ await window.storage.set("reader-profile", JSON.stringify(reader), false); }catch(e){}
      }
      try{
        const l = await window.storage.get("reader-liked", false);
        likedSet = new Set(l && l.value ? JSON.parse(l.value) : []);
      }catch(e){ likedSet = new Set(); }
      try{
        const s = await window.storage.get("reader-saved", false);
        savedSet = new Set(s && s.value ? JSON.parse(s.value) : []);
      }catch(e){ savedSet = new Set(); }
    }else{
      reader = { id: uid(), name: "" };
      console.error("window.storage is not available — likes, saves, and comments need this file open inside a Claude artifact preview.");
    }

    await loadArticles();
    $("#homeLoading").style.display = "none";

    renderFeatured();
    renderLatest();
    renderAllList();
    bindHomeChrome();

    $("#enterMagazineBtn").addEventListener("click", () => { $("#splashView").classList.add("hide"); });
    $("#homeBtn").addEventListener("click", goHome);
    $("#prevBtn").addEventListener("click", goPrev);
    $("#nextBtn").addEventListener("click", goNext);
    $("#closeComments").addEventListener("click", closeCommentsModal);
    $("#commentSendBtn").addEventListener("click", postComment);
    $("#commentInput").addEventListener("keydown", e => { if(e.key === "Enter") postComment(); });

    let touchStartX = null;
    $("#pageContainer").addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; });
    $("#pageContainer").addEventListener("touchend", e => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 55){ if(dx < 0) goNext(); else goPrev(); }
      touchStartX = null;
    });
  }

  init();
</script>
</body>
</html>
