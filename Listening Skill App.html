<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Under the Palm Tree — Listening Skill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap');

:root {
  color-scheme: light only;
  --bg-1: #f5ead0;       /* warm beige top */
  --bg-2: #e8d8a8;       /* deeper sand bottom */
  --bg-3: #d4c280;       /* mustard accent */
  --green-soft: #a8b86a; /* light olive-green */
  --green-leaf: #7a8f4e;
  --green-deep: #4a5a2e;
  --brown-dark: #3a1f0e; /* deep brown for text */
  --brown-mid: #6b3f2a;  /* medium brown */
  --brown-soft: #8a5d3f; /* warm caramel */
  --gold: #b08755;
  --cream-card: #faf3e0; /* card background */
  --cream-card-2: #f0e3bf;
  --shadow-warm: 0 8px 24px rgba(58,31,14,0.18);
  --shadow-deep: 0 16px 40px rgba(58,31,14,0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%) !important;
  color: var(--brown-dark);
  font-family: 'EB Garamond', Georgia, serif;
  min-height: 100vh;
  font-size: 17px;
  line-height: 1.6;
}

/* Background palm shadow texture */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(ellipse at top right, rgba(122,143,78,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at bottom left, rgba(107,63,42,0.08) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ─── Top Navigation Bar ─── */
.topbar {
  position: sticky; top: 0;
  background: linear-gradient(180deg, var(--brown-dark) 0%, #2a1408 100%);
  color: var(--cream-card);
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  z-index: 100;
  border-bottom: 3px solid var(--gold);
}
.topbar .logo {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Aref Ruqaa', serif;
  font-size: 18px;
  letter-spacing: 1px;
}
.topbar .logo .palm-icon {
  font-size: 22px;
}
.topbar .nav-buttons {
  display: flex; gap: 10px;
}
.nav-btn {
  background: rgba(245,234,208,0.12);
  border: 1px solid rgba(245,234,208,0.25);
  color: var(--cream-card);
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s;
  font-size: 16px;
}
.nav-btn:hover { background: var(--gold); transform: translateY(-2px); }

/* ─── Page Container ─── */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 20px 60px;
  position: relative;
  z-index: 1;
}

/* ─── Page Header ─── */
.page-header {
  text-align: center;
  padding: 30px 20px 40px;
}
.skill-tag {
  display: inline-block;
  background: var(--brown-dark);
  color: var(--cream-card);
  padding: 6px 18px;
  border-radius: 20px;
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.page-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: clamp(36px, 6vw, 56px);
  color: var(--brown-dark);
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  text-shadow: 1px 1px 0 rgba(176,135,85,0.3);
}
.page-subtitle {
  font-style: italic;
  color: var(--brown-mid);
  font-size: 18px;
  margin-bottom: 20px;
}
.divider-ornament {
  display: flex; align-items: center; justify-content: center;
  gap: 14px;
  margin: 18px 0;
  color: var(--gold);
}
.divider-ornament::before, .divider-ornament::after {
  content: "";
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  width: 80px;
}
.divider-ornament span { font-size: 18px; }

/* ─── Progress Overview Strip ─── */
.progress-strip {
  background: var(--cream-card);
  border: 2px solid var(--brown-mid);
  border-radius: 18px;
  padding: 18px 24px;
  margin-bottom: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  box-shadow: var(--shadow-warm);
  position: relative;
}
.progress-strip::before {
  content: "🌴";
  position: absolute;
  top: -12px; left: 20px;
  background: var(--bg-1);
  padding: 0 8px;
  font-size: 18px;
}
.stat-block {
  text-align: center;
}
.stat-number {
  font-family: 'Aref Ruqaa', serif;
  font-size: 32px;
  color: var(--green-deep);
  font-weight: 700;
  line-height: 1;
}
.stat-label {
  font-family: 'Special Elite', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--brown-mid);
  text-transform: uppercase;
  margin-top: 4px;
}

/* ─── Levels Grid ─── */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.level-card {
  background: var(--cream-card);
  border: 2px solid var(--brown-mid);
  border-radius: 16px;
  padding: 22px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-warm);
  min-height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.level-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, var(--green-soft), var(--green-deep));
}
.level-card:hover:not(.locked) {
  transform: translateY(-4px);
  box-shadow: var(--shadow-deep);
  border-color: var(--green-deep);
}
.level-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
  background: linear-gradient(135deg, #e8dcc0 0%, #d4c5a5 100%);
}
.level-card.locked::before { background: var(--brown-soft); }
.level-card.completed {
  background: linear-gradient(135deg, var(--cream-card) 0%, #ede0b8 100%);
  border-color: var(--green-deep);
}
.level-card.completed::before {
  background: linear-gradient(90deg, var(--green-leaf), var(--green-deep));
}
.level-num {
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--brown-mid);
  text-transform: uppercase;
}
.level-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 22px;
  color: var(--brown-dark);
  margin: 8px 0 6px;
  line-height: 1.2;
}
.level-desc {
  font-size: 14px;
  color: var(--brown-mid);
  font-style: italic;
  margin-bottom: 14px;
  line-height: 1.5;
}
.level-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px dashed var(--brown-soft);
  padding-top: 12px;
  font-size: 13px;
  color: var(--brown-mid);
}
.level-icon {
  font-size: 18px;
}
.level-status {
  font-family: 'Special Elite', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 10px;
  background: var(--bg-3);
  color: var(--brown-dark);
}
.level-card.completed .level-status {
  background: var(--green-deep);
  color: var(--cream-card);
}
.level-card.locked .level-status {
  background: var(--brown-soft);
  color: var(--cream-card);
}

/* Final Quiz Card — distinct */
.level-card.final-quiz {
  grid-column: span 2;
  background: linear-gradient(135deg, var(--brown-dark) 0%, #2a1408 100%);
  border: 3px solid var(--gold);
  color: var(--cream-card);
  min-height: 220px;
}
.level-card.final-quiz::before {
  background: linear-gradient(90deg, var(--gold), #d4a574);
  height: 8px;
}
.level-card.final-quiz .level-title { color: var(--cream-card); }
.level-card.final-quiz .level-desc { color: rgba(245,234,208,0.85); }
.level-card.final-quiz .level-num { color: var(--gold); }
.level-card.final-quiz .level-meta {
  border-top-color: rgba(176,135,85,0.4);
  color: rgba(245,234,208,0.7);
}
.level-card.final-quiz .level-status {
  background: var(--gold);
  color: var(--brown-dark);
}

/* ─── Lesson Modal (full screen overlay) ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(58,31,14,0.85);
  backdrop-filter: blur(6px);
  z-index: 1000;
  overflow-y: auto;
  padding: 30px 20px;
}
.modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
.modal-content {
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
  border-radius: 24px;
  max-width: 800px;
  width: 100%;
  padding: 36px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  position: relative;
  border: 2px solid var(--brown-mid);
  margin: auto;
}
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  background: var(--brown-dark);
  color: var(--cream-card);
  border: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--brown-mid); }

.lesson-header {
  text-align: center;
  border-bottom: 1px dashed var(--brown-mid);
  padding-bottom: 18px;
  margin-bottom: 22px;
}
.lesson-tag {
  display: inline-block;
  background: var(--green-deep);
  color: var(--cream-card);
  padding: 5px 14px;
  border-radius: 14px;
  font-family: 'Special Elite', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.lesson-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 28px;
  color: var(--brown-dark);
  margin-bottom: 6px;
}
.lesson-subtitle {
  font-style: italic;
  color: var(--brown-mid);
  font-size: 15px;
}

/* ─── Audio Player ─── */
.audio-section {
  background: var(--cream-card);
  border: 2px solid var(--brown-mid);
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0;
  text-align: center;
  position: relative;
}
.audio-section::before {
  content: "📻";
  position: absolute;
  top: -14px; left: 16px;
  background: var(--bg-1);
  padding: 0 6px;
  font-size: 18px;
}
.audio-instructions {
  font-style: italic;
  color: var(--brown-mid);
  margin-bottom: 14px;
  font-size: 14px;
}
.play-button {
  background: linear-gradient(135deg, var(--green-leaf), var(--green-deep));
  color: var(--cream-card);
  border: none;
  padding: 14px 36px;
  border-radius: 30px;
  font-family: 'Aref Ruqaa', serif;
  font-size: 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: all 0.25s;
  box-shadow: 0 4px 14px rgba(74,90,46,0.4);
  letter-spacing: 0.5px;
}
.play-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(74,90,46,0.5);
}
.play-button.playing {
  background: linear-gradient(135deg, var(--brown-mid), var(--brown-dark));
}
.transcript-toggle {
  margin-top: 12px;
  background: transparent;
  border: 1px dashed var(--brown-mid);
  color: var(--brown-mid);
  padding: 7px 16px;
  border-radius: 16px;
  cursor: pointer;
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
}
.transcript-toggle:hover { background: var(--brown-mid); color: var(--cream-card); }
.transcript {
  display: none;
  background: var(--cream-card-2);
  border-left: 4px solid var(--brown-soft);
  padding: 14px 18px;
  margin-top: 14px;
  border-radius: 8px;
  text-align: left;
  font-family: 'EB Garamond', Georgia, serif;
  font-style: italic;
  color: var(--brown-dark);
  line-height: 1.7;
  font-size: 15px;
}
.transcript.show { display: block; }
.audio-controls-extra {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
}
.speed-btn {
  background: transparent;
  border: 1px solid var(--brown-soft);
  color: var(--brown-mid);
  padding: 5px 12px;
  border-radius: 14px;
  cursor: pointer;
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 1px;
}
.speed-btn.active, .speed-btn:hover {
  background: var(--brown-mid);
  color: var(--cream-card);
}

/* ─── Question Section ─── */
.question-block {
  background: var(--cream-card);
  border: 2px solid var(--brown-soft);
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0;
  position: relative;
}
.question-num {
  font-family: 'Special Elite', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--green-deep);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.question-text {
  font-family: 'Aref Ruqaa', serif;
  font-size: 18px;
  color: var(--brown-dark);
  margin-bottom: 14px;
}
.options-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.option-btn {
  background: var(--bg-1);
  border: 2px solid var(--brown-soft);
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  color: var(--brown-dark);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-btn:hover:not(:disabled) {
  background: var(--cream-card-2);
  border-color: var(--green-leaf);
  transform: translateX(4px);
}
.option-btn .opt-letter {
  font-family: 'Aref Ruqaa', serif;
  background: var(--brown-mid);
  color: var(--cream-card);
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.option-btn.correct {
  background: #d4e0a8;
  border-color: var(--green-deep);
  color: var(--green-deep);
}
.option-btn.correct .opt-letter { background: var(--green-deep); }
.option-btn.incorrect {
  background: #e8c5a8;
  border-color: #a04020;
  color: #a04020;
}
.option-btn.incorrect .opt-letter { background: #a04020; }
.option-btn:disabled { cursor: default; }

.feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: 10px;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct {
  background: rgba(122,143,78,0.15);
  border-left: 4px solid var(--green-deep);
  color: var(--green-deep);
}
.feedback.incorrect {
  background: rgba(160,64,32,0.12);
  border-left: 4px solid #a04020;
  color: #6b2a18;
}

/* True/False question */
.tf-options {
  display: flex; gap: 14px; justify-content: center;
}
.tf-btn {
  flex: 1;
  background: var(--bg-1);
  border: 2px solid var(--brown-soft);
  padding: 16px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Aref Ruqaa', serif;
  font-size: 18px;
  color: var(--brown-dark);
  transition: all 0.2s;
}
.tf-btn:hover:not(:disabled) {
  background: var(--cream-card-2);
  transform: translateY(-2px);
}
.tf-btn.correct { background: #d4e0a8; border-color: var(--green-deep); color: var(--green-deep); }
.tf-btn.incorrect { background: #e8c5a8; border-color: #a04020; color: #a04020; }

/* Fill-in-blank question */
.fillblank-input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--brown-soft);
  border-radius: 10px;
  font-family: 'EB Garamond', serif;
  font-size: 17px;
  background: var(--bg-1);
  color: var(--brown-dark);
}
.fillblank-input:focus {
  outline: none;
  border-color: var(--green-deep);
  background: var(--cream-card-2);
}

/* Action Buttons */
.action-row {
  display: flex; gap: 12px; justify-content: space-between;
  margin-top: 24px;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 28px;
  border-radius: 26px;
  font-family: 'Aref Ruqaa', serif;
  font-size: 16px;
  cursor: pointer;
  border: none;
  transition: all 0.25s;
  letter-spacing: 0.5px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--green-leaf), var(--green-deep));
  color: var(--cream-card);
  box-shadow: 0 4px 14px rgba(74,90,46,0.4);
}
.btn-primary:hover { transform: translateY(-2px); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: transparent;
  color: var(--brown-mid);
  border: 2px solid var(--brown-mid);
}
.btn-secondary:hover { background: var(--brown-mid); color: var(--cream-card); }

/* Progress in lesson */
.lesson-progress {
  display: flex; gap: 6px;
  margin-bottom: 16px;
  justify-content: center;
}
.progress-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--brown-soft);
  transition: all 0.3s;
}
.progress-dot.current {
  background: var(--green-deep);
  transform: scale(1.4);
}
.progress-dot.done {
  background: var(--green-leaf);
}

/* Completion screen */
.completion-screen {
  text-align: center;
  padding: 30px 20px;
}
.completion-icon {
  font-size: 80px;
  margin-bottom: 20px;
  animation: float 2.5s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.completion-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 32px;
  color: var(--green-deep);
  margin-bottom: 10px;
}
.completion-score {
  font-size: 48px;
  font-family: 'Aref Ruqaa', serif;
  color: var(--brown-dark);
  margin: 16px 0;
}
.completion-message {
  font-style: italic;
  color: var(--brown-mid);
  margin-bottom: 24px;
  font-size: 16px;
}

/* Footer ornament */
.footer-ornament {
  text-align: center;
  margin-top: 60px;
  padding: 30px 20px;
  border-top: 1px dashed var(--brown-mid);
  color: var(--brown-mid);
  font-style: italic;
  font-size: 14px;
}
.footer-ornament .palm-row {
  font-size: 22px;
  margin-bottom: 10px;
  letter-spacing: 12px;
}

/* Responsive */
@media (max-width: 600px) {
  .level-card.final-quiz { grid-column: span 1; }
  .progress-strip { padding: 14px 16px; }
  .container { padding: 20px 14px 40px; }
  .modal-content { padding: 26px 18px; }
}
</style>
<script src="public/js/piper-client.js"></script>
<script src="public/js/palm-sfx.js" defer></script>
<script src="public/js/palm-globe-fab.js" defer></script>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<script src="public/js/palm-games-fab.js" defer></script>
</head>
<body>

<!-- ─── Top Navigation Bar ─── -->
<div class="topbar">
  <div class="logo">
    <span class="palm-icon">🌴</span>
    <span>Under the Palm Tree</span>
  </div>
  <div class="nav-buttons">
    <button class="nav-btn" title="Home">🏠</button>
    <button class="nav-btn" title="Audio">🎵</button>
    <button class="nav-btn" title="Menu">☰</button>
    <button class="nav-btn" title="Back">←</button>
    <button class="nav-btn" title="Exit">⎋</button>
  </div>
</div>

<div class="container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="skill-tag">Skill 1 of 7</div>
    <h1 class="page-title">Listening</h1>
    <p class="page-subtitle">Train your ear with the voices of Samail, 1973</p>
    <div class="divider-ornament"><span>🪔</span></div>
  </div>

  <!-- Progress Stats Strip -->
  <div class="progress-strip" id="progressStrip">
    <div class="stat-block">
      <div class="stat-number" id="statCompleted">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-block">
      <div class="stat-number" id="statTotal">11</div>
      <div class="stat-label">Total Levels</div>
    </div>
    <div class="stat-block">
      <div class="stat-number" id="statScore">0%</div>
      <div class="stat-label">Avg Score</div>
    </div>
    <div class="stat-block">
      <div class="stat-number" id="statStreak">0</div>
      <div class="stat-label">Streak 🔥</div>
    </div>
  </div>

// ═══════════════════════════════════════════════════════════
// State Management (in-memory only, no localStorage)
// ═══════════════════════════════════════════════════════════
const state = {
  completed: {},   // { levelNum: { score: 0-100, attempted: true } }
  currentLevel: null,
  currentQuestion: 0,
  answers: [],
  audioRate: 1.0,
  isPlaying: false
};

// ═══════════════════════════════════════════════════════════
// Render Levels Grid
// ═══════════════════════════════════════════════════════════
function renderLevels() {
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';
  
  levels.forEach((lvl, idx) => {
    const isCompleted = state.completed[lvl.num];
    const prevCompleted = idx === 0 || state.completed[levels[idx - 1].num];
    const isLocked = !prevCompleted && !isCompleted;
    
    const card = document.createElement('div');
    card.className = 'level-card';
    if (isCompleted) card.classList.add('completed');
    if (isLocked) card.classList.add('locked');
    if (lvl.isFinal) card.classList.add('final-quiz');
    
    let statusText = 'Locked';
    if (!isLocked && !isCompleted) statusText = 'Start';
    if (isCompleted) statusText = `Score ${state.completed[lvl.num].score}%`;
    
    const levelLabel = lvl.isFinal ? 'Final Quiz · Level 11' : `Level ${lvl.num} of 10`;
    
    card.innerHTML = `
      <div>
        <div class="level-num">${levelLabel}</div>
        <h3 class="level-title">${lvl.title}</h3>
        <p class="level-desc">${lvl.desc}</p>
      </div>
      <div class="level-meta">
        <span class="level-icon">${lvl.icon}</span>
        <span class="level-status">${statusText}</span>
      </div>
    `;
    
    if (!isLocked) {
      card.addEventListener('click', () => openLesson(lvl.num));
    }
    
    grid.appendChild(card);
  });
  
  updateStats();
}

// ═══════════════════════════════════════════════════════════
// Stats Calculation
// ═══════════════════════════════════════════════════════════
function updateStats() {
  const completedCount = Object.keys(state.completed).length;
  document.getElementById('statCompleted').textContent = completedCount;
  
  const scores = Object.values(state.completed).map(c => c.score);
  const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0;
  document.getElementById('statScore').textContent = avg + '%';
  
  // Streak: consecutive completed levels
  let streak = 0;
  for (let i = 0; i < levels.length; i++) {
    if (state.completed[levels[i].num]) streak++;
    else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

// ═══════════════════════════════════════════════════════════
// Open Lesson Modal
// ═══════════════════════════════════════════════════════════
function openLesson(levelNum) {
  state.currentLevel = levels.find(l => l.num === levelNum);
  state.currentQuestion = 0;
  state.answers = [];
  
  document.getElementById('lessonModal').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderLessonStep();
}

function closeLesson() {
  // Stop any audio
  if (window.currentUtterance) {
    speechSynthesis.cancel();
    state.isPlaying = false;
  }
  document.getElementById('lessonModal').classList.remove('active');
  document.body.style.overflow = '';
  state.currentLevel = null;
}

// ═══════════════════════════════════════════════════════════
// Render Lesson Step (audio first, then questions, then completion)
// ═══════════════════════════════════════════════════════════
function renderLessonStep() {
  const lvl = state.currentLevel;
  const body = document.getElementById('lessonBody');
  
  if (state.currentQuestion === 0 && state.answers.length === 0) {
    // Audio screen first
    renderAudioScreen();
  } else if (state.currentQuestion < lvl.questions.length) {
    renderQuestion();
  } else {
    renderCompletion();
  }
}

function renderAudioScreen() {
  const lvl = state.currentLevel;
  const body = document.getElementById('lessonBody');
  
  body.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-tag">${lvl.isFinal ? 'Final Quiz' : 'Level ' + lvl.num + ' / 10'}</div>
      <h2 class="lesson-title">${lvl.title}</h2>
      <p class="lesson-subtitle">${lvl.desc}</p>
    </div>
    
    <div class="audio-section">
      <p class="audio-instructions">🎧 Listen carefully. You can replay as many times as you wish.</p>
      <button class="play-button" id="playBtn" onclick="toggleAudio()">
        <span id="playIcon">▶</span>
        <span id="playText">Play Audio</span>
      </button>
      <div class="audio-controls-extra">
        <button class="speed-btn" onclick="setSpeed(0.7, this)">0.7×</button>
        <button class="speed-btn active" onclick="setSpeed(1.0, this)">1.0×</button>
        <button class="speed-btn" onclick="setSpeed(0.85, this)">0.85×</button>
      </div>
      <button class="transcript-toggle" onclick="toggleTranscript()">📜 Show Transcript</button>
      <div class="transcript" id="transcript">${lvl.audio}</div>
    </div>
    
    <div class="action-row">
      <button class="btn btn-secondary" onclick="closeLesson()">← Back to Levels</button>
      <button class="btn btn-primary" onclick="startQuestions()">Begin Questions →</button>
    </div>
  `;
}

// Audio playback using Web Speech API
let currentUtterance = null;
function toggleAudio() {
  const lvl = state.currentLevel;
  if (state.isPlaying) {
    speechSynthesis.cancel();
    state.isPlaying = false;
    document.getElementById('playIcon').textContent = '▶';
    document.getElementById('playText').textContent = 'Play Audio';
    document.getElementById('playBtn').classList.remove('playing');
    return;
  }
  
  currentUtterance = new SpeechSynthesisUtterance(lvl.audio);
  currentUtterance.rate = state.audioRate;
  currentUtterance.lang = 'en-US';
  // Try to find a clear English voice
  const voices = speechSynthesis.getVoices();
  const englishVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('female')) 
                    || voices.find(v => v.lang.startsWith('en'));
  if (englishVoice) currentUtterance.voice = englishVoice;
  
  currentUtterance.onstart = () => {
    state.isPlaying = true;
    document.getElementById('playIcon').textContent = '⏸';
    document.getElementById('playText').textContent = 'Pause';
    document.getElementById('playBtn').classList.add('playing');
  };
  currentUtterance.onend = () => {
    state.isPlaying = false;
    document.getElementById('playIcon').textContent = '▶';
    document.getElementById('playText').textContent = 'Play Again';
    document.getElementById('playBtn').classList.remove('playing');
  };
  
  window.currentUtterance = currentUtterance;
  speechSynthesis.speak(currentUtterance);
}

function setSpeed(rate, btn) {
  state.audioRate = rate;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleTranscript() {
  document.getElementById('transcript').classList.toggle('show');
}

function startQuestions() {
  // Stop audio if playing
  speechSynthesis.cancel();
  state.isPlaying = false;
  state.currentQuestion = 0;
  state.answers = [];
  renderLessonStep();
}

// ═══════════════════════════════════════════════════════════
// Render Question
// ═══════════════════════════════════════════════════════════
function renderQuestion() {
  const lvl = state.currentLevel;
  const q = lvl.questions[state.currentQuestion];
  const body = document.getElementById('lessonBody');
  
  // Progress dots
  const dots = lvl.questions.map((_, i) => {
    let cls = 'progress-dot';
    if (i < state.currentQuestion) cls += ' done';
    if (i === state.currentQuestion) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  
  let questionHTML = '';
  if (q.type === 'mcq') {
    questionHTML = `
      <div class="options-list">
        ${q.options.map((opt, i) => `
          <button class="option-btn" data-index="${i}" onclick="selectMCQ(${i})">
            <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'tf') {
    questionHTML = `
      <div class="tf-options">
        <button class="tf-btn" onclick="selectTF(true)">✓ True</button>
        <button class="tf-btn" onclick="selectTF(false)">✗ False</button>
      </div>
    `;
  } else if (q.type === 'fillblank') {
    questionHTML = `
      <input type="text" class="fillblank-input" id="fillblankInput" placeholder="Type your answer here..." 
             onkeydown="if(event.key==='Enter') submitFillblank()" autocomplete="off">
      <div style="margin-top: 14px; text-align: center;">
        <button class="btn btn-primary" onclick="submitFillblank()">Submit Answer</button>
      </div>
    `;
  }
  
  body.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-tag">${lvl.isFinal ? 'Final Quiz' : 'Level ' + lvl.num}</div>
      <h2 class="lesson-title">${lvl.title}</h2>
    </div>
    
    <div class="lesson-progress">${dots}</div>
    
    <div class="question-block">
      <div class="question-num">Question ${state.currentQuestion + 1} of ${lvl.questions.length}</div>
      <div class="question-text">${q.q}</div>
      ${questionHTML}
      <div class="feedback" id="feedback"></div>
    </div>
    
    <div class="action-row">
      <button class="btn btn-secondary" onclick="replayAudio()">🔊 Replay Audio</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">
        ${state.currentQuestion === lvl.questions.length - 1 ? 'See Results →' : 'Next Question →'}
      </button>
    </div>
  `;
}

function replayAudio() {
  const lvl = state.currentLevel;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(lvl.audio);
  u.rate = state.audioRate;
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════════════════════
// Answer Handlers
// ═══════════════════════════════════════════════════════════
function selectMCQ(idx) {
  const q = state.currentLevel.questions[state.currentQuestion];
  const isCorrect = idx === q.correct;
  state.answers.push(isCorrect);
  
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('incorrect');
  });
  
  showFeedback(isCorrect, q.explanation);
}

function selectTF(answer) {
  const q = state.currentLevel.questions[state.currentQuestion];
  const isCorrect = answer === q.correct;
  state.answers.push(isCorrect);
  
  document.querySelectorAll('.tf-btn').forEach((btn, i) => {
    btn.disabled = true;
    const btnVal = i === 0;
    if (btnVal === q.correct) btn.classList.add('correct');
    if (btnVal === answer && !isCorrect) btn.classList.add('incorrect');
  });
  
  showFeedback(isCorrect, q.explanation);
}

function submitFillblank() {
  const input = document.getElementById('fillblankInput');
  const userAnswer = input.value.trim().toLowerCase();
  if (!userAnswer) return;
  
  const q = state.currentLevel.questions[state.currentQuestion];
  const correctAnswers = q.correct.map(a => a.toLowerCase());
  const isCorrect = correctAnswers.includes(userAnswer);
  state.answers.push(isCorrect);
  
  input.disabled = true;
  if (isCorrect) {
    input.style.background = '#d4e0a8';
    input.style.borderColor = 'var(--green-deep)';
  } else {
    input.style.background = '#e8c5a8';
    input.style.borderColor = '#a04020';
  }
  
  showFeedback(isCorrect, q.explanation + (isCorrect ? '' : ` Correct answer: "${q.correct[0]}"`));
}

function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById('feedback');
  fb.classList.remove('correct', 'incorrect');
  fb.classList.add('show', isCorrect ? 'correct' : 'incorrect');
  fb.innerHTML = `<strong>${isCorrect ? '✓ Excellent!' : '✗ Not quite.'}</strong> ${explanation}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  state.currentQuestion++;
  renderLessonStep();
}

// ═══════════════════════════════════════════════════════════
// Completion Screen
// ═══════════════════════════════════════════════════════════
function renderCompletion() {
  const lvl = state.currentLevel;
  const correctCount = state.answers.filter(a => a).length;
  const totalQ = state.answers.length;
  const score = Math.round((correctCount / totalQ) * 100);
  const passed = lvl.isFinal ? score >= 70 : score >= 60;
  
  // Save to state
  state.completed[lvl.num] = { score, attempted: true };
  
  let icon = '🌟';
  let title = 'Level Complete!';
  let message = '';
  
  if (lvl.isFinal) {
    if (passed) {
      icon = '🏆';
      title = 'Certificate Earned!';
      message = `You have mastered the Listening skill. Welcome to the next level of the journey.`;
    } else {
      icon = '🌱';
      title = 'Almost There';
      message = `You need 70% or higher to pass the final quiz. Keep practicing — you'll get there.`;
    }
  } else {
    if (score === 100) { icon = '⭐'; message = 'Flawless! Every answer correct.'; }
    else if (score >= 80) { icon = '🌟'; message = 'Excellent work! You really listened well.'; }
    else if (score >= 60) { icon = '🌴'; message = 'Good job! Keep listening — you\'re improving.'; }
    else { icon = '🌱'; message = 'Try again — listening takes practice. Replay and review.'; }
  }
  
  const body = document.getElementById('lessonBody');
  body.innerHTML = `
    <div class="completion-screen">
      <div class="completion-icon">${icon}</div>
      <h2 class="completion-title">${title}</h2>
      <div class="completion-score">${correctCount} / ${totalQ}</div>
      <div style="font-family: 'Aref Ruqaa', serif; font-size: 22px; color: var(--green-deep); margin-bottom: 20px;">
        Score: ${score}%
      </div>
      <p class="completion-message">${message}</p>
      
      ${lvl.isFinal && passed ? `
        <div style="background: var(--cream-card); border: 2px solid var(--gold); border-radius: 16px; padding: 24px; margin: 24px 0;">
          <div style="font-family: 'Aref Ruqaa', serif; font-size: 24px; color: var(--brown-dark); margin-bottom: 8px;">🏆 Listening Mastery Certificate</div>
          <div style="font-style: italic; color: var(--brown-mid);">Awarded to the dedicated learner</div>
          <div style="margin-top: 14px; font-family: 'Special Elite', monospace; font-size: 11px; letter-spacing: 2px; color: var(--brown-mid);">UNDER THE PALM TREE · 2026</div>
        </div>
      ` : ''}
      
      <div class="action-row" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="retryLesson()">↻ Try Again</button>
        <button class="btn btn-primary" onclick="closeLesson(); renderLevels();">Continue Journey →</button>
      </div>
    </div>
  `;
  
  // Update stats next time grid renders
  setTimeout(() => renderLevels(), 100);
}

function retryLesson() {
  delete state.completed[state.currentLevel.num];
  state.currentQuestion = 0;
  state.answers = [];
  renderLessonStep();
}

// ═══════════════════════════════════════════════════════════
// Initial Render
// ═══════════════════════════════════════════════════════════
renderLevels();

// Preload voices for speech synthesis
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = () => {
    // voices loaded
  };
  speechSynthesis.getVoices();
}
</script>

</body>
</html>
