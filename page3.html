<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Page 3</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FDF3DD;
  }

  .page-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #FDF3DD;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vh, 36px);
  }

  /* المسامير */
  .corner-btn {
    position: absolute;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 400;
    transition: transform 0.2s;
    width: clamp(28px, 3.5vw, 42px);
    height: clamp(28px, 3.5vw, 42px);
    font-size: clamp(1rem, 2vw, 1.5rem);
    margin: clamp(8px, 1.5vw, 18px);
    box-shadow:
      0 4px 6px rgba(0,0,0,0.25),
      0 1px 3px rgba(0,0,0,0.15),
      inset 0 1px 1px rgba(255,255,255,0.3);
    z-index: 10;
  }
  .corner-btn:hover  { transform: scale(1.1); }
  .corner-btn:active { transform: scale(0.93); }
  .top-left     { top: 0; left: 0;     background: radial-gradient(circle at 35% 35%, #f07030, #E8611A); }
  .top-right    { top: 0; right: 0;    background: radial-gradient(circle at 35% 35%, #dde8f5, #CBD8E8); color: #5a7a9a; }
  .bottom-left  { bottom: 0; left: 0;  background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }
  .bottom-right { bottom: 0; right: 0; background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }

  /* العنوان */
  .page-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(0.9rem, 3vw, 2rem);
    color: #4a9a5a;
    letter-spacing: clamp(1px, 0.5vw, 5px);
    text-shadow:
      2px 2px 0px rgba(0,0,0,0.15),
      0 4px 10px rgba(0,0,0,0.12);
    text-transform: uppercase;
    z-index: 2;
  }

  /* البوكسات */
  .boxes-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3.5vw, 48px);
    width: 92%;
    max-width: 1000px;
    /* مساحة للصور الطالعة */
    padding-top: clamp(30px, 6vw, 70px);
  }

  .bevel-box {
    border-radius: clamp(16px, 2.5vw, 28px);
    box-shadow:
      0 14px 36px rgba(0,0,0,0.32),
      0 4px 10px rgba(0,0,0,0.18),
      inset 0 3px 8px rgba(255,255,255,0.4),
      inset 0 -3px 8px rgba(0,0,0,0.22);
    position: relative;
    width: clamp(120px, 27vw, 290px);
    height: clamp(160px, 40vw, 380px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: clamp(12px, 2.5vw, 28px);
    overflow: visible;
    /* zoom out on hover */
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }

  .bevel-box:hover {
    transform: scale(0.93);
  }

  .box1 { background: #6f0828; }
  .box2 { background: #00545f; }
  .box3 { background: #4d2850; }

  /* الصورة تطل من فوق البوكس */
  .box-img {
    position: absolute;
    top: clamp(-45px, -9vw, -80px);
    left: 50%;
    transform: translateX(-50%);
    width: clamp(80px, 20vw, 200px);
    object-fit: contain;
    filter:
      drop-shadow(0 8px 16px rgba(0,0,0,0.4))
      drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    z-index: 5;
    pointer-events: none;
  }

  /* عنوان البوكس */
  .box-label {
    width: 85%;
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="page-container">

  <button class="corner-btn top-left">+</button>
  <button class="corner-btn top-right">+</button>
  <button class="corner-btn bottom-left">+</button>
  <button class="corner-btn bottom-right">+</button>

  <!-- العنوان -->
  <div class="page-title">Palm Tree Palmers</div>

  <!-- البوكسات -->
  <div class="boxes-area">

    <!-- البوكس الأول - Students -->
    <div class="bevel-box box1">
      <img class="box-img" src="Students.png" alt="Students">
      <img class="box-label" src="Students.png" alt="Students Label">
    </div>

    <!-- البوكس الثاني - Teachers -->
    <div class="bevel-box box2">
      <img class="box-img" src="Teachers.png" alt="Teachers">
      <img class="box-label" src="Teachers.png" alt="Teachers Label">
    </div>

    <!-- البوكس الثالث - Men Village -->
    <div class="bevel-box box3">
      <img class="box-img" src="Menvillage.png" alt="Men Village">
      <img class="box-label" src="Menvillage.png" alt="Men Village Label">
    </div>

  </div>

</div>
</body>
</html>
