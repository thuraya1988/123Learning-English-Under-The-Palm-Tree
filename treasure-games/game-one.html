<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0620" />
    <title>مملكة الجوائز — ١٢٠ مستوى</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" data-game="kingdom">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-row">
          <button class="icon" data-act="pause">⏸</button
          ><a class="icon" href="index.html">⌂</a
          ><span id="levelChip" class="chip"></span
          ><span id="worldChip" class="chip"></span><span class="grow"></span
          ><span id="timeChip" class="chip"></span
          ><span id="starChip" class="chip"></span
          ><span id="coinChip" class="chip"></span
          ><span id="heartChip" class="hearts"></span>
        </div>
        <div id="powers"></div>
        <div class="touch">
          <button data-key="left">◀</button><button data-key="right">▶</button
          ><button data-key="down">▼</button
          ><button class="jump" data-key="jump">⤒</button>
        </div>
      </div>
      <section id="menu" class="screen menu-one">
        <div class="title-icon">👑</div>
        <h1>مملكة الجوائز</h1>
        <p>١٢٠ مستوى • ٦ عوالم • عجلة جوائز</p>
        <button class="main" data-act="continue">ابدئي المغامرة</button
        ><button data-act="map">خريطة المستويات</button
        ><button data-act="shop">المتجر</button
        ><a class="sub" href="index.html">كل الألعاب</a>
      </section>
      <section id="map" class="screen hidden">
        <header>
          <button data-act="menu">الرئيسية</button>
          <h2>خريطة المملكة</h2>
          <span id="mapStats" class="chip"></span>
        </header>
        <div id="mapGrid" class="scroll"></div>
      </section>
      <section id="shop" class="screen hidden">
        <header>
          <button data-act="menu">الرئيسية</button>
          <h2>متجر القوى والشخصيات</h2>
          <span id="shopStats" class="chip"></span>
        </header>
        <div id="shopGrid" class="scroll shop-grid"></div>
      </section>
      <div id="modal" class="modal hidden">
        <div class="box">
          <h2 id="modalTitle"></h2>
          <div id="modalBody"></div>
          <div id="modalBtns"></div>
        </div>
      </div>
      <div id="toast"></div>
    </div>
    <script src="engine.js"></script>
  </body>
</html>
