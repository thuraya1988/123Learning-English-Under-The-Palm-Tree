<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19243a">
  <title>غرفة الموظفات | ملتقى المعارف</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2319243a'/%3E%3Cpath d='M15 18h34v24H31L20 50v-8h-5z' fill='%23dce6af'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#19243a;--navy2:#26344e;--burg:#742b40;--lime:#dce6af;--sand:#eee7d7;--paper:#fbfaf5;--line:#c8c3ae;--ink:#20283a;--muted:#687068;--danger:#8c2f3f}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:linear-gradient(135deg,#111827,var(--navy));color:var(--ink);font-family:"Noto Kufi Arabic","Cairo",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .icon{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    #shell{height:100%;max-width:980px;margin:auto;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 70px #0006}
    header{flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:13px 16px;background:var(--navy);color:#fff;border-bottom:1px solid #fff2}.head-action{width:42px;height:42px;border:1px solid #fff3;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}.head-action:hover,.head-action:focus-visible{background:#fff1;outline:2px solid var(--lime);outline-offset:2px}.title{min-width:0}.title h1{font-size:18px;line-height:1.4;margin:0}.title p{font-size:12px;color:#cdd2dc;margin:1px 0 0}.identity{margin-inline-start:auto;text-align:left;font-size:12px;color:#d4d8df}.identity strong{display:block;color:var(--lime);font-size:13px}.logout{width:auto;padding:0 12px;font-size:12px}
    #state{display:none;padding:8px 16px;text-align:center;font-size:13px;font-weight:700;background:#f4dfd7;color:var(--danger);border-bottom:1px solid #debdb4}#state.on{display:block}#state.info{background:var(--sand);color:var(--muted)}
    #log{flex:1;overflow:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;background:radial-gradient(circle at 15% 15%,#dce6af3b,transparent 28%),var(--paper)}
    #empty{margin:auto;text-align:center;color:var(--muted);line-height:2}.empty-mark{width:58px;height:58px;margin:0 auto 10px;border-radius:19px;display:grid;place-items:center;background:var(--sand);color:var(--burg)}.empty-mark .icon{width:29px;height:29px}
    .day{align-self:center;background:var(--sand);color:var(--muted);font-size:12px;font-weight:800;padding:4px 14px;border-radius:999px}.row{display:flex;flex-direction:column;max-width:min(76%,560px)}.row.mine{align-self:flex-start}.row.other{align-self:flex-end}.who{display:flex;gap:7px;align-items:baseline;margin:0 5px 3px;color:var(--burg);font-weight:900;font-size:12px}.who span{color:var(--muted);font-weight:600;font-size:11px}.bubble{position:relative;padding:10px 13px;border:1px solid var(--line);border-radius:16px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:15px}.mine .bubble{background:var(--navy2);border-color:var(--navy2);color:#fff}.time{margin:3px 6px 0;color:var(--muted);font-size:11px}.delete{position:absolute;left:-52px;top:5px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--danger);padding:4px 8px;font-size:11px;opacity:0}.row:hover .delete,.delete:focus-visible{opacity:1}.attachment{display:block;margin-top:8px;border-radius:12px;overflow:hidden}.attachment img,.attachment video{display:block;max-width:100%;max-height:340px;border-radius:12px;background:#0002}.file-link{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:11px;background:var(--sand);color:var(--ink);text-decoration:none}.mine .file-link{background:#344666;color:#fff}.file-link .icon{flex:0 0 auto}.file-name{font-weight:800;font-size:13px}.file-size{font-size:11px;opacity:.7}
    .composer{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sand);border-top:1px solid var(--line)}.composer textarea{width:100%;max-height:130px;resize:none;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:11px 13px;line-height:1.65;font-size:15px}.composer textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px}.round{width:48px;height:48px;border:0;border-radius:14px;display:grid;place-items:center}.attach-btn{background:#fff;color:var(--navy2);border:1px solid var(--line)}.send-btn{background:var(--burg);color:#fff}.round:disabled{opacity:.45;cursor:default}.pending{grid-column:1/-1;display:none;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px}.pending.on{display:flex}.pending strong{flex:1;overflow-wrap:anywhere}.remove-file{border:0;background:transparent;color:var(--danger);font-weight:900}.progress{grid-column:1/-1;display:none;height:4px;border-radius:99px;background:#cfc5b5;overflow:hidden}.progress.on{display:block}.progress i{display:block;width:0;height:100%;background:var(--burg);transition:width .15s}
    #gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,rgba(25,36,58,.98),rgba(32,35,31,.97))}.login-card{width:min(450px,100%);background:var(--paper);border-radius:28px;padding:30px;box-shadow:0 30px 90px #0007;border:1px solid #fff3}.login-mark{width:68px;height:68px;display:grid;place-items:center;border-radius:22px;background:var(--lime);color:var(--navy);margin-bottom:18px}.login-mark .icon{width:34px;height:34px}.login-card h2{font-size:28px;line-height:1.45;margin:0;color:var(--navy)}.login-card>p{margin:6px 0 24px;color:var(--muted)}.field{display:grid;gap:7px;margin-top:14px}.field label{font-size:13px;font-weight:900;color:var(--navy)}.field input{min-height:50px;border:1px solid var(--line);border-radius:13px;padding:10px 13px;background:#fff;font-size:16px}.field input:focus{outline:2px solid var(--burg);outline-offset:1px}.login-submit{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:13px;background:var(--burg);color:#fff;font-weight:900}.login-submit:disabled{opacity:.6}.login-error{min-height:24px;margin-top:10px;color:var(--danger);font-size:13px;font-weight:800;text-align:center}.back-home{display:block;text-align:center;margin-top:9px;color:var(--navy);font-size:13px;font-weight:800}.credit{text-align:center;margin-top:23px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.8}.credit strong{display:block;color:var(--navy)}
    @media(max-width:620px){header{padding:10px}.title h1{font-size:15px}.identity{display:none}.logout{display:grid;width:42px;padding:0;font-size:0}.logout .icon{display:block}.row{max-width:86%}.delete{opacity:1;left:-47px}.login-card{padding:24px;border-radius:22px}}
    @media(prefers-reduced-motion:reduce){#log{scroll-behavior:auto}.progress i{transition:none}}
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3v-7a4 4 0 0 1-1-2.6V7a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4z"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h12"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol><symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 1 1-2.8-2.8l8.9-8.9"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol><symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/></symbol></svg>
  <div id="gate">
    <form class="login-card" id="loginForm">
      <div class="login-mark"><svg class="icon"><use href="#i-chat"/></svg></div>
      <h2>غرفة الموظفات</h2><p>سجّلي الدخول بحسابك في ملتقى المعارف.</p>
      <div class="field"><label for="loginName">الاسم</label><input id="loginName" autocomplete="username" required placeholder="الاسم المسجل في النظام"></div>
      <div class="field"><label for="loginPin">رمز الدخول</label><input id="loginPin" type="password" inputmode="numeric" pattern="[0-9]{6,12}" autocomplete="current-password" required placeholder="٦ أرقام أو أكثر"></div>
      <button class="login-submit" id="loginBtn" type="submit">دخول الغرفة</button>
      <div class="login-error" id="loginError" role="alert"></div>
      <a class="back-home" href="../">العودة إلى الصفحة الرئيسية</a>
      <div class="credit"><strong>حقوق العمل</strong>عمل وتنفيذ الأستاذة: ثرياء محمد الناعبية<br>معلمة لغة إنجليزية</div>
    </form>
  </div>
  <div id="shell">
    <header><a class="head-action" href="../" aria-label="العودة للرئيسية"><svg class="icon"><use href="#i-back"/></svg></a><div class="title"><h1>غرفة الموظفات</h1><p>مدرسة ملتقى المعارف للتعليم الأساسي (١–٦)</p></div><div class="identity"><strong id="meName">—</strong><span id="meRole"></span></div><button class="head-action logout" id="logout" aria-label="تسجيل الخروج"><svg class="icon"><use href="#i-exit"/></svg><span>خروج</span></button></header>
    <div id="state" role="status"></div>
    <main id="log" role="log" aria-live="polite"><div id="empty"><span class="empty-mark"><svg class="icon"><use href="#i-chat"/></svg></span>لا توجد رسائل بعد.<br>ابدئي أول رسالة في الغرفة.</div></main>
    <div class="composer"><div class="pending" id="pending"><svg class="icon"><use href="#i-file"/></svg><strong id="fileName"></strong><span id="fileSize"></span><button class="remove-file" id="removeFile" type="button">إزالة</button></div><div class="progress" id="progress"><i id="progressFill"></i></div><button class="round attach-btn" id="attach" type="button" aria-label="إرفاق ملف"><svg class="icon"><use href="#i-clip"/></svg></button><input id="file" type="file" hidden accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf"><textarea id="message" rows="1" maxlength="600" placeholder="اكتبي رسالتك…" aria-label="نص الرسالة"></textarea><button class="round send-btn" id="send" type="button" aria-label="إرسال"><svg class="icon"><use href="#i-send"/></svg></button></div>
  </div>
  <script>
  (()=>{
    'use strict';
    const FN_URL='https://dhhwcqczvcbwdwllfcun.supabase.co/functions/v1/multaqa-secure';
    const SESSION_KEYS=['multaqa-staff-session','staff-session','multaqaSession'];
    const $=id=>document.getElementById(id), MB=1024*1024;
    let pending=null,timer=null,meId='',lastTs='',lastDay='',seen=new Set(),busy=false;
    let limits={'image/jpeg':10,'image/png':10,'image/webp':10,'image/gif':10,'video/mp4':100,'video/webm':100,'video/quicktime':100,'application/pdf':25};
    function token(){for(const k of SESSION_KEYS){for(const s of [localStorage,sessionStorage]){try{const v=s.getItem(k);if(v)return v}catch{}}}return ''}
    function saveToken(v){localStorage.setItem(SESSION_KEYS[0],v)}
    function clearToken(){for(const k of SESSION_KEYS){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch{}}}
    async function api(action,data={},auth=true){const headers={'content-type':'application/json'};if(auth){const t=token();if(!t)throw Object.assign(new Error('session_required'),{code:'session_required'});headers['x-staff-session']=t}const res=await fetch(FN_URL,{method:'POST',headers,body:JSON.stringify({action,...data})});let out={};try{out=await res.json()}catch{}if(!res.ok||out.ok===false)throw Object.assign(new Error(out.error||'request_failed'),{code:out.error||'request_failed'});return out}
    function showState(text,type='warn'){const el=$('state');el.textContent=text;el.className=text?'on '+type:''}
    function showGate(show){$('gate').classList.toggle('hidden',!show)}
    const human=n=>n<MB?Math.max(1,Math.round(n/1024))+' ك.ب':(n/MB).toFixed(n<10*MB?1:0)+' م.ب';
    const pad=n=>String(n).padStart(2,'0');
    const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    function dayLabel(d){const n=new Date(),y=new Date(n);y.setDate(y.getDate()-1);return dayKey(d)===dayKey(n)?'اليوم':dayKey(d)===dayKey(y)?'أمس':d.toLocaleDateString('ar-OM',{day:'numeric',month:'long'})}
    function timeLabel(d){return d.toLocaleTimeString('ar-OM',{hour:'numeric',minute:'2-digit'})}
    function attachment(m){if(!m.file_url)return null;if((m.file_mime||'').startsWith('image/')){const a=document.createElement('a');a.className='attachment';a.href=m.file_url;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=m.file_url;img.alt=m.file_name||'صورة مرفقة';img.loading='lazy';a.append(img);return a}if((m.file_mime||'').startsWith('video/')){const w=document.createElement('div');w.className='attachment';const v=document.createElement('video');v.src=m.file_url;v.controls=true;v.preload='metadata';v.playsInline=true;w.append(v);return w}const a=document.createElement('a');a.className='file-link';a.href=m.file_url;a.target='_blank';a.rel='noopener';a.innerHTML='<svg class="icon"><use href="#i-file"/></svg>';const tx=document.createElement('span'),nm=document.createElement('span'),sz=document.createElement('span');nm.className='file-name';nm.textContent=m.file_name||'ملف PDF';sz.className='file-size';sz.textContent=human(m.file_size||0);tx.append(nm,document.createElement('br'),sz);a.append(tx);return a}
    function addMessage(m){if(seen.has(m.id))return;seen.add(m.id);$('empty')?.remove();const d=new Date(m.created_at),dk=dayKey(d);if(dk!==lastDay){lastDay=dk;const sep=document.createElement('div');sep.className='day';sep.textContent=dayLabel(d);$('log').append(sep)}const mine=m.employee_id===meId,row=document.createElement('article');row.className='row '+(mine?'mine':'other');const who=document.createElement('div');who.className='who';who.textContent=mine?'أنا':(m.author_name||'موظفة');if(m.author_role){const r=document.createElement('span');r.textContent=m.author_role;who.append(r)}const bubble=document.createElement('div');bubble.className='bubble';if(m.body)bubble.textContent=m.body;const att=attachment(m);if(att)bubble.append(att);if(mine){const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='حذف';del.onclick=async()=>{del.disabled=true;try{await api('chat_delete',{id:m.id});row.remove()}catch{del.disabled=false;showState('تعذر حذف الرسالة. حاولي مرة أخرى.')}};bubble.append(del)}const t=document.createElement('div');t.className='time';t.textContent=timeLabel(d);row.append(who,bubble,t);$('log').append(row)}
    const atBottom=()=>{const l=$('log');return l.scrollHeight-l.scrollTop-l.clientHeight<100};
    const toBottom=()=>{$('log').scrollTop=$('log').scrollHeight};
    async function tick(){const stick=atBottom();try{const d=await api('chat_list',lastTs?{since:lastTs}:{});meId=d.me;$('meName').textContent=d.my_name||'موظفة';$('meRole').textContent=d.my_role||'';if(d.limits)limits=d.limits;for(const m of d.messages||[]){addMessage(m);lastTs=m.created_at}if(stick)toBottom();showState('')}catch(e){if(e.code==='session_required'){stop();clearToken();showGate(true);$('loginError').textContent='انتهت الجلسة. سجّلي الدخول من جديد.'}else showState('الاتصال متعثر. ستتم إعادة المحاولة تلقائيًا.')}}
    function start(){if(!timer){tick();timer=setInterval(tick,3000)}}function stop(){if(timer){clearInterval(timer);timer=null}}
    $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;$('loginError').textContent='';try{const d=await api('login',{name:$('loginName').value.trim(),pin:$('loginPin').value.trim()},false);saveToken(d.token);showGate(false);seen.clear();lastTs='';lastDay='';meId=d.employee?.employee_id||'';$('meName').textContent=d.employee?.short_name||d.employee?.full_name||'موظفة';$('meRole').textContent=d.employee?.role||'';start()}catch(err){const map={invalid_login:'الاسم أو رمز الدخول غير صحيح.',pin_not_issued:'لم يصدر رمز دخول لهذا الحساب بعد.',temporarily_locked:'تم إيقاف المحاولة مؤقتًا. حاولي لاحقًا.'};$('loginError').textContent=map[err.code]||'تعذر تسجيل الدخول الآن.'}finally{btn.disabled=false}});
    $('logout').onclick=async()=>{try{await api('logout')}catch{}stop();clearToken();showGate(true);$('loginPin').value='';$('loginError').textContent=''};
    function renderPending(){const p=$('pending');p.classList.toggle('on',!!pending);if(pending){$('fileName').textContent=pending.name;$('fileSize').textContent=human(pending.size)}}
    function takeFile(f){if(!f)return;const cap=limits[f.type];if(!cap)return showState('نوع الملف غير مسموح. اختاري صورة أو فيديو أو ملف PDF.');if(f.size>cap*MB)return showState('حجم الملف أكبر من الحد المسموح: '+cap+' م.ب.');pending=f;renderPending();showState('')}
    $('attach').onclick=()=>$('file').click();$('file').onchange=e=>takeFile(e.target.files?.[0]);$('removeFile').onclick=()=>{pending=null;$('file').value='';renderPending()};
    function progress(v){$('progress').classList.toggle('on',v!==null);$('progressFill').style.width=(v||0)+'%'}
    function upload(url,file){return new Promise((ok,bad)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('content-type',file.type);x.upload.onprogress=e=>{if(e.lengthComputable)progress(Math.round(e.loaded/e.total*100))};x.onload=()=>x.status>=200&&x.status<300?ok():bad(new Error('upload_failed'));x.onerror=()=>bad(new Error('upload_failed'));x.send(file)})}
    const box=$('message');function grow(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,130)+'px'}box.oninput=grow;box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('send').onclick=send;
    async function send(){const body=box.value.trim(),file=pending;if(busy||(!body&&!file))return;busy=true;$('send').disabled=$('attach').disabled=true;const saved=box.value;box.value='';grow();try{let extra={body};if(file){const init=await api('chat_attach_init',{name:file.name,mime:file.type,size:file.size});progress(0);await upload(init.upload_url,file);progress(null);extra={body,file_path:init.path,file_name:file.name,file_mime:file.type,file_size:file.size}}const d=await api('chat_send',extra);pending=null;$('file').value='';renderPending();if(d.message){addMessage(d.message);lastTs=d.message.created_at}toBottom();showState('')}catch(e){box.value=saved;grow();progress(null);const map={too_large:'الملف أكبر من الحد المسموح.',type_not_allowed:'نوع الملف غير مسموح.',upload_failed:'تعذر رفع الملف. حاولي مرة أخرى.'};showState(map[e.code]||'لم تصل الرسالة. النص والمرفق ما زالا محفوظين.')}finally{busy=false;$('send').disabled=$('attach').disabled=false;box.focus()}}
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(token()&&!$('gate').classList.contains('hidden')){}else if(token())start()});
    if(token()){showGate(false);start()}else showGate(true);
  })();
  </script>
</body>
</html>
