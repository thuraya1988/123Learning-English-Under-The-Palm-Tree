<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Learn English Under The Palm Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('cover.jpeg') center center / cover no-repeat;
    }

    .content {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.2s 0.5s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .sub-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      letter-spacing: 0.3em;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #000;
      margin: 12px auto;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 600;
      color: #000;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .year-tag {
      font-style: italic;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #000;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      color: #000;
      font-style: italic;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .palm-icons {
      display: grid;
      grid-template-columns: repeat(2, minmax(230px, 1fr));
      gap: 14px 22px;
      margin: 20px auto 0;
      width: fit-content;
    }

    .palm-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      text-decoration: none;
      color: #000;
      min-height: 64px;
      min-width: 280px;
      padding: 8px 12px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .palm-item:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .palm {
      font-size: 4rem;
      line-height: 1;
      filter: grayscale(1) brightness(0);
      display: block;
      cursor: pointer;
      text-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      transition: transform 180ms ease;
    }

    .palm-item:hover .palm {
      transform: scale(1.08);
    }

    .palm-text {
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="scene">
  <div class="content">
    <p class="sub-label">An Educational Journey</p>
    <div class="divider"></div>
    <h1 class="title">Let's Learn English<br/>Under The Palm Tree</h1>
    <p class="year-tag">From 1973 to 2027</p>
    <p class="tagline">Stories that might happen<br/>in Thuraya's deep mind</p>

    <div class="palm-icons">
      <a class="palm-item" href="THEPALM1973.html" onclick="playSound()"><span class="palm">🌴</span><span class="palm-text"><strong>The Palm Stories</strong></span></a>
      <a class="palm-item" href="palm_characters_v2.html" onclick="playSound()"><span class="palm">🌴</span><span class="palm-text"><strong>The Palm characters</strong></span></a>
      <a class="palm-item" href="palmtreeaactivities.html" onclick="playSound()"><span class="palm">🌴</span><span class="palm-text"><strong>The Palm challenges</strong></span></a>
      <a class="palm-item" href="palmtreegames.html" onclick="playSound()"><span class="palm">🌴</span><span class="palm-text"><strong>The Palm Games</strong></span></a>
      <a class="palm-item" href="#" onclick="playSound()"><span class="palm">🌴</span></a>
      <a class="palm-item" href="#" onclick="playSound()"><span class="palm">🌴</span></a>
    </div>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>

<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
  function playSound() {
    const clickAudio = document.getElementById('click-sfx');
    if (clickAudio) {
      clickAudio.currentTime = 0;
      clickAudio.play().catch(() => {});
      return;
    }

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  }
</script>

</body>
</html>
