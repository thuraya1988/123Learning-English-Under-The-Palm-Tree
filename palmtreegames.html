<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Palm Tree Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; min-height:100%;
      font-family:'Cormorant Garamond',serif;
      background: url('cover.jpeg') center/cover fixed no-repeat;
    }

    body::before {
      content:''; position:fixed; inset:0;
      background:rgba(255,255,255,0.15);
      pointer-events:none;
    }

    .back-btn {
      position:fixed; top:16px; right:16px; z-index:9999;
      display:flex; align-items:center; gap:8px;
      background:rgba(255,255,255,0.28);
      backdrop-filter:blur(10px);
      border:1.5px solid rgba(255,255,255,0.6);
      border-radius:50px;
      padding:8px 18px 8px 12px;
      font-family:'Cinzel',serif;
      font-size:13px; font-weight:700; color:#3a2206;
      cursor:pointer; text-decoration:none;
      box-shadow:0 4px 16px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.7);
      transition:transform .15s;
    }
    .back-btn:hover { transform:translateY(-2px); }
    .back-btn img { width:26px; height:26px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

    .scene {
      position:relative; z-index:1;
      width:100%; min-height:100vh;
      display:flex; align-items:flex-start;
      justify-content:center;
      padding:36px 20px 48px;
    }

    .main-arch {
      width:min(1100px,96vw);
      background:rgba(255,255,255,0.12);
      border:1.8px solid rgba(255,255,255,0.38);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border-radius:220px 220px 36px 36px;
      padding:48px 36px 40px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.14),
        inset 0 1px 0 rgba(255,255,255,0.5),
        inset 0 -1px 0 rgba(255,255,255,0.15);
      position:relative;
      text-align:center;
    }

    .main-arch::before {
      content:""; position:absolute; inset:14px;
      border-radius:200px 200px 28px 28px;
      border:1px solid rgba(255,255,255,0.22);
      pointer-events:none;
    }

    .arch-header {
      display:flex; flex-direction:column;
      align-items:center; gap:10px;
      margin-bottom:32px;
      position:relative; z-index:2;
    }

    .palm-title-icon {
      width:100px; height:100px;
      object-fit:contain;
      filter:
        drop-shadow(0 2px 0 #2f6d3a)
        drop-shadow(0 4px 0 #24552d)
        drop-shadow(0 8px 18px rgba(0,0,0,0.28));
      animation: palmBob 3s ease-in-out infinite;
    }
    @keyframes palmBob {
      0%,100% { transform: scale(1) rotate(-2deg); }
      50%      { transform: scale(1.07) rotate(2deg); }
    }

    .sub-label {
      font-family:'Cinzel',serif;
      font-size:clamp(.6rem,1.4vw,.75rem);
      letter-spacing:.3em; color:#000;
      text-transform:uppercase;
    }

    .divider { width:56px; height:1px; background:#000; margin:6px auto; }

    .page-title {
      font-family:'Cinzel',serif;
      font-size:clamp(1.4rem,4vw,2.2rem);
      font-weight:600; color:#000;
      line-height:1.3;
    }

    .games-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
      position:relative; z-index:2;
    }

    .game-arch { display:flex; flex-direction:column; align-items:center; gap:10px; }

    .game-arch-card {
      width:100%;
      background:rgba(255,255,255,0.15);
      border:1.5px solid rgba(255,255,255,0.42);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
      border-radius:120px 120px 20px 20px;
      padding:28px 16px 20px;
      box-shadow:
        0 10px 28px rgba(0,0,0,0.10),
        inset 0 1px 0 rgba(255,255,255,0.45);
      display:flex; flex-direction:column;
      align-items:center; gap:12px;
      text-decoration:none; color:#111;
      transition:transform .18s, box-shadow .18s;
      position:relative;
    }

    .game-arch-card::before {
      content:""; position:absolute; inset:8px;
      border-radius:110px 110px 14px 14px;
      border:1px solid rgba(255,255,255,0.20);
      pointer-events:none;
    }

    .game-arch-card:hover {
      transform:translateY(-4px) scale(1.02);
      box-shadow:0 18px 38px rgba(0,0,0,0.16),inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .game-palm-img {
      width:60px; height:60px;
      object-fit:contain;
      filter:drop-shadow(0 3px 8px rgba(0,0,0,0.22));
      transition: transform .2s;
    }
    .game-arch-card:hover .game-palm-img { transform: scale(1.12) rotate(5deg); }

    .game-name {
      font-family:'Cinzel',serif;
      font-size:clamp(.78rem,1.5vw,.92rem);
      font-weight:600; color:#111;
      text-align:center; line-height:1.5;
      letter-spacing:.03em;
    }

    @media(max-width:600px) {
      .main-arch { border-radius:100px 100px 24px 24px; padding:36px 16px 30px; }
      .main-arch::before { border-radius:90px 90px 18px 18px; }
    }
  </style>
</head>
<body>

<!-- Back Button -->
<a class="back-btn" href="index.html" onclick="playClick()">
  <img src="palmtreeicon.png" alt="palm" onerror="this.style.display='none'">
  ← Back
</a>

<div class="scene">

          <span class="game-name">Write with Palm<br/>Give your charm</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="tweetpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Tweet with<br/>Palm Tree</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="grammarpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Play Grammar<br/>Under the Palm Tree</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="boardpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Board Game<br/>The Palm</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="memorypalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Memory Games<br/>The Palm</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="wordhuntpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Word Hunt<br/>The Palm Tree</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="crosspalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Palm Tree<br/>Crossword</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="fill palm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Fill the Story<br/>Game</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="oddpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Odd One Out<br/>Game</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="khootpalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Kahoot<br/>The Palm</span>
        </a>
      </div>

      <div class="game-arch">
        <a class="game-arch-card" href="scramblepalm.html" onclick="playClick()">
          <img class="game-palm-img" src="palmtreeicon.png" alt="🌴" onerror="this.outerHTML='<span style=font-size:40px>🌴</span>'">
          <span class="game-name">Scramble<br/>Pumble</span>
        </a>
      </div>

    </div>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>
<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
  function playClick() {
    const a = document.getElementById('click-sfx');
    if (!a) return;
    a.currentTime = 0;
    a.play().catch(() => {});
  }
</script>
<script src="sound.js"></script>
</body>
</html>
