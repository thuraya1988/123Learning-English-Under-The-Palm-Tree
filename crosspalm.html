<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Palm Tree Crossword</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --green:#2d9e62; --greenl:#e8fdf2; --greenb:#7dd4a8;
  --blue:#2878c4;  --bluel:#e6f4ff;  --blueb:#7ac0f0;
  --gold:#d08000;  --goldl:#fff4e0;  --goldb:#f0c060;
  --purple:#7040c0;--purplel:#f2ecff;--purpleb:#b090e0;
  --ink:#1a2030;   --bg:#f0f7ff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Nunito',sans-serif;min-height:100vh;padding:14px 14px 60px}

/* HEADER */
.header{background:linear-gradient(135deg,var(–green),var(–blue));border-radius:22px;padding:18px 20px;text-align:center;margin-bottom:14px;position:relative}
.header h1{font-family:‘Fredoka One’,cursive;font-size:clamp(1.2rem,4vw,1.8rem);color:white;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.header p{font-size:0.8rem;color:rgba(255,255,255,.82);margin-top:3px}
.back-link{position:absolute;top:12px;left:14px;color:rgba(255,255,255,.8);text-decoration:none;font-size:0.75rem;font-weight:700;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px}

/* SCOREBOARD */
.scoreboard{background:white;border-radius:18px;padding:12px 18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px}
.sc-item{text-align:center}
.sc-val{font-family:‘Fredoka One’,cursive;font-size:1.5rem;line-height:1}
.sc-lbl{font-size:0.62rem;font-weight:800;color:#90a0b8;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sc-div{width:1px;background:#e8eef4}

/* LEVEL PILLS */
.level-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.lvl-btn{padding:9px 20px;border-radius:20px;font-size:0.82rem;font-weight:800;cursor:pointer;border:2.5px solid transparent;transition:all 0.2s;font-family:‘Nunito’,sans-serif}
.lvl-btn.l1{background:var(–greenl);color:var(–green);border-color:var(–greenb)}
.lvl-btn.l2{background:var(–bluel);color:var(–blue);border-color:var(–blueb)}
.lvl-btn.l3{background:var(–goldl);color:var(–gold);border-color:var(–goldb)}
.lvl-btn.active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12);color:white}
.lvl-btn.l1.active{background:var(–green)}
.lvl-btn.l2.active{background:var(–blue)}
.lvl-btn.l3.active{background:var(–gold)}

/* MAIN LAYOUT */
.main{display:grid;grid-template-columns:1fr;gap:14px;max-width:860px;margin:0 auto}
@media(min-width:640px){.main{grid-template-columns:1fr 1fr}}

/* CROSSWORD GRID */
.cw-wrap{background:white;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.cw-grid{display:inline-grid;gap:3px;background:#c8d8e8;padding:3px;border-radius:10px}
.cw-cell{
width:34px;height:34px;
background:white;
border:none;outline:none;
text-align:center;
font-family:‘Nunito’,sans-serif;
font-weight:800;font-size:1rem;
color:var(–ink);
text-transform:uppercase;
cursor:pointer;
border-radius:4px;
position:relative;
caret-color:var(–blue);
transition:background .15s;
}
.cw-cell.black{background:#1a2030;cursor:default;pointer-events:none}
.cw-cell.active{background:var(–bluel);outline:2.5px solid var(–blue)}
.cw-cell.word-highlight{background:#fff4d8}
.cw-cell.correct{background:var(–greenl);color:var(–green)}
.cw-cell.wrong{background:#fff0f0;color:#c04040;animation:shake .3s}
.cw-cell:focus{background:var(–bluel);outline:2.5px solid var(–blue)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Cell number badge */
.cw-cell-num{
position:absolute;top:1px;left:2px;
font-size:8px;font-weight:800;
color:rgba(40,120,196,.7);
line-height:1;pointer-events:none;
font-family:‘Nunito’,sans-serif;
}

/* CLUES PANEL */
.clues-wrap{background:white;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);overflow-y:auto;max-height:500px}
.clues-section{margin-bottom:16px}
.clues-title{font-family:‘Fredoka One’,cursive;font-size:.9rem;color:var(–ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.clue-item{
display:flex;gap:8px;align-items:flex-start;
padding:8px 10px;border-radius:12px;
cursor:pointer;transition:background .15s;
margin-bottom:4px;font-size:.82rem;
border:1.5px solid transparent;
}
.clue-item:hover{background:var(–bluel);border-color:var(–blueb)}
.clue-item.active{background:var(–goldl);border-color:var(–goldb)}
.clue-item.solved{background:var(–greenl);border-color:var(–greenb)}
.clue-num{font-family:‘Fredoka One’,cursive;font-size:.82rem;color:var(–blue);flex-shrink:0;min-width:22px}
.clue-text{color:var(–ink);line-height:1.4}
.clue-text .story-ref{font-size:.68rem;color:#90a0b8;font-style:italic;display:block}

/* CHECK BUTTON */
.btn-check{width:100%;background:linear-gradient(135deg,var(–green),var(–blue));color:white;border:none;font-family:‘Fredoka One’,cursive;font-size:1rem;padding:13px;border-radius:16px;cursor:pointer;box-shadow:0 4px 14px rgba(40,120,196,.2);transition:all .25s;margin-top:10px}
.btn-check:hover{transform:translateY(-2px)}
.btn-hint{width:100%;background:var(–goldl);border:2px solid var(–goldb);color:var(–gold);font-family:‘Nunito’,sans-serif;font-weight:800;font-size:.85rem;padding:10px;border-radius:14px;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-hint:hover{background:var(–gold);color:white}
.btn-clear{width:100%;background:#f0f4f8;border:none;color:#7090a8;font-family:‘Nunito’,sans-serif;font-weight:700;font-size:.82rem;padding:9px;border-radius:14px;cursor:pointer;margin-top:6px}

/* FEEDBACK */
.fb-bar{background:white;border-radius:14px;padding:10px 16px;text-align:center;font-weight:700;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:10px;border:2px solid #e0eaf4;color:#7090a8;transition:all .3s}
.fb-bar.ok{background:var(–greenl);border-color:var(–greenb);color:var(–green)}
.fb-bar.no{background:#fff0f0;border-color:#f09090;color:#c04040}

/* WIN OVERLAY */
#winOverlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
#winOverlay.show{display:flex}
.win-card{background:white;border-radius:26px;padding:36px 28px;text-align:center;width:100%;max-width:380px;animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-palm{font-size:3.5rem;animation:sway 4s ease-in-out infinite;display:block;margin-bottom:8px}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.win-title{font-family:‘Fredoka One’,cursive;font-size:1.8rem;color:var(–green);margin-bottom:6px}
.win-score{font-family:‘Fredoka One’,cursive;font-size:2.8rem;color:var(–blue);margin:8px 0}
.win-msg{font-size:.9rem;color:#5080a0;font-style:italic;margin-bottom:20px;line-height:1.6}
.btn-again{background:linear-gradient(135deg,var(–green),var(–blue));color:white;border:none;font-family:‘Nunito’,sans-serif;font-weight:800;font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;box-shadow:0 4px 16px rgba(40,120,196,.28);transition:all .25s;margin:4px}
.btn-again:hover{transform:translateY(-3px)}

@media(max-width:380px){.cw-cell{width:28px;height:28px;font-size:.85rem}}
</style>

<script src="public/js/palm-globe-fab.js" defer></script>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← Home</a>
  <h1>🧩 Palm Tree Crossword</h1>
  <p>Words from the stories of Al-Qurawashiyah • كلمات القصص</p>
</div>

<div class="scoreboard">
  <div class="sc-item"><div class="sc-val" id="scSolved" style="color:var(--green)">0</div><div class="sc-lbl">Solved</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scScore" style="color:var(--blue)">0</div><div class="sc-lbl">Score</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scHints" style="color:var(--gold)">3</div><div class="sc-lbl">Hints</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scTime" style="color:var(--purple)">0s</div><div class="sc-lbl">Time</div></div>
</div>

<div class="level-row">
  <button class="lvl-btn l1 active" id="lvl1" onclick="startLevel(1)">🌱 Level 1 — Stories 1–4</button>
  <button class="lvl-btn l2"        id="lvl2" onclick="startLevel(2)">🌴 Level 2 — Stories 5–8</button>
  <button class="lvl-btn l3"        id="lvl3" onclick="startLevel(3)">⭐ Level 3 — Stories 9–12</button>
</div>

<div class="main">
  <div class="cw-wrap">
    <div class="cw-grid" id="cwGrid"></div>
    <button class="btn-check" onclick="checkAll()">✅ Check Answers</button>
    <button class="btn-hint"  onclick="useHint()">💡 Hint (3 left)</button>
    <button class="btn-clear" onclick="clearAll()">✕ Clear All</button>
    <div class="fb-bar" id="fbBar">Fill in the crossword then press Check! 🌴</div>
  </div>
  <div class="clues-wrap">
    <div class="clues-section">
      <div class="clues-title">➡️ Across</div>
      <div id="cluesAcross"></div>
    </div>
    <div class="clues-section">
      <div class="clues-title">⬇️ Down</div>
      <div id="cluesDown"></div>
    </div>
  </div>
</div>

<div id="winOverlay">
  <div class="win-card">
    <span class="win-palm">🌴</span>
    <div class="win-title">Crossword Complete!</div>
    <div class="win-score" id="winScore">0 pts</div>
    <div class="win-msg" id="winMsg"></div>
    <button class="btn-again" onclick="startLevel(currentLevel)">🔄 Play Again</button>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--gold),#e06820)" onclick="nextLevel()">Next Level →</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// CROSSWORD DATA
//
// Each level has a list of WORDS placed on a grid.
// Each word has:
//   word    : uppercase string
//   clue    : English clue
//   clueAr  : Arabic clue
//   story   : source story reference
//   row,col : starting position (0-indexed)
//   dir     : 'across' or 'down'
//   number  : clue number
//
// The grid is computed automatically from the word list.
// Grid size: 13×13 for levels 1–2, 15×15 for level 3.
// ══════════════════════════════════════════════════════

const LEVELS = {

  // ── LEVEL 1 — Stories 1–4 ──────────────────────────
  1: {
    size: 13,
    words: [
      // ACROSS
      { word:'FALAJ',      dir:'across', row:0,  col:0,  number:1,  story:'Story 2', clue:'The life artery of Al-Qurawashiyah — carries water to every farm', clueAr:'شريان حياة القرواشية' },
      { word:'TRUST',      dir:'across', row:2,  col:1,  number:4,  story:'Story 4', clue:'What grew slowly between John and his students', clueAr:'ما نما ببطء بين جون وطلابه' },
      { word:'SHADE',      dir:'across', row:4,  col:0,  number:6,  story:'Story 2', clue:'The cool area the palm tree gives on a hot day', clueAr:'الظل الذي تعطيه النخلة' },
      { word:'LESSON',     dir:'across', row:6,  col:1,  number:9,  story:'Story 3', clue:'The first one happened under a palm tree', clueAr:'أول واحد منه حدث تحت النخلة' },
      { word:'NARROW',     dir:'across', row:8,  col:0,  number:11, story:'Story 2', clue:'The path between the mud houses — not wide', clueAr:'الممر بين البيوت الطينية' },
      { word:'CHANGE',     dir:'across', row:10, col:2,  number:13, story:'Story 4', clue:'What happened to the classroom day by day', clueAr:'ما حدث للصف يوماً بعد يوم' },
      // DOWN
      { word:'LETTER',     dir:'down',   row:0,  col:0,  number:1,  story:'Story 1', clue:'John received one from Oman that changed everything', clueAr:'ما استلمه جون من عُمان' },
      { word:'ARRIVAL',    dir:'down',   row:0,  col:4,  number:2,  story:'Story 1', clue:'Reaching a new place — what John and Sophia experienced', clueAr:'الوصول إلى مكان جديد' },
      { word:'PATIENT',    dir:'down',   row:2,  col:8,  number:5,  story:'Story 4', clue:'John was this — he waited and listened without rushing', clueAr:'صفة جون — انتظر واستمع بدون استعجال' },
      { word:'CURIOUS',    dir:'down',   row:4,  col:3,  number:7,  story:'Story 3', clue:'How the children felt — they wanted to know more', clueAr:'شعور الأطفال — أرادوا معرفة المزيد' },
      { word:'REPEAT',     dir:'down',   row:6,  col:7,  number:10, story:'Story 3', clue:'John said "___  after me" to teach the greeting', clueAr:'ما قاله جون ليعلّم التحية' },
    ]
  },

  // ── LEVEL 2 — Stories 5–8 ──────────────────────────
  2: {
    size: 13,
    words: [
      // ACROSS
      { word:'WASP',       dir:'across', row:0,  col:1,  number:1,  story:'Story 5', clue:'The flying insect that landed on John\'s shoulder', clueAr:'الحشرة الطائرة التي جلست على كتف جون' },
      { word:'BRAVE',      dir:'across', row:2,  col:0,  number:3,  story:'Story 5', clue:'Mansoor was this when he helped John — not afraid of danger', clueAr:'صفة منصور حين ساعد جون' },
      { word:'RELIEF',     dir:'across', row:4,  col:1,  number:6,  story:'Story 5', clue:'The feeling everyone had when the wasp finally left', clueAr:'شعور الجميع حين طار الدبّور' },
      { word:'BELONG',     dir:'across', row:6,  col:0,  number:8,  story:'Story 6', clue:'To be part of a family or place — "I ___ to my village"', clueAr:'أن تكون جزءاً من مكان أو عائلة' },
      { word:'SAFFRON',    dir:'across', row:8,  col:0,  number:10, story:'Story 7', clue:'The yellow spice that turned Sophia\'s face bright yellow', clueAr:'التوابل الصفراء التي حوّلت وجه صوفيا' },
      { word:'SKILL',      dir:'across', row:10, col:2,  number:12, story:'Story 8', clue:'Sadoo has many of these — climbing, sewing, selling', clueAr:'لدى سادو الكثير منها — تسلق وخياطة وبيع' },
      // DOWN
      { word:'FREEZE',     dir:'down',   row:0,  col:5,  number:2,  story:'Story 5', clue:'What everyone did when the wasp appeared — stopped moving', clueAr:'ما فعله الجميع حين ظهر الدبّور' },
      { word:'TRADITION',  dir:'down',   row:0,  col:9,  number:3,  story:'Story 6', clue:'Something done for a long time — like Omani names', clueAr:'شيء يُفعل منذ زمن طويل كالأسماء العُمانية' },
      { word:'IDENTITY',   dir:'down',   row:2,  col:3,  number:5,  story:'Story 6', clue:'Who you are — your name carries your ___', clueAr:'من أنت — اسمك يحمل هويتك' },
      { word:'HARVEST',    dir:'down',   row:4,  col:7,  number:7,  story:'Story 8', clue:'Sadoo climbed the palm tree to do this — collect the dates', clueAr:'سادو تسلّق النخلة ليفعل هذا — يجمع الرطب' },
      { word:'CALM',       dir:'down',   row:6,  col:1,  number:9,  story:'Story 7', clue:'How Marhoona stayed when Sophia\'s face turned yellow', clueAr:'كيف بقيت مرهونة حين اصفرّ وجه صوفيا' },
    ]
  },

  // ── LEVEL 3 — Stories 9–12 ──────────────────────────
  3: {
    size: 15,
    words: [
      // ACROSS
      { word:'WONDER',     dir:'across', row:0,  col:0,  number:1,  story:'Story 9',  clue:'The feeling on the students\' faces when they saw their photos', clueAr:'شعور الطلاب حين رأوا صورهم' },
      { word:'WISDOM',     dir:'across', row:2,  col:2,  number:3,  story:'Story 10', clue:'Shayb Khalaf had deep ___ — he understood what others didn\'t', clueAr:'لدى الشيب خلف حكمة عميقة' },
      { word:'HUMBLE',     dir:'across', row:4,  col:0,  number:5,  story:'Story 10', clue:'Modest, not showing off — like Khalaf who never boasted', clueAr:'متواضع — مثل خلف الذي لا يتباهى' },
      { word:'ABILITY',    dir:'across', row:6,  col:1,  number:7,  story:'Story 11', clue:'Something you can do — Khamees had the ___ to watch and learn', clueAr:'شيء تستطيع فعله — لدى خميس هذه في المراقبة' },
      { word:'LISTEN',     dir:'across', row:8,  col:0,  number:9,  story:'Story 11', clue:'What Khamees did better than anyone — hear carefully', clueAr:'ما فعله خميس أفضل من الجميع — الإنصات' },
      { word:'PRACTICE',   dir:'across', row:10, col:1,  number:11, story:'Story 12', clue:'Khamees did this every morning — doing again to improve', clueAr:'ما فعله خميس كل صباح ليتحسن' },
      { word:'INSPIRE',    dir:'across', row:12, col:2,  number:13, story:'Story 12', clue:'What Khamees did to Mansoor — made him want to try harder', clueAr:'ما فعله خميس لمنصور — جعله يريد المحاولة' },
      // DOWN
      { word:'MEMORY',     dir:'down',   row:0,  col:6,  number:2,  story:'Story 9',  clue:'The camera created this — something from the past we keep', clueAr:'الكاميرا صنعت هذا — شيء من الماضي نحتفظ به' },
      { word:'OBSERVE',    dir:'down',   row:0,  col:10, number:2,  story:'Story 11', clue:'To watch very carefully — what Khamees did every day', clueAr:'أن تراقب بعناية شديدة — ما فعله خميس كل يوم' },
      { word:'HESITATE',   dir:'down',   row:2,  col:4,  number:4,  story:'Story 11', clue:'To pause before doing something — Khamees did this before speaking', clueAr:'التردد قبل الفعل — ما فعله خميس قبل الكلام' },
      { word:'IMPROVE',    dir:'down',   row:4,  col:8,  number:6,  story:'Story 12', clue:'To get better — Khamees\'s reading ___ every single day', clueAr:'أن تتحسن — قراءة خميس تحسّنت كل يوم' },
      { word:'CONFIDENT',  dir:'down',   row:6,  col:2,  number:8,  story:'Story 12', clue:'Sure of yourself — Khamees became this after his first sentence', clueAr:'واثق من نفسه — صار خميس كذلك بعد أول جملة' },
    ]
  }
};

// ── STATE ──
let currentLevel = 1;
let gridData = [];       // 2D: {letter, inputEl, black}
let wordList = [];       // active word objects with .cells
let solvedWords = new Set();
let score = 0;
let hintsLeft = 3;
let timerSec = 0;
let timerID = null;
let activeWord = null;   // currently highlighted word

// ── START ──
function startLevel(lvl) {
  currentLevel = lvl;
  [1,2,3].forEach(i => document.getElementById('lvl'+i).classList.toggle('active', i===lvl));

  solvedWords.clear();
  score = 0; hintsLeft = 3; timerSec = 0; activeWord = null;
  clearInterval(timerID);
  document.getElementById('scHints').textContent = hintsLeft;
  document.querySelector('.btn-hint').textContent = `💡 Hint (${hintsLeft} left)`;

  buildCrossword(LEVELS[lvl]);
  updateScoreboard();
  setFb('idle','Fill in the crossword then press Check! 🌴');

  timerID = setInterval(() => {
    timerSec++;
    document.getElementById('scTime').textContent = timerSec + 's';
  }, 1000);
}

// ── BUILD ──
function buildCrossword(data) {
  const SZ = data.size;

  // Init empty grid
  gridData = Array.from({length:SZ}, () =>
    Array.from({length:SZ}, () => ({letter:'', black:true, inputEl:null, wordIds:[]}))
  );

  // Place words
  wordList = data.words.map((w, wi) => {
    const cells = [];
    for (let i = 0; i < w.word.length; i++) {
      const r = w.dir === 'across' ? w.row : w.row + i;
      const c = w.dir === 'across' ? w.col + i : w.col;
      if (r < SZ && c < SZ) {
        gridData[r][c].black = false;
        gridData[r][c].letter = w.word[i];
        gridData[r][c].wordIds.push(wi);
        cells.push({r,c});
      }
    }
    return {...w, id:wi, cells, solved:false};
  });

  // Render grid
  const container = document.getElementById('cwGrid');
  container.style.gridTemplateColumns = `repeat(${SZ}, 1fr)`;
  container.innerHTML = '';

  for (let r = 0; r < SZ; r++) {
    for (let c = 0; c < SZ; c++) {
      const cell = gridData[r][c];
      const td = document.createElement('input');
      td.type = 'text';
      td.maxLength = 1;
      td.className = 'cw-cell' + (cell.black ? ' black' : '');
      td.dataset.r = r; td.dataset.c = c;
      if (cell.black) td.disabled = true;

      // Number badge
      const wStart = wordList.find(w => w.cells[0].r===r && w.cells[0].c===c);
      if (wStart) {
        // We add the number as a visual overlay using CSS ::before trick via a wrapper div
        // Instead, we'll use placeholder trick: show number briefly
        td.title = wStart.number + (wStart.dir==='across'?'→':'↓');
        // Add data attribute for number display
        td.dataset.num = wStart.number + (wStart.dir==='across'?'A':'D');
      }

      if (!cell.black) {
        td.addEventListener('focus', () => onCellFocus(r,c));
        td.addEventListener('input', e => onCellInput(e, r, c));
        td.addEventListener('keydown', e => onCellKey(e, r, c));
      }
      cell.inputEl = td;
      container.appendChild(td);
    }
  }

  // Add number overlays
  wordList.forEach(w => {
    const {r,c} = w.cells[0];
    const cell = gridData[r][c];
    if (cell.inputEl) {
      // Create a number badge as a sibling overlay
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;display:contents';
      const badge = document.createElement('span');
      badge.className = 'cw-cell-num';
      badge.textContent = w.number;
      badge.style.cssText = `position:absolute;top:1px;left:2px;font-size:8px;font-weight:800;color:rgba(40,120,196,.65);pointer-events:none;z-index:5;line-height:1`;
      // Attach badge directly to input via a parent container trick
      // We'll use the grid container and absolute positioning
      cell.inputEl.style.position = 'relative';
      // Simplest: set a data attribute and let CSS show it via ::before is complex.
      // Use placeholder workaround:
      if (!cell.inputEl.value) {
        cell.inputEl.style.background = `url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><text x='2' y='10' font-size='9' font-weight='bold' fill='rgba(40,120,196,0.55)' font-family='Nunito'>${w.number}</text></svg>") no-repeat`;
        cell.inputEl.style.backgroundSize = '34px 34px';
      }
    }
  });

  // Render clues
  renderClues();
}

function renderClues() {
  const across = wordList.filter(w => w.dir==='across').sort((a,b)=>a.number-b.number);
  const down   = wordList.filter(w => w.dir==='down').sort((a,b)=>a.number-b.number);

  document.getElementById('cluesAcross').innerHTML = across.map(w => `
    <div class="clue-item" id="clue-${w.id}" onclick="selectWord(${w.id})">
      <span class="clue-num">${w.number}</span>
      <span class="clue-text">${w.clue} <span class="story-ref">${w.story} • ${w.clueAr}</span></span>
    </div>`).join('');

  document.getElementById('cluesDown').innerHTML = down.map(w => `
    <div class="clue-item" id="clue-${w.id}" onclick="selectWord(${w.id})">
      <span class="clue-num">${w.number}</span>
      <span class="clue-text">${w.clue} <span class="story-ref">${w.story} • ${w.clueAr}</span></span>
    </div>`).join('');
}

// ── CELL INTERACTIONS ──
function onCellFocus(r,c) {
  const cell = gridData[r][c];
  if (cell.black) return;
  // Find which word to activate (prefer across, then down)
  const wid = cell.wordIds[0];
  if (wid !== undefined) selectWord(wid);
}

function onCellInput(e, r, c) {
  const val = e.target.value.replace(/[^a-zA-Z]/g,'').toUpperCase();
  e.target.value = val.slice(-1); // only last char
  // Remove number background once user types
  e.target.style.background = '';
  if (val) moveToNext(r,c);
}

function onCellKey(e, r, c) {
  if (e.key === 'Backspace' && !gridData[r][c].inputEl.value) {
    moveToPrev(r,c);
  }
  if (e.key === 'ArrowRight') moveToNext(r,c,'across');
  if (e.key === 'ArrowDown')  moveToNext(r,c,'down');
  if (e.key === 'ArrowLeft')  moveToPrev(r,c,'across');
  if (e.key === 'ArrowUp')    moveToPrev(r,c,'down');
}

function moveToNext(r,c, preferDir) {
  if (!activeWord) return;
  const dir = preferDir || activeWord.dir;
  const nr = dir==='down' ? r+1 : r;
  const nc = dir==='across' ? c+1 : c;
  if (nr < gridData.length && nc < gridData[0].length) {
    const next = gridData[nr][nc];
    if (next && !next.black && next.inputEl) next.inputEl.focus();
  }
}

function moveToPrev(r,c, preferDir) {
  if (!activeWord) return;
  const dir = preferDir || activeWord.dir;
  const nr = dir==='down' ? r-1 : r;
  const nc = dir==='across' ? c-1 : c;
  if (nr >= 0 && nc >= 0) {
    const prev = gridData[nr][nc];
    if (prev && !prev.black && prev.inputEl) prev.inputEl.focus();
  }
}

function selectWord(wid) {
  activeWord = wordList[wid];
  // Clear previous highlights
  document.querySelectorAll('.cw-cell').forEach(c => c.classList.remove('word-highlight','active'));
  // Highlight word cells
  activeWord.cells.forEach(({r,c}) => {
    const el = gridData[r][c].inputEl;
    if (el) el.classList.add('word-highlight');
  });
  // Focus first empty cell of word
  const firstEmpty = activeWord.cells.find(({r,c}) => !gridData[r][c].inputEl.value);
  const target = firstEmpty || activeWord.cells[0];
  gridData[target.r][target.c].inputEl?.focus();
  // Highlight clue
  document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));
  document.getElementById('clue-'+wid)?.classList.add('active');
  document.getElementById('clue-'+wid)?.scrollIntoView({block:'nearest', behavior:'smooth'});
}

// ── CHECK ──
function checkAll() {
  let allSolved = true;
  let newlySolved = 0;

  wordList.forEach(w => {
    if (solvedWords.has(w.id)) return;
    const userWord = w.cells.map(({r,c}) => (gridData[r][c].inputEl.value||'').toUpperCase()).join('');
    if (userWord === w.word) {
      solvedWords.add(w.id);
      w.solved = true;
      newlySolved++;
      score += Math.max(10, 30 - Math.floor(timerSec/10));
      // Mark cells green
      w.cells.forEach(({r,c}) => {
        const el = gridData[r][c].inputEl;
        if (el) { el.classList.add('correct'); el.disabled = true; el.style.background=''; }
      });
      document.getElementById('clue-'+w.id)?.classList.add('solved');
    } else if (userWord.length === w.word.length && userWord.length > 0) {
      // All filled but wrong — mark red briefly
      w.cells.forEach(({r,c}) => {
        const el = gridData[r][c].inputEl;
        if (el && !el.disabled) { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),600); }
      });
      allSolved = false;
    } else {
      allSolved = false;
    }
  });

  updateScoreboard();
  if (allSolved && solvedWords.size === wordList.length) {
    setTimeout(showWin, 600);
  } else if (newlySolved > 0) {
    setFb('ok', `✅ ${newlySolved} word${newlySolved>1?'s':''} correct! Keep going!`);
  } else {
    setFb('no', '❌ Not quite right. Check your spelling and try again.');
  }
}

// ── HINT ──
function useHint() {
  if (hintsLeft <= 0) { setFb('no','No hints left! 🌴'); return; }
  // Find first unsolved word and reveal first letter
  const unsolved = wordList.find(w => !solvedWords.has(w.id));
  if (!unsolved) return;
  const {r,c} = unsolved.cells[0];
  const el = gridData[r][c].inputEl;
  if (el && !el.value) {
    el.value = unsolved.word[0];
    el.style.background = '';
    el.style.color = 'var(--gold)';
  }
  hintsLeft--;
  score = Math.max(0, score - 5);
  document.getElementById('scHints').textContent = hintsLeft;
  document.querySelector('.btn-hint').textContent = `💡 Hint (${hintsLeft} left)`;
  selectWord(unsolved.id);
  setFb('idle', `💡 First letter of "${unsolved.clue.substring(0,30)}…" revealed!`);
  updateScoreboard();
}

// ── CLEAR ──
function clearAll() {
  gridData.forEach(row => row.forEach(cell => {
    if (!cell.black && cell.inputEl && !cell.inputEl.disabled) {
      cell.inputEl.value = '';
      cell.inputEl.style.color = '';
    }
  }));
  setFb('idle','Cleared! Try again 🌴');
}

// ── WIN ──
function showWin() {
  clearInterval(timerID);
  const timeBonus = Math.max(0, 180 - timerSec) * 2;
  const total = score + timeBonus;
  document.getElementById('winScore').textContent = total + ' pts';
  const msg = total >= 300 ? '🌟 Perfect crossword! Palm Tree Vocabulary Master!'
            : total >= 200 ? '🌴 Excellent! Strong vocabulary knowledge!'
            : total >= 100 ? '✦ Good job! Try for a higher score!'
            :                '💪 Completed! Great effort!';
  document.getElementById('winMsg').innerHTML = `${msg}<br><span style="font-size:.8rem;color:#7090a8">Time: ${timerSec}s | Bonus: +${timeBonus}</span>`;
  document.getElementById('winOverlay').classList.add('show');
}

function nextLevel() {
  document.getElementById('winOverlay').classList.remove('show');
  startLevel(currentLevel < 3 ? currentLevel + 1 : 1);
}

// ── HELPERS ──
function updateScoreboard() {
  document.getElementById('scSolved').textContent = solvedWords.size + '/' + wordList.length;
  document.getElementById('scScore').textContent  = score;
}

function setFb(cls, msg) {
  const bar = document.getElementById('fbBar');
  bar.className = 'fb-bar ' + (cls==='idle' ? '' : cls);
  bar.textContent = msg;
}

// ── INIT ──
window.addEventListener('load', () => startLevel(1));
</script>
