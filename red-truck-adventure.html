<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مغامرات الشاحنة الحمراء — بيك أب بال</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/baloo-2@latest/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/baloo-2@latest/800.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#26221f;font-family:'Baloo 2',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none !important}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;pointer-events:none;z-index:5}
  #hud .chip{background:#fff7e6;border:3px solid #26221f;border-radius:14px;padding:4px 12px;font-weight:800;color:#26221f;box-shadow:0 3px 0 #26221f;font-size:15px;line-height:1.2;white-space:nowrap}
  #hudLeft,#hudMid,#hudRight{display:flex;gap:8px;align-items:center}
  #hudMid{flex-wrap:wrap;justify-content:center}
  #hudName{background:#e2542c;color:#fff7e6 !important}
  #hudLevel{background:#4a7fd4;color:#fff7e6 !important}
  #fuelWrap{position:relative;width:110px;height:26px;background:#fff7e6;border:3px solid #26221f;border-radius:12px;overflow:hidden;box-shadow:0 3px 0 #26221f}
  #fuelBar{height:100%;width:100%;background:linear-gradient(90deg,#7fb069,#a5d46a);transition:width .2s}
  #fuelBar.low{background:linear-gradient(90deg,#d94141,#f2a03d)}
  #fuelIcon{position:absolute;right:2px;top:1px;font-size:14px}
  #hudRight{pointer-events:auto}
  .iconBtn{width:42px;height:42px;border-radius:14px;border:3px solid #26221f;background:#fff7e6;font-size:18px;box-shadow:0 3px 0 #26221f;cursor:pointer}
  .iconBtn:active{transform:translateY(3px);box-shadow:none}
  #touchUI{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:14px;z-index:6;pointer-events:none}
  .tGroup{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
  .tBtn{width:74px;height:74px;border-radius:50%;border:4px solid #26221f;background:#fff7e6;font-family:inherit;font-weight:800;font-size:22px;color:#26221f;box-shadow:0 5px 0 #26221f;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
  .tBtn small{font-size:11px;font-weight:800;letter-spacing:0}
  .tBtn:active{transform:translateY(5px);box-shadow:none}
  .tBtn.big{width:96px;height:96px;background:#a5d46a}
  .tBtn.small{width:60px;height:60px;background:#f2a03d}
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(38,34,31,.45);overflow:auto;padding:12px}
  .panel{background:#fff7e6;border:5px solid #26221f;border-radius:26px;box-shadow:0 8px 0 #26221f;padding:16px 20px;width:min(440px,94vw);max-height:94vh;overflow:auto;text-align:center;color:#26221f}
  .panel h1{font-weight:800;font-size:32px;line-height:1.1;color:#e2542c;text-shadow:2px 2px 0 #26221f}
  .panel h1 span{display:block;font-size:14px;color:#26221f;text-shadow:none;letter-spacing:2px;margin-top:4px}
  .panel h2{font-weight:800;font-size:26px;margin-bottom:8px}
  #menuArt{width:150px;border:4px solid #26221f;border-radius:18px;margin:10px auto;display:block;background:#f6e8d4;box-shadow:0 4px 0 #26221f}
  .lbl{display:block;text-align:right;font-weight:800;font-size:12px;letter-spacing:1px;margin:10px 0 4px;opacity:.75}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
  .opt{border:3px solid #26221f;border-radius:12px;background:#fff;padding:6px 10px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #26221f;color:#26221f;font-family:inherit}
  .opt:active{transform:translateY(3px);box-shadow:none}
  .opt.sel{background:#26221f;color:#fff7e6}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid #26221f;cursor:pointer;box-shadow:0 3px 0 #26221f}
  .swatch.sel{outline:4px solid #f2a03d}
  #inpName{width:100%;border:3px solid #26221f;border-radius:12px;padding:8px 12px;font-family:inherit;font-weight:800;font-size:18px;background:#fff;color:#26221f;text-align:center}
  .bigBtn{display:block;width:100%;margin-top:14px;border:4px solid #26221f;border-radius:16px;background:#e2542c;color:#fff7e6;font-family:inherit;font-weight:800;font-size:22px;padding:12px;cursor:pointer;box-shadow:0 6px 0 #26221f}
  .bigBtn:active{transform:translateY(6px);box-shadow:none}
  .midBtn{display:block;width:100%;margin-top:10px;border:3px solid #26221f;border-radius:14px;background:#fff7e6;color:#26221f;font-family:inherit;font-weight:800;font-size:16px;padding:9px;cursor:pointer;box-shadow:0 4px 0 #26221f}
  .midBtn:active{transform:translateY(4px);box-shadow:none}
  .hint{margin-top:12px;font-size:12px;font-weight:700;opacity:.65}
  #bestLine{margin-top:10px;font-weight:800;font-size:15px}
  #overStats{font-weight:800;font-size:18px;margin:8px 0 4px;line-height:1.7}
  #toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) scale(0);background:#26221f;color:#fff7e6;font-weight:800;font-size:16px;padding:8px 20px;border-radius:16px;border:3px solid #fff7e6;z-index:8;transition:transform .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap}
  #toast.show{transform:translateX(-50%) scale(1)}
  #rotHint{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#f2a03d;color:#26221f;border:3px solid #26221f;border-radius:16px;padding:8px 18px;font-weight:800;z-index:9;box-shadow:0 4px 0 #26221f;animation:wig 1.2s infinite;pointer-events:none}
  @keyframes wig{0%,100%{rotate:0deg}25%{rotate:-4deg}75%{rotate:4deg}}
  @media (max-height:480px){ .panel{padding:10px 14px} #menuArt{width:90px;margin:6px auto} .panel h1{font-size:24px} .lbl{margin:6px 0 2px} .bigBtn{margin-top:8px;padding:8px;font-size:18px} }
  @media (max-width:600px){ #hud .chip{font-size:12px;padding:3px 8px} #fuelWrap{width:80px} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>


  <div id="hud" class="hidden">
    <div id="hudLeft">
      <span class="chip" id="hudName">رستي</span>
      <span class="chip" id="hudDist">0 م</span>
      <span class="chip" id="hudLevel">مستوى 1/8</span>
    </div>
    <div id="hudMid">
      <span class="chip" id="hudCoins">🪙 0</span>
      <div id="fuelWrap"><div id="fuelBar"></div><span id="fuelIcon">⛽</span></div>
      <span class="chip" id="hudHearts">❤️❤️❤️</span>
    </div>
    <div id="hudRight">
      <button class="iconBtn" id="btnMute">🔊</button>
      <button class="iconBtn" id="btnPause">⏸</button>
    </div>
  </div>


  <div id="touchUI" class="hidden">
    <div class="tGroup">
      <button class="tBtn" id="btnBrake">🐢<small>فرامل</small></button>
      <button class="tBtn" id="btnGas">🐇<small>بنزين</small></button>
    </div>
    <div class="tGroup">
      <button class="tBtn small" id="btnHorn">📯</button>
      <button class="tBtn big" id="btnJump">⬆<small>قفز</small></button>
    </div>
  </div>


  <div id="menu" class="screen">
    <div class="panel">
      <h1>مغامرات الشاحنة الحمراء<span>رحلة طريق لا تنتهي · ٨ عوالم</span></h1>
      <img id="menuArt" src="https://image.qwenlm.ai/public_source/7272822c-42e9-4264-8d5e-c425b3fe8962/16f5fb030-24b6-4140-9467-216b2b059a2f.png" alt="الشاحنة الحمراء">
      <label class="lbl">اسم الشاحنة</label>
      <input id="inpName" maxlength="10" value="رستي">
      <label class="lbl">اللون</label>
      <div class="row" id="swatches"></div>
      <label class="lbl">قبعة السقف</label>
      <div class="row" id="hats"></div>
      <label class="lbl">الرفيق</label>
      <div class="row" id="buddies"></div>
      <label class="lbl">صوت البوق</label>
      <div class="row" id="horns"></div>
      <button class="bigBtn" id="btnStart">🔑 شغّل المحرك</button>
      <div id="bestLine"></div>
      <div class="hint">لوحة المفاتيح: مسافة/⬆ قفز · ↓ فرامل · D بنزين · H بوق · P إيقاف مؤقت</div>
    </div>
  </div>


  <div id="pauseScr" class="screen hidden">
    <div class="panel">
      <h2>☕ إيقاف مؤقت</h2>
      <button class="bigBtn" id="btnResume">▶ متابعة</button>
      <button class="midBtn" id="btnRestart1">↻ إعادة البدء</button>
      <button class="midBtn" id="btnGarage1">🏠 الكراج</button>
    </div>
  </div>


  <div id="overScr" class="screen hidden">
    <div class="panel">
      <h2 id="overTitle">⛽ نفد الوقود!</h2>
      <div id="overStats"></div>
      <button class="bigBtn" id="btnAgain">🔧 قُد من جديد</button>
      <button class="midBtn" id="btnGarage2">🏠 الكراج</button>
    </div>
  </div>


  <div id="toast"></div>
  <div id="rotHint" class="hidden">📱 لفّ الجهاز للوضع الأفقي</div>
</div>


<script>
(function(){
'use strict';
/* ================= إعداد الشاشة ================= */
var canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
var lightCv=document.createElement('canvas'), lctx=lightCv.getContext('2d');
var W=960,H=540,scaleF=1,dpr=1,groundY=470,roadTop=456,truckX=150;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  var cw=window.innerWidth, ch=window.innerHeight;
  scaleF=ch/540; W=cw/scaleF; H=540;
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  lightCv.width=Math.max(2,Math.round(canvas.width/2)); lightCv.height=Math.max(2,Math.round(canvas.height/2));
  truckX=Math.min(150,W*0.25);
  rotCheck();
}
function isTouch(){return ('ontouchstart' in window)||navigator.maxTouchPoints>0;}
function rotCheck(){
  var el=document.getElementById('rotHint');
  if(isTouch()&&window.innerHeight>window.innerWidth&&state==='RUNNING')el.classList.remove('hidden');
  else el.classList.add('hidden');
}
function tryLandscape(){
  if(!isTouch())return;
  var el=document.documentElement, fsP=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(fsP){try{var p=fsP.call(el);if(p&&p.catch)p.catch(function(){});}catch(e){}}
  if(screen.orientation&&screen.orientation.lock){try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}}
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,80);});


/* ============ الحفظ / التخصيص ============ */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var cfg={name:lsGet('pp_name','رستي'),paint:lsGet('pp_paint','#e2542c'),hat:lsGet('pp_hat','none'),buddy:lsGet('pp_buddy','dog'),horn:lsGet('pp_horn','beep')};
var best=parseInt(lsGet('pp_best','0'),10)||0;


/* ============== ٨ عوالم / مستويات ================= */
var SCENES=[
 {name:'مرج مشمس',sky1:'#7ec8d8',sky2:'#eaf6df',hillF:'#8fbf6f',hillN:'#5f9a4e',road:'#666a6e',line:'#f4f1e6',cloud:'#ffffff',night:0,warm:0,prop:'tree',weather:null,seaA:0,seaCol:'#2fa7c9'},
 {name:'غروب ذهبي',sky1:'#ff8f5e',sky2:'#ffd9a0',hillF:'#b06a8a',hillN:'#7d4f68',road:'#5f5a60',line:'#ffe9c9',cloud:'#ffd9c4',night:0.15,warm:1,prop:'tree',weather:null,seaA:0,seaCol:'#2fa7c9'},
 {name:'ليلة نجماء',sky1:'#0d1733',sky2:'#2a3c62',hillF:'#203052',hillN:'#141f3a',road:'#3c4046',line:'#cfd6e4',cloud:'#3a4a74',night:1,warm:0,prop:'tree',weather:null,seaA:0,seaCol:'#2fa7c9'},
 {name:'فجر الصحراء',sky1:'#f2a65e',sky2:'#ffe3c2',hillF:'#d8a06a',hillN:'#b97f52',road:'#6e645c',line:'#fff2da',cloud:'#ffe9d0',night:0.05,warm:0.7,prop:'cactus',weather:null,seaA:0,seaCol:'#2fa7c9'},
 {name:'تلال الثلج',sky1:'#9fc9e8',sky2:'#eef6fb',hillF:'#dfeaf2',hillN:'#f4f9fd',road:'#5c6066',line:'#ffffff',cloud:'#ffffff',night:0,warm:0,prop:'pine',weather:'snow',seaA:0,seaCol:'#2fa7c9'},
 {name:'عاصفة ممطرة',sky1:'#5a6b85',sky2:'#93a7bd',hillF:'#4e6a52',hillN:'#3a5240',road:'#4a4e55',line:'#dfe6ee',cloud:'#7d8aa0',night:0.35,warm:0,prop:'tree',weather:'rain',seaA:0,seaCol:'#2fa7c9'},
 {name:'شاطئ النخيل',sky1:'#6fd0e0',sky2:'#fdf0d5',hillF:'#f0d9a8',hillN:'#e7c98f',road:'#7a7468',line:'#fff6e0',cloud:'#ffffff',night:0,warm:0.2,prop:'palm',weather:null,seaA:1,seaCol:'#2fa7c9'},
 {name:'مدينة النيون',sky1:'#12002e',sky2:'#3a0f63',hillF:'#1d1140',hillN:'#150a30',road:'#33304a',line:'#8ef2ff',cloud:'#3a2a6a',night:1,warm:0,prop:'building',weather:null,seaA:0,seaCol:'#2fa7c9'}
];
var SCENE_LEN=500;
function hexRgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixc(a,b,t){var A=hexRgb(a),B=hexRgb(b);return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}
function smooth(t){return t*t*(3-2*t);}
function getPalette(d){
  var t=d/SCENE_LEN, i=Math.floor(t), f=t-i, n=SCENES.length;
  var cur=SCENES[((i%n)+n)%n], nxt=SCENES[(((i+1)%n)+n)%n];
  var k=f>0.82?smooth((f-0.82)/0.18):0;
  return {
    idx:((i%n)+n)%n, total:i, f:f,
    sky1:mixc(cur.sky1,nxt.sky1,k), sky2:mixc(cur.sky2,nxt.sky2,k),
    hillF:mixc(cur.hillF,nxt.hillF,k), hillN:mixc(cur.hillN,nxt.hillN,k),
    road:mixc(cur.road,nxt.road,k), line:mixc(cur.line,nxt.line,k),
    cloud:mixc(cur.cloud,nxt.cloud,k), seaCol:mixc(cur.seaCol,nxt.seaCol,k),
    seaA:cur.seaA+(nxt.seaA-cur.seaA)*k, night:cur.night+(nxt.night-cur.night)*k,
    warm:cur.warm+(nxt.warm-cur.warm)*k,
    prop:k<0.5?cur.prop:nxt.prop, weather:k<0.5?cur.weather:nxt.weather
  };
}
var FUN_SIGNS=['بوق إذا كنت تحب الجبن','احذر: سلحفاة تعبر','قهوة مجانية بعد ١ كم','أفضل شاورما أمامك','ابتسم أنت في الكاميرا','ممنوع الزعيط هنا','جمّل يومك ببوق!'];


/* ============== الحالة ================= */
var state='MENU';
var worldX=0, dist=0, menuDist=0, speed=0, jumpY=0, vy=0, onGround=true;
var fuel=100, hearts=3, coins=0, score=0;
var invT=0, crashT=0, slipT=0, turboT=0, squashT=0, coyote=0, jumpBuf=0, hornCd=0, exhaustT=0, shakeT=0, flash=0, lightT=5, ambT=3;
var wheelAng=0, blinkT=0, tonguePh=0, timeSec=0;
var obstacles=[], pickups=[], particles=[], props=[], clouds=[], stars=[], flies=[], wx=[];
var spawnT=2, coinT=1.5, fuelT=9, propX=0, lastScene=-1, bubble=null;
var input={gas:false,brake:false};
var ci;
for(ci=0;ci<7;ci++)clouds.push({x:Math.random()*1400,y:40+Math.random()*140,s:0.6+Math.random()*0.9,v:6+Math.random()*10});
for(ci=0;ci<90;ci++)stars.push({x:Math.random(),y:Math.random()*0.55,p:Math.random()*6});
for(ci=0;ci<14;ci++)flies.push({x:Math.random(),y:0.6+Math.random()*0.3,p:Math.random()*6,q:Math.random()*6});


/* ============== صوت أكبر وأغنى ================= */
var AC=null, master=null, muted=lsGet('pp_mute','0')==='1';
var engOsc=null, engOsc2=null, engGain=null, engFil=null;
var ambSrc=null, ambGain=null, ambFil=null;
var musicNext=0, musicStep=0;
var MEL=[392,440,494,523,587,523,494,440,392,440,494,587,659,587,523,494];
var BAS=[98,0,123,0,147,0,123,0,98,0,123,0,165,0,147,0];
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createDynamicsCompressor();master.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay){
  if(muted)return; var a=ac(); if(!a)return;
  var t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(vol||0.12,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur,vol,freq,type){
  if(muted)return; var a=ac(); if(!a)return;
  var len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type=type||'lowpass'; f.frequency.value=freq; g.gain.value=vol;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(master); s.start();
}
function startEngine(){
  var a=ac(); if(!a||engOsc)return;
  engOsc=a.createOscillator(); engOsc2=a.createOscillator(); engGain=a.createGain(); engFil=a.createBiquadFilter();
  engOsc.type='sawtooth'; engOsc2.type='square'; engFil.type='lowpass'; engFil.frequency.value=420; engGain.gain.value=0;
  engOsc.connect(engFil); engOsc2.connect(engFil); engFil.connect(engGain); engGain.connect(master);
  engOsc.start(); engOsc2.start();
  ambSrc=a.createBufferSource(); ambGain=a.createGain(); ambFil=a.createBiquadFilter();
  var len=a.sampleRate*2, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  ambSrc.buffer=buf; ambSrc.loop=true; ambGain.gain.value=0; ambFil.type='lowpass'; ambFil.frequency.value=300;
  ambSrc.connect(ambFil); ambFil.connect(ambGain); ambGain.connect(master); ambSrc.start();
  musicNext=a.currentTime+0.2; musicStep=0;
}
function stopEngine(){ if(engOsc){try{engOsc.stop();engOsc2.stop();ambSrc.stop();}catch(e){} engOsc=null;ambSrc=null;} }
function engineTick(pal){
  if(engOsc&&engGain){
    var g=(state==='RUNNING'&&!muted)?0.05+speed/7000:0;
    engGain.gain.value+=(g-engGain.gain.value)*0.1;
    engOsc.frequency.value=50+speed*0.13; engOsc2.frequency.value=(50+speed*0.13)/2;
  }
  if(ambGain&&ambFil&&pal){
    var tg=0, tf=300;
    if(state==='RUNNING'){
      if(pal.weather==='rain'){tg=0.14;tf=1600;}
      else if(pal.prop==='cactus'){tg=0.06;tf=320;}
      else if(pal.weather==='snow'){tg=0.03;tf=250;}
    }
    ambGain.gain.value+=(tg-(muted?0:tg)+ (muted?0:0))*0.05; ambGain.gain.value+=( (muted?0:tg) - ambGain.gain.value)*0.08;
    ambFil.frequency.value+=(tf-ambFil.frequency.value)*0.05;
  }
  /* موسيقى خلفية مرحة */
  if(AC&&!muted&&state==='RUNNING'){
    while(musicNext<AC.currentTime+0.35){
      var st=musicStep%16, t0=musicNext-AC.currentTime;
      tone(MEL[st],MEL[st],0.2,'triangle',0.05,t0>0?t0:0);
      if(BAS[st])tone(BAS[st],BAS[st],0.22,'sine',0.08,t0>0?t0:0);
      if(st%4===2)noiseBurst(0.03,0.02,6000,'highpass');

/* ============== تحديث ============== */
function update(dt){
  timeSec+=dt;
  if(hornCd>0)hornCd-=dt;
  if(bubble){bubble.t+=dt;if(bubble.t>bubble.life)bubble=null;}
  blinkT-=dt; if(blinkT<-0.13)blinkT=1.5+Math.random()*3;
  tonguePh+=dt*10;
  if(flash>0)flash-=dt*2;


  if(state==='MENU'){ menuDist+=dt*10; worldX+=60*dt; speed=60; updateParticles(dt); updateProps(dt,60); updateWeather(dt,getPalette(menuDist)); return; }
  if(state!=='RUNNING'){ updateParticles(dt); return; }


  var target=340+Math.min(260,dist*0.22)+Math.floor(dist/(SCENE_LEN*8))*40;
  if(input.gas)target=560; if(input.brake)target=210;
  if(turboT>0)target=780;
  if(slipT>0)target=Math.min(target,240);
  if(crashT>0)target=140;
  speed+=(target-speed)*Math.min(1,dt*3);
  worldX+=speed*dt; dist+=speed*dt/50;


  var pal=getPalette(dist);
  if(pal.idx!==lastScene){
    if(lastScene!==-1){
      if(pal.idx===0)showToast('🔥 جولة '+((pal.total)/8+1)+' — صعوبة أعلى!');
      else showToast('🗺️ المستوى '+(pal.idx+1)+'/8: '+SCENES[pal.idx].name);
      sfx('level');
    }
    lastScene=pal.idx;
  }
  $('hudLevel').textContent='مستوى '+(pal.idx+1)+'/8';


  fuel-=dt*(1.5+speed/500);
  if(fuel<=0){fuel=0;gameOver('fuel');return;}


  coyote=onGround?0.1:coyote-dt;
  jumpBuf-=dt;
  if(jumpBuf>0&&coyote>0){vy=-560;onGround=false;jumpY=-1;coyote=0;jumpBuf=0;squashT=0;sfx('jump');dust(6);
    if(Math.random()<0.25)bubble={text:Math.random()<0.5?'يا هوو!':'قفزة!',t:0,life:1};}
  if(!onGround){vy+=1500*dt;jumpY+=vy*dt;
    if(jumpY>=0){jumpY=0;vy=0;onGround=true;squashT=0.18;sfx('land');dust(10);}
  }
  if(squashT>0)squashT-=dt;
  if(invT>0)invT-=dt; if(crashT>0)crashT-=dt; if(slipT>0)slipT-=dt; if(turboT>0)turboT-=dt; if(shakeT>0)shakeT-=dt;
  wheelAng+=speed*dt/27;


  exhaustT-=dt;
  if(exhaustT<=0){exhaustT=0.07;
    particles.push({x:truckX+2,y:groundY+jumpY-14,vx:-speed*0.35-40+rnd(-20,20),vy:rnd(-50,-10),life:rnd(0.5,0.9),t:0,size:rnd(4,8),col:'smoke',grav:0});}


  /* برق في المطر */
  if(pal.weather==='rain'){lightT-=dt;if(lightT<=0){lightT=rnd(4,9);flash=0.6;sfx('thunder');}}


  spawnT-=dt*(speed/340);
  if(spawnT<=0){spawnObstacle();spawnT=rnd(0.85,1.6)*Math.max(0.5,1-dist/5000);}
  coinT-=dt; if(coinT<=0){spawnCoins();coinT=rnd(2.2,4);}
  fuelT-=dt; if(fuelT<=0){pickups.push({type:'fuel',x:W+80,y:-40,ph:0});fuelT=rnd(7,12);}
  if(Math.random()<dt*0.12&&hearts<3)pickups.push({type:'heart',x:W+80,y:-60,ph:0});
  if(Math.random()<dt*0.06)pickups.push({type:'star',x:W+80,y:-50,ph:0});


  var tx=truckX+16,tw=196,tb=groundY+jumpY,i,o;
  for(i=obstacles.length-1;i>=0;i--){o=obstacles[i];
    o.x-=(speed+(o.type==='chick'?70:0))*dt;
    if(o.type==='chick')o.ph+=dt*10;
    if(o.x<-160){obstacles.splice(i,1);continue;}
    var gy=groundY+8, ot=gy-o.h;
    if(o.x<tx+tw&&o.x+o.w>tx){
      if(o.type==='puddle'){ if(!o.used&&onGround){o.used=true;slipT=0.9;sfx('slip');bubble={text:'أوبس!',t:0,life:1};splash(o.x+o.w/2);} }
      else if(tb>ot-2&&invT<=0&&turboT<=0){
        obstacles.splice(i,1); hearts--; invT=1.3; crashT=0.5; shakeT=0.4; sfx('crash');
        if(o.type==='chick')feathers(o.x+o.w/2); else debris(o.x+o.w/2,o.type);
        bubble={text:'واو!',t:0,life:1};
        if(hearts<=0){gameOver('crash');return;}
      }
    }
  }
  for(i=pickups.length-1;i>=0;i--){var p=pickups[i];
    p.x-=speed*dt; p.ph+=dt*6;
    if(p.x<-60){pickups.splice(i,1);continue;}
    var py=groundY-56+p.y;
    if(p.x>tx-10&&p.x<tx+tw+10&&py>tb-130&&py<tb+10){
      pickups.splice(i,1);
      if(p.type==='coin'){coins++;sfx('coin');sparkle(p.x,py,'#ffd76b');}
      else if(p.type==='fuel'){fuel=Math.min(100,fuel+38);sfx('fuel');bubble={text:'وقود منعش!',t:0,life:1.3};sparkle(p.x,py,'#a5d46a');}
      else if(p.type==='heart'){hearts=Math.min(3,hearts+1);sfx('heart');sparkle(p.x,py,'#ff7aa8');}
      else {turboT=3;invT=3;sfx('star');bubble={text:'تيربووو!',t:0,life:1.3};confetti();}
    }
  }
  updateProps(dt,speed);
  updateWeather(dt,pal);
  updateParticles(dt);
  engineTick(pal);


  $('hudDist').textContent=Math.floor(dist)+' م';
  $('hudCoins').textContent='🪙 '+coins;
  $('hudHearts').textContent= hearts>0?'❤️'.repeat(hearts)+'🖤'.repeat(3-hearts):'💔';
  var fb=$('fuelBar'); fb.style.width=Math.max(0,fuel)+'%'; fb.classList.toggle('low',fuel<30);
}
function updateWeather(dt,pal){
  var w=pal.weather, target=w==='snow'?70:w==='rain'?110:0;
  while(wx.length<target)wx.push({x:Math.random()*W,y:Math.random()*H,p:Math.random()*6});
  if(target===0)wx.length=0;
  for(var i=0;i<wx.length;i++){var q=wx[i];
    if(w==='snow'){q.y+=70*dt;q.x-=(speed*0.3+18)*dt+Math.sin(timeSec*2+q.p)*20*dt;}
    else {q.y+=950*dt;q.x-=(speed*0.5+160)*dt;}
    if(q.y>H+10){q.y=-10;q.x=Math.random()*(W+200);}
    if(q.x<-10)q.x=W+10;
  }
}
function updateProps(dt,sp){
  propX-=sp*dt;
  if(propX<=0){spawnProp(getPalette(dist));propX=rnd(240,430);}
  for(var i=props.length-1;i>=0;i--){props[i].x-=sp*dt;if(props[i].x<-140)props.splice(i,1);}
  for(var c=0;c<clouds.length;c++){clouds[c].x-=(clouds[c].v+sp*0.06)*dt;if(clouds[c].x<-220)clouds[c].x=W+220;}
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];
    p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.grav||0)*dt;
    if(p.t>p.life)particles.splice(i,1);}
}
function dust(n){for(var i=0;i<n;i++)particles.push({x:truckX+rnd(20,200),y:groundY+2,vx:rnd(-80,80)-speed*0.2,vy:rnd(-60,-10),life:rnd(0.3,0.6),t:0,size:rnd(3,7),col:'dust',grav:0});}
function splash(x){for(var i=0;i<12;i++)particles.push({x:x,y:groundY,vx:rnd(-140,140),vy:rnd(-220,-60),life:rnd(0.3,0.6),t:0,size:rnd(2,5),col:'#6fb7d8',grav:600});}
function feathers(x){for(var i=0;i<14;i++)particles.push({x:x,y:groundY-20,vx:rnd(-160,160),vy:rnd(-260,-40),life:rnd(0.5,1),t:0,size:rnd(3,6),col:'#ffffff',grav:300});}
function debris(x,type){var col=type==='log'?'#8a5a3b':'#9aa0a6';for(var i=0;i<12;i++)particles.push({x:x,y:groundY-16,vx:rnd(-200,200),vy:rnd(-300,-60),life:rnd(0.4,0.8),t:0,size:rnd(3,7),col:col,grav:700});}
function sparkle(x,y,col){for(var i=0;i<10;i++)particles.push({x:x,y:y,vx:rnd(-120,120),vy:rnd(-160,40),life:rnd(0.3,0.6),t:0,size:rnd(2,5),col:col,grav:200});}
function confetti(){var cols=['#e2542c','#f2a03d','#a5d46a','#4a7fd4','#ff7aa8'];for(var i=0;i<26;i++)particles.push({x:truckX+110,y:groundY-140,vx:rnd(-260,260),vy:rnd(-320,-40),life:rnd(0.6,1.2),t:0,size:rnd(3,6),col:cols[i%5],grav:500});}


/* ============== رسم ============== */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(col,amt){var m=col.match(/\d+/g);if(!m)return col;var r=Math.max(0,Math.min(255,+m[0]+amt)),gg=Math.max(0,Math.min(255,+m[1]+amt)),b=Math.max(0,Math.min(255,+m[2]+amt));return 'rgb('+r+','+gg+','+b+')';}


function render(){
  var pal= state==='MENU'? getPalette(menuDist): getPalette(dist);
  var g=ctx;
  g.setTransform(dpr*scaleF,0,0,dpr*scaleF,0,0);
  if(shakeT>0)g.translate(rnd(-4,4),rnd(-3,3));
  var sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,pal.sky1); sky.addColorStop(1,pal.sky2);
  g.fillStyle=sky; g.fillRect(-8,-8,W+16,H+16);
  var starA=Math.max(0,(pal.night-0.3))/0.7;
  if(starA>0){for(var s=0;s<stars.length;s++){var st=stars[s];g.globalAlpha=starA*(0.5+0.5*Math.sin(timeSec*2+st.p));g.fillStyle='#fff';g.fillRect(st.x*W,st.y*H,2.4,2.4);}g.globalAlpha=1;}
  var f=pal.f, cx=W*(0.12+0.75*f), cy=170-Math.sin(f*Math.PI)*90;
  if(pal.night<0.6){g.globalAlpha=1-pal.night;g.fillStyle='#ffd76b';g.beginPath();g.arc(cx,cy,34,0,7);g.fill();g.globalAlpha=(1-pal.night)*0.35;g.beginPath();g.arc(cx,cy,52,0,7);g.fill();g.globalAlpha=1;}
  if(pal.night>0.4){g.globalAlpha=Math.min(1,(pal.night-0.4)/0.6);g.fillStyle='#e8ecf4';g.beginPath();g.arc(W-cx*0.3-80,cy-20,26,0,7);g.fill();g.fillStyle=pal.sky1;g.beginPath();g.arc(W-cx*0.3-90,cy-26,22,0,7);g.fill();g.globalAlpha=1;}
  g.fillStyle=pal.cloud;
  for(var c=0;c<clouds.length;c++){var cl=clouds[c];drawCloud(g,cl.x,cl.y,cl.s);}
  drawHills(g,pal.hillF,300,worldX*0.25,34,0.004);
  /* البحر في الشاطئ */
  if(pal.seaA>0.03){

  g.lineTo(cx+40,-24+b); g.lineTo(cx+30,-24+b);

  g.lineTo(cx-40,-24+b); g.lineTo(cx-40,-28+b);
  g.closePath(); g.fill(); g.stroke();
}
function drawWheel(g,x,y){
  g.fillStyle='#2b2b2b'; g.beginPath(); g.arc(x,y,27,0,7); g.fill(); g.stroke();
  g.fillStyle='#f0e6d2'; g.beginPath(); g.arc(x,y,14,0,7); g.fill(); g.stroke();
  g.save(); g.translate(x,y); g.rotate(wheelAng);
  g.strokeStyle='#8a8a8a'; g.lineWidth=3;
  for(var i=0;i<4;i++){g.rotate(Math.PI/2);g.beginPath();g.moveTo(0,-11);g.lineTo(0,-4);g.stroke();}
  g.restore();
  g.fillStyle='#9fb6c4'; g.beginPath(); g.arc(x,y,5,0,7); g.fill(); g.stroke();
  g.lineWidth=5; g.strokeStyle='#26221f';
}
function drawBuddy(g,b){
  var by=-116+b+Math.sin(timeSec*7)*2;
  g.lineWidth=4;
  if(cfg.buddy==='dog'){
    g.fillStyle='#8a5a3b';
    g.beginPath();g.arc(58,by,15,0,7);g.fill();g.stroke();
    g.save();g.translate(48,by-8);g.rotate(-0.5+Math.sin(timeSec*9)*0.25);
    g.fillStyle='#6d4527';rr(g,-5,-4,10,20,5);g.fill();g.stroke();g.restore();
    g.save();g.translate(68,by-8);g.rotate(0.5-Math.sin(timeSec*9)*0.25);
    g.fillStyle='#6d4527';rr(g,-5,-4,10,20,5);g.fill();g.stroke();g.restore();
    g.fillStyle='#c89b72';g.beginPath();g.arc(66,by+4,7,0,7);g.fill();g.stroke();
    g.fillStyle='#26221f';g.beginPath();g.arc(69,by+2,2.6,0,7);g.fill();
    g.beginPath();g.arc(60,by-3,2.4,0,7);g.fill();
    g.fillStyle='#ff7aa8';
    var tl=8+Math.sin(tonguePh)*3+(turboT>0?6:0);
    rr(g,64,by+8,6,tl,3);g.fill();g.stroke();
  } else {
    g.fillStyle='#9aa0a6';
    g.beginPath();g.arc(58,by,14,0,7);g.fill();g.stroke();
    g.beginPath();g.moveTo(48,by-8);g.lineTo(46,by-20);g.lineTo(55,by-12);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(68,by-8);g.lineTo(70,by-20);g.lineTo(61,by-12);g.closePath();g.fill();g.stroke();
    g.fillStyle='#26221f';g.beginPath();g.arc(54,by-2,2.2,0,7);g.fill();g.beginPath();g.arc(63,by-2,2.2,0,7);g.fill();
    g.fillStyle='#ff7aa8';g.beginPath();g.arc(58,by+4,2,0,7);g.fill();
    g.strokeStyle='#eee';g.lineWidth=2;
    g.beginPath();g.moveTo(46,by+2);g.lineTo(36,by);g.moveTo(46,by+5);g.lineTo(36,by+6);
    g.moveTo(70,by+2);g.lineTo(80,by);g.moveTo(70,by+5);g.lineTo(80,by+6);g.stroke();
    g.lineWidth=4;g.strokeStyle='#26221f';
  }
}
function drawHat(g,b){
  var rx=126, ry=-146+b;
  g.lineWidth=4;
  if(cfg.hat==='cowboy'){
    g.fillStyle='#8a5a3b';
    g.beginPath();g.ellipse(rx,ry,28,7,0,0,7);g.fill();g.stroke();
    rr(g,rx-14,ry-16,28,16,7);g.fill();g.stroke();
    g.fillStyle='#5f3d24';g.fillRect(rx-14,ry-6,28,4);
  } else if(cfg.hat==='party'){
    g.fillStyle='#4a7fd4';
    g.beginPath();g.moveTo(rx-12,ry);g.lineTo(rx,ry-28);g.lineTo(rx+12,ry);g.closePath();g.fill();g.stroke();
    g.fillStyle='#ffd76b';g.beginPath();g.arc(rx,ry-30,5,0,7);g.fill();g.stroke();
    g.fillStyle='#ff7aa8';g.beginPath();g.arc(rx-3,ry-10,2.5,0,7);g.fill();g.beginPath();g.arc(rx+4,ry-18,2.5,0,7);g.fill();
  } else if(cfg.hat==='prop'){
    g.fillStyle='#d94141';
    g.beginPath();g.arc(rx,ry,14,Math.PI,0);g.closePath();g.fill();g.stroke();
    g.strokeStyle='#26221f';g.beginPath();g.moveTo(rx,ry-14);g.lineTo(rx,ry-20);g.stroke();
    g.save();g.translate(rx,ry-22);g.rotate(timeSec*18);
    g.fillStyle='#f2a03d';
    g.beginPath();g.ellipse(12,0,12,4,0,0,7);g.fill();g.stroke();
    g.beginPath();g.ellipse(-12,0,12,4,0,0,7);g.fill();g.stroke();
    g.restore();
    g.fillStyle='#ffd76b';g.beginPath();g.arc(rx,ry-22,3.5,0,7);g.fill();g.stroke();
  }
}


/* ============== الحلقة ============== */
var lastT=performance.now();
function loop(now){
  var dt=Math.min(0.033,(now-lastT)/1000); lastT=now;
  update(dt); render();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
})();
</script>
