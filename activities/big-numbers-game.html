<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Numbers Challenge — Unit 3, Lesson 4</title>
<style>
  :root{ --navy:#0B1E3D; --card:#16294f; --line:#23386a; --sand:#E8B04B; --teal:#2FD1C4;
    --ink:#F4F7FB; --muted:#9FB0D0; --good:#3FCB7E; --bad:#E85D5D; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; font-family:'Baloo 2', system-ui, sans-serif;
    background:radial-gradient(1000px 600px at 80% -10%, #1a3566, transparent 60%), var(--navy); color:var(--ink);}
  header{text-align:center; padding:26px 16px 6px;}
  h1{font-size:clamp(20px,5vw,30px); margin:0 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin:0;}
  .wrap{max-width:700px; margin:0 auto; padding:16px;}
  .stage{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 20px; text-align:center;}
  .fact{font-size:15px; color:var(--muted); margin-bottom:6px;}
  .question{font-size:20px; font-weight:700; margin:6px 0 20px;}
  .answerRow{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .opt{
    background:var(--navy); border:2px solid var(--teal); color:var(--ink); font-family:inherit;
    font-size:18px; font-weight:800; padding:12px 20px; border-radius:12px; cursor:pointer; min-width:130px;
  }
  .opt.correct{background:var(--good); border-color:var(--good); color:#04211d;}
  .opt.wrong{background:var(--bad); border-color:var(--bad);}
  .feedback{min-height:26px; margin-top:16px; font-weight:700;}
  .feedback.good{color:var(--good);} .feedback.bad{color:var(--bad);}
  .nextbtn, .restart{display:none; margin:18px auto 0; background:var(--sand); color:#3a2600; border:none; border-radius:12px;
    padding:12px 26px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;}
  .nextbtn.show, .restart.show{display:block;}
  .score{text-align:center; color:var(--muted); margin-top:14px; font-size:14px;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 16px;}
</style>
</head>
<body>
<header>
  <h1>🔢 Big Numbers Challenge</h1>
  <p class="sub">Unit 3: Let's Explore! · Lesson 4 · Real Omani facts with big numbers</p>
</header>

<div class="wrap">
  <div class="stage" id="stage"></div>
  <p class="score" id="score"></p>
</div>
<footer>Grade 5A · English · Let's Explore! interactive activities</footer>

<script>
const Q = [
  { fact:"Distance", question:"How far is it from Muscat to Salalah by car?", options:["1,000 km","100 km","10,000 km"], correct:0 },
  { fact:"Mountain height", question:"How high is Jabal Shams?", options:["3,028 metres","300 metres","30,280 metres"], correct:0 },
  { fact:"Ocean depth", question:"How deep is the Pacific Ocean at its deepest point?", options:["1,911 metres","10,911 metres","109 metres"], correct:1 },
  { fact:"Planet Earth", question:"How far is Earth from the Sun (roughly)?", options:["150,000 kilometres","1,500,000 kilometres","150,000,000 kilometres"], correct:2 },
  { fact:"Big number in words", question:"How do we say the number 1,000,000?", options:["a hundred thousand","a million","ten thousand"], correct:1 },
  { fact:"Big number in words", question:"How do we say the number 100,000?", options:["a hundred thousand","a thousand","a million"], correct:0 },
  { fact:"Ordering numbers", question:"Which number is the SMALLEST?", options:["50,000","5,000","500,000"], correct:1 },
  { fact:"Ordering numbers", question:"Which number is the BIGGEST?", options:["a hundred thousand","ten thousand","a million"], correct:2 },
];

let idx = 0, score = 0;

function render(){
  const item = Q[idx];
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="fact">${item.fact} · Question ${idx+1} of ${Q.length}</div>
    <div class="question">${item.question}</div>
    <div class="answerRow">
      ${item.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextbtn">${idx === Q.length-1 ? 'See my score →' : 'Next →'}</button>
  `;
  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', () => choose(btn, item.correct));
  });
  document.getElementById('nextbtn').addEventListener('click', next);
  document.getElementById('score').textContent = "";
}

function choose(btn, correctIdx){
  const all = document.querySelectorAll('.opt');
  all.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  const chosen = parseInt(btn.dataset.i);
  if(chosen === correctIdx){
    btn.classList.add('correct');
    fb.textContent = "✓ Correct!";
    fb.className = "feedback good";
    score++;
  } else {
    btn.classList.add('wrong');
    all[correctIdx].classList.add('correct');
    fb.textContent = "Not quite — the correct answer is highlighted.";
    fb.className = "feedback bad";
  }
  document.getElementById('nextbtn').classList.add('show');
}

function next(){
  idx++;
  if(idx >= Q.length){
    document.getElementById('stage').innerHTML = `
      <div class="question">🌟 Challenge complete! 🌟</div>
      <p>You scored ${score} out of ${Q.length}.</p>
      <button class="restart show" onclick="start()">Play again</button>
    `;
    return;
  }
  render();
}

function start(){ idx = 0; score = 0; render(); }
start();
</script>
</body>
</html>
