<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض تجريبي — الثقب الأسود كانتقال بين المشاهد</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#05040a; font-family:'Segoe UI', Tahoma, sans-serif; color:#e8d5b5; overflow:hidden; }

#stage { position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }

.scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; transition:opacity 0.25s; }
.scene.hidden { opacity:0; pointer-events:none; }

.note { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:11px; color:#5a4a3a; text-align:center; z-index:50; }

.scene .kicker { color:#00d4aa; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
.scene h2 { font-size:clamp(20px,4vw,32px); color:#d4c5a9; margin-bottom:10px; max-width:600px; direction:ltr; unicode-bidi:isolate; }
.scene .sub { color:#8b7a5f; font-size:13px; margin-bottom:30px; direction:ltr; unicode-bidi:isolate; }
.opt { direction:ltr; unicode-bidi:isolate; }
.options { display:flex; flex-direction:column; gap:12px; width:100%; max-width:420px; }
.opt { background:rgba(212,197,169,0.06); border:1px solid rgba(212,197,169,0.25); color:#e8d5b5; padding:14px 20px; border-radius:12px; font-size:15px; cursor:pointer; transition:all 0.2s; }
.opt:hover { background:rgba(212,197,169,0.14); border-color:rgba(212,197,169,0.5); }
.opt.correct { background:rgba(0,212,170,0.2); border-color:#00d4aa; }
.opt.wrong { background:rgba(139,26,58,0.3); border-color:#8b1a3a; }

#warp { position:fixed; inset:0; z-index:100; pointer-events:none; display:flex; align-items:center; justify-content:center; opacity:0; }
#warp canvas { width:100%; height:100%; }

.finalScene .icon { font-size:56px; margin-bottom:14px; }
.restart-btn { margin-top:24px; background:rgba(214,51,132,0.15); border:1px solid rgba(214,51,132,0.4); color:#f0e6d2; padding:10px 28px; border-radius:10px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>

<div class="note">الثقب الأسود يقذفكم بقوة نحو الفلج...</div>

<div id="stage">
  <div class="scene" data-scene="1">
    <div class="kicker">بوابة البلاك هول</div>
    <h2 style="direction:rtl;unicode-bidi:normal;">تنطلقون بسرعة عبر الثقب الأسود</h2>
  </div>

  <div class="scene hidden finalScene" data-scene="final">
    <div class="icon">🚤</div>
    <h2 style="direction:rtl;unicode-bidi:normal;">Welcome to the Falaj</h2>
    <div class="sub" style="direction:rtl;unicode-bidi:normal;">استعدوا لركوب القفة والإجابة على الأسئلة</div>
    <button class="restart-btn" id="backBtn">اركبوا الفلج →</button>
  </div>
</div>

<div id="warp"><canvas id="warpCanvas"></canvas></div>

<script>
const scenes = Array.from(document.querySelectorAll('.scene'));
let currentIndex = 0;

const warpEl = document.getElementById('warp');
const canvas = document.getElementById('warpCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function playWarp(callback) {
  warpEl.style.opacity = '1';
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const duration = 900;
  const start = performance.now();
  const particles = Array.from({ length: 140 }, () => ({
    angle: Math.random() * Math.PI * 2,
    dist: 200 + Math.random() * Math.max(canvas.width, canvas.height) * 0.6,
    speed: 0.6 + Math.random() * 0.8,
    size: 1 + Math.random() * 2.2,
    hue: Math.random() > 0.5 ? '#ff8a3d' : '#d63384'
  }));
  let switched = false;

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = `rgba(5,4,10,${0.5 + t * 0.5})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pull = Math.pow(t, 2);
    particles.forEach(p => {
      const d = p.dist * (1 - pull);
      const x = cx + Math.cos(p.angle + t * 6) * d;
      const y = cy + Math.sin(p.angle + t * 6) * d * 0.7;
      ctx.globalAlpha = 0.8 * (1 - t * 0.3);
      ctx.fillStyle = p.hue;
      ctx.beginPath();
      ctx.arc(x, y, p.size * (1 + pull * 2), 0, Math.PI * 2);
      ctx.fill();
    });

    const ringR = 6 + t * 40 * (t < 0.5 ? 1 : (1 - t) * 3);
    ctx.globalAlpha = 1;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(4, ringR));
    grad.addColorStop(0, '#000');
    grad.addColorStop(0.55, '#000');
    grad.addColorStop(0.7, '#ff8a3d');
    grad.addColorStop(0.85, '#ffd9a0');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(4, ringR * 6), 0, Math.PI * 2);
    ctx.fill();

    if (t >= 0.5 && !switched) {
      switched = true;
      callback();
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      warpEl.style.opacity = '0';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

function goToScene(index) {
  playWarp(() => {
    scenes.forEach((s, i) => s.classList.toggle('hidden', i !== index));
    currentIndex = index;
  });
}

// انتقال تلقائي واحد فور الدخول — الفلج يقذف اللاعب عبر الثقب الأسود ويرجعه لغرفة البطاقات
setTimeout(() => goToScene(1), 900);

document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = '../gufa-falaj-demo/index.html';
});
</script>

</body>
</html>
