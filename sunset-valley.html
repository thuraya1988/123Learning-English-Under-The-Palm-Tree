<script type="module">
import * as THREE from 'three';
const rand=(a,b)=>a+Math.random()*(b-a);
const canvasEl=document.getElementById('gl');
const loaderEl=document.getElementById('loader');

let renderer,scene,camera,sun;
const clock=new THREE.Clock();
let highQ=true,autoOn=true;
const move={up:false,down:false,left:false,right:false};
let progress=0,yawOff=0,pitch=0.02,bobPhase=0,bobAmp=0,prevExtra=0,pathLen=1;
let pathCurve;

/* ---------- خامات كانفس ---------- */
function makeCanvas(size,draw){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;}
const sandTex=makeCanvas(256,(g,s)=>{g.fillStyle='#f2d349';g.fillRect(0,0,s,s);for(let i=0;i<2600;i++){g.fillStyle=`rgba(${200+Math.floor(Math.random()*40)},${180+Math.floor(Math.random()*40)},${60+Math.floor(Math.random()*40)},.5)`;g.fillRect(Math.random()*s,Math.random()*s,1.5,1.5);}for(let i=0;i<300;i++){g.fillStyle='rgba(220,170,60,.35)';g.beginPath();g.arc(Math.random()*s,Math.random()*s,2+Math.random()*4,0,7);g.fill();}});
sandTex.repeat.set(2,60);sandTex.anisotropy=8;
const groundTex=makeCanvas(256,(g,s)=>{g.fillStyle='#dca28c';g.fillRect(0,0,s,s);for(let i=0;i<2400;i++){g.fillStyle=`rgba(${190+Math.floor(Math.random()*50)},${130+Math.floor(Math.random()*40)},${110+Math.floor(Math.random()*40)},.5)`;g.fillRect(Math.random()*s,Math.random()*s,2,2);}for(let i=0;i<220;i++){g.fillStyle='rgba(160,100,90,.3)';g.beginPath();g.arc(Math.random()*s,Math.random()*s,1+Math.random()*3,0,7);g.fill();}});
groundTex.repeat.set(80,80);groundTex.anisotropy=8;
const stripeTex=makeCanvas(128,(g,s)=>{for(let x=0;x<s;x+=4){g.fillStyle=(x/4)%2?'#f6d84a':'#e9c83e';g.fillRect(x,0,4,s);}for(let i=0;i<400;i++){g.fillStyle='rgba(190,150,40,.25)';g.fillRect(Math.random()*s,Math.random()*s,1,rand(4,14));}});
stripeTex.repeat.set(8,1);
const cactusTex=makeCanvas(128,(g,s)=>{for(let x=0;x<s;x+=6){g.fillStyle=(x/6)%2?'#3f7d46':'#356b3c';g.fillRect(x,0,6,s);}for(let i=0;i<300;i++){g.fillStyle='rgba(220,240,200,.25)';g.fillRect(Math.random()*s,Math.random()*s,1,2);}});
cactusTex.repeat.set(4,1);
const noiseTex=makeCanvas(128,(g,s)=>{g.fillStyle='#ffffff';g.fillRect(0,0,s,s);for(let i=0;i<800;i++){const v=200+Math.floor(Math.random()*55);g.fillStyle=`rgba(${v},${v},${v},.5)`;g.beginPath();g.arc(Math.random()*s,Math.random()*s,1+Math.random()*3,0,7);g.fill();}});
noiseTex.repeat.set(3,3);

function displace(geo,amp,freq,seed){const p=geo.attributes.position;const v=new THREE.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const d=(Math.sin(v.x*freq+seed)+Math.sin(v.y*freq*1.31+seed*1.7)+Math.sin(v.z*freq*0.83+seed*2.3))/3;const dl=v.length()||1;v.x+=v.x/dl*d*amp;v.y+=v.y/dl*d*amp;v.z+=v.z/dl*d*amp;p.setXYZ(i,v.x,v.y,v.z);}geo.computeVertexNormals();}

function main(){
renderer=new THREE.WebGLRenderer({canvas:canvasEl,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;

scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xf0a8a4,45,175);
camera=new THREE.PerspectiveCamera(58,window.innerWidth/window.innerHeight,0.1,700);
camera.rotation.order='YXZ';

/* ---------- سماء الغروب ---------- */
const skyGeo=new THREE.SphereGeometry(320,32,16);
{const pos=skyGeo.attributes.position;const cols=new Float32Array(pos.count*3);
const cTop=new THREE.Color(0x6d99a0),cMid=new THREE.Color(0xd8a8a8),cHor=new THREE.Color(0xf2a2a0),cT=new THREE.Color();const v=new THREE.Vector3();
for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i).normalize();const h=Math.max(v.y,0);
if(h<0.25)cT.copy(cHor).lerp(cMid,h/0.25);else cT.copy(cMid).lerp(cTop,(h-0.25)/0.75);
cols[i*3]=cT.r;cols[i*3+1]=cT.g;cols[i*3+2]=cT.b;}
skyGeo.setAttribute('color',new THREE.BufferAttribute(cols,3));}
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,toneMapped:false,depthWrite:false}));
scene.add(sky);

/* ---------- إضاءة ---------- */
scene.add(new THREE.HemisphereLight(0x9fc6cc,0xe8a49a,0.85));
scene.add(new THREE.AmbientLight(0xffd0c0,0.25));
sun=new THREE.DirectionalLight(0xffd9a0,2.5);
sun.position.set(12,16,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-32;sun.shadow.camera.right=32;
sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;
sun.shadow.camera.near=2;sun.shadow.camera.far=90;
sun.shadow.bias=-0.0004;
scene.add(sun);scene.add(sun.target);

/* ---------- الأرض ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({map:groundTex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-100;ground.receiveShadow=true;scene.add(ground);

/* ---------- الطريق الطويل ---------- */
const pts=[];
for(let z=16;z>=-220;z-=8){pts.push(new THREE.Vector3(Math.sin(z*0.08)*2.5+Math.sin(z*0.023)*1.5,0,z));}
pathCurve=new THREE.CatmullRomCurve3(pts);
pathLen=pathCurve.getLength();
const M=700;
const rPos=new Float32Array((M+1)*2*3);
const rUv=new Float32Array((M+1)*2*2);
const rIdx=[];
const pv=new THREE.Vector3(),tv=new THREE.Vector3();
for(let i=0;i<=M;i++){
 const u=i/M;pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 const w=1.25;
 rPos[i*6]=pv.x+px/pl*w;rPos[i*6+1]=0.06;rPos[i*6+2]=pv.z+pz/pl*w;
 rPos[i*6+3]=pv.x-px/pl*w;rPos[i*6+4]=0.06;rPos[i*6+5]=pv.z-pz/pl*w;
 rUv[i*4]=0;rUv[i*4+1]=u*90;rUv[i*4+2]=1;rUv[i*4+3]=u*90;
 if(i<M){const a=i*2,b=i*2+1,c=i*2+2,d2=i*2+3;rIdx.push(a,b,c,b,d2,c);}
}
const ribbonGeo=new THREE.BufferGeometry();
ribbonGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
ribbonGeo.setAttribute('uv',new THREE.BufferAttribute(rUv,2));
ribbonGeo.setIndex(rIdx);ribbonGeo.computeVertexNormals();
const ribbon=new THREE.Mesh(ribbonGeo,new THREE.MeshStandardMaterial({map:sandTex,roughness:1}));
ribbon.receiveShadow=true;scene.add(ribbon);

const spaced=pathCurve.getSpacedPoints(500);
function nearPath(x,z,rad){for(let i=0;i<spaced.length;i+=2){const dx=spaced[i].x-x,dz=spaced[i].z-z;if(dx*dx+dz*dz<rad*rad)return true;}return false;}

/* ---------- حقول الأزهار ---------- */
const dummy=new THREE.Object3D();const iCol=new THREE.Color();
const SPIKES=2600,POMS=1000,SHRUBS=600,BOULDERS=320;
const spikeGeo=new THREE.ConeGeometry(0.05,0.55,5);spikeGeo.translate(0,0.27,0);
const spikes=new THREE.InstancedMesh(spikeGeo,new THREE.MeshStandardMaterial({roughness:.85}),SPIKES);
const pomGeo=new THREE.IcosahedronGeometry(0.17,1);pomGeo.translate(0,0.36,0);
const poms=new THREE.InstancedMesh(pomGeo,new THREE.MeshStandardMaterial({roughness:.8}),POMS);
const stemGeo=new THREE.CylinderGeometry(0.02,0.03,0.32,5);stemGeo.translate(0,0.16,0);
const stems=new THREE.InstancedMesh(stemGeo,new THREE.MeshStandardMaterial({color:0x6a8f5a,roughness:1}),POMS);
const shrubGeo=new THREE.IcosahedronGeometry(0.5,1);displace(shrubGeo,0.12,1.6,3);shrubGeo.translate(0,0.18,0);
const shrubs=new THREE.InstancedMesh(shrubGeo,new THREE.MeshStandardMaterial({roughness:1}),SHRUBS);
const bGeo=new THREE.IcosahedronGeometry(0.5,1);displace(bGeo,0.18,1.3,7);
const boulders=new THREE.InstancedMesh(bGeo,new THREE.MeshStandardMaterial({map:noiseTex,roughness:1}),BOULDERS);
let si=0,pi=0,shI=0,boI=0,guard=0;
for(let d=0;d<pathLen-2&&si<SPIKES;d+=0.7){
 const u=d/pathLen;pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 for(let sd=-1;sd<=1;sd+=2){
  for(let k=0;k<2;k++){
   if(guard++%3===0&&boI<BOULDERS&&Math.random()<0.25){
    const off=rand(2.0,4.5);
    dummy.position.set(pv.x+px/pl*off*sd,0.1,pv.z+pz/pl*off*sd);
    dummy.rotation.set(0,rand(0,6.28),0);
    const bs=rand(0.4,1.4);dummy.scale.set(bs,bs*rand(.7,1),bs);dummy.updateMatrix();
    boulders.setMatrixAt(boI,dummy.matrix);
    iCol.setHSL(0.08+Math.random()*0.05,0.25+Math.random()*0.2,0.65+Math.random()*0.2);
    boulders.setColorAt(boI,iCol);boI++;
   }
   const off=rand(1.7,6.5);
   const x=pv.x+px/pl*off*sd+(Math.random()-0.5)*0.6;
   const z=pv.z+pz/pl*off*sd+(Math.random()-0.5)*0.6;
   const r=Math.random();
   if(r<0.42&&si<SPIKES){
    dummy.position.set(x,0,z);
    dummy.rotation.set((Math.random()-0.5)*0.5,rand(0,6.28),(Math.random()-0.5)*0.5);
    const ss=rand(0.7,1.6);dummy.scale.set(ss,ss,ss);dummy.updateMatrix();
    spikes.setMatrixAt(si,dummy.matrix);
    iCol.setHSL(0.93+Math.random()*0.04,0.6,0.6+Math.random()*0.15);
    spikes.setColorAt(si,iCol);si++;
   }else if(r<0.78&&pi<POMS){
    dummy.position.set(x,0,z);
    dummy.rotation.set(0,rand(0,6.28),0);
    const ss=rand(0.8,1.5);dummy.scale.set(ss,ss,ss);dummy.updateMatrix();
    poms.setMatrixAt(pi,dummy.matrix);stems.setMatrixAt(pi,dummy.matrix);
    iCol.setHSL(0.11+Math.random()*0.03,0.85,0.5+Math.random()*0.12);
    poms.setColorAt(pi,iCol);pi++;
   }else if(shI<SHRUBS){
    dummy.position.set(x,0,z);
    dummy.rotation.set(0,rand(0,6.28),0);
    const ss=rand(0.7,1.6);dummy.scale.set(ss,ss*0.7,ss);dummy.updateMatrix();
    shrubs.setMatrixAt(shI,dummy.matrix);
    iCol.setHSL(0.24+Math.random()*0.08,0.3,0.45+Math.random()*0.2);
    shrubs.setColorAt(shI,iCol);shI++;
   }
  }}}
spikes.count=si;poms.count=pi;stems.count=pi;shrubs.count=shI;boulders.count=boI;
[spikes,poms,stems,shrubs,boulders].forEach(m=>{if(m.instanceColor)m.instanceColor.needsUpdate=true;m.castShadow=true;m.receiveShadow=true;scene.add(m);});

/* ---------- الأعمدة الصفراء ---------- */
const pillarGeo=new THREE.CapsuleGeometry(1,1,6,18);
const pillarMat=new THREE.MeshStandardMaterial({map:stripeTex,roughness:0.9,bumpMap:stripeTex,bumpScale:0.05});
const pillars=new THREE.InstancedMesh(pillarGeo,pillarMat,90);
let pI=0;
for(let d=4;d<pathLen-4&&pI<88;d+=12){
 const u=d/pathLen;pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 for(let sd=-1;sd<=1;sd+=2){
  if(pI>=90)break;
  const off=rand(8,13);
  const h=rand(14,26),r=rand(2,3.6);
  dummy.position.set(pv.x+px/pl*off*sd,0,pv.z+pz/pl*off*sd);
  dummy.rotation.set(0,rand(0,6.28),0);
  dummy.scale.set(r,h/3,r);dummy.position.y=h/2;
  dummy.updateMatrix();
  pillars.setMatrixAt(pI,dummy.matrix);pI++;
 }
}
for(let k=0;k<26&&pI<90;k++){
 const u=Math.random();pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 const sd=Math.random()<.5?-1:1;const off=rand(18,30);
 const h=rand(20,32),r=rand(2.5,4.5);
 dummy.position.set(pv.x+px/pl*off*sd,0,pv.z+pz/pl*off*sd);
 dummy.rotation.set(0,rand(0,6.28),0);
 dummy.scale.set(r,h/3,r);dummy.position.y=h/2;
 dummy.updateMatrix();
 pillars.setMatrixAt(pI,dummy.matrix);pI++;
}
pillars.count=pI;pillars.castShadow=true;scene.add(pillars);

/* ---------- التلال الوردية ---------- */
const moundGeo=new THREE.IcosahedronGeometry(1,3);displace(moundGeo,0.22,1.1,5);
const moundMat=new THREE.MeshStandardMaterial({color:0xe08d7f,map:noiseTex,bumpMap:noiseTex,bumpScale:0.15,roughness:1});
const mounds=new THREE.InstancedMesh(moundGeo,moundMat,80);
let mI=0;
for(let d=2;d<pathLen-2&&mI<70;d+=9){
 const u=d/pathLen;pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 const sd=Math.random()<.5?-1:1;const off=rand(4.5,8);
 dummy.position.set(pv.x+px/pl*off*sd,0,pv.z+pz/pl*off*sd);
 dummy.rotation.set(0,rand(0,6.28),0);
 const sx=rand(2,4.5),sy=rand(2.5,7),sz=rand(2,4.5);
 dummy.scale.set(sx,sy,sz);dummy.position.y=sy*0.55;
 dummy.updateMatrix();
 mounds.setMatrixAt(mI,dummy.matrix);
 iCol.setHSL(0.03+Math.random()*0.03,0.5+Math.random()*0.2,0.62+Math.random()*0.15);
 mounds.setColorAt(mI,iCol);mI++;
}
for(let k=0;k<10&&mI<80;k++){
 const u=Math.random();pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 const sd=Math.random()<.5?-1:1;const off=rand(12,22);
 dummy.position.set(pv.x+px/pl*off*sd,0,pv.z+pz/pl*off*sd);
 dummy.rotation.set(0,rand(0,6.28),0);
 const sx=rand(5,9),sy=rand(6,12),sz=rand(5,9);
 dummy.scale.set(sx,sy,sz);dummy.position.y=sy*0.5;
 dummy.updateMatrix();
 mounds.setMatrixAt(mI,dummy.matrix);
 iCol.setHSL(0.03,0.45,0.66);
 mounds.setColorAt(mI,iCol);mI++;
}
mounds.count=mI;
if(mounds.instanceColor)mounds.instanceColor.needsUpdate=true;
mounds.castShadow=true;mounds.receiveShadow=true;scene.add(mounds);

/* ---------- الصبّار ---------- */
const cactusMat=new THREE.MeshStandardMaterial({map:cactusTex,roughness:0.9,bumpMap:cactusTex,bumpScale:0.06});
for(let d=10;d<pathLen-6;d+=22){
 const u=d/pathLen;pathCurve.getPointAt(u,pv);pathCurve.getTangentAt(u,tv);
 const px=-tv.z,pz=tv.x;const pl=Math.hypot(px,pz)||1;
 const sd=Math.random()<.5?-1:1;const off=rand(3,5.5);
 const g=new THREE.Group();
 const h=rand(2.5,4.5);
 const trunk=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,h,6,12),cactusMat);
 trunk.position.y=h/2+0.28;trunk.castShadow=true;g.add(trunk);
 for(let a=0;a<2;a++){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,1.1,5,10),cactusMat);
  arm.position.set(a?0.45:-0.45,h*0.55+rand(-0.3,0.4),0);
  arm.rotation.z=a?-0.5:0.5;arm.castShadow=true;g.add(arm);
  const up=new THREE.Mesh(new THREE.CapsuleGeometry(0.14,0.7,5,10),cactusMat);
  up.position.set(a?0.75:-0.75,h*0.55+0.7,0);up.castShadow=true;g.add(up);
 }
 g.position.set(pv.x+px/pl*off*sd,0,pv.z+pz/pl*off*sd);
 g.rotation.y=rand(0,6.28);
 scene.add(g);
}

/* ---------- غيوم وردية ---------- */
const cloudMat=new THREE.MeshStandardMaterial({color:0xf2a0ac,roughness:1});
const cloudItems=[];
function makeCloud(x,y,z,s){
 const g=new THREE.Group();const n=5+Math.floor(Math.random()*3);
 for(let i=0;i<n;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry((0.8+Math.random()*0.7)*s,14,10),cloudMat);
  m.position.set((Math.random()-0.5)*2.6*s,(Math.random()-0.5)*0.5*s,(Math.random()-0.5)*1.1*s);
  m.scale.set(1,0.55,0.8);g.add(m);}
 g.position.set(x,y,z);cloudItems.push({g,sp:0.2+Math.random()*0.3});scene.add(g);}
for(let i=0;i<16;i++){
 makeCloud(rand(-40,40),rand(16,34),rand(-200,10),rand(2,5));
}

/* ---------- تحكم ---------- */
document.querySelectorAll('.dpad button').forEach(b=>{
 const k=b.dataset.k;
 const on=e=>{e.preventDefault();move[k]=true;};
 const off=()=>{move[k]=false;b.blur();};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
 b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
 b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{if(KEYMAP[e.code]){move[KEYMAP[e.code]]=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{if(KEYMAP[e.code])move[KEYMAP[e.code]]=false;});
let dragging=false,lx=0,ly=0;
canvasEl.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
 yawOff=THREE.MathUtils.clamp(yawOff-dx*0.0035,-1.3,1.3);
 pitch=THREE.MathUtils.clamp(pitch-dy*0.0025,-0.4,0.5);
});
window.addEventListener('pointerup',()=>dragging=false);
canvasEl.addEventListener('wheel',e=>{e.preventDefault();progress=THREE.MathUtils.clamp(progress-e.deltaY*0.01,0,pathLen-0.5);},{passive:false});

document.getElementById('autoBtn').onclick=e=>{autoOn=!autoOn;e.currentTarget.textContent=autoOn?'⏸️ إيقاف المسير':'🚶 بدء المسير';e.currentTarget.blur();};
document.getElementById('resetBtn').onclick=e=>{progress=0;yawOff=0;pitch=0.02;prevExtra=0;e.currentTarget.blur();};
document.getElementById('qualBtn').onclick=e=>{
 highQ=!highQ;
 renderer.setPixelRatio(highQ?Math.min(window.devicePixelRatio||1,2):1);
 renderer.setSize(window.innerWidth,window.innerHeight);
 e.currentTarget.textContent=highQ?'⚙️ الجودة: 4K':'⚙️ الجودة: عادية';e.currentTarget.blur();};
window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);});

/* ---------- الحلقة ---------- */
const UP=new THREE.Vector3(0,1,0);
const AXIS_X=new THREE.Vector3(1,0,0);
const AXIS_Z=new THREE.Vector3(0,0,1);
const camPos=new THREE.Vector3(),tanV=new THREE.Vector3(),rightV=new THREE.Vector3(),tmpV=new THREE.Vector3();
const baseQ=new THREE.Quaternion(),qYaw=new THREE.Quaternion(),qPitch=new THREE.Quaternion(),qRoll=new THREE.Quaternion();
const m4=new THREE.Matrix4();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.05);
 const t=clock.elapsedTime;
 const turn=(move.left?1:0)-(move.right?1:0);
 if(turn!==0)yawOff=THREE.MathUtils.clamp(yawOff+turn*1.5*dt,-1.3,1.3);
 const inF=(move.up?1:0)-(move.down?1:0);
 const autoF=autoOn?1:0;
 const dirF=inF!==0?inF:autoF;
 let dist=0;
 if(dirF!==0){
  dist=(dirF>0?2.2:1.2)*dt;
  progress=THREE.MathUtils.clamp(progress+dirF*dist,0,pathLen-0.5);
  if(turn===0&&dirF>0)yawOff*=Math.exp(-dt*0.9);
  bobAmp+=Math.min(dt*6,1);
  bobPhase+=dist*Math.PI/0.7;
 }else{
  bobAmp*=Math.exp(-dt*4);
 }
 const u=THREE.MathUtils.clamp(progress/pathLen,0,1);
 pathCurve.getPointAt(u,camPos);
 pathCurve.getTangentAt(u,tanV);tanV.y=0;tanV.normalize();
 rightV.crossVectors(tanV,UP).normalize();
 const swayX=Math.sin(bobPhase*0.5)*0.03*bobAmp;
 camPos.addScaledVector(rightV,swayX);
 const extra=Math.abs(Math.sin(bobPhase))*0.045*bobAmp;
 camPos.y=1.7+extra;
 camera.position.copy(camPos);
 tmpV.copy(camPos).add(tanV);
 m4.lookAt(camPos,tmpV,UP);
 baseQ.setFromRotationMatrix(m4);
 qYaw.setFromAxisAngle(UP,yawOff);
 qPitch.setFromAxisAngle(AXIS_X,pitch+Math.sin(bobPhase*2)*0.005*bobAmp);
 qRoll.setFromAxisAngle(AXIS_Z,Math.sin(bobPhase*0.5)*0.01*bobAmp);
 camera.quaternion.copy(qYaw).multiply(baseQ).multiply(qPitch).multiply(qRoll);
 sky.position.copy(camera.position);
 sun.position.set(camera.position.x+12,16,camera.position.z+8);
 sun.target.position.copy(camera.position);
 sun.target.updateMatrixWorld();
 cloudItems.forEach(c=>{c.g.position.x+=c.sp*dt;if(c.g.position.x>180)c.g.position.x=-180;});
 renderer.render(scene,camera);
}
animate();
setTimeout(()=>loaderEl.classList.add('hidden'),500);
}
try{main();}catch(err){console.error(err);loaderEl.querySelector('p').textContent='تعذّر التشغيل: '+err.message;}
</script>
