<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>عالم طه · TAHA’S WORLD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.14/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.14/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.14/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.8/800.css">
<style>
:root{
  --cream:#fff8ee; --peach:#ffd9c2; --mint:#cdeee1; --sky:#cfe8ff; --lilac:#e7ddff;
  --rose:#ffd1e0; --sun:#ffe8a3; --ink:#544e63; --ink2:#8a8299; --card:#ffffffee;
  --shadow:0 10px 30px rgba(90,70,120,.14);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);
  font-family:'Cairo','Nunito',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
[lang="en"] body{font-family:'Nunito','Cairo',system-ui,sans-serif}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid #7fb4ff;outline-offset:3px;border-radius:14px}
canvas{display:block}
#scene-container{position:fixed;inset:0}
#scene-container canvas{touch-action:none;-webkit-touch-callout:none}

.icon-btn{width:62px;height:62px;border-radius:20px;font-size:27px;line-height:1;
  background:var(--card);box-shadow:var(--shadow);border:2px solid #ffffffaa;
  display:flex;align-items:center;justify-content:center;transition:transform .18s ease}
.icon-btn:hover{transform:translateY(-2px) scale(1.04)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.big{width:70px;height:70px;font-size:31px}
.big-btn{min-width:98px;min-height:66px;padding:10px 18px;border-radius:22px;font-size:17px;font-weight:800;
  background:var(--card);box-shadow:var(--shadow);border:2px solid #ffffffaa;
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;transition:transform .18s ease}
.big-btn:hover{transform:translateY(-2px)}
.big-btn:active{transform:scale(.95)}
.big-btn .bi{font-size:27px;line-height:1}
.big-btn.calm{background:linear-gradient(160deg,#e6f6ff,#e0fff4)}
.big-btn.primary{background:linear-gradient(160deg,#ffe6a8,#ffc9ab);font-size:21px;padding:16px 30px}
.chip{background:var(--card);border:2px solid #ffffffaa;border-radius:999px;
  padding:10px 18px;font-weight:800;font-size:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}

#topbar{position:fixed;top:calc(14px + var(--sat));left:14px;right:14px;display:flex;align-items:flex-start;gap:10px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar .grow{flex:1}
#left-rail{position:fixed;inset-inline-start:14px;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:30}
#cam-rail{position:fixed;inset-inline-end:14px;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:30}
#bottombar{position:fixed;left:0;right:0;bottom:calc(14px + var(--sab));display:flex;justify-content:space-between;
  align-items:flex-end;padding:0 16px;z-index:30;pointer-events:none}
#bottombar>*{pointer-events:auto}
#btn-calm{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%)}
body.text-off .lbl{display:none}
body.text-simple .lbl-sub{display:none}

#dock{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);display:flex;gap:8px;z-index:28;
  background:var(--card);padding:10px 12px;border-radius:26px;box-shadow:var(--shadow);
  border:2px solid #ffffffaa;max-width:96vw;overflow-x:auto;overscroll-behavior:contain}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;border-radius:16px;
  font-weight:800;font-size:12px;transition:transform .18s,background .3s;min-width:68px;flex:0 0 auto}
.dock-btn .de{font-size:31px;line-height:1}
.dock-btn:hover{transform:translateY(-3px);background:#ffffffaa}
.dock-btn:active{transform:scale(.94)}

#zone-panel{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);z-index:29;
  width:min(720px,95vw);background:var(--card);border-radius:26px;box-shadow:var(--shadow);
  border:2px solid #ffffffaa;padding:16px 18px;backdrop-filter:blur(10px);
  animation:rise .4s cubic-bezier(.2,.9,.3,1.2);max-height:44vh;overflow:auto;overscroll-behavior:contain}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(26px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.zp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zp-head .ze{font-size:30px}
.zp-head h3{margin:0;font-size:20px;flex:1}
.zp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.zp-hint{font-size:14px;color:var(--ink2);font-weight:700;margin:4px 0}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px;padding:10px 12px;
  border-radius:18px;background:#ffffffb0;border:2px solid #00000008;font-weight:800;font-size:13px;
  transition:transform .15s,background .3s,box-shadow .3s}
.tool-btn .te{font-size:30px;line-height:1}
.tool-btn:hover{transform:translateY(-2px)}
.tool-btn:active{transform:scale(.94)}
.tool-btn.on{background:linear-gradient(160deg,#d8f6e6,#cfeaff);box-shadow:inset 0 0 0 3px #8fd6b4}
.seg{display:flex;background:#ffffffb0;border-radius:16px;padding:4px;gap:4px;border:2px solid #00000008;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;min-width:52px;transition:background .25s}
.seg button.on{background:linear-gradient(160deg,#ffe6a8,#ffc9ab)}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;background:#eadff5;outline:none;min-width:110px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:linear-gradient(160deg,#ffd97a,#ffab7a);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#ffcf8a;border:3px solid #fff;cursor:pointer}
.pat-chip{font-size:34px;padding:4px 6px;border-radius:14px;background:#ffffffb0}
.pat-q{background:#ffe8a3;border-radius:12px;animation:softPulse 2.2s ease-in-out infinite}
@keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.shake{animation:gentleShake .5s ease}
@keyframes gentleShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.swatch{width:46px;height:46px;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12);transition:transform .15s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{outline:4px solid #8fd6b4}

#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.modal-back{position:absolute;inset:0;background:rgba(120,100,140,.28);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:auto;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--cream);border-radius:28px;box-shadow:0 24px 60px rgba(60,40,90,.25);
  width:min(560px,96vw);max-height:86vh;overflow:auto;padding:22px;border:3px solid #ffffffcc;
  animation:popIn .35s cubic-bezier(.2,.9,.3,1.2);overscroll-behavior:contain}
.modal-card.wide{width:min(760px,96vw)}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h2{margin:0;font-size:22px;flex:1}
.x-btn{width:50px;height:50px;border-radius:16px;font-size:20px;background:#ffffffb0;font-weight:800}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:18px;background:#ffffff90;margin-bottom:8px;flex-wrap:wrap}
.set-row .si{font-size:25px;width:34px;text-align:center}
.set-row .sl{font-weight:800;font-size:15px;flex:1;min-width:130px}
.toggle{width:66px;height:38px;border-radius:999px;background:#e4dcef;position:relative;transition:background .3s;flex:0 0 auto}
.toggle::after{content:'';position:absolute;top:3px;inset-inline-start:4px;width:32px;height:32px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.15);transition:inset-inline-start .25s}
.toggle.on{background:linear-gradient(160deg,#9ad8b0,#7fd0c8)}
.toggle.on::after{inset-inline-start:30px}
.feel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.feel-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:22px;
  background:#ffffffb0;font-weight:800;font-size:15px;border:2px solid #00000006;transition:transform .15s,background .3s}
.feel-btn .fe{font-size:44px;line-height:1}
.feel-btn:hover{transform:translateY(-3px);background:#fff}
.feel-btn:active{transform:scale(.94)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip-btn{padding:12px 18px;border-radius:999px;background:#ffffffb0;font-weight:800;font-size:16px;
  border:2px solid #00000006;display:flex;align-items:center;gap:8px;transition:transform .15s,background .3s}
.chip-btn .ce{font-size:24px}
.chip-btn.on{background:linear-gradient(160deg,#ffe6a8,#ffc9ab);box-shadow:inset 0 0 0 3px #ffc26b}
.sentence-view{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:#fff;border-radius:22px;padding:18px;margin:12px 0;font-size:30px;font-weight:800;min-height:84px}
.prefs-card{text-align:center}
.prefs-q{font-size:24px;font-weight:800;margin:10px 0 22px}
.prefs-opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pref-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 28px;border-radius:26px;
  background:#fff;font-weight:800;font-size:18px;min-width:145px;border:3px solid #ffe0b8;transition:transform .18s}
.pref-opt .pe{font-size:58px;line-height:1}
.pref-opt:active{transform:scale(.95)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.dot{width:10px;height:10px;border-radius:50%;background:#e0d6ee}
.dot.on{background:#ffb27a}

.help-sec{font-weight:800;margin:16px 0 8px;display:flex;gap:8px;align-items:center;font-size:17px}
.help-row{display:flex;gap:12px;align-items:center;background:#ffffff90;padding:11px 14px;border-radius:16px;
  margin-bottom:7px;font-weight:700;font-size:15px}
.help-row .he{font-size:26px;flex:0 0 auto;width:36px;text-align:center}
.safe-band{background:linear-gradient(160deg,#e0fff4,#e6f6ff);border-radius:20px;padding:14px;margin-top:6px}
.stat-row{display:flex;align-items:center;gap:10px;background:#ffffff90;border-radius:16px;padding:10px 14px;margin-bottom:7px;font-weight:800}
.stat-row .sv{margin-inline-start:auto;color:#7a6f95}
.report-pre{background:#fff;border-radius:16px;padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;
  max-height:30vh;overflow:auto;font-family:inherit;font-weight:700;color:#6a6280}

#toasts{position:fixed;top:calc(74px + var(--sat));left:50%;transform:translateX(-50%);z-index:55;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--card);border:2px solid #ffffffaa;border-radius:999px;padding:12px 24px;font-weight:800;
  font-size:16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;text-align:center;
  animation:toastIn .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{animation:toastOut .5s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.94)}}

#calm-ui{position:fixed;inset:0;z-index:40;pointer-events:none}
#calm-back{position:absolute;top:calc(14px + var(--sat));inset-inline-start:14px;pointer-events:auto}
#breath-wrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:26px;pointer-events:auto}
#breath{width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffffffdd,#bfe6ff88 55%,#bfe6ff22 75%);
  box-shadow:0 0 60px #bfe6ff88;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
#breath-hide{background:#ffffffb0;border-radius:999px;padding:9px 18px;font-weight:800}

#joy{position:fixed;inset-inline-start:20px;bottom:calc(108px + var(--sab));width:128px;height:128px;border-radius:50%;
  background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);z-index:34;touch-action:none;
  box-shadow:var(--shadow)}
#joy-nub{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);
  background:linear-gradient(160deg,#ffd97a,#ffab7a);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
#fps-hint{position:fixed;bottom:calc(100px + var(--sab));inset-inline-end:16px;z-index:33;background:var(--card);
  border-radius:18px;padding:10px 14px;font-weight:800;font-size:13px;box-shadow:var(--shadow);max-width:200px;text-align:center}

#title-card{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fff3e0,#ffe3ec 45%,#e3ecff);transition:opacity .8s ease;overflow:auto;padding:20px}
#title-card.gone{opacity:0;pointer-events:none}
.title-inner{text-align:center;animation:popIn .8s cubic-bezier(.2,.9,.3,1.2);max-width:580px}
.title-emoji{font-size:78px;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#title-card h1{font-size:clamp(30px,6vw,54px);margin:8px 0 4px;letter-spacing:2px}
#title-card .tsub{font-family:'Nunito',sans-serif;letter-spacing:6px;font-size:clamp(12px,2vw,16px);
  color:var(--ink2);font-weight:800;margin-bottom:10px}
#dedication{max-width:min(660px,92vw);margin:0 auto 26px;background:#ffffffb0;border:2px solid #ffffffcc;
  border-radius:24px;padding:18px 22px;box-shadow:0 10px 30px rgba(90,70,120,.12);
  font-size:clamp(13px,2.2vw,16px);line-height:2.05;font-weight:700;color:#6b6480;
  font-family:'Cairo','Nunito',sans-serif;direction:rtl}
#dedication .from{display:block;color:#a89ec0;font-size:.86em;margin-bottom:8px;letter-spacing:1px}
#dedication .who{color:#d98a6a}
#how-to{list-style:none;margin:18px auto 6px;padding:0;max-width:340px;text-align:start;
  display:flex;flex-direction:column;gap:9px}
#how-to li{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;line-height:1.5;opacity:.92}
#how-to .ht-i{flex:0 0 auto;font-size:1.05rem;line-height:1.4}
@media (max-width:640px){#how-to{max-width:300px;font-size:.9rem}}
#title-card .en-title{font-size:14px;letter-spacing:3px;color:var(--ink2);font-weight:800}
#title-card .tag{color:var(--ink2);font-weight:700;font-size:clamp(14px,2.6vw,19px);margin:10px 0 22px}
.title-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.touch-mini{display:flex;gap:18px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.touch-mini div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:12px;color:var(--ink2)}
.touch-mini span{font-size:32px}
#fade{position:fixed;inset:0;background:#fff8ee;z-index:70;pointer-events:none;opacity:0;transition:opacity .5s ease}
#tint{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:opacity 1.2s ease}

@media (max-width:700px){
  .big-btn{min-width:80px;min-height:62px;padding:8px 12px;font-size:13px}
  .icon-btn{width:54px;height:54px;font-size:23px;border-radius:18px}
  .icon-btn.big{width:60px;height:60px;font-size:26px}
  #dock{bottom:calc(92px + var(--sab));padding:8px}
  .dock-btn{min-width:58px;font-size:10px;padding:5px 7px}
  .dock-btn .de{font-size:26px}
  #zone-panel{bottom:calc(88px + var(--sab));padding:12px;max-height:40vh}
  #left-rail{top:auto;bottom:calc(178px + var(--sab));transform:none}
  #cam-rail{top:calc(84px + var(--sat));transform:none}
  .modal-card{padding:16px;border-radius:22px}
  #joy{width:112px;height:112px;bottom:calc(100px + var(--sab))}
  #joy-nub{width:50px;height:50px}
}
@media (max-height:520px){#left-rail,#cam-rail{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="tint"></div>

<header id="topbar">
  <div id="zone-chip" class="chip" aria-live="polite">🕊️ <span class="lbl" data-i18n="title"></span></div>
  <div class="grow"></div>
  <button id="btn-sound" class="icon-btn" aria-label="الصوت">🔊</button>
</header>

<nav id="left-rail" aria-label="التواصل">
  <button id="btn-feel" class="icon-btn big" aria-label="المشاعر">🙂</button>
  <button id="btn-talk" class="icon-btn big" aria-label="تحدّث">💬</button>
  <button id="btn-help" class="icon-btn big" aria-label="التعليمات">❓</button>
</nav>

<nav id="cam-rail" aria-label="الكاميرا">
  <button id="btn-view" class="icon-btn" aria-label="تبديل المنظور">👁️</button>
  <button id="btn-zoom-in" class="icon-btn" aria-label="تكبير">➕</button>
  <button id="btn-zoom-out" class="icon-btn" aria-label="تصغير">➖</button>
  <button id="btn-camlock" class="icon-btn" aria-pressed="false" aria-label="قفل الكاميرا">🔓</button>
</nav>

<footer id="bottombar">
  <button id="btn-home" class="big-btn" aria-label="البيت"><span class="bi">🏠</span><span class="lbl lbl-sub" data-i18n="home"></span></button>
  <button id="btn-calm" class="big-btn calm" aria-label="مساحة الهدوء"><span class="bi">🫧</span><span class="lbl lbl-sub" data-i18n="calm"></span></button>
  <button id="btn-settings" class="big-btn" aria-label="الإعدادات"><span class="bi">⚙️</span><span class="lbl lbl-sub" data-i18n="settings"></span></button>
</footer>

<nav id="dock" hidden aria-label="العوالم"></nav>
<section id="zone-panel" hidden></section>

<div id="joy" hidden><div id="joy-nub"></div></div>
<div id="fps-hint" hidden></div>

<div id="calm-ui" hidden>
  <button id="calm-back" class="big-btn"><span class="bi">⬅️</span><span class="lbl" data-i18n="back"></span></button>
  <div id="breath-wrap">
    <div id="breath"></div>
    <button id="breath-hide">🙈 <span class="lbl" data-i18n="hide"></span></button>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="fade"></div>

<div id="title-card">
  <div class="title-inner">
    <div class="title-emoji">🕊️</div>
    <h1>عالم طه</h1>
    <div class="tsub">TAHA’S WORLD</div>
    <p class="tag" data-i18n="tagline"></p>
    <div id="dedication">
      <span class="from">إهداء من تحت النخلة</span>
      إلى <span class="who">الكنز الغالي</span>، والرُّوح الثمينة، والقلب الطاهر،
      والعينَين اللامعتَين — إلى القلب النقيّ، إلى الشجاع الذكيّ:
      <b>طه</b>، وإلى جميع أطفال التوحّد في العالم.
    </div>
    <ul id="how-to">
      <li><span class="ht-i">👆</span> <span data-i18n="how1"></span></li>
      <li><span class="ht-i">🕊️</span> <span data-i18n="how2"></span></li>
      <li><span class="ht-i">🗺️</span> <span data-i18n="how3"></span></li>
      <li><span class="ht-i">🤍</span> <span data-i18n="how4"></span></li>

const sortBalls=[],sortBaskets=[];
(function buildSort(){
 const g=ZONES.sort.group;
 const rug=new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.6,.1,40),M('#fff0d0',{roughness:1}));
 rug.position.y=.34;rug.receiveShadow=true;g.add(rug);
 const cols=[['#ff9aa2','🔴'],['#8fd0ea','🔵'],['#ffd97a','🟡']];
 cols.forEach(([c,e],i)=>{const a=i/3*Math.PI*2-Math.PI/2;
  const grp=new THREE.Group();grp.position.set(Math.cos(a)*3,.34,Math.sin(a)*3);
  const bk=new THREE.Mesh(new THREE.CylinderGeometry(.62,.5,.5,18,1,true),M(c,{side:THREE.DoubleSide}));
  bk.position.y=.25;grp.add(bk);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.06,18),M(c));base.position.y=.03;grp.add(base);
  g.add(grp);sortBaskets.push({pos:grp.position.clone(),color:c,grp});
  makeTappable(grp,()=>{AudioSys.soft();grp.scale.setScalar(1.06);setTimeout(()=>grp.scale.setScalar(1),200)})});
 cols.forEach(([c],ci)=>{for(let j=0;j<2;j++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),M(c,{roughness:.5}));
  const an=rand(0,6);m.position.set(Math.cos(an)*1.6,.64,Math.sin(an)*1.6);m.castShadow=true;g.add(m);
  const ball={mesh:m,color:c,home:m.position.clone(),done:false};sortBalls.push(ball);
  makeDraggable(m,{planeY:.64,radius:4.3,center:g});
  makeTappable(m,()=>{AudioSys.soft()})}});
})();
function checkSortDrop(mesh){const ball=sortBalls.find(b=>b.mesh===mesh);if(!ball||ball.done)return;
 let nearest=null,nd=1.1;
 sortBaskets.forEach(bk=>{const d=Math.hypot(mesh.position.x-bk.pos.x- ZONES.sort.group.position.x*0+ (mesh.position.x-bk.pos.x),mesh.position.z-bk.pos.z);
  const dd=Math.hypot(mesh.position.x-bk.pos.x,mesh.position.z-bk.pos.z);
  if(dd<nd){nd=dd;nearest=bk}});
 if(!nearest)return;
 if(nearest.color===ball.color){ball.done=true;AudioSys.chime();
  nearest.grp.scale.setScalar(1.12);setTimeout(()=>nearest.grp.scale.setScalar(1),300);
  const shrink=()=>{if(ball.mesh.scale.x>.05){ball.mesh.scale.multiplyScalar(.9);
   ball.mesh.position.lerp(new THREE.Vector3(nearest.pos.x,.6,nearest.pos.z),.2);requestAnimationFrame(shrink)}
   else ball.mesh.visible=false};shrink();
  if(sortBalls.every(b=>b.done)){toast('🧺','🌟');discover('sortAll','🌟','d_discover')}}
 else{ball.mesh.userData.wob=.6;
  ball.mesh.userData.targetPos=ball.home.clone();
  setTimeout(()=>{ball.mesh.userData.targetPos=null},2200)}}
worldAnims.push(dt=>{sortBalls.forEach(b=>{
 if(b.mesh.userData.targetPos){damp3(b.mesh.position,b.mesh.userData.targetPos,3,dt)}
 if(b.mesh.userData.wob>0){b.mesh.userData.wob-=dt;b.mesh.rotation.z=Math.sin(b.mesh.userData.wob*18)*.12*b.mesh.userData.wob}
 else b.mesh.rotation.z=lerp(b.mesh.rotation.z,0,.1)})});
function sortReset(){sortBalls.forEach(b=>{b.done=false;b.mesh.visible=true;b.mesh.scale.setScalar(1);
 b.mesh.position.copy(b.home)});AudioSys.soft()}

/* ================= POINTER INPUT ================= */
let dragObj=null,orbiting=false,pinchDist=0;
const pointers=new Map();
let downX=0,downY=0,downTime=0,movedFar=false;
const cvs=renderer.domElement;
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const p=[...pointers.values()];pinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  dragObj=null;orbiting=false;return}
 downX=e.clientX;downY=e.clientY;downTime=performance.now();movedFar=false;
 const hit=raycastAt(e.clientX,e.clientY,[...dragTargets,...tapTargets]);
 if(hit&&hit.obj.userData.dragCfg&&state.view==='orbit'){dragObj={mesh:hit.obj,cfg:hit.obj.userData.dragCfg};
  if(hit.obj.userData.targetPos)hit.obj.userData.targetPos=null;}
 else if(hit&&hit.obj.userData.onTap){dragObj={mesh:hit.obj,cfg:null}}
 else orbiting=true});
window.addEventListener('pointermove',e=>{
 const prev=pointers.get(e.pointerId);
 if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  if(pinchDist>0)cam.tRadius=clamp(cam.tRadius*(pinchDist/d),cam.minR,cam.maxR);
  pinchDist=d;return}
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>10)movedFar=true;
 const dx=prev?e.clientX-prev.x:0,dy=prev?e.clientY-prev.y:0;
 if(dragObj&&dragObj.cfg&&movedFar){
  ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const c=dragObj.cfg.center?dragObj.cfg.center.position:new THREE.Vector3();
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-(dragObj.cfg.planeY+c.y));
  const pt=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(plane,pt)){
   let nx=pt.x-c.x,nz=pt.z-c.z;
   if(dragObj.cfg.radius){const d=Math.hypot(nx,nz);if(d>dragObj.cfg.radius){nx*=dragObj.cfg.radius/d;nz*=dragObj.cfg.radius/d}}
   if(dragObj.cfg.box){nx=clamp(nx,-dragObj.cfg.box.x,dragObj.cfg.box.x);nz=clamp(nz,-dragObj.cfg.box.z,dragObj.cfg.box.z)}
   dragObj.mesh.position.set(nx+c.x,dragObj.cfg.planeY+c.y+.3,nz+c.z)}}
 else if(orbiting&&movedFar&&!cam.locked){
  if(state.view==='fps'&&worldG.visible){tFpsYaw-=dx*.0045;tFpsPitch=clamp(tFpsPitch-dy*.0035,-1.1,1.1)}
  else{cam.tTheta-=dx*.0045;cam.tPhi=clamp(cam.tPhi-dy*.0035,.35,1.45)}}
 else if(!dragObj&&!orbiting&&!movedFar&&!isTouch){
  const h=raycastAt(e.clientX,e.clientY,tapTargets);
  const nm=h?h.obj:null;
  if(nm!==hoverObj){
   if(hoverObj)hoverObj.scale.setScalar(hoverObj.userData._bs||1);
   hoverObj=nm;cvs.style.cursor=nm?'pointer':'default';
   if(nm){nm.userData._bs=nm.userData._bs||nm.scale.x;nm.scale.setScalar(nm.userData._bs*1.06)}}}});
function endPointer(e){if(!pointers.has(e.pointerId))return;
 pointers.delete(e.pointerId);pinchDist=0;
 const wasTap=!movedFar&&performance.now()-downTime<700;
 if(dragObj){
  if(dragObj.cfg){dragObj.mesh.position.y=dragObj.cfg.planeY+(dragObj.cfg.center?dragObj.cfg.center.position.y:0);
   if(dragObj.mesh.userData.sortPiece)dragObj.mesh.userData.sortPiece.placed=false;
   saveFurnitureIf(dragObj.mesh);checkSortDrop(dragObj.mesh)}
  else if(wasTap&&dragObj.mesh.userData.onTap)dragObj.mesh.userData.onTap(null)}
 else if(orbiting&&wasTap){const h=raycastAt(e.clientX,e.clientY,tapTargets);
  if(h&&h.obj.userData.onTap)h.obj.userData.onTap(h)}
 dragObj=null;orbiting=false}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
function saveFurnitureIf(mesh){if(!furnitureGroup||!furnitureGroup.children.includes(mesh))return;
 const idx=furnitureGroup.children.indexOf(mesh);
 if(S.d.furniture[idx]){S.d.furniture[idx].x=mesh.position.x;S.d.furniture[idx].z=mesh.position.z;S.save()}}

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='Escape'){closeTopModal();if(state.calm)toggleCalm(false);return}
 if(state.phase!=='play')return;
 if(e.key==='+'||e.key==='=')cam.tRadius=clamp(cam.tRadius*.9,cam.minR,cam.maxR);
 if(e.key==='-'||e.key==='_')cam.tRadius=clamp(cam.tRadius*1.1,cam.minR,cam.maxR);
 if(e.key==='h'||e.key==='H')goHub();
 if(e.key==='c'||e.key==='C')toggleCalm();
 if(e.key==='v'||e.key==='V')toggleView();
 const zk=['1','2','3','4','5','6','7','8','9','0'];
 const zi=zk.indexOf(e.key);
 if(zi>=0&&worldG.visible&&zi<Object.keys(ZONES).length)goToZone(Object.keys(ZONES)[zi]);});

const modalStack=[];
function openModal({title,emoji,build,wide,onClose}){
 const back=document.createElement('div');back.className='modal-back';
 const card=document.createElement('div');card.className='modal-card'+(wide?' wide':'');
 card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');
 const head=document.createElement('div');head.className='modal-head';
 head.innerHTML=`<span style="font-size:30px">${emoji||''}</span><h2>${title||''}</h2>`;
 const x=document.createElement('button');x.className='x-btn';x.textContent='✖';
 x.setAttribute('aria-label',t('close'));x.onclick=()=>closeModal(back);
 head.appendChild(x);card.appendChild(head);
 const body=document.createElement('div');card.appendChild(body);
 back.appendChild(card);
 back.addEventListener('pointerdown',e=>{if(e.target===back)closeModal(back)});
 $('#modal-root').appendChild(back);
 modalStack.push({back,onClose});
 build(body,()=>closeModal(back));
 const fb=card.querySelector('button');if(fb)fb.focus();
 return back}
function closeModal(back){const i=modalStack.findIndex(m=>m.back===back);
 if(i<0)return;const m=modalStack.splice(i,1)[0];
 m.back.style.opacity=0;setTimeout(()=>m.back.remove(),250);if(m.onClose)m.onClose()}
function closeTopModal(){if(modalStack.length)closeModal(modalStack[modalStack.length-1].back)}

  for(let i=0;i<16*particleScale()+4;i++){const b=sprite('#dff4ff',rand(.2,.5));
   b.position.set(playerPos.x+rand(-6,6),rand(-1,6),playerPos.z+rand(-6,6));

 else{sLog('calm','exit');AudioSys.duck(false);$('#calm-ui').hidden=true;

 updateLighting()}

   body.appendChild(r)});
  const rb=row(body);rb.style.justifyContent='center';rb.style.gap='14px';
  const spec=document.createElement('button');spec.className='tool-btn';
  spec.innerHTML=`<span class="te">🩺</span><span>${t('spec')}</span>`;
  spec.onclick=()=>{closeTopModal();setTimeout(openReport,280)};rb.appendChild(spec);
  const reset=document.createElement('button');reset.className='tool-btn';
  reset.innerHTML=`<span class="te">🌱</span><span>${t('s_reset')}</span>`;
  reset.onclick=()=>{try{localStorage.removeItem(S.key)}catch(e){}location.reload()};
  rb.appendChild(reset);
  const philo=document.createElement('p');
  philo.style.cssText='text-align:center;color:var(--ink2);font-weight:700;margin:14px 0 4px;font-size:14px';
  philo.textContent=t('philo');body.appendChild(philo)}})}
function fmtDur(ms){const m=Math.floor(ms/60000);return m+' '+t('mins')}
function reportText(){
 const mins=fmtDur(Date.now()-Session.t0);
 const zoneNames=Object.entries(Session.zones).map(([k,v])=>`${ZONES[k].e} ${t(ZONES[k].i18n)} ×${v}`).join('، ')||t('noneAfter');
 const emo=Object.entries(Session.emotions).map(([k,v])=>`${t(k)} ×${v}`).join('، ')||t('noneAfter');
 const sents=Session.sentences.join(' • ')||t('noneAfter');
 return `${t('title')} — ${t('specTitle')}\n${new Date().toLocaleString()}\n────────────\n`+
 `${t('duration')}: ${mins}\n${t('visits')}: ${zoneNames}\n${t('emotionsU')}: ${emo}\n`+
 `${t('sentencesU')}: ${sents}\n${t('calmU')}: ${Session.calm}\n${t('discU')}: ${Session.disc}\n────────────\n${t('specNote')}`}
function openReport(){
 openModal({title:t('specTitle'),emoji:'🩺',wide:true,build:body=>{
  const note=document.createElement('p');
  note.style.cssText='font-weight:700;color:var(--ink2);font-size:14px;margin:0 0 12px';
  note.textContent=t('specNote');body.appendChild(note);
  const mk=(ic,lb,vl)=>{const r=document.createElement('div');r.className='stat-row';
   r.innerHTML=`<span>${ic}</span><span>${lb}</span><span class="sv">${vl}</span>`;body.appendChild(r)};
  mk('⏱️',t('duration'),fmtDur(Date.now()-Session.t0));
  mk('🗺️',t('visits'),Object.keys(Session.zones).length);
  mk('🙂',t('emotionsU'),Object.values(Session.emotions).reduce((a,b)=>a+b,0));
  mk('💬',t('sentencesU'),Session.sentences.length);
  mk('🫧',t('calmU'),Session.calm);
  mk('⭐',t('discU'),Session.disc);
  const pre=document.createElement('div');pre.className='report-pre';pre.textContent=reportText();body.appendChild(pre);
  const r=row(body);r.style.justifyContent='center';r.style.gap='12px';
  const cp=document.createElement('button');cp.className='tool-btn';
  cp.innerHTML=`<span class="te">📋</span><span>${t('copy')}</span>`;
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(reportText());toast('📋',t('copied'))}
   catch(e){const ta=document.createElement('textarea');ta.value=reportText();document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast('📋',t('copied'))}};
  r.appendChild(cp);
  const dl=document.createElement('button');dl.className='tool-btn';
  dl.innerHTML=`<span class="te">⬇️</span><span>${t('download')}</span>`;
  dl.onclick=()=>{const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);
   a.download='my-little-world-session.txt';a.click();URL.revokeObjectURL(a.href)};
  r.appendChild(dl);
  const ns=document.createElement('button');ns.className='tool-btn';
  ns.innerHTML=`<span class="te">🌱</span><span>${t('newSession')}</span>`;
  ns.onclick=()=>{Session.t0=Date.now();Session.zones={};Session.emotions={};Session.sentences=[];
   Session.calm=0;Session.disc=0;Session.events=[];closeTopModal();toast('🌱','✓')};
  r.appendChild(ns)}})}

/* ================= PERSONALIZATION ================= */
const PREFS=[
 {q:'pq_sound',opts:[['🔊','p_soundOn',{music:'normal',sound:60}],['🤫','p_soundOff',{music:'off',effects:'low',sound:22}]]},
 {q:'pq_speed',opts:[['🐇','p_fast',{anim:'normal',camera:'normal'}],['🐢','p_slow',{anim:'low',camera:'low'}]]},
 {q:'pq_light',opts:[['🌈','p_color',{light:'normal'}],['🌙','p_soft',{light:'soft',particles:'low'}]]},
 {q:'pq_focus',opts:[['👧','p_chars',{chars:true}],['🌳','p_env',{chars:false}]]}];
function runPrefs(idx=0){
 if(idx>=PREFS.length){S.d.prefsDone=true;S.save();toast('🕊️',t('p_done'));
  if(!S.d.helpSeen)setTimeout(()=>openHelp(true),900);return}
 const q=PREFS[idx];
 openModal({title:'',emoji:'',build:(body,close)=>{
  body.classList.add('prefs-card');
  body.innerHTML=`<div style="font-size:16px;color:var(--ink2);font-weight:800">${idx+1} / ${PREFS.length}</div>
   <div class="prefs-q">${t(q.q)}</div>`;
  const opts=document.createElement('div');opts.className='prefs-opts';
  q.opts.forEach(([em,lbl,fx])=>{const b=document.createElement('button');b.className='pref-opt';
   b.innerHTML=`<span class="pe">${em}</span><span>${t(lbl)}</span>`;
   b.onclick=()=>{Object.assign(S.d.settings,fx);S.save();applySettings();
    AudioSys.soft();close();setTimeout(()=>runPrefs(idx+1),320)};
   opts.appendChild(b)});
  body.appendChild(opts);
  const sk=document.createElement('button');
  sk.style.cssText='margin-top:18px;font-weight:800;color:var(--ink2);padding:10px 18px';
  sk.textContent='➡️ '+t('skip');
  sk.onclick=()=>{close();setTimeout(()=>runPrefs(idx+1),300)};
  body.appendChild(sk);
  const dots=document.createElement('div');dots.className='dots';
  PREFS.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===idx?' on':'');dots.appendChild(d)});
  body.appendChild(dots)}})}

/* ================= TITLE / ENTRY ================= */
$('#btn-begin').onclick=()=>{AudioSys.init();AudioSys.resume();
 $('#title-card').classList.add('gone');
 state.phase='play';state.ready=true;
 skyMat.uniforms.uTop.value.set('#d8cfe8');skyMat.uniforms.uBot.value.set('#ffe9d8');
 setCam({look:{x:0,y:1.4,z:-1},theta:.9,phi:1.3,radius:11.5});
 setTimeout(()=>setCam({look:{x:4,y:1.8,z:-5.2},theta:.35,phi:1.18,radius:6}),400);
 cam.minR=4;cam.maxR=15;
 setChip('🛏️','zoneBedroom');
 updateLighting();
 setTimeout(()=>hint('door','🕊️',t('h_door')),2500)};
function enterWorld(){if(!worldG.visible){
 $('#fade').style.opacity=1;AudioSys.soft();sLog('enter','world');
 setTimeout(()=>{bedroomG.visible=false;worldG.visible=true;
  avatar.visible=state.view==='orbit';
  skyMat.uniforms.uTop.value.set('#bfe0ff');skyMat.uniforms.uBot.value.set('#fff1e0');
  buildDock();$('#dock').hidden=false;
  setCam(zoneCamView(null));cam.minR=8;cam.maxR=48;
  setChip('🏝️','zoneHub');applyWindowView();
  $('#fade').style.opacity=0;
  if(!S.d.firstWorld){S.d.firstWorld=true;S.save();
   setTimeout(()=>runPrefs(0),1000)}
  else{if(!S.d.helpSeen)setTimeout(()=>openHelp(true),900);
   else setTimeout(()=>hint('map1','👆',t('h_map')),1000)}
  if(isTouch)setTimeout(()=>hint('touch1','🤏',t('h_touch')),3400);
  setTimeout(()=>hint('view1','👁️',t('h_view')),6200);
 },650)}}

$('#btn-home').onclick=()=>{AudioSys.init();AudioSys.soft();goHub()};
$('#btn-sound').onclick=()=>{AudioSys.init();AudioSys.setMuted(!AudioSys.muted)};
$('#btn-sound').textContent=S.d.settings.muted?'🔇':'🔊';
$('#btn-zoom-in').onclick=()=>cam.tRadius=clamp(cam.tRadius*.82,cam.minR,cam.maxR);
$('#btn-zoom-out').onclick=()=>cam.tRadius=clamp(cam.tRadius*1.22,cam.minR,cam.maxR);
$('#btn-camlock').onclick=e=>{cam.locked=!cam.locked;
 e.currentTarget.textContent=cam.locked?'🔒':'🔓';e.currentTarget.setAttribute('aria-pressed',cam.locked)};
document.addEventListener('touchstart',()=>{AudioSys.init();AudioSys.resume()},{passive:true});

/* ================= MAIN LOOP ================= */
const clock=new THREE.Clock();let clockTime=0;
function animate(){requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);clockTime+=dt*timeScale;
 const ts=dt*timeScale;
 fpsMove(dt);
 if(bedroomG.visible)bedroomAnims.forEach(f=>f(ts));
 if(worldG.visible){worldAnims.forEach(f=>f(ts));
  if(avatar.visible){avatar.position.lerp(playerPos,.2);avatar.rotation.y=fpsYaw+Math.PI}}
 for(let i=bubbles3D.length-1;i>=0;i--){const b=bubbles3D[i];
  b.position.y+=b.userData.v*ts;b.material.opacity=clamp((5-b.position.y)/3,0,.7);
  if(b.position.y>5){worldG.remove(b);bubbles3D.splice(i,1)}}
 for(let i=calmBubbles.length-1;i>=0;i--){const b=calmBubbles[i];
  b.position.y+=b.userData.v*ts;
  if(b.position.y>8)b.position.y=-1}
 updateCam(dt);
 renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

applySettings();applyI18n();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches&&S.d.settings.camera==='normal'){
 S.d.settings.camera='low';S.d.settings.particles='low';applySettings()}
animate();
</script>
