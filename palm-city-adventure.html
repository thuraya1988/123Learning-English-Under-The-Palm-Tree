const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,u)=>a+(b-a)*u;
const ease3=u=>1-Math.pow(1-clamp(u,0,1),3);
const qb=(p0,p1,p2,u)=>{const v=1-u;return v*v*p0+2*v*u*p1+u*u*p2};
const h1=x=>{const s=Math.sin(x*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function mulberry(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,t|1);r^=r+Math.imul(r^r>>>7,r|61);return((r^r>>>14)>>>0)/4294967296}}
function RNG(seed){const f=mulberry(seed);return{r:(a,b)=>a+f()*(b-a),i:(a,b)=>Math.floor(a+f()*(b-a+1)),p:()=>f()}}
function blob(c,pts){const n=pts.length;c.beginPath();
  c.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}
  c.closePath()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

let AC=null,MG=null,muted=false,waterG=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain();MG.gain.value=.42;MG.connect(AC.destination);
  const mkNoise=()=>{const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b};
  const wind=AC.createBufferSource();wind.buffer=mkNoise();wind.loop=true;
  const wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=240;
  const wg=AC.createGain();wg.gain.value=.035;wind.connect(wf);wf.connect(wg);wg.connect(MG);wind.start();
  const wat=AC.createBufferSource();wat.buffer=mkNoise();wat.loop=true;
  const af=AC.createBiquadFilter();af.type='bandpass';af.frequency.value=900;af.Q.value=.6;
  waterG=AC.createGain();waterG.gain.value=0;wat.connect(af);af.connect(waterG);waterG.connect(MG);wat.start();
  setInterval(()=>{if(!muted&&Math.random()<.7)chirp()},2600);
}catch(e){}}
function tone(f,d,type,v,dl,sl){if(!AC||muted)return;try{const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(dl||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v||.2,t0+.014);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
function noiseB(d,v,fq){if(!AC||muted)return;try{const n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;n.buffer=b;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||900;
  const g=AC.createGain(),t0=AC.currentTime;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  n.connect(f);f.connect(g);g.connect(MG);n.start(t0);}catch(e){}}

/* EMOJI-STYLE FRONDS — one smooth solid drooping blade per frond, like 🌴 */
const PG_M=['#4E9153','#3A7A46','#337A42'];
const PG_D=['#2E6B3E','#275433','#1F4527'];
const PG_GLOW=['#DDEE9E','#C7DE86','#B9D66E'];
function frond(c,x,y,ang,len,ci,ph,glow,detail,back,droop){
  droop=droop===undefined?1:droop;
  ang+=Math.sin(T*1.35+ph)*.05;
  /* bend toward the ground on whichever side the frond points, so the whole
     crown droops down like 🌴 instead of curling up on the far side */
  const side=ang>-Math.PI/2?1:-1;
  const N=10,pts=[];let px=x,py=y,a=ang;pts.push([px,py]);
  for(let k=1;k<=N;k++){a+=side*(.85*droop/N);px+=Math.cos(a)*len/N;py+=Math.sin(a)*len/N;pts.push([px,py])}
  /* single blade silhouette: flares wide just past the base, then tapers
     smoothly to a fine point at the tip — the classic emoji palm-leaf shape */
  const peak=.3,wMax=len*.16,left=[],right=[];
  for(let k=0;k<=N;k++){
    const u=k/N;
    const ta=k===0?ang:Math.atan2(pts[k][1]-pts[k-1][1],pts[k][0]-pts[k-1][0]);
    const w=u<peak?wMax*Math.sin((Math.PI/2)*(u/peak)):wMax*Math.sin((Math.PI/2)*(1-(u-peak)/(1-peak)));
    const nx=Math.cos(ta+Math.PI/2),ny=Math.sin(ta+Math.PI/2);
    left.push([pts[k][0]+nx*w,pts[k][1]+ny*w]);
    right.push([pts[k][0]-nx*w,pts[k][1]-ny*w]);
  }
  const pal=glow?PG_GLOW:(back?PG_D:PG_M);
  c.fillStyle=pal[ci%pal.length];
  c.beginPath();
  c.moveTo(left[0][0],left[0][1]);for(let k=1;k<=N;k++)c.lineTo(left[k][0],left[k][1]);
  for(let k=N;k>=0;k--)c.lineTo(right[k][0],right[k][1]);
  c.closePath();c.fill();
  c.strokeStyle=back?'#1F4527':'#2A5230';c.lineWidth=1.6;c.stroke();
  c.strokeStyle='rgba(20,40,15,.35)';c.lineWidth=1.2;
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<=N;k++)c.lineTo(pts[k][0],pts[k][1]);c.stroke();
}

function palmShape(c,bx,by,h,lean,big,seed,shadow){
  const rng=RNG(seed);
  const shk=(trunkShake>0&&bx===1700)?Math.sin(T*44)*5*trunkShake:0;
  const gust=Math.sin(T*.5+bx*.002)*1.6;
  const sway=Math.sin(T*.8+seed)*(big?3.2:2.2)+gust;
  const tx=bx+lean*h*.25+sway+shk,ty=by-h;
  if(shadow){c.fillStyle='rgba(60,40,15,.2)';c.beginPath();c.ellipse(bx+lean*16,by+5,h*.16+16,6.5,0,0,TAU);c.fill();}
  const bw=big?17:10.5,tw=big?8:5,L=[],R=[];
  for(let i=0;i<=9;i++){const u=i/9;
    const px=qb(bx,bx+lean*h*.08,tx,u),py=qb(by,by-h*.55,ty,u);
    let w=(bw+(tw-bw)*u)*(1+.1*Math.sin(i*2.3+seed));
    if(i<2)w*=1.25;
    const dx=2*(1-u)*(bx+lean*h*.08-bx)+2*u*(tx-(bx+lean*h*.08));
    const dy=2*(1-u)*(by-h*.55-by)+2*u*(ty-(by-h*.55));
    const dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl;
    L.push([px+nx*w,py+ny*w]);R.push([px-nx*w,py-ny*w])}
  c.beginPath();c.moveTo(L[0][0],L[0][1]);for(let i=1;i<=9;i++)c.lineTo(L[i][0],L[i][1]);
  for(let i=9;i>=0;i--)c.lineTo(R[i][0],R[i][1]);c.closePath();
  const tg=c.createLinearGradient(bx-bw,0,bx+bw,0);
  tg.addColorStop(0,'#5F3A20');tg.addColorStop(.5,'#8A5A36');tg.addColorStop(1,'#A87244');
  c.fillStyle=tg;c.fill();
  c.strokeStyle='rgba(60,35,15,.3)';c.lineWidth=1.4;
  for(let i=1;i<9;i++){const u=i/9,px=qb(bx,bx+lean*h*.08,tx,u),py=qb(by,by-h*.55,ty,u);
    c.beginPath();c.moveTo(L[i][0],L[i][1]);c.quadraticCurveTo(px,py+3.5,R[i][0],R[i][1]);c.stroke()}
  c.strokeStyle='#7E5A2E';c.lineWidth=2.6;
  const sk=big?5:3;
  for(let k=0;k<sk;k++){const a=Math.PI*.5+(k-(sk-1)/2)*.35;
    c.beginPath();c.moveTo(tx,ty+5);
    c.quadraticCurveTo(tx+Math.cos(a)*14,ty+26,tx+Math.cos(a)*20,ty+44+Math.sin(T*1.1+k)*2);c.stroke()}
  /* irregular, layered crown spread instead of an even fan — real crowns
     cluster and gap unevenly, and no two fronds share the same length/droop */
  const CN=big?(Q===1?15:11):(Q===1?12:9);
  const crownAngs=[],crownLens=[],crownDroop=[],crownAx=[],crownAy=[];
  for(let i=0;i<CN;i++){
    const u=i/(CN-1);
    crownAngs.push(-Math.PI*lerp(.06,.94,u)+rng.r(-.16,.16));
    crownLens.push(h*(.24+rng.r(0,.22))*(big?1.06:1));
    crownDroop.push(rng.r(.7,1.4));
    crownAx.push(tx+rng.r(-h*.02,h*.02));
    crownAy.push(ty+rng.r(-h*.015,h*.025));
  }
  for(let i=0;i<CN;i++){if(i%3!==0)continue;
    frond(c,crownAx[i],crownAy[i],crownAngs[i],crownLens[i]*.9,2,i+seed,false,Q===1,true,crownDroop[i])}
  c.fillStyle='rgba(25,45,22,.35)';c.beginPath();c.ellipse(tx,ty+8,16,9,0,0,TAU);c.fill();
  frond(c,tx,ty+2,-1.32,h*.17,0,seed,false,Q===1,false);
  frond(c,tx,ty+2,-1.8,h*.15,1,seed,false,Q===1,false);
  for(const d of[[10,14],[-12,16],[0,20]]){c.strokeStyle='#6B4A22';c.lineWidth=1.6;
    c.beginPath();c.moveTo(tx,ty+6);c.lineTo(tx+d[0],ty+d[1]);c.stroke();
    for(let k=0;k<7;k++){c.fillStyle=k%2?'#D99A3A':'#C4822E';
      c.beginPath();c.arc(tx+d[0]+(k%3-1)*4.4,ty+d[1]+Math.floor(k/3)*5,3.1,0,TAU);c.fill()}}
  for(let i=0;i<CN;i++){if(i%3===0)continue;
    frond(c,crownAx[i],crownAy[i],crownAngs[i],crownLens[i],i%4,i+seed,false,Q===1,false,crownDroop[i])}
}

function bPose(vel,phase,face){
  const velF=clamp(Math.abs(vel)/45,0,1);
  const legAmp=.55,armAmp=.5,bob=4,lean=.05;
  const hipX=0,hipY=-96-velF*bob*Math.abs(Math.sin(phase));
  const Tt=58,torsoAng=lean;
  const shX=hipX+Math.sin(torsoAng)*face*Tt,shY=hipY-Math.cos(torsoAng)*Tt;
  const headAng=torsoAng*0.55;
  const HR=50,neckD=10+HR*0.78;
  const headX=shX+Math.sin(headAng)*face*neckD,headY=shY-Math.cos(headAng)*neckD;
  const legs=[];
  for(let sd=0;sd<2;sd++){
    const ph=phase+sd*Math.PI;
    const hipAng=legAmp*velF*Math.sin(ph);
    const knee=velF*Math.max(0,Math.sin(ph-Math.PI*0.9))*(0.55+legAmp*0.6);
    legs.push({hipAng,knee,f:1});
  }
  const arms=[];
  for(let sd=0;sd<2;sd++){
    const phA=phase+(sd===0?Math.PI:0);
    const a1=-armAmp*velF*Math.sin(phA);
    const elb=0.32+armAmp*velF*0.5*Math.max(0,Math.sin(phA+0.6));
    arms.push({a1,elb});
  }
  return{hipX,hipY,shX,shY,headX,headY,headAng,legs,arms,face,velF,HR,phase};
}

    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||120)*dt}

  if(leafTimer<0){leafTimer=2+Math.random()*2;
    const vis=PALMS.filter(P=>P[0]>camX-100&&P[0]<camX+VW/S+100);

function drawLightsPass(c,x0,x1){
  c.globalCompositeOperation='lighter';
  for(const L of LIGHTS){if(L.x<x0||L.x>x1)continue;
    const f=flick(L.s);
    const g=c.createRadialGradient(L.x,L.y,2,L.x,L.y,86*f);
    g.addColorStop(0,'rgba(255,196,100,'+(.34*f)+')');g.addColorStop(1,'rgba(255,196,100,0)');
    c.fillStyle=g;c.beginPath();c.arc(L.x,L.y,86*f,0,TAU);c.fill();
    c.fillStyle='rgba(255,170,70,'+(.1*f)+')';
    c.beginPath();c.ellipse(L.x,GY+6,60*f,10,0,0,TAU);c.fill()}
  for(const F of FEST){if(F.x<x0||F.x>x1||!F.lit)continue;
    const f=flick(F.x);
    const g=c.createRadialGradient(F.x,F.y,2,F.x,F.y,110*f);
    g.addColorStop(0,'rgba(255,206,110,'+(.4*f)+')');g.addColorStop(1,'rgba(255,206,110,0)');
    c.fillStyle=g;c.beginPath();c.arc(F.x,F.y,110*f,0,TAU);c.fill()}
  for(const B of BULBS){if(B.x<x0||B.x>x1)continue;
    const f=flick(B.s);
    c.fillStyle='rgba(255,214,120,'+(.5*f)+')';c.beginPath();c.arc(B.x,B.y,2.4,0,TAU);c.fill();
    const g=c.createRadialGradient(B.x,B.y,1,B.x,B.y,26);
    g.addColorStop(0,'rgba(255,206,110,'+(.22*f)+')');g.addColorStop(1,'rgba(255,206,110,0)');
    c.fillStyle=g;c.beginPath();c.arc(B.x,B.y,26,0,TAU);c.fill()}
  for(const H of HOUSES){if(H.x+H.w<x0||H.x>x1)continue;
    for(const wx of H.wins){const f=flick(wx);
      const g=c.createRadialGradient(wx,GY-H.h*.66,2,wx,GY-H.h*.66,44);
      g.addColorStop(0,'rgba(255,190,100,'+(.3*f)+')');g.addColorStop(1,'rgba(255,190,100,0)');
      c.fillStyle=g;c.beginPath();c.arc(wx,GY-H.h*.66,44,0,TAU);c.fill()}}
  c.globalCompositeOperation='source-over';
}

(function seedCurriculumWords(){
  if(typeof PALM==='undefined')return;
  const X0=760, X1=25400, N=52;
  const used=new Set(WORD_SHELLS.map(w=>w[1].toLowerCase()));
  for(let i=0;i<N;i++){
    const f=i/(N-1);
    const x=Math.round(X0+(X1-X0)*f + (i%2?70:-70));
    /* المستوى يتدرّج مع المسافة عبر المئة مستوى */
    const L=PALM.LEVELS[Math.min(PALM.LEVELS.length-1,Math.floor(f*PALM.LEVELS.length))];
    const pool=(L.pool&&L.pool.length&&PALM.VOCAB[L.pool[0]])
      ? PALM.VOCAB[L.pool[0]].items : PALM.VOCAB_ALL;
    let item=null;
    for(let tries=0;tries<40;tries++){
      const c=pool[Math.floor(Math.random()*pool.length)];
      if(!used.has(c.en.toLowerCase())){item=c;break;}
    }
    if(!item)continue;
    used.add(item.en.toLowerCase());
    const key='cur_'+i;
    const line=`${item.e}  ${item.en} — ${item.ar}   ·   المستوى ${L.n}/100 · ${L.ar}`;
    HS.push({id:'wd_'+key,x,y:GY-30,r:44,vis:()=>!st.words[key],
             on:()=>learnWord(key,item.en,item.ar,line)});
    CURRICULUM_WORDS++;
  }
})();

  c.fillStyle=warm;c.fillRect(0,0,VW,innerHeight);
  const vg=c.createRadialGradient(VW/2,innerHeight*.45,innerHeight*.4,VW/2,innerHeight*.5,innerHeight*.95);
  vg.addColorStop(0,'rgba(60,30,10,0)');vg.addColorStop(1,'rgba(50,22,8,.38)');
  c.fillStyle=vg;c.fillRect(0,0,VW,innerHeight);
  if(!grainPat)grainPat=c.createPattern(grain,'repeat');
  c.save();c.globalAlpha=.5;c.fillStyle=grainPat;c.fillRect(0,0,VW,innerHeight);c.restore();
}
function drawProp(c,p){
  const x=p.x,rng=RNG(Math.floor(x)*7+3);
  switch(p.k){
  case 'pots':drawJar(c,x,GY,1);drawJar(c,x+22,GY,.7,'#A0522D');break;
  case 'jar':drawJar(c,x,GY,1);break;
  case 'bigjar':drawJar(c,x,GY,1.9,'#9C4F2E');break;
  case 'basket':drawBasket(c,x,GY,1.1,false);break;
  case 'basketD':drawBasket(c,x,GY,1.2,true);break;
  case 'hoe':c.strokeStyle='#7C5233';c.lineWidth=4;c.beginPath();c.moveTo(x,GY);c.lineTo(x+14,GY-52);c.stroke();break;
  case 'cart':c.save();c.translate(x,GY);c.rotate(-.05);
    c.fillStyle='#7C5233';c.fillRect(-34,-26,68,8);
    c.strokeStyle='#8A5A36';c.lineWidth=4;c.beginPath();c.arc(-16,-8,15,0,TAU);c.stroke();
    c.restore();break;
  case 'toy':c.save();c.translate(x,GY);
    c.fillStyle='#A06B3E';blob(c,[[-12,-10],[-10,-18],[-2,-20],[6,-24],[9,-18],[10,-10]]);c.fill();
    c.restore();break;
  case 'fence':{const w=p.w;c.strokeStyle='#A98A54';c.lineWidth=3.4;
    for(let i=0;i<=w;i+=26){c.beginPath();c.moveTo(x+i,GY);c.lineTo(x+i+3,GY-40);c.stroke()}break}
  case 'wall':{const w=p.w,h=p.h,pts=[[x,GY],[x+rng.r(-3,3),GY-h+rng.r(-4,4)]];
    for(let i=1;i<4;i++)pts.push([x+w*i/4+rng.r(-4,4),GY-h+rng.r(-5,5)]);
    pts.push([x+w+rng.r(-3,3),GY-h+rng.r(-3,5)],[x+w,GY]);
    blob(c,pts);const g=c.createLinearGradient(0,GY-h,0,GY);
    g.addColorStop(0,'#D9A670');g.addColorStop(1,'#B4835A');c.fillStyle=g;c.fill();break}
  case 'scare':c.save();c.translate(x,GY);
    c.strokeStyle='#7C5233';c.lineWidth=4;c.beginPath();c.moveTo(0,0);c.lineTo(0,-74);c.moveTo(-24,-56);c.lineTo(24,-56);c.stroke();
    c.fillStyle='#C9A260';c.beginPath();c.moveTo(-8,-56);c.lineTo(-14,-20);c.lineTo(14,-20);c.lineTo(8,-56);c.closePath();c.fill();
    c.fillStyle='#E3C79A';c.beginPath();c.arc(0,-82,9,0,TAU);c.fill();
    c.fillStyle='#C4673E';c.beginPath();c.arc(0,-86,9,Math.PI,0);c.fill();
    c.restore();break;
  case 'stones':for(let k=0;k<4;k++){const r=h1(x+k*13);
    c.fillStyle=r<.5?'#A8916B':'#96805C';c.beginPath();c.ellipse(x+k*16-24,GY+2+r*4,9+r*5,6+r*2,r,0,TAU);c.fill()}break;
  case 'wood':for(let r0=0;r0<2;r0++)for(let k=0;k<3-r0;k++){
    c.fillStyle='#7C5233';c.beginPath();c.arc(x+k*17+r0*8,GY-8-r0*14,8,0,TAU);c.fill()}break;
  case 'coop':c.fillStyle='#A98A54';c.beginPath();c.moveTo(x-30,GY);c.lineTo(x-22,GY-38);c.quadraticCurveTo(x,GY-48,x+22,GY-38);c.lineTo(x+30,GY);c.closePath();c.fill();break;
  case 'well':c.fillStyle='#96805C';c.beginPath();c.ellipse(x,GY-12,30,13,0,0,TAU);c.fill();
    c.strokeStyle='#6B4226';c.lineWidth=5;
    c.beginPath();c.moveTo(x-24,GY-16);c.lineTo(x-20,GY-74);c.moveTo(x+24,GY-16);c.lineTo(x+20,GY-74);c.stroke();break;
  case 'crates':c.fillStyle='#8A5A36';c.fillRect(x-20,GY-22,40,22);c.fillRect(x-14,GY-40,28,18);break;
  case 'stall':drawStall(c,x,p.tp);break;
  case 'fort':drawFort(c,x);break;
  case 'terrace':{const w=p.w,l=p.l;
    c.fillStyle='#9C8460';c.fillRect(x,GY-14*l,w,14*l);
    c.fillStyle='#6E9A4C';c.fillRect(x,GY-14*l-4,w,5);break}
  case 'boulder':{const s=p.s;c.save();c.translate(x,GY);c.scale(s,s);
    c.fillStyle='#9C8A68';blob(c,[[-30,0],[-34,-24],[-16,-42],[10,-44],[30,-26],[30,0]]);c.fill();
    c.restore();break}
  case 'oleander':c.save();c.translate(x,GY);
    c.fillStyle='#4E8A44';blob(c,[[-26,0],[-30,-24],[-12,-40],[10,-42],[28,-26],[26,0]]);c.fill();
    for(let k=0;k<8;k++){const r2=h1(x+k*7);c.fillStyle=k%2?'#D96A8A':'#E88AA0';
      c.beginPath();c.arc(-20+r2*40,-14-r2*22,3.4,0,TAU);c.fill()}
    c.restore();break;
  case 'meg':{const s=p.s;c.save();c.translate(x,GY);c.scale(s,s);
    c.fillStyle='#9C8A68';blob(c,[[-24,0],[-27,-46],[-18,-82],[2,-94],[20,-80],[26,-40],[24,0]]);c.fill();
    c.restore();break}
  case 'log':c.save();c.translate(x,GY);
    c.fillStyle='#7C5233';blob(c,[[-46,-4],[-44,-16],[0,-20],[44,-14],[46,-4]]);c.fill();
    c.restore();break;
  case 'mush':for(let k=0;k<3;k++){const mx=x+k*14-14,mh=8+h1(x+k)*6;
    c.fillStyle='rgba(255,236,160,'+(.14)+')';c.beginPath();c.arc(mx,GY-mh,12,0,TAU);c.fill();
    c.strokeStyle='#E8DDB8';c.lineWidth=3;c.beginPath();c.moveTo(mx,GY);c.lineTo(mx,GY-mh);c.stroke();
    c.fillStyle='#D9B45A';c.beginPath();c.ellipse(mx,GY-mh,7,4.4,0,Math.PI,0);c.fill()}break;
  case 'mdoor':c.save();c.translate(x,GY);
    c.fillStyle='#8A7A5E';blob(c,[[-42,0],[-46,-96],[-30,-122],[10,-128],[38,-108],[44,-50],[42,0]]);c.fill();
    c.fillStyle='rgba(30,26,18,.92)';c.beginPath();c.moveTo(-18,0);c.lineTo(-18,-64);c.quadraticCurveTo(0,-84,18,-64);c.lineTo(18,0);c.closePath();c.fill();
    c.restore();break;
  }
}

function frame(ts){
  const dtMs=Math.min(33,ts-last||16);last=ts;
  ema=ema*.95+dtMs*.05;
  if(ema>26&&Q===1)Q=.6;else if(ema<17&&Q===.6)Q=1;
  const dt=dtMs/1000;
  try{update(dt);render(dt)}
  catch(err){console.error('Palm City Error:',err)}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
console.log('PALM CITY: ok · palms '+PALMS.length+' · houses '+HOUSES.length+' · lanterns '+FEST.length);
</script>
