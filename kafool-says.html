<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KAFOOL SAYS 2D — كافول يقول</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/baloo-bhaijaan-2@latest/arabic-700.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/baloo-bhaijaan-2@latest/arabic-800.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/baloo-bhaijaan-2@latest/latin-800.min.css">
<style>
:root{ --ink:#151515; --red:#ff5d5d; --green:#2ecc71; --blue:#3aa7ff; --yellow:#ffc93c; --purple:#8e6cf7; --orange:#ff9f43; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; overflow:hidden; font-family:'Baloo Bhaijaan 2',system-ui,sans-serif; background:#8ecdf2; color:var(--ink); user-select:none;}
button{touch-action:manipulation; font-family:inherit;}
.hidden{display:none !important;}
.bgLayer{position:fixed; inset:0; background-size:cover; background-position:center; transition:opacity .9s ease;}
#bgB{opacity:0;}
#bgA.trippy,#bgB.trippy{animation:bgHue 3s linear infinite;}
@keyframes bgHue{0%{filter:hue-rotate(0)}50%{filter:hue-rotate(40deg) saturate(1.4)}100%{filter:hue-rotate(0)}}
#fxLayer{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;}
.conf{position:absolute; width:10px; height:14px; border-radius:3px; animation:confFall linear forwards;}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg); opacity:.9;}}
.floatEm{position:absolute; font-size:26px; opacity:.55; animation:floatX linear forwards;}
@keyframes floatX{from{transform:translateX(-60px) rotate(-8deg);}to{transform:translateX(110vw) rotate(8deg);}}
.screen{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; z-index:10;}

/* ---------- شخصية 2D شفافة + أنيميشن ---------- */
.charWrap{position:relative; line-height:0;}
.charWrap img{width:100%; display:block; filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));}
body.noCut .charWrap img{-webkit-mask-image:radial-gradient(circle at 50% 50%, #000 76%, transparent 100%); mask-image:radial-gradient(circle at 50% 50%, #000 76%, transparent 100%);}
.charShadow{position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); width:62%; height:22px; background:radial-gradient(ellipse at center, rgba(0,0,0,.35), transparent 70%); z-index:-1;}
.em-idle{animation:cBob 2.6s ease-in-out infinite;}
.em-hello{animation:cWave 1s ease-in-out infinite; transform-origin:50% 95%;}
.em-bye{animation:cWave 1.5s ease-in-out infinite; transform-origin:50% 95%;}
.em-clap{animation:cClap .45s ease-in-out infinite;}
.em-laugh{animation:cLaugh .55s ease-in-out infinite;}
.em-no{animation:cNo .7s ease-in-out infinite;}
.em-angry{animation:cAngry .35s linear infinite;}
.em-angry img{filter:drop-shadow(0 12px 22px rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(255,60,60,.7));}
.em-sad{animation:cSad 2.4s ease-in-out infinite;}
.em-bored{animation:cBored 3s ease-in-out infinite;}
.em-walk{animation:walkIn 1.6s ease-in-out forwards;}
.talking img{animation:talkPulse .3s ease infinite;}
@keyframes talkPulse{50%{transform:scale(1.02);}}
@keyframes cBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes cWave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateY(-5px)}}
@keyframes cClap{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-12px) scale(1.04)}60%{transform:translateY(0) scale(.97)}}
@keyframes cLaugh{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-5deg) translateY(-7px)}75%{transform:rotate(5deg) translateY(-7px)}}
@keyframes cNo{0%,100%{transform:rotate(0) translateX(0)}20%{transform:rotate(-6deg) translateX(-7px)}40%{transform:rotate(6deg) translateX(7px)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
@keyframes cAngry{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes cSad{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(7px) rotate(2deg) scale(.99)}}
@keyframes cBored{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(3deg) translateY(5px)}}
@keyframes walkIn{
 0%{transform:translateX(-46vw) translateY(0)}
 10%{transform:translateX(-40vw) translateY(-11px)}
 20%{transform:translateX(-34vw) translateY(0)}
 30%{transform:translateX(-28vw) translateY(-11px)}
 40%{transform:translateX(-22vw) translateY(0)}
 50%{transform:translateX(-17vw) translateY(-11px)}
 60%{transform:translateX(-12vw) translateY(0)}
 70%{transform:translateX(-8vw) translateY(-11px)}
 80%{transform:translateX(-5vw) translateY(0)}
 90%{transform:translateX(-2vw) translateY(-6px)}
 100%{transform:translateX(0) translateY(0)}
}

/* ---------- MENU ---------- */
#menuScreen{justify-content:flex-start; gap:8px; padding:14px 14px 10px; overflow-y:auto; background:linear-gradient(180deg, rgba(0,0,40,.28), rgba(0,0,40,0) 30%, rgba(0,0,40,0) 60%, rgba(0,0,40,.32));}
.logo{margin:0; font-weight:800; font-size:clamp(34px,7.5vw,58px); letter-spacing:2px; color:#fff; text-shadow:0 4px 0 var(--ink), 0 8px 24px rgba(0,0,0,.35); direction:ltr; line-height:1;}
.logo span{color:var(--yellow);}
.logoAr{display:inline-block; background:var(--ink); color:#fff; padding:4px 20px; border-radius:999px; font-weight:800; font-size:clamp(14px,3.4vw,20px); transform:rotate(-2deg); box-shadow:0 5px 0 rgba(0,0,0,.3);}
#menuCharWrap{width:min(42vw,200px); margin:-4px auto;}
.menuPanel{background:rgba(255,255,255,.2); backdrop-filter:blur(6px); border-radius:26px; padding:12px; border:2px solid rgba(255,255,255,.45);}
.menuBtns{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(92vw,440px);}
.bigBtn{font-weight:800; font-size:clamp(14px,3.9vw,18px); color:#fff; padding:12px 8px; border:3px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); cursor:pointer; transition:transform .08s, box-shadow .08s; text-shadow:0 2px 0 rgba(0,0,0,.25);}
.bigBtn:active{transform:translateY(5px); box-shadow:0 1px 0 var(--ink);}
.bigBtn.green{background:var(--green);} .bigBtn.blue{background:var(--blue);}
.bigBtn.yellow{background:var(--yellow); color:var(--ink); text-shadow:none;} .bigBtn.purple{background:var(--purple);}
.bigBtn.red{background:var(--red);} .bigBtn.gray{background:#7f8c99;}
#worldBar{display:flex; gap:8px; overflow-x:auto; width:min(94vw,560px); padding:6px 4px; scrollbar-width:none;}
#worldBar::-webkit-scrollbar{display:none;}
.worldChip{flex:0 0 auto; display:flex; align-items:center; gap:6px; background:#ffffffd9; border:3px solid var(--ink); border-radius:999px; padding:6px 12px; font-weight:800; font-size:13px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25);}
.worldChip.sel{background:var(--yellow); transform:scale(1.06);}
.bestLine{background:#ffffffcc; border:3px solid var(--ink); border-radius:999px; padding:4px 16px; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.2);}
.menuTitle2{font-size:clamp(20px,5vw,30px); font-weight:800; color:#fff; text-shadow:0 3px 0 var(--ink);}

/* ---------- HUD ---------- */
#hud{position:fixed; top:8px; left:50%; transform:translateX(-50%); width:min(96vw,640px); display:flex; flex-direction:column; gap:6px; z-index:10;}
.hudRow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;}
.hudBox{background:#ffffffe6; border:3px solid var(--ink); border-radius:14px; padding:4px 10px; font-weight:800; font-size:clamp(12px,3.4vw,16px); box-shadow:0 4px 0 rgba(0,0,0,.25); display:flex; align-items:center; gap:5px;}
#hearts span{font-size:20px; transition:all .3s;}
#hearts span.lost{filter:grayscale(1); opacity:.35; transform:scale(.75);}
#scoreBox.pulse{animation:pulsePop .35s;}
@keyframes pulsePop{40%{transform:scale(1.25) rotate(-3deg);}}
#comboBox{background:var(--orange); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.3);}
#comboBox.fire{animation:pulsePop .4s;}
.hudBtn{border:3px solid var(--ink); border-radius:12px; background:#fff; font-size:16px; padding:4px 9px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25);}
.hudBtn:active{transform:translateY(3px);}
#worldName{background:var(--purple); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.3);}
#timerBar{width:100%; height:16px; border:3px solid var(--ink); border-radius:999px; background:#ffffffb0; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.2);}
#timerFill{height:100%; width:100%; background:var(--green); border-radius:999px; transition:width .1s linear;}
#timerFill.warn{background:var(--yellow);} #timerFill.danger{background:var(--red);}

/* ---------- STAGE ---------- */
#stage{position:fixed; inset:0; z-index:5; pointer-events:none;}
#gameCharWrap{position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(175px,29vh,265px); width:min(46vh,260px);}
#bubble{position:absolute; top:11vh; left:50%; transform:translateX(-50%); background:#fff; border:4px solid var(--ink); border-radius:22px; direction:ltr; text-align:left; padding:10px 20px; max-width:88%; min-height:56px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:clamp(17px,4.6vw,27px); box-shadow:0 8px 24px rgba(0,0,0,.35);}
#bubble:after{content:""; position:absolute; bottom:-17px; left:50%; width:18px; height:18px; background:#fff; border-left:4px solid var(--ink); border-bottom:4px solid var(--ink); transform:translateX(-50%) rotate(-65deg) skewX(-20deg);}
#bubble.pop{animation:bubblePop .3s ease;}
@keyframes bubblePop{0%{transform:translateX(-50%) scale(.6)}70%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
#cmdPfx{color:var(--green);}
#cmdIcon{font-size:1.4em;}
#cmdAr{display:block; font-size:.62em; color:#777; direction:rtl; text-align:right;}
#stamp{position:fixed; top:8%; left:50%; transform:translateX(-50%) rotate(-12deg) scale(0); pointer-events:none; font-weight:800; font-size:clamp(30px,9vw,60px); color:var(--red); border:6px solid var(--red); border-radius:14px; padding:2px 20px; background:#ffffffd8; direction:ltr; opacity:0; z-index:11;}
#stamp.show{animation:stampIn .8s ease forwards;}
@keyframes stampIn{0%{transform:translateX(-50%) rotate(-12deg) scale(0); opacity:0}25%{transform:translateX(-50%) rotate(-8deg) scale(1.2); opacity:1}70%{transform:translateX(-50%) rotate(-10deg) scale(1); opacity:1}100%{transform:translateX(-50%) rotate(-12deg) scale(1); opacity:0}}
#gameScreen.shakeIt{animation:screenShake .45s;}
@keyframes screenShake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}

/* ---------- PAD ---------- */
#pad{position:fixed; bottom:10px; left:50%; transform:translateX(-50%); width:min(96vw,640px); display:flex; flex-direction:column; gap:8px; z-index:10;}
#actionGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px;}
.actBtn{position:relative; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); cursor:pointer; padding:7px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:1px; transition:transform .07s, box-shadow .07s;}
.actBtn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink);}
.actBtn .ae{font-size:26px; line-height:1.15;}
.actBtn .al{font-weight:800; font-size:13px; direction:ltr; line-height:1.1;}
.actBtn .aar{font-size:11px; color:#666; font-weight:700; line-height:1;}
.actBtn kbd{position:absolute; top:4px; left:5px; font-size:9px; background:var(--ink); color:#fff; border-radius:5px; padding:1px 5px;}
.actBtn.flashGood{background:#b8f5cd;} .actBtn.flashBad{background:#ffc4c4;}
@media (pointer:coarse){.actBtn kbd{display:none;}}
#btnDont{font-weight:800; font-size:clamp(17px,4.6vw,22px); color:#fff; background:var(--red); border:3px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink); padding:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; text-shadow:0 2px 0 rgba(0,0,0,.3);}
#btnDont:active{transform:translateY(5px); box-shadow:0 1px 0 var(--ink);}
#btnDont kbd{background:#fff; color:var(--red); border-radius:6px; padding:1px 7px; font-size:12px;}

/* ---------- OVERLAYS ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,10,35,.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:80; padding:16px;}
.card{background:#fff; border:4px solid var(--ink); border-radius:26px; box-shadow:0 10px 0 rgba(0,0,0,.35); width:min(94vw,480px); padding:20px 18px; text-align:center; animation:cardIn .35s ease; max-height:90vh; overflow-y:auto;}
@keyframes cardIn{from{transform:scale(.7) translateY(40px); opacity:0}}
.card h2{margin:0 0 6px; font-size:clamp(22px,6vw,32px); font-weight:800;}
.card p{margin:6px 0; font-weight:700; font-size:15px; line-height:1.7;}
.card .rowBtns{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
#banner{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:90;}
#bannerIn{background:var(--yellow); border:4px solid var(--ink); border-radius:24px; box-shadow:0 8px 0 var(--ink); padding:16px 34px; text-align:center; transform:scale(0); font-weight:800;}
#bannerIn.show{animation:bannerIn 1.6s ease forwards;}
@keyframes bannerIn{0%{transform:scale(0) rotate(-8deg)}15%{transform:scale(1.1) rotate(2deg)}25%{transform:scale(1)}80%{transform:scale(1); opacity:1}100%{transform:scale(.8); opacity:0}}
#bannerMain{font-size:clamp(22px,6vw,36px); direction:ltr;}
#bannerSub{font-size:clamp(14px,4vw,20px);}
#toasts{position:fixed; top:10px; right:10px; z-index:120; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
.toast{background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 rgba(0,0,0,.3); padding:8px 14px; font-weight:800; font-size:14px; display:flex; gap:8px; align-items:center; animation:toastIn 3s ease forwards;}
@keyframes toastIn{0%{transform:translateX(120%)}10%{transform:translateX(0)}85%{transform:translateX(0); opacity:1}100%{transform:translateX(120%); opacity:0}}
.achRow{display:flex; align-items:center; gap:10px; background:#f4f6ff; border:3px solid var(--ink); border-radius:14px; padding:8px 12px; margin:8px 0; font-weight:800;}
.achRow.locked{opacity:.45; filter:grayscale(.7);}
.achRow .big{font-size:26px;}
kbd.key{background:var(--ink); color:#fff; border-radius:6px; padding:2px 8px; font-size:12px;}
.trophyBig{font-size:70px; animation:cBob 1.6s ease-in-out infinite; display:inline-block;}
#introBubble{direction:ltr; font-size:clamp(16px,4.5vw,22px); background:#fff; border:4px solid var(--ink); border-radius:18px; padding:10px 16px; font-weight:800; margin:10px auto; max-width:90%; box-shadow:0 6px 0 rgba(0,0,0,.3);}
#studioGrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
#studioGrid .bigBtn{font-size:14px; padding:10px 6px;}
#studioCharWrap{width:min(44vw,180px); margin:0 auto;}
#studioLabel{font-weight:800; font-size:16px; min-height:24px;}
#loadNote{position:fixed; bottom:8px; left:50%; transform:translateX(-50%); background:#151515cc; color:#fff; border-radius:999px; padding:4px 14px; font-size:12px; font-weight:800; z-index:130;}
#errBox{position:fixed; bottom:0; left:0; right:0; background:#7a0000; color:#fff; font-size:12px; padding:6px 10px; z-index:200; direction:ltr; display:none;}
</style>
</head>
<body>
<div id="bgA" class="bgLayer"></div>
<div id="bgB" class="bgLayer"></div>
<div id="fxLayer"></div>
<div id="loadNote">✂️ قصّ الخلفيات جارٍ…</div>

<section id="menuScreen" class="screen">
  <h1 class="logo">KAFOOL <span>SAYS</span></h1>
  <div class="logoAr">كافول يقول 🎮 شخصية 2D شفافة متحركة</div>
  <div id="menuCharWrap" class="charWrap em-idle"><div class="charShadow"></div><img id="menuChar" alt="Kafool"></div>
  <div class="menuPanel">
    <div class="menuBtns">
      <button type="button" id="btnStart" class="bigBtn green">🎮 ابدأ المغامرة</button>
      <button type="button" id="btnEdu" class="bigBtn blue">🎓 الوضع التعليمي</button>
      <button type="button" id="btnStudio" class="bigBtn yellow">🎭 استوديو الحركات</button>
      <button type="button" id="btnHow" class="bigBtn purple">❓ كيف ألعب؟</button>
      <button type="button" id="btnAch" class="bigBtn purple">🏆 الإنجازات</button>
      <button type="button" id="btnMuteMenu" class="bigBtn gray">🔊 الصوت</button>
    </div>
  </div>
  <div id="worldBar"></div>
  <div class="bestLine">🏅 أفضل نتيجة: <b id="bestScore">0</b></div>
</section>

<section id="eduScreen" class="screen hidden" style="justify-content:center; gap:14px; background:rgba(0,0,40,.35);">
  <div class="menuTitle2">🎓 الوضع التعليمي — تعلّم الإنجليزية</div>
  <div class="menuBtns" id="eduLevelBar" style="width:min(92vw,440px);"></div>
  <div style="display:flex; gap:10px;">
    <button type="button" id="btnEduStart" class="bigBtn green">▶️ ابدأ التعلم</button>
    <button type="button" id="btnEduBack" class="bigBtn gray">🔙 رجوع</button>
  </div>
</section>

<header id="hud" class="hidden">
  <div class="hudRow">
    <div class="hudBox" id="hearts"></div>
    <div class="hudBox" id="scoreBox">⭐ <b id="score">0</b></div>
    <div class="hudBox hidden" id="comboBox">🔥 x<span id="mult">2</span> (<span id="comboN">0</span>)</div>
    <div class="hudBox" id="levelBadge">🟢 L1</div>
    <div class="hudBox" id="worldName">🏫</div>
    <button type="button" class="hudBtn" id="btnMute">🔊</button>
    <button type="button" class="hudBtn" id="btnQuit">🏠</button>
  </div>
  <div id="timerBar"><div id="timerFill"></div></div>
</header>

<div id="stage" class="hidden">
  <div id="gameCharWrap" class="charWrap em-idle"><div class="charShadow"></div><img id="gameChar" alt="Kafool"></div>
  <div id="bubble" class="pop"><span id="cmdIcon"></span><span style="flex:1"><span id="cmdPfx"></span><span id="cmdText"></span><span id="cmdAr"></span></span></div>
</div>
<div id="stamp"></div>
<section id="gameScreen" class="screen hidden" style="pointer-events:none;"></section>

<footer id="pad" class="hidden">
  <div id="actionGrid"></div>
  <button type="button" id="btnDont">🛑 لا تنفّذ! <kbd>E</kbd></button>
</footer>

<div id="introOverlay" class="overlay hidden">
  <div class="card" style="background:rgba(255,255,255,.94);">
    <div id="introBubble">Hey! Are you ready?</div>
    <button type="button" id="btnSkipIntro" class="bigBtn yellow" style="padding:8px 22px;">⏭ ابدأ!</button>
  </div>
</div>

<div id="banner" class="hidden"><div id="bannerIn"><div id="bannerMain"></div><div id="bannerSub"></div></div></div>

<div id="endOverlay" class="overlay hidden">
  <div class="card">
    <div id="endEmoji" class="trophyBig">💔</div>
    <h2 id="endTitle">GAME OVER</h2>
    <p id="endMsg" dir="ltr"></p>
    <p>⭐ النقاط: <b id="endScore">0</b> &nbsp;|&nbsp; 🏅 الأفضل: <b id="endBest">0</b></p>
    <p id="endStats" style="font-size:13px; color:#666;"></p>
    <div class="rowBtns">
      <button type="button" id="btnRetry" class="bigBtn green">🔄 Try Again</button>
      <button type="button" id="btnMenu2" class="bigBtn gray">🏠 القائمة</button>
    </div>
  </div>
</div>

<div id="modal" class="overlay hidden">
  <div class="card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="rowBtns"><button type="button" id="modalClose" class="bigBtn red">✖ إغلاق</button></div>
  </div>
</div>

<div id="studio" class="overlay hidden">
  <div class="card">
    <h2>🎭 استوديو حركات كافول <span style="font-size:12px; color:#888;">2D شفاف</span></h2>
    <div id="studioCharWrap" class="charWrap em-idle"><div class="charShadow"></div><img id="studioChar" alt="Kafool"></div>
    <div id="studioLabel">اختر حركة لتجربتها!</div>
    <div id="studioGrid"></div>
    <div class="rowBtns"><button type="button" id="studioClose" class="bigBtn red">✖ إغلاق</button></div>
  </div>
</div>

<div id="toasts"></div>
<div id="errBox"></div>

<script>
"use strict";
var $=function(s){return document.querySelector(s);};
function storeGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function storeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
var P="https://image.qwenlm.ai/public_source/0948311f-0608-4ca3-aae7-600bdd784907/";
var SAY="Kafool says";

function removeWhiteBG(img){
 var c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
 var x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0);
 var data; try{ data=x.getImageData(0,0,c.width,c.height); }catch(e){ return null; }
 var d=data.data, W=c.width, H=c.height;
 var seen=new Uint8Array(W*H), stack=[];
 function near(i){ var r=d[i],g=d[i+1],b=d[i+2]; var mx=r>g?r:g; mx=mx>b?mx:b; var mn=r<g?r:g; mn=mn<b?mn:b; return mn>215&&(mx-mn)<28; }
 function kill(i){ d[i+3]=0; }
 function push(px,py){ var p=py*W+px; if(seen[p])return; var i=p*4; if(!near(i))return; seen[p]=1; kill(i); stack.push(p); }
 for(var px=0;px<W;px++){ push(px,0); push(px,H-1); }
 for(var py=0;py<H;py++){ push(0,py); push(W-1,py); }
 while(stack.length){
  var p=stack.pop(), qx=p%W, qy=(p-qx)/W;
  if(qx>0)push(qx-1,qy); if(qx<W-1)push(qx+1,qy);
  if(qy>0)push(qx,qy-1); if(qy<H-1)push(qx,qy+1);
 }
 /* تنعيم الحواف: بكسلات شبه بيضاء ملاصقة للمحذوف تصبح نصف شفافة */
 for(var y=1;y<H-1;y++)for(var xx=1;xx<W-1;xx++){
  var pp=y*W+xx; if(seen[pp])continue; var ii=pp*4;
  if(!near(ii))continue;
  if(seen[pp-1]||seen[pp+1]||seen[pp-W]||seen[pp+W]){ d[ii+3]=90; }
 }
 x.putImageData(data,0,0);
 try{ return c.toDataURL("image/png"); }catch(e){ return null; }
}
function processAll(done){

 function next(){
  if(idx>=keys.length){ if(okCount===0){ CUT_OK=false; document.body.classList.add("noCut"); } done(); return; }
  var k=keys[idx++];
  var im=new Image(); im.crossOrigin="anonymous";
  im.onload=function(){ var r=removeWhiteBG(im); if(r){ CH[k]=r; okCount++; } else CH[k]=CH_RAW[k]; next(); };
  im.onerror=function(){ CH[k]=CH_RAW[k]; next(); };
  im.src=CH_RAW[k];
 }

}

var AC=null,master=null,revSend=null,MUTE=false,VOICES=[];
function audio(){
 if(!AC){
  try{
   AC=new (window.AudioContext||window.webkitAudioContext)();
   master=AC.createGain(); master.gain.value=.9;
   var comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
   revSend=AC.createGain(); revSend.gain.value=.3;
   var conv=AC.createConvolver();
   var len=Math.floor(AC.sampleRate*1.3),imp=AC.createBuffer(2,len,AC.sampleRate);
   for(var c=0;c<2;c++){var dd=imp.getChannelData(c);for(var i=0;i<len;i++){dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}}
   conv.buffer=imp; revSend.connect(conv); conv.connect(master);
  }catch(e){AC=null;}
 }
 if(AC&&AC.state==="suspended")AC.resume();
 return AC;
}
function tone(f,d,type,g,when,slide,rev){
 if(MUTE)return; var c=audio(); if(!c)return;
 try{
  var t0=c.currentTime+(when||0);
  var o=c.createOscillator(),v=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  v.gain.setValueAtTime(.0001,t0);
  v.gain.exponentialRampToValueAtTime(g||.2,t0+.02);
  v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(v); v.connect(master);
  if(rev!==false){var r=AC.createGain(); r.gain.value=rev||.25; v.connect(r); r.connect(revSend);}
  o.start(t0); o.stop(t0+d+.05);
 }catch(e){}
}
function noise(d,g,when,fFrom,fTo){
 if(MUTE)return; var c=audio(); if(!c)return;
 try{
  var t0=c.currentTime+(when||0);
  var n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),dd=buf.getChannelData(0);
  for(var i=0;i<n;i++)dd[i]=Math.random()*2-1;
  var src=c.createBufferSource(); src.buffer=buf;
  var f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(fFrom||800,t0); f.frequency.exponentialRampToValueAtTime(fTo||200,t0+d);
  var v=c.createGain(); v.gain.setValueAtTime(g||.2,t0); v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  src.connect(f); f.connect(v); v.connect(master); src.start(t0); src.stop(t0+d);
 }catch(e){}
}

var MUSIC={nextT:0,step:0,timer:null,tempo:100,root:220,scale:[0,2,4,7,9]};
function musicSet(w,lvl){MUSIC.tempo=96+w*5+(lvl||0)*6;MUSIC.root=220*Math.pow(2,(w%7)/12);MUSIC.scale=(w%3===2)?[0,3,5,7,10]:[0,2,4,7,9];}
function musicStart(){
 if(MUSIC.timer)return;
 MUSIC.nextT=(audio()?AC.currentTime:0)+.1; MUSIC.step=0;
 MUSIC.timer=setInterval(function(){
  if(MUTE||!AC)return;
  var stepDur=60/MUSIC.tempo/2;
  while(MUSIC.nextT<AC.currentTime+.25){
   var s=MUSIC.step,sc=MUSIC.scale,root=MUSIC.root,w=MUSIC.nextT-AC.currentTime;
   if(s%8===0)tone(root/2,stepDur*3,"sine",.06,w,0,.15);
   if(s%8===4)tone(root/2*1.5,stepDur*2,"sine",.05,w,0,.15);
   if(Math.random()<.8){var deg=sc[Math.floor(Math.random()*sc.length)]+12*(Math.random()<.3?1:0);tone(root*Math.pow(2,deg/12),stepDur*1.6,"triangle",.05,w,0,.2);}
   MUSIC.nextT+=stepDur; MUSIC.step++;
  }
 },120);
}

 G.lastCmd={action:action,says:says}; G.token++;
 var tk=G.token,a=ACTIONS[action];
 $("#cmdPfx").textContent=says?SAY+": ":"";
 $("#cmdText").textContent=a.en+"!";
 var arTxt=(G.mode==="edu"&&EDU[G.eduLevel].arMean)?a.ar:"";
 $("#cmdAr").textContent=arTxt; $("#cmdAr").classList.toggle("hidden",!arTxt);
 $("#cmdIcon").textContent=iconsOn()?a.emoji:"";
 var bub=$("#bubble"); bub.classList.remove("pop"); void bub.offsetWidth; bub.classList.add("pop");
 gameEmo("idle");
 $("#gameCharWrap").classList.add("talking");
 var u=say((says?SAY+": ":"")+a.en+"!",c.rate);
 var stopTalk=function(){if(G&&G.token===tk)$("#gameCharWrap").classList.remove("talking");};
 if(u)u.onend=stopTalk;
 setTimeout(stopTalk,2500+a.en.length*60);
 if(c.chaos&&Math.random()<.45){
  var st=$("#stamp"); st.textContent=pick(["JUMP!","CLAP!","STOP!","SPIN!","SIT!"]);
  st.classList.remove("show"); void st.offsetWidth; st.classList.add("show");
  setTimeout(function(){SFX.boing();},250);
 }
 G.awaiting=true; G.roundStart=performance.now();
 var total=c.time,deadline=G.roundStart+total,lastSec=Math.ceil(total/1000);
 clearInterval(G.timerInt);
 G.timerInt=setInterval(function(){
  var rem=deadline-performance.now(),fill=$("#timerFill");
  fill.style.width=Math.max(0,rem/total*100)+"%";
  fill.className=rem<total*.3?"danger":rem<total*.6?"warn":"";
  var sec=Math.ceil(rem/1000);
  if(sec!==lastSec){lastSec=sec;if(sec<=3&&sec>0)SFX.tick();}
  if(rem<=0){clearInterval(G.timerInt);if(G&&G.awaiting){if(says)finishRound(false,"idle");else finishRound(true,"idle");}}
 },100);
}
function pressAction(id,btn){
 if(!G||!G.awaiting||G.over)return;
 G.awaiting=false; clearInterval(G.timerInt);
 var cmd=G.lastCmd;
 if(btn){var good=cmd.says&&id===cmd.action;btn.classList.add(good?"flashGood":"flashBad");setTimeout(function(){btn.classList.remove("flashGood","flashBad");},500);}
 if(cmd.says&&id===cmd.action)finishRound(true,"action");
 else if(!cmd.says)finishRound(false,"trap");
 else finishRound(false,"action");
}
function pressDont(){
 if(!G||!G.awaiting||G.over)return;
 G.awaiting=false; clearInterval(G.timerInt);

}
function finishRound(ok,kind){
 if(!G)return; G.awaiting=false;
 var c=cfg(),rt=performance.now()-G.roundStart;
 if(ok){
  G.combo++; G.comboBest=Math.max(G.comboBest,G.combo);
  var oldMult=G.mult;
  G.mult=G.combo>=20?5:G.combo>=10?3:G.combo>=5?2:1;
  G.score+=10*G.mult; G.totalCorrect++;
  if(kind==="trap"){G.traps++;if(G.traps>=5)unlock("brain");}
  if(G.totalCorrect>=20)unlock("star");
  if(G.combo>=10)unlock("flame");
  SFX.good(); SFX.clapS(); confetti(G.mult>1?40:18);
  gameEmo("clap");
  var line;
  if(kind==="trap")line=pick(L_TRAP);
  else if(rt<1300)line=pick(L_FAST);
  else if(rt>c.time-1800){line=pick(L_SLOW); gameEmo("bored");}
  else line=pick(L_SUCCESS);
  bubbleSay(line);
  if(G.mult>oldMult){
   SFX.combo(); confetti(50);
   var cb=$("#comboBox"); cb.classList.remove("fire"); void cb.offsetWidth; cb.classList.add("fire");
   setTimeout(function(){gameEmo("angry"); bubbleSay(pick(L_COMBO));},700);
  }
  pulseScore(); updHUD();
  var wi=worldIndex(); if(wi!==G.curWorld)changeWorld(wi);
  var delay=900;
  if(G.mode==="adventure"){
   if(G.totalCorrect>=100){winGame();return;}
   if(G.totalCorrect>=LEVELS[G.level].until&&G.level<LEVELS.length-1){
    if(G.mistakesInLevel===0)unlock("bolt");
    G.mistakesInLevel=0; G.level++;
    var lv=LEVELS[G.level]; delay+=1700;
    showBanner(lv.emoji+" LEVEL "+(G.level+1)+" — "+lv.name+"!",lv.final?"🔥 FINAL CHALLENGE — 100 أمر! 🔥":lv.tag);
    if(lv.final){SFX.combo(); gameEmo("angry");}
    var chx=!!lv.chaos;
    $("#bgA").classList.toggle("trippy",chx); $("#bgB").classList.toggle("trippy",chx);
    buildPad(); updHUD(); musicSet(G.curWorld,G.level);
   }
  }
  setTimeout(function(){if(G&&!G.over)startRound();},delay);
 }else{
  G.hearts--; G.combo=0; G.mult=1; G.mistakesInLevel++;
  renderHearts(); updHUD();
  SFX.bad();
  var gs=$("#gameScreen"); gs.classList.remove("shakeIt"); void gs.offsetWidth; gs.classList.add("shakeIt");
  var emo=kind==="trap"?"laugh":(kind==="idle"?"bored":"no");
  gameEmo(emo);
  var wl=kind==="trap"?pick(L_WRONG_TRAP):kind==="dont"?pick(L_WRONG_DONT):kind==="action"?pick(L_WRONG_ACT):pick(L_WRONG_SLOW);
  bubbleSay(wl);
  if(G.hearts<=0){gameOver();return;}
  setTimeout(function(){if(G&&!G.over)startRound();},1400);
 }
}

function runIntro(done){
 introSkip=false;
 $("#introOverlay").classList.remove("hidden");
 var i=0;
 var end=function(){$("#introOverlay").classList.add("hidden");try{window.speechSynthesis.cancel();}catch(e){}done();};
 var step=function(){
  if(introSkip||i>=INTRO.length){end();return;}
  var L=INTRO[i]; i++;
  if(L.e)gameEmo(L.e);
  $("#introBubble").textContent="🗣️ "+L.t;
  var fired=false;
  var next=function(){if(fired)return;fired=true;setTimeout(step,250);};
  var fb=setTimeout(next,2200+L.t.length*55);
  var u=say(L.t,1);
  if(u)u.onend=function(){clearTimeout(fb);next();};
 };
 $("#btnSkipIntro").onclick=function(){introSkip=true;end();};
 step();
}
