<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f25477">
<title>نجوم الفصل | الأستاذة ثريا</title>
<style>
:root{--pink:#f25477;--purple:#8256c8;--green:#2fae64;--orange:#ab8963;--red:#df4050;--gold:#e0a52c;--ink:#402b49;--muted:#927d9c;--paper:#fff;--line:#f3d7e2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(150deg,#73bce9 0,#ccecff 36%,#ffe0ea 72%,#fff5f8 100%);padding:18px}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto}
.hero{padding:20px 22px;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.45);border-radius:28px;box-shadow:0 16px 40px rgba(76,45,105,.16);margin-bottom:14px;text-align:center}
.hero .kicker{display:inline-flex;background:#fff;color:#a12457;border-radius:999px;padding:5px 15px;font-weight:800;font-size:13px}
.hero h1{color:#fff;font-size:clamp(26px,5vw,40px);text-shadow:0 4px 0 #d1558f;margin:9px 0 4px}
.hero p{color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 0 rgba(100,35,90,.45)}
.syncbadge{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#6d5b7a;box-shadow:0 3px 8px rgba(64,43,73,.18)}
.syncbadge.synced{background:#e3f7ea;color:#1f8a4c}
.syncbadge.connecting{background:#fff6e3;color:#8a6416}
.syncbadge.error{background:#fdeceb;color:#a33327}
.lockbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lockstatus{font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#6d5b7a}
.lockstatus.on{background:#e3f7ea;color:#1f8a4c}
.lockbtn{border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(#7a5aa8,#563797);box-shadow:0 3px 0 #3c265f}
.lockbtn:active{transform:translateY(2px);box-shadow:none}
.addbtn:disabled,.lossbtn:disabled,.undobtn:disabled,.btn.red:disabled{opacity:.4;filter:grayscale(.3)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.tab{border:0;border-radius:999px;padding:11px 22px;font-weight:800;font-size:15px;background:#fff;color:#a12457;box-shadow:0 4px 0 #dec7d1}
.tab.active{background:linear-gradient(#ff9db8,var(--pink));color:#fff;box-shadow:0 4px 0 #b52f55}
.weekcard{background:linear-gradient(135deg,#fff6e3,#fff);border:2px solid #f3dfa8;border-radius:24px;padding:18px;margin-bottom:14px;text-align:center;box-shadow:0 10px 26px rgba(160,110,10,.12)}
.weekcard .range{color:var(--muted);font-weight:800;font-size:13px;margin-bottom:8px}
.weekcard .star-title{font-size:15px;font-weight:800;color:#8a6416;margin-bottom:6px}
.weekcard .winners{font-size:clamp(18px,4vw,26px);font-weight:800;color:#402b49;line-height:1.5}
.weekcard .winners span{display:inline-block;background:#fff;border-radius:999px;padding:5px 16px;margin:3px;box-shadow:0 4px 12px rgba(160,110,10,.18)}
.weekcard.empty .winners{font-size:14px;color:var(--muted);font-weight:700}
.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{flex:1;min-width:160px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;outline:none;color:var(--ink)}
.toolbar input[type=text]:focus{border-color:var(--pink)}
.sortbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;font-size:13px;color:var(--ink)}
.sortbtn.active{border-color:var(--pink);color:#a12457;background:#fff1f6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 20px rgba(90,24,80,.12);display:flex;flex-direction:column;gap:8px}
.card .nm{font-weight:800;font-size:15px;line-height:1.4;min-height:42px}
.card .counts{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff1f6;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:#a12457;white-space:nowrap}
.chip.week{background:#fff6e3;color:#8a6416}
.chip.loss{background:#f2eef7;color:#6d5b7a}
.card .row{display:flex;gap:6px;align-items:center}
.addbtn{flex:1;border:0;border-radius:16px;padding:12px 10px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(#ffd166,var(--gold));box-shadow:0 4px 0 #a5760f}
.addbtn:active{transform:translateY(3px);box-shadow:none}
.lossbtn{flex:1;border:0;border-radius:16px;padding:9px 10px;font-weight:800;font-size:13px;color:#6d5b7a;background:#ece6f0;box-shadow:0 3px 0 #d4c9db}
.lossbtn:active{transform:translateY(3px);box-shadow:none}
.undobtn{border:0;border-radius:16px;width:42px;height:42px;font-size:16px;background:#f3eef4;color:#8a7a8f}
.undobtn:disabled{opacity:.35}
.bottom{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;color:#fff;background:linear-gradient(#a984df,var(--purple));box-shadow:0 4px 0 #563797;font-size:13px}
.btn.red{background:linear-gradient(#ef7a86,var(--red));box-shadow:0 4px 0 #a02a34}
.btn:active{transform:translateY(3px);box-shadow:none}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-weight:800;font-size:16px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);z-index:50;background:#fff;padding:10px 22px;border-radius:999px;box-shadow:0 8px 24px #0003;font-weight:800;color:#a12457;transition:.3s}
#toast.show{transform:translate(-50%,0)}
</style>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';src:url('../../assets/book/fonts/Amiri-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Baloo Bhaijaan 2';src:url('../../assets/book/fonts/Amiri-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
</style>
</head>
<body>
<main class="app">
  <header class="hero">
    <span class="kicker">🌿 مسار التميّز</span>
    <h1>⭐ نجوم الفصل</h1>
    <p>خامس أول • خامس ثاني • خامس ثالث — الأستاذة ثريا</p>
    <div class="syncbadge" id="syncBadge">📴 محفوظ على هالجهاز فقط</div>
    <div class="lockbar">
      <span class="lockstatus" id="lockStatus">🔒 وضع العرض فقط</span>
      <button class="lockbtn" id="unlockBtn">🔑 دخول المعلمة</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="weekcard" id="weekcard"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 ابحثي باسم الطالبة...">
    <button class="sortbtn active" id="sortName">الاسم أ-ي</button>
    <button class="sortbtn" id="sortStars">الأكثر نجومًا</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="bottom">
    <button class="btn" id="exportBtn">⬇️ تصدير نجوم هالصف</button>
    <button class="btn red" id="resetBtn">🗑️ تصفير نجوم هالصف</button>
  </div>
</main>
<div id="toast"></div>

function loadData(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch(e){ raw = {}; }
  // migrate old formats and corrected spellings without losing stars or losses
  Object.keys(raw).forEach(cls => {
    Object.keys(raw[cls]).forEach(name => {
      const v = raw[cls][name];
      if(Array.isArray(v)) raw[cls][name] = {stars: v, losses: []};
      else { v.stars = v.stars || []; v.losses = v.losses || []; }
      const corrected = ROSTER_ALIASES[cls]?.[name];
      if(corrected){
        const target = raw[cls][corrected] || {stars:[], losses:[]};
        target.stars = [...new Set([...(target.stars||[]), ...(raw[cls][name].stars||[])])];
        target.losses = [...new Set([...(target.losses||[]), ...(raw[cls][name].losses||[])])];
        raw[cls][corrected] = target;
        delete raw[cls][name];
      }
    });
  });
  return raw;
}
function saveData(data){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
let DATA = loadData();

function ensure(cls, name){
  if(!DATA[cls]) DATA[cls] = {};
  if(!DATA[cls][name]) DATA[cls][name] = {stars: [], losses: []};
  return DATA[cls][name];
}

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove('show'), 2200);
}

// Omani school week: Sunday 00:00 local -> next Sunday 00:00
function weekStart(d){
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
  s.setHours(0,0,0,0);
  return s;
}
function fmtDay(d){
  return d.toLocaleDateString('ar-OM', {day:'numeric', month:'short'});
}
function currentWeekRange(){
  const start = weekStart(new Date());
  const thu = new Date(start); thu.setDate(start.getDate()+4);
  return {start, label: `${fmtDay(start)} – ${fmtDay(thu)}`};
}

function arKey(s){ return s.replace(/[إأآا]/g,'ا'); }
function arCompare(a,b){ return arKey(a).localeCompare(arKey(b),'ar'); }

function countsFor(cls, name){
  const rec = ensure(cls, name);
  const {start} = currentWeekRange();
  const starsWeek = rec.stars.filter(t => new Date(t) >= start).length;
  const lossesWeek = rec.losses.filter(t => new Date(t) >= start).length;
  return {starsTotal: rec.stars.length, starsWeek, lossesTotal: rec.losses.length, lossesWeek};
}

// ---- cloud sync: mirrors DATA to a shared, persistent store so results
// survive a cleared browser and stay in sync across everyone who opens the
// page. Two backends, tried in order:
//  1. the "db" capability, when this page runs inside a Claude Artifact
//     viewer that grants it;
//  2. otherwise (the plain page on the real website) a small public
//     Supabase edge function — see supabase/functions/class-stars.
// Falls back silently to the device-only localStorage save above when
// neither backend is reachable. ----
let cloudDb = null;
let publicApiActive = false;
let remoteItemCount = 0;
let publicPollTimer = null;
const PUBLIC_API = 'https://dhhwcqczvcbwdwllfcun.supabase.co/functions/v1/class-stars';
const writeQueues = new Map();

function classKey(cls){ return cls.replace('/', '-'); }
function studentDocId(cls, name){
  const idx = (ROSTER[cls] || []).indexOf(name);
  return `${classKey(cls)}_${idx}`;
}
function queueWrite(id, fn){
  const prev = writeQueues.get(id) || Promise.resolve();
  const next = prev.then(fn, fn);
  writeQueues.set(id, next);
  return next;
}
function setSyncBadge(mode){
  const el = $('#syncBadge');
  const modes = {
    local:      ['📴 محفوظ على هالجهاز فقط', ''],
    connecting: ['☁️ يتزامن...', 'connecting'],
    synced:     ['☁️ متزامن ومحفوظ لكل الأجهزة', 'synced'],
    error:      ['⚠️ تعذّر التزامن — محفوظ محليًا', 'error'],
  };
  const [text, cls] = modes[mode] || modes.local;
  el.textContent = text;
  el.className = 'syncbadge ' + cls;
}
function applyRemoteItems(items, replaceAll = false){
  if(replaceAll) DATA = {};
  (items || []).forEach(d => {
    if(!d || !d.name || !d.cls) return;
    if(!DATA[d.cls]) DATA[d.cls] = {};
    DATA[d.cls][d.name] = {
      stars: Array.isArray(d.stars) ? d.stars : [],
      losses: Array.isArray(d.losses) ? d.losses : [],
    };
  });
  saveData(DATA);
}
function pushRecord(cls, name){
  const rec = ensure(cls, name);
  if(cloudDb){
    const id = studentDocId(cls, name);
    queueWrite(id, () => cloudDb.collection('students').doc(id)
      .set({name, cls, stars: rec.stars, losses: rec.losses}))
      .then(()=> setSyncBadge('synced'))
      .catch(()=> setSyncBadge('error'));
  } else if(publicApiActive){
    return queueWrite(`${cls}|${name}`, () => fetch(PUBLIC_API, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'save', pin: teacherPin, cls, name, stars: rec.stars, losses: rec.losses}),
    }).then(async r => {
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.error || 'save_failed');
      remoteItemCount = Math.max(1, remoteItemCount);
    }))
      .then(()=> setSyncBadge('synced'))
      .catch(()=> setSyncBadge('error'));
  }
}
async function initCloudSync(){
  if(window.claude && window.claude.use){
    setSyncBadge('connecting');
    try{ cloudDb = await window.claude.use('db'); }catch(e){ cloudDb = null; }
    if(cloudDb){
      cloudDb.collection('students').onSnapshot(snap => {
        applyRemoteItems(snap.docs.map(doc => doc.data()));
        setSyncBadge('synced');
        render();
      }, () => setSyncBadge('error'));
      return;
    }
  }
  initPublicSync();
}
async function fetchPublicList(){
  const res = await fetch(PUBLIC_API, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'list'}),
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'list_failed');
  return data.items || [];
}
function markedRecords(source){
  const items = [];
  CLASSES.forEach(cls => (ROSTER[cls] || []).forEach(name => {
    const rec = source?.[cls]?.[name];
    const stars = Array.isArray(rec?.stars) ? rec.stars : [];
    const losses = Array.isArray(rec?.losses) ? rec.losses : [];
    if(stars.length || losses.length) items.push({cls, name, stars, losses});
  }));
  return items;
}
function saveLocalBackupIfNeeded(){
  if(markedRecords(DATA).length && !localStorage.getItem(LOCAL_BACKUP_KEY)){
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(DATA));
  }
}
function readLocalBackup(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_BACKUP_KEY) || '{}'); }
  catch(e){ return {}; }
}
async function verifyTeacherPin(pin){
  const res = await fetch(PUBLIC_API, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'verify', pin}),
  });
  const data = await res.json();
  return res.ok && data.ok;
}
async function refreshPublicList(){
  const items = await fetchPublicList();
  remoteItemCount = items.length;
  applyRemoteItems(items, true);
  setSyncBadge('synced');
  render();
}
function schedulePublicRefresh(){
  clearTimeout(publicPollTimer);
  publicPollTimer = setTimeout(async () => {
    try{ await refreshPublicList(); }
    catch(e){ setSyncBadge('error'); }
    finally{ schedulePublicRefresh(); }
  }, 5000);
}
async function migrateLocalBackupIfNeeded(){
  if(!publicApiActive || !editMode || !teacherPin || remoteItemCount !== 0) return;
  const items = markedRecords(readLocalBackup());
  if(!items.length) return;
  setSyncBadge('connecting');
  const res = await fetch(PUBLIC_API, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'import', pin: teacherPin, items}),
  });
  const data = await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || 'import_failed');
  localStorage.removeItem(LOCAL_BACKUP_KEY);
  await refreshPublicList();
  toast(`تم نقل النجوم القديمة للسحابة (${data.imported || items.length} طالبة)`);
}
async function initPublicSync(){
  setSyncBadge('connecting');
  try{
    const items = await fetchPublicList();
    remoteItemCount = items.length;
    if(!items.length) saveLocalBackupIfNeeded();
    applyRemoteItems(items, true);
    publicApiActive = true;
    setSyncBadge('synced');
    render();
    if(editMode){
      try{ await migrateLocalBackupIfNeeded(); }catch(e){ setSyncBadge('error'); }
    }
    schedulePublicRefresh();
  }catch(e){
    publicApiActive = false;
    setSyncBadge('local');
  }
}

// ---- edit lock: the public page allows everyone to view the results, while
// the shared teacher code protects adding, undoing, and resetting marks. ----
let teacherPin = sessionStorage.getItem(PIN_SESSION_KEY) || '';
let editMode = !!teacherPin;
localStorage.removeItem('palm_stars_edit_v1');

function updateLockUI(){
  const status = $('#lockStatus');
  const btn = $('#unlockBtn');
  if(editMode){
    status.textContent = '🔓 وضع التعديل مفعّل';
    status.classList.add('on');
    btn.textContent = '🔒 قفل';
  } else {
    status.textContent = '🔒 وضع العرض فقط';
    status.classList.remove('on');
    btn.textContent = '🔑 دخول المعلمة';
  }
  $('#resetBtn').disabled = !editMode;
}
function setEditMode(on){
  editMode = on;
  if(!on){
    teacherPin = '';
    sessionStorage.removeItem(PIN_SESSION_KEY);
  }
  updateLockUI();
  renderGrid();
}
$('#unlockBtn').onclick = async () => {
  if(editMode){ setEditMode(false); toast('تم القفل — وضع العرض فقط'); return; }
  const code = prompt('أدخلي رمز المعلمة لتفعيل الإضافة والحذف:');
  if(code === null) return;
  const btn = $('#unlockBtn');
  btn.disabled = true;
  setSyncBadge('connecting');
  try{
    const cleanCode = code.trim();
    if(!(await verifyTeacherPin(cleanCode))) throw new Error('forbidden');
    teacherPin = cleanCode;
    sessionStorage.setItem(PIN_SESSION_KEY, teacherPin);
    setEditMode(true);
    setSyncBadge('synced');
    toast('تم تفعيل وضع التعديل');
    try{ await migrateLocalBackupIfNeeded(); }catch(e){ setSyncBadge('error'); toast('تعذّر نقل النجوم القديمة'); }
  }catch(e){
    teacherPin = '';
    sessionStorage.removeItem(PIN_SESSION_KEY);
    setEditMode(false);
    setSyncBadge(publicApiActive ? 'synced' : 'error');
    toast('رمز غير صحيح');
  }finally{
    btn.disabled = false;
  }
};

function addMark(kind, cls, name){
  if(!editMode) return;
  ensure(cls, name)[kind].push(new Date().toISOString());
  saveData(DATA);
  pushRecord(cls, name);
  render();
  toast(kind === 'stars' ? `⭐ نجمة لـ ${name}` : `➖ خسارة لـ ${name}`);
}
function undoMark(kind, cls, name){
  if(!editMode) return;
  const arr = ensure(cls, name)[kind];
  if(!arr.length) return;
  arr.pop();
  saveData(DATA);
  pushRecord(cls, name);
  render();
  toast(kind === 'stars' ? `تراجعت عن آخر نجمة لـ ${name}` : `تراجعت عن آخر خسارة لـ ${name}`);
}

function weekWinners(cls){
  const names = ROSTER[cls] || [];
  let max = 0; let winners = [];
  names.forEach(n => {
    const {starsWeek} = countsFor(cls, n);
    if(starsWeek > max){ max = starsWeek; winners = [n]; }
    else if(starsWeek === max && max > 0){ winners.push(n); }
  });
  return {max, winners};
}

function renderTabs(){
  $('#tabs').innerHTML = CLASSES.map(c =>
    `<button class="tab ${c===state.cls?'active':''}" data-cls="${c}">${CLASS_LABELS[c]}</button>`
  ).join('');
  $('#tabs').querySelectorAll('[data-cls]').forEach(b=>{
    b.onclick = () => { state.cls = b.dataset.cls; render(); };
  });
}

function renderWeekCard(){
  const {label} = currentWeekRange();
  const {max, winners} = weekWinners(state.cls);
  const box = $('#weekcard');
  if(!winners.length){
    box.className = 'weekcard empty';
    box.innerHTML = `<div class="range">📅 أسبوع ${label}</div><div class="star-title">🌟 نجمة الأسبوع — ${CLASS_LABELS[state.cls]}</div><div class="winners">ما فيه نجوم هالأسبوع بعد — ابدئي بإضافة أول نجمة!</div>`;
  } else {
    box.className = 'weekcard';
    box.innerHTML = `<div class="range">📅 أسبوع ${label}</div><div class="star-title">🌟 نجمة الأسبوع — ${CLASS_LABELS[state.cls]}</div><div class="winners">${winners.map(w=>`<span>${w} (${max}⭐)</span>`).join('')}</div>`;
  }
}

function renderGrid(){
  const q = state.q.trim();
  let names = (ROSTER[state.cls] || []).slice();
  if(q){ names = names.filter(n => n.includes(q)); }
  const withCounts = names.map(n => ({name:n, ...countsFor(state.cls, n)}));
  if(state.sort === 'stars'){
    withCounts.sort((a,b) => b.starsTotal - a.starsTotal || arCompare(a.name,b.name));
  } else {
    withCounts.sort((a,b) => arCompare(a.name,b.name));
  }
  if(!withCounts.length){
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">📭 ما فيه نتائج مطابقة.</div>`;
    return;
  }
  $('#grid').innerHTML = withCounts.map(s => `
    <div class="card">
      <div class="nm">${s.name}</div>
      <div class="counts">
        <span class="chip">⭐ الإجمالي: ${s.starsTotal}</span>
        <span class="chip week">هالأسبوع: ${s.starsWeek}</span>
        <span class="chip loss">➖ خسائر: ${s.lossesTotal}</span>
      </div>
      <div class="row">
        <button class="addbtn" data-add="${s.name}" ${editMode?'':'disabled'}>+ نجمة ⭐</button>
        <button class="undobtn" data-undo="${s.name}" ${(editMode && s.starsTotal)?'':'disabled'}>↩</button>
      </div>
      <div class="row">
        <button class="lossbtn" data-loss="${s.name}" ${editMode?'':'disabled'}>➖ خسارة</button>
        <button class="undobtn" data-undoloss="${s.name}" ${(editMode && s.lossesTotal)?'':'disabled'}>↩</button>
      </div>
    </div>
  `).join('');
  $('#grid').querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = () => addMark('stars', state.cls, b.dataset.add);
  });
  $('#grid').querySelectorAll('[data-undo]').forEach(b=>{
    b.onclick = () => undoMark('stars', state.cls, b.dataset.undo);
  });
  $('#grid').querySelectorAll('[data-loss]').forEach(b=>{
    b.onclick = () => addMark('losses', state.cls, b.dataset.loss);
  });
  $('#grid').querySelectorAll('[data-undoloss]').forEach(b=>{
    b.onclick = () => undoMark('losses', state.cls, b.dataset.undoloss);
  });
}

function render(){
  renderTabs();
  renderWeekCard();
  renderGrid();
}

$('#search').addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
$('#sortName').onclick = () => { state.sort='name'; $('#sortName').classList.add('active'); $('#sortStars').classList.remove('active'); renderGrid(); };
$('#sortStars').onclick = () => { state.sort='stars'; $('#sortStars').classList.add('active'); $('#sortName').classList.remove('active'); renderGrid(); };

$('#exportBtn').onclick = async () => {
  const names = ROSTER[state.cls] || [];
  const rows = [['الاسم','نجوم الإجمالي','نجوم هالأسبوع','خسائر الإجمالي','خسائر هالأسبوع'], ...names.map(n=>{const c=countsFor(state.cls,n);return [n,c.starsTotal,c.starsWeek,c.lossesTotal,c.lossesWeek];})];
  const csv = '﻿' + rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const filename = `stars-${state.cls.replace('/','-')}.csv`;
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  if(window.claude && window.claude.use){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{ await downloads.save({filename, data: blob}); }catch(e){ toast('تعذّر حفظ الملف'); }
        return;
      }
    }catch(e){}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('#resetBtn').onclick = () => {
  if(!editMode) return;
  if(!confirm(`متأكدة تبين تصفرين كل نجوم وخسائر ${CLASS_LABELS[state.cls]}؟ ما تنرجع بعدها.`)) return;
  const names = ROSTER[state.cls] || [];
  DATA[state.cls] = {};
  saveData(DATA);
  if(cloudDb){
    names.forEach(n => {
      const id = studentDocId(state.cls, n);
      queueWrite(id, () => cloudDb.collection('students').doc(id).delete()).catch(()=>{});
    });
  } else if(publicApiActive){
    fetch(PUBLIC_API, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'reset', pin: teacherPin, cls: state.cls}),
    }).then(async r => {
      const d = await r.json();
      if(!r.ok || !d.ok) throw new Error(d.error || 'reset_failed');
      remoteItemCount = 0;
      await refreshPublicList();
    }).catch(()=> setSyncBadge('error'));
  }
  render();
  toast('تم تصفير نجوم الصف');
};

updateLockUI();
render();
initCloudSync();
</script>
</body>
</html>
