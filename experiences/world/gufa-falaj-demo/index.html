<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض تجريبي — ركوب القفة بالفلج</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#0a0705; font-family:'Segoe UI', Tahoma, sans-serif; color:#e8d5b5; overflow:hidden; }
#stage { position:relative; width:100%; height:100vh; }
canvas { display:block; width:100%; height:100%; }
#splashFlash { position:fixed; inset:0; z-index:5; background:radial-gradient(circle,rgba(120,200,230,0.35),rgba(10,30,40,0.55)); opacity:0; pointer-events:none; transition:opacity 0.15s; }
#splashFlash.show { opacity:1; transition:opacity 0.02s; }

#hud { position:fixed; top:0; left:0; right:0; padding:16px 20px; display:flex; justify-content:space-between; z-index:10; pointer-events:none; }
.hud-panel { background:rgba(10,8,6,0.8); border:1px solid #8b1a3a; border-radius:10px; padding:8px 16px; font-size:13px; }
.hud-panel .label { color:#00d4aa; font-size:9px; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:2px; }
#progressVal, #scoreVal { direction:ltr; unicode-bidi:isolate; }

#caption { position:fixed; top:80px; left:50%; transform:translateX(-50%); z-index:15; text-align:center; max-width:520px; padding:0 20px; opacity:0; transition:opacity 0.4s; }
#caption.show { opacity:1; }
#caption .kicker { color:#00d4aa; font-size:11px; letter-spacing:2px; margin-bottom:6px; }
#caption p { color:#d4c5a9; font-size:16px; line-height:1.7; }

#quizBox { position:fixed; bottom:60px; left:50%; transform:translateX(-50%) translateY(20px); z-index:20; width:min(460px,90vw); background:rgba(10,8,6,0.95); border:1px solid #d4c5a9; border-radius:16px; padding:20px; opacity:0; pointer-events:none; transition:all 0.35s; }
#quizBox.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
#quizBox .q { color:#e8d5b5; font-size:15px; margin-bottom:14px; text-align:center; direction:ltr; unicode-bidi:isolate; }
.timerBar { height:6px; background:rgba(212,197,169,0.15); border-radius:3px; overflow:hidden; margin-bottom:14px; }
.timerFill { height:100%; background:linear-gradient(90deg,#00d4aa,#d4c5a9); width:100%; transition:width 0.05s linear; }
.qOpts { display:flex; flex-direction:column; gap:8px; }
.qOpt { background:rgba(212,197,169,0.08); border:1px solid #5a4a3a; color:#e8d5b5; padding:10px 14px; border-radius:10px; cursor:pointer; font-size:14px; }
.qOpt:hover { background:rgba(212,197,169,0.18); }
.qOpt.correct { background:rgba(0,212,170,0.3); border-color:#00d4aa; }
.qOpt.wrong { background:rgba(139,26,58,0.4); border-color:#8b1a3a; }

#feedback { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:30; font-size:26px; font-weight:700; opacity:0; transition:opacity 0.3s; text-shadow:0 0 20px rgba(0,0,0,0.8); }
#feedback.show { opacity:1; }
#feedback.good { color:#00d4aa; }
#feedback.bad { color:#e74c3c; }

#endScreen { position:fixed; inset:0; z-index:50; background:rgba(5,4,10,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
#endScreen.show { display:flex; }
#endScreen h2 { color:#d4c5a9; font-size:28px; margin-bottom:10px; direction:ltr; unicode-bidi:isolate; }
#endScreen p { color:#8b7a5f; font-size:14px; margin-bottom:24px; max-width:420px; direction:ltr; unicode-bidi:isolate; }
.restart-btn { background:rgba(214,51,132,0.15); border:1px solid rgba(214,51,132,0.4); color:#f0e6d2; padding:10px 28px; border-radius:10px; cursor:pointer; font-size:13px; margin:6px; }
.hidden { display:none !important; }

#skipBtn { margin-top:10px; background:none; border:1px solid rgba(212,197,169,0.3); color:#8b7a5f; padding:6px 16px; border-radius:8px; cursor:pointer; font-size:12px; }
#skipBtn:hover { background:rgba(212,197,169,0.08); }

#countdownScreen { position:fixed; inset:0; z-index:60; background:rgba(5,4,10,0.95); display:none; align-items:center; justify-content:center; }
#countdownScreen.show { display:flex; }
#countdownText { font-size:64px; font-weight:700; color:#00d4aa; direction:ltr; unicode-bidi:isolate; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>
<div id="splashFlash"></div>

<div id="hud">
  <div class="hud-panel"><div class="label">Score</div><div id="scoreVal">0</div></div>
  <div class="hud-panel"><div class="label">تقدّم الرحلة</div><div id="progressVal">١ / ٤</div></div>
</div>

<div id="caption">
  <div class="kicker">مزرعة التمر</div>
  <p id="captionText"></p>
</div>

<div id="quizBox">
  <div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
  <div class="q" id="quizQ"></div>
  <div class="qOpts" id="quizOpts"></div>
  <button id="skipBtn">Skip this question</button>
</div>

<div id="feedback"></div>

<div id="countdownScreen"><div id="countdownText">Ready</div></div>

<div id="endScreen">
  <h2 id="endTitle">🌴 وصلتوا آخر الفلج!</h2>
  <p id="endSub">هذا عرض تجريبي لفكرة "اركبوا القفة، شاهدوا وتعلّموا، جاوبوا بسرعة قبل ما تطيحون بالماء". لو عجبتك الفكرة نطورها بمستويات حقيقية.</p>
  <div>النقاط النهائية: <b id="finalScore" style="color:#00d4aa;"></b> &nbsp; <span id="finalPct" style="direction:ltr;unicode-bidi:isolate;color:#8b7a5f;"></span></div>
  <button class="restart-btn hidden" id="continuePortalBtn" style="margin-top:18px;">Back to the Library →</button>
  <button class="restart-btn" id="restartBtn" style="margin-top:18px;">أعيدوا الرحلة</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// نفس الفكرة القديمة (تشوفون القفة والراكب من برّه) صارت فيرست بيرسون —
// الكاميرا نفسها جوه القفة تتمايل مع الماء، بدون ما نشوف "شخص" يمثّلنا
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
const skyTop = new THREE.Color(0x1a2438), skyHorizon = new THREE.Color(0x3a4a5a);
scene.background = skyTop;
scene.fog = new THREE.Fog(skyHorizon.getHex(), 15, 90);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0.6, 6);
camera.lookAt(0, 0.5, -40);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', resize);

// قبة سماء — نسيج بانوراما ليلي حقيقي (Kenney Skyboxes، CC0) بدل التدرج
// اللوني البسيط السابق
const skyGeo = new THREE.SphereGeometry(250, 48, 32);
const skyTex = new THREE.TextureLoader().load('assets/skybox-night.webp');
skyTex.colorSpace = THREE.SRGBColorSpace;
const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false });
scene.add(new THREE.Mesh(skyGeo, skyMat));

scene.add(new THREE.AmbientLight(0xd4c5a9, 1.1));
const moonLight = new THREE.DirectionalLight(0xaeb8d4, 0.7);
moonLight.position.set(-10, 20, -10);
scene.add(moonLight);

// الماء — بلاطة كبيرة بنسيج خطوط جريان متحركة (نفس فكرة flow lines بالنسخة القديمة)
const waterCanvas = document.createElement('canvas');
waterCanvas.width = 64; waterCanvas.height = 64;
const waterCtx = waterCanvas.getContext('2d');
waterCtx.fillStyle = '#0d3a4a';
waterCtx.fillRect(0, 0, 64, 64);
waterCtx.strokeStyle = 'rgba(0,212,170,0.35)';
waterCtx.lineWidth = 2;
for (let i = 0; i < 4; i++) {
  waterCtx.beginPath();
  waterCtx.moveTo(0, i * 16 + 6);
  waterCtx.lineTo(24, i * 16 + 6);
  waterCtx.stroke();
}
const waterTex = new THREE.CanvasTexture(waterCanvas);
waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
waterTex.repeat.set(6, 40);
const waterGeo = new THREE.PlaneGeometry(30, 300, 1, 1);
const waterMat = new THREE.MeshStandardMaterial({ map: waterTex, color: 0x0d3a4a, roughness: 0.35, metalness: 0.1 });
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0, -120);
scene.add(water);

// ضفتان حجريتان + نخيل يمر جنب اللاعب على الجانبين
const bankMat = new THREE.MeshStandardMaterial({ color: 0x2a1f16, roughness: 0.9 });
[-8.5, 8.5].forEach(x => {
  const bank = new THREE.Mesh(new THREE.BoxGeometry(3, 0.4, 300), bankMat);
  bank.position.set(x, -0.1, -120);
  scene.add(bank);
});

function makePalm(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 2.4, 6),
    new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1 }));
  trunk.position.y = 1.2;
  g.add(trunk);
  const frondMat = new THREE.MeshStandardMaterial({ color: 0x1c3320, roughness: 1 });
  for (let i = 0; i < 6; i++) {
    const frond = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.6, 4), frondMat);
    frond.position.y = 2.5;
    frond.rotation.z = Math.PI / 2.3;
    frond.rotation.y = (i / 6) * Math.PI * 2;
    g.add(frond);
  }
  g.position.set(x, 0, z);
  return g;
}
for (let i = 0; i < 22; i++) {
  const z = -i * 14 - 4;
  scene.add(makePalm(-10.5 - Math.random() * 2, z));
  scene.add(makePalm(10.5 + Math.random() * 2, z));
}

// لو جاي من رحلة بطاقة (تاروت → ستارة الحروف → هنا)، الأسئلة تكون عن نفس محتوى البطاقة تحديداً
const CARD = JSON.parse(sessionStorage.getItem('palmtree_currentCard') || 'null');
const PASS_THRESHOLD = 0.9;

const DEFAULT_ROUNDS = [
  {
    caption: 'التمر ينضج على النخيل — موسم الحصاد بدأ في القرية.',
    q: 'What does "Harvest" mean?',
    opts: ['الحصاد', 'الفلج', 'المسجد'],
    correct: 0
  },
  {
    caption: 'الفلج يمر بجانب بيت مرهون وابنه سعيد وهم يعملون بالمزرعة.',
    q: 'Who helps his father Marhoon on the farm?',
    opts: ['سعيد', 'خليل', 'منصور'],
    correct: 0
  },
  {
    caption: 'القفة تمر تحت ظل النخيل — الماء بارد ورائق اليوم.',
    q: 'What does "Shade" mean?',
    opts: ['ضوء الشمس', 'الظل', 'المطر'],
    correct: 1
  },
  {
    caption: 'اقتربتوا من نهاية الفلج، حيث يلتقي بالبستان الكبير.',
    q: 'What do you call the traditional boat you are riding now?',
    opts: ['قفة (Gufa)', 'سفينة (Ship)', 'زورق (Canoe)'],
    correct: 0
  },
];

const ROUNDS = CARD && CARD.questions ? CARD.questions.map(q => ({
  caption: 'فكّروا بالي قريتوه على البطاقة...',
  q: q.q, opts: q.opts, correct: q.correct
})) : DEFAULT_ROUNDS;

let round = 0;
let score = 0;
let correctCount = 0;
let answeredCount = 0;
let capsized = false;
let capsizeT = 0;
let running = true;

// حلقة الرسم — فيرست بيرسون: الكاميرا نفسها تتمايل مثل حد قاعد جوا القفة،
// وبدل ما نشوف القفة "تنقلب" من برّه، الكاميرا نفسها تميل وتنزل وقت الغلط
const splashFlash = document.getElementById('splashFlash');
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (!running) return;
  const t = clock.getElapsedTime();
  waterTex.offset.y -= 0.006;

  const bobY = Math.sin(t * 2.1) * 0.05;
  const bobRoll = Math.sin(t * 1.3) * 0.025;
  const bobPitch = Math.sin(t * 1.7) * 0.012;

  if (capsized) {
    capsizeT += 0.02;
    const tilt = Math.min(0.5, capsizeT * 2.6);
    camera.position.y = 0.6 + bobY - Math.min(0.35, capsizeT * 0.5);
    camera.rotation.z = bobRoll + tilt;
    camera.rotation.x = -bobPitch - Math.min(0.25, capsizeT * 0.4);
    splashFlash.classList.toggle('show', capsizeT < 1.1);
  } else {
    camera.position.y = 0.6 + bobY;
    camera.rotation.z = bobRoll;
    camera.rotation.x = -bobPitch;
    splashFlash.classList.remove('show');
  }
  camera.rotation.order = 'YXZ';

  renderer.render(scene, camera);
}
animate();

function showCaption(text) {
  const el = document.getElementById('caption');
  document.getElementById('captionText').textContent = text;
  el.classList.add('show');
}
function hideCaption() {
  document.getElementById('caption').classList.remove('show');
}

function showFeedback(text, good) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.className = good ? 'show good' : 'show bad';
  setTimeout(() => { el.className = ''; }, 900);
}

let timerInterval = null;
function startRound() {
  if (round >= ROUNDS.length) { endTrip(); return; }
  const r = ROUNDS[round];
  document.getElementById('progressVal').textContent = `${toArabicDigits(round + 1)} / ${toArabicDigits(ROUNDS.length)}`;
  capsized = false; capsizeT = 0;
  showCaption(r.caption);

  setTimeout(() => {
    hideCaption();
    openQuiz(r);
  }, 2200);
}

function toArabicDigits(n) {
  const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(n).split('').map(d => map[+d] ?? d).join('');
}

function openQuiz(r) {
  const box = document.getElementById('quizBox');
  document.getElementById('quizQ').textContent = r.q;
  const optsEl = document.getElementById('quizOpts');
  optsEl.innerHTML = '';
  let answered = false;
  const timeLimit = 4000;
  const start = performance.now();
  const fill = document.getElementById('timerFill');

  function tick() {
    if (answered) return;
    const elapsed = performance.now() - start;
    const pct = Math.max(0, 1 - elapsed / timeLimit);
    fill.style.width = (pct * 100) + '%';
    if (pct <= 0) {
      answered = true;
      resolveRound(false, r);
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  r.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'qOpt';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const correct = i === r.correct;
      Array.from(optsEl.children).forEach((c, ci) => {
        if (ci === r.correct) c.classList.add('correct');
        else if (ci === i) c.classList.add('wrong');
      });
      resolveRound(correct, r);
    });
    optsEl.appendChild(btn);
  });

  const skipBtn = document.getElementById('skipBtn');
  skipBtn.onclick = () => {
    if (answered) return;
    answered = true;
    // السؤال يُتخطى بدون ما يُحسب صح أو خطأ بالنسبة المئوية
    document.getElementById('quizBox').classList.remove('show');
    setTimeout(() => { round++; startRound(); }, 300);
  };

  box.classList.add('show');
}

function resolveRound(correct, r) {
  answeredCount++;
  if (correct) correctCount++;
  setTimeout(() => {
    document.getElementById('quizBox').classList.remove('show');
    if (correct) {
      score += 10;
      document.getElementById('scoreVal').textContent = score;
      showFeedback('✅ صحيح! استمرت القفة بسلام', true);
    } else {
      showFeedback('💦 طاح من القفة بالفلج!', false);
      capsized = true; capsizeT = 0;
    }
    setTimeout(() => {
      round++;
      startRound();
    }, correct ? 700 : 1500);
  }, 500);
}

function endTrip() {
  const pct = answeredCount > 0 ? correctCount / answeredCount : 1;
  document.getElementById('finalScore').textContent = score;

  if (CARD) {
    document.getElementById('finalPct').textContent = `(${Math.round(pct * 100)}% correct)`;
    if (pct >= PASS_THRESHOLD) {
      document.getElementById('endTitle').textContent = '🌴 Well done — you passed!';
      document.getElementById('endSub').textContent = `You answered ${Math.round(pct * 100)}% correctly (need ${Math.round(PASS_THRESHOLD * 100)}%). The falaj sweeps you back to the library for a new card...`;
      document.getElementById('continuePortalBtn').classList.remove('hidden');
      document.getElementById('restartBtn').classList.add('hidden');
    } else {
      document.getElementById('endTitle').textContent = '💦 Almost there!';
      document.getElementById('endSub').textContent = `You need ${Math.round(PASS_THRESHOLD * 100)}% correct to continue — you got ${Math.round(pct * 100)}%. Let's ride the falaj again.`;
      document.getElementById('continuePortalBtn').classList.add('hidden');
      document.getElementById('restartBtn').classList.remove('hidden');
    }
  }

  document.getElementById('endScreen').classList.add('show');
}

function runCountdown(cb) {
  const screen = document.getElementById('countdownScreen');
  const text = document.getElementById('countdownText');
  const steps = ['Ready', '3', '2', '1', 'GO!'];
  let i = 0;
  screen.classList.add('show');
  text.textContent = steps[0];
  const iv = setInterval(() => {
    i++;
    if (i >= steps.length) {
      clearInterval(iv);
      screen.classList.remove('show');
      cb();
      return;
    }
    text.textContent = steps[i];
  }, 500);
}

document.getElementById('restartBtn').addEventListener('click', () => {
  round = 0; score = 0; correctCount = 0; answeredCount = 0; capsized = false; capsizeT = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('endScreen').classList.remove('show');
  runCountdown(startRound);
});

document.getElementById('continuePortalBtn').addEventListener('click', () => {
  // نرجع لغرفة المكتبة ونصفّر التسلسل — هوت سبوت ١ (الكروت) يتوهج من جديد لبطاقة جديدة
  sessionStorage.setItem('palmtree_stage', 'hotspot1');
  sessionStorage.removeItem('palmtree_currentCard');
  window.location.href = '../../under-palm-tree-games/1-tarot/index.html';
});

runCountdown(startRound);
</script>

</body>
</html>
