/* ============ ENGINE ============ */
var cur=null,timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}document.getElementById('tbar').style.display='none';}
document.getElementById('bThink').onclick=function(){flags.pause=true;unlock('cool');fx({ec:6});stopTimer();
 ov('<h2>🧘 PAUSE & THINK</h2><p class="dim">You are ALLOWED to pause. Pressure loses power when you slow down.</p>'+
 '<div class="fb">Check: Is someone threatening? Asking private info? Demanding secrecy? Impersonating? Pressuring? Asking for money/credentials? Is anyone in immediate danger? Do I need '+SAFETY_CONFIG.trustedAdultLabel+'?</div>'+
 '<button class="btn big" onclick="ovHide()">I\u2019m calm. Continue.</button>');};
document.getElementById('bSafe').onclick=function(){
 ov('<h2>🛡 SAFETY CHECK</h2>'+['Is someone threatening me?','Is someone asking for private information?','Is someone demanding secrecy?','Is someone impersonating another person?','Is someone pressuring me?','Am I being asked to send money or credentials?','Is anyone in immediate danger?','Do I need help from '+SAFETY_CONFIG.trustedAdultLabel+'?'].map(function(q){return '<div class="evrow">❓ '+q+'</div>';}).join('')+
 '<div class="fb">If several answers are YES \u2192 preserve evidence, do not escalate, and involve '+SAFETY_CONFIG.trustedAdultLabel+'. If anyone is in immediate danger \u2192 contact emergency services ('+SAFETY_CONFIG.reportingResources.join(' · ')+').</div><button class="btn big" onclick="ovHide()">Close</button>');};
document.getElementById('badge').onclick=function(){
 ov('<h2>🧩 EVIDENCE BOARD</h2>'+(evidence.length?evidence.map(function(id){var e=EV[id];return '<div class="evrow">'+e.i+' <b>'+e.n+'</b><br><span class="dim">'+e.d+'</span></div>';}).join(''):'<p class="dim">No evidence collected yet. Inspect profiles, messages and links.</p>')+'<button class="btn big" onclick="ovHide()">Close</button>');};
document.getElementById('bHome').onclick=menu;
function go(id){stopTimer();retried=false;
 if(id==='end'){final();return;}
 cur=id;var n=SCENES[id];if(n.ch>chDone){chDone=n.ch;save();}
 lastSay=[];var h='';
 if(n.type==='msg'){h='<div class="card">';n.bubbles.forEach(function(b,i){setTimeout(function(){var d=document.createElement('div');d.className='bub w-'+b[0];d.innerHTML=(b[0]==='system'?'':'<span class="who">'+b[0].toUpperCase()+'</span>')+b[1];scr.firstChild.appendChild(d);scr.scrollTop=scr.scrollHeight;say(b[0],b[1]);beep(b[0]==='unknown'?220:520,.06);},500*i);});
  h+='<button class="btn big" id="nx" style="margin-top:'+(n.bubbles.length*500+300)+'ms" onclick="go(\''+n.next+'\')">Continue ▸</button></div>';
  scr.innerHTML=h;if(n.ev)addEv(n.ev);
  if(n.timer){document.getElementById('tbar').style.display='block';var t=n.timer;document.getElementById('tval').textContent=t;
   timerId=setInterval(function(){t--;document.getElementById('tval').textContent=t;if(t<=0){stopTimer();var d=document.createElement('div');d.className='bub w-system';d.textContent=n.timerEnd;scr.firstChild.appendChild(d);say('system',n.timerEnd);fx({ra:6});}},1000);}
  return;}
 if(n.type==='multi'){h='<div class="card"><div class="q">'+n.q+'</div>';n.opts.forEach(function(o,i){h+='<button class="btn m" data-i="'+i+'">'+o[0]+'</button>';});
  h+='<button class="btn big" id="chk">CHECK OBSERVATIONS</button></div>';scr.innerHTML=h;
  scr.querySelectorAll('.m').forEach(function(b){b.onclick=function(){b.classList.toggle('sel');beep(600,.05);};});
  document.getElementById('chk').onclick=function(){var pick=scr.querySelectorAll('.m.sel'),good=0,bad=0;
   pick.forEach(function(b){n.opts[+b.dataset.i][1]?good++:bad++;});
   var ok=good>=n.need&&bad===0;fx(n.fxs);if(ok&&n.shield)unlock('prv');if(bad)flags.shield=false;
   scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb '+(ok?'ok':'warn')+'">'+n.fb+'</div><button class="btn big" onclick="go(\''+n.next+'\')">Continue ▸</button>');
   document.getElementById('chk').remove();say('system',n.fb);};
  say('system',n.q);return;}
 if(n.type==='choice'){h='<div class="card"><div class="q">'+n.q+'</div>';n.opts.forEach(function(o,i){h+='<button class="btn c" data-i="'+i+'">'+o.t+'</button>';});h+='</div>';scr.innerHTML=h;
  scr.querySelectorAll('.c').forEach(function(b){b.onclick=function(){var o=n.opts[+b.dataset.i];fx(o.fx||{});if(o.flag==='troll')flags.troll=true;if(o.flag==='help')flags.help=true;if(o.flag==='report')flags.report=true;if(o.flag==='fake')unlock('fake');
   if(!o.good&&!flags.troll&&n.ch===4){}
   if(o.risky&&n.retry&&!retried){retried=true;
    scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb warn">WHAT HAPPENED? '+o.c+'</div><button class="btn big" id="try">🔄 TRY AGAIN</button><button class="btn" id="cont">Accept consequence & continue ▸</button>');
    document.getElementById('try').onclick=function(){go(cur);};
    document.getElementById('cont').onclick=function(){if(o.flag==='troll')flags.troll=true;go(n.next);};
    say('system','What happened? '+o.c);return;}
   if(o.good&&!flags.troll&&n.ch===4)unlock('troll');
   scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb ok">'+o.c+'</div><button class="btn big" onclick="go(\''+n.next+'\')">Continue ▸</button>');
   scr.querySelectorAll('.c').forEach(function(x){x.disabled=true;});say('system',o.c);};});
  say('system',n.q);return;}
 if(n.type==='why'){h='<div class="card"><div class="q">'+n.q+'</div>';n.opts.forEach(function(o,i){h+='<button class="btn w" data-i="'+i+'">'+o[0]+'</button>';});h+='</div>';scr.innerHTML=h;
  scr.querySelectorAll('.w').forEach(function(b){b.onclick=function(){fx(n.opts[+b.dataset.i][1]);if((n.opts[+b.dataset.i][0]||'').indexOf('help')>=0||(+b.dataset.i===5||+b.dataset.i===3||+b.dataset.i===4))unlock('ask');
   scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb">'+n.fb+'</div><button class="btn big" onclick="go(\''+n.next+'\')">Continue ▸</button>');say('system',n.fb);};});
  say('system',n.q);return;}
 if(n.type==='classify'){h='<div class="card"><div class="q">'+n.q+'</div>';n.items.forEach(function(it,i){h+='<div class="evrow" data-i="'+i+'">'+it[0]+'<div class="grid" style="width:130px"><button class="mini" data-v="F">FACT</button><button class="mini" data-v="A">ASSUMP.</button><button class="mini" data-v="U">UNKNOWN</button></div></div>';});
  h+='<button class="btn big" id="chk">CHECK</button></div>';scr.innerHTML=h;
  scr.querySelectorAll('.mini').forEach(function(m){m.onclick=function(){var row=m.parentNode.parentNode;row.querySelectorAll('.mini').forEach(function(x){x.classList.remove('sel');});m.classList.add('sel');row.dataset.v=m.dataset.v;beep(500,.05);};});
  document.getElementById('chk').onclick=function(){var good=0;n.items.forEach(function(it,i){var row=scr.querySelector('[data-i="'+i+'"]');if(row.dataset.v===it[1])good++;});
   var perfect=good===n.items.length;if(perfect)unlock('fac');else flags.factPerfect=false;
   fx({ct:Math.round(good*1.5)});
   scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb '+(perfect?'ok':'')+'">'+good+'/'+n.items.length+' correct. '+n.fb+'</div><button class="btn big" onclick="go(\''+n.next+'\')">Continue ▸</button>');document.getElementById('chk').remove();say('system',n.fb);};
  say('system',n.q);return;}
 if(n.type==='inspect'){h='<div class="card"><div class="q">'+n.q+'</div>'+n.html+'<div class="dim" id="cnt">0/'+n.need+' clues</div></div>';scr.innerHTML=h;var f=0;
  scr.querySelectorAll('.hs').forEach(function(s){s.onclick=function(){if(s.classList.contains('found'))return;s.classList.add('found');f++;addEv(s.dataset.e);beep(800,.07);document.getElementById('cnt').textContent=Math.min(f,n.need)+'/'+n.need+' clues';
   if(f>=n.need){fx(n.fxs);if(evidence.length>=8)unlock('evh');scr.querySelector('.card').insertAdjacentHTML('beforeend','<div class="fb ok">'+n.fb+'</div><button class="btn big" onclick="go(\''+n.next+'\')">Continue ▸</button>');say('system',n.fb);}};});
  say('system',n.q);return;}
}
/* ============ ENDINGS / FINAL ============ */
function calcEnding(){var all=S.ct>=75&&S.ds>=75&&S.ev>=75&&S.pv>=75&&S.ec>=75&&S.hs>=75&&S.ra>=75;
 if(all)return['E6','MASTER OF THE SIGNAL','You didn\u2019t just know what to do. You knew why.'];
 if(S.ec<50)return['E1','STOP. THINK.','Emotional reactions can increase risk. A pause is a superpower.'];
 if(S.hs<50)return['E2','YOU DON\u2019T HAVE TO HANDLE EVERYTHING ALONE.','Asking for help is a strength, not a failure.'];
 if(S.ct>=70&&S.ev>=70)return['E3','THE DIGITAL DETECTIVE.','You separate fact from assumption \u2014 and that is rare.'];
 if(S.ev>=65&&flags.report)return['E4','FOLLOW THE SIGNAL.','Evidence preserved, no escalation, right channels used.'];
 if(S.ec>=60)return['E5','CALM UNDER PRESSURE.','You paused, verified, protected privacy and avoided retaliation.'];
 return S.ct>=S.ev?['E3','THE DIGITAL DETECTIVE.','You separate fact from assumption.']:['E4','FOLLOW THE SIGNAL.','You kept evidence and used the right channels.'];}
function final(){var e=calcEnding();endings[e[0]]=1;if(e[0]==='E6')unlock('mst');
 if(flags.help)unlock('ask');if(!flags.troll)unlock('troll');if(flags.shield)unlock('prv');if(flags.pause)unlock('cool');if(flags.factPerfect)unlock('fac');if(evidence.length>=8)unlock('evh');save();
 var L=[];if(S.ra>=65)L.push('You spotted pressure tactics like urgency and secrecy.');if(S.ct>=65)L.push('You separated fact from assumption instead of jumping to conclusions.');if(S.ev>=65)L.push('You preserved useful evidence instead of deleting or spreading it.');if(S.hs>=65)L.push('You recognized when to bring in a trusted adult.');if(S.pv>=65)L.push('You protected personal information.');if(S.ec<50)L.push('You sometimes responded before pausing \u2014 try 🧘 next time.');if(!flags.pause)L.push('Remember: you are always allowed to pause and think.');
 var bars=['🧠 Critical Thinking|ct','🛡️ Digital Safety|ds','🔎 Evidence Evaluation|ev','🔐 Privacy Awareness|pv','🧘 Emotional Control|ec','🤝 Help Seeking|hs'].map(function(b){var p=b.split('|');return p[0]+' \u2014 '+S[p[1]]+'%<div class="bar"><i style="width:'+S[p[1]]+'%"></i></div>';}).join('');
 scr.innerHTML='<div class="card center"><h2>INVESTIGATION COMPLETE</h2><h1 style="font-size:26px">'+e[1]+'</h1><p class="tag">'+e[2]+'</p></div>'+
 '<div class="card"><h2>YOUR THINKING PROFILE</h2>'+bars+'</div>'+
 '<div class="card"><h2>WHAT DID YOU LEARN?</h2>'+L.slice(0,5).map(function(x){return '<div class="fb ok">'+x+'</div>';}).join('')+
 '<div class="fb">THINK BEFORE YOU TRUST.<br>CHECK BEFORE YOU SHARE.<br>PAUSE BEFORE YOU RESPOND.<br>ASK FOR HELP WHEN YOU NEED IT.</div>'+
 '<p class="dim">Don\u2019t just ask \u201CIs this safe?\u201D Ask: what do I know, what don\u2019t I know, what could happen next \u2014 and who can help?</p>'+
 '<button class="btn big" onclick="restart()">🔄 REPLAY</button><button class="btn big" onclick="restart()">🧩 FIND ANOTHER ENDING</button><button class="btn big" onclick="showAch()">🏆 VIEW ACHIEVEMENTS</button></div>';
 say('system','Investigation complete. Ending: '+e[1]+'. '+e[2]);}
function showAch(){ov('<h2>🏆 ACHIEVEMENTS</h2>'+Object.keys(ACH).map(function(k){return '<div class="evrow">'+(ach[k]?'✅':'🔒')+' '+ACH[k].n+'</div>';}).join('')+'<h2>🎭 ENDINGS</h2>'+['E1','E2','E3','E4','E5','E6'].map(function(k){return '<div class="evrow">'+(endings[k]?'✅':'🔒')+' '+k+'</div>';}).join('')+'<button class="btn big" onclick="ovHide()">Close</button>');}
/* ============ MENU / SETTINGS ============ */
function menu(){stopTimer();stopSay();
 scr.innerHTML='<div class="card center"><h1>THE SIGNAL</h1><div class="tag">THINK. CHECK. DECIDE.</div><p class="dim">\u201CNot every message tells the whole story.\u201D</p>'+
 '<button class="btn big" onclick="restart()">▶ START INVESTIGATION</button><button class="btn big" onclick="howto()">📖 HOW TO PLAY</button><button class="btn big" onclick="showAch()">🏆 MY ACHIEVEMENTS</button><button class="btn big" onclick="settings()">⚙ SETTINGS</button>'+
 '<div class="foot">CRITICAL THINKING • DIGITAL SAFETY • DECISION MAKING</div></div>';}
function restart(){S={ct:50,ds:50,ev:50,pv:50,ec:50,hs:50,ra:50};flags={pause:false,troll:false,help:false,report:false,shield:true,factPerfect:true,evidence:0};evidence=[];document.getElementById('evn').textContent=0;initA();go('open1');}
function howto(){ov('<h2>📖 HOW TO PLAY</h2><div class="fb">MESSAGE → OBSERVE → INVESTIGATE → COLLECT CLUES → FACT/ASSUMPTION/UNKNOWN → PREDICT → DECIDE → CONSEQUENCE → REFLECT.</div><p class="dim">• Tap choices, tap clues in screenshots, classify statements.<br>• 🧘 pauses pressure timers \u2014 you are ALWAYS allowed to think.<br>• 🛡 opens the Safety Check. 🧩 opens your Evidence Board.<br>• Mistakes are not failures \u2014 the game shows what happened and lets you try again.<br>• 🔊 voice narration, 🔁 replay, ⏸ pause.</p><button class="btn big" onclick="ovHide()">Close</button>');}
function settings(){ov('<h2>⚙ SETTINGS</h2><label>Country</label><input id="s1" value="'+SAFETY_CONFIG.country+'"><label>School safeguarding contact</label><input id="s2" value="'+SAFETY_CONFIG.schoolContact+'"><label>Trusted adult label</label><input id="s3" value="'+SAFETY_CONFIG.trustedAdultLabel+'"><label>Reporting resources (comma separated)</label><input id="s4" value="'+SAFETY_CONFIG.reportingResources.join(', ')+'"><label>Language</label><select id="s5"><option value="en">English</option><option value="bi"'+(LANG==='bi'?' selected':'')+'>English + العربية (glosses)</option></select><button class="btn big" id="sv">💾 SAVE</button><button class="btn big" onclick="ovHide()">Close</button>');
 document.getElementById('sv').onclick=function(){SAFETY_CONFIG.country=document.getElementById('s1').value;SAFETY_CONFIG.schoolContact=document.getElementById('s2').value;SAFETY_CONFIG.trustedAdultLabel=document.getElementById('s3').value;SAFETY_CONFIG.reportingResources=document.getElementById('s4').value.split(',');LANG=document.getElementById('s5').value;
 try{localStorage.setItem('sig_cfg',JSON.stringify(SAFETY_CONFIG));localStorage.setItem('sig_lang',LANG);}catch(e){}toast('Settings saved');ovHide();};}
menu();
</script>
