<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quffah Match</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet"/>
<style>
:root {
  color-scheme: light only;
  --paper-light:#f5e9d0;--paper-mid:#e8d5b0;--paper-deep:#c5ac80;
  --paper-shadow:#f0dfb8;--burgundy:#5a1a1f;--burgundy-deep:#2b0102;
  --burgundy-dark:#4a0a14;--green:#6f8a44;--green-deep:#3a5024;
  --green-soft:#8a9a4e;--gold:#c79a4a;--gold-bright:#d8b06a;
  --gold-soft:#b3927c;--olive:#5e4a2e;--olive-deep:#3a2c1a;
  --ink:#1a0a06;--ink-soft:#3a2418;--cream:#dbc7a6;--cream-card:#faf3e0;
  --error:#a83a3a;--success:#5a8a3a;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper-light);font-family:'Cormorant Garamond',Georgia,serif;
  min-height:100vh;font-size:17px;line-height:1.6;color:var(--ink);
}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(94,74,46,.06) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(90,26,31,.05) 0%,transparent 50%);pointer-events:none;z-index:0}

.header{
  background:linear-gradient(180deg,var(--burgundy-deep),var(--burgundy-dark));
  border-radius:0;padding:18px 20px;text-align:center;margin-bottom:14px;
  position:relative;border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.header h1{font-family:'Cinzel',serif;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.3);letter-spacing:3px;text-transform:uppercase}
.header p{font-size:.82rem;color:var(--cream);margin-top:3px;font-style:italic}
.back-link{
  position:absolute;top:12px;left:14px;color:var(--gold);text-decoration:none;
  font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  background:rgba(199,154,74,.12);padding:5px 12px;border-radius:20px;border:1px solid var(--gold);
}

.scoreboard{
  background:var(--cream-card);border:2px solid var(--olive);border-radius:18px;
  padding:12px 18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  box-shadow:0 4px 14px rgba(58,31,14,.08);margin-bottom:14px;
}
.sc-item{text-align:center}
.sc-val{font-family:'Aref Ruqaa',serif;font-size:1.5rem;line-height:1}
.sc-lbl{font-family:'Special Elite',monospace;font-size:.62rem;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sc-div{width:1px;background:var(--paper-deep)}

.level-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.lvl-btn{
  padding:9px 20px;border-radius:20px;font-size:.82rem;font-weight:700;
  cursor:pointer;border:2.5px solid transparent;transition:all .2s;
  font-family:'Special Elite',monospace;letter-spacing:1px;
}
.lvl-btn.l1{background:var(--paper-shadow);color:var(--green-deep);border-color:var(--green)}
.lvl-btn.l2{background:var(--paper-shadow);color:var(--burgundy);border-color:var(--gold)}
.lvl-btn.l3{background:var(--paper-shadow);color:var(--olive);border-color:var(--olive)}
.lvl-btn.active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(58,31,14,.12);color:var(--cream)}
.lvl-btn.l1.active{background:var(--green-deep)}
.lvl-btn.l2.active{background:var(--burgundy)}
.lvl-btn.l3.active{background:var(--olive-deep)}

.grid-wrap{
  background:var(--cream-card);border:2px solid var(--olive);border-radius:24px;
  padding:16px;box-shadow:0 4px 20px rgba(58,31,14,.07);margin-bottom:14px;
}
.grid{display:grid;gap:10px;justify-content:center}

.card{aspect-ratio:1;perspective:700px;cursor:pointer;min-width:0}
.card-inner{width:100%;height:100%;position:relative;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px;text-align:center;font-family:'Cormorant Garamond',serif;
}
.card-back{
  background:linear-gradient(180deg,var(--burgundy-deep),var(--burgundy-dark));
  box-shadow:0 4px 14px rgba(43,1,2,.15);font-size:2rem;color:var(--gold);
}
.card-back::after{content:'🌴';font-size:1.6rem}
.card-front{
  transform:rotateY(180deg);border:2.5px solid transparent;
  font-size:.75rem;font-weight:600;line-height:1.4;color:var(--ink);
}
.card-front.char{background:var(--paper-shadow);border-color:var(--burgundy)}
.card-front.desc{background:var(--cream-card);border-color:var(--green)}
.card-front.word{background:rgba(199,154,74,.12);border-color:var(--gold)}
.card-front.def{background:var(--paper-light);border-color:var(--olive)}

.card.matched .card-front{
  background:rgba(106,138,58,.15)!important;border-color:var(--green-deep)!important;
  box-shadow:0 0 0 3px var(--green-deep);
  animation:matchPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes matchPop{0%{transform:rotateY(180deg) scale(.9)}50%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}
.card.wrong .card-inner{animation:shake .35s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.card-emoji{font-size:1.5rem;margin-bottom:4px;display:block}
.card-text{font-size:.72rem;font-weight:600;line-height:1.35;color:var(--ink)}

.fb-bar{
  background:var(--cream-card);border:2px solid var(--olive);border-radius:16px;
  padding:12px 18px;text-align:center;font-family:'Cormorant Garamond',serif;
  font-weight:700;font-size:.9rem;box-shadow:0 2px 10px rgba(58,31,14,.05);
  margin-bottom:14px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .3s;
}
.fb-bar.ok{background:rgba(106,138,58,.12);color:var(--green-deep);border-color:var(--green)}
.fb-bar.no{background:rgba(168,58,58,.08);color:var(--error);border-color:var(--error)}
.fb-bar.idle{color:var(--olive);border-color:var(--paper-deep)}

#winOverlay{
  display:none;position:fixed;inset:0;background:rgba(43,1,2,.55);
  backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px;
}
#winOverlay.show{display:flex}
.win-card{
  background:var(--cream-card);border:2px solid var(--gold);border-radius:26px;
  padding:36px 28px;text-align:center;width:100%;max-width:380px;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 16px 40px rgba(58,31,14,.2);
}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-palm{font-size:3.5rem;animation:sway 4s ease-in-out infinite;display:block;margin-bottom:8px}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.win-title{font-family:'Aref Ruqaa',serif;font-size:1.8rem;color:var(--burgundy-deep);margin-bottom:6px}
.win-score{font-family:'Cinzel',serif;font-size:2.8rem;color:var(--gold);letter-spacing:4px;margin:8px 0}
.win-msg{font-family:'Cormorant Garamond',serif;font-size:.95rem;color:var(--olive);font-style:italic;margin-bottom:20px;line-height:1.6}
.btn-again{
  background:linear-gradient(180deg,var(--gold),var(--olive));color:var(--cream);
  border:2px solid var(--burgundy-deep);font-family:'Cinzel',serif;font-weight:600;
  font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;
  box-shadow:0 5px 0 var(--burgundy-deep);letter-spacing:3px;text-transform:uppercase;
  transition:all .1s;
}
.btn-again:hover{transform:translateY(-2px)}
.btn-next-lvl{
  background:var(--cream-card);color:var(--burgundy);
  border:2px solid var(--olive);font-family:'Cinzel',serif;font-weight:600;
  font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;
  margin-left:10px;transition:all .25s;letter-spacing:2px;text-transform:uppercase;
}
.btn-next-lvl:hover{background:var(--paper-shadow)}

@media(max-width:400px){.card-text{font-size:.62rem}}

.thuraya-guide{
  position:fixed;right:16px;bottom:16px;z-index:300;
  display:flex;align-items:flex-end;gap:12px;font-family:'Cormorant Garamond',serif;max-width:min(92vw,480px);
}
.thuraya-avatar{
  width:90px;height:90px;border-radius:22px;object-fit:cover;object-position:center top;
  border:3px solid var(--gold);box-shadow:0 12px 28px rgba(58,31,14,.18);background:#fff;flex-shrink:0;
}
.thuraya-bubble{
  background:var(--cream-card);color:var(--ink);border-radius:18px 18px 6px 18px;
  padding:14px 16px;box-shadow:0 10px 24px rgba(58,31,14,.1);
  border:1.5px solid var(--olive);min-width:220px;
}
.thuraya-name{font-family:'Cinzel',serif;font-weight:600;font-size:.75rem;letter-spacing:2px;color:var(--burgundy);margin-bottom:6px;text-transform:uppercase}
.thuraya-line-en{font-weight:700;font-size:.95rem;line-height:1.45;margin-bottom:6px}
.thuraya-line-ar{font-family:'Aref Ruqaa',serif;font-size:.88rem;line-height:1.6;direction:rtl;text-align:right;color:var(--olive)}
.thuraya-controls{display:flex;gap:8px;margin-top:10px}
.thuraya-btn{border:1.5px solid var(--olive);border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.76rem;font-family:'Special Elite',monospace;letter-spacing:1px}
.thuraya-btn.primary{background:var(--green-deep);color:var(--cream)}
.thuraya-btn.secondary{background:var(--paper-shadow);color:var(--burgundy)}
@media(max-width:700px){.thuraya-guide{left:12px;right:12px;bottom:12px;max-width:none}.thuraya-avatar{width:72px;height:72px}.thuraya-bubble{padding:12px 14px}}
</style>
<style id="hide-iframe-chrome">.top-bar,.header,.game-header,.back-link,.header-icon,.header-palm{display:none !important;}</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← Home</a>
  <h1>Quffah Match</h1>
  <p>Memory Game — match the pairs with Thuraya! اربط الأزواج مع ثريا!</p>
</div>

<div class="scoreboard">
  <div class="sc-item"><div class="sc-val" id="scMatches" style="color:var(--green-deep)">0</div><div class="sc-lbl">Matches</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scMoves" style="color:var(--burgundy)">0</div><div class="sc-lbl">Moves</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scScore" style="color:var(--gold)">0</div><div class="sc-lbl">Score</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scTime" style="color:var(--olive)">0s</div><div class="sc-lbl">Time</div></div>
</div>

<div class="level-row">
  <button class="lvl-btn l1 active" id="lvl1" onclick="startLevel(1)">🌱 Level 1 — Characters (8 pairs)</button>
  <button class="lvl-btn l2"        id="lvl2" onclick="startLevel(2)">🌴 Level 2 — Vocabulary (8 pairs)</button>
  <button class="lvl-btn l3"        id="lvl3" onclick="startLevel(3)">⭐ Level 3 — Mixed (10 pairs)</button>
</div>

<div class="fb-bar idle" id="fbBar">Flip two cards and find the matching pair! 🌴</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div id="winOverlay">
  <div class="win-card">
    <span class="win-palm">🌴</span>
    <div class="win-title" id="winTitle">All Matched!</div>
    <div class="win-score" id="winScore">0 pts</div>
    <div class="win-msg" id="winMsg"></div>
    <button class="btn-again" onclick="startLevel(currentLevel)">🔄 Play Again</button>
    <button class="btn-next-lvl" id="nextLvlBtn" onclick="goNextLevel()">Next Level →</button>
  </div>
</div>

<script>
const LEVEL_PAIRS={
  1:[
    {id:'thuraya',a:{type:'char',emoji:'👩‍🏫',text:'Thuraya'},b:{type:'desc',emoji:'🌴',text:'One look… the whole class goes silent'}},
    {id:'john',a:{type:'char',emoji:'👨‍🏫',text:'John'},b:{type:'desc',emoji:'🫖',text:'His tea is always cold'}},
    {id:'sophia',a:{type:'char',emoji:'👩',text:'Sophia'},b:{type:'desc',emoji:'🟡',text:'Her face turned bright yellow'}},
    {id:'mansoor',a:{type:'char',emoji:'👦',text:'Mansoor'},b:{type:'desc',emoji:'🌪️',text:'Human storm — runs without reason'}},
    {id:'khamees',a:{type:'char',emoji:'🧑',text:'Khamees'},b:{type:'desc',emoji:'👁️',text:'I can watch. Watching is learning'}},
    {id:'sadoo',a:{type:'char',emoji:'🧑',text:'Sadoo'},b:{type:'desc',emoji:'🛒',text:'Unofficial hero of the village'}},
    {id:'khalaf',a:{type:'char',emoji:'🧔',text:'Shayb Khalaf'},b:{type:'desc',emoji:'🌿',text:'He knows what others don\'t'}},
    {id:'malood',a:{type:'char',emoji:'🐐',text:'Malood'},b:{type:'desc',emoji:'📄',text:'Eats papers like inspection reports'}},
  ],
  2:[
    {id:'falaj',a:{type:'word',emoji:'💧',text:'falaj'},b:{type:'def',emoji:'🌊',text:'A traditional water channel'}},
    {id:'trust',a:{type:'word',emoji:'🤝',text:'trust'},b:{type:'def',emoji:'💛',text:'Believing someone is good'}},
    {id:'brave',a:{type:'word',emoji:'🦁',text:'brave'},b:{type:'def',emoji:'💪',text:'Not afraid of danger'}},
    {id:'heritage',a:{type:'word',emoji:'🏺',text:'heritage'},b:{type:'def',emoji:'📜',text:'Culture passed down through generations'}},
    {id:'patient',a:{type:'word',emoji:'⏳',text:'patient'},b:{type:'def',emoji:'😌',text:'Waiting calmly without complaining'}},
    {id:'wisdom',a:{type:'word',emoji:'🦉',text:'wisdom'},b:{type:'def',emoji:'💎',text:'Deep understanding and knowledge'}},
    {id:'harvest',a:{type:'word',emoji:'🌾',text:'harvest'},b:{type:'def',emoji:'🌴',text:'To collect crops from the farm'}},
    {id:'relief',a:{type:'word',emoji:'😮‍💨',text:'relief'},b:{type:'def',emoji:'✅',text:'Good feeling when danger passes'}},
  ],
  3:[
    {id:'nasser',a:{type:'char',emoji:'🚐',text:'Nasser'},b:{type:'desc',emoji:'🛣️',text:'Drives even when the road disappears'}},
    {id:'marhoona',a:{type:'char',emoji:'👵',text:'Marhoona'},b:{type:'desc',emoji:'💄',text:'Her salon has no sign outside'}},
    {id:'khalil',a:{type:'char',emoji:'😄',text:'Khalil'},b:{type:'desc',emoji:'🎤',text:'Laughs at jokes that haven\'t started yet'}},
    {id:'marhoon',a:{type:'char',emoji:'🌱',text:'Marhoon'},b:{type:'desc',emoji:'👔',text:'Man in overalls — lives for farming'}},
    {id:'wasp',a:{type:'word',emoji:'🐝',text:'wasp'},b:{type:'def',emoji:'😬',text:'A flying insect that stings'}},
    {id:'curious',a:{type:'word',emoji:'🤔',text:'curious'},b:{type:'def',emoji:'❓',text:'Wanting to know and learn more'}},
    {id:'ancestor',a:{type:'word',emoji:'👴',text:'ancestor'},b:{type:'def',emoji:'🌳',text:'A family member from the past'}},
    {id:'identity',a:{type:'word',emoji:'🪪',text:'identity'},b:{type:'def',emoji:'🔍',text:'Who you are — your name and story'}},
    {id:'narrow',a:{type:'word',emoji:'↔️',text:'narrow'},b:{type:'def',emoji:'🛤️',text:'Not wide — a small path or space'}},
    {id:'inspire',a:{type:'word',emoji:'💫',text:'inspire'},b:{type:'def',emoji:'🌟',text:'To make someone want to try harder'}},
  ],
};

let currentLevel=1,flipped=[],matched=0,moves=0,score=0,locked=false,timerSec=0,timerID=null,totalPairs=0;
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}

function startLevel(lvl){
  currentLevel=lvl;
  [1,2,3].forEach(i=>document.getElementById('lvl'+i).classList.toggle('active',i===lvl));
  flipped=[];matched=0;moves=0;score=0;locked=false;
  clearInterval(timerID);timerSec=0;
  const pairs=LEVEL_PAIRS[lvl];totalPairs=pairs.length;
  let deck=[];
  pairs.forEach(p=>{deck.push({id:p.id,side:'a',...p.a});deck.push({id:p.id,side:'b',...p.b});});
  deck=shuffle(deck);
  renderGrid(deck,lvl);
  updateScoreboard();
  setFb('idle','Flip two cards and find the matching pair! 🌴');
  timerID=setInterval(()=>{timerSec++;document.getElementById('scTime').textContent=timerSec+'s';},1000);
}

function renderGrid(deck,lvl){
  const grid=document.getElementById('grid');
  const cols=deck.length<=16?4:5;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.maxWidth=(cols*90+(cols-1)*10)+'px';
  grid.style.margin='0 auto';
  grid.innerHTML='';
  deck.forEach((card,idx)=>{
    const div=document.createElement('div');div.className='card';div.dataset.id=card.id;div.dataset.idx=idx;
    div.innerHTML=`<div class="card-inner"><div class="card-back"></div><div class="card-front ${card.type}"><span class="card-emoji">${card.emoji}</span><span class="card-text">${card.text}</span></div></div>`;
    div.addEventListener('click',()=>flipCard(div));
    grid.appendChild(div);
  });
}

function flipCard(card){
  if(locked||card.classList.contains('flipped')||card.classList.contains('matched')||flipped.length>=2)return;
  card.classList.add('flipped');flipped.push(card);
  if(flipped.length===2){moves++;updateScoreboard();locked=true;setTimeout(checkMatch,900);}
}

function checkMatch(){
  const[a,b]=flipped;
  if(a.dataset.id===b.dataset.id){
    a.classList.add('matched');b.classList.add('matched');matched++;
    const pts=Math.max(5,20-Math.floor(timerSec/10));score+=pts;
    setFb('ok',`✅ Match! +${pts} pts 🌴`);updateScoreboard();
    if(matched===totalPairs)setTimeout(showWin,600);
  }else{
    a.classList.add('wrong');b.classList.add('wrong');
    setFb('no','❌ Not a match! Try again.');
    setTimeout(()=>{a.classList.remove('flipped','wrong');b.classList.remove('flipped','wrong');setFb('idle','Keep going! اكمل! 🌴');},900);
  }
  flipped=[];locked=false;
}

function showWin(){
  clearInterval(timerID);
  const timeBonus=Math.max(0,60-timerSec)*2;
  const moveBonus=Math.max(0,(totalPairs*3)-moves)*5;
  const finalScore=score+timeBonus+moveBonus;
  document.getElementById('winScore').textContent=finalScore+' pts';
  const titles={1:'Characters Mastered! 🎉',2:'Vocabulary Expert! 📚',3:'Palm Tree Champion! 🏆'};
  document.getElementById('winTitle').textContent=titles[currentLevel]||'All Matched!';
  const msg=finalScore>=300?'🌟 Outstanding!':finalScore>=200?'🌴 Excellent!':finalScore>=100?'✦ Good job!':'💪 Well done!';
  document.getElementById('winMsg').innerHTML=`${msg}<br><span style="font-size:.85rem;color:var(--olive)">Time: ${timerSec}s | Moves: ${moves} | Bonus: +${timeBonus+moveBonus}</span>`;
  document.getElementById('nextLvlBtn').style.display=currentLevel<3?'inline-block':'none';
  document.getElementById('winOverlay').classList.add('show');
}

function goNextLevel(){document.getElementById('winOverlay').classList.remove('show');startLevel(currentLevel+1);}
function setFb(cls,msg){const bar=document.getElementById('fbBar');bar.className='fb-bar '+cls;bar.textContent=msg;}
function updateScoreboard(){document.getElementById('scMatches').textContent=matched+'/'+totalPairs;document.getElementById('scMoves').textContent=moves;document.getElementById('scScore').textContent=score;}
window.addEventListener('load',()=>startLevel(1));
</script>

<div class="thuraya-guide" id="thurayaGuide" aria-live="polite">
  <img class="thuraya-avatar" src="thuraya-reference.png" alt="Thuraya guide"/>
  <div class="thuraya-bubble">
    <div class="thuraya-name">Thuraya Guide | ثريا</div>
    <div class="thuraya-line-en" id="thurayaEn">Welcome! Flip two cards and find the matching pair.</div>
    <div class="thuraya-line-ar" id="thurayaAr">مرحباً! اقلبي بطاقتين واربطي الزوج.</div>
    <div class="thuraya-controls">
      <button class="thuraya-btn primary" id="thurayaSpeakBtn">🔊</button>
      <button class="thuraya-btn secondary" id="thurayaMinBtn">—</button>
    </div>
  </div>
</div>

<script>
(function(){
  let muted=false;
  function speak(en,ar){
    const enEl=document.getElementById('thurayaEn');
    const arEl=document.getElementById('thurayaAr');
    if(enEl)enEl.textContent=en;if(arEl)arEl.textContent=ar;
    if(muted||!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=1;
    window.speechSynthesis.speak(u);
    setTimeout(()=>{const a=new SpeechSynthesisUtterance(ar);a.lang='ar-SA';a.rate=1;window.speechSynthesis.speak(a);},800);
  }
  document.getElementById('thurayaSpeakBtn').onclick=()=>{speak(document.getElementById('thurayaEn').textContent,document.getElementById('thurayaAr').textContent);};
  document.getElementById('thurayaMinBtn').onclick=()=>{document.getElementById('thurayaGuide').classList.toggle('min');};
  const of=window.flipCard;if(of)window.flipCard=function(c){const r=of.apply(this,arguments);setTimeout(()=>{const fb=document.getElementById('fbBar');if(!fb)return;if(fb.classList.contains('ok'))speak('Excellent match!','ممتاز! وجدتِ الزوج!');else if(fb.classList.contains('no'))speak('Not a match. Try again.','ليست مطابقة. حاولي مرة أخرى.');},120);return r;};
  const ow=window.showWin;if(ow)window.showWin=function(){const r=ow.apply(this,arguments);speak('You finished all matches!','أنهيتِ جميع الأزواج!');return r;};
  window.addEventListener('load',()=>setTimeout(()=>speak('Welcome! Flip two cards and find the matching pair.','مرحباً! اقلبي بطاقتين واربطي الزوج.'),400));
})();
</script>

<script id="palm-tree-tracker">(function(){var slug="quffah-match",kind="game";var t0=Date.now();function post(a,e){try{var m={source:"palm-tree-activity",activity:slug,kind:kind,title:document.title||slug,action:a};if(e)Object.assign(m,e);window.parent.postMessage(m,"*");}catch(e){}}post("opened");window.addEventListener("beforeunload",function(){post("closed",{timeSpentMs:Date.now()-t0});});})();</script>
