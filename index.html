<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cinzel',serif;
height:100vh;
}

/ الخلفية /

.scene{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:url("cover.jpeg");
background-position:center;
background-repeat:no-repeat;
background-size:contain;

background-color:#efe6d7;

}

/ المحتوى /

.content{
text-align:center;
animation:fade 1.2s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/ العنوان /

.title{

font-size:38px;
margin-bottom:10px;

}

.subtitle{

font-size:15px;
margin-bottom:30px;

}

/ شبكة النخيل /

.palms{

display:grid;
grid-template-columns:repeat(3,140px);
gap:40px;

justify-content:center;

}

/ زر النخلة /

.palm{

font-size:55px;
cursor:pointer;
position:relative;
transition:.3s;
filter:brightness(0);

}

/ التكبير /

.palm:hover{

transform:scale(1.2);

}

/ اللمعة /

.palm:after{

content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.4);
border-radius:50%;

opacity:0;
transition:.3s;

}

.palm:hover:after{

opacity:1;

}

/ نصف الدائرة */

.label{

position:absolute;
left:-35px;
top:60px;

background:white;

padding:5px 15px;

border-radius:40px;

font-size:12px;

white-space:nowrap;

box-shadow:0 6px 15px rgba(0,0,0,.2);

}

</style>

</head>
