<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Novel · Chapters | Under The Palm Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f5f0e8;--cream2:#efe7d8;--gold:#b8963e;--gold2:#d4b06a;
    --brown:#3d2b1f;--brown-dark:#3d1a0a;--brown-mid:#6b4c38;--burg:#7a2e2e;
    --line:#c8b89a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--brown);font-family:'Cormorant Garamond',serif;min-height:100vh;padding:40px 20px 70px}
  .wrap{max-width:1200px;margin:0 auto}
  header{text-align:center;margin-bottom:42px}
  .eyebrow{font-family:'Cinzel',serif;letter-spacing:.28em;font-size:11px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  h1{font-family:'Cinzel',serif;font-size:34px;font-weight:600;color:var(--brown-dark);letter-spacing:.06em;margin-bottom:6px}
  .tag{font-style:italic;font-size:17px;color:var(--brown-mid)}
  .line{width:80px;height:2px;background:var(--line);margin:18px auto 0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;margin-top:30px}
  a.card{display:flex;flex-direction:column;text-decoration:none;background:linear-gradient(180deg,#faf6ee,#f0e8d8);border:1px solid rgba(184,150,62,.35);border-radius:18px;overflow:hidden;color:var(--brown);box-shadow:0 6px 18px -10px rgba(61,43,31,.18);transition:transform .18s,box-shadow .18s,border-color .18s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px -16px rgba(61,43,31,.35);border-color:var(--gold)}
  .thumb{aspect-ratio:16/9;background:#3d2b1f;overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:16px 18px 18px}
  .palm{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
  .title{font-family:'Aref Ruqaa',serif;font-size:17px;font-weight:700;color:var(--brown-dark);line-height:1.35;margin-bottom:6px}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px;color:var(--brown-mid);line-height:1.45}
  .read{margin-top:10px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}

  footer{text-align:center;margin-top:50px;font-style:italic;color:var(--brown-mid);font-size:14px}
  @media(max-width:520px){h1{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
<script src="public/js/palm-globe-fab.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Learn Under The Palm Tree</div>
    <h1>The Novel</h1>
    <p class="tag">Thirty-six palms — a story told chapter by chapter</p>
    <div class="line"></div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>🌴 Under The Palm Tree — Thuraya Mohammed bin Ali Al Naabi</footer>
</div>

<script>
var ORD=["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
"Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen",
"Nineteen","Twenty","Twenty-One","Twenty-Two","Twenty-Three","Twenty-Four",
"Twenty-Five","Twenty-Six","Twenty-Seven","Twenty-Eight","Twenty-Nine","Thirty",
"Thirty-One","Thirty-Two","Thirty-Three","Thirty-Four","Thirty-Five","Thirty-Six"];
var SUB=[
"Thuraya's Book of Thoughts","The First Walk in the Village","The First Day at School",
"The Morning Departure to the Souq","The Souq, the Children, and the First Pickup",
"A Fan, A Bird, and a Lesson on Tongues","The Three Letters of John","A Goat Named Malood",
"The Smoke and the Sahir","Smoke, Truck, and an Englishman Speaking Arabic",
"Maghsoob — And the Boy Who Watches","A Ring, a Goat, and an Apology",
"The Yellow Mask Disaster","Sadou Climbs the Palm","When Marhoon Lifted His Hand",
"The Sheikh's House and the Mandoos","Spicy Food and Saeed's First English Sentences",
"Mountains, Sea, and the Magic Box of Muttrah","The Zanzibari Trader and the Saffron Mask",
"Of Goats and Grammar","Tofes 17 — The Day Sky Almost Fell on Samail",
"The Sky Falls on Samail — A Village in Rain","Tawi Zahir — The Pools, the Picnic, and the Mountain Cousin",
"The Camera, the Tools, and the Fastest Goat in Samail","The Day Nobody Spoke Arabic",
"The Detective Game and the Missing Treasure","Convincing Sadou",
"We Must and We Mustn't — The Confession Lesson","We Should and We Shouldn't — And the Grasshopper Wing",
"Good Manners, Black Cats, and a Very Full Stomach","I Am Afraid Of — And Thuraya's Secret",
"The Only Thing Shayb Khalaf Was Afraid Of","A Son from Bahrain — The Truth Behind the Story",
"Then and Now — A Trip to Jibreen Castle","The Month When Everything Changed — Ramadan in Samail",
"The Day the Palm Tree Witnessed Everything — Samail, 1976 → 2026"];
var g=document.getElementById('grid');
for(var i=0;i<36;i++){
  var n=String(i+1).padStart(2,'0');
  var a=document.createElement('a');
  a.className='card';
  a.href='./Palm_Tree_ENGLISH-TTS.html';
  a.innerHTML=
    '<div class="thumb"><img src="/public/story-scenes/chapter-'+n+'-1.jpg" alt="Palm '+ORD[i]+' scene" onerror="this.style.display=\'none\'"></div>'+
    '<div class="body">'+
      '<div class="palm">Palm '+ORD[i]+'</div>'+
      '<div class="title">'+SUB[i]+'</div>'+
      '<div class="read">Read →</div>'+
    '</div>';
  g.appendChild(a);
}
</script>
</body>
</html>
