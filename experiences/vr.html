<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Palm Tree - جولة VR في القرية</title>
<style>
:root{ --sand:#F5EDD8; --linen:#EDE0C4; --clay:#C9AA80; --earth:#8C6A3F; --soil:#4A3520; --burgundy:#360304; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Almarai','Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
body { background:var(--soil); color:var(--sand); overflow:hidden; }
#info { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:10; text-align:center; background:rgba(74,53,32,0.85); border:1px solid rgba(201,170,128,0.4); padding:10px 20px; border-radius:12px; }
#info h1 { font-size:16px; color:var(--sand); }
#info p { font-size:12px; color:var(--clay); }
#vr-btn { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:10; background:var(--burgundy); border:1.5px solid var(--burgundy); color:var(--sand); padding:12px 30px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
#vr-btn:disabled { opacity:0.5; cursor:not-allowed; }
#exit-vr { position:absolute; top:20px; right:20px; z-index:20; background:var(--burgundy); color:var(--sand); border:none; padding:8px 16px; border-radius:8px; font-size:12px; cursor:pointer; display:none; }
#loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:18px; color:var(--sand); }
#move-pad { position:absolute; bottom:24px; left:24px; z-index:10; display:grid; grid-template-columns:46px 46px 46px; grid-template-rows:46px 46px; gap:5px; }
.mv-btn { width:46px; height:46px; border-radius:12px; border:1px solid rgba(201,170,128,0.4); background:rgba(74,53,32,0.75); color:var(--sand); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:none; }
.mv-btn:active, .mv-btn.pressed { background:var(--burgundy); }
#mv-up { grid-column:2; grid-row:1; }
#mv-left { grid-column:1; grid-row:2; }
#mv-down { grid-column:2; grid-row:2; }
#mv-right { grid-column:3; grid-row:2; }
#look-hint { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:10; font-size:11px; color:var(--clay); background:rgba(74,53,32,0.65); padding:6px 14px; border-radius:10px; pointer-events:none; transition:opacity 1s; }
</style>
<link rel="icon" type="image/png" href="../public/favicon.png">
<link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
</head>
<body>

<div id="loading">⏳ جاري تحميل جولة VR...</div>

<div id="info">
    <h1>🥽 جولة افتراضية في قرية النخلة</h1>
    <p>اسحبي الشاشة للنظر حولك | استخدمي الأسهم للمشي | اضغطي VR للدخول للواقع الافتراضي</p>
</div>

<button id="vr-btn" disabled>🥽 دخول VR</button>
<button id="exit-vr">❌ خروج</button>

<div id="look-hint">👆 اسحبي بإصبعك للنظر حولك</div>

<div id="move-pad">
    <button class="mv-btn" id="mv-up">▲</button>
    <button class="mv-btn" id="mv-left">◀</button>
    <button class="mv-btn" id="mv-down">▼</button>
    <button class="mv-btn" id="mv-right">▶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== VR VILLAGE TOUR ====================
let scene, camera, renderer, vrSession = null;
let isVR = false;
let villageObjects = [];

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xBFE3F5);
    scene.fog = new THREE.Fog(0xBFE3F5, 18, 48);

    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 5); // Eye height

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemi = new THREE.HemisphereLight(0xBFE3F5, 0xE6C288, 0.65);
    scene.add(hemi);
    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffd9a8, 0.9);
    sun.position.set(10, 20, 10);
    scene.add(sun);

    // Build VR Village
    buildVRVillage();

    // VR Button
    const vrBtn = document.getElementById('vr-btn');
    if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
            if (supported) {
                vrBtn.disabled = false;
                vrBtn.addEventListener('click', enterVR);
            } else {
                vrBtn.textContent = '❌ المتصفح لا يدعم VR';
            }
        }).catch(() => {
            vrBtn.textContent = '📱 استخدم جوال VR';
            vrBtn.disabled = false;
            vrBtn.addEventListener('click', () => {
                alert('لتجربة VR:\n1. استخدم جوال يدعم WebXR\n2. افتح في Chrome/Safari\n3. استخدم Google Cardboard أو Oculus');
            });
        });
    } else {
        vrBtn.textContent = '❌ WebXR غير مدعوم';
    }

    document.getElementById('exit-vr').addEventListener('click', exitVR);
    document.getElementById('loading').style.display = 'none';

    setupLookControls();
    setupMoveControls();
    animate();
}

// ==================== LOOK CONTROLS (drag to look, mouse or touch) ====================
let yaw = 0, pitch = 0;
function setupLookControls() {
    const el = renderer.domElement;
    let dragging = false, lastX = 0, lastY = 0;
    const hint = document.getElementById('look-hint');

    function start(x, y) { dragging = true; lastX = x; lastY = y; }
    function move(x, y) {
        if (!dragging || isVR) return;
        yaw -= (x - lastX) * 0.005;
        pitch -= (y - lastY) * 0.005;
        pitch = Math.max(-1.1, Math.min(1.1, pitch));
        lastX = x; lastY = y;
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
        if (hint) { hint.style.opacity = '0'; }
    }
    function end() { dragging = false; }

    el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
    el.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
    window.addEventListener('mouseup', end);

    el.addEventListener('touchstart', (e) => { if (e.touches[0]) start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    el.addEventListener('touchmove', (e) => { if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    el.addEventListener('touchend', end);
}

// ==================== MOVEMENT CONTROLS (WASD + on-screen D-pad) ====================
const moveState = { forward:false, back:false, left:false, right:false };
const MOVE_SPEED = 4.5; // units per second
const VILLAGE_RADIUS = 22; // keep the walker inside the built village

function setupMoveControls() {
    const bind = (id, key) => {
        const btn = document.getElementById(id);
        const press = (e) => { e.preventDefault(); moveState[key] = true; btn.classList.add('pressed'); };
        const release = () => { moveState[key] = false; btn.classList.remove('pressed'); };
        btn.addEventListener('touchstart', press, {passive:false});
        btn.addEventListener('touchend', release);
        btn.addEventListener('touchcancel', release);
        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    };
    bind('mv-up', 'forward');
    bind('mv-down', 'back');
    bind('mv-left', 'left');
    bind('mv-right', 'right');

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') moveState.forward = true;
        if (e.key === 's' || e.key === 'ArrowDown') moveState.back = true;
        if (e.key === 'a' || e.key === 'ArrowLeft') moveState.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') moveState.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') moveState.forward = false;
        if (e.key === 's' || e.key === 'ArrowDown') moveState.back = false;
        if (e.key === 'a' || e.key === 'ArrowLeft') moveState.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') moveState.right = false;
    });
}

function applyMovement(dt) {
    if (isVR) return;
    if (!moveState.forward && !moveState.back && !moveState.left && !moveState.right) return;
    const dist = MOVE_SPEED * dt;
    const fwdX = -Math.sin(yaw), fwdZ = -Math.cos(yaw);
    const rightX = Math.cos(yaw), rightZ = -Math.sin(yaw);
    let dx = 0, dz = 0;
    if (moveState.forward) { dx += fwdX; dz += fwdZ; }
    if (moveState.back) { dx -= fwdX; dz -= fwdZ; }
    if (moveState.right) { dx += rightX; dz += rightZ; }
    if (moveState.left) { dx -= rightX; dz -= rightZ; }
    const len = Math.hypot(dx, dz);
    if (len > 0) {
        camera.position.x += (dx / len) * dist;
        camera.position.z += (dz / len) * dist;
        const r = Math.hypot(camera.position.x, camera.position.z);
        if (r > VILLAGE_RADIUS) {
            camera.position.x = camera.position.x / r * VILLAGE_RADIUS;
            camera.position.z = camera.position.z / r * VILLAGE_RADIUS;
        }
    }
}

function makeSandTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#E6C288';
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 900; i++) {
        const x = Math.random() * 256, y = Math.random() * 256;
        const shade = Math.random() > 0.5 ? 'rgba(139,105,20,0.10)' : 'rgba(255,240,210,0.18)';
        ctx.fillStyle = shade;
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 1.6 + 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10, 10);
    return tex;
}

function buildVRVillage() {
    // Ground
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshLambertMaterial({ map: makeSandTexture() })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Houses (Omani style)
    const houseColors = [0xB85450, 0x8B6914, 0x7a6f5b, 0xB85450];
    const positions = [
        [-4, 0, -4], [4, 0, -3], [-3, 0, 4], [5, 0, 5], [-6, 0, 1], [3, 0, -7]
    ];

    positions.forEach((pos, i) => {
        const house = new THREE.Group();
        // Walls
        const walls = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            new THREE.MeshLambertMaterial({ color: houseColors[i % houseColors.length] })
        );
        walls.position.y = 1;
        house.add(walls);
        // Roof
        const roof = new THREE.Mesh(
            new THREE.BoxGeometry(2.4, 0.3, 2.4),
            new THREE.MeshLambertMaterial({ color: 0x8B4513 })
        );
        roof.position.y = 2.15;
        house.add(roof);
        // Door
        const door = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 1.2, 0.1),
            new THREE.MeshLambertMaterial({ color: 0x5c3a1e })
        );
        door.position.set(0, 0.6, 1.05);
        house.add(door);
        // Windows
        [-0.65, 0.65].forEach(wx => {
            const win = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.4, 0.08),
                new THREE.MeshLambertMaterial({ color: 0x2f4f5f })
            );
            win.position.set(wx, 1.3, 1.05);
            house.add(win);
        });

        house.position.set(pos[0], pos[1], pos[2]);
        scene.add(house);
        villageObjects.push(house);
    });

    // Mosque
    const mosque = new THREE.Group();
    const mosqueBody = new THREE.Mesh(
        new THREE.BoxGeometry(3, 2.5, 3),
        new THREE.MeshLambertMaterial({ color: 0xF5F5DC })
    );
    mosqueBody.position.y = 1.25;
    mosque.add(mosqueBody);
    // Dome
    const dome = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 16),
        new THREE.MeshLambertMaterial({ color: 0xF5F5DC })
    );
    dome.position.y = 3;
    mosque.add(dome);
    // Minaret
    const minaret = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.3, 5, 8),
        new THREE.MeshLambertMaterial({ color: 0xF5F5DC })
    );
    minaret.position.set(2.5, 2.5, 0);
    mosque.add(minaret);
    mosque.position.set(0, 0, -8);
    scene.add(mosque);

    // Palm Trees
    for (let i = 0; i < 16; i++) {
        const tree = new THREE.Group();
        const lean = (Math.random() - 0.5) * 0.15;
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14, 0.22, 3, 8),
            new THREE.MeshLambertMaterial({ color: 0x9c7a3c })
        );
        trunk.position.y = 1.5;
        trunk.rotation.z = lean;
        tree.add(trunk);
        // Fronds (droopy fan shape)
        for (let j = 0; j < 8; j++) {
            const frond = new THREE.Mesh(
                new THREE.ConeGeometry(0.16, 1.4, 4),
                new THREE.MeshLambertMaterial({ color: 0x3f7a2e })
            );
            const ang = (j / 8) * Math.PI * 2;
            frond.position.set(Math.sin(ang) * 0.35, 3.05, Math.cos(ang) * 0.35);
            frond.rotation.x = Math.PI / 2 - 0.55;
            frond.rotation.y = ang;
            tree.add(frond);
        }
        // Coconuts
        for (let k = 0; k < 3; k++) {
            const coconut = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 8, 8),
                new THREE.MeshLambertMaterial({ color: 0x5c3a1e })
            );
            coconut.position.set((Math.random()-0.5)*0.3, 2.85, (Math.random()-0.5)*0.3);
            tree.add(coconut);
        }
        const angle = (i / 16) * Math.PI * 2;
        const radius = 8 + (i % 3);
        tree.position.set(Math.sin(angle) * radius, 0, Math.cos(angle) * radius);
        scene.add(tree);
    }

    // Well
    const well = new THREE.Group();
    const wellRing = new THREE.Mesh(
        new THREE.TorusGeometry(1, 0.2, 8, 16),
        new THREE.MeshLambertMaterial({ color: 0x7a6f5b })
    );
    wellRing.rotation.x = -Math.PI / 2;
    wellRing.position.y = 0.2;
    well.add(wellRing);
    const water = new THREE.Mesh(
        new THREE.CircleGeometry(0.8, 16),
        new THREE.MeshLambertMaterial({ color: 0x4A90E2 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0.1;
    well.add(water);
    well.position.set(0, 0, 2);
    scene.add(well);

    // NPCs (the novel's 4 main characters: Thuraya, John, Sophia, Malood)
    const npcColors = [0xB85450, 0x4169E1, 0xFF69B4, 0x228B22];
    const npcNames = ['ثريا', 'جون', 'صوفيا', 'ملود'];
    npcColors.forEach((color, i) => {
        const npc = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.22, 0.28, 0.85, 10),
            new THREE.MeshLambertMaterial({ color: color })
        );
        body.position.y = 0.45;
        npc.add(body);
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.16, 10, 10),
            new THREE.MeshLambertMaterial({ color: 0xf0c9a0 })
        );
        head.position.y = 1.0;
        npc.add(head);
        npc.position.set(-2 + i * 1.5, 0, 0);
        scene.add(npc);
    });

    // Info points
    const infoPoints = [
        { pos: [0, 2, -8], text: 'مسجد القرية' },
        { pos: [0, 1, 2], text: 'بئر النخلة' },
        { pos: [-4, 2, -4], text: 'بيت صوفيا' },
        { pos: [4, 2, -3], text: 'بيت جون' }
    ];
}

async function enterVR() {
    if (!navigator.xr) return;
    try {
        const session = await navigator.xr.requestSession('immersive-vr', {
            requiredFeatures: ['local-floor']
        });
        vrSession = session;
        isVR = true;
        renderer.xr.setSession(session);
        document.getElementById('vr-btn').style.display = 'none';
        document.getElementById('exit-vr').style.display = 'block';
        document.getElementById('info').style.display = 'none';

        session.addEventListener('end', () => {
            isVR = false;
            vrSession = null;
            document.getElementById('vr-btn').style.display = 'block';
            document.getElementById('exit-vr').style.display = 'none';
            document.getElementById('info').style.display = 'block';
        });
    } catch (e) {
        alert('⚠️ لا يوجد جهاز VR متصل.\nلتجربة VR استخدم:\n• Google Cardboard\n• Oculus Quest\n• Samsung Gear VR');
    }
}

function exitVR() {
    if (vrSession) {
        vrSession.end();
    }
}

function animate() {
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        applyMovement(dt);
        renderer.render(scene, camera);
    });
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>

</body>
</html>
