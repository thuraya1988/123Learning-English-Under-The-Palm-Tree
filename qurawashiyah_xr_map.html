<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Walk Al-Qurawashiyah — جولة القرواشية</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0800;font-family:'Cormorant Garamond',serif;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.walk-header{position:fixed;top:0;left:0;right:0;z-index:50;padding:14px 24px;background:linear-gradient(to bottom,rgba(13,8,0,0.95),transparent);display:flex;align-items:center;justify-content:space-between;}
.walk-title{font-family:'Cinzel',serif;font-size:clamp(0.85rem,2.5vw,1.1rem);color:#f5c97a;letter-spacing:0.08em;}
.walk-subtitle{font-size:0.72rem;color:rgba(245,201,122,0.55);font-style:italic;margin-top:2px;}
.back-btn{font-family:'Cinzel',serif;font-size:0.75rem;color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:7px 16px;cursor:pointer;text-decoration:none;transition:all 0.2s;}
.back-btn:hover{color:#f5c97a;border-color:rgba(245,201,122,0.4);}
.progress-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center;}
.pdot{width:8px;height:8px;border-radius:50%;background:rgba(245,201,122,0.3);border:1px solid rgba(245,201,122,0.4);transition:all 0.4s;cursor:pointer;}
.pdot.active{background:#f5c97a;transform:scale(1.4);box-shadow:0 0 10px rgba(245,201,122,0.5);}
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:48px;height:48px;border-radius:50%;background:rgba(13,8,0,0.7);border:1.5px solid rgba(245,201,122,0.3);color:#f5c97a;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;backdrop-filter:blur(6px);user-select:none;}
.nav-arrow:hover{background:rgba(245,201,122,0.15);border-color:#f5c97a;transform:translateY(-50%) scale(1.1);}
.nav-arrow.left{left:16px;}
.nav-arrow.right{right:16px;}
.nav-arrow.hidden{opacity:0;pointer-events:none;}
#track{display:flex;width:100vw;height:100vh;overflow:hidden;position:relative;}
#track-inner{display:flex;height:100%;transition:transform 0.75s cubic-bezier(0.77,0,0.175,1);will-change:transform;}
.station{flex-shrink:0;width:100vw;height:100vh;position:relative;overflow:hidden;}
.station-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 8s ease-in-out;transform:scale(1.04);}
.station.active .station-bg{transform:scale(1.0);}
.station::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(13,8,0,0.88) 0%,rgba(13,8,0,0.3) 45%,rgba(13,8,0,0.1) 100%);pointer-events:none;}
.station-content{position:absolute;bottom:70px;left:0;right:0;z-index:10;padding:0 clamp(20px,6vw,80px);display:flex;flex-direction:column;align-items:flex-start;max-width:680px;}
.station-number{font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.25em;color:rgba(245,201,122,0.55);text-transform:uppercase;margin-bottom:8px;}
.station-name{font-family:'Cinzel',serif;font-size:clamp(1.4rem,4vw,2.4rem);color:#f5c97a;line-height:1.2;margin-bottom:6px;text-shadow:0 2px 20px rgba(0,0,0,0.8);}
.station-name-ar{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,2.5vw,1.4rem);color:rgba(245,201,122,0.7);font-style:italic;margin-bottom:16px;direction:rtl;}
.station-desc{font-size:clamp(0.82rem,1.8vw,0.96rem);line-height:1.75;color:rgba(255,255,255,0.82);max-width:520px;margin-bottom:10px;}
.station-desc-ar{font-size:clamp(0.85rem,1.8vw,0.98rem);line-height:1.8;color:rgba(255,255,255,0.65);direction:rtl;text-align:right;width:100%;font-style:italic;}
.water-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(245,201,122,0.1);border:1px solid rgba(245,201,122,0.25);border-radius:20px;padding:4px 14px;font-size:0.72rem;color:#f5c97a;font-family:'Cinzel',serif;letter-spacing:0.06em;margin-bottom:14px;}
.ripple{animation:ripple 2s ease-in-out infinite;display:inline-block;}
@keyframes ripple{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.swipe-hint{position:fixed;bottom:52px;right:20px;z-index:50;font-size:0.68rem;color:rgba(255,255,255,0.35);font-style:italic;animation:fadeHint 4s ease forwards;}
@keyframes fadeHint{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.station-content{animation:none;}
.station.active .station-content{animation:slideUp 0.8s 0.3s cubic-bezier(0.22,1,0.36,1) both;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
<script src="public/js/palm-globe-fab.js" defer></script>
