<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Under the Palm Tree — Spelling Skill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ovo&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
.sqs-block-code * { all: revert; }

:root {
  --sand: #F5EDD8;
  --linen: #EDE0C4;
  --clay: #C9AA80;
  --earth: #8C6A3F;
  --soil: #4A3520;
  --burgundy: #360304;
  --line: rgba(74,53,32,0.12);
  --success: #5a8a3a;
  --error: #a04020;
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--sand) !important;
  color: var(--soil);
  font-family: 'Almarai', sans-serif;
  font-weight: 400;
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  touch-action: manipulation;
}

body {
  background-image:
    radial-gradient(circle at 20% 30%, rgba(140,106,63,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(54,3,4,0.03) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-color: var(--sand) !important;
}

.container { max-width: 700px; margin: 0 auto; padding: 80px 24px 60px; position: relative; z-index: 1; }

/* ─── Floating Nav ─── */
.nav-float {
  position: fixed; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100; pointer-events: none;
}
.nav-float > * { pointer-events: auto; }

.nav-btn {
  width: 44px; height: 44px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: linear-gradient(160deg, var(--sand), var(--linen));
  color: var(--soil);
  font-size: 18px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px -4px rgba(74,53,32,0.2);
  transition: all 0.2s ease;
  transform: perspective(600px) translateZ(0);
  font-family: 'Almarai', sans-serif;
}
.nav-btn:hover {
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 8px 20px -6px rgba(74,53,32,0.3);
  border-color: var(--clay);
}
.nav-btn:active { transform: translateY(1px); box-shadow: 0 2px 6px -2px rgba(74,53,32,0.2); }

/* ─── Screens ─── */
.screen { display: none; }
.screen.active { display: block; }

/* ─── fadeUp3D ─── */
@keyframes fadeUp3D {
  from { opacity: 0; transform: perspective(800px) rotateX(8deg) translateY(24px); }
  to   { opacity: 1; transform: perspective(800px) rotateX(0) translateY(0); }
}
.au { opacity: 0; animation: fadeUp3D 0.5s ease forwards; }
.au.d1 { animation-delay: 0.06s; }
.au.d2 { animation-delay: 0.12s; }
.au.d3 { animation-delay: 0.18s; }
.au.d4 { animation-delay: 0.24s; }
.au.d5 { animation-delay: 0.30s; }
.au.d6 { animation-delay: 0.36s; }
.au.d7 { animation-delay: 0.42s; }

/* ─── Typography ─── */
h1, h2, h3, .heading { font-family: 'Ovo', serif; font-weight: 400; color: var(--burgundy); }
.sub { color: var(--earth); font-style: italic; font-weight: 300; }

/* ─── Page Header ─── */
.page-header { text-align: center; padding: 20px 20px 30px; }
.skill-tag {
  display: inline-block;
  background: var(--soil); color: var(--sand);
  padding: 6px 18px; border-radius: 20px;
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 14px;
}
.page-title {
  font-family: 'Ovo', serif; font-weight: 400;
  font-size: clamp(36px,6vw,52px);
  color: var(--burgundy);
  letter-spacing: 1px; margin-bottom: 8px;
}
.page-subtitle { font-style: italic; color: var(--earth); font-size: 15px; margin-bottom: 16px; font-weight: 300; }
.divider-ornament {
  display: flex; align-items: center; justify-content: center;
  gap: 14px; margin: 16px 0; color: var(--clay);
}
.divider-ornament::before, .divider-ornament::after {
  content: ""; height: 2px;
  background: linear-gradient(90deg, transparent, var(--clay), transparent);
  width: 60px;
}
.divider-ornament span { font-size: 18px; }

/* ─── Progress Strip ─── */
.progress-strip {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 18px 24px; margin-bottom: 28px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  box-shadow: 0 8px 20px -6px rgba(74,53,32,0.15);
  transform: perspective(600px) translateZ(0);
  transition: all 0.25s ease;
}
.progress-strip:hover {
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 12px 28px -8px rgba(74,53,32,0.25);
}
.stat-block { text-align: center; }
.stat-number {
  font-family: 'Ovo', serif; font-weight: 400;
  font-size: 30px; color: var(--burgundy); line-height: 1;
}
.stat-label {
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 2px;
  color: var(--earth); text-transform: uppercase; margin-top: 4px;
}

/* ─── Level Cards ─── */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; margin-bottom: 40px;
}
.level-card {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 20px -6px rgba(74,53,32,0.15);
  min-height: 200px;
  display: flex; flex-direction: column; justify-content: space-between;
  transform: perspective(600px) translateZ(0);
}
.level-card:hover:not(.locked) {
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 12px 28px -8px rgba(74,53,32,0.25);
  border-color: var(--clay);
}
.level-card.locked {
  background: linear-gradient(160deg, #e0d8c8, #d4c8b3);
  opacity: 0.6; cursor: not-allowed;
}
.level-card.completed {
  border-color: var(--success);
}
.level-num {
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 3px;
  color: var(--earth); text-transform: uppercase;
}
.level-title {
  font-family: 'Ovo', serif; font-weight: 400;
  font-size: 22px; color: var(--burgundy);
  margin: 8px 0 6px; line-height: 1.2;
}
.level-desc { font-size: 14px; color: var(--earth); font-style: italic; margin-bottom: 14px; line-height: 1.5; font-weight: 300; }
.level-meta {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px dashed var(--line);
  padding-top: 12px; font-size: 13px; color: var(--earth);
}
.level-icon { font-size: 18px; }
.level-status {
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 10px; border-radius: 10px;
  background: var(--linen); color: var(--soil);
}
.level-card.completed .level-status { background: var(--success); color: #fff; }
.level-card.locked .level-status { background: var(--earth); color: var(--sand); }

.level-card.final-quiz {
  grid-column: span 2;
  background: linear-gradient(135deg, var(--soil) 0%, #2a1a0a 100%);
  border: 2px solid var(--clay);
  color: var(--sand);
  min-height: 220px;
}
.level-card.final-quiz .level-title { color: var(--sand); }
.level-card.final-quiz .level-desc { color: rgba(245,237,224,0.85); }
.level-card.final-quiz .level-num { color: var(--clay); }
.level-card.final-quiz .level-meta { border-top-color: rgba(201,170,128,0.3); color: rgba(245,237,224,0.7); }
.level-card.final-quiz .level-status { background: var(--clay); color: var(--soil); }

/* ─── Modal ─── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(58,31,14,0.85);
  backdrop-filter: blur(6px);
  z-index: 1000;
  overflow-y: auto;
  padding: 30px 20px;
}
.modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
.modal-content {
  background: var(--sand);
  border-radius: 18px;
  max-width: 700px; width: 100%;
  padding: 36px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  position: relative;
  border: 1.5px solid var(--line);
  margin: auto;
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 44px; height: 44px; border-radius: 14px;
  border: 1.5px solid var(--line);
  background: linear-gradient(160deg, var(--sand), var(--linen));
  color: var(--soil); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  transform: perspective(600px) translateZ(0);
}
.modal-close:hover {
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 8px 20px -6px rgba(74,53,32,0.3);
  border-color: var(--clay);
}

.lesson-header {
  text-align: center;
  border-bottom: 1px dashed var(--clay);
  padding-bottom: 18px; margin-bottom: 22px;
}
.lesson-tag {
  display: inline-block;
  background: var(--soil); color: var(--sand);
  padding: 5px 14px; border-radius: 14px;
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 2px; margin-bottom: 10px;
}
.lesson-title { font-family: 'Ovo', serif; font-weight: 400; font-size: 28px; color: var(--burgundy); margin-bottom: 6px; }
.lesson-subtitle { font-style: italic; color: var(--earth); font-size: 14px; font-weight: 300; }

/* ─── Word Display & Input ─── */
.word-display-section {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 28px 22px; margin: 18px 0;
  text-align: center; position: relative;
  box-shadow: 0 8px 20px -6px rgba(74,53,32,0.15);
}
.listen-instruction { font-style: italic; color: var(--earth); margin-bottom: 16px; font-size: 14px; font-weight: 300; }
.listen-button {
  background: var(--soil); color: var(--sand);
  border: none; padding: 16px 40px; border-radius: 60px;
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 18px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 12px;
  transition: all 0.25s;
  box-shadow: 0 4px 0 var(--burgundy), 0 6px 14px rgba(0,0,0,0.15);
  letter-spacing: 0.5px;
  transform: perspective(600px) translateZ(0);
}
.listen-button:hover {
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 8px 0 var(--burgundy), 0 10px 20px rgba(0,0,0,0.2);
}
.listen-button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--burgundy); }
.listen-button.playing { background: var(--earth); }

.audio-controls-extra { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.speed-btn {
  background: transparent;
  border: 1.5px solid var(--line);
  color: var(--earth);
  padding: 5px 12px; border-radius: 18px;
  cursor: pointer;
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 11px; letter-spacing: 1px;
  transition: all 0.2s;
}
.speed-btn.active, .speed-btn:hover {
  background: var(--soil); color: var(--sand); border-color: var(--soil);
}

.hint-section {
  margin-top: 18px; padding: 12px 16px;
  background: rgba(201,170,128,0.15);
  border-left: 3px solid var(--clay);
  border-radius: 0 12px 12px 0;
  font-style: italic; color: var(--earth);
  font-size: 14px; text-align: left; font-weight: 300;
}
.hint-section .hint-label {
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 10px; letter-spacing: 2px;
  color: var(--burgundy); text-transform: uppercase;
  font-style: normal; margin-right: 8px;
}

/* ─── Spelling Input ─── */
.spelling-input-block { margin: 22px 0; }
.spelling-prompt {
  font-family: 'Ovo', serif; color: var(--earth);
  font-size: 16px; margin-bottom: 14px; text-align: center; font-style: italic;
}
.spelling-input {
  width: 100%; padding: 18px 20px;
  border: 1.5px solid var(--line); border-radius: 14px;
  font-family: 'Almarai', sans-serif; font-size: 22px;
  background: linear-gradient(160deg, var(--sand), var(--linen));
  color: var(--soil); text-align: center;
  letter-spacing: 3px; font-weight: 400;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
  transition: all 0.2s;
  outline: none;
}
.spelling-input:focus {
  border-color: var(--clay);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.03), 0 0 0 4px rgba(201,170,128,0.2);
}
.spelling-input.correct { background: rgba(90,138,58,0.12); border-color: var(--success); color: var(--success); }
.spelling-input.incorrect { background: rgba(160,64,32,0.1); border-color: var(--error); color: var(--error); }

/* ─── Letter Tiles ─── */
.letter-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0; }
.letter-tile {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--line);
  width: 50px; height: 50px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Ovo', serif; font-size: 22px;
  color: var(--soil); cursor: pointer;
  transition: all 0.2s; user-select: none; text-transform: uppercase;
  transform: perspective(600px) translateZ(0);
}
.letter-tile:hover { transform: perspective(600px) translateZ(8px) translateY(-3px); border-color: var(--clay); box-shadow: 0 6px 16px -6px rgba(74,53,32,0.2); }
.letter-tile.placed { opacity: 0.3; cursor: default; transform: none; }
.letter-tile.placed:hover { transform: none; box-shadow: none; border-color: var(--line); }

.answer-slots {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  margin: 18px 0; min-height: 64px; padding: 12px;
  background: rgba(237,224,196,0.5); border-radius: 12px;
  border: 2px dashed var(--clay);
}
.answer-slot {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--success);
  width: 42px; height: 50px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Ovo', serif; font-size: 20px;
  color: var(--soil); cursor: pointer; text-transform: uppercase;
}
.answer-slot.empty {
  background: transparent;
  border-style: dashed; border-color: var(--line); color: var(--earth);
}

/* ─── Options ─── */
.options-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.option-btn {
  background: linear-gradient(160deg, var(--sand), var(--linen));
  border: 1.5px solid var(--line);
  padding: 14px 18px; border-radius: 14px;
  cursor: pointer; text-align: left;
  font-family: 'Almarai', sans-serif; font-size: 17px;
  color: var(--soil); transition: all 0.2s;
  display: flex; align-items: center; gap: 12px;
  letter-spacing: 1px; font-weight: 400;
  transform: perspective(600px) translateZ(0);
}
.option-btn:hover:not(:disabled) {
  border-color: var(--clay);
  transform: perspective(600px) translateZ(8px) translateY(-3px);
  box-shadow: 0 6px 16px -6px rgba(74,53,32,0.2);
}
.option-btn .opt-letter {
  font-family: 'Almarai', sans-serif; font-weight: 700;
  background: var(--soil); color: var(--sand);
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.option-btn.correct { background: rgba(90,138,58,0.12); border-color: var(--success); color: var(--success); }
.option-btn.correct .opt-letter { background: var(--success); }
.option-btn.incorrect { background: rgba(160,64,32,0.08); border-color: var(--error); color: var(--error); }
.option-btn.incorrect .opt-letter { background: var(--error); }
.option-btn:disabled { cursor: default; }

/* ─── Feedback ─── */
.feedback {
  margin-top: 16px; padding: 14px 18px;
  border-radius: 14px; font-size: 15px;
  display: none; line-height: 1.6; font-weight: 300;
}
.feedback.show { display: block; }
.feedback.correct { background: rgba(90,138,58,0.1); border-left: 4px solid var(--success); color: var(--success); }
.feedback.incorrect { background: rgba(160,64,32,0.08); border-left: 4px solid var(--error); color: var(--error); }
.feedback .correct-spelling {
  display: inline-block;
  background: var(--linen); padding: 4px 10px; border-radius: 8px;
  font-family: 'Ovo', serif; font-weight: 400;
  letter-spacing: 2px; color: var(--burgundy); margin: 0 4px;
}

/* ─── Action Row / Buttons ─── */
.action-row { display: flex; gap: 12px; justify-content: space-between; margin-top: 24px; flex-wrap: wrap; }
.btn {
  padding: 12px 28px; border-radius: 60px;
  font-family: 'Almarai', sans-serif; font-weight: 700;
  font-size: 15px; cursor: pointer; border: none;
  transition: all 0.25s; letter-spacing: 0.5px;
  transform: perspective(600px) translateZ(0);
}
.btn:hover { transform: perspective(600px) translateZ(8px) translateY(-3px); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--soil); color: var(--sand);
  box-shadow: 0 4px 0 var(--burgundy), 0 6px 14px rgba(0,0,0,0.15);
}
.btn-primary:hover { box-shadow: 0 8px 0 var(--burgundy), 0 10px 20px rgba(0,0,0,0.2); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: transparent; color: var(--soil);
  border: 1.5px solid var(--line);
  border-radius: 18px;
}
.btn-secondary:hover { border-color: var(--clay); box-shadow: 0 6px 16px -6px rgba(74,53,32,0.2); }

/* ─── Progress Dots ─── */
.lesson-progress { display: flex; gap: 6px; margin-bottom: 16px; justify-content: center; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--linen); border: 1.5px solid var(--line);
  transition: all 0.3s;
}
.progress-dot.current { background: var(--clay); border-color: var(--earth); transform: scale(1.4); box-shadow: 0 0 0 3px rgba(201,170,128,0.3); }
.progress-dot.done { background: var(--success); border-color: var(--success); }

/* ─── Completion ─── */
.completion-screen { text-align: center; padding: 30px 20px; }
.completion-icon { font-size: 70px; margin-bottom: 20px; animation: float 2.5s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.completion-title { font-family: 'Ovo', serif; font-weight: 400; font-size: 30px; color: var(--burgundy); margin-bottom: 10px; }
.completion-score { font-size: 48px; font-family: 'Ovo', serif; color: var(--soil); margin: 16px 0; }
.completion-message { font-style: italic; color: var(--earth); margin-bottom: 24px; font-size: 15px; font-weight: 300; }

/* ─── Footer ─── */
.footer-ornament {
  text-align: center; margin-top: 60px;
  padding: 30px 20px;
  border-top: 1px dashed var(--clay);
  color: var(--earth); font-style: italic;
  font-size: 14px; font-weight: 300;
}
.footer-ornament .palm-row { font-size: 22px; margin-bottom: 10px; letter-spacing: 12px; }

@media (max-width: 600px) {
  .level-card.final-quiz { grid-column: span 1; }
  .container { padding: 70px 16px 40px; }
  .modal-content { padding: 26px 18px; }
  .letter-tile { width: 42px; height: 42px; font-size: 18px; }
  .answer-slot { width: 36px; height: 44px; font-size: 18px; }
  .spelling-input { font-size: 20px; padding: 14px 16px; }
}
</style>
<script src="public/js/piper-client.js"></script>
<script src="public/js/palm-sfx.js" defer></script>
</head>
<body>

<!-- Floating Nav -->
<div class="nav-float">
  <button class="nav-btn" id="backBtn" onclick="goBack()">&#8249;</button>
  <button class="nav-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<div class="container screen active" id="mainScreen">

  <div class="page-header">
    <div class="au d1"><span class="skill-tag">Skill 2 of 7</span></div>
    <h1 class="page-title au d2">Spelling</h1>
    <p class="page-subtitle au d2">Spell the words of the village, one letter at a time</p>
    <div class="divider-ornament au d3"><span>✒️</span></div>
  </div>

  <div class="progress-strip au d3" id="progressStrip">
    <div class="stat-block">
      <div class="stat-number" id="statCompleted">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-block">

// ═══ State ═══
const state = {
  completed: {}, currentLevel: null, currentQuestion: 0,
  answers: [], audioRate: 0.92,
  scrambleSelected: [], scrambleAvailable: [],
  muted: false
};

// ═══ TTS — British en-GB ═══
function speakWord(word) {
  const synth = window.speechSynthesis;
  if (!synth || state.muted) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-GB';
  u.rate = 0.92; u.pitch = 0.95; u.volume = 0.85;
  const voices = synth.getVoices();
  const search = [/british/i, /daniel/i, /kate/i, /george/i, /en-GB/i, /UK English/i];
  let voice = null;
  for (const re of search) { voice = voices.find(v => re.test(v.name) || re.test(v.lang)); if (voice) break; }
  if (!voice) voice = voices.find(v => /en/i.test(v.lang)) || null;
  if (voice) u.voice = voice;
  synth.speak(u);
}

function toggleMute() {
  state.muted = !state.muted;
  document.getElementById('muteBtn').textContent = state.muted ? '🔇' : '🔊';
  if (state.muted) window.speechSynthesis.cancel();
}

function setSpeed(rate, btn) {
  state.audioRate = rate;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ═══ Navigation ═══
function goBack() {
  if (document.getElementById('lessonModal').classList.contains('active')) {
    closeLesson();
  }
}

// ═══ Render Levels Grid ═══
function renderLevels() {
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';

  levels.forEach((lvl, idx) => {
    const isCompleted = state.completed[lvl.num];
    const prevCompleted = idx === 0 || state.completed[levels[idx - 1].num];
    const isLocked = !prevCompleted && !isCompleted;

    const card = document.createElement('div');
    card.className = 'level-card';
    if (isCompleted) card.classList.add('completed');
    if (isLocked) card.classList.add('locked');
    if (lvl.isFinal) card.classList.add('final-quiz');

    let statusText = 'Locked';
    if (!isLocked && !isCompleted) statusText = 'Start';
    if (isCompleted) statusText = `Score ${state.completed[lvl.num].score}%`;

    const levelLabel = lvl.isFinal ? 'Final Quiz · Level 11' : `Level ${lvl.num} of 10`;

    card.innerHTML = `
      <div>
        <div class="level-num">${levelLabel}</div>
        <h3 class="level-title">${lvl.title}</h3>
        <p class="level-desc">${lvl.desc}</p>
      </div>
      <div class="level-meta">
        <span class="level-icon">${lvl.icon}</span>
        <span class="level-status">${statusText}</span>
      </div>
    `;

    if (!isLocked) card.addEventListener('click', () => openLesson(lvl.num));
    grid.appendChild(card);
  });

  updateStats();
}

function updateStats() {
  const completedCount = Object.keys(state.completed).length;
  document.getElementById('statCompleted').textContent = completedCount;
  const scores = Object.values(state.completed).map(c => c.score);
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
  document.getElementById('statScore').textContent = avg + '%';
  let streak = 0;
  for (let i = 0; i < levels.length; i++) { if (state.completed[levels[i].num]) streak++; else break; }
  document.getElementById('statStreak').textContent = streak;
}

// ═══ Open / Close Lesson ═══
function openLesson(levelNum) {
  state.currentLevel = levels.find(l => l.num === levelNum);
  state.currentQuestion = 0;
  state.answers = [];
  document.getElementById('lessonModal').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderQuestion();
}

function closeLesson() {
  window.speechSynthesis.cancel();
  document.getElementById('lessonModal').classList.remove('active');
  document.body.style.overflow = '';
  state.currentLevel = null;
}

// ═══ Render Question ═══
function renderQuestion() {
  const lvl = state.currentLevel;
  if (state.currentQuestion >= lvl.questions.length) { renderCompletion(); return; }
  const q = lvl.questions[state.currentQuestion];
  const body = document.getElementById('lessonBody');

  const dots = lvl.questions.map((_, i) => {
    let cls = 'progress-dot';
    if (i < state.currentQuestion) cls += ' done';
    if (i === state.currentQuestion) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  let questionContent = '';
  if (q.type === 'listen') questionContent = renderListenQuestion(q);
  else if (q.type === 'scramble') questionContent = renderScrambleQuestion(q);
  else if (q.type === 'choose') questionContent = renderChooseQuestion(q);

  body.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-tag">${lvl.isFinal ? 'Final Quiz' : 'Level ' + lvl.num + ' / 10'}</div>
      <h2 class="lesson-title">${lvl.title}</h2>
      <p class="lesson-subtitle">Question ${state.currentQuestion + 1} of ${lvl.questions.length}</p>
    </div>
    <div class="lesson-progress">${dots}</div>
    ${questionContent}
    <div class="feedback" id="feedback"></div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="closeLesson()">← Levels</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">
        ${state.currentQuestion === lvl.questions.length - 1 ? 'See Results →' : 'Next Question →'}
      </button>
    </div>
  `;

  if (q.type === 'listen') setTimeout(() => speakWord(q.word), 400);
  if (q.type === 'scramble') setupScramble(q);
}

// ─── Listen Question ────────────────────────────────
function renderListenQuestion(q) {
  return `
    <div class="word-display-section">
      <p class="listen-instruction">🎧 Listen to the word, then type it below.</p>
      <button class="listen-button" onclick="speakWord('${q.word}')">
        <span>🔊</span><span>Hear the Word</span>
      </button>
      <div class="audio-controls-extra">
        <button class="speed-btn" onclick="setSpeed(0.7, this)">Slow</button>
        <button class="speed-btn active" onclick="setSpeed(0.92, this)">Normal</button>
        <button class="speed-btn" onclick="setSpeed(1.0, this)">Fast</button>
      </div>
      <div class="hint-section"><span class="hint-label">Hint</span>${q.hint}</div>
    </div>
    <div class="spelling-input-block">
      <div class="spelling-prompt">Type the word you hear:</div>
      <input type="text" class="spelling-input" id="spellInput" placeholder="..." autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitListen()">
      <div style="margin-top: 16px; text-align: center;">
        <button class="btn btn-primary" onclick="submitListen()">Submit</button>
      </div>
    </div>
  `;
}

function submitListen() {
  const input = document.getElementById('spellInput');
  const userAnswer = input.value.trim().toLowerCase();
  if (!userAnswer) return;
  const q = state.currentLevel.questions[state.currentQuestion];
  const isCorrect = userAnswer === q.word.toLowerCase();
  state.answers.push(isCorrect);
  input.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'incorrect');
  showFeedback(isCorrect, q.word, q.hint);
}

// ─── Scramble Question ──────────────────────────────
function renderScrambleQuestion(q) {
  return `
    <div class="word-display-section">
      <p class="listen-instruction">🔤 Click the letters in order to spell the word.</p>
      <button class="listen-button" onclick="speakWord('${q.word}')">
        <span>🔊</span><span>Hear the Word</span>
      </button>
      <div class="hint-section"><span class="hint-label">Hint</span>${q.hint}</div>
    </div>
    <div class="spelling-input-block">
      <div class="spelling-prompt">Your spelling:</div>
      <div class="answer-slots" id="answerSlots"></div>
      <div class="spelling-prompt">Available letters:</div>
      <div class="letter-tiles" id="letterTiles"></div>
      <div style="display: flex; gap: 12px; justify-content: center; margin-top: 14px; flex-wrap: wrap;">
        <button class="btn btn-secondary" onclick="resetScramble()">↻ Reset</button>
        <button class="btn btn-primary" onclick="submitScramble()">Submit</button>
      </div>
    </div>
  `;
}

function setupScramble(q) {
  const word = q.word.toUpperCase();
  state.scrambleSelected = [];
  state.scrambleAvailable = word.split('').map((letter, i) => ({ letter, originalIndex: i, used: false }));
  for (let i = state.scrambleAvailable.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.scrambleAvailable[i], state.scrambleAvailable[j]] = [state.scrambleAvailable[j], state.scrambleAvailable[i]];
  }
  if (state.scrambleAvailable.map(a => a.letter).join('') === word) state.scrambleAvailable.reverse();
  renderScrambleUI();
}

function renderScrambleUI() {
  const word = state.currentLevel.questions[state.currentQuestion].word;
  const slotsEl = document.getElementById('answerSlots');
  const tilesEl = document.getElementById('letterTiles');
  let slotsHTML = '';
  for (let i = 0; i < word.length; i++) {
    if (state.scrambleSelected[i]) {
      slotsHTML += `<div class="answer-slot" onclick="removeFromAnswer(${i})">${state.scrambleSelected[i].letter}</div>`;
    } else {
      slotsHTML += `<div class="answer-slot empty">_</div>`;
    }
  }
  slotsEl.innerHTML = slotsHTML;
  let tilesHTML = '';
  state.scrambleAvailable.forEach((tile, idx) => {
    const placed = state.scrambleSelected.some(s => s && s.tileIdx === idx);
    tilesHTML += `<div class="letter-tile ${placed ? 'placed' : ''}" onclick="${placed ? '' : `addToAnswer(${idx})`}">${tile.letter}</div>`;
  });
  tilesEl.innerHTML = tilesHTML;
}

function addToAnswer(tileIdx) {
  const word = state.currentLevel.questions[state.currentQuestion].word;
  for (let i = 0; i < word.length; i++) {
    if (!state.scrambleSelected[i]) {
      state.scrambleSelected[i] = { letter: state.scrambleAvailable[tileIdx].letter, tileIdx };
      renderScrambleUI(); return;
    }
  }
}

function removeFromAnswer(slotIdx) {
  state.scrambleSelected[slotIdx] = null;
  state.scrambleSelected = state.scrambleSelected.filter(s => s);
  renderScrambleUI();
}

function resetScramble() { state.scrambleSelected = []; renderScrambleUI(); }

function submitScramble() {
  const q = state.currentLevel.questions[state.currentQuestion];
  const userWord = state.scrambleSelected.filter(s => s).map(s => s.letter).join('').toLowerCase();
  if (userWord.length !== q.word.length) { alert('Use all the letters!'); return; }
  const isCorrect = userWord === q.word.toLowerCase();
  state.answers.push(isCorrect);
  document.querySelectorAll('.letter-tile').forEach(t => t.classList.add('placed'));
  document.querySelectorAll('.answer-slot').forEach(s => {
    s.style.cursor = 'default'; s.onclick = null;
    if (isCorrect) s.style.background = 'rgba(90,138,58,0.15)';
    else s.style.background = 'rgba(160,64,32,0.1)';
  });
  showFeedback(isCorrect, q.word, q.hint);
}

// ─── Choose Question ────────────────────────────────
function renderChooseQuestion(q) {
  return `
    <div class="word-display-section">
      <p class="listen-instruction">🤔 Which spelling is correct?</p>
      <button class="listen-button" onclick="speakWord('${q.word}')">
        <span>🔊</span><span>Hear the Word</span>
      </button>
      <div class="hint-section"><span class="hint-label">Hint</span>${q.hint}</div>
    </div>
    <div class="options-list">
      ${q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectChoice(${i}, '${opt}')">
          <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
          <span style="font-family: 'Ovo', serif; letter-spacing: 1px;">${opt}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function selectChoice(idx, chosen) {
  const q = state.currentLevel.questions[state.currentQuestion];
  const isCorrect = chosen.toLowerCase() === q.word.toLowerCase();
  state.answers.push(isCorrect);
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (q.options[i].toLowerCase() === q.word.toLowerCase()) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('incorrect');
  });
  showFeedback(isCorrect, q.word, q.hint);
}

// ─── Feedback ───────────────────────────────────────
function showFeedback(isCorrect, correctWord, hint) {
  const fb = document.getElementById('feedback');
  fb.classList.remove('correct', 'incorrect');
  fb.classList.add('show', isCorrect ? 'correct' : 'incorrect');
  if (isCorrect) {
    fb.innerHTML = `<strong>✓ Excellent!</strong> The word is <span class="correct-spelling">${correctWord.toUpperCase()}</span>`;
  } else {
    fb.innerHTML = `<strong>✗ Not quite.</strong> The correct spelling is <span class="correct-spelling">${correctWord.toUpperCase()}</span>. Hint: ${hint}`;
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() { state.currentQuestion++; renderQuestion(); }

// ─── Completion ─────────────────────────────────────
function renderCompletion() {
  const lvl = state.currentLevel;
  const correctCount = state.answers.filter(a => a).length;
  const totalQ = state.answers.length;
  const score = Math.round((correctCount / totalQ) * 100);
  const passed = lvl.isFinal ? score >= 70 : score >= 60;

  state.completed[lvl.num] = { score, attempted: true };

  let icon = '🌟'; let title = 'Level Complete!'; let message = '';

  if (lvl.isFinal) {
    if (passed) { icon = '🏆'; title = 'Spelling Mastered!'; message = 'You can now spell with confidence. Welcome to the next skill.'; }
    else { icon = '🌱'; title = 'Almost There'; message = 'You need 70% or higher to pass. Review the levels and try again.'; }
  } else {
    if (score === 100) { icon = '⭐'; message = 'Perfect spelling! Every letter in place.'; }
    else if (score >= 80) { icon = '🌟'; message = 'Excellent! Your spelling is sharp.'; }
    else if (score >= 60) { icon = '🌴'; message = 'Good work! Keep practicing.'; }
    else { icon = '🌱'; message = 'Spelling takes time. Try this level again.'; }
  }

  const body = document.getElementById('lessonBody');
  body.innerHTML = `
    <div class="completion-screen">
      <div class="completion-icon">${icon}</div>
      <h2 class="completion-title">${title}</h2>
      <div class="completion-score">${correctCount} / ${totalQ}</div>
      <div style="font-family:'Ovo',serif; font-size:22px; color:var(--burgundy); margin-bottom:20px;">Score: ${score}%</div>
      <p class="completion-message">${message}</p>
      ${lvl.isFinal && passed ? `
        <div style="background:linear-gradient(160deg,var(--sand),var(--linen)); border:1.5px solid var(--clay); border-radius:18px; padding:24px; margin:24px 0; box-shadow:0 8px 20px -6px rgba(74,53,32,0.15);">
          <div style="font-family:'Ovo',serif; font-size:24px; color:var(--burgundy); margin-bottom:8px;">🏆 Spelling Mastery Certificate</div>
          <div style="font-style:italic; color:var(--earth); font-weight:300;">Awarded to the dedicated learner</div>
          <div style="margin-top:14px; font-family:'Almarai',sans-serif; font-weight:700; font-size:10px; letter-spacing:2px; color:var(--earth);">UNDER THE PALM TREE · 2026</div>
        </div>
      ` : ''}
      <div class="action-row" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="retryLesson()">↻ Try Again</button>
        <button class="btn btn-primary" onclick="closeLesson(); renderLevels();">Continue Journey →</button>
      </div>
    </div>
  `;
  setTimeout(() => renderLevels(), 100);
}
