<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدينة الأبراج الحالمة — مشهد تفاعلي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-700.css">
<style>
  :root{ --paper:#ece4d2; --ink:#171512; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ background:#221e18; font-family:'Cairo',sans-serif; }
  #stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #scene{ height:100vh; max-width:100vw; display:block; box-shadow:0 0 80px rgba(0,0,0,.6); }

  header{ position:fixed; top:14px; right:14px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header h1{ font-size:16px; font-weight:700; color:var(--ink); background:rgba(244,239,228,.9); border:2px solid var(--ink); border-radius:30px; padding:6px 16px; }
  header button{ font-family:'Cairo',sans-serif; font-size:14px; font-weight:700; color:var(--ink); background:rgba(244,239,228,.9); border:2px solid var(--ink); border-radius:30px; padding:6px 14px; cursor:pointer; transition:transform .2s, background .3s; }
  header button:hover{ transform:translateY(-3px); background:#fff; }
  header button:active{ transform:scale(.94); }

  #hint{ position:fixed; bottom:12px; right:50%; transform:translateX(50%); z-index:6; background:rgba(23,21,18,.78); color:#f4efe4; font-size:12.5px; padding:8px 20px; border-radius:30px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #credit{ position:fixed; bottom:12px; left:14px; z-index:6; color:#9a938a; font-size:12px; }
  #tip{ position:fixed; z-index:9; pointer-events:none; background:var(--ink); color:#f4efe4; font-size:13px; padding:4px 14px; border-radius:20px; opacity:0; transition:opacity .2s; transform:translate(-50%,-150%); }

  .skyrect{ fill:var(--paper); transition:fill 1.2s ease; }
  #scene.night .skyrect{ fill:#161331; }
  .stars{ opacity:0; transition:opacity 1.2s ease; }
  #scene.night .stars{ opacity:1; }
  .star{ animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.15; } to{ opacity:1; } }
  .sunpath{ stroke:#4a4438; transition:stroke 1s; }
  #scene.night .sunpath{ stroke:#e9e2cf; }
  .rings{ stroke:#4a4438; fill:none; transition:stroke 1s; }
  #scene.night .rings{ stroke:#e9e2cf; }
  #sunG{ transform-box:fill-box; transform-origin:center; animation:spin 140s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .layer{ will-change:transform; }
  #scene.night .towers{ filter:brightness(.85) saturate(.9); }
  .tower{ transform-box:fill-box; transition:transform .6s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
  .tower:hover{ transform:translateY(-10px); }

  .win{ cursor:pointer; }
  .win .main{ transition:fill .3s; }
  .win .halo{ fill:#ffcf6e; opacity:0; transition:opacity .4s; pointer-events:none; }
  .win.lit .main{ fill:#ffd98a !important; }
  .win.lit .halo{ opacity:.55; }
  #scene.night .win .main{ fill:#e6be6d; }
  #scene.night .win .halo{ opacity:.25; }
  #scene.night .win.lit .main{ fill:#ffe08a; }
  #scene.night .win.lit .halo{ opacity:.7; }

  .dandy{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 6s ease-in-out infinite alternate; cursor:pointer; }
  .dandy:nth-child(odd){ animation-duration:7.5s; }
  @keyframes sway{ from{ transform:rotate(-2.2deg); } to{ transform:rotate(2.2deg); } }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1000 1750" preserveAspectRatio="xMidYMid meet" aria-label="لوحة مدينة الأبراج التفاعلية">
    <defs>
      <filter id="blurG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.19  0 0 0 0 0.15  0 0 0 0.4 0"/></filter>
    </defs>
    <rect class="skyrect" x="0" y="0" width="1000" height="1750"></rect>
    <g id="starsG" class="stars"></g>
    <g id="skyG"></g>
    <g id="layerBack" class="layer towers" data-depth="7"></g>
    <g id="layerMid" class="layer towers" data-depth="14"></g>
    <g id="layerFront" class="layer" data-depth="24"></g>
    <g id="userG"></g>
    <rect x="0" y="0" width="1000" height="1750" filter="url(#paper)" opacity=".5" pointer-events="none"></rect>
    <g id="fxG" pointer-events="none"></g>
  </svg>

  <header>
    <h1>🏰 مدينة الأبراج الحالمة</h1>
    <button id="nightBtn">🌙 وضع الليل</button>
    <button id="lightBtn">💡 إضاءة النوافذ</button>
    <button id="clearBtn">✨ مسح نجومي</button>
    <button id="resetBtn">🔄 إعادة</button>
  </header>
  <div id="hint">مرّر المؤشر لتحريك الطبقات • انقر النوافذ لتضيئها • انقر السماء لتزرع نجمة • انقر الأزهار النجمية لتتناثر</div>
  <div id="credit">اللوحة الأصلية: Vanessa H</div>
  <div id="tip"></div>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg', INK='#171512';
  var seed=13;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function rr(a,b){ return a+rnd()*(b-a); }
  function el(t,a,p){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }

  var svg=document.getElementById('scene');
  var starsG=document.getElementById('starsG'), skyG=document.getElementById('skyG');
  var layerBack=document.getElementById('layerBack'), layerMid=document.getElementById('layerMid'), layerFront=document.getElementById('layerFront');
  var userG=document.getElementById('userG'), fxG=document.getElementById('fxG'), tip=document.getElementById('tip');

  /* ---------- السماء ---------- */
  for(var s=0;s<70;s++){
    el('circle',{cx:rr(10,990).toFixed(1),cy:rr(10,720).toFixed(1),r:rr(1,2.4).toFixed(1),fill:'#efe9d6','class':'star',style:'animation-delay:'+rr(0,3).toFixed(1)+'s'},starsG);
  }
  function rings(cx,cy,r){ el('circle',{cx:cx,cy:cy,r:r,'class':'rings','stroke-width':2},skyG); }
  rings(435,110,55); rings(435,110,92); rings(172,205,28);
  (function spiral(cx,cy,rmax,turns){
    var d='M '+cx+' '+cy, tot=turns*Math.PI*2;
    for(var a=0;a<=tot;a+=0.12){ var r=rmax*a/tot; d+=' L '+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1); }
    var wrap=el('g',{id:'sunG'},skyG); el('path',{d:d,'class':'sunpath',fill:'none','stroke-width':2,opacity:.85},wrap);
  })(712,120,112,5);

  /* ---------- أدوات البناء ---------- */
  function tower(parent,name){ var g=el('g',{'class':'tower'},parent); if(name) g.dataset.name=name; return g; }
  function body(g,x,y,w,h,fill){ return el('rect',{x:x,y:y,width:w,height:h,fill:fill,stroke:INK,'stroke-width':3},g); }
  function cone(g,x,w,baseY,tipY,fill){ return el('polygon',{points:(x-6)+','+baseY+' '+(x+w+6)+','+baseY+' '+(x+w/2)+','+tipY,fill:fill,stroke:INK,'stroke-width':3},g); }
  function addWin(g,x,y,w,h,type,fill,grid){
    var grp=el('g',{'class':'win'},g), cx=x+w/2, cy=y+h/2, main;
    el('circle',{cx:cx,cy:cy,r:Math.max(w,h)*1.05,'class':'halo',filter:'url(#blurG)'},grp);
    if(type==='arch'){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.45)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.45)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else if(type==='round'||type==='wheel'){ main=el('circle',{cx:cx,cy:cy,r:Math.min(w,h)/2,'class':'main'},grp); }
    else if(type==='oval'){ main=el('ellipse',{cx:cx,cy:cy,rx:w/2,ry:h/2,'class':'main'},grp); }
    else { main=el('rect',{x:x,y:y,width:w,height:h,'class':'main'},grp); }
    main.setAttribute('fill',fill); main.setAttribute('stroke',INK); main.setAttribute('stroke-width',2);
    if(grid){
      el('line',{x1:cx,y1:y,x2:cx,y2:y+h,stroke:INK,'stroke-width':1.5},grp);
      el('line',{x1:x,y1:y+h/3,x2:x+w,y2:y+h/3,stroke:INK,'stroke-width':1.5},grp);
      el('line',{x1:x,y1:y+2*h/3,x2:x+w,y2:y+2*h/3,stroke:INK,'stroke-width':1.5},grp);
    }
    if(type==='wheel'){
      for(var i=0;i<8;i++){ var a=i*Math.PI/4; el('line',{x1:cx,y1:cy,x2:cx+Math.cos(a)*w/2,y2:cy+Math.sin(a)*w/2,stroke:INK,'stroke-width':1.5},grp); }
      el('circle',{cx:cx,cy:cy,r:3,fill:INK},grp);
    }
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('lit'); });
    return grp;
  }
  function stripedCone(g,cx,baseW,baseY,tipY,colors){
    var H=baseY-tipY, n=colors.length;
    for(var i=0;i<n;i++){
      var y1=baseY-H*i/n, y2=baseY-H*(i+1)/n, w1=baseW*(1-i/n)+4, w2=baseW*(1-(i+1)/n)+2;
      el('polygon',{points:(cx-w1/2)+','+y1+' '+(cx+w1/2)+','+y1+' '+(cx+w2/2)+','+y2+' '+(cx-w2/2)+','+y2,fill:colors[i],stroke:INK,'stroke-width':2},g);
    }
  }
  function burst(cx,cy){
    for(var i=0;i<14;i++){
      var a=rnd()*Math.PI*2, d=rr(30,85);
      var c=el('circle',{cx:cx,cy:cy,r:rr(1.5,3).toFixed(1),fill:INK},fxG);
      c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px)',opacity:0}],{duration:750,easing:'ease-out'}).onfinish=(function(c2){ return function(){ c2.remove(); }; })(c);
    }
  }
  function dandy(parent,cx,cy,r,stemTo){
    var g=el('g',{'class':'dandy'},parent);
    if(stemTo) el('path',{d:'M '+cx+' '+cy+' Q '+(cx+rr(-25,25)).toFixed(1)+' '+((cy+stemTo)/2).toFixed(1)+' '+cx+' '+stemTo,stroke:INK,'stroke-width':2,fill:'none'},g);
    for(var i=0;i<8;i++){ var a=i*Math.PI/8; el('line',{x1:cx-Math.cos(a)*r,y1:cy-Math.sin(a)*r,x2:cx+Math.cos(a)*r,y2:cy+Math.sin(a)*r,stroke:INK,'stroke-width':1.4},g); }
    el('circle',{cx:cx,cy:cy,r:3,fill:INK},g);
    g.addEventListener('click',function(ev){
      ev.stopPropagation(); burst(cx,cy);
      g.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:450,easing:'ease-out'});
    });
    return g;
  }
  function fluff(parent,cx,cy,r,color,baseY,trunkW){
    if(baseY) el('path',{d:'M '+cx+' '+baseY+' Q '+(cx-5)+' '+((baseY+cy)/2)+' '+cx+' '+(cy+r*0.6),stroke:INK,'stroke-width':trunkW||5,fill:'none'},parent);
    var g=el('g',{},parent);
    el('circle',{cx:cx,cy:cy,r:r,fill:color,opacity:.28},g);
    for(var i=0;i<70;i++){ var a=rnd()*Math.PI*2, l=r*rr(.4,1); el('line',{x1:cx,y1:cy,x2:(cx+Math.cos(a)*l).toFixed(1),y2:(cy+Math.sin(a)*l).toFixed(1),stroke:color,'stroke-width':1,opacity:.75},g); }
    el('circle',{cx:cx,cy:cy,r:3,fill:INK},g);
  }
  function fanTree(parent,x,baseY,topY,r,color){
    el('path',{d:'M '+x+' '+baseY+' Q '+(x-6)+' '+((baseY+topY)/2)+' '+x+' '+topY,stroke:INK,'stroke-width':6,fill:'none'},parent);
    var g=el('g',{},parent);
    for(var i=0;i<26;i++){ var a=(-170+i*(160/25))*Math.PI/180; el('line',{x1:x,y1:topY,x2:(x+Math.cos(a)*r).toFixed(1),y2:(topY+Math.sin(a)*r).toFixed(1),stroke:color,'stroke-width':1.4,opacity:.85},g); }
    el('circle',{cx:x,cy:topY,r:4,fill:INK},g);
  }
  function fence(x0,x1){
    for(var x=x0;x<=x1;x+=13) el('line',{x1:x,y1:1700,x2:x,y2:1750,stroke:INK,'stroke-width':3,opacity:.7},layerFront);
    el('line',{x1:x0,y1:1706,x2:x1,y2:1706,stroke:INK,'stroke-width':3,opacity:.7},layerFront);
  }

  /* ---------- الطبقة الخلفية ---------- */
  var t1=tower(layerBack,'بوابة الماس');
  body(t1,8,700,110,1050,'#cbb493');
  addWin(t1,40,720,32,64,'arch','#f4efe4',true);
  el('polygon',{points:'60,560 115,665 60,770 5,665',fill:INK},t1);

  var t2=tower(layerBack,'برج المرجان');
  body(t2,880,560,95,1190,'#8a8578');
  cone(t2,874,107,565,380,INK);
  addWin(t2,930,570,14,18,'rect','#f4efe4');
  addWin(t2,915,600,18,26,'rect','#b23a2a');
  addWin(t2,908,655,14,20,'rect','#b23a2a');

  var t3=tower(layerBack,'برج النوافذ التوأم');
  body(t3,812,620,92,280,'#7c7669');
  addWin(t3,875,640,16,22,'rect','#f4efe4');
  addWin(t3,830,650,16,22,'rect','#b23a2a');
  addWin(t3,850,700,20,26,'rect','#f4efe4',true);
  el('rect',{x:812,y:760,width:92,height:140,fill:INK,stroke:INK,'stroke-width':3},t3);
  addWin(t3,826,790,24,52,'arch','#f4efe4');
  addWin(t3,866,790,24,52,'arch','#f4efe4');
  body(t3,812,900,92,850,'#c9a875');
  addWin(t3,825,930,26,60,'arch','#e8e2d0',true);
  addWin(t3,862,1010,22,50,'arch','#e8e2d0',true);

  var t4=tower(layerBack,'البرج الذهبي');
  body(t4,690,630,115,1120,'#c9a875');
  cone(t4,684,127,635,240,'#8a6b3f');
  addWin(t4,722,655,18,30,'rect','#3f3a31');
  addWin(t4,750,650,22,34,'rect','#f4efe4');
  addWin(t4,782,655,14,26,'rect','#3f3a31');
  el('rect',{x:735,y:930,width:70,height:120,fill:'#b5ac9c',stroke:INK,'stroke-width':2},t4);
  addWin(t4,745,955,16,22,'rect','#3f3a31');
  addWin(t4,748,1000,14,18,'rect','#f4efe4');

  /* ---------- الطبقة الوسطى ---------- */
  var m1=tower(layerMid,'برج الساعة القديمة');
  body(m1,125,540,95,1210,'#8a8578');
  cone(m1,118,109,545,240,INK);
  addWin(m1,155,470,34,44,'rect','#f4efe4',true);
  addWin(m1,152,595,26,30,'rect','#b23a2a');
  addWin(m1,165,860,18,22,'rect','#f4efe4');

  var m2=tower(layerMid,'برج البوابات');
  body(m2,205,760,125,540,INK);
  el('path',{d:'M 205 760 Q 215 695 267 688 Q 320 695 330 760 Z',fill:INK},m2);
  el('circle',{cx:262,cy:742,r:5,fill:'#f4efe4'},m2);
  el('circle',{cx:276,cy:758,r:4,fill:'#f4efe4'},m2);
  el('circle',{cx:254,cy:772,r:3.5,fill:'#f4efe4'},m2);
  addWin(m2,222,880,14,40,'arch','#f4efe4');
  addWin(m2,245,860,50,80,'arch','#d98e32');
  addWin(m2,305,880,14,40,'arch','#f4efe4');
  addWin(m2,250,1020,44,70,'arch','#f4efe4');
  addWin(m2,225,1060,12,36,'arch','#f4efe4');
  addWin(m2,308,1060,12,36,'arch','#f4efe4');
  addWin(m2,225,1230,12,40,'arch','#f4efe4');
  addWin(m2,268,1225,44,44,'wheel','#f4efe4');
  el('rect',{x:196,y:1300,width:50,height:450,fill:'#7a5230',stroke:INK,'stroke-width':3},m2);
  addWin(m2,208,1355,16,20,'rect','#f4efe4');
  addWin(m2,206,1420,14,18,'rect','#f4efe4');
  addWin(m2,208,1480,16,22,'rect','#f4efe4');
  addWin(m2,206,1545,14,18,'rect','#f4efe4');
  el('rect',{x:246,y:1300,width:84,height:450,fill:'#f4efe4',stroke:INK,'stroke-width':3},m2);
  addWin(m2,266,1360,40,40,'wheel','#f4efe4');
  addWin(m2,272,1440,26,26,'round','#3f3a31');
  addWin(m2,268,1510,32,32,'wheel','#f4efe4');
  addWin(m2,266,1600,36,60,'arch','#b5ac9c');
  for(var ly=1660;ly<1700;ly+=9) el('line',{x1:198,y1:ly,x2:242,y2:ly,stroke:INK,'stroke-width':3},m2);

  var m3=tower(layerMid,'سارية العلم');
  el('line',{x1:268,y1:620,x2:268,y2:432,stroke:INK,'stroke-width':3},m3);
  el('polygon',{points:'245,432 295,432 268,255',fill:INK},m3);

  var m4=tower(layerMid,'بيت السقف الرمادي');
  el('rect',{x:395,y:690,width:80,height:140,fill:'#c9a875',stroke:INK,'stroke-width':2},m4);
  el('polygon',{points:'333,832 492,832 415,652',fill:'#8a8578',stroke:INK,'stroke-width':3},m4);
  body(m4,345,830,135,920,'#6b4a2a');
  addWin(m4,362,845,26,36,'oval','#d8ccb4');
  addWin(m4,428,845,42,42,'rect','#f4efe4',true);
  addWin(m4,368,915,26,48,'rect','#e8e2d0',true);
  addWin(m4,424,910,36,52,'rect','#f4efe4',true);
  addWin(m4,424,972,20,48,'rect',INK);

  var m5=tower(layerMid,'برج الخطوط');
  el('rect',{x:395,y:690,width:70,height:140,fill:'#c9a875',stroke:INK,'stroke-width':3},m5);
  stripedCone(m5,430,76,690,110,[INK,'#c9a875','#d98e32',INK,'#8a8578','#c9a875',INK,'#d98e32',INK]);
  el('ellipse',{cx:430,cy:300,rx:13,ry:24,fill:INK},m5);
  el('circle',{cx:430,cy:292,r:3,fill:'#f4efe4'},m5);

  var m6=tower(layerMid,'البرج الأبيض');
  body(m6,482,670,95,200,'#9a938a');
  addWin(m6,495,700,20,30,'rect','#3f3a31');
  addWin(m6,548,700,16,26,'rect','#3f3a31');
  addWin(m6,493,780,18,28,'rect','#3f3a31');
  addWin(m6,550,790,14,34,'rect','#c9a875');
  el('rect',{x:482,y:870,width:95,height:310,fill:'#f4efe4',stroke:INK,'stroke-width':3},m6);
  addWin(m6,494,890,28,28,'wheel','#f4efe4');
  addWin(m6,540,890,28,28,'wheel','#f4efe4');
  addWin(m6,494,955,14,20,'rect',INK);
  addWin(m6,545,960,12,24,'rect','#8a8578');
  addWin(m6,494,1010,16,26,'rect',INK);
  addWin(m6,546,1030,14,30,'rect','#8a8578');

  var m7=tower(layerMid,'برج السلّم');
  el('polygon',{points:'497,670 567,670 532,380',fill:'#c9a875',stroke:INK,'stroke-width':3},m7);
  for(var ry=655;ry>395;ry-=14){
    var hw=35*(ry-380)/(670-380);
    el('line',{x1:532-hw,y1:ry,x2:532+hw,y2:ry,stroke:INK,'stroke-width':2},m7);
  }

  var m8=tower(layerMid,'برج الساعة');
  el('rect',{x:580,y:563,width:60,height:337,fill:INK,stroke:INK,'stroke-width':3},m8);
  stripedCone(m8,610,70,560,260,['#f4efe4',INK,'#f4efe4',INK,'#f4efe4',INK,'#f4efe4',INK]);
  el('rect',{x:575,y:515,width:60,height:48,fill:'#f4efe4',stroke:INK,'stroke-width':3},m8);
  el('circle',{cx:605,cy:539,r:14,fill:INK},m8);
  el('line',{x1:605,y1:539,x2:605,y2:529,stroke:'#f4efe4','stroke-width':2},m8);
  el('line',{x1:605,y1:539,x2:613,y2:543,stroke:'#f4efe4','stroke-width':2},m8);
  addWin(m8,598,620,20,30,'rect','#f4efe4');
  addWin(m8,600,690,14,14,'round','#f4efe4');
  addWin(m8,598,730,16,24,'rect','#f4efe4');

  document.getElementById('clearBtn').addEventListener('click',function(){ userG.innerHTML=''; });

})();
