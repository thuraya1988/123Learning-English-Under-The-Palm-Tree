<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233f9d94'/%3E%3C/svg%3E">
<title>همس الفلج — Whispers of the Falaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ovo&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- game world -->
  <div id="app">
    <canvas id="game"></canvas>
    <div id="sparkles"></div>
    <div id="hud"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="caption" role="status" aria-live="polite"></div>
    <button id="climb-prompt" type="button">تسلق · Climb</button>
    <button id="jump-btn" type="button" aria-label="اقفز · Jump">اقفز</button>
    <button id="pad-toggle" type="button" aria-label="أزرار التحكم">أزرار</button>
    <div id="pad">
      <div class="pad-cluster pad-move">
        <button class="pad-btn" type="button" data-act="far" aria-label="أمام">أمام</button>
        <button class="pad-btn" type="button" data-act="left" aria-label="يسار">يسار</button>
        <button class="pad-btn" type="button" data-act="right" aria-label="يمين">يمين</button>
        <button class="pad-btn" type="button" data-act="near" aria-label="خلف">خلف</button>
      </div>
      <div class="pad-cluster pad-act">
        <button class="pad-btn" type="button" data-act="jump" id="pad-jump" aria-label="اقفز">اقفز</button>
        <button class="pad-btn" type="button" data-act="climb" id="pad-climb" aria-label="تسلق" disabled>تسلق</button>
      </div>
    </div>
    <div id="dialogue"></div>
    <div id="puzzle-root"></div>
    <div id="journal" class="overlay"></div>
    <div id="map" class="overlay"></div>
    <div id="tutorial" class="overlay"></div>
  </div>

  <!-- splash -->
  <div id="splash">
    <div class="splash-inner">
      <h1 id="splash-title">همس الفلج</h1>
      <p id="splash-sub">حكاية القرية والآثار المنسية</p>
      <button id="begin-btn" class="btn splash-begin" type="button">ابدأ الرحلة</button>
      <button id="splash-lang" class="btn ghost" type="button">English</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
