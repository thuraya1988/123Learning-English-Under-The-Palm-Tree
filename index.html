<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Learn English Under The Palm Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bark: #8b5e3c;
      --gold: #c9a96e;
      --deep: #2c2018;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    .scene {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('cover.jpeg') center center / cover no-repeat;
    }

    .content {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.2s 0.5s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .sub-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      letter-spacing: 0.3em;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .divider {
      width: 50px; height: 1px;
      background: #000;
      margin: 12px auto;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 600;
      color: #000;
      line-height: 1.3;
      text-shadow: 0 2px 16px rgba(255,255,255,0.9), 0 0 30px rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }

    .year-tag {
      font-style: italic;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #000;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      color: #000;
      font-style: italic;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* النخلات — كلهن روابط بنفس الشكل تماماً */
    .palm-icons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 24px;
      margin: 20px auto 0;
      width: fit-content;
    }

    .palm-icons a {
      font-size: 3rem;
      filter: grayscale(1) brightness(0); /* أسود دائماً */
      display: block;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      /* لا hover ولا active ولا أي تأثير بصري */
    }

  </style>
</head>
<body>

<div class="scene">
  <div class="content">
    <p class="sub-label">An Educational Journey</p>
    <div class="divider"></div>
    <h1 class="title">Let's Learn English<br/>Under The Palm Tree</h1>
    <p class="year-tag">From 1973 to 2027</p>
    <p class="tagline">Stories that might happen<br/>in Thuraya's deep mind</p>

    <!-- كل النخلات روابط لنفس الملف -->
    <div class="palm-icons">
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
      <a href="THEPALM1973.html" onclick="playSound()">🌴</a>
    </div>
  </div>
</div>

<script>
  function playSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  }
</script>

</body>
</html>
