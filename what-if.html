var LS='whatIfProgress_v1';
var $=function(i){return document.getElementById(i);};
var stage=$('stage'), gcv=$('girl'), gx=gcv.getContext('2d');
var ribbon=$('ribbon'), chapter=$('chapter'), veil=$('veil');

/* ====== الحالة ====== */
var G={
  idx:0, phase:'walk',      // walk | notice | puzzle | reward | done
  x:0, dir:-1, moving:false,
  wallX:null, exitX:null,
  W:0, H:0, ground:0, scale:1, fx:0, fy:0, lo:0, hi:0,
  doc:null, targets:[], taps:0, need:0,
  poll:null, tRibbon:null, running:false, clock:0
};
var keys={l:false,r:false};

/* ====== الشريط النصّي ====== */
function say(txt,warm){
  clearTimeout(G.tRibbon);
  ribbon.textContent=txt;
  ribbon.classList.toggle('warm',!!warm);
  ribbon.classList.add('on');
}
function hush(delay){
  clearTimeout(G.tRibbon);
  G.tRibbon=setTimeout(function(){ribbon.classList.remove('on');},delay||0);
}

/* ====== القياس ====== */
function layout(){
  var vw=window.innerWidth, vh=window.innerHeight;
  gcv.width=Math.round(vw*Math.min(devicePixelRatio||1,2));
  gcv.height=Math.round(vh*Math.min(devicePixelRatio||1,2));
  gx.setTransform(gcv.width/vw,0,0,gcv.height/vh,0,0);
  G.W=vw; G.H=vh;
  var w=JOURNEY[G.idx], vb=w.vb;
  /* «تغطية»: اللوحة تملأ الشاشة ولا تترك حوافّ سوداء */
  var s=Math.max(vw/vb[0], vh/vb[1]);
  var pw=vb[0]*s, ph=vb[1]*s;
  stage.style.width=pw+'px';
  stage.style.height=ph+'px';
  stage.style.left=Math.round((vw-pw)/2)+'px';
  /* نُظهر الجزء الذي فيه البيوت والأرض */
  /* نضع خطّ أرض اللوحة تحت قدمَي الفتاة تمامًا، في الطول والعرض معًا */
  var gline=Math.round(vh*0.755);
  var top=gline - (w.gy||0.85)*ph;
  stage.style.top=Math.round(Math.min(0,Math.max(vh-ph,top)))+'px';
  G.scale=s;
  G.fx=parseFloat(stage.style.left); G.fy=parseFloat(stage.style.top);
  G.ground=Math.round(Math.min(vh*0.86, G.fy+(w.gy||0.85)*ph));
  /* حدود المشي: على الجسر تنتهي عند طرفَيه */
  if(w.arc){
    G.lo=Math.max(vw*0.10, G.fx+(w.arc.x0+34)*s);
    G.hi=Math.min(vw*0.90, G.fx+(w.arc.x1-34)*s);
    if(G.hi-G.lo<vw*0.34){ G.lo=vw*0.14; G.hi=vw*0.86; }
  } else { G.lo=vw*0.14; G.hi=vw*0.86; }
  G.girlS=Math.max(.34, Math.min(.95, vh/1120));
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',function(){setTimeout(layout,220);});

/* ارتفاع سطح المشي عند نقطة على الشاشة — يتبع قوس الجسر إن وُجد */
function groundAt(sx){
  var w=JOURNEY[G.idx];
  if(!w || !w.arc) return G.ground;
  var px=(sx-G.fx)/G.scale;
  var t=(px-w.arc.x0)/(w.arc.x1-w.arc.x0);
  t=t<0?0:(t>1?1:t);
  var py=w.arc.y[0]+w.arc.y[1]*t+w.arc.y[2]*t*t;
  return G.fy+py*G.scale;
}

/* ====== تحميل عالم ====== */
function loadWorld(i,then){
  G.idx=i; G.phase='load'; G.targets=[]; G.taps=0; G.doc=null;
  clearInterval(G.poll);
  var w=JOURNEY[i];
  veil.classList.add('on');
  setTimeout(function(){
    stage.onload=function(){
      var d;
      try{ d=stage.contentDocument; }catch(e){ d=null; }
      G.doc=d;
      if(d) dressWorld(d);
      layout();
      G.x=G.lo+(G.hi-G.lo)*0.92; G.dir=-1; G.moving=false;
      G.wallX=G.lo+(G.hi-G.lo)*0.46;    /* لا تتجاوز موضع اللغز قبل حلّه */
      G.exitX=G.lo+2;
      G.phase='walk';
      chapter.textContent=(i+1)+' / '+JOURNEY.length+' · '+w.name;
      chapter.classList.add('on');
      veil.classList.remove('on');
      say('امشي…');
      hush(2600);
      try{ localStorage.setItem(LS,String(i)); }catch(e){}
      if(then) then();
    };
    stage.src='whatif/'+w.f;
  },480);
}

/* ====== تهيئة العالم داخل الإطار ====== */
function dressWorld(d){
  var st=d.createElement('style');
  st.textContent=
   'header,#hint,#tip{display:none !important}'+
   'body{overflow:hidden !important;margin:0 !important}'+
   '#scene,svg{width:100% !important;height:100% !important;display:block}'+
   '.wiPick{cursor:pointer}'+
   '.wiPick .main,.wiPick>circle,.wiPick>path,.wiPick>rect,.wiPick>ellipse{'+
     'animation:wiPulse 1.25s ease-in-out infinite}'+
   '.wiPick.wiDone .main,.wiPick.wiDone>circle,.wiPick.wiDone>path,'+
   '.wiPick.wiDone>rect,.wiPick.wiDone>ellipse{animation:none}'+
   '@keyframes wiPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px #ffd77a) brightness(1.35)}}';
  d.head.appendChild(st);
}

/* ====== بدء اللغز ====== */
function startPuzzle(){
  var w=JOURNEY[G.idx], p=w.puzzle, d=G.doc;
  G.phase='puzzle';
  G.targets=[]; G.taps=0; G.need=0;
  if(!d){ solve(); return; }

  if(p.kind==='light'){
    /* الجزء الظاهر من اللوحة داخل الشاشة — لا نختار نافذة مقصوصة خارجها */
    var fr=stage.getBoundingClientRect();
    var every=[].slice.call(d.querySelectorAll('.win'));
    var band=function(t,bx){ return every.filter(function(e){
      var r=e.getBoundingClientRect();
      if(!r.width) return false;
      var cx=fr.left+r.left+r.width/2, cy=fr.top+r.top+r.height/2;
      return cx>G.W*bx && cx<G.W*(1-bx) && cy>G.H*0.04 && cy<G.H*t;
    });};
    var vis=band(0.66,0.17);
    if(vis.length<p.n) vis=band(0.72,0.13);
    if(!vis.length) vis=every;
    vis.sort(function(a,b){ return a.getBoundingClientRect().left-b.getBoundingClientRect().left; });

    var dark=vis.filter(function(e){return !e.classList.contains('lit');});
    /* لو ما فيه نوافذ مطفأة كفاية، تُطفأ نوافذ أمامها — كأنّ البيوت نامت الآن */
    if(dark.length<p.n){
      var lit=vis.filter(function(e){return e.classList.contains('lit');});
      var stepL=Math.max(1,Math.floor(lit.length/Math.max(1,p.n-dark.length)));
      for(var j=0;j<lit.length && dark.length<p.n;j+=stepL){
        lit[j].classList.remove('lit'); dark.push(lit[j]);
      }
      dark.sort(function(a,b){ return a.getBoundingClientRect().left-b.getBoundingClientRect().left; });
    }
    var want=Math.min(p.n,dark.length);
    var step=Math.max(1,Math.floor(dark.length/Math.max(1,want)));
    for(var i=0;i<want && i*step<dark.length;i++) G.targets.push(dark[i*step]);
    if(!G.targets.length && every.length){ every[0].classList.remove('lit'); G.targets=[every[0]]; }
    G.targets.forEach(function(e){ e.classList.add('wiPick'); });
    G.need=G.targets.length;
    if(!G.need){ solve(); return; }
    G.poll=setInterval(function(){
      var done=0;
      G.targets.forEach(function(e){
        if(e.classList.contains('lit')){ done++; e.classList.add('wiDone'); }
        else e.classList.remove('wiDone');
      });
      if(done>=G.need) solve();
    },160);

  }else if(p.kind==='moon'){
    var m=d.querySelector(p.sel);
    if(!m){ solve(); return; }
    m.classList.add('wiPick');
    G.targets=[m];
    var fired=false;
    m.addEventListener('click',function(){ if(!fired){ fired=true; setTimeout(solve,520); } });

  }else if(p.kind==='tap'){
    var t=d.querySelector(p.sel);
    if(!t){ solve(); return; }
    G.need=p.need; G.taps=0;
    t.style.cursor='pointer';
    var mark=d.createElementNS('http://www.w3.org/2000/svg','g');
    t.addEventListener('click',function(){
      G.taps++;
      if(G.taps>=G.need) setTimeout(solve,420);
      else say(w.hint+'  ('+G.taps+'/'+G.need+')');
    });
  }
  say(w.hint);
}

/* ====== الحلّ والتعزيز ====== */
function solve(){
  if(G.phase!=='puzzle') return;
  G.phase='reward';
  clearInterval(G.poll);
  var w=JOURNEY[G.idx], d=G.doc;
  if(d){
    G.targets.forEach(function(e){ e.classList.remove('wiPick'); e.classList.remove('wiDone'); });
    /* التعزيز يحدث داخل العالم نفسه: العالم يحتفل بطريقته */
    if(w.act){ var b=d.getElementById(w.act); if(b) setTimeout(function(){ b.click(); },260); }
  }
  G.wallX=null;                       /* انفتح الطريق */
  say(w.reward,true);
  setTimeout(function(){
    hush(0);
    setTimeout(function(){
      if(G.phase==='reward'){ G.phase='walk'; say('كمّلي…'); hush(2200); }
    },520);
  },3400);
}

/* ====== الانتقال ====== */
function nextWorld(){
  if(G.idx+1>=JOURNEY.length){ finish(); return; }
  loadWorld(G.idx+1);
}
function finish(){
  G.phase='done';
  veil.classList.add('on');
  setTimeout(function(){
    say('مشيتِ سبعة عشر عالمًا،\nوفي كلّ واحد سألتِ: ماذا لو؟\nوكلّ مرّة… أجابكِ العالم.',true);
    try{ localStorage.removeItem(LS); }catch(e){}
  },600);
}

/* ====== حلقة اللعب ====== */
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.033,(now-last)/1000); last=now;
  if(!G.running) return;

  var mv=0;
  if(keys.l) mv-=1;
  if(keys.r) mv+=1;
  var free=(G.phase==='walk');
  if(!free) mv=0;

  if(mv!==0){ G.dir=mv; WIGirl.setFacing(mv); }
  var moving=mv!==0;
  if(moving){
    G.x += mv*WIGirl.speed('walk')*0.62*dt*(G.H/620+.6);
    var lo=G.lo, hi=G.hi;
    if(G.wallX!==null && G.x<G.wallX) G.x=G.wallX;
    if(G.x<lo) G.x=lo;
    if(G.x>hi) G.x=hi;
  }
  WIGirl.step(dt,moving,G.phase==='reward'?'happy':(moving?'walk':'idle'));

  /* بلوغ موضع اللغز */
  if(G.phase==='walk' && G.wallX!==null && G.x<=G.wallX+2){
    G.phase='notice';
    say(JOURNEY[G.idx].ask);
    setTimeout(function(){ if(G.phase==='notice') startPuzzle(); },2300);
  }
  /* بلوغ المخرج بعد الحلّ */
  if(G.phase==='walk' && G.wallX===null && G.x<=G.exitX+2){ nextWorld(); }

  gx.clearRect(0,0,G.W,G.H);
  var wj=JOURNEY[G.idx];
  var gyNow=groundAt(G.x);
  var so={W:G.W,H:G.H,gy:G.ground,pal:PAL[wj.pal]||PAL.nightStreet,kind:wj.kind||'street',
          t:G.clock,seed:G.idx+1};
  G.clock+=dt;
  WIStreet.back(gx,so);
  WIGirl.draw(gx,G.x,gyNow,G.girlS);
  WIStreet.front(gx,so);
}
requestAnimationFrame(loop);

/* ====== الإدخال ====== */
function hold(el,set){
  el.addEventListener('pointerdown',function(e){e.preventDefault();set(true);});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    el.addEventListener(ev,function(){set(false);});
  });
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
hold($('btnL'),function(v){keys.l=v;});
hold($('btnR'),function(v){keys.r=v;});
['pointerup','pointercancel','blur'].forEach(function(ev){
  window.addEventListener(ev,function(){keys.l=keys.r=false;});
});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;
});

/* ====== البوّابة ====== */
(function poster(){
  var c=$('poster'), g=c.getContext('2d');
  WIGirl.build();
  WIGirl.setFacing(-1);
  WIGirl.step(0,false,'idle');
  g.clearRect(0,0,380,380);
  WIGirl.draw(g,190,336,1.35);
})();

var saved=null;
try{ saved=localStorage.getItem(LS); }catch(e){}
if(saved!==null && +saved>0 && +saved<JOURNEY.length){
  var bc=$('btnCont'); bc.hidden=false;
  bc.textContent='تابعي من: '+JOURNEY[+saved].name;
  bc.addEventListener('click',function(){ begin(+saved); });
}
$('btnPlay').addEventListener('click',function(){ begin(0); });

/* ?w=رقم الفصل — للاختبار والمعاينة */
var qw=(location.search.match(/[?&]w=(\d+)/)||[])[1];
if(qw!==undefined){ var qi=Math.max(0,Math.min(JOURNEY.length-1,+qw-1)); setTimeout(function(){begin(qi);},60); }

function begin(i){
  $('gate').style.display='none';
  G.running=true;
  loadWorld(i);
}
})();
</script>
