<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Palm Book</title>

<style>

body{
margin:0;
background:#e7e2d4;
font-family:Georgia, serif;
overflow:hidden;
}

/* الصفحات */

.page{
position:absolute;
width:100%;
height:100%;
opacity:0;
pointer-events:none;
transition:1s;
}

.page.active{
opacity:1;
pointer-events:auto;
}

/* السحب */

.cloud{
position:absolute;
width:320px;
animation:float 12s infinite ease-in-out;
}

.cloud1{top:80px;left:120px;}
.cloud2{top:120px;right:120px;}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-20px)}
100%{transform:translateY(0)}
}

/* الأرض */

.ground{
position:absolute;
bottom:0;
width:100%;
transition:.4s;
}

.ground:hover{
transform:scale(1.02);
}

/* النص */

.text{
position:absolute;
top:200px;
width:100%;
text-align:center;
font-size:28px;
line-height:1.7;

text-shadow:
0 2px 0 #fff,
0 8px 20px rgba(0,0,0,.2);

animation:fadeUp 1.6s forwards;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

/* زر */

.next{
position:absolute;
bottom:40px;
right:40px;
background:#2f5e3f;
color:white;
padding:12px 25px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

.next:hover{
transform:scale(1.05);
}

/* الكتب */

.books{
position:absolute;
bottom:80px;
left:120px;
width:170px;
cursor:pointer;
animation:glow 3s infinite alternate;
}

@keyframes glow{
0%{filter:drop-shadow(0 0 5px white)}
100%{filter:drop-shadow(0 0 20px white)}
}

</style>

</head>

<body>


<!-- الصفحة 1 -->

<div class="page active" id="page1">

<img src="clouds-page2.png" class="cloud cloud1">
<img src="clouds-page2.png" class="cloud cloud2">

<div class="text">

<h1>123</h1>

Learning English  
Under The Palm Tree

</div>

<img src="ground-page2.png" class="ground">

<div class="next" onclick="nextPage()">Next</div>

</div>


<!-- الصفحة 2 -->

<div class="page" id="page2">

<img src="clouds-page2.png" class="cloud cloud1">
<img src="clouds-page2.png" class="cloud cloud2">

<div class="text">

<h2>Author Statement</h2>

These stories were born in 1973  
yet they live in the mind of a  
teacher writing in 2026  

To all learners of English  
may you find joy  
within these pages  

Thuraya

</div>

<img src="ground-page2.png" class="ground">

<div class="next" onclick="nextPage()">Next</div>

</div>


<!-- الصفحة 3 -->

<div class="page" id="page3">

<img src="clouds-page2.png" class="cloud cloud1">
<img src="clouds-page2.png" class="cloud cloud2">

<div class="text">

Click the books to begin your journey

</div>

<img src="ground-page2.png" class="ground">

<img src="books.png" class="books" onclick="changeText()">

</div>


<script>

let current = 1

function nextPage(){

document.getElementById("page"+current).classList.remove("active")

current++

document.getElementById("page"+current).classList.add("active")

}

function changeText(){

document.querySelector("#page3 .text").innerHTML =
"Your learning journey begins now..."

}

</script>


</body>
</html>
