<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="description" content="عرض ضوئي من الجمعية التاريخية العُمانية احتفاءً باليوم الوطني لسلطنة عُمان، 20 نوفمبر.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta property="og:title" content="بقي يومان على الاحتفال الكبير ✨ اليوم الوطني 20 نوفمبر">
<meta property="og:description" content="عرض ضوئي من الجمعية التاريخية العُمانية">

<style>
:root{
  --night:#07080c; --ink:#f4efe7; --muted:#b9b0a4;
  --orange:#f0913f; --red:#db161b; --green:#1f9a45; --white:#ffffff;
  --font:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* searchlights */
.beams{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.beams.on{opacity:1}
.beam{position:absolute;bottom:-6vh;width:min(26vw,190px);height:135vh;transform-origin:50% 100%;
  background:linear-gradient(to top,var(--c) 0%,transparent 78%);
  clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);filter:blur(10px);mix-blend-mode:screen;opacity:.42;
  animation:sweep var(--d) ease-in-out var(--delay) infinite alternate}
@keyframes sweep{from{transform:translateX(-50%) rotate(var(--a1))}to{transform:translateX(-50%) rotate(var(--a2))}}

/* fort skyline */
.skyline{position:fixed;left:0;right:0;bottom:0;z-index:2;width:100%;height:clamp(70px,13vh,140px);pointer-events:none}

/* stage */
.stage{position:relative;z-index:3;height:100%;height:100svh;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;
  gap:clamp(16px,4vw,64px);padding:clamp(18px,4vw,56px) clamp(20px,6vw,90px) clamp(90px,16vh,170px)}
.msg{text-align:center;justify-self:center;max-width:620px}
.logo{justify-self:center;position:relative;margin:0;width:min(34vw,380px);aspect-ratio:415/300;will-change:transform}
.logo img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 22px rgba(240,145,63,.5)) drop-shadow(0 0 2px rgba(255,255,255,.35));
  clip-path:circle(0% at 50% 34%);transition:clip-path 1.5s cubic-bezier(.2,.7,.2,1)}
.logo.lit img{clip-path:circle(85% at 50% 34%)}
.logo .shine{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:130% 0;
  -webkit-mask:url(assets/logo-full-dark.png) center/contain no-repeat;mask:url(assets/logo-full-dark.png) center/contain no-repeat}
.logo.lit .shine{opacity:1;animation:shine 3.6s ease-in-out 1.1s infinite}
@keyframes shine{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
.halo{position:absolute;left:50%;top:34%;width:62%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(240,145,63,.55) 0%,rgba(240,145,63,.18) 40%,transparent 70%);transform:scale(0);opacity:0}
.logo.lit .halo{animation:halo 1.8s ease-out forwards,breathe 4s ease-in-out 1.8s infinite}
@keyframes halo{0%{transform:scale(0);opacity:0}35%{transform:scale(1.6);opacity:1}100%{transform:scale(1.15);opacity:.75}}
@keyframes breathe{0%,100%{transform:scale(1.15);opacity:.75}50%{transform:scale(1.3);opacity:.45}}
.ring{position:absolute;left:50%;top:34%;width:40%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid rgba(255,214,170,.9);opacity:0;pointer-events:none}
.logo.lit .ring{animation:ring 1.3s ease-out forwards}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(3.2);opacity:0}}
.logo.moving{transition:transform 1.4s cubic-bezier(.65,0,.25,1)}

.msg>*{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.msg.on>*{opacity:1;transform:none}
.msg.on>:nth-child(2){transition-delay:.25s}
.msg.on>:nth-child(3){transition-delay:.85s}
.msg.on>:nth-child(4){transition-delay:1.15s}
.msg.on>:nth-child(5){transition-delay:1.45s}
.kicker{margin:0 0 4px;font-weight:700;font-size:clamp(15px,2.2vw,22px);color:var(--orange);letter-spacing:.02em}
.num{margin:0;font-weight:800;line-height:1;font-size:clamp(150px,27vw,330px);color:#fff;font-feature-settings:"lnum";
  text-shadow:0 0 6px #fff,0 0 22px rgba(255,190,120,.9),0 0 60px rgba(240,145,63,.75),0 0 120px rgba(219,22,27,.45)}
.msg.on .num{animation:ignite 1.6s steps(1,end) .25s both,glow 3.2s ease-in-out 2s infinite}
@keyframes ignite{0%{opacity:0}12%{opacity:1}18%{opacity:.25}26%{opacity:1}34%{opacity:.5}42%,100%{opacity:1}}
@keyframes glow{0%,100%{text-shadow:0 0 6px #fff,0 0 22px rgba(255,190,120,.9),0 0 60px rgba(240,145,63,.75),0 0 120px rgba(219,22,27,.45)}
  50%{text-shadow:0 0 4px #fff,0 0 14px rgba(255,190,120,.7),0 0 40px rgba(240,145,63,.55),0 0 80px rgba(31,154,69,.35)}}
.line{margin:6px 0 0;font-weight:700;font-size:clamp(22px,3.6vw,40px);line-height:1.5}
.ribbon{position:relative;display:inline-block;isolation:isolate;margin:20px 0 14px;padding:7px 38px 9px;color:#fff;
  font-weight:700;font-size:clamp(17px,2.3vw,24px);line-height:1.6;white-space:nowrap;
  background:linear-gradient(180deg,#f2484d 0%,#d11b21 45%,#a80f15 100%);
  box-shadow:0 8px 22px rgba(219,22,27,.38),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.25);
  text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:12px;width:42px;height:100%;z-index:-2;
  background:linear-gradient(180deg,#b3141a,#7c090d)}
.ribbon::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,34% 50%)}
.ribbon::after{right:-30px;clip-path:polygon(0 0,100% 0,66% 50%,100% 100%,0 100%)}
.ribbon .fold{position:absolute;bottom:-12px;width:12px;height:12px;z-index:-1;background:#5c0609}
.ribbon .fold.l{left:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.ribbon .fold.r{right:0;clip-path:polygon(0 0,100% 0,0 100%)}
.ribbon .stitch{position:absolute;inset:4px 8px;border-top:1px dashed rgba(255,255,255,.45);border-bottom:1px dashed rgba(255,255,255,.45);pointer-events:none}
.ribbon .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ribbon .sheen::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%);animation:sheen 3.4s ease-in-out 2.4s infinite}
@keyframes sheen{0%{transform:translateX(-140%)}55%,100%{transform:translateX(330%)}}
.msg.on .ribbon{animation:unfurl 1s cubic-bezier(.2,.8,.2,1) 1.15s both}
@keyframes unfurl{from{clip-path:inset(-30px 50% -30px 50%)}to{clip-path:inset(-30px -60px -30px -60px)}}
.date{margin:0;font-weight:500;font-size:clamp(14px,1.9vw,19px);color:var(--muted);line-height:1.8}
.date b{color:var(--ink);font-weight:700}

.foot{position:fixed;z-index:4;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:rgba(244,239,231,.6);
  pointer-events:none;opacity:0;transition:opacity 1s ease 2.4s}
.foot.on{opacity:1}
.replay{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font:500 13px var(--font);color:var(--ink);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.replay:hover{background:rgba(255,255,255,.16)}
.replay:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hint{position:fixed;z-index:4;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 24px);left:0;right:0;text-align:center;font-size:12px;color:rgba(244,239,231,.45);pointer-events:none;
  opacity:0;transition:opacity 1s ease}
.hint.on{opacity:1}

/* portrait / phones: logo on the left, message below */
@media (max-aspect-ratio:1/1),(max-width:760px){
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-items:start;padding-top:max(58px,env(safe-area-inset-top))}
  .logo{order:-1;justify-self:end;width:min(46vw,230px)}
  .msg{align-self:center;margin-top:-4vh}
}
@media (prefers-reduced-motion:reduce){
  .beam,.logo .shine,.halo,.ribbon,.ribbon .sheen::after,.num{animation:none!important}
  .logo img{clip-path:none;transition:none}
  .msg>*{transition:none}
}
/* still frame for the share image */
.og .replay,.og .hint{display:none}
.og .msg>*,.og .foot,.og .beams,.og .logo img{transition:none!important}
.og .num,.og .ribbon{animation:none!important}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="beams" aria-hidden="true">
  <i class="beam" style="left:12%;--c:rgba(255,255,255,.55);--a1:-28deg;--a2:14deg;--d:7s;--delay:0s"></i>
  <i class="beam" style="left:30%;--c:rgba(240,145,63,.6);--a1:20deg;--a2:-18deg;--d:6s;--delay:-2s"></i>
  <i class="beam" style="left:50%;--c:rgba(219,22,27,.55);--a1:-12deg;--a2:22deg;--d:8s;--delay:-1s"></i>
  <i class="beam" style="left:70%;--c:rgba(31,154,69,.6);--a1:18deg;--a2:-24deg;--d:6.5s;--delay:-3s"></i>
  <i class="beam" style="left:88%;--c:rgba(255,255,255,.55);--a1:26deg;--a2:-10deg;--d:7.5s;--delay:-1.5s"></i>
</div>

<svg class="skyline" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0913f" stop-opacity=".55"/><stop offset=".08" stop-color="#0b0c10"/></linearGradient></defs>
  <path fill="url(#rim)" d="M0 140V104h70v-10h40v10h40V86h8v-6h8v6h8v-6h8v6h8v-6h8v6h8v58h40V96h60v-8h12v8h60v-30h10v-8h10v8h10v-8h10v8h10v-8h10v8h10v78h50v-24h90v-14h20v14h90V70h10v-8h10v8h10v-8h10v8h10v-8h10v8h10v62h50v-18h70v-10h10v10h40V90h10v-8h10v8h10v-8h10v8h10v42h60V100h80v40z"/>
</svg>

<main class="stage">
  <section class="msg" aria-live="polite">
    <p class="kicker">اليوم الوطني لسلطنة عُمان</p>
    <p class="num" id="num">2</p>
    <p class="line" id="line">بقي يومان على الاحتفال الكبير</p>
    <p class="ribbon"><span class="fold l" aria-hidden="true"></span><span class="fold r" aria-hidden="true"></span><span class="stitch" aria-hidden="true"></span>20 نوفمبر · اليوم الوطني<span class="sheen" aria-hidden="true"></span></p>
    <p class="date">ذكرى تأسيس الدولة البوسعيدية عام 1744م</p>
  </section>
  <figure class="logo" id="logo">
    <span class="halo"></span><span class="ring"></span>
    <img src="assets/logo-full-dark.png" alt="الجمعية التاريخية العُمانية · The Historical Association of Oman" width="415" height="300">
    <span class="shine"></span>
  </figure>
</main>

<p class="hint" id="hint">المسوا الشاشة لتنطلق قلاع ونخيل وسفن من الألعاب النارية</p>
<p class="foot" id="foot">لجنة تقنية المعلومات – الجمعية التاريخية العُمانية – ثرياء بنت محمد الناعبية</p>
<button class="replay" id="replay" type="button">إعادة العرض ↻</button>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var still = qs.has("og");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) document.documentElement.classList.add("og");

  /* ---------- countdown text (Muscat time) ---------- */
  function muscatToday(){
    var p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Muscat",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-").map(Number);
    return {y:p[0], m:p[1], d:p[2]};
  }
  var t = muscatToday(), today = Date.UTC(t.y, t.m-1, t.d);
  var days = Math.round((Date.UTC(t.y,10,20) - today) / 864e5);
  if (days < -1) days = Math.round((Date.UTC(t.y+1,10,20) - today) / 864e5);
  if (qs.has("d")) days = parseInt(qs.get("d"),10) || 0;
  if (still) days = 2;
  var num = document.getElementById("num"), line = document.getElementById("line");
  if (days <= 0) { num.textContent = "20"; line.textContent = "نوفمبر · كل عام وعُمان بخير"; }
  else {
    num.textContent = String(days);
    line.textContent = days === 1 ? "بقي يوم واحد على الاحتفال الكبير"
      : days === 2 ? "بقي يومان على الاحتفال الكبير"
      : days <= 10 ? "بقيت " + days + " أيام على الاحتفال الكبير"
      : "بقي " + days + " يومًا على الاحتفال الكبير";
  }
  if (days === 2) document.title = "بقي يومان على الاحتفال الكبير · اليوم الوطني 20 نوفمبر · الجمعية التاريخية العُمانية";
  else document.title = line.textContent + " · الجمعية التاريخية العُمانية";

  /* ---------- canvas: stars + fireworks ---------- */
  var cv = document.getElementById("sky"), cx = cv.getContext("2d");
  var W, H, DPR, bg, stars = [], rockets = [], parts = [];
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
    bg = cx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#05060a"); bg.addColorStop(.62,"#0b0d16"); bg.addColorStop(1,"#1a1210");
    stars = [];
    var n = Math.round(W*H/5200);
    for (var i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.random()*H*.78, r:Math.random()*1.2+.2, p:Math.random()*6.28, s:.5+Math.random()*1.5});
    cx.fillStyle = bg; cx.fillRect(0,0,W,H);
  }
  addEventListener("resize", resize); resize();

  var PALETTES = [
    ["#ff2a2f","#ffffff","#22c55e"],   // flag colours
    ["#f0913f","#ffc27a","#fff3e0"],   // society orange
    ["#ffffff","#ffe9b0"],             // white gold
    ["#22c55e","#b7f7c9"],             // green
    ["#ff2a2f","#ff8a8a"]              // red
  ];
  /* ---------- shaped fireworks: fort, palm tree, dhow ---------- */
  function shapePoints(draw){
    var c = document.createElement("canvas"); c.width = c.height = 200;
    var g = c.getContext("2d", {willReadFrequently:true});
    g.lineCap = "round"; g.lineJoin = "round"; draw(g);
    var d = g.getImageData(0,0,200,200).data, pts = [];
    for (var y=0;y<200;y+=5) for (var x=0;x<200;x+=5){
      var i = (y*200+x)*4;
      if (d[i+3] > 120) pts.push({x:(x-100)/100, y:(y-100)/100, c:"rgb("+d[i]+","+d[i+1]+","+d[i+2]+")"});
    }
    return pts;
  }
  function merlons(g, x0, x1, y, w, h){ // Omani crenellations
    g.moveTo(x0, y);
    for (var x=x0; x<x1-1; x+=w*2){ g.lineTo(x, y-h); g.lineTo(x+w, y-h); g.lineTo(x+w, y); g.lineTo(Math.min(x+w*2, x1), y); }
  }
  var SHAPES = {
    fort: shapePoints(function(g){
      g.lineWidth = 5; g.strokeStyle = "#fff3df";
      g.beginPath();
      g.moveTo(28,170); g.lineTo(34,72); merlons(g,34,70,72,6,10); g.lineTo(66,72); g.lineTo(72,170);            // left tower
      g.moveTo(128,170); g.lineTo(134,72); merlons(g,134,170,72,6,10); g.lineTo(166,72); g.lineTo(172,170);      // right tower
      g.moveTo(70,110); merlons(g,70,132,110,7,10); g.lineTo(132,110);                                          // wall
      g.moveTo(20,170); g.lineTo(180,170);
      g.stroke();
      g.strokeStyle = "#ffb347"; g.beginPath(); g.moveTo(88,170); g.lineTo(88,140); g.quadraticCurveTo(100,124,112,140); g.lineTo(112,170); g.stroke(); // door
      g.beginPath(); g.moveTo(50,95); g.lineTo(50,110); g.moveTo(150,95); g.lineTo(150,110); g.stroke();            // windows
      g.strokeStyle = "#fff3df"; g.beginPath(); g.moveTo(52,62); g.lineTo(52,20); g.stroke();                    // flag pole
      g.fillStyle = "#ff2a2f"; g.fillRect(52,20,12,26); g.fillRect(64,29,30,8);                                // Omani flag colours
      g.fillStyle = "#ffffff"; g.fillRect(64,20,30,9);
      g.fillStyle = "#22c55e"; g.fillRect(64,37,30,9);
    }),
    palm: shapePoints(function(g){
      g.lineWidth = 7; g.strokeStyle = "#e3a24f";
      g.beginPath(); g.moveTo(104,182); g.quadraticCurveTo(120,128,98,78); g.stroke();
      g.lineWidth = 5; g.strokeStyle = "#3ddc6e";
      [[26,104,56,44],[174,104,144,44],[40,140,48,74],[160,140,150,74],[50,36,74,40],[150,34,124,40],[98,14,94,44]].forEach(function(f){
        g.beginPath(); g.moveTo(98,78); g.quadraticCurveTo(f[2],f[3],f[0],f[1]); g.stroke();
      });
      g.fillStyle = "#ff9a3c";
      [[88,92],[96,96],[104,92],[92,100],[100,102]].forEach(function(p){ g.beginPath(); g.arc(p[0],p[1],4,0,6.29); g.fill(); });
    }),
    dhow: shapePoints(function(g){
      g.lineWidth = 5; g.strokeStyle = "#ffc65c";
      g.beginPath(); g.moveTo(14,118); g.lineTo(42,150); g.quadraticCurveTo(100,164,160,150); g.lineTo(188,114); g.lineTo(14,118); g.stroke(); // hull
      g.strokeStyle = "#ffffff";
      g.beginPath(); g.moveTo(98,148); g.lineTo(94,28); g.stroke();                                    // mast
      g.beginPath(); g.moveTo(34,96); g.lineTo(170,20); g.lineTo(104,112); g.closePath(); g.stroke();   // lateen sail
      g.strokeStyle = "#8fd3ff"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(10,178); for (var x=10;x<=190;x+=20) g.quadraticCurveTo(x+5,170,x+10,178), g.quadraticCurveTo(x+15,186,x+20,178); g.stroke(); // waves
    })
  };
  var SHAPE_ORDER = ["fort","palm","dhow"], shapeIdx = 0;
  function nextShape(){ var s = SHAPE_ORDER[shapeIdx % SHAPE_ORDER.length]; shapeIdx++; return s; }
  function shapeSize(){ return Math.min(W, H)*.2; }

  function launch(x, ty, shape){
    x = x == null ? W*(.12 + Math.random()*.76) : x;
    ty = ty == null ? H*(.12 + Math.random()*.32) : ty;
    if (shape){ var S = shapeSize(); ty = Math.max(S*1.15 + 10, Math.min(ty, H*.62 - S*.3)); x = Math.max(S*1.05, Math.min(x, W - S*1.05)); }
    var pal = PALETTES[Math.random()*PALETTES.length|0];
    var vy = -Math.sqrt(2*0.11*(H - ty)) ;
    rockets.push({x:x, y:H+4, vx:shape ? 0 : (Math.random()-.5)*.8, vy:vy, ty:ty, pal:pal, shape:shape});
  }
  function shapeBurst(r){
    var pts = SHAPES[r.shape], S = shapeSize();
    for (var i=0;i<pts.length;i++){
      var q = pts[i];
      parts.push({x:r.x, y:r.y, sx:r.x, sy:r.y, dx:q.x*S, dy:q.y*S, vx:0, vy:0, life:0, hold:30+Math.random()*8,
        max:150+Math.random()*30, c:q.c, s:1.7+Math.random()*.9, shape:true, tw:Math.random() < .15});
    }
    for (var j=0;j<20;j++){ var b = Math.PI*2*j/20;
      parts.push({x:r.x,y:r.y,vx:Math.cos(b)*3.2,vy:Math.sin(b)*3.2,life:0,max:40,c:"#ffffff",s:1.3,tw:false}); }
    flash = Math.min(.25, flash + .16);
  }
  function burst(r){
    var kind = Math.random(), n = 70 + (Math.random()*60|0), sp = 2.4 + Math.random()*2.2;
    if (parts.length > 1800) n = 30;
    for (var i=0;i<n;i++){
      var a = Math.PI*2*i/n + Math.random()*.08, v = kind < .45 ? sp : sp*Math.random()*1.05 + .3;
      parts.push({x:r.x, y:r.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0, max:55+Math.random()*45,
        c:r.pal[i % r.pal.length], s:1.6+Math.random()*1.6, tw:kind > .8});
    }
    if (kind < .45) for (var j=0;j<24;j++){ // inner ring
      var b = Math.PI*2*j/24;
      parts.push({x:r.x,y:r.y,vx:Math.cos(b)*sp*.45,vy:Math.sin(b)*sp*.45,life:0,max:50,c:"#ffffff",s:1.4,tw:false});
    }
    flash = Math.min(.22, flash + .12);
  }
  var flash = 0, last = performance.now(), running = true;
  function frame(now){
    var dt = Math.min(2.5, (now-last)/16.67); last = now;
    cx.globalCompositeOperation = "source-over";
    cx.globalAlpha = .26; cx.fillStyle = bg; cx.fillRect(0,0,W,H); cx.globalAlpha = 1;
    if (flash > 0){ cx.fillStyle = "rgba(255,200,150,"+(flash*.25)+")"; cx.fillRect(0,0,W,H); flash -= .01*dt; }
    var tt = now/1000;
    for (var i=0;i<stars.length;i++){
      var s = stars[i]; cx.globalAlpha = .35 + .45*Math.abs(Math.sin(tt*s.s + s.p));
      cx.fillStyle = "#fff"; cx.fillRect(s.x, s.y, s.r, s.r);
    }
    cx.globalAlpha = 1; cx.globalCompositeOperation = "lighter";
    for (i=rockets.length-1;i>=0;i--){
      var r = rockets[i];
      r.x += r.vx*dt; r.y += r.vy*dt; r.vy += .11*dt;
      cx.fillStyle = "rgba(255,220,180,.9)"; cx.beginPath(); cx.arc(r.x, r.y, 1.8, 0, 6.29); cx.fill();
      cx.fillStyle = "rgba(255,160,80,.35)"; cx.beginPath(); cx.arc(r.x, r.y+5, 1.4, 0, 6.29); cx.fill();
      if (r.vy >= -0.4 || r.y <= r.ty){ if (r.shape) shapeBurst(r); else burst(r); rockets.splice(i,1); }
    }
    for (i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.life += dt;
      var k;
      if (p.shape){
        if (p.life < p.hold){ var e = 1 - Math.pow(1 - p.life/p.hold, 3); p.x = p.sx + p.dx*e; p.y = p.sy + p.dy*e; }
        else { p.vy += .010*dt; p.y += p.vy*dt; }
        k = p.life < p.hold + 45 ? 1 : 1 - (p.life - p.hold - 45)/(p.max - p.hold - 45);
      } else {
        p.vx *= Math.pow(.985,dt); p.vy = p.vy*Math.pow(.985,dt) + .035*dt;
        p.x += p.vx*dt; p.y += p.vy*dt;
        k = 1 - p.life/p.max;
      }
      if (k <= 0){ parts.splice(i,1); continue; }
      cx.globalAlpha = p.tw ? k*(Math.random()>.5?1:.2) : k;
      cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.s*(.6+.4*k), 0, 6.29); cx.fill();
    }
    cx.globalAlpha = 1;
    if (running) requestAnimationFrame(frame);
  }

  /* ---------- show timeline ---------- */
  var logo = document.getElementById("logo"), msg = document.querySelector(".msg"), beams = document.querySelector(".beams"),
      foot = document.getElementById("foot"), hint = document.getElementById("hint"), timers = [], auto = null;
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function centerLogo(){
    logo.classList.remove("moving"); logo.style.transform = "none";
    var b = logo.getBoundingClientRect();
    var sc = Math.min(1.7, (W*.72)/b.width, (H*.42)/b.height);
    var dx = W/2 - (b.left + b.width/2), dy = H*.46 - (b.top + b.height/2);
    logo.style.transform = "translate("+dx+"px,"+dy+"px) scale("+sc+")";
  }
  function volley(n, gap){ for (var i=0;i<n;i++) at(i*gap, function(){ launch(); }); }
  function show(){
    timers.forEach(clearTimeout); timers = []; clearInterval(auto);
    [logo, msg, beams, foot, hint].forEach(function(e){ e.classList.remove("lit","on","moving"); });
    if (reduce || still){
      logo.style.transform = "none"; logo.classList.add("lit"); msg.classList.add("on"); beams.classList.add("on"); foot.classList.add("on");
      if (still){ launch(W*.12,H*.2); launch(W*.5,H*.12); launch(W*.88,H*.22); }
      return;
    }
    centerLogo();
    at(250,  function(){ beams.classList.add("on"); });
    at(900,  function(){ logo.classList.add("lit"); });
    at(2300, function(){ volley(3, 260); });
    at(3500, function(){ logo.classList.add("moving"); logo.style.transform = "none"; });
    at(4100, function(){ msg.classList.add("on"); foot.classList.add("on"); });
    at(4600, function(){ volley(5, 180); });
    at(5200, function(){ launch(W*.25, H*.3, "fort"); });
    at(5700, function(){ launch(W*.75, H*.3, "palm"); });
    at(6500, function(){ hint.classList.add("on"); });
    at(13500,function(){ hint.classList.remove("on"); });
    at(5600, function(){
      var tick = 0;
      auto = setInterval(function(){
        if (document.hidden) return;
        tick++;
        if (tick % 3 === 0) launch(null, H*(.3 + Math.random()*.1), nextShape());
        else { launch(); if (Math.random() < .45) launch(); }
        if (tick % 14 === 0) volley(6, 150);
      }, 1100);
    });
  }
  addEventListener("pointerdown", function(e){
    if (e.target.closest(".replay")) return;
    launch(e.clientX, e.clientY, nextShape());
  });
  document.getElementById("replay").addEventListener("click", show);
  addEventListener("resize", function(){ if (!logo.classList.contains("moving") && logo.classList.contains("lit") === false) centerLogo(); });

  function start(){ requestAnimationFrame(function(t){ last = t; frame(t); }); show(); }
  var img = logo.querySelector("img");
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){
    if (img.complete) start(); else { img.onload = start; img.onerror = start; }
  });
})();
</script>
</body>
</html>
