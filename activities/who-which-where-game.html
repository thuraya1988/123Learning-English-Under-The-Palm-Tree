<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔗 Who / Which / Where</title>
<style>
  :root{ --navy:#3A1E1E; --card:#4C2A2A; --line:#6B3A3A; --sand:#F2A65A; --teal:#4FBDB0;
    --ink:#FBF3EC; --muted:#D9B7A8; --good:#3FCB7E; --bad:#E85D5D; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; font-family:'Baloo 2', system-ui, sans-serif;
    background:radial-gradient(1000px 600px at 20% -10%, #5c2f2f, transparent 60%), var(--navy); color:var(--ink);}
  header{text-align:center; padding:26px 16px 6px;}
  h1{font-size:clamp(20px,5vw,30px); margin:0 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin:0;}
  .wrap{max-width:700px; margin:0 auto; padding:16px;}
  
  .stage{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 20px; text-align:center;}
  .cat{color:var(--muted); font-size:13px; margin-bottom:6px;}
  .question{font-size:18px; font-weight:700; margin:0 0 20px; line-height:1.4;}
  .answerRow{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .opt{
    background:var(--navy); border:2px solid var(--teal); color:var(--ink); font-family:inherit;
    font-size:16px; font-weight:700; padding:12px 20px; border-radius:12px; cursor:pointer; min-width:110px;
  }
  .opt.correct{background:var(--good); border-color:var(--good); color:#04211d;}
  .opt.wrong{background:var(--bad); border-color:var(--bad);}
  .feedback{min-height:26px; margin-top:16px; font-weight:700;}
  .feedback.good{color:var(--good);} .feedback.bad{color:var(--bad);}
  .nextbtn, .restart{display:none; margin:18px auto 0; background:var(--sand); color:#3a1c00; border:none; border-radius:12px;
    padding:12px 26px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;}
  .nextbtn.show, .restart.show{display:block;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 16px;}
</style>
</head>
<body>
<header>
  <h1>🔗 Who / Which / Where</h1>
  <p class="sub">Unit 4: Off to the Shops · Lesson 3 · Choose the correct relative pronoun</p>
</header>

<div class="wrap">
  
  <div class="stage" id="stage"></div>
</div>
<footer>Grade 5A · English · Off to the Shops interactive activities</footer>

<script>
const Q = [
  {
    "question": "That's the man _____ we saw at the mall.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 0
  },
  {
    "question": "It's the phone case _____ my mum wants.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 1
  },
  {
    "question": "We're in the shop _____ my brother works.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 2
  },
  {
    "question": "This is the shop assistant _____ helped us.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 0
  },
  {
    "question": "I bought a toy _____ was very expensive.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 1
  },
  {
    "question": "That's the mall _____ the thief ran.",
    "options": [
      "who",
      "which",
      "where"
    ],
    "correct": 2
  }
];

let idx = 0, score = 0;

function render(){
  const item = Q[idx];
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="cat">${item.cat || ''} ${item.cat ? '·' : ''} Question ${idx+1} of ${Q.length}</div>
    <div class="question">${item.question}</div>
    <div class="answerRow">
      ${item.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextbtn">${idx === Q.length-1 ? 'See my score →' : 'Next →'}</button>
  `;
  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', () => choose(btn, item.correct));
  });
  document.getElementById('nextbtn').addEventListener('click', next);
}

function choose(btn, correctIdx){
  const all = document.querySelectorAll('.opt');
  all.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  const chosen = parseInt(btn.dataset.i);
  if(chosen === correctIdx){
    btn.classList.add('correct');
    fb.textContent = "✓ Correct!";
    fb.className = "feedback good";
    score++;
  } else {
    btn.classList.add('wrong');
    all[correctIdx].classList.add('correct');
    fb.textContent = "Not quite — the correct answer is highlighted.";
    fb.className = "feedback bad";
  }
  document.getElementById('nextbtn').classList.add('show');
}

function next(){
  idx++;
  if(idx >= Q.length){
    document.getElementById('stage').innerHTML = `
      <div class="question">🌟 Challenge complete! 🌟</div>
      <p>You scored ${score} out of ${Q.length}.</p>
      <button class="restart show" onclick="start()">Play again</button>
    `;
    return;
  }
  render();
}

function start(){ idx = 0; score = 0; render(); }
start();
</script>
</body>
</html>
