<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>123 Learning English Under The Palm Tree — Registration</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf3dd;
  --mint: #aacdb5;
  --deep: #00545f;
  --ink: #314f53;
  --gold: #f5c518;
  --green: #3a8a48;
  --green-2: #2d7a3a;
  --teal: #037f8f;
  --burgundy: #6f0828;
  --pink-card: #ef6464;
  --pink-edge: #f0a4a4;
  --line: #9e153f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--ink);
}
body { overflow-x: hidden; }

#welcomeScreen {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

.welcome-wrap {
  width: min(100%, 1100px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 26px;
  align-items: stretch;
}

.panel {
  min-height: 520px;
  border-radius: 34px;
  position: relative;
  border: 2px solid var(--deep);
  box-shadow: 14px 16px 0 rgba(49,79,83,0.28), 14px 18px 30px rgba(49,79,83,0.14);
  overflow: hidden;
}

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0) 35%, rgba(0,0,0,0.06));
  pointer-events: none;
}

.panel::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 32px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -8px 16px rgba(0,0,0,0.10);
  pointer-events: none;
}

.left-panel {
  background: var(--burgundy);
  border-color: #314f53;
}

.right-panel {
  background: var(--teal);
  border-color: var(--deep);
  padding: 28px 24px;
}

.reg-characters {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 84%;
  max-width: 430px;
  z-index: 2;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.24));
}

.reg-fly {
  position: absolute;
  right: -26px;
  top: 14px;
  width: 38%;
  max-width: 200px;
  z-index: 3;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.24));
}

.welcome-card {
  background: rgba(255,255,255,0.96);
  border-radius: 28px;
  padding: 24px 22px;
  width: 100%;
  max-width: 430px;
  min-height: 100%;
  margin: 0 auto;
  box-shadow: 0 12px 26px rgba(0,0,0,0.14);
  position: relative;
  z-index: 2;
  text-align: center;
  border: 2px solid rgba(170,205,181,0.9);
  display: flex;
  flex-direction: column;
}

.welcome-jojo {
  width: 120px;
  height: 120px;
  margin: 0 auto 10px;
  display: block;
  background: transparent;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
}

.welcome-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.35rem;
  color: var(--green-2);
  margin-bottom: 4px;
}

.welcome-sub {
  font-size: 0.8rem;
  color: #6b7f81;
  font-weight: 700;
  margin-bottom: 16px;
}

.welcome-bubble {
  background: linear-gradient(135deg, #f0fff4, #fff9c4);
  border: 2px solid var(--gold);
  border-radius: 16px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 0.86rem;
  font-weight: 700;
  color: #3a2800;
  line-height: 1.6;
  direction: rtl;
  text-align: right;
}

.form-board {
  background: var(--pink-card);
  border-radius: 0 34px 34px 0;
  padding: 26px 28px 30px;
  box-shadow: 14px 14px 0 var(--pink-edge);
  position: relative;
  overflow: visible;
}

.form-board::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 30%, rgba(0,0,0,0.03));
  pointer-events: none;
}

.field-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.field-img {
  position: relative;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-position: center;
  min-height: 96px;
  display: flex;
  align-items: center;
  padding: 18px 24px 20px;
}

.field-img.large {
  width: 82%;
  margin-left: auto;
}

.field-img.medium {
  width: 68%;
}

.field-row {
  display: grid;
  grid-template-columns: 0.92fr 1fr;
  gap: 18px;
  align-items: end;
}

.field-img.name { background-image: url('./popBname.png'); }
.field-img.school { background-image: url('./popBschool.png'); }
.field-img.grade { background-image: url('./popBgrade.png'); }
.field-img.icons { background-image: url('./popBicons.png'); cursor: pointer; }

.field-inner {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 8px;
}

.field-label {
  font-family: 'Fredoka One', cursive;
  font-size: 0.78rem;
  color: #220046;
  text-shadow: 2px 2px 0 #ff44d4;
  text-transform: lowercase;
  letter-spacing: 1px;
  text-align: left;
}

.field-control {
  border: none;
  background: transparent;
  outline: none;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: #4f1230;
  width: 100%;
  padding: 0 8px 8px 10px;
  border-bottom: 5px solid var(--line);
  caret-color: var(--deep);
}

.field-control::placeholder { color: rgba(79,18,48,0.35); }

.field-control.typing { animation: cursorBlink 1s steps(1) infinite; }

@keyframes cursorBlink {
  0%, 49% { box-shadow: inset -2px 0 0 transparent; }
  50%, 100% { box-shadow: inset -2px 0 0 var(--deep); }
}

.icon-choice-btn {
  border: none;
  background: transparent;
  min-height: 44px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: #220046;
  text-shadow: 2px 2px 0 #ff44d4;
  cursor: pointer;
  text-align: center;
}

.icon-preview {
  width: 62px;
  height: 62px;
  object-fit: contain;
}

.welcome-start-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(180deg, #7d79c7 0%, #6362a8 100%);
  color: white;
  border: none;
  border-radius: 999px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.05rem;
  cursor: pointer;
  transition: all 0.22s;
  box-shadow: 0 8px 0 #013a44, 10px 12px 0 rgba(0,58,68,0.78);
  letter-spacing: 0.4px;
  margin-top: 20px;
}

.welcome-start-btn:hover:not(:disabled) { transform: scale(1.04); }

.welcome-start-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.welcome-error {
  font-size: 0.78rem;
  color: #cc3322;
  font-weight: 700;
  text-align: right;
  direction: rtl;
  margin-top: 8px;
  display: none;
}

.icon-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.icon-modal.show { display: flex; }

.icon-modal-card {
  width: min(100%, 470px);
  background-image: url('./popupicon.png');
  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-position: center;
  min-height: 360px;
  padding: 36px 26px 30px;
  position: relative;
}

.icon-modal-title {
  font-family: 'Fredoka One', cursive;
  color: #220046;
  text-shadow: 2px 2px 0 #ff44d4;
  font-size: 1.1rem;
  margin-bottom: 18px;
  text-align: center;
}

.icon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.icon-item {
  border: 2px solid #d7e8dc;
  background: linear-gradient(180deg, #ffffff 0%, #fff7ef 100%);
  border-radius: 16px;
  min-height: 76px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  overflow: hidden;
  box-shadow:
    0 8px 0 rgba(120, 80, 80, 0.18),
    0 12px 20px rgba(0,0,0,0.10),
    inset 0 1px 0 rgba(255,255,255,0.9),
    inset 0 -6px 10px rgba(0,0,0,0.06);
  position: relative;
}

.icon-item::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 38%, rgba(0,0,0,0.05));
  pointer-events: none;
}

.icon-item img {
  width: 68px;
  height: 68px;
  object-fit: contain;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
  transition: transform 0.18s ease, filter 0.18s ease;
}

.icon-item:hover {
  transform: translateY(-4px) rotate(-1deg);
  border-color: #f5c518;
  box-shadow:
    0 10px 0 rgba(120, 80, 80, 0.18),
    0 18px 26px rgba(0,0,0,0.14),
    0 0 14px rgba(255, 214, 90, 0.28),
    inset 0 1px 0 rgba(255,255,255,0.95),
    inset 0 -6px 10px rgba(0,0,0,0.06);
  filter: saturate(1.06);
  animation: iconWiggle 0.32s ease-in-out;
}

.icon-item:hover img {
  transform: scale(1.06) translateY(-2px);
  filter: drop-shadow(0 12px 14px rgba(0,0,0,0.22));
}

.icon-close {
  margin-top: 16px;
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 12px;
  background: var(--deep);
  color: white;
  font-family: 'Fredoka One', cursive;
  cursor: pointer;
}

@keyframes iconWiggle {
  0% { transform: translateY(-4px) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-2deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
  75% { transform: translateY(-4px) rotate(-1deg); }
  100% { transform: translateY(-4px) rotate(0deg); }
}

@media (max-width: 900px) {
  #welcomeScreen { padding: 18px; }
  .welcome-wrap { grid-template-columns: 1fr; gap: 18px; }
  .panel { min-height: 360px; border-radius: 28px; }
  .panel::after { border-radius: 26px; }
  .left-panel { min-height: 300px; }
  .reg-characters { width: 78%; }
  .reg-fly { width: 30%; right: -10px; top: 8px; }
  .field-img.large, .field-img.medium { width: 100%; }
  .field-row { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 560px) {
  .field-row { grid-template-columns: 1fr; }
  .icon-modal-card { padding: 30px 18px 24px; }
}
</style>
<script src="public/js/palm-globe-fab.js" defer></script>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
</head>
<body>
<div id="welcomeScreen">
  <div class="welcome-wrap">
    <div class="panel left-panel">
      <img class="reg-characters" src="./ping0ne.png" alt="">
      <img class="reg-fly" src="./rocketboys.png" alt="">
    </div>

    <div class="panel right-panel">
      <div class="welcome-card">
        <model-viewer
          id="welcomeJojo"
          class="welcome-jojo"
          src="https://raw.githubusercontent.com/thuraya1988/123Learning-English-Under-The-Palm-Tre/main/jojosalute.glb"
          autoplay
          auto-rotate
          rotation-per-second="20deg"
          ar-status="not-presenting">
        </model-viewer>

        <div class="welcome-title">مرحباً! أنا جوجو!</div>
        <div class="welcome-sub">Let’s Learn English Under the Palm Tree</div>

        <div class="welcome-bubble">
          أهلاً وسهلاً!<br>
          سجّل بياناتك ثم اختَر أيقونتك الخاصة.
        </div>

        <div class="form-board">
          <div class="field-stack">
            <div class="field-img name large">
              <div class="field-inner">
                <div class="field-label">name:</div>
                <input class="field-control typing" id="wFullName" type="text" placeholder="" oninput="validateWelcome()">
              </div>
            </div>

            <div class="field-img school medium">
              <div class="field-inner">
                <div class="field-label">school:</div>
                <input class="field-control typing" id="wSchool" type="text" placeholder="" oninput="validateWelcome()">
              </div>
            </div>

            <div class="field-row">
              <div class="field-img grade">
                <div class="field-inner">
                  <div class="field-label">grade:</div>
                  <select class="field-control" id="wGrade" onchange="validateWelcome()">
                    <option value=""></option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                  </select>
                </div>
              </div>

              <div class="field-img icons" onclick="openIconModal()">
                <div class="field-inner">
                  <div class="field-label">icons</div>
                  <button type="button" class="icon-choice-btn" id="iconChoiceBtn">
                    <img class="icon-preview" id="iconPreview" src="./one.png" alt="icon">
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="welcome-error" id="wError">يرجى تعبئة الاسم والمدرسة والصف واختيار أيقونة</div>
          <button class="welcome-start-btn" id="wStartBtn" onclick="startApp()" disabled>Let’s Go!</button>
        </div>
      </div>
    </div>
  </div>

  <div class="icon-modal" id="iconModal">
    <div class="icon-modal-card">
      <div class="icon-modal-title">Choose your icon</div>
      <div class="icon-grid">
        <button class="icon-item" type="button" onclick="selectIcon('./one.png')"><img src="./one.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./two.png')"><img src="./two.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./three.png')"><img src="./three.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./four.png')"><img src="./four.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./fife.png')"><img src="./fife.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./six.png')"><img src="./six.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./seven.png')"><img src="./seven.png" alt=""></button>
        <button class="icon-item" type="button" onclick="selectIcon('./eight.png')"><img src="./eight.png" alt=""></button>
      </div>
      <button class="icon-close" type="button" onclick="closeIconModal()">Close</button>
    </div>
  </div>
</div>

<script>
let selectedIcon = './one.png';

function validateWelcome() {
  const fullName = document.getElementById('wFullName').value.trim();
  const school = document.getElementById('wSchool').value.trim();
  const grade = document.getElementById('wGrade').value;
  document.getElementById('wStartBtn').disabled = !(fullName && school && grade && selectedIcon);
}

function openIconModal() {
  document.getElementById('iconModal').classList.add('show');
}

function closeIconModal() {
  document.getElementById('iconModal').classList.remove('show');
}

function selectIcon(src) {
  selectedIcon = src;
  document.getElementById('iconPreview').src = src;
  closeIconModal();
  validateWelcome();
}

function startApp() {
  const fullName = document.getElementById('wFullName').value.trim();
  const school = document.getElementById('wSchool').value.trim();
  const grade = document.getElementById('wGrade').value;

  if (!fullName || !school || !grade || !selectedIcon) {
    document.getElementById('wError').style.display = 'block';
    return;
  }

  localStorage.setItem('studentFullName', fullName);
  localStorage.setItem('studentSchool', school);
  localStorage.setItem('studentGrade', grade);
  localStorage.setItem('studentIcon', selectedIcon);

  window.location.href = 'home.html';
}

window.addEventListener('click', (e) => {
  const modal = document.getElementById('iconModal');
  if (e.target === modal) closeIconModal();
});
</script>
</body>
</html>
