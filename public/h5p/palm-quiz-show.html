<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Palm Quiz Show</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --red:#e03030;    --redb:#ff6060;
  --blue:#1a6fd4;   --blueb:#60a8ff;
  --green:#1a9e52;  --greenb:#60d890;
  --gold:#d4880a;   --goldb:#ffcc40;
  --ink:#1a1a2e;    --white:#ffffff;
  --bg:#1a1a2e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body {
background: var(--bg);
font-family: 'Nunito', sans-serif;
min-height: 100vh;
color: var(--white);
overflow-x: hidden;
}

/* Animated star background */
body::before {
content: '';
position: fixed; inset: 0; z-index: 0;
background:
radial-gradient(ellipse 80% 50% at 20% 20%, rgba(26,111,212,.15) 0%, transparent 70%),
radial-gradient(ellipse 60% 40% at 80% 80%, rgba(26,158,82,.1) 0%, transparent 70%);
pointer-events: none;
}

/* BACK LINK */
.back-link {
position: fixed; top: 14px; left: 14px; z-index: 50;
color: rgba(255,255,255,.7); text-decoration: none;
font-size: .75rem; font-weight: 700;
background: rgba(255,255,255,.1); padding: 6px 12px;
border-radius: 20px; border: 1px solid rgba(255,255,255,.15);
}

/* ── LOBBY SCREEN ── */
#lobbyScreen {
position: relative; z-index: 1;
min-height: 100vh;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
padding: 24px;
}
.lobby-palm { font-size: 5rem; animation: sway 4s ease-in-out infinite; display: block; margin-bottom: 16px; }
@keyframes sway { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
.lobby-title { font-family: 'Fredoka One', cursive; font-size: clamp(2rem,8vw,3.5rem); color: var(--goldb); text-shadow: 0 4px 30px rgba(212,136,10,.4); margin-bottom: 8px; text-align: center; }
.lobby-sub { font-size: clamp(.85rem,2vw,1rem); color: rgba(255,255,255,.65); margin-bottom: 36px; text-align: center; font-style: italic; }

.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 480px; margin-bottom: 20px; }
.mode-btn {
padding: 18px 14px; border-radius: 20px; border: none; cursor: pointer;
font-family: 'Fredoka One', cursive; font-size: 1rem; color: white;
text-align: center; transition: all .25s; line-height: 1.35;
}
.mode-btn:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.mode-btn.m1 { background: linear-gradient(135deg, var(--red), #b02020); }
.mode-btn.m2 { background: linear-gradient(135deg, var(--blue), #1050a0); }
.mode-btn.m3 { background: linear-gradient(135deg, var(--green), #108040); }
.mode-btn.m4 { background: linear-gradient(135deg, var(--gold), #a06000); }
.mode-btn .mode-icon { font-size: 1.8rem; display: block; margin-bottom: 5px; }
.mode-btn .mode-sub  { font-size: .72rem; opacity: .82; display: block; margin-top: 3px; font-family: 'Nunito', sans-serif; font-weight: 600; }

/* ── GAME SCREEN ── */
#gameScreen { display: none; min-height: 100vh; position: relative; z-index: 1; }

/* TOP BAR */
.top-bar {
background: rgba(255,255,255,.06); backdrop-filter: blur(8px);
border-bottom: 1px solid rgba(255,255,255,.08);
padding: 10px 18px;
display: flex; align-items: center; justify-content: space-between; gap: 10px;
flex-wrap: wrap;
}
.tb-score { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: var(--goldb); }
.tb-streak { font-size: .85rem; font-weight: 800; color: rgba(255,255,255,.7); }
.tb-q { font-size: .78rem; color: rgba(255,255,255,.5); }

/* TIMER RING */
.timer-section { display: flex; flex-direction: column; align-items: center; padding: 16px 18px 8px; }
.timer-ring-wrap { position: relative; width: 80px; height: 80px; margin-bottom: 6px; }
.timer-ring-svg { width: 80px; height: 80px; transform: rotate(-90deg); }
.timer-track { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 6; }
.timer-fill  { fill: none; stroke: var(--goldb); stroke-width: 6; stroke-linecap: round;
stroke-dasharray: 201; /* circumference of r=32 circle */
transition: stroke-dashoffset .5s linear, stroke .3s;
}
.timer-num {
position: absolute; inset: 0;
display: flex; align-items: center; justify-content: center;
font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: white;
}

/* QUESTION */
.q-box {
background: rgba(255,255,255,.07); border-radius: 20px;
padding: 20px 20px; margin: 0 14px 16px;
text-align: center;
}
.q-tag { font-size: .68rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 8px; }
.q-text { font-family: 'Fredoka One', cursive; font-size: clamp(1.1rem,3.5vw,1.6rem); color: white; line-height: 1.35; }

/* ANSWER GRID -- classic 2×2 Kahoot layout */
.ans-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
padding: 0 14px 20px;
}
.ans-btn {
padding: 18px 12px;
border-radius: 18px; border: none; cursor: pointer;
font-family: 'Nunito', sans-serif; font-weight: 800;
font-size: clamp(.85rem,2.5vw,1rem);
color: white; text-align: center; line-height: 1.4;
transition: all .18s; position: relative;
display: flex; align-items: center; gap: 10px;
}
.ans-btn:hover:not(:disabled) { transform: scale(1.03); filter: brightness(1.12); }
.ans-btn:disabled { cursor: not-allowed; }
.ans-btn.a0 { background: var(--red); }
.ans-btn.a1 { background: var(--blue); }
.ans-btn.a2 { background: var(--green); }
.ans-btn.a3 { background: var(--gold); }
.ans-btn.dim { opacity: .35; transform: none !important; }
.ans-btn.correct { box-shadow: 0 0 0 4px white, 0 0 0 6px var(--greenb); animation: correctPop .4s cubic-bezier(.34,1.56,.64,1); }
.ans-btn.wrong   { box-shadow: 0 0 0 4px white, 0 0 0 6px var(--redb); animation: wrongShake .35s; }
@keyframes correctPop  { 0%{transform:scale(.9)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
@keyframes wrongShake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.ans-shape { font-size: 1.3rem; flex-shrink: 0; }
.ans-text  { flex: 1; }

/* FEEDBACK BANNER */
.fb-banner {
background: rgba(255,255,255,.08); border-radius: 16px;
padding: 14px 18px; margin: 0 14px 14px;
text-align: center; font-weight: 700; font-size: .9rem;
display: none; line-height: 1.55;
}
.fb-banner.ok { background: rgba(26,158,82,.25); border: 1.5px solid var(--greenb); display: block; }
.fb-banner.no { background: rgba(224,48,48,.2);  border: 1.5px solid var(--redb);   display: block; }
.fb-ar { font-size: .8rem; opacity: .75; direction: rtl; text-align: right; margin-top: 3px; }

.btn-next-q {
display: none; width: calc(100% - 28px); margin: 0 14px 20px;
background: linear-gradient(135deg, var(--green), var(--blue));
color: white; border: none;
font-family: 'Fredoka One', cursive; font-size: 1rem;
padding: 14px; border-radius: 18px; cursor: pointer;
box-shadow: 0 4px 18px rgba(0,0,0,.3); transition: all .25s;
}
.btn-next-q:hover { transform: translateY(-2px); }

/* ── WIN SCREEN ── */
#winScreen {
display: none; min-height: 100vh;
background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
position: relative; z-index: 1;
flex-direction: column; align-items: center; justify-content: center;
padding: 28px;
}
.win-confetti { font-size: 3rem; margin-bottom: 10px; animation: sway 3s ease-in-out infinite; display: block; }
.win-title { font-family: 'Fredoka One', cursive; font-size: clamp(1.8rem,6vw,3rem); color: var(--goldb); text-align: center; margin-bottom: 4px; }
.win-score { font-family: 'Fredoka One', cursive; font-size: clamp(2.5rem,8vw,4rem); color: white; margin: 10px 0; }
.win-stars { font-size: 2.5rem; margin-bottom: 10px; }
.win-msg { font-size: clamp(.88rem,2vw,1rem); color: rgba(255,255,255,.65); text-align: center; font-style: italic; margin-bottom: 28px; line-height: 1.6; max-width: 380px; }
.win-stats { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
.win-stat { text-align: center; background: rgba(255,255,255,.07); border-radius: 16px; padding: 14px 20px; }
.ws-val { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--goldb); }
.ws-lbl { font-size: .65rem; font-weight: 800; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
.btn-play-again {
background: linear-gradient(135deg, var(--gold), #a06000);
color: white; border: none;
font-family: 'Fredoka One', cursive; font-size: 1.1rem;
padding: 14px 40px; border-radius: 24px; cursor: pointer;
box-shadow: 0 6px 24px rgba(212,136,10,.4); transition: all .25s; margin: 6px;
}
.btn-play-again:hover { transform: translateY(-3px); }
.btn-back-lobby {
background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2);
color: rgba(255,255,255,.8);
font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .9rem;
padding: 12px 28px; border-radius: 20px; cursor: pointer; margin: 6px; transition: all .25s;
}
.btn-back-lobby:hover { background: rgba(255,255,255,.18); }

@media(max-width:380px) { .mode-grid{grid-template-columns:1fr} .ans-grid{grid-template-columns:1fr} }
</style>


<style>
#thurayaGuide{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:end;gap:12px;font-family:'Nunito',sans-serif}
#thurayaGuide .tg-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#fff}
#thurayaGuide .tg-panel{max-width:320px;background:rgba(255,255,255,.96);color:#1a1a2e;border-radius:18px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.06)}
#thurayaGuide .tg-name{font-weight:800;font-size:.95rem;margin-bottom:4px;color:#1a6fd4}
#thurayaGuide .tg-text{font-size:.9rem;line-height:1.5}
#thurayaGuide .tg-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#thurayaGuide button{border:none;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:.78rem}
#thurayaGuide .tg-play{background:#1a9e52;color:white}
#thurayaGuide .tg-mute{background:#eef3ff;color:#1a6fd4}
#thurayaGuide.min .tg-panel{display:none}
@media(max-width:640px){#thurayaGuide{right:10px;left:10px;bottom:10px;justify-content:end}#thurayaGuide .tg-avatar{width:74px;height:74px}#thurayaGuide .tg-panel{max-width:240px}}
</style>

</head>
<body>

<a class="back-link" href="index.html">← Home</a>

<!-- ── LOBBY ── -->

<div id="lobbyScreen">
  <span class="lobby-palm">🌴</span>
  <h1 class="lobby-title">Palm Quiz Show!</h1>
  <p class="lobby-sub">Fast quiz -- big fun -- real English! 🎉<br>اختر مودك وابدأ!</p>

  <div class="mode-grid">
    <button class="mode-btn m1" onclick="startGame('vocab')">
      <span class="mode-icon">📚</span>
      Vocabulary
      <span class="mode-sub">Words from all 12 stories</span>
    </button>
    <button class="mode-btn m2" onclick="startGame('grammar')">
      <span class="mode-icon">📌</span>
      Grammar
      <span class="mode-sub">Present · Past · Future</span>
    </button>
    <button class="mode-btn m3" onclick="startGame('characters')">
      <span class="mode-icon">👥</span>
      Characters
      <span class="mode-sub">Who said / did / is...</span>
    </button>
    <button class="mode-btn m4" onclick="startGame('mix')">
      <span class="mode-icon">🌴</span>
      Full Mix
      <span class="mode-sub">All topics -- hardest!</span>
    </button>
  </div>
</div>

<!-- ── GAME ── -->

<div id="gameScreen">
  <div class="top-bar">
    <div class="tb-score">⭐ <span id="tbScore">0</span></div>
    <div class="tb-streak" id="tbStreak"></div>
    <div class="tb-q" id="tbQ">Q 1 / 15</div>
  </div>

  <div class="timer-section">
    <div class="timer-ring-wrap">
      <svg class="timer-ring-svg" viewBox="0 0 80 80">
        <circle class="timer-track" cx="40" cy="40" r="32"/>
        <circle class="timer-fill" id="timerFill" cx="40" cy="40" r="32"/>
      </svg>
      <div class="timer-num" id="timerNum">10</div>
    </div>
  </div>

  <div class="q-box">
    <div class="q-tag" id="qTag"></div>
    <div class="q-text" id="qText"></div>
  </div>

  <div class="ans-grid" id="ansGrid"></div>
  <div class="fb-banner" id="fbBanner"></div>
  <button class="btn-next-q" id="btnNextQ" onclick="nextQ()">Next Question →</button>
</div>

<!-- ── WIN ── -->

<div id="winScreen">
  <span class="win-confetti">🌴</span>
  <div class="win-title" id="winTitle">Round Complete!</div>
  <div class="win-stars" id="winStars">⭐⭐⭐</div>
  <div class="win-score" id="winScore">0 pts</div>
  <div class="win-stats">
    <div class="win-stat"><div class="ws-val" id="wsCorrect">0</div><div class="ws-lbl">Correct</div></div>
    <div class="win-stat"><div class="ws-val" id="wsAcc">0%</div><div class="ws-lbl">Accuracy</div></div>
    <div class="win-stat"><div class="ws-val" id="wsTime">0s</div><div class="ws-lbl">Avg Time</div></div>
    <div class="win-stat"><div class="ws-val" id="wsStreak">0🔥</div><div class="ws-lbl">Best Streak</div></div>
  </div>
  <div class="win-msg" id="winMsg"></div>
  <button class="btn-play-again" onclick="replayMode()">🎲 Play Again</button>
  <button class="btn-back-lobby" onclick="goLobby()">← Change Mode</button>
</div>

<script>
// ════════════════════════════════════════════════════════════
// QUESTION BANK -- 4 modes × 15 questions each (60 total)
// Each Q: { q, opts:[4], answer, exp, expAr, tag, story }
// ════════════════════════════════════════════════════════════

const BANKS = {
  vocab: [
    {q:'What does FALAJ mean?', opts:['A palm tree','A water channel','A school','A market'], answer:'A water channel', tag:'Vocabulary', story:'Story 2', exp:'The falaj is the ancient water channel of Al-Qurawashiyah.', expAr:'الفلج هو قناة الماء القديمة في القرواشية.'},
    {q:'What does BRAVE mean?', opts:['Very tired','Not afraid of danger','Very loud','Running fast'], answer:'Not afraid of danger', tag:'Vocabulary', story:'Story 5', exp:'Brave = not afraid of danger. Mansoor was brave!', expAr:'brave = شجاع -- غير خائف من الخطر. منصور كان شجاعاً!'},
    {q:'What does HERITAGE mean?', opts:['A type of food','Culture passed down through generations','A school subject','A new invention'], answer:'Culture passed down through generations', tag:'Vocabulary', story:'Story 6', exp:'Heritage is culture and traditions passed from one generation to the next.', expAr:'التراث هو الثقافة والتقاليد التي تنتقل من جيل إلى آخر.'},
    {q:'What does PATIENT mean?', opts:['Moving very fast','Being very loud','Waiting calmly without complaining','Knowing everything'], answer:'Waiting calmly without complaining', tag:'Vocabulary', story:'Story 4', exp:'Patient = waiting calmly. John was very patient with his students.', expAr:'patient = صبور. جون كان صبوراً جداً مع طلابه.'},
    {q:'What does WISDOM mean?', opts:['A type of plant','Deep understanding and knowledge','A traditional food','A style of building'], answer:'Deep understanding and knowledge', tag:'Vocabulary', story:'Story 10', exp:'Wisdom = deep knowledge and good judgment. Khalaf had great wisdom.', expAr:'الحكمة = معرفة عميقة وحكم صحيح. كان لدى خلف حكمة عظيمة.'},
    {q:'What does RELIEF mean?', opts:['A type of spice','The feeling when danger is over','A traditional tool','A kind of music'], answer:'The feeling when danger is over', tag:'Vocabulary', story:'Story 5', exp:'Relief is the good feeling you have when something scary is over.', expAr:'الارتياح هو الشعور الجيد حين ينتهي شيء مخيف.'},
    {q:'What does HARVEST mean?', opts:['To plant seeds','To water trees','To collect crops from the farm','To build a house'], answer:'To collect crops from the farm', tag:'Vocabulary', story:'Story 8', exp:'Harvest = collect crops. Sadoo climbed the palm tree to harvest dates.', expAr:'الحصاد = جمع المحاصيل. سادو تسلّق النخلة ليحصد الرطب.'},
    {q:'What does NARROW mean?', opts:['Very wide','Not wide -- small path','Very tall','Very dark'], answer:'Not wide -- small path', tag:'Vocabulary', story:'Story 2', exp:'Narrow = not wide. The paths between the mud houses were narrow.', expAr:'ضيّق = غير عريض. كانت الممرات بين البيوت الطينية ضيّقة.'},
    {q:'What does INSPIRE mean?', opts:['To make someone tired','To make someone afraid','To make someone want to try harder','To make someone sleep'], answer:'To make someone want to try harder', tag:'Vocabulary', story:'Story 12', exp:'Inspire = encourage someone to try. Khamees inspired Mansoor to practise.', expAr:'يُلهم = يشجع أحداً على المحاولة. خميس ألهم منصور للتدرب.'},
    {q:'What does TRADITION mean?', opts:['Something new and modern','Something done for a long time','A type of machine','A kind of animal'], answer:'Something done for a long time', tag:'Vocabulary', story:'Story 6', exp:'Tradition = something done for a very long time. Omani names are a tradition.', expAr:'التقليد = شيء يُفعل منذ زمن طويل. الأسماء العُمانية تقليد.'},
    {q:'What does HESITATE mean?', opts:['To run very fast','To speak very loudly','To pause nervously before doing something','To laugh loudly'], answer:'To pause nervously before doing something', tag:'Vocabulary', story:'Story 11', exp:'Hesitate = pause before doing. Khamees hesitated before speaking.', expAr:'يتردد = يتوقف قبل الفعل. تردّد خميس قبل الكلام.'},
    {q:'What does IDENTITY mean?', opts:['A type of food','A kind of building','Who you are -- your name and story','A traditional tool'], answer:'Who you are -- your name and story', tag:'Vocabulary', story:'Story 6', exp:'Identity = who you are. Your name carries your identity in Oman.', expAr:'الهوية = من أنت. اسمك يحمل هويتك في عُمان.'},
    {q:'What does HUMBLE mean?', opts:['Very loud and proud','Modest -- not showing off','Always running','Very hungry'], answer:'Modest -- not showing off', tag:'Vocabulary', story:'Story 10', exp:'Humble = modest. Khalaf was quiet and humble despite his great knowledge.', expAr:'متواضع = لا يتباهى. كان خلف هادئاً ومتواضعاً رغم علمه الكبير.'},
    {q:'What does WONDER mean?', opts:['A type of food','A building material','A feeling of amazement','A kind of tool'], answer:'A feeling of amazement', tag:'Vocabulary', story:'Story 9', exp:'Wonder = amazement. The students felt wonder when they saw their photos.', expAr:'الدهشة = الإعجاب والذهول. شعر الطلاب بالدهشة حين رأوا صورهم.'},
    {q:'What does ANCESTOR mean?', opts:['A new invention','A family member from the past','A type of plant','A school subject'], answer:'A family member from the past', tag:'Vocabulary', story:'Story 6', exp:'Ancestor = a family member from the past. Omani names include ancestors.', expAr:'الجد = فرد من العائلة من الماضي. الأسماء العُمانية تتضمن الأجداد.'},
  ],

  grammar: [
    {q:'John ___ English every day.', opts:['teach','teaches','taught','is teach'], answer:'teaches', tag:'Simple Present', story:'Story 1', exp:'He/She/It → verb + s. "teaches" is correct.', expAr:'نضيف s للفعل مع he في المضارع البسيط.'},
    {q:'The wasp ___ on John\'s shoulder.', opts:['land','lands','landed','was land'], answer:'landed', tag:'Simple Past', story:'Story 5', exp:'land + ed = landed. Regular past tense verb.', expAr:'land فعل منتظم، ماضيه landed.'},
    {q:'Khamees ___ read perfectly one day.', opts:['will','is','was','does'], answer:'will', tag:'Simple Future', story:'Story 12', exp:'will + base verb = Simple Future.', expAr:'will + الفعل الأساسي = المستقبل البسيط.'},
    {q:'___ Sadoo know everyone in the village?', opts:['Do','Does','Did','Will'], answer:'Does', tag:'Questions', story:'Story 8', exp:'Does for He/She/It in Simple Present questions.', expAr:'Does للأسئلة مع he/she/it في المضارع البسيط.'},
    {q:'Uncle Nasser ___ them to the village.', opts:['drive','drives','drove','drived'], answer:'drove', tag:'Simple Past', story:'Story 6', exp:'drive → drove. Irregular past tense.', expAr:'drive فعل شاذ ماضيه drove.'},
    {q:'Sophia\'s face ___ bright yellow.', opts:['turn','turns','turned','was turn'], answer:'turned', tag:'Simple Past', story:'Story 7', exp:'turn + ed = turned. Regular past tense.', expAr:'turn فعل منتظم، ماضيه turned.'},
    {q:'Trust slowly ___ in the classroom.', opts:['grow','grows','grew','growed'], answer:'grew', tag:'Simple Past', story:'Story 4', exp:'grow → grew. Irregular past tense.', expAr:'grow فعل شاذ ماضيه grew.'},
    {q:'The falaj ___ water to the farms.', opts:['carry','carries','carried','is carry'], answer:'carries', tag:'Simple Present', story:'Story 2', exp:'carry → carries (y to ies) with It.', expAr:'carry تصبح carries مع it في المضارع البسيط.'},
    {q:'Mansoor ___ sit quietly in class.', opts:["don't","doesn't","didn't","won't"], answer:"doesn't", tag:'Simple Present Negative', story:'Story 3', exp:"doesn't = does not -- for He/She/It negatives.", expAr:"doesn't للنفي مع he/she/it في المضارع البسيط."},
    {q:'John ___ get a letter last week.', opts:["don't","doesn't","didn't","won't"], answer:"didn't", tag:'Simple Past Negative', story:'Story 1', exp:"didn't = did not -- for all subjects in Simple Past.", expAr:"didn't للنفي في الماضي البسيط مع جميع الضمائر."},
    {q:'___ did the wasp land?', opts:['What','Where','Who','How'], answer:'Where', tag:'Questions', story:'Story 5', exp:'Where asks about PLACE. The wasp landed on his shoulder.', expAr:'Where تستخدم للسؤال عن المكان.'},
    {q:'The children ___ "Good morning" together.', opts:['say','says','said','sayed'], answer:'said', tag:'Simple Past', story:'Story 3', exp:'say → said. Irregular past tense.', expAr:'say فعل شاذ ماضيه said.'},

  ],

// Mix = all three combined and shuffled
BANKS.mix = shuffle([...BANKS.vocab, ...BANKS.grammar, ...BANKS.characters]).slice(0, 20);

// ── SHAPES for the 4 answer buttons ──
const SHAPES = ['▲','⬟','●','■'];

// ── STATE ──
let pool = [];
let qIdx = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let correct = 0;
let answered = false;
let timerVal = 10;
let timerID  = null;
let totalTime = 0;
let currentMode = 'vocab';

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── START ──
function startGame(mode) {
  currentMode = mode;
  pool = shuffle([...BANKS[mode]]);
  if (mode !== 'mix') pool = pool.slice(0, 15);
  qIdx = 0; score = 0; streak = 0; bestStreak = 0; correct = 0; totalTime = 0; answered = false;

  document.getElementById('lobbyScreen').style.display = 'none';
  document.getElementById('winScreen').style.display   = 'none';
  document.getElementById('gameScreen').style.display  = 'block';

  showQ();
}

// ── SHOW QUESTION ──
function showQ() {
  if (qIdx >= pool.length) { showWin(); return; }
  answered = false;
  const q = pool[qIdx];
  const shuffledOpts = shuffle([...q.opts]);

  // Top bar
  document.getElementById('tbScore').textContent  = score;
  document.getElementById('tbQ').textContent      = `Q ${qIdx+1} / ${pool.length}`;
  document.getElementById('tbStreak').textContent = streak >= 3 ? `🔥 ${streak} streak!` : streak > 0 ? `✨ ${streak}` : '';

  // Question
  document.getElementById('qTag').textContent  = `${q.tag} * ${q.story}`;
  document.getElementById('qText').textContent = q.q;

  // Answers
  const COLORS = ['a0','a1','a2','a3'];
  document.getElementById('ansGrid').innerHTML = shuffledOpts.map((opt, i) =>
    `<button class="ans-btn ${COLORS[i]}" onclick="answer('${opt.replace(/'/g,"\\'").replace(/"/g,"&quot;")}',this)">
      <span class="ans-shape">${SHAPES[i]}</span>
      <span class="ans-text">${opt}</span>
    </button>`
  ).join('');

  // Feedback
  document.getElementById('fbBanner').className  = 'fb-banner';
  document.getElementById('fbBanner').innerHTML  = '';
  document.getElementById('btnNextQ').style.display = 'none';

  // Timer
  startTimer();
}

// ── TIMER ──
function startTimer() {
  timerVal = 10;
  clearInterval(timerID);
  updateTimerUI(10);

  timerID = setInterval(() => {
    timerVal--;
    totalTime++;
    updateTimerUI(timerVal);
    if (timerVal <= 0) {
      clearInterval(timerID);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimerUI(t) {
  document.getElementById('timerNum').textContent = t;
  // SVG circle animation: circumference = 2π×32 ≈ 201
  const offset = 201 - (201 * t / 10);
  const fill = document.getElementById('timerFill');
  fill.style.strokeDashoffset = offset;
  fill.style.stroke = t <= 3 ? '#ff6060' : t <= 5 ? '#ffcc40' : '#60d890';
}

// ── ANSWER ──
function answer(chosen, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerID);
  const q = pool[qIdx];
  const isOk = chosen === q.answer;

  // Style buttons
  document.querySelectorAll('.ans-btn').forEach(b => {
    b.disabled = true;
    const isCorrectBtn = b.querySelector('.ans-text').textContent === q.answer;
    if (isCorrectBtn) b.classList.add('correct');
    else if (b === btn && !isOk) b.classList.add('wrong');
    else if (!isCorrectBtn) b.classList.add('dim');
  });

  if (isOk) {
    streak++;
    correct++;
    if (streak > bestStreak) bestStreak = streak;
    const pts = 100 + (timerVal * 20) + (streak >= 3 ? 50 : 0);
    score += pts;
    showFb('ok', `✅ Correct! +${pts} pts ${streak>=3?'🔥 STREAK BONUS!':''}`, q.exp, q.expAr);
  } else {
    streak = 0;
    showFb('no', `❌ Answer: "${q.answer}"`, q.exp, q.expAr);
  }

  document.getElementById('tbScore').textContent  = score;
  document.getElementById('tbStreak').textContent = streak >= 3 ? `🔥 ${streak} streak!` : '';
  document.getElementById('btnNextQ').style.display = 'block';
}

function timeUp() {
  answered = true;
  streak = 0;
  const q = pool[qIdx];
  document.querySelectorAll('.ans-btn').forEach(b => {
    b.disabled = true;
    const isCorrectBtn = b.querySelector('.ans-text').textContent === q.answer;
    if (isCorrectBtn) b.classList.add('correct');
    else b.classList.add('dim');
  });
  showFb('no', `⏰ Time up! Answer: "${q.answer}"`, q.exp, q.expAr);
  document.getElementById('tbStreak').textContent = '';
  document.getElementById('btnNextQ').style.display = 'block';
}

function showFb(cls, msg, exp, expAr) {
  const fb = document.getElementById('fbBanner');
  fb.className = 'fb-banner ' + cls;
  fb.innerHTML = `${msg}<br><span style="font-size:.8rem;font-weight:600;opacity:.85">${exp}</span><div class="fb-ar">${expAr}</div>`;
}

function nextQ() {
  qIdx++;
  showQ();
}

// ── WIN ──
function showWin() {
  clearInterval(timerID);
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('winScreen').style.display  = 'flex';

  const pct = Math.round(correct / pool.length * 100);
  const avgTime = pool.length > 0 ? Math.round(totalTime / pool.length) : 0;

  document.getElementById('winScore').textContent   = score + ' pts';
  document.getElementById('wsCorrect').textContent  = correct + '/' + pool.length;
  document.getElementById('wsAcc').textContent      = pct + '%';
  document.getElementById('wsTime').textContent     = avgTime + 's';
  document.getElementById('wsStreak').textContent   = bestStreak + '🔥';

  const stars = pct === 100 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  document.getElementById('winStars').textContent   = stars;

  const titles = { vocab:'Vocabulary Master! 📚', grammar:'Grammar Champion! 📌', characters:'Character Expert! 👥', mix:'Palm Tree Master! 🌴' };
  document.getElementById('winTitle').textContent   = titles[currentMode] || 'Round Complete!';

  const msg = pct === 100 ? '🌟 Perfect score! Every answer was correct -- amazing!'
            : pct >= 80   ? '🌴 Excellent! You really know these stories!'
            : pct >= 60   ? '✦ Good job! A few more rounds and you\'ll master it!'
            :               '💪 Keep going -- every question teaches you something!';
  document.getElementById('winMsg').textContent = msg;
}

function replayMode() { startGame(currentMode); }
function goLobby() {
  document.getElementById('winScreen').style.display   = 'none';
  document.getElementById('lobbyScreen').style.display = 'flex';
}
</script>


<div id="thurayaGuide">
  <div class="tg-panel">
    <div class="tg-name">Thuraya Guide | ثريا</div>
    <div class="tg-text" id="thurayaText">Hello! Choose a quiz mode, and I'll help you step by step. هيا نبدأ واختاري مود اللعب.</div>
    <div class="tg-actions">
      <button class="tg-play" id="thurayaReplay">🔊 Replay</button>
      <button class="tg-mute" id="thurayaMute">Mute</button>
    </div>
  </div>
  <img class="tg-avatar" src="thuraya-reference.png" alt="Thuraya guide"/>
</div>


<script>
(function(){
  const thurayaState={muted:false,lastText:''};
  const thurayaLines={
    welcome:"Hello! Choose a quiz mode, and I'll help you step by step. هيا نبدأ واختاري مود اللعب.",
    mode:"Great choice! Read carefully and answer quickly. اختيار ممتاز. ركزي وأجيبي بسرعة.",
    question:"Read the question, then choose the best answer. اقرئي السؤال ثم اختاري أفضل إجابة.",
    correct:"Excellent! That is correct. ممتاز، هذه هي الإجابة الصحيحة.",
    wrong:"Not this one. Let's try the next question. ليست هذه. نحاول في السؤال التالي.",
    timeout:"Time is up. Breathe, then try again. انتهى الوقت. خذي نفسًا وحاولي من جديد.",
    win:"Wonderful work! You finished the quiz. عمل رائع! أنهيتِ المسابقة."
  };
  function speak(text){
    thurayaState.lastText=text;
    const box=document.getElementById('thurayaText');
    if(box) box.textContent=text;
    if(thurayaState.muted) return;
    if(window.speechSynthesis){
      try{
        window.speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang = /[\u0600-\u06FF]/.test(text) ? 'ar-SA' : 'en-US';
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
    // Piper-ready hook
    if(window.fetch && window.PIPER_TTS_ENDPOINT){
      fetch(window.PIPER_TTS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).catch(()=>{});
    }
  }
  window.PIPER_TTS_ENDPOINT='/api/tts';
  window.thurayaSpeak=speak;
  document.addEventListener('click',function(e){
    if(e.target && e.target.id==='thurayaReplay') speak(thurayaState.lastText||thurayaLines.welcome);
    if(e.target && e.target.id==='thurayaMute'){
      thurayaState.muted=!thurayaState.muted;
      e.target.textContent=thurayaState.muted?'Unmute':'Mute';
      if(thurayaState.muted && window.speechSynthesis) window.speechSynthesis.cancel();
    }
  });
  const originalStartGame=window.startGame;
  if(originalStartGame){
    window.startGame=function(mode){
      speak(thurayaLines.mode);
      return originalStartGame.apply(this,arguments);
    }
  }
  const originalShowQ=window.showQ;
  if(originalShowQ){
    window.showQ=function(){
      const result=originalShowQ.apply(this,arguments);
      setTimeout(()=>speak(thurayaLines.question),120);
      return result;
    }
  }
  const originalAnswer=window.answer;
  if(originalAnswer){
    window.answer=function(idx){
      const beforeQ = window.currentQIndex;
      const result=originalAnswer.apply(this,arguments);
      setTimeout(()=>{
        const fb = document.querySelector('.fb-banner');
        const txt = fb ? fb.textContent.toLowerCase() : '';
        if(txt.includes('correct') || txt.includes('ممتاز')) speak(thurayaLines.correct);
        else speak(thurayaLines.wrong);
      },180);
      return result;
    }
  }
  const originalTimeUp=window.timeUp;
  if(originalTimeUp){
    window.timeUp=function(){
      speak(thurayaLines.timeout);
      return originalTimeUp.apply(this,arguments);
    }
  }
  const originalShowWin=window.showWin;
  if(originalShowWin){
    window.showWin=function(){
      const result=originalShowWin.apply(this,arguments);
      setTimeout(()=>speak(thurayaLines.win),150);
      return result;
    }
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>speak(thurayaLines.welcome),250));
})();
</script>
