<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Sentence Scramble</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --green:#2d9e62; --greenl:#e8fdf2; --greenb:#7dd4a8;
  --blue:#2878c4;  --bluel:#e6f4ff;  --blueb:#7ac0f0;
  --gold:#d08000;  --goldl:#fff4e0;  --goldb:#f0c060;
  --purple:#7040c0;--purplel:#f2ecff;--purpleb:#b090e0;
  --red:#c04040;   --redl:#fff0f0;   --redb:#f09090;
  --ink:#1a2030;   --bg:#f0f7ff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Nunito',sans-serif;min-height:100vh;padding:14px 14px 60px}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,var(–green),var(–blue));border-radius:22px;padding:18px 20px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.header::before{content:’’;position:absolute;inset:0;background:url(“data:image/svg+xml,%3Csvg width=‘60’ height=‘60’ viewBox=‘0 0 60 60’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Ccircle cx=‘30’ cy=‘30’ r=‘20’ fill=‘none’ stroke=’%23ffffff08’ stroke-width=‘1’/%3E%3C/svg%3E”) repeat;pointer-events:none}
.header h1{font-family:‘Fredoka One’,cursive;font-size:clamp(1.2rem,4vw,1.8rem);color:white;text-shadow:0 2px 10px rgba(0,0,0,.2);position:relative}
.header p{font-size:0.8rem;color:rgba(255,255,255,.82);margin-top:3px;position:relative}
.back-link{position:absolute;top:12px;left:14px;z-index:2;color:rgba(255,255,255,.8);text-decoration:none;font-size:0.75rem;font-weight:700;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px}

/* ── SCOREBOARD ── */
.scoreboard{background:white;border-radius:18px;padding:12px 18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px}
.sc-item{text-align:center}
.sc-val{font-family:‘Fredoka One’,cursive;font-size:1.5rem;line-height:1}
.sc-lbl{font-size:0.62rem;font-weight:800;color:#90a0b8;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sc-div{width:1px;background:#e8eef4}

/* ── LEVEL PILLS ── */
.level-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.lvl-btn{padding:9px 20px;border-radius:20px;font-size:0.82rem;font-weight:800;cursor:pointer;border:2.5px solid transparent;transition:all 0.2s;font-family:‘Nunito’,sans-serif}
.lvl-btn.l1{background:var(–greenl);color:var(–green);border-color:var(–greenb)}
.lvl-btn.l2{background:var(–bluel);color:var(–blue);border-color:var(–blueb)}
.lvl-btn.l3{background:var(–goldl);color:var(–gold);border-color:var(–goldb)}
.lvl-btn.active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12);color:white}
.lvl-btn.l1.active{background:var(–green)}
.lvl-btn.l2.active{background:var(–blue)}
.lvl-btn.l3.active{background:var(–gold)}

/* ── PROGRESS ── */
.progress-wrap{background:#e0eaf4;border-radius:20px;height:8px;overflow:hidden;margin-bottom:16px;max-width:680px;margin-left:auto;margin-right:auto}
.progress-bar{height:100%;background:linear-gradient(90deg,var(–green),var(–blue));border-radius:20px;transition:width .5s ease}

/* ── QUESTION CARD ── */
.q-card{background:white;border-radius:24px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.07);max-width:680px;margin:0 auto 14px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.q-tag{font-family:‘Fredoka One’,cursive;font-size:.75rem;color:white;padding:4px 14px;border-radius:20px}
.q-meta{font-size:.68rem;color:#90a0b8;font-weight:700}

/* ── TIMER ── */
.timer-wrap{background:#e8eef4;border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px}
.timer-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(–green),var(–blue));transition:width .5s linear}
.timer-bar.warn{background:linear-gradient(90deg,#e06820,var(–red))}

/* ── CONTEXT CLUE ── */
.context-clue{
background:var(–goldl);border:2px solid var(–goldb);
border-radius:14px;padding:10px 14px;
font-size:.84rem;font-weight:700;color:#5a3800;
margin-bottom:14px;line-height:1.5;
}
.context-clue .clue-label{font-size:.65rem;font-weight:800;color:var(–gold);text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:3px}
.context-clue .clue-ar{direction:rtl;text-align:right;font-style:italic;opacity:.7;margin-top:4px;font-size:.8rem}

/* ── DROP ZONE ── */
.drop-zone{
min-height:56px;
background:var(–bluel);
border:2.5px dashed var(–blueb);
border-radius:16px;
padding:10px 12px;
display:flex;flex-wrap:wrap;gap:7px;align-items:center;
margin-bottom:12px;
transition:all .2s;
}
.drop-zone.drag-over{border-color:var(–blue);background:#d4eaff}
.drop-zone.correct{background:var(–greenl);border-color:var(–green);border-style:solid}
.drop-zone.wrong  {background:var(–redl);border-color:var(–red);border-style:solid;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.drop-zone-hint{font-size:.8rem;color:rgba(40,120,196,.5);font-style:italic;padding:4px}

/* ── WORD CHIPS ── */
.chip{
padding:8px 14px;border-radius:20px;
font-weight:800;font-size:.88rem;
cursor:grab;user-select:none;
transition:all .18s;display:inline-flex;
align-items:center;gap:5px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.chip:active{cursor:grabbing;transform:scale(1.06)}
/* chips in the bank are blue-ish */
.chip.bank{background:linear-gradient(135deg,#7ac0f0,#2878c4);color:white}
.chip.bank:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(40,120,196,.3)}
/* chips placed in drop zone are green-ish */
.chip.placed{background:linear-gradient(135deg,#7dd4a8,#2d9e62);color:white;cursor:pointer}
.chip.placed:hover{opacity:.8}
/* chips after correct reveal */
.chip.revealed{background:linear-gradient(135deg,var(–greenl),#d4f5e4);color:var(–green);border:1.5px solid var(–greenb);cursor:default;box-shadow:none}

/* ── WORD BANK ── */
.bank-wrap{background:#f8fbff;border:2px solid #d0dce8;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.bank-label{font-size:.68rem;font-weight:800;color:#5080a0;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.bank-chips{display:flex;flex-wrap:wrap;gap:7px}

/* ── BUTTONS ── */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn-check{background:linear-gradient(135deg,var(–green),var(–blue));color:white;border:none;font-family:‘Fredoka One’,cursive;font-size:.95rem;padding:11px 26px;border-radius:18px;cursor:pointer;box-shadow:0 4px 14px rgba(40,120,196,.2);transition:all .25s}
.btn-check:hover{transform:translateY(-2px)}
.btn-clear{background:#f0f4f8;border:none;color:#7090a8;font-family:‘Nunito’,sans-serif;font-weight:700;font-size:.82rem;padding:10px 18px;border-radius:16px;cursor:pointer}
.btn-next{background:linear-gradient(135deg,var(–gold),#e06820);color:white;border:none;font-family:‘Fredoka One’,cursive;font-size:.95rem;padding:11px 26px;border-radius:18px;cursor:pointer;display:none;transition:all .25s}
.btn-next:hover{transform:translateY(-2px)}

/* ── FEEDBACK ── */
.feedback{border-radius:14px;padding:11px 16px;font-weight:700;font-size:.87rem;display:none;margin-top:10px;line-height:1.55}
.feedback.ok{background:var(–greenl);border:2px solid var(–greenb);color:var(–green);display:block}
.feedback.no{background:var(–redl);border:2px solid var(–redb);color:var(–red);display:block}
.feedback-ar{font-size:.8rem;opacity:.75;direction:rtl;text-align:right;margin-top:3px}

/* ── WIN ── */
#winOverlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.55);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
#winOverlay.show{display:flex}
.win-card{background:white;border-radius:26px;padding:36px 28px;text-align:center;width:100%;max-width:380px;animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-palm{font-size:3.5rem;animation:sway 4s ease-in-out infinite;display:block;margin-bottom:8px}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.win-title{font-family:‘Fredoka One’,cursive;font-size:1.8rem;color:var(–green);margin-bottom:6px}
.win-score{font-family:‘Fredoka One’,cursive;font-size:2.8rem;color:var(–blue);margin:8px 0}
.win-msg{font-size:.9rem;color:#5080a0;font-style:italic;margin-bottom:20px;line-height:1.6}
.btn-again{background:linear-gradient(135deg,var(–green),var(–blue));color:white;border:none;font-family:‘Nunito’,sans-serif;font-weight:800;font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;margin:4px;transition:all .25s}
.btn-again:hover{transform:translateY(-3px)}
</style>


<!-- Palm Palette Theme (strong override) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style id="palm-palette-theme">
/* PALM-PALETTE-THEME */
:root{
  --brown-dark:#473624;
  --cream:#f3ecda;
  --tan:#ab997e;
  --brown-deep:#38170f;
  --font-title:'Cormorant Garamond',serif;
  --font-body:'Lora',Georgia,serif;
  --font-label:'Cinzel',serif;
  --font-arabic:'Aref Ruqaa',serif;
  --bevel:14px;
  /* Override common game variables -> palm palette */
  --bg:#f3ecda; --bg2:#e8e0d0; --bg-deep:#f3ecda; --bg-light:#faf6ef;
  --red:#38170f; --redb:#5a2515; --redl:#f3ecda;
  --blue:#473624; --blueb:#ab997e; --bluel:#f3ecda;
  --green:#ab997e; --greenb:#c4b59a; --greenl:#f3ecda;
  --gold:#473624; --goldb:#ab997e; --goldl:#f3ecda;
  --purple:#38170f; --purpleb:#5a2515;
  --ink:#473624; --white:#f3ecda; --black:#1a1208;
  --primary:#38170f; --secondary:#ab997e;
  --accent:#38170f; --accent-gold:#473624;
  --burgundy:#38170f; --deep-green:#473624;
  --text:#473624; --text-light:#5e4d35; --text-muted:#7a6850;
}
html,body{
  background:var(--cream)!important;
  color:var(--brown-dark)!important;
  font-family:var(--font-body)!important;
}
h1,h2,h3,h4,h5,h6{
  font-family:var(--font-title)!important;
  color:var(--brown-dark)!important;
  letter-spacing:.04em;
}
h3{font-family:var(--font-label)!important;text-transform:uppercase;letter-spacing:.18em;font-size:.85rem!important;color:var(--brown-deep)!important;opacity:.85}
p,li,span:not(.emoji):not(.icon),div,label{font-family:var(--font-body),Georgia,serif}
[dir="rtl"],.arabic,.ar{font-family:var(--font-arabic),serif!important}
a{color:var(--brown-deep)!important;text-decoration:none;border-bottom:1px solid var(--tan)}
a:hover{color:var(--brown-dark)!important;border-bottom-color:var(--brown-dark)}
hr{border-color:var(--tan)!important;opacity:.6}
.card,.box,.panel,.container,.tile,.option,.choice,.cell,.pad,.tray,
button,.btn,.button,input[type="button"],input[type="submit"]{
  clip-path:polygon(var(--bevel) 0,100% 0,100% calc(100% - var(--bevel)),calc(100% - var(--bevel)) 100%,0 100%,0 var(--bevel));
  border-radius:0!important;
}
.card,.box,.panel,.container,.tile,.tray{
  background:rgba(171,153,126,.12)!important;
  border:1px solid var(--tan)!important;
  color:var(--brown-dark)!important;
}
button,.btn,.button,input[type="button"],input[type="submit"]{
  background:var(--brown-deep)!important;
  color:var(--cream)!important;
  border:1px solid var(--brown-dark)!important;
  font-family:var(--font-label)!important;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.8em 1.4em;
  cursor:pointer;
  transition:background .25s ease,color .25s ease;
}
button:hover,.btn:hover,.button:hover{background:var(--tan)!important;color:var(--brown-dark)!important}
input[type="text"],input[type="number"],input[type="email"],textarea,select{
  background:rgba(243,236,218,.6)!important;
  border:1px solid var(--tan)!important;
  color:var(--brown-dark)!important;
  font-family:var(--font-body)!important;
  padding:.5em .8em;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  border-radius:0!important;
}
[class*="bg-red"],[class*="bg-blue"],[class*="bg-green"],[class*="bg-purple"],
[class*="bg-yellow"],[class*="bg-orange"]{
  background:var(--brown-deep)!important;color:var(--cream)!important;
}
[class*="bg-white"],[class*="bg-gray"],[class*="bg-cream"]{
  background:var(--cream)!important;color:var(--brown-dark)!important;
}
[class*="text-red"],[class*="text-blue"],[class*="text-green"],[class*="text-purple"]{
  color:var(--brown-deep)!important;
}
</style>

</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← Home</a>
  <h1>🔀 Sentence Scramble</h1>
  <p>Drag the words to build the correct sentence! 🌴</p>
</div>

<div class="scoreboard">
  <div class="sc-item"><div class="sc-val" id="scScore"  style="color:var(--green)">0</div><div class="sc-lbl">Score</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scStreak" style="color:var(--gold)">0🔥</div><div class="sc-lbl">Streak</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scQ"      style="color:var(--blue)">0/0</div><div class="sc-lbl">Done</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scTime"   style="color:var(--purple)">0s</div><div class="sc-lbl">Time</div></div>
</div>

<div class="level-row">
  <button class="lvl-btn l1 active" id="lvl1" onclick="startLevel(1)">🌱 Level 1 — Simple (3–5 words)</button>
  <button class="lvl-btn l2"        id="lvl2" onclick="startLevel(2)">🌴 Level 2 — Medium (5–7 words)</button>
  <button class="lvl-btn l3"        id="lvl3" onclick="startLevel(3)">⭐ Level 3 — Advanced (7–10 words)</button>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

<div id="qArea"></div>

<div id="winOverlay">
  <div class="win-card">
    <span class="win-palm">🌴</span>
    <div class="win-title">All Sentences Built!</div>
    <div class="win-score" id="winScore">0 pts</div>
    <div class="win-msg" id="winMsg"></div>
    <button class="btn-again" onclick="startLevel(currentLevel)">🔄 Play Again</button>
    <button class="btn-again" style="background:linear-gradient(135deg,var(--gold),#e06820)" onclick="nextLevel()">Next Level →</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SENTENCE SCRAMBLE — DATA
//
// Each sentence has:
//   words     : the correct order array
//   context   : English clue about the sentence
//   contextAr : Arabic clue
//   grammar   : grammar point being practised
//   story     : source story
//   tagColor  : colour for the tag badge
//
// The game shuffles the words, shows them as draggable chips,
// and the student must drag them into the correct order.
// ══════════════════════════════════════════════════════

const SENTENCES = {

  // ── LEVEL 1: Short, simple (3–5 words) ──────────────
  1: [
    { words:['John','teaches','English'], context:'What does John do every day?', contextAr:'ماذا يفعل جون كل يوم؟', grammar:'Simple Present — He/She/It', story:'Story 1', tagColor:'#2d9e62' },
    { words:['The','wasp','landed'], context:'What happened to the wasp in Story 5?', contextAr:'ماذا حدث للدبّور في القصة الخامسة؟', grammar:'Simple Past — irregular', story:'Story 5', tagColor:'#d08000' },
    { words:['Trust','grew','slowly'], context:'What happened in the classroom day by day?', contextAr:'ماذا حدث في الصف يوماً بعد يوم؟', grammar:'Simple Past — irregular', story:'Story 4', tagColor:'#d08000' },
    { words:["Don't","move!"], context:'What did Thuraya say when the wasp appeared?', contextAr:'ماذا قالت ثريا حين ظهر الدبّور؟', grammar:'Imperative', story:'Story 5', tagColor:'#c04040' },
    { words:['Malood','eats','papers'], context:'What is Malood famous for doing?', contextAr:'بماذا يشتهر مالود؟', grammar:'Simple Present — He/She/It', story:'All', tagColor:'#2d9e62' },
    { words:['Khamees','came','early'], context:'When did Khamees arrive at school?', contextAr:'متى وصل خميس إلى المدرسة؟', grammar:'Simple Past — irregular', story:'Story 12', tagColor:'#d08000' },
    { words:['Sophia','smiled'], context:'How did Sophia react to John\'s news?', contextAr:'كيف ردّت صوفيا على خبر جون؟', grammar:'Simple Past — regular', story:'Story 1', tagColor:'#d08000' },
    { words:['The','falaj','flows'], context:'What does the falaj do every day?', contextAr:'ماذا يفعل الفلج كل يوم؟', grammar:'Simple Present — It', story:'Story 2', tagColor:'#2d9e62' },
  ],

  // ── LEVEL 2: Medium (5–7 words) ──────────────────────
  2: [
    { words:['John','received','a','letter','from','Oman'], context:'How did John\'s adventure begin?', contextAr:'كيف بدأت مغامرة جون؟', grammar:'Simple Past — irregular', story:'Story 1', tagColor:'#d08000' },
    { words:["Sophia's",'face','turned','bright','yellow'], context:'What happened after Marhoona applied the mixture?', contextAr:'ماذا حدث بعد أن وضعت مرهونة الخليط؟', grammar:'Simple Past — regular', story:'Story 7', tagColor:'#d08000' },
    { words:['Mansoor','picked','up','a','thin','stick'], context:'What did Mansoor do when the wasp appeared?', contextAr:'ماذا فعل منصور حين ظهر الدبّور؟', grammar:'Simple Past — regular', story:'Story 5', tagColor:'#d08000' },
    { words:['The','palm','tree','gives','shade','and','dates'], context:'What does نخلة الفرض give to the village?', contextAr:'ماذا تعطي نخلة الفرض للقرية؟', grammar:'Simple Present — It', story:'All', tagColor:'#2d9e62' },
    { words:['Khamees','said','I','can','watch'], context:'What was Khamees\'s famous answer?', contextAr:'ما كانت إجابة خميس المشهورة؟', grammar:'Simple Past + can', story:'Story 11', tagColor:'#7040c0' },
    { words:['Uncle','Nasser','drove','them','to','the','village'], context:'How did everyone get to Al-Qurawashiyah?', contextAr:'كيف وصل الجميع إلى القرواشية؟', grammar:'Simple Past — irregular', story:'Story 6', tagColor:'#d08000' },
    { words:['The','children','sat','under','the','palm','tree'], context:'Where was the first lesson held?', contextAr:'أين عُقد الدرس الأول؟', grammar:'Simple Past — irregular', story:'Story 3', tagColor:'#d08000' },
    { words:['Sadoo','has','a','shop','and','a','sewing','workshop'], context:'What makes Sadoo the village superhero?', contextAr:'ما الذي يجعل سادو بطل القرية؟', grammar:'Simple Present — He has', story:'Story 8', tagColor:'#2d9e62' },
  ],

  // ── LEVEL 3: Advanced (7–10 words) ───────────────────
  3: [
    { words:['Watching','is','learning','said','Khamees','quietly'], context:'What is the most famous sentence from Story 11?', contextAr:'ما أشهر جملة في القصة الحادية عشرة؟', grammar:'Subject + verb + object', story:'Story 11', tagColor:'#7040c0' },
    { words:['The','falaj','carries','water','stories','and','memories'], context:'What does the falaj carry beyond just water?', contextAr:'ماذا يحمل الفلج بعيداً عن الماء؟', grammar:'Simple Present — It + list', story:'Story 2', tagColor:'#2d9e62' },
    { words:['John','taught','English','and','learned','Arabic','by','accident'], context:'What happened to John without him planning it?', contextAr:'ماذا حدث لجون بدون تخطيط منه؟', grammar:'Simple Past — irregular × 2', story:'Story 8', tagColor:'#d08000' },
    { words:['Thuraya','waited','at','the','airport','calm','and','confident'], context:'How did Thuraya welcome John and Sophia?', contextAr:'كيف استقبلت ثريا جون وصوفيا؟', grammar:'Simple Past + adjectives', story:'Story 1', tagColor:'#d08000' },
    { words:['Does','Sadoo','own','the','shop','or','does','the','shop','own','Sadoo'], context:'The famous funny question about Sadoo — what is it?', contextAr:'السؤال المضحك الشهير عن سادو — ما هو؟', grammar:'Present question — Does…', story:'All', tagColor:'#2878c4' },
    { words:['Every','morning','Khamees','came','early','and','practised','his','letters'], context:'What was Khamees\'s daily routine before school?', contextAr:'ما كانت روتين خميس اليومي قبل المدرسة؟', grammar:'Simple Past — habitual action', story:'Story 12', tagColor:'#d08000' },
    { words:['The','class','exploded','with','laughter','and','relief'], context:'What happened after the wasp finally flew away?', contextAr:'ماذا حدث بعد أن طار الدبّور أخيراً؟', grammar:'Simple Past — irregular', story:'Story 5', tagColor:'#d08000' },
    { words:['Nasser','drives','even','when','the','road','is','still','thinking','about','existing'], context:'What is the funniest thing about Nasser and his pickup?', contextAr:'ما الأمر الأكثر مضحكاً في ناصر وبيك أبه؟', grammar:'Simple Present — mixed', story:'All', tagColor:'#2d9e62' },
  ]
};

// ── STATE ──
let currentLevel = 1;
let pool = [];
let qIdx = 0;
let score = 0;
let streak = 0;
let correct = 0;
let answered = false;
let timerSec = 0;
let timerID = null;
// For drag tracking
let draggedChip = null;
let dragSource  = null; // 'bank' or 'drop'

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startLevel(lvl) {
  currentLevel = lvl;
  [1,2,3].forEach(i => document.getElementById('lvl'+i).classList.toggle('active', i === lvl));
  pool = shuffle([...SENTENCES[lvl]]);
  qIdx = 0; score = 0; streak = 0; correct = 0; answered = false;
  timerSec = 0;
  clearInterval(timerID);
  timerID = setInterval(() => {
    timerSec++;
    document.getElementById('scTime').textContent = timerSec + 's';
  }, 1000);
  showQ();
  updateScoreboard();
}

function showQ() {
  if (qIdx >= pool.length) { showWin(); return; }
  answered = false;
  const s = pool[qIdx];
  const scrambled = shuffle([...s.words]);
  updateProgress();

  const html = `
    <div class="q-card">
      <div class="q-top">
        <div>
          <span class="q-tag" style="background:${s.tagColor}">${s.grammar}</span>
          <div class="q-meta" style="margin-top:3px">${s.story}</div>
        </div>
        <span class="q-meta">Q ${qIdx+1} / ${pool.length}</span>
      </div>

      <div class="timer-wrap"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>

      <div class="context-clue">
        <span class="clue-label">💡 Context clue</span>
        ${s.context}
        <div class="clue-ar">${s.contextAr}</div>
      </div>

      <!-- Drop zone: where the student builds the sentence -->
      <div class="drop-zone" id="dropZone"
        ondragover="ev.preventDefault();ev.currentTarget.classList.add('drag-over')"
        ondragleave="ev.currentTarget.classList.remove('drag-over')"
        ondrop="onDropZone(event)">
        <span class="drop-zone-hint" id="dzHint">Drag words here to build the sentence...</span>
      </div>

      <!-- Word bank -->
      <div class="bank-wrap">
        <div class="bank-label">📚 Word Bank — اسحب الكلمات</div>
        <div class="bank-chips" id="bankChips">
          ${scrambled.map((w, i) =>
            `<span class="chip bank" draggable="true"
              ondragstart="onDragStart(event,'bank')"
              onclick="tapChip(this,'bank')"
              data-word="${w}">${w}</span>`
          ).join('')}
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="btn-row" style="margin-top:10px">
        <button class="btn-clear" onclick="clearDrop()">✕ Clear</button>
        <button class="btn-next" id="btnNext" onclick="nextQ()">Next →</button>
        <button class="btn-check" onclick="checkSentence()">✅ Check</button>
      </div>
    </div>`;

  document.getElementById('qArea').innerHTML = html;

  // Also add touch/tap support via click (backup for non-drag devices)
  startQuestionTimer();
}

// ── QUESTION TIMER ──
let qTimerSec = 20;
let qTimerID  = null;

function startQuestionTimer() {
  qTimerSec = 20;
  clearInterval(qTimerID);
  const bar = document.getElementById('timerBar');
  qTimerID = setInterval(() => {
    qTimerSec--;
    if (bar) {
      bar.style.width = (qTimerSec / 20 * 100) + '%';
      if (qTimerSec <= 5) bar.className = 'timer-bar warn';
    }
    if (qTimerSec <= 0) {
      clearInterval(qTimerID);
      if (!answered) autoReveal();
    }
  }, 1000);
}

function autoReveal() {
  answered = true;
  streak = 0;
  const s = pool[qIdx];
  // Fill drop zone with correct sentence
  const dz = document.getElementById('dropZone');
  dz.innerHTML = s.words.map(w =>
    `<span class="chip revealed">${w}</span>`
  ).join('');
  showFb('no', `⏰ Time up! The correct sentence was shown above.`, '');
  document.getElementById('btnNext').style.display = 'block';
  updateScoreboard();
}

// ── DRAG & DROP ──
function onDragStart(ev, source) {
  draggedChip = ev.target;
  dragSource  = source;
  ev.dataTransfer.setData('text/plain', ev.target.dataset.word);
}

function onDropZone(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  if (!draggedChip) return;

  const word = draggedChip.dataset.word;

  if (dragSource === 'bank') {
    // Move chip from bank to drop zone
    draggedChip.remove();
    addToDropZone(word);
  }
  // If source is already drop zone — chip reordering is not needed for this level
  draggedChip = null;
}

function addToDropZone(word) {
  const dz = document.getElementById('dropZone');
  // Remove hint if present
  const hint = document.getElementById('dzHint');
  if (hint) hint.remove();

  const chip = document.createElement('span');
  chip.className = 'chip placed';
  chip.draggable = true;
  chip.dataset.word = word;
  chip.textContent = word;
  chip.addEventListener('click', () => returnToBank(chip));
  chip.addEventListener('dragstart', e => onDragStart(e, 'drop'));
  dz.appendChild(chip);
}

// Click to place (for mobile / non-drag)
let tapMode = false; // true = next tap goes to drop zone
function tapChip(chip, source) {
  if (source === 'bank') {
    // Move to drop zone
    const word = chip.dataset.word;
    chip.remove();
    addToDropZone(word);
  }
}

function returnToBank(chip) {
  if (answered) return;
  const word = chip.dataset.word;
  chip.remove();
  // Re-add to bank
  const bank = document.getElementById('bankChips');
  const newChip = document.createElement('span');
  newChip.className = 'chip bank';
  newChip.draggable = true;
  newChip.dataset.word = word;
  newChip.textContent = word;
  newChip.addEventListener('click', () => tapChip(newChip, 'bank'));
  newChip.addEventListener('dragstart', e => onDragStart(e, 'bank'));
  bank.appendChild(newChip);
  // If drop zone is empty, show hint again
  const dz = document.getElementById('dropZone');
  if (!dz.querySelector('.chip')) {
    const hint = document.createElement('span');
    hint.className = 'drop-zone-hint';
    hint.id = 'dzHint';
    hint.textContent = 'Drag words here to build the sentence...';
    dz.appendChild(hint);
  }
}

function clearDrop() {
  const dz = document.getElementById('dropZone');
  // Return all placed chips to bank
  dz.querySelectorAll('.chip.placed').forEach(chip => returnToBank(chip));
}

// ── CHECK ──
function checkSentence() {
  if (answered) return;
  clearInterval(qTimerID);
  answered = true;

  const s = pool[qIdx];
  const dz = document.getElementById('dropZone');
  const placed = [...dz.querySelectorAll('.chip.placed')].map(c => c.dataset.word);

  // Compare arrays
  const isCorrect = placed.length === s.words.length &&
    placed.every((w, i) => w === s.words[i]);

  if (isCorrect) {
    streak++;
    correct++;
    const pts = 20 + (qTimerSec * 5) + (streak >= 3 ? 20 : 0);
    score += pts;
    dz.className = 'drop-zone correct';
    showFb('ok', `✅ Perfect sentence! +${pts} pts ${streak >= 3 ? '🔥' : ''}\n✦ ${s.grammar}`, s.contextAr);
  } else {
    streak = 0;
    dz.className = 'drop-zone wrong';
    setTimeout(() => {
      // Show correct answer in drop zone
      dz.innerHTML = s.words.map(w =>
        `<span class="chip revealed">${w}</span>`
      ).join('');
      dz.className = 'drop-zone';
    }, 600);
    showFb('no', `❌ Correct order: "${s.words.join(' ')}"`, s.contextAr);
  }

  updateScoreboard();
  document.getElementById('btnNext').style.display = 'block';
}

function showFb(cls, msg, ar) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + cls;
  fb.innerHTML = msg.replace('\n','<br>') + (ar ? `<div class="feedback-ar">${ar}</div>` : '');
}

function nextQ() {
  clearInterval(qTimerID);
  qIdx++;
  showQ();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  const pct = pool.length ? (qIdx / pool.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function updateScoreboard() {
  document.getElementById('scScore').textContent  = score;
  document.getElementById('scStreak').textContent = streak + (streak >= 3 ? '🔥' : '');
  document.getElementById('scQ').textContent      = correct + '/' + qIdx;
}

// ── WIN ──
function showWin() {
  clearInterval(timerID);
  clearInterval(qTimerID);
  const pct = pool.length ? Math.round(correct / pool.length * 100) : 0;
  document.getElementById('winScore').textContent = score + ' pts';
  const msg = pct === 100 ? '🌟 Every sentence was perfect! You are a sentence builder champion!'
            : pct >= 75   ? '🌴 Excellent! Strong sentence structure skills!'
            : pct >= 50   ? '✦ Good effort! Review the word order rules and try again.'
            :               '💪 Keep practising — word order gets easier with time!';
  document.getElementById('winMsg').innerHTML = `${msg}<br><span style="font-size:.8rem;color:#7090a8">Accuracy: ${pct}% | Time: ${timerSec}s</span>`;
  document.getElementById('winOverlay').classList.add('show');
}

function nextLevel() {
  document.getElementById('winOverlay').classList.remove('show');
  startLevel(currentLevel < 3 ? currentLevel + 1 : 1);
}

window.addEventListener('load', () => startLevel(1));
</script>
