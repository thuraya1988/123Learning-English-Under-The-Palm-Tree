<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Learn English Under The Palm Tree</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    body { position: relative; }

    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('cover.jpeg') center center / cover no-repeat;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .content {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.2s 0.5s ease forwards;
      position: relative;
      z-index: 5;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .glass-arch {
      background: rgba(255, 255, 255, 0.10);
      border: 1.8px solid rgba(255, 255, 255, 0.30);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      border-radius: 180px 180px 32px 32px;
      padding: 34px 34px 26px;
      box-shadow:
        0 18px 50px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -1px 0 rgba(255,255,255,0.12);
      max-width: 820px;
      margin: 0 auto;
      position: relative;
    }

    .glass-arch::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 160px 160px 24px 24px;
      border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none;
    }

    .sub-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      letter-spacing: 0.3em;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #000;
      margin: 12px auto;
      position: relative;
      z-index: 2;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 600;
      color: #000;
      line-height: 1.3;
      margin-bottom: 0;
    }

    .title-palm-wrap {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-6px);
      filter: grayscale(1) brightness(0);
      cursor: pointer;
      animation: floatPalm 3s ease-in-out infinite;
    }

    .title-palm-wrap:hover { transform: translateY(-10px) scale(1.05); }

    .title-palm {
      width: 88px;
      height: 88px;
      background: transparent;
      --poster-color: transparent;
      filter: drop-shadow(0 2px 0 #555)
              drop-shadow(0 4px 0 #333)
              drop-shadow(0 6px 0 #111)
              drop-shadow(0 10px 16px rgba(0,0,0,0.38));
    }

    .year-tag {
      font-style: italic;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #000;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      position: relative;
      z-index: 2;
    }

    .tagline {
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      color: #000;
      font-style: italic;
      line-height: 1.6;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .palm-icons {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 14px 22px;
      margin: 20px auto 0;
      width: fit-content;
      position: relative;
      z-index: 5;
    }

    .palm-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      text-decoration: none;
      color: #000;
      min-height: 78px;
      min-width: 300px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform 180ms ease, box-shadow 180ms ease;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .palm-item:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow:
        0 16px 34px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }

    .palm-model-wrap {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatPalm 3.2s ease-in-out infinite;
    }

    .palm-model {
      width: 62px;
      height: 62px;
      background: transparent;
      --poster-color: transparent;
      filter: drop-shadow(0 2px 0 #2f6d3a)
              drop-shadow(0 4px 0 #24552d)
              drop-shadow(0 6px 0 #18391e)
              drop-shadow(0 10px 16px rgba(0,0,0,0.30));
    }

    .palm-text {
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .bg-palms {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bg-palm {
      position: absolute;
      width: 58px;
      height: 58px;
      opacity: 0.45;
      animation: driftPalm 7s ease-in-out infinite;
      --poster-color: transparent;
      background: transparent;
    }

    .bg-palm.one   { top: 10%; left: 8%;     animation-delay: 0s;   }
    .bg-palm.two   { top: 18%; right: 9%;    animation-delay: 1s;   }
    .bg-palm.three { bottom: 20%; left: 12%; animation-delay: 2s;   }
    .bg-palm.four  { bottom: 12%; right: 14%;animation-delay: 3s;   }
    .bg-palm.five  { top: 42%; left: 4%;     animation-delay: 1.5s; }
    .bg-palm.six   { top: 56%; right: 5%;    animation-delay: 2.5s; }

    /* ── Palm Glow Overlay ── */
    #palmGlow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 280px 600px at 8%  75%, rgba(255,220,50,0.55) 0%, transparent 65%),
        radial-gradient(ellipse 240px 560px at 92% 60%, rgba(255,200,40,0.50) 0%, transparent 65%),
        radial-gradient(ellipse 200px 420px at 4%  42%, rgba(180,255,80,0.30) 0%, transparent 55%),
        radial-gradient(ellipse 180px 400px at 96% 25%, rgba(180,255,80,0.28) 0%, transparent 55%),
        radial-gradient(ellipse 160px 350px at 4%  56%, rgba(255,220,50,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 150px 330px at 95% 5%,  rgba(255,200,40,0.30) 0%, transparent 55%);
      mix-blend-mode: screen;
      animation: palmGlowPulse 3s ease-in-out infinite;
    }
    @keyframes palmGlowPulse {
      0%,100% { opacity:0.8; filter:blur(16px) brightness(1.1); }
      50%     { opacity:1;   filter:blur(26px) brightness(1.35); }
    }

    /* ── Glitter Layer ── */
    #glitterLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
      overflow: hidden;
    }

    @keyframes driftPalm {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-8px) rotate(-4deg); }
      50%  { transform: translateY(6px) rotate(4deg); }
      75%  { transform: translateY(-4px) rotate(-2deg); }
    }

    @keyframes floatPalm {
      0%, 100% { transform: translateY(-4px); }
      50%      { transform: translateY(-10px); }
    }

    @media (max-width: 768px) {
      .palm-icons { grid-template-columns: 1fr; }
      .palm-item  { min-width: 260px; }
      .glass-arch { padding: 26px 20px 20px; border-radius: 90px 90px 24px 24px; }
      .glass-arch::before { border-radius: 80px 80px 18px 18px; }
    }
  </style>
</head>
<body>

<div id="palmGlow"></div>
<div id="glitterLayer"></div>

<div class="scene">
  <div class="bg-palms">
    <model-viewer class="bg-palm one"   src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
    <model-viewer class="bg-palm two"   src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
    <model-viewer class="bg-palm three" src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
    <model-viewer class="bg-palm four"  src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
    <model-viewer class="bg-palm five"  src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
    <model-viewer class="bg-palm six"   src="palm_tree.glb" auto-rotate rotation-per-second="12deg" disable-zoom camera-controls></model-viewer>
  </div>

  <div class="content">
    <div class="glass-arch">
      <p class="sub-label">An Educational Journey</p>
      <div class="divider"></div>

      <div class="title-wrap">
        <div class="title-palm-wrap" onclick="magicPalm()">
          <model-viewer
            class="title-palm"
            src="palm_tree.glb"
            auto-rotate
            rotation-per-second="18deg"
            camera-controls
            disable-zoom>
          </model-viewer>
        </div>
        <h1 class="title">Let's Learn English<br/>Under The Palm Tree</h1>
      </div>

      <p class="year-tag">From 1973 to 2027</p>
      <p class="tagline">Stories that might happen<br/>in Thuraya's deep mind</p>

      <div class="palm-icons">
        <a class="palm-item" href="THEPALM1973.html" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
          <span class="palm-text"><strong>The Palm Stories</strong></span>
        </a>

        <a class="palm-item" href="palm_characters.html" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
          <span class="palm-text"><strong>The Palm Characters</strong></span>
        </a>

        <a class="palm-item" href="starter.html" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
          <span class="palm-text"><strong>The Palm Challenges</strong></span>
        </a>

        <a class="palm-item" href="palmtreegames.html" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
          <span class="palm-text"><strong>The Palm Games</strong></span>
        </a>

        <a class="palm-item" href="#" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
        </a>

        <a class="palm-item" href="#" onclick="playSound()">
          <div class="palm-model-wrap">
            <model-viewer class="palm-model" src="palm_tree.glb" auto-rotate rotation-per-second="20deg" disable-zoom camera-controls></model-viewer>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>
<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
  function playSound() {
    const a = document.getElementById('click-sfx');
    if (a) { a.currentTime = 0; a.play().catch(() => {}); }
  }

  function magicPalm() {
    playSound();
    const stars  = ['★','✦','✧','✩','✪','⭐','💫','✨','🌟'];
    const colors = ['#FFD700','#FFF176','#FFFDE7','#FFE57F','#FFCA28','#fff','#ffe066','#ffd54f'];
    const layer  = document.getElementById('glitterLayer');

    for (let i = 0; i < 120; i++) {
      const el    = document.createElement('span');
      const size  = Math.random() * 24 + 10;
      const color = colors[Math.floor(Math.random() * colors.length)];
      el.textContent = stars[Math.floor(Math.random() * stars.length)];
      el.style.cssText = `
        position:fixed;pointer-events:none;
        font-size:${size}px;color:${color};
        text-shadow:0 0 8px ${color},0 0 20px #FFD700,0 0 36px #fff;
        left:${Math.random()*100}vw;top:-30px;
        filter:brightness(1.6);
      `;
      layer.appendChild(el);
      const duration = Math.random() * 2000 + 1200;
      const drift    = (Math.random() - 0.5) * 200;
      el.animate([
        { transform:`translateY(0) translateX(0) rotate(0deg) scale(1)`,opacity:1 },
        { transform:`translateY(50vh) translateX(${drift/2}px) rotate(180deg) scale(1.4)`,opacity:1 },
        { transform:`translateY(110vh) translateX(${drift}px) rotate(${Math.random()*540}deg) scale(0.5)`,opacity:0 }
      ], { duration, easing:'ease-in', delay:Math.random()*700 })
        .onfinish = () => el.remove();
    }
  }
</script>

</body>
</html>
