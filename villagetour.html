<audio id="clickSnd" preload="auto"><source src="notification_sound.mp3" type="audio/mpeg"></audio>
<script>
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("wheel",e=>e.preventDefault(),{passive:false});
const mv=document.getElementById("mv"),infoCard=document.getElementById("infoCard");
let activeBtn=null,closeTimer=null;
mv.addEventListener("progress",e=>{document.getElementById("loadFill").style.width=(e.detail.totalProgress*100)+"%";});
mv.addEventListener("load",()=>{
  const ls=document.getElementById("loadScreen");ls.style.opacity="0";setTimeout(()=>ls.style.display="none",800);
  document.querySelectorAll(".hs").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();showHotspot(btn,parseInt(btn.dataset.num));}));
  mv.addEventListener("click",closeInfo);
});
function parseMeters(value){return Number(String(value).replace("m","").trim())||0;}
function buildViewForHotspot(btn){
  if(btn.dataset.orbit&&btn.dataset.target){
    return {orbit:btn.dataset.orbit,target:btn.dataset.target};
  }
  const [xRaw,yRaw,zRaw]=btn.dataset.position.split(" ");
  const x=parseMeters(xRaw),y=parseMeters(yRaw),z=parseMeters(zRaw);
  const targetY=Math.max(.9,y-.6);
  const azimuth=x>8?-32:x<-8?32:z>8?18:-18;
  const polar=Math.abs(x)+Math.abs(z)>45?64:68;
  const radius=Math.abs(x)+Math.abs(z)>45?34:28;
  return {
    orbit:`${azimuth}deg ${polar}deg ${radius}m`,
    target:`${x}m ${targetY}m ${z}m`
  };
}
function goHotspot(n){beep();const b=document.querySelector(`.hs[data-num="${n}"]`);if(b)showHotspot(b,n);}
function showHotspot(btn,num){
  beep();const view=buildViewForHotspot(btn);mv.setAttribute("camera-orbit",view.orbit);mv.setAttribute("camera-target",view.target);
  if(activeBtn)activeBtn.classList.remove("active");btn.classList.add("active");activeBtn=btn;
  document.querySelectorAll(".nb").forEach(nb=>nb.classList.remove("active"));
  const nb=document.querySelector(`.nb:nth-child(${num})`);if(nb)nb.classList.add("active");
  document.getElementById("cardNum").textContent=btn.dataset.emoji;
  document.getElementById("cardTitle").textContent=btn.dataset.title;
  document.getElementById("cardSubtitle").innerHTML=btn.dataset.subtitle;
  document.getElementById("cardDesc").textContent=btn.dataset.desc;
  document.getElementById("cardQuestion").textContent=btn.dataset.question;
  const v=document.getElementById("cardVocab");v.innerHTML="";
  btn.dataset.vocab.split(",").forEach(w=>{const c=document.createElement("span");c.className="vocab-chip";c.textContent=w.trim();c.onclick=()=>speakWord(w.trim());v.appendChild(c);});
  document.getElementById("numBar").classList.add("hide");infoCard.classList.add("show");
  clearTimeout(closeTimer);closeTimer=setTimeout(closeInfo,10000);
}
function closeInfo(){
  clearTimeout(closeTimer);infoCard.classList.remove("show");document.getElementById("numBar").classList.remove("hide");
  if(activeBtn){activeBtn.classList.remove("active");activeBtn=null;}
  document.querySelectorAll(".nb").forEach(nb=>nb.classList.remove("active"));
  mv.setAttribute("camera-orbit","18deg 78deg 95m");mv.setAttribute("camera-target","5m 1m 5m");
}
function speakWord(w){const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=0.85;speechSynthesis.speak(u);beep();}
function beep(){
  const s=document.getElementById("clickSnd");if(s){try{s.currentTime=0;s.play().catch(()=>{});}catch(e){}}
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=800;o.type="sine";g.gain.setValueAtTime(0.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);o.start();o.stop(ctx.currentTime+0.12);}catch(e){}
}
</script>
