function cafeAtWorld(wx,wy,wz,cx,cz,maxR){
 var dx=wx-cx,dz=wz-cz,l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
 var tries=[[1.7,0],[2.4,0.6],[2.4,-0.6],[3.1,1.1],[3.1,-1.1],[1.5,1.5],[1.5,-1.5],[3.8,0]];
 for(var i=0;i<tries.length;i++){
  var back=tries[i][0],side=tries[i][1];
  var px=wx-dx*back-dz*side, pz=wz-dz*back+dx*side;
  if(maxR&&Math.hypot(px-cx,pz-cz)>maxR)continue;

}

var raycaster=new THREE.Raycaster(),mouseV=new THREE.Vector2();
var inside=null,prevView=null;
var exitBtn=document.getElementById('exitBtn');
var dnBtn=document.getElementById('dnBtn');
dnBtn.addEventListener('click',function(){targetNight=targetNight?0:1;dnBtn.textContent=targetNight?'☀️ نهار':'🌙 ليل';});
function handleClick(e){
 if(inside)return;
 mouseV.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
 raycaster.setFromCamera(mouseV,camera);
 var hits=raycaster.intersectObjects(hitMeshes,false);
 if(hits.length){var meta=hits[0].object.userData.meta;if(meta)enterHouse(meta);}
}
function enterHouse(meta){
 if(window.WK&&WK.on) WK.send('shard',{id:'i'+housesMeta.indexOf(meta)});
 inside=meta;
 prevView={t:tTarget.clone(),d:ctrl.tDist,min:minD,max:maxD};
 meta.g.updateWorldMatrix(true,false);
 meta.target.copy(meta.g.localToWorld(new THREE.Vector3(0,1.2,0.3)));
 tTarget.copy(meta.target);
 minD=0.6;maxD=2.6;ctrl.tDist=1.7;
 exitBtn.style.display='block';
}
function exitHouse(){
 if(!inside)return;
 inside=null;
 tTarget.copy(prevView.t);ctrl.tDist=prevView.d;minD=prevView.min;maxD=prevView.max;
 exitBtn.style.display='none';
}
exitBtn.addEventListener('click',exitHouse);
addEventListener('keydown',function(e){if(e.key==='Escape')exitHouse();});
housesMeta.forEach(function(m){m.g.updateWorldMatrix(true,false);});

var clock=new THREE.Clock();
var XAXm=new THREE.Vector3(1,0,0);
function loop(){
 var dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
 uTime.value=t;
 nightF+=(targetNight-nightF)*Math.min(1,dt*1.4);
 skyMat.uniforms.uNight.value=nightF;
 seaMat.uniforms.uNight.value=nightF;
 matLake.uniforms.uNight.value=nightF;
 sun.intensity=1.8*(1-nightF)+0.35*nightF;
 sun.color.lerpColors(cSunD,cSunN,nightF);
 hemi.intensity=0.8-0.55*nightF;
 hemi.color.lerpColors(cHSD,cHSN,nightF);
 hemi.groundColor.lerpColors(cHGD,cHGN,nightF);
 fillL.intensity=0.3*(1-nightF)+0.06;
 scene.fog.color.lerpColors(cFogD,cFogN,nightF);
 renderer.toneMappingExposure=1.1-0.25*nightF;
 matOpen.emissiveIntensity=0.15+2.6*nightF;
 matBulb.emissiveIntensity=3.2+2.2*nightF;
 starMat.opacity=nightF*0.9;
 moonSprite.opacity=nightF*0.9;
 sunSprite.opacity=0.9*(1-nightF);
 fireMat.opacity=0.08+0.9*nightF;
 for(var dmi=0;dmi<dayFadeMats.length;dmi++)dayFadeMats[dmi].opacity=(1-nightF)*(dmi<2?0.9:1);
 fishMatA.emissiveIntensity=1.6+1.4*nightF;
 fishMatB.emissiveIntensity=1.5+1.4*nightF;
 for(var mti=0;mti<meteors.length;mti++){
  var M=meteors[mti];
  if(nightF>0.55){
   if(M.life<0){M.life+=dt;if(M.life>=0){M.m.position.set(R(-140,140),R(70,140),R(-160,-70));M.dir.set(-0.7,-0.4,R(-0.2,0.2)).normalize();M.life=0;}}
   else{M.life+=dt/1.1;M.m.position.addScaledVector(M.dir,dt*70);
    M.m.quaternion.setFromUnitVectors(XAXm,M.dir);
    M.m.material.opacity=Math.sin(Math.PI*Math.min(1,M.life))*0.9;
    if(M.life>1){M.life=-R(2,8);M.m.material.opacity=0;}}
  }else if(M.m.material.opacity>0)M.m.material.opacity=0;
 }
 if(ctrl.auto)ctrl.tTheta+=dt*0.04;
 ctrl.theta+=(ctrl.tTheta-ctrl.theta)*0.08;
 ctrl.phi+=(ctrl.tPhi-ctrl.phi)*0.08;
 ctrl.dist+=(ctrl.tDist-ctrl.dist)*0.1;
 target.lerp(tTarget,0.12);
 camera.position.set(
  target.x+ctrl.dist*Math.sin(ctrl.phi)*Math.sin(ctrl.theta),
  target.y+ctrl.dist*Math.cos(ctrl.phi),
  target.z+ctrl.dist*Math.sin(ctrl.phi)*Math.cos(ctrl.theta));
 camera.lookAt(target);
 for(var i=0;i<updates.length;i++)updates[i](t,dt);
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

 if(window.console)console.error(err);
}
