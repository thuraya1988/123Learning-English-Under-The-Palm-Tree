<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meet The Palm Characters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Cormorant Garamond', serif;
    background: url('cover.jpeg') center center / cover no-repeat fixed;
  }
  body::before{content:'';position:fixed;inset:0;background:rgba(255,255,255,0.18);pointer-events:none;}
  .scene{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px 36px;}
  .panel{width:min(1220px,96vw);background:rgba(255,255,255,.28);border-radius:36px;padding:28px 24px 30px;backdrop-filter:blur(5px);box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center;}
  .sub-label{font-family:'Cinzel',serif;font-size:clamp(.6rem,1.4vw,.75rem);letter-spacing:.3em;color:#000;text-transform:uppercase;margin-bottom:10px;}
  .divider{width:56px;height:1px;background:#000;margin:12px auto 16px;}
  .title{font-family:'Cinzel',serif;font-size:clamp(1.55rem,4vw,2.4rem);font-weight:600;color:#000;line-height:1.3;margin-bottom:8px;}
  .tagline{font-size:clamp(.9rem,1.8vw,1rem);color:#111;font-style:italic;line-height:1.6;margin-bottom:28px;}
  .characters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;}
  .character-wrap{display:flex;flex-direction:column;align-items:center;}
  .flip-card{background:transparent;width:100%;height:360px;perspective:1400px;}
  .flip-card-inner{position:relative;width:100%;height:100%;transition:transform .8s ease;transform-style:preserve-3d;}
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.10);}
  .flip-front{background:rgba(235,227,215,.82);display:flex;align-items:center;justify-content:center;padding:10px;}
  .flip-front img{width:100%;height:100%;object-fit:contain;display:block;background:transparent;border-radius:24px;}
  .flip-front.no-image{background:rgba(235,227,215,.95);}
  .flip-front.no-image::after{content:attr(data-name);font-family:'Cinzel',serif;color:#333;font-size:1rem;}
  .flip-back{transform:rotateY(180deg);background:#fff;padding:18px 16px;text-align:left;overflow:auto;}
  .char-name{font-family:'Cinzel',serif;font-size:1rem;color:#111;margin-bottom:10px;text-align:center;}
  .desc-block{font-size:.98rem;line-height:1.5;color:#111;font-weight:700;white-space:pre-line;}
  .desc-divider{height:1px;background:#000;opacity:.22;margin:12px 0;}
  .flip-trigger{margin-top:12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:#000;font-family:'Cinzel',serif;font-size:.84rem;}
  .flip-trigger .palm{font-size:1.45rem;filter:grayscale(1) brightness(0);}
  .back-link{display:inline-block;margin-top:28px;text-decoration:none;color:#000;background:rgba(255,255,255,.7);padding:10px 16px;border-radius:999px;font-family:'Cinzel',serif;font-size:.85rem;}
</style>
</head>
<body>
<div class="scene">
  <div class="panel">
    <p class="sub-label">Meet The Cast</p>
    <div class="divider"></div>
    <h1 class="title">Meet The Palm Characters</h1>
    <p class="tagline">Click the palm under each arch to flip it and discover the character behind the story.</p>

    <div class="characters-grid" id="characters-grid"></div>

    <a class="back-link" href="index.html" onclick="playClick()">Back to Home</a>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>
<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
const characters = [
  {
    id:'card1', image:'thuraya-classroom.png', name:'Thuraya + Class Room',
    en:`Thuraya is the village leader who cannot be stopped.
• Omani English teacher
• Story creator
• The one who brought John and Sophia into Al-Qurawashiyah without warning

Super Power
She can silence the whole class with one look 👀

Smile Warning
When Thuraya smiles, even Mansoor double-checks his life choices 😄

Weakness
A wall crocodile 🐊

Secret
She carries a secret stretching from 1973 to 2027.

Dream
To finish her master’s degree in Turkey 🇹🇷`,
    ar:`ثريا قائدة القرية التي لا يوقفها شيء.
• مؤلفة القصة
• مدرّسة لغة إنجليزية عُمانية
• أدخلت جون وصوفيا عالم القرواشية بدون إنذار

القوة الخارقة
تسكت الصف بنظرة واحدة 👀

نقطة الضعف
تمساح الجدار 🐊

السر
معها سر يمتد من 1973 إلى 2027.

الحلم
تكمل الماجستير في تركيا 🇹🇷`
  },
  {
    id:'card2', image:'sophia-john.png', name:'Sophia + John',
    en:`John came to teach… and learned shock instead.
• English teacher
• Started speaking Arabic without permission
• Gets scared but denies it immediately

Funny Fact
He says "I am not afraid" then hides behind Sophia 😄

Sophia arrived as Sophia and became Safiya.

Super Power
Organizing chaos with quiet elegance.`,
    ar:`جون جاء يعلّم… فتعلم الصدمة.
• معلم إنجليزي
• بدأ يتكلم عربي بدون إذن
• يخاف لكن ينكر فوراً

معلومة مضحكة
يقول: I am not afraid ثم يختبئ خلف صوفيا 😄

صوفيا جاءت Sophia وصارت Safiya.

قوة صوفيا
تنظيم الفوضى بهدوء.`
  },
  {
    id:'card3', image:'malood-falaj.png', name:'Malood + Falaj',
    en:`Malood is the unofficial school manager 🐐
• Walks into class
• Eats papers
• Watches everyone like he owns the place

Favorite Food
Papers… especially Sophia's ring if possible.

The Falaj is the lifeline of Al-Qurawashiyah.`,
    ar:`مالود هو مدير المدرسة غير الرسمي 🐐
• يدخل الصف
• يأكل الأوراق
• يراقب الجميع وكأنه صاحب المكان

الأكل المفضل
الأوراق… وخاصة خاتم صوفيا.

الفلج شريان حياة القرواشية.`
  },
  {
    id:'card4', image:'kalaf-obaid.png', name:'Kalaf + Obaid',
    en:`Kalaf is the mysterious man who knows things nobody explains.

Obaid is the wise young man with glasses.
He knows herbs, listens before speaking, and thinks five steps ahead.`,
    ar:`الشايب خلف رجل غامض يعرف أشياء لا يعرفها أحد.

عبيد شاب حكيم صاحب نظارة.
يعرف الأعشاب ويتكلم بعد تفكير عميق.`
  },
  {
    id:'card5', image:'saeed-ali.png', name:'Saeed + Ali',
    en:`Saeed is quiet and observant, but suddenly surprises everyone with brilliant answers.

Ali is the calm artist who notices tiny details and loves drawing.`,
    ar:`سعيد هادئ ومراقب ذكي، يفاجئ الجميع بإجابات قوية.

علي الفنان الهادئ، يلاحظ التفاصيل الصغيرة ويحب الرسم.`
  },
  {
    id:'card6', image:'cover.jpeg', name:'Khamis + Marhoon',
    en:`Marhoon is the farmer whose life belongs to the land.

Khamis is quiet, brilliant, and understands before the question ends.`,
    ar:`مرهون مزارع حياته للأرض.

خميس هادئ وعبقري ويفهم قبل أن يكتمل السؤال.`
  },
  {
    id:'card7', image:'cover.jpeg', name:'Khalil + Mansoor',
    en:`Khalil is the laughter machine of the village.

Mansoor is a human storm: runs, talks, laughs, and fills class with energy.`,
    ar:`خليل آلة الضحك الرسمية.

منصور إعصار بشري: يركض ويتكلم ويضحك بلا توقف.`
  },
  {
    id:'card8', image:'cover.jpeg', name:'Mohamadin + Fatakat',
    en:`Mohamadin is the mathematics mind of the village.

Fatakat is energetic and impossible to ignore; her voice arrives before she does 😄`,
    ar:`محمدين عقل الرياضيات في القرية.

فتكات نشيطة وصوتها يوصل قبلها 😄`
  },
  {
    id:'card9', image:'mustafa-minnah.png', name:'Mustafa + Minnah',
    en:`Mustafa and Minnah bring a lighter rhythm into the village world.
Even when their role is small, they stay in memory.`,
    ar:`مصطفى ومنة يضيفان إيقاعاً خفيفاً لعالم القرية.
حتى لو دورهم بسيط، يبقون في الذاكرة.`
  },
  {
    id:'card10', image:'cover.jpeg', name:'Sadoo + Zahran',
    en:`Sadoo is the unofficial hero: tailor, seller, cook, fixer.

Zahran is simple and unforgettable in his own way.`,
    ar:`سادو بطل القرية غير المعترف به: خياط، بياع، مصلّح لكل شيء.

زهران بسيط ومميز بطريقته.`
  },
  {
    id:'card11', image:'palm-ahmad.png', name:'Palm Tree + Ahmad',
    en:`The Palm Tree is the queen of the village.
Ahmad is the silent soldier: accurate, organized, and respectful.`,
    ar:`نخلة الفرض ملكة القرية.
أحمد الجندي الصامت: دقيق ومرتب ومحترم.`
  },
  {
    id:'card12', image:'dokan-best-products.png', name:'Dokan + Best Products',
    en:`Sadoo's dokan is the village supermarket.
If you need it, it is there.
Favorite visitor: Malood 🐐`,
    ar:`دكان سادو سوبرماركت القرية.
إذا تحتاج شيء تلقاه.
الزائر المفضل: مالود 🐐`
  },
  {
    id:'card13', image:'pickup-nasser.png', name:'Pick up + Nasser',
    en:`Nasser is the village driver and unofficial navigator.
The pickup is not just a vehicle; it is a moving village legend.`,
    ar:`ناصر سائق القرية والنافيجيتور غير الرسمي.
البيك أب ليس مجرد سيارة؛ هو أسطورة متحركة.`
  },
  {
    id:'card14', image:'muthla-noura.png', name:'Muthla + Noura',
    en:`Noura asks fast questions with endless curiosity.
Muthla is calm, kind, and keeps everything neat.`,
    ar:`نورة كثيرة الأسئلة وسريعة التفكير.
مثلة هادئة ولطيفة وتحافظ على كل شيء مرتب.`
  }
];

const grid = document.getElementById('characters-grid');
characters.forEach((c) => {
  const item = document.createElement('div');
  item.className = 'character-wrap';
  item.innerHTML = `
    <div class="flip-card" id="${c.id}">
      <div class="flip-card-inner">
        <div class="flip-face flip-front" data-name="${c.name}"><img src="${c.image}" alt="${c.name}" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.onerror=null;}else{this.style.display='none'; this.parentElement.classList.add('no-image');}" data-fallback='cover.jpeg'></div>
        <div class="flip-face flip-back">
          <div class="char-name">${c.name}</div>
          <div class="desc-block">${c.en}</div>
          <div class="desc-divider"></div>
          <div class="desc-block">${c.ar}</div>
        </div>
      </div>
    </div>
    <div class="flip-trigger" onclick="toggleCard('${c.id}')"><span class="palm">🌴</span><span>Click Here</span></div>
  `;
  grid.appendChild(item);
});

function playClick() {
  const clickAudio = document.getElementById('click-sfx');
  if (!clickAudio) return;
  clickAudio.currentTime = 0;
  clickAudio.play().catch(() => {});
}

function toggleCard(id){
  playClick();
  document.getElementById(id).classList.toggle('flipped');
}
</script>
<script src="sound.js"></script>
</body>
</html>
