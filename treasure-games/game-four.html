<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050310" />
    <title>آخِرُ ضَوْء</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" data-game="lastlight">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-row">
          <button class="icon" data-act="pause">⏸</button
          ><a class="icon" href="index.html">⌂</a
          ><span id="levelChip" class="chip"></span><span class="grow"></span
          ><span id="starChip" class="chip"></span
          ><span id="coinChip" class="chip"></span
          ><span id="heartChip" class="hearts"></span>
        </div>
        <button id="nova" class="nova">✦</button>
      </div>
      <section id="menu" class="screen menu-four">
        <div class="title-icon">☀️</div>
        <h1>آخِرُ ضَوْء</h1>
        <p>حرّكي الشمس • القمران يلتقطان الضوء • النبضة تُبعد العتمة</p>
        <button class="main" data-act="continue">أشعلي الشمس</button
        ><a class="sub" href="index.html">كل الألعاب</a>
      </section>
      <div id="modal" class="modal hidden">
        <div class="box">
          <h2 id="modalTitle"></h2>
          <div id="modalBody"></div>
          <div id="modalBtns"></div>
        </div>
      </div>
      <div id="toast"></div>
    </div>
    <script src="engine.js"></script>
  </body>
</html>
