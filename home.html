<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>123 Learning English Under The Palm Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:#fdf3dd;font-family:'Nunito',sans-serif;overflow-x:hidden}
body.popup-open{overflow:hidden}
.page-wrap{width:100vw;min-height:100vh;background:#fdf3dd;padding:34px}
.hero{display:flex;gap:26px;align-items:stretch}
.hero-left,.hero-right{flex:1 1 0;min-height:470px;border-radius:36px;position:relative;transition:transform .28s ease,box-shadow .28s ease,filter .28s ease}
.hero-left{background:#6f0828;border:2px solid #314f53;box-shadow:14px 16px 0 rgba(49,79,83,.34),14px 18px 30px rgba(49,79,83,.18);overflow:hidden}
.hero-right{background:#037f8f;border:2px solid #00545f;box-shadow:14px 16px 0 rgba(49,79,83,.28),14px 18px 30px rgba(49,79,83,.16);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:22px 18px 34px}
.hero-left::before,.hero-right::before{content:'';position:absolute;inset:0;border-radius:36px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,0) 34%,rgba(0,0,0,.07));pointer-events:none}
.hero-left::after,.hero-right::after{content:'';position:absolute;inset:2px;border-radius:34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -8px 16px rgba(0,0,0,.12);pointer-events:none}
.hero-left:hover,.hero-right:hover{transform:translateY(-6px);filter:saturate(1.03)}
.hero-center-img{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:68%;min-width:160px;z-index:2;filter:drop-shadow(0 10px 14px rgba(0,0,0,.24));transition:transform .28s ease,filter .28s ease}
.hero-side-img{position:absolute;right:-58px;top:18px;width:40%;min-width:92px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.26));transition:transform .28s ease,filter .28s ease}
.hero-left:hover .hero-center-img{transform:translate(-50%,-50%) scale(1.015)}
.hero-left:hover .hero-side-img{transform:translateX(-4px) scale(1.02);filter:drop-shadow(0 0 8px rgba(255,244,180,.38)) drop-shadow(0 10px 16px rgba(0,0,0,.26))}
.carve-overlay{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.05),rgba(255,255,255,0) 34%),linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.08));mix-blend-mode:multiply}
.hero-title-img{width:112%;max-width:none;height:auto;margin-top:-8px;margin-left:-6%;position:relative;z-index:2;filter:drop-shadow(6px 8px 0 rgba(0,55,62,.72));transition:transform .28s ease,filter .28s ease}
.hero-hang-img{position:absolute;left:-34px;bottom:-24px;width:26%;min-width:120px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24));transition:transform .28s ease,filter .28s ease}
.hero-hang-img-right{position:absolute;right:-34px;bottom:-26px;width:28%;min-width:126px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24));transition:transform .28s ease,filter .28s ease}
.hero-right:hover .hero-title-img{transform:scale(1.01);filter:drop-shadow(0 0 10px rgba(255,255,255,.16)) drop-shadow(0 0 22px rgba(170,220,255,.20)) drop-shadow(6px 8px 0 rgba(0,55,62,.72))}
.hero-right:hover .hero-hang-img,.hero-right:hover .hero-hang-img-right{transform:translateY(-4px) scale(1.03);filter:drop-shadow(0 0 8px rgba(255,240,170,.55)) drop-shadow(0 0 18px rgba(255,214,90,.42)) drop-shadow(0 10px 16px rgba(0,0,0,.24))}
.hero-start-btn{margin-top:auto;margin-bottom:12px;position:relative;z-index:4;border:none;border-radius:999px;padding:16px 36px;min-width:180px;background:linear-gradient(180deg,#7d79c7 0%,#6362a8 100%);color:#fff;font-family:'Fredoka One',cursive;font-size:1.05rem;letter-spacing:1px;text-align:center;text-decoration:none;cursor:pointer;box-shadow:0 8px 0 #013a44,10px 12px 0 rgba(0,58,68,.78);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
.hero-start-btn:hover{transform:scale(1.08);box-shadow:0 9px 0 #013a44,12px 14px 0 rgba(0,58,68,.84);filter:saturate(1.06)}
.hero-start-btn:active{transform:translateY(4px) scale(1.02);box-shadow:0 3px 0 #013a44,6px 8px 0 rgba(0,58,68,.68)}

.reg-overlay{position:fixed;inset:0;background:rgba(16,12,12,.58);display:none;align-items:center;justify-content:center;padding:24px;z-index:20000}
.reg-overlay.show{display:flex}
.reg-popup{width:min(100%,1260px);min-height:760px;background:#ef6464;border-radius:34px;position:relative;box-shadow:18px 18px 0 #f0a4a4;overflow:visible;padding:42px 46px 46px}
.reg-popup::before{content:'';position:absolute;inset:0;border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,0) 32%,rgba(0,0,0,.04));pointer-events:none}
.reg-popup-title{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:78%;text-align:center;font-family:'Fredoka One',cursive;font-size:1.08rem;letter-spacing:4px;color:#17003a;text-shadow:3px 3px 0 #ff37d3;line-height:1.2}
.reg-popup-lean-left{position:absolute;left:-92px;top:74px;width:148px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24));transition:transform .22s ease,filter .22s ease}
.reg-popup-lean-mid{position:absolute;left:-18px;bottom:44px;width:220px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24));transition:transform .22s ease,filter .22s ease}
.reg-popup-lean-right{position:absolute;right:-40px;bottom:44px;width:240px;z-index:3;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24));transition:transform .22s ease,filter .22s ease}
.reg-popup:hover .reg-popup-lean-left,.reg-popup:hover .reg-popup-lean-mid,.reg-popup:hover .reg-popup-lean-right{transform:translateY(-4px) scale(1.03);filter:drop-shadow(0 0 8px rgba(255,240,170,.55)) drop-shadow(0 0 18px rgba(255,214,90,.42)) drop-shadow(0 10px 16px rgba(0,0,0,.24))}
.form-zone{position:relative;width:100%;height:100%;padding:84px 130px 30px 160px}
.popup-field{position:absolute;background-repeat:no-repeat;background-size:100% 100%;background-position:center;display:flex;align-items:center;padding:18px 26px 18px 26px;transition:transform .22s ease,filter .22s ease}
.popup-field:hover{transform:scale(1.02);filter:drop-shadow(0 0 10px rgba(255,240,170,.3))}
.field-name{background-image:url('./popBname.png');left:290px;top:88px;width:770px;height:104px}
.field-school{background-image:url('./popBschool.png');left:250px;top:238px;width:640px;height:98px}
.field-grade{background-image:url('./popBgrade.png');left:210px;top:392px;width:370px;height:92px}
.field-icons{background-image:url('./popBicons.png');left:620px;top:402px;width:360px;height:128px;cursor:pointer}
.field-stack{width:100%}
.field-label{font-family:'Fredoka One',cursive;font-size:1.35rem;color:#19003f;text-shadow:2px 2px 0 #ff42d6;line-height:1}
.field-control{margin-top:10px;border:none;outline:none;background:transparent;width:100%;font-family:'Fredoka One',cursive;font-size:1rem;color:#5c0e36;padding:0 8px 8px 8px;border-bottom:6px solid #99153d;caret-color:#00545f}
.field-control::placeholder{color:rgba(92,14,54,.35)}
.field-select{appearance:none}
.icon-btn{margin-top:10px;width:100%;height:54px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-preview{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.16));transition:transform .2s ease,filter .2s ease}
.field-icons:hover .icon-preview{transform:scale(1.06);filter:drop-shadow(0 0 10px rgba(255,240,170,.38)) drop-shadow(0 8px 12px rgba(0,0,0,.16))}
.reg-submit{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:420px;padding:20px 26px;border:none;border-radius:999px;background:linear-gradient(180deg,#7d79c7 0%,#6362a8 100%);color:#ffd9cf;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;box-shadow:0 10px 0 #7b5b77,0 16px 22px rgba(0,0,0,.16);transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}
.reg-submit:hover:not(:disabled){transform:translateX(-50%) scale(1.04);filter:saturate(1.04)}
.reg-submit:disabled{opacity:.55;cursor:not-allowed}
.reg-close{position:absolute;top:16px;right:18px;width:54px;height:54px;border-radius:50%;border:none;background:#00545f;color:#fff;font-size:2rem;line-height:1;cursor:pointer;z-index:5}
.reg-error{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);font-weight:800;color:#7b1029;display:none}

.icon-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:25000}
.icon-modal.show{display:flex}
.icon-modal-card{width:min(100%,920px);background:url('./popupicon.png') center/100% 100% no-repeat;min-height:640px;padding:72px 54px 42px;position:relative}
.icon-title{font-family:'Fredoka One',cursive;color:#17003a;text-shadow:3px 3px 0 #ff37d3;font-size:1rem;text-align:center;margin-bottom:30px}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.icon-item{min-height:148px;border:3px solid #dfe8df;background:linear-gradient(180deg,#fff,#f8f4ee);border-radius:28px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease;box-shadow:0 8px 0 rgba(120,80,80,.18),0 12px 20px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -6px 10px rgba(0,0,0,.06)}
.icon-item::before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(0,0,0,.05));pointer-events:none}
.icon-item img{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));transition:transform .18s ease,filter .18s ease}
.icon-item:hover{transform:translateY(-4px) rotate(-1deg);border-color:#f5c518;box-shadow:0 10px 0 rgba(120,80,80,.18),0 18px 26px rgba(0,0,0,.14),0 0 14px rgba(255,214,90,.28),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -6px 10px rgba(0,0,0,.06);filter:saturate(1.06);animation:iconWiggle .32s ease-in-out}
.icon-item:hover img{transform:scale(1.06) translateY(-2px);filter:drop-shadow(0 12px 14px rgba(0,0,0,.22))}
.icon-item.active{border-color:#f5c518;box-shadow:0 10px 0 rgba(120,80,80,.18),0 18px 26px rgba(0,0,0,.14),0 0 0 4px rgba(245,197,24,.28)}
.icon-close{margin-top:30px;width:100%;border:none;border-radius:22px;padding:18px;background:#00545f;color:#fff;font-family:'Fredoka One',cursive;font-size:1.35rem;cursor:pointer}
@keyframes iconWiggle{0%{transform:translateY(-4px) rotate(0)}25%{transform:translateY(-4px) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}75%{transform:translateY(-4px) rotate(-1deg)}100%{transform:translateY(-4px) rotate(0)}}

@media (max-width:1200px){.page-wrap{padding:18px}.hero{flex-direction:column}.reg-popup{min-height:auto}.form-zone{padding:120px 20px 120px}.popup-field{position:relative !important;left:auto !important;top:auto !important;width:100% !important;height:auto !important;min-height:96px;margin-bottom:18px}.reg-popup-title{position:relative;left:auto;top:auto;transform:none;width:100%;margin-bottom:22px}.reg-popup-lean-left{left:-30px;top:120px;width:110px}.reg-popup-lean-mid{left:10px;bottom:120px;width:160px}.reg-popup-lean-right{right:-20px;bottom:120px;width:170px}.reg-submit{width:min(100%,420px)} }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="hero">
    <div class="hero-left">
      <img class="hero-center-img" src="./ping0ne.png" alt="">
      <img class="hero-side-img" src="./rocketboys.png" alt="">
      <div class="carve-overlay"></div>
    </div>
    <div class="hero-right">
      <img class="hero-title-img" src="./popone.png" alt="" width="520" height="360">
      <img class="hero-hang-img" src="./poppicone.png" alt="" width="160" height="220">
      <img class="hero-hang-img-right" src="./poppictwo.png" alt="" width="170" height="220">
      <button class="hero-start-btn" type="button" onclick="openRegistrationPopup()">Start</button>
    </div>
  </div>
</div>

<div class="reg-overlay" id="regOverlay">
  <div class="reg-popup">
    <button class="reg-close" type="button" onclick="closeRegistrationPopup()">×</button>
    <div class="reg-popup-title">WELCOME TO PALM TREE YOU LITTLE PALMY</div>
    <img class="reg-popup-lean-left" src="./poppictwo.png" alt="">
    <img class="reg-popup-lean-mid" src="./poppicone.png" alt="">
    <img class="reg-popup-lean-right" src="./orbanahd.png" alt="">

    <div class="form-zone">
      <div class="popup-field field-name">
        <div class="field-stack">
          <div class="field-label">name:</div>
          <input class="field-control" id="wFullName" type="text" oninput="validateWelcome()">
        </div>
      </div>

      <div class="popup-field field-school">
        <div class="field-stack">
          <div class="field-label">school:</div>
          <input class="field-control" id="wSchool" type="text" oninput="validateWelcome()">
        </div>
      </div>

      <div class="popup-field field-grade">
        <div class="field-stack">
          <div class="field-label">grade:</div>
          <select class="field-control field-select" id="wGrade" onchange="validateWelcome()">
            <option value=""></option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
          </select>
        </div>
      </div>

      <div class="popup-field field-icons" onclick="openIconModal()">
        <div class="field-stack">
          <div class="field-label">icons</div>
          <button type="button" class="icon-btn"><img class="icon-preview" id="iconPreview" src="./one.png" alt="icon"></button>
        </div>
      </div>
    </div>

    <div class="reg-error" id="wError">Please complete all fields and choose your icon.</div>
    <button class="reg-submit" id="wStartBtn" type="button" onclick="startApp()" disabled>Let’s Go!</button>
  </div>
</div>

<div class="icon-modal" id="iconModal">
  <div class="icon-modal-card">
    <div class="icon-title">Choose your icon</div>
    <div class="icon-grid">
      <button class="icon-item active" type="button" data-src="./one.png" onclick="selectIcon('./one.png', this)"><img src="./one.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./two.png" onclick="selectIcon('./two.png', this)"><img src="./two.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./three.png" onclick="selectIcon('./three.png', this)"><img src="./three.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./four.png" onclick="selectIcon('./four.png', this)"><img src="./four.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./fife.png" onclick="selectIcon('./fife.png', this)"><img src="./fife.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./six.png" onclick="selectIcon('./six.png', this)"><img src="./six.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./seven.png" onclick="selectIcon('./seven.png', this)"><img src="./seven.png" alt=""></button>
      <button class="icon-item" type="button" data-src="./eight.png" onclick="selectIcon('./eight.png', this)"><img src="./eight.png" alt=""></button>
    </div>
    <button class="icon-close" type="button" onclick="closeIconModal()">Close</button>
  </div>
</div>

<audio id="clickSound" src="./crystal-ringing.mp3" preload="auto"></audio>
<audio id="bgMusic" src="./Future-Technology(chosic.com).mp3" preload="auto" loop></audio>

<script>
let selectedIcon='./one.png';
const clickSound=document.getElementById('clickSound');
const bgMusic=document.getElementById('bgMusic');
bgMusic.volume=0.22;
function playClick(){try{clickSound.currentTime=0;clickSound.play()}catch(e){}}
function startBg(){bgMusic.play().catch(()=>{});window.removeEventListener('pointerdown',startBg);window.removeEventListener('keydown',startBg)}
window.addEventListener('pointerdown',startBg,{once:true});
window.addEventListener('keydown',startBg,{once:true});
function openRegistrationPopup(){document.getElementById('regOverlay').classList.add('show');document.body.classList.add('popup-open');playClick()}
function closeRegistrationPopup(){document.getElementById('regOverlay').classList.remove('show');document.body.classList.remove('popup-open');playClick()}
function openIconModal(){document.getElementById('iconModal').classList.add('show');playClick()}
function closeIconModal(){document.getElementById('iconModal').classList.remove('show');playClick()}
function selectIcon(src,el){selectedIcon=src;document.getElementById('iconPreview').src=src;document.querySelectorAll('.icon-item').forEach(i=>i.classList.remove('active'));el.classList.add('active');validateWelcome();playClick()}
function validateWelcome(){const fullName=document.getElementById('wFullName').value.trim();const school=document.getElementById('wSchool').value.trim();const grade=document.getElementById('wGrade').value;document.getElementById('wStartBtn').disabled=!(fullName&&school&&grade&&selectedIcon)}
function startApp(){const fullName=document.getElementById('wFullName').value.trim();const school=document.getElementById('wSchool').value.trim();const grade=document.getElementById('wGrade').value;if(!(fullName&&school&&grade&&selectedIcon)){document.getElementById('wError').style.display='block';playClick();return;}localStorage.setItem('studentFullName',fullName);localStorage.setItem('studentSchool',school);localStorage.setItem('studentGrade',grade);localStorage.setItem('studentIcon',selectedIcon);playClick();window.location.href='home.html'}
window.addEventListener('click',e=>{if(e.target===document.getElementById('regOverlay'))closeRegistrationPopup();if(e.target===document.getElementById('iconModal'))closeIconModal()});
document.querySelectorAll('button,.hero-right,.hero-left,.popup-field,.icon-item').forEach(el=>{el.addEventListener('mouseenter',()=>{});el.addEventListener('click',playClick)})
</script>
</body>
</html>
