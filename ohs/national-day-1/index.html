<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بقي يوم واحد على الاحتفال الكبير · اليوم الوطني 20 نوفمبر · الجمعية التاريخية العُمانية</title>
<meta name="description" content="عرض طائرات ضوئية من الجمعية التاريخية العُمانية احتفاءً باليوم الوطني لسلطنة عُمان، 20 نوفمبر.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta property="og:title" content="بقي يوم واحد على الاحتفال الكبير ✨ اليوم الوطني 20 نوفمبر">
<meta property="og:description" content="عرض ضوئي من الجمعية التاريخية العُمانية">
<meta property="og:image" content="https://play.under-palm-tree.com/ohs/national-day-1/assets/og-national-day-eve.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#050816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
:root{--gold:#ffcf7a;--orange:#f0913f;--ink:#fbf6ee;--muted:#b8b3c4;--font:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050816;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#show{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.brand{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));width:clamp(104px,12vw,150px);margin:0;
  opacity:0;transform:translateY(-8px);transition:opacity 1.2s ease,transform 1.2s ease}
.brand.on{opacity:1;transform:none}
.brand img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(240,145,63,.35))}

.caption{position:fixed;z-index:3;left:0;right:0;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 26px);text-align:center;padding:0 18px;pointer-events:none}
.caption>*{opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.caption.on>*{opacity:1;transform:none}
.caption.on>:nth-child(2){transition-delay:.3s}
.caption.on>:nth-child(3){transition-delay:.7s}
.caption.on>:nth-child(4){transition-delay:1s}
.caption.on>:nth-child(5){transition-delay:1.25s}
.kicker{margin:0;font-weight:700;font-size:clamp(13px,1.7vw,17px);color:var(--gold);letter-spacing:.02em}
.big{margin:0;font-weight:800;line-height:1.35;font-size:clamp(38px,6.2vw,66px);
  background:linear-gradient(180deg,#fffaf0 0%,#ffe2a6 45%,#ffbe6b 75%,#f0913f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,190,110,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.sub{margin:0;font-weight:700;font-size:clamp(18px,2.6vw,27px);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 4px;color:var(--gold);font-size:13px}
.orn::before,.orn::after{content:"";height:1px;width:clamp(50px,9vw,110px);background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(270deg,transparent,var(--gold))}
.date{margin:0;font-weight:500;font-size:clamp(13px,1.6vw,16px);color:#d9d3e4;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.date b{color:#fff}
.foot{position:fixed;z-index:3;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:rgba(251,246,238,.55);
  pointer-events:none;opacity:0;transition:opacity 1s ease 1.6s}
.foot.on{opacity:1}
.replay{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font:500 13px var(--font);color:var(--ink);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.replay:hover{background:rgba(255,255,255,.16)}
.replay:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{position:fixed;z-index:3;left:0;right:0;top:calc(max(14px,env(safe-area-inset-top)) + 4px);text-align:center;font-size:12px;color:rgba(251,246,238,.5);
  pointer-events:none;opacity:0;transition:opacity 1s ease}
.hint.on{opacity:1}
@media (max-width:520px){.hint{top:auto;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 22px);font-size:11px}
  .caption{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 44px)}}
.og .replay,.og .hint{display:none}
.og .caption>*,.og .brand,.og .foot{transition:none!important}
@media (prefers-reduced-motion:reduce){.caption>*,.brand{transition:none}}
</style>
</head>
<body>
<canvas id="show" aria-label="عرض طائرات ضوئية يرسم شعار الجمعية والرقم 1 وكلمة عُمان فوق البحر"></canvas>

<figure class="brand" id="brand">
  <img src="assets/logo-full-dark.png" alt="الجمعية التاريخية العُمانية · The Historical Association of Oman" width="415" height="300">
</figure>

<section class="caption" id="caption" aria-live="polite">
  <p class="kicker">اليوم الوطني لسلطنة عُمان</p>
  <p class="big" id="big">بقي يوم واحد</p>
  <p class="sub" id="sub">على الاحتفال الكبير</p>
  <p class="orn" aria-hidden="true">✦</p>
  <p class="date"><b>20 نوفمبر</b> · ذكرى تأسيس الدولة البوسعيدية عام 1744م</p>
</section>

<p class="foot" id="foot">لجنة تقنية المعلومات – الجمعية التاريخية العُمانية – ثرياء بنت محمد الناعبية</p>
<p class="hint" id="hint">المسوا الشاشة لتحريك الطائرات الضوئية</p>
<button class="replay" id="replay" type="button">إعادة العرض ↻</button>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search), still = qs.has("og");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) document.documentElement.classList.add("og");

  /* ---------- date (Muscat) ---------- */
  var md = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Muscat",month:"2-digit",day:"2-digit"}).format(new Date()).split("-").map(Number);
  var celebrate = !still && ((md[0] === 11 && (md[1] === 20 || md[1] === 21)) || qs.get("d") === "0");
  if (celebrate){
    document.getElementById("big").textContent = "كل عام وعُمان بخير";
    document.getElementById("sub").textContent = "اليوم الوطني · 20 نوفمبر";
    document.title = "كل عام وعُمان بخير · اليوم الوطني 20 نوفمبر · الجمعية التاريخية العُمانية";
  }

  /* ---------- canvas ---------- */
  var cv = document.getElementById("show"), cx = cv.getContext("2d");
  var W, H, DPR, horizon, bgLayer, stars = [], N, drones = [], box;
  var PAL = {orange:[243,154,69], white:[255,246,234], red:[255,47,53], green:[47,209,106], gold:[255,210,122]};
  var sprites = {};
  function makeSprite(rgb){
    var s = document.createElement("canvas"); s.width = s.height = 32;
    var g = s.getContext("2d"), r = g.createRadialGradient(16,16,0,16,16,16), c = rgb.join(",");
    r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.14,"rgba("+c+",1)"); r.addColorStop(.38,"rgba("+c+",.38)"); r.addColorStop(1,"rgba("+c+",0)");
    g.fillStyle = r; g.fillRect(0,0,32,32); return s;
  }
  for (var k in PAL) sprites[k] = makeSprite(PAL[k]);
  function nearest(r,g,b){
    var best = "white", bd = 1e9;
    for (var k in PAL){ var p = PAL[k], d = (p[0]-r)*(p[0]-r)+(p[1]-g)*(p[1]-g)+(p[2]-b)*(p[2]-b); if (d < bd){ bd = d; best = k; } }
    return best;
  }

  function seeded(n){ var x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
  function buildBackground(){
    bgLayer = document.createElement("canvas"); bgLayer.width = W*DPR; bgLayer.height = H*DPR;
    var b = bgLayer.getContext("2d"); b.setTransform(DPR,0,0,DPR,0,0);
    var sky = b.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,"#03040c"); sky.addColorStop(.55,"#0a1030"); sky.addColorStop(1,"#1b1a3a");
    b.fillStyle = sky; b.fillRect(0,0,W,horizon);
    var glow = b.createRadialGradient(W/2,horizon,0,W/2,horizon,Math.max(W,H)*.6);
    glow.addColorStop(0,"rgba(240,145,63,.22)"); glow.addColorStop(1,"rgba(240,145,63,0)");
    b.fillStyle = glow; b.fillRect(0,0,W,horizon);
    // Hajar mountains silhouette
    b.beginPath(); b.moveTo(0,horizon);
    for (var x=0; x<=W; x+=6){
      var h = 0;
      h += Math.sin(x/W*Math.PI*2.1 + .6)*.5 + .5;
      h += (Math.sin(x/W*Math.PI*6.3 + 1.7)*.5 + .5)*.45;
      h += seeded(Math.floor(x/18))*.18;
      b.lineTo(x, horizon - h*Math.min(70, H*.075));
    }
    b.lineTo(W,horizon); b.closePath();
    var mg = b.createLinearGradient(0,horizon-80,0,horizon); mg.addColorStop(0,"#0d1026"); mg.addColorStop(1,"#070915");
    b.fillStyle = mg; b.fill();
    // sea
    var sea = b.createLinearGradient(0,horizon,0,H);
    sea.addColorStop(0,"#0b1233"); sea.addColorStop(.35,"#060a1e"); sea.addColorStop(1,"#02030a");
    b.fillStyle = sea; b.fillRect(0,horizon,W,H-horizon);
    b.fillStyle = "rgba(255,210,150,.10)"; b.fillRect(0,horizon,W,1);
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
    var portrait = H > W;
    horizon = Math.round(H*(portrait ? .64 : .69));
    var top = portrait ? Math.max(110, H*.14) : Math.max(36, H*.06);
    box = {x0:W*.08, x1:W*.92, y0:top, y1:horizon - H*.06};
    N = Math.round(Math.max(480, Math.min(1000, W*H/900)));
    stars = [];
    var ns = Math.round(W*horizon/6000);
    for (var i=0;i<ns;i++) stars.push({x:Math.random()*W, y:Math.random()*horizon*.85, r:Math.random()*1.1+.2, p:Math.random()*6.28, s:.4+Math.random()*1.4});
    buildBackground();
  }

  /* ---------- formations sampled from shapes ---------- */
  var off = document.createElement("canvas"), oc = off.getContext("2d", {willReadFrequently:true});
  function sample(draw, colorAt){
    var bw = Math.round(box.x1-box.x0), bh = Math.round(box.y1-box.y0);
    off.width = bw; off.height = bh; oc.clearRect(0,0,bw,bh);
    draw(oc, bw, bh);
    var d = oc.getImageData(0,0,bw,bh).data, count = 0, x, y;
    for (y=0;y<bh;y+=2) for (x=0;x<bw;x+=2) if (d[(y*bw+x)*4+3] > 140) count++;
    var step = Math.max(2, Math.sqrt(count*4/N)), pts = [];
    for (y=step/2; y<bh; y+=step) for (x=step/2; x<bw; x+=step){
      var xi = x|0, yi = y|0, i = (yi*bw+xi)*4;
      if (d[i+3] > 140) pts.push({x:box.x0+x, y:box.y0+y, c:colorAt(xi,yi,bw,bh,d[i],d[i+1],d[i+2])});
    }
    for (var j=pts.length-1;j>0;j--){ var r = Math.random()*(j+1)|0, t = pts[j]; pts[j] = pts[r]; pts[r] = t; }
    if (pts.length > N) pts.length = N;
    var base = pts.length;
    while (pts.length < N && base){ var q = pts[pts.length % base]; pts.push({x:q.x, y:q.y, c:q.c, dup:true}); }
    return pts;
  }
  function fitText(g, text, bw, bh, weight){
    g.direction = "rtl"; g.textAlign = "center"; g.textBaseline = "middle";
    var size = bh*.92;
    g.font = weight+" "+size+"px 'Noto Kufi Arabic', Tahoma, sans-serif";
    var m = g.measureText(text).width;
    if (m > bw*.94) size *= bw*.94/m;
    g.font = weight+" "+size+"px 'Noto Kufi Arabic', Tahoma, sans-serif";
    g.fillStyle = "#fff"; g.fillText(text, bw/2, bh*.54);
  }
  var flagBands = function(x,y,w,h){ var t = y/h; return t < .4 ? "white" : t < .66 ? "red" : "green"; };
  var goldWhite = function(){ return Math.random() < .72 ? "gold" : "white"; };
  var markImg = new Image(); markImg.src = "assets/logo-mark-dark.png";
  var formations = [];
  function buildFormations(){
    formations = [];
    formations.push(sample(function(g,bw,bh){
      var s = Math.min(bw/markImg.naturalWidth, bh/markImg.naturalHeight)*.96, w = markImg.naturalWidth*s, h = markImg.naturalHeight*s;
      g.drawImage(markImg, (bw-w)/2, (bh-h)/2, w, h);
    }, function(x,y,w,h,r,gg,b){ var n = nearest(r,gg,b); return n === "gold" ? "orange" : n; }));
    if (celebrate){
      formations.push(sample(function(g,bw,bh){ fitText(g,"20",bw,bh,800); }, flagBands));
      formations.push(sample(function(g,bw,bh){ fitText(g,"عُمان",bw,bh,800); }, goldWhite));
    } else {
      formations.push(sample(function(g,bw,bh){ fitText(g,"1",bw,bh,800); }, flagBands));
      formations.push(sample(function(g,bw,bh){ fitText(g,"عُمان",bw,bh,800); }, goldWhite));
      formations.push(sample(function(g,bw,bh){ fitText(g,"20 نوفمبر",bw,bh*.6,700); }, function(){ return Math.random() < .8 ? "orange" : "gold"; }));
    }
  }

  /* ---------- drones ---------- */
  function launchPositions(){
    drones = [];
    for (var i=0;i<N;i++){
      var x = W*(.06 + .88*Math.random()), y = horizon - 3;
      drones.push({x:x, y:y, fx:x, fy:y, tx:x, ty:y, c:"white", nc:"white", dup:false, ndup:false,
        delay:Math.random()*.32, lift:20+Math.random()*60, ph:Math.random()*6.28, ox:0, oy:0, vx:0, vy:0});
    }
  }
  var phase = -1, tStart = 0, DUR = 2600, HOLD = 3900, TAKEOFF = 3300;
  function goTo(idx, now){
    var f = formations[idx];
    var order = drones.slice().sort(function(a,b){ return (a.x + a.y*.35) - (b.x + b.y*.35); });
    var tgt = f.slice().sort(function(a,b){ return (a.x + a.y*.35) - (b.x + b.y*.35); });
    for (var i=0;i<order.length;i++){
      var d = order[i], t = tgt[i];
      d.fx = d.x; d.fy = d.y; d.tx = t.x; d.ty = t.y; d.nc = t.c; d.ndup = !!t.dup;
    }
    phase = idx; tStart = now;
  }
  function ease(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  /* ---------- render loop ---------- */
  var sweep = -1, sweepT = 0, last = 0;
  function frame(now){
    var dt = Math.min(2.5, (now - (last||now))/16.67); last = now;
    cx.globalCompositeOperation = "source-over"; cx.globalAlpha = 1;
    cx.drawImage(bgLayer, 0, 0, W, H);
    var tt = now/1000;
    cx.fillStyle = "#fff";
    for (var i=0;i<stars.length;i++){ var s = stars[i]; cx.globalAlpha = .25 + .45*Math.abs(Math.sin(tt*s.s + s.p)); cx.fillRect(s.x, s.y, s.r, s.r); }
    cx.globalAlpha = 1;

    // timeline
    var dur = phase === 0 && !shown ? TAKEOFF : DUR;
    var el = now - tStart, p = Math.min(1, el/dur);
    if (!still && !reduce && phase >= 0 && el > dur + HOLD){ goTo((phase+1) % formations.length, now); el = 0; p = 0; dur = DUR; shown = true; }
    if (p >= 1 && sweep < 0 && el > dur + 400){ sweep = 0; sweepT = now; }
    if (sweep >= 0){ sweep = (now - sweepT)/1500; if (sweep > 1.4 || el < dur) sweep = -1; }
    var sweepX = box.x1 - (box.x1-box.x0+200)*Math.max(0,sweep) + 100;

    cx.globalCompositeOperation = "lighter";
    var base = W < 700 ? 8 : 10, seaH = H - horizon;
    for (i=0;i<drones.length;i++){
      var d = drones[i];
      var q = Math.max(0, Math.min(1, (p - d.delay)/(1 - .32))), e = ease(q);
      var x = d.fx + (d.tx-d.fx)*e, y = d.fy + (d.ty-d.fy)*e - Math.sin(Math.PI*e)*d.lift;
      if (q > .5){ d.c = d.nc; d.dup = d.ndup; }
      // tap spring
      d.vx += (-.06*d.ox - .12*d.vx)*dt; d.vy += (-.06*d.oy - .12*d.vy)*dt; d.ox += d.vx*dt; d.oy += d.vy*dt;
      x += d.ox + Math.sin(tt*1.3 + d.ph)*.7; y += d.oy + Math.cos(tt*1.1 + d.ph)*.7;
      d.x = x; d.y = y;
      if (d.dup && q >= 1) continue;
      var boost = sweep >= 0 ? Math.exp(-Math.pow(x - sweepX, 2)/(2*45*45)) : 0;
      var sz = base*(1 + boost*.9), spr = sprites[boost > .5 ? "white" : d.c];
      cx.globalAlpha = .92;
      cx.drawImage(spr, x - sz/2, y - sz/2, sz, sz);
      // reflection on the sea
      var ry = 2*horizon - y;
      if (ry > horizon + 2 && ry < H){
        var depth = (ry - horizon)/seaH;
        cx.globalAlpha = .32*(1 - depth);
        var wob = Math.sin(ry*.09 + tt*2.2)*(2 + depth*7);
        cx.drawImage(spr, x - sz*.5 + wob, ry - sz*.9, sz, sz*1.8);
      }
    }
    cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  /* ---------- show control ---------- */
  var brand = document.getElementById("brand"), caption = document.getElementById("caption"), foot = document.getElementById("foot"), timers = [], shown = false;
  function start(now){
    timers.forEach(clearTimeout); timers = [];
    [brand, caption, foot].forEach(function(e){ e.classList.remove("on"); });
    shown = false; sweep = -1;
    launchPositions(); buildFormations();
    now = now || performance.now();
    if (still || reduce){
      goTo(still ? 1 : 0, now - 99999);
      if (still) for (var i=0;i<drones.length;i++){ var d = drones[i]; d.x = d.fx = d.tx; d.y = d.fy = d.ty; d.c = d.nc; d.dup = d.ndup; }
      if (reduce && !still) goTo(1, now - 99999);
      brand.classList.add("on"); caption.classList.add("on"); foot.classList.add("on");
      return;
    }
    phase = -1;
    timers.push(setTimeout(function(){ brand.classList.add("on"); }, 300));
    timers.push(setTimeout(function(){ goTo(0, performance.now()); }, 700));
    timers.push(setTimeout(function(){ caption.classList.add("on"); foot.classList.add("on"); }, 4200));
    var hint = document.getElementById("hint"); hint.classList.remove("on");
    timers.push(setTimeout(function(){ hint.classList.add("on"); }, 7000));
    timers.push(setTimeout(function(){ hint.classList.remove("on"); }, 12000));
  }
  resize();
  var lastW = innerWidth, rt;
  addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; resize(); start(); }, 250);
  });
  addEventListener("pointerdown", function(e){
    if (e.target.closest(".replay")) return;
    for (var i=0;i<drones.length;i++){
      var d = drones[i], dx = d.x - e.clientX, dy = d.y - e.clientY, dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < 130 && dist > .1){ var f = (130-dist)*.09; d.vx += dx/dist*f; d.vy += dy/dist*f; }
    }
  });
  document.getElementById("replay").addEventListener("click", function(){ start(); });

  var fontReady = document.fonts ? Promise.race([document.fonts.load("800 80px 'Noto Kufi Arabic'"), new Promise(function(r){ setTimeout(r, 2500); })]) : Promise.resolve();
  var imgReady = new Promise(function(r){ if (markImg.complete && markImg.naturalWidth) r(); else { markImg.onload = r; markImg.onerror = r; } });
  Promise.all([fontReady, imgReady]).then(function(){ start(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
