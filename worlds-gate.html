<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= الأساسيات ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb6c2dd, 300, 760);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1600);
camera.position.set(0, 52, 168);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 6;
controls.maxDistance = 520;
controls.maxPolarAngle = Math.PI * 0.55;
controls.enablePan = false;

/* ================= السماء المزدوجة ================= */
const skyUniforms = { uTime:{ value:0 }, uNight:{ value:0 } };
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(760, 40, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, uniforms: skyUniforms,
    vertexShader: 'varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: [
      'varying vec3 vPos; uniform float uTime; uniform float uNight;',
      'float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',
      'void main(){',
      '  vec3 d = normalize(vPos);',
      '  float h = clamp(d.y, 0.0, 1.0);',
      '  float side = smoothstep(-0.12, 0.12, d.x);',
      '  vec3 day = mix(vec3(0.80,0.91,0.95), vec3(0.45,0.78,0.93), pow(h,0.55));',
      '  vec3 night = mix(vec3(0.63,0.55,0.85), vec3(0.23,0.18,0.46), pow(h,0.5));',
      '  float sd = max(side, uNight);',
      '  vec3 col = mix(day, night, sd);',
      '  vec3 sunDir = normalize(vec3(-0.3,0.7,-0.55));',
      '  col += vec3(1.0,0.95,0.8)*pow(max(dot(d,sunDir),0.0),60.0)*(1.0-sd);',
      '  vec3 g = floor(d*230.0);',
      '  float st = hash(g);',
      '  float star = smoothstep(0.9965,1.0,st)*(0.55+0.45*sin(uTime*2.0+st*40.0));',
      '  star *= smoothstep(0.04,0.25,h)*sd;',
      '  col += star*vec3(1.0,0.9,1.0)*1.1;',
      '  gl_FragColor = vec4(col,1.0);',
      '}'
    ].join('\n')
  })
);
scene.add(sky);

/* ================= الإضاءة ================= */
const hemiLight = new THREE.HemisphereLight(0xeaf6ff, 0xb9a07a, 0.85);
scene.add(hemiLight);
const sunLight = new THREE.DirectionalLight(0xfff2d9, 1.5);
sunLight.position.set(-70, 150, 70);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -220; sunLight.shadow.camera.right = 220;
sunLight.shadow.camera.top = 200; sunLight.shadow.camera.bottom = -200;
sunLight.shadow.camera.far = 620;
sunLight.target.position.set(0, 18, -25);
scene.add(sunLight); scene.add(sunLight.target);
const nightLight = new THREE.DirectionalLight(0x8a7fff, 0.55);
nightLight.position.set(30, 20, 10);
scene.add(nightLight);

/* ================= أدوات ================= */
const floaters = [], cloudsArr = [], spinY = [], spinZ = [];
function M(color, rough){ return new THREE.MeshStandardMaterial({ color, roughness: rough===undefined?0.85:rough }); }
function sh(m){ m.castShadow = true; m.receiveShadow = true; return m; }
function canvasTex(size, fn){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const cx = cv.getContext('2d'); fn(cx, size);
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}
function makeWallTex(base, accent){
  const t = canvasTex(256, (cx,s)=>{
    cx.fillStyle = base; cx.fillRect(0,0,s,s);
    cx.fillStyle = accent; cx.globalAlpha = 0.45;
    for(let y=10;y<s;y+=20){ for(let x=10;x<s;x+=20){ cx.beginPath(); cx.arc(x+((y/20)%2?10:0), y, 1.8, 0, 7); cx.fill(); } }
    cx.globalAlpha = 0.6; cx.strokeStyle = accent; cx.lineWidth = 3;
    for(let i=0;i<6;i++){ cx.beginPath(); cx.arc(Math.random()*s, Math.random()*s, 8+Math.random()*12, 0, 7); cx.stroke(); }
    cx.globalAlpha = 1;
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function makeStripes(c1, c2){
  const t = canvasTex(128, (cx,s)=>{ cx.fillStyle=c1; cx.fillRect(0,0,s,s); cx.fillStyle=c2; for(let x=0;x<s;x+=16){ cx.fillRect(x,0,8,s); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function makeLogTex(){
  const t = canvasTex(128, (cx,s)=>{
    cx.fillStyle='#c9a06b'; cx.fillRect(0,0,s,s);
    cx.fillStyle='#b08a52'; for(let y=0;y<s;y+=16){ cx.fillRect(0,y,s,8); }
    cx.fillStyle='#8a6a40'; cx.globalAlpha=.5; for(let y=8;y<s;y+=16){ cx.fillRect(0,y,s,2); }
    cx.globalAlpha=1;
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function makeBrickTex(base, mortar){
  const t = canvasTex(256, (cx,s)=>{
    cx.fillStyle = base; cx.fillRect(0,0,s,s);
    cx.strokeStyle = mortar; cx.lineWidth = 3;
    for(let y=0;y<s;y+=32){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(s,y); cx.stroke(); }
    for(let y=0;y<s;y+=32){
      const off = (y/32)%2 ? 32 : 0;
      for(let x=off;x<s;x+=64){ cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x,y+32); cx.stroke(); }
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

/* ================= الأرض المزدوجة ================= */
const groundTex = canvasTex(2048, (cx,s)=>{
  const h = s/2;
  cx.fillStyle='#a9c07c'; cx.fillRect(0,0,h,s);
  const cols=['#9db56e','#b6cc8b','#8fae62','#c4b287'];
  for(let i=0;i<260;i++){
    cx.fillStyle=cols[i%4]; cx.globalAlpha=0.25+Math.random()*0.3;
    cx.beginPath(); cx.ellipse(Math.random()*h, Math.random()*s, 20+Math.random()*60, 10+Math.random()*30, Math.random()*3, 0, 7); cx.fill();
  }
  cx.globalAlpha=1; cx.fillStyle='#d3b78c';
  for(let i=0;i<8;i++){ cx.beginPath(); cx.ellipse(Math.random()*h, Math.random()*s, 30+Math.random()*50, 20+Math.random()*30, Math.random()*3, 0, 7); cx.fill(); }
  cx.fillStyle='#b4b077'; cx.fillRect(h,0,h,s);
  const cols2=['#a8a06a','#c2b881','#9aa05e','#c9b287'];
  for(let i=0;i<260;i++){
    cx.fillStyle=cols2[i%4]; cx.globalAlpha=0.25+Math.random()*0.3;
    cx.beginPath(); cx.ellipse(h+Math.random()*h, Math.random()*s, 20+Math.random()*60, 10+Math.random()*30, Math.random()*3, 0, 7); cx.fill();
  }
  cx.globalAlpha=1;
  const grd = cx.createLinearGradient(h-140,0,h+140,0);
  grd.addColorStop(0,'rgba(169,192,124,0)'); grd.addColorStop(0.5,'rgba(180,176,119,0.55)'); grd.addColorStop(1,'rgba(180,176,119,0)');
  cx.fillStyle=grd; cx.fillRect(h-140,0,280,s);
  cx.strokeStyle='#d8c9a2'; cx.lineWidth=s*0.05; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(h, s*0.5); cx.quadraticCurveTo(h*0.6, s*0.52, h*0.42, s*0.5); cx.stroke();
  const peb=['#c94a3a','#e8a33a','#d8c9a2','#8a9aa0','#b06a3a','#c9b287'];
  for(let i=0;i<130;i++){
    const t = i/130;
    const px = h + t*h*0.62;
    const py = s*0.5 + Math.sin(t*7)*30 + (Math.random()-0.5)*46;
    cx.fillStyle = peb[i%6]; cx.globalAlpha = 0.85;
    cx.beginPath(); cx.ellipse(px, py, 8+Math.random()*16, 6+Math.random()*11, Math.random()*3, 0, 7); cx.fill();
  }
  cx.globalAlpha=1;
});
groundTex.anisotropy = 8;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(560, 460), new THREE.MeshStandardMaterial({ map:groundTex, roughness:1 }));
ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;
scene.add(ground);


/* ============================================================
   جزيرة عائمة تحت كلّ عالم — على مثال جزيرة النغمات
   ============================================================ */
function makeIsle(x, z, r, topHex, sideHex, y){
  const depth = Math.max(8, y - 3);
  const g = new THREE.Group();
  g.position.set(x, y, z);
  scene.add(g);
  /* السطح: قرص متموّج الحافة */
  const top = new THREE.CylinderGeometry(r, r*0.94, 3.2, 56, 2);
  { const pos = top.attributes.position;
    for(let i=0;i<pos.count;i++){
      const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      const n = Math.sin(px*0.09) + Math.cos(pz*0.085);
      pos.setX(i, px*(1+n*0.018)); pos.setZ(i, pz*(1+n*0.018));
      if(py > 0) pos.setY(i, py + Math.sin(px*0.13+pz*0.11)*0.5);
    }
    top.computeVertexNormals(); }
  const tm = new THREE.Mesh(top, new THREE.MeshStandardMaterial({ color:topHex, roughness:0.95 }));
  tm.position.y = -1.6; tm.receiveShadow = true; g.add(tm);
  /* الأسفل الصخري */
  const bot = new THREE.CylinderGeometry(r*0.93, r*0.16, depth||34, 30, 6);
  { const pos = bot.attributes.position;
    for(let i=0;i<pos.count;i++){
      const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
      const n = Math.sin(px*0.13+py*0.16) + Math.cos(pz*0.12-py*0.14);
      pos.setX(i, px*(1+n*0.045)); pos.setZ(i, pz*(1+n*0.045));
    }
    bot.computeVertexNormals(); }
  const bm = new THREE.Mesh(bot, new THREE.MeshStandardMaterial({ color:sideHex, roughness:1, flatShading:true }));
  bm.position.y = -3.2 - (depth||34)/2; bm.castShadow = true; g.add(bm);
  /* نتوءات صخرية */
  for(let i=0;i<3;i++){
    const sp = new THREE.Mesh(new THREE.ConeGeometry(r*0.16, r*0.5, 7),
      new THREE.MeshStandardMaterial({ color:sideHex, roughness:1, flatShading:true }));
    sp.position.set((Math.random()-0.5)*r*0.5, -3.2-(depth||34)-r*0.18, (Math.random()-0.5)*r*0.5);
    sp.rotation.z = (Math.random()-0.5)*0.35; sp.castShadow = true; g.add(sp);
  }
  return g;
}

makeIsle(-108,  76,  42, '#a9c07c', '#8a9a72', 17);   /* ليمبو */
makeIsle(-118, -78,  46, '#b4b077', '#96906a', 19);   /* زومبينيس */
makeIsle(   0, -152, 34, '#cbbfa4', '#8f8878', 22);   /* قلعة الشطرنج */
makeIsle( 112,   84, 34, '#b8d66b', '#8fae7a', 15);   /* وادي الكب كيك */
makeIsle(   0,  205, 32, '#2e2733', '#3a3140', 18);   /* قرية الفطر */

/* ================= البوابة ================= */

const ringMat = new THREE.MeshStandardMaterial({ color:0x7a4fd0, emissive:0x5a2fb0, emissiveIntensity:0.7, roughness:0.4 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(3, 0.35, 14, 48), ringMat);
ring.rotation.y = Math.PI/2; ring.position.y = 4; ring.castShadow = true;
portal.add(ring);
const discMat = new THREE.ShaderMaterial({
  transparent:true, side:THREE.DoubleSide, depthWrite:false,
  uniforms:{ uTime:{ value:0 } },
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:[

function gableRoof(w, d, h, stripeMat, solidColor){
  const g = new THREE.Group();
  const ang = Math.atan2(h, w/2), len = Math.hypot(w/2, h) + 0.7, dep = d + 0.7;
  const geo = new THREE.BoxGeometry(len, 0.12, dep);
  const L = new THREE.Mesh(geo, stripeMat); L.rotation.z = ang;  L.position.set(-w/4, h/2, 0);
  const R = new THREE.Mesh(geo, stripeMat); R.rotation.z = -ang; R.position.set( w/4, h/2, 0);
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, 0); shape.lineTo(w/2, 0); shape.lineTo(0, h); shape.closePath();
  const tm = new THREE.MeshStandardMaterial({ color:solidColor, side:THREE.DoubleSide, roughness:0.9 });
  const tg = new THREE.ShapeGeometry(shape);
  const T1 = new THREE.Mesh(tg, tm); T1.position.z =  d/2 + 0.02;
  const T2 = new THREE.Mesh(tg, tm); T2.position.z = -d/2 - 0.02; T2.rotation.y = Math.PI;
  g.add(L, R, T1, T2);
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}
function house(cfg){
  const g = new THREE.Group();
  cfg.wallTex.repeat.set(cfg.w/2.5, cfg.h/2.5);
  const walls = sh(new THREE.Mesh(new THREE.BoxGeometry(cfg.w, cfg.h, cfg.d), new THREE.MeshStandardMaterial({ map:cfg.wallTex, roughness:0.9 })));
  walls.position.y = cfg.h/2; g.add(walls);
  cfg.roofTex.repeat.set(4, 1);
  const roof = gableRoof(cfg.w, cfg.d, cfg.rh, new THREE.MeshStandardMaterial({ map:cfg.roofTex, roughness:0.8 }), cfg.roofSolid);
  roof.position.y = cfg.h; g.add(roof);
  g.position.set(cfg.x, 0, cfg.z); g.rotation.y = cfg.rot || 0;
  return g;
}

  rim.rotation.x = Math.PI/2; rim.position.y = -size*0.37; g.add(rim);

  for(let i=0;i<8;i++){
    const pg = new THREE.Group(); pg.rotation.y = i/8*Math.PI*2;
    const petal = new THREE.Mesh(new THREE.ConeGeometry(size*0.16, size*0.55, 4), pm);
    petal.rotation.z = Math.PI + 0.55; petal.position.set(size*0.85, -size*0.45, 0);

  const tm = M(tentColor, 0.5);
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2, pts = [];
    for(let k=0;k<=8;k++){
      const t = k/8;
      pts.push(new THREE.Vector3(
        Math.cos(a)*size*0.5 + Math.sin(t*6+i)*size*0.18,
        -size*0.4 - t*size*3.2,
        Math.sin(a)*size*0.5 + Math.cos(t*5+i)*size*0.15));
    }
    tgroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, size*0.05, 5), tm));
  }
  g.userData.tentacles = tgroup;
  return g;
}

  /* سقف عُماني: سطح مسطّح + طنف بارز + سياج بشُرفات مسننة على الحواف الأربع
     + مزاريب خشبية + عوارض من جذوع النخيل — لا أسقف مثلثة ولا قرميد أحمر. */
  function buildRoof(g,w,d,h,roofH,wallMat,woodParts,glowParts){
    var ov=0.28,i,k,s;
    /* بلاطة السطح */
    var slab=mesh(new THREE.BoxGeometry(w+ov*2,0.30,d+ov*2),wallMat,true);
    slab.position.y=h+0.15; g.add(slab);
    /* الطنف: حافّة سفلية بارزة */
    var cornice=mesh(new THREE.BoxGeometry(w+ov*2.8,0.12,d+ov*2.8),matWoodDk,true);
    cornice.position.y=h+0.02; g.add(cornice);

    /* سياج السطح على الحواف الأربع */
    var pw=0.16,ph=Math.max(0.42,roofH*0.30);
    var RW=w+ov*2,RD=d+ov*2;
    var rails=[[RW,pw,0,RD/2-pw/2],[RW,pw,0,-(RD/2-pw/2)],
               [pw,RD,RW/2-pw/2,0],[pw,RD,-(RW/2-pw/2),0]];
    for(i=0;i<rails.length;i++){
      var rl=rails[i];
      var rail=mesh(new THREE.BoxGeometry(rl[0],ph,rl[1]),wallMat,true);
      rail.position.set(rl[2],h+0.30+ph/2,rl[3]); g.add(rail);
    }

    /* الشُّرفات المسننة */
    var mw=0.19,mh=0.30,gap=0.40,merlons=[],axes=['x','z'];
    for(var ax=0;ax<2;ax++){
      var len=(axes[ax]==='x')?RW:RD;
      var n=Math.max(2,Math.floor(len/gap)),step=len/n;
      for(i=0;i<n;i++){
        var p=-len/2+step*(i+0.5);
        for(k=0;k<2;k++){
          s=k?1:-1;
          if(axes[ax]==='x') merlons.push([p,h+0.30+ph+mh/2,s*(RD/2-pw/2)]);
          else               merlons.push([s*(RW/2-pw/2),h+0.30+ph+mh/2,p]);
        }
      }
    }
    var mInst=new THREE.InstancedMesh(new THREE.BoxGeometry(mw,mh,mw),matTile,merlons.length);
    for(i=0;i<merlons.length;i++){
      dummy.position.set(merlons[i][0],merlons[i][1],merlons[i][2]);
      dummy.rotation.set(0,R(-0.03,0.03),0);
      dummy.scale.set(R(0.92,1.08),R(0.9,1.12),R(0.92,1.08));
      dummy.updateMatrix(); mInst.setMatrixAt(i,dummy.matrix);
      mInst.setColorAt(i,tmpC.set(0xD9B489).offsetHSL(0,R(-0.02,0.02),R(-0.06,0.05)));
    }
    mInst.instanceColor.needsUpdate=true;
    mInst.castShadow=true; mInst.receiveShadow=true; g.add(mInst);

    /* مزاريب تصريف ماء المطر */
    for(k=0;k<2;k++){
      s=k?1:-1;
      var spout=mesh(new THREE.BoxGeometry(0.11,0.09,0.55),matWoodDk,true);
      spout.position.set(s*w*0.28,h+0.22,RD/2+0.2); g.add(spout);
    }
    /* عوارض جذوع النخيل البارزة تحت السطح */
    var nB=Math.max(3,Math.round(w/0.85));
    for(i=0;i<nB;i++){
      var beam=mesh(new THREE.CylinderGeometry(0.055,0.06,d+ov*2+0.45,6),matWoodDk,true);
      beam.rotation.x=Math.PI/2;
      beam.position.set(-w/2+0.35+i*((w-0.7)/(nB-1||1)),h-0.14,0);
      g.add(beam);
    }
  }

  function buildHouse(cfg){
    var w=cfg.w,d=cfg.d,h=cfg.h,roofH=cfg.roofH,scale=cfg.scale||1;
    var g=new THREE.Group();

    buildRoof(g,w,d,h,roofH,cfg.wall||matClay,woodParts,glowParts);
    pushDoor(woodParts,0,0,d/2+0.02,0);
    pushWindow(woodParts,glowParts,-w*0.3,h*0.55,d/2+0.02,0,0.8,0.95);
    pushWindow(woodParts,glowParts, w*0.3,h*0.55,d/2+0.02,0,0.8,0.95);
    pushWindow(woodParts,glowParts, w/2+0.02,h*0.55,0,Math.PI/2,0.8,0.9);
    if(cfg.roundWin) pushRoundWindow(woodParts,glowParts,0,h+roofH*0.52,d/2+0.06,0,0.42);
    if(cfg.balcony){
      woodParts.push(put(new THREE.BoxGeometry(w*0.7,0.09,0.8),0,h*0.42,d/2+0.42));
      woodParts.push(put(new THREE.BoxGeometry(w*0.7,0.06,0.06),0,h*0.42+0.52,d/2+0.78));

    }
    g.add(mesh(mergeGeos(woodParts),matWood,true));
    g.add(mesh(mergeGeos(glowParts),matWinGlow,false,false));
    if(cfg.lantern!==false) addLantern(g,0.85,2.15,d/2+0.12,true);
    if(cfg.chimney){
      var ch=mesh(new THREE.CylinderGeometry(0.28,0.36,1.4,7),matClay2,true);

      cr.position.set(w*0.22,h+roofH*0.7+0.8,0); g.add(cr);
    }
    g.scale.setScalar(scale);
    return g;
  }

  function buildWoodBridge(p1,p2,arch,width){
    var woodParts=[],ropeParts=[],i;
    var mid=p1.clone().lerp(p2,0.5); mid.y+=arch;
    var curve=new THREE.QuadraticBezierCurve3(p1,mid,p2);
    var N=18;
    for(i=0;i<=N;i++){
      var t=i/N,pos=curve.getPoint(t),tan=curve.getTangent(t);
      var yaw=Math.atan2(tan.x,tan.z);
      woodParts.push(put(new THREE.BoxGeometry(width,0.06,0.3),pos.x,pos.y,pos.z,0,yaw,0));
      if(i%3===0&&i>0&&i<N){
        var side=new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0)).normalize();
        var sds=[1,-1];
        for(var k=0;k<2;k++){
          var sd=sds[k];
          var px=pos.x+side.x*sd*width/2,pz=pos.z+side.z*sd*width/2;
          woodParts.push(put(new THREE.CylinderGeometry(0.045,0.05,1.05,5),px,pos.y+0.5,pz));
        }
      }
    }
    var topsL=[],topsR=[];
    for(i=0;i<=6;i++){
      var t2=i/6,pos2=curve.getPoint(t2),tan2=curve.getTangent(t2);
      var side2=new THREE.Vector3().crossVectors(tan2,new THREE.Vector3(0,1,0)).normalize();
      topsR.push(new THREE.Vector3(pos2.x+side2.x*width/2,pos2.y+1.02,pos2.z+side2.z*width/2));
      topsL.push(new THREE.Vector3(pos2.x-side2.x*width/2,pos2.y+1.02,pos2.z-side2.z*width/2));
    }
    ropeParts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(topsL),16,0.035,5));
    ropeParts.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(topsR),16,0.035,5));
    CITY.add(mesh(mergeGeos(woodParts),matWood,true));
    CITY.add(mesh(mergeGeos(ropeParts),matRope,true));

  btnDay.classList.toggle('active', dayMode !== 'auto');
});
function updateDayNight(dt){
  dayClock += dt;
  const target = dayMode === 'day' ? 0 : dayMode === 'night' ? 1 :
                 (0.5 - 0.5*Math.cos(dayClock * 0.0524));      /* دورة كاملة ≈ ١٢٠ ثانية */
  nightVal += (target - nightVal) * Math.min(1, dt * (dayMode === 'auto' ? 4 : 1.4));
  const n = nightVal;
  skyUniforms.uNight.value = n;
  sunLight.intensity   = 1.5  - 1.42*n;
  hemiLight.intensity  = 0.85 - 0.55*n;
  hemiLight.color.setHex(n > 0.5 ? 0x6a7ab0 : 0xeaf6ff);
  nightLight.intensity = 0.35 + 0.95*n;
  scene.fog.color.lerpColors(DAY_FOG, NIGHT_FOG, n);
  scene.fog.near = 210 - 60*n; scene.fog.far = 560 - 140*n;
  renderer.toneMappingExposure = 1.08 + 0.34*n;
  if(aliceGate.userData.veilM){
    aliceGate.userData.veilM.opacity = 0.26 + 0.34*n;
    aliceGate.userData.glowL.intensity = 1.2 + 2.4*n;
  }
  flies.material.opacity = 0.25 + 0.7*n;
  portalLight.intensity = 1.4 + 1.6*n;
  return n;
}

function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

 if(tier===0){const S=[['She',1],['He',1],['They',0],['We',0],['I',0],['The cat',1]];const V=[['go','goes'],['play','plays'],['like','likes'],['watch','watches']];const s=S[Math.floor(rng()*S.length)],v=V[Math.floor(rng()*V.length)];const good=s[1]?v[1]:v[0],bad=s[1]?v[0]:v[0]+'s';return Q('choose','Choose the correct sentence:',null,[[s[0]+' '+good+' every day.',1],[s[0]+' '+bad+' every day.',0]],s[0]+' → '+good+' (present simple).');}
 if(tier===1){const V=[['eat','ate','eated'],['run','ran','runned'],['buy','bought','buyed']];const v=V[Math.floor(rng()*V.length)];return Q('fill','Fill in the blank:','She ___ yesterday.',[[v[1],1],[v[0],0],[v[2],0]],'Past of '+v[0]+' = '+v[1]+'.');}

}

function lockNote(msg){
  const n = $q('lockNote'); n.textContent = msg; n.classList.add('on');
  clearTimeout(n._t); n._t = setTimeout(()=>n.classList.remove('on'), 2600);
}
/* موضع الكاميرا على الجسر عند نسبة t */
function bridgeCam(info, t){
  const P = info.P, n = P.length-1;
  const f = Math.max(0, Math.min(1, t)) * n;
  const i = Math.min(n-1, Math.floor(f)), k = f - i;
  const x = P[i].x + (P[i+1].x - P[i].x)*k;
  const y = P[i].y + (P[i+1].y - P[i].y)*k;
  const c = Math.cos(info.ang), sN = -Math.sin(info.ang);
  const at  = new THREE.Vector3((x+18)*c, y+2.4, (x+18)*sN);
  const eye = new THREE.Vector3((x-15)*c, y+8.2, (x-15)*sN);
  return { eye, at };
}
function openBridge(info, instant){
  info.bar.visible = false;
  if(info.sign && info.sign.material) info.sign.material.emissive = new THREE.Color(0x3a2a08);
}
function refreshLocks(){
  BRIDGE_INFO.forEach(info=>{ if(isOpen(info.key)) openBridge(info, true); });
  setFocusLabels();
}
function startCrossing(key){
  if(tween || QZ.on) return;
  const idx = BRIDGE_INFO.findIndex(b=>b.key===key);
  if(idx < 0) return;
  QZ.on = true; QZ.idx = idx; QZ.step = 0; QZ.hearts = 3;
  QZ.mode = BRIDGE_INFO[idx].mode || 'tiles';
  AVATAR.visible = true;
  controls.enabled = false; controls.autoRotate = false;
  btnRotate.classList.remove('active');
  $q('qWorld').textContent = BRIDGE_INFO[idx].name + ' · ' +
    (QZ.mode==='tiles' ? 'بلاط الجسر' : QZ.mode==='lies' ? 'حقيقة أم افتراض؟' : 'كلمات أليس');
  qWrap.classList.add('on');
  moveToStep();
  nextQuestion();
}
function bridgePoint(info, t){
  const P = info.P, n = P.length-1;
  const f = Math.max(0, Math.min(1, t)) * n;
  const i = Math.min(n-1, Math.floor(f)), k = f - i;
  const x = P[i].x + (P[i+1].x - P[i].x)*k;
  const y = P[i].y + (P[i+1].y - P[i].y)*k;
  const c = Math.cos(info.ang), sN = -Math.sin(info.ang);
  return { world:new THREE.Vector3(x*c, y, x*sN), x, y };
}
function moveToStep(){
  const info = BRIDGE_INFO[QZ.idx];
  const t = (QZ.step + 0.55) / (QZ.total + 0.55);
  const c = bridgeCam(info, t);
  camera.position.copy(c.eye);
  controls.target.copy(c.at);
  camera.lookAt(c.at);
  /* يارا تقف على البلاطة الحالية */
  const p = bridgePoint(info, t);
  AVATAR.position.set(p.world.x, p.world.y + 0.3, p.world.z);
  AVATAR.rotation.y = info.ang + Math.PI/2;
  /* أضئ بلاطتَي الصفّ الحالي وأطفئ ما عداهما */
  const row = Math.min(info.rows-1, Math.round(t*(info.rows-1)));
  info.tiles.forEach(tl=>{
    const on = tl.userData.row === row;
    if(on !== tl.userData.lit){
      tl.userData.lit = on;
      tl.material = on ? (tl.userData.hi || (tl.userData.hi =
        new THREE.MeshStandardMaterial({ color:0xffe6a8, roughness:0.5,
          emissive:0xf0b03a, emissiveIntensity:0.5 }))) : (tl.userData.base || tl.material);
    }
    if(!tl.userData.base && !on) tl.userData.base = tl.material;
  });
}
function renderHearts(){
  $q('qHearts').textContent = '❤️'.repeat(Math.max(0,QZ.hearts)) + '🖤'.repeat(Math.max(0,3-QZ.hearts));
  $q('qStep').textContent = AR_NUM(Math.min(QZ.step+1, QZ.total)) + ' / ' + AR_NUM(QZ.total);
  $q('qBarFill').style.width = (QZ.step/QZ.total*100) + '%';
}
function nextQuestion(){
  renderHearts();
  $q('qWhy').classList.add('hidden');
  $q('qNext').classList.add('hidden');
  const opts = $q('qOpts'), rear = $q('qRearr');
  opts.innerHTML = ''; rear.classList.add('hidden'); opts.classList.remove('hidden');
  opts.dataset.done = '';
  const addOpt = (label, ok, cls)=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(cls) b.classList.add(cls);
    b.onclick = ()=>{
      if(opts.dataset.done) return;
      opts.dataset.done = '1';
      b.classList.add(ok ? 'ok' : 'bad');
      grade(ok);
    };
    opts.appendChild(b);
  };

  /* ---- ١) بلاط جسر القواعد ---- */
  if(QZ.mode === 'tiles'){
    const q = QZ.q = pickQ(QZ.step + 1 + QZ.idx*2);
    $q('qPrompt').textContent = q.prompt;
    $q('qSent').textContent = q.sent || '';
    if(q.type === 'rearrange'){
      opts.classList.add('hidden'); rear.classList.remove('hidden');
      const words = $q('qWords'), slots = $q('qSlots');
      words.innerHTML = ''; slots.innerHTML = '';
      shuffle(q.ans, mulberry(QZ.step*97 + 13)).forEach(w=>{
        const b = document.createElement('span'); b.textContent = w;
        b.onclick = ()=>{ slots.appendChild(b); };
        words.appendChild(b);
      });
      slots.onclick = e=>{ if(e.target.tagName==='SPAN') words.appendChild(e.target); };
      $q('qCheck').onclick = ()=>{
        const got = [...slots.children].map(c=>c.textContent);
        if(got.length < q.ans.length){ lockNote('استعملوا كلّ الكلمات'); return; }
        grade(got.join(' ') === q.ans.join(' '));
      };
      return;
    }
    shuffle(q.opts, mulberry(QZ.step*31 + QZ.idx*7 + 5)).forEach((o,i)=>{
      addOpt(String.fromCharCode(65+i) + '. ' + o.t, o.ok);
    });
    return;
  }

  /* ---- ٢) القرية التي تكذب: حقيقة أم افتراض ---- */
  if(QZ.mode === 'lies'){
    const L = LIES[(QZ.step*5 + QZ.idx*3 + Math.floor(Math.random()*LIES.length)) % LIES.length];
    QZ.q = { en:L[2] };
    $q('qPrompt').textContent = 'Fact or assumption? — حقيقة أم افتراض؟';
    $q('qSent').textContent = L[0];
    const isFact = L[1] === 'fact';
    const order = Math.random() < 0.5;
    const A = ()=> addOpt('🔎  FACT — حقيقة، أراها بعينيّ', isFact);
    const B = ()=> addOpt('🌫  ASSUMPTION — افتراض، ما زال يحتاج دليلًا', !isFact);
    if(order){ A(); B(); } else { B(); A(); }
    return;
  }

  /* ---- ٣) كلمات عالم أليس ---- */
  const w = aliceWord(QZ.step + QZ.idx*3 + 1);
  QZ.q = { en: w.en + ' = ' + w.ar };
  $q('qPrompt').textContent = 'What does this word mean? — ما معنى الكلمة؟';
  $q('qSent').textContent = '✦ ' + w.en;
  shuffle(w.opts, mulberry(QZ.step*17 + QZ.idx*11 + 3)).forEach(o=>{
    addOpt(o, o === w.ar);
  });
}
function grade(ok){
  const q = QZ.q;
  $q('qWhy').textContent = (ok ? '✔ ' : '✘ ') + (q.en || '');
  $q('qWhy').classList.remove('hidden');
  if(ok){
    QZ.step++;
    renderHearts();
    if(QZ.step >= QZ.total){ finishCrossing(true); return; }
    moveToStep();
  } else {
    QZ.hearts--;
    renderHearts();
    if(QZ.hearts <= 0){ finishCrossing(false); return; }
  }
  $q('qNext').classList.remove('hidden');
  $q('qNext').textContent = ok ? 'خطوة إلى الأمام ◂' : 'حاولوا مرّة أخرى ◂';
}
function finishCrossing(won){
  const info = BRIDGE_INFO[QZ.idx];
  qWrap.classList.remove('on');
  QZ.on = false;
  AVATAR.visible = false;
  info.tiles.forEach(tl=>{ if(tl.userData.base){ tl.material = tl.userData.base; tl.userData.lit = false; } });
  controls.enabled = true;
  if(won){
    wgSave.open[info.key] = 1; wgPersist();
    openBridge(info);
    lockNote('فُتح ' + info.name + ' 🎉 — اضغطوا زرّه للطيران إليه');
    setFocusLabels();
    const c = bridgeCam(info, 1);
    flyTo(c.eye.clone(), c.at.clone(), 3000);
  } else {
    lockNote('انتهت القلوب — ارجعوا وحاولوا مرّة أخرى');
    flyTo(new THREE.Vector3(0, 34, 74), new THREE.Vector3(0, 6, 0), 3000);
  }
}
$q('qNext').onclick = ()=> nextQuestion();
$q('qQuit').onclick = ()=>{ QZ.on = false; AVATAR.visible = false; qWrap.classList.remove('on'); controls.enabled = true;
  flyTo(new THREE.Vector3(0, 34, 74), new THREE.Vector3(0, 6, 0), 2600); };

        mCoat = mk(0x6f8f9d,1), mLeg = mk(0xd8a94e,0.8), mShoe = mk(0xe07a20,0.6), mWhite = mk(0xefe8d8,0.7);

  [0.7, Math.PI*2-1.3].forEach(th=>{

    const m = new THREE.Mesh(geo, mCoat); m.position.y = 0.84+0.30; body.add(m);
  });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.095,0.115,0.30,12), mHead);
  neck.position.y = 1.24; body.add(neck);
  const head = new THREE.Group(); head.position.y = 1.88; body.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16), mHead);
  skull.scale.set(1,1.06,0.96); skull.castShadow = true; head.add(skull);
  for(let i=0;i<14;i++){
    const a = i/14*Math.PI*2, len = 0.42 + (i%3)*0.08;

  }
  function eggGeo(rr,seg){
    const eg = new THREE.SphereGeometry(rr,seg,Math.round(seg*0.8)), ps = eg.attributes.position;
    for(let q=0;q<ps.count;q++){ const u=(ps.getY(q)/rr+1)/2, k=0.64+0.5*(1-u);
      ps.setX(q,ps.getX(q)*k); ps.setZ(q,ps.getZ(q)*k); }
    eg.computeVertexNormals(); return eg;
  }
  [0.43,-0.43].forEach(x=>{
    const e = new THREE.Group(); e.position.set(x,0.05,0.21);
    const ball = new THREE.Mesh(eggGeo(0.318,18), mEye); ball.scale.set(1,1.08,0.58); e.add(ball);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(0.045,10,10), mPup);
    pup.position.set(x>0?-0.064:0.064,-0.11,0.185); e.add(pup);
    head.add(e);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.38,0.032,10,26), mRim);
    rim.position.set(x,0.05,0.45); head.add(rim);
    [[0.62,0.18],[0.95,0.21],[1.28,0.17]].forEach(a=>{
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.027,a[1],6), mPup);
      const sgn = x>0?1:-1;
      c.position.set(x+sgn*0.30*Math.sin(a[0]), 0.08+0.345*Math.cos(a[0]), 0.46);
      c.rotation.z = -sgn*a[0]; c.translateY(a[1]*0.45); head.add(c);
    });
  });
  const legs = [];
  [-1,1].forEach(sd=>{
    const lp = new THREE.Group(); lp.position.set(sd*0.1,0.62,0); body.add(lp);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.033,0.6,8), mLeg);

    const sl = new THREE.Mesh(new THREE.CylinderGeometry(0.082,0.09,0.6,10), mCoat);
    sl.position.y = -0.3; piv.add(sl); arms.push(piv);

  g.userData = { legs, arms, body };

})();

/* ---- بنك «القرية التي تكذب»: حقيقة أم افتراض؟ ---- */
const LIES = [
  ["The bell is gone, so someone stole it.","assume","Something missing is a FACT; who took it is a GUESS."],
  ["The clock shows 6:42.","fact","You can read it with your own eyes."],
  ["Fen said the bell was missing yesterday.","fact","He said it — that he is right is another matter."],
  ["Nine thousand followers, so the account is real.","assume","A crowd is weather, not proof."],
  ["The work order is written in Bram's ink.","fact","The paper is here; you can check the writing."],
  ["He runs fast, so he must be the thief.","assume","Running is not a confession."],
  ["The cat's paw prints are in the flour.","fact","The prints are on the floor right now."],
  ["Nobody answered, so nobody is home.","assume","Maybe they are asleep, or busy, or afraid."],
  ["The photo was taken yesterday at noon.","fact","The shadows and the date both say so."],
  ["She is new here, so she cannot be trusted.","assume","Being new is not being dishonest."],
  ["The door lock was changed this morning.","fact","Bram changed it, and the new lock is there."],
  ["The message says HURRY, so it must be urgent.","assume","Urgency is a costume. Evidence never hurries."],
  ["The clapper is in the storage crate.","fact","You opened the crate and saw it."],
  ["The tower is old, so it is dangerous.","assume","Old is not the same as unsafe."],
  ["Mo fixed the ladder hinge last week.","fact","It is written in his own posts, two years deep."],
  ["I don't know yet.","fact","Not knowing, said honestly, is always true."]
];

/* ---- كلمات عالم أليس من منهج الموقع ---- */
function aliceWord(level){
  const P = window.PALM;
  if(P && P.LEVELS && P.LEVELS.length){
    const lv = P.LEVELS[(level*7) % P.LEVELS.length];
    const items = lv.items || lv.words || [];
    if(items.length >= 3){
      const pick = i => items[(i) % items.length];
      const a = pick(Math.floor(Math.random()*items.length));
      const b = pick(items.indexOf(a)+1), c = pick(items.indexOf(a)+2);
      const en = a.en || a.word || a[0], ar = a.ar || a.meaning || a[1];
      const wrong = [b,c].map(x=>x.ar || x.meaning || x[1]).filter(x=>x && x!==ar);
      if(en && ar && wrong.length) return { en, ar, opts:[ar].concat(wrong).slice(0,3) };
    }
  }
  const F = [["mother","أم","أب","أخت"],["water","ماء","نار","هواء"],["window","نافذة","باب","سقف"],
             ["bridge","جسر","نهر","جبل"],["night","ليل","نهار","صباح"],["friend","صديق","غريب","جار"]];
  const f = F[Math.floor(Math.random()*F.length)];
  return { en:f[0], ar:f[1], opts:[f[1],f[2],f[3]] };
}

const clockT = new THREE.Clock();
let firstFrame = true;
function tick(){
  const dt = Math.min(clockT.getDelta(), 0.05);
  const t = clockT.elapsedTime;
  skyUniforms.uTime.value = t;
  discMat.uniforms.uTime.value = t;
  const nightNow = updateDayNight(dt);
  if(AVATAR.visible){
    const sw = Math.sin(t*7)*0.35;
    AVATAR.userData.legs[0].rotation.x =  sw*0.25;
    AVATAR.userData.legs[1].rotation.x = -sw*0.25;
    AVATAR.userData.arms[0].rotation.x = -sw*0.2;
    AVATAR.userData.arms[1].rotation.x =  sw*0.2;
    AVATAR.userData.body.position.y = Math.abs(Math.sin(t*3.4))*0.06;
  }
  shroomTick(t, nightNow);
  if(typeof cityTick === 'function') cityTick(t);
  floaters.forEach(f=>{
    f.obj.position.y = f.baseY + Math.sin(t*f.speed + f.phase)*f.amp;
    f.obj.rotation.y += dt*f.rot;
    f.obj.rotation.z = Math.sin(t*0.4 + f.phase)*0.04;
    if(f.obj.userData.tentacles){ f.obj.userData.tentacles.rotation.x = Math.sin(t*0.8 + f.phase)*0.08; }
  });
  cloudsArr.forEach(c=>{
    c.obj.position.x += dt*c.speed;
    if(c.obj.position.x > 60) c.obj.position.x = -60;
  });
  pcSway.forEach(sw=>{ sw.obj.rotation.z = Math.sin(t*0.8 + sw.phase)*sw.amp; });
  pcFlags.forEach(f=>{ f.obj.rotation.z = Math.sin(t*2.2 + f.phase)*0.12; });
  spinY.forEach(p=>p.rotation.y += dt*1.5);
  spinZ.forEach(w=>w.rotation.z += dt*0.3);
  flies.rotation.y = Math.sin(t*0.1)*0.05;
  flies.position.y = Math.sin(t*0.6)*0.4;
  portalLight.intensity = 2 + Math.sin(t*2.4)*0.6;

  /* ---- حياة جزيرة النغمات ---- */
  figment.position.y = FIG_BASE.y + Math.sin(t*0.3)*0.6;
  figSway.forEach(s=>{ s.obj.rotation[s.ax] = Math.sin(t*1.2 + s.phase)*s.amp; });
  figBob.forEach(b=>{ b.obj.position.y = b.baseY + Math.sin(t*0.7 + b.phase)*b.amp; });
  if(figBird){
    const fba = t*0.45;
    const fby = 4.4 + Math.sin(t*2)*0.3;
    figBird.position.set(Math.cos(fba)*6.5, fby, Math.sin(fba)*6.5);
    figBird.lookAt(
      figment.position.x + Math.cos(fba+0.12)*6.5,
      figment.position.y + fby,
      figment.position.z + Math.sin(fba+0.12)*6.5
    );
    const flap = Math.sin(t*10)*0.7;
    figWingL.rotation.y = flap; figWingR.rotation.y = -flap;
  }
  figNotes.forEach(n=>{
    n.t += dt*n.speed;
    if(n.t > 1) n.t -= 1;
    const k = n.t;
    n.sp.position.set(
      n.em.x + Math.sin(t*1.2 + n.off)*0.7,
      n.em.y + k*6.5,
      n.em.z + Math.cos(t*0.9 + n.off)*0.4
    );
    n.sp.material.opacity = k < 0.2 ? k/0.2 : (1-k)/0.8;
    n.sp.scale.setScalar(0.6 + k*0.9);
  });

  /* ---- حياة قلعة الشطرنج ---- */
  chessHearts.forEach(h=>{
    h.obj.position.y = h.baseY + Math.sin(t*0.8 + h.phase)*0.3;
    h.obj.rotation.y = Math.sin(t*0.45 + h.phase)*0.22;
    h.obj.rotation.z = Math.sin(t*0.6 + h.phase)*0.05;
    h.obj.scale.setScalar(chPulseOn ? 1 + 0.06*Math.sin(t*2.6 + h.phase) : 1);
  });
  chessSway.forEach(s=>{ s.obj.rotation[s.ax] = Math.sin(t*1.1 + s.phase)*s.amp; });
  if(chessDust){
    chessDust.position.y = Math.sin(t*0.5)*0.4;
    chessDust.rotation.y = Math.sin(t*0.08)*0.1;
  }

  /* ---- حياة وادي الكب كيك ---- */
  cupSway.forEach(s=>{ s.obj.rotation[s.ax] = Math.sin(t*1.1 + s.phase)*s.amp; });
  cupClouds.forEach(c=>{
    c.obj.position.x += dt*c.speed;
    if(c.obj.position.x > 42) c.obj.position.x = -42;
  });
  cupHearts.forEach(h=>{
    h.obj.position.y = h.baseY + Math.sin(t*0.9 + h.phase)*0.5;
    h.obj.rotation.y = Math.sin(t*0.5 + h.phase)*0.35;
  });
  cupDots.forEach(d=>{ d.obj.position.y = d.baseY + Math.sin(t*1.3 + d.phase)*0.4; });
  if(cvEyeL && cvEyeR){
    const bp = t % 3.4;
    const blink = bp > 3.2 ? 0.15 : 1;
    cvEyeL.scale.y = blink; cvEyeR.scale.y = blink;
  }
  if(cvCherry) cvCherry.rotation.z = Math.sin(t*1.4)*0.1;
  if(cupRainOn){
    cupRainArr.forEach(r=>{
      r.obj.position.y -= dt*r.speed;
      r.obj.rotation.x += dt*r.spin;
      r.obj.rotation.z += dt*r.spin*0.7;
      if(r.obj.position.y < 1.35){
        r.obj.position.y = 18+Math.random()*4;
        r.obj.position.x = (Math.random()-0.5)*44;
        r.obj.position.z = -28+Math.random()*40;
      }
    });
  }

  if(tween){
    const k = Math.min((performance.now() - tween.t0)/tween.dur, 1);
    const e = k*k*(3 - 2*k);
    camera.position.copy(tween.curve.getPoint(e));
    controls.target.lerpVectors(tween.startTgt, tween.endTgt, e);
    camera.lookAt(controls.target);
    flash.style.opacity = Math.sin(k*Math.PI)*0.85;
    if(k >= 1){
      tween = null;
      controls.enabled = true;
      flash.style.opacity = 0;
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
  if(firstFrame){ firstFrame = false; document.getElementById('loader').classList.add('done'); }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
