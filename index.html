<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Under The Palm Tree</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
background:#e6dccf;
text-align:center;
}

/* الخلفية /

.hero{
height:100vh;
background:url("cover.jpeg") center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

/ القوس /

.content{
width:500px;
padding:40px;
background:rgba(255,255,255,0.5);
border-radius:40px;
}

/ العنوان /

.title{
font-size:30px;
opacity:0;
transform:translateY(-30px);
animation:fadeDown 1s forwards;
}

@keyframes fadeDown{
to{
opacity:1;
transform:translateY(0);
}
}

.subtitle{
margin-top:20px;
}

.desc{
margin-top:10px;
}

/ النخيل */

.palm-grid{
margin-top:30px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:35px;
}

.palm{
font-size:55px;
cursor:pointer;
transition:.3s;
filter:brightness(0);
}

.palm:hover{
transform:scale(1.2);
}

</style>

</head>

<body>

<div class="hero">

<div class="content">

<div class="title">
Let's Learn English<br>
Under The Palm Tree
</div>

<hr style="width:60%;margin:20px auto;">

<div class="subtitle">
From 1973 to 2027
</div>

<div class="desc">
Stories that might happen<br>
in Thuraya's deep mind
</div>

<div class="palm-grid">

<div class="palm" onclick="go('stories.html')">🌴</div>
<div class="palm" onclick="go('village3d.html')">🌴</div>
<div class="palm" onclick="go('characters.html')">🌴</div>
<div class="palm" onclick="go('reading.html')">🌴</div>
<div class="palm" onclick="go('speaking.html')">🌴</div>
<div class="palm" onclick="go('games.html')">🌴</div>

</div>

</div>

</div>

<audio id="click">
<source src="click.mp3" type="audio/mpeg">
</audio>

<script>

function go(page){
document.getElementById("click").play();
setTimeout(()=>{
window.location.href=page;
},200);
}

</script>

</body>
</html>
