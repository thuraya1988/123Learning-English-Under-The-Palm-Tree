<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Page 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FDF3DD;
  }

  .page-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #FDF3DD;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vh, 28px);
  }

  /* المسامير */
  .corner-btn {
    position: absolute;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 400;
    transition: transform 0.2s;
    width: clamp(28px, 3.5vw, 42px);
    height: clamp(28px, 3.5vw, 42px);
    font-size: clamp(1rem, 2vw, 1.5rem);
    margin: clamp(8px, 1.5vw, 18px);
    box-shadow:
      0 4px 6px rgba(0,0,0,0.25),
      0 1px 3px rgba(0,0,0,0.15),
      inset 0 1px 1px rgba(255,255,255,0.3);
    z-index: 10;
  }
  .corner-btn:hover  { transform: scale(1.1); }
  .corner-btn:active { transform: scale(0.93); }
  .top-left     { top: 0; left: 0;     background: radial-gradient(circle at 35% 35%, #f07030, #E8611A); }
  .top-right    { top: 0; right: 0;    background: radial-gradient(circle at 35% 35%, #dde8f5, #CBD8E8); color: #5a7a9a; }
  .bottom-left  { bottom: 0; left: 0;  background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }
  .bottom-right { bottom: 0; right: 0; background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }

  /* العنوان */
  .page-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1rem, 3.5vw, 2.2rem);
    color: #4a9a5a;
    letter-spacing: clamp(2px, 0.8vw, 8px);
    text-shadow:
      2px 2px 0px rgba(0,0,0,0.15),
      0 4px 10px rgba(0,0,0,0.12);
    text-transform: uppercase;
  }

  /* الثلاث بوكسات */
  .boxes-area {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 28px);
    width: 92%;
    max-width: 1000px;
  }

  .bevel-box {
    border-radius: clamp(14px, 2vw, 24px);
    box-shadow:
      0 12px 32px rgba(0,0,0,0.28),
      0 4px 10px rgba(0,0,0,0.15),
      inset 0 3px 8px rgba(255,255,255,0.45),
      inset 0 -3px 8px rgba(0,0,0,0.18);
    position: relative;
    width: clamp(120px, 28vw, 300px);
    height: clamp(200px, 50vw, 460px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(10px, 2vw, 22px);
    overflow: visible;
  }

  .box1 { background: #aacdb5; }
  .box2 { background: #e797a8; }
  .box3 { background: #e3cd9c; }

  /* النص الوسط */
  .box-title {
    width: 85%;
    object-fit: contain;
    flex: 1;
    margin: auto 0;
  }

  /* عربة يد - طرف البوكس الأول (يسار خارج) */
  .box1-cart {
    position: absolute;
    top: clamp(8px, 2vw, 20px);
    left: clamp(-30px, -5vw, -50px);
    width: clamp(50px, 12vw, 110px);
    object-fit: contain;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
    transform: scaleX(-1);
  }

  /* صورة thurayaauthor - يسار أسفل البوكس الثاني، تطل من تحت */
  .box2-author {
    position: absolute;
    bottom: clamp(-30px, -5vw, -55px);
    left: 50%;
    transform: translateX(-50%);
    width: clamp(40px, 9vw, 85px);
    object-fit: contain;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.3));
    z-index: 5;
  }

  /* عربة يد - طرف البوكس الثالث (يمين خارج) */
  .box3-cart {
    position: absolute;
    top: clamp(8px, 2vw, 20px);
    right: clamp(-30px, -5vw, -50px);
    width: clamp(50px, 12vw, 110px);
    object-fit: contain;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
  }

  /* زر */
  .box-btn {
    width: clamp(40px, 10vw, 80px);
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-top: auto;
  }
  .box-btn:hover { transform: scale(1.08); }

  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .popup-overlay.active { display: flex; }

  .story-popup-box {
    background: #FDF3DD;
    border-radius: clamp(16px, 3vw, 28px);
    padding: clamp(20px, 4vw, 40px);
    width: min(92vw, 680px);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .story-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    justify-content: center;
  }

  .story-tab {
    background: #e8d5a3;
    border: none;
    border-radius: 20px;
    padding: 6px 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: #2D5016;
    cursor: pointer;
    transition: all 0.2s;
  }
  .story-tab.active, .story-tab:hover {
    background: #2D5016;
    color: #FDF3DD;
  }

  .story-content {
    font-size: clamp(0.82rem, 1.5vw, 0.95rem);
    color: #3a2a0a;
    line-height: 1.8;
    white-space: pre-line;
    display: none;
  }
  .story-content.active { display: block; }

  .story-content-ar {
    text-align: right;
    direction: rtl;
    font-family: 'Nunito', sans-serif;
  }

  .close-btn {
    position: absolute;
    top: 12px; right: 16px;
    background: #6f0828;
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .close-btn:hover { transform: scale(1.1); }

  .story-popup-title {
    font-family: 'Cinzel', serif;
    color: #2D5016;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    text-align: center;
    margin-bottom: 14px;
    font-weight: 700;
  }

</style>
<script src="public/js/palm-globe-fab.js" defer></script>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<script src="public/js/palm-games-fab.js" defer></script>
</head>
<body>
<div class="page-container">

  <button class="corner-btn top-left">+</button>
  <button class="corner-btn top-right">+</button>
  <button class="corner-btn bottom-left">+</button>
  <button class="corner-btn bottom-right">+</button>

  <!-- العنوان -->
  <div class="page-title">P A L M &nbsp; F E W &nbsp; W O R D S</div>

  <!-- البوكسات -->
  <div class="boxes-area">

    <!-- البوكس الأول -->
    <div class="bevel-box box1">
      <img class="box1-cart" src="orbanbox2.png" alt="">
      <img class="box-title" src="t1.png" alt="t1">
      <img class="box-btn" src="Page2bttontitle.png" alt="Button">
    </div>

    <!-- البوكس الثاني -->
    <div class="bevel-box box2">
      <img class="box-title" src="t2.png" alt="t2">
      <img class="box-btn" src="Page2bttontitle.png" alt="Button">
      <img class="box2-author" src="Thurayabox2.png" alt="">
    </div>

    <!-- البوكس الثالث -->
    <div class="bevel-box box3">
      <img class="box3-cart" src="orbanbox2.png" alt="">
      <img class="box-title" src="t3.png" alt="t3">
      <img class="box-btn" src="Page2bttontitle.png" alt="Button">
    </div>

  </div>

</div>

<!-- STORY POPUP -->
<div class="popup-overlay" id="storyPopup">
  <div class="story-popup-box">
    <button class="close-btn" id="closeStory">✕</button>
    <div class="story-popup-title">🌴 123 Let's Learn English Under the Palm Tree</div>
    <div class="story-tabs">
      <button class="story-tab active" onclick="switchLang('en', this)">English</button>
      <button class="story-tab" onclick="switchLang('ar', this)">العربية</button>
    </div>
    <div class="story-content active" id="story-en"></div>
    <div class="story-content story-content-ar" id="story-ar"></div>
  </div>
</div>

<script>
// Audio players
const dedicationAudio = new Audio('dedication.mpeg');
const authorAudio = new Audio('Authur-statement.mpeg');

// Story popup text
const storyPopupText_en = `123 Let's Learn English Under the Palm Tree is an interactive English learning series inspired by real Omani life and culture, set in the year 1973 — a time of simplicity, community, and deep-rooted traditions.

This project was born from a dream: to give Omani children an English learning experience that truly feels like home. Every story, every character, every sound was crafted with love, dedication, and an unwavering belief that language learning should be meaningful, joyful, and culturally alive.

Imagine walking through a traditional Omani village at golden hour — the smell of frankincense in the air, the sound of the falaj flowing gently through the date palm groves, children laughing as they chase goats through narrow stone pathways. This is where our journey begins.

The series is built around 17 story-based chapters. Each chapter contains one main story divided into six immersive scenes. Within each scene, learners encounter vocabulary in context, grammar through natural dialogue, speaking opportunities, listening practice, reading comprehension, and creative writing activities — all woven together through authentic storytelling.

What makes this series truly unique is its heart. Behind every lesson is a teacher who cared deeply — who spent countless hours building a world from scratch so that children could lose themselves in it and, in doing so, find their English voice.

This is not just a course. It is a journey that connects language, culture, and imagination. It is a gift to every Omani learner, and to every teacher who dares to dream big for their students.`;

const storyPopupText_ar = `"١٢٣ هيا نتعلم الإنجليزية تحت النخلة" سلسلة تعليمية تفاعلية باللغة الإنجليزية، مستوحاة من الحياة العُمانية الأصيلة، تعود بنا إلى عام ١٩٧٣ — زمن البساطة، والدفء، والتراث العريق.

وُلد هذا المشروع من حلم صادق: أن يجد أطفال عُمان تجربة تعلّم للغة الإنجليزية تلامس روحهم وتحكي عن عالمهم. كل قصة، كل شخصية، كل صوت — صُنع بعناية وحب وإيمان راسخ بأن تعلّم اللغة يجب أن يكون ذا معنى، ممتعاً، وحياً بروح الثقافة.

تخيّل أن تمشي في قرية عُمانية عتيقة مع غروب الشمس — عطر البخور يملأ الهواء، وصوت الأفلاج يسري بهدوء بين أشجار النخيل، والأطفال يضحكون وهم يلهون في أزقة الحجارة. من هنا تبدأ رحلتنا.

تتكوّن السلسلة من ١٧ فصلاً مبنياً على القصص. كل فصل يحتوي على قصة رئيسية موزّعة على ستة مشاهد تفاعلية. في كل مشهد، يتعلم الطالب المفردات في سياقها الطبيعي، والقواعد من خلال الحوار الحقيقي، وتتاح له فرص للتحدث والاستماع والقراءة والكتابة الإبداعية — كل ذلك من خلال أسلوب القصة الأصيلة.

وما يجعل هذه السلسلة فريدة حقاً هو قلبها النابض. وراء كل درس معلمة أحبّت بعمق، وأمضت ساعات لا تحصى في بناء عالم من الصفر، لكي يغوص فيه الأطفال ويجدوا — وهم منغمسون فيه — صوتهم الإنجليزي.

هذا ليس مجرد مقرر دراسي. إنه رحلة تجمع اللغة والثقافة والخيال. إنه هديّة لكل متعلم عُماني، ولكل معلم يجرؤ أن يحلم بشيء عظيم لطلابه.`;

// Detect which button was clicked in page2
document.querySelectorAll('.box-btn').forEach((btn, idx) => {
  btn.addEventListener('click', () => {
    if (idx === 0) {
      // Box 1 - Dedication audio
      dedicationAudio.currentTime = 0;
      dedicationAudio.play();
    } else if (idx === 1) {
      // Box 2 - Author statement audio  
      authorAudio.currentTime = 0;
      authorAudio.play();
    } else if (idx === 2) {
      // Box 3 - Story popup
      document.getElementById('storyPopup').classList.add('active');
    }
  });
});

document.getElementById('closeStory') && 
  document.getElementById('closeStory').addEventListener('click', () => {
    document.getElementById('storyPopup').classList.remove('active');
  });
</script>


<script>
function switchLang(lang, btn) {
  document.querySelectorAll('.story-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.story-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('story-' + lang).classList.add('active');
}

// Fill text content
document.getElementById('story-en').innerText = storyPopupText_en;
document.getElementById('story-ar').innerText = storyPopupText_ar;
</script>

</body>
</html>
