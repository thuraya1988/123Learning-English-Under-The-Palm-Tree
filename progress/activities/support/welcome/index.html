<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الوحدة التمهيدية - دعم | Welcome Unit Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC;
  --paper:#FFFFFF;
  --ink:#243138;
  --ink-soft:#5B6B72;
  --primary:#2E7D6B;
  --primary-dark:#1F5B4E;
  --primary-soft:#DCEEE7;
  --accent:#E8A23D;
  --accent-soft:#FBEAD0;
  --success:#3E8E5B;
  --success-soft:#DCEEDD;
  --error:#B85C42;
  --error-soft:#F5E1DA;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 28px rgba(36,49,56,.09);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.en{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:'Lexend',sans-serif;
  display:inline-block;
}
h1,h2,h3,.heading{font-family:'Baloo 2','Tajawal',sans-serif;}
#app{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.topbar .unit-label{font-size:13px;color:var(--ink-soft);font-weight:500;}
.progress-dots{display:flex;gap:8px;}
.dot{width:11px;height:11px;border-radius:50%;background:#DDD8C8;transition:background .3s, transform .3s;}
.dot.done{background:var(--success);}
.dot.active{background:var(--primary);transform:scale(1.3);}
.card{
  background:var(--paper);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 20px;
  margin-bottom:16px;
}
.title{font-size:22px;font-weight:700;margin:0 0 4px;}
.title .en{font-size:16px;color:var(--ink-soft);font-weight:600;display:block;margin-top:2px;}
.subtitle{font-size:15px;color:var(--ink-soft);margin:0 0 18px;line-height:1.7;}
.instruction{
  background:var(--primary-soft);
  border-radius:var(--radius-sm);
  padding:13px 16px;
  font-size:15px;
  margin-bottom:20px;
  line-height:1.7;
}
.instruction .en{font-size:13.5px;color:var(--primary-dark);display:block;margin-top:5px;}
label{display:block;font-size:14px;margin:16px 0 6px;font-weight:500;}
input[type=text]{
  width:100%;padding:13px 14px;border-radius:var(--radius-sm);
  border:2px solid #E3DFD1;font-size:16px;font-family:'Tajawal',sans-serif;
  background:#FCFBF7;color:var(--ink);
}
input[type=text]:focus{outline:3px solid var(--primary-soft);border-color:var(--primary);}
button{font-family:inherit;cursor:pointer;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;border:none;
  padding:15px 26px;border-radius:999px;font-size:16px;font-weight:700;
  box-shadow:0 6px 16px rgba(46,125,107,.25);
  transition:transform .15s, background .2s, opacity .2s;
  width:100%;margin-top:6px;
}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none;}
.hero-row{display:flex;justify-content:center;gap:6px;margin-bottom:6px;}
.hero-row svg{filter:drop-shadow(0 3px 6px rgba(36,49,56,.12));}

/* Matching activity */
.match-grid{display:flex;gap:12px;}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
.match-item{
  background:var(--paper);border:2px solid #E3DFD1;border-radius:var(--radius-sm);
  padding:10px 8px;text-align:center;font-size:14.5px;min-height:58px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  transition:border-color .2s, background .2s, transform .15s;width:100%;
}
.match-item:hover{border-color:var(--primary);}
.match-item.selected{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.03);}
.match-item.correct{border-color:var(--success);background:var(--success-soft);}
.match-item.wrong{border-color:var(--error);background:var(--error-soft);animation:shake .35s;}
.match-item:disabled{cursor:default;}
.match-item svg{display:block;}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  75%{transform:translateX(4px);}
}
@keyframes pop{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* MCQ */
.mcq-progress{font-size:13px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
.mcq-sentence{font-size:18px;line-height:2;margin-bottom:18px;text-align:center;}
.mcq-sentence .blank{
  display:inline-block;min-width:74px;border-bottom:3px solid var(--primary);
  margin:0 4px;font-weight:700;color:var(--primary);
}
.mcq-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.mcq-opt{
  padding:13px 24px;border-radius:999px;border:2px solid #E3DFD1;
  background:#fff;font-size:16px;font-weight:600;color:var(--ink);
}
.mcq-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.mcq-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);}
.mcq-opt:disabled{cursor:default;}
.mcq-feedback{text-align:center;margin-top:14px;font-size:14px;min-height:20px;}
.mcq-feedback.ok{color:var(--success);font-weight:600;}
.mcq-feedback.no{color:var(--error);font-weight:600;}

/* Builder */
.builder-num{font-size:13px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
.builder-slots{
  display:flex;flex-wrap:wrap;gap:8px;min-height:54px;
  padding:12px;border:2px dashed #D8D2BE;border-radius:var(--radius-sm);
  margin-bottom:16px;justify-content:center;align-items:center;
}
.builder-slots .placeholder{color:#B9B3A0;font-size:14px;}
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;}
.chip{
  padding:10px 16px;border-radius:999px;border:2px solid var(--primary);
  background:#fff;color:var(--primary);font-size:15px;font-weight:600;
}
.chip.placed{background:var(--primary);color:#fff;}
.chip.locked-correct{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.chip.locked-wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);}
.builder-feedback{text-align:center;margin-top:14px;font-size:14px;min-height:40px;}
.builder-feedback .correct-sentence{color:var(--ink-soft);font-size:14px;margin-top:4px;}

/* Sort */
.sort-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
.sort-word{
  display:flex;align-items:center;gap:6px;
  padding:9px 14px;border-radius:999px;border:2px solid var(--primary);
  background:#fff;color:var(--primary);font-size:15px;font-weight:600;
}
.sort-word.selected{background:var(--primary);color:#fff;}
.sort-word.placed{opacity:.3;pointer-events:none;}
.speak-btn{border:none;background:none;font-size:16px;cursor:pointer;line-height:1;padding:0;color:inherit;}
.sort-buckets{display:flex;gap:12px;}
.bucket{
  flex:1;min-height:130px;border:2px dashed #D8D2BE;border-radius:var(--radius-sm);
  padding:10px;text-align:center;transition:border-color .2s, background .2s;
}
.bucket.target{border-color:var(--primary);background:var(--primary-soft);}
.bucket-label{font-weight:700;margin-bottom:8px;color:var(--primary);font-size:14.5px;}
.bucket-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.bucket-chip{
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;
}
.bucket-chip.correct{background:var(--success-soft);color:var(--success);}
.bucket-chip.wrong{background:var(--error-soft);color:var(--error);}
.sort-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px;min-height:18px;}

/* Results */
.result-header{text-align:center;margin-bottom:6px;}
.result-score{font-size:54px;font-weight:800;color:var(--primary);text-align:center;margin:4px 0;}
.result-msg{text-align:center;font-size:16px;line-height:1.8;margin-bottom:22px;}
.result-name{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:2px;}
.result-breakdown{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg);border-radius:var(--radius-sm);font-size:14px;}
.result-row .en{font-size:13px;color:var(--ink-soft);}

.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}
@media (max-width:380px){
  .result-score{font-size:42px;}
  .card{padding:20px 15px;}
  .mcq-opt{padding:11px 18px;font-size:15px;}
}
</style>
</head>
<body>
<div id="app"></div>


<script>
/* ============================================================
   الوحدة التمهيدية - مستوى الدعم | Welcome Unit - Support Level
   Team Together 5A - Oman MOE
   Auto-corrected practice activities + SCORM 1.2 reporting
   ============================================================ */

/* ---------- JotForm reporting (live) ----------
   يبعث النتيجة تلقائيًا لفورم جوتفورم فور ما تخلص الطالبة النشاط.
------------------------------------------------------------------ */
const JOTFORM_FORM_ID = "262434452585057";
const REPORT_UNIT = "Welcome Unit - Support";

function sendReport(name, cls, percent) {
  if (new URLSearchParams(location.search).get('preview') === '1') return;
  try {
    const studentName = (typeof scormGetStudentName === "function" && scormGetStudentName()) || name || "بدون اسم";
    const studentId = typeof supportGetStudentId === "function" ? supportGetStudentId(studentName, cls) : "";
    const attempt = typeof scormNextAttempt === "function" ? scormNextAttempt(REPORT_UNIT) : 1;
    const duration = typeof scormGetElapsedSeconds === "function" ? scormGetElapsedSeconds() : 0;
    const details = { version: 2, studentId, studentName, cls, level: "support", unit: REPORT_UNIT, percent, raw: totalScore(), max: totalMax(), attempt, duration, scores: state.scores, skillMax: state.max, completedAt: new Date().toISOString() };
    if (typeof scormSetDetailedProgress === "function") scormSetDetailedProgress(details);
    const fd = new FormData();
    fd.append("formID", JOTFORM_FORM_ID);
    fd.append("submitSource", "support-scorm");
    fd.append("q2_q2_textbox0", studentName);
    fd.append("q3_q3_textbox1", cls || "غير محدد");
    fd.append("q4_q4_textbox2", REPORT_UNIT);
    fd.append("q5_q5_textbox3", percent + "%");
    fd.append("q7_input", studentId);
    fd.append("q8_input", "support");
    fd.append("q9_input", String(attempt));
    fd.append("q10_input", String(duration));
    fd.append("q11_input", JSON.stringify(details));
    fd.append("q12_input", "مكتمل");
    fetch("https://submit.jotform.com/submit/" + JOTFORM_FORM_ID, { method: "POST", mode: "no-cors", keepalive: true, body: fd }).catch(function () {});
  } catch (e) {}
}

/* ---------- utilities ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffleUntilDifferent(arr) {
  if (arr.length < 2) return arr.slice();
  let a = shuffle(arr);
  let tries = 0;
  while (a.join("|") === arr.join("|") && tries < 8) { a = shuffle(arr); tries++; }
  return a;
}
function capitalizeFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- simple original SVG face icons (no copyrighted art) ---------- */
function headIcon(variant, size) {
  size = size || 68;
  const ink = "#243138";
  const face =
    '<circle cx="50" cy="42" r="24" fill="#FFFFFF" stroke="' + ink + '" stroke-width="3"/>' +
    '<circle cx="42" cy="40" r="2.4" fill="' + ink + '"/>' +
    '<circle cx="58" cy="40" r="2.4" fill="' + ink + '"/>' +
    '<path d="M42 52 Q50 58 58 52" fill="none" stroke="' + ink + '" stroke-width="2.5" stroke-linecap="round"/>';
  const body = '<path d="M18 94 Q50 70 82 94 L82 103 L18 103 Z" fill="#DCEEE7" stroke="' + ink + '" stroke-width="3"/>';
  const shortCapBrown = '<path d="M25 38 Q27 13 50 13 Q73 13 75 38 Q63 25 50 25 Q37 25 25 38Z" fill="#6B4E36" stroke="' + ink + '" stroke-width="2.5"/>';

  let topHair = "", overlay = "";
  if (variant === "curly") {
    topHair = '<g fill="#3B2A20" stroke="' + ink + '" stroke-width="2">' +
      '<circle cx="27" cy="32" r="8"/><circle cx="39" cy="19" r="8.5"/><circle cx="54" cy="15" r="8.5"/>' +
      '<circle cx="68" cy="20" r="8.5"/><circle cx="77" cy="34" r="7.5"/><circle cx="23" cy="44" r="6.5"/></g>';
  } else if (variant === "straight") {
    topHair = shortCapBrown.replace("#6B4E36", "#3B2A20") +
      '<g stroke="#3B2A20" stroke-width="4.5" stroke-linecap="round">' +
      '<path d="M27 30 L23 52" fill="none"/><path d="M35 22 L32 50" fill="none"/>' +
      '<path d="M65 22 L68 50" fill="none"/><path d="M73 30 L77 52" fill="none"/></g>';
  } else if (variant === "dark") {
    topHair = '<path d="M24 40 Q26 12 50 12 Q74 12 76 40 Q64 26 50 26 Q36 26 24 40Z" fill="#241811" stroke="' + ink + '" stroke-width="2.5"/>';
  } else if (variant === "fair") {
    topHair = '<path d="M24 40 Q26 12 50 12 Q74 12 76 40 Q64 26 50 26 Q36 26 24 40Z" fill="#E8C77E" stroke="' + ink + '" stroke-width="2.5"/>';
  } else if (variant === "long") {
    topHair = '<path d="M21 42 Q23 11 50 11 Q77 11 79 42 L84 80 Q79 85 74 79 L70 44 Q60 29 50 29 Q40 29 30 44 L26 79 Q21 85 16 80Z" fill="#4A3524" stroke="' + ink + '" stroke-width="2.5"/>';
  } else if (variant === "short") {
    topHair = shortCapBrown.replace("#6B4E36", "#4A3524");
  } else if (variant === "beard") {
    topHair = shortCapBrown;
    overlay = '<path d="M31 48 Q29 70 50 75 Q71 70 69 48 Q69 59 50 63 Q31 59 31 48Z" fill="#3B2A20" stroke="' + ink + '" stroke-width="2"/>';
  } else if (variant === "moustache") {
    topHair = shortCapBrown;
    overlay = '<path d="M37 55 Q50 61 63 55 Q56 51 50 53 Q44 51 37 55Z" fill="#3B2A20" stroke="' + ink + '" stroke-width="2"/>';
  }
  return '<svg viewBox="0 0 100 106" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    topHair + face + overlay + body + "</svg>";
}

/* ---------- content data (original items aligned to the Welcome unit's own vocabulary and grammar focus) ---------- */
const APPEARANCE = [
  { id: "curly", word: "curly hair" },
  { id: "straight", word: "straight hair" },
  { id: "dark", word: "dark hair" },
  { id: "fair", word: "fair hair" },
  { id: "long", word: "long hair" },
  { id: "short", word: "short hair" },
  { id: "beard", word: "a beard" },
  { id: "moustache", word: "a moustache" }
];

const GRAMMAR = [
  { pre: "I wash my hands ", post: " I eat my food.", answer: "before" },
  { pre: "", post: " Yusra gets home from school, she plays with her sister.", answer: "when", leadBlank: true },
  { pre: "I brush my teeth ", post: " I go to sleep.", answer: "before" },
  { pre: "I feel happy ", post: " I see my friends.", answer: "when" },
  { pre: "I do my homework ", post: " I have dinner.", answer: "after" }
];

const BUILDER = [
  { answer: ["She", "has got", "curly", "hair"] },
  { answer: ["He", "has got", "short", "hair"] },
  { answer: ["She", "has got", "fair", "hair"] },
  { answer: ["He", "has got", "a beard"] }
];

const SOUNDS = [
  { word: "hair", group: "ea" },
  { word: "chair", group: "ea" },
  { word: "fair", group: "ea" },
  { word: "there's", group: "ea" },
  { word: "today", group: "ei" },
  { word: "eight", group: "ei" },
  { word: "grey", group: "ei" },
  { word: "painting", group: "ei" }
];
const SOUND_BUCKETS = [
  { id: "ea", label: "hair", ipa: "/ea/" },
  { id: "ei", label: "eight", ipa: "/ei/" }
];

const MANNERS = [
  { situation: "تطلبين شيئًا من صديقتك", phrase: "Please" },
  { situation: "صديقتك أعطتك هدية", phrase: "Thank you" },
  { situation: "وقعتِ بالخطأ على قدم صديقتك", phrase: "Sorry" },
  { situation: "تريدين المرور بين شخصين", phrase: "Excuse me" },
  { situation: "صديقتك قالت لك: شكرًا", phrase: "You're welcome" },
  { situation: "زميلتك أسقطت كتبها", phrase: "Can I help you?" }
];

/* ---------- state ---------- */
const state = {
  screen: "start",
  name: "",
  cls: "",
  scores: { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 },
  max: { a1: APPEARANCE.length, a2: GRAMMAR.length, a3: BUILDER.length, a4: SOUNDS.length, a5: MANNERS.length }
};

function totalScore() { return state.scores.a1 + state.scores.a2 + state.scores.a3 + state.scores.a4 + state.scores.a5; }
function totalMax() { return state.max.a1 + state.max.a2 + state.max.a3 + state.max.a4 + state.max.a5; }

function goTo(screen) { state.screen = screen; render(); window.scrollTo(0, 0); }

/* ---------- shared: topbar with progress dots ---------- */
function renderTopbar(app, activeIndex) {
  const bar = el("div", "topbar");
  const label = el("div", "unit-label");
  label.innerHTML = 'الوحدة التمهيدية <span class="en">Welcome Unit</span>';
  const dots = el("div", "progress-dots");
  for (let i = 1; i <= 5; i++) {
    const d = el("div", "dot");
    if (i < activeIndex) d.classList.add("done");
    if (i === activeIndex) d.classList.add("active");
    dots.appendChild(d);
  }
  bar.appendChild(label);
  bar.appendChild(dots);
  app.appendChild(bar);
}

function nextButton(app, label, enabledGetter, onClick) {
  const btn = el("button", "btn");
  btn.type = "button";
  btn.innerHTML = label;
  btn.disabled = !enabledGetter();
  btn.addEventListener("click", onClick);
  app.appendChild(btn);
  return btn;
}

/* ================= START SCREEN ================= */
function renderStartScreen(app) {
  const card = el("div", "card");

  const heroRow = el("div", "hero-row");
  ["curly", "long", "fair", "short"].forEach(function (v) {
    const wrap = document.createElement("span");
    wrap.innerHTML = headIcon(v, 52);
    heroRow.appendChild(wrap);
  });
  card.appendChild(heroRow);

  const title = el("div", "title heading");
  title.innerHTML = 'الوحدة التمهيدية <span class="en">Welcome Unit</span>';
  card.appendChild(title);

  const sub = el("div", "subtitle");
  sub.innerHTML = '<span class="en">Team Together 5A</span> - مستوى الدعم<br>' +
    "أهلًا بك! هالتمارين بتساعدك تراجعين كلمات وقواعد الوحدة التمهيدية خطوة خطوة، وكل جواب ينصحح لحاله.";
  card.appendChild(sub);

  const nameLabel = el("label", "", "اسمك");
  nameLabel.setAttribute("for", "nameInput");
  card.appendChild(nameLabel);
  const nameInput = document.createElement("input");
  nameInput.type = "text"; nameInput.id = "nameInput"; nameInput.placeholder = "اكتبي اسمك هنا";
  nameInput.value = state.name;
  card.appendChild(nameInput);

  const clsLabel = el("label", "", "صفك");
  clsLabel.setAttribute("for", "clsInput");
  card.appendChild(clsLabel);
  const clsInput = document.createElement("input");
  clsInput.type = "text"; clsInput.id = "clsInput"; clsInput.placeholder = "مثال: 5/2";
  clsInput.value = state.cls;
  card.appendChild(clsInput);

  app.appendChild(card);

  const startBtn = el("button", "btn");
  startBtn.type = "button";
  startBtn.innerHTML = 'ابدئي <span class="en">Start</span> 🚀';
  startBtn.addEventListener("click", function () {
    state.name = nameInput.value.trim();
    state.cls = clsInput.value.trim();
    goTo("a1");
  });
  app.appendChild(startBtn);

  if (typeof scormGetStudentName === "function") {
    const nm = scormGetStudentName();
    if (nm && !state.name) { state.name = nm; nameInput.value = nm; }
  }
}

/* ================= ACTIVITY 1 - matching: word <-> icon ================= */
function renderActivity1(app) {
  renderTopbar(app, 1);
  const card = el("div", "card");
  const title = el("div", "title heading");
  title.innerHTML = 'المفردات: وصف الشكل الخارجي <span class="en">Vocabulary: Appearance</span>';
  card.appendChild(title);

  const instr = el("div", "instruction");
  instr.innerHTML = "اضغطي على الكلمة، ثم اضغطي على الصورة المناسبة لها." +
    '<span class="en">Tap a word, then tap its matching picture.</span>';
  card.appendChild(instr);

  const words = APPEARANCE.map(function (x) { return { key: x.id, kind: "word", label: x.word }; });
  const icons = shuffle(APPEARANCE).map(function (x) { return { key: x.id, kind: "icon", id: x.id }; });

  const grid = el("div", "match-grid");
  const leftCol = el("div", "match-col");
  const rightCol = el("div", "match-col");
  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  card.appendChild(grid);
  app.appendChild(card);

  let selectedLeft = null, selectedRight = null;
  let solvedCount = 0;
  const firstAttempt = {};
  const btnsByKeySide = {};

  function makeBtn(entry, side) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "match-item";
    if (entry.kind === "word") {
      const span = document.createElement("span");
      span.className = "en";
      span.textContent = entry.label;
      b.appendChild(span);
    } else {
      const wrap = document.createElement("span");
      wrap.innerHTML = headIcon(entry.id, 56);
      b.appendChild(wrap);
    }
    b.addEventListener("click", function () { onPick(entry, side, b); });
    (side === "L" ? leftCol : rightCol).appendChild(b);
    btnsByKeySide[side + entry.key + (side === "L" ? "" : "_r" + icons.indexOf(entry))] = b;
    return b;
  }

  words.forEach(function (w) { makeBtn(w, "L"); });
  icons.forEach(function (ic) { makeBtn(ic, "R"); });

  function clearSelection(sel) { if (sel && sel.btn) sel.btn.classList.remove("selected"); }

  function onPick(entry, side, btnEl) {
    if (btnEl.disabled) return;
    if (side === "L") {
      clearSelection(selectedLeft);
      selectedLeft = { entry: entry, btn: btnEl };
      btnEl.classList.add("selected");
    } else {
      clearSelection(selectedRight);
      selectedRight = { entry: entry, btn: btnEl };
      btnEl.classList.add("selected");
    }
    if (selectedLeft && selectedRight) evaluate();
  }

  function evaluate() {
    const L = selectedLeft, R = selectedRight;
    const isMatch = L.entry.key === R.entry.key;
    if (!firstAttempt[L.entry.key]) {
      firstAttempt[L.entry.key] = true;
      if (isMatch) state.scores.a1++;
    }
    if (isMatch) {
      L.btn.classList.remove("selected"); R.btn.classList.remove("selected");
      L.btn.classList.add("correct"); R.btn.classList.add("correct");
      L.btn.disabled = true; R.btn.disabled = true;
      solvedCount++;
      selectedLeft = null; selectedRight = null;
      updateNext();
    } else {
      L.btn.classList.add("wrong"); R.btn.classList.add("wrong");
      setTimeout(function () {
        L.btn.classList.remove("selected", "wrong");
        R.btn.classList.remove("selected", "wrong");
      }, 500);
      selectedLeft = null; selectedRight = null;
    }
  }

  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return solvedCount === APPEARANCE.length; }, function () { goTo("a2"); });
  function updateNext() { nextBtn.disabled = solvedCount !== APPEARANCE.length; }
}

/* ================= ACTIVITY 2 - MCQ: before / after / when ================= */
function renderActivity2(app) {
  renderTopbar(app, 2);
  const card = el("div", "card");
  const title = el("div", "title heading");
  title.innerHTML = 'القواعد <span class="en">Before, After, When</span>';
  card.appendChild(title);

  const instr = el("div", "instruction");
  instr.innerHTML = "اختاري الكلمة الصحيحة لإكمال الجملة." +
    '<span class="en">Choose the right word to complete the sentence.</span>';
  card.appendChild(instr);

  let qIndex = 0;
  const qWrap = el("div", "");
  card.appendChild(qWrap);
  app.appendChild(card);

  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return false; }, function () {
    qIndex++;
    if (qIndex >= GRAMMAR.length) goTo("a3");
    else renderQuestion();
  });
  nextBtn.classList.add("hidden");

  function renderQuestion() {
    qWrap.innerHTML = "";
    nextBtn.classList.add("hidden");
    nextBtn.disabled = true;

    const progress = el("div", "mcq-progress");
    progress.innerHTML = '<span class="en">' + (qIndex + 1) + " / " + GRAMMAR.length + "</span>";
    qWrap.appendChild(progress);

    const item = GRAMMAR[qIndex];
    const sentence = el("div", "mcq-sentence en");
    sentence.innerHTML = escapeHtml(item.pre) + '<span class="blank">____</span>' + escapeHtml(item.post);
    qWrap.appendChild(sentence);

    const opts = el("div", "mcq-options");
    const options = ["before", "after", "when"];
    let answered = false;
    options.forEach(function (opt) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mcq-opt en";
      b.textContent = opt;
      b.addEventListener("click", function () {
        if (answered) return;
        answered = true;
        const correct = opt === item.answer;
        if (correct) {
          b.classList.add("correct");
          state.scores.a2++;
          feedback.textContent = "صحيح! أحسنتِ 🌿";
          feedback.className = "mcq-feedback ok";
          const full = item.leadBlank ? capitalizeFirst(item.answer + item.post) : item.pre + item.answer + item.post;
          feedback.appendChild(document.createElement("br"));
          const fs = document.createElement("span");
          fs.className = "en"; fs.style.fontSize = "13px"; fs.style.color = "#5B6B72";
          fs.textContent = full.trim();
          feedback.appendChild(fs);
        } else {
          b.classList.add("wrong");
          Array.prototype.forEach.call(opts.children, function (c) {
            if (c.textContent === item.answer) c.classList.add("correct");
          });
          feedback.textContent = "قريبة! الصح هو:";
          feedback.className = "mcq-feedback no";
          const fs = document.createElement("span");
          fs.className = "en"; fs.style.fontWeight = "700";
          fs.textContent = " " + item.answer;
          feedback.appendChild(fs);
        }
        Array.prototype.forEach.call(opts.children, function (c) { c.disabled = true; });
        nextBtn.classList.remove("hidden");
        nextBtn.disabled = false;
        nextBtn.innerHTML = (qIndex === GRAMMAR.length - 1) ?
          'التالي <span class="en">Next</span> ←' : 'التالي <span class="en">Next</span> ←';
      });
      opts.appendChild(b);
    });
    qWrap.appendChild(opts);

    const feedback = el("div", "mcq-feedback");
    qWrap.appendChild(feedback);
  }

  renderQuestion();
}

/* ================= ACTIVITY 3 - sentence builder ================= */
function renderActivity3(app) {
  renderTopbar(app, 3);
  const card = el("div", "card");
  const title = el("div", "title heading");
  title.innerHTML = 'كوّني الجملة <span class="en">Build the Sentence</span>';
  card.appendChild(title);

  const instr = el("div", "instruction");
  instr.innerHTML = "رتّبي الكلمات بالترتيب الصحيح لتكوين جملة." +
    '<span class="en">Put the words in the right order.</span>';
  card.appendChild(instr);

  let qIndex = 0;
  const qWrap = el("div", "");
  card.appendChild(qWrap);
  app.appendChild(card);

  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return false; }, function () {
    qIndex++;
    if (qIndex >= BUILDER.length) goTo("a4");
    else renderQuestion();
  });
  nextBtn.classList.add("hidden");

  function renderQuestion() {
    qWrap.innerHTML = "";
    nextBtn.classList.add("hidden");

    const num = el("div", "builder-num");
    num.innerHTML = '<span class="en">' + (qIndex + 1) + " / " + BUILDER.length + "</span>";
    qWrap.appendChild(num);

    const item = BUILDER[qIndex];
    let bank = shuffleUntilDifferent(item.answer);
    let built = [];
    let locked = false;

    const slots = el("div", "builder-slots");
    const bankEl = el("div", "builder-bank");
    const feedback = el("div", "builder-feedback");
    qWrap.appendChild(slots);
    qWrap.appendChild(bankEl);
    qWrap.appendChild(feedback);

    function draw() {
      slots.innerHTML = "";
      if (built.length === 0) {
        slots.appendChild(el("span", "placeholder", "..."));
      } else {
        built.forEach(function (w, i) {
          const c = document.createElement("button");
          c.type = "button";
          c.className = "chip placed en";
          c.textContent = w;
          c.disabled = locked;
          c.addEventListener("click", function () {
            if (locked) return;
            built.splice(i, 1);
            bank.push(w);
            draw();
          });
          slots.appendChild(c);
        });
      }
      bankEl.innerHTML = "";
      bank.forEach(function (w, i) {
        const c = document.createElement("button");
        c.type = "button";
        c.className = "chip en";
        c.textContent = w;
        c.disabled = locked;
        c.addEventListener("click", function () {
          if (locked) return;
          bank.splice(i, 1);
          built.push(w);
          draw();
          if (bank.length === 0) checkAnswer();
        });
        bankEl.appendChild(c);
      });
    }

    function checkAnswer() {
      const correct = built.join("|") === item.answer.join("|");
      locked = true;
      if (correct) {
        state.scores.a3++;
        feedback.innerHTML = "ممتاز! جملة صحيحة 🎉";
        feedback.className = "builder-feedback ok";
        Array.prototype.forEach.call(slots.children, function (c) { c.classList.add("locked-correct"); });
        nextBtn.classList.remove("hidden");
        nextBtn.disabled = false;
      } else {
        feedback.innerHTML = "مو تمامًا. الجملة الصحيحة:";
        const cs = document.createElement("div");
        cs.className = "correct-sentence en";
        cs.textContent = item.answer.join(" ") + ".";
        feedback.appendChild(cs);
        Array.prototype.forEach.call(slots.children, function (c) { c.classList.add("locked-wrong"); });
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "btn btn-ghost";
        retry.style.marginTop = "10px";
        retry.innerHTML = 'حاولي مرة ثانية <span class="en">Try again</span>';
        retry.addEventListener("click", function () {
          built = []; bank = shuffleUntilDifferent(item.answer); locked = false;
          feedback.innerHTML = ""; feedback.className = "builder-feedback";
          draw();
        });
        feedback.appendChild(retry);
        nextBtn.classList.remove("hidden");
        nextBtn.disabled = false;
      }
    }

    draw();
  }

  renderQuestion();
}

/* ================= ACTIVITY 4 - sound sort ================= */
function renderActivity4(app) {
  renderTopbar(app, 4);
  const card = el("div", "card");
  const title = el("div", "title heading");
  title.innerHTML = 'الاستماع والنطق <span class="en">Listening &amp; Sounds</span>';
  card.appendChild(title);

  const instr = el("div", "instruction");
  instr.innerHTML = "اضغطي 🔊 عشان تسمعي الكلمة، وبعدين حطيها بالمجموعة الصحيحة حسب صوتها." +
    '<span class="en">Listen to each word, then sort it by its sound.</span>';
  card.appendChild(instr);

  const pool = el("div", "sort-pool");
  const bucketsWrap = el("div", "sort-buckets");
  const hint = el("div", "sort-hint");
  card.appendChild(pool);
  card.appendChild(bucketsWrap);
  card.appendChild(hint);
  app.appendChild(card);

  const items = shuffle(SOUNDS);
  const firstAttempt = {};
  let placedCount = 0;
  let selected = null;

  const bucketEls = {};
  SOUND_BUCKETS.forEach(function (b) {
    const bEl = el("div", "bucket");
    const lab = el("div", "bucket-label");
    lab.innerHTML = '<span class="en">' + b.label + "</span> " + b.ipa;
    const itemsEl = el("div", "bucket-items");
    bEl.appendChild(lab);
    bEl.appendChild(itemsEl);
    bEl.addEventListener("click", function () { placeSelected(b.id, bEl); });
    bucketsWrap.appendChild(bEl);
    bucketEls[b.id] = { root: bEl, items: itemsEl };
  });

  items.forEach(function (item) {
    const chip = el("div", "sort-word");
    const wordSpan = document.createElement("span");
    wordSpan.className = "en";
    wordSpan.textContent = item.word;
    const speakBtn = document.createElement("button");
    speakBtn.type = "button";
    speakBtn.className = "speak-btn";
    speakBtn.setAttribute("aria-label", "استمعي");
    speakBtn.textContent = "🔊";
    speakBtn.addEventListener("click", function (e) { e.stopPropagation(); speak(item.word); });
    chip.appendChild(wordSpan);
    chip.appendChild(speakBtn);
    chip.addEventListener("click", function () {
      if (chip.classList.contains("placed")) return;
      if (selected && selected.chip) selected.chip.classList.remove("selected");
      selected = { item: item, chip: chip };
      chip.classList.add("selected");
      hint.textContent = "الحين اضغطي على المجموعة الصحيحة";
    });
    pool.appendChild(chip);
    item._chip = chip;
  });

  function placeSelected(bucketId, bucketEl) {
    if (!selected) { hint.textContent = "اختاري كلمة أول"; return; }
    const item = selected.item;
    const correct = item.group === bucketId;
    if (!firstAttempt[item.word]) {
      firstAttempt[item.word] = true;
      if (correct) state.scores.a4++;
    }
    if (correct) {
      selected.chip.classList.remove("selected");
      selected.chip.classList.add("placed");
      const b = SOUND_BUCKETS.filter(function (x) { return x.id === bucketId; })[0];
      const bc = el("span", "bucket-chip correct");
      const en = document.createElement("span"); en.className = "en"; en.textContent = item.word;
      bc.appendChild(en);
      bucketEls[bucketId].items.appendChild(bc);
      placedCount++;
      hint.textContent = "";
      selected = null;
      updateNext();
    } else {
      bucketEl.classList.add("target");
      selected.chip.classList.add("wrong");
      hint.textContent = "مو هالمجموعة، جربي مرة ثانية";
      setTimeout(function () {
        bucketEl.classList.remove("target");
        if (selected && selected.chip) selected.chip.classList.remove("wrong");
      }, 500);
    }
  }

  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return placedCount === SOUNDS.length; }, function () { goTo("a5"); });
  function updateNext() { nextBtn.disabled = placedCount !== SOUNDS.length; }
}

/* ================= ACTIVITY 5 - matching: situation <-> phrase ================= */
function renderActivity5(app) {
  renderTopbar(app, 5);
  const card = el("div", "card");
  const title = el("div", "title heading");
  title.innerHTML = 'آداب التعامل <span class="en">Good Manners</span>';
  card.appendChild(title);

  const instr = el("div", "instruction");
  instr.innerHTML = "اضغطي على الموقف، ثم اضغطي على العبارة المناسبة له." +
    '<span class="en">Tap the situation, then tap the right phrase.</span>';
  card.appendChild(instr);

  const situations = MANNERS.map(function (m, i) { return { key: i, kind: "sit", label: m.situation }; });
  const phrases = shuffle(MANNERS.map(function (m, i) { return { key: i, kind: "ph", label: m.phrase }; }));

  const grid = el("div", "match-grid");
  const leftCol = el("div", "match-col");
  const rightCol = el("div", "match-col");
  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  card.appendChild(grid);
  app.appendChild(card);

  let selectedLeft = null, selectedRight = null;
  let solvedCount = 0;
  const firstAttempt = {};

  function makeBtn(entry, side) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "match-item";
    const span = document.createElement("span");
    if (entry.kind === "ph") { span.className = "en"; span.textContent = entry.label; }
    else { span.textContent = entry.label; span.style.fontSize = "13.5px"; }
    b.appendChild(span);
    b.addEventListener("click", function () { onPick(entry, side, b); });
    (side === "L" ? leftCol : rightCol).appendChild(b);
    return b;
  }

  situations.forEach(function (s) { makeBtn(s, "L"); });
  phrases.forEach(function (p) { makeBtn(p, "R"); });

  function clearSelection(sel) { if (sel && sel.btn) sel.btn.classList.remove("selected"); }

  function onPick(entry, side, btnEl) {
    if (btnEl.disabled) return;
    if (side === "L") {
      clearSelection(selectedLeft);
      selectedLeft = { entry: entry, btn: btnEl };
      btnEl.classList.add("selected");
    } else {
      clearSelection(selectedRight);
      selectedRight = { entry: entry, btn: btnEl };
      btnEl.classList.add("selected");
    }
    if (selectedLeft && selectedRight) evaluate();
  }

  function evaluate() {
    const L = selectedLeft, R = selectedRight;
    const isMatch = L.entry.key === R.entry.key;
    if (!firstAttempt[L.entry.key]) {
      firstAttempt[L.entry.key] = true;
      if (isMatch) state.scores.a5++;
    }
    if (isMatch) {
      L.btn.classList.remove("selected"); R.btn.classList.remove("selected");
      L.btn.classList.add("correct"); R.btn.classList.add("correct");
      L.btn.disabled = true; R.btn.disabled = true;
      solvedCount++;
      selectedLeft = null; selectedRight = null;
      updateNext();
    } else {
      L.btn.classList.add("wrong"); R.btn.classList.add("wrong");
      setTimeout(function () {
        L.btn.classList.remove("selected", "wrong");
        R.btn.classList.remove("selected", "wrong");
      }, 500);
      selectedLeft = null; selectedRight = null;
    }
  }

  const nextBtn = nextButton(app, 'شوفي نتيجتك <span class="en">See results</span> 🎉', function () { return solvedCount === MANNERS.length; }, function () { finishAndGoResults(); });
  function updateNext() { nextBtn.disabled = solvedCount !== MANNERS.length; }
}

/* ================= FINISH: score + SCORM + report ================= */
function finishAndGoResults() {
  const total = totalScore();
  const max = totalMax();
  const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  if (typeof scormSetScore === "function") scormSetScore(total, max);
  if (typeof scormSetComplete === "function") scormSetComplete();
  sendReport(state.name, state.cls, percent);
  goTo("results");
}

/* ================= RESULTS SCREEN ================= */
function renderResultsScreen(app) {
  const card = el("div", "card");
  const header = el("div", "result-header heading");
  header.innerHTML = '<span style="font-size:20px;font-weight:700;">نتيجتك! <span class="en">Your Results</span> 🎉</span>';
  card.appendChild(header);

  if (state.name) {
    const nm = el("div", "result-name");
    nm.textContent = state.name + (state.cls ? " - " + state.cls : "");
    card.appendChild(nm);
  }

  const total = totalScore(), max = totalMax();
  const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  const score = el("div", "result-score");
  score.innerHTML = '<span class="en">' + percent + "%</span>";
  card.appendChild(score);

  const msg = el("div", "result-msg");
  if (percent >= 85) msg.textContent = "ممتازة! شغل رائع، افتخري بنفسك 🌟";
  else if (percent >= 60) msg.textContent = "أحسنتِ! تقدّم حلو، كملي كذا 👏";
  else msg.textContent = "خطوة أولى رائعة! كل مرة تتمرنين بتصيرين أقوى - استمري 💚";
  card.appendChild(msg);

  const breakdown = el("div", "result-breakdown");
  const rows = [
    ["المفردات", "Vocabulary", state.scores.a1, state.max.a1],
    ["القواعد", "Grammar", state.scores.a2, state.max.a2],
    ["كوّني الجملة", "Sentence", state.scores.a3, state.max.a3],
    ["الاستماع", "Sounds", state.scores.a4, state.max.a4],
    ["آداب التعامل", "Manners", state.scores.a5, state.max.a5]
  ];
  rows.forEach(function (r) {
    const row = el("div", "result-row");
    const left = document.createElement("span");
    left.innerHTML = r[0] + ' <span class="en">' + r[1] + "</span>";
    const right = document.createElement("span");
    right.className = "en";
    right.textContent = r[2] + " / " + r[3];
    row.appendChild(left); row.appendChild(right);
    breakdown.appendChild(row);
  });
  card.appendChild(breakdown);
  app.appendChild(card);

  const retryBtn = el("button", "btn btn-ghost");
  retryBtn.type = "button";
  retryBtn.innerHTML = 'أعيدي المحاولة <span class="en">Try again</span>';
  retryBtn.addEventListener("click", function () {
    state.scores = { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 };
    goTo("a1");
  });
  app.appendChild(retryBtn);
}

/* ================= render dispatcher ================= */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.screen === "start") renderStartScreen(app);
  else if (state.screen === "a1") renderActivity1(app);
  else if (state.screen === "a2") renderActivity2(app);
  else if (state.screen === "a3") renderActivity3(app);
  else if (state.screen === "a4") renderActivity4(app);
  else if (state.screen === "a5") renderActivity5(app);
  else if (state.screen === "results") renderResultsScreen(app);
}

render();
