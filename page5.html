<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Page 5 - Under The Palm Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #FDF3DD;
  }

  .page-container {
    position: relative;
    width: 100vw; height: 100vh;
    background: #FDF3DD;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vh, 28px);
  }

  /* المسامير */
  .corner-btn {
    position: absolute;
    border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 400;
    transition: transform 0.2s;
    width: clamp(28px, 3.5vw, 42px);
    height: clamp(28px, 3.5vw, 42px);
    font-size: clamp(1rem, 2vw, 1.5rem);
    margin: clamp(8px, 1.5vw, 18px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.3);
    z-index: 10;
  }
  .corner-btn:hover  { transform: scale(1.1); }
  .corner-btn:active { transform: scale(0.93); }
  .top-left     { top: 0; left: 0;     background: radial-gradient(circle at 35% 35%, #f07030, #E8611A); }
  .top-right    { top: 0; right: 0;    background: radial-gradient(circle at 35% 35%, #dde8f5, #CBD8E8); color: #5a7a9a; }
  .bottom-left  { bottom: 0; left: 0;  background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }
  .bottom-right { bottom: 0; right: 0; background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }

  /* العنوان */
  .page-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1rem, 3vw, 2rem);
    color: #4a9a5a;
    letter-spacing: clamp(1px, 0.5vw, 5px);
    text-shadow: 2px 2px 0px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.12);
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }

  /* البوكسات */
  .boxes-area {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 28px);
    width: 92%;
    max-width: 1050px;
    /* مساحة للشخصيات الطالعة فوق */
    padding-top: clamp(70px, 14vw, 140px);
    overflow: visible;
    position: relative;
    z-index: 2;
  }

  /* wrapper لكل بوكس — يسمح للشخصية تطلع */
  .box-wrapper {
    position: relative;
    /* overflow: visible بشكل افتراضي لأنه div عادي */
    flex: 1;
    display: flex;
    justify-content: center;
  }

  .bevel-box {
    border-radius: clamp(14px, 2vw, 22px);
    box-shadow:
      0 12px 32px rgba(0,0,0,0.3),
      0 4px 10px rgba(0,0,0,0.18),
      inset 0 3px 8px rgba(255,255,255,0.4),
      inset 0 -3px 8px rgba(0,0,0,0.2);
    /* لا overflow: hidden هنا عشان الشخصية تطلع */
    width: clamp(100px, 22vw, 240px);
    height: clamp(160px, 38vw, 370px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: clamp(10px, 2vw, 20px);
    position: relative;
  }

  /* الشخصية تطلع من فوق البوكس */
  .char-img {
    position: absolute;
    bottom: 100%; /* تبدأ من فوق البوكس */
    left: 50%;
    transform: translateX(-50%);
    width: clamp(90px, 22vw, 210px);
    object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4)) drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    pointer-events: none;
    /* تنزل شوية داخل البوكس */
    margin-bottom: clamp(-30px, -6vw, -55px);
  }

  /* الزر */
  .box-btn {
    width: 82%;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
    z-index: 2;
  }
  .box-btn:hover { transform: scale(1.06); }
</style>
<script src="public/js/palm-globe-fab.js" defer></script>
</head>
<body>
<div class="page-container">

  <button class="corner-btn top-left">+</button>
  <button class="corner-btn top-right">+</button>
  <button class="corner-btn bottom-left">+</button>
  <button class="corner-btn bottom-right">+</button>

  <div class="page-title">Under The Palm Tree</div>

  <div class="boxes-area">
    
    <div class="box-wrapper">
      <div class="bevel-box" style="background:#8B4A52;">
        <img class="char-img" src="Rebox.png" alt="">
        <img class="box-btn" src="lisbutton.png" alt="Listening">
      </div>
    </div>
    <div class="box-wrapper">
      <div class="bevel-box" style="background:#5B9E9A;">
        <img class="char-img" src="eyesbox.gif" alt="">
        <img class="box-btn" src="rebutton.png" alt="Reading">
      </div>
    </div>
    <div class="box-wrapper">
      <div class="bevel-box" style="background:#D4A827;">
        <img class="char-img" src="antbox.png" alt="">
        <img class="box-btn" src="Wrbutton.png" alt="Writing">
      </div>
    </div>
    <div class="box-wrapper">
      <div class="bevel-box" style="background:#4A4A8A;">
        <img class="char-img" src="Gibox.png" alt="">
        <img class="box-btn" src="spbutton.png" alt="Spelling">
      </div>
    </div>

  </div>

</div>
</body>
</html>
