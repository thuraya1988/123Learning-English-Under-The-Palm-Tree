<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سؤال بحث علمي | Scientific Research Question</title>
<meta name="theme-color" content="#2e9d4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2e9d4a; --accent-soft:#e9f7ec; --ink:#14244a; --muted:#5d6a86;
  --card:#ffffff; --line:#dfe5f0; --danger:#d93a4c; --ok:#1f9d55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Tajawal",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--accent-soft),#fff 60%);
  min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 0}

/* ---------- student info ---------- */
.info{
  background:var(--card);border:2px solid var(--accent);border-radius:20px;
  padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(20,36,74,.08)
}
.info h1{margin:0 0 4px;font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px}
.info h1 .badge{background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-size:.95rem;direction:ltr}
.info p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.row{display:grid;grid-template-columns:1fr 120px;gap:10px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
input,select{
  width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border-radius:14px;
  border:2px solid var(--line);background:#fbfcff;color:var(--ink);outline:none
}
input:focus,select:focus{border-color:var(--accent);background:#fff}
.field.err input,.field.err select{border-color:var(--danger);background:#fff5f6}

/* ---------- worksheet ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:.88rem;color:var(--muted)}
.steps span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sheet{
  position:relative;width:100%;container-type:inline-size;
  border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(20,36,74,.14);background:#fff
}
.sheet img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.box{
  position:absolute;border:0;background:transparent;padding:.6cqw 1cqw;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:"Andika",sans-serif;color:var(--ink);font-size:2.6cqw;font-weight:700;line-height:1.25;
  direction:ltr;overflow:hidden;border-radius:2cqw;
}
.box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:pre-line}
.box .hint{
  font-family:"Tajawal",sans-serif;direction:rtl;font-size:2.7cqw;font-weight:700;color:#7d88a3;
  animation:pulse 1.8s ease-in-out infinite
}
.box.filled{background:rgba(255,255,255,.55)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.count{margin:10px 2px 0;font-weight:700;color:var(--muted);font-size:.95rem;text-align:center}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5
}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{
  font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;
  background:var(--accent);color:#fff;flex:1;box-shadow:0 6px 16px rgba(0,0,0,.15)
}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;flex:0 0 auto;font-size:1rem}

/* ---------- editor sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,25,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.show{display:flex}
.editor{
  background:#fff;width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .22s ease-out
}
@media (min-width:700px){.overlay{align-items:center}.editor{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.ed-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ed-icon{font-size:2.6rem;line-height:1;width:64px;height:64px;display:grid;place-items:center;border-radius:18px;border:3px solid var(--bc,#ccc);background:#fff}
.ed-head b{font-size:1.05rem}
.ed-head small{display:block;color:var(--muted);font-size:.85rem;direction:ltr;text-align:right;font-family:"Andika",sans-serif}
textarea{
  width:100%;min-height:130px;resize:vertical;font-family:"Andika",sans-serif;font-size:1.15rem;line-height:1.5;
  padding:12px 14px;border-radius:16px;border:3px dashed var(--bc,#ccc);outline:none;direction:ltr;color:var(--ink)
}
.ed-foot{display:flex;gap:10px;margin-top:12px}
.ed-nav{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.ed-nav button{font:inherit;font-weight:700;background:#f3f5fa;border:0;border-radius:12px;padding:8px 12px;color:var(--ink);cursor:pointer}

/* ---------- toast + done ---------- */
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-120%);transition:.3s;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:40;max-width:92vw;text-align:center
}
.toast.show{transform:translateX(-50%) translateY(0)}
.done{position:fixed;inset:0;background:rgba(15,25,50,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.done.show{display:flex}
.done .card{background:#fff;border-radius:26px;padding:26px 20px;text-align:center;max-width:380px;width:100%;border-top:8px solid var(--accent)}
.done .big{font-size:3.4rem;line-height:1}
.done h2{margin:10px 0 6px;font-size:1.4rem}
.done p{margin:0 0 16px;color:var(--muted)}
.done .btn{width:100%}
.done .btn.ghost{width:100%;margin-top:8px}
.notfound{padding:40px 16px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <button class="btn" id="sendBtn">📤 إرسال الحل</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="editor" id="editor">
    <div class="ed-head">
      <div class="ed-icon" id="edIcon"></div>
      <div><b id="edTitle">اكتبي إجابتك</b><small id="edQ"></small></div>
    </div>
    <textarea id="edText" maxlength="300" placeholder="Write here in English…" autocapitalize="sentences"></textarea>
    <div class="ed-nav">
      <button id="edPrev">→ المربع السابق</button>
      <button id="edNext">المربع التالي ←</button>
    </div>
    <div class="ed-foot">
      <button class="btn" id="edSave">✔️ تم</button>
      <button class="btn ghost" id="edCancel">إلغاء</button>
    </div>
  </div>
</div>

<div class="done" id="done">
  <div class="card">
    <div class="big">🎉</div>
    <h2>تم إرسال بحثك!</h2>
    <p id="doneMsg">أحسنتِ يا باحثة صغيرة 🌟</p>
    <button class="btn" id="doneOk">رائع!</button>
    <button class="btn ghost" id="doneEdit">✏️ تعديل وإعادة الإرسال</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   سؤال بحث علمي — Scientific Research Question (Grade 5/1, 5/2, 5/3)
   Teacher: Thuraya Al Naabi
   Answers are sent to the same Jotform used by مسار التميّز,
   tagged with unit "Research Question 5/x" and level "research".
   Teacher view: /research/results.html
   ============================================================ */
const JOTFORM_FORM_ID = "262434452585057";
const CLASSES = ["5/1","5/2","5/3"];
const BOX_COLORS = ["#f2559a","#a98be8","#e6ad21","#68b25c","#2aa3e3","#f98d3a"];

const SHEETS = {
  "5-1": {
    cls:"5/1", img:"img/5-1.webp", accent:"#2e9d4a", soft:"#e9f7ec",
    think:"What talents do our classmates have?",
    main:"What are the most common talents among Grade 5/1 students?",
    icons:["🎂","🧪","🤹","🧸","🍕","⚽"]
  },
  "5-2": {
    cls:"5/2", img:"img/5-2.webp", accent:"#e8475f", soft:"#fdebee",
    think:"How did people communicate in the past and today?",
    main:"How has communication technology changed in our families?",
    icons:["✉️","☎️","📱","💻","📧","📟"]
  },
  "5-3": {
    cls:"5/3", img:"img/5-3.webp", accent:"#e0a419", soft:"#fff6dc",
    think:"What types of shops are there in our village?",
    main:"Which shops do families in our village visit most often?",
    icons:["🥕","🐟","⚽","🎁","💍","👟"]
  }
};

/* write-area of each box on the worksheet, as % of the image (same layout on all 3 sheets) */
const COLS = [[7.9,31.0],[38.5,61.6],[69.0,92.2]];
const ROWS = [[63.4,72.4],[77.3,86.3]];

const params = new URLSearchParams(location.search);
const key = (params.get("c") || params.get("class") || "").replace("/", "-");
const sheet = SHEETS[key];
const PREVIEW = params.get("preview") === "1";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = v => String(v || "").trim().replace(/\s+/g, " ");
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

if (!sheet) {
  $("#app").innerHTML = `<div class="notfound"><h2>اختاري ورقة صفك</h2>
    <p style="color:#5d6a86">امسحي رمز QR الخاص بصفك، أو اختاري من هنا:</p>
    ${Object.keys(SHEETS).map(k => `<p><a class="btn" style="display:block;text-decoration:none;background:${SHEETS[k].accent}" href="?c=${k}">Grade ${SHEETS[k].cls.replace("/"," - ")}</a></p>`).join("")}</div>`;
} else {
  start();
}

function start(){
  const root = document.documentElement.style;
  root.setProperty("--accent", sheet.accent);
  root.setProperty("--accent-soft", sheet.soft);
  document.querySelector('meta[name="theme-color"]').content = sheet.accent;

  const DRAFT_KEY = "researchDraft_" + key;
  const who = store.get("researchStudent", {});
  const draft = store.get(DRAFT_KEY, null);
  const state = {
    answers: (draft && Array.isArray(draft.answers) ? draft.answers : []).concat(Array(6).fill("")).slice(0, 6),
    startedAt: (draft && draft.startedAt) || Date.now(),
    current: -1
  };

  $("#app").innerHTML = `
    <section class="info">
      <h1>🔎 سؤال بحث علمي <span class="badge">Grade ${esc(sheet.cls.replace("/"," - "))}</span></h1>
      <p>اكتبي اسمك وصفك، ثم اضغطي على كل مربع ملوّن واكتبي إجابتك بالإنجليزي.</p>
      <div class="row">
        <div class="field" id="fName"><label for="name">اسمك</label>
          <input id="name" dir="auto" autocomplete="name" placeholder="الاسم الثلاثي" value="${esc(who.name || "")}"></div>
        <div class="field" id="fCls"><label for="cls">صفك</label>
          <select id="cls">${CLASSES.map(c => `<option ${c === (who.cls || sheet.cls) ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      </div>
    </section>
    <div class="steps"><span>١ اكتبي اسمك وصفك</span><span>٢ اضغطي على المربعات وحلّي</span><span>٣ أرسلي ✅</span></div>
    <div class="sheet" id="sheet">
      <img src="${esc(sheet.img)}" alt="${esc(sheet.main)}" width="1200" height="1758">
    </div>
    <div class="count" id="count"></div>`;
  $("#bar").hidden = false;

  const sheetEl = $("#sheet");
  for (let i = 0; i < 6; i++) {
    const [x0, x1] = COLS[i % 3], [y0, y1] = ROWS[Math.floor(i / 3)];
    const b = document.createElement("button");
    b.className = "box"; b.type = "button"; b.dataset.i = i;
    b.style.cssText = `left:${x0}%;width:${x1 - x0}%;top:${y0}%;height:${y1 - y0}%`;
    b.setAttribute("aria-label", "Box " + (i + 1) + " " + sheet.icons[i]);
    b.addEventListener("click", () => openEditor(i));
    sheetEl.appendChild(b);
  }

  function paint(){
    document.querySelectorAll(".box").forEach(b => {
      const t = state.answers[+b.dataset.i];
      b.classList.toggle("filled", !!t);
      b.innerHTML = t ? `<span class="txt">${esc(t)}</span>` : `<span class="hint">✏️ اكتبي هنا</span>`;
    });
    const n = state.answers.filter(Boolean).length;
    $("#count").textContent = n === 6 ? "✅ أكملتِ المربعات الستة — جاهزة للإرسال!" : `أكملتِ ${n} من 6 مربعات`;
  }
  function saveDraft(){
    store.set(DRAFT_KEY, { answers: state.answers, startedAt: state.startedAt });
    store.set("researchStudent", { name: norm($("#name").value), cls: $("#cls").value });
  }

  /* ---------- editor ---------- */
  function openEditor(i){
    state.current = i;
    const ed = $("#editor");
    ed.style.setProperty("--bc", BOX_COLORS[i]);
    $("#edIcon").textContent = sheet.icons[i];
    $("#edTitle").textContent = `المربع ${i + 1} من 6`;
    $("#edQ").textContent = sheet.main;
    $("#edText").value = state.answers[i] || "";
    $("#edPrev").style.visibility = i > 0 ? "visible" : "hidden";
    $("#edNext").style.visibility = i < 5 ? "visible" : "hidden";
    $("#overlay").classList.add("show");
    setTimeout(() => $("#edText").focus(), 60);
  }
  function commit(){
    if (state.current < 0) return;
    state.answers[state.current] = norm($("#edText").value);
    saveDraft(); paint();
  }
  function closeEditor(){ $("#overlay").classList.remove("show"); state.current = -1; }
  $("#edSave").onclick = () => { commit(); closeEditor(); };
  $("#edCancel").onclick = closeEditor;
  $("#edPrev").onclick = () => { const i = state.current; commit(); openEditor(i - 1); };
  $("#edNext").onclick = () => { const i = state.current; commit(); openEditor(i + 1); };
  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") { commit(); closeEditor(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.current >= 0) closeEditor(); });

  $("#name").addEventListener("input", () => { $("#fName").classList.remove("err"); saveDraft(); });
  $("#cls").addEventListener("change", () => { $("#fCls").classList.remove("err"); saveDraft(); });

  /* ---------- submit ---------- */
  $("#sendBtn").onclick = async () => {
    const name = norm($("#name").value), cls = $("#cls").value;
    if (name.split(" ").length < 2) {
      $("#fName").classList.add("err"); $("#name").focus();
      return toast("اكتبي اسمك (اسمين على الأقل) ✍️");
    }
    const filled = state.answers.filter(Boolean).length;
    if (!filled) return toast("اضغطي على المربعات الملوّنة واكتبي إجاباتك أولًا ✏️");
    if (filled < 6 && !confirm(`كتبتِ ${filled} من 6 مربعات فقط. هل تريدين الإرسال الآن؟`)) return;

    const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "⏳ جاري الإرسال…";
    const attempts = store.get("researchAttempts", {});
    const attempt = (attempts[key] || 0) + 1;
    const unit = "Research Question " + sheet.cls;
    const details = {
      version: 1, type: "research", sheet: key, sheetClass: sheet.cls, studentName: name, cls,
      unit, think: sheet.think, question: sheet.main, attempt,
      answers: state.answers.map((t, i) => ({ box: i + 1, icon: sheet.icons[i], text: t })),
      filled, duration: Math.round((Date.now() - state.startedAt) / 1000), completedAt: new Date().toISOString()
    };
    const fd = new FormData();
    fd.append("formID", JOTFORM_FORM_ID);
    fd.append("submitSource", "research-question");
    fd.append("q2_q2_textbox0", name);
    fd.append("q3_q3_textbox1", cls);
    fd.append("q4_q4_textbox2", unit);
    fd.append("q5_q5_textbox3", `${filled}/6`);
    fd.append("q7_input", "name:" + name.toLowerCase() + "|" + cls);
    fd.append("q8_input", "research");
    fd.append("q9_input", String(attempt));
    fd.append("q10_input", String(details.duration));
    fd.append("q11_input", JSON.stringify(details));
    fd.append("q12_input", "مُرسل");
    try {
      if (!PREVIEW) {
        await fetch("https://submit.jotform.com/submit/" + JOTFORM_FORM_ID, { method: "POST", mode: "no-cors", keepalive: true, body: fd });
      }
      attempts[key] = attempt; store.set("researchAttempts", attempts);
      saveDraft();
      $("#doneMsg").textContent = `أحسنتِ يا ${name.split(" ")[0]}! وصل بحثك للمعلمة ثريا 🌟`;
      $("#done").classList.add("show");
    } catch (e) {
      toast("⚠️ لم يتم الإرسال — تأكدي من الإنترنت وحاولي مرة أخرى. إجاباتك محفوظة.");
    } finally {
      btn.disabled = false; btn.textContent = "📤 إرسال الحل";
    }
  };
  $("#doneOk").onclick = () => $("#done").classList.remove("show");
  $("#doneEdit").onclick = () => $("#done").classList.remove("show");

  paint();
}

let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
</script>
</body>
</html>
