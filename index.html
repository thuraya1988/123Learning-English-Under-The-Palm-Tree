<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>123 Learning English Under The Palm Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background-color:#fdf3dd;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  font-family:'Nunito',sans-serif;
}
.page-wrap {
  width:100vw;
  max-width:none;
  margin:0;
  background:#fdf3dd;
  min-height:100vh;
  overflow:hidden;
}

.hero {
  display:flex;
  gap:26px;
  padding:36px 34px 22px;
  align-items:stretch;
}
.hero-left,
.hero-right {
  flex:1 1 0;
  width:0;
  position:relative;
  min-height:420px;
  border-radius:34px;
  overflow:visible;
  transition:transform 0.28s ease, box-shadow 0.28s ease;
}
.hero-left {
  background:#6f0828;
  border:2px solid #314f53;
  box-shadow:14px 16px 0 rgba(49,79,83,0.34), 14px 18px 30px rgba(49,79,83,0.18);
  overflow:hidden;
}
.hero-right {
  background:#037f8f;
  border:2px solid #00545f;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:18px 18px 34px;
  box-shadow:14px 16px 0 rgba(49,79,83,0.28), 14px 18px 30px rgba(49,79,83,0.16);
}
.hero-left::before,
.hero-right::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:34px;
  pointer-events:none;
  background:linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 34%, rgba(0,0,0,0.07));
}
.hero-left::after,
.hero-right::after {
  content:"";
  position:absolute;
  inset:2px;
  border-radius:32px;
  pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -8px 16px rgba(0,0,0,0.12);
}
.hero-left:hover,
.hero-right:hover {
  transform:translateY(-4px);
}

.hero-center-img {
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  width:68%;
  height:auto;
  min-width:160px;
  z-index:2;
  object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,0.24));
  transition:transform 0.28s ease, filter 0.28s ease;
}
.hero-side-img {
  position:absolute;
  right:-58px;
  top:18px;
  width:40%;
  height:auto;
  min-width:92px;
  z-index:3;
  object-fit:contain;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,0.26));
  transition:transform 0.28s ease, filter 0.28s ease;
}
.hero-left:hover .hero-center-img {
  transform:translate(-50%,-50%) scale(1.015);
}
.hero-left:hover .hero-side-img {
  transform:translateX(-4px) scale(1.02);
}

.carve-overlay {
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:4;
  background:
    radial-gradient(circle at 50% 48%, rgba(255,255,255,0.05), rgba(255,255,255,0) 34%),
    linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.08));
  mix-blend-mode:multiply;
}

.hero-title-img {
  width:112%;
  max-width:none;
  height:auto;
  margin-top:-8px;
  margin-left:-6%;
  position:relative;
  z-index:2;
  filter:drop-shadow(6px 8px 0 rgba(0,55,62,0.72));
  transition:transform 0.28s ease, filter 0.28s ease;
}
.hero-right:hover .hero-title-img {
  transform:scale(1.01);
  filter:
    drop-shadow(0 0 10px rgba(255,255,255,0.16))
    drop-shadow(0 0 22px rgba(170,220,255,0.20))
    drop-shadow(6px 8px 0 rgba(0,55,62,0.72));
}

.hero-hang-img {
  position:absolute;
  left:-34px;
  bottom:-24px;
  width:26%;
  min-width:120px;
  height:auto;
  z-index:3;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,0.24));
  transition:transform 0.28s ease, filter 0.28s ease;
}
.hero-hang-img-right {
  position:absolute;
  right:-34px;
  bottom:-26px;
  width:28%;
  min-width:126px;
  height:auto;
  z-index:3;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,0.24));
  transition:transform 0.28s ease, filter 0.28s ease;
}
.hero-right:hover .hero-hang-img {
  transform:translateY(-3px);
  filter:
    drop-shadow(0 0 8px rgba(255,240,170,0.55))
    drop-shadow(0 0 18px rgba(255,214,90,0.42))
    drop-shadow(0 10px 16px rgba(0,0,0,0.24));
}
.hero-right:hover .hero-hang-img-right {
  transform:translateY(-3px);
  filter:
    drop-shadow(0 0 8px rgba(255,240,170,0.55))
    drop-shadow(0 0 18px rgba(255,214,90,0.42))
    drop-shadow(0 10px 16px rgba(0,0,0,0.24));
}

.hero-start-btn {
  margin-top:auto;
  margin-bottom:12px;
  position:relative;
  z-index:2;
  border:none;
  border-radius:999px;
  padding:16px 36px;
  min-width:180px;
  background:linear-gradient(180deg,#7d79c7 0%, #6362a8 100%);
  color:#ffffff;
  font-family:'Fredoka One', cursive;
  font-size:1.05rem;
  letter-spacing:1px;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  box-shadow:0 8px 0 #013a44, 10px 12px 0 rgba(0,58,68,0.78);
  transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
}
.hero-start-btn:hover {
  transform:scale(1.08);
  box-shadow:0 9px 0 #013a44, 12px 14px 0 rgba(0,58,68,0.84);
  filter:saturate(1.06);
}
.hero-start-btn:active {
  transform:translateY(4px) scale(1.02);
  box-shadow:0 3px 0 #013a44, 6px 8px 0 rgba(0,58,68,0.68);
}

@media (max-width: 900px) {
  .hero {
    gap:18px;
    padding:26px 20px 18px;
  }
  .hero-left,
  .hero-right {
    min-height:360px;
    border-radius:28px;
  }
  .hero-left::before,
  .hero-right::before { border-radius:28px; }
  .hero-left::after,
  .hero-right::after { border-radius:26px; }

  .hero-center-img {
    left:50%;
    top:60%;
    transform:translate(-50%,-50%);
    width:72%;
    min-width:120px;
  }
  .hero-side-img {
    width:42%;
    min-width:70px;
    top:12px;
    right:-28px;
  }
  .hero-title-img { width:106%; }
  .hero-hang-img {
    left:-18px;
    bottom:-18px;
    width:30%;
    min-width:82px;
  }
  .hero-hang-img-right {
    right:-18px;
    bottom:-18px;
    width:30%;
    min-width:84px;
  }
}
</style>
</head>
<body>

<div class="page-wrap">
  <div class="hero">
    <div class="hero-left">
      <img class="hero-center-img" src="./ping0ne.png" alt="">
      <img class="hero-side-img" src="./rocketboys.png" alt="">
      <div class="carve-overlay"></div>
    </div>

    <div class="hero-right">
      <img class="hero-title-img" src="./popone.png" alt="" width="520" height="360">
      <img class="hero-hang-img" src="./poppicone.png" alt="" width="160" height="220">
      <img class="hero-hang-img-right" src="./poppictwo.png" alt="" width="170" height="220">
      <a class="hero-start-btn" href="registration.html">Start</a>
    </div>
  </div>
</div>

<script>
(function () {
  const btn = document.querySelector('.hero-start-btn');
  if (!btn) return;

  let audioCtx;
  function playHoverPop() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    } catch (e) {}
  }

  btn.addEventListener('mouseenter', playHoverPop);
  btn.addEventListener('focus', playHoverPop);
})();
</script>

</body>
</html>
