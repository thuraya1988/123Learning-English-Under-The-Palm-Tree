<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Learn English Under The Palm Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    body {
      position: relative;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('cover.jpeg') center center / cover no-repeat;
      position: relative;
      overflow: hidden;
    }

    .content {
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.2s 0.5s ease forwards;
      position: relative;
      z-index: 5;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .sub-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      letter-spacing: 0.3em;
      color: #000;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #000;
      margin: 12px auto;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 600;
      color: #000;
      line-height: 1.3;
      margin-bottom: 0;
    }

    .title-palm {
      display: inline-block;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      line-height: 1;
      cursor: pointer;
      transform: translateY(-6px);
      text-shadow:
        0 2px 0 #2f6d3a,
        0 4px 0 #24552d,
        0 6px 0 #18391e,
        0 10px 16px rgba(0, 0, 0, 0.30);
      transition: transform 180ms ease, filter 180ms ease;
      user-select: none;
    }

    .title-palm:hover {
      transform: translateY(-10px) scale(1.08);
      filter: brightness(1.05);
    }

    .title-palm:active {
      transform: translateY(-3px) scale(0.96);
    }

    .year-tag {
      font-style: italic;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: #000;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: clamp(0.75rem, 1.8vw, 0.9rem);
      color: #000;
      font-style: italic;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .palm-icons {
      display: grid;
      grid-template-columns: repeat(2, minmax(230px, 1fr));
      gap: 14px 22px;
      margin: 20px auto 0;
      width: fit-content;
      position: relative;
      z-index: 5;
    }

    .palm-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      text-decoration: none;
      color: #000;
      min-height: 64px;
      min-width: 280px;
      padding: 8px 12px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 180ms ease, box-shadow 180ms ease;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(1.5px);
    }

    .palm-item:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .palm {
      font-size: 4rem;
      line-height: 1;
      filter: grayscale(1) brightness(0);
      display: block;
      cursor: pointer;
      text-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      transition: transform 180ms ease;
    }

    .palm-item:hover .palm {
      transform: scale(1.08);
    }

    .palm-text {
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .bg-palms {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bg-palm {
      position: absolute;
      font-size: clamp(2rem, 4vw, 3.2rem);
      opacity: 0.16;
      filter: grayscale(1) brightness(0);
      text-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .bg-palm.one { top: 10%; left: 8%; }
    .bg-palm.two { top: 18%; right: 9%; }
    .bg-palm.three { bottom: 20%; left: 12%; }
    .bg-palm.four { bottom: 12%; right: 14%; }
    .bg-palm.five { top: 42%; left: 4%; }
    .bg-palm.six { top: 56%; right: 5%; }

    .bg-palm.animate {
      animation: swayPalm 1.8s ease-in-out 2;
    }

    @keyframes swayPalm {
      0%   { transform: translateY(0) rotate(0deg) scale(1); }
      20%  { transform: translateY(-8px) rotate(-5deg) scale(1.04); }
      50%  { transform: translateY(5px) rotate(5deg) scale(1.08); }
      80%  { transform: translateY(-4px) rotate(-3deg) scale(1.03); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    .sparkle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }

    .sparkle {
      position: absolute;
      top: -40px;
      opacity: 0;
      animation: fallSparkle linear forwards;
      user-select: none;
      will-change: transform, opacity;
    }

    @keyframes fallSparkle {
      0% {
        transform: translateY(-30px) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(115vh) rotate(240deg) scale(1.15);
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .palm-icons {
        grid-template-columns: 1fr;
      }

      .palm-item {
        min-width: 250px;
      }

      .title-wrap {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div class="scene">
  <div class="bg-palms">
    <span class="bg-palm one">🌴</span>
    <span class="bg-palm two">🌴</span>
    <span class="bg-palm three">🌴</span>
    <span class="bg-palm four">🌴</span>
    <span class="bg-palm five">🌴</span>
    <span class="bg-palm six">🌴</span>
  </div>

  <div class="sparkle-layer" id="sparkleLayer"></div>

  <div class="content">
    <p class="sub-label">An Educational Journey</p>
    <div class="divider"></div>

    <div class="title-wrap">
      <span class="title-palm" onclick="magicPalm()">🌴</span>
      <h1 class="title">Let's Learn English<br/>Under The Palm Tree</h1>
    </div>

    <p class="year-tag">From 1973 to 2027</p>
    <p class="tagline">Stories that might happen<br/>in Thuraya's deep mind</p>

    <div class="palm-icons">
      <a class="palm-item" href="THEPALM1973.html" onclick="playSound()">
        <span class="palm">🌴</span>
        <span class="palm-text"><strong>The Palm Stories</strong></span>
      </a>

      <a class="palm-item" href="palm_characters.html" onclick="playSound()">
        <span class="palm">🌴</span>
        <span class="palm-text"><strong>The Palm characters</strong></span>
      </a>

      <a class="palm-item" href="starter.html" onclick="playSound()">
        <span class="palm">🌴</span>
        <span class="palm-text"><strong>The Palm challenges</strong></span>
      </a>

      <a class="palm-item" href="palmtreegames.html" onclick="playSound()">
        <span class="palm">🌴</span>
        <span class="palm-text"><strong>The Palm Games</strong></span>
      </a>

      <a class="palm-item" href="#" onclick="playSound()">
        <span class="palm">🌴</span>
      </a>

      <a class="palm-item" href="#" onclick="playSound()">
        <span class="palm">🌴</span>
      </a>
    </div>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>

<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
  function playSound() {
    const clickAudio = document.getElementById('click-sfx');
    if (clickAudio) {
      clickAudio.currentTime = 0;
      clickAudio.play().catch(() => {});
      return;
    }

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  }

  function magicPalm() {
    playSound();

    const palms = document.querySelectorAll('.bg-palm');
    palms.forEach(palm => {
      palm.classList.remove('animate');
      void palm.offsetWidth;
      palm.classList.add('animate');
    });

    const layer = document.getElementById('sparkleLayer');
    const shapes = ['🌴', '✨', '⭐', '🌟'];

    for (let i = 0; i < 22; i++) {
      const item = document.createElement('span');
      item.className = 'sparkle';
      item.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (18 + Math.random() * 20) + 'px';
      item.style.animationDuration = (2.2 + Math.random() * 2) + 's';
      layer.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 4500);
    }
  }
</script>

</body>
</html>
