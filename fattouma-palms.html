<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فطّومة والنخيل</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#140b07;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, #2a1810 0%, #140b07 70%);}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
    box-shadow:0 0 80px rgba(255,150,60,.12);}
</style>

<body>
<canvas id="c"></canvas>
<script>
/* ============================================================
   فطّومة والنخيل — FATTOUMA & THE PALMS
   A tiny handcrafted pixel adventure set in a lush Omani village.
   Move: ←/→ or A/D · Jump: Z/Space · Dash: X/Shift · Act: E · R: respawn · M: mute
   ============================================================ */
"use strict";
const T=16, VW=480, VH=272;
const cv=document.getElementById('c'); cv.width=VW; cv.height=VH;
const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);
  cv.style.width=(VW*s|0)+'px'; cv.style.height=(VH*s|0)+'px';}
addEventListener('resize',fit); fit();

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>a+Math.random()*(b-a)|0;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rr(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x|0,y|0,w,h);}
function hash(x,y){return ((x*374761393+y*668265263)^(x*1274126177))>>>0;}

/* ---------- palette ---------- */
const C={
 skin:'#e0a377',skinD:'#b97e52',scarf:'#b03a5b',scarfD:'#7e2743',gold:'#f2c14e',goldD:'#c9892b',
 dress:'#2e8577',dressD:'#1f5f55',pants:'#6e3048',sandal:'#8a5a33',eye:'#26150f',white:'#fff6ea',blush:'#e8839b',
 mud1:'#dcaa70',mud2:'#c68e54',mud3:'#a06b3c',mudD:'#7c4f2a',wood:'#7a4a2b',woodD:'#57341e',woodL:'#96613a',
 grass1:'#82b46a',grass2:'#5f8f4c',grass3:'#3f6b38',leaf:'#3e7c4f',leafD:'#2c5e3d',leafL:'#6fae67',
 dirt1:'#b5854f',dirt2:'#94673b',water1:'#7fd6cd',water2:'#3ba7a8',water3:'#1f7f88',
 stone1:'#aaa393',stone2:'#7d766a',stoneD:'#5c564b',path1:'#e3bc82',path2:'#c9a066',
 orange:'#e8873a',orangeD:'#c05f22',sky1:'#a8dcec',sky2:'#f6e3b0',sun:'#ffe9a8',
 night:'#2c1e4a',amber:'#ffcf6e'};

/* ---------- audio (all synthesized) ----------
   نغمة الواحة: كلّ صوت يمرّ على مرشّح دافئ وصدى قصير حتّى لا يجرح الأذن،
   والمقام شرقيّ (بياتي على «ري») بدل النغمات العشوائيّة.        */
let AC=null, master=null, muted=false, waterGain=null, musicT=1;
let echoIn=null, warm=null, leafGain=null;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    // سلسلة الإخراج: master → دفء → ضاغط لطيف → السمّاعات
    master=AC.createGain(); master.gain.value=muted?0:0.45;
    warm=AC.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=5200; warm.Q.value=0.5;
    const shelf=AC.createBiquadFilter(); shelf.type='highshelf'; shelf.frequency.value=3200; shelf.gain.value=-5;
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-20; comp.knee.value=22; comp.ratio.value=3.2; comp.attack.value=0.006; comp.release.value=0.22;
    master.connect(warm); warm.connect(shelf); shelf.connect(comp); comp.connect(AC.destination);
    // صدى دافئ قصير — يعطي إحساس ساحة القرية
    echoIn=AC.createGain(); echoIn.gain.value=1;
    const dly=AC.createDelay(1.0); dly.delayTime.value=0.185;
    const fb=AC.createGain(); fb.gain.value=0.26;
    const dampen=AC.createBiquadFilter(); dampen.type='lowpass'; dampen.frequency.value=2200;
    const wet=AC.createGain(); wet.gain.value=0.5;
    echoIn.connect(dly); dly.connect(dampen); dampen.connect(fb); fb.connect(dly); dampen.connect(wet); wet.connect(master);
    // نسمة بعيدة
    const wb=noiseBuf(2), ws=AC.createBufferSource(); ws.buffer=wb; ws.loop=true;
    const wf=AC.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=290;
    const wg=AC.createGain(); wg.gain.value=0.022; ws.connect(wf);wf.connect(wg);wg.connect(master); ws.start();
    // حفيف السعف — يعلو مع هبّات الريح
    const lb=noiseBuf(2), ls=AC.createBufferSource(); ls.buffer=lb; ls.loop=true;
    const lf=AC.createBiquadFilter(); lf.type='bandpass'; lf.frequency.value=2600; lf.Q.value=0.4;
    leafGain=AC.createGain(); leafGain.gain.value=0.004;
    ls.connect(lf);lf.connect(leafGain);leafGain.connect(master); ls.start();
    // خرير الفلج (شدّته حسب القرب)
    const qb=noiseBuf(2), qs=AC.createBufferSource(); qs.buffer=qb; qs.loop=true;
    const qf=AC.createBiquadFilter(); qf.type='bandpass'; qf.frequency.value=880; qf.Q.value=0.55;
    waterGain=AC.createGain(); waterGain.gain.value=0; qs.connect(qf);qf.connect(waterGain);waterGain.connect(master); qs.start();
  }catch(e){AC=null;}
}
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return b;}
/* نفخة نغميّة بمهاجمة ناعمة — لا نقرة في البداية ولا قطع في النهاية */
function tone(f,d,type,v,slide,delay,wet){
  if(!AC)return; type=type||'sine';v=v==null?0.15:v;delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),ga=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  const atk=Math.min(0.022,d*0.3);
  ga.gain.setValueAtTime(0.0001,t);
  ga.gain.linearRampToValueAtTime(v,t+atk);
  ga.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(ga);ga.connect(master);
  if(wet&&echoIn){const s=AC.createGain();s.gain.value=wet;ga.connect(s);s.connect(echoIn);}
  o.start(t);o.stop(t+d+0.05);}
function noise(d,fq,v,type,delay,q){
  if(!AC)return;v=v==null?0.2:v;delay=delay||0;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf(Math.max(0.05,d));
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fq;if(q)f.Q.value=q;
  const ga=AC.createGain();
  ga.gain.setValueAtTime(0.0001,t);
  ga.gain.linearRampToValueAtTime(v,t+Math.min(0.012,d*0.3));
  ga.gain.exponentialRampToValueAtTime(0.0008,t+d);
  s.connect(f);f.connect(ga);ga.connect(master);s.start(t);s.stop(t+d+0.05);}
/* نقرة عود: أساس + توافقيّة خفيفة */
function pluck(f,d,v,delay,wet){
  tone(f,d,'triangle',v,0,delay,wet==null?0.30:wet);
  tone(f*2,d*0.55,'sine',v*0.32,0,delay,0.18);
  tone(f*3.01,d*0.28,'sine',v*0.10,0,delay);
}
const S={
 step:(alt)=>noise(0.05,alt?980:820,0.035,'bandpass',0,0.9),
 jump:()=>{tone(300,0.16,'triangle',0.075,240,0,0.15);tone(600,0.09,'sine',0.02,180);},
 land:()=>{noise(0.09,420,0.07);tone(120,0.09,'sine',0.05,-30);},
 dash:()=>{noise(0.18,1700,0.07,'bandpass',0,1.1);tone(240,0.14,'triangle',0.04,320,0,0.2);},
 pick:()=>{pluck(784,0.16,0.075);pluck(1175,0.20,0.055,0.055);},
 gold:()=>{[784,932,1046,1245,1568].forEach((f,i)=>pluck(f,0.42,0.075,i*0.065,0.4));},
 key:()=>{pluck(1046,0.24,0.085,0,0.4);pluck(1568,0.34,0.06,0.1,0.45);},
 creak:()=>{tone(190,0.45,'triangle',0.045,-80,0,0.25);noise(0.32,360,0.03);},
 clunk:()=>{tone(150,0.14,'triangle',0.085,-40);noise(0.09,420,0.07);},
 crank:()=>{noise(0.06,760,0.06,'bandpass',0,1.4);tone(220,0.09,'triangle',0.045);},
 splash:()=>{noise(0.34,700,0.15,'lowpass');noise(0.18,1900,0.05,'bandpass',0.02,0.8);tone(330,0.22,'sine',0.045,-190);},
 pour:()=>{noise(0.42,1100,0.09,'bandpass',0,0.7);},
 baa:()=>{tone(233,0.18,'triangle',0.075,36,0,0.2);tone(207,0.22,'triangle',0.06,-28,0.16,0.2);},
 cluck:()=>{tone(740,0.055,'triangle',0.05,-210);tone(620,0.055,'triangle',0.04,-150,0.075);},
 meow:()=>{tone(590,0.3,'triangle',0.075,230,0,0.25);tone(1180,0.2,'sine',0.018,180);},
 sneeze:()=>{noise(0.13,2100,0.10,'highpass');tone(880,0.16,'triangle',0.055,-520,0.08,0.2);},
 boing:()=>{tone(220,0.28,'triangle',0.10,340,0,0.25);},
 bell:()=>{tone(1046,0.75,'sine',0.085,0,0,0.5);tone(1568,0.9,'sine',0.05,0,0.03,0.5);tone(2093,0.5,'sine',0.018,0,0.02,0.4);},
 thud:()=>{tone(95,0.17,'triangle',0.10,-30);noise(0.11,260,0.08);},
 rumble:()=>{noise(0.75,150,0.13);tone(72,0.65,'triangle',0.055,-20);},
 give:()=>{[587,698,880].forEach((f,i)=>pluck(f,0.24,0.075,i*0.075,0.35));},
 hint:()=>tone(1046,0.09,'sine',0.035,0,0,0.3),
 wheel:()=>{noise(0.55,560,0.10);tone(130,0.45,'triangle',0.055,-40);},
};
/* مقام بياتي على «ري»: ري، مي♭نصف، فا، صول، لا، سي♭، دو، ري */
const SCALE=[293.7,311.1,349.2,392.0,440.0,466.2,523.3,587.3];
const PHRASES=[[0,2,3,2,0],[4,3,2,3,4,5],[0,3,4,5,4,3,2],[2,4,5,7,5,4],[5,4,3,2,0]];
let phrase=null,phraseI=0;
function musicTick(dt){ if(!AC)return; musicT-=dt;
  if(musicT>0)return;
  if(!phrase){ phrase=PHRASES[ri(0,PHRASES.length)]; phraseI=0;
    // درون خفيف تحت الجملة
    tone(SCALE[0]/2,3.2,'sine',0.022,0,0,0.2);
  }
  const deg=phrase[phraseI++];
  pluck(SCALE[deg],0.9,0.05,0,0.45);
  if(phraseI>=phrase.length){ phrase=null; musicT=rnd(3.4,6.0); }
  else musicT=rnd(0.30,0.46);
}
let birdT=3;
function birdTick(dt){ if(!AC)return; birdT-=dt;
  if(birdT<=0){ birdT=rnd(3.5,9); const b=rnd(2100,2900);
    tone(b,0.075,'sine',0.026,420,0,0.35); tone(b*1.18,0.065,'sine',0.02,340,0.1,0.35);
    if(Math.random()<0.5)tone(b*0.92,0.06,'sine',0.016,520,0.22,0.35);}}
/* هبّات ريح تحرّك حفيف السعف */
let gustT=2;
function gustTick(dt){ if(!AC||!leafGain)return; gustT-=dt;
  if(gustT<=0){ gustT=rnd(4,10);
    const t=AC.currentTime, peak=0.010+Math.random()*0.016, up=0.9+Math.random(), hold=0.8+Math.random();
    leafGain.gain.cancelScheduledValues(t);
    leafGain.gain.setValueAtTime(leafGain.gain.value,t);
    leafGain.gain.linearRampToValueAtTime(peak,t+up);
    leafGain.gain.linearRampToValueAtTime(0.004,t+up+hold+1.2);
  }}

/* ---------- input ---------- */
const keys={},pressed={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true; keys[e.code]=true;
  initAudio(); if(AC&&AC.state==='suspended')AC.resume();
  if(e.code==='KeyM'){muted=!muted; if(master)master.gain.value=muted?0:0.45;}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',()=>{initAudio(); if(AC&&AC.state==='suspended')AC.resume(); pressed['Enter']=true;});
const down=(...c)=>c.some(k=>keys[k]), hit=(...c)=>c.some(k=>pressed[k]);

/* ============================================================
   SPRITES — everything hand-baked to offscreen canvases
   ============================================================ */
const SPR={};
function bakeTiles(){
  // dirt
  let c=mk(T,T),x=c.getContext('2d'); rr(x,0,0,T,T,C.dirt1);
  [[3,4],[9,7],[13,12],[6,13],[11,2],[2,10]].forEach(p=>rr(x,p[0],p[1],2,1,C.dirt2));
  SPR.dirt=c;
  // grass top
  c=mk(T,T);x=c.getContext('2d'); x.drawImage(SPR.dirt,0,0);
  rr(x,0,0,T,4,C.grass2); rr(x,0,0,T,2,C.grass1);
  [1,4,7,10,13].forEach(i=>rr(x,i,4,1,1,C.grass2));
  [2,6,11,14].forEach(i=>rr(x,i,0,1,1,C.grass3));
  SPR.grass=c;
  // path top
  c=mk(T,T);x=c.getContext('2d'); x.drawImage(SPR.dirt,0,0);
  rr(x,0,0,T,4,C.path2); rr(x,0,0,T,2,C.path1);
  [[3,2],[10,1],[7,3]].forEach(p=>rr(x,p[0],p[1],2,1,'#d8ae74'));
  SPR.path=c;
  // stone
  c=mk(T,T);x=c.getContext('2d'); rr(x,0,0,T,T,C.stone2);
  rr(x,1,1,6,6,C.stone1); rr(x,9,1,6,6,C.stone1); rr(x,1,9,6,6,C.stone1); rr(x,9,9,6,6,C.stone1);
  rr(x,2,2,2,1,'#c2bcae'); rr(x,10,10,2,1,'#c2bcae');
  SPR.stone=c;
  // mud brick
  c=mk(T,T);x=c.getContext('2d'); rr(x,0,0,T,T,C.mud2);
  rr(x,0,0,7,7,C.mud1); rr(x,8,0,8,7,C.mud1); rr(x,0,8,8,8,C.mud1); rr(x,9,8,7,8,C.mud1);
  rr(x,0,7,T,1,C.mud3); rr(x,8,0,1,7,C.mud3); rr(x,8,8,1,8,C.mud3); rr(x,0,15,T,1,C.mud3);
  SPR.brick=c;
  // plank platform
  c=mk(T,T);x=c.getContext('2d');
  rr(x,0,0,T,6,C.wood); rr(x,0,0,T,1,C.woodL); rr(x,0,5,T,1,C.woodD);
  rr(x,2,2,1,1,C.woodD); rr(x,12,2,1,1,C.woodD);
  rr(x,1,6,2,3,C.woodD); rr(x,13,6,2,3,C.woodD);
  SPR.plank=c;
}
function bakeBG(){
  // mountains (tileable 480 wide)
  let c=mk(480,120),x=c.getContext('2d');
  const ridge=(base,amp,col,seed)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,120);
    for(let i=0;i<=480;i+=4){const y=base-Math.abs(Math.sin(i*0.013+seed)*amp+Math.sin(i*0.05+seed*3)*amp*0.3);x.lineTo(i,y);}
    x.lineTo(480,120);x.closePath();x.fill();};
  ridge(78,42,'#c9a381',1.7); ridge(95,30,'#b58a67',4.2);
  // fort towers on far ridge
  const fort=(fx,fy)=>{rr(x,fx,fy,14,26,'#b58a67');rr(x,fx+2,fy-4,10,4,'#b58a67');
    for(let i=0;i<5;i++)rr(x,fx+1+i*3,fy-6,2,2,'#b58a67');rr(x,fx+5,fy+8,4,5,'#9c7355');};
  fort(70,52); fort(330,44);
  SPR.mount=c;
  // distant palm line
  c=mk(480,64);x=c.getContext('2d');
  rr(x,0,52,480,12,'#5c8a6a');
  for(let i=0;i<14;i++){const px=i*36+(i%3)*7,py=52,h=18+(i%3)*6;
    rr(x,px,py-h,2,h,'#4c7355');
    for(let a=0;a<5;a++){const ang=-2.6+a*0.55;
      rr(x,px+1+Math.cos(ang)*5,py-h+Math.sin(ang)*3,3,2,'#4c7355');
      rr(x,px+1+Math.cos(ang)*8,py-h+Math.sin(ang)*5,2,1,'#4c7355');}}
  SPR.palmline=c;
}
/* ---- hero ---- */
const RUN=[[4,0,-3,1,1,0],[5,1,-1,2,0,1],[3,2,2,1,-1,2],[0,2,4,0,-1,1],
           [-3,1,4,1,0,0],[-2,2,2,2,1,1],[1,1,-2,1,1,2],[3,0,-4,2,0,1]];
function heroFrame(o){
  const c=mk(24,28),x=c.getContext('2d'),F=(a,b,w,h,col)=>rr(x,a,b,w,h,col);
  const by=o.by|0,hx=o.lean|0,tw=o.tw||0;
  // scarf tail
  if(o.flatTail){F(1,8+by+(tw&1),6,2,C.scarfD);F(0,10+by,4,2,C.scarf);}
  else{F(7+hx,9+by,2,2,C.scarfD);F(6+hx+(tw&1),11+by,2,2,C.scarf);F(5+hx+((tw>>1)&1),13+by,2,2,C.scarfD);}
  // back arm
  if(o.ab)arm(x,o.ab,hx,by);
  // legs
  leg(x,o.lb);leg(x,o.lf);
  // dress
  F(10+hx,10+by,7,3,C.dress);F(9+hx,13+by,9,3,C.dress);F(8+hx,16+by,11,3,C.dress);
  const hem=o.hem|0;
  F(7+hx+hem,19+by,13,2,C.dress);F(7+hx+hem,21+by,13,1,C.dressD);
  F(8+hx+hem,20+by,11,1,C.gold);
  F(12+hx,11+by,1,1,C.gold);F(14+hx,12+by,1,1,C.goldD);F(11+hx,15+by,1,1,C.gold);
  // front arm
  if(o.af)arm(x,o.af,hx,by);
  // head
  F(9+hx,2+by,8,2,C.scarf);F(8+hx,4+by,10,2,C.scarf);
  F(8+hx,6+by,2,5,C.scarf);F(16+hx,6+by,2,3,C.scarf);
  F(10+hx,6+by,6,4,C.skin);
  F(9+hx,3+by,1,1,C.gold);F(16+hx,4+by,1,1,C.gold);F(8+hx,8+by,1,1,C.gold);
  if(o.blink){F(13+hx,8+by,2,1,C.eye);}
  else{F(13+hx,7+by,2,2,C.eye);F(13+hx,7+by,1,1,C.white);}
  F(11+hx,8+by,1,1,C.blush);F(15+hx,9+by,1,1,C.skinD);
  // dash speed lines
  if(o.lines){F(0,12,4,1,'rgba(255,246,230,.8)');F(1,16,3,1,'rgba(255,246,230,.6)');}
  return c;
  function leg(q,l){if(!l)l={x:0,lift:0};
    q.fillStyle=C.pants;q.fillRect(11+(l.x>>1),21,2,4);
    q.fillStyle=C.pants;q.fillRect(10+l.x,23-(l.lift||0),2,2);
    q.fillStyle=C.sandal;q.fillRect(10+l.x,25-(l.lift||0),3,2);}
  function arm(q,a,hx2,by2){
    const sx=13+hx2+(a.x|0),sy=11+by2+(a.y|0);
    q.fillStyle=C.dressD;q.fillRect(sx,sy,2,3);
    q.fillStyle=C.skin;q.fillRect(sx+(a.dx|0),sy+3+(a.dy|0),2,2);}
}
function bakeHero(){
  const H={};
  H.idle=[0,1,2,3].map(i=>heroFrame({by:i>1?1:0,tw:i,blink:i===3,
    lf:{x:1,lift:0},lb:{x:-1,lift:0},
    af:{x:-1,y:0,dx:0,dy:1},ab:{x:-2,y:0,dx:0,dy:1}}));
  H.run=RUN.map((r,i)=>heroFrame({by:(i===2||i===6)?-1:0,tw:i%4,hem:r[4],
    lf:{x:r[0],lift:r[1]},lb:{x:r[2],lift:r[3]},

/* palm drawn live (variable height, sway, dates) */
function drawPalm(x,px,baseY,h,sway,dates,t){
  const lean=Math.sin(t*0.6+px)*sway;
  x.fillStyle=C.wood;
  for(let i=0;i<h;i+=4){const off=(i/h)*lean*3;
    rr(x,px+off-(i%8?0:1),baseY-i,4,4,i%8?C.wood:C.woodD);}
  const cx=px+lean*3+1,cy=baseY-h;
  const fr=[[-1,-.35],[-.82,-.7],[-.4,-1],[0,-1.15],[.4,-1],[.82,-.7],[1,-.35]];
  fr.forEach((f,i)=>{
    for(let s=2;s<12;s+=2){
      const fx=cx+f[0]*s*1.4+lean*(s/12)*3, fy=cy+f[1]*s+(s*s*0.045);
      rr(x,fx,fy,3,2,i%2?C.leaf:C.leafD);
      if(s>6)rr(x,fx+(f[0]>0?2:0),fy+1,1,2,C.leafL);}});
  rr(x,cx-2,cy-2,4,3,C.woodD);
  if(dates){rr(x,cx-5,cy+3,3,4,C.orange);rr(x,cx+3,cy+4,3,4,C.orangeD);
    rr(x,cx-4,cy+4,1,1,C.orangeD);rr(x,cx+4,cy+5,1,1,C.orange);}
}

function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.type==='fly'){p.x+=Math.sin(time*3+p.y)*8*dt+p.vx*dt;p.y+=p.vy*dt;}
    else if(p.type==='leaf'){p.x+=(p.vx+Math.sin(time*2+p.max*7)*12)*dt;p.y+=p.vy*dt;}
    else if(p.type==='zzz'){p.y-=12*dt;p.x+=Math.sin(time*3)*4*dt;}
    else{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}}
function drawParts(g2){
  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.type==='spark'){g2.fillStyle=p.col;g2.globalAlpha=a;
      g2.fillRect(p.x-1,p.y,3,1);g2.fillRect(p.x,p.y-1,1,3);}
    else if(p.type==='ring'){g2.strokeStyle=p.col;g2.globalAlpha=a*0.8;
      g2.strokeRect(p.x-4*(1-a)-2,p.y-2*(1-a)-1,4*(1-a)*2+4,2*(1-a)*2+2);}
    else if(p.type==='feather'){g2.fillStyle='#f6f1e6';g2.globalAlpha=a;g2.fillRect(p.x,p.y,2,1);}
    else if(p.type==='zzz'){g2.fillStyle='rgba(255,255,255,'+a*0.8+')';g2.font='7px monospace';g2.fillText('z',p.x,p.y);}
    else{g2.fillStyle=p.col;g2.globalAlpha=a;g2.fillRect(p.x,p.y,p.size,p.size);}}
  g2.globalAlpha=1;}

let toasts=[];

/* ============================================================
   PLAYER
   ============================================================ */
const pl={x:0,y:0,vx:0,vy:0,face:1,grounded:false,
  at:0,anim:'idle',frame:0,
  coyote:0,jbuf:0,prepT:0,dashT:0,dashCd:0,dashDir:1,
  landT:0,knockT:0,crankT:0,pushT:0,pushing:false,stepF:-1,
  carrying:false,bucketFull:false,
  golden:[false,false,false,false,false,false,false,false],got:0,dates:0,
  cpArea:0,cpX:13*16,control:false,sit:false};
function plRect(){return {x:pl.x-4,y:pl.y-15,w:8,h:15};}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function getSolids(){
  const s=[];
  for(const p of props){if(p.solid){const r=p.solid();if(r)s.push(r);}}
  for(const n of npcs){if(n.solid){const r=n.solid();if(r)s.push(r);}}
  return s;}
function moveAxis(dx,dy){
  // returns blocked dir for x
  let blocked=0;
  if(dx!==0){
    pl.x+=dx;
    const r=plRect(),tx0=Math.floor(r.x/T),tx1=Math.floor((r.x+r.w-0.01)/T),
      ty0=Math.floor(r.y/T),ty1=Math.floor((r.y+r.h-0.01)/T);
    outer:
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)
      if(solidTile(tx,ty)){
        pl.x=dx>0?tx*T-4.01:tx*T+T+4.01;blocked=dx>0?1:-1;break outer;}
    if(!blocked){const solids=getSolids();const r2=plRect();
      for(const s of solids)if(overlap(r2,s)){
        pl.x=dx>0?s.x-4.01:s.x+s.w+4.01;blocked=dx>0?1:-1;break;}}
  }
  if(dy!==0){
    const prevB=pl.y;
    pl.y+=dy;
    const r=plRect(),tx0=Math.floor(r.x/T),tx1=Math.floor((r.x+r.w-0.01)/T),
      ty0=Math.floor(r.y/T),ty1=Math.floor((r.y+r.h-0.01)/T);
    let land=false;
    outer2:
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
      const c=tileAt(tx,ty);
      const sol=c==='#'||c==='%'||c==='p'||c==='S'||c==='B';
      const one=c==='='&&dy>0&&prevB<=ty*T+1;
      if(sol||one){
        if(dy>0){pl.y=ty*T;land=true;}else pl.y=ty*T+T+15;
        pl.vy=0;break outer2;}}
    if(!land){const solids=getSolids();const r2=plRect();
      for(const s of solids)if(overlap(r2,s)){
        if(dy>0){pl.y=s.y;land=true;}else pl.y=s.y+s.h+15;
        pl.vy=0;break;}}
    if(land&&!pl.grounded){
      const hard=pl.landVy>260;
      pl.landT=hard?0.14:0.06;pl.landVy=0;
      dust(pl.x,pl.y,hard?6:2);S.land();
      if(hard)cam.shake=Math.max(cam.shake,2);}
    pl.grounded=land;
  }
  return blocked;}
function updatePlayer(dt){
  const locked=!pl.control||cine.on||pl.crankT>0||pl.pushT>0||trans.a>0||pl.sit;
  const dir=locked?0:(down('ArrowRight','KeyD')?1:0)-(down('ArrowLeft','KeyA')?1:0);
  if(dir!==0&&!pl.pushing)pl.face=dir;
  // timers
  pl.coyote=pl.grounded?0.09:Math.max(0,pl.coyote-dt);
  pl.jbuf=Math.max(0,pl.jbuf-dt);
  pl.dashCd=Math.max(0,pl.dashCd-dt);
  pl.landT=Math.max(0,pl.landT-dt);
  pl.knockT=Math.max(0,pl.knockT-dt);
  if(pl.crankT>0)pl.crankT-=dt;
  if(pl.pushT>0)pl.pushT-=dt;
  // inputs
  if(!locked){
    if(hit('KeyZ','Space','ArrowUp','KeyW'))pl.jbuf=0.12;
    if(hit('KeyX','ShiftLeft','ShiftRight','KeyK')&&pl.dashCd<=0&&pl.dashT<=0){
      pl.dashT=0.16;pl.dashCd=0.34;pl.dashDir=dir!==0?dir:pl.face;S.dash();}
  }
  // dash physics
  if(pl.dashT>0){
    pl.dashT-=dt;pl.vx=pl.dashDir*320;pl.vy=0;
    spawnP(pl.x-pl.dashDir*6,pl.y-8+rnd(-4,4),{type:'streak',col:'rgba(255,246,230,.7)',life:.2,vx:-pl.dashDir*40,size:ri(3,6)});
    if(pl.jbuf>0){doJump();pl.dashT=0;}
  } else if(pl.knockT>0){
    pl.vx*=Math.pow(0.02,dt);
  } else if(pl.crankT>0||pl.pushT>0||locked&&dir===0){
    pl.vx*=Math.pow(0.0001,dt);
  } else {
    const acc=pl.grounded?1400:900,max=115;
    if(dir!==0){pl.vx+=dir*acc*dt;pl.vx=clamp(pl.vx,-max,max);}
    else pl.vx*=Math.pow(pl.grounded?0.0001:0.25,dt);
  }
  // jump prep / jump
  if(pl.prepT>0){
    pl.prepT-=dt;
    if(pl.prepT<=0){if(pl.grounded||pl.coyote>0)doJump();pl.jbuf=0;}
  } else if(pl.jbuf>0&&(pl.grounded||pl.coyote>0)&&!locked&&pl.dashT<=0){
    pl.prepT=0.06;}
  // gravity
  if(pl.dashT<=0){pl.vy=Math.min(pl.vy+1500*dt,520);pl.landVy=pl.vy;}
  // variable jump
  if(pl.vy<0&&!down('KeyZ','Space','ArrowUp','KeyW')&&pl.dashT<=0)pl.vy*=Math.pow(0.02,dt);
  // move
  pl.grounded=false;
  const blocked=moveAxis(pl.vx*dt,0);
  moveAxis(0,pl.vy*dt);
  // pushing pots
  pl.pushing=false;
  if(blocked!==0&&pl.grounded&&dir!==0&&pl.dashT<=0&&pl.crankT<=0){
    const pr={x:pl.x+dir*4-5,y:pl.y-12,w:10,h:12};
    for(const pot of props)if(pot.pushable&&overlap(pr,{x:pot.x,y:pot.y,w:12,h:12})){
      const old=pot.x;
      pot.x=clamp(pot.x+dir*22*dt,pot.ox-32,pot.ox+32);
      if(pot.x!==old){pl.pushing=true;
        if(Math.random()<dt*4)dust(pot.x+6,pot.y+12,1);
        if(!pot.revealed&&Math.abs(pot.x-pot.ox)>=12){pot.revealed=true;
          if(pot.reveal==='key'){spawnPickup('key_brass',pot.ox,GY-10);sparkle(pot.ox,GY-12);S.hint();}
          else sparkle(pot.ox,GY-8);
          toast('يا له من مخبأ!','Something was hidden behind the pot!');}}}
    // goat butt
    if(ST.goatState==='guard'&&AREA_IDX===2){
      const gt=npcs.find(n=>n.type==='goat');
      if(gt&&Math.abs(pl.x-gt.x)<26&&pl.knockT<=0){
        pl.knockT=0.35;pl.vx=-dir*220;pl.vy=-180;gt.butt=0.4;
        S.baa();S.thud();cam.shake=4;
        bubbleAt(gt.x,gt.y-24,'!');}}}
  // water death
  const ft=tileAt(Math.floor(pl.x/T),Math.floor((pl.y-2)/T));
  if(ft==='~'){splash(pl.x,pl.y-4);S.splash();respawn();return;}
  // area transitions
  if(trans.a===0&&MODE==='play'){
    if(pl.x>(AW-2)*T)changeArea(AREA_IDX+1,'L');
    else if(pl.x<2*T&&AREA_IDX>0)changeArea(AREA_IDX-1,'R');}
  // checkpoint lantern touch
  for(const p of props)if(p.type==='lantern'&&!p.lit&&Math.abs(pl.x-p.x)<12){
    p.lit=true;pl.cpArea=AREA_IDX;pl.cpX=p.x+6;S.bell();sparkle(p.x+6,p.y+6);
    if(!ST.cpToast){ST.cpToast=true;toast('نقطة حفظ','Checkpoint lit — R to return here');}}
  updateAnim(dt);
  // footstep
  if(pl.anim==='run'){const f=pl.frame;
    if((f===0||f===4)&&pl.stepF!==f){pl.stepF=f;S.step(f===0);}}
  else pl.stepF=-1;
  pl.at+=dt;
}
function doJump(){
  pl.vy=-430;pl.grounded=false;pl.coyote=0;pl.jbuf=0;pl.prepT=0;S.jump();
  dust(pl.x,pl.y,3);
  if(pl.carrying&&pl.bucketFull){pl.bucketFull=false;
    for(let i=0;i<10;i++)spawnP(pl.x+rnd(-6,6),pl.y-26,{type:'drop',col:C.water1,life:.5,vx:rnd(-40,40),vy:rnd(-60,0),g:300});
    toast('انسكب الماء!','The water spilled!');}}
function updateAnim(dt){
  let a='idle',fps=3;
  if(pl.sit){a='sit';fps=1;}
  else if(pl.knockT>0){a='fall';fps=8;}
  else if(pl.crankT>0){a='crank';fps=8;}
  else if(pl.pushing||pl.pushT>0){a='push';fps=6;}
  else if(pl.dashT>0){a='dash';fps=16;}
  else if(pl.prepT>0){a='prep';fps=14;}
  else if(!pl.grounded){a=pl.vy<0?'rise':'fall';fps=10;}
  else if(pl.landT>0){a='land';fps=12;}

    spawnP(p.x+rnd(-8,8),GY-p.h,{type:'leaf',col:Math.random()<.5?C.leaf:C.leafL,life:rnd(1.5,3),vx:rnd(-8,8),vy:rnd(14,26)});break;}

    if(Math.random()<dt*3)spawnP(rnd(cam.x,cam.x+VW),rnd(60,GY-10),{type:'fly',life:rnd(2,4),vx:rnd(-6,6),vy:rnd(-5,3)});

  if(waterTiles.length&&Math.random()<dt*4){const w=waterTiles[ri(0,waterTiles.length)];
    spawnP(w.x+rnd(-6,6),w.y+2,{type:'spark',col:'#d8fff8',life:.4,vy:-6});}

    birds.push({x:Math.random()<.5?-20:cam.x+VW+20,y:rnd(16,70),vx:0,side:0,t:rnd(0,9)});

    b.x+=b.side*46*dt;if(b.x<-40||b.x>AW*T+40)birds.splice(i,1);}
  // water proximity volume

      const dd=Math.abs(w.x-pl.x)+Math.abs(w.y-pl.y)*0.5;if(dd<d)d=dd;}
    const target=AC?clamp(1-d/260,0,1)*0.06:0;

function update(dt){

  if(MODE==='title'){if(hit('Enter','Space','KeyZ')){S.bell();startIntro();}return;}

  if(endWait&&hit('KeyE')){cine.on=false;cine.lbT=0;pl.control=true;pl.sit=false;

  ambient(dt);musicTick(dt);birdTick(dt);gustTick(dt);
  if(activeBubble){activeBubble.t-=dt;if(activeBubble.t<=0)activeBubble=null;}
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t-=dt;if(toasts[i].t<=0)toasts.splice(i,1);}

}

function drawSky(g2){
  const gr=g2.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,lerpColor('#a8dcec','#3a2a5e',dusk));
  gr.addColorStop(0.7,lerpColor('#f6e3b0','#c96a4e',dusk));
  gr.addColorStop(1,lerpColor('#f9ecc4','#7c4a44',dusk));
  g2.fillStyle=gr;g2.fillRect(0,0,VW,VH);
  // sun
  const sy=44+dusk*60;
  g2.fillStyle=lerpColor('#ffe9a8','#ff9a5e',dusk);
  g2.beginPath();g2.arc(VW-90,sy,13,0,7);g2.fill();
  g2.fillStyle='rgba(255,233,168,.2)';g2.beginPath();g2.arc(VW-90,sy,20,0,7);g2.fill();
  // stars
  if(dusk>0.3){g2.fillStyle='rgba(255,250,230,'+(dusk-0.3)+')';
    for(let i=0;i<24;i++){const sx=(i*97)%VW,sy2=(i*61)%90+6;
      if((i+Math.floor(time*2))%7!==0)g2.fillRect(sx,sy2,1,1);}}
  // clouds
  g2.fillStyle='rgba(255,250,240,'+(0.7-dusk*0.4)+')';
  for(let i=0;i<4;i++){const cx=((i*173+time*6)%(VW+120))-60,cy=26+i*17;
    g2.fillRect(cx,cy,34,5);g2.fillRect(cx+8,cy-3,18,4);}}
function lerpColor(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=lerp(pa>>16,pb>>16,t)|0,gg=lerp(pa>>8&255,pb>>8&255,t)|0,bl=lerp(pa&255,pb&255,t)|0;
  return 'rgb('+r+','+gg+','+bl+')';}
function drawTiles(g2){
  const x0=Math.floor(cam.x/T)-1,x1=x0+Math.ceil(VW/T)+2;
  for(let ty=0;ty<AH;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);if(c==='.')continue;
    const dx=tx*T,dy=ty*T,v=hash(tx,ty)%2;
    if(c==='#')g2.drawImage(SPR.dirt,dx,dy);
    else if(c==='%')g2.drawImage(SPR.grass,dx,dy);
    else if(c==='p')g2.drawImage(SPR.path,dx,dy);
    else if(c==='S')g2.drawImage(SPR.stone,dx,dy);
    else if(c==='B')g2.drawImage(SPR.brick,dx,dy);
    else if(c==='=')g2.drawImage(SPR.plank,dx,dy);
    else if(c==='~'){
      rr(g2,dx,dy,T,T,C.water3);rr(g2,dx,dy,T,10,C.water2);
      if(tileAt(tx,ty-1)!=='~'){rr(g2,dx,dy,T,3,C.water1);
        const sp=((dx+time*30)%32);if(sp<6)rr(g2,dx+sp,dy+1,3,1,'#d8fff8');}}}
}
function drawWorld(g2){
  drawSky(g2);
  // parallax
  const p1=-(cam.x*0.15)%480,p2=-(cam.x*0.4)%480;
  g2.drawImage(SPR.mount,p1,86);g2.drawImage(SPR.mount,p1+480,86);
  g2.globalAlpha=0.9;
  g2.drawImage(SPR.palmline,p2,146);g2.drawImage(SPR.palmline,p2+480,146);
  g2.globalAlpha=1;
  g2.save();
  const shx=cam.shake>0?rnd(-cam.shake,cam.shake):0;
  g2.translate(Math.round(-cam.x+shx),Math.round(shx*0.5));
  // back props (houses etc — drawn first)
  for(const p of props)if(['house','arch','cliff'].includes(p.type))p.draw(g2);
  drawTiles(g2);
  // mid props
  for(const p of props)if(!['house','arch','cliff','palm'].includes(p.type)&&p.draw)p.draw(g2);
  // goat etc npcs behind palms? draw npcs
  for(const n of npcs)n.draw(g2);
  // palms in front of characters for depth
  for(const p of props)if(p.type==='palm')p.draw(g2);
  // pickups
  for(const p of pickups){if(p.taken)continue;
    if(p.kind==='gdate'&&pl.golden[p.gi])continue;
    const bob=Math.sin(p.t*3)*2;
    if(p.kind==='gdate'){
      g2.drawImage(SPR.pot,0,0); // (noop draw guard) -- replaced below
      drawGDate(g2,p.x,p.y+bob);}
    else if(p.kind==='date'){rr(g2,p.x-2,p.y+bob-3,4,6,C.orange);rr(g2,p.x-1,p.y+bob-5,2,2,C.leaf);}
    else if(p.kind==='key_brass'){rr(g2,p.x-3,p.y+bob-2,5,5,C.gold);rr(g2,p.x+1,p.y+bob,5,2,C.gold);rr(g2,p.x+5,p.y+bob+1,1,3,C.gold);
      if(Math.random()<0.05)sparkle(p.x,p.y);}
    if(p.kind==='gdate'&&Math.random()<0.03)sparkle(p.x,p.y+bob);}
  drawPlayer(g2);
  drawParts(g2);
  // birds
  for(const b of birds)g2.drawImage(SPR.bird[Math.floor(b.t*8)%2],b.x,b.y);
  // interact hint
  if(MODE==='play'&&pl.control&&!cine.on){
    const it=nearestInteract();
    if(it){const ix=it.x+it.w/2,iy=it.y-it.h-14-Math.sin(time*4)*2;
      rr(g2,ix-7,iy,14,11,'#3a2a22');rr(g2,ix-6,iy+1,12,9,'#fff6ea');
      g2.fillStyle='#3a2a22';g2.font='bold 8px monospace';g2.textAlign='center';
      g2.fillText('E',ix,iy+8);g2.textAlign='left';}}
  // active bubble
  if(activeBubble){const b=activeBubble;
    rr(g2,b.x-2,b.y-2,20,15,'#fff6ea');drawIcon(g2,b.icon,b.x+3,b.y+1);
    rr(g2,b.x+6,b.y+13,3,2,'#fff6ea');}
  g2.restore();
  // dusk tint
  if(dusk>0.01){g2.fillStyle='rgba(90,40,110,'+dusk*0.28+')';g2.fillRect(0,0,VW,VH);
    g2.fillStyle='rgba(255,150,70,'+dusk*0.1+')';g2.fillRect(0,0,VW,VH);}
  // warm glow
  g2.fillStyle='rgba(255,160,70,0.06)';g2.fillRect(0,0,VW,VH);
  g2.drawImage(SPR.vig,0,0);
}
function drawGDate(g2,x,y){
  rr(g2,x-2,y-3,5,7,C.gold);rr(g2,x-1,y-5,2,2,C.leaf);
  rr(g2,x-1,y-2,1,3,'#fff2c9');
  const tw=Math.floor(time*4)%4;
  g2.fillStyle='rgba(255,244,200,.9)';
  if(tw===0)g2.fillRect(x+4,y-4,1,1);if(tw===2)g2.fillRect(x-4,y+2,1,1);}
/* ---------- HUD / overlays ---------- */
function drawHUD(g2){
  // golden dates
  for(let i=0;i<8;i++){const x=8+i*13,y=8;
    rr(g2,x-1,y-1,11,13,'rgba(40,20,10,.45)');
    if(pl.golden[i])drawGDate(g2,x+4,y+6);
    else{rr(g2,x+3,y+3,3,6,'rgba(255,246,230,.14)');}}
  // keys
  let kx=8;
  if(ST.keyBrass){drawIcon(g2,'key',kx,26);kx+=14;}
  if(ST.keyGrove){rr(g2,kx,27,3,3,'#c0c8d0');rr(g2,kx+3,28,5,1,'#c0c8d0');rr(g2,kx+6,29,1,2,'#c0c8d0');kx+=14;}
  if(pl.dates>0){drawIcon(g2,'date',kx,24);
    g2.fillStyle='#fff6ea';g2.font='bold 8px monospace';g2.fillText('×'+pl.dates,kx+10,33);}
  // toasts
  let ty=44;
  g2.textAlign='center';
  for(const t of toasts){
    const a=clamp(t.t>0.4?1:t.t/0.4,0,1)*(clamp((t.max-t.t)/0.3,0,1));
    g2.globalAlpha=a;
    g2.font='13px sans-serif';g2.fillStyle='#3a2013';
    g2.fillText(t.ar,VW/2+1,ty+1);g2.fillStyle='#ffedc9';g2.fillText(t.ar,VW/2,ty);
    g2.font='8px monospace';g2.fillStyle='#ffd9a0';g2.fillText(t.en,VW/2,ty+12);
    ty+=30;g2.globalAlpha=1;}
  g2.textAlign='left';
  // letterbox
  if(cine.lb>0.01){const h=26*cine.lb;
    rr(g2,0,0,VW,h,'#160b06');rr(g2,0,VH-h,VW,h,'#160b06');}
  // end card
  if(endCard){g2.textAlign='center';
    g2.fillStyle='rgba(20,8,4,'+Math.min(0.55,endCard*0.2)+')';g2.fillRect(0,VH/2-46,VW,92);
    g2.font='26px sans-serif';g2.fillStyle='#ffedc9';g2.fillText('فطّومة والنخيل',VW/2,VH/2-12);
    g2.font='bold 12px monospace';g2.fillStyle='#f2c14e';g2.fillText('FATTOUMA & THE PALMS',VW/2,VH/2+6);
    g2.font='11px sans-serif';g2.fillStyle='#ffd9a0';g2.fillText('النهاية · The End',VW/2,VH/2+26);
    g2.textAlign='left';}
  // transition fade
  if(trans.a>0){g2.fillStyle='rgba(30,14,8,'+trans.a+')';g2.fillRect(0,0,VW,VH);}}
function drawTitle(g2){
  drawSky(g2);
  const p1=-(time*4)%480;
  g2.drawImage(SPR.mount,p1,86);g2.drawImage(SPR.mount,p1+480,86);
  g2.drawImage(SPR.palmline,-(time*8)%480,146);g2.drawImage(SPR.palmline,(-(time*8)%480)+480,146);
  rr(g2,0,208,VW,64,C.grass2);rr(g2,0,208,VW,3,C.grass1);
  rr(g2,0,240,VW,32,C.dirt1);
  drawPalm(g2,60,208,86,1.4,true,time);drawPalm(g2,404,208,74,1.2,false,time+2);
  drawPalm(g2,330,208,52,1,true,time+4);
  // shimmer channel
  rr(g2,120,232,240,14,C.water2);rr(g2,120,232,240,3,C.water1);
  for(let i=0;i<8;i++){const sx=120+((i*30+time*40)%240);rr(g2,sx,233,4,1,'#d8fff8');}
  g2.textAlign='center';
  g2.font='34px sans-serif';g2.fillStyle='#5b3520';g2.fillText('فطّومة والنخيل',VW/2+2,86+2);
  g2.fillStyle='#ffedc9';g2.fillText('فطّومة والنخيل',VW/2,86);
  g2.font='bold 16px monospace';g2.fillStyle='#f2c14e';g2.fillText('P A L M  C I T Y',VW/2,110);
  g2.font='10px sans-serif';g2.fillStyle='#ffe9c0';
  g2.fillText('مغامرة هادئة في قرية عمانية خضراء',VW/2,128);
  if(Math.floor(time*1.6)%2===0){g2.font='bold 10px monospace';g2.fillStyle='#fff6ea';
    g2.fillText('PRESS ENTER · اضغط للبدء',VW/2,178);}
  g2.font='8px monospace';g2.fillStyle='rgba(255,246,230,.6)';
  g2.fillText('←→ move · Z jump · X dash · E interact · M sound',VW/2,258);
  g2.textAlign='left';}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let MODE='title',time=0,last=0;
bakeTiles();bakeBG();bakeNPCs();bakeProps();bakeHero();
function frame(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  update(dt);
  if(MODE==='title')drawTitle(g);
  else{drawWorld(g);drawHUD(g);}
  for(const k in pressed)pressed[k]=false;
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
