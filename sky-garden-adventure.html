try{

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const C=h=>new THREE.Color(h);
const dummy=new THREE.Object3D();
const isTouch=matchMedia('(pointer:coarse)').matches;
const _v1=V3(), _v2=V3();

const U={
  uTime:{value:0},uWindAmp:{value:1},uPR:{value:1},
  uSunDir:{value:V3(0,1,0)},uSunCol:{value:C(0xffffff)},
  uFogColor:{value:C(0xc98a5e)},uFogD:{value:0.0016}
};

function mergeGeos(geos){
  if(geos.length===1) return geos[0].clone();
  const names=Object.keys(geos[0].attributes);
  let totalV=0,totalI=0;
  for(const g of geos){ totalV+=g.attributes.position.count;
    totalI+=g.index?g.index.count:g.attributes.position.count; }
  const arrays={};
  for(const nm of names){ const itemSize=geos[0].attributes[nm].itemSize;
    arrays[nm]={itemSize,arr:new Float32Array(totalV*itemSize)}; }
  const idx=new Uint32Array(totalI);
  let vo=0,io=0;
  for(const g of geos){
    const cnt=g.attributes.position.count;
    for(const nm of names){
      const src=g.attributes[nm], {itemSize,arr}=arrays[nm];
      if(src) arr.set(src.array,vo*itemSize);
      else if(nm==='color') for(let i=0;i<cnt*itemSize;i++) arr[vo*itemSize+i]=1;
    }
    if(g.index){ const gi=g.index.array; for(let i=0;i<gi.length;i++) idx[io+i]=gi[i]+vo; io+=gi.length; }
    else { for(let i=0;i<cnt;i++) idx[io+i]=vo+i; io+=cnt; }
    vo+=cnt;
  }
  const out=new THREE.BufferGeometry();
  for(const nm of names) out.setAttribute(nm,new THREE.BufferAttribute(arrays[nm].arr,arrays[nm].itemSize));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

/* ================= ÂM THANH THUẬT TOÁN ================= */
const AudioCore=(()=>{
  let ctx=null,master=null,verb=null;
  function makeIR(){
    const rate=ctx.sampleRate,len=Math.floor(rate*3.4);
    const ir=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); let lp=0;
      for(let i=0;i<len;i++){ const n=(Math.random()*2-1)*Math.pow(1-i/len,2.7);
        lp+=(n-lp)*0.28; d[i]=lp*1.6; } }
    return ir;
  }
  function init(){
    if(ctx) return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.9;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=3.5;
    comp.attack.value=0.02; comp.release.value=0.4;
    master.connect(comp); comp.connect(ctx.destination);
    verb=ctx.createConvolver(); verb.buffer=makeIR();
    const vo=ctx.createGain(); vo.gain.value=0.8;
    verb.connect(vo); vo.connect(master);
  }
  return { init,
    get ctx(){return ctx;}, get master(){return master;}, get verb(){return verb;},
    resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); } };
})();

/* ---------- NHẠC ---------- */
const Music=(()=>{
  let musicGain=null,padBus,leadBus,bassBus,kickBus,delay,delayOut;
  let playing=false,timer=null,nextTime=0,step=0;
  let chordIdx=0,lastLead=76,leadHold=0,intensity=0;
  const bpm=62, d16=()=>60/bpm/4, n2f=n=>440*Math.pow(2,(n-69)/12);
  const CHORDS=[
    {pad:[45,52,59,60],bass:33},{pad:[41,48,52,57],bass:29},
    {pad:[48,55,59,64],bass:36},{pad:[43,50,52,59],bass:31},
  ];
  const SCALE=[69,72,74,76,79,81,84];
  function build(){
    const ctx=AudioCore.ctx;
    musicGain=ctx.createGain(); musicGain.gain.value=0; musicGain.connect(AudioCore.master);
    const bus=(lvl,send)=>{ const g=ctx.createGain(); g.gain.value=lvl; g.connect(musicGain);
      const s=ctx.createGain(); s.gain.value=send; g.connect(s); s.connect(AudioCore.verb); return g; };
    padBus=bus(0.5,0.42); leadBus=bus(0.5,0.5); bassBus=bus(0.6,0.08); kickBus=bus(0.85,0.16);
    delay=ctx.createDelay(2); delay.delayTime.value=(60/bpm)*0.75;
    const fb=ctx.createGain(); fb.gain.value=0.42; delay.connect(fb); fb.connect(delay);
    delayOut=ctx.createGain(); delayOut.gain.value=0.4;
    delay.connect(delayOut); delayOut.connect(musicGain); delay.connect(AudioCore.verb);
  }
  function padNote(freq,t,dur,vi){
    const ctx=AudioCore.ctx;
    const g=ctx.createGain();
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value=0.6;
    f.frequency.setValueAtTime(300,t);
    f.frequency.linearRampToValueAtTime(1150,t+dur*0.45);
    f.frequency.linearRampToValueAtTime(430,t+dur);
    f.connect(g); let tail=g;
    if(ctx.createStereoPanner){ const p=ctx.createStereoPanner();
      p.pan.value=[-0.45,0.45,-0.2,0.25][vi%4]; g.connect(p); tail=p; }
    tail.connect(padBus);
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();
    o1.type='sawtooth'; o2.type='sawtooth';
    o1.frequency.value=freq; o2.frequency.value=freq*1.006;
    o1.connect(f); o2.connect(f);
    const v=0.05;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+2.4);
    g.gain.setValueAtTime(v,t+dur-3.0);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.1); o2.stop(t+dur+0.1);
  }
  function bassNote(freq,t,dur,vel){
    const ctx=AudioCore.ctx;
    const g=ctx.createGain();
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=280;
    f.connect(g); g.connect(bassBus);
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();
    o1.type='sine'; o1.frequency.value=freq*0.5;
    o2.type='triangle'; o2.frequency.value=freq;
    const g2=ctx.createGain(); g2.gain.value=0.5;
    o1.connect(g); o2.connect(g2); g2.connect(f);
    const v=0.3*vel;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+0.03);
    g.gain.setTargetAtTime(v*0.65,t+0.06,0.25);
    g.gain.setTargetAtTime(0.0001,t+Math.max(dur-0.25,t+0.1),0.12);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.6); o2.stop(t+dur+0.6);
  }
  function kick(t,vel){
    const ctx=AudioCore.ctx;
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(130,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.11);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5*vel,t+0.009);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    o.connect(g); g.connect(kickBus);
    o.start(t); o.stop(t+0.55);
  }
  function leadNote(freq,t,dur,vel){
    const ctx=AudioCore.ctx;
    const g=ctx.createGain();
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2800; f.Q.value=0.4;
    f.connect(g); g.connect(leadBus);
    const send=ctx.createGain(); send.gain.value=0.55; g.connect(send); send.connect(delay);
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=freq; o.connect(f);
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.002;
    const g2=ctx.createGain(); g2.gain.value=0.16; o2.connect(g2); g2.connect(f);
    const lfo=ctx.createOscillator(); lfo.frequency.value=4.8;
    const lg=ctx.createGain(); lg.gain.value=3.2; lfo.connect(lg); lg.connect(o.frequency);
    const v=0.15*vel;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+0.05);
    g.gain.setTargetAtTime(v*0.55,t+0.1,0.3);
    g.gain.setTargetAtTime(0.0001,t+Math.max(dur-0.35,t+0.1),0.18);
    o.start(t); o2.start(t); lfo.start(t+0.3);
    o.stop(t+dur+1); o2.stop(t+dur+1); lfo.stop(t+dur+1);
  }
  function scheduleStep(s,t){
    const d=d16(), local=s%32;
    if(local===0){
      chordIdx=Math.floor(s/32)%CHORDS.length;
      const ch=CHORDS[chordIdx], dur=32*d+2.2;
      ch.pad.forEach((m,i)=>padNote(n2f(m),t+i*0.07,dur,i));
    }
    const ch=CHORDS[chordIdx];
    const bp={0:[0,10,1],8:[0,4,0.7],14:[7,3,0.5],24:[0,4,0.65],28:[7,3,0.45]};
    if(bp[local]){ const [semi,durS,vel]=bp[local];
      bassNote(n2f(ch.bass+semi),t+(Math.random()-0.5)*0.012,durS*d,vel); }
    const k=local%16;
    if(k===0) kick(t,0.95);
    else if(k===8) kick(t,0.55);
    else if(local===30&&Math.random()<0.35) kick(t,0.22);
    if(leadHold>0) leadHold--;
    else if(local%2===0){
      const p=0.26+intensity*0.22+(local%16===0?0.1:0);
      if(Math.random()<p){
        let idx=SCALE.indexOf(lastLead); if(idx<0) idx=3;
        idx=clamp(idx+Math.floor(Math.random()*5)-2,0,SCALE.length-1);
        if(Math.random()<0.15) idx=clamp(idx+(Math.random()<0.5?-2:2),0,SCALE.length-1);
        const midi=SCALE[idx]; lastLead=midi;
        const durs=[2,2,3,4,4,6,8];
        const d8=durs[Math.floor(Math.random()*durs.length)];
        leadNote(n2f(midi),t+(Math.random()-0.5)*0.016,d8*2*d*0.92,0.5+Math.random()*0.5);
        leadHold=d8*2-1;
      }
    }
  }
  function scheduler(){
    const ctx=AudioCore.ctx;
    const ahead=ctx.currentTime+(document.hidden?1.2:0.3);
    while(nextTime<ahead){ scheduleStep(step,nextTime); nextTime+=d16(); step++; }
  }
  return {
    start(){
      AudioCore.init(); AudioCore.resume();
      if(!musicGain) build();
      if(playing) return;
      playing=true; step=0; leadHold=0;
      nextTime=AudioCore.ctx.currentTime+0.12;
      const now=AudioCore.ctx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(musicGain.gain.value,now);
      musicGain.gain.linearRampToValueAtTime(0.75,now+3.5);
      timer=setInterval(scheduler,90);
    },
    stop(){
      if(!playing) return; playing=false;
      clearInterval(timer);
      const now=AudioCore.ctx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(musicGain.gain.value,now);
      musicGain.gain.linearRampToValueAtTime(0.0001,now+1.4);
    },
    get playing(){return playing;},
    setIntensity(v){intensity=v;}
  };
})();

/* ---------- SFX ---------- */
const SFX=(()=>{
  let started=false,sfxGain,noiseBuf;
  let windGain,windFilt,waterGain;
  let rustleTimer=1.5,dripTimer=1;
  function makeNoise(){
    const ctx=AudioCore.ctx, len=ctx.sampleRate*2;
    const b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function nsrc(){ const s=AudioCore.ctx.createBufferSource(); s.buffer=noiseBuf; return s; }
  function out(g,verbAmt){
    g.connect(sfxGain);
    if(verbAmt){ const sv=AudioCore.ctx.createGain(); sv.gain.value=verbAmt; g.connect(sv); sv.connect(AudioCore.verb); }
  }
  function nb(t,o){
    const ctx=AudioCore.ctx;
    const s=nsrc(); s.playbackRate.value=o.rate||1; s.loop=true;
    const f=ctx.createBiquadFilter();
    if(o.bp){ f.type='bandpass'; f.frequency.value=o.bp; f.Q.value=o.q||1; }
    else { f.type='lowpass'; f.frequency.value=o.lp||2000; }
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(o.a,t+(o.atk||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.atk||0.004)+(o.d||0.08));
    s.connect(f); f.connect(g); out(g,o.verb||0.25);
    s.start(t); s.stop(t+(o.atk||0.004)+(o.d||0.08)+0.05);
  }
  function tone(t,o){
    const ctx=AudioCore.ctx;
    const osc=ctx.createOscillator(); osc.type=o.type||'sine';

    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.d||0.1));

    ws.connect(wf); wf.connect(wlp); wlp.connect(waterGain); out(waterGain,0.45);

    f.frequency.value=2300+Math.random()*1900; f.Q.value=0.7;
    const g=ctx.createGain(); const pk=(0.028+Math.random()*0.04)*(0.6+amp*0.5);

    g.gain.linearRampToValueAtTime(pk,t+dur*0.4);

    if(!started) return;
    windGain.gain.value=0.03+0.045*windAmp;

function windify(mat,opt={}){
  const amp=opt.amp||0.14, freq=opt.freq||1.3, powH=opt.powH||1.4, pin=opt.pin||0;
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uWindAmp=U.uWindAmp;
    sh.vertexShader='uniform float uTime;uniform float uWindAmp;\n'+sh.vertexShader.replace(
      '#include <begin_vertex>',`#include <begin_vertex>
      { vec3 wP=(modelMatrix*vec4(position,1.0)).xyz;
        float hF=pow(max(transformed.y-${pin.toFixed(2)},0.0)*0.4,${powH.toFixed(2)});
        float ph=wP.x*0.33+wP.z*0.27;
        transformed.x+=(sin(uTime*${freq.toFixed(2)}+ph)+0.5*sin(uTime*${(freq*2.3).toFixed(2)}+ph*1.7))*hF*${amp.toFixed(3)}*uWindAmp;
        transformed.z+=cos(uTime*${(freq*0.9).toFixed(2)}+ph*1.3)*hF*${(amp*0.6).toFixed(3)}*uWindAmp; }`);
  };
}

function bakeAO(geo,fn){
  const pos=geo.attributes.position, n=pos.count, col=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const g=fn(pos.getX(i),pos.getY(i),pos.getZ(i));
    col[i*3]=col[i*3+1]=col[i*3+2]=g;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3)); return geo;
}
const T=(g,x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1)=>{
  const m=new THREE.Matrix4().compose(V3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),V3(s,s,s));
  g.applyMatrix4(m); return g;
};

function islandGeo(topR,botR,h,seg){
  const g=new THREE.CylinderGeometry(topR,botR,h,seg,4); g.translate(0,-h/2,0);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const t=clamp(-y/h,0,1), a=Math.atan2(z,x), r=Math.hypot(x,z);
    if(r>0.01){
      const n=(hashN(a*3.1,t*7.0)*2-1)*(1.2+t*3.4)+(hashN(a*9.7,t*3.3,4)*2-1)*0.7;
      const nr=r+n, j=1+t*t*0.5;
      pos.setX(i,Math.cos(a)*nr*j); pos.setZ(i,Math.sin(a)*nr*j);
      pos.setY(i,y-(t>0.75?hashN(a*5.0,t*9.0,9)*3.2*t:0));
    }
  }
  g.computeVertexNormals();
  return bakeAO(g,(x,y,z)=>clamp(0.62+(-y/h)*0.18+hashN(x*0.3,z*0.3,2)*0.22,0.5,1));
}

const waterMat=new THREE.ShaderMaterial({
  transparent:true,
  uniforms:{
    uTime:U.uTime,uSunDir:U.uSunDir,uSunCol:U.uSunCol,
    uFogColor:U.uFogColor,uFogD:U.uFogD,
    uZenith:skyUni.uZenith,uHorizon:skyUni.uHorizon,
    uDeep:{value:C(0x16333c)},uRipple:{value:1},uTeal:{value:0}
  },
  vertexShader:`varying vec3 vW;
    void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`
    uniform float uTime,uRipple,uTeal;
    uniform vec3 uSunDir,uSunCol,uFogColor,uZenith,uHorizon,uDeep;
    uniform float uFogD;
    varying vec3 vW;
    float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
    float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
    float fbm(vec2 p){ float v=0.0,a=0.5; mat2 r=mat2(1.6,1.2,-1.2,1.6);
      for(int i=0;i<4;i++){ v+=a*vnoise(p); p=r*p; a*=0.5; } return v; }
    void main(){
      vec2 p=vW.xz;
      float n1=fbm(p*0.5+vec2(uTime*0.32,uTime*0.21));
      float n2=fbm(p*1.4-vec2(uTime*0.47,uTime*0.3)+n1*1.6);
      float n3=fbm(p*1.4+vec2(7.3,2.1)-vec2(uTime*0.4,0.0)+n1*1.6);
      vec3 n=normalize(vec3((n2-0.5)*9.0*uRipple,1.0,(n3-0.5)*9.0*uRipple));
      vec3 viewDir=normalize(cameraPosition-vW);
      float fres=pow(1.0-max(dot(viewDir,n),0.0),3.0);
      vec3 refl=reflect(-viewDir,n);
      float skyH=clamp(refl.y*0.5+0.5,0.0,1.0);
      vec3 skyCol=mix(uHorizon,uZenith,pow(skyH,0.7));
      float sd=max(dot(refl,uSunDir),0.0);
      skyCol+=uSunCol*pow(sd,450.0)*2.2;
      vec3 deep=mix(uDeep,vec3(0.05,0.22,0.2),uTeal*0.6);
      vec3 col=mix(deep,skyCol,clamp(0.15+fres*1.1,0.0,1.0));
      col+=uSunCol*pow(max(dot(refl,uSunDir),0.0),220.0)*1.4;
      float fd=length(cameraPosition-vW);
      col=mix(col,uFogColor,1.0-exp(-uFogD*uFogD*fd*fd));
      gl_FragColor=vec4(col,1.0);
    }`
});

function makeDust(n){
  const pos=new Float32Array(n*3), seed=new Float32Array(n);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()-0.5)*90;
    pos[i*3+1]=0.5+Math.random()*16;
    pos[i*3+2]=-45+Math.random()*150;
    seed[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{ uTime:U.uTime,uPR:U.uPR,uSunDir:U.uSunDir,
      uIntensity:{value:0.55}, uColor:{value:C(0xffe2b0)} },
    vertexShader:`attribute float aSeed; uniform float uTime,uPR,uIntensity; uniform vec3 uSunDir;
      varying float vA;
      void main(){
        vec3 p=position; float s=aSeed*6.2831;
        p.x+=sin(uTime*0.25+s*3.1)*2.2;
        p.y+=sin(uTime*0.18+s*5.7)*1.4;
        p.z+=cos(uTime*0.21+s*4.3)*2.2;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        float tw=0.5+0.5*sin(uTime*(0.6+aSeed)+s*9.0);
        float fwd=pow(max(dot(normalize(cameraPosition-p),uSunDir),0.0),5.0);
        vA=(0.25+0.75*tw)*(0.3+0.7*fwd)*uIntensity;
        gl_PointSize=(1.0+aSeed*1.8)*uPR*(80.0/max(-mv.z,1.0));
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`uniform vec3 uColor; varying float vA;
      void main(){ float d=length(gl_PointCoord-0.5);
        float a=smoothstep(0.5,0.08,d)*vA*0.5;
        gl_FragColor=vec4(uColor*a,a); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; scene.add(pts);
  return pts;
}

function groundAt(x,z){
  if(Math.abs(x)<2.3&&z>27&&z<97){
    let y=1.0;
    if(z<31) y=(z-27)/4; else if(z>93) y=(97-z)/4;
    return {y,s:'wood'};
  }
  if(z>18.4&&z<21.6&&x>-59&&x<-26){
    let y=0.95;
    if(x>-29.5) y=0.95*clamp((-27.5-x)/2,0,1);
    else if(x<-56) y=0.95*clamp((-56-x)/2,0,1);
    return {y,s:'wood'};
  }
  if(z>28.4&&z<31.6&&x>15&&x<56){
    let y=0.9;
    if(x<18.5) y=0.9*clamp((x-16)/2.5,0,1);
    else if(x>52.5) y=0.9*clamp((55-x)/2.5,0,1);
    return {y,s:'wood'};
  }
  if(Math.hypot(x,z-108)<12) return {y:0,s:'grass'};
  if(Math.hypot(x+70,z-20)<12.2){
    if(Math.hypot(x+70,z-20)<1.5) return null;
    return {y:0,s:'grass'};
  }
  if(Math.hypot(x-68,z-30)<12.6) return {y:0,s:'grass'};
  if(Math.hypot(x,z-10)<7.4) return null;
  if(Math.hypot(x,z)<33.4) return {y:0,s:'grass'};
  return null;
}
function tryMove(dx,dz){
  const p=player.position;
  const nx=p.x+dx,nz=p.z+dz;
  if(groundAt(nx,nz)!==null){ p.x=nx; p.z=nz; return; }
  if(groundAt(nx,p.z)!==null){ p.x=nx; return; }
  if(groundAt(p.x,nz)!==null){ p.z=nz; }
}

function updatePlayer(dt){
  let mx=joy.x, mz=joy.y;
  if(keys.KeyW||keys.ArrowUp) mz=1;
  if(keys.KeyS||keys.ArrowDown) mz=-1;
  if(keys.KeyA||keys.ArrowLeft) mx=-1;
  if(keys.KeyD||keys.ArrowRight) mx=1;
  const len=Math.hypot(mx,mz); if(len>1){ mx/=len; mz/=len; }
  const moving=len>0.05&&(camState==='FOLLOW');
  if(moving){
    const sy=Math.sin(rig.yaw), cy=Math.cos(rig.yaw);
    const fx=-sy, fz=-cy, rx=cy, rz=-sy;
    const sp=4.3*dt;
    const px=player.position.x, pz=player.position.z;
    tryMove((fx*mz+rx*mx)*sp,(fz*mz+rz*mx)*sp);
    const moved=Math.hypot(player.position.x-px,player.position.z-pz);
    stepAcc+=moved;
    if(stepAcc>0.62){ stepAcc=0; const g=groundAt(player.position.x,player.position.z); curSurface=g?g.s:'grass';
      SFX.step(curSurface,0.75+len*0.3); }
    const targetRot=Math.atan2(fx*mz+rx*mx,fz*mz+rz*mx);
    let d=targetRot-player.rotation.y;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.rotation.y+=d*Math.min(1,dt*10);
    walkPhase+=dt*9;
    leanZ=damp(leanZ,clamp(-d*2.5,-0.3,0.3),8,dt);
    leanX=damp(leanX,0.12,8,dt);
  } else { leanZ=damp(leanZ,0,6,dt); leanX=damp(leanX,0,6,dt); }
  const p=player.position;
  const g=groundAt(p.x,p.z); if(g!==null) p.y=damp(p.y,g.y,14,dt);
  player.position.y=p.y+Math.abs(Math.sin(walkPhase))*0.05*(moving?1:0)+Math.sin(U.uTime.value*1.6)*0.012;
  player.rotation.x=leanX; player.rotation.z=leanZ;
  staffSwing=damp(staffSwing,moving?Math.sin(walkPhase)*0.08:Math.sin(U.uTime.value*1.3)*0.02,6,dt);
  player.userData.lantern.rotation.x=staffSwing;
  lanternLight.position.copy(p).add(V3(0.3,1.9,0.1).applyAxisAngle(V3(0,1,0),player.rotation.y));
}

function updateCamera(dt,t){
  const headT=player.position.clone().add(V3(0,1.9,0));
  if(camState==='INTRO'){
    introT+=dt;
    const u=easeIO(clamp(introT/16,0,1));
    introPos.getPoint(u,camPos); introLook.getPoint(u,camLook);
    camera.position.copy(camPos); camera.lookAt(camLook);
    rig.fov=rig.fovT=lerp(46,55,u);

  }
  else if(camState==='CINE'){

    else{

      rig.fov=damp(rig.fov,cineCfg.fov,3,dt);
      const u=sstep(0,1,clamp(cineT/2.2,0,1));
      const ang=rig.yaw+u*cineCfg.sweep;
      const rad=lerp(clamp(rig.dist,6,14),cineCfg.radius,u);
      const hgt=lerp(player.position.y+3.4,cineCfg.baseH,u)+Math.sin(cineT*0.5)*0.25;
      _v1.set(Math.sin(ang)*rad,hgt,Math.cos(ang)*rad).add(cineCfg.target);
      camPos.lerp(_v1,1-Math.exp(-3.2*dt));
      camera.position.copy(camPos);
      _v2.copy(cineCfg.target).add(V3(0,Math.sin(cineT*0.7)*0.3,0));
      camLook.lerp(_v2,1-Math.exp(-4*dt));
      camera.lookAt(camLook);
      if(cineT>cineCfg.dur){ camState='BLEND'; blendT=0; syncRigFromCamera(); document.body.classList.remove('cine'); rig.fovT=55; }
    }
  }
  else if(camState==='BLEND'){
    blendT+=dt;
    rig.fov=damp(rig.fov,rig.fovT,4,dt);
    rig.yaw=damp(rig.yaw,rig.yawT,6,dt); rig.pitch=damp(rig.pitch,rig.pitchT,6,dt); rig.dist=damp(rig.dist,rig.distT,6,dt);
    _v1.set(Math.sin(rig.yaw)*Math.cos(rig.pitch),Math.sin(rig.pitch),Math.cos(rig.yaw)*Math.cos(rig.pitch)).multiplyScalar(rig.dist).add(headT);
    camPos.lerp(_v1,1-Math.exp(-4.5*dt));
    camera.position.copy(camPos);
    camLook.lerp(headT,1-Math.exp(-4.5*dt));
    camera.lookAt(camLook);
    if(blendT>2.2) camState='FOLLOW';
  }
  else{
    const idle=(performance.now()-lastInput)>12000;
    if(idle) rig.yawT+=dt*0.055;
    rig.yaw=damp(rig.yaw,rig.yawT,9,dt);
    rig.pitch=damp(rig.pitch,rig.pitchT,9,dt);
    rig.dist=damp(rig.dist,rig.distT,7,dt);
    rig.fov=damp(rig.fov,rig.fovT+Math.sin(t*0.23)*0.5,4,dt);
    _v1.set(Math.sin(rig.yaw)*Math.cos(rig.pitch),Math.sin(rig.pitch),Math.cos(rig.yaw)*Math.cos(rig.pitch)).multiplyScalar(rig.dist).add(headT);
    _v1.x+=Math.sin(t*0.9)*0.05+Math.sin(t*1.7)*0.02;
    _v1.y+=Math.sin(t*1.3+1.7)*0.04;
    const g=groundAt(_v1.x,_v1.z);
    if(g!==null&&_v1.y<g.y+0.7) _v1.y=g.y+0.7;
    if(_v1.y<-40) _v1.y=-40;
    camera.position.copy(_v1);
    camLook.lerp(headT,1-Math.exp(-12*dt));
    camera.lookAt(camLook);
    const px=player.position.x, pz=player.position.z;
    beats.forEach(b=>{ if(pz<b.z&&!fired.has(b.z)){ fired.add(b.z); showCaption(b.t); rig.fovT=52; setTimeout(()=>rig.fovT=55,2600);} });
    if(!bellArea&&Math.hypot(px+70,pz-20)<11){ bellArea=true; SFX.chime(1046,0.5); showCaption('— بستان اليراعات — The Firefly Grove —',3000); }
    if(!gardenArea&&Math.hypot(px-68,pz-30)<12){ gardenArea=true; SFX.chime(1174,0.5); showCaption('— حديقة الفوانيس — The Lantern Garden —',3000); }
    if(pz<-13&&Math.abs(px)<7) startCutscene('temple');
    else if(!bellRung&&Math.hypot(px+70,pz-20)<7.5) startCutscene('bell');
    else if(!gardenLit&&Math.hypot(px-68,pz-30)<8.5) startCutscene('garden');
  }
  if(Math.abs(camera.fov-rig.fov)>0.02){ camera.fov=rig.fov; camera.updateProjectionMatrix(); }
}

function updateWorld(dt,t){
  heart.rotation.y+=dt*0.35;
  heart.position.y=5.15+Math.sin(t*0.7)*0.22;
  heartInner.rotation.y-=dt*0.9;
  shardData.forEach((s,i)=>{
    const a=t*s.sp+s.ph;
    dummy.position.set(heart.position.x+Math.cos(a)*s.r, heart.position.y+Math.sin(a*1.3+s.tilt)*0.9, heart.position.z+Math.sin(a)*s.r);
    dummy.rotation.set(a,a*1.4,s.tilt); dummy.scale.setScalar(0.8+0.3*Math.sin(a*2));
    dummy.updateMatrix(); shards.setMatrixAt(i,dummy.matrix);
  });
  shards.instanceMatrix.needsUpdate=true;
  floatSlabs.forEach(m=>{
    const sp=m.userData.slow?0.25:0.6;
    m.position.y=m.userData.y0+Math.sin(t*sp+m.userData.ph)*(m.userData.slow?0.4:0.07);
    m.rotation.y+=dt*(m.userData.slow?0.02:0.01);
  });
  bellSwing=Math.max(0,bellSwing-dt*0.12);
  bellPivot.rotation.y+=dt*0.12;
  groveLanterns.forEach((orb,i)=>{
    orb.position.y+=Math.sin(t*1.3+i)*0.0018;
    orb.material.emissiveIntensity=1.1+Math.sin(t*3+i*2)*0.5+bellSwing*1.4;
  });
  bellFlash=Math.max(0,bellFlash-dt*0.5);
  bellLight.intensity=bellFlash*(5+duskVal*9)+(bellRung?0.4+duskVal*1.2:0);
  let litSum=0;
  gardenLanterns.forEach(l=>{
    const tgt=l.on?(2.0+duskVal*2.6):0.06;
    l.mat.emissiveIntensity=damp(l.mat.emissiveIntensity,tgt,3,dt);
    litSum+=l.on?1:0;
  });
  gardenLight.intensity=damp(gardenLight.intensity,(litSum/5)*(1.6+duskVal*9),2,dt);
  birdScatter=Math.max(0,birdScatter-dt*0.18);
  const bc=V3(0,13,-16);
  for(let i=0;i<BIRD_N;i++){
    const b=birdPaths[i];
    const r=b.r*(1+birdScatter*1.9);
    const a=t*b.sp*(1+birdScatter*3.5)+b.ph;
    _v1.set(bc.x+Math.cos(a)*r, bc.y+b.h*0.3+Math.sin(t*0.7+b.ph)*1.6+birdScatter*9+Math.sin(a*2)*0.8, bc.z+Math.sin(a)*r*b.ell);
    _v2.set(-Math.sin(a)*r*Math.sign(b.sp),0,Math.cos(a)*r*b.ell*Math.sign(b.sp)).normalize();
    dummy.position.copy(_v1);
    dummy.lookAt(_v1.clone().add(_v2));
    dummy.rotateZ(-Math.sign(b.sp)*0.35);
    dummy.updateMatrix(); birds.setMatrixAt(i,dummy.matrix);
  }
  birds.instanceMatrix.needsUpdate=true;
  featherData.forEach((f,i)=>{
    let y=f.y0-((t*f.fall)%(f.y0+2));
    if(y<0.1) y+=f.y0+2;
    const sx=f.x+Math.sin(t*f.swaySp+f.ph)*f.swayA;
    const sz=f.z+Math.cos(t*f.swaySp*0.8+f.ph)*f.swayA*0.7;
    dummy.position.set(sx,y,sz);
    dummy.rotation.set(t*f.spinA+f.ph,t*f.spinB,Math.sin(t*f.swaySp+f.ph)*0.5+0.3);
    dummy.updateMatrix(); feathers.setMatrixAt(i,dummy.matrix);
  });
  feathers.instanceMatrix.needsUpdate=true;
  cloudSprites.forEach(s=>{ s.position.x+=s.userData.sp*dt*0.6; if(s.position.x>460) s.position.x=-460; });
  if(ringT>=0){
    ringT+=dt;
    const k=ringT/2.6;
    if(k<1){ ring.scale.setScalar(1+k*24); ring.material.opacity=(1-k)*0.85; }
    else { ring.material.opacity=0; }
  }
  flare=Math.max(0,flare-dt*0.45);
  U.uWindAmp.value=damp(U.uWindAmp.value,1+Math.sin(t*0.3)*0.25,1.5,dt);
}

function qualityCheck(dt){
  frames++; acc+=dt;
  if(frames===120&&!qualChecked){
    qualChecked=true;
    if(acc/120>0.026&&pr>1){ pr=Math.max(1,pr-0.25); applySize(); }
    frames=0; acc=0;
  } else if(frames>=240){
    if(acc/240>0.028&&pr>0.85){ pr=Math.max(0.85,pr-0.25); applySize(); }
    frames=0; acc=0;
  }
}

let started=false;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  U.uTime.value=t;
  if(!started){
    started=true;
    window.__templeReady=true;
    clearTimeout(window.__templeTimer);
    const sp=document.getElementById('spinner'); if(sp&&sp.parentNode) sp.parentNode.removeChild(sp);
    document.body.classList.add('cine');
    skipBtn.classList.add('show');
    musicBtn.classList.add('show');
    gradeU.uFade.value=0;
  }
  gradeU.uFade.value=damp(gradeU.uFade.value,1,1.6,dt);
  updateAtmosphere(dt);
  updatePlayer(dt);
  updateCamera(dt,t);
  updateWorld(dt,t);
  SFX.update(dt,player.position,U.uWindAmp.value);
  qualityCheck(dt);
  composer.render();
}
animate();

}catch(e){
  fatal('خطأ في بدء اللعبة · Startup error: '+(e&&e.message?e.message:e));
  console.error(e);
}
</script>
