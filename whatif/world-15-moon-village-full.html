<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرية القمر العملاق — بكامل التفاصيل — مشهد تفاعلي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-700.css">
<style>
  :root{ --ink:#0d0d10; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ background:#000; font-family:'Cairo',sans-serif; }
  #stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #scene{ height:100vh; max-width:100vw; display:block; box-shadow:0 0 90px rgba(0,0,0,.9); }

  header{ position:fixed; top:14px; right:14px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header h1{ font-size:15px; font-weight:700; color:#f4efe4; background:rgba(13,13,16,.85); border:2px solid #f4efe4; border-radius:30px; padding:6px 16px; }
  header button{ font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:#f4efe4; background:rgba(13,13,16,.85); border:2px solid #f4efe4; border-radius:30px; padding:6px 14px; cursor:pointer; transition:transform .2s, background .3s; }
  header button:hover{ transform:translateY(-3px); background:#22222a; }
  header button:active{ transform:scale(.94); }

  #hint{ position:fixed; bottom:12px; right:50%; transform:translateX(50%); z-index:6; background:rgba(244,239,228,.92); color:#131313; font-size:12.5px; padding:8px 20px; border-radius:30px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #tip{ position:fixed; z-index:9; pointer-events:none; background:#f4efe4; color:#131313; font-size:13px; font-weight:700; padding:4px 14px; border-radius:20px; opacity:0; transition:opacity .2s; transform:translate(-50%,-150%); }

  .skyrect{ fill:#0d0d10; transition:fill 1.2s ease; }
  #scene.day .skyrect{ fill:#efe7d6; }
  .skyart{ transition:opacity 1.2s ease; }
  #scene.day .skyart{ opacity:0; }
  .star{ animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.15; } to{ opacity:1; } }
  #moonG,#cresG{ cursor:pointer; transform-box:fill-box; transform-origin:center; }
  .flag{ transform-box:fill-box; transform-origin:0% 50%; animation:flap 1.4s ease-in-out infinite alternate; }
  @keyframes flap{ from{ transform:skewY(-8deg); } to{ transform:skewY(8deg); } }

  .layer{ will-change:transform; }
  #scene.day .towers{ filter:brightness(1.1); }
  .towers{ transition:filter 1s; }
  .tower{ transform-box:fill-box; transition:transform .6s cubic-bezier(.2,.8,.2,1), filter .4s; cursor:pointer; }
  .tower:hover{ transform:translateY(-8px); filter:brightness(1.12); }

  .win{ cursor:pointer; }
  .win .main{ transition:fill .3s; }
  .win .halo{ fill:#ffcf6e; opacity:0; transition:opacity .4s; pointer-events:none; }
  .win.lit .main{ fill:#e8a53f !important; }
  .win.lit .halo{ opacity:.6; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 960 1440" preserveAspectRatio="xMidYMid meet" aria-label="لوحة قرية القمر بكامل التفاصيل">
    <defs>
      <filter id="blurG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 0.05 0"/></filter>
    </defs>
    <rect class="skyrect" x="0" y="0" width="960" height="1440"></rect>
    <g id="skyArt" class="skyart">
      <g id="starsG"></g>
      <g id="cloudsG"></g>
      <g id="moonG">
        <circle cx="480" cy="340" r="260" fill="#f2ecdc" filter="url(#glowF)"/>
        <circle cx="430" cy="300" r="16" fill="#ddd6c6" opacity=".5"/>
        <circle cx="540" cy="400" r="11" fill="#ddd6c6" opacity=".5"/>
      </g>
      <g id="cresG">
        <path d="M 790 65 A 46 46 0 1 0 790 157 A 58 58 0 1 1 790 65 Z" fill="#f2ecdc" filter="url(#glowF)"/>
      </g>
    </g>
    <g id="layerBack" class="layer towers" data-depth="6"></g>
    <g id="layerFront" class="layer towers" data-depth="13"></g>
    <rect x="0" y="0" width="960" height="1440" filter="url(#paper)" opacity=".5" pointer-events="none"></rect>
    <g id="fxG" pointer-events="none"></g>
  </svg>

  <header>
    <h1>🌕 قرية القمر العملاق</h1>
    <button id="dayBtn">☀️ وضع النهار</button>
    <button id="shootBtn">🌠 شهب</button>
    <button id="lightBtn">💡 إضاءة الكل</button>
    <button id="resetBtn">🔄 إعادة</button>
  </header>
  <div id="hint">مرّر المؤشر لتحريك الطبقات • انقر النوافذ لتضيئها • انقر القمرَين • انقر السماء للنجوم والشهب</div>
  <div id="tip"></div>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg', INK='#0d0d10';
  var seed=151;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function rr(a,b){ return a+rnd()*(b-a); }
  function el(t,a,p){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }

  var svg=document.getElementById('scene');
  var starsG=document.getElementById('starsG'), cloudsG=document.getElementById('cloudsG');
  var layerBack=document.getElementById('layerBack'), layerFront=document.getElementById('layerFront');
  var fxG=document.getElementById('fxG'), tip=document.getElementById('tip');
  var defs=svg.querySelector('defs'), clipN=0;

  for(var s=0;s<130;s++){
    el('circle',{cx:rr(4,956).toFixed(1),cy:rr(4,430).toFixed(1),r:rr(.8,2.6).toFixed(1),fill:'#f4efe4','class':'star',style:'animation-delay:'+rr(0,3).toFixed(1)+'s'},starsG);
  }
  function sparklePts(cx,cy,r){
    var pts=[];
    for(var i=0;i<12;i++){ var rad=i%2===0?r:r*0.28, a=Math.PI*i/6-Math.PI/2;
      pts.push((cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1)); }
    return pts.join(' ');
  }
  [[345,25,14],[430,40,10],[290,105,9],[390,195,10],[215,70,8],[690,40,9],[880,220,8],[130,40,9],[575,300,8],[640,240,7]].forEach(function(st){
    el('polygon',{points:sparklePts(st[0],st[1],st[2]),fill:'#f4efe4','class':'star',style:'animation-delay:'+rr(0,3).toFixed(1)+'s'},starsG);
  });
  function cloudBulge(cx,cy,r,fill){ el('circle',{cx:cx,cy:cy,r:r,fill:fill},cloudsG); }
  cloudBulge(-10,240,120,'#8a8578'); cloudBulge(70,270,100,'#b5aca0'); cloudBulge(-20,340,140,'#b5aca0'); cloudBulge(40,200,70,'#cfcbc2');
  cloudBulge(970,250,120,'#8a8578'); cloudBulge(890,280,100,'#b5aca0'); cloudBulge(980,350,140,'#b5aca0'); cloudBulge(920,210,70,'#cfcbc2');

  function spiralD(cx,cy,rmax,turns){
    var d='M '+cx+' '+cy, tot=turns*Math.PI*2;
    for(var a=0;a<=tot;a+=0.18){ var r=rmax*a/tot; d+=' L '+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1); }
    return d;
  }

  /* تلال وأشجار */
  el('path',{d:'M 0 620 Q 120 540 240 600 Q 360 540 480 590 Q 600 540 720 600 Q 840 550 960 610 L 960 900 L 0 900 Z',fill:'#0a0a0a'},layerBack);
  function bare(x,baseY,h){
    el('line',{x1:x,y1:baseY,x2:x,y2:baseY-h,stroke:'#0a0a0a','stroke-width':4,'stroke-linecap':'round'},layerBack);
    [[.5,-1],[.62,1],[.74,-1],[.86,1],[.95,-1]].forEach(function(b){
      el('line',{x1:x,y1:baseY-h*b[0],x2:x+b[1]*h*0.28,y2:baseY-h*b[0]-h*0.2,stroke:'#0a0a0a','stroke-width':2,'stroke-linecap':'round'},layerBack);
    });
  }
  bare(80,600,300); bare(220,610,260); bare(860,600,300); bare(760,610,220);
  (function(){ var x=820,y=610;
    for(var i=0;i<4;i++) el('polygon',{points:(x-20+i*4)+','+(y-30-i*22)+' '+(x+20-i*4)+','+(y-30-i*22)+' '+x+','+(y-52-i*22),fill:'#0a0a0a'},layerBack);
  })();

  /* ---------- أدوات ---------- */
  function tower(parent,name){ var g=el('g',{'class':'tower'},parent); if(name) g.dataset.name=name; return g; }
  function addWin(g,x,y,w,h,type,fill,lit,grid){
    var grp=el('g',{'class':'win'},g), cx=x+w/2, cy=y+h/2, main;
    el('circle',{cx:cx,cy:y+h/2,r:Math.max(w,h)*1.1,'class':'halo',filter:'url(#blurG)'},grp);
    if(type==='arch'){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.45)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.45)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else if(type==='gothic'){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.4)+' Q '+x+' '+(y+h*0.1)+' '+cx+' '+y+' Q '+(x+w)+' '+(y+h*0.1)+' '+(x+w)+' '+(y+h*0.4)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else if(type==='round'){ main=el('circle',{cx:cx,cy:cy,r:Math.min(w,h)/2,'class':'main'},grp); }
    else { main=el('rect',{x:x,y:y,width:w,height:h,'class':'main'},grp); }
    main.setAttribute('fill',fill); main.setAttribute('stroke','#0a0a0a'); main.setAttribute('stroke-width',2);
    if(grid){
      el('line',{x1:cx,y1:y+2,x2:cx,y2:y+h-2,stroke:'#0a0a0a','stroke-width':1.5},grp);
      el('line',{x1:x+2,y1:y+h/2,x2:x+w-2,y2:y+h/2,stroke:'#0a0a0a','stroke-width':1.5},grp);
    }
    if(lit) grp.classList.add('lit');
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('lit'); });
    return grp;
  }
  function cone(g,x,w,y,apex,fill,type){
    var cx=x+w/2, ov=w*0.1;
    el('polygon',{points:(x-ov)+','+y+' '+(x+w+ov)+','+y+' '+cx+','+apex,fill:fill,stroke:'#0a0a0a','stroke-width':2.5},g);
    if(type==='shingle'||type==='pattern'){
      var id='cl'+(clipN++), cp=el('clipPath',{id:id},defs);
      el('polygon',{points:(x-ov)+','+y+' '+(x+w+ov)+','+y+' '+cx+','+apex},cp);
      var gg=el('g',{'clip-path':'url(#'+id+')'},g);
      for(var yy=apex+16;yy<y;yy+=14) for(var xx=x-ov;xx<x+w+ov;xx+=18)
        el('path',{d:'M '+xx+' '+yy+' A 9 9 0 0 1 '+(xx+18)+' '+yy,fill:'none',stroke:(type==='pattern'?'#5a5f66':'#3f3a31'),'stroke-width':1.2,opacity:.8},gg);
    }
    if(type==='silver'){
      for(var i=0;i<3;i++) el('path',{d:spiralD(x+w*rr(.25,.75),y-(y-apex)*rr(.2,.6),rr(7,14),3),fill:'none',stroke:'#8a8f96','stroke-width':1.3},g);
    }
    if(type==='stars'){
      for(var k=0;k<9;k++){
        var sy=apex+(y-apex)*rr(.15,.9), hw=(w/2+ov)*((sy-apex)/(y-apex));
        el('polygon',{points:sparklePts(cx+rr(-hw*.6,hw*.6),sy,rr(3,6)),fill:'#f4efe4',opacity:.95},g);
      }
    }
    if(type==='radial'){
      for(var rI=0;rI<6;rI++){ var ry=apex+(y-apex)*(0.2+rI*0.13), hw2=(w/2)*((ry-apex)/(y-apex));
        el('line',{x1:cx-hw2,y1:ry,x2:cx+hw2,y2:ry,stroke:'#3f3a31','stroke-width':1.2},g); }
    }
    return cx;
  }
  function flag(g,x,y){
    el('line',{x1:x,y1:y,x2:x,y2:y-26,stroke:'#0a0a0a','stroke-width':2.5},g);
    el('polygon',{points:x+','+(y-26)+' '+(x+26)+','+(y-20)+' '+x+','+(y-14),fill:'#0a0a0a','class':'flag'},g);
  }
  function plantStem(g,x,y1,y2){
    el('line',{x1:x,y1:y1,x2:x,y2:y2,stroke:'#3f3a31','stroke-width':2.5},g);
    for(var y=y1-14;y>y2;y-=26){
      var sd=((y/26)|0)%2<1?1:-1;
      el('ellipse',{cx:x+sd*9,cy:y,rx:7,ry:3.5,fill:'#3f3a31',transform:'rotate('+(sd*-35)+' '+(x+sd*9)+' '+y+')'},g);
    }
  }

  /* ---------- الصف الخلفي ---------- */
  var b1=tower(layerBack,'الكوخ الصغير');
  el('rect',{x:14,y:720,width:80,height:200,fill:'#8a8578',stroke:'#0a0a0a','stroke-width':2},b1);
  cone(b1,8,92,724,620,'#efe9da','white');
  addWin(b1,30,760,22,30,'rect','#f4efe4'); addWin(b1,58,760,22,30,'rect','#3f3a31'); addWin(b1,44,830,22,30,'rect','#3f3a31');

  var b2=tower(layerBack,'برج القرميد');
  el('rect',{x:110,y:700,width:90,height:240,fill:'#3f3a31',stroke:'#0a0a0a','stroke-width':2},b2);
  cone(b2,104,102,706,540,'#6e6a60','shingle');
  el('rect',{x:125,y:760,width:60,height:26,fill:'#efe9da',stroke:'#0a0a0a','stroke-width':1.5},b2);
  for(var d1=133;d1<185;d1+=12) el('rect',{x:d1,y:768,width:6,height:10,fill:'#0a0a0a'},b2);
  addWin(b2,130,820,20,28,'rect','#e8a53f',true); addWin(b2,162,820,20,28,'rect','#3f3a31');

  var b4=tower(layerBack,'برج الضباب');
  el('rect',{x:205,y:740,width:85,height:420,fill:'#9aa0a8',stroke:'#0a0a0a','stroke-width':2},b4);
  cone(b4,199,97,746,555,'#c9ccd2','silver');
  addWin(b4,225,790,20,28,'rect','#3f3a31'); addWin(b4,255,790,20,28,'rect','#e8a53f',true); addWin(b4,238,860,20,28,'rect','#3f3a31');

  var b3=tower(layerBack,'البرج الفيروزي');
  el('rect',{x:240,y:640,width:110,height:480,fill:'#a8c4bd',stroke:'#0a0a0a','stroke-width':2},b3);
  cone(b3,234,122,646,400,'#131313','radial');
  addWin(b3,275,840,40,60,'rect','#e8a53f',true);
  addWin(b3,262,960,18,26,'rect','#6e6a60'); addWin(b3,310,960,18,26,'rect','#6e6a60');
  plantStem(b3,268,1110,1010); plantStem(b3,322,1110,1030);

  var b5=tower(layerBack,'برج السرج');
  el('rect',{x:330,y:760,width:120,height:420,fill:'#8a8f96',stroke:'#0a0a0a','stroke-width':2},b5);
  el('path',{d:'M 324 766 Q 366 640 390 616 Q 414 640 456 766 Z',fill:'#7d848c',stroke:'#0a0a0a','stroke-width':2.5},b5);
  addWin(b5,352,810,22,30,'rect','#3f3a31'); addWin(b5,398,810,22,30,'rect','#e8a53f',true); addWin(b5,372,880,22,30,'rect','#3f3a31');

  var b6=tower(layerBack,'المرصد الأسود');
  el('rect',{x:395,y:430,width:75,height:520,fill:'#3a3d42',stroke:'#0a0a0a','stroke-width':2},b6);
  cone(b6,391,83,436,140,'#2a2d33','dark');
  addWin(b6,420,470,22,32,'arch','#e8a53f',true); addWin(b6,420,560,22,32,'rect','#3f3a31');

  var b7=tower(layerBack,'البرج الأطول');
  el('rect',{x:420,y:500,width:110,height:620,fill:'#55534e',stroke:'#0a0a0a','stroke-width':2},b7);
  for(var gr=430;gr<525;gr+=12) el('line',{x1:gr,y1:505,x2:gr,y2:1115,stroke:'#3f3a31','stroke-width':1,opacity:.5},b7);
  var c7=cone(b7,414,122,506,120,'#131313','stars');
  flag(b7,c7,120);
  addWin(b7,462,530,26,40,'arch','#f4efe4');
  addWin(b7,452,840,56,120,'gothic','#e8a53f',true);
  el('line',{x1:480,y1:850,x2:480,y2:955,stroke:'#0a0a0a','stroke-width':2},b7);
  el('line',{x1:456,y1:900,x2:504,y2:900,stroke:'#0a0a0a','stroke-width':2},b7);

  var b8=tower(layerBack,'برج النجوم');
  el('rect',{x:620,y:620,width:90,height:320,fill:'#131313',stroke:'#0a0a0a','stroke-width':2},b8);
  var c8=cone(b8,614,102,626,240,'#131313','stars');
  flag(b8,c8,240);
  addWin(b8,648,650,34,56,'arch','#f4efe4');

  var b9=tower(layerBack,'بيت الأقواس');
  el('rect',{x:560,y:740,width:150,height:380,fill:'#8a8578',stroke:'#0a0a0a','stroke-width':2},b9);
  el('polygon',{points:'554,746 716,746 700,640 570,640',fill:'#131313',stroke:'#0a0a0a','stroke-width':2},b9);
  for(var dr=0;dr<4;dr++) for(var dc=0;dc<7;dc++) el('circle',{cx:575+dc*22,cy:660+dr*22,r:2,fill:'#f4efe4',opacity:.9},b9);
  addWin(b9,580,760,30,40,'rect','#f4efe4',false,true);
  addWin(b9,640,760,30,40,'rect','#f4efe4',false,true);
  addWin(b9,688,760,24,40,'rect','#f4efe4',false,true);
  addWin(b9,585,920,45,80,'arch','#f4efe4',false,true);
  addWin(b9,660,920,45,80,'arch','#f4efe4',false,true);
  el('path',{d:'M 610 1120 L 610 1050 Q 610 1020 645 1020 Q 680 1020 680 1050 L 680 1120 Z',fill:'#efe9da',stroke:'#0a0a0a','stroke-width':2},b9);
  el('path',{d:'M 625 1120 L 625 1060 Q 625 1040 645 1040 Q 665 1040 665 1060 L 665 1120 Z',fill:'#0a0a0a'},b9);

  var b13=tower(layerBack,'البرج الأبيض');
  el('rect',{x:855,y:520,width:105,height:600,fill:'#aebfcb',stroke:'#0a0a0a','stroke-width':2},b13);
  cone(b13,849,117,526,96,'#e8e8e6','white');
  addWin(b13,880,560,30,44,'arch','#e8a53f',true); addWin(b13,880,650,30,44,'arch','#e8a53f',true); addWin(b13,880,740,30,44,'rect','#3f3a31');

  var b10=tower(layerBack,'البرج المخطط');
  el('rect',{x:760,y:700,width:110,height:420,fill:'#6e6a60',stroke:'#0a0a0a','stroke-width':2},b10);
  for(var vs=770;vs<870;vs+=12) el('line',{x1:vs,y1:702,x2:vs,y2:1118,stroke:'#8a8578','stroke-width':2,opacity:.8},b10);
  cone(b10,756,56,706,600,'#89a3b3','tan');
  cone(b10,812,60,706,600,'#89a3b3','tan');
  addWin(b10,775,740,24,32,'rect','#e8a53f',true); addWin(b10,822,740,24,32,'rect','#f4efe4');
  addWin(b10,775,820,24,32,'rect','#f4efe4'); addWin(b10,822,820,24,32,'rect','#3f3a31');
  addWin(b10,775,900,24,32,'rect','#3f3a31'); addWin(b10,822,900,24,32,'rect','#e8a53f',true);
  for(var gs=766;gs<866;gs+=10) el('line',{x1:gs,y1:980,x2:gs,y2:1060,stroke:'#0a0a0a','stroke-width':1.5,opacity:.6},b10);

  var b11=tower(layerBack,'البرج الصغير');
  el('rect',{x:905,y:820,width:60,height:300,fill:'#aebfcb',stroke:'#0a0a0a','stroke-width':2},b11);
  cone(b11,899,72,826,626,'#b5aca0','pattern');
  addWin(b11,920,860,24,32,'rect','#e8a53f',true); addWin(b11,920,940,24,32,'rect','#3f3a31');

  /* ---------- الصف الأمامي ---------- */
  var f1=tower(layerFront,'البيت البرتقالي');
  el('polygon',{points:'10,930 200,930 190,860 20,860',fill:'#131313',stroke:'#0a0a0a','stroke-width':2},f1);
  el('rect',{x:20,y:930,width:170,height:440,fill:'#5f8296',stroke:'#0a0a0a','stroke-width':2},f1);
  for(var sd2=940;sd2<1360;sd2+=14) el('line',{x1:22,y1:sd2,x2:188,y2:sd2,stroke:'#8a5a20','stroke-width':1,opacity:.5},f1);
  addWin(f1,40,960,40,60,'rect','#f4efe4',false,true);
  addWin(f1,120,960,40,60,'rect','#f4efe4',false,true);
  addWin(f1,40,1080,34,50,'rect','#3f3a31');
  el('rect',{x:90,y:1180,width:50,height:190,fill:'#efe9da',stroke:'#0a0a0a','stroke-width':2},f1);
  el('rect',{x:100,y:1200,width:30,height:70,fill:'#b5aca0',stroke:'#0a0a0a','stroke-width':1.5},f1);
  el('circle',{cx:132,cy:1290,r:3,fill:'#0a0a0a'},f1);
  el('circle',{cx:48,cy:1210,r:14,fill:'#8a6b4d',stroke:'#0a0a0a','stroke-width':2},f1);
  el('path',{d:spiralD(48,1210,9,2.5),fill:'none',stroke:'#0a0a0a','stroke-width':1.2},f1);

  var f2=tower(layerFront,'الكوخ الأسود');
  el('rect',{x:246,y:1060,width:100,height:310,fill:'#131313',stroke:'#0a0a0a','stroke-width':2},f2);
  cone(f2,240,112,1066,960,'#6e6a60','shingle');
  addWin(f2,260,1120,30,40,'rect','#f4efe4',false,true);
  addWin(f2,310,1120,30,40,'rect','#f4efe4',false,true);
  addWin(f2,260,1220,30,40,'rect','#f4efe4',false,true);
  el('path',{d:'M 300 1370 L 300 1300 Q 300 1280 318 1280 Q 336 1280 336 1300 L 336 1370 Z',fill:'#8a8578',stroke:'#0a0a0a','stroke-width':2},f2);

  var f3=tower(layerFront,'البيت الذهبي');
  el('rect',{x:430,y:1010,width:130,height:360,fill:'#7f9fb2',stroke:'#0a0a0a','stroke-width':2},f3);
  el('polygon',{points:'424,1016 566,1016 495,900',fill:'#7f9fb2',stroke:'#0a0a0a','stroke-width':2},f3);
  addWin(f3,479,946,32,32,'round','#8a6b4d');
  addWin(f3,450,1050,36,50,'rect','#f4efe4',false,true);
  addWin(f3,510,1050,36,50,'rect','#f4efe4',false,true);
  el('path',{d:'M 470 1370 L 470 1230 Q 470 1200 492 1200 Q 514 1200 514 1230 L 514 1370 Z',fill:'#9db4c2',stroke:'#0a0a0a','stroke-width':2},f3);
  el('circle',{cx:506,cy:1290,r:3,fill:'#0a0a0a'},f3);

  (function(){ var x=585,y=1370;
    el('line',{x1:x,y1:y,x2:x,y2:y-30,stroke:'#0a0a0a','stroke-width':3},layerFront);
    for(var i=0;i<5;i++) el('polygon',{points:(x-32+i*6)+','+(y-30-i*30)+' '+(x+32-i*6)+','+(y-30-i*30)+' '+x+','+(y-60-i*30),fill:'#8a8578',stroke:'#0a0a0a','stroke-width':1.5},layerFront);
  })();

  var f5=tower(layerFront,'بيت السقف الرمادي');
  el('rect',{x:650,y:1080,width:130,height:290,fill:'#b5aca0',stroke:'#0a0a0a','stroke-width':2},f5);
  el('polygon',{points:'640,1086 790,1086 770,1000 660,1000',fill:'#6e6a60',stroke:'#0a0a0a','stroke-width':2},f5);
  (function(){ var id='clf9', cp=el('clipPath',{id:id},defs);
    el('polygon',{points:'640,1086 790,1086 770,1000 660,1000'},cp);
    var gg=el('g',{'clip-path':'url(#'+id+')'},f5);
    for(var y=1008;y<1086;y+=12) for(var x=636;x<794;x+=16)
      el('path',{d:'M '+x+' '+y+' A 8 8 0 0 1 '+(x+16)+' '+y,fill:'none',stroke:'#3f3a31','stroke-width':1.1,opacity:.8},gg);
  })();
  addWin(f5,670,1120,30,40,'rect','#f4efe4',false,true);
  addWin(f5,725,1120,30,40,'rect','#3f3a31');
  el('path',{d:'M 700 1370 L 700 1260 Q 700 1240 720 1240 Q 740 1240 740 1260 L 740 1370 Z',fill:'#7a9a8d',stroke:'#0a0a0a','stroke-width':2},f5);

  var f6=tower(layerFront,'بيت القمع');
  el('rect',{x:806,y:1080,width:110,height:290,fill:'#89a3b3',stroke:'#0a0a0a','stroke-width':2},f6);
  cone(f6,800,122,1086,960,'#8a8578','pattern');
  addWin(f6,848,1116,28,28,'round','#e8a53f',true);
  addWin(f6,820,1180,26,36,'rect','#3f3a31');
  el('path',{d:'M 840 1370 L 840 1260 Q 840 1240 860 1240 Q 880 1240 880 1260 L 880 1370 Z',fill:'#8a8578',stroke:'#0a0a0a','stroke-width':2},f6);

  /* الشريط السفلي المقوّس */
  el('path',{d:'M 0 1392 Q 480 1336 960 1398 L 960 1440 L 0 1440 Z',fill:'#efe9da',stroke:'#0a0a0a','stroke-width':2},layerFront);
  for(var ax=20;ax<940;ax+=44){
    var ay=1392-Math.sin(Math.PI*ax/960)*52;
    el('path',{d:'M '+ax+' '+(ay+14)+' A 12 12 0 0 1 '+(ax+24)+' '+(ay+14),fill:'#0a0a0a',opacity:.85},layerFront);
    el('line',{x1:ax+34,y1:ay+8,x2:ax+34,y2:ay+22,stroke:'#0a0a0a','stroke-width':2,opacity:.7},layerFront);
  }

  /* ---------- تفاعل ---------- */
  function shoot(x,y){
    var g=el('g',{},fxG);
    el('line',{x1:0,y1:0,x2:-50,y2:-30,stroke:'#f4efe4','stroke-width':2.5,opacity:.85},g);
    el('circle',{cx:0,cy:0,r:4.5,fill:'#f4efe4',filter:'url(#glowF)'},g);
    g.animate([
      {transform:'translate('+x+'px,'+y+'px)',opacity:1},
      {transform:'translate('+(x+200)+'px,'+(y+130)+'px)',opacity:0}
    ],{duration:1100,easing:'ease-out'}).onfinish=(function(g2){ return function(){ g2.remove(); }; })(g);
  }
  svg.addEventListener('click',function(e){
    if(e.target.classList.contains('skyrect')){
      var m=svg.getScreenCTM().inverse(), p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);
      if(p.y<500){
        var g=el('g',{},fxG);
        var sp=el('polygon',{points:sparklePts(p.x,p.y,rr(8,16)),fill:'#f4efe4','class':'star'},g);
        sp.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1.2)'},{opacity:1,transform:'scale(1)'}],{duration:600,easing:'ease-out'});
      } else shoot(p.x,p.y);
    }
  });
  ['moonG','cresG'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(ev){
      ev.stopPropagation();
      var mg=document.getElementById(id);
      mg.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:800,easing:'ease-in-out'});
      setTimeout(function(){ shoot(300,150); },150);
      setTimeout(function(){ shoot(520,100); },450);
    });
  });
  setInterval(function(){ if(Math.random()<.3) shoot(rr(60,700),rr(40,260)); },7000);

  document.querySelectorAll('.tower').forEach(function(g){
    if(!g.dataset.name) return;
    g.addEventListener('pointerenter',function(){ tip.textContent=g.dataset.name; tip.style.opacity=1; });
    g.addEventListener('pointermove',function(e){ tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-8)+'px'; });
    g.addEventListener('pointerleave',function(){ tip.style.opacity=0; });
  });

  var tx=0,ty=0,cx2=0,cy2=0;
  window.addEventListener('pointermove',function(e){ tx=(e.clientX/window.innerWidth)*2-1; ty=(e.clientY/window.innerHeight)*2-1; });
  (function loop(){
    cx2+=(tx-cx2)*0.06; cy2+=(ty-cy2)*0.06;
    [layerBack,layerFront].forEach(function(L){
      var d=parseFloat(L.dataset.depth);
      L.style.transform='translate('+(cx2*d)+'px,'+(cy2*d*0.4)+'px)';
    });
    requestAnimationFrame(loop);
  })();

  var dayBtn=document.getElementById('dayBtn');
  dayBtn.addEventListener('click',function(){
    svg.classList.toggle('day');
    dayBtn.textContent=svg.classList.contains('day')?'🌙 وضع الليل':'☀️ وضع النهار';
  });
  document.getElementById('shootBtn').addEventListener('click',function(){
    for(var i=0;i<4;i++)(function(i){ setTimeout(function(){ shoot(rr(40,600),rr(30,240)); },i*260); })(i);
  });
  document.getElementById('lightBtn').addEventListener('click',function(){
    var wins=Array.prototype.slice.call(document.querySelectorAll('.win'));
    var allLit=wins.every(function(w){ return w.classList.contains('lit'); });
    wins.forEach(function(w){ w.classList.toggle('lit',!allLit); });
  });
  document.getElementById('resetBtn').addEventListener('click',function(){ location.reload(); });
})();
</script>
</body>
