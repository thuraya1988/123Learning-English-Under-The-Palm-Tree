<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليلة الهالوين — مشهد مائي تفاعلي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-700.css">
<style>
  :root{ --ink:#2a2620; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ background:#3a3f46; font-family:'Cairo',sans-serif; }
  #stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #scene{ height:100vh; max-width:100vw; display:block; box-shadow:0 0 70px rgba(0,0,0,.5); }

  header{ position:fixed; top:14px; right:14px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header h1{ font-size:15px; font-weight:700; color:var(--ink); background:rgba(242,238,226,.92); border:2px solid var(--ink); border-radius:30px; padding:6px 16px; }
  header button{ font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:var(--ink); background:rgba(242,238,226,.92); border:2px solid var(--ink); border-radius:30px; padding:6px 14px; cursor:pointer; transition:transform .2s, background .3s; }
  header button:hover{ transform:translateY(-3px); background:#fff; }
  header button:active{ transform:scale(.94); }

  #hint{ position:fixed; bottom:12px; right:50%; transform:translateX(50%); z-index:6; background:rgba(42,38,32,.85); color:#f2eeda; font-size:12.5px; padding:8px 20px; border-radius:30px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #tip{ position:fixed; z-index:9; pointer-events:none; background:var(--ink); color:#f2eeda; font-size:13px; font-weight:700; padding:4px 14px; border-radius:20px; opacity:0; transition:opacity .2s; transform:translate(-50%,-150%); }

  .skyrect{ fill:#bfc9cf; transition:fill 1.2s ease; }
  #scene.night .skyrect{ fill:#232030; }
  .stars{ opacity:0; transition:opacity 1.2s; }
  #scene.night .stars{ opacity:1; }
  .star{ animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.2; } to{ opacity:1; } }
  #moonG{ cursor:pointer; transform-box:fill-box; transform-origin:center; }
  #scene.night #moonG{ filter:drop-shadow(0 0 26px #f2eeda); }
  #scene.night .houses{ filter:brightness(.82); }
  .houses{ transition:filter 1s; }

  .layer{ will-change:transform; }
  .lift{ transform-box:fill-box; transition:transform .5s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
  .lift:hover{ transform:translateY(-7px); }

  .win{ cursor:pointer; }
  .win .main{ transition:fill .3s; }
  .win .halo{ fill:#ffcf6e; opacity:0; transition:opacity .4s; pointer-events:none; }
  .win.lit .main{ fill:#f4c449 !important; }
  .win.lit .halo{ opacity:.55; }
  #scene.night .win .main{ fill:#5a5342; }
  #scene.night .win .halo{ opacity:.15; }
  #scene.night .win.lit .main{ fill:#ffd98a; }
  #scene.night .win.lit .halo{ opacity:.75; }

  .ghost{ animation:float 5s ease-in-out infinite alternate; }
  @keyframes float{ from{ transform:translateY(0); } to{ transform:translateY(-11px); } }
  .hat{ transform-box:fill-box; transform-origin:25% 92%; animation:hat 3s ease-in-out infinite alternate; }
  @keyframes hat{ from{ transform:rotate(-3deg); } to{ transform:rotate(4deg); } }
  .catTail{ transform-box:fill-box; transform-origin:0% 95%; animation:tail 2.6s ease-in-out infinite alternate; }
  @keyframes tail{ from{ transform:rotate(-9deg); } to{ transform:rotate(11deg); } }
  .catEye{ transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.12); } }
  .batW{ transform-box:fill-box; transform-origin:center; animation:flap .32s ease-in-out infinite alternate; }
  @keyframes flap{ from{ transform:scaleY(1); } to{ transform:scaleY(.45); } }
  .pGlow{ transition:opacity .4s; }
  .pump.dim .pGlow{ opacity:0; }
  .say{ font-family:'Cairo',sans-serif; font-weight:700; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1000 950" preserveAspectRatio="xMidYMid meet" aria-label="لوحة الهالوين التفاعلية">
    <defs>
      <filter id="blurG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .25  0 0 0 0.06 0"/></filter>
    </defs>
    <rect class="skyrect" x="0" y="0" width="1000" height="950"></rect>
    <g id="stainsG" pointer-events="none"></g>
    <g id="starsG" class="stars"></g>
    <g id="moonG">
      <circle cx="660" cy="190" r="125" fill="#f2eeda"/>
      <circle cx="620" cy="160" r="22" fill="#ddd8c2" opacity=".5"/>
      <circle cx="700" cy="230" r="16" fill="#ddd8c2" opacity=".5"/>
      <circle cx="680" cy="140" r="10" fill="#ddd8c2" opacity=".4"/>
    </g>
    <g id="layerBack" class="layer" data-depth="4"></g>
    <g id="layerMid" class="layer houses" data-depth="9"></g>
    <g id="layerFront" class="layer" data-depth="15"></g>
    <rect x="0" y="0" width="1000" height="950" filter="url(#paper)" opacity=".7" pointer-events="none"></rect>
    <g id="fxG" pointer-events="none"></g>
  </svg>

  <header>
    <h1>🎃 ليلة الهالوين</h1>
    <button id="nightBtn">🌙 وضع الليل</button>
    <button id="batsBtn">🦇 خفافيش</button>
    <button id="lightBtn">💡 إضاءة الكل</button>
    <button id="resetBtn">🔄 إعادة</button>
  </header>
  <div id="hint">مرّر المؤشر لتحريك الطبقات • انقر النوافذ • انقر الشبحين والقطة واليقطين • انقر القمر • انقر السماء لتطير الخفافيش</div>
  <div id="tip"></div>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg', INK='#2a2620';
  var seed=61;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function rr(a,b){ return a+rnd()*(b-a); }
  function el(t,a,p){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }

  var svg=document.getElementById('scene');
  var stainsG=document.getElementById('stainsG'), starsG=document.getElementById('starsG');
  var layerBack=document.getElementById('layerBack'), layerMid=document.getElementById('layerMid'), layerFront=document.getElementById('layerFront');
  var fxG=document.getElementById('fxG'), tip=document.getElementById('tip');

  /* بقع مائية */
  [[120,90,70,'#8fa0ac'],[880,120,60,'#8fa0ac'],[500,60,50,'#a8b4bc'],[80,700,60,'#b5aca0'],[930,700,55,'#b5aca0']].forEach(function(s){
    el('ellipse',{cx:s[0],cy:s[1],rx:s[2],ry:s[2]*0.7,fill:s[3],opacity:.35,filter:'url(#blurS)'},stainsG);
  });
  for(var s2=0;s2<60;s2++){
    el('circle',{cx:rr(5,995).toFixed(1),cy:rr(5,420).toFixed(1),r:rr(1,2.2).toFixed(1),fill:'#f2eeda','class':'star',style:'animation-delay:'+rr(0,3).toFixed(1)+'s'},starsG);
  }

  /* أغصان عارية */
  function bare(parent,x,baseY,h,color,w){
    el('line',{x1:x,y1:baseY,x2:x,y2:baseY-h,stroke:color,'stroke-width':w,'stroke-linecap':'round'},parent);
    [[.4,-1],[.52,1],[.64,-1],[.75,1],[.86,-1],[.94,1]].forEach(function(b){
      el('line',{x1:x,y1:baseY-h*b[0],x2:x+b[1]*h*0.32,y2:baseY-h*b[0]-h*0.2,stroke:color,'stroke-width':w*0.5,'stroke-linecap':'round'},parent);
      el('line',{x1:x+b[1]*h*0.2,y1:baseY-h*b[0]-h*0.1,x2:x+b[1]*h*0.4,y2:baseY-h*b[0]-h*0.02,stroke:color,'stroke-width':w*0.35,'stroke-linecap':'round'},parent);
    });
  }
  bare(layerBack,110,330,310,'#4a3f33',6);
  bare(layerBack,300,240,220,'#4a3f33',4);
  bare(layerBack,965,470,430,'#4a3f33',8);
  bare(layerBack,880,300,240,'#4a3f33',4);

  /* ---------- أدوات ---------- */
  function lift(parent,name){ var g=el('g',{'class':'lift'},parent); if(name) g.dataset.name=name; return g; }
  function addWin(g,x,y,w,h,lit,arch){
    var grp=el('g',{'class':'win'},g), cx=x+w/2;
    el('circle',{cx:cx,cy:y+h/2,r:Math.max(w,h)*1.05,'class':'halo',filter:'url(#blurG)'},grp);
    var main;
    if(arch){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.45)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.45)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else { main=el('rect',{x:x,y:y,width:w,height:h,'class':'main'},grp); }
    main.setAttribute('fill',lit?'#f4c449':'#3a3f46'); main.setAttribute('stroke',INK); main.setAttribute('stroke-width',2.5);
    el('line',{x1:cx,y1:y+3,x2:cx,y2:y+h-3,stroke:INK,'stroke-width':1.6},grp);
    el('line',{x1:x+3,y1:y+h/2,x2:x+w-3,y2:y+h/2,stroke:INK,'stroke-width':1.6},grp);
    el('line',{x1:x-5,y1:y+h+4,x2:x+w+5,y2:y+h+4,stroke:INK,'stroke-width':3},grp);
    if(lit) grp.classList.add('lit');
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('lit'); });
    return grp;
  }
  function say(x,y,txt){
    var t=el('text',{x:x,y:y,'class':'say','font-size':26,fill:INK,stroke:'#f2eeda','stroke-width':5,'paint-order':'stroke','text-anchor':'middle'},fxG);
    t.textContent=txt;
    t.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0)',offset:.25},{opacity:1,transform:'translateY(-10px)',offset:.7},{opacity:0,transform:'translateY(-34px)'}],{duration:1500,easing:'ease-out'}).onfinish=function(){ t.remove(); };
  }

  /* ---------- البيت الحجري ---------- */
  var hL=lift(layerMid,'البيت الحجري');
  el('rect',{x:30,y:430,width:560,height:380,fill:'#9a968c',stroke:INK,'stroke-width':3},hL);
  for(var m1=0;m1<10;m1++) el('circle',{cx:rr(50,570).toFixed(0),cy:rr(450,790).toFixed(0),r:rr(6,18).toFixed(0),fill:'#84807a',opacity:.5},hL);
  el('polygon',{points:'15,445 605,445 480,240 120,240',fill:'#c9b28a',stroke:INK,'stroke-width':3},hL);
  for(var sh=260;sh<440;sh+=20) el('line',{x1:120+(440-sh)*0.8,y1:sh,x2:600-(440-sh)*0.55,y2:sh,stroke:'#8a6b4d','stroke-width':1.3,opacity:.7},hL);
  el('rect',{x:75,y:140,width:28,height:100,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:70,y:132,width:38,height:12,fill:'#8a8578',stroke:INK,'stroke-width':2},hL);
  el('rect',{x:112,y:118,width:30,height:122,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:107,y:110,width:40,height:12,fill:'#8a8578',stroke:INK,'stroke-width':2},hL);
  el('rect',{x:465,y:195,width:30,height:90,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:460,y:187,width:40,height:12,fill:'#8a8578',stroke:INK,'stroke-width':2},hL);
  /* dormer */
  el('polygon',{points:'365,360 495,360 430,295',fill:'#c9b28a',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:388,y:360,width:84,height:80,fill:'#9a968c',stroke:INK,'stroke-width':2.5},hL);
  addWin(hL,405,372,50,60,true);
  addWin(hL,65,375,30,55,true);
  addWin(hL,55,555,80,130,true);
  addWin(hL,350,560,70,120,true);
  addWin(hL,480,565,60,110,true);
  /* باب */
  el('polygon',{points:'170,522 320,522 245,468',fill:'#84807a',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:195,y:522,width:100,height:258,fill:'#6b5a44',stroke:INK,'stroke-width':2.5},hL);
  el('rect',{x:207,y:548,width:76,height:232,fill:'#7a6a52',stroke:INK,'stroke-width':2},hL);
  addWin(hL,225,568,40,48,true,true);
  el('circle',{cx:276,cy:690,r:4,fill:INK},hL);
  el('rect',{x:185,y:780,width:120,height:13,fill:'#b5aca0',stroke:INK,'stroke-width':2},hL);
  el('rect',{x:173,y:793,width:144,height:13,fill:'#b5aca0',stroke:INK,'stroke-width':2},hL);

  /* ---------- البيت البرتقالي ---------- */
  var hR=lift(layerMid,'البيت البرتقالي');
  el('rect',{x:600,y:470,width:380,height:330,fill:'#b9773f',stroke:INK,'stroke-width':3},hR);
  for(var m2=0;m2<8;m2++) el('circle',{cx:rr(615,965).toFixed(0),cy:rr(490,780).toFixed(0),r:rr(6,16).toFixed(0),fill:'#a3653a',opacity:.5},hR);
  el('polygon',{points:'595,475 985,475 900,330 660,330',fill:'#c9b28a',stroke:INK,'stroke-width':3},hR);
  for(var sh2=345;sh2<470;sh2+=20) el('line',{x1:660-(sh2-330)*0.4,y1:sh2,x2:900+(sh2-330)*0.5,y2:sh2,stroke:'#8a6b4d','stroke-width':1.3,opacity:.7},hR);
  el('rect',{x:585,y:330,width:26,height:75,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hR);
  el('rect',{x:612,y:318,width:22,height:87,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hR);
  el('rect',{x:740,y:268,width:30,height:85,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hR);
  el('rect',{x:776,y:283,width:24,height:70,fill:'#b5aca0',stroke:INK,'stroke-width':2.5},hR);
  addWin(hR,890,440,40,60,true);
  addWin(hR,615,520,35,60,true);
  addWin(hR,700,515,35,65,true);
  addWin(hR,920,565,40,80,true);
  el('polygon',{points:'830,542 920,542 875,505',fill:'#84807a',stroke:INK,'stroke-width':2.5},hR);
  el('rect',{x:845,y:560,width:55,height:160,fill:'#5a6a5a',stroke:INK,'stroke-width':2.5},hR);
  el('rect',{x:838,y:720,width:70,height:11,fill:'#b5aca0',stroke:INK,'stroke-width':2},hR);
  /* سياج */
  for(var fx=600;fx<=810;fx+=26){ el('line',{x1:fx,y1:660,x2:fx,y2:760,stroke:'#8a8578','stroke-width':4},hR); }
  el('line',{x1:600,y1:680,x2:810,y2:680,stroke:'#8a8578','stroke-width':4},hR);

  /* ---------- الشارع ---------- */
  el('rect',{x:0,y:800,width:1000,height:150,fill:'#a8a49a',stroke:INK,'stroke-width':2.5},layerFront);
  el('line',{x1:0,y1:812,x2:1000,y2:812,stroke:INK,'stroke-width':2},layerFront);
  for(var cb=0;cb<60;cb++){
    var cy3=rr(825,940), cx3=rr(5,975);
    el('line',{x1:cx3,y1:cy3,x2:cx3+rr(14,34),y2:cy3,stroke:'#6e6a60','stroke-width':1.4,opacity:.6},layerFront);
  }

  /* ---------- يقطين ---------- */
  function pumpkin(x,y,r){
    var g=lift(layerFront,'يقطينة');
    g.classList.add('pump');
    el('circle',{cx:x,cy:y,r:r*0.75,'class':'pGlow',fill:'#ffcf6e',opacity:.4,filter:'url(#blurG)'},g);
    el('path',{d:'M '+x+' '+(y-r*0.8)+' q 8 -16 20 -18',stroke:'#5a6a3a','stroke-width':7,fill:'none','stroke-linecap':'round'},g);
    el('ellipse',{cx:x,cy:y,rx:r,ry:r*0.85,fill:'#d97e35',stroke:INK,'stroke-width':3},g);
    el('path',{d:'M '+(x-r*0.5)+' '+(y-r*0.6)+' Q '+(x-r*0.75)+' '+y+' '+(x-r*0.5)+' '+(y+r*0.62)+' M '+(x+r*0.5)+' '+(y-r*0.6)+' Q '+(x+r*0.75)+' '+y+' '+(x+r*0.5)+' '+(y+r*0.62)+' M '+x+' '+(y-r*0.85)+' L '+x+' '+(y+r*0.85),fill:'none',stroke:INK,'stroke-width':1.5,opacity:.55},g);
    el('polygon',{points:(x-r*0.45)+','+(y-r*0.15)+' '+(x-r*0.15)+','+(y-r*0.15)+' '+(x-r*0.3)+','+(y-r*0.45),fill:'#2a1a0a'},g);
    el('polygon',{points:(x+r*0.15)+','+(y-r*0.15)+' '+(x+r*0.45)+','+(y-r*0.15)+' '+(x+r*0.3)+','+(y-r*0.45),fill:'#2a1a0a'},g);
    el('path',{d:'M '+(x-r*0.55)+' '+(y+r*0.25)+' q '+r*0.2+' '+r*0.28+' '+r*0.4+' 0 q '+r*0.15+' '+r*0.22+' '+r*0.3+' 0 q '+r*0.15+' '+r*0.22+' '+r*0.3+' 0 q '+r*0.2+' '+r*0.28+' '+r*0.4+' 0 L '+(x+r*0.55)+' '+(y+r*0.25)+' q -'+r*0.55+' '+r*0.5+' -'+r*1.1+' 0 Z',fill:'#2a1a0a'},g);
    g.addEventListener('click',function(ev){ ev.stopPropagation(); g.classList.toggle('dim'); });
    return g;
  }
  pumpkin(140,830,62);
  pumpkin(420,805,55);

  /* ---------- الأشباح ---------- */
  function ghost(parent,x,yT,w,h,name){
    var g=el('g',{'class':'ghost'},parent);
    var inner=lift(g,name);
    var xL=x-w/2,xR=x+w/2,yB=yT+h;
    var d='M '+xL+' '+yB+
      ' C '+xL+' '+(yT+h*0.25)+' '+(x-w*0.28)+' '+yT+' '+x+' '+yT+
      ' C '+(x+w*0.28)+' '+yT+' '+xR+' '+(yT+h*0.25)+' '+xR+' '+yB+
      ' q '+(-w/6)+' 14 '+(-w/3)+' 0 q '+(-w/6)+' 14 '+(-w/3)+' 0 q '+(-w/6)+' 14 '+(-w/3)+' 0 Z';
    el('path',{d:d,fill:'#fbf8f0',stroke:INK,'stroke-width':2.5},inner);
    el('ellipse',{cx:x-w*0.14,cy:yT+h*0.32,rx:w*0.05,ry:h*0.07,fill:INK},inner);
    el('ellipse',{cx:x+w*0.12,cy:yT+h*0.32,rx:w*0.05,ry:h*0.07,fill:INK},inner);
    el('ellipse',{cx:x,cy:yT+h*0.5,rx:w*0.04,ry:h*0.06,fill:INK},inner);
    inner.addEventListener('click',function(ev){
      ev.stopPropagation(); say(x,yT-14,'بوو! 👻');
      inner.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:600,easing:'ease-out'});
    });
    return g;
  }
  var gA=ghost(layerMid,280,150,150,150,'شبح الساحرة');
  /* قبعة الساحرة */
  var hat=el('g',{'class':'hat'},gA);
  el('path',{d:'M 215 165 Q 280 150 350 168 L 330 178 Q 280 165 235 176 Z',fill:'#6b4a2a',stroke:INK,'stroke-width':2.5},hat);
  el('path',{d:'M 250 168 Q 262 100 300 78 Q 285 118 320 128 Q 345 132 352 118 Q 350 150 320 168 Z',fill:'#6b4a2a',stroke:INK,'stroke-width':2.5},hat);
  ghost(layerFront,700,560,170,230,'الشبح الكبير');

  /* ---------- القطة ---------- */
  var cat=lift(layerFront,'القطة السوداء');
  el('path',{d:'M 852 872 Q 886 850 878 800 Q 874 780 886 768',fill:'none',stroke:INK,'stroke-width':9,'stroke-linecap':'round','class':'catTail'},cat);
  el('path',{d:'M 800 878 Q 792 830 812 806 Q 826 792 842 806 Q 858 826 852 878 Z',fill:INK},cat);
  el('circle',{cx:826,cy:782,r:24,fill:INK},cat);
  el('polygon',{points:'806,768 810,744 822,762',fill:INK},cat);
  el('polygon',{points:'832,762 842,742 848,766',fill:INK},cat);
  el('polygon',{points:'809,764 811,752 818,761',fill:'#d98a9a'},cat);
  el('polygon',{points:'836,761 841,750 845,763',fill:'#d98a9a'},cat);
  el('circle',{cx:817,cy:782,r:4.5,fill:'#e8c06a','class':'catEye'},cat);
  el('circle',{cx:836,cy:782,r:4.5,fill:'#e8c06a','class':'catEye'},cat);
  el('path',{d:'M 800 790 L 782 786 M 800 794 L 784 798 M 852 790 L 868 786',stroke:INK,'stroke-width':1.4},cat);
  cat.addEventListener('click',function(ev){
    ev.stopPropagation(); say(826,740,'مياو! 🐈‍⬛');
    cat.animate([{transform:'translateY(0)'},{transform:'translateY(-24px)'},{transform:'translateY(0)'}],{duration:600,easing:'ease-out'});
  });

  /* ---------- خفافيش وأوراق ---------- */
  function bat(x,y){
    var g=el('g',{},fxG);
    var w1=el('path',{d:'M 0 0 Q -14 -12 -26 -5 Q -15 4 0 0 Z',fill:'#1c1a17','class':'batW'},g);
    var w2=el('path',{d:'M 0 0 Q 14 -12 26 -5 Q 15 4 0 0 Z',fill:'#1c1a17','class':'batW'},g);
    el('ellipse',{cx:0,cy:0,rx:6,ry:4.5,fill:'#1c1a17'},g);
    el('circle',{cx:0,cy:-4,r:3.5,fill:'#1c1a17'},g);
    var dx=rr(500,800)*(rnd()<.5?1:-1);
    g.animate([
      {transform:'translate('+x+'px,'+y+'px)',opacity:1},
      {transform:'translate('+(x+dx*0.5)+'px,'+(y-60)+'px)',opacity:1},
      {transform:'translate('+(x+dx)+'px,'+(y-140)+'px)',opacity:0}
    ],{duration:rr(4000,6000),easing:'ease-out'}).onfinish=function(){ g.remove(); };
  }
  function leaf(){
    var x=rr(50,950), e=el('path',{d:'M0 0 C 5 -6 11 -6 14 0 C 11 6 5 6 0 0 Z',fill:'#b98a55',opacity:.85},fxG);
    e.animate([
      {transform:'translate('+x+'px,-10px) rotate(0deg)'},
      {transform:'translate('+(x+40)+'px,400px) rotate(200deg)'},
      {transform:'translate('+(x-30)+'px,800px) rotate(420deg)',opacity:.6}
    ],{duration:rr(6000,9000),easing:'linear'}).onfinish=function(){ e.remove(); };
  }
  setInterval(leaf,1600);
  svg.addEventListener('click',function(e){
    if(e.target.classList.contains('skyrect')){
      var m=svg.getScreenCTM().inverse(), p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);
      if(p.y<500) bat(p.x,p.y);
    }
  });
  document.getElementById('moonG').addEventListener('click',function(ev){
    ev.stopPropagation();
    var mg=document.getElementById('moonG');
    mg.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:800,easing:'ease-in-out'});
    bat(600,180); bat(700,240);
  });

  /* تلميحات */
  document.querySelectorAll('[data-name]').forEach(function(g){
    g.addEventListener('pointerenter',function(){ tip.textContent=g.dataset.name; tip.style.opacity=1; });
    g.addEventListener('pointermove',function(e){ tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-8)+'px'; });
    g.addEventListener('pointerleave',function(){ tip.style.opacity=0; });
  });

  /* بارالاكس */
  var tx=0,ty=0,cx2=0,cy2=0;
  window.addEventListener('pointermove',function(e){ tx=(e.clientX/window.innerWidth)*2-1; ty=(e.clientY/window.innerHeight)*2-1; });
  (function loop(){
    cx2+=(tx-cx2)*0.06; cy2+=(ty-cy2)*0.06;
    [layerBack,layerMid,layerFront].forEach(function(L){
      var d=parseFloat(L.dataset.depth);
      L.style.transform='translate('+(cx2*d)+'px,'+(cy2*d*0.4)+'px)';
    });
    requestAnimationFrame(loop);
  })();

  /* أزرار */
  var nightBtn=document.getElementById('nightBtn');
  nightBtn.addEventListener('click',function(){
    svg.classList.toggle('night');
    nightBtn.textContent=svg.classList.contains('night')?'☀️ وضع النهار':'🌙 وضع الليل';
  });
  document.getElementById('batsBtn').addEventListener('click',function(){
    for(var i=0;i<5;i++)(function(i){ setTimeout(function(){ bat(rr(100,900),rr(120,400)); },i*300); })(i);
  });
  document.getElementById('lightBtn').addEventListener('click',function(){
    var wins=Array.prototype.slice.call(document.querySelectorAll('.win'));
    var allLit=wins.every(function(w){ return w.classList.contains('lit'); });
    wins.forEach(function(w){ w.classList.toggle('lit',!allLit); });
  });
  document.getElementById('resetBtn').addEventListener('click',function(){ location.reload(); });
})();
</script>
</body>
</html>
