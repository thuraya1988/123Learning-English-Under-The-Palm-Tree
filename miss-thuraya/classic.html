"use strict";
/* ============================================================
   مس ثريا — دماغ محلّي يعرف كتاب الصفّ الخامس 5A كاملاً،
   وإن فُعّل مفتاح الـAPI انضمّ إليه وضعٌ ذكيّ للأسئلة الحرّة.
   ============================================================ */

/* ---------- ١) المنهج ---------- */
const IRREGULAR = {
  be:'was/were', buy:'bought', do:'did', drink:'drank', drive:'drove', eat:'ate', find:'found',
  get:'got', give:'gave', go:'went', have:'had', hold:'held', keep:'kept', know:'knew', lose:'lost',
  make:'made', put:'put', ride:'rode', run:'ran', see:'saw', sell:'sold', send:'sent', sing:'sang',
  sleep:'slept', stand:'stood', take:'took', tell:'told', throw:'threw', wear:'wore', win:'won', write:'wrote'
};
const PARTICIPLE = {
  be:'been', buy:'bought', do:'done', drink:'drunk', drive:'driven', eat:'eaten', find:'found',
  get:'got', give:'given', go:'gone/been', have:'had', hold:'held', keep:'kept', know:'known', lose:'lost',
  make:'made', put:'put', ride:'ridden', run:'run', see:'seen', sell:'sold', send:'sent', sing:'sung',
  sleep:'slept', stand:'stood', take:'taken', tell:'told', throw:'thrown', wear:'worn', win:'won', write:'written'
};
const IRREG_ADJ = {
  good:['better','the best'], bad:['worse','the worst'], far:['further','the furthest'],
  little:['less','the least'], many:['more','the most'], much:['more','the most']
};
const UNITS = [
  { n:0, name:'Welcome back', ar:'الترحيب', pages:'8–11',
    vocab:{'مراجعة':['What about…?','I\'m helping…','After we have lunch…','It was great to be back at school']},
    grammar:['مراجعة الفصل السابق: التعريف بالنفس والأصدقاء واليوم الدراسيّ.'] },
  { n:1, name:'Talent show', ar:'عرض المواهب', pages:'12–23',
    vocab:{

    },

    },
    grammar:['will','measure'] },
  { n:4, name:'Off to the shops', ar:'إلى المحلّات', pages:'48–59',
    vocab:{
      'المحلّات':["butcher's",'corner shop',"fishmonger's",'gift shop',"greengrocer's","jeweller's",'kiosk','pharmacy','phone shop','shoe shop','sports shop','toy shop'],
      'النقود (أسماء)':['money box','pocket money','purse','wallet'],
      'النقود (أفعال)':['buy','save','sell','spend']
    },
    grammar:['relative','haveto'] }
];
const WRITING = {
  1:{t:'وصف شخص',ar:'Unit 1 — My little sister',q:['من تتحدّث عنه؟','كيف يبدو؟','كيف طبعه؟','ماذا يحبّ أن يفعل؟','ما الذي تحبّه فيه؟'],
     model:'My little sister is called Zakeya and she\'s eight years old. She\'s got long, dark, curly hair. She is very important in my life because she is very kind. She likes sports and she loves playing games with me.'},
  2:{t:'زيارة متحف',ar:'Unit 2 — My visit to a museum',q:['متى وأين ذهبت؟','ما المميّز فيه؟','ماذا استطعت أن تفعل هناك؟','ماذا تعلّمت؟'],
     model:'On Saturday 3rd July, I visited the Natural History Museum of Oman in Muscat. It is special because you can learn about the plants, animals, deserts and mountains of Oman. You could see animals, birds, fish and there was also a whale! I learnt a lot about our amazing country.'},
  3:{t:'مدوّنة',ar:'Unit 3 — My blog',q:['ما الموضوع؟','ماذا تلبس؟','كيف يختلف عن الأرض؟'],

     model:'Hi, Basma. You asked for some advice about great shops to visit in my town. In the toy shop, you can buy some amazing kites. They are big, but they are not expensive. The toy shop is in the shopping mall, where there\'s a lot to see and do.'}
};

/* ---------- ٢) محرّكات القواعد ---------- */
const VOWEL='aeiou';
const isVowel=c=>VOWEL.includes(c);
function syllables(w){ const m=w.toLowerCase().replace(/e$/,'').match(/[aeiouy]+/g); return m?m.length:1; }
function isShortAdj(a){ return syllables(a)<=1 || (syllables(a)===2 && /(y|er|ow|le)$/.test(a)); }

function comparative(adj){
  const a=adj.toLowerCase().trim();
  if(IRREG_ADJ[a]) return {form:IRREG_ADJ[a][0], why:'صفة شاذّة — تُحفظ كما هي.'};
  if(!isShortAdj(a)) return {form:'more '+a, why:'صفة طويلة (مقطعان فأكثر) → نضع <code>more</code> قبلها.'};
  if(/[^aeiou]y$/.test(a)) return {form:a.slice(0,-1)+'ier', why:'تنتهي بحرف ساكن + <code>y</code> → نقلب الـy إلى <code>i</code> ونضيف <code>-er</code>.'};
  if(/e$/.test(a)) return {form:a+'r', why:'تنتهي بـ<code>e</code> → نضيف <code>-r</code> فقط.'};
  if(a.length>=3 && !isVowel(a.slice(-1)) && isVowel(a.slice(-2,-1)) && !isVowel(a.slice(-3,-2)) && !/[wxy]$/.test(a))
    return {form:a+a.slice(-1)+'er', why:'ساكن + متحرّك + ساكن → نُضاعف الحرف الأخير ونضيف <code>-er</code>.'};
  return {form:a+'er', why:'صفة قصيرة → نضيف <code>-er</code>.'};
}
function superlative(adj){
  const a=adj.toLowerCase().trim();
  if(IRREG_ADJ[a]) return {form:IRREG_ADJ[a][1], why:'صفة شاذّة — تُحفظ كما هي.'};
  if(!isShortAdj(a)) return {form:'the most '+a, why:'صفة طويلة → <code>the most</code> قبلها.'};
  const c=comparative(a).form;
  return {form:'the '+c.replace(/er$/,'est'), why:'صفة قصيرة → <code>the</code> + الصفة + <code>-est</code> (بنفس تغيّر الإملاء).'};
}
function pastSimple(verb){
  const v=verb.toLowerCase().trim();
  if(IRREGULAR[v]) return {form:IRREGULAR[v], why:'فعل شاذّ — من قائمة الأفعال الشاذّة في آخر الكتاب (صفحة ٧٤).', irr:true};
  if(/e$/.test(v)) return {form:v+'d', why:'ينتهي بـ<code>e</code> → نضيف <code>-d</code> فقط.'};
  if(/[^aeiou]y$/.test(v)) return {form:v.slice(0,-1)+'ied', why:'ساكن + <code>y</code> → نقلب الـy إلى <code>i</code> ونضيف <code>-ed</code> (مثل <code>try → tried</code>).'};
  if(v.length>=3 && !isVowel(v.slice(-1)) && isVowel(v.slice(-2,-1)) && !isVowel(v.slice(-3,-2)) && !/[wxy]$/.test(v))
    return {form:v+v.slice(-1)+'ed', why:'ساكن + متحرّك + ساكن → نُضاعف الحرف الأخير ونضيف <code>-ed</code> (مثل <code>stop → stopped</code>).'};
  return {form:v+'ed', why:'فعل منتظم → نضيف <code>-ed</code> (مثل <code>play → played</code>).'};
}
function ing(verb){
  const v=verb.toLowerCase().trim();
  if(/ie$/.test(v)) return v.slice(0,-2)+'ying';
  if(/e$/.test(v) && v!=='be') return v.slice(0,-1)+'ing';
  if(v.length>=3 && !isVowel(v.slice(-1)) && isVowel(v.slice(-2,-1)) && !isVowel(v.slice(-3,-2)) && !/[wxy]$/.test(v))
    return v+v.slice(-1)+'ing';
  return v+'ing';
}

/* ---------- ٣) شروح القواعد ---------- */
const G = {
  comparative:{
    title:'المقارنة والتفضيل — Comparatives & Superlatives (الوحدة ١)',
    body:`نستعمل <b>المقارنة</b> بين اثنين، و<b>التفضيل</b> لواحدٍ بين الجميع.

<b>١) الصفات القصيرة</b> (مقطع واحد)
<code>kind → kinder than → the kindest</code>
مثال الكتاب: <code>Zaid is kinder than Qais.</code>
<code>My friends are the quietest in the library.</code>

<b>٢) الصفات الطويلة</b> (مقطعان فأكثر) → <code>more</code> و<code>the most</code>
<code>hard-working → more hard-working than → the most hard-working</code>
مثال الكتاب: <code>My brother is more hard-working than my sister.</code>
<code>Jasim and Younis are the most confident students in class.</code>

<b>٣) الشاذّة</b> — تُحفظ:
<code>good → better → the best</code>
<code>bad → worse → the worst</code>
مثال الكتاب: <code>Noora is the best at juggling.</code>

<b>تغيّرات الإملاء</b>
<code>shy → shier → the shiest</code> (ساكن + y ← i)
<code>big → bigger → the biggest</code> (مضاعفة الحرف الأخير)

اكتب لي أيّ صفة وأصرّفها لك فوراً — جرّب: <b>صرّفي tidy</b>`
  },
  goodat:{
    title:'be good / great / terrible at + V-ing (الوحدة ١)',
    body:`نتحدّث عن المهارة بـ<code>be + صفة + at + فعل ينتهي بـ-ing</code>.

<code>I <b>am</b> great at juggling.</code>
<code>He / She / It <b>is</b> good at spelling.</code>
<code>You / They <b>are</b> not very good at making pizza.</code>
<code>She <b>is</b> terrible at throwing a ball.</code>

انتبه: بعد <code>at</code> يأتي الفعل بـ<code>-ing</code> دائماً.
<code>make → making</code> · <code>bake → baking</code> · <code>juggle → juggling</code>`
  },
  past:{
    title:'الماضي البسيط — Past simple (الوحدة ٢)',
    body:`<b>المثبت</b> — الفعل في الماضي مع كلّ الضمائر:
<code>I lost the race two days ago.</code>

<b>المنفي</b> — <code>didn't</code> + الفعل في المصدر (بلا ماضٍ!):
<code>I didn't play football last month.</code>

<b>السؤال</b> — <code>Did</code> + الفاعل + المصدر:
<code>Did you use the tablet?</code>
<code>Did he find the email?</code>
الجواب: <code>Yes, I did.</code> / <code>No, I didn't.</code>

<b>تغيّرات الإملاء (الأفعال المنتظمة)</b>
<code>play → played</code> · <code>try → tried</code> · <code>stop → stopped</code>

<b>الأفعال الشاذّة</b> — من قائمة صفحة ٧٤:
<code>have → had</code> · <code>give → gave</code> · <code>go → went</code> · <code>write → wrote</code>

اكتب لي أيّ فعل وأصرّفه لك — جرّب: <b>ماضي verb send</b>`
  },
  could:{
    title:'could / couldn\'t (الوحدة ٢)',
    body:`نتحدّث عن قدرةٍ في الماضي.

<b>المثبت</b>: <code>I could throw a ball at the age of one.</code>
<b>المنفي</b>: <code>She couldn't spell words at the age of one.</code>
<b>السؤال</b>: <code>What could you do at the age of five?</code>
<code>Could they write an email?</code>
الجواب: <code>Yes, I could.</code> / <code>No, I couldn't.</code>

انتبه: بعد <code>could</code> يأتي الفعل في المصدر دائماً — بلا <code>to</code> وبلا <code>-ed</code>.`
  },
  will:{
    title:'المستقبل — will / won\'t (الوحدة ٣)',
    body:`<b>المثبت</b>: <code>I will travel to space next week.</code>
<b>المنفي</b>: <code>They won't go on Tuesday.</code> (<code>won't = will not</code>)
<b>السؤال</b>: <code>Will you write the email?</code>
<code>Will he wear the spacesuit?</code>
الجواب: <code>Yes, I will.</code> / <code>No, I won't.</code>

القاعدة الذهبيّة: بعد <code>will</code> الفعل في المصدر — مع كلّ الضمائر، بلا <code>s</code>.
✗ <code>He will goes</code> ✓ <code>He will go</code>`
  },
  measure:{
    title:'القياسات — Measurements (الوحدة ٣)',
    body:`نسأل عن الحجم بـ<code>How</code> + صفة القياس:

<code>How <b>high</b> is the mountain?</code> — الارتفاع
<code>How <b>deep</b> is the lake?</code> — العمق
<code>How <b>far</b> are the houses?</code> — البُعد
<code>How <b>wide</b> are the houses?</code> — العرض

<b>الجواب</b>:
<code>It's 5,400 metres high.</code>
<code>It's 5 metres deep.</code>
<code>They're 2 metres from my house.</code>
<code>They're 20 metres wide.</code>

انتبه: للمفرد <code>It's</code> وللجمع <code>They're</code>، والوحدة قبل الصفة.`
  },
  relative:{
    title:'جمل الوصل — who / which / where (الوحدة ٤)',
    body:`نصل جملتين بكلمةٍ واحدة حسب نوع ما نتحدّث عنه:

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){
  return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
               .replace(/&lt;code&gt;/g,'<code>').replace(/&lt;\/code&gt;/g,'</code>')
               .replace(/&lt;i&gt;/g,'<i>').replace(/&lt;\/i&gt;/g,'</i>')
               .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
               .replace(/`([^`]+)`/g,'<code>$1</code>')
               .replace(/&lt;say&gt;(.+?)&lt;\/say&gt;/g,
                 (m,w)=>'<button type="button" class="say" data-t="'+w.replace(/"/g,'&quot;')+'">\ud83d\udd0a اسمعها</button>');
}
function bubble(who,html){

function addSayButtons(root){
  root.querySelectorAll('code').forEach(c=>{

    if(c.nextElementSibling&&c.nextElementSibling.classList.contains('say')) return;
    const b=document.createElement('button');
    b.type='button'; b.className='say'; b.textContent='🔊';
    b.setAttribute('aria-label','استمع إلى: '+txt);
    b.dataset.t=txt;
    c.insertAdjacentElement('afterend',b);
  });
}

/* هل الصوت النسائيّ مثبَّتٌ فعلاً على الخادم؟
   إن لم يكن، فالخادم يردّ بصوت alan الرجاليّ — ومس ثريا لا تتكلّم بصوت رجل.
   فنسأله مرّةً عن قائمة أصواته، وإن لم يكن فيها صوتُنا استعملنا صوت الجهاز. */
let femOk=null, femAsked=false, femWhy='';
function piperBase(){ return String(window.PIPER_TTS_ENDPOINT||'').replace(/\/synthesize$/,''); }
async function checkFemale(){
  if(femOk!==null) return femOk;
  if(femAsked) return null;
  femAsked=true;
  try{
    const base=piperBase(); if(!base) throw 0;
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),8000);
    const r=await fetch(base+'/',{cache:'no-store',signal:c.signal});
    clearTimeout(t);
    const j=await r.json();
    femOk = Array.isArray(j.voices) && j.voices.indexOf(window.PIPER_VOICE_EN)>=0;
    femWhy = femOk?'':'missing';
  }catch(e){ femOk=false; femWhy='offline'; }
  finally{ femAsked=false; }
  if(femOk===false && V.engine==='piper')
    vNote_( (femWhy==='offline'
        ? 'لم أصل إلى خادم Piper (قد يكون نائماً)، '
        : 'الصوت النسائيّ غير مثبَّتٍ على خادم Piper بعد — أعيدي بناء المساحة على HuggingFace، ')
      + 'فاستعملتُ صوت جهازك النسائيّ.');
  return femOk;
}
if(piperOn()) checkFemale();
/* أسماء الأصوات النسائيّة الشائعة في الأجهزة — مس ثريا لا تتكلّم بصوت رجل */
const FEM=/female|samantha|karen|serena|moira|tessa|fiona|victoria|allison|ava|susan|zira|hazel|sonia|libby|martha|catherine|amelie|nicky|kate|emma|joanna/i;
function webVoice(){
  if(!('speechSynthesis' in window)) return null;
  const list=(window.piperNativeVoices?window.piperNativeVoices():speechSynthesis.getVoices())||[];
  const en=list.filter(v=>/^en/i.test(v.lang));
  const gb=en.filter(v=>/^en-GB/i.test(v.lang));
  return gb.find(v=>FEM.test(v.name)) || en.find(v=>FEM.test(v.name))
      || gb[0] || en[0] || null;
}
function speak(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ vNote_('متصفّحك لا يدعم النطق. جرّب Chrome.'); return; }
  if(V.cur&&V.cur!==btn) V.cur.classList.remove('on');
  V.cur=btn||null; if(btn) btn.classList.add('on');
  try{ speechSynthesis.cancel(); }catch(e){}

  const u=new SpeechSynthesisUtterance(text);
  const v=webVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
  u.rate=.9;                                  /* أبطأ قليلاً — الطالب يتعلّم */
  const off=()=>{ if(btn) btn.classList.remove('on'); };
  u.onend=off; u.onerror=off;
  /* لا نمرّ على Piper إلّا إذا تأكّدنا أنّ صوته النسائيّ موجود */
  const usePiper = V.engine==='piper' && femOk===true;
  if(!usePiper && window.piperNativeSpeak) window.piperNativeSpeak(u);
  else speechSynthesis.speak(u);              /* الشيم يحوّلها إلى Piper */
  if(V.engine==='piper' && femOk===null) checkFemale();
  setTimeout(off,12000);                      /* شبكة أمان لو لم يصل حدث النهاية */
}

/* فهرسة القاموس */
const DICT=[];
for(const un in VOCAB) for(const cat in VOCAB[un]) VOCAB[un][cat].forEach(row=>{
  const p=row.split('|');
  DICT.push({w:p[0],em:p[1],ar:p[2],ex:p[3],ea:p[4],u:+un,cat:cat});
});

/* ---------- ٥-ب) البحث بالعربيّة أو الإنجليزيّة ---------- */
const AR2LAT={'ا':'a','أ':'a','إ':'a','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh',
 'د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a',
 'غ':'gh','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'h','و':'w','ي':'y',
 'ى':'a','ء':'','ئ':'','ؤ':'w','چ':'ch','ڤ':'v','پ':'b','گ':'g'};
function translit(s){ return s.split('').map(c=>AR2LAT[c]!==undefined?AR2LAT[c]:c).join(''); }
/* هيكل الكلمة: حروفها الصامتة فقط — ليتطابق «كاونت» مع count */
function skel(s){
  return String(s).toLowerCase().replace(/[^a-z؀-ۿ]/g,'')
    .split('').map(c=>AR2LAT[c]!==undefined?AR2LAT[c]:c).join('')
    .replace(/c/g,'k').replace(/q/g,'k').replace(/x/g,'ks').replace(/p/g,'b').replace(/v/g,'f')
    .replace(/[aeiouwy]/g,'').replace(/(.)\1+/g,'$1');
}
const SKEL_IX={};
DICT.forEach(d=>{ const k=skel(d.w); if(!SKEL_IX[k]) SKEL_IX[k]=d; });

function lookupWord(q){
  const s=String(q).trim().toLowerCase().replace(/^(a|an|the)\s+/,'');
  if(!s) return null;
  let hit=DICT.find(d=>d.w.toLowerCase()===s);
  if(hit) return hit;
  hit=DICT.find(d=>d.w.toLowerCase().replace(/^(a|an)\s+/,'')===s);
  if(hit) return hit;
  const k=skel(s);
  if(k.length>=2 && SKEL_IX[k]) return SKEL_IX[k];
  /* بحثٌ بالمعنى العربيّ: «بيتزا» → make a pizza، «حصّالة» → money box */
  if(/[؀-ۿ]/.test(s) && s.length>=3){
    const ns=norm(s);
    hit=DICT.find(d=>norm(d.ar).split(/[·()]/).some(p=>p.trim()===ns));
    if(hit) return hit;
    hit=DICT.find(d=>norm(d.ar).indexOf(ns)>=0);
    if(hit) return hit;
  }
  return null;
}

function wordCard(d){
  const c=comparative(d.w), p=pastSimple(d.w);
  let s=`${d.em} <b>${d.w}</b> <say>${d.w}</say> — ${d.ar}\n\n`;
  s+=`<b>في جملة</b>\n<code>${d.ex}</code>\n${d.ea}\n\n`;
  s+=`<b>من</b> Unit ${d.u} — ${(UNITS.find(u=>u.n===d.u)||{}).name} · قائمة «${d.cat}» · <code>ص ${(UNITS.find(u=>u.n===d.u)||{}).pages}</code>`;
  if(IRREGULAR[d.w.toLowerCase()])
    s+=`\n\n<b>فعل شاذّ</b>: <code>${d.w} · ${IRREGULAR[d.w.toLowerCase()]} · ${PARTICIPLE[d.w.toLowerCase()]}</code>`;
  else if(/^[a-z-]+$/.test(d.w) && d.cat.indexOf('صفات')===0)
    s+=`\n\n<b>تصريفها</b>: <code>${c.form} than</code> · <code>${superlative(d.w).form}</code>`;
  else if(/^[a-z]+$/.test(d.w) && (d.cat==='أفعال'))
    s+=`\n\n<b>الماضي</b>: <code>${p.form}</code> · <b>مع -ing</b>: <code>${ing(d.w)}</code>`;
  return s;
}

/* كلمات وحدةٍ كاملةً مع معانيها */
function unitWords(n){
  const V=VOCAB[n]; if(!V) return null;
  const u=UNITS.find(x=>x.n===n)||{};
  let tot=0; for(const c in V) tot+=V[c].length;
  let s=`📗 <b>كلمات Unit ${n} — ${u.name}</b> · ${u.ar}  <code>ص ${u.pages}</code>\n<i>${tot} كلمة، كلٌّ بمعناها.</i>\n`;
  for(const cat in V){
    s+=`\n<b>${cat}</b>\n`;
    V[cat].forEach(row=>{ const p=row.split('|'); s+=`${p[1]} <code>${p[0]}</code> — ${p[2]}\n`; });
  }
  s+='\nاكتب أيّ كلمةٍ منها لأضعها لك في جملة، أو اكتب <b>بطاقات ' + n + '</b> لنتدرّب عليها.';
  return s;
}

/* ---------- ٥-ج) بطاقات الكلمات ---------- */
let cards=null;
function startCards(n){
  const pool=DICT.filter(d=>!n||d.u===n);
  if(!pool.length) return null;
  cards={list:pool.slice().sort(()=>Math.random()-0.5).slice(0,8),i:0,score:0};
  return cardQ();
}
function cardQ(){
  const d=cards.list[cards.i];
  return `🃏 <b>بطاقة ${cards.i+1} من ${cards.list.length}</b>\n\n${d.em} <code>${d.w}</code>\n\nما معناها بالعربيّة؟ اكتب معناها، أو اكتب <b>الجواب</b>.`;
}
function answerCard(txt){
  const d=cards.list[cards.i];
  const t=norm(txt).replace(/[ًٌٍَُِّْ]/g,'');
  const want=norm(d.ar).replace(/[()·]/g,' ').split(/\s+/).filter(x=>x.length>2);
  const ok = t.includes('جواب') ? null : want.some(w=>t.includes(w));
  let s = ok===null ? `💡 المعنى: <b>${d.ar}</b>\n<code>${d.ex}</code>\n${d.ea}\n`
        : ok ? `✅ <b>أحسنت!</b> ${d.w} = ${d.ar}\n<code>${d.ex}</code>\n`
             : `❌ ليس تماماً. ${d.w} = <b>${d.ar}</b>\n<code>${d.ex}</code>\n${d.ea}\n`;
  if(ok) cards.score++;
  cards.i++;
  if(cards.i>=cards.list.length){
    const sc=cards.score,tot=cards.list.length; cards=null;
    return s+`\n🏁 <b>انتهت البطاقات: ${sc} من ${tot}</b>\nاكتب <b>بطاقات</b> لجولةٍ جديدة.`;
  }
  return s+'\n'+cardQ();
}

/* ---------- ٥-د) بنك التمارين ---------- */
const EX={
 comparative:{t:'المقارنة — Comparative',
  items:[['New York is ____ than Washington.','big'],['The pink dress is ____ than the blue dress.','pretty'],
   ['This apartment is ____ than the other one.','large'],['I think this restaurant is ____ than the others.','cheap'],
   ['My dad is a lot ____ than your dad.','old'],['Climbing is ____ than hiking.','dangerous'],
   ['Spain is much ____ than Germany in summer.','hot'],['Mars is ____ to the Sun than Neptune.','close']],
  solve:w=>comparative(w)},
 superlative:{t:'التفضيل — Superlative',
  items:[['Mercury is ____ planet in the solar system.','small'],['The blue whale is ____ animal on our planet.','big'],
   ['Mount Everest is ____ mountain on Earth.','high'],['Kate is ____ girl in the classroom.','hard-working'],
   ['Mr Brown is ____ teacher ever.','nice'],['I think English is ____ language to learn.','easy'],
   ['Jack is ____ person I have ever met.','intelligent'],['This is ____ film I have ever watched.','bad']],
  solve:w=>superlative(w)},
 past:{t:'الماضي البسيط — Past simple',
  items:[['I ____ the race two days ago.','lose'],['She ____ to school yesterday.','go'],
   ['We ____ English last night.','study'],['He ____ the heavy bag.','carry'],
   ['They ____ a sandwich for lunch.','make'],['I ____ a book last week.','buy'],
   ['You ____ a story to us.','tell'],['She ____ the race last year.','win']],
  solve:w=>pastSimple(w)},
 ing:{t:'بعد at تأتي -ing',
  items:[['She is terrible at ____ a ball.','throw'],['He is good at ____ toys.','fix'],
   ['I am great at ____ a cake.','bake'],['They are good at ____ experiments.','do'],
   ['We are not very good at ____ chess.','play'],['Ali is great at ____ words.','spell']],
  solve:w=>({form:ing(w),why:'بعد <code>at</code> يأتي الفعل بصيغة <code>-ing</code>.'})}
};
let ex=null;
function startEx(key){
  const b=EX[key]; if(!b) return null;
  ex={k:key,i:0,score:0,list:b.items.slice().sort(()=>Math.random()-0.5)};
  return `✏️ <b>تمارين ${b.t}</b> — ${ex.list.length} أسئلة.\nاكتب الكلمة الصحيحة فقط.\n\n<b>١)</b> <code>${ex.list[0][0]}</code>  <i>(${ex.list[0][1]})</i>`;
}
function answerEx(txt){
  const b=EX[ex.k], it=ex.list[ex.i], sol=b.solve(it[1]);
  const want=String(sol.form).toLowerCase().replace(/^the\s+/,'');
  const got=norm(txt).replace(/[.،,!؟?]/g,'').replace(/^the\s+/,'');
  const ok = got===want || got===String(sol.form).toLowerCase();
  if(ok) ex.score++;
  let s = ok ? `✅ <b>صحيح!</b> <code>${sol.form}</code>\n`
             : `❌ الإجابة: <code>${sol.form}</code>\n<i>${sol.why}</i>\n`;
  ex.i++;
  const AR='١٢٣٤٥٦٧٨';
  if(ex.i>=ex.list.length){
    const sc=ex.score,tot=ex.list.length,k=ex.k; ex=null;
    s+=`\n🏁 <b>${sc} من ${tot}</b>\n`;
    s+= sc===tot?'ممتاز! أتقنتَ القاعدة 🌟':'اكتب <b>اشرحي '+(k==='past'?'الماضي البسيط':'المقارنة')+'</b> لنراجعها، ثمّ أعِد التمرين.';
    return s;
  }
  return s+`\n<b>${AR[ex.i]})</b> <code>${ex.list[ex.i][0]}</code>  <i>(${ex.list[ex.i][1]})</i>`;
}
function exMenu(){
  let s='✏️ <b>التمارين</b> — اختر واحداً:\n\n';
  for(const k in EX) s+=`• <b>تمارين ${EX[k].t.split(' — ')[0]}</b>\n`;
  s+='\nأو اكتب <b>اختبريني</b> لاختبارٍ شاملٍ من كلّ الوحدات.';
  return s;
}

  });
  s+='\nوفي آخر الكتاب: نماذج الكتابة (ص ٦٦) · الإملاء (ص ٧٠) · الأفعال الشاذّة (ص ٧٤) · قصص القراءة (ص ٧٦).\n\nاكتب مثلاً: <b>الوحدة ٢</b> لأعرض لك كلماتها وقواعدها.';
  return s;

function unitDetail(n){
  const u=UNITS.find(x=>x.n===n); if(!u) return null;
  let s=`📗 <b>${u.n===0?'Welcome back':'Unit '+u.n+' — '+u.name}</b> · ${u.ar}  <code>ص ${u.pages}</code>\n\n<b>الكلمات</b>\n`;
  if(VOCAB[n]){
    let tot=0; for(const c in VOCAB[n]) tot+=VOCAB[n][c].length;
    for(const c in VOCAB[n]) s+=`• ${c}: <code>${VOCAB[n][c].map(r=>r.split('|')[0]).join(' · ')}</code>\n`;
    s+=`\n<i>${tot} كلمة</i> — اكتب <b>كلمات الوحدة ${n}</b> لتراها كلَّها بمعانيها وجملها.\n`;
  } else {
    for(const k in u.vocab) s+=`• ${k}: <code>${u.vocab[k].join(' · ')}</code>\n`;
  }
  s+='\n<b>القواعد</b>\n';
  u.grammar.forEach(g=>{ s+= G[g] ? `• ${G[g].title}\n` : `• ${g}\n`; });
  if(WRITING[u.n]) s+=`\n<b>الكتابة</b>: ${WRITING[u.n].t} — اكتب <b>نموذج ${u.n}</b> لتراه.`;
  s+=`\n\n🃏 <b>بطاقات ${n}</b> للحفظ · ✏️ <b>تمارين</b> للتدرّب.`;
  return s;
}

function startQuiz(){
  quiz={i:0,score:0,items:QBANK.slice().sort(()=>Math.random()-0.5).slice(0,6)};
  return '🧠 <b>اختبار سريع — ٦ أسئلة</b>\nاكتب الإجابة فقط.\n\n<b>١)</b> <code>'+quiz.items[0].q+'</code>';

function answerQuiz(txt){
  const it=quiz.items[quiz.i];
  const ok=norm(txt).replace(/[.،,!؟?]/g,'')===norm(it.a).replace(/[.،,!؟?]/g,'');
  let s= ok ? '✅ <b>صحيح!</b>\n' : `❌ ليس بعد. الإجابة: <code>${it.a}</code>\n<i>${it.hint}</i>\n`;
  if(ok) quiz.score++;
  quiz.i++;
  if(quiz.i>=quiz.items.length){
    const sc=quiz.score, tot=quiz.items.length; quiz=null;
    s+=`\n🏁 <b>انتهى الاختبار: ${sc} من ${tot}</b>\n`;
    s+= sc===tot?'ممتاز! أنت جاهز للامتحان 🌟' : sc>=tot/2?'جيّد! راجع القاعدة التي أخطأت فيها.' : 'لا بأس — اكتب <b>اشرحي المقارنة</b> أو <b>اشرحي الماضي البسيط</b> ولنراجع معاً.';
    return s;
  }
  s+=`\n<b>${'١٢٣٤٥٦'[quiz.i]})</b> <code>${quiz.items[quiz.i].q}</code>`;
  return s;
}

function localBrain(raw){
  const t=norm(raw);
  /* الخروج من تمرينٍ جارٍ — بكلمة خروج، أو ببدء أمرٍ جديد */
  if(quiz||ex||cards){
    if(has(t,'خروج','اخرج','توقف','كفي','كفايه','بس خلاص','stop','exit','الغاء','رجوع')){

    }
    if(/^(كلمات|مفردات|الوحدات|الوحده|وحده|unit|يونت|اشرحي|اشرح|تمارين|بطاقات|اختبرني|اختبريني|نماذج|الافعال|ما هو|ما هي|شرح|صرفي|ماضي)/.test(t)
      || has(t,'ويش يعني','ايش يعني','ما معنى','معنى كلمه','شو يعني','اشرحي','اشرح لي')
      || raw.indexOf('__')>=0){
      quiz=null; ex=null; cards=null;
    }
  }
  if(quiz) return answerQuiz(raw);
  if(ex)   return answerEx(raw);
  if(cards)return answerCard(raw);

  if(has(t,'سلام','مرحب','هلا','هاي','hello','hi ','صباح','مساء'))
    return 'وعليكم السلام 🌷 أنا <b>مس ثريا</b>، معلّمتك للصفّ الخامس.\nأشرح القواعد، وأحلّ أسئلة الكتاب، وأجيب عن كلّ ما يخصّ المنهج.\nاختر من الأزرار تحت، أو اسألني مباشرة.';

  const knowledgeAnswer=window.G5_KB&&window.G5_KB.answer(raw);
  if(knowledgeAnswer) return knowledgeAnswer;

  if(has(t,'وحدات','الوحدات','محتويات','فهرس','units','contents')) return unitsList();

  /* رقم الوحدة: رقماً، أو كلمةً عربيّة، أو إنجليزيّةً مكتوبةً بحروفٍ عربيّة (يونت ون) */
  const UNUM={'١':1,'٢':2,'٣':3,'٤':4,'واحد':1,'اثنين':2,'ثلاث':3,'اربع':4,
    'الاولي':1,'اولي':1,'الثانيه':2,'ثانيه':2,'الثالثه':3,'ثالثه':3,'الرابعه':4,'رابعه':4,
    'ون':1,'one':1,'تو':2,'two':2,'ثري':3,'تري':3,'three':3,'فور':4,'four':4};
  const UNW='[0-4]|١|٢|٣|٤|الاولي|اولي|واحد|الثانيه|ثانيه|اثنين|الثالثه|ثالثه|ثلاث|الرابعه|رابعه|اربع|ون|one|تو|two|ثري|تري|three|فور|four';
  const unum=x=>UNUM[x]!==undefined?UNUM[x]:parseInt(x,10);

  /* «كلمات الوحدة الأولى» / «كلمات يونت ون» → القائمة كاملةً بمعانيها */
  const kw=t.match(new RegExp('(?:كلمات|مفردات|قاموس|vocabulary|vocab|words)\\s*(?:ال)?\\s*(?:وحده|وحدة|unit|يونت)?\\s*(?:ال)?\\s*('+UNW+')'));
  if(kw){ const w=unitWords(unum(kw[1])); if(w) return w; }
  const kw2=t.match(new RegExp('(?:وحده|وحدة|unit|يونت)\\s*(?:ال)?\\s*('+UNW+')\\s*(?:كلمات|مفردات|words)'));
  if(kw2){ const w=unitWords(unum(kw2[1])); if(w) return w; }
  if(has(t,'كلمات الربط','كلمات ربط','ادوات الربط')) return G.connect.title+'\n\n'+G.connect.body;
  if(has(t,'كلمات الوصل','كلمات وصل')) return G.relative.title+'\n\n'+G.relative.body;
  if(has(t,'كلمات','مفردات','vocabulary','قاموس') && !/[A-Za-z]{3,}/.test(raw.replace(/unit|vocab\w*|words/gi,'')))
    return 'أيّ وحدةٍ تريد كلماتها؟ اكتب مثلاً <b>كلمات الوحدة ١</b> أو <b>كلمات يونت ون</b>.\n\nأو اكتب أيّ كلمةٍ إنجليزيّة وأعطيك معناها مع جملةٍ عليها.';

  const um=t.match(new RegExp('(?:وحده|وحدة|unit|يونت)\\s*(?:ال)?\\s*('+UNW+')'));
  if(um){ const d=unitDetail(unum(um[1])); if(d) return d; }

  /* بطاقات الكلمات */
  if(has(t,'بطاقات','بطاقه','flashcard','cards','حفظ الكلمات')){
    const bn=t.match(new RegExp('('+UNW+')\\s*$'));
    const c=startCards(bn?unum(bn[1]):0);
    if(c) return c;
  }

  /* التمارين */
  if(has(t,'تمارين','تمرين','exercise','مسائل','اسئله على','أسئلة على')){
    if(has(t,'تفضيل','superlative','the most','est')) return startEx('superlative');
    if(has(t,'مقارنه','مقارنة','comparative','than')) return startEx('comparative');
    if(has(t,'ماضي','past')) return startEx('past');
    if(has(t,'ing','اي ان جي','good at','at ')) return startEx('ing');
    return exMenu();
  }

  if(has(t,'الافعال الشاذه','افعال شاذه','irregular','قائمه الافعال')) return irregularTable();
  if(has(t,'نماذج الكتابه','نماذج كتابه','writing model','الكتابه')) {
    const wm=t.match(/نموذج\s*([1-4]|١|٢|٣|٤)/);
    if(wm){ const map={'١':1,'٢':2,'٣':3,'٤':4}; const n=map[wm[1]]||parseInt(wm[1],10); const w=writingModel(n); if(w) return w; }
    return writingModels();
  }
  const wm2=t.match(/نموذج\s*([1-4]|١|٢|٣|٤)/);
  if(wm2){ const map={'١':1,'٢':2,'٣':3,'٤':4}; const n=map[wm2[1]]||parseInt(wm2[1],10); const w=writingModel(n); if(w) return w; }

  if(has(t,'اختبرني','اختبريني','اختبار','quiz','تمرين','مرني','امتحان')) return startQuiz();

  /* تصريف مباشر */
  const FILL='(?:of\\s+|for\\s+|the\\s+|form\\s+of\\s+|كلمه\\s+|كلمة\\s+|لي\\s+)*';
  /* كلماتٌ لا تصلح أن تكون هي الكلمة المطلوب تصريفها */
  const STOP=/^(of|for|the|a|an|is|are|was|were|simple|tense|verb|adjective|word|form|and|to|in|on|please|me|my)$/i;
  let m=raw.match(new RegExp('(?:صرفي|صرّفي|صرف|قارن|مقارنة|مقارنه|comparative|superlative)\\s+'+FILL+'([A-Za-z-]{2,})','i'));
  if(m&&STOP.test(m[1])) m=null;
  if(m){ const a=m[1]; const c=comparative(a), s=superlative(a);
    return `⚖️ <b>${a}</b>\nالمقارنة: <code>${c.form} than</code>\nالتفضيل: <code>${s.form}</code>\n\n<b>لماذا؟</b> ${c.why}\n\nمثال: <code>Ali is ${c.form} than Salim.</code>\n<code>Ali is ${s.form} in the class.</code>`;
  }
  m=raw.match(new RegExp('(?:ماضي|الماضي|past)\\s+(?:verb\\s+|tense\\s+|simple\\s+)?'+FILL+'([A-Za-z]{2,})','i'));
  if(m&&STOP.test(m[1])) m=null;
  if(m){ const v=m[1].toLowerCase(); const p=pastSimple(v);
    return `⏳ <b>${v}</b>\nالماضي: <code>${p.form}</code>${PARTICIPLE[v]?'\nالتصريف الثالث: <code>'+PARTICIPLE[v]+'</code>':''}\n\n<b>لماذا؟</b> ${p.why}\n\n<code>I ${p.irr?p.form.split('/')[0]:p.form} yesterday.</code>\n<code>I didn't ${v} yesterday.</code>\n<code>Did you ${v} yesterday?</code>`;
  }
  m=raw.match(/(?:ing|اي ان جي)\s+([A-Za-z]+)/i);
  if(m) return `<code>${m[1]} → ${ing(m[1])}</code>\nبعد <code>at</code> أو مع الاستمرار نستعمل هذه الصيغة.`;

  /* شروح القواعد */
  if(has(t,'مقارنه','تفضيل','comparative','superlative','er ','the most','more than')) return G.comparative.title+'\n\n'+G.comparative.body;
  if(has(t,'good at','great at','terrible at','ماهر','بارع')) return G.goodat.title+'\n\n'+G.goodat.body;
  if(has(t,'الماضي البسيط','ماضي بسيط','past simple','did','didnt',"didn't")) return G.past.title+'\n\n'+G.past.body;
  if(has(t,'could','كود','قدره في الماضي')) return G.could.title+'\n\n'+G.could.body;
  if(has(t,'المستقبل','will','wont',"won't")) return G.will.title+'\n\n'+G.will.body;
  if(has(t,'قياس','القياسات','how high','how deep','how far','how wide','measurement')) return G.measure.title+'\n\n'+G.measure.body;
  if(has(t,'جمل الوصل','who which','which where','relative','الوصل')) return G.relative.title+'\n\n'+G.relative.body;
  if(has(t,'have to','has to','واجب','لازم')) return G.haveto.title+'\n\n'+G.haveto.body;
  if(has(t,'on in at','حروف الزمن','حروف الجر','in on at','preposition','الظروف الزمنيه')) return G.prep.title+'\n\n'+G.prep.body;
  if(has(t,'because','so ','ادوات الربط','كلمات الربط','and or but','connectors','لان','لذا')) return G.connect.title+'\n\n'+G.connect.body;
  if(has(t,'before','after','قبل وبعد','before and after')) return G.beforeafter.title+'\n\n'+G.beforeafter.body;
  if(has(t,'present continuous','مضارع مستمر','المستمر','ing الان')) return G.prescont.title+'\n\n'+G.prescont.body;
  if(has(t,'present simple','مضارع بسيط','المضارع البسيط')) return G.pressimple.title+'\n\n'+G.pressimple.body;
  if(has(t,'pronoun','الضمائر','ضمائر')) return G.pronouns.title+'\n\n'+G.pronouns.body;
  if(has(t,'when','عندما')) return G.whenc.title+'\n\n'+G.whenc.body;

  /* بحث في الكلمات — مفردةً، أو داخل سؤالٍ («معنى كلمة count»، «ويش يعني كاونت») */
  let word=null, asked=false;
  const bare=raw.trim().replace(/[?؟.!]+$/,'').toLowerCase();
  const qm=raw.match(/(?:ما معنى|معنى|معني|وش يعني|ويش يعني|ايش يعني|شو يعني|وش تعني|ترجمة|ترجمه|meaning|means|كلمة|كلمه)\s+(?:كلمة\s+|كلمه\s+|of\s+|the\s+|word\s+)*([A-Za-z'؀-ۿ -]{2,26})/i);
  if(qm){ word=qm[1].trim().replace(/[?؟.!]+$/,'').toLowerCase(); asked=true; }
  else if(/^[a-z' -]{2,26}$/.test(bare)) word=bare;

  if(word){
    const d=lookupWord(word);
    if(d) return wordCard(d);
    const lw=word.replace(/[^a-z]/g,'');
    if(lw && IRREGULAR[lw])
      return `📖 <code>${lw} → ${IRREGULAR[lw]} → ${PARTICIPLE[lw]}</code>\nفعل شاذّ من قائمة صفحة ٧٤.\n\n<code>I ${IRREGULAR[lw].split('/')[0]} yesterday.</code>`;
    for(const u of UNITS) for(const k in u.vocab){
      const hit=u.vocab[k].find(w=>w.toLowerCase()===word);
      if(hit) return `📚 <code>${hit}</code>\nمن <b>${u.n===0?'Welcome':'Unit '+u.n+' — '+u.name}</b> · قائمة «${k}» · <code>ص ${u.pages}</code>`;
    }
    if(asked){
      /* سُئلتُ عن كلمةٍ بعينها لكنّها ليست في قوائم الكتاب */
      const near=lw.length>=2?DICT.filter(x=>x.w.toLowerCase().indexOf(lw)===0).slice(0,5).map(x=>x.em+' '+x.w):[];
      let s=`🔎 <code>${esc(word)}</code> ليست في قوائم كلمات كتاب <b>5A</b>.\n\n`;
      if(near.length) s+='هل تقصد؟ '+near.join(' · ')+'\n\n';
      s+='اكتب <b>كلمات الوحدة ١</b> (أو ٢ أو ٣ أو ٤) لترى كلّ كلمات الكتاب بمعانيها.';
      return s;
    }
  }

  /* حلّ فراغ — نجرّب الحلّ أوّلاً، ثمّ نرشد */
  if(raw.includes('__')||raw.includes('....')||raw.includes('؟؟')){
    const sol=solveBlank(raw);
    if(sol) return '✏️ <code>'+esc(raw.trim())+'</code>\n\n'+sol;
    return 'أرسل الجملة ومعها الكلمة بين قوسين، مثل:\n<code>Zaid is ____ (kind) than Qais.</code>\nوسأحلّها وأشرح القاعدة.\n\nأو اكتب <b>اختبريني</b> لنتمرّن معاً.';
  }
  return null;
}

/* حلّ فراغٍ ذكيّ بالقواعد */
function solveBlank(raw){
  const m=raw.match(/\(([A-Za-z ']+)\)/);
  if(!m) return null;
  const w=m[1].trim().toLowerCase();
  const neg=/not\s+/.test(w);
  const base=w.replace(/^not\s+/,'');
  const line=raw.toLowerCase();
  if(/than/.test(line)) { const c=comparative(base); return `الإجابة: <code>${c.form}</code>\n<b>القاعدة</b>: ${c.why}`; }
  if(/\bthe\b\s*_+/.test(line)||/most|est\b/.test(line)) { const s=superlative(base); return `الإجابة: <code>${s.form}</code>\n<b>القاعدة</b>: ${s.why}`; }
  if(/\bat\s+_+/.test(line)) return `الإجابة: <code>${ing(base)}</code>\n<b>القاعدة</b>: بعد <code>at</code> يأتي الفعل بـ<code>-ing</code>.`;
  if(/yesterday|ago|last |في الماضي/.test(line)){
    const p=pastSimple(base);
    return neg ? `الإجابة: <code>didn't ${base}</code>\n<b>القاعدة</b>: النفي في الماضي = <code>didn't</code> + المصدر (بلا تغيير).`
               : `الإجابة: <code>${p.form}</code>\n<b>القاعدة</b>: ${p.why}`;
  }
  if(/next |tomorrow|will/.test(line)) return neg?`الإجابة: <code>won't ${base}</code>`:`الإجابة: <code>will ${base}</code>\n<b>القاعدة</b>: بعد <code>will</code> يأتي المصدر مع كلّ الضمائر.`;
  const p=pastSimple(base);
  return `الأرجح: <code>${p.form}</code>\n<b>القاعدة</b>: ${p.why}\n\nلو كانت الجملة عن المستقبل فالإجابة <code>will ${base}</code>.`;
}

/* ---------- ٦) الوصل بالوضع الذكيّ ---------- */
async function askAI(question){
  const r=await fetch('/api/ask',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question,history:history.slice(-10)})
  });
  return r.json();
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const q=input.value.trim(); if(!q) return;
  input.value='';
  bubble('me',esc(q));
  history.push({role:'user',content:q});

  const local = localBrain(q) || solveBlank(q);
  if(local){
    say(local); history.push({role:'assistant',content:local.replace(/<[^>]+>/g,'')});
    return;
  }
  if(!aiOn){
    say('هذا السؤال خارج ما أحفظه من الكتاب 📘\nجرّب أن تسألني عن:\n• قاعدة من قواعد الوحدات الأربع\n• كلمة من كلمات الكتاب\n• تصريف صفة أو فعل — مثل <b>صرّفي big</b> أو <b>ماضي write</b>\n• أو اكتب <b>اختبريني</b>');
    return;
  }
  const t=typing();
  try{
    const r=await askAI(q);
    t.remove();
    if(r.ok){ say(r.answer); history.push({role:'assistant',content:r.answer}); }
    else say(r.message||'تعذّر الاتّصال الآن.');
  }catch(_){ t.remove(); say('تعذّر الاتّصال بالإنترنت. الدماغ المحلّي ما زال يعمل — جرّب سؤالاً من الكتاب.'); }
});
