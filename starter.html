<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>123 Let's Learn English Under The Big Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;overflow:hidden!important;overscroll-behavior:none;touch-action:none;font-family:"Tajawal",sans-serif;color:#6c5a3d;position:fixed;inset:0;}
.scene{position:fixed;inset:0;background:linear-gradient(180deg,#dff2ff 0%,#cde8ff 45%,#b9dcff 100%);overflow:hidden;}

/* الشمس */
.sun{position:absolute;top:18px;right:14%;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffde0,#ffe566 35%,#fdd835 70%,#f9a825);box-shadow:0 0 24px rgba(255,220,50,.9),0 0 60px rgba(255,210,30,.5);animation:sunPulse 4s ease-in-out infinite;z-index:2;}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* السحاب */
.cloud{position:absolute;z-index:5;pointer-events:none;animation:drift 22s ease-in-out infinite;}
.cb{position:relative;background:rgba(255,255,255,.96);border-radius:999px;}
.cb div{position:absolute;background:rgba(255,255,255,.96);border-radius:50%;}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
.cl1{top:30px;left:7%;animation-duration:24s;}
.cl2{top:75px;right:5%;animation-duration:30s;animation-direction:reverse;}
.cl3{top:15px;left:36%;animation-duration:20s;}
.cl4{top:105px;left:20%;animation-duration:28s;animation-direction:reverse;}
.cl5{top:50px;right:26%;animation-duration:26s;}

/* الفراشات */
.bf{position:absolute;font-size:24px;z-index:3;pointer-events:none;}
.bf1{animation:bfOrb1 6s linear infinite;}
.bf2{animation:bfOrb2 8s linear infinite reverse;}
@keyframes bfOrb1{0%{top:42%;left:6%}25%{top:30%;left:22%}50%{top:55%;left:28%}75%{top:45%;left:8%}100%{top:42%;left:6%}}
@keyframes bfOrb2{0%{top:35%;right:8%}25%{top:50%;right:20%}50%{top:38%;right:30%}75%{top:28%;right:10%}100%{top:35%;right:8%}}

/* العشب والزهور */
.grass{position:absolute;left:-3%;right:-3%;bottom:-16px;height:130px;background:linear-gradient(180deg,#9ae27c,#78cb5f);border-top-left-radius:52% 70px;border-top-right-radius:52% 70px;z-index:1;}
.flowers{position:absolute;left:0;right:0;bottom:62px;height:90px;z-index:2;pointer-events:none;}
.flower{position:absolute;bottom:0;font-size:24px;animation:flBob 3s ease-in-out infinite;transform-origin:bottom center;}
@keyframes flBob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-4px)}}

/* Happy - يسار */
#happyChar{
  position:absolute;left:-10px;bottom:55px;
  width:220px;height:400px;
  z-index:3;pointer-events:none;
  animation:happyBob 3s ease-in-out infinite;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.18));
}
@keyframes happyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* jojo - يمين بجانب البيت - موقعها الأصلي */
#jojoChar{
  position:absolute;
  right:calc(3% + 150px);
  bottom:58px;
  width:140px;height:260px;
  z-index:4;pointer-events:none;
  animation:jojoBob 3.5s ease-in-out infinite;
  filter:drop-shadow(0 8px 14px rgba(0,80,200,.35));
}
@keyframes jojoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* البيت الوردي */
.house{position:absolute;right:3%;bottom:105px;width:142px;height:142px;z-index:3;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(180,60,120,.2));}
.h-roof{position:absolute;left:9px;top:0;width:0;height:0;border-left:62px solid transparent;border-right:62px solid transparent;border-bottom:48px solid #e85fa0;}
.h-roof-base{position:absolute;left:9px;top:30px;width:124px;height:16px;background:#c8336e;border-radius:0 0 4px 4px;}
.h-body{position:absolute;left:15px;top:46px;width:112px;height:84px;border-radius:9px;background:linear-gradient(180deg,#ffd6f0,#ffb8e0);border:2px solid rgba(200,80,150,.18);}
.h-door{position:absolute;bottom:0;left:40px;width:28px;height:48px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#a0522d,#7a3820);}
.h-win{position:absolute;top:14px;width:22px;height:18px;border-radius:4px;background:#c8f0ff;border:2px solid rgba(80,160,200,.4);}
.h-win1{left:10px;}.h-win2{right:10px;}

/* شجرة */
.small-tree{position:absolute;right:calc(3% + 150px + 140px);bottom:105px;width:44px;height:70px;z-index:2;pointer-events:none;}
.st-top{position:absolute;top:0;left:2px;width:40px;height:44px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 38% 35%,#7ae05a,#3da832);}
.st-trunk{position:absolute;bottom:0;left:16px;width:12px;height:28px;border-radius:4px;background:linear-gradient(180deg,#8B5E3C,#6b3e1e);}

/* أزرار اللغة - متطابقة تماماً بنفس النمط */
#arBtn,#enBtn{
  position:fixed;z-index:999;
  border:none;border-radius:12px;padding:9px 18px;
  font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;
  background:linear-gradient(180deg,#e8f5e9,#d4edda);
  color:#2e7d32;
  box-shadow:0 5px 0 #a5d6a7,0 8px 16px rgba(0,100,0,.1);
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
#arBtn{position:fixed;top:12px;right:12px;}
#enBtn{position:fixed;top:12px;left:12px;}
#arBtn::before,#enBtn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 55%);pointer-events:none;}
#arBtn:hover,#enBtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #a5d6a7,0 0 18px rgba(100,200,80,.4);}
#arBtn.selected,#enBtn.selected{background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;box-shadow:0 5px 0 #2e7d32;}

/* اللوحة */
.panel{
  position:absolute;top:50%;left:55%;
  transform:translate(-50%,-50%);
  width:min(390px,49vw);
  background:rgba(255,253,248,.97);
  border-radius:32px;padding:22px 20px 18px;
  box-shadow:0 20px 40px rgba(73,109,153,.22),0 10px 0 rgba(255,255,255,.9) inset;
  border:2px solid rgba(255,255,255,.85);
  text-align:center;z-index:10;
}
.title{font-size:clamp(1.05rem,1.85vw,1.75rem);line-height:1.3;color:#bf8a2f;font-weight:800;margin-bottom:14px;}
.title .num{display:block;font-size:.65em;letter-spacing:3px;color:#c8922a;margin-bottom:3px;}

/* نمط موحد لكل الازرار بدون استثناء */
.grn-btn{
  width:100%;border:none;border-radius:14px;
  padding:11px 16px;margin-bottom:8px;
  font-family:inherit;font-size:.93rem;font-weight:700;cursor:pointer;
  background:linear-gradient(180deg,#e8f5e9,#d4edda);
  color:#2e7d32;
  box-shadow:0 5px 0 #a5d6a7,0 8px 16px rgba(0,100,0,.1);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.grn-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 55%);pointer-events:none;}
.grn-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #a5d6a7,0 0 20px rgba(100,200,80,.45);}
.grn-btn:active{transform:translateY(2px);box-shadow:0 3px 0 #a5d6a7;}
.grn-btn.open{background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;box-shadow:0 5px 0 #2e7d32;}
.grn-btn.open:hover{box-shadow:0 5px 0 #2e7d32,0 0 20px rgba(80,180,60,.5);}

/* START - نفس لون بقية الازرار بالضبط */
.grn-btn.start-btn{
  background:linear-gradient(180deg,#e8f5e9,#d4edda);
  color:#2e7d32;
  box-shadow:0 5px 0 #a5d6a7,0 8px 16px rgba(0,100,0,.1);
  font-size:1.05rem;letter-spacing:1px;font-weight:800;
  margin-bottom:0;
}
.grn-btn.start-btn:hover{box-shadow:0 5px 0 #a5d6a7,0 0 22px rgba(100,200,80,.5);}

/* حقل الكتابة */
.field-input{
  width:100%;border-radius:10px;
  border:1.5px solid #c8e6c9;background:#fff;
  padding:10px 13px;font-family:inherit;font-size:.9rem;color:#4a6741;
  outline:none;display:block;
  max-height:0;overflow:hidden;opacity:0;
  transition:opacity .25s,max-height .3s ease,margin-bottom .25s;
  margin-bottom:0;
}
.field-input.visible{max-height:60px;margin-bottom:8px;opacity:1;border-color:#a5d6a7;}
.field-input:focus{border-color:#66bb6a;}


/* ══ PARROT REWARD ══ */
.parrot-wrap{
  position:fixed;z-index:600;pointer-events:none;
  display:none;
}
.parrot-wrap.fly{
  display:block;
  animation:parrotFly 1.8s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes parrotFly{
  0%  {transform:translate(0,0)   scale(1)   rotate(-10deg);opacity:1;}
  30% {transform:translate(60px,-70px)  scale(1.25) rotate(12deg);opacity:1;}
  65% {transform:translate(150px,-150px) scale(1.1)  rotate(-6deg);opacity:1;}
  100%{transform:translate(260px,-230px) scale(.65) rotate(18deg);opacity:0;}
}
.reward-token{
  position:fixed;z-index:599;pointer-events:none;
  font-size:1.6rem;display:none;
  animation:tokenRise 1.5s ease-out forwards;
}
@keyframes tokenRise{
  0%  {transform:translateY(0)    scale(.4);opacity:0;}
  18% {transform:translateY(-18px) scale(1.45);opacity:1;}
  75% {transform:translateY(-75px) scale(1);}
  100%{transform:translateY(-120px) scale(.7);opacity:0;}
}

/* جوجو bubble تعزيز */
.jojo-bubble{
  position:fixed;
  right:2%;
  bottom:330px;
  z-index:200;
  background:rgba(255,253,248,.97);
  border-radius:14px 14px 3px 14px;
  padding:8px 13px;
  max-width:190px;
  font-family:"Tajawal",sans-serif;
  font-size:.82rem;font-weight:700;color:#2c1810;
  box-shadow:0 4px 14px rgba(73,109,153,.18);
  border:2px solid rgba(165,214,167,.85);
  line-height:1.45;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
}
.jojo-bubble.show{opacity:1;}
.jojo-bubble .jb-name{
  display:block;
  font-size:.68rem;color:#2e7d32;
  font-weight:800;margin-bottom:2px;
}
.credit{position:fixed;bottom:8px;left:10px;color:#444;font-size:10px;z-index:99;background:rgba(255,255,255,.15);backdrop-filter:blur(2px);padding:3px 9px;border-radius:8px;font-weight:600;pointer-events:none;}

@media(max-width:900px){
  .panel{left:50%;width:min(88vw,380px);}
  #jojoChar{width:115px;height:215px;}
  #happyChar{width:170px;height:315px;}
}
@media(max-width:620px){
  .panel{left:50%;width:92vw;padding:16px 14px;}
  #jojoChar{width:95px;height:175px;right:calc(3% + 110px);}
  .house{width:105px;height:105px;}
  #happyChar{width:115px;height:215px;}
  .small-tree{display:none;}
}
</style>
</head>
<body>

<button id="enBtn" onclick="setLang('en')">English</button>

<div class="scene">
  <div class="sun"></div>

  <!-- 5 سحبات -->
  <div class="cloud cl1"><div class="cb" style="width:130px;height:38px;"><div style="width:56px;height:56px;top:-30px;left:12px;"></div><div style="width:46px;height:46px;top:-24px;left:50px;"></div><div style="width:36px;height:36px;top:-18px;left:84px;"></div></div></div>
  <div class="cloud cl2"><div class="cb" style="width:100px;height:30px;"><div style="width:42px;height:42px;top:-22px;left:10px;"></div><div style="width:34px;height:34px;top:-18px;left:38px;"></div><div style="width:26px;height:26px;top:-13px;left:64px;"></div></div></div>
  <div class="cloud cl3"><div class="cb" style="width:110px;height:32px;"><div style="width:48px;height:48px;top:-26px;left:10px;"></div><div style="width:40px;height:40px;top:-20px;left:44px;"></div><div style="width:30px;height:30px;top:-14px;left:78px;"></div></div></div>
  <div class="cloud cl4"><div class="cb" style="width:88px;height:26px;"><div style="width:36px;height:36px;top:-18px;left:8px;"></div><div style="width:28px;height:28px;top:-14px;left:34px;"></div><div style="width:22px;height:22px;top:-10px;left:56px;"></div></div></div>
  <div class="cloud cl5"><div class="cb" style="width:118px;height:34px;"><div style="width:50px;height:50px;top:-28px;left:12px;"></div><div style="width:42px;height:42px;top:-22px;left:46px;"></div><div style="width:32px;height:32px;top:-16px;left:80px;"></div></div></div>

  <div class="bf bf1">&#x1F98B;</div>
  <div class="bf bf2">&#x1F98B;</div>

  <!-- Happy يسار -->
  <model-viewer id="happyChar" src="Happy.glb" autoplay shadow-intensity="0" exposure="1.0" interaction-prompt="none" disable-zoom disable-pan alt="Happy"></model-viewer>

  <!-- jojo يمين بجانب البيت - موقعها الأصلي -->
  <model-viewer id="jojoChar" src="jojo.glb" autoplay shadow-intensity="0" exposure="1.0" interaction-prompt="none" disable-zoom disable-pan alt="Jojo"></model-viewer>

  <!-- البيت الوردي -->
  <div class="house">
    <div class="h-roof"></div><div class="h-roof-base"></div>
    <div class="h-body"><div class="h-win h-win1"></div><div class="h-win h-win2"></div><div class="h-door"></div></div>
  </div>
  <div class="small-tree"><div class="st-top"></div><div class="st-trunk"></div></div>

  <div class="grass"></div>
  <div class="flowers">
    <span class="flower" style="left:6px">&#x1F33B;</span>
    <span class="flower" style="left:40px">&#x1F337;</span>
    <span class="flower" style="left:76px">&#x1F338;</span>
    <span class="flower" style="left:112px">&#x1F33C;</span>
    <span class="flower" style="left:148px">&#x1F337;</span>
    <span class="flower" style="right:6px">&#x1F33B;</span>
    <span class="flower" style="right:40px">&#x1F338;</span>
    <span class="flower" style="right:76px">&#x1F337;</span>
    <span class="flower" style="right:112px">&#x1F33C;</span>
    <span class="flower" style="right:148px">&#x1F338;</span>
  </div>


  <!-- ══ PARROT + BUBBLE ══ -->
  <div class="jojo-bubble" id="jojoBubble">
    <span class="jb-name">🧒 JOJO:</span>
    <span id="jojoBubbleMsg">Hello! 🌴</span>
  </div>

  <div class="parrot-wrap" id="parrotWrap">
    <svg width="58" height="58" viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="29" cy="36" rx="15" ry="18" fill="#e53935"/>
      <!-- wings -->
      <ellipse cx="14" cy="37" rx="8" ry="14" fill="#c62828" transform="rotate(-16 14 37)"/>
      <ellipse cx="44" cy="37" rx="7" ry="13" fill="#b71c1c" transform="rotate(16 44 37)"/>
      <!-- belly -->
      <ellipse cx="29" cy="41" rx="9" ry="10" fill="#ffb300"/>
      <!-- wing shine -->
      <ellipse cx="16" cy="33" rx="3" ry="7" fill="#ef5350" opacity=".5" transform="rotate(-16 16 33)"/>
      <!-- head -->
      <circle cx="29" cy="19" r="13" fill="#e53935"/>
      <!-- green forehead -->
      <ellipse cx="29" cy="10" rx="8" ry="6" fill="#43a047"/>
      <!-- eye -->
      <circle cx="24" cy="18" r="4.5" fill="white"/>
      <circle cx="24" cy="18" r="3"   fill="#1a237e"/>
      <circle cx="24" cy="18" r="1.5" fill="black"/>
      <circle cx="24.8" cy="17" r=".6" fill="white"/>
      <!-- beak -->
      <path d="M18 21 Q15 25 18 27 Q22 25 20 21Z" fill="#ffb300"/>
      <!-- cheek -->
      <ellipse cx="22" cy="23" rx="3.5" ry="2.2" fill="#ffcdd2" opacity=".55"/>
      <!-- tail -->
      <path d="M23 52 Q20 61 15 65" stroke="#c62828" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M29 54 Q29 63 29 68" stroke="#e53935" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M35 52 Q38 61 43 65" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <!-- feet -->
      <line x1="24" y1="53" x2="21" y2="58" stroke="#ffb300" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="34" y1="53" x2="37" y2="58" stroke="#ffb300" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="reward-token" id="rewardToken"></div>

  <!-- اللوحة -->
  <div class="panel">
    <h1 class="title">
      <span class="num">1 2 3</span>
      Let's Learn English<br>Under The Big Tree
    </h1>

    <!-- الاسم -->
    <button class="grn-btn" id="nameToggle" onclick="toggle('name')">
      <span>&#x1F464;</span><span id="nameLbl">&#x627;&#x644;&#x627;&#x633;&#x645;</span>
    </button>
    <input id="nameInput" class="field-input" type="text" placeholder="&#x627;&#x643;&#x62A;&#x628; &#x627;&#x633;&#x645;&#x643; &#x627;&#x644;&#x62B;&#x644;&#x627;&#x62B;&#x64A;" autocomplete="off">

    <!-- الصف -->
    <button class="grn-btn" id="classToggle" onclick="toggle('cls')">
      <span>&#x1F4D6;</span><span id="classLbl">&#x627;&#x644;&#x635;&#x641;</span>
    </button>
    <input id="classInput" class="field-input" type="text" placeholder="&#x645;&#x62B;&#x627;&#x644;: 5/1" autocomplete="off">

    <!-- المدرسة -->

      <span>&#x1F3EB;</span><span id="schoolLbl">&#x627;&#x644;&#x645;&#x62F;&#x631;&#x633;&#x629;</span>
    </button>
    <input id="schoolInput" class="field-input" type="text" placeholder="&#x627;&#x633;&#x645; &#x627;&#x644;&#x645;&#x62F;&#x631;&#x633;&#x629;" autocomplete="off">

    <!-- شاركنا رأيك -->
    <button class="grn-btn" onclick="openSurvey()">
      <span>&#x1F4AC;</span><span id="surveyLbl">&#x634;&#x627;&#x631;&#x643;&#x646;&#x627; &#x631;&#x623;&#x64A;&#x643;</span>
    </button>

    <!-- START - نفس لون بقية الازرار -->
    <button class="grn-btn start-btn" onclick="startApp()">
      &#x25B6; START
    </button>
  </div>

</div>

// ══ JOJO MESSAGES ══
const JOJO_GREET = [
  "Welcome! 🌴 Let's learn!",
  "Hello friend! 😊",
  "Yay! Let's go! 🌟",
  "I'm so happy you're here! 🎉",
  "Ready to learn English? 📖"
];
const JOJO_NAME = [
  n => `Nice name, ${n}! ✨`,
  n => `Hello ${n}! 🌴 Great!`,
  n => `${n}! What a lovely name! 🌟`,
];
const JOJO_CLASS = [
  "Awesome class! 📚",
  "Great! Almost done! 😊",
  "Nice! One more field! 🌴",
];
const JOJO_SCHOOL = [
  "Great school! 🏫✨",
  "Wonderful! Now press START! 🚀",
  "Amazing! Ready to play? 🎮",
];
const JOJO_START = [
  n => `Let's go ${n}! 🚀🌴`,
  n => `Adventure time, ${n}! 🎉`,
  n => `Run ${n}, run! 🏃‍♀️💨`,
];
const JOJO_WRONG = [
  "Oops! Fill all fields! 😅",
  "Almost! Check the fields! 🔍",
  "Don't forget your name! ✏️",
];

let _jojoBubbleTimer = null;
function jojoSay(msg, dur=3000) {
  const b = document.getElementById('jojoBubble');
  const m = document.getElementById('jojoBubbleMsg');
  if(!b||!m) return;
  clearTimeout(_jojoBubbleTimer);
  m.textContent = msg;
  b.classList.add('show');
  if(dur > 0) _jojoBubbleTimer = setTimeout(() => b.classList.remove('show'), dur);
}

// ══ PARROT REWARD ══
const TOKENS = ['⭐','🌟','🌴','✨','⭐','🌟','🌴','✨'];
let _tokIdx = 0;

function parrotReward(triggerEl) {
  const pw  = document.getElementById('parrotWrap');
  const tk  = document.getElementById('rewardToken');
  if(!pw||!tk) return;

  // position near jojo
  const jojoEl = document.getElementById('jojoChar');
  let x = window.innerWidth - 200, y = window.innerHeight - 350;
  if(jojoEl) {
    const r = jojoEl.getBoundingClientRect();
    x = r.left + 20; y = r.top + 30;
  }
  pw.style.left  = x + 'px';
  pw.style.top   = y + 'px';
  tk.style.left  = (x + 20) + 'px';
  tk.style.top   = (y + 10) + 'px';
  tk.textContent = TOKENS[_tokIdx++ % TOKENS.length];

  // restart animations
  pw.classList.remove('fly');
  tk.style.display = 'none';
  void pw.offsetWidth;
  pw.classList.add('fly');
  tk.style.display = 'block';
  tk.style.animation = 'none';
  void tk.offsetWidth;
  tk.style.animation = 'tokenRise 1.5s ease-out forwards';

  // parrot sound
  try{
    const ps = document.getElementById('parrotSnd');
    if(ps){ps.currentTime=0;ps.volume=0.45;ps.play().catch(()=>{});}
  }catch(_){}

  setTimeout(() => {
    pw.classList.remove('fly');
    tk.style.display = 'none';
  }, 1900);
}

// random pick
function pick(arr, ...args) {
  const fn = arr[Math.floor(Math.random()*arr.length)];
  return typeof fn==='function' ? fn(...args) : fn;
}

const openState = { name:false, cls:false, school:false };
const cfg = {
  name:   { inp:'nameInput',   btn:'nameToggle'   },
  cls:    { inp:'classInput',  btn:'classToggle'  },
  school: { inp:'schoolInput', btn:'schoolToggle' }
};

function toggle(f) {
  beep();
  openState[f] = !openState[f];
  const inp  = document.getElementById(cfg[f].inp);
  const btn  = document.getElementById(cfg[f].btn);
  if(openState[f]){
    inp.classList.add('visible');
    btn.classList.add('open');
    setTimeout(() => inp.focus(), 60);
  } else {
    inp.classList.remove('visible');
    btn.classList.remove('open');
  }
}

// ===== صوت النقر =====
function beep() {
  const s = document.getElementById('clickSnd');
  if(s){ try{ s.currentTime=0; s.play().catch(()=>{}); }catch(_){} }
  // fallback AudioContext
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 700; o.type = 'sine';
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.12);
    o.start(); o.stop(ctx.currentTime+0.12);
  }catch(_){}
}
