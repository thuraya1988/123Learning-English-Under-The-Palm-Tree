<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Palm Tree - خريطة عمان التعليمية</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
body { background:linear-gradient(135deg,#1a0f0a,#2d1f14); min-height:100vh; color:#f5e6d3; }
#container { max-width:900px; margin:0 auto; padding:20px; }
h1 { text-align:center; color:#ffd700; margin-bottom:10px; font-size:22px; }
#subtitle { text-align:center; color:#c4a882; margin-bottom:20px; font-size:14px; }

#map-container { position:relative; width:100%; max-width:600px; margin:0 auto; background:rgba(0,0,0,0.3); border-radius:16px; padding:20px; border:1px solid rgba(196,168,130,0.2); }

.region { fill:rgba(196,168,130,0.15); stroke:rgba(196,168,130,0.5); stroke-width:1.5; cursor:pointer; transition:all 0.3s; }
.region:hover { fill:rgba(196,168,130,0.4); stroke:#ffd700; stroke-width:2.5; }
.region.active { fill:rgba(255,215,0,0.3); stroke:#ffd700; stroke-width:3; }

.city-dot { fill:#ffd700; stroke:#fff; stroke-width:1.5; cursor:pointer; transition:all 0.3s; }
.city-dot:hover { r:8; fill:#fff; }

.city-label { fill:#f5e6d3; font-size:11px; font-weight:600; pointer-events:none; text-anchor:middle; }

#info-panel { margin-top:20px; background:rgba(0,0,0,0.5); padding:16px; border-radius:12px; border:1px solid rgba(196,168,130,0.2); min-height:120px; }
#info-title { color:#ffd700; font-size:18px; font-weight:700; margin-bottom:8px; }
#info-en { color:#4A90E2; font-size:16px; font-weight:700; margin-bottom:4px; }
#info-ar { color:#c4a882; font-size:14px; margin-bottom:8px; }
#info-fact { color:#aaa; font-size:13px; line-height:1.5; }

#score-bar { display:flex; justify-content:center; gap:20px; margin-top:15px; flex-wrap:wrap; }
.score-item { background:rgba(0,0,0,0.4); padding:8px 16px; border-radius:10px; font-size:13px; font-weight:600; }

#quiz-btn { display:block; margin:20px auto 0; background:linear-gradient(135deg,#8b6914,#5c4a0a); color:#f5e6d3; border:none; padding:10px 28px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
#quiz-btn:active { transform:scale(0.95); }

#quiz-panel { display:none; margin-top:15px; background:rgba(0,0,0,0.5); padding:16px; border-radius:12px; border:1px solid rgba(74,144,226,0.3); }
#quiz-question { color:#f5e6d3; font-size:14px; margin-bottom:12px; text-align:center; }
.quiz-option { display:block; width:100%; background:rgba(74,55,40,0.6); border:1px solid rgba(196,168,130,0.3); color:#f5e6d3; padding:10px; margin-bottom:6px; border-radius:8px; font-size:13px; cursor:pointer; text-align:center; }
.quiz-option:active { background:rgba(196,168,130,0.3); }
#quiz-result { color:#ffd700; font-size:14px; margin-top:10px; text-align:center; font-weight:700; }

@media (max-width:480px) {
    h1 { font-size:18px; }
    #map-container { padding:10px; }
    .city-label { font-size:9px; }
}
</style>
<link rel="icon" type="image/png" href="../public/favicon.png">
<link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
</head>
<body>

<div id="container">
    <h1>🗺️ خريطة سلطنة عمان التعليمية</h1>
    <p id="subtitle">اضغط على أي محافظة لتتعلم اسمها بالإنجليزي!</p>

    <div id="map-container">
        <svg viewBox="0 0 400 300" width="100%" height="auto">
            <!-- Musandam -->
            <path class="region" data-region="musandam" d="M50,20 L80,15 L90,35 L60,40 Z" />
            <text class="city-label" x="70" y="32">مسندم</text>

            <!-- Al Batinah North -->
            <path class="region" data-region="batinah-north" d="M80,35 L120,30 L130,55 L90,60 Z" />
            <circle class="city-dot" data-city="sohar" cx="105" cy="45" r="5" />
            <text class="city-label" x="105" y="42">صحار</text>

            <!-- Al Batinah South -->
            <path class="region" data-region="batinah-south" d="M90,60 L130,55 L140,80 L100,85 Z" />
            <circle class="city-dot" data-city="rustaq" cx="115" cy="70" r="4" />

            <!-- Muscat -->
            <path class="region" data-region="muscat" d="M130,55 L160,50 L170,80 L140,85 Z" />
            <circle class="city-dot" data-city="muscat" cx="150" cy="65" r="6" />
            <text class="city-label" x="150" y="62">مسقط</text>

            <!-- Al Dakhiliyah -->
            <path class="region" data-region="dakhiliyah" d="M120,85 L160,80 L170,120 L130,125 Z" />
            <circle class="city-dot" data-city="nizwa" cx="145" cy="100" r="5" />
            <text class="city-label" x="145" y="97">نزوى</text>

            <!-- Al Sharqiyah North -->
            <path class="region" data-region="sharqiyah-north" d="M160,80 L200,75 L210,110 L170,115 Z" />
            <circle class="city-dot" data-city="sur" cx="185" cy="95" r="4" />
            <text class="city-label" x="185" y="92">صور</text>

            <!-- Al Sharqiyah South -->
            <path class="region" data-region="sharqiyah-south" d="M170,115 L210,110 L220,150 L180,155 Z" />
            <circle class="city-dot" data-city="salalah" cx="200" cy="130" r="5" />
            <text class="city-label" x="200" y="127">صلالة</text>

            <!-- Al Dhahirah -->
            <path class="region" data-region="dhahirah" d="M80,85 L120,80 L130,120 L90,125 Z" />
            <circle class="city-dot" data-city="ibri" cx="105" cy="100" r="4" />

            <!-- Al Wusta -->
            <path class="region" data-region="wusta" d="M130,125 L180,120 L190,180 L140,185 Z" />
            <circle class="city-dot" data-city="haima" cx="160" cy="150" r="4" />

            <!-- Dhofar -->
            <path class="region" data-region="dhofar" d="M180,155 L220,150 L230,220 L190,225 Z" />
            <circle class="city-dot" data-city="salalah2" cx="205" cy="190" r="4" />

            <!-- Al Buraimi -->
            <path class="region" data-region="buraimi" d="M60,80 L90,75 L95,100 L65,105 Z" />
            <circle class="city-dot" data-city="buraimi" cx="78" cy="90" r="4" />
            <text class="city-label" x="78" y="87">البريمي</text>

            <!-- Desert (Empty Quarter) -->
            <path class="region" data-region="desert" d="M90,125 L140,120 L150,180 L100,185 Z" fill="rgba(196,168,130,0.05)" />
            <text class="city-label" x="120" y="155">الربع الخالي</text>
        </svg>
    </div>

    <div id="info-panel">
        <div id="info-title">👆 اضغط على أي محافظة أو مدينة!</div>
        <div id="info-en"></div>
        <div id="info-ar"></div>
        <div id="info-fact"></div>
    </div>

    <div id="score-bar">
        <div class="score-item">🌴 نقاط: <span id="score">0</span></div>
        <div class="score-item">📚 كلمات: <span id="words">0</span></div>
        <div class="score-item">🎯 إجابات: <span id="correct">0</span></div>
    </div>

    <button id="quiz-btn">🧩 ابدأ اختبار المحافظات</button>

    <div id="quiz-panel">
        <div id="quiz-question"></div>
        <div id="quiz-options"></div>
        <div id="quiz-result"></div>
    </div>
</div>

<script>
const regions = {
    'musandam': { en: 'Musandam', ar: 'مسندم', fact: 'تعرف بـ "جبال عمان" وتطل على مضيق هرمز' },
    'batinah-north': { en: 'Al Batinah North', ar: 'شمال الباطنة', fact: 'تضم مدينة صحار التاريخية' },
    'batinah-south': { en: 'Al Batinah South', ar: 'جنوب الباطنة', fact: 'منطقة زراعية غنية بالنخيل' },
    'muscat': { en: 'Muscat', ar: 'مسقط', fact: 'عاصمة عمان وقلبها التجاري والسياسي' },
    'dakhiliyah': { en: 'Al Dakhiliyah', ar: 'الداخلية', fact: 'تضم قلعة نزوى التاريخية' },
    'sharqiyah-north': { en: 'Al Sharqiyah North', ar: 'شمال الشرقية', fact: 'تطل على بحر العرب' },
    'sharqiyah-south': { en: 'Al Sharqiyah South', ar: 'جنوب الشرقية', fact: 'تضم مدينة صور ووادي شاب' },
    'dhahirah': { en: 'Al Dhahirah', ar: 'الظاهرة', fact: 'منطقة زراعية وتاريخية' },
    'wusta': { en: 'Al Wusta', ar: 'الوسطى', fact: 'منطقة صحراوية واسعة' },
    'dhofar': { en: 'Dhofar', ar: 'ظفار', fact: 'تشتهر بموسم الخريف واللبان' },
    'buraimi': { en: 'Al Buraimi', ar: 'البريمي', fact: 'منطقة حدودية مع الإمارات' },
    'desert': { en: 'Empty Quarter', ar: 'الربع الخالي', fact: 'أكبر صحراء رملية في العالم' }
};

const cities = {
    'sohar': { en: 'Sohar', ar: 'صحار', fact: 'مسقط جون جريفيث في الرواية' },
    'muscat': { en: 'Muscat', ar: 'مسقط', fact: 'عاصمة عمان' },
    'nizwa': { en: 'Nizwa', ar: 'نزوى', fact: 'قلعة نزوى - أقدم قلعة في عمان' },
    'sur': { en: 'Sur', ar: 'صور', fact: 'مدينة السفن التقليدية' },
    'salalah': { en: 'Salalah', ar: 'صلالة', fact: 'عاصمة الخريف' },
    'buraimi': { en: 'Al Buraimi', ar: 'البريمي', fact: 'واحة تاريخية' },
    'ibri': { en: 'Ibri', ar: 'عبري', fact: 'مدينة تاريخية' },
    'haima': { en: 'Haima', ar: 'هيماء', fact: 'وسط عمان' },
    'rustaq': { en: 'Rustaq', ar: 'رستاق', fact: 'قلعة رستاق التاريخية' }
};

let score = 0, words = 0, correct = 0;

function showInfo(data) {
    document.getElementById('info-title').textContent = '📍 ' + data.ar;
    document.getElementById('info-en').textContent = data.en;
    document.getElementById('info-ar').textContent = data.ar;
    document.getElementById('info-fact').textContent = '💡 ' + data.fact;
    score += 5; words++;
    document.getElementById('score').textContent = score;
    document.getElementById('words').textContent = words;
    localStorage.setItem('upt_map_score', JSON.stringify({score, words, correct}));
}

// Region clicks
document.querySelectorAll('.region').forEach(r => {
    r.addEventListener('click', function() {
        document.querySelectorAll('.region').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        const key = this.getAttribute('data-region');
        if(regions[key]) showInfo(regions[key]);
    });
});

// City clicks
document.querySelectorAll('.city-dot').forEach(c => {
    c.addEventListener('click', function(e) {
        e.stopPropagation();
        const key = this.getAttribute('data-city');
        if(cities[key]) showInfo(cities[key]);
    });
});

// Quiz
const quizQuestions = [
    { q: 'ما هي عاصمة عمان؟', options: ['نزوى', 'مسقط', 'صلالة', 'صحار'], correct: 1 },
    { q: 'What is the capital of Oman?', options: ['Nizwa', 'Muscat', 'Salalah', 'Sohar'], correct: 1 },
    { q: 'أين تقع قلعة نزوى؟', options: ['الداخلية', 'مسقط', 'ظفار', 'البريمي'], correct: 0 },
    { q: 'Where is Sohar located?', options: ['South', 'North Batinah', 'Dhofar', 'Muscat'], correct: 1 },
    { q: 'ما اسم أكبر صحراء رملية في العالم؟', options: ['الصحراء الكبرى', 'الربع الخالي', 'صحراء النفود', 'صحراء الكalahari'], correct: 1 }
];

let currentQuiz = 0;

document.getElementById('quiz-btn').addEventListener('click', () => {
    document.getElementById('quiz-panel').style.display = 'block';
    currentQuiz = 0;
    showQuizQuestion();
});

function showQuizQuestion() {
    if(currentQuiz >= quizQuestions.length) {
        document.getElementById('quiz-question').textContent = '🎉 اكتمل الاختبار!';
        document.getElementById('quiz-options').innerHTML = '';
        document.getElementById('quiz-result').textContent = 'أحسنت! تعلمت ' + words + ' كلمة';
        return;
    }
    const q = quizQuestions[currentQuiz];
    document.getElementById('quiz-question').textContent = q.q;
    document.getElementById('quiz-result').textContent = '';
    const opts = document.getElementById('quiz-options');
    opts.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
            if(idx === q.correct) {
                document.getElementById('quiz-result').textContent = '✅ صحيح! +' + 10 + ' نقاط';
                score += 10; correct++;
                document.getElementById('score').textContent = score;
                document.getElementById('correct').textContent = correct;
            } else {
                document.getElementById('quiz-result').textContent = '❌ حاول مرة أخرى!';
            }
            setTimeout(() => { currentQuiz++; showQuizQuestion(); }, 1500);
        });
        opts.appendChild(btn);
    });
}

// Load saved
const saved = localStorage.getItem('upt_map_score');
if(saved) {
    const data = JSON.parse(saved);
    score = data.score || 0; words = data.words || 0; correct = data.correct || 0;
    document.getElementById('score').textContent = score;
    document.getElementById('words').textContent = words;
    document.getElementById('correct').textContent = correct;
}
</script>

</body>
</html>
