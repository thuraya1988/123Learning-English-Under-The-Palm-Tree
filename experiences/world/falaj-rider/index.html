<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Falaj Rider — راكب الفلج</title>
<style>
/* ============================================
   Falaj Rider - Stylesheet
   ============================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0D0D2B;
  color: #F5DEB3;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* --- شاشة البداية --- */
#start-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0D0D2B, #1a1a4e, #2C1810);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.start-content {
  text-align: center;
  padding: 40px;
}

.start-content h1 {
  font-size: 64px;
  color: #D2691E;
  text-shadow: 0 0 30px rgba(210, 105, 30, 0.5);
  margin-bottom: 10px;
}

.start-content h2 {
  font-size: 36px;
  color: #8B4513;
  margin-bottom: 20px;
}

.start-content p {
  font-size: 20px;
  color: #F5DEB3;
  margin-bottom: 30px;
}

#start-btn {
  padding: 18px 50px;
  font-size: 24px;
  background: linear-gradient(135deg, #8B4513, #D2691E);
  color: #F5DEB3;
  border: 3px solid #D2691E;
  border-radius: 15px;
  cursor: pointer;
  transition: all 0.3s;
}

#start-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px rgba(210, 105, 30, 0.6);
}

.controls-hint {
  margin-top: 30px;
  padding: 15px;
  background: rgba(139, 69, 19, 0.3);
  border-radius: 10px;
  font-size: 16px;
}

/* --- اللعبة --- */
#game-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* --- HUD --- */
#hud {
  position: fixed;
  top: 15px;
  right: 15px;
  display: flex;
  gap: 15px;
  z-index: 100;
  direction: ltr;
  unicode-bidi: isolate;
}

.hud-item {
  background: rgba(44, 24, 16, 0.9);
  border: 2px solid #8B4513;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 16px;
  color: #F5DEB3;
}

/* شريط التقدم */
#progress-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 10px;
  background: rgba(0,0,0,0.5);
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #8B4513;
}

#progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #8B4513, #D2691E, #FFD700);
  transition: width 0.3s;
}

/* --- شاشة Game Over --- */
#game-over-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  overflow-y: auto;
}

.game-over-content {
  text-align: center;
  padding: 40px;
  max-width: 600px;
}

.game-over-content h1 {
  font-size: 48px;
  color: #FFD700;
  margin-bottom: 20px;
}

#final-score, #final-level {
  font-size: 24px;
  margin: 10px 0;
  color: #D2691E;
  direction: ltr;
  unicode-bidi: isolate;
}

/* --- الشهادة --- */
#certificate-section {
  margin: 30px 0;
  padding: 20px;
  background: rgba(44, 24, 16, 0.5);
  border-radius: 15px;
}

#certificate {
  background: linear-gradient(135deg, #F5DEB3, #FFE4B5);
  color: #2C1810;
  padding: 30px;
  border-radius: 10px;
  margin: 20px 0;
  position: relative;
}

.cert-border {
  border: 3px solid #8B4513;
  padding: 20px;
  border-radius: 5px;
}

.cert-border h3 {
  font-size: 28px;
  color: #8B4513;
  margin-bottom: 15px;
}

.cert-border h2 {
  font-size: 32px;
  color: #D2691E;
  margin: 15px 0;
}

.cert-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
  font-size: 16px;
  direction: ltr;
  unicode-bidi: isolate;
}

.cert-date {
  margin-top: 15px;
  font-size: 14px;
  color: #8B4513;
}

.cert-seal {
  margin-top: 20px;
  font-size: 18px;
  color: #8B4513;
  font-weight: bold;
}

.game-over-content .btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.game-over-content button {
  padding: 12px 28px;
  font-size: 16px;
  background: linear-gradient(135deg, #8B4513, #D2691E);
  color: #F5DEB3;
  border: 2px solid #D2691E;
  border-radius: 10px;
  cursor: pointer;
}

/* --- أنيميشن --- */
@keyframes floatUp {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  50% { transform: translateY(-50px) scale(1.2); opacity: 1; }
  100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.effect-success {
  animation: floatUp 1.5s ease-out forwards;
  color: #32CD32;
  font-size: 60px;
}

.effect-fail {
  animation: shake 0.5s ease-in-out;
  color: #FF4500;
  font-size: 60px;
}

/* --- Responsive --- */
@media (max-width: 768px) {
  .start-content h1 { font-size: 36px; }
  .start-content h2 { font-size: 24px; }
  #hud { flex-direction: column; gap: 5px; }
  .hud-item { font-size: 14px; padding: 8px 12px; }
}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ============================================
// نظام الصوت - Tone.js
// ============================================

const AudioSystem = {
  initialized: false,
  waterSynth: null,
  windSynth: null,
  rainSynth: null,
  thunderSynth: null,
  bgm: null,

  // تهيئة الصوت
  async init() {
    if (this.initialized) return;
    await Tone.start();

    // 🌊 صوت الماء (Noise + Filter)
    this.waterSynth = new Tone.NoiseSynth({
      noise: { type: 'brown' },
      envelope: {
        attack: 2,
        decay: 1,
        sustain: 1,
        release: 3
      }
    }).toDestination();

    this.waterFilter = new Tone.AutoFilter({
      frequency: 0.5,
      baseFrequency: 200,
      octaves: 2
    }).toDestination();

    this.waterSynth.connect(this.waterFilter);
    this.waterFilter.start();

    // 💨 صوت الرياح (Noise + LFO)
    this.windSynth = new Tone.NoiseSynth({
      noise: { type: 'pink' },
      envelope: {
        attack: 3,
        decay: 2,
        sustain: 1,
        release: 4
      }
    });

    this.windFilter = new Tone.Filter(400, 'lowpass').toDestination();
    this.windSynth.connect(this.windFilter);

    // 🌧️ صوت المطر
    this.rainSynth = new Tone.NoiseSynth({
      noise: { type: 'white' },
      envelope: {
        attack: 0.5,
        decay: 0.1,
        sustain: 1,
        release: 1
      }
    });

    this.rainFilter = new Tone.Filter(800, 'highpass').toDestination();
    this.rainSynth.connect(this.rainFilter);

    // ⚡ صوت الرعد
    this.thunderSynth = new Tone.MembraneSynth({
      pitchDecay: 0.05,
      octaves: 4,
      oscillator: { type: 'sine' },
      envelope: {
        attack: 0.001,
        decay: 0.8,
        sustain: 0.01,
        release: 1.5
      }
    }).toDestination();

    // ✅ نغمة الإجابة الصحيحة (منفصلة عن الرعد)
    this.successSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.3 }
    }).toDestination();
    this.successSynth.volume.value = -8;

    // ❌ نغمة الإجابة الخاطئة
    this.failSynth = new Tone.Synth({
      oscillator: { type: 'square' },
      envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.1 }
    }).toDestination();
    this.failSynth.volume.value = -12;

    // 🎵 موسيقى خلفية
    this.bgm = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: {
        attack: 0.5,
        decay: 0.3,
        sustain: 0.4,
        release: 1
      }
    }).toDestination();

    this.bgm.volume.value = -15;

    this.initialized = true;
    console.log('🔊 Audio System Ready');
  },

  // تشغيل صوت الماء حسب الهيجان
  playWater(seaState) {
    if (!this.initialized) return;

    const volume = -20 + (seaState / 100) * 10; // -20 to -10 dB
    this.waterSynth.volume.value = volume;

    // تغيير سرعة الفلتر حسب الهيجان
    this.waterFilter.frequency.value = 0.2 + (seaState / 100) * 2;

    if (seaState > 0 && !this.waterPlaying) {
      this.waterSynth.triggerAttack();
      this.waterPlaying = true;
    }
  },

  // تشغيل الرياح
  playWind(seaState) {
    if (!this.initialized) return;

    const volume = -25 + (seaState / 100) * 15;
    this.windSynth.volume.value = volume;
    this.windFilter.frequency.value = 200 + (seaState / 100) * 600;

    if (seaState > 30 && !this.windPlaying) {
      this.windSynth.triggerAttack();
      this.windPlaying = true;
    } else if (seaState <= 30 && this.windPlaying) {
      this.windSynth.triggerRelease();
      this.windPlaying = false;
    }
  },

  // تشغيل المطر
  playRain(seaState) {
    if (!this.initialized) return;

    if (seaState > 70) {
      this.rainSynth.volume.value = -15;
      if (!this.rainPlaying) {
        this.rainSynth.triggerAttack();
        this.rainPlaying = true;
      }
    } else if (this.rainPlaying) {
      this.rainSynth.triggerRelease();
      this.rainPlaying = false;
    }
  },

  // صوت الرعد
  playThunder() {
    if (!this.initialized) return;
    this.thunderSynth.triggerAttackRelease('C1', '2n');
    this.thunderSynth.triggerAttackRelease('G0', '1n', '+0.1');
  },

  // نغمة إجابة صحيحة
  playSuccess() {
    if (!this.initialized) return;
    const now = Tone.now();
    this.successSynth.triggerAttackRelease('C5', '16n', now);
    this.successSynth.triggerAttackRelease('E5', '16n', now + 0.08);
    this.successSynth.triggerAttackRelease('G5', '8n', now + 0.16);
  },

  // نغمة إجابة خاطئة
  playFail() {
    if (!this.initialized) return;
    this.failSynth.triggerAttackRelease('A2', '8n');
  },

  // موسيقى خلفية
  playBGM() {
    if (!this.initialized) return;

    const melody = [
      { note: 'D4', time: '0:0', duration: '2n' },
      { note: 'F4', time: '0:2', duration: '2n' },
      { note: 'A4', time: '1:0', duration: '1n' },
      { note: 'G4', time: '2:0', duration: '2n' },
      { note: 'E4', time: '2:2', duration: '2n' },
      { note: 'D4', time: '3:0', duration: '1n' },
    ];

    const now = Tone.now();
    melody.forEach((m, i) => {
      this.bgm.triggerAttackRelease(m.note, m.duration, now + i * 0.5);
    });
  },

  // إيقاف الكل
  stopAll() {
    if (this.waterPlaying) this.waterSynth.triggerRelease();
    if (this.windPlaying) this.windSynth.triggerRelease();
    if (this.rainPlaying) this.rainSynth.triggerRelease();
    this.waterPlaying = false;
    this.windPlaying = false;
    this.rainPlaying = false;
  },

  // تحديث حسب حالة البحر
  update(seaState) {
    this.playWater(seaState);
    this.playWind(seaState);
    this.playRain(seaState);
  }
};

// ============================================
// نظام الأسئلة + بوابات التمرير
// ============================================

const QuestionSystem = {
  bank: {
    easy: {
      vocabulary: [
        { q: "What does 'Water' mean?", options: ["ماء", "نار", "هواء", "تراب"], correct: 0 },
        { q: "What is a 'Boat'?", options: ["قارب", "سيارة", "طائرة", "دراجة"], correct: 0 },
        { q: "What does 'Tree' mean?", options: ["شجرة", "زهرة", "حجر", "سحاب"], correct: 0 },
      ],
      grammar: [
        { q: "I ___ a student.", options: ["am", "is", "are", "be"], correct: 0 },
        { q: "She ___ to school.", options: ["go", "goes", "going", "went"], correct: 1 },
      ]
    },
    medium: {
      vocabulary: [
        { q: "What does 'Current' mean?", options: ["تيار", "ريح", "موجة", "سحاب"], correct: 0 },
        { q: "What is an 'Oasis'?", options: ["واحة", "صحراء", "جبل", "بحر"], correct: 0 },
        { q: "What does 'Palm' mean?", options: ["نخلة", "تفاح", "برتقال", "موز"], correct: 0 },
      ],
      grammar: [
        { q: "They have ___ their homework.", options: ["did", "done", "do", "doing"], correct: 1 },
        { q: "If it rains, I ___ at home.", options: ["stay", "will stay", "stayed", "staying"], correct: 1 },
      ]
    },
    hard: {
      vocabulary: [
        { q: "What does 'Turbulence' mean?", options: ["اضطراب", "هدوء", "تسارع", "انحدار"], correct: 0 },
        { q: "What is 'Erosion'?", options: ["تآكل", "تراكم", "تبخر", "تجميد"], correct: 0 },
        { q: "What does 'Meander' mean?", options: ["تعرج", "استقامة", "انحدار", "صعود"], correct: 0 },
      ],
      grammar: [
        { q: "By the time we arrived, they ___ left.", options: ["have", "had", "has", "having"], correct: 1 },
        { q: "Had I known, I ___ differently.", options: ["would act", "would have acted", "will act", "acted"], correct: 1 },
      ]
    }
  },

  // إنشاء بوابة سؤال في المشهد 3D (علامة مرئية فقط — التفاعل الفعلي عبر نافذة الأسئلة)
  createGate(scene, position, question, onPass) {
    const gateGroup = new THREE.Group();

    // عمودين
    const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, 5, 8);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });

    const leftPillar = new THREE.Mesh(pillarGeo, pillarMat);
    leftPillar.position.set(-2, 2.5, 0);
    gateGroup.add(leftPillar);

    const rightPillar = new THREE.Mesh(pillarGeo, pillarMat);
    rightPillar.position.set(2, 2.5, 0);
    gateGroup.add(rightPillar);

    // اللوحة العلوية
    const signGeo = new THREE.BoxGeometry(5, 1, 0.3);
    const signMat = new THREE.MeshStandardMaterial({ color: 0x2C1810 });
    const sign = new THREE.Mesh(signGeo, signMat);
    sign.position.set(0, 5, 0);
    gateGroup.add(sign);

    // تأثير توهج
    const glowGeo = new THREE.TorusGeometry(2.5, 0.1, 8, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xFFD700,
      transparent: true,
      opacity: 0.3
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.set(0, 2.5, 0);
    glow.rotation.x = Math.PI / 2;
    gateGroup.add(glow);

    // Animation
    gateGroup.userData = {
      glow: glow,
      question: question,
      answered: false,
      onPass: onPass
    };

    gateGroup.position.copy(position);
    scene.add(gateGroup);

    return gateGroup;
  },

  // تحديث البوابات (توهج + دوران)
  updateGates(gates, time) {
    gates.forEach(gate => {
      if (gate.userData.answered) return;

      const glow = gate.userData.glow;
      glow.rotation.z = time * 0.5;
      glow.material.opacity = 0.2 + Math.sin(time * 2) * 0.1;
    });
  },

  // التحقق من اصطدام اللاعب بالبوابة
  checkCollision(riderPosition, gates) {
    for (const gate of gates) {
      if (gate.userData.answered) continue;

      const dist = riderPosition.distanceTo(gate.position);
      if (dist < 3) {
        return gate;
      }
    }
    return null;
  },

  // اختيار سؤال حسب الصعوبة
  getQuestion(difficulty) {
    const pool = this.bank[difficulty];
    const type = Math.random() > 0.5 ? 'vocabulary' : 'grammar';
    const questions = pool[type];
    return {
      ...questions[Math.floor(Math.random() * questions.length)],
      difficulty,
      type
    };
  }
};

// ============================================
// شادر الماء - Gerstner Waves
// ============================================

const WaterSystem = {
  material: null,
  mesh: null,

  // شريط ماء ضيق يتبع مسار الفلج بدل صفيحة مفتوحة بلا حدود — هذا الفرق الفعلي بين نهر وفلج
  buildChannelGeometry(curve, halfWidth) {
    const LENGTH_SEGMENTS = 300;
    const WIDTH_SEGMENTS = 10;
    const positions = [];
    const uvs = [];
    const indices = [];

    for (let i = 0; i <= LENGTH_SEGMENTS; i++) {
      const t = i / LENGTH_SEGMENTS;
      const center = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      for (let j = 0; j <= WIDTH_SEGMENTS; j++) {
        const wT = j / WIDTH_SEGMENTS;
        const offset = (wT - 0.5) * 2 * halfWidth;
        const p = center.clone().add(side.clone().multiplyScalar(offset));
        positions.push(p.x, 0, p.z);
        uvs.push(wT, t * 40);
      }
    }

    const rowLen = WIDTH_SEGMENTS + 1;
    for (let i = 0; i < LENGTH_SEGMENTS; i++) {
      for (let j = 0; j < WIDTH_SEGMENTS; j++) {
        const a = i * rowLen + j;
        const b = a + 1;
        const c = a + rowLen;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  },

  // إنشاء الماء
  create(scene, falajCurve) {
    // هندسة الماء — شريط ضيق يتبع منحنى الفلج، بنفس عرض القناة بين الجدران
    const geometry = this.buildChannelGeometry(falajCurve, 3.1);

    // الشادر
    const vertexShader = `
      uniform float uTime;
      uniform float uSeaState;
      uniform float uWaveHeight;

      varying vec2 vUv;
      varying float vElevation;
      varying vec3 vNormal;

      // Gerstner Wave
      vec3 gerstnerWave(vec2 pos, float time, float steepness, float wavelength, vec2 direction, float speed) {
        float k = 2.0 * 3.14159 / wavelength;
        float c = sqrt(9.8 / k) * speed;
        vec2 d = normalize(direction);
        float f = k * (dot(d, pos) - c * time);
        float a = steepness / k;

        return vec3(
          d.x * a * cos(f),
          a * sin(f),
          d.y * a * cos(f)
        );
      }

      void main() {
        vUv = uv;
        vec3 pos = position;

        // فلج ضيق جارٍ — موج أهدأ بكثير من بحر مفتوح حتى وقت الهيجان
        float sea = 0.08 + uSeaState * 0.7;

        // موجات متعددة
        vec3 wave1 = gerstnerWave(pos.xz, uTime, 0.15 * sea, 20.0, vec2(1.0, 0.0), 0.5);
        vec3 wave2 = gerstnerWave(pos.xz, uTime, 0.10 * sea, 15.0, vec2(0.7, 0.7), 0.8);
        vec3 wave3 = gerstnerWave(pos.xz, uTime, 0.08 * sea, 10.0, vec2(0.0, 1.0), 1.2);
        vec3 wave4 = gerstnerWave(pos.xz, uTime, 0.05 * sea, 8.0, vec2(0.5, 0.5), 1.5);

        pos += wave1 + wave2 + wave3 + wave4;

        vElevation = pos.y;

        // حساب النورمال للإضاءة
        vec3 tangent = vec3(1.0, 0.0, 0.0);
        vec3 bitangent = vec3(0.0, 0.0, 1.0);
        vNormal = normalize(cross(tangent, bitangent));

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const fragmentShader = `
      uniform float uTime;
      uniform float uSeaState;

      varying vec2 vUv;
      varying float vElevation;
      varying vec3 vNormal;

      void main() {
        // لون ماء فلج صافي (فيروزي مائل للأخضر فوق قاع حجري) بدل أزرق بحر عميق
        vec3 deepColor = vec3(0.04, 0.28, 0.26);
        vec3 shallowColor = vec3(0.25, 0.62, 0.52);
        vec3 foamColor = vec3(0.9, 0.95, 1.0);

        float mixFactor = smoothstep(-1.0, 1.0, vElevation);
        vec3 color = mix(deepColor, shallowColor, mixFactor);

        // رغوة على القمم
        if (vElevation > 0.8 * uSeaState && uSeaState > 0.5) {
          color = mix(color, foamColor, 0.5);
        }

        // إضاءة أساسية
        vec3 lightDir = normalize(vec3(1.0, 1.0, 0.5));
        float diff = max(dot(vNormal, lightDir), 0.0);
        color *= 0.6 + 0.4 * diff;

        // لمعان
        vec3 viewDir = normalize(vec3(0.0, 1.0, 1.0));
        vec3 halfDir = normalize(lightDir + viewDir);
        float spec = pow(max(dot(vNormal, halfDir), 0.0), 32.0);
        color += vec3(0.3) * spec;

        gl_FragColor = vec4(color, 0.9);
      }
    `;

    this.material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: {
        uTime: { value: 0 },
        uSeaState: { value: 0.45 },
        uWaveHeight: { value: 0.5 }
      },
      transparent: true,
      side: THREE.DoubleSide
    });

    this.mesh = new THREE.Mesh(geometry, this.material);
    scene.add(this.mesh);

    return this;
  },

  // تحديث الماء
  update(time, seaState) {
    if (this.material) {
      this.material.uniforms.uTime.value = time;
      this.material.uniforms.uSeaState.value = seaState / 100;
    }
  },

  // حساب ارتفاع الماء عند نقطة (للـ CPU)
  getHeight(x, z, time, seaState) {
    const sea = 0.08 + (seaState / 100) * 0.7;
    let y = 0;

    const waves = [
      { steepness: 0.15, wavelength: 20, dx: 1, dz: 0, speed: 0.5 },
      { steepness: 0.10, wavelength: 15, dx: 0.7, dz: 0.7, speed: 0.8 },
      { steepness: 0.08, wavelength: 10, dx: 0, dz: 1, speed: 1.2 },
      { steepness: 0.05, wavelength: 8, dx: 0.5, dz: 0.5, speed: 1.5 },
    ];

    for (const w of waves) {
      const k = 2 * Math.PI / w.wavelength;
      const c = Math.sqrt(9.8 / k) * w.speed;
      const f = k * ((w.dx * x + w.dz * z) - time * c);
      const a = (w.steepness * sea) / k;
      y += a * Math.sin(f);
    }

    return y;
  }
};

const gltfLoader = new GLTFLoader();
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

function fitModelToFootprint(root, targetWidth) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = targetWidth / (Math.max(size.x, size.z) || 1);
  const wrapper = new THREE.Group();
  root.position.set(-center.x, -box.min.y, -center.z);
  wrapper.add(root);
  wrapper.scale.setScalar(scale);
  return wrapper;
}

const Environment = {
  village: null,
  terrain: null,
  palmTrees: [],
  clouds: [],
  birds: [],

  // إنشاء التضاريس
  createTerrain(scene) {
    const geometry = new THREE.PlaneGeometry(500, 500, 128, 128);
    geometry.rotateX(-Math.PI / 2);

    const positions = geometry.attributes.position.array;
    for (let i = 0; i < positions.length; i += 3) {
      const x = positions[i];
      const z = positions[i + 2];
      // تموّج خفيف — يبقى دايم تحت مستوى جدران الفلج حتى ما يخترقها
      positions[i + 1] = Math.sin(x * 0.05) * 0.5 + Math.cos(z * 0.03) * 0.4;
    }

    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      color: 0xC2B280,
      roughness: 0.9,
      flatShading: true
    });

    // الأرض الآن مرئية فعلاً حول القناة (الماء صار شريط ضيق لا يغطي كل شي) — لازم ترتفع لمستوى الأرض
    this.terrain = new THREE.Mesh(geometry, material);
    this.terrain.position.y = -1.0;
    scene.add(this.terrain);
  },

  // إنشاء نخلة
  createPalmTree(x, z, scale = 1) {
    const group = new THREE.Group();

    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.2, 2, 0),
      new THREE.Vector3(-0.1, 4, 0.1),
      new THREE.Vector3(0, 6, 0),
    ]);

    const trunkGeo = new THREE.TubeGeometry(trunkCurve, 20, 0.18 * scale, 8, false);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B6914, emissive: 0x1a1206, emissiveIntensity: 0.4, roughness: 0.9 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.castShadow = true;
    group.add(trunk);

    // سعف فعلي بأشكال مخروطية مسطحة — الأنابيب الرفيعة السابقة كانت تطلع كخطوط سوداء رفيعة
    const frondMat = new THREE.MeshStandardMaterial({ color: 0x4d7c2e, emissive: 0x14260c, emissiveIntensity: 0.5, roughness: 0.85, side: THREE.DoubleSide });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const frondGeo = new THREE.ConeGeometry(0.55 * scale, 3.4 * scale, 4);
      const frond = new THREE.Mesh(frondGeo, frondMat);
      frond.position.set(Math.cos(angle) * 0.35 * scale, 6.3, Math.sin(angle) * 0.35 * scale);
      frond.rotation.z = Math.cos(angle) * 1.0;
      frond.rotation.x = Math.sin(angle) * 1.0 + 0.55;
      frond.castShadow = true;
      group.add(frond);
    }

    group.position.set(x, -1, z);
    return group;
  },

  // جدران الفلج الحجرية — قناة ضيقة بجدارين مبنيين (حجر + غطاء علوي)، بدل نهر عريض مفتوح
  createFalajBanks(scene, falajCurve) {
    const SEGMENTS = 160;
    const CHANNEL_HALF_WIDTH = 3.3;
    const wallGeo = new THREE.BoxGeometry(0.85, 1.8, 4.2);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xC9B896, roughness: 0.95 });
    const capGeo = new THREE.BoxGeometry(1.15, 0.28, 4.3);
    const capMat = new THREE.MeshStandardMaterial({ color: 0xAE9A76, roughness: 0.9 });

    const leftWalls = new THREE.InstancedMesh(wallGeo, wallMat, SEGMENTS);
    const rightWalls = new THREE.InstancedMesh(wallGeo, wallMat, SEGMENTS);
    const leftCaps = new THREE.InstancedMesh(capGeo, capMat, SEGMENTS);
    const rightCaps = new THREE.InstancedMesh(capGeo, capMat, SEGMENTS);
    [leftWalls, rightWalls, leftCaps, rightCaps].forEach(m => { m.castShadow = true; m.receiveShadow = true; });

    const dummy = new THREE.Object3D();
    for (let i = 0; i < SEGMENTS; i++) {
      const t = i / SEGMENTS;
      const pos = falajCurve.getPointAt(t);
      const tangent = falajCurve.getTangentAt(t).normalize();
      const angle = Math.atan2(tangent.x, tangent.z);
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const leftPos = pos.clone().add(side.clone().multiplyScalar(CHANNEL_HALF_WIDTH));
      dummy.position.set(leftPos.x, -1.6, leftPos.z);
      dummy.rotation.set(0, angle, 0);
      dummy.updateMatrix();
      leftWalls.setMatrixAt(i, dummy.matrix);
      dummy.position.set(leftPos.x, -0.55, leftPos.z);
      dummy.updateMatrix();
      leftCaps.setMatrixAt(i, dummy.matrix);

      const rightPos = pos.clone().add(side.clone().multiplyScalar(-CHANNEL_HALF_WIDTH));
      dummy.position.set(rightPos.x, -1.6, rightPos.z);
      dummy.rotation.set(0, angle, 0);
      dummy.updateMatrix();
      rightWalls.setMatrixAt(i, dummy.matrix);
      dummy.position.set(rightPos.x, -0.55, rightPos.z);
      dummy.updateMatrix();
      rightCaps.setMatrixAt(i, dummy.matrix);
    }
    [leftWalls, rightWalls, leftCaps, rightCaps].forEach(m => { m.instanceMatrix.needsUpdate = true; scene.add(m); });
  },

  // مبانٍ حقيقية (موديلات ثلاثية الأبعاد فعلية بدل أشكال بدائية)
  loadBuildings(scene) {
    gltfLoader.load('./assets/an-arab-mosque.glb', (gltf) => {
      const model = fitModelToFootprint(gltf.scene, 16);
      model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      model.position.set(0, -1, -40);
      scene.add(model);
    }, undefined, () => { /* village still reads fine without the mosque if this fails to load */ });

    gltfLoader.load('./assets/persian-city-fortress.glb', (gltf) => {
      const model = fitModelToFootprint(gltf.scene, 24);
      model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      model.position.set(-55, -1, 30);
      scene.add(model);
    }, undefined, () => { /* village still reads fine without the fortress landmark if this fails to load */ });

    const housePositions = [
      { x: -30, z: -30 }, { x: 30, z: 20 },
      { x: -40, z: 10 }, { x: 50, z: -10 },
      { x: 20, z: 40 }, { x: -20, z: 50 },
    ];
    gltfLoader.load('./assets/arab-rooftop-scene.glb', (gltf) => {
      housePositions.forEach(pos => {
        const model = fitModelToFootprint(gltf.scene.clone(true), 9);
        model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        model.position.set(pos.x, -1, pos.z);
        model.rotation.y = Math.random() * Math.PI * 2;
        scene.add(model);
      });
    }, undefined, () => { /* village still reads fine without the houses if this fails to load */ });
  },

  // ===== السماء: نجوم، شمس، غيوم، جبال بعيدة، طيور =====
  buildSky(scene) {
    // قبة سماء متدرجة (أفق دافئ لصبح مشرق ← أزرق فوق) بدل لون واحد مسطح
    const skyGeo = new THREE.SphereGeometry(280, 32, 16);
    this.skyMat = new THREE.ShaderMaterial({
      uniforms: {
        topColor: { value: new THREE.Color(0x4a90c2) },
        bottomColor: { value: new THREE.Color(0xffd9a0) },
        offset: { value: 15 },
        exponent: { value: 0.55 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }
      `,
      side: THREE.BackSide,
      fog: false
    });
    this.skyDome = new THREE.Mesh(skyGeo, this.skyMat);
    scene.add(this.skyDome);

    const starGeo = new THREE.BufferGeometry();
    const STAR_COUNT = 1200;
    const starPositions = new Float32Array(STAR_COUNT * 3);
    const SKY_RADIUS = 220;
    for (let i = 0; i < STAR_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 0.85);
      starPositions[i * 3] = SKY_RADIUS * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = Math.abs(SKY_RADIUS * Math.cos(phi)) + 10;
      starPositions[i * 3 + 2] = SKY_RADIUS * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    this.starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0, sizeAttenuation: false, toneMapped: false, fog: false });
    scene.add(new THREE.Points(starGeo, this.starMat));

    // شمس منخفضة قرب الأفق (إحساس شروق/صباح) مع هالة توهج خلفها
    const sunGeo = new THREE.SphereGeometry(7, 24, 24);
    this.sunMat = new THREE.MeshBasicMaterial({ color: 0xfff2d0, transparent: true, opacity: 1, toneMapped: false, fog: false });
    const sun = new THREE.Mesh(sunGeo, this.sunMat);
    sun.position.set(120, 26, -70);
    scene.add(sun);
    this.sunGlow = new THREE.PointLight(0xffdba0, 1.8, 140);
    this.sunGlow.position.copy(sun.position);
    scene.add(this.sunGlow);

    const haloCanvas = document.createElement('canvas');
    haloCanvas.width = 256; haloCanvas.height = 256;
    const hctx = haloCanvas.getContext('2d');
    const hgrad = hctx.createRadialGradient(128, 128, 10, 128, 128, 128);
    hgrad.addColorStop(0, 'rgba(255,224,168,0.9)');
    hgrad.addColorStop(0.4, 'rgba(255,200,140,0.35)');
    hgrad.addColorStop(1, 'rgba(255,200,140,0)');
    hctx.fillStyle = hgrad;
    hctx.fillRect(0, 0, 256, 256);
    this.sunHaloMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(haloCanvas), transparent: true, depthWrite: false, fog: false });
    const sunHalo = new THREE.Sprite(this.sunHaloMat);
    sunHalo.scale.set(60, 60, 1);
    sunHalo.position.copy(sun.position);
    scene.add(sunHalo);

    const mountainGroup = new THREE.Group();
    const RING_RADIUS = 150;
    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.15;
      const mHeight = 26 + Math.random() * 30;
      const mWidth = 28 + Math.random() * 26;
      const mGeo = new THREE.ConeGeometry(mWidth, mHeight, 4);
      const mMat = new THREE.MeshStandardMaterial({ color: 0x7a6550, roughness: 1 });
      const mesh = new THREE.Mesh(mGeo, mMat);
      mesh.position.set(Math.cos(angle) * RING_RADIUS, mHeight / 2 - 4, Math.sin(angle) * RING_RADIUS);
      mesh.rotation.y = Math.random() * Math.PI;
      mountainGroup.add(mesh);
    }
    scene.add(mountainGroup);

    const cloudCanvas = document.createElement('canvas');
    cloudCanvas.width = 128; cloudCanvas.height = 64;
    const cctx = cloudCanvas.getContext('2d');
    const grad = cctx.createRadialGradient(64, 32, 4, 64, 32, 60);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    cctx.fillStyle = grad;
    cctx.fillRect(0, 0, 128, 64);
    const cloudTexture = new THREE.CanvasTexture(cloudCanvas);

    for (let i = 0; i < 12; i++) {
      const cloudMat = new THREE.SpriteMaterial({ map: cloudTexture, transparent: true, opacity: 0.6, depthWrite: false });
      const cloud = new THREE.Sprite(cloudMat);
      const scale = 16 + Math.random() * 14;
      cloud.scale.set(scale, scale * 0.5, 1);
      cloud.position.set((Math.random() - 0.5) * 300, 45 + Math.random() * 25, (Math.random() - 0.5) * 300);
      cloud.userData = { speed: 0.5 + Math.random() * 0.7 };
      scene.add(cloud);
      this.clouds.push(cloud);
    }

    const birdCanvas = document.createElement('canvas');
    birdCanvas.width = 32; birdCanvas.height = 16;
    const bctx = birdCanvas.getContext('2d');
    bctx.strokeStyle = '#241a12';
    bctx.lineWidth = 2;
    bctx.beginPath();
    bctx.moveTo(2, 6); bctx.quadraticCurveTo(8, 0, 16, 8);
    bctx.quadraticCurveTo(24, 0, 30, 6);
    bctx.stroke();
    const birdTexture = new THREE.CanvasTexture(birdCanvas);

    for (let i = 0; i < 5; i++) {
      const birdMat = new THREE.SpriteMaterial({ map: birdTexture, transparent: true, opacity: 0.9, depthWrite: false });
      const bird = new THREE.Sprite(birdMat);
      bird.scale.set(2.5, 1.2, 1);
      bird.userData = { angle: Math.random() * Math.PI * 2, radius: 40 + Math.random() * 30, height: 30 + Math.random() * 10, speed: 0.12 + Math.random() * 0.1 };
      scene.add(bird);
      this.birds.push(bird);
    }
  },

  // تحديث السماء حسب هيجان البحر — هدوء = صحو ومشمس، عاصف = غيوم داكنة ونجوم تلوح
  updateSky(seaState) {
    const calm = seaState < 40;
    const stormy = seaState > 70;
    this.sunMat.opacity = stormy ? 0.15 : calm ? 1 : 0.6;
    this.sunHaloMat.opacity = stormy ? 0.1 : calm ? 1 : 0.5;
    this.sunGlow.intensity = stormy ? 0.2 : calm ? 1.8 : 1;
    this.starMat.opacity = stormy ? 0.5 : 0;
    this.clouds.forEach(c => { c.material.opacity = stormy ? 0.85 : calm ? 0.35 : 0.6; });
    this.birds.forEach(b => { b.material.opacity = calm ? 0.9 : 0; });

    if (stormy) {
      this.skyMat.uniforms.topColor.value.setHex(0x2F4F4F);
      this.skyMat.uniforms.bottomColor.value.setHex(0x4a5a5a);
    } else if (calm) {
      this.skyMat.uniforms.topColor.value.setHex(0x4a90c2);
      this.skyMat.uniforms.bottomColor.value.setHex(0xffd9a0);
    } else {
      this.skyMat.uniforms.topColor.value.setHex(0x5D8AA8);
      this.skyMat.uniforms.bottomColor.value.setHex(0xd8c0a0);
    }
  },

  followCamera(camPos) {
    if (this.skyDome) this.skyDome.position.set(camPos.x, 0, camPos.z);
  },

  updateSkyAnimation(delta, time) {
    this.clouds.forEach(c => {
      c.position.x += c.userData.speed * delta;
      if (c.position.x > 150) c.position.x = -150;
    });
    this.birds.forEach(b => {
      b.userData.angle += b.userData.speed * delta;
      b.position.set(
        Math.cos(b.userData.angle) * b.userData.radius,
        b.userData.height + Math.sin(time * 2 + b.userData.angle) * 1.5,
        Math.sin(b.userData.angle) * b.userData.radius
      );
    });
  },

  // بناء القرية كاملة
  buildVillage(scene, falajCurve) {
    this.createTerrain(scene);
    this.createFalajBanks(scene, falajCurve);
    this.loadBuildings(scene);
    this.buildSky(scene);

    for (let i = 0; i < 20; i++) {
      const t = i / 20;
      const pos = falajCurve.getPointAt(t);
      const tangent = falajCurve.getTangentAt(t).normalize();
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      const dir = Math.random() > 0.5 ? 1 : -1;
      const offset = side.clone().multiplyScalar(dir * (6 + Math.random() * 8));
      const palm = this.createPalmTree(
        pos.x + offset.x,
        pos.z + offset.z,
        0.8 + Math.random() * 0.4
      );
      scene.add(palm);
      this.palmTrees.push(palm);
    }

    for (let i = 0; i < 30; i++) {
      const rockGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 0.5);
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8B7355 });
      const rock = new THREE.Mesh(rockGeo, rockMat);
      rock.position.set(
        (Math.random() - 0.5) * 200,
        -1,
        (Math.random() - 0.5) * 200
      );
      scene.add(rock);
    }
  },

  // تحريك النخيل (رياح) + السماء
  update(time, windStrength) {
    this.palmTrees.forEach((palm, i) => {
      const offset = i * 0.5;
      palm.rotation.z = Math.sin(time * 2 + offset) * 0.05 * windStrength;
      palm.rotation.x = Math.cos(time * 1.5 + offset) * 0.03 * windStrength;
    });
  }
};

const UISystem = {
  // تحديث HUD
  updateHUD(score, seaState, level, streak, progress) {
    document.getElementById('score').textContent = score;
    document.getElementById('sea-state').textContent = seaState;
    document.getElementById('level').textContent = level;
    document.getElementById('streak').textContent = streak;
    document.getElementById('progress-fill').style.width = (progress * 100) + '%';
  },

  // عرض تأثير النجاح/الفشل
  showEffect(type) {
    const effect = document.createElement('div');
    effect.className = type === 'success' ? 'effect-success' : 'effect-fail';
    effect.textContent = type === 'success' ? '✅ صح!' : '❌ خطأ!';
    effect.style.position = 'fixed';
    effect.style.top = '40%';
    effect.style.left = '50%';
    effect.style.transform = 'translate(-50%, -50%)';
    effect.style.zIndex = '3000';
    document.body.appendChild(effect);

    setTimeout(() => document.body.removeChild(effect), 1500);
  },

  // عرض شاشة Game Over
  showGameOver(stats) {
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'flex';

    document.getElementById('final-score').textContent = `⭐ Score: ${stats.score}`;
    document.getElementById('final-level').textContent = `📊 Level: ${stats.level}`;

    document.getElementById('cert-score').textContent = stats.score;
    document.getElementById('cert-level').textContent = stats.level;
    document.getElementById('cert-correct').textContent = stats.correctAnswers;
    document.getElementById('cert-date').textContent = new Date().toLocaleDateString('ar-OM');
  },

  // تحميل الشهادة كصورة
  downloadCertificate() {
    const cert = document.getElementById('certificate');

    if (typeof html2canvas !== 'undefined') {
      html2canvas(cert).then(canvas => {
        const link = document.createElement('a');
        link.download = 'falaj-rider-certificate.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    } else {
      window.print();
    }
  },

  // شاشة السؤال المحسّنة
  showQuestion(question, onAnswer) {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 1500;
    `;

    const box = document.createElement('div');
    box.style.cssText = `
      background: linear-gradient(135deg, #2C1810, #4A2511);
      border: 3px solid #8B4513;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    `;

    const qText = document.createElement('h3');
    qText.textContent = question.q;
    qText.style.cssText = 'color: #F5DEB3; font-size: 22px; margin-bottom: 20px; direction: ltr; unicode-bidi: isolate;';
    box.appendChild(qText);

    const timerContainer = document.createElement('div');
    timerContainer.style.cssText = 'width: 100%; height: 8px; background: #333; border-radius: 4px; margin-bottom: 20px; overflow: hidden;';
    const timerBar = document.createElement('div');
    timerBar.style.cssText = 'width: 100%; height: 100%; background: linear-gradient(90deg, #228B22, #FFD700, #FF4500);';
    timerContainer.appendChild(timerBar);
    box.appendChild(timerContainer);

    const optionsGrid = document.createElement('div');
    optionsGrid.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr; gap: 12px;';

    let answered = false;
    let timeLeft = 5000;

    const timer = setInterval(() => {
      timeLeft -= 100;
      timerBar.style.width = Math.max(0, (timeLeft / 5000 * 100)) + '%';

      if (timeLeft <= 0 && !answered) {
        answered = true;
        clearInterval(timer);
        onAnswer(false);
        document.body.removeChild(overlay);
      }
    }, 100);

    question.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.style.cssText = `
        padding: 15px; font-size: 16px;
        background: #5D3A1A; color: #F5DEB3;
        border: 2px solid #8B4513; border-radius: 10px;
        cursor: pointer; transition: all 0.3s;
      `;

      btn.onmouseover = () => { if (!answered) btn.style.background = '#8B4513'; };
      btn.onmouseout = () => { if (!answered) btn.style.background = '#5D3A1A'; };

      btn.onclick = () => {
        if (answered) return;
        answered = true;
        clearInterval(timer);

        const isCorrect = idx === question.correct;
        btn.style.background = isCorrect ? '#228B22' : '#8B0000';
        btn.style.borderColor = isCorrect ? '#32CD32' : '#FF4500';

        if (!isCorrect) {
          optionsGrid.children[question.correct].style.background = '#228B22';
        }

        setTimeout(() => {
          document.body.removeChild(overlay);
          onAnswer(isCorrect);
        }, 1200);
      };

      optionsGrid.appendChild(btn);
    });

    box.appendChild(optionsGrid);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
};

// ============================================
// منطق اللعبة الرئيسي — حركة أول شخص (first-person)
// ============================================

const Game = {
  scene: null,
  camera: null,
  renderer: null,
  clock: null,

  falajCurve: null,
  gates: [],

  // موقع الراكب الفعلي (يتبعه الكاميرا مباشرة — ما فيه شخصية أو قارب مرئي)
  riderPosition: new THREE.Vector3(),
  riderBank: 0,

  progress: 0,
  baseSpeed: 0.0005,
  playerSteer: 0,
  currentSeaState: 45,
  score: 0,
  level: 1,
  streak: 0,
  correctAnswers: 0,
  isPaused: false,
  isGameOver: false,

  checkpoints: [
    { progress: 0.15 }, { progress: 0.30 }, { progress: 0.45 },
    { progress: 0.60 }, { progress: 0.75 }, { progress: 0.90 },
  ],

  // حالة أزرار التوجيه (تُفحص كل فريم بدل الاعتماد على تكرار حدث keydown)
  keys: {},

  init() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xF0C89A);
    this.scene.fog = new THREE.Fog(0xF0C89A, 60, 190);

    this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    this.renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('game-canvas'),
      antialias: true
    });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;

    // إضاءة صباحية دافئة — كانت خافتة جداً وتخلي الأشجار تطلع أسود بحت
    const ambientLight = new THREE.AmbientLight(0x8a7a5f, 1.3);
    this.scene.add(ambientLight);

    this.sunLight = new THREE.DirectionalLight(0xFFE0A8, 1.4);
    this.sunLight.position.set(90, 35, -50);
    this.sunLight.castShadow = true;
    this.scene.add(this.sunLight);

    this.moonLight = new THREE.DirectionalLight(0x4169E1, 0);
    this.moonLight.position.set(-50, 100, -50);
    this.scene.add(this.moonLight);

    this.clock = new THREE.Clock();

    this.createFalajPath();
    WaterSystem.create(this.scene, this.falajCurve);
    Environment.buildVillage(this.scene, this.falajCurve);
    this.createGates();
    this.setupControls();

    window.addEventListener('resize', () => this.onResize());
  },

  // مسار الفلج
  createFalajPath() {
    const points = [
      new THREE.Vector3(-100, 0, -100),
      new THREE.Vector3(-60, 0, -40),
      new THREE.Vector3(-20, 0, -10),
      new THREE.Vector3(20, 0, 20),
      new THREE.Vector3(60, 0, 10),
      new THREE.Vector3(100, 0, 80),
    ];

    this.falajCurve = new THREE.CatmullRomCurve3(points);
    this.falajCurve.tension = 0.5;
  },

  // إنشاء بوابات الأسئلة
  createGates() {
    this.checkpoints.forEach((cp, i) => {
      const pos = this.falajCurve.getPointAt(cp.progress);
      const difficulty = i < 2 ? 'easy' : i < 4 ? 'medium' : 'hard';
      const question = QuestionSystem.getQuestion(difficulty);

      const gate = QuestionSystem.createGate(
        this.scene,
        pos,
        question,
        (isCorrect) => this.handleAnswer(isCorrect)
      );

      this.gates.push(gate);
    });
  },

  // التحكم — حالة الأزرار تُفحص كل فريم في updateRider (ليست مرتبطة بتكرار keydown)
  setupControls() {
    window.addEventListener('keydown', (e) => { this.keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });

    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });

    window.addEventListener('touchmove', (e) => {
      if (this.isPaused) return;
      const diff = e.touches[0].clientX - touchStartX;
      this.playerSteer = Math.max(-1, Math.min(1, diff / 100));
    });

    window.addEventListener('touchend', () => {
      this.playerSteer = 0;
    });
  },

  isDown(...names) {
    return names.some(n => this.keys[n]);
  },

  // معالجة الإجابة
  handleAnswer(isCorrect) {
    if (isCorrect) {
      this.streak++;
      this.correctAnswers++;
      this.score += 100 * this.streak;
      this.currentSeaState = Math.min(this.currentSeaState + 15, 100);
      UISystem.showEffect('success');
      AudioSystem.playSuccess();

      if (this.streak % 3 === 0) {
        this.level++;
      }
    } else {
      this.streak = 0;
      this.currentSeaState = Math.max(this.currentSeaState - 10, 20);
      UISystem.showEffect('fail');
      AudioSystem.playFail();
    }

    this.applySeaState(this.currentSeaState);
  },

  // تطبيق حالة البحر
  applySeaState(state) {
    if (state < 30) {
      this.scene.fog.color.setHex(0xF0C89A);
    } else if (state < 60) {
      this.scene.fog.color.setHex(0xB8A890);
    } else {
      this.scene.fog.color.setHex(0x3a4048);
    }

    AudioSystem.update(state);
    Environment.updateSky(state);
  },

  // تحديث حركة الراكب (أول شخص — الكاميرا هي عين الراكب مباشرة)
  updateRider(dt, time) {
    if (this.isPaused || this.isGameOver) return;

    // توجيه وسرعة تُفحص كل فريم من حالة الأزرار (بدل الاعتماد على تكرار حدث keydown)
    if (this.isDown('arrowleft', 'a')) this.playerSteer = Math.max(this.playerSteer - 0.05, -1);
    if (this.isDown('arrowright', 'd')) this.playerSteer = Math.min(this.playerSteer + 0.05, 1);
    if (this.isDown('arrowup', 'w')) this.baseSpeed = Math.min(0.002, this.baseSpeed + 0.00003);
    if (this.isDown('arrowdown', 's')) this.baseSpeed = Math.max(0.0001, this.baseSpeed - 0.00003);

    // رجوع تدريجي للتوجيه لو ما فيه ضغط
    if (!this.isDown('arrowleft', 'a', 'arrowright', 'd')) this.playerSteer *= 0.92;

    const speed = this.baseSpeed * (1 + this.currentSeaState / 50);
    this.progress = (this.progress + speed * dt) % 1;

    const pos = this.falajCurve.getPointAt(this.progress);
    const tangent = this.falajCurve.getTangentAt(this.progress).normalize();

    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    pos.add(side.multiplyScalar(this.playerSteer * 2.2));

    const waterY = WaterSystem.getHeight(pos.x, pos.z, time, this.currentSeaState);
    pos.y = waterY + 1.3; // ارتفاع عين الراكب فوق سطح الماء

    this.riderPosition.lerp(pos, 0.25);

    // ميلان طفيف مع التوجيه + اهتزاز مع الموج — للإحساس بالركوب بدون قارب مرئي
    this.riderBank += (-this.playerSteer * 0.25 - this.riderBank) * 0.1;
    const waveTilt = Math.sin(time * 3) * (this.currentSeaState / 100) * 0.05;

    this.camera.position.copy(this.riderPosition);
    const lookTarget = this.riderPosition.clone().add(tangent);
    this.camera.lookAt(lookTarget);
    this.camera.rotation.z += this.riderBank + waveTilt;

    this.checkGates();

    if (this.progress > 0.98) {
      this.endGame();
    }
  },

  // التحقق من البوابات
  checkGates() {
    const hitGate = QuestionSystem.checkCollision(this.riderPosition, this.gates);
    if (hitGate && !hitGate.userData.answered) {
      this.isPaused = true;
      const q = hitGate.userData.question;

      UISystem.showQuestion(q, (isCorrect) => {
        this.handleAnswer(isCorrect);
        hitGate.userData.answered = true;
        this.isPaused = false;
      });
    }
  },

  // نهاية اللعبة
  endGame() {
    this.isGameOver = true;
    AudioSystem.stopAll();

    UISystem.showGameOver({
      score: this.score,
      level: this.level,
      correctAnswers: this.correctAnswers
    });
  },

  onResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  },

  animate() {
    if (this.isGameOver) return;

    requestAnimationFrame(() => this.animate());

    const dt = this.clock.getDelta();
    const time = this.clock.getElapsedTime();

    WaterSystem.update(time, this.currentSeaState);
    Environment.update(time, this.currentSeaState / 100);
    Environment.updateSkyAnimation(dt, time);
    QuestionSystem.updateGates(this.gates, time);
    this.updateRider(dt, time);
    Environment.followCamera(this.camera.position);

    UISystem.updateHUD(
      this.score,
      this.currentSeaState,
      this.level,
      this.streak,
      this.progress
    );

    this.renderer.render(this.scene, this.camera);
  }
};

// ============================================
// نقطة الدخول الرئيسية
// ============================================

window.startGame = async function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';

  await AudioSystem.init();
  AudioSystem.playBGM();

  Game.init();
  Game.animate();

  console.log('🌴 Falaj Rider Started!');
};

window.restartGame = function restartGame() {
  location.reload();
};

window.UISystem = UISystem;
</script>
