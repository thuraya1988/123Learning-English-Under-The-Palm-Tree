<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buonanotte — مشهد ليلي تفاعلي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@latest/latin-700.css">
<style>
  :root{ --ink:#1a1a1a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ background:#000; font-family:'Cairo',sans-serif; }
  #stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #scene{ height:100vh; max-width:100vw; display:block; box-shadow:0 0 90px rgba(20,20,30,.9); }

  header{ position:fixed; top:14px; right:14px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header h1{ font-size:15px; font-weight:700; color:#f4efe4; background:rgba(20,20,24,.85); border:2px solid #f4efe4; border-radius:30px; padding:6px 16px; }
  header button{ font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:#f4efe4; background:rgba(20,20,24,.85); border:2px solid #f4efe4; border-radius:30px; padding:6px 14px; cursor:pointer; transition:transform .2s, background .3s; }
  header button:hover{ transform:translateY(-3px); background:#2c2c34; }
  header button:active{ transform:scale(.94); }

  #hint{ position:fixed; bottom:12px; right:50%; transform:translateX(50%); z-index:6; background:rgba(244,239,228,.9); color:#1a1a1a; font-size:12.5px; padding:8px 20px; border-radius:30px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #tip{ position:fixed; z-index:9; pointer-events:none; background:#f4efe4; color:#1a1a1a; font-size:13px; font-weight:700; padding:4px 14px; border-radius:20px; opacity:0; transition:opacity .2s; transform:translate(-50%,-150%); }

  .skyrect{ fill:#0c0c10; }
  .star{ animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.15; } to{ opacity:1; } }
  .titleT{ font-family:'Baloo 2','Cairo',sans-serif; font-weight:700; letter-spacing:2px; cursor:default; transition:filter .4s; }
  .titleT:hover{ filter:drop-shadow(0 0 14px #fff); }

  .layer{ will-change:transform; }
  .tower{ transform-box:fill-box; transition:transform .6s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
  .tower:hover{ transform:translateY(-8px); }

  .win{ cursor:pointer; }
  .win .main{ transition:fill .3s; }
  .win .halo{ fill:#ff9c4a; opacity:0; transition:opacity .4s; pointer-events:none; }
  .win.lit .main{ fill:#e08b3f !important; }
  .win.lit .halo{ opacity:.5; }

  .door{ cursor:pointer; }
  .door .spill{ opacity:0; transition:opacity .5s; pointer-events:none; }
  .door.open .spill{ opacity:.4; }

  .plant{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 7s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(-1.6deg); } to{ transform:rotate(1.6deg); } }
  .fly{ animation:blink 1.6s ease-in-out infinite alternate; }
  @keyframes blink{ from{ opacity:.05; } to{ opacity:.9; } }
  #moonG{ cursor:pointer; transform-box:fill-box; transform-origin:center; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 600 850" preserveAspectRatio="xMidYMid meet" aria-label="لوحة Buonanotte التفاعلية">
    <defs>
      <filter id="blurG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 0.05 0"/></filter>
    </defs>
    <rect class="skyrect" x="0" y="0" width="600" height="850"></rect>
    <g id="starsG"></g>
    <g id="skyG">
      <circle cx="45" cy="55" r="13" fill="#f4efe4" filter="url(#glowF)"/>
      <g id="moonG">
        <circle cx="355" cy="95" r="50" fill="#f4efe4" filter="url(#glowF)"/>
        <circle cx="340" cy="82" r="7" fill="#ddd6c6" opacity=".7"/>
        <circle cx="368" cy="108" r="5" fill="#ddd6c6" opacity=".6"/>
        <circle cx="362" cy="78" r="3.5" fill="#ddd6c6" opacity=".6"/>
      </g>
      <path d="M 532 48 A 24 24 0 1 0 532 96 A 30 30 0 1 1 532 48 Z" fill="#f4efe4" filter="url(#glowF)"/>
      <circle cx="150" cy="145" r="7" fill="#f4efe4"/>
      <circle cx="310" cy="215" r="10" fill="#f4efe4"/>
      <circle cx="435" cy="228" r="7" fill="#f4efe4"/>
      <text class="titleT" x="300" y="98" text-anchor="middle" font-size="46" fill="#ffffff" stroke="#0c0c10" stroke-width="7" paint-order="stroke">Buonanotte</text>
      <text x="300" y="152" text-anchor="middle" font-size="12" fill="#cfcfcf" font-family="Cairo,sans-serif">L'indifferenza che uccide</text>
    </g>
    <g id="layerBack" class="layer" data-depth="5"></g>
    <g id="layerMid" class="layer" data-depth="11"></g>
    <g id="layerFront" class="layer" data-depth="19"></g>
    <rect x="0" y="0" width="600" height="850" filter="url(#paper)" opacity=".6" pointer-events="none"></rect>
    <g id="fxG" pointer-events="none"></g>
  </svg>

  <header>
    <h1>🌙 ليلة سعيدة — Buonanotte</h1>
    <button id="shootBtn">🌠 شهب</button>
    <button id="lightBtn">💡 إضاءة الكل</button>
    <button id="catBtn">🐈‍ نزهة القطة</button>
    <button id="resetBtn">🔄 إعادة</button>
  </header>
  <div id="hint">مرّر المؤشر لتحريك الطبقات • انقر النوافذ لتضيئها • انقر الأبواب ليخرج الضوء • انقر السماء للشهب • انقر القمر!</div>
  <div id="tip"></div>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg', INK='#1a1a1a';
  var seed=41;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function rr(a,b){ return a+rnd()*(b-a); }
  function el(t,a,p){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }

  var svg=document.getElementById('scene');
  var defs=svg.querySelector('defs');
  var starsG=document.getElementById('starsG');
  var layerBack=document.getElementById('layerBack'), layerMid=document.getElementById('layerMid'), layerFront=document.getElementById('layerFront');
  var fxG=document.getElementById('fxG'), tip=document.getElementById('tip');
  var clipCount=0;

  /* نجوم */
  for(var s=0;s<110;s++){
    el('circle',{cx:rr(4,596).toFixed(1),cy:rr(4,520).toFixed(1),r:rr(.7,2).toFixed(1),fill:'#f4efe4','class':'star',style:'animation-delay:'+rr(0,3).toFixed(1)+'s'},starsG);
  }

  function spiralD(cx,cy,rmax,turns){
    var d='M '+cx+' '+cy, tot=turns*Math.PI*2;
    for(var a=0;a<=tot;a+=0.16){ var r=rmax*a/tot; d+=' L '+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1); }
    return d;
  }

  /* ---------- نباتات الجانبين ---------- */
  function plant(parent,x0,y0,x1,y1,flowers){
    var g=el('g',{'class':'plant'},parent);
    el('path',{d:'M '+x0+' '+y0+' Q '+((x0+x1)/2+rr(-14,14)).toFixed(0)+' '+((y0+y1)/2).toFixed(0)+' '+x1+' '+y1,fill:'none',stroke:'#8a8a8f','stroke-width':2.5},g);
    var n=flowers?6:4;
    for(var i=1;i<=n;i++){
      var t=i/(n+1), px=x0+(x1-x0)*t+rr(-4,4), py=y0+(y1-y0)*t;
      el('ellipse',{cx:px,cy:py,rx:9,ry:4,fill:'#8a8a8f',opacity:.85,transform:'rotate('+rr(-50,50).toFixed(0)+' '+px+' '+py+')'},g);
    }
    if(flowers){
      el('path',{d:spiralD(x1,y1,14,3),fill:'none',stroke:'#9a9aa0','stroke-width':1.6},g);
      el('path',{d:spiralD(x1+14,y1+60,9,2.5),fill:'none',stroke:'#9a9aa0','stroke-width':1.4},g);
    }
    return g;
  }
  plant(layerBack,18,790,14,140,true);
  plant(layerBack,40,780,52,320,false);
  plant(layerBack,585,790,588,120,true);
  plant(layerBack,562,780,548,340,false);
  plant(layerBack,575,760,596,470,false);

  /* ---------- أدوات الأبراج ---------- */
  function tower(parent,name){ var g=el('g',{'class':'tower'},parent); if(name) g.dataset.name=name; return g; }
  function cone(parent,pts,fill,patternFn){
    el('polygon',{points:pts,fill:fill,stroke:INK,'stroke-width':2},parent);
    if(patternFn){
      var id='clip'+(clipCount++);
      var cp=el('clipPath',{id:id},defs);
      el('polygon',{points:pts},cp);
      var g=el('g',{'clip-path':'url(#'+id+')'},parent);
      patternFn(g);
    }
  }
  function addWin(g,x,y,w,h,type,fill,lit){
    var grp=el('g',{'class':'win'},g), cx=x+w/2, cy=y+h/2, main;
    el('circle',{cx:cx,cy:cy,r:Math.max(w,h)*1.15,'class':'halo',filter:'url(#blurG)'},grp);
    if(type==='arch'){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.45)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.45)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else { main=el('rect',{x:x,y:y,width:w,height:h,'class':'main'},grp); }
    main.setAttribute('fill',fill); main.setAttribute('stroke',INK); main.setAttribute('stroke-width',2);
    if(lit) grp.classList.add('lit');
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('lit'); });
    return grp;
  }
  function door(g,x,y,w,h,fill){
    var grp=el('g',{'class':'door'},g), cx=x+w/2;
    el('ellipse',{cx:cx,cy:y+h+8,rx:w*1.4,ry:14,fill:'#ffb35c','class':'spill',filter:'url(#blurG)'},grp);
    var main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.4)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.4)+' L '+(x+w)+' '+(y+h)+' Z'},grp);
    main.setAttribute('fill',fill); main.setAttribute('stroke',INK); main.setAttribute('stroke-width',2);
    el('circle',{cx:x+w-7,cy:y+h*0.55,r:2.5,fill:INK},grp);
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('open'); });
    return grp;
  }
  function treeDoodle(g,x,y,h,color){
    el('path',{d:'M '+x+' '+y+' L '+x+' '+(y-h)+' M '+x+' '+(y-h*0.55)+' L '+(x-14)+' '+(y-h*0.75)+' M '+x+' '+(y-h*0.7)+' L '+(x+13)+' '+(y-h*0.9),fill:'none',stroke:color,'stroke-width':2.5},g);
    for(var i=0;i<6;i++) el('circle',{cx:(x+rr(-20,20)).toFixed(0),cy:(y-h+rr(-14,6)).toFixed(0),r:3,fill:color,opacity:.8},g);
  }

  var DARK='#2a2320', LITC='#e08b3f', WHITE='#ece8dc', ROOF='#e8e4da';

  /* البرج الأبيض (يسار) */
  var T1=tower(layerMid,'البرج الأبيض');
  el('rect',{x:62,y:340,width:100,height:420,fill:WHITE,stroke:INK,'stroke-width':2},T1);
  cone(T1,'52,345 172,345 112,68',ROOF,function(g){
    for(var y=120;y<340;y+=22) for(var x=58;x<166;x+=20)
      el('path',{d:'M '+x+' '+y+' l 10 -9 l 10 9',fill:'none',stroke:'#b5b1a6','stroke-width':1.4},g);
  });
  addWin(T1,78,368,20,34,'arch',LITC,true);
  addWin(T1,126,368,20,34,'arch',LITC,true);
  addWin(T1,96,436,22,36,'arch',DARK,false);
  addWin(T1,70,492,22,38,'arch',LITC,true);
  addWin(T1,122,492,22,38,'arch',LITC,true);
  treeDoodle(T1,105,740,90,'#6b675e');

  /* برج الزهور */
  var T2=tower(layerMid,'برج الزهور');
  el('rect',{x:182,y:332,width:76,height:300,fill:WHITE,stroke:INK,'stroke-width':2},T2);
  cone(T2,'176,336 264,336 220,128',ROOF,function(g){
    for(var y=160;y<330;y+=26) el('line',{x1:180,y1:y,x2:260,y2:y,stroke:'#c9c5bb','stroke-width':1.2,opacity:.7},g);
  });
  addWin(T2,212,362,22,34,'arch',LITC,true);
  addWin(T2,224,424,18,30,'rect',LITC,true);
  for(var f2=0;f2<6;f2++) el('path',{d:spiralD(rr(190,250),rr(480,620),6,2.5),fill:'none',stroke:'#b5b1a6','stroke-width':1.2},T2);

  /* البرج الرمادي */
  var T4=tower(layerMid,'البرج الرمادي');
  el('rect',{x:262,y:462,width:88,height:310,fill:'#e6e2d6',stroke:INK,'stroke-width':2},T4);
  cone(T4,'258,462 352,462 305,288','#b5b1a6',function(g){
    for(var y=300;y<462;y+=14) for(var x=258;x<352;x+=16)
      el('path',{d:'M '+x+' '+y+' A 8 8 0 0 1 '+(x+16)+' '+y,fill:'none',stroke:'#8a8578','stroke-width':1.3},g);
  });
  addWin(T4,292,502,22,36,'arch',LITC,true);
  addWin(T4,268,576,14,20,'rect',DARK,false);
  addWin(T4,322,600,14,20,'rect',DARK,false);
  addWin(T4,300,690,14,20,'rect',DARK,false);

  /* برج الحلزونات */
  var T5=tower(layerMid,'برج الحلزونات');
  el('rect',{x:348,y:472,width:80,height:310,fill:WHITE,stroke:INK,'stroke-width':2},T5);
  cone(T5,'344,472 432,472 388,252','#cfcbc2',function(g){
    for(var i=0;i<9;i++) el('path',{d:spiralD(rr(352,428),rr(280,465),rr(6,12),3),fill:'none',stroke:'#9a958a','stroke-width':1.3},g);
  });
  addWin(T5,378,540,20,30,'arch',DARK,false);
  addWin(T5,378,596,20,32,'arch',LITC,true);
  addWin(T5,362,652,20,32,'arch',LITC,true);
  door(T5,382,708,26,64,DARK);

  /* البرج الكبير (يمين) */
  var T6=tower(layerMid,'البرج الكبير');
  el('rect',{x:432,y:432,width:112,height:350,fill:WHITE,stroke:INK,'stroke-width':2},T6);
  cone(T6,'428,432 546,432 487,163',ROOF,function(g){
    for(var y=200;y<430;y+=18) el('line',{x1:430,y1:y,x2:544,y2:y,stroke:'#d5d1c7','stroke-width':1.1,opacity:.8},g);
  });
  addWin(T6,452,466,20,34,'arch',LITC,true);
  addWin(T6,500,466,20,34,'arch',LITC,true);
  addWin(T6,474,536,20,34,'arch',LITC,true);
  addWin(T6,478,596,20,32,'arch',DARK,false);
  addWin(T6,486,646,20,32,'arch',LITC,true);
  door(T6,478,700,30,70,DARK);
  for(var st=0;st<4;st++) el('line',{x1:474,y1:772+st*7,x2:512,y2:772+st*7,stroke:'#8a8578','stroke-width':2},T6);
  treeDoodle(T6,520,700,70,'#8a8578');

  /* شجرة دائرية */
  var rt=tower(layerMid,'الشجرة المورقة');
  el('line',{x1:410,y1:780,x2:410,y2:660,stroke:'#8a8578','stroke-width':4},rt);
  el('circle',{cx:410,cy:640,r:26,fill:'#c9b281',stroke:INK,'stroke-width':2},rt);
  el('path',{d:spiralD(410,640,20,3.5),fill:'none',stroke:'#8a6b3f','stroke-width':1.3},rt);

  /* شجرة عارية */
  var bt=tower(layerMid,'الشجرة النائمة');
  el('path',{d:'M 300 780 L 300 640 M 300 700 L 282 668 M 300 676 L 318 646 M 300 640 L 292 616 M 300 640 L 310 618',fill:'none',stroke:'#141414','stroke-width':3.5,'stroke-linecap':'round'},bt);

  /* الكوخ المرقّط (أمام) */
  var T3=tower(layerMid,'الكوخ المرقّط');
  el('rect',{x:146,y:592,width:108,height:170,fill:'#f0ece2',stroke:INK,'stroke-width':2},T3);
  for(var d3=0;d3<26;d3++) el('circle',{cx:rr(150,250).toFixed(0),cy:rr(598,756).toFixed(0),r:rr(1,2.4).toFixed(1),fill:'#9a958a',opacity:.8},T3);
  cone(T3,'138,592 262,592 200,408','#cfcbc2',function(g){
    for(var y=420;y<592;y+=13) for(var x=140;x<258;x+=17)
      el('path',{d:'M '+x+' '+y+' A 8.5 8.5 0 0 1 '+(x+17)+' '+y,fill:'none',stroke:'#8a8578','stroke-width':1.2},g);
  });
  addWin(T3,190,606,20,30,'arch',LITC,true);
  addWin(T3,152,660,20,30,'arch',LITC,true);
  addWin(T3,226,660,20,30,'arch',LITC,true);
  door(T3,181,680,38,82,'#d97e35');

  /* ---------- الأمامية: طريق، سياج، شجيرات ---------- */
  el('path',{d:'M 110 850 C 180 782 260 772 340 788 C 430 806 520 818 600 826 L 600 850 Z',fill:'#efece2',stroke:INK,'stroke-width':2},layerFront);
  el('path',{d:'M 130 848 C 200 788 280 780 350 794 C 440 812 520 822 596 830',fill:'none',stroke:'#9a958a','stroke-width':1.5,'stroke-dasharray':'8 8'},layerFront);
  el('path',{d:'M 322 800 q 6 -6 10 0 q 6 -6 10 0',fill:'none',stroke:INK,'stroke-width':2},layerFront);

  function fence(x0,x1,y){
    for(var x=x0;x<=x1;x+=10) el('line',{x1:x,y1:y,x2:x,y2:y+46,stroke:'#b5b1a6','stroke-width':3},layerFront);
    el('line',{x1:x0,y1:y+12,x2:x1,y2:y+12,stroke:'#b5b1a6','stroke-width':2.5},layerFront);
  }
  fence(4,120,798); fence(470,596,792);

  function bush(x,y){
    var g=el('g',{'class':'plant'},layerFront);
    for(var i=0;i<9;i++){
      var a=(-160+i*15)*Math.PI/180;
      el('ellipse',{cx:x+Math.cos(a)*22,cy:y+Math.sin(a)*20,rx:10,ry:5,fill:'#8a8a8f',opacity:.9,transform:'rotate('+(a*180/Math.PI)+' '+(x+Math.cos(a)*22)+' '+(y+Math.sin(a)*20)+')'},g);
    }
    el('line',{x1:x,y1:y,x2:x,y2:y+40,stroke:'#8a8a8f','stroke-width':3},g);
  }
  bush(55,770); bush(555,762); bush(20,740);

  /* يراعات */
  for(var fy=0;fy<7;fy++){
    var fc=el('circle',{cx:rr(30,570).toFixed(0),cy:rr(700,800).toFixed(0),r:2.2,fill:'#ffe9a0','class':'fly',style:'animation-delay:'+rr(0,1.6).toFixed(1)+'s'},layerFront);
    fc.animate([
      {transform:'translate(0,0)'},
      {transform:'translate('+rr(-40,40).toFixed(0)+'px,'+rr(-30,10).toFixed(0)+'px)'},
      {transform:'translate('+rr(-40,40).toFixed(0)+'px,'+rr(-30,10).toFixed(0)+'px)'},
      {transform:'translate(0,0)'}
    ],{duration:rr(6000,11000),iterations:Infinity,easing:'ease-in-out'});
  }

  /* ---------- القطة ---------- */
  var walkD='M 120 845 C 200 782 300 774 380 792 C 460 810 520 820 596 828';
  var walkPath=el('path',{d:walkD,fill:'none',stroke:'none'},layerFront);
  var cat=el('g',{visibility:'hidden'},layerFront);
  el('path',{d:'M -14 -6 Q -24 -12 -19 -24',fill:'none',stroke:'#0b0b0b','stroke-width':3.5,'stroke-linecap':'round'},cat);
  el('ellipse',{cx:-2,cy:-8,rx:14,ry:8,fill:'#0b0b0b'},cat);
  el('circle',{cx:12,cy:-15,r:6.5,fill:'#0b0b0b'},cat);
  el('polygon',{points:'7,-19 10,-27 13,-19',fill:'#0b0b0b'},cat);
  el('polygon',{points:'13,-19 16,-27 19,-18',fill:'#0b0b0b'},cat);
  el('circle',{cx:14,cy:-15,r:1.1,fill:'#ffe9a0'},cat);
  var catOn=false, catT=0, walkLen=walkPath.getTotalLength();

  /* ---------- شهب ---------- */
  function shoot(x,y){
    var g=el('g',{},fxG);
    el('line',{x1:0,y1:0,x2:-46,y2:-30,stroke:'#f4efe4','stroke-width':2,opacity:.8},g);
    el('circle',{cx:0,cy:0,r:4,fill:'#f4efe4',filter:'url(#glowF)'},g);
    g.setAttribute('transform','translate('+x+','+y+')');
    g.animate([
      {transform:'translate('+x+'px,'+y+'px)',opacity:1},
      {transform:'translate('+(x+190)+'px,'+(y+130)+'px)',opacity:0}
    ],{duration:1100,easing:'ease-out'}).onfinish=(function(g2){ return function(){ g2.remove(); }; })(g);
  }
  svg.addEventListener('click',function(e){
    if(e.target.classList.contains('skyrect')){
      var m=svg.getScreenCTM().inverse(), p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);
      shoot(p.x,p.y);
    }
  });
  document.getElementById('moonG').addEventListener('click',function(ev){
    ev.stopPropagation();
    var mg=document.getElementById('moonG');
    mg.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:800,easing:'ease-in-out'});
    setTimeout(function(){ shoot(300,120); },150);
    setTimeout(function(){ shoot(180,80); },450);
    setTimeout(function(){ shoot(420,150); },750);
  });

  /* تلميحات */
  document.querySelectorAll('.tower').forEach(function(g){
    if(!g.dataset.name) return;
    g.addEventListener('pointerenter',function(){ tip.textContent=g.dataset.name; tip.style.opacity=1; });
    g.addEventListener('pointermove',function(e){ tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-8)+'px'; });
    g.addEventListener('pointerleave',function(){ tip.style.opacity=0; });
  });

  /* بارالاكس */
  var tx=0,ty=0,cx2=0,cy2=0;
  window.addEventListener('pointermove',function(e){ tx=(e.clientX/window.innerWidth)*2-1; ty=(e.clientY/window.innerHeight)*2-1; });
  (function loop(){
    cx2+=(tx-cx2)*0.06; cy2+=(ty-cy2)*0.06;
    [layerBack,layerMid,layerFront].forEach(function(L){
      var d=parseFloat(L.dataset.depth);
      L.style.transform='translate('+(cx2*d)+'px,'+(cy2*d*0.4)+'px)';
    });
    if(catOn){
      catT=(catT+1.4)%walkLen;
      var p=walkPath.getPointAtLength(catT), p2=walkPath.getPointAtLength(Math.min(walkLen,catT+4));
      var ang=Math.atan2(p2.y-p.y,p2.x-p.x)*180/Math.PI;
      cat.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+') rotate('+ang.toFixed(1)+')');
      cat.setAttribute('visibility','visible');
    }
    requestAnimationFrame(loop);
  })();

  /* أزرار */
  document.getElementById('shootBtn').addEventListener('click',function(){
    for(var i=0;i<4;i++) (function(i){ setTimeout(function(){ shoot(rr(40,400),rr(30,200)); },i*260); })(i);
  });
  document.getElementById('lightBtn').addEventListener('click',function(){
    var wins=Array.prototype.slice.call(document.querySelectorAll('.win'));
    var allLit=wins.every(function(w){ return w.classList.contains('lit'); });
    wins.forEach(function(w){ w.classList.toggle('lit',!allLit); });
    document.querySelectorAll('.door').forEach(function(d){ d.classList.toggle('open',!allLit); });
  });
  document.getElementById('catBtn').addEventListener('click',function(){
    catOn=!catOn;
    if(!catOn) cat.setAttribute('visibility','hidden');
  });
  document.getElementById('resetBtn').addEventListener('click',function(){ location.reload(); });
})();
</script>
</body>
</html>
