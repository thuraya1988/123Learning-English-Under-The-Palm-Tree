<style>
:root{--cy:#4fe3ff;--cy2:#9beaff;--bg:#03111b;--panel:rgba(4,22,32,.86);--bd:rgba(80,215,255,.28);--gd:#ffd35c;--gd2:#ffea9e;--ok:#5dffa8;--wr:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Cairo',sans-serif;color:#dff4fb;user-select:none}
#app{position:fixed;inset:0}

.hidden{display:none!important}

.btn{font-family:'Cairo';font-weight:700;font-size:14px;color:#dff4fb;background:linear-gradient(180deg,rgba(18,72,92,.9),rgba(8,40,54,.9));border:1px solid var(--bd);border-radius:8px;padding:10px 20px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cy);box-shadow:0 0 18px rgba(79,227,255,.35);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(180deg,#b98a1e,#7c5a10);border-color:#ffd35c;color:#fff8e0}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(1,8,13,.66);backdrop-filter:blur(4px)}
.mbox{max-width:720px;width:92%;max-height:88vh;overflow:auto;padding:26px 30px;position:relative}
.mtitle{font-size:26px;font-weight:700;color:var(--cy2)}
.msub{font-size:13px;color:#7fb9c9;margin-bottom:14px}
.mclose{position:absolute;top:14px;left:18px;font-size:20px;color:#9fd7e6;cursor:pointer;background:none;border:none}
.chip{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--bd);border-radius:20px;padding:3px 11px;margin:2px;color:#bfeaf5;background:rgba(20,80,100,.25)}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
.hbox{position:absolute;pointer-events:none}
#missionBox{top:14px;right:14px;padding:10px 16px;max-width:340px}
#missionObj{font-size:19px;font-weight:700;color:var(--gd2);margin:2px 0}
#missionProg{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:6px 0 4px}
#missionBar{height:100%;width:0%;background:linear-gradient(90deg,var(--cy),var(--ok));transition:width .4s}
#nearestTxt{font-size:12px;color:#9fd7e6}
#regionBox{top:14px;left:14px;padding:8px 14px;text-align:left;min-width:190px}
#regionName{font-size:20px;font-weight:700;color:var(--cy2)}
#readBox{bottom:14px;right:14px;padding:10px 14px;font-size:13px;line-height:1.65}
#statBox{bottom:14px;left:14px;padding:10px 16px;min-width:230px}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 8px}
.bar>div{height:100%;width:100%;border-radius:5px;transition:width .3s}
#o2b{background:linear-gradient(90deg,#3ad6ff,#8ff3ff)}
#btb{background:linear-gradient(90deg,#67e08a,#c6ff8a)}
.blab{display:flex;justify-content:space-between;font-size:11px;color:#7fb9c9}
#ptsRow{display:flex;gap:12px;font-size:13px;margin-top:4px;flex-wrap:wrap}
#ptsRow b{color:var(--gd)}
#prompt{top:62%;left:50%;transform:translate(-50%,-50%);text-align:center}
#promptMain{font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(79,227,255,.8)}
#promptSub{font-size:13px;color:var(--cy2);margin-top:2px}
#toasts{bottom:110px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:rgba(5,30,42,.9);border:1px solid var(--bd);border-right:4px solid var(--cy);border-radius:8px;padding:8px 18px;font-size:15px;font-weight:700;color:#e8fbff;animation:tin .3s ease;white-space:nowrap}
.toast.gold{border-right-color:var(--gd);color:var(--gd2)}
.toast.good{border-right-color:var(--ok);color:#c9ffe2}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
#viewHint{top:70px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(160,220,235,.55)}
#menu{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,#0a4a5e 0%,#052534 45%,#02101a 100%)}
#title{font-size:min(7vw,64px);font-weight:700;color:#eafbff;text-shadow:0 0 34px rgba(79,227,255,.55)}
#title span{color:var(--cy)}
#tagline{font-size:15px;color:#8fd0de;margin-top:6px}
#menuBtns{margin-top:34px;display:flex;flex-direction:column;gap:12px;width:300px;z-index:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;background:rgba(10,40,55,.35)}
.card .ct{font-weight:700;font-size:15px}
.card .cs{font-size:12px;color:#8fc6d4;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(80,215,255,.12)}
.lvlBtn{width:52px;height:52px;border-radius:10px;border:1px solid var(--bd);background:rgba(10,45,60,.5);color:#dff4fb;font-family:'Cairo';font-weight:700;font-size:17px;cursor:pointer}
.lvlBtn.lock{opacity:.28;cursor:not-allowed}
.lvlBtn.done{border-color:var(--ok);color:#baffd9}
.lvlBtn.cur{border-color:var(--gd);color:var(--gd2);box-shadow:0 0 12px rgba(255,211,92,.4)}

.kword{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,211,92,.4);background:rgba(120,90,20,.18);color:var(--gd2);font-weight:700;cursor:pointer;font-size:14px}

#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;pointer-events:none;z-index:15;opacity:.6}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--cy);box-shadow:0 0 6px var(--cy)}

#crosshair::after{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}
#torpCount{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:6px 16px;font-weight:700;color:var(--gd);font-size:14px;pointer-events:none}
#dmgFlash{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(255,60,60,.35));opacity:0;z-index:19;pointer-events:none;transition:opacity .25s}

</head>

function terrainH(x,z){
 const t=clamp(z/REGION_LEN,0,6.999),i=Math.floor(t),f=t-i,s=f*f*(3-2*f);
 let h=-(REGIONS[i].depth*(1-s)+REGIONS[Math.min(6,i+1)].depth*s);
 h+=Math.sin(x*.05+z*.03)*4+Math.cos(x*.02-z*.01)*2;
 return h;
}

function buildLevels(){
 const L=[];
 const plans=[
  [['hunt',3],['collect',3],['hunt',5],['collect',5],['hunt',8]],
  [['net',1],['collect',8],['hunt',10],['rescue',1]],
  [['hunt','shark',1],['collect',10],['hunt',15]],
  [['net',3],['rescue',1],['collect',12],['hunt',20]],
  [['hunt','grouper',2],['collect',12],['net',2]],
  [['hunt','angler',1],['hunt','squid',1],['collect',12],['net',3]],
  [['collect',15],['net',4],['rescue',2],['hunt','shark',2]]];
 for(let l=1;l<=48;l++){
  const w=l<=8?0:l<=16?1:l<=24?2:l<=32?3:l<=40?4:l<=45?5:6;
  const plan=plans[w];
  const az=60+(l-1)*67,region=Math.min(6,Math.floor(az/REGION_LEN));
  const goals=plan.map(p=>{
   if(p[0]==='hunt')return{type:'hunt',need:p[1],sp:p[2]||null,have:0};
   if(p[0]==='collect')return{type:'collect',need:p[1],have:0};
   if(p[0]==='net')return{type:'net',need:p[1],have:0};
   if(p[0]==='rescue')return{type:'rescue',need:p[1],have:0};
   return{type:'collect',need:3,have:0};
  });
  L.push({id:l,world:w,region,az,goals,weather:['CALM','CALM','CURRENT','STORM'][l%4],reward:20+l*2});
 }
 return L;
}

function curGoal(){return S.mission&&!S.mission.done?S.mission.goals[S.mission.gi]:null;}

 if(ev==='collect'&&g.type==='collect'){g.have++;if(g.have>=g.need)advanceGoal();}

 if(ev==='rescue'&&g.type==='rescue'){g.have++;if(g.have>=g.need)advanceGoal();}
 updateMissionHUD();
}

 const L=LEVELS[S.level-1];S.pts.ocean+=L.reward;S.unlocked=Math.max(S.unlocked,Math.min(48,S.level+1));

}

 noiseB(d=.3,fq=800,g=.15){if(!this.ok)return;const t=this.ctx.currentTime;const n=this.ctx.createBufferSource(),buf=this.ctx.createBuffer(1,this.ctx.sampleRate*d,this.ctx.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;n.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;const v=this.ctx.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f);f.connect(v);v.connect(this.master);n.start();},

 if(e.code==='KeyE')tryInteract();
 if(e.code==='KeyM')openMap();
 if(e.code==='KeyB')openDB();
 if(e.code==='KeyU')openUpgrades();
 if(e.code==='KeyK')openAch();
});

function tryInteract(){
 const p=sub.position;const armR=8;
 let best=null,bd=armR+3;
 for(const t of S.levelItems.trash){if(t.state!=='idle')continue;const d=t.mesh.position.distanceTo(p);if(d<bd){bd=d;best={k:'trash',r:t};}}
 for(const n of S.levelItems.nets){if(n.state!=='idle')continue;const d=n.g.position.distanceTo(p);if(d<bd){bd=d;best={k:'net',r:n};}}
 for(const r of S.levelItems.rescue){if(r.state==='freed')continue;const d=r.solo.g.position.distanceTo(p);if(d<bd){bd=d;best={k:'rescue',r};}}
 if(!best)return;
 if(best.k==='trash')finishCollect(best.r);
 else if(best.k==='net'){S.cutting=best.r;S.cutProg=0;}
 else if(best.k==='rescue')rescueInteract(best.r);
}
function finishCollect(t){
 scene.remove(t.mesh);t.state='gone';
 S.pts.ocean+=t.pts;S.stats.trash++;
 S.regionClean[t.region]=(S.regionClean[t.region]||0)+1;
 SFX.collect();toast(`تم جمع ${t.name} +${t.pts}`,'good');addLog(`جمع ${t.name}`);
 if(S.stats.trash>=25)unlockAch('cleaner');
 checkRestore(t.region);missionEvent('collect');updateMissionHUD();
}
function cutNetDone(n){
 n.state='cut';scene.remove(n.g);S.stats.nets++;S.pts.ocean+=25;
 S.regionClean[n.region]=(S.regionClean[n.region]||0)+1;
 SFX.collect();toast('تم إزالة الشبكة +25','good');addLog('إزالة شبكة شبحية');
 if(S.stats.nets>=10)unlockAch('reef_pro');
 checkRestore(n.region);missionEvent('net');
}
function rescueInteract(r){
 if(r.state==='trapped'){S.cutting=r;S.cutProg=0;}
 else if(r.state==='cut'){
  r.state='freed';r.solo.freed=true;if(r.solo.netWrap)r.solo.g.remove(r.solo.netWrap);
  S.stats.rescues++;S.pts.ocean+=50;SFX.chime();
  toast('تم إنقاذ السلحفاة +50','gold');addLog('إنقاذ سلحفاة');
  unlockAch('first_rescue');if(S.stats.rescues>=3)unlockAch('tfriend');missionEvent('rescue');
 }
}
function checkRestore(r){
 const tot=S.regionTotal[r]||0,clean=S.regionClean[r]||0;
 if(tot>0&&clean/tot>=.8&&!S.stats.restored.has(r)){
  S.stats.restored.add(r);SFX.chime();
  toast(`تم استعادة ${REGIONS[r].name}!`,'gold');addLog(`استعادة ${REGIONS[r].name}`);
  if(S.stats.restored.size>=3)unlockAch('restore');save();
 }
}
function regionHealth(r){const tot=S.regionTotal[r]||1,clean=S.regionClean[r]||0;return Math.round(25+70*(clean/tot));}

const clock=new THREE.Clock();let curRegion=-1;
function updateSub(dt){
 const boost=keys['ShiftLeft']&&S.batt>5;
 const maxV=(S.upg.engine===1?7:S.upg.engine===2?9:11.5)*(boost?1.6:1);
 let th=0;if(keys['KeyW'])th=1;if(keys['KeyS'])th=-.6;
 SV.throttle=lerp(SV.throttle,th,dt*3);SV.v=lerp(SV.v,SV.throttle*maxV,dt*1.4);
 let turn=0;if(keys['KeyA'])turn=1;if(keys['KeyD'])turn=-1;
 SV.heading+=turn*dt*1.15;
 let vv=0;if(keys['Space'])vv=1;if(keys['ControlLeft']||keys['ControlRight'])vv=-1;
 SV.vy=lerp(SV.vy,vv*3.4,dt*2.2);
 const fx=Math.sin(SV.heading),fz=Math.cos(SV.heading);
 sub.position.x+=fx*SV.v*dt;sub.position.z+=fz*SV.v*dt;sub.position.y+=SV.vy*dt;
 sub.position.x=clamp(sub.position.x,-320,175);sub.position.z=clamp(sub.position.z,-10,3440);
 const floor=terrainH(sub.position.x,sub.position.z)+1.5;
 if(sub.position.y<floor){sub.position.y=floor;SV.vy=Math.max(0,SV.vy);}
 if(sub.position.y>1.2)sub.position.y=1.2;
 SV.pitch=lerp(SV.pitch,-SV.vy*.09,dt*3);SV.roll=lerp(SV.roll,-turn*.12,dt*3);
 sub.rotation.set(SV.pitch,SV.heading,SV.roll);
 SUBPROP.rotation.z+=SV.throttle*dt*22+dt*2;
 // موارد
 const o2Max=S.upg.oxygen===1?100:S.upg.oxygen===2?130:165;
 S.o2-=dt*.4;if(sub.position.y>-2.5)S.o2=Math.min(o2Max,S.o2+dt*14);S.o2=clamp(S.o2,0,o2Max);
 let drain=.12+(boost?.55:0)+(S.lightsOn?.18:0);S.batt-=dt*drain;
 if(sub.position.y>-2.5)S.batt+=dt*5;S.batt=clamp(S.batt,0,165);
 if(S.o2<=0){sub.position.set(-45,-4,30);S.o2=o2Max;SFX.alarm();}
 if(S.o2<25||S.batt<15)if(Math.floor(S.time*2)%2===0)SFX.alarm();
 // طوربيدات إعادة تعبئة
 S.torpReloadT=Math.max(0,S.torpReloadT-dt);
 if(S.upg.torpedoes>=4&&S.torps<S.torpMax)S.torps=Math.min(S.torpMax,S.torps+dt*.3);
 S.stats.minDepth=Math.min(S.stats.minDepth,sub.position.y);
 if(S.stats.minDepth<-45)unlockAch('deep');
 // منطقة
 const r=clamp(Math.floor(sub.position.z/REGION_LEN),0,6);
 if(r!==curRegion){curRegion=r;if(!S.stats.regions.has(r)){S.stats.regions.add(r);
  toast(`دخول ${REGIONS[r].name}`,'gold');addLog(`دخول ${REGIONS[r].name}`);
  if(S.stats.regions.size===7)unlockAch('explorer');save();}}
}
function updateTorpedoes(dt){
 for(let i=torpedoes.length-1;i>=0;i--){
  const t=torpedoes[i];t.life-=dt;
  t.mesh.position.x+=t.vx*dt;t.mesh.position.z+=t.vz*dt;t.mesh.position.y+=t.vy*dt;
  t.mesh.rotation.z+=dt*10;
  // اصطدام بكائنات
  let hit=false;
  for(const sc of creatures.schools){
   const d=Math.hypot(t.mesh.position.x-sc.cx,t.mesh.position.z-sc.cz);
   if(d<10){
    // قتل الأسماك في النطاق
    let killed=0;
    for(const f of sc.fish){if(!f.alive)continue;
     const fd=Math.hypot(t.mesh.position.x-(sc.cx+f.ox),t.mesh.position.z-(sc.cz+f.oz));
     if(fd<4){f.alive=false;killed++;}}
    if(killed>0){
     const sp=SPECIES[sc.sp];S.pts.hunt+=killed*sp.pts;S.stats.hunts+=killed;
     SFX.boom();toast(`صيد ${killed} ${sp.n} +${killed*sp.pts}`,'gold');
     addLog(`صيد ${killed} ${sp.n}`);
     if(!S.disc.has(sc.sp)){S.disc.add(sc.sp);S.pts.disc+=20;toast(`اكتشاف جديد: ${sp.n}`,'gold');}
     unlockAch('first_hunt');if(sp.kind==='shark'&&S.stats.hunts>=5)unlockAch('shark_hunter');
     if(sub.position.y<-45)unlockAch('deep_hunter');
     missionEvent('hunt',sc.sp);
     explode(t.mesh.position);
    }
    hit=true;break;
   }
  }
  if(!hit){
   for(const s of creatures.solos){if(!s.alive)continue;
    const d=t.mesh.position.distanceTo(s.g.position);
    if(d<3){
     s.hp--;
     if(s.hp<=0){s.alive=false;const sp=SPECIES[s.sp];
      if(!sp.friendly){S.pts.hunt+=sp.pts;S.stats.hunts++;SFX.boom();
       toast(`صيد ${sp.n} +${sp.pts}`,'gold');addLog(`صيد ${sp.n}`);
       if(!S.disc.has(s.sp)){S.disc.add(s.sp);S.pts.disc+=20;}
       unlockAch('first_hunt');missionEvent('hunt',s.sp);
      }else{toast(`${sp.n} صديق! لا تصطاده`,'gold');}
      explode(t.mesh.position);s.g.visible=false;
     }else{SFX.boom();explode(t.mesh.position);}
     hit=true;break;
    }
   }
  }
  // اصطدام بالقاع
  const fh=terrainH(t.mesh.position.x,t.mesh.position.z);
  if(t.mesh.position.y<fh+1||t.life<=0||hit){
   explode(t.mesh.position);torpedoes.splice(i,1);continue;
  }
 }
}
function explode(p){
 const geo=new THREE.SphereGeometry(2,8,6);
 const mat=new THREE.MeshBasicMaterial({color:0xff7a18,transparent:true,opacity:.8});
 const flash=new THREE.Mesh(geo,mat);flash.position.copy(p);scene.add(flash);
 setTimeout(()=>scene.remove(flash),200);
 for(let i=0;i<10;i++){
  const bg=new THREE.SphereGeometry(.3,6,4);
  const bm=new THREE.MeshBasicMaterial({color:0x9a8a68,transparent:true,opacity:.5});
  const b=new THREE.Mesh(bg,bm);
  b.position.copy(p);b.position.x+=rand(-2,2);b.position.y+=rand(-1,1);b.position.z+=rand(-2,2);
  scene.add(b);setTimeout(()=>scene.remove(b),800);
 }
}
function updateCreatures(dt){
 const p=sub.position;
 for(const sc of creatures.schools){
  sc.wpT-=dt;if(sc.wpT<=0){sc.wpT=rand(6,12);
   const r=clamp(Math.floor(sc.cz/REGION_LEN),0,6);
   sc.wp.set(clamp(sc.cx+rand(-70,70),-260,80),rand(-REGIONS[r].depth+2,-5),sc.cz+rand(-70,70));}
  let panic=0;const dSub=Math.hypot(sc.cx-p.x,sc.cy-p.y,sc.cz-p.z);if(dSub<17)panic=1;
  const dir=new THREE.Vector3(sc.wp.x-sc.cx,0,sc.wp.z-sc.cz).normalize();
  const sp=SPECIES[sc.sp];sc.cx+=dir.x*sc.speed*dt*(panic?2.2:1);sc.cz+=dir.z*sc.speed*dt*(panic?2.2:1);
  sc.cy=lerp(sc.cy,sc.wp.y,dt*.2);
  const dummy=new THREE.Object3D();
  for(let i=0;i<sc.fish.length;i++){const f=sc.fish[i];if(!f.alive){
   dummy.position.set(0,-999,0);dummy.scale.setScalar(.001);dummy.updateMatrix();sc.mesh.setMatrixAt(i,dummy.matrix);continue;}
   f.ph+=dt*4;
   dummy.position.set(sc.cx+f.ox+Math.sin(f.ph)*.3,sc.cy+f.oy+Math.sin(f.ph*1.3)*.2,sc.cz+f.oz);
   dummy.rotation.set(0,Math.atan2(dir.x,dir.z),Math.sin(f.ph)*.15);
   dummy.scale.setScalar(sp.s);dummy.updateMatrix();sc.mesh.setMatrixAt(i,dummy.matrix);}
  sc.mesh.instanceMatrix.needsUpdate=true;
 }
 for(const s of creatures.solos){if(!s.alive)continue;
  const sp=SPECIES[s.sp];s.t+=dt;
  if(sp.kind==='turtle'){
   if(s.freed){s.heading+=dt*.1;s.g.position.x+=Math.sin(s.heading)*2.4*dt;s.g.position.z+=Math.cos(s.heading)*2.4*dt;s.g.position.y+=dt*.8;if(s.g.position.y>-1.5)s.g.visible=false;}
   else if(!s.rescueRef||s.rescueRef.state!=='trapped'){s.heading+=Math.sin(s.t*.2)*.01;s.g.position.x+=Math.sin(s.heading)*1*dt;s.g.position.z+=Math.cos(s.heading)*1*dt;
    const fl=terrainH(s.g.position.x,s.g.position.z)+1.4;s.g.position.y=lerp(s.g.position.y,fl+Math.sin(s.t*.7)*.6,dt);s.g.rotation.y=s.heading;}
  }else if(sp.kind==='shark'){
   s.heading+=dt*.14;const R2=110;s.g.position.x=s.home.x+Math.cos(s.heading)*R2;s.g.position.z=s.home.z+Math.sin(s.heading)*R2;
   s.g.position.y=s.home.y+Math.sin(s.t*.5)*2;s.g.rotation.y=-s.heading+Math.PI/2;
  }else if(sp.kind==='whale'){
   s.g.position.x+=Math.sin(s.heading)*s.speed*dt;s.g.position.z+=Math.cos(s.heading)*s.speed*dt;s.g.rotation.y=s.heading;
  }else{
   s.heading+=Math.sin(s.t)*.2*dt;s.g.position.x+=Math.sin(s.heading)*s.speed*.5*dt;s.g.position.z+=Math.cos(s.heading)*s.speed*.5*dt;
   s.g.rotation.y=s.heading;
  }
 }
}
function updateCamera(dt){
 const p=sub.position;const fx=Math.sin(SV.heading),fz=Math.cos(SV.heading);
 let pos=new THREE.Vector3(),tgt=new THREE.Vector3();
 if(S.view==='third'){pos.set(p.x-fx*13,p.y+5.5,p.z-fz*13);tgt.set(p.x+fx*6,p.y+1,p.z+fz*6);}
 else if(S.view==='free'){pos.set(p.x+Math.sin(S.time*.3)*15,p.y+8,p.z+Math.cos(S.time*.3)*15);tgt.copy(p);}
 else{const seat=sub.localToWorld(new THREE.Vector3(0,.75,.9));pos.copy(seat);
  const ly=SV.heading-mouseNX*.9,lp=-mouseNY*.5;
  tgt.set(pos.x+Math.sin(ly)*Math.cos(lp)*20,pos.y+Math.sin(lp)*20,pos.z+Math.cos(ly)*Math.cos(lp)*20);}
 const k=1-Math.exp(-dt*5);
 camera.position.lerp(pos,k);camera.lookAt(tgt);
}
function updateDayNight(dt){
 S.dayT=(S.dayT+dt/420)%1;const ph=S.dayT;
 const elev=Math.sin(ph*Math.PI*2-Math.PI/2)*-1;const dayF=clamp(elev*1.4+.15,0,1);
 sun.intensity=.25+dayF*2.4;hemi.intensity=.25+dayF*.6;amb.intensity=.2+dayF*.35;
 const sunA=ph*Math.PI*2-Math.PI/2;
 sun.position.set(sub.position.x+Math.cos(sunA)*80,Math.sin(sunA)*100+10,sub.position.z+30);
 sun.target.position.copy(sub.position);
 const isNight=dayF<.2;
 const spotI=S.lightsOn?(S.upg.lights===1?40:S.upg.lights===2?70:110):0;
 spotL.intensity=spotR.intensity=spotI*(isNight?1:.65);
 const r=clamp(Math.floor(sub.position.z/REGION_LEN),0,6);
 const regW=new THREE.Color(REGIONS[r].water);const deepW=new THREE.Color('#04141e');
 const depthF=clamp(-sub.position.y/45,0,1);
 const fogC=regW.clone().lerp(deepW,depthF*.8).lerp(new THREE.Color('#02040a'),1-dayF);
 scene.fog.color.copy(fogC);scene.fog.density=.02+depthF*.012+(1-dayF)*.012;
 waterMat.uniforms.uColA.value.copy(fogC).multiplyScalar(.8);
 waterMat.uniforms.uColB.value.copy(regW).lerp(new THREE.Color('#bfe8f0'),dayF*.5);
}
function updateHUD(dt){
 const p=sub.position;
 $('rDepth').textContent=`${Math.max(0,-p.y).toFixed(1)} م`;
 $('rSpeed').textContent=`${Math.abs(SV.v*1.94).toFixed(1)} عقدة`;
 const r=clamp(Math.floor(p.z/REGION_LEN),0,6);
 $('rTemp').textContent=`${(26-(-p.y)*.22).toFixed(1)}°C`;
 $('rPres').textContent=`${(1+Math.max(0,-p.y)/10).toFixed(1)} atm`;
 $('o2b').style.width=S.o2+'%';$('btb').style.width=S.batt+'%';
 $('o2v').textContent=Math.round(S.o2)+'%';$('btv').textContent=Math.round(S.batt)+'%';
 $('pOcean').textContent=S.pts.ocean;$('pDisc').textContent=S.pts.disc;$('pHunt').textContent=S.pts.hunt;$('pExpl').textContent=S.pts.explore;
 $('regionName').textContent=REGIONS[r].name;
 $('healthChip').textContent=`المحيط ${regionHealth(r)}%`;
 $('torpNum').textContent=Math.floor(S.torps);
 $('timeChip').textContent=S.dayT<.4?'صباح':S.dayT<.58?'ظهيرة':'مساء';
 waterMat.uniforms.uT.value=S.time;
}
function updateMissionHUD(){
 const g=curGoal();const L=LEVELS[S.level-1];
 $('lvlTag').textContent=`L${S.level}·W${L.world+1}`;
 if(!g){$('missionObj').textContent=S.mission&&S.mission.done?'اكتملت المهمة':'لا توجد مهمة';$('missionBar').style.width='100%';return;}
 let txt='';
 if(g.type==='hunt')txt=`اصطياد ${g.have}/${g.need} ${g.sp?SPECIES[g.sp]?.n||'':'كائنات'}`;
 else if(g.type==='collect')txt=`جمع ${g.have}/${g.need} قمامة`;
 else if(g.type==='net')txt=`إزالة ${g.have}/${g.need} شبكة`;
 else if(g.type==='rescue')txt=`إنقاذ ${g.have}/${g.need} سلحفاة`;
 $('missionObj').textContent=txt;
 let pct=0;if(g.have!==undefined&&g.need)pct=g.have/g.need;
 $('missionBar').style.width=Math.min(100,pct*100)+'%';
}
function updateCutting(dt){
 if(!S.cutting)return;
 const target=S.cutting;const dp=(target.g?target.g.position:target.solo.g.position).distanceTo(sub.position);
 if(keys['KeyE']&&dp<16){S.cutProg+=dt/2.2;
  $('promptMain').textContent=target.solo?'قطع الشبكة':'إزالة الشبكة';
  $('promptSub').textContent=`اضغط E باستمرار ${Math.floor(S.cutProg*100)}%`;
  if(S.cutProg>=1){
   $('promptMain').textContent='';$('promptSub').textContent='';
   if(target.solo){target.state='cut';target.solo.g.remove(target.net);
    $('promptMain').textContent='اضغط E لإطلاق السلحفاة';
    if(target.solo.rescueRef)target.solo.rescueRef.state='cut';
   }else cutNetDone(target);
   S.cutting=null;S.cutProg=0;
  }
 }else{if(!keys['KeyE']){S.cutting=null;S.cutProg=0;$('promptMain').textContent='';$('promptSub').textContent='';}}
}
function updatePrompt(){
 if(S.cutting)return;
 let main='',sub2='';const p=sub.position;const armR=8;let bd=armR+3,bt=null;
 for(const t of S.levelItems.trash){if(t.state!=='idle')continue;const d=t.mesh.position.distanceTo(p);if(d<bd){bd=d;bt=t;}}
 if(bt){main=bt.name;sub2='[E] جمع';}
 else{for(const n of S.levelItems.nets){if(n.state!=='idle')continue;const d=n.g.position.distanceTo(p);if(d<bd){bd=d;main='شبكة صيد';sub2='اضغط [E] للقطع';}}
  if(!main)for(const r of S.levelItems.rescue){if(r.state==='freed')continue;const d=r.solo.g.position.distanceTo(p);if(d<bd){bd=d;main='سلحفاة محاصرة';sub2='[E] إنقاذ';}}}
 $('promptMain').textContent=main;$('promptSub').textContent=sub2;
}

/* ====================== الإقلاع ====================== */
function beginGame(){
 SFX.init();spawnRegionLife();spawnAmbient();
 S.started=true;$('menu').classList.add('hidden');$('hud').classList.remove('hidden');$('torpCount').classList.remove('hidden');
 addLog('بدأت الرحلة');openBrief(LEVELS[S.level-1]);
}
$('btnNew').onclick=()=>{SFX.init();beginGame();};
$('btnLevels').onclick=()=>{SFX.init();openLevels();};
$('btnHow').onclick=()=>{SFX.init();showControls();};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(.05,clock.getDelta());S.time+=dt;
 if(S.started&&!S.paused){updateSub(dt);updateTorpedoes(dt);updateCreatures(dt);updateDayNight(dt);updateHUD(dt);updateCutting(dt);updatePrompt();}
 updateCamera(dt);renderer.render(scene,camera);
}
animate();
</script>
</body>
