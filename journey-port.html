<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحت شجرة النخيل · ميناء عماني متكامل</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.8/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.8/700.css">
<link rel="icon" type="image/png" href="public/favicon.png">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#1a120a;
    font-family:'Cairo','Segoe UI',sans-serif; }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }
  .vignette{ position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(24,10,2,.45) 100%); }
  .panel{ position:fixed; z-index:10; background:rgba(24,16,8,.72);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(226,178,110,.28); border-radius:12px;
    box-shadow:0 10px 34px rgba(0,0,0,.45); color:#efe3cd; }
  #info{ top:18px; right:18px; padding:14px 18px 12px; max-width:370px; text-align:right; }
  #info h1{ margin:0; font-size:24px; font-weight:700; color:#f4e8d0; line-height:1.3; }
  #info h1 em{ font-style:normal; color:#e0a35c; }
  #info .latin{ font-size:10px; letter-spacing:.3em; color:#a98d5f; font-weight:600; margin-top:2px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{ font-size:11px; color:#e2d3b4; border:1px solid rgba(226,178,110,.32);
    border-radius:20px; padding:2px 10px; background:rgba(226,178,110,.08); }
  #back{ position:fixed; top:18px; left:18px; z-index:11; padding:9px 15px; border-radius:999px;
    background:rgba(24,16,8,.8); border:1px solid rgba(226,178,110,.4); color:#f0e4c8;
    font-family:inherit; font-size:12px; font-weight:700; text-decoration:none;
    backdrop-filter:blur(8px); }
  #back:hover{ background:rgba(96,68,34,.95); }
  #controls{ bottom:18px; left:50%; transform:translateX(-50%); padding:10px 16px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
    max-width:calc(100vw - 24px); }
  .grp{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .grp > span{ font-size:11px; font-weight:700; color:#c99d5f; margin-left:4px; }
  .sep{ width:1px; height:26px; background:rgba(226,178,110,.25); }
  .btn{ font-family:inherit; font-size:12px; font-weight:600; color:#f0e4c8;
    background:rgba(52,38,20,.8); border:1px solid rgba(226,178,110,.4);
    border-radius:7px; padding:6px 12px; cursor:pointer; transition:all .18s ease; }
  .btn:hover{ background:rgba(96,68,34,.95); border-color:rgba(240,200,140,.7); }
  .btn.active{ background:#e0a35c; color:#241505; border-color:#e0a35c;
    box-shadow:0 0 16px rgba(224,163,92,.4); }
  .btn:focus-visible{ outline:2px solid #f0c987; outline-offset:2px; }
  #hint{ position:fixed; bottom:20px; left:18px; z-index:10; font-size:11px;
    color:rgba(240,227,200,.55); line-height:1.9; pointer-events:none; text-align:left; }
  #loading{ position:fixed; inset:0; z-index:50; background:#1a120a;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transition:opacity .7s ease; }
  #loading.done{ opacity:0; pointer-events:none; }
  .ld-t{ font-size:30px; font-weight:700; color:#f4e8d0; }
  .ld-t em{ font-style:normal; color:#e0a35c; }
  .ld-s{ margin-top:10px; font-size:13px; color:#c99d5f; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
  @media (max-width:760px){
    #info{ max-width:250px; padding:10px 14px; }
    #info h1{ font-size:18px; }
    #hint{ display:none; }
    .sep{ display:none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>

<a id="back" href="date-journey.html">→ رجوع للرحلة</a>

<header id="info" class="panel">
  <h1>تحت <em>شجرة النخيل</em></h1>
  <div class="latin">HARBOR · OMANI DHOW FLEET</div>
  <div class="chips">
    <span class="chip">سفينة عملاقة موسعة</span>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1400))]);

/* ================= أساسيات العرض ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe8b98a, 80, 320);

const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 800);
camera.position.set(45, 20, 55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 180;
controls.maxPolarAngle = 1.50;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

/* ================= أدوات الرسم الإجرائي ================= */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function makeTex(w, h, painter){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function drawPalm(g, cx, cy, s, dark){
  g.strokeStyle = dark; g.lineCap = 'round';
  g.lineWidth = s*0.09;
  g.beginPath(); g.moveTo(cx - s*0.06, cy + s*0.5);
  g.quadraticCurveTo(cx + s*0.10, cy + s*0.1, cx + s*0.02, cy - s*0.25); g.stroke();
  g.lineWidth = s*0.055;
  const tx = cx + s*0.02, ty = cy - s*0.25;
  for (let i=0;i<7;i++){
    const a = -Math.PI*0.95 + i*(Math.PI*0.9/6);
    g.beginPath(); g.moveTo(tx, ty);
    g.quadraticCurveTo(tx + Math.cos(a)*s*0.32, ty + Math.sin(a)*s*0.32 - s*0.08,
      tx + Math.cos(a)*s*0.5, ty + Math.sin(a)*s*0.42 + s*0.1);
    g.stroke();
  }
}

/* --- خامة الخشب --- */
function paintWood(g, w, h, o){
  o = Object.assign({ rows:14, vertical:false, gray:false, nails:true, salt:false, cols:null }, o||{});
  const pal = o.cols || (o.gray
    ? ['#7f7f7f','#747474','#8a8a8a','#6b6b6b','#808080','#8f8f8f']
    : ['#8f6f4a','#7c5c3a','#9a7a52','#6f5234','#846242','#a08055']);
  g.fillStyle = o.gray ? '#787878' : '#82623e';
  g.fillRect(0,0,w,h);
  const rows = o.rows, step = (o.vertical ? w : h)/rows;
  for (let i=0;i<rows;i++){
    g.fillStyle = pal[i % pal.length];
    if (o.vertical) g.fillRect(i*step, 0, step, h); else g.fillRect(0, i*step, w, step);
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)';
    if (o.vertical) g.fillRect(i*step,0,step,h); else g.fillRect(0,i*step,w,step);
    for (let k=0;k<7;k++){
      g.strokeStyle = o.gray ? 'rgba(40,40,40,0.25)'
        : (Math.random()<0.75 ? 'rgba(58,38,20,0.20)' : 'rgba(214,186,142,0.12)');
      g.lineWidth = 0.8 + Math.random()*1.4;
      g.beginPath();
      if (o.vertical){
        const x = i*step + 3 + Math.random()*(step-6);
        g.moveTo(x, -5);
        for (let y=0;y<=h;y+=h/6) g.lineTo(x + Math.sin(y*0.02+k)*2.2 + Math.random()*1.2, y);
      } else {
        const y = i*step + 3 + Math.random()*(step-6);
        g.moveTo(-5, y);
        for (let x=0;x<=w;x+=w/6) g.lineTo(x, y + Math.sin(x*0.02+k)*2.2 + Math.random()*1.2);
      }
      g.stroke();
    }
    g.fillStyle = o.gray ? 'rgba(30,30,30,0.25)' : 'rgba(45,30,16,0.28)';
    for (let p=0;p<55;p++){
      if (o.vertical) g.fillRect(i*step+Math.random()*step, Math.random()*h, 1, 2+Math.random()*3);
      else g.fillRect(Math.random()*w, i*step+Math.random()*step, 2+Math.random()*3, 1);
    }
    g.fillStyle = o.gray ? 'rgba(20,20,20,0.8)' : 'rgba(30,20,12,0.85)';
    if (o.vertical) g.fillRect(i*step-1, 0, 2.4, h); else g.fillRect(0, i*step-1, w, 2.4);
    g.fillStyle = 'rgba(255,240,210,0.10)';
    if (o.vertical) g.fillRect(i*step+2, 0, 1.2, h); else g.fillRect(0, i*step+2, w, 1.2);
    const joints = 2 + (i % 2);
    for (let jj=0;jj<joints;jj++){
      const pos = ((i*53 + jj*197) % 100)/100;
      g.fillStyle = o.gray ? 'rgba(20,20,20,0.7)' : 'rgba(30,20,12,0.7)';
      if (o.vertical) g.fillRect(i*step, pos*h, step, 2);
      else g.fillRect(pos*w, i*step, 2, step);
    }
    if (o.nails){
      g.fillStyle = o.gray ? '#d0d0d0' : '#2e241a';
      if (o.vertical){
        for (let y=14;y<h-8;y+=46){
          g.beginPath(); g.arc(i*step+5, y, 1.8, 0, 6.283); g.fill();
          g.beginPath(); g.arc((i+1)*step-5, y+20, 1.8, 0, 6.283); g.fill();
        }
      } else {
        for (let x=14;x<w-8;x+=46){
          g.beginPath(); g.arc(x + (i%2)*22, i*step+5, 1.8, 0, 6.283); g.fill();
          g.beginPath(); g.arc(x + (i%2)*22, (i+1)*step-5, 1.8, 0, 6.283); g.fill();
        }
      }
    }
  }
  if (o.salt && !o.gray){
    const wy = h*0.545;
    g.fillStyle = 'rgba(30,45,42,0.42)'; g.fillRect(0, wy, w, h-wy);
    g.fillStyle = 'rgba(58,82,58,0.16)'; g.fillRect(0, wy+10, w, h-wy-10);
    for (let i=0;i<900;i++){
      g.fillStyle = 'rgba(235,238,230,' + (0.06+Math.random()*0.2) + ')';
      g.fillRect(Math.random()*w, wy-26+Math.random()*34, 1.6, 1.6);
    }
    g.fillStyle = 'rgba(240,242,235,0.12)';
    for (let i=0;i<14;i++){
      const x = Math.random()*w;
      g.fillRect(x, wy-40-Math.random()*70, 3, 40+Math.random()*70);
    }
  }
}
function paintRope(g, w, h){
  g.fillStyle = '#b3935f'; g.fillRect(0,0,w,h);
  for (let y=-h; y<h*2; y+=11){
    g.strokeStyle = 'rgba(84,62,34,0.55)'; g.lineWidth = 4.5;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y+w); g.stroke();
    g.strokeStyle = 'rgba(226,200,150,0.30)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y+5); g.lineTo(w, y+w+5); g.stroke();
  }
  for (let i=0;i<800;i++){
    g.fillStyle = Math.random()<0.5 ? 'rgba(60,44,24,0.15)' : 'rgba(230,205,160,0.12)';
    g.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4);
  }
}
function paintCloth(g, w, h){
  g.fillStyle = '#e8dfc8'; g.fillRect(0,0,w,h);
  for (let y=0;y<h;y+=3){ g.fillStyle = y%6 ? 'rgba(120,105,80,0.05)' : 'rgba(255,255,255,0.05)'; g.fillRect(0,y,w,1); }
  for (let x=0;x<w;x+=3){ g.fillStyle = x%6 ? 'rgba(120,105,80,0.04)' : 'rgba(255,255,255,0.04)'; g.fillRect(x,0,1,h); }
  g.strokeStyle = 'rgba(140,120,90,0.5)'; g.lineWidth = 2;
  for (let y=h*0.14; y<h; y+=h/6){
    g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    g.strokeStyle = 'rgba(110,90,64,0.4)'; g.setLineDash([4,4]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0,y+5); g.lineTo(w,y+5); g.stroke();
    g.setLineDash([]); g.lineWidth = 2; g.strokeStyle = 'rgba(140,120,90,0.5)';
  }
  for (let i=0;i<3;i++){
    const x = Math.random()*w*0.7, y = Math.random()*h*0.7, pw = 40+Math.random()*50, ph = 30+Math.random()*40;
    g.fillStyle = 'rgba(190,178,150,0.35)'; g.fillRect(x,y,pw,ph);
    g.strokeStyle = 'rgba(110,90,64,0.5)'; g.setLineDash([3,3]); g.lineWidth = 1;
    g.strokeRect(x+3,y+3,pw-6,ph-6); g.setLineDash([]);
  }
  for (let i=0;i<40;i++){
    g.fillStyle = 'rgba(120,104,78,' + (0.05+Math.random()*0.1) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 3+Math.random()*8, 2+Math.random()*5);
  }
}
function paintLogo(g, w, h, mode){
  g.fillStyle = '#7a5a38'; g.fillRect(0,0,w,h);
  const bp = ['#7d5d3b','#745433','#826242'];
  for (let i=0;i<3;i++){ g.fillStyle = bp[i]; g.fillRect(0, i*h/3, w, h/3); }
  g.strokeStyle = 'rgba(58,38,20,0.4)'; g.lineWidth = 1;
  for (let i=0;i<24;i++){
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(0,y);
    for (let x=0;x<=w;x+=w/5) g.lineTo(x, y + Math.sin(x*0.03+i)*2);
    g.stroke();
  }
  g.strokeStyle = '#3a2712'; g.lineWidth = Math.max(4, w*0.012);
  g.strokeRect(w*0.03, h*0.06, w*0.94, h*0.88);
  g.strokeStyle = '#c8a06a'; g.lineWidth = 1.5;
  g.strokeRect(w*0.045, h*0.085, w*0.91, h*0.83);
  const cx = w/2, cy = h*0.33, r = Math.min(w,h)*0.16;
  g.strokeStyle = '#3a2712'; g.lineWidth = r*0.14;
  g.beginPath(); g.arc(cx, cy, r, 0, 6.283); g.stroke();
  drawPalm(g, cx, cy, r*1.5, '#3a2712');
  const txt = (s, y, size, ls) => {
    g.font = `700 ${size}px Cairo, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    try { g.letterSpacing = ls; } catch(e){}
    g.fillStyle = 'rgba(224,192,142,0.55)';
    g.fillText(s, cx + size*0.045, y + size*0.045);
    g.fillStyle = '#2e1e0e';
    g.fillText(s, cx, y);
  };
  if (mode === 'hull'){
    txt('UNDER THE', h*0.62, h*0.115, '6px');
    txt('PALM TREE', h*0.80, h*0.165, '8px');
  } else {
    txt('UNDER THE PALM TREE', h*0.70, h*0.115, '2px');
  }
}
function paintFlag(g, w, h){
  g.fillStyle = '#e9dfc6'; g.fillRect(0,0,w,h);
  for (let y=0;y<h;y+=3){ g.fillStyle = 'rgba(120,105,80,0.06)'; g.fillRect(0,y,w,1); }
  g.strokeStyle = '#3a2712'; g.lineWidth = 4; g.strokeRect(4,4,w-8,h-8);
  const r = h*0.3;
  g.strokeStyle = '#3a2712'; g.lineWidth = r*0.16;
  g.beginPath(); g.arc(w*0.17, h/2, r, 0, 6.283); g.stroke();
  drawPalm(g, w*0.17, h/2, r*1.5, '#3a2712');
  g.font = `700 ${h*0.19}px Cairo, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  try { g.letterSpacing = '1px'; } catch(e){}
  g.fillStyle = '#2e1e0e';
  g.fillText('UNDER THE PALM TREE', w*0.60, h*0.5);
}
function paintSky(g, w, h){
  const gr = g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#3f5a84'); gr.addColorStop(0.32,'#8f7e82'); gr.addColorStop(0.48,'#e8a862');
  gr.addColorStop(0.55,'#f6c47e'); gr.addColorStop(0.60,'#d8a06a'); gr.addColorStop(1,'#6a4f36');
  g.fillStyle = gr; g.fillRect(0,0,w,h);
  const sun = g.createRadialGradient(w*0.403, h*0.52, 4, w*0.403, h*0.52, 200);
  sun.addColorStop(0,'rgba(255,244,210,1)'); sun.addColorStop(0.22,'rgba(255,214,150,0.55)'); sun.addColorStop(1,'rgba(255,200,130,0)');
  g.fillStyle = sun; g.fillRect(0,0,w,h);
  g.fillStyle = 'rgba(255,222,186,0.15)';
  for (let i=0;i<12;i++){
    const x = Math.random()*w, y = h*(0.26+Math.random()*0.18), r = 40+Math.random()*100;
    g.beginPath(); g.ellipse(x, y, r*2.5, r*0.30, 0, 0, 6.283); g.fill();
  }
}
function paintSand(g, w, h){
  g.fillStyle = '#c9a978'; g.fillRect(0,0,w,h);
  for (let i=0;i<3000;i++){
    g.fillStyle = Math.random()<0.5 ? 'rgba(230,200,150,' + (0.2+Math.random()*0.4) + ')' : 'rgba(120,90,60,' + (0.1+Math.random()*0.3) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random(), 1+Math.random());
  }
}
function paintStone(g, w, h){
  g.fillStyle = '#9a8872'; g.fillRect(0,0,w,h);
  const cols = ['#8a7862','#a89678','#7a6852','#b5a288','#9a8872','#6a5842'];
  const bw = w/6, bh = h/8;
  for (let j=0;j<8;j++){
    for (let i=0;i<6;i++){
      const ox = (j%2)*bw*0.5;
      g.fillStyle = cols[(i+j)%cols.length];
      g.fillRect(i*bw+ox+2, j*bh+2, bw-4, bh-4);
      g.strokeStyle = 'rgba(30,20,12,0.6)'; g.lineWidth = 2;
      g.strokeRect(i*bw+ox+2, j*bh+2, bw-4, bh-4);
    }
  }
}

/* ================= الإكساء ================= */
const texHull    = makeTex(1024, 1024, (g,w,h)=>paintWood(g,w,h,{rows:16, salt:true}));
const texHullB   = makeTex(1024, 1024, (g,w,h)=>paintWood(g,w,h,{rows:16, gray:true}));

const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUni, transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uTime;
    varying vec3 vW; varying vec3 vN;
    float waveH(vec2 p, float t){
      float h = 0.0;
      h += sin(dot(p, vec2(0.20, 0.16)) + t*0.9)*0.20;
      h += sin(dot(p, vec2(-0.14, 0.27)) + t*0.62)*0.13;
      h += sin(dot(p, vec2(0.42, -0.20)) + t*1.55)*0.05;
      h += sin(dot(p, vec2(-0.48, -0.40)) + t*2.1)*0.03;
      return h;
    }
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      float e = 0.35;
      float hC = waveH(wp.xz, uTime);
      float hX = waveH(wp.xz + vec2(e, 0.0), uTime);
      float hZ = waveH(wp.xz + vec2(0.0, e), uTime);
      wp.y += hC;
      vW = wp.xyz;
      vN = normalize(vec3(-(hX-hC)/e, 1.0, -(hZ-hC)/e));
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir;
    varying vec3 vW; varying vec3 vN;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vW);
      float ndv = max(dot(N, V), 0.0);
      float fr = pow(1.0 - ndv, 3.0);
      vec3 R = reflect(-V, N);
      vec3 sky = mix(vec3(1.05,0.62,0.34), vec3(0.38,0.55,0.72), clamp(R.y*1.4+0.35, 0.0, 1.0));
      vec3 col = mix(vec3(0.035,0.13,0.16), vec3(0.10,0.30,0.32), clamp(0.35+ndv*0.4, 0.0, 1.0));
      col = mix(col, sky, fr*0.72);
      float s1 = pow(max(dot(R, normalize(uSunDir)), 0.0), 220.0);
      float s2 = pow(max(dot(R, normalize(uSunDir)), 0.0), 60.0);
      col += vec3(1.0, 0.78, 0.5) * (s1*3.2 + s2*0.35);
      float d = length(vec2(vW.x/4.6, (vW.z-0.6)/14.8));
      float wob = 0.06*sin(vW.x*1.7+uTime*1.3) + 0.05*sin(vW.z*1.1-uTime*1.7);
      float band = smoothstep(1.06+wob, 1.0+wob, d) * smoothstep(0.88, 0.99, d);
      float nz = hash(floor(vW.xz*3.0));
      float foam = band * (0.45 + 0.55*smoothstep(0.25, 0.75, nz));
      foam += smoothstep(0.30, 0.0, abs(d-1.0)) * 0.22 * (0.5+0.5*sin(vW.x*4.0+uTime*2.2));
      foam = clamp(foam, 0.0, 1.0);
      col = mix(col, vec3(0.96,0.97,0.94), foam*0.85);
      float a = clamp(0.60 + fr*0.22 + foam*0.30, 0.0, 0.96);
      gl_FragColor = vec4(col, a);
    }`
});

function M(geo, mtl, x=0, y=0, z=0, rx=0, ry=0, rz=0, parent=ship){
  const m = new THREE.Mesh(geo, mtl);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function tubeBetween(a, b, r, mtl, parent){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const m = M(new THREE.CylinderGeometry(r, r, len, 10), mtl, 0,0,0, 0,0,0, parent);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  return m;
}
function coneBetween(a, b, ra, rb, mtl, parent){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const m = M(new THREE.CylinderGeometry(rb, ra, len, 12), mtl, 0,0,0, 0,0,0, parent);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  return m;
}
function ropeBetween(a, b, sag, r, parent=ship){
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
  return M(new THREE.TubeGeometry(curve, 26, r, 6), matRope, 0,0,0, 0,0,0, parent);
}

const SEC = [

  [3.5, 2.95, 1.65, -1.10], [6.0, 2.70, 1.75, -1.05], [8.2, 2.25, 1.95, -0.95],
  [9.8, 1.60, 2.20, -0.80], [11.0, 0.80, 2.50, -0.55], [11.9, 0.06, 2.75, -0.25]
];
{
  const MP = 22, cnt = SEC.length;
  const pos = [], uv = [], idx = [];
  for (let i=0;i<cnt;i++){
    const [z, hb, dy, ky] = SEC[i];
    const full = Math.min(1, hb/3.05);
    const pw = 0.70 + 0.55*(1-full), pr = 1.05 + 0.60*full;
    for (let j=0;j<=MP;j++){
      const t = j/MP, a = t*2-1, aa = Math.abs(a);
      pos.push(Math.sign(a)*hb*Math.pow(aa, pw), ky + (dy-ky)*Math.pow(aa, pr), z);
      uv.push(i/(cnt-1), t);
    }
  }
  for (let i=0;i<cnt-1;i++) for (let j=0;j<MP;j++){
    const a = i*(MP+1)+j, b = a+MP+1;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  M(geo, matHull);
}

/* --- الأشرعة المثلثة (لاتين) --- */
function lateenSail(H, T, C, bulge, mat){
  const rows = 26, cols = 22;
  const pos = [], uv = [], idx = [];
  const nrm = new THREE.Vector3(1, 0, 0);
  for (let i=0;i<=rows;i++){
    const t = i/rows;
    const L = new THREE.Vector3().lerpVectors(H, T, t);
    const R = new THREE.Vector3().lerpVectors(H, C, t);
    for (let j=0;j<=cols;j++){
      const s = j/cols;
      const p = new THREE.Vector3().lerpVectors(L, R, s);
      const b = bulge * Math.sin(Math.min(1, t*1.15)*Math.PI*0.85) * Math.sin(s*Math.PI);
      p.addScaledVector(nrm, b);
      if (t > 0.85) p.y -= Math.sin(s*Math.PI)*0.22*(t-0.85)/0.15;
      pos.push(p.x, p.y, p.z);
      uv.push(s, t);
    }
  }
  for (let i=0;i<rows;i++) for (let j=0;j<cols;j++){
    const a = i*(cols+1)+j, b = a+cols+1;
    idx.push(a, b, a+1, b, b+1, a+1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return M(geo, mat);
}

function portBuilding(x, z, w, d, h){
  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  port.add(grp);
  const wallMat = new THREE.MeshStandardMaterial({ map: texStone, roughness: 0.9 });
  const walls = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  walls.position.y = h/2;
  walls.castShadow = true;
  walls.receiveShadow = true;
  grp.add(walls);
  /* سطح مسطّح بدل السقف المثلث */
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.35, d + 0.5), matBand);
  slab.position.y = h + 0.17;
  slab.castShadow = true; slab.receiveShadow = true;
  grp.add(slab);
  /* شُرفات مسننة على الأطراف الأربعة */
  const step = 1.0, mw = 0.5, mh = 0.6;
  for (let mx = -w/2; mx <= w/2; mx += step){
    for (const mz of [d/2 + 0.12, -d/2 - 0.12]){
      const m = new THREE.Mesh(new THREE.BoxGeometry(mw, mh, 0.34), wallMat);
      m.position.set(mx, h + 0.62, mz); m.castShadow = true; grp.add(m);
    }
  }
  for (let mz = -d/2; mz <= d/2; mz += step){
    for (const mx of [w/2 + 0.12, -w/2 - 0.12]){
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.34, mh, mw), wallMat);
      m.position.set(mx, h + 0.62, mz); m.castShadow = true; grp.add(m);
    }
  }
  /* باب بعقد نصف دائري */
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(w*0.25, h*0.5, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.9 })
  );
  door.position.set(0, h*0.25, d/2 + 0.05);
  grp.add(door);
  const arch = new THREE.Mesh(
    new THREE.CylinderGeometry(w*0.125, w*0.125, 0.1, 16, 1, false, 0, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.9 })
  );
  arch.rotation.x = Math.PI/2; arch.rotation.z = Math.PI;
  arch.position.set(0, h*0.5, d/2 + 0.05);
  grp.add(arch);
  /* نوافذ صغيرة غائرة */
  for (const sx of [-1, 1]){
    const win = new THREE.Mesh(new THREE.BoxGeometry(w*0.15, h*0.2, 0.1), matGlassD);
    win.position.set(sx*w*0.3, h*0.6, d/2 + 0.05);
    grp.add(win);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w*0.18, h*0.23, 0.06), matBand);
    frame.position.set(sx*w*0.3, h*0.6, d/2 + 0.02);
    grp.add(frame);
  }
  return grp;
}

/* ================= السفن الصغيرة (أسطول) ================= */
const smallShips = [];

function buildSmallDhow(scale=1, withSail=true, color='#c9a978'){
  const grp = new THREE.Group();

  const hullShape = new THREE.Shape();
  hullShape.moveTo(0, -3);
  hullShape.quadraticCurveTo(1.5, -2.5, 1.8, 0);
  hullShape.quadraticCurveTo(1.5, 2.5, 0, 3);
  hullShape.quadraticCurveTo(-1.5, 2.5, -1.8, 0);
  hullShape.quadraticCurveTo(-1.5, -2.5, 0, -3);

  const hullMat = new THREE.MeshStandardMaterial({
    map: texHull, roughness: 0.8, color: new THREE.Color(color)
  });

  const hull = new THREE.Mesh(
    new THREE.ExtrudeGeometry(hullShape, { depth: 1.2, bevelEnabled: false }),
    hullMat
  );
  hull.rotation.x = -Math.PI/2;
  hull.position.y = 0.6;
  hull.castShadow = true;
  hull.receiveShadow = true;
  grp.add(hull);

  const deck = new THREE.Mesh(
    new THREE.ShapeGeometry(hullShape),
    matDeck
  );
  deck.rotation.x = -Math.PI/2;
  deck.position.y = 1.2;
  grp.add(deck);

  if (withSail){
    const mast = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.12, 7, 8),
      matSpar
    );
    mast.position.y = 4.7;
    mast.castShadow = true;
    grp.add(mast);

    const sailGeo = new THREE.PlaneGeometry(3, 4, 6, 6);
    const sailPos = sailGeo.attributes.position;
    for (let i=0; i<sailPos.count; i++){
      const x = sailPos.getX(i);
      sailPos.setZ(i, Math.sin((x/3+0.5)*Math.PI)*0.3);
    }
    sailGeo.computeVertexNormals();
    const sail = new THREE.Mesh(sailGeo, matCloth);
    sail.position.y = 4;
    sail.castShadow = true;
    grp.add(sail);

    const yard = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.04, 5, 6),
      matSpar
    );
    yard.position.set(1.5, 4, 0);
    yard.rotation.z = -0.3;
    grp.add(yard);

    const rope1 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 3, 4),
      matRope
    );
    rope1.position.set(0.5, 6, 0.5);
    grp.add(rope1);
  }

  grp.scale.set(scale, scale, scale);
  return grp;
}

const shipConfigs = [
  { pos: [10, 0, -18], rot: 0.3, scale: 0.8, sail: true },
  { pos: [-10, 0, -19], rot: -0.4, scale: 0.7, sail: true },

  { pos: [25, 0, -12], rot: 0.2, scale: 0.65, sail: true },

  { pos: [-20, 0, -10], rot: -0.5, scale: 0.8, sail: true },
];

for (const cfg of shipConfigs){
  const s = buildSmallDhow(cfg.scale, cfg.sail, cfg.sail ? '#c9a978' : '#8a7860');

}

/* ================= الواجهة والحركة ================= */
const VIEWS = {
  general:    { pos:[45, 20, 55],   tgt:[0, 4, 0]   },
  port:       { pos:[0, 25, 10],    tgt:[0, 3, -20] },
  ship:       { pos:[-25, 12, 30],  tgt:[-8, 8, 8]  },
  fleet:      { pos:[20, 15, 5],    tgt:[15, 3, -12]},
  lighthouse: { pos:[40, 20, -30],  tgt:[28, 8, -40]}
};
let camTween = null;
function flyTo(v){
  camTween = {
    p0: camera.position.clone(), p1: new THREE.Vector3(...v.pos),
    t0: controls.target.clone(), t1: new THREE.Vector3(...v.tgt), k: 0
  };
}
const viewBtns = document.querySelectorAll('.view');
viewBtns.forEach(b => b.addEventListener('click', () => {
  viewBtns.forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  flyTo(VIEWS[b.dataset.v]);
}));

const btnRock  = document.getElementById('btnRock');
const btnOrbit = document.getElementById('btnOrbit');
const btnWire  = document.getElementById('btnWire');
let rockOn = true, wireOn = false;

btnRock.addEventListener('click', () => {
  rockOn = !rockOn;
  btnRock.classList.toggle('active', rockOn);
});
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('active', controls.autoRotate);
});
btnWire.addEventListener('click', () => {
  wireOn = !wireOn;
  mats.forEach(m => m.wireframe = wireOn);
  btnWire.classList.toggle('active', wireOn);
});
controls.addEventListener('start', () => {
  camTween = null;
  if (controls.autoRotate){ controls.autoRotate = false; btnOrbit.classList.remove('active'); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const loading = document.getElementById('loading');
let shown = false;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  waterUni.uTime.value = t;

  if (rockOn){
    ship.position.y = 0.15*Math.sin(t*0.5);
    ship.rotation.z = 0.014*Math.sin(t*0.43 + 0.8);
    ship.rotation.x = 0.009*Math.sin(t*0.36);

    for (let i=0; i<smallShips.length; i++){
      const s = smallShips[i];
      const offset = i * 0.7;
      s.position.y = 0.08*Math.sin(t*0.6 + offset);
      s.rotation.z = 0.02*Math.sin(t*0.5 + offset);
      s.rotation.x = 0.015*Math.sin(t*0.4 + offset);
    }
  } else {
    ship.position.y += (0 - ship.position.y)*0.05;
    ship.rotation.z += (0 - ship.rotation.z)*0.05;
    ship.rotation.x += (0 - ship.rotation.x)*0.05;
  }

  pennant.rotation.y = 0.25*Math.sin(t*1.7);
  pennant.rotation.z = 0.08*Math.sin(t*2.3 + 1);

  if (lightBeacon){
    lightBeacon.intensity = 1.5 + 0.8 * Math.sin(t * 2);
  }

  if (camTween){
    camTween.k += dt / 1.5;
    const k = Math.min(camTween.k, 1);
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) camTween = null;
  }

  controls.update();
  renderer.render(scene, camera);
  if (!shown){ shown = true; loading.classList.add('done'); }
}
animate();
</script>
