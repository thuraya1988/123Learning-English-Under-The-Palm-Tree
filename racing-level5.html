<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سباق السيارات - بيك أب، ليموزين، همر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        /* القائمة الرئيسية */
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 10px;
            overflow-y: auto;
        }

        #menu-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .menu-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 600px;
            width: 100%;
        }

        .game-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(52, 152, 219, 0.8);
            background: linear-gradient(90deg, #3498db, #2ecc71, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #3498db;
            font-weight: bold;
        }

        .option-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-btn {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }

        .option-btn.active {
            background: #3498db;
            border-color: #3498db;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.6);
        }

        .color-btn {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .color-btn.active {
            transform: scale(1.2);
            border-color: white;
            box-shadow: 0 0 25px currentColor;
        }

        .start-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.5);
            transition: all 0.3s;
            width: 100%;
            max-width: 350px;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(46, 204, 113, 0.7);
        }

        .location-btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
            transition: all 0.3s;
        }

        .location-btn:hover {
            transform: scale(1.05);
        }

        /* الكراج والمغسلة */
        #garage-view, #carwash-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            z-index: 150;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .location-title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .carwash-animation {
            width: 300px;
            height: 300px;
            border: 5px solid #3498db;
            border-radius: 20px;
            margin: 20px;
            position: relative;
            overflow: hidden;
            background: rgba(52, 152, 219, 0.2);
        }

        .water-spray {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(52, 152, 219, 0.3),
                rgba(52, 152, 219, 0.3) 10px,
                transparent 10px,
                transparent 20px
            );
            animation: spray 2s linear infinite;
        }

        @keyframes spray {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .back-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* واجهة اللعبة */
        #game-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
        }

        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 60;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }

        #ruleBanner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 60;
            background: rgba(0,0,0,0.55);
            padding: 8px 18px;
            border-radius: 10px;
            text-align: center;
            max-width: 90vw;
            direction: ltr;
        }
        #ruleBanner .lbl { font-size: 10px; letter-spacing: 2px; color: #85c1ff; direction: rtl; }

        #hub-link {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            z-index: 60;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            pointer-events: none;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            font-weight: bold;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.93);
        }

        .btn-gas { background: rgba(46, 204, 113, 0.5); border-color: #2ecc71; }
        .btn-brake { background: rgba(231, 76, 60, 0.5); border-color: #e74c3c; }
        .btn-steer { background: rgba(52, 152, 219, 0.5); border-color: #3498db; }

        #game-over {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 200;
        }

        #fact-popup, #level-done {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 210;
            text-align: center;
            padding: 20px;
        }
        #fact-popup h1 { font-size: 34px; color: #f1c40f; margin-bottom: 8px; }
        #level-done h1 { font-size: 40px; color: #2ecc71; margin-bottom: 8px; }
        #fact-popup p, #level-done p { font-size: 17px; max-width: 560px; line-height: 1.9; margin: 12px 0; }
    </style>
</head>
<body>

<!-- القائمة الرئيسية -->
<div id="main-menu">
    <canvas id="menu-canvas"></canvas>

    <div class="menu-content">
        <h1 class="game-title">🏎️ سباق السيارات</h1>

        <div class="menu-section">
            <div class="section-title">🚗 نوع السيارة</div>
            <div class="option-row">
                <div class="option-btn active" data-type="sport">رياضية</div>
                <div class="option-btn" data-type="pickup">بيك أب</div>
                <div class="option-btn" data-type="limo">ليموزين</div>
                <div class="option-btn" data-type="hummer">همر</div>
                <div class="option-btn" data-type="suv">دفع رباعي</div>
            </div>
        </div>

        <div class="menu-section">
            <div class="section-title">🎨 اللون</div>
            <div class="option-row">
                <div class="color-btn active" data-color="0xe74c3c" style="background: #e74c3c;"></div>
                <div class="color-btn" data-color="0x3498db" style="background: #3498db;"></div>
                <div class="color-btn" data-color="0x2ecc71" style="background: #2ecc71;"></div>
                <div class="color-btn" data-color="0xf1c40f" style="background: #f1c40f;"></div>
                <div class="color-btn" data-color="0x9b59b6" style="background: #9b59b6;"></div>
                <div class="color-btn" data-color="0xe67e22" style="background: #e67e22;"></div>
            </div>
        </div>

        <button class="location-btn" onclick="openGarage()">🔧 الكراج</button>
        <button class="location-btn" onclick="openCarWash()">🚿 مغسلة السيارات</button>
        <button class="location-btn" onclick="location.href='racing-adventure.html'" style="background:linear-gradient(135deg,#34495e,#2c3e50);">🗺 المستويات</button>

        <button class="start-btn" onclick="startGame()">🏁 ابدأ السباق</button>
    </div>
</div>

<!-- الكراج -->
<div id="garage-view">
    <h1 class="location-title">🔧 الكراج</h1>
    <canvas id="garage-canvas" width="400" height="400"></canvas>
    <p style="font-size: 20px; margin: 20px;">صيانة وتحسين السيارات</p>
    <button class="back-btn" onclick="backToMenu()">العودة للقائمة</button>
</div>

<!-- مغسلة السيارات -->
<div id="carwash-view">
    <h1 class="location-title"> مغسلة السيارات</h1>
    <div class="carwash-animation">
        <div class="water-spray"></div>
    </div>
    <p style="font-size: 24px; margin: 20px;">غسل السيارة...</p>
    <button class="back-btn" onclick="backToMenu()">العودة للقائمة</button>
</div>

<!-- واجهة اللعبة -->
<div id="game-ui">
    <canvas id="game-canvas"></canvas>
    <div id="ui">🏁 النقاط: <span id="score">0</span></div>
    <a id="hub-link" href="racing-adventure.html">🗺 المستويات</a>
    <div id="ruleBanner"><div class="lbl">ابحثي عن اللافتة الصحيحة</div><div id="rule-text">—</div></div>

    <div id="controls">
        <div class="btn-group">
            <div class="btn btn-steer" id="btn-left">◀</div>
            <div class="btn btn-steer" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn btn-brake" id="btn-brake">🛑</div>
            <div class="btn btn-gas" id="btn-gas">🚀</div>
        </div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 48px; color: #e74c3c; margin-bottom: 20px;">💥 حادث!</h1>
        <p style="font-size: 28px; margin: 10px;">النقاط: <span id="final-score" style="color: #f1c40f;">0</span></p>
        <button class="start-btn" onclick="resetGame()" style="margin-top: 30px;">🔄 العب مرة أخرى</button>
        <button class="back-btn" onclick="backToMenu()" style="margin-top: 15px;">🏠 القائمة الرئيسية</button>
    </div>

    <div id="fact-popup">
        <h1>📚 هل تعلمين؟</h1>
        <div id="fact-title" style="color:#f1c40f;font-size:20px;margin-bottom:8px;"></div>
        <p id="fact-text"></p>
        <button class="start-btn" onclick="hideFact()" style="max-width:300px;">▶ متابعة السباق</button>
    </div>

    <div id="level-done">
        <h1>🏁 اكتمل المستوى الخامس!</h1>
        <p>أكملتي كل مستويات سباق الصحراء 🎉</p>
        <div style="display:flex; gap:14px;">
            <button class="location-btn" onclick="location.href='racing-adventure.html'">🗺 المستويات</button>
            <button class="start-btn" onclick="continueAfterLevel()" style="max-width:260px;">▶ كملي السباق</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // الإعدادات
    let selectedCarType = 'sport';
    let selectedColor = 0xe74c3c;

    let currentSpeed = 0.04;
    let targetSpeed = 0.04;
    let maxSpeed = 0.15;
    let acceleration = 0.001;
    let braking = 0.002;

    let playerX = 0;
    let targetX = 0;
    let turnSpeed = 0.04;
    let maxTurn = 5.5;

    let score = 0;
    let isGameOver = false;
    let isGameRunning = false;
    let frameCount = 0;

    let scene, camera, renderer;
    let playerCar = null;
    let menuScene, menuCamera, menuRenderer, menuCar = null;
    let obstacles = [];
    let lines = [];

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    // إنشاء السيارات المختلفة
    function createCar(type, color) {
        const carGroup = new THREE.Group();
        const bodyMat = new THREE.MeshPhongMaterial({ color: color, shininess: 80 });
        const glassMat = new THREE.MeshPhongMaterial({ color: 0x2c3e50, shininess: 100 });
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

        if (type === 'pickup') {
            // بيك أب
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 2.5), bodyMat);
            cabin.position.set(0, 1, -0.5);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const bed = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 2), bodyMat);
            bed.position.set(0, 0.6, 2);
            bed.castShadow = true;
            carGroup.add(bed);

            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            wheelGeo.rotateZ(Math.PI/2);
            [[-1.1, 1.8], [1.1, 1.8], [-1.1, -1.5], [1.1, -1.5]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(pos[0], 0.5, pos[1]);
                w.castShadow = true;
                carGroup.add(w);
            });
        }
        else if (type === 'limo') {
            // ليموزين
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 7), bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.6, 4), glassMat);
            cabin.position.set(0, 1.2, -0.5);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 16);
            wheelGeo.rotateZ(Math.PI/2);
            [[-1, 2.5], [1, 2.5], [-1, -2.5], [1, -2.5]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(pos[0], 0.45, pos[1]);
                w.castShadow = true;
                carGroup.add(w);
            });
        }
        else if (type === 'hummer') {
            // همر
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 5), bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            carGroup.add(body);

            const top = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.8, 3), glassMat);
            top.position.set(0, 1.9, -0.3);
            top.castShadow = true;
            carGroup.add(top);

            const wheelGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.5, 16);
            wheelGeo.rotateZ(Math.PI/2);
            [[-1.3, 2], [1.3, 2], [-1.3, -2], [1.3, -2]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(pos[0], 0.7, pos[1]);
                w.castShadow = true;
                carGroup.add(w);
            });
        }
        else if (type === 'suv') {
            // دفع رباعي
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 4.5), bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            carGroup.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 2.5), glassMat);
            cabin.position.set(0, 1.7, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.45, 16);
            wheelGeo.rotateZ(Math.PI/2);
            [[-1.15, 1.7], [1.15, 1.7], [-1.15, -1.7], [1.15, -1.7]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(pos[0], 0.6, pos[1]);
                w.castShadow = true;
                carGroup.add(w);
            });
        }
        else {
            // سيارة رياضية
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4), bodyMat);
            body.position.y = 0.45;
            body.castShadow = true;
            carGroup.add(body);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.4, 2), glassMat);
            cabin.position.set(0, 0.9, -0.3);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.35, 16);
            wheelGeo.rotateZ(Math.PI/2);
            [[-1, 1.4], [1, 1.4], [-1, -1.4], [1, -1.4]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(pos[0], 0.4, pos[1]);
                w.castShadow = true;
                carGroup.add(w);
            });
        }

        // المصابيح الأمامية
        const lightGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const fl1 = new THREE.Mesh(lightGeo, lightMat);
        fl1.position.set(-0.7, type === 'hummer' ? 1.2 : 0.5, type === 'limo' ? 3.5 : (type === 'pickup' ? 1.26 : 2.01));
        const fl2 = new THREE.Mesh(lightGeo, lightMat);
        fl2.position.set(0.7, type === 'hummer' ? 1.2 : 0.5, type === 'limo' ? 3.5 : (type === 'pickup' ? 1.26 : 2.01));
        carGroup.add(fl1, fl2);

        return carGroup;
    }

    // تهيئة القائمة
    function initMenu() {
        menuScene = new THREE.Scene();
        menuScene.background = new THREE.Color(0x1a1a2e);

        menuCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        menuCamera.position.set(0, 3, 10);
        menuCamera.lookAt(0, 0, 0);

        menuRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('menu-canvas'), antialias: true });
        menuRenderer.setSize(window.innerWidth, window.innerHeight);
        menuRenderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        menuScene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        menuScene.add(dirLight);

        const gridHelper = new THREE.GridHelper(100, 100, 0x3498db, 0x16213e);
        gridHelper.position.y = -1;
        menuScene.add(gridHelper);

        updateMenuCar();
        animateMenu();
    }

    function updateMenuCar() {
        if (menuCar) menuScene.remove(menuCar);
        menuCar = createCar(selectedCarType, selectedColor);
        menuScene.add(menuCar);
    }

    function animateMenu() {
        if (isGameRunning) return;
        requestAnimationFrame(animateMenu);
        if (menuCar) menuCar.rotation.y += 0.008;
        menuRenderer.render(menuScene, menuCamera);
    }

    // الكراج
    function openGarage() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('garage-view').style.display = 'flex';

        // رسم سيارة في الكراج
        const canvas = document.getElementById('garage-canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#34495e';
        ctx.fillRect(0, 0, 400, 400);

        // رسم أدوات الكراج (CC0 - مصادر مجانية)
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(50, 50, 80, 60); // صندوق أدوات
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(270, 80, 60, 40); // مفتاح

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(200, 200, 80, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.font = '20px Arial';
        ctx.fillText('الكراج', 160, 350);
    }

    // مغسلة السيارات
    function openCarWash() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('carwash-view').style.display = 'flex';
    }

    function backToMenu() {
        document.getElementById('garage-view').style.display = 'none';
        document.getElementById('carwash-view').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
    }

    /* ============================================================
       محتوى تعليمي: حروف الجر عن طريق لافتات في 3 حارات
       (x = -3.5, 0, 3.5 داخل مدى الانعطاف maxTurn)، مبنية على مشهد
       رحلة عمّ ناصر الحقيقي بالشاحنة إلى سوق سمائل. التصميم الأصلي
       للعبة ما تغيّر — فقط أضفنا محتوى ومنطق جديد.
       ============================================================ */
    const PREP_ROUNDS = [
        { sentence: 'Uncle Nasser drove the truck ___ the bumpy road to Samail.', correct: 'along', decoys: ['under', 'behind'] },
        { sentence: 'They passed ___ the ancient palm groves.', correct: 'through', decoys: ['behind', 'above'] },
        { sentence: 'The flock of goats moved ___ the edge of the road.', correct: 'to', decoys: ['under', 'behind'] },
        { sentence: "The truck's wheels raised a cloud of dust ___ them.", correct: 'beneath', decoys: ['above', 'beside'] },
        { sentence: 'Uncle Nasser raised his hand ___ the man on the donkey.', correct: 'at', decoys: ['under', 'behind'] },
        { sentence: 'Safiya sat ___ Ahmed in the back of the truck.', correct: 'beside', decoys: ['under', 'through'] },
        { sentence: 'The red mountains stood ___ them as they drove closer.', correct: 'in front of', decoys: ['behind', 'beneath'] },
        { sentence: 'Umm Salim was walking ___ the road, a bundle balanced on her head.', correct: 'along', decoys: ['above', 'behind'] },
        { sentence: 'The truck finally arrived ___ Samail market.', correct: 'at', decoys: ['under', 'through'] },
        { sentence: 'The children climbed down ___ the truck.', correct: 'from', decoys: ['at', 'beside'] },
    ];
    const ROUTE_FACTS = [
        { title: 'علم عُمان', text: 'رفعت السفياء والمعلمين علم عُمان أمام المدرسة — والعلم فعلاً حديث نسبيًا: أعلنه السلطان قابوس في 17 ديسمبر 1970. الأبيض للسلام، والأخضر للأرض الخصبة والجبل الأخضر، والأحمر للمعارك اللي دافع فيها العُمانيون عن بلدهم.' },
        { title: 'سوق مطرح التاريخي', text: 'سوق مطرح اللي تاه فيه منصور مو سوق عادي — أجزاء منه عمرها أكثر من ألف سنة، وكان مركز تجارة التوابل واللبان بين الهند وأفريقيا والجزيرة العربية. يسمونه محليًا "السوق المظلم" لأن أزقته الضيقة المسقوفة ما يدخلها ضوء النهار.' },
        { title: 'عُمان وزنجبار', text: 'اللي التاجر الزنجباري قابل جون وصوفيا فيه في ميناء مطرح مو خيال — عُمان فعلاً حكمت زنجبار لعقود. سنة 1832 نقل السلطان سعيد بن سلطان عاصمته من مسقط إلى زنجبار، وازدهرت تجارة التوابل والعاج بين الساحلين لين انقسمت السلطنتان بعد وفاته سنة 1856.' },
        { title: 'شجرة الغاف', text: 'تجتمع الفصول تحت شجرة الغاف القديمة، "كأنها فصل بلا جدران". هذه الشجرة تعيش في عُمان والخليج من آلاف السنين، تتحمل الجفاف الشديد وتبقى خضراء رغم الحر — بعضها يعيش أكثر من 120 سنة، وتوفر الظل والغذاء للناس والحيوانات.' },
        { title: 'قلعة جبرين', text: 'قلعة جبرين اللي زارها الأطفال حقيقية، موجودة في ولاية بهلاء، بُنيت سنة 1675م بأمر الإمام بلعرب بن سلطان اليعربي. ما كانت بس مقر حكم — كانت مركز تعليم للفلك والطب والفقه، ومشهورة بسقوفها المزخرفة ونظام تبريدها بالفلج.' },
        { title: 'نهضة عُمان الحديثة', text: 'كلام جون "يفتحون مدارس، يبنون طرق، شي جديد يبدأ" وصف حقيقي لعُمان السبعينات. لما تولى السلطان قابوس، كان في البلد بس 3 مدارس لـ900 طالب، و9 مراكز صحية، و6 أميال بس طرق مرصوفة. خلال سنوات قليلة وصلت المدارس والمستشفيات والطرق لكل ركن من عُمان — فيما عُرف بـ"النهضة المباركة".' },
    ];
    const GATE_X = [-3.5, 0, 3.5];
    const LEVEL_GOAL_DIST = 900;
    let learnScoreBonus = 0, learnPrepIndex = 0, learnUsedRecent = [], learnRoundsCleared = 0,
        learnLastFactAt = 0, learnRound = null, learnGateCooldown = 5, learnFrozen = false, learnLevelDone = false;
    let gates = [];
    let raceDistance = 0;

    function gateCanvasTex(word) {
        const c = document.createElement('canvas'); c.width = 220; c.height = 90;
        const g = c.getContext('2d');
        g.fillStyle = 'rgba(20,20,30,0.9)'; g.fillRect(4, 4, 212, 82);
        g.strokeStyle = '#3498db'; g.lineWidth = 4; g.strokeRect(4, 4, 212, 82);
        g.font = 'bold 34px Segoe UI, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = '#fff'; g.fillText(word, 110, 47);
        return new THREE.CanvasTexture(c);
    }
    function buildGate() {
        const group = new THREE.Group();
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.2, 8), new THREE.MeshLambertMaterial({ color: 0x333333 }));
        post.position.y = 1.1; group.add(post);
        const mat = new THREE.MeshBasicMaterial({ map: gateCanvasTex('-'), transparent: true });
        const board = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.0), mat);
        board.position.y = 2.3; group.add(board);
        group.visible = false;
        return { group, mat, active: false, word: '', isCorrect: false };
    }
    function initGatePool() {
        gates = [buildGate(), buildGate(), buildGate()];
        gates.forEach(g => scene.add(g.group));
    }
    function resetLearn() {
        learnScoreBonus = 0; learnPrepIndex = 0; learnUsedRecent = []; learnRoundsCleared = 0;
        learnLastFactAt = 0; learnRound = null; learnGateCooldown = 5; learnFrozen = false; learnLevelDone = false;
        raceDistance = 0;
        gates.forEach(g => { g.active = false; g.group.visible = false; });
        document.getElementById('fact-popup').style.display = 'none';
        document.getElementById('level-done').style.display = 'none';
    }
    function nextPrepRound() {
        let p;
        do { p = PREP_ROUNDS[learnPrepIndex % PREP_ROUNDS.length]; learnPrepIndex++; }
        while (PREP_ROUNDS.length > 3 && learnUsedRecent.includes(p.sentence));
        learnUsedRecent.push(p.sentence); if (learnUsedRecent.length > 3) learnUsedRecent.shift();
        document.getElementById('rule-text').textContent = p.sentence.replace('___', '▁▁▁');
        const opts = [{ word: p.correct, ok: true }, { word: p.decoys[0], ok: false }, { word: p.decoys[1], ok: false }]
            .sort(() => Math.random() - 0.5);
        opts.forEach((o, i) => {
            const g = gates[i];
            g.active = true; g.group.visible = true; g.word = o.word; g.isCorrect = o.ok;
            g.mat.map = gateCanvasTex(o.word); g.mat.needsUpdate = true;
            g.group.position.set(GATE_X[i], 0, -100);
        });
        learnRound = { resolved: false, timer: 16 };
    }
    function resolveGates() {
        if (!learnRound || learnRound.resolved) return;
        learnRound.resolved = true;
        let best = 0, bestD = Infinity;
        for (let i = 0; i < GATE_X.length; i++) { const d = Math.abs(GATE_X[i] - playerCar.position.x); if (d < bestD) { bestD = d; best = i; } }
        const hit = gates[best];
        if (hit && hit.isCorrect) { learnScoreBonus += 150; learnRoundsCleared++; }
        setTimeout(() => {
            gates.forEach(g => { g.active = false; g.group.visible = false; });
            if (!isGameRunning || isGameOver) return;
            if (learnRoundsCleared > 0 && learnRoundsCleared % 3 === 0 && learnRoundsCleared !== learnLastFactAt) {
                learnLastFactAt = learnRoundsCleared; showFact();
            } else { learnGateCooldown = 3.5 + Math.random() * 2; }
        }, 700);
    }
    function showFact() {
        const f = ROUTE_FACTS[Math.floor(Math.random() * ROUTE_FACTS.length)];
        document.getElementById('fact-title').textContent = f.title;
        document.getElementById('fact-text').textContent = f.text;
        document.getElementById('fact-popup').style.display = 'flex';
        learnFrozen = true;
    }
    function hideFact() {
        document.getElementById('fact-popup').style.display = 'none';
        learnFrozen = false; learnGateCooldown = 2;
    }
    function checkLevelDone() {
        if (learnLevelDone || !isGameRunning || isGameOver || raceDistance < LEVEL_GOAL_DIST) return;
        learnLevelDone = true; learnFrozen = true;
        const sc = score + learnScoreBonus;
        const best = Math.max(sc, Number(localStorage.getItem('palm_racing_lvl5_best') || 0));
        localStorage.setItem('palm_racing_lvl5_best', String(best));
        const unlocked = Math.max(6, Number(localStorage.getItem('palm_racing_unlocked') || 1));
        localStorage.setItem('palm_racing_unlocked', String(unlocked));
        document.getElementById('level-done').style.display = 'flex';
    }
    function continueAfterLevel() {
        document.getElementById('level-done').style.display = 'none';
        learnFrozen = false;
    }
    function updateLearn(dt, moveSpeed) {
        raceDistance += moveSpeed;
        if (learnFrozen) return;
        if (learnGateCooldown > 0) { learnGateCooldown -= dt; if (learnGateCooldown <= 0) nextPrepRound(); return; }
        if (learnRound && !learnRound.resolved) {
            learnRound.timer -= dt;
            let reached = false;
            gates.forEach(g => { if (g.active) { g.group.position.z += moveSpeed; if (g.group.position.z > 6) reached = true; } });
            if (reached || learnRound.timer <= 0) resolveGates();
        }
    }

    // تهيئة اللعبة
    function initGame() {
        currentSpeed = 0.04;
        targetSpeed = 0.04;
        maxSpeed = 0.15;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 0, -3);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const roadGeo = new THREE.PlaneGeometry(14, 600);
        const road = new THREE.Mesh(roadGeo, new THREE.MeshLambertMaterial({ color: 0x555555 }));
        road.rotation.x = -Math.PI / 2;
        road.position.z = -200;
        road.position.y = 0.01;
        scene.add(road);

        for(let i=0; i<40; i++) {
            const line = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            line.rotation.x = -Math.PI / 2;
            line.position.z = -i * 12;
            line.position.y = 0.02;
            scene.add(line);
            lines.push(line);
        }

        playerCar = createCar(selectedCarType, selectedColor);
        scene.add(playerCar);
        initGatePool();
        resetLearn();
    }

    function spawnObstacle() {
        const colors = [0x9b59b6, 0xf39c12, 0x1abc9c, 0xe67e22, 0x3498db];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
        mesh.position.x = (Math.random() * 10) - 5;
        mesh.position.z = -100;
        mesh.position.y = 0.8;
        scene.add(mesh);
        obstacles.push(mesh);
    }

    function setupButton(id, key) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('pressed'); }, {passive: false});
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('pressed'); }, {passive: false});
        btn.addEventListener('mousedown', () => { keys[key] = true; btn.classList.add('pressed'); });
        btn.addEventListener('mouseup', () => { keys[key] = false; btn.classList.remove('pressed'); });
        btn.addEventListener('mouseleave', () => { keys[key] = false; btn.classList.remove('pressed'); });
    }

    function animate() {
        if (!isGameRunning || isGameOver) return;
        requestAnimationFrame(animate);

        if (keys.ArrowUp) targetSpeed = maxSpeed;
        else if (keys.ArrowDown) targetSpeed = 0.02;
        else targetSpeed = 0.04;

        if (currentSpeed < targetSpeed) currentSpeed += acceleration;
        if (currentSpeed > targetSpeed) currentSpeed -= braking * 1.5;

        if (!learnFrozen) {
            if (keys.ArrowLeft) targetX -= turnSpeed;
            if (keys.ArrowRight) targetX += turnSpeed;
        }

        targetX = Math.max(-maxTurn, Math.min(maxTurn, targetX));
        playerX += (targetX - playerX) * 0.08;
        playerCar.position.x = playerX;

        const moveSpeed = learnFrozen ? 0 : currentSpeed * 30;
        lines.forEach(l => { l.position.z += moveSpeed; if (l.position.z > 15) l.position.z = -465; });

        frameCount++;
        if (!learnFrozen && frameCount % 200 === 0) spawnObstacle();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.position.z += moveSpeed;
            const dist = Math.sqrt(Math.pow(playerCar.position.x - obs.position.x, 2) + Math.pow(playerCar.position.z - obs.position.z, 2));
            if (dist < 2.2) gameOver();
            if (obs.position.z > 15) { scene.remove(obs); obstacles.splice(i, 1); score += 10; document.getElementById('score').innerText = score; }
        }

        updateLearn(1 / 60, moveSpeed);
        checkLevelDone();

        renderer.render(scene, camera);
    }

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        initGame();
        isGameRunning = true;
        isGameOver = false;
        animate();
    }

    function gameOver() {
        isGameOver = true;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').innerText = score;
    }

    function resetGame() {
        obstacles.forEach(o => scene.remove(o));
        obstacles.length = 0;
        score = 0;
        currentSpeed = 0.04;
        playerX = 0;
        targetX = 0;
        playerCar.position.x = 0;
        document.getElementById('score').innerText = '0';
        document.getElementById('game-over').style.display = 'none';
        isGameOver = false;
        frameCount = 0;
        resetLearn();
        animate();
    }

    // الأحداث
    document.querySelectorAll('.option-btn[data-type]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.option-btn[data-type]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedCarType = btn.dataset.type;
            updateMenuCar();
        });
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedColor = parseInt(btn.dataset.color);
            updateMenuCar();
        });
    });

    setupButton('btn-left', 'ArrowLeft');
    setupButton('btn-right', 'ArrowRight');
    setupButton('btn-gas', 'ArrowUp');
    setupButton('btn-brake', 'ArrowDown');

    document.addEventListener('keydown', (e) => keys[e.code] = true);
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    window.addEventListener('resize', () => {
        if (menuRenderer) { menuCamera.aspect = window.innerWidth / window.innerHeight; menuCamera.updateProjectionMatrix(); menuRenderer.setSize(window.innerWidth, window.innerHeight); }
        if (renderer && isGameRunning) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
    });

    initMenu();
</script>
