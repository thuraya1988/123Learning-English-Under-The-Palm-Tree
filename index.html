<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Learn English Under The Palm Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sand: #f0e8d8;
      --warm: #e8d9c0;
      --bark: #8b5e3c;
      --leaf: #4a5e3a;
      --leaf-light: #7a8e5a;
      --gold: #c9a96e;
      --deep: #2c2018;
      --glass: rgba(255,255,255,0.55);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--sand);
      font-family: 'Cormorant Garamond', serif;
    }

    /* ─── GRAIN OVERLAY ─── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.6;
    }

    /* ─── SCENE WRAPPER ─── */
    .scene {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ─── BACKGROUND IMAGE (cover.jpeg from GitHub repo) ─── */
    .sky {
      position: absolute; inset: 0;
      background: url('cover.jpeg') center center / cover no-repeat;
    }

    /* ─── GROUND ─── */
    .ground {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28%;
      background: linear-gradient(to top, #c8a96a 0%, #ddbf85 60%, transparent 100%);
      border-radius: 100% 100% 0 0 / 30px 30px 0 0;
    }

    /* ─── PALM TREES ─── */
    .palm {
      position: absolute;
      bottom: 22%;
      transform-origin: bottom center;
      opacity: 0;
      animation: palmRise 1.8s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .palm svg { display: block; }

    /* Left cluster */
    .palm-1 { left: -2%; animation-delay: 0.3s; }
    .palm-2 { left: 5%;  bottom: 18%; animation-delay: 0.5s; transform: scaleX(-1); }
    /* Right cluster */
    .palm-3 { right: 0%; animation-delay: 0.4s; transform: scaleX(-1); }
    .palm-4 { right: 8%; bottom: 25%; animation-delay: 0.6s; }

    @keyframes palmRise {
      0%   { opacity: 0; transform: translateY(60px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .palm-2 { animation-name: palmRise2; }
    .palm-4 { animation-name: palmRise2; }
    @keyframes palmRise2 {
      0%   { opacity: 0; transform: scaleX(-1) translateY(60px) scale(0.9); }
      100% { opacity: 1; transform: scaleX(-1) translateY(0) scale(1); }
    }

    /* gentle sway after rise */
    .palm-1 { animation: palmRise 1.8s 0.3s cubic-bezier(0.22,1,0.36,1) forwards, sway 6s 2.1s ease-in-out infinite; }
    .palm-3 { animation: palmRise 1.8s 0.4s cubic-bezier(0.22,1,0.36,1) forwards, sway 7s 2.2s ease-in-out infinite; }
    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      50%      { transform: rotate(1.5deg); }
    }

    /* ─── GLASS ARCH ─── */
    .arch-wrap {
      position: relative;
      z-index: 10;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      animation: archIn 1.4s 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes archIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .arch {
      position: relative;
      width: min(340px, 70vw);
      aspect-ratio: 0.62 / 1;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-radius: 50% 50% 0 0 / 38% 38% 0 0;
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow:
        inset 0 2px 12px rgba(255,255,255,0.6),
        0 30px 80px rgba(160,120,60,0.18),
        0 4px 30px rgba(100,70,20,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px 50px;
      text-align: center;
    }

    /* glass sheen */
    .arch::before {
      content: '';
      position: absolute;
      top: 8%; left: 12%; right: 40%;
      height: 35%;
      background: linear-gradient(160deg, rgba(255,255,255,0.5) 0%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ─── TYPOGRAPHY ─── */
    .sub-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.55rem, 1.2vw, 0.7rem);
      letter-spacing: 0.25em;
      color: var(--bark);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s 1.6s ease forwards;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--gold);
      margin: 14px auto;
      opacity: 0;
      animation: fadeUp 1s 1.7s ease forwards;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 600;
      color: var(--deep);
      line-height: 1.25;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 1s 1.8s ease forwards;
    }

    .palm-icon {
      font-size: 2rem;
      margin: 12px 0;
      opacity: 0;
      animation: fadeUp 1s 1.9s ease forwards;
    }

    .year-tag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: var(--bark);
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeUp 1s 2.0s ease forwards;
    }

    .tagline {
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      color: #6b5030;
      line-height: 1.6;
      margin-top: 10px;
      font-style: italic;
      opacity: 0;
      animation: fadeUp 1s 2.1s ease forwards;
    }

    .palm-icons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 10px;
      margin: 10px 0;
    }
    .palm-icons span {
      font-size: 1.5rem;
      filter: grayscale(1) brightness(0); /* يحول الإيموجي لأسود */
      display: block;
      text-align: center;
    }

    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ─── TRANSITION OUT ─── */
    .page-overlay {
      position: fixed; inset: 0;
      background: var(--sand);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .page-overlay.fade { opacity: 1; }

    /* ─── FLOATING LEAVES ─── */
    .leaf {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--leaf-light);
      opacity: 0;
      animation: floatLeaf linear infinite;
    }
    @keyframes floatLeaf {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-80px) translateX(20px) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="page-overlay" id="overlay"></div>

<div class="scene">
  <div class="sky"></div>

  <!-- Floating particles -->
  <script>
    for (let i = 0; i < 12; i++) {
      const l = document.createElement('div');
      l.className = 'leaf';
      l.style.cssText = `
        left: ${10 + Math.random()*80}%;
        bottom: ${20 + Math.random()*40}%;
        width: ${3 + Math.random()*5}px;
        height: ${3 + Math.random()*5}px;
        animation-duration: ${6 + Math.random()*8}s;
        animation-delay: ${Math.random()*6}s;
      `;
      document.querySelector('.scene') ? null : null;
      document.currentScript.parentElement.appendChild(l);
    }
  </script>

  <!-- Left palms -->
  <div class="palm palm-1">
    <svg width="180" height="340" viewBox="0 0 180 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- trunk -->
      <path d="M90 340 Q85 280 88 220 Q86 160 82 100 Q80 70 84 50" stroke="#8b5e3c" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M90 340 Q95 280 92 220 Q94 160 90 100 Q90 70 92 50" stroke="#a07040" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
      <!-- fronds -->
      <path d="M84 50 Q40 20 10 40" stroke="#4a5e3a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M84 50 Q50 10 30 5" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M84 50 Q70 5 65 -10" stroke="#5a6e4a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M84 50 Q100 10 120 5" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M84 50 Q120 20 150 30" stroke="#4a5e3a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M84 50 Q130 40 160 60" stroke="#5a6e4a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- leaflets left frond -->
      <path d="M10 40 Q25 35 40 20" stroke="#3a4e2a" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M30 45 Q45 35 55 22" stroke="#3a4e2a" stroke-width="2" fill="none" opacity="0.7"/>
    </svg>
  </div>

  <div class="palm palm-2">
    <svg width="130" height="260" viewBox="0 0 130 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M65 260 Q62 210 64 160 Q62 110 60 70 Q58 50 62 36" stroke="#7a5030" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M62 36 Q30 10 5 25" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M62 36 Q40 5 25 0" stroke="#4a5e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M62 36 Q75 5 85 -5" stroke="#5a6e4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M62 36 Q85 10 110 15" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M62 36 Q100 30 125 50" stroke="#5a6e4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Right palms -->
  <div class="palm palm-3">
    <svg width="170" height="320" viewBox="0 0 170 320" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M85 320 Q80 265 83 205 Q81 148 78 94 Q76 66 80 46" stroke="#8b5e3c" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q40 18 12 38" stroke="#4a5e3a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q48 8 28 3" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q80 2 78 -12" stroke="#5a6e4a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q100 8 118 3" stroke="#4a5e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q118 18 148 28" stroke="#4a5e3a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M80 46 Q128 38 158 58" stroke="#5a6e4a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="palm palm-4">
    <svg width="110" height="240" viewBox="0 0 110 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M55 240 Q52 195 54 150 Q52 105 50 68 Q48 48 52 34" stroke="#7a5030" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M52 34 Q22 10 4 24" stroke="#4a5e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M52 34 Q35 4 20 -1" stroke="#4a5e3a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M52 34 Q62 2 70 -8" stroke="#5a6e4a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M52 34 Q72 8 95 12" stroke="#4a5e3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M52 34 Q88 28 108 46" stroke="#5a6e4a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="ground"></div>

  <!-- ARCH -->
  <div class="arch-wrap">
    <div class="arch">
      <p class="sub-label">An Educational Journey</p>
      <div class="divider"></div>
      <h1 class="title">Let's Learn English<br/>Under The Palm Tree</h1>
      <div class="palm-icons">
        <a href="THEPALM1973.html" style="text-decoration:none; filter:grayscale(1) brightness(0); font-size:1.5rem;">🌴</a><span>🌴</span><span>🌴</span>
        <span>🌴</span><span>🌴</span><span>🌴</span>
      </div>
      <p class="year-tag">From 1973 to 2027</p>
      <p class="tagline">Stories that might happen<br/>in Thuraya's deep mind</p>

    </div>
  </div>
</div>

</body>
</html>
