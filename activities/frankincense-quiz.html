<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frankincense of Oman — Unit 3, Lesson 5</title>
<style>
  :root{ --sand:#C9A15A; --sand-dark:#8a6a2f; --bg:#2B1E13; --card:#3B2A1B; --line:#5b4527;
    --gold:#E8B04B; --teal:#2FD1C4; --ink:#FBF3E4; --muted:#C9B79A; --good:#3FCB7E; --bad:#E85D5D; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; font-family:'Baloo 2', system-ui, sans-serif;
    background:radial-gradient(1000px 600px at 15% -10%, #4a341e, transparent 60%), var(--bg); color:var(--ink);}
  header{text-align:center; padding:26px 16px 6px;}
  h1{font-size:clamp(20px,5vw,30px); margin:0 0 6px;}
  .sub{color:var(--muted); font-size:14px; margin:0;}
  .wrap{max-width:700px; margin:0 auto; padding:16px;}
  .stage{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 20px; text-align:center;}
  .icon{font-size:38px; margin-bottom:8px;}
  .question{font-size:19px; font-weight:700; margin:6px 0 20px; line-height:1.4;}
  .answerRow{display:flex; flex-direction:column; gap:10px; align-items:stretch;}
  .opt{
    background:#241a10; border:2px solid var(--gold); color:var(--ink); font-family:inherit;
    font-size:16px; font-weight:600; padding:12px 18px; border-radius:12px; cursor:pointer; text-align:right;
    direction:ltr;
  }
  .opt.correct{background:var(--good); border-color:var(--good); color:#04211d;}
  .opt.wrong{background:var(--bad); border-color:var(--bad);}
  .feedback{min-height:26px; margin-top:16px; font-weight:700;}
  .feedback.good{color:var(--good);} .feedback.bad{color:var(--bad);}
  .nextbtn, .restart{display:none; margin:18px auto 0; background:var(--gold); color:#3a2600; border:none; border-radius:12px;
    padding:12px 26px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;}
  .nextbtn.show, .restart.show{display:block;}
  .fact-box{background:#241a10; border-left:4px solid var(--teal); border-radius:8px; padding:10px 14px; margin-top:16px; font-size:14px; color:var(--muted); text-align:right; display:none;}
  .fact-box.show{display:block;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:26px 16px;}
</style>
</head>
<body>
<header>
  <h1>🌿 Frankincense of Oman</h1>
  <p class="sub">Unit 3: Let's Explore! · Lesson 5 · Culture Quiz</p>
</header>

<div class="wrap">
  <div class="stage" id="stage"></div>
</div>
<footer>Grade 5A · English · Let's Explore! interactive activities</footer>

<script>
const Q = [
  { icon:"🌳", question:"Where do frankincense trees grow in Oman?", options:["Wadi Dawkah","Muscat city centre","The desert of Sharqiyah"], correct:0,
    fact:"Wadi Dawkah, in Dhofar, is a protected UNESCO World Heritage site full of frankincense trees." },
  { icon:"🏛️", question:"Which ancient port city was important for the frankincense trade?", options:["Al Balid","Nizwa Fort","Sohar Castle"], correct:0,
    fact:"Al Balid and Khawr Ruri were both important ports that shipped frankincense to the world." },
  { icon:"🌍", question:"What is the Land of Frankincense recognised as?", options:["A UNESCO World Heritage Site","A modern shopping mall","A type of Omani food"], correct:0,
    fact:"UNESCO added the Land of Frankincense (Wadi Dawkah, Shisr, Khor Rori, Al Balid) to its World Heritage list in the year 2000." },
  { icon:"💧", question:"What did people believe frankincense could help you do, according to the text?", options:["Breathe","Fly","Swim faster"], correct:0,
    fact:"In the past, people believed frankincense helped them to breathe — that's why it was so valuable." },
  { icon:"🐫", question:"How did people carry frankincense to other countries in the past?", options:["By camel caravan and ship","By train","By car"], correct:0,
    fact:"Frankincense travelled by camel caravan across the desert, then by ship from ports like Al Balid." },
];

let idx = 0, score = 0;

function render(){
  const item = Q[idx];
  const stage = document.getElementById('stage');
  const opts = item.options.map((o,i)=>({text:o, isCorrect:i===0 ? i===item.correct : i===item.correct}));
  stage.innerHTML = `
    <div class="icon">${item.icon}</div>
    <div class="question">Question ${idx+1} of ${Q.length} — ${item.question}</div>
    <div class="answerRow">
      ${item.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="fact-box" id="factbox">💡 ${item.fact}</div>
    <button class="nextbtn" id="nextbtn">${idx === Q.length-1 ? 'See my score →' : 'Next →'}</button>
  `;
  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', () => choose(btn, item.correct));
  });
  document.getElementById('nextbtn').addEventListener('click', next);
}

function choose(btn, correctIdx){
  const all = document.querySelectorAll('.opt');
  all.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  const chosen = parseInt(btn.dataset.i);
  if(chosen === correctIdx){
    btn.classList.add('correct');
    fb.textContent = "✓ Correct!";
    fb.className = "feedback good";
    score++;
  } else {
    btn.classList.add('wrong');
    all[correctIdx].classList.add('correct');
    fb.textContent = "Not quite — here's the correct answer.";
    fb.className = "feedback bad";
  }
  document.getElementById('factbox').classList.add('show');
  document.getElementById('nextbtn').classList.add('show');
}

function next(){
  idx++;
  if(idx >= Q.length){
    document.getElementById('stage').innerHTML = `
      <div class="icon">🌟</div>
      <div class="question">Challenge complete!</div>
      <p>You scored ${score} out of ${Q.length} on Omani frankincense heritage.</p>
      <button class="restart show" onclick="start()">Play again</button>
    `;
    return;
  }
  render();
}

function start(){ idx = 0; score = 0; render(); }
start();
</script>
</body>
</html>
