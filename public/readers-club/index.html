<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نادي القرّاء — مدرسة ملتقى المعارف</title>
<style>
:root{--ink:#302f2b;--beige:#f4ecdc;--paper:#fffaf0;--green:#333919;--burg:#7d2437;--line:#d9ccb5}
*{box-sizing:border-box}body{margin:0;background:var(--beige);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--green),#555b2d);color:#fff;padding:28px 20px;position:sticky;top:0;z-index:5;box-shadow:0 5px 20px #33391933}
.wrap{max-width:1180px;margin:auto}.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.mark{font-size:38px}.head h1{margin:0;font-size:clamp(24px,4vw,40px)}.head p{margin:4px 0 0;opacity:.88}
.controls{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer;font:inherit}.btn:hover{background:#fff;color:var(--green)}
main{padding:28px 18px 60px}.intro{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:22px;box-shadow:0 10px 25px #6d57301c}.intro h2{margin:0;color:var(--burg)}.intro p{margin:8px 0 0;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;min-height:180px;box-shadow:0 7px 18px #6d573014}.book .ico{font-size:35px}.book h3{margin:8px 0 4px;color:var(--green);font-size:18px}.book small{color:#746b5c;line-height:1.6}.open{margin-top:auto;border:0;background:var(--burg);color:#fff;border-radius:11px;padding:10px 12px;cursor:pointer;font:inherit}.open:hover{background:#5e1728}
.modal{display:none;position:fixed;inset:0;background:#15150dcc;z-index:20;padding:18px}.modal.show{display:flex;align-items:center;justify-content:center}.dialog{background:var(--paper);width:min(1100px,100%);height:min(90vh,900px);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--green);color:#fff}.bar strong{flex:1}.close{border:0;background:#fff;color:var(--burg);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}.reader{width:100%;height:100%;border:0;background:#eee}
@media(max-width:600px){.head h1{font-size:24px}.dialog{height:92vh}.intro{padding:17px}}
</style>
</head>
<body>
<header><div class="wrap head"><div class="mark">📚</div><div><h1>نادي القرّاء</h1><p>قصص مختارة للقراءة والتأمل — مدرسة ملتقى المعارف للتعليم الأساسي</p></div><div class="controls"><button class="btn" id="musicBtn">▶ تشغيل موسيقى الخلفية</button><a class="btn" href="../school/">العودة للمنظومة</a></div></div></header>
<main class="wrap"><section class="intro"><h2>مرحبًا بكِ في نادي القرّاء</h2><p>اختاري كتابًا ليفتح داخل نافذة القراءة. يمكنك تكبير الصفحة أو تنزيل الكتاب من أدوات عارض PDF.</p></section><section class="grid" id="books"></section></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="bar"><strong id="title"></strong><button class="close" id="close">إغلاق</button></div><iframe id="reader" class="reader" title="عارض الكتاب"></iframe></div></div>
<audio id="bg" loop preload="metadata" src="multaqa-world.mp3"></audio>
<script>
const books=[
 ["طائر الكرادلة","Ar_TheCardinalsBird.pdf","📕"],["صانع الحلوى","Ar_TheHalwaMaker.pdf","🍬"],["دليل القصة — English","En_Story-Guide.pdf","📘"],["سيريس وفيستا","Ar_CeresAndVesta.pdf","🌌"],["نهاية فوكسِي","Ar_TheEndOfFoxy.pdf","🦊"],["جبول وكراشر","Ar_JaboolAndCrusher.pdf","🪨"],["الساعة السحرية","Ar_TheMagicWatch.pdf","⌚"],["جزيرة الدمى","Ar_TheIslandOfDolls.pdf","🏝️"],["شجرة الزيتون","Ar_TheOliveTree.pdf","🫒"]
];
const root=".";const list=document.getElementById("books"),modal=document.getElementById("modal"),reader=document.getElementById("reader"),title=document.getElementById("title");
list.innerHTML=books.map(([n,f,i])=>`<article class="book"><div class="ico">${i}</div><h3>${n}</h3><small>اضغطي لفتح الكتاب في نافذة نادي القرّاء.</small><button class="open" data-file="${f}" data-title="${n}">فتح الكتاب</button></article>`).join("");
list.addEventListener("click",e=>{const b=e.target.closest(".open");if(!b)return;title.textContent=b.dataset.title;reader.src=root+"/"+b.dataset.file;modal.classList.add("show");});
document.getElementById("close").onclick=()=>{modal.classList.remove("show");reader.src="about:blank"};modal.addEventListener("click",e=>{if(e.target===modal)document.getElementById("close").click()});
const bg=document.getElementById("bg"),mb=document.getElementById("musicBtn");mb.onclick=()=>{if(bg.paused){bg.play().then(()=>mb.textContent="⏸ إيقاف موسيقى الخلفية").catch(()=>mb.textContent="اضغطي مرة أخرى للسماح بالصوت")}else{bg.pause();mb.textContent="▶ تشغيل موسيقى الخلفية"}};
</script>
</body></html>
