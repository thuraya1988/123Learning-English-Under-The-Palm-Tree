<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Palm Challenges</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;min-height:100%;font-family:'Cormorant Garamond',serif;background:url('cover.jpeg') center/cover fixed no-repeat;color:#111}
    body::before{content:'';position:fixed;inset:0;background:rgba(255,255,255,.18);pointer-events:none}
    .page{position:relative;z-index:1;max-width:1050px;margin:2vh auto;padding:20px}
    .card{background:rgba(255,255,255,.35);border-radius:24px;padding:18px;backdrop-filter:blur(5px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
    input,select{padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.2);font-size:1rem}
    button,a.btn{background:#1e5d2a;color:#fff;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
    button[disabled]{opacity:.45;cursor:not-allowed}
    .status{font-weight:700;margin-top:8px}
    .locked{opacity:.45;pointer-events:none}
    .jojo-wrap{min-height:420px;background:rgba(255,255,255,.50);border-radius:20px;padding:10px}
    model-viewer{width:100%;height:360px;background:transparent}
    .back{margin-top:14px}
    @media (max-width: 900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>The Palm Challenges</h1>
      <p>املأ بيانات الطالب أولاً، بعدها يتفعل زر البداية ويظهر جوجو.</p>

      <div class="grid">
        <div>
          <h2>Student Data</h2>
          <div class="form-row"><label>الاسم</label><input id="studentName" type="text" placeholder="اكتب اسم الطالب" /></div>
          <div class="form-row"><label>الصف</label><input id="studentGrade" type="text" placeholder="مثال: الصف الثالث" /></div>
          <div class="form-row"><label>المدرسة</label><input id="studentSchool" type="text" placeholder="اسم المدرسة" /></div>
          <button id="activateBtn" disabled onclick="activateChallenge(); playClick();">Activate Challenge</button>
          <p id="status" class="status">🔒 Challenge is locked</p>
        </div>

        <div id="challengePanel" class="locked">
          <h2>Jojo Assistant</h2>
          <div class="jojo-wrap">
            <model-viewer id="jojoModel" src="jojoWalking.glb" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button onclick="setJojo('jojoWalking.glb'); playClick();">Jojo Walking</button>
            <button onclick="setJojo('jojoLaughing.glb'); playClick();">Jojo Laughing</button>
            <button onclick="setJojo('jojoTalking-On-Phone.glb'); playClick();">Jojo Talking</button>
            <button onclick="setJojo('jojosalute.glb'); playClick();">Jojo Salute</button>
          </div>
          <p class="status">✅ Start button becomes active only after data is complete.</p>
        </div>
      </div>

      <a class="btn back" href="index.html" onclick="playClick()">⬅ Back to Home</a>
    </section>
  </main>

  <audio id="bg-music" autoplay loop><source src="joyfull.mp3" type="audio/mpeg"></audio>
  <audio id="click-sfx" preload="auto"><source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg"></audio>
  <script>
    const nameInput = document.getElementById('studentName');
    const gradeInput = document.getElementById('studentGrade');
    const schoolInput = document.getElementById('studentSchool');
    const activateBtn = document.getElementById('activateBtn');
    const statusEl = document.getElementById('status');
    const panel = document.getElementById('challengePanel');

    function validateForm() {
      const valid = nameInput.value.trim().length > 1 && gradeInput.value.trim().length > 0 && schoolInput.value.trim().length > 1;
      activateBtn.disabled = !valid;
      return valid;
    }

    [nameInput, gradeInput, schoolInput].forEach((el) => el.addEventListener('input', validateForm));

    function activateChallenge() {
      if (!validateForm()) return;
      panel.classList.remove('locked');
      statusEl.textContent = '✅ Challenge Activated. Jojo is ready!';
    }

    function setJojo(file) {
      document.getElementById('jojoModel').setAttribute('src', file);
    }
  </script>
  <script src="sound.js"></script>
</body>
</html>
