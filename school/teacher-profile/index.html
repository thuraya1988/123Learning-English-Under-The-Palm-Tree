<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الملف التعريفي للمعلمة</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo/arabic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo/arabic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal/arabic-500-normal.css">
<style>
:root{
  --bg:#f2e8d5; --panel:#fffaf0; --panel2:#f7ecd8; --line:#e3d0a4; --line2:#cdb27e;
  --txt:#2c2015; --muted:#8a7550; --acc:#7b1e3a; --acc2:#16213e; --ok:#3f7d52;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(1100px 620px at 85% -10%,#f8ecd0 0%,#f2e8d5 62%) fixed;
  color:var(--txt);-webkit-tap-highlight-color:transparent;
}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#fffaf0,#f5e9cd);border-bottom:2px solid var(--acc);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;
  background:conic-gradient(from 210deg,#7b1e3a,#16213e,#b08d29,#7b1e3a);box-shadow:0 8px 20px rgba(123,30,58,.28)}
.brand h1{font-size:17px;margin:0;font-weight:700;color:var(--acc2)}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  padding:9px 14px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line2);background:#f0e0bb;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#7b1e3a,#5c1630);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(123,30,58,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
select.picker{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:700}

.wrap{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.empty{text-align:center;padding:50px 16px;color:var(--muted);font-size:13.5px}
.empty span{font-size:34px;display:block;margin-bottom:10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(90,60,20,.07)}
.card h2{margin:0 0 12px;font-size:15.5px;color:var(--acc2);display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 small{font-weight:500;color:var(--muted);font-size:11.5px}

.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-pick{position:relative;width:88px;height:88px;flex:none}
.photo-pick .ph{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#7b1e3a,#16213e);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;overflow:hidden;border:2px solid var(--line2)}
.photo-pick .ph img{width:100%;height:100%;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick .cam{position:absolute;bottom:-4px;left:-4px;background:var(--acc);color:#fff;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:12px;pointer-events:none}
.profile-info{flex:1;min-width:200px}
.profile-info h3{margin:0;font-size:18px;color:var(--acc2)}
.profile-info p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.coord-badge{display:inline-block;margin-inline-start:8px;color:var(--acc);font-weight:800;font-size:11.5px}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.contact-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.contact-grid dt{font-size:10.5px;color:var(--muted);font-weight:700}
.contact-grid dd{margin:2px 0 0;font-size:13px;font-weight:700}
.achv-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.achv-list li{background:rgba(123,30,58,.08);border:1px solid var(--line2);color:var(--acc);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-tile{background:linear-gradient(135deg,rgba(123,30,58,.08),rgba(22,33,62,.06));border:1px solid var(--line2);border-radius:16px;padding:14px;text-align:center}
.stat-tile b{display:block;font-size:24px;color:var(--acc2)}
.stat-tile span{font-size:11.5px;color:var(--muted);font-weight:700}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.field select,.field input,.field textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--acc)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.media-item{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2);aspect-ratio:1;display:flex;flex-direction:column}
.media-item img{width:100%;height:100%;object-fit:cover;flex:1}
.media-item .pdf-ico{flex:1;display:grid;place-items:center;font-size:30px}
.media-item .cap{font-size:10px;padding:4px 6px;background:rgba(255,250,240,.9);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-item .del{position:absolute;top:4px;left:4px;background:rgba(30,20,10,.55);color:#fff;border:none;border-radius:8px;width:22px;height:22px;font-size:11px;cursor:pointer}
.upload-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px dashed var(--line2);color:var(--acc);border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:10px}
.upload-btn input{display:none}

.list-simple{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list-simple .row{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.list-simple .row .txt{flex:1;font-size:12.5px}
.list-simple .row .txt b{display:block;font-size:13px;color:var(--acc2);margin-bottom:2px}
.list-simple .row .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.list-simple .row .del:hover{color:var(--acc)}
.badge-status{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;margin-inline-start:6px}
.badge-status.planned{background:rgba(138,117,80,.18);color:var(--muted)}
.badge-status.in_progress,.badge-status.active{background:rgba(176,141,41,.2);color:#8a6a10}
.badge-status.done,.badge-status.completed{background:rgba(63,125,82,.18);color:var(--ok)}
.badge-status.paused{background:rgba(123,30,58,.14);color:var(--acc)}
.tag-chip{display:inline-block;background:rgba(22,33,62,.08);border:1px solid rgba(22,33,62,.25);color:var(--acc2);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;margin-inline-end:6px}
.att-link{font-size:11px;color:var(--acc);text-decoration:underline;font-weight:700}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--acc2);border:1px solid #223256;color:#f2e8d5;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(22,33,62,.35);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.brand p{display:none}.topbar{gap:8px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo">🪪</div>
    <div>
      <h1>الملف التعريفي للمعلمة</h1>
      <p>بطاقة تعريفية شاملة بإنجازات المعلمة ومسيرتها المهنية</p>
    </div>
  </div>
  <div class="actions">
    <select class="picker" id="teacherPicker" style="display:none"></select>
    <button class="btn" id="btnRefresh" title="تحديث">🔄</button>
    <a class="btn" href="../index.html">🏠 الرئيسية</a>
  </div>
</div>

<div class="wrap" id="app"><div class="empty"><span>⏳</span>جاري تحميل الملف…</div></div>
<div class="toast" id="toast"></div>

<script>
const SECURE_API='https://dhhwcqczvcbwdwllfcun.supabase.co/functions/v1/multaqa-secure';
const DOMAINS=['رفع المستوى التحصيلي وجودة التعلم','التطوير المهني وتطبيق الأنظمة','التخطيط واستراتيجيات التدريس','البحث العلمي والذكاء الاصطناعي','الهوية العمانية والسلامة'];
const UNITS=['عام','Welcome back','Talent Show','Then and Now',"Let's Explore!",'Off to the Shops'];
const STATUS_LABEL={planned:'مخطط',in_progress:'قيد التنفيذ',done:'منجز'};
const PROJECT_STATUS_LABEL={planned:'مخطط',active:'نشط',completed:'مكتمل',paused:'متوقف مؤقتًا'};
const PROJECT_LABEL={initiative:'مبادرة',competition:'مسابقة'};
let current=null,photoFile=null,editEmployeeId=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}
function opts(list,cur){return list.map(x=>`<option value="${esc(x)}" ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}

async function secureApi(action,p={}){
  const token=localStorage.getItem('multaqa_staff_session')||'';
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(SECURE_API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'x-staff-session':token}:{})},body:JSON.stringify({action,...p}),signal:ctl.signal});
    let d={};try{d=await r.json();}catch(err){}
    if(!r.ok||d.ok===false)throw Object.assign(new Error(d.error||'request_failed'),{code:d.error||'request_failed'});
    return d;
  }finally{clearTimeout(timer);}
}
const ERR={
  service_timeout:'الخدمة لا تستجيب الآن، حاولي بعد قليل',
  forbidden:'ليست لديك صلاحية لهذا الإجراء',
  invalid_input:'تحققي من البيانات المدخلة',
  save_failed:'تعذر الحفظ، حاولي مرة أخرى',
  session_required:'انتهت جلستك، سجّلي الدخول من جديد من الصفحة الرئيسية',
  not_found:'العنصر غير موجود',
  upload_failed:'تعذر رفع الملف'
};

async function uploadFile(file,category,employeeId){
  const u=await secureApi('prepare_teacher_profile_file_upload',{employee_id:employeeId,category,mime_type:file.type});
  const up=await fetch(u.signed_url,{method:'PUT',headers:{'Content-Type':file.type,'x-upsert':'false'},body:file});
  if(!up.ok)throw Object.assign(new Error('upload_failed'),{code:'upload_failed'});
  return u.path;
}

async function boot(){
  const token=localStorage.getItem('multaqa_staff_session')||'';
  if(!token){
    document.getElementById('app').innerHTML='<div class="empty"><span>🔒</span>سجّلي الدخول من الصفحة الرئيسية لعرض ملفك التعريفي.<br><br><a class="btn primary" href="../index.html">الذهاب لتسجيل الدخول</a></div>';
    return;
  }
  await load();
}
async function load(employeeId){
  try{
    const d=await secureApi('teacher_profile_page',employeeId?{employee_id:employeeId}:{});
    current=d;editEmployeeId=d.employee.employee_id;
    if(d.can_edit&&!employeeId){
      try{
        const dir=await secureApi('teacher_profiles');
        const picker=document.getElementById('teacherPicker');
        if((dir.items||[]).length>1){
          picker.style.display='';
          picker.innerHTML=dir.items.map(x=>`<option value="${x.employee_id}" ${x.employee_id===d.employee.employee_id?'selected':''}>${esc(x.short_name||x.full_name)}</option>`).join('');
          picker.onchange=()=>load(picker.value);
        }
      }catch(e){}
    }
    render();
  }catch(err){
    document.getElementById('app').innerHTML=`<div class="empty"><span>⚠️</span>${esc(ERR[err&&err.code]||'تعذر تحميل الملف التعريفي الآن')}</div>`;
  }
}

function render(){
  const {employee:x,stats,media,notes,projects,ijada_goals,can_edit}=current;
  const p=x.profile||{};
  const initials=(x.short_name||x.full_name||'م').slice(0,1);
  const cert=media.filter(m=>m.media_type==='certificate'),workshop=media.filter(m=>m.media_type==='workshop'),gallery=media.filter(m=>m.media_type==='gallery');
  const topStudents=notes.filter(n=>n.note_type==='top_student'),needsPlan=notes.filter(n=>n.note_type==='needs_plan'),genNotes=notes.filter(n=>n.note_type==='note');
  const initiatives=projects.filter(pr=>pr.project_type==='initiative'||pr.project_type==='school'||pr.project_type==='students');
  const competitions=projects.filter(pr=>pr.project_type==='competition');

  document.getElementById('app').innerHTML=`
  <section class="card">
    <div class="profile-head">
      <label class="photo-pick">
        <div class="ph">${p.photo_url?`<img src="${esc(p.photo_url)}">`:esc(initials)}</div>
        ${can_edit?'<div class="cam">📷</div><input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp">':''}
      </label>
      <div class="profile-info">
        <h3>${esc(x.full_name)}${p.is_coordinator?`<span class="coord-badge">🌟 منسقة ${esc(p.subject||'المادة')}</span>`:''}</h3>
        <p>${esc(p.display_title||x.role||'معلمة')} • ${esc(p.subject||'لم يتم تسجيل التخصص')}</p>
      </div>
      ${can_edit?'<button class="btn primary sm" id="btnEditProfile">✏️ تعديل البيانات</button>':''}
    </div>
    <div class="contact-grid">
      <div><dt>📧 البريد الوزاري</dt><dd>${esc(p.work_email||'—')}</dd></div>
      <div><dt>📞 رقم التواصل</dt><dd>${esc(p.contact_phone||p.phone||'—')}</dd></div>
      <div><dt>🏫 الصفوف</dt><dd>${esc((p.class_labels||[]).join('، ')||'—')}</dd></div>
    </div>
    <ul class="achv-list">${(p.achievements||[]).length?(p.achievements||[]).map(a=>`<li>🏆 ${esc(a)}</li>`).join(''):'<li>لا توجد إنجازات مسجلة بعد</li>'}</ul>
    <div id="profileEditor"></div>
  </section>

  <section class="stats-row">
    <div class="stat-tile"><b>${stats.absences}</b><span>عدد أيام الغياب</span></div>
    <div class="stat-tile"><b>${stats.lab_bookings}</b><span>حجوزات المختبر</span></div>
    <div class="stat-tile"><b>${stats.resource_room_bookings}</b><span>حجوزات غرفة المصادر</span></div>
  </section>

  <section class="card">
    <h2>🏅 شهادات التقدير 2026 <small>${cert.length} شهادة</small></h2>
    <div class="media-grid" id="grid-certificate">${mediaGrid(cert)}</div>
    ${can_edit?uploadBtn('certificate','📤 رفع شهادة'):''}
  </section>

  <section class="card">
    <h2>🛠️ صور المشاغل التدريبية <small>${workshop.length} صورة</small></h2>
    <div class="media-grid" id="grid-workshop">${mediaGrid(workshop)}</div>
    ${can_edit?uploadBtn('workshop','📤 رفع صورة مشغل'):''}
  </section>

  <section class="card">
    <h2>📷 صور عامة <small>${gallery.length} صورة</small></h2>
    <div class="media-grid" id="grid-gallery">${mediaGrid(gallery)}</div>
    ${can_edit?uploadBtn('gallery','📤 رفع صورة'):''}
  </section>

  <section class="card">
    <h2>🚀 المبادرات <small>${initiatives.length}</small></h2>
    <div class="list-simple">${initiatives.map(pr=>projectRow(pr,can_edit)).join('')||'<div class="empty">لا توجد مبادرات مسجلة بعد</div>'}</div>
    ${can_edit?projectForm('initiative'):''}
  </section>

  <section class="card">
    <h2>🏆 المسابقات <small>${competitions.length}</small></h2>
    <div class="list-simple">${competitions.map(pr=>projectRow(pr,can_edit)).join('')||'<div class="empty">لا توجد مسابقات مسجلة بعد</div>'}</div>
    ${can_edit?projectForm('competition'):''}
  </section>

  <section class="card">
    <h2>📘 خطة تطبيق أهداف إجادة الإلكترونية <small>${ijada_goals.length} هدف</small></h2>
    <div class="list-simple">${ijada_goals.map(goalRow).join('')||'<div class="empty">لم تُضف أهداف بعد</div>'}</div>
    ${can_edit?goalForm():''}
  </section>

  <section class="card">
    <h2>🌟 أبرز الطالبات <small>${topStudents.length}</small></h2>
    <div class="list-simple">${topStudents.map(n=>noteRow(n,can_edit)).join('')||'<div class="empty">لا توجد أسماء مسجلة بعد</div>'}</div>
    ${can_edit?noteForm('top_student','اسم الطالبة','ملاحظة (اختياري)'):''}
  </section>

  <section class="card">
    <h2>🧩 طالبات بحاجة لخطة <small>${needsPlan.length}</small></h2>
    <div class="list-simple">${needsPlan.map(n=>noteRow(n,can_edit)).join('')||'<div class="empty">لا توجد أسماء مسجلة بعد</div>'}</div>
    ${can_edit?noteForm('needs_plan','اسم الطالبة','وصف الحاجة/الخطة المقترحة'):''}
  </section>

  <section class="card">
    <h2>📝 ملاحظات المعلمة <small>${genNotes.length}</small></h2>
    <div class="list-simple">${genNotes.map(n=>noteRow(n,can_edit)).join('')||'<div class="empty">لا توجد ملاحظات بعد</div>'}</div>
    ${can_edit?noteForm('note','عنوان مختصر (اختياري)','الملاحظة'):''}
  </section>
  `;
  wireEvents(can_edit);
}

function mediaGrid(list){
  if(!list.length)return '<div class="empty" style="padding:20px 8px">لا يوجد شيء بعد</div>';
  return list.map(m=>{
    const isPdf=/\.pdf($|\?)/i.test(m.storage_path),isVideo=/\.(mp4|webm|mov)($|\?)/i.test(m.storage_path);
    return `<div class="media-item">
      ${current.can_edit?`<button class="del" data-del-media="${m.id}">✕</button>`:''}
      ${isPdf?`<a class="pdf-ico" href="${esc(m.url)}" target="_blank">📄</a>`:isVideo?`<video controls preload="metadata" src="${esc(m.url)}"></video>`:`<a href="${esc(m.url)}" target="_blank"><img src="${esc(m.url)}"></a>`}
      ${m.title||m.year?`<div class="cap">${esc(m.title||'')}${m.year?' '+m.year:''}</div>`:''}
    </div>`;
  }).join('');
}
function uploadBtn(category,label){
  return `<label class="upload-btn">${label}<input type="file" accept="image/jpeg,image/png,image/webp,application/pdf,video/mp4,video/webm,video/quicktime" data-upload="${category}"></label>`;
}
function projectRow(pr,can_edit){
  return `<div class="row"><div class="txt"><b>${esc(pr.title)}<span class="badge-status ${esc(pr.status)}">${esc(PROJECT_STATUS_LABEL[pr.status]||pr.status)}</span></b>${esc(pr.description||'')}${pr.achievements?`<br><small>🏆 ${esc(pr.achievements)}</small>`:''}</div>${can_edit?`<button class="del" data-del-project="${pr.id}">🗑</button>`:''}</div>`;
}
function projectForm(type){
  return `<div class="form-row" style="margin-top:12px">
    <input placeholder="${type==='competition'?'اسم المسابقة':'اسم المبادرة'}" id="pf-title-${type}">
    <select id="pf-status-${type}"><option value="planned">مخطط</option><option value="active" selected>نشط</option><option value="completed">مكتمل</option><option value="paused">متوقف</option></select>
  </div>
  <textarea placeholder="الوصف" id="pf-desc-${type}" rows="2" style="width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:inherit"></textarea>
  <textarea placeholder="النتائج/الإنجازات" id="pf-ach-${type}" rows="2" style="width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:inherit"></textarea>
  <button class="btn primary sm" style="margin-top:8px" data-add-project="${type}">➕ إضافة</button>`;
}
function goalRow(g){
  return `<div class="row"><div class="txt"><span class="tag-chip">${esc(g.domain)}</span>${g.unit&&g.unit!=='عام'?`<span class="tag-chip">${esc(g.unit)}</span>`:''}<span class="badge-status ${esc(g.status)}">${esc(STATUS_LABEL[g.status]||g.status)}</span><b style="display:block;margin-top:4px">${esc(g.goal_text)}</b>${g.note?esc(g.note):''}${g.attachment_url?`<br><a class="att-link" href="${esc(g.attachment_url)}" target="_blank">📎 عرض المرفق</a>`:''}</div>${current.can_edit?`<button class="del" data-del-goal="${g.id}">🗑</button>`:''}</div>`;
}
function goalForm(){
  return `<div class="form-row" style="margin-top:12px">
    <select id="gf-domain">${opts(DOMAINS)}</select>
    <select id="gf-unit">${opts(UNITS)}</select>
    <select id="gf-status"><option value="planned">مخطط</option><option value="in_progress">قيد التنفيذ</option><option value="done">منجز</option></select>
  </div>
  <textarea placeholder="نص الهدف أو النشاط المنفذ" id="gf-text" rows="2" style="width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:inherit"></textarea>
  <textarea placeholder="ملاحظة (اختياري)" id="gf-note" rows="2" style="width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:inherit"></textarea>
  <label class="upload-btn">📎 إرفاق ملف (اختياري)<input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" id="gf-file"></label>
  <span id="gf-file-name" style="font-size:11px;color:var(--muted);margin-inline-start:8px"></span>
  <div><button class="btn primary sm" style="margin-top:8px" id="btnAddGoal">➕ إضافة الهدف</button></div>`;
}
function noteRow(n,can_edit){
  return `<div class="row"><div class="txt">${n.title?`<b>${esc(n.title)}</b>`:''}${n.body?esc(n.body):''}</div>${can_edit?`<button class="del" data-del-note="${n.id}">🗑</button>`:''}</div>`;
}
function noteForm(type,titlePh,bodyPh){
  return `<div class="form-row" style="margin-top:12px">
    <input placeholder="${titlePh}" id="nf-title-${type}">
  </div>
  <textarea placeholder="${bodyPh}" id="nf-body-${type}" rows="2" style="width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:inherit"></textarea>
  <button class="btn primary sm" style="margin-top:8px" data-add-note="${type}">➕ إضافة</button>`;
}

function openProfileEditor(){
  const p=current.employee.profile||{};
  document.getElementById('profileEditor').innerHTML=`
  <div class="form-row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
    <div class="field"><label>المسمى الوظيفي</label><input id="ep-title" value="${esc(p.display_title||'')}"></div>
    <div class="field"><label>التخصص</label><input id="ep-subject" value="${esc(p.subject||'')}"></div>
    <div class="field"><label>البريد الإلكتروني الوزاري</label><input id="ep-email" type="email" value="${esc(p.work_email||'')}"></div>
    <div class="field"><label>رقم الهاتف</label><input id="ep-phone" value="${esc(p.phone||'')}"></div>
    <div class="field"><label>رقم التواصل</label><input id="ep-contact" value="${esc(p.contact_phone||'')}"></div>
  </div>
  <div class="field"><label>الإنجازات — كل إنجاز في سطر</label><textarea id="ep-achv" rows="3">${esc((p.achievements||[]).join('\n'))}</textarea></div>
  <button class="btn primary sm" id="btnSaveProfile">💾 حفظ البيانات</button>`;
  document.getElementById('btnSaveProfile').addEventListener('click',saveProfile);
}
async function saveProfile(){
  try{
    await secureApi('save_teacher_profile',{employee_id:editEmployeeId,display_title:document.getElementById('ep-title').value,subject:document.getElementById('ep-subject').value,work_email:document.getElementById('ep-email').value,phone:document.getElementById('ep-phone').value,contact_phone:document.getElementById('ep-contact').value,achievements:document.getElementById('ep-achv').value.split('\n').map(x=>x.trim()).filter(Boolean)});
    toast('✅ تم حفظ البيانات');
    load(editEmployeeId);
  }catch(err){toast(ERR[err&&err.code]||'تعذر الحفظ الآن');}
}

function wireEvents(can_edit){
  document.getElementById('btnRefresh').addEventListener('click',()=>load(editEmployeeId));
  if(!can_edit)return;
  const photoInput=document.getElementById('photoInput');
  if(photoInput)photoInput.addEventListener('change',async()=>{
    const f=photoInput.files[0];if(!f)return;
    try{
      const u=await secureApi('prepare_teacher_photo_upload',{employee_id:editEmployeeId,mime_type:f.type});
      const up=await fetch(u.signed_url,{method:'PUT',headers:{'Content-Type':f.type,'x-upsert':'false'},body:f});
      if(!up.ok)throw Object.assign(new Error('upload_failed'),{code:'upload_failed'});
      await secureApi('complete_teacher_photo',{employee_id:editEmployeeId,path:u.path});
      toast('✅ تم تحديث الصورة');load(editEmployeeId);
    }catch(err){toast(ERR[err&&err.code]||'تعذر رفع الصورة');}
  });
  const editBtn=document.getElementById('btnEditProfile');
  if(editBtn)editBtn.addEventListener('click',openProfileEditor);

  document.querySelectorAll('[data-upload]').forEach(inp=>inp.addEventListener('change',async()=>{
    const f=inp.files[0];if(!f)return;const category=inp.dataset.upload;
    try{
      const path=await uploadFile(f,category,editEmployeeId);
      await secureApi('save_teacher_profile_media',{employee_id:editEmployeeId,media_type:category,path});
      toast('✅ تم الرفع');load(editEmployeeId);
    }catch(err){toast(ERR[err&&err.code]||'تعذر رفع الملف');}
  }));
  document.querySelectorAll('[data-del-media]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('حذف هذا العنصر؟'))return;
    try{await secureApi('delete_teacher_profile_media',{id:b.dataset.delMedia});toast('🗑 تم الحذف');load(editEmployeeId);}catch(err){toast(ERR[err&&err.code]||'تعذر الحذف');}
  }));
  document.querySelectorAll('[data-del-project]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('حذف هذا العنصر؟'))return;
    try{await secureApi('delete_teacher_project',{id:b.dataset.delProject});toast('🗑 تم الحذف');load(editEmployeeId);}catch(err){toast(ERR[err&&err.code]||'تعذر الحذف');}
  }));
  document.querySelectorAll('[data-add-project]').forEach(b=>b.addEventListener('click',async()=>{
    const type=b.dataset.addProject;
    const title=document.getElementById(`pf-title-${type}`).value.trim();
    if(title.length<2){toast('اكتبي عنوانًا أولًا');return;}
    try{
      await secureApi('save_teacher_project',{employee_id:editEmployeeId,title,project_type:type,status:document.getElementById(`pf-status-${type}`).value,description:document.getElementById(`pf-desc-${type}`).value,achievements:document.getElementById(`pf-ach-${type}`).value});
      toast('✅ تم الإضافة');load(editEmployeeId);
    }catch(err){toast(ERR[err&&err.code]||'تعذر الحفظ');}
  }));
  document.querySelectorAll('[data-del-note]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('حذف هذا العنصر؟'))return;
    try{await secureApi('delete_teacher_profile_note',{id:b.dataset.delNote});toast('🗑 تم الحذف');load(editEmployeeId);}catch(err){toast(ERR[err&&err.code]||'تعذر الحذف');}
  }));
  document.querySelectorAll('[data-add-note]').forEach(b=>b.addEventListener('click',async()=>{
    const type=b.dataset.addNote;
    const title=document.getElementById(`nf-title-${type}`).value.trim();
    const body=document.getElementById(`nf-body-${type}`).value.trim();
    if(!title&&!body){toast('اكتبي محتوى أولًا');return;}
    try{
      await secureApi('save_teacher_profile_note',{employee_id:editEmployeeId,note_type:type,title,body});
      toast('✅ تم الإضافة');load(editEmployeeId);
    }catch(err){toast(ERR[err&&err.code]||'تعذر الحفظ');}
  }));
  document.querySelectorAll('[data-del-goal]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('حذف هذا الهدف؟'))return;
    try{await secureApi('delete_ijada_goal',{id:b.dataset.delGoal});toast('🗑 تم الحذف');load(editEmployeeId);}catch(err){toast(ERR[err&&err.code]||'تعذر الحذف');}
  }));
  const gfFile=document.getElementById('gf-file');
  if(gfFile)gfFile.addEventListener('change',()=>{document.getElementById('gf-file-name').textContent=gfFile.files[0]?gfFile.files[0].name:''});
  const addGoalBtn=document.getElementById('btnAddGoal');
  if(addGoalBtn)addGoalBtn.addEventListener('click',async()=>{
    const goal_text=document.getElementById('gf-text').value.trim();
    if(goal_text.length<2){toast('اكتبي نص الهدف أولًا');return;}
    addGoalBtn.disabled=true;addGoalBtn.textContent='جاري الحفظ…';
    try{
      let attachment_path='';
      const f=gfFile&&gfFile.files[0];
      if(f)attachment_path=await uploadFile(f,'ijada',editEmployeeId);
      await secureApi('save_ijada_goal',{employee_id:editEmployeeId,domain:document.getElementById('gf-domain').value,unit:document.getElementById('gf-unit').value,status:document.getElementById('gf-status').value,goal_text,note:document.getElementById('gf-note').value,attachment_path});
      toast('✅ تم إضافة الهدف');load(editEmployeeId);
    }catch(err){toast(ERR[err&&err.code]||'تعذر الحفظ');addGoalBtn.disabled=false;addGoalBtn.textContent='➕ إضافة الهدف';}
  });
}

boot();
</script>
</body>
</html>
