<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Page 4 - Palm Readers</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #FDF3DD; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* العنوان */
        #page-title {
            position: fixed;
            top: clamp(14px, 3vh, 30px);
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Fredoka One', cursive;
            font-size: clamp(1rem, 3vw, 2rem);
            color: #4a9a5a;
            letter-spacing: clamp(2px, 0.8vw, 8px);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.12);
            text-transform: uppercase;
            z-index: 100;
            white-space: nowrap;
        }

        /* المسامير */
        .corner-btn {
            position: fixed;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 400;
            transition: transform 0.2s;
            width: clamp(28px, 3.5vw, 42px);
            height: clamp(28px, 3.5vw, 42px);
            font-size: clamp(1rem, 2vw, 1.5rem);
            margin: clamp(8px, 1.5vw, 18px);
            box-shadow:
                0 4px 6px rgba(0,0,0,0.25),
                0 1px 3px rgba(0,0,0,0.15),
                inset 0 1px 1px rgba(255,255,255,0.3);
            z-index: 100;
        }
        .corner-btn:hover  { transform: scale(1.1); }
        .corner-btn:active { transform: scale(0.93); }
        .top-left     { top: 0; left: 0;     background: radial-gradient(circle at 35% 35%, #f07030, #E8611A); }
        .top-right    { top: 0; right: 0;    background: radial-gradient(circle at 35% 35%, #dde8f5, #CBD8E8); color: #5a7a9a; }
        .bottom-left  { bottom: 0; left: 0;  background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }
        .bottom-right { bottom: 0; right: 0; background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }

        .cube-label {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            display: none;
            white-space: nowrap;
            z-index: 50;
        }
    </style>
<script src="public/js/palm-globe-fab.js" defer></script>
</head>
<body>

    <div id="page-title">P A L M &nbsp; R E A D E R S</div>

    <button class="corner-btn top-left">+</button>
    <button class="corner-btn top-right">+</button>
    <button class="corner-btn bottom-left">+</button>
    <button class="corner-btn bottom-right">+</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xFDF3DD);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        camera.position.z = 6;

        const cubeData = [
            { name: "Stories 1-2-3", color: 0x00ff88, x: -2.25, y: 1.2, link: "palm123.html",
              update: (m, t) => { m.position.y = 1.2 + Math.abs(Math.sin(t * 4)) * 0.5; } },
            { name: "Stories 4-5", color: 0xff4444, x: -0.75, y: 1.2, link: "palm45.html",
              update: (m, t) => { m.rotation.z = Math.sin(t * 20) * 0.1; m.scale.set(1.1, 1.1, 1.1); } },
            { name: "Stories 6-7", color: 0x8888ff, x: 0.75, y: 1.2, link: "palm67.html",
              update: (m, t) => { m.rotation.x = Math.sin(t * 0.5) * 0.2; m.scale.y = 1 + Math.sin(t * 0.5) * 0.1; } },
            { name: "Stories 8-9", color: 0xaaaaaa, x: 2.25, y: 1.2, link: "palm89.html",
              update: (m, t) => { m.rotation.y = t * 0.1; } },
            { name: "Stories 10-11", color: 0xffdd00, x: -2.25, y: -1.2, link: "palm1011.html",
              update: (m, t) => { m.rotation.y += 0.1; m.scale.set(1+Math.sin(t*10)*0.1, 1+Math.sin(t*10)*0.1, 1+Math.sin(t*10)*0.1); } },
            { name: "Stories 12-13", color: 0xffcccc, x: -0.75, y: -1.2, link: "palm1213.html",
              update: (m, t) => { m.position.x = m.userData.origX + Math.sin(t * 2) * 0.05; } },
            { name: "Stories 14-15", color: 0x44ccff, x: 0.75, y: -1.2, link: "palm1415.html",
              update: (m, t) => { m.rotation.x += 0.01; m.rotation.y += 0.01; } },
            { name: "Stories 16-17", color: 0xff8800, x: 2.25, y: -1.2, link: "palm1617.html",
              update: (m, t) => { m.rotation.x = Math.sin(t*5); m.rotation.y = Math.cos(t*7); } },
        ];

        const cubes = [];
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        cubeData.forEach((data, index) => {
            const material = new THREE.MeshStandardMaterial({ color: data.color });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(data.x, data.y, 0);
            cube.userData = {
                id: index, name: data.name, origColor: data.color,
                update: data.update, link: data.link,
                origX: data.x, origY: data.y,
                clickCount: 0, clickTimer: null
            };
            scene.add(cube);
            cubes.push(cube);

            const labelDiv = document.createElement('div');
            labelDiv.className = 'cube-label';
            labelDiv.id = `label-${index}`;
            labelDiv.innerText = data.name;
            document.body.appendChild(labelDiv);
            cube.userData.labelElement = labelDiv;
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);
            if (intersects.length > 0) {
                const clickedCube = intersects[0].object;
                const ud = clickedCube.userData;
                ud.clickCount++;
                if (ud.clickCount === 1) {
                    ud.labelElement.innerText = `Ouch! 💥 (${ud.name})`;
                    ud.labelElement.style.background = "red";
                    ud.labelElement.style.display = 'block';
                    clickedCube.material.color.set(0xffffff);
                    ud.clickTimer = setTimeout(() => {
                        ud.clickCount = 0;
                        ud.labelElement.innerText = ud.name;
                        ud.labelElement.style.background = "rgba(0,0,0,0.7)";
                        ud.labelElement.style.display = 'none';
                        clickedCube.material.color.set(ud.origColor);
                    }, 600);
                } else if (ud.clickCount === 2) {
                    clearTimeout(ud.clickTimer);
                    ud.clickCount = 0;
                    ud.labelElement.innerText = "Bye! 👋";
                    ud.labelElement.style.background = "blue";
                    setTimeout(() => { window.location.href = ud.link; }, 300);
                }
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            cubes.forEach(cube => { cube.userData.update(cube, elapsedTime); });

            cubes.forEach(cube => {
                const ud = cube.userData;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(cube);
                if (intersects.length > 0 || ud.clickCount > 0) {
                    const vector = new THREE.Vector3();
                    cube.getWorldPosition(vector);
                    vector.project(camera);
                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                    ud.labelElement.style.display = 'block';
                    ud.labelElement.style.left = `${x}px`;
                    ud.labelElement.style.top = `${y - 40}px`;
                } else if (ud.clickCount === 0) {
                    ud.labelElement.style.display = 'none';
                }
            });

            raycaster.setFromCamera(mouse, camera);
            const intersectsAny = raycaster.intersectObjects(cubes);
            document.body.style.cursor = intersectsAny.length > 0 ? 'pointer' : 'default';

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
