<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Night Drift: Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; user-select: none; }
        canvas { display: block; }

        /* UI LAYER */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD TOP */
        .hud-top {
            padding: 20px;
            margin-top: 34px;
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .info-box { color: #00ffff; }
        .drift-box { color: #ff0055; text-align: right; opacity: 0; transition: opacity 0.2s; }
        .drift-box.active { opacity: 1; }

        h1 { margin: 0; font-size: 18px; letter-spacing: 2px; opacity: 0.8; }
        .score { font-size: 32px; font-weight: 900; }

        /* CAMERA BUTTON */
        .cam-btn {
            position: absolute;
            top: 54px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 60px;
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            backdrop-filter: blur(5px);
            z-index: 20;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .cam-btn:active { background: white; color: black; }

        /* SPEEDOMETER */
        .speedometer {
            position: absolute;
            bottom: 150px;
            right: 30px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid #444;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transform: rotate(-45deg);
            z-index: 5;
        }
        .speed-val { font-size: 50px; color: #fff; line-height: 1; transform: rotate(45deg); text-shadow: 0 0 10px #fff; }
        .speed-unit { font-size: 12px; color: #aaa; transform: rotate(45deg); margin-top: -5px;}
        .gear-val { font-size: 24px; color: #ffaa00; font-weight: bold; transform: rotate(45deg); margin-top: 5px;}

        /* CONTROLS */
        .controls-area {
            pointer-events: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 40px;
            z-index: 10;
        }

        .d-pad, .pedals { display: flex; gap: 20px; }

        .btn {
            width: 80px; height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.1s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn:active, .btn.pressed {
            background: rgba(0, 255, 255, 0.4);
            border-color: #00ffff;
            transform: scale(0.95);
            box-shadow: 0 0 25px #00ffff;
        }
        .btn-brake:active, .btn-brake.pressed {
            background: rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
            box-shadow: 0 0 25px #ff0055;
        }

        /* SCREENS */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            pointer-events: auto;
        }
        .hidden { display: none !important; }

        .title { font-size: 50px; color: #00ffff; text-shadow: 0 0 30px #00ffff; margin-bottom: 10px; text-align: center; font-style: italic;}
        .sub-title { color: #ff0055; font-size: 18px; margin-bottom: 50px; letter-spacing: 5px; text-transform: uppercase;}

        .action-btn {
            padding: 20px 60px;
            font-size: 24px;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        .action-btn:hover { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }

        /* LEARN CONTENT (rule banner + fact/level-done use the same overlay-screen/title/action-btn language) */
        #rule-hud {
            position: absolute; top: 134px; left: 20px; z-index: 10;
            color: #00ffff; text-shadow: 0 0 10px rgba(0,0,0,0.8); max-width: 46vw; pointer-events: none;
        }
        #rule-hud h1 { margin: 0; font-size: 15px; letter-spacing: 1px; opacity: 0.8; }
        #rule-hud .rule-text { font-size: 17px; font-weight: 700; margin-top: 4px; line-height: 1.4; }
        #hub-btn { top: 54px; left: 90px; transform: none; width: 60px; text-decoration: none; }
        .fact-title { color: #ffaa00; text-shadow: 0 0 20px #ffaa00; font-style: normal; }
        .fact-body { max-width: 640px; font-size: 18px; line-height: 1.9; text-align: center; margin-bottom: 40px; padding: 0 20px; }
        .level-title { color: #7dff8a; text-shadow: 0 0 20px #7dff8a; font-style: normal; }

    </style>
<script src="public/js/palm-games-fab.js" defer></script>
</head>
<body>

    <div id="palmTopbar" dir="rtl" style="position:fixed;top:0;left:0;right:0;height:34px;z-index:999999;background:rgba(54,3,4,.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:Almarai,Tahoma,Arial,sans-serif;border-bottom:2px solid #4A3520;box-sizing:border-box;">
      <a href="games-skills.html" style="color:#F5EDD8;font-size:11px;text-decoration:none;padding:3px 10px;border:1px solid rgba(245,237,216,.4);border-radius:100px;white-space:nowrap;">← الموقع</a>
      <span style="color:#F5EDD8;font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🌴 تحت شجرة النخيل © ثريا الناعبية</span>
    </div>

    <!-- START SCREEN -->

    <!-- LEARN: FACT POPUP -->
    <div id="fact-screen" class="overlay-screen hidden">
        <div class="title fact-title">📚 هل تعلمين؟</div>
        <div class="sub-title" id="fact-title-v" style="color:#ffaa00;">—</div>

    <!-- LEARN: LEVEL COMPLETE -->
    <div id="level-done-screen" class="overlay-screen hidden">
        <div class="title level-title">🏁 LEVEL 3 COMPLETE</div>
        <div class="sub-title" style="color:#7dff8a;">اكتملت المستويات الثلاثة!</div>
        <div style="display:flex;gap:20px;">
            <a class="action-btn" href="racing-adventure.html" style="text-decoration:none;display:inline-flex;align-items:center;">MAP 🗺</a>
            <button class="action-btn" onclick="continueAfterLevel()">KEEP DRIVING ▶</button>
        </div>
    </div>

    <!-- UI -->
    <div id="ui-layer">
        <div class="cam-btn" onclick="toggleCamera()">CAM</div>
        <a class="cam-btn" id="hub-btn" href="racing-adventure.html">🗺</a>

        <div id="rule-hud">
            <h1>DRIVE TO THE CORRECT SIGN</h1>
            <div class="rule-text" id="rule-text-v">—</div>
        </div>

        <div class="hud-top">
            <div class="info-box">
                <h1>DISTANCE</h1>
                <div class="score" id="score">0 m</div>
            </div>
            <div class="drift-box" id="drift-ui">
                <h1>DRIFT BONUS</h1>
                <div class="score" id="drift-score">0</div>
            </div>
        </div>

        <div class="speedometer">
            <div class="speed-val" id="speed">0</div>
            <div class="speed-unit">KM/H</div>
            <div class="gear-val" id="gear">N</div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="pedals">
                <div class="btn btn-brake" id="btn-brake">S</div>
                <div class="btn" id="btn-gas">W</div>
            </div>
        </div>
    </div>

    <!-- Three.js & Post Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // --- AUDIO SYSTEM (Synthesizer) ---
        const AudioSys = {
            ctx: null,
            engineOsc: null,
            engineGain: null,
            driftNoise: null,
            driftGain: null,
            init: function() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Engine (Sawtooth wave for growl)
                this.engineOsc = this.ctx.createOscillator();
                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.value = 80;

                this.engineGain = this.ctx.createGain();
                this.engineGain.gain.value = 0;

                // Lowpass filter to muffle engine
                this.filter = this.ctx.createBiquadFilter();
                this.filter.type = 'lowpass';
                this.filter.frequency.value = 400;

                this.engineOsc.connect(this.filter);
                this.filter.connect(this.engineGain);
                this.engineGain.connect(this.ctx.destination);
                this.engineOsc.start();

                // Drift (White Noise)
                const bufferSize = 2 * this.ctx.sampleRate;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                this.driftNoise = this.ctx.createBufferSource();
                this.driftNoise.buffer = noiseBuffer;
                this.driftNoise.loop = true;

                this.driftGain = this.ctx.createGain();
                this.driftGain.gain.value = 0;

                const driftFilter = this.ctx.createBiquadFilter();
                driftFilter.type = 'highpass';
                driftFilter.frequency.value = 800;

                this.driftNoise.connect(driftFilter);
                driftFilter.connect(this.driftGain);
                this.driftGain.connect(this.ctx.destination);
                this.driftNoise.start();
            },
            update: function(speedRatio, isDrifting) {
                if(!this.ctx) return;
                // Engine RPM simulation
                const baseFreq = 80;
                const maxFreq = 600;
                const targetFreq = baseFreq + (maxFreq - baseFreq) * speedRatio;
                this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);

                // Volume
                const vol = 0.05 + (0.15 * speedRatio);
                this.engineGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);

                // Drift Sound
                const dVol = isDrifting && speedRatio > 0.3 ? 0.4 : 0;
                this.driftGain.gain.setTargetAtTime(dVol, this.ctx.currentTime, 0.1);
            }
        };

        // --- GAME CONSTANTS & VARS ---
        let scene, camera, renderer, composer;
        let carGroup;
        let roadMesh, grassMesh;
        let environment = { trees: [], buildings: [] };
        let traffic = [];
        let particles = [];

        let score = 0;
        let driftScore = 0;
        let isGameOver = false;
        let gameActive = false;
        let cameraMode = 0; // 0 = 3rd Person, 1 = 1st Person

        const phys = {
            speed: 0,
            maxSpeed: 2.8,
            acceleration: 0.03,
            braking: 0.06,
            friction: 0.97,
            turnSpeed: 0.045,
            driftSlip: 0
        };

        const input = { w: false, s: false, a: false, d: false };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // Post Processing (Bloom)
            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.5, 0.9);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 1.8;
            bloomPass.radius = 0.7;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Lights
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);

            const moon = new THREE.DirectionalLight(0xaaccff, 0.5);
            moon.position.set(100, 100, 50);
            moon.castShadow = true;
            moon.shadow.mapSize.width = 2048;
            moon.shadow.mapSize.height = 2048;
            moon.shadow.camera.near = 0.5;
            moon.shadow.camera.far = 500;
            moon.shadow.camera.left = -100;
            moon.shadow.camera.right = 100;
            moon.shadow.camera.top = 100;
            moon.shadow.camera.bottom = -100;
            scene.add(moon);

            // ── LEARN FIX: it's too dark — add a visible moon disc + starfield so the
            // night level is actually playable (requested content/logic fix, no design change)
            const skyRig = new THREE.Group();
            scene.add(skyRig);

            const moonDir = moon.position.clone().normalize();
            const moonDisc = new THREE.Mesh(
                new THREE.CircleGeometry(15, 28),
                new THREE.MeshBasicMaterial({ color: 0xeaf2ff, fog: false })
            );
            moonDisc.position.copy(moonDir).multiplyScalar(420);
            moonDisc.lookAt(0, moonDisc.position.y, 0);
            skyRig.add(moonDisc);

            const moonGlow = new THREE.Mesh(
                new THREE.CircleGeometry(36, 28),
                new THREE.MeshBasicMaterial({ color: 0x9fc0ff, transparent: true, opacity: 0.28, fog: false, depthWrite: false })
            );
            moonGlow.position.copy(moonDisc.position);
            moonGlow.lookAt(0, moonGlow.position.y, 0);
            skyRig.add(moonGlow);

            const STAR_COUNT = 1400;
            const starPos = new Float32Array(STAR_COUNT * 3);
            for (let i = 0; i < STAR_COUNT; i++) {
                const r = 380 + Math.random() * 90;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 0.88);
                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 25;
                starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            const starGeo = new THREE.BufferGeometry();
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.7, fog: false, transparent: true, opacity: 0.9, sizeAttenuation: false });
            const stars = new THREE.Points(starGeo, starMat);
            skyRig.add(stars);
            window.__skyRig = skyRig;

            createWorld();
            createCar();
            setupInputs();
            for (let i = 0; i < 3; i++) gates.push(buildGate());
            window.addEventListener('resize', onWindowResize, false);
        }

        function createWorld() {
            // Road
            const roadGeo = new THREE.PlaneGeometry(30, 2000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
            roadMesh = new THREE.Mesh(roadGeo, roadMat);
            roadMesh.rotation.x = -Math.PI / 2;
            roadMesh.receiveShadow = true;
            scene.add(roadMesh);

            // ── LEARN FIX: dashed lane-line markings — the road had zero markings,
            // making the 3 driving lanes invisible in the dark. Reuses this file's own
            // canvas-texture technique, layered on top; roadMat above is untouched.
            const laneLineCanvas = document.createElement('canvas');
            laneLineCanvas.width = 64; laneLineCanvas.height = 256;
            const llCtx = laneLineCanvas.getContext('2d');
            llCtx.clearRect(0, 0, 64, 256);
            llCtx.fillStyle = '#f5f1e2';
            // road spans x -15..15 (30 wide); lane dividers sit at x=-3 and x=+3
            llCtx.fillRect(23, 30, 4, 196);
            llCtx.fillRect(37, 30, 4, 196);
            // faint edge lines near x=-9 and x=+9 (outer lane edges)
            llCtx.fillStyle = 'rgba(245,241,226,0.55)';
            llCtx.fillRect(11, 0, 2, 256);
            llCtx.fillRect(51, 0, 2, 256);
            const laneLineTex = new THREE.CanvasTexture(laneLineCanvas);
            laneLineTex.wrapS = laneLineTex.wrapT = THREE.RepeatWrapping;
            laneLineTex.repeat.set(1, 130);
            const laneLines = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 2000),
                new THREE.MeshBasicMaterial({ map: laneLineTex, transparent: true })
            );
            laneLines.rotation.x = -Math.PI / 2;
            laneLines.position.y = 0.02;
            scene.add(laneLines);
            window.__laneLines = laneLines;

            // Grass/Ground
            const grassGeo = new THREE.PlaneGeometry(600, 2000);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x051005, roughness: 1 });
            grassMesh = new THREE.Mesh(grassGeo, grassMat);
            grassMesh.rotation.x = -Math.PI / 2;
            grassMesh.position.y = -0.1;
            grassMesh.receiveShadow = true;
            scene.add(grassMesh);

            // Initial Environment Generation
            for(let i=0; i<60; i++) {
                spawnEnvironmentObject(-i * 30);
            }
        }

        function spawnEnvironmentObject(zPos) {
            // Trees (Pine style)
            if (Math.random() > 0.2) {
                const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 5, 6);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2817 });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 2.5;
                trunk.castShadow = true;

                const leavesGeo = new THREE.ConeGeometry(4, 10, 8);
                const leavesMat = new THREE.MeshStandardMaterial({ color: 0x1a4d1a });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 7;
                leaves.castShadow = true;

                const tree = new THREE.Group();
                tree.add(trunk);
                tree.add(leaves);

                const side = Math.random() > 0.5 ? 1 : -1;
                tree.position.set(side * (25 + Math.random() * 40), 0, zPos);
                scene.add(tree);
                environment.trees.push(tree);
            }

            // Buildings (Houses)
            if (Math.random() > 0.5) {
                const h = 15 + Math.random() * 25;
                const w = 15 + Math.random() * 15;
                const geo = new THREE.BoxGeometry(w, h, w);
                const mat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const building = new THREE.Mesh(geo, mat);
                building.position.y = h/2;
                building.castShadow = true;
                building.receiveShadow = true;

                // Windows (Emissive)
                const winGeo = new THREE.PlaneGeometry(w-2, h-4);
                const winMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
                const windows = new THREE.Mesh(winGeo, winMat);
                windows.position.z = w/2 + 0.1;
                building.add(windows);

                const side = Math.random() > 0.5 ? 1 : -1;
                building.position.set(side * (50 + Math.random() * 30), 0, zPos);
                scene.add(building);
                environment.buildings.push(building);
            }
        }

        function createCar() {
            carGroup = new THREE.Group();

            // Materials
            const paint = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.1, metalness: 0.6 }); // Red Sport Car
            const glass = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.0, metalness: 0.9 });
            const plastic = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

            // 1. Main Body
            const bodyGeo = new THREE.BoxGeometry(1.9, 0.7, 4.7);
            const body = new THREE.Mesh(bodyGeo, paint);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            // 2. Cabin
            const cabinGeo = new THREE.BoxGeometry(1.7, 0.55, 2.5);
            const cabin = new THREE.Mesh(cabinGeo, glass);
            cabin.position.set(0, 1.15, -0.3);
            carGroup.add(cabin);

            // 3. Spoiler
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.15, 0.6), paint);
            spoiler.position.set(0, 1.25, 2.25);
            carGroup.add(spoiler);

            const sLegL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.15), plastic);
            sLegL.position.set(0.75, 1.05, 2.25);
            const sLegR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.15), plastic);
            sLegR.position.set(-0.75, 1.05, 2.25);
            carGroup.add(sLegL, sLegR);

            // 4. Headlights
            const eyeGeo = new THREE.BoxGeometry(0.65, 0.3, 0.15);
            const eyeL = new THREE.Mesh(eyeGeo, lightMat);
            eyeL.position.set(-0.65, 0.65, -2.35);
            const eyeR = new THREE.Mesh(eyeGeo, lightMat);
            eyeR.position.set(0.65, 0.65, -2.35);
            carGroup.add(eyeL, eyeR);

            // Headlight Beams (Spotlights)
            const spotL = new THREE.SpotLight(0xffffee, 3, 80, 0.6, 0.5, 1);
            spotL.position.set(-0.65, 0.65, -2.2);
            spotL.target.position.set(-0.65, 0, -20);
            carGroup.add(spotL);
            carGroup.add(spotL.target);

            const spotR = new THREE.SpotLight(0xffffee, 3, 80, 0.6, 0.5, 1);
            spotR.position.set(0.65, 0.65, -2.2);
            spotR.target.position.set(0.65, 0, -20);
            carGroup.add(spotR);
            carGroup.add(spotR.target);

            // 5. Taillights
            const tail = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.25, 0.15), tailMat);
            tail.position.set(0, 0.65, 2.35);
            carGroup.add(tail);

            // Brake Lights Glow
            const brakeLight = new THREE.PointLight(0xff0000, 0, 15);
            brakeLight.position.set(0, 0.7, 2.6);
            carGroup.add(brakeLight);
            carGroup.userData.brakeLight = brakeLight;

            // 6. Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.37, 0.37, 0.45, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.2 });

            const wheels = [];
            const wPos = [{x:-0.95, z:-1.7}, {x:0.95, z:-1.7}, {x:-0.95, z:1.7}, {x:0.95, z:1.7}];

            wPos.forEach((p, i) => {
                const wGroup = new THREE.Group();
                const tire = new THREE.Mesh(wheelGeo, wheelMat);
                tire.rotation.z = Math.PI/2;
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.46, 10), rimMat);
                rim.rotation.z = Math.PI/2;
                wGroup.add(tire, rim);
                wGroup.position.set(p.x, 0.37, p.z);
                wGroup.castShadow = true;
                carGroup.add(wGroup);
                wheels.push(wGroup);
            });
            carGroup.userData.wheels = wheels;

            scene.add(carGroup);
        }

        function spawnTraffic(zOffset) {
            const lanes = [-1, 0, 1];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const laneWidth = 6;

            const color = Math.random() > 0.5 ? 0x0000ff : 0x333333;
            const geo = new THREE.BoxGeometry(2, 1.2, 4.5);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 0.8;
            mesh.castShadow = true;

            const hLight = new THREE.PointLight(0xffffaa, 1, 20);
            hLight.position.set(0, 0.5, -2.3);
            mesh.add(hLight);

            const group = new THREE.Group();
            group.add(mesh);
            group.position.set(lane * laneWidth, 0, carGroup.position.z + zOffset);
            group.userData = { speed: 0.5 + Math.random() * 0.5 };

            scene.add(group);
            traffic.push(group);
        }

        function setupInputs() {
            const bind = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('pressed'); };
                const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('pressed'); };
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
                el.addEventListener('touchstart', start);
                el.addEventListener('touchend', end);
            };
            bind('btn-gas', 'w');
            bind('btn-brake', 's');
            bind('btn-left', 'a');
            bind('btn-right', 'd');

            document.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if(k==='w'||k==='arrowup') input.w = true;
                if(k==='s'||k==='arrowdown') input.s = true;
                if(k==='a'||k==='arrowleft') input.a = true;
                if(k==='d'||k==='arrowright') input.d = true;
                if(k==='c') toggleCamera();
            });
            document.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if(k==='w'||k==='arrowup') input.w = false;
                if(k==='s'||k==='arrowdown') input.s = false;
                if(k==='a'||k==='arrowleft') input.a = false;
                if(k==='d'||k==='arrowright') input.d = false;
            });
        }

        window.toggleCamera = function() {
            cameraMode = cameraMode === 0 ? 1 : 0;
        }

        function updatePhysics() {
            if (!gameActive || isGameOver || learnFrozen) return;

            // Speed
            if (input.w) phys.speed += phys.acceleration;
            else if (input.s) phys.speed -= phys.braking;
            else phys.speed *= phys.friction;
            phys.speed = Math.max(0, Math.min(phys.speed, phys.maxSpeed));

            // Steering
            let targetAngle = 0;
            if (phys.speed > 0.1) {
                if (input.a) targetAngle = phys.turnSpeed;
                if (input.d) targetAngle = -phys.turnSpeed;
            }
            carGroup.rotation.y += targetAngle;

            // Body Roll
            carGroup.rotation.z = THREE.MathUtils.lerp(carGroup.rotation.z, -targetAngle * 3, 0.1);

            // Movement Vector
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);

            // Drift Logic
            let moveVec = forward.clone().multiplyScalar(phys.speed);
            const isDrifting = Math.abs(targetAngle) > 0 && phys.speed > 0.9;

            if (isDrifting) {
                moveVec.add(right.clone().multiplyScalar(phys.speed * 0.5)); // Slide
                driftScore += Math.floor(phys.speed * 20);
                document.getElementById('drift-ui').classList.add('active');
                document.getElementById('drift-score').innerText = driftScore;
                createSmoke();
                AudioSys.update(phys.speed / phys.maxSpeed, true);
            } else {
                document.getElementById('drift-ui').classList.remove('active');
                AudioSys.update(phys.speed / phys.maxSpeed, false);
            }

            carGroup.position.add(moveVec);

            // Camera Logic
            if (cameraMode === 0) {
                // 3rd Person (Chase Cam)
                const offset = new THREE.Vector3(0, 6, -12);
                offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
                offset.add(carGroup.position);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);
            } else {
                // 1st Person (Cockpit)
                const offset = new THREE.Vector3(0, 1.2, -0.5);
                offset.applyMatrix4(carGroup.matrixWorld);
                camera.position.copy(offset);

                const lookAtPos = new THREE.Vector3(0, 1.2, 20);
                lookAtPos.applyMatrix4(carGroup.matrixWorld);
                camera.lookAt(lookAtPos);
            }

            // Infinite World Logic
            roadMesh.position.z = carGroup.position.z;
            grassMesh.position.z = carGroup.position.z;
            if (window.__laneLines) window.__laneLines.position.z = carGroup.position.z;
            if (window.__skyRig) window.__skyRig.position.set(carGroup.position.x, 0, carGroup.position.z);

            // Manage Environment Objects (Recycle)
            [...environment.trees, ...environment.buildings].forEach(obj => {
                if (obj.position.z < carGroup.position.z - 60) {
                    obj.position.z += 1800; // Move far ahead
                    obj.position.x += (Math.random() - 0.5) * 20;
                }
            });

            // UI Update
            const kmh = Math.floor(phys.speed * 100);
            document.getElementById('speed').innerText = kmh;
            document.getElementById('score').innerText = Math.floor(carGroup.position.z / 10) + " m";

            // Gear
            let g = 'N';
            if(kmh>10) g='1'; if(kmh>50) g='2'; if(kmh>90) g='3'; if(kmh>140) g='4'; if(kmh>190) g='5';
            document.getElementById('gear').innerText = g;

            // Brake Lights
            carGroup.userData.brakeLight.intensity = input.s ? 3 : 0;

            // Wheels Animation
            carGroup.userData.wheels.forEach((w, i) => {
                w.rotation.x -= phys.speed * 2;
                if (i < 2) w.rotation.y = targetAngle * 10; // Front steer
            });
        }

        function updateTraffic() {
            if (Math.random() < 0.02) spawnTraffic(200);

            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                t.position.z -= t.userData.speed;

                const dist = carGroup.position.distanceTo(t.position);
                if (dist < 5.0) gameOver();

                if (t.position.z < carGroup.position.z - 30) {
                    scene.remove(t);
                    traffic.splice(i, 1);
                }
            }
        }

        function createSmoke() {
            if (Math.random() > 0.3) return;
            const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const mat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);

            const offset = new THREE.Vector3((Math.random()-0.5)*1.6, 0.2, 1.8);
            offset.applyMatrix4(carGroup.matrixWorld);
            mesh.position.copy(offset);

            scene.add(mesh);
            particles.push({ mesh: mesh, life: 1.0 });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= 0.03;
                p.mesh.position.y += 0.05;
                p.mesh.scale.multiplyScalar(1.05);
                p.mesh.material.opacity = p.life * 0.6;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            gameActive = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(carGroup.position.z/10) + learnScoreBonus + " (Drift: " + driftScore + ")";
            AudioSys.update(0, false);
        }

        window.startGame = function() {
            document.getElementById('start-screen').classList.add('hidden');
            AudioSys.init();
            gameActive = true;
        };

        window.resetGame = function() {
            isGameOver = false;
            gameActive = true;
            score = 0; driftScore = 0;
            phys.speed = 0;
            carGroup.position.set(0, 0, 0);
            carGroup.rotation.set(0, 0, 0);

            traffic.forEach(t => scene.remove(t));
            traffic = [];
            resetLearn();

            document.getElementById('game-over').classList.add('hidden');
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        /* ============================================================
           محتوى تعليمي: حروف الجر عن طريق لافتات ثابتة في 3 حارات
           (x = -6, 0, 6 — نفس حارات حركة المرور). نفس المحتوى المتفق
           عليه، ومبني على مشهد رحلة عمّ ناصر الحقيقي بالشاحنة إلى سوق
           سمائل. التصميم الأصلي للعبة ما تغيّر إطلاقًا.
           ============================================================ */
        const PREP_ROUNDS = [
            { sentence: 'Uncle Nasser drove the truck ___ the bumpy road to Samail.', correct: 'along', decoys: ['under', 'behind'] },
            { sentence: 'They passed ___ the ancient palm groves.', correct: 'through', decoys: ['behind', 'above'] },
            { sentence: 'The flock of goats moved ___ the edge of the road.', correct: 'to', decoys: ['under', 'behind'] },
            { sentence: "The truck's wheels raised a cloud of dust ___ them.", correct: 'beneath', decoys: ['above', 'beside'] },
            { sentence: 'Uncle Nasser raised his hand ___ the man on the donkey.', correct: 'at', decoys: ['under', 'behind'] },
            { sentence: 'Safiya sat ___ Ahmed in the back of the truck.', correct: 'beside', decoys: ['under', 'through'] },
            { sentence: 'The red mountains stood ___ them as they drove closer.', correct: 'in front of', decoys: ['behind', 'beneath'] },
            { sentence: 'Umm Salim was walking ___ the road, a bundle balanced on her head.', correct: 'along', decoys: ['above', 'behind'] },
            { sentence: 'The truck finally arrived ___ Samail market.', correct: 'at', decoys: ['under', 'through'] },
            { sentence: 'The children climbed down ___ the truck.', correct: 'from', decoys: ['at', 'beside'] },
        ];
        const ROUTE_FACTS = [
            { title: 'علم عُمان', text: 'رفعت السفياء والمعلمين علم عُمان أمام المدرسة — والعلم فعلاً حديث نسبيًا: أعلنه السلطان قابوس في 17 ديسمبر 1970. الأبيض للسلام، والأخضر للأرض الخصبة والجبل الأخضر، والأحمر للمعارك اللي دافع فيها العُمانيون عن بلدهم.' },
            { title: 'سوق مطرح التاريخي', text: 'سوق مطرح اللي تاه فيه منصور مو سوق عادي — أجزاء منه عمرها أكثر من ألف سنة، وكان مركز تجارة التوابل واللبان بين الهند وأفريقيا والجزيرة العربية. يسمونه محليًا "السوق المظلم" لأن أزقته الضيقة المسقوفة ما يدخلها ضوء النهار.' },
            { title: 'عُمان وزنجبار', text: 'اللي التاجر الزنجباري قابل جون وصوفيا فيه في ميناء مطرح مو خيال — عُمان فعلاً حكمت زنجبار لعقود. سنة 1832 نقل السلطان سعيد بن سلطان عاصمته من مسقط إلى زنجبار، وازدهرت تجارة التوابل والعاج بين الساحلين لين انقسمت السلطنتان بعد وفاته سنة 1856.' },
            { title: 'شجرة الغاف', text: 'تجتمع الفصول تحت شجرة الغاف القديمة، "كأنها فصل بلا جدران". هذه الشجرة تعيش في عُمان والخليج من آلاف السنين، تتحمل الجفاف الشديد وتبقى خضراء رغم الحر — بعضها يعيش أكثر من 120 سنة، وتوفر الظل والغذاء للناس والحيوانات.' },
            { title: 'قلعة جبرين', text: 'قلعة جبرين اللي زارها الأطفال حقيقية، موجودة في ولاية بهلاء، بُنيت سنة 1675م بأمر الإمام بلعرب بن سلطان اليعربي. ما كانت بس مقر حكم — كانت مركز تعليم للفلك والطب والفقه، ومشهورة بسقوفها المزخرفة ونظام تبريدها بالفلج.' },
            { title: 'نهضة عُمان الحديثة', text: 'كلام جون "يفتحون مدارس، يبنون طرق، شي جديد يبدأ" وصف حقيقي لعُمان السبعينات. لما تولى السلطان قابوس، كان في البلد بس 3 مدارس لـ900 طالب، و9 مراكز صحية، و6 أميال بس طرق مرصوفة. خلال سنوات قليلة وصلت المدارس والمستشفيات والطرق لكل ركن من عُمان — فيما عُرف بـ"النهضة المباركة".' },
        ];
        const LEARN_LANES = [-6, 0, 6];
        const LEVEL_GOAL_Z = 15000; // matches the displayed distance (z/10) reaching 1500m
        let learnScoreBonus = 0, learnPrepIndex = 0, learnUsedRecent = [], learnRoundsCleared = 0,
            learnLastFactAt = 0, learnRound = null, learnGateCooldown = 5, learnLevelDone = false, learnFrozen = false;
        const gates = [];
        function gateCanvasTex(word) {
            const c = document.createElement('canvas'); c.width = 220; c.height = 90;
            const g = c.getContext('2d');
            g.fillStyle = 'rgba(0,20,30,0.9)'; g.fillRect(4, 4, 212, 82);
            g.strokeStyle = '#00ffff'; g.lineWidth = 4; g.strokeRect(4, 4, 212, 82);
            g.font = '700 32px Orbitron, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = '#fff'; g.fillText(word, 110, 47);
            return new THREE.CanvasTexture(c);
        }
        function buildGate() {
            const g = new THREE.Group();
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 2.4, 8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            post.position.y = 1.2; g.add(post);
            const boardMat = new THREE.MeshBasicMaterial({ map: gateCanvasTex('-'), transparent: true, fog: false });
            const board = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.05), boardMat);
            board.position.y = 2.5; g.add(board);
            g.visible = false; scene.add(g);
            return { g, mat: boardMat, active: false, word: '', isCorrect: false, lane: 0, z: 0 };
        }
        function nextPrepRound() {
            let p;
            do { p = PREP_ROUNDS[learnPrepIndex % PREP_ROUNDS.length]; learnPrepIndex++; }
            while (PREP_ROUNDS.length > 3 && learnUsedRecent.includes(p.sentence));
            learnUsedRecent.push(p.sentence); if (learnUsedRecent.length > 3) learnUsedRecent.shift();
            document.getElementById('rule-text-v').textContent = p.sentence.replace('___', '▁▁▁');
            const opts = [{ word: p.correct, ok: true }, { word: p.decoys[0], ok: false }, { word: p.decoys[1], ok: false }]
                .sort(() => Math.random() - 0.5);
            const gateZ = carGroup.position.z + 160; // ahead (this car's forward vector is +Z)
            opts.forEach((o, i) => {
                const gt = gates[i];
                gt.active = true; gt.g.visible = true; gt.word = o.word; gt.isCorrect = o.ok; gt.lane = i; gt.z = gateZ;
                gt.mat.map = gateCanvasTex(o.word); gt.mat.needsUpdate = true;
                gt.g.position.set(LEARN_LANES[i], 0, gateZ);
            });
            learnRound = { resolved: false, timer: 30 };
        }
        function resolveGates() {
            if (!learnRound || learnRound.resolved) return;
            learnRound.resolved = true;
            let best = 0, bestD = Infinity;
            for (let i = 0; i < LEARN_LANES.length; i++) { const d = Math.abs(LEARN_LANES[i] - carGroup.position.x); if (d < bestD) { bestD = d; best = i; } }
            const hit = gates.find(g => g.lane === best);
            if (hit && hit.isCorrect) { learnScoreBonus += 150; learnRoundsCleared++; }
            setTimeout(() => {
                gates.forEach(g => { g.active = false; g.g.visible = false; });
                if (isGameOver || !gameActive) return;
                if (learnRoundsCleared > 0 && learnRoundsCleared % 3 === 0 && learnRoundsCleared !== learnLastFactAt) {
                    learnLastFactAt = learnRoundsCleared; showFact();
                } else learnGateCooldown = 4 + Math.random() * 2;
            }, 700);
        }
        function showFact() {
            const f = ROUTE_FACTS[Math.floor(Math.random() * ROUTE_FACTS.length)];
            document.getElementById('fact-title-v').textContent = f.title;
            document.getElementById('fact-text-v').textContent = f.text;
            document.getElementById('fact-screen').classList.remove('hidden');
            learnFrozen = true;
        }
        window.hideFact = function() {
            document.getElementById('fact-screen').classList.add('hidden');
            learnFrozen = false; learnGateCooldown = 2.5;
        };
        function checkLevelDone() {
            if (learnLevelDone || isGameOver || !gameActive || carGroup.position.z < LEVEL_GOAL_Z) return;
            learnLevelDone = true; learnFrozen = true;
            const sc = Math.floor(carGroup.position.z / 10) + learnScoreBonus;
            const best = Math.max(sc, Number(localStorage.getItem('palm_racing_lvl3_best') || 0));
            localStorage.setItem('palm_racing_lvl3_best', String(best));
            const unlocked = Math.max(3, Number(localStorage.getItem('palm_racing_unlocked') || 1));
            localStorage.setItem('palm_racing_unlocked', String(unlocked));
            document.getElementById('level-done-screen').classList.remove('hidden');
        }
        window.continueAfterLevel = function() {
            document.getElementById('level-done-screen').classList.add('hidden');
            learnFrozen = false;
        };
        function resetLearn() {
            learnScoreBonus = 0; learnPrepIndex = 0; learnUsedRecent = []; learnRoundsCleared = 0;
            learnLastFactAt = 0; learnRound = null; learnGateCooldown = 5; learnLevelDone = false; learnFrozen = false;
            gates.forEach(g => { g.active = false; g.g.visible = false; });
            document.getElementById('fact-screen').classList.add('hidden');
            document.getElementById('level-done-screen').classList.add('hidden');
        }
        function updateLearn(dtSeconds) {
            if (!gameActive || isGameOver || learnFrozen) return;
            if (learnGateCooldown > 0) { learnGateCooldown -= dtSeconds; if (learnGateCooldown <= 0) nextPrepRound(); return; }
            if (learnRound && !learnRound.resolved) {
                learnRound.timer -= dtSeconds;
                const anyGate = gates.find(g => g.active);
                if ((anyGate && carGroup.position.z >= anyGate.z - 2) || learnRound.timer <= 0) resolveGates();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            updateTraffic();
            updateParticles();
            updateLearn(1 / 60);
            checkLevelDone();
            composer.render();
        }

        init();
        animate();

    </script>
</body>
