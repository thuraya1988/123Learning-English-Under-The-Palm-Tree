<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>مسار التقدم - دعم | Progress Path Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC;--paper:#FFFFFF;--ink:#243138;--ink-soft:#5B6B72;
  --primary:#2E7D6B;--primary-dark:#1F5B4E;--primary-soft:#DCEEE7;
  --accent:#E8A23D;--accent-soft:#FBEAD0;--success:#3E8E5B;--success-soft:#DCEEDD;
  --error:#B85C42;--error-soft:#F5E1DA;--radius:18px;--radius-sm:12px;--shadow:0 10px 28px rgba(36,49,56,.09);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Lexend',sans-serif;display:inline-block;}
h1,h2,h3,.heading{font-family:'Baloo 2','Tajawal',sans-serif;}
#app{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.topbar .unit-label{font-size:13px;color:var(--ink-soft);font-weight:500;}
.progress-dots{display:flex;gap:8px;}
.dot{width:11px;height:11px;border-radius:50%;background:#DDD8C8;transition:background .3s, transform .3s;}
.dot.done{background:var(--success);}
.dot.active{background:var(--primary);transform:scale(1.3);}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;margin-bottom:16px;}
.title{font-size:22px;font-weight:700;margin:0 0 4px;}
.title .en{font-size:16px;color:var(--ink-soft);font-weight:600;display:block;margin-top:2px;}
.subtitle{font-size:15px;color:var(--ink-soft);margin:0 0 18px;line-height:1.7;}
.instruction{background:var(--primary-soft);border-radius:var(--radius-sm);padding:13px 16px;font-size:15px;margin-bottom:20px;line-height:1.7;}
.instruction .en{font-size:13.5px;color:var(--primary-dark);display:block;margin-top:5px;}
label{display:block;font-size:14px;margin:16px 0 6px;font-weight:500;}
input[type=text]{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:2px solid #E3DFD1;font-size:16px;font-family:'Tajawal',sans-serif;background:#FCFBF7;color:var(--ink);}
input[type=text]:focus{outline:3px solid var(--primary-soft);border-color:var(--primary);}
button{font-family:inherit;cursor:pointer;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;padding:15px 26px;border-radius:999px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(46,125,107,.25);transition:transform .15s, background .2s, opacity .2s;width:100%;margin-top:6px;}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none;}
.hero-row{display:flex;justify-content:center;gap:10px;margin-bottom:10px;font-size:34px;}
.path-track{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.path-step{width:36px;height:36px;border-radius:50%;background:var(--bg);border:2px solid #E3DFD1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);}
.path-step.done{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.path-step.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.path-line{flex:1;height:3px;background:#E3DFD1;}

.mcq-progress{font-size:13px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
.mcq-sentence{font-size:17px;line-height:1.9;margin-bottom:18px;text-align:center;}
.mcq-sentence .blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--primary);margin:0 4px;font-weight:700;color:var(--primary);}
.mcq-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.mcq-opt{padding:12px 20px;border-radius:999px;border:2px solid #E3DFD1;background:#fff;font-size:15.5px;font-weight:600;color:var(--ink);}
.mcq-opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.mcq-opt.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);}
.mcq-opt:disabled{cursor:default;}
.mcq-feedback{text-align:center;margin-top:14px;font-size:14px;min-height:20px;}
.mcq-feedback.ok{color:var(--success);font-weight:600;}
.mcq-feedback.no{color:var(--error);font-weight:600;}

.result-header{text-align:center;margin-bottom:6px;}
.result-score{font-size:54px;font-weight:800;color:var(--primary);text-align:center;margin:4px 0;}
.result-msg{text-align:center;font-size:16px;line-height:1.8;margin-bottom:22px;}
.result-name{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:2px;}
.result-breakdown{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg);border-radius:var(--radius-sm);font-size:14px;}
.result-row .en{font-size:13px;color:var(--ink-soft);}

.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important; transition-duration:.001s !important;}}
@media (max-width:380px){.result-score{font-size:42px;}.card{padding:20px 15px;}.mcq-opt{padding:10px 16px;font-size:14.5px;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   مسار التقدم - مستوى الدعم | Progress Path - Support
   Cumulative review: Welcome Unit + Units 1-4
   Team Together 5A - Oman MOE
   ============================================================ */
const JOTFORM_FORM_ID = "262434452585057";
const REPORT_UNIT = "Progress Path - Support";
function sendReport(name, cls, percent) {
  try {
    const studentName = (typeof scormGetStudentName === "function" && scormGetStudentName()) || name || "بدون اسم";
    const studentId = typeof supportGetStudentId === "function" ? supportGetStudentId(studentName, cls) : "";
    const attempt = typeof scormNextAttempt === "function" ? scormNextAttempt(REPORT_UNIT) : 1;
    const duration = typeof scormGetElapsedSeconds === "function" ? scormGetElapsedSeconds() : 0;
    const details = { version: 2, studentId, studentName, cls, level: "support", unit: REPORT_UNIT, percent, raw: totalScore(), max: totalMax(), attempt, duration, scores: state.scores, skillMax: state.max, completedAt: new Date().toISOString() };
    if (typeof scormSetDetailedProgress === "function") scormSetDetailedProgress(details);
    const fd = new FormData();
    fd.append("formID", JOTFORM_FORM_ID);
    fd.append("submitSource", "support-scorm");
    fd.append("q2_q2_textbox0", studentName);
    fd.append("q3_q3_textbox1", cls || "غير محدد");
    fd.append("q4_q4_textbox2", REPORT_UNIT);
    fd.append("q5_q5_textbox3", percent + "%");
    fd.append("q7_input", studentId);
    fd.append("q8_input", "support");
    fd.append("q9_input", String(attempt));
    fd.append("q10_input", String(duration));
    fd.append("q11_input", JSON.stringify(details));
    fd.append("q12_input", "مكتمل");
    fetch("https://submit.jotform.com/submit/" + JOTFORM_FORM_ID, { method: "POST", mode: "no-cors", keepalive: true, body: fd }).catch(function () {});
  } catch (e) {}
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

/* ---------- cumulative review content, one 4-item MCQ set per unit already covered ---------- */
const SECTIONS = [
  {
    key: "a1", labelAr: "الوحدة التمهيدية", labelEn: "Welcome Unit", stepLabel: "W",
    items: [
      { pre: "Layla's hair has a lot of curls, not straight lines. Her hair is ", post: ".", options: ["curly", "straight", "short"], answer: "curly" },
      { pre: "", post: " I get home, I do my homework.", options: ["Before", "When", "After"], answer: "When" },
      { pre: "He's very ", post: ". He always smiles and talks to everyone.", options: ["friendly", "rude", "shy"], answer: "friendly" },
      { pre: "Saying \u2018please\u2019 and \u2018thank you\u2019 is an example of ", post: ".", options: ["good manners", "big numbers", "a relative clause"], answer: "good manners" }
    ]
  },
  {
    key: "a2", labelAr: "الوحدة الأولى", labelEn: "Unit 1", stepLabel: "1",
    items: [
      { pre: "The opposite of \u2018lazy\u2019 is ", post: ".", options: ["hard-working", "mean", "rude"], answer: "hard-working" },
      { pre: "My sister is 160 cm and I am 150 cm, so she is ", post: " than me.", options: ["tall", "taller", "tallest"], answer: "taller" },
      { pre: "I am good at ", post: " a cake.", options: ["bake", "baking", "baked"], answer: "baking" },
      { pre: "Someone who always says please and thank you is ", post: ".", options: ["polite", "rude", "lazy"], answer: "polite" }
    ]
  },
  {
    key: "a3", labelAr: "الوحدة الثانية", labelEn: "Unit 2", stepLabel: "2",
    items: [
      { pre: "A ", post: " is a small computer you can carry easily.", options: ["tablet", "keyboard", "mouse"], answer: "tablet" },
      { pre: "Yesterday, I ", post: " my homework.", options: ["finish", "finished", "finishing"], answer: "finished" },
      { pre: "When I was three, I ", post: " swim.", options: ["can", "could", "will"], answer: "could" },
      { pre: "We use a ", post: " to type on a computer.", options: ["keyboard", "mouse", "screen"], answer: "keyboard" }
    ]
  },
  {
    key: "a4", labelAr: "الوحدة الثالثة", labelEn: "Unit 3", stepLabel: "3",
    items: [
      { pre: "We travel to space in a ", post: ".", options: ["rocket", "telescope", "satellite"], answer: "rocket" },
      { pre: "10,000 in words is \u2018", post: "\u2019.", options: ["a thousand", "ten thousand", "a hundred thousand"], answer: "ten thousand" },
      { pre: "It's my friend's birthday tomorrow, so I ", post: " buy her a present.", options: ["will", "won't", "can't"], answer: "will" },
      { pre: "\u2018", post: " deep is the swimming pool?\u2019", options: ["How", "What", "Where"], answer: "How" }
    ]
  },
  {
    key: "a5", labelAr: "الوحدة الرابعة", labelEn: "Unit 4", stepLabel: "4",
    items: [
      { pre: "You can buy medicine at the ", post: ".", options: ["pharmacy", "toy shop", "shoe shop"], answer: "pharmacy" },
      { pre: "That's the girl ", post: " helped me.", options: ["who", "which", "where"], answer: "who" },
      { pre: "We have a lot of milk at home, so I ", post: " buy milk today.", options: ["have to", "don't have to", "has to"], answer: "don't have to" },
      { pre: "It's fifteen ", post: ".", options: ["rials", "dollars", "dirhams"], answer: "rials" }
    ]
  }
];

/* ---------- state ---------- */
const state = {
  screen: "start", name: "", cls: "",
  scores: { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 },
  max: { a1: 4, a2: 4, a3: 4, a4: 4, a5: 4 }
};
function totalScore() { return state.scores.a1 + state.scores.a2 + state.scores.a3 + state.scores.a4 + state.scores.a5; }
function totalMax() { return state.max.a1 + state.max.a2 + state.max.a3 + state.max.a4 + state.max.a5; }
function goTo(screen) { state.screen = screen; render(); window.scrollTo(0, 0); }

function renderPathTrack(app, activeIndex) {
  const bar = el("div", "topbar");
  const label = el("div", "unit-label"); label.innerHTML = 'مسار التقدم <span class="en">Progress Path</span>';
  bar.appendChild(label); app.appendChild(bar);
  const track = el("div", "path-track");
  SECTIONS.forEach(function (s, i) {
    if (i > 0) track.appendChild(el("div", "path-line"));
    const step = el("div", "path-step"); step.textContent = s.stepLabel;
    if (i + 1 < activeIndex) step.classList.add("done");
    if (i + 1 === activeIndex) step.classList.add("active");
    track.appendChild(step);
  });
  app.appendChild(track);
}
function nextButton(app, label, enabledGetter, onClick) {
  const btn = el("button", "btn"); btn.type = "button"; btn.innerHTML = label; btn.disabled = !enabledGetter();
  btn.addEventListener("click", onClick); app.appendChild(btn); return btn;
}

/* ================= START ================= */
function renderStartScreen(app) {
  const card = el("div", "card");
  const heroRow = el("div", "hero-row"); heroRow.textContent = "🏆 🌟 📘 🎯";
  card.appendChild(heroRow);
  const title = el("div", "title heading"); title.innerHTML = 'مسار التقدم <span class="en">Progress Path</span>'; card.appendChild(title);
  const sub = el("div", "subtitle");
  sub.innerHTML = '<span class="en">Team Together 5A</span> - مستوى الدعم<br>' +
    "هذي مراجعة شاملة لكل شي درسناه: الوحدة التمهيدية والوحدات ١ إلى ٤ - سؤالين أربعة من كل وحدة. جاهزة تثبتين شطارتك؟";
  card.appendChild(sub);
  const nameLabel = el("label", "", "اسمك"); nameLabel.setAttribute("for", "nameInput"); card.appendChild(nameLabel);
  const nameInput = document.createElement("input"); nameInput.type = "text"; nameInput.id = "nameInput"; nameInput.placeholder = "اكتبي اسمك هنا"; nameInput.value = state.name;
  card.appendChild(nameInput);
  const clsLabel = el("label", "", "صفك"); clsLabel.setAttribute("for", "clsInput"); card.appendChild(clsLabel);
  const clsInput = document.createElement("input"); clsInput.type = "text"; clsInput.id = "clsInput"; clsInput.placeholder = "مثال: 5/2"; clsInput.value = state.cls;
  card.appendChild(clsInput);
  app.appendChild(card);
  const startBtn = el("button", "btn"); startBtn.type = "button"; startBtn.innerHTML = 'ابدئي <span class="en">Start</span> 🚀';
  startBtn.addEventListener("click", function () { state.name = nameInput.value.trim(); state.cls = clsInput.value.trim(); goTo("a1"); });
  app.appendChild(startBtn);
  if (typeof scormGetStudentName === "function") { const nm = scormGetStudentName(); if (nm && !state.name) { state.name = nm; nameInput.value = nm; } }
}

/* ---------- shared cumulative-review MCQ renderer ---------- */
function renderReviewSection(app, sectionIndex) {
  const section = SECTIONS[sectionIndex];
  renderPathTrack(app, sectionIndex + 1);
  const card = el("div", "card");
  const title = el("div", "title heading"); title.innerHTML = 'مراجعة: ' + section.labelAr + ' <span class="en">' + section.labelEn + ' Review</span>'; card.appendChild(title);
  const instr = el("div", "instruction"); instr.innerHTML = "اختاري الإجابة الصحيحة." + '<span class="en">Choose the correct answer.</span>'; card.appendChild(instr);
  let qIndex = 0; const qWrap = el("div", ""); card.appendChild(qWrap); app.appendChild(card);
  const isLast = sectionIndex === SECTIONS.length - 1;
  const nextBtn = nextButton(app, isLast ? 'شوفي نتيجتك <span class="en">See results</span> 🎉' : 'التالي <span class="en">Next</span> ←', function () { return false; }, function () {
    qIndex++;
    if (qIndex >= section.items.length) {
      if (sectionIndex + 1 >= SECTIONS.length) finishAndGoResults();
      else goTo("a" + (sectionIndex + 2));
    } else renderQuestion();
  });
  nextBtn.classList.add("hidden");
  function renderQuestion() {
    qWrap.innerHTML = ""; nextBtn.classList.add("hidden"); nextBtn.disabled = true;
    const progress = el("div", "mcq-progress"); progress.innerHTML = '<span class="en">' + (qIndex + 1) + " / " + section.items.length + "</span>"; qWrap.appendChild(progress);
    const item = section.items[qIndex];
    const sentence = el("div", "mcq-sentence en"); sentence.innerHTML = escapeHtml(item.pre) + '<span class="blank">____</span>' + escapeHtml(item.post); qWrap.appendChild(sentence);
    const opts = el("div", "mcq-options"); let answered = false;
    shuffle(item.options).forEach(function (opt) {
      const b = document.createElement("button"); b.type = "button"; b.className = "mcq-opt en"; b.textContent = opt;
      b.addEventListener("click", function () {
        if (answered) return; answered = true;
        const correct = opt === item.answer;
        if (correct) { b.classList.add("correct"); state.scores[section.key]++; feedback.textContent = "صحيح! أحسنتِ 🌿"; feedback.className = "mcq-feedback ok"; }
        else {
          b.classList.add("wrong");
          Array.prototype.forEach.call(opts.children, function (c) { if (c.textContent === item.answer) c.classList.add("correct"); });
          feedback.textContent = "قريبة! الصح: "; feedback.className = "mcq-feedback no";
          const fs = document.createElement("span"); fs.className = "en"; fs.style.fontWeight = "700"; fs.textContent = item.answer; feedback.appendChild(fs);
        }
        Array.prototype.forEach.call(opts.children, function (c) { c.disabled = true; });
        nextBtn.classList.remove("hidden"); nextBtn.disabled = false;
      });
      opts.appendChild(b);
    });
    qWrap.appendChild(opts);
    const feedback = el("div", "mcq-feedback"); qWrap.appendChild(feedback);
  }
  renderQuestion();
}

/* ================= FINISH / RESULTS ================= */
function finishAndGoResults() {
  const total = totalScore(); const max = totalMax(); const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  if (typeof scormSetScore === "function") scormSetScore(total, max);
  if (typeof scormSetComplete === "function") scormSetComplete();
  sendReport(state.name, state.cls, percent);
  goTo("results");
}
function renderResultsScreen(app) {
  const card = el("div", "card");
  const header = el("div", "result-header heading"); header.innerHTML = '<span style="font-size:20px;font-weight:700;">أكملتِ مسار التقدم! <span class="en">Path Complete</span> 🏆</span>'; card.appendChild(header);
  if (state.name) { const nm = el("div", "result-name"); nm.textContent = state.name + (state.cls ? " - " + state.cls : ""); card.appendChild(nm); }
  const total = totalScore(), max = totalMax(); const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  const score = el("div", "result-score"); score.innerHTML = '<span class="en">' + percent + "%</span>"; card.appendChild(score);
  const msg = el("div", "result-msg");
  if (percent >= 85) msg.textContent = "رائعة! راجعتِ الفصل كله بشطارة - افتخري بنفسك 🌟";
  else if (percent >= 60) msg.textContent = "أحسنتِ! غطّيتِ كل الوحدات بتقدّم حلو 👏";
  else msg.textContent = "خلصتِ مسار التقدم كامل - وهذا أهم إنجاز! راجعي الوحدات اللي احتجتِ فيها تمرين أكثر 💚";
  card.appendChild(msg);
  const breakdown = el("div", "result-breakdown");
  SECTIONS.forEach(function (s) {
    const row = el("div", "result-row");
    const left = document.createElement("span"); left.innerHTML = s.labelAr + ' <span class="en">' + s.labelEn + "</span>";
    const right = document.createElement("span"); right.className = "en"; right.textContent = state.scores[s.key] + " / " + state.max[s.key];
    row.appendChild(left); row.appendChild(right); breakdown.appendChild(row);
  });
  card.appendChild(breakdown); app.appendChild(card);
  const retryBtn = el("button", "btn btn-ghost"); retryBtn.type = "button"; retryBtn.innerHTML = 'أعيدي المحاولة <span class="en">Try again</span>';
  retryBtn.addEventListener("click", function () { state.scores = { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 }; goTo("a1"); });
  app.appendChild(retryBtn);
}

function render() {
  const app = document.getElementById("app"); app.innerHTML = "";
  if (state.screen === "start") renderStartScreen(app);
  else if (state.screen === "a1") renderReviewSection(app, 0);
  else if (state.screen === "a2") renderReviewSection(app, 1);
  else if (state.screen === "a3") renderReviewSection(app, 2);
  else if (state.screen === "a4") renderReviewSection(app, 3);
  else if (state.screen === "a5") renderReviewSection(app, 4);
  else if (state.screen === "results") renderResultsScreen(app);
}
render();
</script>
</body>
</html>
