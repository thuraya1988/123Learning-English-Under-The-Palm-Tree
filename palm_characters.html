<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meet The Palm Characters</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body{
      font-family:'Cormorant Garamond', serif;
      background:url('cover.jpeg') center center / cover no-repeat fixed;
      min-height:100vh;
      color:#fff;
    }

    .scene{
      min-height:100vh;
      padding:28px 20px 36px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      background:rgba(0,0,0,0.12);
    }

    .panel{
      width:min(1320px, 96vw);
      background:rgba(255,255,255,0.08);
      border-radius:36px;
      padding:28px 24px 30px;
      backdrop-filter: blur(4px);
      box-shadow:0 12px 40px rgba(0,0,0,0.12);
      text-align:center;
    }

    .sub-label{
      font-family:'Cinzel', serif;
      font-size:clamp(0.6rem, 1.4vw, 0.75rem);
      letter-spacing:0.3em;
      color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,0.5);
      text-transform:uppercase;
      margin-bottom:10px;
    }

    .divider{
      width:56px;
      height:1px;
      background:#fff;
      margin:12px auto 16px;
      opacity:.7;
    }

    .title{
      font-family:'Cinzel', serif;
      font-size:clamp(1.55rem, 4vw, 2.4rem);
      font-weight:600;
      color:#fff;
      text-shadow:0 2px 14px rgba(0,0,0,0.6);
      line-height:1.3;
      margin-bottom:8px;
    }

    .tagline{
      font-size:clamp(0.9rem, 1.8vw, 1rem);
      color:rgba(255,255,255,0.92);
      text-shadow:0 1px 6px rgba(0,0,0,0.4);
      font-style:italic;
      line-height:1.6;
      margin-bottom:28px;
    }

    .characters-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:26px;
    }

    .character-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .char-frame{
      position:relative;
      width:220px;
      height:250px;
      cursor:pointer;
      transition:transform .2s ease, opacity .2s ease;
    }

    .char-frame:hover{
      transform:translateY(-4px) scale(1.02);
      opacity:.96;
    }

    .frame-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      z-index:1;
      pointer-events:none;
    }

    .char-photo{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      width:150px;
      height:150px;
      object-fit:contain;
      z-index:2;
      border-radius:12px;
    }

    .char-name{
      margin-top:12px;
      font-family:'Cinzel', serif;
      font-size:1rem;
      color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,0.5);
      text-align:center;
      min-height:24px;
    }

    .open-trigger{
      margin-top:10px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
      color:#fff;
      text-shadow:0 1px 6px rgba(0,0,0,0.5);
      font-family:'Cinzel', serif;
      font-size:.84rem;
      transition:opacity .2s;
    }

    .open-trigger:hover{ opacity:.75; }
    .open-trigger .palm{ font-size:1.35rem; }

    .back-link{
      display:inline-block;
      margin-top:28px;
      text-decoration:none;
      color:#000;
      background:rgba(255,255,255,0.9);
      padding:10px 22px;
      border-radius:999px;
      font-family:'Cinzel', serif;
      font-size:.85rem;
    }

    .popup{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.72);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }

    .popup.show{
      display:flex;
    }

    .popup-card{
      width:min(980px, 96vw);
      max-height:90vh;
      overflow:auto;
      background:#1a1208;
      color:#f5efe0;
      border-radius:30px;
      padding:24px 22px 26px;
      box-shadow:0 18px 50px rgba(0,0,0,0.35);
      position:relative;
    }

    .close-btn{
      position:absolute;
      top:14px;
      right:14px;
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:#f5c97a;
      color:#1a1208;
      font-size:22px;
      cursor:pointer;
      font-family:'Cinzel', serif;
    }

    .popup-head{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      align-items:center;
      margin-bottom:16px;
      padding-right:50px;
    }

    .popup-photo{
      width:150px;
      height:150px;
      object-fit:contain;
      border-radius:18px;
      background:rgba(255,255,255,0.05);
      padding:8px;
    }

    .popup-head-text h2{
      font-family:'Cinzel', serif;
      font-size:1.5rem;
      color:#f5c97a;
      margin-bottom:6px;
    }

    .popup-head-text p{
      color:rgba(255,255,255,0.65);
      font-style:italic;
      font-size:.95rem;
    }

    .lang-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:8px;
    }

    .lang-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(245,201,122,0.18);
      border-radius:20px;
      padding:16px 16px 14px;
    }

    .lang-title{
      font-family:'Cinzel', serif;
      font-size:.82rem;
      letter-spacing:.14em;
      color:#f5c97a;
      margin-bottom:10px;
    }

    .desc-en{
      font-size:0.92rem;
      line-height:1.75;
      color:#f0e8d5;
      white-space:pre-line;
      direction:ltr;
      text-align:left;
    }

    .desc-ar{
      font-size:0.96rem;
      line-height:1.8;
      color:#f0e8d5;
      white-space:pre-line;
      direction:rtl;
      text-align:right;
    }

    .tag{
      display:inline-block;
      background:rgba(245,201,122,0.15);
      border:1px solid rgba(245,201,122,0.3);
      border-radius:6px;
      padding:1px 7px;
      font-size:0.72rem;
      color:#f5c97a;
      font-family:'Cinzel', serif;
      letter-spacing:0.08em;
      margin-bottom:5px;
    }

    @media (max-width: 780px){
      .lang-grid{
        grid-template-columns:1fr;
      }
      .popup-head{
        flex-direction:column;
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="panel">
      <p class="sub-label">Meet The Cast</p>
      <div class="divider"></div>
      <h1 class="title">Meet The Palm Characters</h1>
      <p class="tagline">Click the palm 🌴 under each card to discover the character behind the story.</p>

      <div class="characters-grid" id="charactersGrid"></div>

      <a class="back-link" href="index.html">← Back to Home</a>
    </div>
  </div>

  <div class="popup" id="popup">
    <div class="popup-card">
      <button class="close-btn" onclick="closePopup()">×</button>
      <div class="popup-head">
        <img id="popupPhoto" class="popup-photo" src="" alt="">
        <div class="popup-head-text">
          <h2 id="popupName"></h2>
          <p id="popupRole"></p>
        </div>
      </div>

      <div class="lang-grid">
        <div class="lang-card">
          <div class="lang-title">ENGLISH</div>
          <div class="desc-en" id="popupEn"></div>
        </div>
        <div class="lang-card">
          <div class="lang-title">العربية</div>
          <div class="desc-ar" id="popupAr"></div>
        </div>
      </div>
    </div>
  </div>

  <audio autoplay loop>
    <source src="joyfull.mp3" type="audio/mpeg">
  </audio>

  <script>
    const characters = [
      {
        name: "Thuraya",
        role: "The Leader of Al-Qurawashiyah",
        image: "thuraya cartoon.jpeg",
        en: `<span class="tag">EN</span>

The author. The English teacher. The one who let John and Sophia in — without prior warning.

<span class="tag">SUPER POWER</span>
One look… and the entire class goes silent 👀
“إذا رأيت أنياب الليث بارزة
فلا تحسبن أن الليث يبتسم”

<span class="tag">WEAKNESS</span>
The wall crocodile 🐊
The only creature that makes Thuraya step back.

<span class="tag">SECRET</span>
Stretches from 1973… all the way to 2027.
It will be revealed. Eventually.

<span class="tag">DREAM</span>
Finish her Master’s in Turkey 🇹🇷
And hint at the Ministry. Diplomatically. As always.

<span class="tag">FUNNY FACT</span>
Even Shayb Khalaf lowers his voice when Thuraya is around. 😶`,
        ar: `<span class="tag">ع</span>

قائدة القرواشية التي لا يوقفها شيء.
مؤلفة القصة، معلمة اللغة الإنجليزية، واللي خلّت جون وصوفيا يدخلون العالم… بدون إنذار مسبق.

<span class="tag">القوة الخارقة</span>
نظرة واحدة… والصف كله يسكت 👀

<span class="tag">نقطة الضعف</span>
تمساح الجدار 🐊
الشيء الوحيد اللي يخليها تتراجع خطوة للخلف.

<span class="tag">السر</span>
سرها ممتد من 1973… إلى 2027.
وراح ينكشف في السلسلة الأخيرة.

<span class="tag">الحلم</span>
تكمل الماجستير في تركيا 🇹🇷
وتلمّح للوزارة بطريقة دبلوماسية منذ سنوات.

<span class="tag">معلومة مضحكة</span>
حتى الشايب خلف يتكلم بهدوء لما ثريا موجودة. 😶`
      },
      {
        name: "John",
        role: "The Ones Who Came to Teach… and Got Taught",
        image: "jhon cartoon.png",
        en: `<span class="tag">JOHN</span>

Came to teach English. Found surprise, heat, and a goat waiting for him.
Speaks Arabic without permission.
Gets scared. Denies it immediately.
Sometimes he’s sweet. Sometimes he’s absolutely useless 😄

<span class="tag">FUNNY FACT</span>
John says: “I am not afraid.”
Then quietly stands behind Sophia. 😄

<span class="tag">WEAKNESS — JOHN</span>
Shayb Khalaf. The heat. Malood. 🐐`,
        ar: `<span class="tag">جون</span>

جاء يعلّم الإنجليزية… فاكتشف أن الصدمة بانتظاره.
يتكلم عربي بدون إذن، يخاف، وينكر فوراً.
أحياناً حلو. وأحياناً بايخ جداً 😄

<span class="tag">معلومة مضحكة</span>
جون يقول: “أنا ما أخاف.”
ثم يختبئ خلف صوفيا. 😄`
      },
      {
        name: "Sophia",
        role: "The Ones Who Came to Teach… and Got Taught",
        image: "sofia cartoon.png",
        en: `<span class="tag">SOPHIA</span>

Arrived as Sophia. Became Safiya.
Nobody argued with her about it.
Organises total chaos with quiet grace.
Her silence is more dangerous than Mansoor’s screaming.`,
        ar: `<span class="tag">صوفيا</span>

جاءت Sophia وصارت Safiya.
ما ناقشها أحد.
تنظم الفوضى بهدوء.
وصمتها أخطر من صراخ منصور.`
      },
      {
        name: "Malood",
        role: "The Unofficial School Manager",
        image: "malood cartoon.png",
        en: `<span class="tag">MALOOD</span>

Enters class. Watches everyone. Eats the papers like inspection reports.
Nobody knows where he lives or who raised him.
Appears exactly when the lesson is important. 👁️

<span class="tag">FAVOURITE FOOD</span>
Papers. Especially Sophia’s notes. 📄

<span class="tag">SECRET</span>
Permanent customer at Sadoo’s shop.
Owes money since before the 1970s. Still hasn’t paid.`,
        ar: `<span class="tag">مالود</span>

يدخل الصف، يراقب الكل، ويأكل الأوراق وكأنه يراجع التقارير.
محد يعرف وين يعيش أو من حيّاه.
يظهر بالضبط لما تكون الحصة مهمة. 👁️

<span class="tag">أكلته المفضلة</span>
الأوراق. وخاصة ملاحظات صوفيا. 📄

<span class="tag">السر</span>
زبون دائم عند سادو.
وعليه ديون… من قبل وجايحة السبعين. ولسا ما دفع.`
      },
      {
        name: "Khalaf",
        role: "The Man Who Knows What Others Don't",
        image: "kalaf cartoon.png",
        en: `<span class="tag">SHAYB KHALAF</span>

Quiet. Mysterious. Looks at you like he already knows what you’ll say.
Specialist in herbs, healing, and things science hasn’t named yet.
Gives you the feeling he has knowledge from another world entirely.

<span class="tag">FAMOUS FOR</span>
فتّاك. الحروز من الشر محروز.`,
        ar: `<span class="tag">الشيب خلف</span>

هادئ، غامض، ينظر إليك وكأنه يعرف ما ستقوله قبل لا تفتح فمك.
متخصص في الأعشاب والطب والأشياء اللي العلم ما سمّاها بعد.
يعطيك إحساس إنه يعرف علوم العالم الآخر. 🌿

<span class="tag">مشهور بـ</span>
فتّاك. الحروز من الشر محروز.`
      },
      {
        name: "Obaid",
        role: "The Man Who Knows What Others Don't",
        image: "obaid cartoon.jpeg",
        en: `<span class="tag">OBAID</span>

Returned from Bahrain. Brought knowledge nobody expected.
Calm, respectful, wise.
When Obaid starts talking — even the noisy ones remember they have ears.`,
        ar: `<span class="tag">عبيد</span>

راجع من البحرين وجاب علوم ما توقعها أحد.
هادئ، حكيم، محترم.
لما يبدأ يتكلم، حتى المزعجين يتذكرون إن عندهم آذان.`
      },
      {
        name: "Saeed",
        role: "The Watcher",
        image: "saeed-ali.png",
        en: `<span class="tag">SAEED</span>

Watches more than he speaks.
Shy, quiet, processes everything in silence.
Then suddenly — one brilliant answer that shocks the entire class.
Nobody saw it coming. Including Saeed himself.`,
        ar: `<span class="tag">سعيد</span>

يراقب أكثر مما يتكلم.
هادئ، خجول، يعالج كل شي بصمت.
ثم فجأة… إجابة ذكية تصدم الصف كامل.
محد توقعها. ولا هو نفسه.`
      },
      {
        name: "Ali",
        role: "The Artist",
        image: "ali cartoon.jpg",
        en: `<span class="tag">ALI</span>

The quiet artist.
Sees things others don’t notice.
Notices the dust on the board before the chalk does. 🎨
Slightly in his own world. Totally fine with that.

<span class="tag">FUNNY FACT</span>
Ali once drew a portrait of Malood during maths.
It was honestly very accurate. 🐐🎨`,
        ar: `<span class="tag">علي</span>

الفنان الهادئ.
يشوف تفاصيل ما يشوفها غيره.
يلاحظ غبار السبورة قبل الطبشورة. 🎨
شوية في خياله. وراضٍ تماماً عن ذلك.

<span class="tag">معلومة مضحكة</span>
علي رسم بورتريه لمالود في حصة الرياضيات.
وكانت دقيقة جداً بصراحة. 🐐🎨`
      },
      {
        name: "Marhoon",
        role: "The Farmer",
        image: "khamis-marhoon.png",
        en: `<span class="tag">MARHOON</span>

Born farming. Lives farming. Will probably be buried farming.
Knows the soil, the palms, the water, and the weather better than he knows people.
That man in the overalls? That’s Marhoon. Always.

<span class="tag">LIFE PHILOSOPHY</span>
“A man’s purpose is to work the land.”
No debates. No exceptions. Final answer. 🌾`,
        ar: `<span class="tag">مرهون</span>

ولد يزرع. يعيش يزرع. ومحتمل يُدفن وهو يزرع.
يعرف التربة والنخيل والماء والطقس أكثر مما يعرف الناس.
اللي لابس الوزرة؟ ذاك مرهون. دايماً. 🌾

<span class="tag">فلسفة الحياة</span>
“دور الإنسان إنه يعمّر الأرض.”
ما في نقاش. ما في استثناء. جواب نهائي.`
      },
      {
        name: "Khamees",
        role: "His Son Who Has Other Plans",
        image: "khamees cartoon.jpeg",
        en: `<span class="tag">KHAMIS — his son</span>

Genius. Silent. Understands before you finish the question.
Watches everyone. Hates noise.
The only person Mansoor is afraid might be smarter than him. 👀`,
        ar: `<span class="tag">خميس — ابنه</span>

عبقري. صامت. يفهم قبل لا تنتهي السؤال.
يراقب الجميع. يكره الضوضاء.
الشخص الوحيد اللي منصور يخاف إنه أذكى منه. 👀`
      },
      {
        name: "Khalil",
        role: "The Laughing Machine",
        image: "khalil cartoon.png",
        en: `<span class="tag">KHALIL</span>

The official laughter machine of the village.
Laughs at good jokes, bad jokes, and jokes that haven’t started yet.
If nobody laughs — Khalil handles the entire village shift. 😄
Never does homework. Escapes always. Laughs at wrong moments.
Has never once been serious. Not even once.`,
        ar: `<span class="tag">خليل</span>

آلة الضحك الرسمية للقرية.
يضحك على النكتة الحلوة، البايخة، والنكتة اللي ما بدأت بعد. 😄
ما يحل الواجب. يهرب دائماً. يضحك في اللحظات الخطأ.
ما كان جاد في حياته ولا لحظة واحدة.`
      },
      {
        name: "Mansoor",
        role: "The Human Storm",
        image: "mansoor cartoon.png",
        en: `<span class="tag">MANSOOR</span>

Human storm. Runs without reason. Talks without stopping.
Laughs before the joke ends. He and Khalil? Naturally.
Starts the lesson active. Ends it more active.
If he screams too much — he freezes. Turns into a statue. Temporarily. 🌪️

<span class="tag">FUNNY FACT</span>
They once got so loud… Thuraya’s look silenced the entire district. Not just the class.`,
        ar: `<span class="tag">منصور</span>

إعصار بشري. يركض بدون سبب. ما يوقف كلامه.
يضحك قبل النكتة تنتهي. هو وخليل طبعاً. 🌪️
يبدأ الحصة نشيط وينهيها أكثر نشاطاً.
إذا زعق كثير… يتحول لتمثال. مؤقتاً.

<span class="tag">معلومة مضحكة</span>
مرة صخبوا لدرجة إن نظرة ثريا سكّتت الحي كامل. مو بس الصف.`
      },
      {
        name: "Fatakat",
        role: "The Egyptian Energy",
        image: "fatakat cartoon.jpeg",
        en: `<span class="tag">FATAKAT</span>

Movement. Speed. Egyptian energy that arrived and never left.
Her voice woke up the entire village.
The rooster heard her on day one and immediately retired. 📣
Warm and kind — but her voice makes students freeze on the spot.

<span class="tag">FUNNY FACT</span>
Her voice arrives to the classroom before she does.`,
        ar: `<span class="tag">فتكات</span>

الحركة والسرعة والطاقة المصرية اللي وصلت وما رجعت. 📣
صوتها أيقظ القرية كاملة.
الديك سمعها اليوم الأول وقرر التقاعد فوراً.
طيبة وحنونة… لكن صوتها يخلي الطلاب يهدعون مكانهم.

<span class="tag">معلومة مضحكة</span>
صوتها يوصل الصف قبلها.`
      },
      {
        name: "Mohammdain",
        role: "Mathematics With a Face",
        image: "mohammaddain cartoon.png",
        en: `<span class="tag">MOHAMADIN</span>

Mathematics. With a face.
One glance from across the yard is enough to organise the classroom.
Students learn from fear. Information enters their heads whether they want it or not.

<span class="tag">FUNNY FACT</span>
He arrives to the classroom and the noise had already left. 😄`,
        ar: `<span class="tag">محمدين</span>

الرياضيات على هيئة إنسان.
نظرة واحدة من بعيد تكفي لترتيب الصف.
الطلاب يتعلمون من الخوف. المعلومة تدخل رأسهم غصباً عنهم.

<span class="tag">معلومة مضحكة</span>
وهو يوصل والضوضاء راحت من قبله. 😄`
      },
      {
        name: "Mustafa",
        role: "Small Roles. Unforgettable Presence.",
        image: "mustafa cartoon.png",
        en: `<span class="tag">MUSTAFA + MINNAH</span>

They belong to the lighter side of the village world.
Quiet presence. Small details. Side moments that stay in memory.

Not every character needs a loud entrance.
Some just walk in softly… and somehow you never forget them.

<span class="tag">FUNNY FACT</span>
Nobody can explain exactly why they’re so memorable.
They just are. 🌸`,
        ar: `<span class="tag">مصطفى ومنة</span>

من الشخصيات اللي تضيف خفة لعالم القرية.

    function renderCharacters(){
      const grid = document.getElementById('charactersGrid');
      grid.innerHTML = characters.map((char, index) => `
        <div class="character-wrap">
          <div class="char-frame" onclick="openPopup(${index})">
            <img class="frame-img" src="polaroid.png" alt="">
            <img class="char-photo" src="${char.image}" alt="${char.name}">
          </div>
          <div class="char-name">${char.name}</div>
          <div class="open-trigger" onclick="openPopup(${index})">
            <span class="palm">🌴</span><span>Click Here</span>
          </div>
        </div>
      `).join('');
    }

    function openPopup(index){
      const char = characters[index];
      document.getElementById('popupPhoto').src = char.image;
      document.getElementById('popupPhoto').alt = char.name;
      document.getElementById('popupName').textContent = char.name;
      document.getElementById('popupRole').textContent = char.role;
      document.getElementById('popupEn').innerHTML = char.en;
      document.getElementById('popupAr').innerHTML = char.ar;
      document.getElementById('popup').classList.add('show');
    }

    function closePopup(){
      document.getElementById('popup').classList.remove('show');
    }

    document.getElementById('popup').addEventListener('click', function(e){
      if(e.target.id === 'popup'){
        closePopup();
      }
    });

    renderCharacters();
  </script>
