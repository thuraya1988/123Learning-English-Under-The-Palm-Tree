<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mystery Weekly Planner | Storybook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.0.12/arabic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.0.12/arabic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5.0.12/arabic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.6/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.6/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.6/latin-900-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lora@5.0.13/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lora@5.0.13/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lora@5.0.13/latin-400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5.0.13/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5.0.13/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5.0.13/latin-800-normal.css">
<style>
:root{
  --cream:#FFF8EC; --paper:#FFFDF8; --ink:#2B2A33; --ink2:#5B5866;
  --edge:#2B2A33;
  --rose:#FF6B78; --rose-d:#D93A4A;
  --amber:#FFC845; --amber-d:#C97F00;
  --slate:#3FA9F5; --slate-d:#1C6FB0;
  --green:#3ECF8E; --green-d:#1E8F5C;
  --plum:#B37AFF; --line:#F2DFB8; --shadow:0 18px 40px -18px rgba(60,40,20,.35);
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal','Nunito',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 90% -10%, #FFEFC9 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #DFF4EC 0%, transparent 55%),
    var(--cream);
  color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
}
.en{font-family:'Nunito',sans-serif;direction:ltr;text-align:left}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#F0CE8E;border-radius:10px;border:2px solid var(--cream)}
::-webkit-scrollbar-track{background:transparent}

/* ============ HEADER ============ */
header.top{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(120deg,var(--slate) 0%,var(--green) 55%,var(--plum) 100%);
  color:#fff;padding:14px 20px 0;box-shadow:0 6px 24px -12px rgba(0,0,0,.5);
}
.topRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:26px;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.4);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.brand h1{font-family:'Baloo 2',system-ui,sans-serif;font-size:21px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11.5px;opacity:.9;font-family:'Nunito';direction:ltr}
.topTools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;transition:.2s;display:flex;gap:6px;align-items:center}
.tbtn:hover{background:rgba(255,255,255,.32);transform:translateY(-2px)}
.tbtn.on{background:#fff;color:var(--slate-d)}
.units{display:flex;gap:6px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.upill{flex:0 0 auto;padding:9px 16px 11px;border-radius:14px 14px 0 0;font-size:13px;font-weight:800;font-family:'Baloo 2',system-ui,sans-serif;
  color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);transition:.22s;display:flex;flex-direction:column;gap:1px;align-items:center;min-width:132px}
.upill small{font-size:10px;font-weight:400;opacity:.8;font-family:'Nunito';direction:ltr}
.upill:hover{background:rgba(255,255,255,.24);color:#fff}
.upill.act{background:var(--cream);color:var(--ink);box-shadow:0 -4px 14px -6px rgba(0,0,0,.3)}
.upill.act small{opacity:.65}

/* ============ LAYOUT ============ */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:22px;max-width:1500px;margin:0 auto;padding:22px 20px 60px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;padding:16px 12px 50px}}

/* ============ SIDEBAR ============ */
aside{position:sticky;top:118px;align-self:start;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--paper);border:3px solid var(--edge);border-radius:var(--r);padding:16px;box-shadow:0 6px 0 var(--edge), var(--shadow)}
@media(max-width:1000px){aside{position:static;max-height:none}}
.sideHead{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:2px dashed var(--line);margin-bottom:12px}
.sideHead .uNum{width:38px;height:38px;border-radius:11px;background:var(--slate);color:#fff;display:grid;place-items:center;font-weight:900;font-family:'Baloo 2',sans-serif;font-size:16px;flex:0 0 auto;box-shadow:0 3px 0 var(--slate-d)}
.sideHead h3{font-size:14px;line-height:1.35;font-family:'Baloo 2',system-ui,sans-serif;font-weight:700}
.sideHead h3 span{display:block;font-size:10.5px;color:var(--ink2);font-family:'Nunito';direction:ltr;font-weight:700}
.secLbl{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.6px;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.secLbl::after{content:"";flex:1;height:1px;background:var(--line)}
.pgl{width:100%;text-align:start;display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:11px;font-size:12.8px;transition:.18s;color:var(--ink2)}
.pgl:hover{background:#FFF3D6;color:var(--ink)}
.pgl.act{background:linear-gradient(90deg,var(--amber),#FFDD7A);color:#3B2A10;font-weight:800}
.pgl i{width:22px;height:22px;border-radius:7px;background:#FCEFD2;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-family:'Nunito';font-weight:700;flex:0 0 auto}
.pgl.act i{background:rgba(255,255,255,.6)}
.tabs4{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.tab4{padding:10px 8px;border-radius:12px;background:#FCF3DE;font-size:12.2px;font-weight:800;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink2);transition:.15s;text-align:center;border:2px solid transparent}
.tab4:hover{background:#FCE8BE;transform:translateY(-2px)}
.tab4.act{background:var(--slate);color:#fff;box-shadow:0 3px 0 var(--slate-d);transform:translateY(-1px)}
.prog{margin-top:14px;background:#F6E9C8;border-radius:99px;height:10px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber));width:0;transition:.5s;border-radius:99px}
.progTxt{font-size:11px;color:var(--ink2);margin-top:6px;text-align:center}

/* ============ BOOK ============ */
main{min-width:0}
.book{background:var(--paper);border:3px solid var(--edge);border-radius:24px;box-shadow:0 8px 0 var(--edge), var(--shadow);overflow:hidden;position:relative}
.book::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(180,150,90,.028) 0 2px,transparent 2px 5px);z-index:1}
.bookTop{display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(90deg,#FFF3DA,#FFFAEF);border-bottom:2px solid var(--line);flex-wrap:wrap;position:relative;z-index:2}
.chipTag{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;background:#fff;border:2px solid var(--line);color:var(--ink2)}
.chipTag.acc{background:var(--rose);color:#fff;border-color:transparent}
.bookTop .spacer{margin-inline-start:auto;display:flex;gap:6px}
.ibtn{width:37px;height:37px;border-radius:11px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;transition:.18s;color:var(--ink2)}
.ibtn:hover{background:var(--amber);color:#fff;border-color:var(--amber-d);transform:translateY(-2px);box-shadow:0 3px 0 var(--amber-d)}
.ibtn.on{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 3px 0 var(--green-d)}

.spread{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;position:relative;z-index:2}
@media(max-width:860px){.spread{grid-template-columns:1fr}}
.illSide{background:#FDF2DC;padding:22px;display:flex;align-items:center;justify-content:center;border-inline-end:2px dashed var(--line);min-height:280px}
@media(max-width:860px){.illSide{border-inline-end:none;border-bottom:2px dashed var(--line)}}
.illFrame{width:100%;max-width:520px;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px -14px rgba(70,45,15,.55);background:#fff;border:6px solid #fff}
.illFrame svg{display:block;width:100%;height:auto}
.txtSide{padding:30px 34px 26px;max-width:760px}
@media(max-width:600px){.txtSide{padding:22px 18px}}
.txtSide h2{font-family:'Lora',serif;font-size:clamp(21px,3.2vw,30px);color:var(--rose-d);margin-bottom:4px;direction:ltr;text-align:left;line-height:1.25}
.txtSide .h2ar{font-size:13px;color:var(--ink2);margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid #FBE9C4}
.para{font-family:'Lora',serif;font-size:var(--fs,17.5px);line-height:1.85;color:#332E2A;direction:ltr;text-align:left;margin-bottom:14px}
.para:first-of-type::first-letter{font-size:2.9em;float:left;line-height:.86;padding:4px 9px 0 0;color:var(--rose-d);font-weight:700}
.para.noDrop::first-letter{font-size:inherit;float:none;padding:0;color:inherit;font-weight:inherit}
.para .sp{transition:background .25s;border-radius:4px;padding:0 1px}
.para .sp.rd{background:#FFE9A8;box-shadow:0 0 0 3px #FFE9A8}
.dlg{font-family:'Lora',serif;font-size:var(--fs,17.5px);direction:ltr;text-align:left;color:var(--slate-d);
  border-inline-start:4px solid var(--amber);padding:6px 0 6px 16px;margin:0 0 14px 0;line-height:1.75;font-style:italic}
.keybox{direction:ltr;text-align:left;background:linear-gradient(135deg,#FFF6E2,#FDEEDA);border:2px dashed var(--amber);
  border-radius:14px;padding:14px 16px;margin:14px 0;font-family:'Nunito';font-size:14.5px}
.keybox b{color:var(--rose-d)}
.keybox .row{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted #E8D8B4}
.keybox .row:last-child{border:none}
.keybox .sym{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;border:2px solid var(--line);flex:0 0 auto;color:var(--rose-d)}
.grambox{direction:ltr;text-align:left;background:#EAF7F0;border:2px solid #BFE6D2;border-radius:14px;padding:14px 16px;margin:14px 0}
.grambox h4{font-family:'Baloo 2',system-ui,sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--green-d);margin-bottom:8px}
.grambox ul{list-style:none;font-family:'Lora',serif;font-size:15px}
.grambox li{padding:4px 0 4px 20px;position:relative}
.grambox li::before{content:"✦";position:absolute;left:0;color:var(--amber-d);font-size:12px}
.grambox li b{color:var(--rose-d)}
.moral{direction:ltr;text-align:left;background:linear-gradient(120deg,var(--plum),var(--rose));color:#fff;border-radius:16px;padding:16px 18px;margin-top:16px;font-family:'Lora',serif;font-size:15.5px;line-height:1.7;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.moral b{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.9;margin-bottom:5px}

.bookNav{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:2px solid var(--line);background:#FFF8EA;position:relative;z-index:2;flex-wrap:wrap}
.navBtn{padding:10px 20px;border-radius:12px;font-weight:800;font-family:'Baloo 2',system-ui,sans-serif;font-size:13.5px;transition:.15s;display:flex;gap:8px;align-items:center;border:2px solid transparent}
.navBtn.p{background:#fff;border-color:var(--line);color:var(--ink2)}
.navBtn.p:hover:not(:disabled){border-color:var(--slate);color:var(--slate-d);transform:translateY(-2px)}
.navBtn.n{background:var(--rose);color:#fff;margin-inline-start:auto;box-shadow:0 4px 0 var(--rose-d)}
.navBtn.n:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--rose-d)}
.navBtn.n:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--rose-d)}
.navBtn:disabled{opacity:.4;cursor:not-allowed}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:9px;height:9px;border-radius:99px;background:#EBD9AE;transition:.25s;cursor:pointer}
.dot:hover{background:var(--amber)}
.dot.act{width:26px;background:var(--rose)}
.pgNum{font-family:'Nunito';font-size:12px;color:var(--ink2);font-weight:700}

@keyframes flipIn{from{opacity:0;transform:translateX(var(--fx,-24px)) rotateY(6deg)}to{opacity:1;transform:none}}
.flip{animation:flipIn .45s cubic-bezier(.2,.8,.3,1)}

/* ============ PANELS ============ */
.panel{background:var(--paper);border:3px solid var(--edge);border-radius:var(--r);padding:22px;box-shadow:0 6px 0 var(--edge), var(--shadow)}
.panel+.panel{margin-top:20px}
.panel h3.pt{font-family:'Baloo 2',system-ui,sans-serif;font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.panel h3.pt em{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 3px 0 var(--amber-d)}
.panel .sub{font-size:12.8px;color:var(--ink2);margin-bottom:18px}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.vcard{background:#FFFDF7;border:2px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;transition:.18s}
.vcard:hover{border-color:var(--amber);transform:translateY(-3px);box-shadow:0 8px 18px -10px rgba(90,60,20,.4)}
.vcard .ic{width:36px;height:36px;border-radius:10px;background:#FCEFD2;display:grid;place-items:center;color:var(--rose-d);flex:0 0 auto}
.vcard .en{font-weight:700;font-size:14.5px;line-height:1.3}
.vcard .ar{font-size:12.5px;color:var(--ink2)}
.spk{margin-inline-start:auto;width:27px;height:27px;border-radius:8px;background:#F6E9C8;display:grid;place-items:center;font-size:12px;transition:.18s;flex:0 0 auto}
.spk:hover{background:var(--green);color:#fff;transform:translateY(-2px)}

.act{background:#FFFDF7;border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;transition:.2s}
.act.correct{border-color:#8FDBAE}
.act.wrong{border-color:#FFB0B6}
.actHead{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}
.actNum{width:30px;height:30px;border-radius:9px;background:var(--slate);color:#fff;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;flex:0 0 auto;box-shadow:0 2px 0 var(--slate-d)}
.actHead h4{font-family:'Baloo 2',system-ui,sans-serif;font-size:15.5px;line-height:1.4}
.actHead .instr{font-size:12px;color:var(--ink2);font-family:'Nunito';direction:ltr;text-align:left}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#FCEFD2;color:var(--amber-d);letter-spacing:.5px}

.q{direction:ltr;text-align:left;font-family:'Nunito';font-size:15px;margin:12px 0 8px;line-height:1.65}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 16px;border-radius:12px;background:#fff;border:2px solid var(--slate);font-family:'Nunito';font-size:14px;font-weight:700;color:var(--ink);transition:.15s;box-shadow:0 3px 0 var(--slate)}
.opt:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--slate)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--slate)}
.opt.sel{background:var(--slate);color:#fff}
.opt.ok{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.opt.no{background:var(--rose);border-color:var(--rose-d);color:#fff;box-shadow:0 3px 0 var(--rose-d)}
.opt:disabled{cursor:default}
.fb{direction:ltr;text-align:left;font-family:'Nunito';font-size:12.5px;margin-top:8px;padding:8px 12px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.good{background:#E4F9EE;color:#1E8F5C;border-inline-start:3px solid var(--green)}
.fb.bad{background:#FFEFEF;color:#C23A46;border-inline-start:3px solid var(--rose)}

.matchWrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.matchWrap{grid-template-columns:1fr;gap:8px}}
.mcol{display:flex;flex-direction:column;gap:7px}
.mitem{padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-family:'Nunito';font-size:13.5px;text-align:start;transition:.15s;display:flex;gap:8px;align-items:center;line-height:1.45}
.mitem:hover{border-color:var(--slate);transform:translateY(-2px)}
.mitem.sel{border-color:var(--amber);background:#FFF3DC}
.mitem.done{background:#E4F9EE;color:#1E8F5C;border-color:#8FDBAE;opacity:.75;pointer-events:none}
.mitem.err{animation:shake .4s;background:#FFEFEF;border-color:var(--rose)}
.mitem .ic{flex:0 0 auto;color:var(--rose-d)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.sortWrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.sortWrap{grid-template-columns:1fr}}
.bin{border:2px dashed #E4C98A;border-radius:14px;padding:12px;min-height:110px;background:#FEFAF0;transition:.2s}
.bin.hov{border-color:var(--amber);background:#FFF7E6}
.bin h5{font-size:12.5px;font-family:'Baloo 2',system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);margin-bottom:9px;text-align:center;direction:ltr}
.binItems{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;padding:11px;background:#FCF3DE;border-radius:12px;min-height:46px}
.sitem{padding:7px 12px;border-radius:10px;background:#fff;border:2px solid var(--line);font-family:'Nunito';font-size:13px;font-weight:700;transition:.15s;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.sitem:hover{border-color:var(--amber);transform:translateY(-2px)}
.sitem.sel{background:var(--amber);border-color:var(--amber-d);color:#fff;box-shadow:0 2px 0 var(--amber-d)}
.sitem.ok{background:#E4F9EE;border-color:#8FDBAE;color:#1E8F5C}
.sitem.no{background:#FFEFEF;border-color:var(--rose);color:#C23A46}

.ordAns{min-height:46px;border:2px dashed #E4C98A;border-radius:12px;padding:9px;background:#FEFAF0;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.ordAns:empty::after{content:"… click the words in order";font-family:'Nunito';font-size:12.5px;color:#C7A96A;padding:6px}
.ow{padding:7px 12px;border-radius:10px;background:#fff;border:2px solid var(--line);font-family:'Nunito';font-size:13.5px;font-weight:700;transition:.15s;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.ow:hover{border-color:var(--slate);transform:translateY(-2px)}
.ow.placed{background:var(--slate);color:#fff;border-color:var(--slate-d);box-shadow:0 2px 0 var(--slate-d)}

.fillSent{direction:ltr;text-align:left;font-family:'Nunito';font-size:15.5px;line-height:2;margin-bottom:9px}
.blank{display:inline-block;min-width:88px;border-bottom:3px solid var(--amber);text-align:center;font-weight:900;color:var(--rose-d);padding:0 6px;transition:.2s}
.blank.ok{border-color:var(--green);color:var(--green-d);background:#E4F9EE;border-radius:6px}
.blank.no{border-color:var(--rose);color:var(--rose-d);background:#FFEFEF;border-radius:6px}

textarea.wa{width:100%;min-height:100px;border:2px solid var(--line);border-radius:12px;padding:12px;font-family:'Nunito';font-size:14.5px;direction:ltr;text-align:left;resize:vertical;background:#FFFDF7;line-height:1.7}

<script>
/* ══════════════════════════════════════════════════════════════

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function shade(hex,amt){
  let c=String(hex).replace('#','');
  if(c.length===3)c=c.split('').map(x=>x+x).join('');
  if(c.length!==6)return hex;
  let n=parseInt(c,16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function toast(msg,kind){
  const t=$('#toast');t.textContent=msg;t.className='toast show '+(kind||'');
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2300);
}

function P(o){
  const d={x:0,y:0,s:1,flip:false,skin:'#F1C6A0',hair:'#3A2A21',hs:'short',top:'#5B8DD9',bottom:'#3E4C66',

  }
  if(p.eyes==='open'){
    g+='<circle cx="'+(50-ex)+'" cy="'+ey+'" r="3.1" fill="#2E2A28"/><circle cx="'+(50+ex)+'" cy="'+ey+'" r="3.1" fill="#2E2A28"/>';
    g+='<circle cx="'+(51.3-ex)+'" cy="'+(ey-1.1)+'" r="1.05" fill="#fff"/><circle cx="'+(51.3+ex)+'" cy="'+(ey-1.1)+'" r="1.05" fill="#fff"/>';
    g+='<path d="M'+(50-ex-4)+' '+(ey-6.5)+' q4 -3 8 -1" stroke="#3A2A21" stroke-width="1.9" fill="none" stroke-linecap="round"/>';

  }else if(p.eyes==='closed'){

/* ---- props ---- */
function stars(n,w,h,seed){let s='';for(let i=0;i<n;i++){const x=(Math.sin(i*12.9898+seed)*43758.5453)%1,y=(Math.sin(i*78.233+seed)*12345.6789)%1;
 s+='<circle cx="'+(Math.abs(x)*w).toFixed(1)+'" cy="'+(Math.abs(y)*h).toFixed(1)+'" r="'+(0.8+Math.abs(Math.sin(i))*1.7).toFixed(1)+'" fill="#fff" opacity="'+(0.35+Math.abs(Math.cos(i))*0.6).toFixed(2)+'"/>';}return s;}
function star4(x,y,r,c){return '<path d="M'+x+' '+(y-r)+' Q'+(x+r*.22)+' '+(y-r*.22)+' '+(x+r)+' '+y+' Q'+(x+r*.22)+' '+(y+r*.22)+' '+x+' '+(y+r)+' Q'+(x-r*.22)+' '+(y+r*.22)+' '+(x-r)+' '+y+' Q'+(x-r*.22)+' '+(y-r*.22)+' '+x+' '+(y-r)+'Z" fill="'+(c||'#FFD98A')+'"/>';}
function bookIcon(x,y,w,h,c1,c2){return '<g transform="translate('+x+' '+y+')"><rect width="'+w+'" height="'+h+'" rx="3" fill="'+c1+'"/><rect x="'+(w*.16)+'" y="0" width="'+(w*.84)+'" height="'+h+'" rx="3" fill="'+c2+'"/><rect x="'+(w*.16)+'" y="'+(h*.42)+'" width="'+(w*.84)+'" height="2.6" fill="#fff" opacity=".55"/><rect x="'+(w*.16)+'" y="'+(h*.58)+'" width="'+(w*.6)+'" height="2.6" fill="#fff" opacity=".4"/></g>';}

 const rh=h/rows, cw=w/cols; const pal=['#C1666B','#4F6D7A','#5C8374','#E8A33D','#7A5C86','#3E7CB1','#D9776A','#6FA98C'];
 for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const bh=rh*.62+((r*7+c*13)%5)*1.6,bw=cw*.66;

 return s+'</g>';}

    d2:'My friend Salim, said Grandpa. He lived in Salalah, seven hundred kilometres away. In those days, when I wanted to tell him something, I wrote a letter and posted it. It travelled for two weeks!',
    d3:'Two weeks?! said Aisha.',
    d4:'Two weeks. I <b>couldn\u2019t</b> send an email — there was no internet. I <b>couldn\u2019t</b> telephone him — we <b>didn\u2019t have</b> a telephone in the house. I <b>could</b> only write, and then wait.'}]},
  {pic:'u3s2',title:'Twelve Songs, Twelve Million Songs',ar:'اثنتا عشرة أغنية مقابل ملايين',
   text:['Omar lifted the CD player. It was heavy, and cold, and it had a little door on the top.',
   {d:'What is this for?',
    d2:'Music! said Grandpa. I <b>could</b> carry twelve songs in my bag, and I <b>could</b> listen to them on the bus. Today, your tablet carries twelve million songs.',
    d3:'Aisha looked at her tablet. Then she looked at her father\u2019s mobile phone. Then she looked at the old letters.',
    d4:'So you <b>couldn\u2019t</b> take photographs of yourself all the time?',
    d5:'No! My camera had twelve pictures inside it — and I <b>couldn\u2019t</b> see them for a whole week. I had to wait, and hope.'}]},
  {pic:'u3s1',title:'What Grandpa Could Do',ar:'ما كان يستطيع جدّي فعله',
   text:['Grandpa sat down on the carpet and told them about his childhood.',
   {gram:['I <b>could</b> ride a camel when I was six years old.',
          'I <b>could</b> find water in the desert.',
          'I <b>could</b> climb a palm tree faster than my brother.',
          'I <b>could</b> make a fire with two sticks.',
          'But I <b>couldn\u2019t</b> watch television — we only had the radio in the evening.',
          'And I <b>couldn\u2019t</b> travel quickly. To visit the doctor in the next village, we walked for hours.']}]},
  {pic:'u3s2',title:'A Voice from Salalah',ar:'صوتٌ من صلالة',
   text:[{d:'And now? asked Omar.',
    d2:'Grandpa laughed. He took Aisha\u2019s tablet, put on his reading glasses, and pressed three buttons with one finger.',
    d3:'In two minutes he made a video call to his old friend Salim — in Salalah.'},
   'Salim\u2019s face filled the whole screen. He was old now, and he had white hair, and he was sitting in a garden full of green trees. But it was really him.',
   {d:'SALIM! shouted Grandpa.',
    d2:'SALEM! shouted Salim. Forty years, and you still have the same loud voice!'},
   'Omar and Aisha laughed. Two weeks had become two minutes.']},
  {pic:'u3cover',title:'A New Time Capsule',ar:'صندوق زمني جديد',
   text:['That night, Omar and Aisha made a new time capsule in a clean wooden box.',
   'They put in a drawing of a mobile phone. They put in a photograph of their whole family. They put in a small packet of Omani halwa. And they put in a real letter — written by hand, in blue ink, to somebody they had never met.',
   {d:'Maybe in forty years, said Aisha, somebody will open this box and ask: what <b>could</b> they do back then?',
    d2:'And what <b>couldn\u2019t</b> they do? added Omar.',
    d3:'Grandpa smiled and closed the lid. They <b>could</b> do everything we can, he said. And one thing we <b>couldn\u2019t — they could remember.'},
   {moral:'Technology changes every year. Memories do not. Write them down, keep them safe, and one day they will be treasure.'}]}
 ],
 activities:[
  {type:'sort',title:'Then or Now?',instr:'Sort the objects: THEN (in the past) or NOW (nowadays).',
   cols:['THEN · in the past','NOW · nowadays'],
   items:[{t:'CD player',c:0},{t:'handwritten letter',c:0},{t:'old radio',c:0},{t:'camel',c:0},{t:'camera with 12 photos',c:0},
          {t:'mobile phone',c:1},{t:'tablet',c:1},{t:'email',c:1},{t:'video call',c:1},{t:'internet',c:1}]},
  {type:'match',title:'Past Simple',instr:'Match the past simple form to the present form.',
   pairs:[{a:'wrote',b:'write'},{a:'sent',b:'send'},{a:'took',b:'take'},{a:'went',b:'go'},
          {a:'found',b:'find'},{a:'made',b:'make'},{a:'could',b:'can'},{a:'had',b:'have'}]},
  {type:'mcq',title:'could / couldn\u2019t',instr:'Choose the correct word.',
   items:[
    {q:'Grandpa ___ ride a camel when he was six.',opts:['could','can','coulds'],ans:0,exp:'Past ability → could.'},
    {q:'In those days he ___ send an email.',opts:['could','couldn\u2019t','can\u2019t'],ans:1,exp:'There was no internet → couldn\u2019t.'},
    {q:'We ___ watch television — we only had the radio.',opts:['could','couldn\u2019t','can'],ans:1,exp:'Negative past ability.'},
    {q:'Today, Aisha ___ video-call Salalah in two minutes.',opts:['could','can','couldn\u2019t'],ans:1,exp:'Present ability → can.'},
    {q:'I ___ swim when I was four, but now I ___ swim very well.',opts:['couldn\u2019t / can','could / can\u2019t','can / couldn\u2019t'],ans:0,exp:'Past negative + present positive.'},
    {q:'Grandpa\u2019s camera ___ only twelve pictures.',opts:['could hold','holded','can held'],ans:0,exp:'could + base verb (no -ed, no -s).'}]},
  {type:'fill',title:'Past Simple in Context',instr:'Put the verb in the past simple.',
   items:[
    {text:'Grandpa ___ (open) the heavy wooden box.',opts:['open','opened','opens'],ans:1},
    {text:'Aisha ___ (pick) up an old letter.',opts:['picked','pick','picks'],ans:0},
    {text:'They ___ (find) a silver CD player inside.',opts:['find','finded','found'],ans:2},
    {text:'Omar ___ (hold) the camera carefully.',opts:['holded','held','holds'],ans:1},
    {text:'The letter ___ (travel) for two weeks.',opts:['travels','travelled','travel'],ans:1},
    {text:'Grandpa ___ (make) a video call to Salim.',opts:['made','maked','makes'],ans:0}]},
  {type:'tf',title:'True or False?',instr:'Check your understanding of the story.',
   items:[
    {q:'The time capsule was closed forty years ago.',ans:true,exp:'Grandpa closed it when he was younger than their father.'},
    {q:'Inside the box there was a modern tablet.',ans:false,exp:'There was a CD player, letters, a camera, a radio and a photo.'},
    {q:'Grandpa\u2019s letter to Salim travelled for two weeks.',ans:true,exp:'Yes — post was slow in those days.'},
    {q:'Grandpa\u2019s camera could take one hundred pictures.',ans:false,exp:'It had only twelve pictures inside it.'},
    {q:'Grandpa could climb a palm tree faster than his brother.',ans:true,exp:'He says this himself in the story.'},
    {q:'The video call to Salalah took two minutes.',ans:true,exp:'Two weeks became two minutes!'}]},
  {type:'write',title:'My Time Capsule',instr:'Write about your own family. What could they do in the past? What can you do now?',
   q:'My grandfather could … / My grandmother couldn\u2019t … / Today I can …',
   model:'My grandfather could ride a donkey to the market, but he couldn\u2019t drive a car.\nMy grandmother could cook for twenty people, but she couldn\u2019t use a phone.\nToday I can video-call my cousin in Kuwait in one minute.\nI couldn\u2019t ride a camel, but I can send an email!\nIn my time capsule I will put a photograph, a coin and a letter.'}
 ],
 teacher:{
  objectives:['Use could / couldn\u2019t to talk about ability in the past.','Use the past simple of regular and irregular verbs.','Compare life then and now; discuss Omani family heritage.'],
  warmup:['Realia: bring (or show pictures of) an old radio, a cassette, a handwritten letter. Ask "What is this? Could you use it today?"','Brainstorm: "Things my grandparents could do / couldn\u2019t do."'],
  during:['After page 4: two-column board work — could / couldn\u2019t.','After page 6: students repeat the grammar box aloud in chorus, then in pairs.'],
  wrapup:['Chain game: "In the past people could… but they couldn\u2019t…" around the class.','Project: students make a real classroom time capsule with letters to Class 4 of the year 2065.'],
  differentiation:['Support: give a verb list with past forms; students only choose.','Extension: students write a 5-sentence interview with a grandparent and present it.']}
},
{
 id:'u4',num:4,unit:"Let's Explore!",unitAr:'لنستكشف!',
 title:'The Last Piece of the Solar System',arTitle:'القطعة الأخيرة من المجموعة الشمسية',
 color:'#3E7CB1',pic:'u4cover',
 focus:['Vocabulary: space & Omani heritage','Grammar: will / won\u2019t (predictions)','Values: perseverance & national pride'],
 vocab:[
  {en:'solar system',ar:'المجموعة الشمسية',ic:'planet'},{en:'planet',ar:'كوكب',ic:'planet'},
  {en:'rocket',ar:'صاروخ',ic:'rocket'},{en:'telescope',ar:'تلسكوب / منظار',ic:'scope'},
  {en:'science fair',ar:'معرض العلوم',ic:'star'},{en:'model',ar:'نموذج / مجسّم',ic:'toy'},
  {en:'star',ar:'نجمة',ic:'star'},{en:'moon',ar:'قمر',ic:'cd'},
  {en:'space',ar:'الفضاء',ic:'rocket'},{en:'frankincense (luban)',ar:'اللبان العُماني',ic:'jar'},
  {en:'treasure',ar:'كنز',ic:'crown'},{en:'hidden',ar:'مخفي',ic:'key'}
 ],
 grammar:{
  title:'will / won\u2019t',
  rule:'We use <b>will</b> to predict something that we think is going to happen, and <b>won\u2019t</b> (= will not) to predict that something is not going to happen.',
  table:[['Form','Use','Example'],
   ['will + base verb','تنبؤ إيجابي','Our team <b>will win</b> first prize.'],
   ['won\u2019t + base verb','تنبؤ سلبي','The rocket <b>won\u2019t</b> be outside.'],
   ['Will + subject …?','سؤال','<b>Will</b> we <b>find</b> it today?'],
   ['I think / I don\u2019t think','رأي','I think Salim <b>will</b> like this.'] ],
  tip:'💡 will / won\u2019t never change with the subject: he will, they will, she won\u2019t — always the base verb (never "will finds").'
 },
 pages:[
  {pic:'u4cover',kind:'cover',title:'The Last Piece of the Solar System',ar:'القطعة الأخيرة من المجموعة الشمسية',sub:"Unit 4 · Let's Explore!",text:[],cover:true},
  {pic:'u4cover',title:'Three Days Before the Fair',ar:'ثلاثة أيام قبل المعرض',
   text:['The Salalah Science Fair was in three days, and Team Orion had a problem.',
   'Their model of the solar system was almost finished. Eight beautiful planets hung from silver wires. The sun glowed orange in the middle. The Moon was tiny and grey and perfect.',
   'But the rocket — the small silver rocket that was going to fly between Mars and Jupiter — was gone.']},
  {pic:'u4cover',title:'Where Is the Rocket?',ar:'أين الصاروخ؟',
   text:[{d:'Somebody took it, said Salim.',
    d2:'Somebody lost it, said Noor.',
    d3:'The wind won\u2019t blow inside a classroom, said Maya slowly, so the rocket won\u2019t be outside. It will be somewhere in this room. We just haven\u2019t looked in the right place yet.'},
   'Team Orion looked everywhere. They looked under the desks. They looked inside the cupboard, behind the coats. They looked behind the big map of Oman. They even looked inside Nasser\u2019s lunchbox (there was only a sandwich).',
   'No rocket.']},
  {pic:'u4s1',title:'The Telescope',ar:'التلسكوب',
   text:['At four o\u2019clock the sun went down and the sky turned purple, then blue, then black.',
   'Noor had an idea. She ran home and came back with her grandfather\u2019s heavy brass <b>telescope</b>.',
   {d:'If we can find a planet up there, she said, we will be able to find a rocket down here.'},
   'They carried the telescope to the roof. The night air was cool and smelled of sea.']},
  {pic:'u4s1',title:'What They Saw',ar:'ماذا رأوا',
   text:['They pointed the telescope at the sky, and the sky opened.',
   'They saw the <b>Moon</b> — grey and cold and full of holes, so close that Salim wanted to touch it. They saw <b>Jupiter</b>, with four tiny stars standing in a row around it. They saw <b>Saturn</b>, with its wide, pale, impossible ring.',
   {d:'That ring, whispered Maya, is the most wonderful thing I will ever see.',
    d2:'Will we go there one day? asked Salim.',
    d3:'Somebody will, said Noor. Maybe it will be us.'}]},
  {pic:'u4cover',title:'Pointing Down, Not Up',ar:'ننظر إلى الأسفل لا إلى الأعلى',
   text:['They were about to give up. Then Salim did something strange. He turned the telescope around and pointed it DOWN — not at the sky, but at the shelf above the classroom door.',
   'And there, sitting quietly next to a big glass jar full of white stones, was the little silver rocket.',
   {d:'WHO put it up there?! shouted all three of them at once.'}]},
  {pic:'u4s2',title:'The Hidden Treasure',ar:'الكنز المخفي',
   text:['The next morning their teacher, Ms Fatima, was smiling.',
   {d:'I moved it, she said. It fell on the floor twice on Wednesday, and I was afraid it would break. So I put it beside the most precious thing in my classroom.',
    d2:'She lifted down the big glass jar of white stones.',
    d3:'The most precious thing is a jar of rocks? asked Salim.'},
   'Ms Fatima laughed. {d:These are not rocks. This is <b>frankincense</b> — <i>luban</i>. It comes from the trees in Dhofar, in the south of Oman. Thousands of years ago, people crossed the whole desert for it. Kings and queens loved it. Traders sold it for more than its weight in gold.}',
   {d:'So Oman had a treasure that grew on a tree? asked Noor.',
    d2:'Oman still has it, said Ms Fatima. And it is not hidden under the ground — it is hiding in plain sight, in a jar, on a shelf, above a door.'}]},
  {pic:'u4s2',title:'First Prize',ar:'الجائزة الأولى',
   text:['Team Orion finished the model that afternoon. They hung the eight planets around the orange sun. They placed the silver rocket between Mars and Jupiter.',
   'And next to the rocket, in a tiny glass jar, they put one piece of white frankincense, with a small card:',
   {gram:['<b>The Last Piece of the Solar System</b> — and the oldest treasure of Oman.',
          'One rocket will carry us to the planets.',
          'One tree carried Oman to the world.']},
   'They won first prize. And when the judges asked them what the rocket would do one day, Maya thought for a moment and said:',
   {d:'It will carry Omani dreams to Mars.',
    moral:'Look up at the stars — but never forget the treasure growing in your own garden.'}]}
 ],
 activities:[
  {type:'match',title:'Space Vocabulary',instr:'Match the space word to its meaning.',
   pairs:[{a:'solar system',b:'the sun and all the planets around it'},{a:'planet',b:'a large round object that moves around a star'},
    {a:'rocket',b:'a machine that flies into space'},{a:'telescope',b:'a tube you look through to see far things'},
    {a:'model',b:'a small copy of something real'},{a:'science fair',b:'an event where students show science projects'}]},
  {type:'match',title:'Treasures of Oman',instr:'Match the Omani heritage word to its meaning.',
   pairs:[{a:'frankincense (luban)',b:'white resin that comes from trees in Dhofar'},{a:'treasure',b:'something very valuable'},
    {a:'hidden',b:'where nobody can easily see it'},{a:'Dhofar',b:'the region in the south of Oman'},
    {a:'trader',b:'a person who buys and sells things'},{a:'desert',b:'a dry place with sand and little water'}]},
  {type:'mcq',title:'will / won\u2019t',instr:'Choose the correct prediction.',
   items:[
    {q:'The wind can\u2019t blow inside, so the rocket ___ be outside.',opts:['will','won\u2019t','didn\u2019t'],ans:1,exp:'A negative prediction → won\u2019t.'},
    {q:'If we look carefully, we ___ find it.',opts:['will','won\u2019t','would'],ans:0,exp:'Positive prediction → will + base verb.'},
    {q:'___ Team Orion win the science fair?',opts:['Will','Won\u2019t','Does'],ans:0,exp:'Questions start with Will + subject + base verb.'},
    {q:'Saturn ___ fly away — it stays in its orbit.',opts:['will','won\u2019t','can\u2019t be'],ans:1,exp:'Negative prediction.'},
    {q:'I think that rocket ___ carry Omani dreams to Mars one day.',opts:['will','won\u2019t','doesn\u2019t'],ans:0,exp:'After "I think" we normally predict with will.'},
    {q:'Maya ___ give up, because she is patient.',opts:['will','won\u2019t','can'],ans:1,exp:'She won\u2019t give up = she will not give up.'}]},
  {type:'fill',title:'Predict the Future',instr:'Complete with will or won\u2019t.',
   items:[
    {text:'Be careful! You ___ break the Moon if you drop it.',opts:['will','won\u2019t'],ans:0},
    {text:'Don\u2019t worry — the judges ___ forget our frankincense jar.',opts:['will','won\u2019t'],ans:1},
    {text:'If it rains tomorrow, we ___ use the telescope on the roof.',opts:['will','won\u2019t'],ans:1},
    {text:'Noor ___ find the rocket, because Noor always finds things.',opts:['will','won\u2019t'],ans:0},
    {text:'I think our class ___ win first prize this year.',opts:['will','won\u2019t'],ans:0}]},
  {type:'sort',title:'Space or Omani Treasure?',instr:'Sort the facts: SPACE or OMAN\u2019S TREASURE.',
   cols:['SPACE fact','OMAN\u2019S TREASURE fact'],
   items:[{t:'Jupiter has four big moons.',c:0},{t:'Saturn has a beautiful ring.',c:0},{t:'The Moon is full of holes.',c:0},{t:'There are eight planets in the solar system.',c:0},
          {t:'Frankincense comes from Dhofar.',c:1},{t:'Luban was worth more than gold.',c:1},{t:'Kings and queens loved frankincense.',c:1},{t:'It grows on a tree, not under the ground.',c:1}]},
  {type:'tf',title:'True or False?',instr:'Decide — then check.',
   items:[
    {q:'The science fair was in three days.',ans:true,exp:'Yes — Team Orion had three days left.'},
    {q:'The missing piece was a small golden rocket.',ans:false,exp:'It was a small SILVER rocket.'},
    {q:'Noor\u2019s telescope belonged to her grandfather.',ans:true,exp:'It was a heavy brass telescope from her grandfather.'},
    {q:'They found the rocket under the teacher\u2019s desk.',ans:false,exp:'They found it on the shelf above the door, next to a glass jar.'},
    {q:'Ms Fatima moved the rocket because it fell twice.',ans:true,exp:'She was afraid it would break.'},
    {q:'Frankincense comes from trees in the north of Oman.',ans:false,exp:'It comes from Dhofar, in the SOUTH of Oman.'},
    {q:'Team Orion won first prize.',ans:true,exp:'Yes — with a piece of luban beside the rocket.'}]},
  {type:'write',title:'Predict: Oman in 2050',instr:'Write 4 predictions about Oman (or the world) in the future using will / won\u2019t.',
   q:'In 2050, Oman will …',
   model:'In 2050, Oman will have a space centre in Dhofar.\nOmani scientists will send a rocket to the Moon.\nPeople won\u2019t cut down the frankincense trees — they will protect them.\nTourists will come from all over the world to smell the luban.\nI think I will be an astronaut, and I will take a piece of frankincense with me!'}
 ],
 teacher:{
  objectives:['Use will / won\u2019t to make predictions about the future.','Learn and use space vocabulary and Omani heritage vocabulary (frankincense / luban).','Read a longer narrative for gist and detail; make and check predictions while reading.'],
  warmup:['Show a picture of the solar system. Ask: "Which planet will we live on one day? Why?"','Show real luban. Let students smell it. Ask: "Why was this worth more than gold?"'],
  during:['Before each page, ask students to PREDICT with will/won\u2019t ("Will they find the rocket on this page?").','CLIL moment: 8 planets, order from the sun; Dhofar on the map of Oman.'],
  wrapup:['Class time-capsule prediction: "In 20 years our school will…"','Mini project: teams build their own model and write a 3-sentence label using will/won\u2019t.'],
  differentiation:['Support: provide will/won\u2019t sentence frames with picture prompts.','Extension: students research another Omani treasure (dates, khanjar, Omani rose water) and present 4 predictions.']}
},
{
 id:'u5',num:5,unit:'Off to the Shops',unitAr:'إلى المتاجر',
 title:'The Shop That Sells Everything',arTitle:'الدكّان الذي يبيع كل شيء',
 color:'#5C8374',pic:'u5cover',
 focus:['Vocabulary: shops & shopping','Grammar: relative clauses (who / which / that) · have to','Values: community & kindness'],
 vocab:[
  {en:'toy shop',ar:'متجر الألعاب',ic:'toy'},{en:'pharmacy',ar:'الصيدلية',ic:'pill'},
  {en:"jeweller's",ar:'متجر المجوهرات',ic:'ring'},{en:"baker's",ar:'المخبز',ic:'bread'},
  {en:"greengrocer's",ar:'متجر الخضار',ic:'apple'},{en:'bookshop',ar:'مكتبة بيع الكتب',ic:'book'},
  {en:'shopkeeper',ar:'صاحب المتجر',ic:'shop'},{en:'customer',ar:'زبون',ic:'bag'},
  {en:'counter',ar:'طاولة البيع / الكاونتر',ic:'tidy'},{en:'medicine',ar:'دواء',ic:'pill'},
  {en:'receipt',ar:'إيصال / فاتورة',ic:'mail'},{en:'souq',ar:'سوق',ic:'shop'}
 ],
 grammar:{
  title:'Relative clauses · have to',
  rule:'A <b>relative clause</b> gives more information about a person or a thing. <b>who</b> = for people · <b>which / that</b> = for things. <b>have to</b> = must, it is necessary (يجب / مضطر).',
  table:[['Structure','Arabic','Example'],
   ['who + verb','الذي / التي (للإنسان)','Mr Youssef is the man <b>who</b> knows everybody\u2019s name.'],
   ['which / that + verb','الذي / التي (للشيء)','This is the medicine <b>which</b> my mother needs.'],
   ['have to','يجب / مضطر','You <b>have to</b> tell me one true thing.'],
   ['don\u2019t have to','ليس ضرورياً','You <b>don\u2019t have to</b> pay money for the toy.'],
   ['has to','يجب (he/she/it)','My mother <b>has to</b> come herself.']],
  tip:'💡 <b>have to</b> = it is necessary (no choice). <b>don\u2019t have to</b> = it is NOT necessary (you can choose). They are NOT opposites in meaning!'
 },
 pages:[
  {pic:'u5cover',kind:'cover',title:'The Shop That Sells Everything',ar:'الدكّان الذي يبيع كل شيء',sub:'Unit 5 · Off to the Shops',text:[],cover:true},
  {pic:'u5cover',title:'Three Different Shops',ar:'ثلاثة متاجر مختلفة',
   text:['Layla\u2019s mother needed three things from the souq that morning: medicine for her cough, a gold bracelet for Layla\u2019s aunt\u2019s wedding, and a wooden camel for her little brother Adam, who cried when he was hungry and cried when he was not hungry.',
   {d:'That is three different shops, said Layla. The <b>pharmacy</b>, the <b>jeweller\u2019s</b>, and the <b>toy shop</b>. That is a very long walk.',
    d2:'A very long walk, agreed her mother.'},
   'But at the end of the narrow alley, where the old bakery used to be, there was a door that Layla had never seen before. Warm yellow light came out of the windows, and it smelled of mint and old wood.']},
  {pic:'u5s1',title:'Bigger on the Inside',ar:'أكبر من الداخل',
   text:['Layla pushed the door. A small bell rang: ting!',
   'Inside, the shop was enormous — much, much bigger than it looked from the street.',
   'On the left there were shelves of wooden toys, dolls, kites and spinning tops. In the middle there were glass bottles and neat boxes of medicine, and a scale for weighing herbs. On the right, under a little lamp, there was gold and silver jewellery that sparkled like a hundred small stars.',
   {d:'One shop, whispered Layla. All three shops in one shop!'}]},
  {pic:'u5s2',title:'The Man Who Knows Everybody',ar:'الرجل الذي يعرف الجميع',
   text:[{d:'Hello! said a voice.',
    d2:'The man who stood behind the counter had a white beard and a colourful turban, and his eyes were laughing.',
    d3:'I know you, he said. You are Layla, the girl who lives next to the old well. Your brother is Adam, who cries when he is hungry. And your mother is Salma, who buys my mint every Thursday.'},
   'Layla\u2019s mouth fell open.',
   {d:'How do you know everybody\u2019s name?',
    d2:'The shopkeeper smiled. A shopkeeper who doesn\u2019t know his customers is not really a shopkeeper. He is only a man standing behind a table. My name is Mr Youssef.'}]},
  {pic:'u5s1',title:'Three Things',ar:'ثلاثة أشياء',
   text:['Mr Youssef moved around his shop like a bird. He gave Layla the medicine <b>which</b> her mother needed — a brown bottle that smelled of honey and lemon. He showed her the bracelet <b>which</b> her aunt would love — thin gold, with a small green stone. And he reached up high and took down the wooden camel <b>that</b> had real moving legs and a real moving neck.',
   {d:'How much, please? asked Layla, opening her little purse.',
    d2:'Mr Youssef shook his head. In this shop, you <b>have to</b> pay in a different way.'}]},
  {pic:'u5s2',title:'The Strange Price',ar:'الثمن الغريب',
   text:[{d:'You <b>don\u2019t have to</b> pay money for the first thing, he said. You <b>have to</b> tell me one true thing about yourself. That is the price of a toy.',
    d2:'Layla thought for a long moment. She looked at her shoes. She looked at the wooden camel.',
    d3:'Then she said: I <b>have to</b> help my mother every evening, but sometimes I don\u2019t want to, and sometimes I hide behind the door.'},
   'Mr Youssef laughed — a big, warm laugh that made the glass bottles shake gently on the shelf.',

}

function bindReader(s){
  const go=(d)=>{const n=state.page+d;if(n>=0&&n<s.pages.length){state.page=n;stopSpeak();save();renderReader();$('#main').scrollIntoView({behavior:'smooth',block:'start'});}};
  const pv=$('#prev'),nx=$('#next');

  if(nx)nx.onclick=()=>go(1);
  $$('.dot').forEach(d=>d.onclick=()=>{state.page=+d.dataset.i;stopSpeak();save();renderReader();});
  const sr=$('#startRead');if(sr)sr.onclick=()=>{state.page=1;save();renderReader();};
  $('#fsUp').onclick=()=>{state.fs=Math.min(24,state.fs+1);save();renderReader();};
  $('#fsDown').onclick=()=>{state.fs=Math.max(14,state.fs-1);save();renderReader();};
  $('#btnActs').onclick=()=>{state.view='act';save();renderAll();};
  $('#btnSpeak').onclick=function(){if(speaking){stopSpeak();this.classList.remove('on');}else{this.classList.add('on');speakPage();}};
  $('#spread').addEventListener('animationend',function(){this.classList.remove('flip');});
  document.addEventListener('keydown',keyNav);
}
function keyNav(e){
  if(state.view!=='read')return;

}
/* --- read aloud with sentence highlighting --- */
function speakPage(){
  const spans=$$('#txtSide .para .sp, #txtSide .dlg');
  const seq=[];
  $$('#txtSide .para').forEach(p=>{splitSent(p.textContent).forEach(x=>{if(x.trim())seq.push(x.trim());});});
  $$('#txtSide .dlg').forEach(d=>{if(d.textContent.trim())seq.push(d.textContent.trim());});
  if(!seq.length){toast('No text on this page','bad');$('#btnSpeak')&&$('#btnSpeak').classList.remove('on');return;}
  speaking=true;speakIdx=0;
  const allSpans=$$('#txtSide .sp');
  function step(){
    if(!speaking)return;
    if(speakIdx>=seq.length){stopSpeak();return;}
    allSpans.forEach(x=>x.classList.remove('rd'));
    if(allSpans[speakIdx])allSpans[speakIdx].classList.add('rd');
    const u=new SpeechSynthesisUtterance(seq[speakIdx]);
    u.lang='en-GB';u.rate=.92;u.pitch=1;
    const v=speechSynthesis.getVoices().find(v=>/en-GB|en_GB|English/i.test(v.lang+v.name));
    if(v)u.voice=v;
    u.onend=()=>{speakIdx++;setTimeout(step,120);};
    u.onerror=()=>{speakIdx++;setTimeout(step,60);};
    speechSynthesis.speak(u);
  }
  step();
}
function stopSpeak(){speaking=false;try{speechSynthesis.cancel();}catch(e){}
  $$('#txtSide .sp').forEach(x=>x.classList.remove('rd'));
  const b=$('#btnSpeak');if(b)b.classList.remove('on');}

let flashState={};
function startFlash(s){
  flashState={pool:s.vocab.slice(),i:0,score:0,total:0};
  nextFlash(s);
}
function nextFlash(s){
  const f=$('#flash');if(!f)return;
  if(flashState.i>=flashState.pool.length){
    f.innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:44px">🏆</div><h4 style="font-size:18px;margin:8px 0">Well done! Your score: '+flashState.score+' / '+flashState.total+'</h4><button class="opt" id="again">↺ Play again</button></div>';
    $('#again').onclick=()=>startFlash(s);return;
  }
  const item=flashState.pool[flashState.i];
  const others=s.vocab.filter(v=>v.en!==item.en).sort(()=>Math.random()-.5).slice(0,2);
  const opts=[item,...others].sort(()=>Math.random()-.5);
  flashState.total++;
  f.innerHTML='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">'
   +'<div style="width:110px;height:110px;border-radius:20px;background:linear-gradient(135deg,'+s.color+',#fff);display:grid;place-items:center;color:#fff">'+(ICO[item.ic]?ICO[item.ic].replace('width="22" height="22"','width="52" height="52"'):ICO.star)+'</div>'
   +'<div style="font-size:15px;color:var(--ink2)">'+(flashState.i+1)+' / '+flashState.pool.length+'</div>'
   +'<div style="display:flex;flex-direction:column;gap:8px;min-width:230px">'
   +opts.map((o,k)=>'<button class="opt fopt" data-k="'+k+'" style="text-align:start;justify-content:flex-start">'+o.en+' <span style="opacity:.6;font-size:12px;margin-inline-start:6px">'+o.ar+'</span></button>').join('')
   +'<button class="ibtn" id="fSay" style="width:auto;padding:0 14px;height:34px;font-size:12px">🔊 Listen to the word</button></div></div>';
  $('#fSay').onclick=()=>say(item.en);
  $$('.fopt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.k].en===item.en;
    $$('.fopt').forEach(x=>{x.disabled=true;x.classList.add(opts[+x.dataset.k].en===item.en?'ok':(x===b?'no':''));});
    if(ok){flashState.score++;toast('Correct answer ✓','good');}else toast('The correct answer: '+item.en,'bad');
    say(item.en);
    setTimeout(()=>{flashState.i++;nextFlash(s);},950);
  });
}

   +'<div class="gbox"><p style="font-family:Nunito;direction:ltr;text-align:left;font-size:14.5px;line-height:1.8">'+g.rule+'</p></div>'
   +'<table class="gtable"><tr>'+g.table[0].map(x=>'<th>'+x+'</th>').join('')+'</tr>'
   +g.table.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>'
   +'<div class="tnote" style="margin-top:14px"><h5>💡 Important Note</h5><div class="en-l">'+g.tip+'</div></div></div>';
  /* grammar examples pulled from the story */
  h+='<div class="panel"><h3 class="pt"><em>📖</em> From the Story</h3><div class="sub">Real examples from the story</div>';
  const ex=[];(s.pages||[]).forEach(p=>(p.text||[]).forEach(b=>{if(b&&b.gram)b.gram.forEach(x=>ex.push(x));}));
  if(ex.length)h+='<div class="grambox"><ul>'+ex.slice(0,8).map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';
  else h+='<p style="font-size:13.5px;color:var(--ink2)">Go back to the story pages — all the target sentences are shown in bold inside the Language Focus boxes.</p>';
  h+='</div>';
  $('#main').innerHTML=h;
}
function renderTeacher(){
  const s=cur(),t=s.teacher;
  const sec=(ic,title,arr,cls)=>'<div class="tnote"><h5>'+ic+' '+title+'</h5><ul class="'+(cls||'')+'">'+arr.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  let h='<div class="hero" style="background:linear-gradient(135deg,#C9862A,#C1666B)"><h2>🍎 Teacher\'s Notes — Unit '+s.num+'</h2><p>'+s.title+' · '+s.arTitle+'</p><div class="tags">'+s.focus.map(f=>'<span>'+f+'</span>').join('')+'</div></div>';
  h+='<div class="panel"><h3 class="pt"><em>🎯</em> Lesson Objectives</h3>'+sec('🎯','Learning objectives',t.objectives,'en-l')
   +sec('🔥','Warm-up (5 min)',t.warmup,'en-l')
   +sec('📖','While reading',t.during,'en-l')
   +sec('🏁','Wrap-up & homework',t.wrapup,'en-l')
   +sec('🧩','Differentiation',t.differentiation,'en-l')+'</div>';
  h+='<div class="panel"><h3 class="pt"><em>🔤</em> Printable Vocabulary List</h3><div class="sub">Word list — English / Arabic</div>'
   +'<table class="gtable"><tr><th>#</th><th>English</th><th>Arabic</th></tr>'
   +s.vocab.map((v,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+v.en+'</b></td><td style="font-family:Tajawal">'+v.ar+'</td></tr>').join('')+'</table></div>';
  $('#main').innerHTML=h;
}

/* ══════════════════════════════════════════════════════════════
   8. ACTIVITIES ENGINE
   ══════════════════════════════════════════════════════════════ */
function akey(ai,ii){return cur().id+'|'+ai+'|'+(ii===undefined?'':ii);}
function setA(k,v){state.answers[k]=v;save();}
function getA(k){return state.answers[k];}

function renderActivities(){
  const s=cur();
  let h='<div class="hero" style="background:linear-gradient(135deg,'+s.color+',#2E2A28)"><h2>✏️ Unit '+s.num+' Activities</h2><p>'+s.activities.length+' interactive activities after the story \u201c'+s.title+'\u201d — matching, ordering, sorting, multiple choice and writing.</p><div class="tags"><span>Vocabulary</span><span>Grammar</span><span>Comprehension</span><span>Writing</span></div></div>';
  h+='<div id="actList">';
  s.activities.forEach((a,ai)=>{h+='<div class="act" id="act'+ai+'">'+buildAct(a,ai)+'</div>';});
  h+='</div>';
  h+='<div class="scoreBar"><div><div style="font-size:11px;opacity:.85">Score</div><div class="sc" id="scTxt">0 / 0</div></div>'
   +'<div class="track"><i id="scBar"></i></div>'
   +'<button class="wbtn gold" id="chkAll">✓ Check All Answers</button>'
   +'<button class="wbtn ghost" id="rstAll">↺ Reset Activities</button>'
   +'<button class="wbtn ghost" id="showAll">👁 Show Answers</button></div>';
  $('#main').innerHTML=h;
  bindActivities(s);
  updateScore();
}
function buildAct(a,ai){
  let h='<div class="actHead"><div class="actNum">'+(ai+1)+'</div><div><h4>'+a.title+' <span class="badge">'+a.type.toUpperCase()+'</span></h4><div class="instr">'+a.instr+'</div></div></div>';
  if(a.type==='match'){
    const left=a.pairs.map((p,i)=>({t:p.a,i:i}));
    const rSorted=a.pairs.map((p,i)=>({t:p.b,i:i})).sort((x,y)=>Math.sin(x.i*12.9+ai*4)-Math.sin(y.i*12.9+ai*4));
    h+='<div class="matchWrap"><div class="mcol" data-side="L">'+left.map(o=>'<button class="mitem" data-i="'+o.i+'" data-side="L">'+(o.t.startsWith('<svg')?'<span class="ic">'+o.t+'</span>':'<b class="en" style="font-size:14px">'+o.t+'</b>')+'</button>').join('')+'</div>'
      +'<div class="mcol" data-side="R">'+rSorted.map(o=>'<button class="mitem" data-i="'+o.i+'" data-side="R"><span class="en" style="font-size:13.5px">'+o.t+'</span></button>').join('')+'</div></div>';
    h+='<div class="fb" id="fb'+ai+'"></div>';
  }
  else if(a.type==='mcq'){
    a.items.forEach((it,ii)=>{
      h+='<div class="q"><b>'+(ii+1)+'.</b> '+it.q+'</div><div class="opts" data-m="'+ai+'" data-i="'+ii+'">'
        +it.opts.map((o,oi)=>'<button class="opt mo" data-o="'+oi+'">'+o+'</button>').join('')+'</div>'
        +'<div class="fb" id="fb'+ai+'_'+ii+'"></div>';
    });
  }
  else if(a.type==='tf'){
    a.items.forEach((it,ii)=>{
      h+='<div class="q"><b>'+(ii+1)+'.</b> '+it.q+'</div><div class="opts" data-m="'+ai+'" data-i="'+ii+'">'
        +'<button class="opt mo" data-o="1">✓ True</button><button class="opt mo" data-o="0">✗ False</button></div>'
        +'<div class="fb" id="fb'+ai+'_'+ii+'"></div>';
    });
  }
  else if(a.type==='fill'){
    a.items.forEach((it,ii)=>{
      const parts=it.text.split('___');
      h+='<div class="fillSent" data-m="'+ai+'" data-i="'+ii+'">'+parts[0]+'<span class="blank" id="bl'+ai+'_'+ii+'">&nbsp;</span>'+(parts[1]||'')+'</div>'
        +'<div class="opts" data-m="'+ai+'" data-i="'+ii+'" data-kind="fill">'
        +it.opts.map((o,oi)=>'<button class="opt fo" data-o="'+oi+'">'+o+'</button>').join('')+'</div>';
    });
    h+='<div class="fb" id="fb'+ai+'"></div>';
  }
  else if(a.type==='sort'){
    h+='<div class="pool" id="pool'+ai+'">'+a.items.map((it,ii)=>'<button class="sitem" data-i="'+ii+'">'+it.t+'</button>').join('')+'</div>'
      +'<div class="sortWrap">'+a.cols.map((c,ci)=>'<div class="bin" data-c="'+ci+'"><h5>'+c+'</h5><div class="binItems" data-c="'+ci+'"></div></div>').join('')+'</div>'
      +'<div class="fb" id="fb'+ai+'"></div>';
  }
  else if(a.type==='order'){
    a.items.forEach((it,ii)=>{
      h+='<div class="q"><b>'+(ii+1)+'.</b> Arrange the words:</div>'
        +'<div class="ordAns" id="ans'+ai+'_'+ii+'"></div>'
        +'<div class="pool" id="wp'+ai+'_'+ii+'">'+it.words.map((w,wi)=>({w:w,wi:wi})).sort((a,b)=>Math.sin(a.wi*12.9+ii*7)-Math.sin(b.wi*12.9+ii*7)).map(o=>'<button class="ow" data-w="'+o.wi+'">'+o.w+'</button>').join('')+'</div>';
    });
    h+='<div class="fb" id="fb'+ai+'"></div>';
  }
  else if(a.type==='write'){
    h+='<div class="q"><b>✍</b> '+a.q+'</div><textarea class="wa" id="wa'+ai+'" placeholder="Write your answer here…"></textarea>'
      +'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="opt" id="md'+ai+'">👁 Show Model Answer</button><button class="opt" id="sv'+ai+'">💾 Save My Answer</button></div>'
      +'<div class="modelAns" id="ma'+ai+'"><b>Model answer:</b><br>'+a.model.replace(/\n/g,'<br>')+'</div>';
  }
  return h;
}
function bindActivities(s){
  /* restore */
  s.activities.forEach((a,ai)=>{
    if(a.type==='match'){
      const saved=getA(akey(ai,'m'))||{};
      Object.keys(saved).forEach(k=>{
        const L=$('#act'+ai+' .mitem[data-side="L"][data-i="'+k+'"]');
        const R=$('#act'+ai+' .mitem[data-side="R"][data-i="'+k+'"]');
        if(L&&R){L.classList.add('done');R.classList.add('done');}
      });
      let sel=null;
      $$('#act'+ai+' .mitem').forEach(b=>b.onclick=()=>{
        if(b.classList.contains('done'))return;
        const side=b.dataset.side;
        if(!sel){sel=b;b.classList.add('sel');return;}
        if(sel.dataset.side===side){sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}
        const ok=sel.dataset.i===b.dataset.i;
        if(ok){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');
          const st=getA(akey(ai,'m'))||{};st[b.dataset.i]=1;setA(akey(ai,'m'),st);
          toast('Correct match ✓','good');updateScore();}
        else{sel.classList.add('err');b.classList.add('err');const x=sel,y=b;
          setTimeout(()=>{x.classList.remove('err','sel');y.classList.remove('err');},450);toast('Try again','bad');}
        sel=null;
      });
    }
    if(a.type==='mcq'||a.type==='tf'){
      a.items.forEach((it,ii)=>{
        const saved=getA(akey(ai,ii));
        if(saved!==undefined){const b=$('#act'+ai+' .opts[data-i="'+ii+'"] .opt[data-o="'+saved+'"]');if(b)b.classList.add('sel');}
        $$('#act'+ai+' .opts[data-i="'+ii+'"] .opt').forEach(b=>b.onclick=()=>{
          $$('#act'+ai+' .opts[data-i="'+ii+'"] .opt').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');setA(akey(ai,ii),+b.dataset.o);updateScore();
        });
      });
    }
    if(a.type==='fill'){
      a.items.forEach((it,ii)=>{
        const saved=getA(akey(ai,ii));
        if(saved!==undefined){const bl=$('#bl'+ai+'_'+ii);if(bl)bl.textContent=it.opts[saved];
          const b=$('#act'+ai+' .opts[data-kind="fill"][data-i="'+ii+'"] .opt[data-o="'+saved+'"]');if(b)b.classList.add('sel');}
        $$('#act'+ai+' .opts[data-kind="fill"][data-i="'+ii+'"] .fo').forEach(b=>b.onclick=()=>{
          $$('#act'+ai+' .opts[data-kind="fill"][data-i="'+ii+'"] .fo').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');const oi=+b.dataset.o;setA(akey(ai,ii),oi);
          const bl=$('#bl'+ai+'_'+ii);bl.textContent=it.opts[oi];bl.classList.remove('ok','no');updateScore();
        });
      });
    }
    if(a.type==='sort'){
      let selItem=null;
      const place=(btn,ci)=>{
        const zone=$('#act'+ai+' .binItems[data-c="'+ci+'"]');
        if(btn.parentElement.classList.contains('pool'))zone.appendChild(btn);
        else $('#pool'+ai).appendChild(btn);
        const st=getA(akey(ai,'s'))||{};
        st[btn.dataset.i]=(btn.parentElement.classList.contains('pool'))?-1:ci;
        setA(akey(ai,'s'),st);btn.classList.remove('sel','ok','no');updateScore();
      };
      $$('#pool'+ai+' .sitem').forEach(b=>b.onclick=()=>{if(selItem===b){selItem.classList.remove('sel');selItem=null;return;}
        if(selItem)selItem.classList.remove('sel');selItem=b;b.classList.add('sel');});
      $$('#act'+ai+' .bin').forEach(bin=>{
        bin.onclick=(e)=>{if(!selItem)return;place(selItem,+bin.dataset.c);selItem=null;};
        bin.ondragover=(e)=>{e.preventDefault();bin.classList.add('hov');};
        bin.ondragleave=()=>bin.classList.remove('hov');
        bin.ondrop=(e)=>{e.preventDefault();bin.classList.remove('hov');const id=e.dataTransfer.getData('t');
          const b=$('#act'+ai+' .sitem[data-i="'+id+'"]');if(b)place(b,+bin.dataset.c);};
      });
      $$('#act'+ai+' .sitem').forEach(b=>{b.draggable=true;b.ondragstart=(e)=>e.dataTransfer.setData('t',b.dataset.i);});
      const st=getA(akey(ai,'s'))||{};
      Object.keys(st).forEach(k=>{if(st[k]>=0){const b=$('#act'+ai+' .sitem[data-i="'+k+'"]');if(b)place(b,st[k]);}});
    }
    if(a.type==='order'){
      a.items.forEach((it,ii)=>{
        const pool=$('#wp'+ai+'_'+ii),ans=$('#ans'+ai+'_'+ii);
        const chosen=[];
        const saved=getA(akey(ai,ii));
        const attach=(b)=>b.onclick=()=>{
          if(b.parentElement===pool){ans.appendChild(b);b.classList.add('placed');chosen.push(+b.dataset.w);}
          else{pool.appendChild(b);b.classList.remove('placed');const k=chosen.indexOf(+b.dataset.w);if(k>-1)chosen.splice(k,1);}
          setA(akey(ai,ii),chosen.slice());updateScore();
        };
        $$('#wp'+ai+'_'+ii+' .ow').forEach(attach);
        if(saved&&saved.length){saved.forEach(wi=>{const b=pool.querySelector('.ow[data-w="'+wi+'"]');if(b){ans.appendChild(b);b.classList.add('placed');chosen.push(wi);}});}
      });
    }
    if(a.type==='write'){
      const ta=$('#wa'+ai);const saved=getA(akey(ai,'w'));if(saved)ta.value=saved;
      $('#sv'+ai).onclick=()=>{setA(akey(ai,'w'),ta.value);toast('Your answer has been saved ✓','good');};
      $('#md'+ai).onclick=()=>$('#ma'+ai).classList.toggle('show');
      ta.oninput=()=>setA(akey(ai,'w'),ta.value);
    }
  });
  $('#chkAll').onclick=()=>checkAll(s);
  $('#rstAll').onclick=()=>{
    if(!confirm('Do you want to reset all activities in this unit?'))return;
    Object.keys(state.answers).forEach(k=>{if(k.startsWith(s.id+'|'))delete state.answers[k];});save();renderActivities();toast('Activities have been reset','');
  };
  $('#showAll').onclick=()=>showAll(s);
}
function checkAll(s){
  let ok=0,tot=0;
  s.activities.forEach((a,ai)=>{
    if(a.type==='mcq'||a.type==='tf'){
      a.items.forEach((it,ii)=>{
        tot++;const g=getA(akey(ai,ii));const fb=$('#fb'+ai+'_'+ii);
        $$('#act'+ai+' .opts[data-i="'+ii+'"] .opt').forEach(b=>{b.classList.remove('ok','no');});
        if(g===undefined){if(fb){fb.className='fb show bad';fb.innerHTML='⚠ You have not chosen an answer.';}return;}
        const correct=(a.type==='tf')?(g===1?true:false):g;
        const right=correct===it.ans||(a.type==='tf'&&((g===1)===it.ans));
        const sel=$('#act'+ai+' .opts[data-i="'+ii+'"] .opt[data-o="'+g+'"]');
        if(sel)sel.classList.add(right?'ok':'no');
        if(!right){const cr=$('#act'+ai+' .opts[data-i="'+ii+'"] .opt[data-o="'+(a.type==='tf'?(it.ans?1:0):it.ans)+'"]');if(cr)cr.classList.add('ok');}
        if(right)ok++;
        if(fb){fb.className='fb show '+(right?'good':'bad');fb.innerHTML=(right?'✓ Correct! ':'✗ Not quite. ')+(it.exp||'');}
      });
    }
    if(a.type==='fill'){
      const fb=$('#fb'+ai);let lok=0;
      a.items.forEach((it,ii)=>{
        tot++;const g=getA(akey(ai,ii));const bl=$('#bl'+ai+'_'+ii);
        bl.classList.remove('ok','no');
        if(g===undefined){bl.textContent='…';bl.classList.add('no');return;}
        if(g===it.ans){ok++;lok++;bl.classList.add('ok');}else{bl.classList.add('no');}
      });
      fb.className='fb show '+(lok===a.items.length?'good':'bad');
      fb.innerHTML=lok===a.items.length?'✓ Well done! All answers are correct.':'You got '+lok+' out of '+a.items.length+' correct. The correct answers are highlighted in green below — click \u201cShow Answers\u201d.';
    }
    if(a.type==='match'){
      const st=getA(akey(ai,'m'))||{};const n=Object.keys(st).length;
      tot+=a.pairs.length;ok+=n;
      const fb=$('#fb'+ai);if(fb){fb.className='fb show '+(n===a.pairs.length?'good':'bad');
        fb.innerHTML=n===a.pairs.length?'✓ All matches are correct!':'You matched '+n+' out of '+a.pairs.length+' — try the rest.';}
    }
    if(a.type==='sort'){
      const st=getA(akey(ai,'s'))||{};const fb=$('#fb'+ai);let lok=0;
      a.items.forEach((it,ii)=>{
        tot++;const placed=st[ii];
        const b=$('#act'+ai+' .sitem[data-i="'+ii+'"]');b.classList.remove('ok','no');
        if(placed===undefined||placed<0){return;}
        if(placed===it.c){ok++;lok++;b.classList.add('ok');}else b.classList.add('no');
      });
      fb.className='fb show '+(lok===a.items.length?'good':'bad');
      fb.innerHTML=lok===a.items.length?'✓ Excellent sorting!':'You sorted '+lok+' out of '+a.items.length+' correctly.';
    }
    if(a.type==='order'){
      const fb=$('#fb'+ai);let lok=0;
      a.items.forEach((it,ii)=>{
        tot++;const ch=getA(akey(ai,ii))||[];
        const built=ch.map(i=>it.words[i]).join(' ').trim();
        if(built===it.ans){ok++;lok++;}
      });
      fb.className='fb show '+(lok===a.items.length?'good':'bad');
      fb.innerHTML=lok===a.items.length?'✓ All sentences are correctly ordered!':'You correctly ordered '+lok+' out of '+a.items.length+' sentences.'
        +'<br><span style="opacity:.85">Correct: '+a.items.map(i=>i.ans).join(' · ')+'</span>';
    }
  });
  const pct=tot?Math.round(ok/tot*100):0;
  toast('Your score: '+ok+' / '+tot+' ('+pct+'%)',pct>=70?'good':'bad');
  updateScore();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function showAll(s){
  s.activities.forEach((a,ai)=>{
    if(a.type==='mcq'||a.type==='tf'){
      a.items.forEach((it,ii)=>{
        tot=1;const correct=(a.type==='tf')?(it.ans?1:0):it.ans;
        const b=$('#act'+ai+' .opts[data-i="'+ii+'"] .opt[data-o="'+correct+'"]');
        if(b){b.classList.add('ok');b.classList.remove('no');}
        const fb=$('#fb'+ai+'_'+ii);if(fb&&it.exp){fb.className='fb show good';fb.innerHTML='✓ '+it.exp;}
      });
    }
    if(a.type==='fill')a.items.forEach((it,ii)=>{const bl=$('#bl'+ai+'_'+ii);bl.textContent=it.opts[it.ans];bl.classList.add('ok');bl.classList.remove('no');});
    if(a.type==='sort')a.items.forEach((it,ii)=>{const b=$('#act'+ai+' .sitem[data-i="'+ii+'"]');
      const z=$('#act'+ai+' .binItems[data-c="'+it.c+'"]');if(b&&z&&b.parentElement!==z){z.appendChild(b);}if(b)b.classList.add('ok');});
    if(a.type==='order')a.items.forEach((it,ii)=>{const ans=$('#ans'+ai+'_'+ii),pool=$('#wp'+ai+'_'+ii);
      ans.innerHTML='';it.words.forEach((w,wi)=>{const b=pool.querySelector('.ow[data-w="'+wi+'"]');if(b){ans.appendChild(b);b.classList.add('placed');}});});
    if(a.type==='write'){$('#ma'+ai).classList.add('show');}
  });
  toast('All model answers have been shown','good');
  updateScore();
}
function updateScore(){
  const s=cur();let ok=0,tot=0;
  s.activities.forEach((a,ai)=>{
    if(a.type==='mcq'||a.type==='tf'){a.items.forEach((it,ii)=>{tot++;const g=getA(akey(ai,ii));if(g===undefined)return;
      const right=(a.type==='tf')?((g===1)===it.ans):(g===it.ans);if(right)ok++;});}
    else if(a.type==='fill'){a.items.forEach((it,ii)=>{tot++;if(getA(akey(ai,ii))===it.ans)ok++;});}
    else if(a.type==='match'){tot+=a.pairs.length;const st=getA(akey(ai,'m'))||{};ok+=Object.keys(st).length;}
    else if(a.type==='sort'){const st=getA(akey(ai,'s'))||{};a.items.forEach((it,ii)=>{tot++;if(st[ii]===it.c)ok++;});}
    else if(a.type==='order'){a.items.forEach((it,ii)=>{tot++;const ch=getA(akey(ai,ii))||[];
      if(ch.map(i=>it.words[i]).join(' ').trim()===it.ans)ok++;});}
  });
  const t=$('#scTxt'),b=$('#scBar');
  if(t)t.textContent=ok+' / '+tot;
  if(b)b.style.width=(tot?Math.round(ok/tot*100):0)+'%';
}

  renderNav();renderSidebar();

  else if(state.view==='act')renderActivities();

  else if(state.view==='teacher')renderTeacher();

$('#btnPrint').onclick=()=>window.print();
$('#btnReset').onclick=()=>{if(confirm('Reset all progress and answers?')){state={unit:0,view:'read',page:0,fs:17.5,answers:{},done:{}};save();renderAll();toast('Reset complete','');}};
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};}
renderAll();
