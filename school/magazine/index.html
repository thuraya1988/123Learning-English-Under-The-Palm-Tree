<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مجلة ملتقى المعارف</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo/arabic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo/arabic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/tajawal/arabic-500-normal.css">
<style>
:root{
  --bg:#0b0e14; --panel:#141a26; --panel2:#1b2331; --line:#26303f; --line2:#33415a;
  --txt:#e9eefb; --muted:#95a2ba; --acc:#7c9bff; --acc2:#ff8ac2; --ok:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(1100px 620px at 85% -10%,#1a2337 0%,#0b0e14 62%) fixed;
  color:var(--txt);-webkit-tap-highlight-color:transparent;
}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#161d2b,#101623);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;
  background:conic-gradient(from 210deg,#7c9bff,#ff8ac2,#ffd166,#4ade80,#7c9bff);box-shadow:0 8px 20px rgba(124,155,255,.32)}
.brand h1{font-size:17px;margin:0;font-weight:700}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  padding:9px 14px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--line2);background:#232d40;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#6c8cff,#a86bff);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(108,140,255,.32)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;pointer-events:none}

.intro{max-width:1100px;margin:16px auto 0;padding:0 16px}
.intro-panel{background:linear-gradient(135deg,rgba(124,155,255,.14),rgba(255,138,194,.1));border:1px solid var(--line2);border-radius:16px;padding:14px 18px;font-size:13px;color:var(--txt);line-height:1.8}
.intro-panel b{color:var(--acc)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.act{background:linear-gradient(135deg,#6c8cff,#a86bff);border-color:transparent;color:#fff}

.feed{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:linear-gradient(180deg,#151c29,#111725);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:cardIn .35s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.date{font-size:10.5px;color:var(--muted);white-space:nowrap}
.card h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.5}
.card p{margin:0;font-size:13px;color:#c7d0e5;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.author{font-size:11.5px;color:var(--muted);font-weight:700}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;border-radius:8px;transition:.15s}
.del-btn:hover{color:#ff8080;background:rgba(255,90,90,.12)}

.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted);font-size:13.5px}
.empty span{font-size:34px;display:block;margin-bottom:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(6,9,15,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal-overlay.show{display:flex}
.modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#171f2e,#111726);border:1px solid var(--line2);border-radius:20px;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{margin:0;font-size:16px}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.field select,.field input,.field textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--acc)}
.switch-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--txt);cursor:pointer;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:#181f2d;border:1px solid var(--line2);color:var(--txt);padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:520px){.brand p{display:none}.topbar{gap:8px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo">📰</div>
    <div>
      <h1>مجلة ملتقى المعارف</h1>
      <p>نافذة تحتفي بجهود المعلمات وتشجّع استخدام منصة نور</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnCompose">✍️ إضافة منشور</button>
    <button class="btn" id="btnRefresh" title="تحديث">🔄</button>
    <a class="btn" href="../index.html">🏠 الرئيسية</a>
  </div>
</div>

<div class="intro">
  <div class="intro-panel">
    💡 <b>شاركي زميلاتك:</b> نصيحة سريعة لاستخدام منصة نور، احتفال بإنجاز طالبة، أو سؤال يفيد الجميع. كل منشور هنا يقرّبنا خطوة من استخدام أفضل وأسهل لنور.
  </div>
</div>

<div class="filters" id="filters"></div>
<main class="feed" id="feed"><div class="empty"><span>⏳</span>جاري تحميل المجلة…</div></main>

<div class="modal-overlay" id="composeOverlay">
  <div class="modal">
    <div class="modal-head"><h3>✍️ إضافة منشور جديد</h3><button class="icon-btn" id="btnCloseCompose">✕</button></div>
    <div class="field">
      <label>التصنيف</label>
      <select id="fCategory">
        <option value="نصيحة">💡 نصيحة لاستخدام نور</option>
        <option value="نجمة نور الشهر">⭐ نجمة نور الشهر</option>
        <option value="قصة نجاح">🌟 قصة نجاح</option>
        <option value="سؤال وجواب">❓ سؤال وجواب</option>
        <option value="تذكير">🔔 تذكير</option>
        <option value="عام">📌 عام</option>
      </select>
    </div>
    <div class="field">
      <label>العنوان</label>
      <input id="fTitle" maxlength="120" placeholder="عنوان المنشور">
    </div>
    <div class="field">
      <label>المحتوى</label>
      <textarea id="fBody" maxlength="2000" rows="6" placeholder="اكتبي هنا…"></textarea>
    </div>
    <label class="switch-row"><input type="checkbox" id="fPush"> 🔔 إرسال إشعار لجميع المعلمات</label>
    <div class="modal-actions">
      <button class="btn" id="btnCancelCompose">إلغاء</button>
      <button class="btn primary" id="btnSubmitPost">نشر</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PUBLIC_API='https://dhhwcqczvcbwdwllfcun.supabase.co/functions/v1/multaqa-public';
const SECURE_API='https://dhhwcqczvcbwdwllfcun.supabase.co/functions/v1/multaqa-secure';
const CATS={
  'الكل':{emoji:'',color:'#7c9bff'},
  'نجمة نور الشهر':{emoji:'⭐',color:'#ffd166'},
  'نصيحة':{emoji:'💡',color:'#7c9bff'},
  'قصة نجاح':{emoji:'🌟',color:'#4ade80'},
  'سؤال وجواب':{emoji:'❓',color:'#ff8ac2'},
  'تذكير':{emoji:'🔔',color:'#ff9f6c'},
  'عام':{emoji:'📌',color:'#95a2ba'}
};
let allItems=[],activeCat='الكل';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}

async function publicApi(action,p={}){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(PUBLIC_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...p}),signal:ctl.signal});
    let d={};try{d=await r.json();}catch(err){}
    if(!r.ok||d.ok===false)throw Object.assign(new Error(d.error||'request_failed'),{code:d.error||'request_failed'});
    return d;
  }finally{clearTimeout(timer);}
}
async function secureApi(action,p={}){
  const token=localStorage.getItem('multaqa_staff_session')||'';
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(SECURE_API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'x-staff-session':token}:{})},body:JSON.stringify({action,...p}),signal:ctl.signal});
    let d={};try{d=await r.json();}catch(err){}
    if(!r.ok||d.ok===false)throw Object.assign(new Error(d.error||'request_failed'),{code:d.error||'request_failed'});
    return d;
  }finally{clearTimeout(timer);}
}
const ERR={
  service_timeout:'الخدمة لا تستجيب الآن، حاولي بعد قليل',
  forbidden:'ليست لديك صلاحية لهذا الإجراء',
  invalid_input:'تحققي من العنوان والمحتوى',
  save_failed:'تعذر حفظ المنشور، حاولي مرة أخرى',
  session_required:'انتهت جلستك، سجّلي الدخول من جديد من الصفحة الرئيسية',
  not_found:'المنشور غير موجود'
};

function renderFilters(){
  const box=document.getElementById('filters');
  box.innerHTML=Object.keys(CATS).map(c=>`<button class="chip ${c===activeCat?'act':''}" data-cat="${esc(c)}">${CATS[c].emoji?CATS[c].emoji+' ':''}${esc(c)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{activeCat=b.dataset.cat;renderFilters();renderFeed();}));
}
function renderFeed(){
  const feed=document.getElementById('feed');
  const list=activeCat==='الكل'?allItems:allItems.filter(x=>(x.subject||'عام')===activeCat);
  if(!list.length){
    feed.innerHTML=`<div class="empty"><span>📭</span>لا توجد منشورات في هذا التصنيف بعد — كوني أول من يشارك!</div>`;
    return;
  }
  feed.innerHTML=list.map(item=>{
    const cat=CATS[item.subject]?item.subject:'عام';
    const meta=CATS[cat];
    const date=item.created_at?new Intl.DateTimeFormat('ar-OM',{dateStyle:'medium'}).format(new Date(item.created_at)):'';
    return `<article class="card">
      <div class="card-head"><span class="badge" style="--c:${meta.color}">${meta.emoji?meta.emoji+' ':''}${esc(cat)}</span><span class="date">${date}</span></div>
      <h3>${esc(item.title)}</h3>
      <p>${esc(item.body)}</p>
      <div class="card-foot"><span class="author">✍️ ${esc(item.day_name||'عضوة هيئة التدريس')}</span><button class="del-btn" onclick="deletePost(${item.id})" title="حذف">🗑</button></div>
    </article>`;
  }).join('');
}
async function loadFeed(){
  try{
    const d=await publicApi('content',{content_type:'magazine'});
    allItems=(d.items||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    renderFeed();
  }catch(err){
    document.getElementById('feed').innerHTML=`<div class="empty"><span>⚠️</span>تعذر تحميل المجلة الآن، حاولي تحديث الصفحة.</div>`;
  }
}
window.deletePost=async(id)=>{
  const token=localStorage.getItem('multaqa_staff_session')||'';
  if(!token){toast('سجّلي دخولك من الصفحة الرئيسية أولًا');return;}
  if(!confirm('حذف هذا المنشور؟'))return;
  try{
    await secureApi('delete_magazine_post',{id});
    toast('🗑 تم حذف المنشور');
    loadFeed();
  }catch(err){toast(ERR[err&&err.code]||'تعذر الحذف الآن');}
};

const overlay=document.getElementById('composeOverlay');
function openCompose(){
  const token=localStorage.getItem('multaqa_staff_session')||'';
  if(!token){toast('سجّلي دخولك من الصفحة الرئيسية أولًا للمشاركة في المجلة');return;}
  overlay.classList.add('show');
}
function closeCompose(){overlay.classList.remove('show');}
document.getElementById('btnCompose').addEventListener('click',openCompose);
document.getElementById('btnCloseCompose').addEventListener('click',closeCompose);
document.getElementById('btnCancelCompose').addEventListener('click',closeCompose);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeCompose();});
document.getElementById('btnRefresh').addEventListener('click',loadFeed);

document.getElementById('btnSubmitPost').addEventListener('click',async()=>{
  const category=document.getElementById('fCategory').value;
  const title=document.getElementById('fTitle').value.trim();
  const body=document.getElementById('fBody').value.trim();
  const send_push=document.getElementById('fPush').checked;
  if(title.length<2||body.length<2){toast('اكتبي عنوانًا ومحتوى أولًا');return;}
  const btn=document.getElementById('btnSubmitPost');
  btn.disabled=true;btn.textContent='جاري النشر…';
  try{
    await secureApi('save_magazine_post',{category,title,body,send_push});
    toast('✅ تم نشر المنشور في المجلة');
    document.getElementById('fTitle').value='';
    document.getElementById('fBody').value='';
    document.getElementById('fPush').checked=false;
    closeCompose();
    loadFeed();
  }catch(err){
    toast(ERR[err&&err.code]||'تعذر النشر الآن');
  }finally{
    btn.disabled=false;btn.textContent='نشر';
  }
});

renderFilters();
loadFeed();
</script>
</body>
</html>
