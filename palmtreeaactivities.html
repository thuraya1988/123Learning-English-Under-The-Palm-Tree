<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>123 Let's Learn English Under The Big Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{font-family:"Tajawal",sans-serif;overflow:hidden;color:#6c5a3d}
    .scene{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#dff2ff 0%,#cde8ff 45%,#b9dcff 100%)}
    .sun{position:absolute;top:14px;right:130px;width:78px;height:78px;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 35%,#fffde0 0%,#ffe566 35%,#fdd835 70%,#f9a825 100%);box-shadow:0 0 24px rgba(255,220,50,.9),0 0 58px rgba(255,210,30,.55),0 0 105px rgba(255,200,20,.28);animation:sunPulse 4s ease-in-out infinite}
    @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .cloud{position:absolute;pointer-events:none;z-index:5;animation:cloudDrift 20s ease-in-out infinite}.cloud .cb{position:relative;background:rgba(255,255,255,.95);border-radius:999px}.cloud .cb1,.cloud .cb2,.cloud .cb3{position:absolute;background:rgba(255,255,255,.95);border-radius:50%}
    .cloud1{top:52px;left:22%}.cloud2{top:110px;right:5%;animation-duration:28s;animation-direction:reverse}
    @keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
    #happyCharLanding{position:absolute;left:-30px;bottom:55px;width:280px;height:480px;pointer-events:none;z-index:3;animation:happyBob 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.2))}
    @keyframes happyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,54vw);background:rgba(255,253,248,.97);border-radius:38px;padding:26px 24px 22px;box-shadow:0 24px 42px rgba(73,109,153,.22),0 12px 0 rgba(255,255,255,.9) inset,0 -10px 0 rgba(171,194,220,.22) inset;border:2px solid rgba(255,255,255,.8);text-align:center;z-index:4;transition:opacity .4s,transform .4s}
    .panel.hidden{opacity:0;transform:translate(-50%,-48%) scale(.98);pointer-events:none}
    .title{margin:-4px 0 10px;font-size:clamp(1.4rem,2.1vw,2.1rem);line-height:1.25;color:#bf8a2f;font-weight:800}.title .num{display:block;font-size:.7em;letter-spacing:2px;color:#c8922a;margin-bottom:2px}
    .row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
    .btn{position:relative;border:none;border-radius:14px;padding:10px 15px;min-width:86px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;overflow:hidden;user-select:none}
    .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 48%);pointer-events:none}
    .btn-soft{background:linear-gradient(180deg,#e8f8e4,#d4f0ce);color:#35572f;box-shadow:0 5px 0 #8dcb86,0 9px 16px rgba(75,131,74,.15)}
    .btn-soft.active{background:linear-gradient(180deg,#5cb85c,#3e9444);color:#fff;box-shadow:0 5px 0 #2d7b34,0 9px 16px rgba(45,120,50,.25)}
    .btn-start{min-width:138px;background:linear-gradient(180deg,#4caf50,#3b9440);color:#fff;box-shadow:0 6px 0 #2d7b34,0 12px 20px rgba(45,123,52,.2)}
    .field{cursor:text;width:100%;border-radius:12px;border:1.5px solid #e7dcc8;background:#fff;padding:11px 13px;font-family:inherit;font-size:.9rem;color:#6f624b;outline:none;box-shadow:0 3px 0 #f1eadb inset}
    .tools{margin-top:10px;display:flex;flex-direction:column;gap:7px}
    .tool-btn{width:100%;background:linear-gradient(180deg,#f3fbf1,#e6f6e1);color:#647258;border:none;border-radius:14px;padding:11px 14px;font-size:.9rem;font-family:inherit;font-weight:700;box-shadow:0 5px 0 #d8ead2;cursor:pointer}
    .lang-btn{min-width:100px;background:linear-gradient(180deg,#c7edbf,#e5f7df);color:#35613a;box-shadow:0 5px 0 #8fca84}.lang-btn.selected{background:linear-gradient(180deg,#9bdd8e,#c8efbf);color:#234c28}
    #arBtn{position:fixed;top:10px;right:10px;z-index:9999} #enBtn{position:fixed;top:10px;left:10px;z-index:9999}
    .top-note{position:fixed;bottom:10px;left:10px;color:#111;font-size:11px;z-index:9999;padding:4px 10px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(255,255,255,.12);backdrop-filter:blur(1px);font-weight:600;white-space:nowrap;pointer-events:none}

    #dreamLandView{position:fixed;inset:0;display:none;z-index:5;overflow:hidden;background:linear-gradient(180deg,#4fc8f8 0%,#74d8ff 30%,#a8e8ff 60%,#c8f0ff 100%)}
    #dreamLandView.show{display:block}
    #dreamLandViewer{position:absolute;width:100%;height:100%;background:transparent;filter:saturate(1.5) contrast(1.1);pointer-events:none;z-index:1}
    #villageBlueLayer{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(20,40,120,.08);mix-blend-mode:multiply}
    #jojoCharVillage{position:absolute;left:2%;bottom:15%;width:180px;height:340px;pointer-events:none;z-index:8;animation:jojoBob 3.5s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(0,80,200,.5))}
    @keyframes jojoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    #happyCharVillage{position:absolute;left:40%;bottom:10%;width:150px;height:280px;pointer-events:none;z-index:8;animation:happyBobVillage 3s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(255,120,0,.4))}
    @keyframes happyBobVillage{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .stars{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.8;background:radial-gradient(circle at 10% 8%,#fff 0 .2%,transparent .25%),radial-gradient(circle at 30% 16%,#fff 0 .2%,transparent .25%),radial-gradient(circle at 56% 7%,#fff 0 .2%,transparent .25%),radial-gradient(circle at 80% 14%,#fff 0 .2%,transparent .25%)}
    .lantern{position:absolute;z-index:4;pointer-events:none;border-radius:50%;animation:lanternPulse 2s ease-in-out infinite}
    .ln-a{width:7px;height:7px;background:rgba(255,200,50,.9);box-shadow:0 0 10px 3px rgba(255,180,30,.7);bottom:12%;left:18%}
    .ln-b{width:6px;height:6px;background:rgba(255,160,80,.9);box-shadow:0 0 9px 3px rgba(255,140,60,.7);bottom:10%;left:32%;animation-delay:.5s}
    .ln-c{width:6px;height:6px;background:rgba(200,220,255,.9);box-shadow:0 0 9px 3px rgba(180,200,255,.7);bottom:11%;right:28%;animation-delay:.8s}
    .ln-d{width:6px;height:6px;background:rgba(255,200,50,.9);box-shadow:0 0 9px 3px rgba(255,180,30,.7);bottom:9%;right:15%;animation-delay:1.2s}
    .ln-e{width:5px;height:5px;background:rgba(180,255,180,.9);box-shadow:0 0 8px 3px rgba(150,240,150,.7);bottom:13%;left:50%;animation-delay:1.6s}
    @keyframes lanternPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

    #tourControls{position:fixed;top:14px;right:14px;z-index:9999;display:none} #tourControls.show{display:flex;gap:10px}
    .tour-btn{border:none;border-radius:50px;padding:10px 20px;background:rgba(255,255,255,.95);color:#2d3561;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
    #sideNav{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:9999;display:none;flex-direction:column;gap:10px}
    #sideNav.show{display:flex}
    .side-btn{border:none;border-radius:18px;padding:12px 16px;font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer;text-align:right;direction:rtl;box-shadow:0 6px 18px rgba(0,0,0,.22);min-width:150px;white-space:nowrap}
    .sb-tour{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}.sb-lib{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff}.sb-school{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a4a2e}.sb-shop{background:linear-gradient(135deg,#fa709a,#fee140);color:#5a2d00}
    #moveControls{display:none!important}
    #dreamLoading{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 40%,#ffecd2 100%);color:#7b2d8b;font-weight:800}
    #dreamLoading.show{display:flex}
    #dreamLandFallback{position:absolute;inset:auto 16px 16px;z-index:6;background:rgba(255,255,255,.92);color:#214;padding:10px 12px;border-radius:10px;display:none;font-weight:700}
    #bookReader{position:fixed;inset:0;background:rgba(12,18,32,.62);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
    #bookReader.show{display:flex}
    .reader-panel{width:min(920px,92vw);height:min(82vh,760px);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.4)}
    .reader-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #ececec;font-weight:800;color:#2d3b5e}
    .reader-actions{display:flex;gap:8px}.reader-actions button{border:none;border-radius:8px;padding:8px 10px;background:#e9f4ff;cursor:pointer;font-weight:700}
    #readerFrame{width:100%;height:100%;border:none;background:#f7f7f7}
  </style>
</head>
<body>
<button class="btn lang-btn selected" id="arBtn">عربي</button>
<button class="btn lang-btn" id="enBtn">English</button>
<div class="top-note">Thuraya Mohammed Ali AL-Naabia- Omani English Teacher</div>

<div class="scene" id="landingScene">
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud cloud1" aria-hidden="true"><div class="cb" style="width:116px;height:34px;"><div class="cb1" style="width:50px;height:50px;top:-26px;left:14px;"></div><div class="cb2" style="width:42px;height:42px;top:-22px;left:46px;"></div><div class="cb3" style="width:32px;height:32px;top:-16px;left:76px;"></div></div></div>
  <div class="cloud cloud2" aria-hidden="true"><div class="cb" style="width:90px;height:28px;"><div class="cb1" style="width:38px;height:38px;top:-20px;left:10px;"></div><div class="cb2" style="width:30px;height:30px;top:-16px;left:36px;"></div><div class="cb3" style="width:24px;height:24px;top:-12px;left:60px;"></div></div></div>

  <model-viewer id="happyCharLanding" src="Happy.glb" autoplay shadow-intensity="0" exposure="1.0" interaction-prompt="none" disable-zoom disable-pan alt="Happy Character"></model-viewer>

  <div class="panel" id="panel">
    <h1 class="title" id="mainTitle"><span class="num">123</span>Let's Learn English Under The Big Tree</h1>
    <div class="row" id="roleRow">
      <button class="btn btn-soft role-btn" data-role="student" data-i18n="role.student">طالب</button>
      <button class="btn btn-soft role-btn" data-role="teacher" data-i18n="role.teacher">معلم</button>
      <button class="btn btn-soft role-btn" data-role="parent" data-i18n="role.parent">ولي أمر</button>
    </div>
    <div class="row" id="gradeRow">
      <button class="btn btn-soft grade-btn" data-grade="1">1</button>
      <button class="btn btn-soft grade-btn" data-grade="2">2</button>
      <button class="btn btn-soft grade-btn" data-grade="3">3</button>
      <button class="btn btn-soft grade-btn" data-grade="4">4</button>
      <button class="btn btn-soft grade-btn" data-grade="5">5</button>
    </div>
    <input id="schoolInput" class="field" type="text" placeholder="اكتب اسم المدرسة" data-i18n-placeholder="school">
    <div class="tools">
      <button class="tool-btn" id="villageTourBtn">🗺️ جولة في القرية</button>
    </div>
    <div style="margin-top:12px;"><button id="startBtn" class="btn btn-start">START</button></div>
  </div>
</div>

<div id="dreamLandView" aria-hidden="true">
  <model-viewer id="dreamLandViewer" src="2dream_land-v2.glb" shadow-intensity="0.8" exposure="0.9" environment-image="neutral" tone-mapping="neutral" camera-orbit="20deg 82deg 6.5m" camera-target="-1.8m 1.2m 0.5m" min-camera-orbit="auto auto 3m" max-camera-orbit="auto auto 14m" field-of-view="65deg" interaction-prompt="none" disable-zoom disable-pan alt="Dream Land Village 3D"></model-viewer>
  <div id="villageBlueLayer" aria-hidden="true"></div>
  <model-viewer id="jojoCharVillage" src="jojo.glb" autoplay shadow-intensity="0" exposure="0.9" interaction-prompt="none" disable-zoom disable-pan alt="Jojo Character"></model-viewer>
  <model-viewer id="happyCharVillage" src="Happy.glb" autoplay shadow-intensity="0" exposure="0.7" camera-orbit="0deg 80deg 3.8m" camera-target="0m 0.8m 0m" field-of-view="20deg" interaction-prompt="none" disable-zoom disable-pan alt="Happy Character Village"></model-viewer>
  <div class="stars" aria-hidden="true"></div>
  <div class="lantern ln-a" aria-hidden="true"></div><div class="lantern ln-b" aria-hidden="true"></div><div class="lantern ln-c" aria-hidden="true"></div><div class="lantern ln-d" aria-hidden="true"></div><div class="lantern ln-e" aria-hidden="true"></div>
  <div id="dreamLoading" aria-live="polite"><div class="loading-icon">🎉</div><div class="loading-text" id="loadingText">جاري تحميل القرية...</div><div class="loading-sub" id="loadingSub">✨ استعدوا للمغامرة! ✨</div><div class="loading-dots"><span></span><span></span><span></span></div></div>
  <div id="dreamLandFallback">تعذر تحميل الملف — تأكدي أن 2dream_land-v2.glb موجود بجانب الصفحة.</div>
</div>

<div id="tourControls"><button id="backBtn" class="tour-btn" data-i18n="back">رجوع</button><button id="exitBtn" class="tour-btn" data-i18n="exit">خروج</button></div>
<div id="sideNav"><button class="side-btn sb-tour" onclick="beepGlobal()">🗺️ خذ جولة</button><button class="side-btn sb-lib" onclick="beepGlobal()">📚 حديقة القصص</button><button class="side-btn sb-school" onclick="beepGlobal()">🏫 المدرسة</button><button class="side-btn sb-shop" onclick="beepGlobal()">🎁 دكان المفاجآت</button></div>
<div id="moveControls"><button id="moveUp" class="move-btn">↑</button><button id="moveLeft" class="move-btn">←</button><button id="moveRight" class="move-btn">→</button><button id="moveDown" class="move-btn">↓</button></div>

<div id="bookReader"><div class="reader-panel"><div class="reader-top"><span id="readerTitle">كتاب القصة</span><div class="reader-actions"><button id="prevPageBtn">◀️</button><button id="nextPageBtn">▶️</button><button id="closeReaderBtn">✕</button></div></div><iframe id="readerFrame" title="Story Reader"></iframe></div></div>

<audio id="bgSound" preload="none" loop><source src="background.mp3" type="audio/mpeg"></audio>
<audio id="clickSound" preload="none"><source src="notification_sound.mp3" type="audio/mpeg"><source src="صوت النقر.mp3" type="audio/mpeg"></audio>
<audio id="cheerSound" preload="none"><source src="cheering.mp3" type="audio/mpeg"></audio>
<audio id="happySound" preload="auto" loop><source src="Jojo_waiting_sound.mp3" type="audio/mpeg"></audio>

<script>
const panel=document.getElementById('panel');
const landingScene=document.getElementById('landingScene');
const dreamView=document.getElementById('dreamLandView');
const dreamViewer=document.getElementById('dreamLandViewer');
const dreamLoad=document.getElementById('dreamLoading');
const dreamFall=document.getElementById('dreamLandFallback');
const tourCtrl=document.getElementById('tourControls');
const sideNav=document.getElementById('sideNav');
const moveCtrl=document.getElementById('moveControls');
const bookReader=document.getElementById('bookReader');
const readerFrame=document.getElementById('readerFrame');
const clickSound=document.getElementById('clickSound');
const bgSound=document.getElementById('bgSound');
const cheerSound=document.getElementById('cheerSound');
const happySnd=document.getElementById('happySound');
let currentLang='ar'; let currentBookPath=''; let currentBookPage=1; const cam={x:2.2,z:-1.8}; let moveLocked=false;
const dict={ar:{'role.student':'طالب','role.teacher':'معلم','role.parent':'ولي أمر','school':'اكتب اسم المدرسة','back':'رجوع','exit':'خروج','loading':'جاري تحميل القرية...','adventure':'✨ استعدوا للمغامرة! ✨'},en:{'role.student':'Student','role.teacher':'Teacher','role.parent':'Parent','school':'Enter school name','back':'Back','exit':'Exit','loading':'Loading the village...','adventure':'✨ Get ready for the adventure! ✨'}};
function beep(){if(clickSound){try{clickSound.currentTime=0;clickSound.play().catch(()=>{});}catch(_){}}}
function beepGlobal(){beep();}
function applyLang(lang){currentLang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=dict[lang][el.dataset.i18n]||el.textContent);document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=dict[lang][el.dataset.i18nPlaceholder]||el.placeholder);document.getElementById('mainTitle').innerHTML=`<span class="num">123</span>Let's Learn English Under The Big Tree`;}
document.querySelectorAll('.role-btn').forEach(b=>b.addEventListener('click',()=>{beep();document.querySelectorAll('.role-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}));
document.querySelectorAll('.grade-btn').forEach(b=>b.addEventListener('click',()=>{beep();document.querySelectorAll('.grade-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}));
document.getElementById('arBtn').addEventListener('click',()=>{beep();document.getElementById('arBtn').classList.add('selected');document.getElementById('enBtn').classList.remove('selected');applyLang('ar');});
document.getElementById('enBtn').addEventListener('click',()=>{beep();document.getElementById('enBtn').classList.add('selected');document.getElementById('arBtn').classList.remove('selected');applyLang('en');});
function openVillage(){beep();if(happySnd){try{happySnd.pause();happySnd.currentTime=0;}catch(_){}}if(cheerSound){try{cheerSound.currentTime=0;cheerSound.play().catch(()=>{});cheerSound.onended=()=>{if(bgSound){try{bgSound.pause();bgSound.currentTime=0;}catch(_){}}};}catch(_){}}const L=currentLang;document.getElementById('loadingText').textContent=dict[L].loading;document.getElementById('loadingSub').textContent=dict[L].adventure;document.getElementById('backBtn').textContent=dict[L].back;document.getElementById('exitBtn').textContent=dict[L].exit;panel.classList.add('hidden');landingScene.style.display='none';document.getElementById('arBtn').style.display='none';document.getElementById('enBtn').style.display='none';dreamView.classList.add('show');dreamLoad.classList.add('show');tourCtrl.classList.add('show');sideNav.classList.add('show');updateCam();}
document.getElementById('villageTourBtn').addEventListener('click',()=>{beep();window.location.href='villagetour.html';});
document.getElementById('startBtn').addEventListener('click',()=>{beep();window.location.href='palmtreeactivities.html';});
function goBack(){beep();dreamView.classList.remove('show');landingScene.style.display='block';panel.classList.remove('hidden');tourCtrl.classList.remove('show');sideNav.classList.remove('show');moveCtrl.classList.remove('show');bookReader.classList.remove('show');document.getElementById('arBtn').style.display='';document.getElementById('enBtn').style.display='';if(bgSound){try{bgSound.pause();}catch(_){}}}
document.getElementById('backBtn').addEventListener('click',goBack);document.getElementById('exitBtn').addEventListener('click',()=>{goBack();try{window.close();}catch(_){}});
if(dreamViewer){dreamViewer.addEventListener('load',()=>{dreamFall.style.display='none';dreamLoad.classList.remove('show');});dreamViewer.addEventListener('error',()=>{dreamFall.style.display='block';dreamLoad.classList.remove('show');});}
function updateCam(){if(!dreamViewer)return;dreamViewer.cameraTarget=`${cam.x.toFixed(2)}m 2.8m ${cam.z.toFixed(2)}m`;}
function step(dx,dz){if(moveLocked)return;moveLocked=true;cam.x=Math.max(-3.5,Math.min(3.5,cam.x+dx));cam.z=Math.max(-3.5,Math.min(3.5,cam.z+dz));updateCam();beep();setTimeout(()=>{moveLocked=false;},120);} 
document.getElementById('moveUp').addEventListener('click',()=>step(0,-0.22));document.getElementById('moveDown').addEventListener('click',()=>step(0,0.22));document.getElementById('moveLeft').addEventListener('click',()=>step(-0.22,0));document.getElementById('moveRight').addEventListener('click',()=>step(0.22,0));
document.getElementById('prevPageBtn').addEventListener('click',()=>{if(!currentBookPath)return;currentBookPage=Math.max(1,currentBookPage-1);readerFrame.src=`${currentBookPath}#page=${currentBookPage}`;});
document.getElementById('nextPageBtn').addEventListener('click',()=>{if(!currentBookPath)return;currentBookPage++;readerFrame.src=`${currentBookPath}#page=${currentBookPage}`;});
document.getElementById('closeReaderBtn').addEventListener('click',()=>{bookReader.classList.remove('show');readerFrame.src='about:blank';currentBookPath='';currentBookPage=1;});
applyLang('ar');
const happySound=document.getElementById('happySound');document.addEventListener('click',function startHappySound(){if(happySound){try{happySound.volume=0.3;happySound.play().catch(()=>{});}catch(_){}}document.removeEventListener('click',startHappySound);},{once:true});
</script>
<script src="sound.js"></script>
</body>
</html>
