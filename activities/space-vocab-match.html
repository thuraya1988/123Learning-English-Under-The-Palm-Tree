<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Vocabulary Match — Unit 3, Lesson 1</title>
<style>
  :root{
    --navy:#0B1E3D; --navy2:#122a52; --sand:#E8B04B; --sand-dim:#C8912F;
    --teal:#2FD1C4; --card:#16294f; --ink:#F4F7FB; --muted:#9FB0D0;
    --good:#3FCB7E; --bad:#E85D5D;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Baloo 2', system-ui, sans-serif; background:
      radial-gradient(1200px 700px at 15% -10%, #1a3566 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #1a3566 0%, transparent 55%),
      var(--navy);
    color:var(--ink); min-height:100%; overflow-x:hidden;
  }
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .stars span{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.6;}
  header{position:relative; z-index:1; text-align:center; padding:28px 16px 10px;}
  h1{font-family:'Baloo 2', system-ui, sans-serif; font-weight:800; font-size:clamp(22px,5vw,34px); margin:0 0 6px; letter-spacing:.3px;}
  .sub{color:var(--muted); font-size:14px; margin:0;}
  .wrap{max-width:900px; margin:0 auto; padding:10px 16px 60px; position:relative; z-index:1;}
  .scorebar{display:flex; justify-content:center; gap:22px; margin:14px 0 22px; font-size:15px;}
  .scorebar div{background:var(--card); border:1px solid #23386a; border-radius:12px; padding:8px 16px;}
  .scorebar b{color:var(--sand);}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media(max-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{
    aspect-ratio:1/1; border-radius:16px; border:2px solid #23386a; background:var(--card);
    display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    font-size:15px; font-weight:600; padding:8px; user-select:none;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .tile:hover{transform:translateY(-3px);}
  .tile.flipped{background:var(--navy2); border-color:var(--teal); color:var(--ink);}
  .tile.matched{background:linear-gradient(160deg,#134a3d,#0e3b31); border-color:var(--good); color:#bdf5d6; cursor:default; transform:none;}
  .tile .emoji{font-size:34px; display:block; margin-bottom:4px;}
  .tile.hidden-face{color:transparent;}
  .tile.hidden-face .emoji{display:none;}
  .tile.hidden-face::after{content:"✦"; color:var(--sand-dim); font-size:22px;}
  .msg{text-align:center; min-height:28px; margin-top:18px; font-size:16px; font-weight:700;}
  .msg.good{color:var(--good);}
  .msg.bad{color:var(--bad);}
  .win{
    display:none; text-align:center; margin-top:24px; background:var(--card); border:1px solid var(--sand-dim);
    border-radius:16px; padding:22px;
  }
  .win.show{display:block;}
  .win h2{margin:0 0 8px; color:var(--sand); font-size:22px;}
  button.restart{
    margin-top:14px; background:var(--teal); color:#04211d; border:none; border-radius:12px;
    padding:12px 22px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
  }
  button.restart:active{transform:scale(.97);}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:10px 16px 30px; position:relative; z-index:1;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <h1>🚀 Space Vocabulary Match</h1>
  <p class="sub">Unit 3: Let's Explore! · Lesson 1 · Tap two cards to find each matching pair</p>
</header>

<div class="wrap">
  <div class="scorebar">
    <div>Pairs found: <b id="found">0</b> / 12</div>
    <div>Tries: <b id="tries">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg"></p>
  <div class="win" id="win">
    <h2>🌟 Well done, explorer! 🌟</h2>
    <p id="winText"></p>
    <button class="restart" onclick="init()">Play again</button>
  </div>
</div>

<footer>Grade 5A · English · Then and Now → Let's Explore! interactive activities</footer>

<script>
const WORDS = [
  {w:"Sun", e:"☀️"}, {w:"Moon", e:"🌙"}, {w:"Earth", e:"🌍"}, {w:"planet", e:"🪐"},
  {w:"star", e:"⭐"}, {w:"solar system", e:"🌌"}, {w:"telescope", e:"🔭"}, {w:"comet", e:"☄️"},
  {w:"rocket", e:"🚀"}, {w:"space station", e:"🛰️"}, {w:"spacesuit", e:"👨‍🚀"}, {w:"satellite", e:"📡"},
];

let cards = [], first = null, second = null, lock = false, foundCount = 0, tries = 0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function buildStars(){
  const box = document.getElementById('stars');
  box.innerHTML = "";
  for(let i=0;i<70;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    s.style.opacity = (0.2+Math.random()*0.7).toFixed(2);
    box.appendChild(s);
  }
}

function init(){
  document.getElementById('win').classList.remove('show');
  foundCount = 0; tries = 0; first = null; second = null; lock = false;
  document.getElementById('found').textContent = 0;
  document.getElementById('tries').textContent = 0;
  document.getElementById('msg').textContent = "";
  document.getElementById('msg').className = "msg";

  let deck = [];
  WORDS.forEach((item, idx) => {
    deck.push({ id: idx, type:'word', label:item.w });
    deck.push({ id: idx, type:'emoji', label:item.e });
  });
  deck = shuffle(deck);

  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  deck.forEach((c, i) => {
    const t = document.createElement('div');
    t.className = "tile hidden-face";
    t.dataset.id = c.id;
    t.dataset.type = c.type;
    t.dataset.index = i;
    t.innerHTML = c.type === 'emoji'
      ? `<span class="emoji">${c.label}</span>`
      : `<span>${c.label}</span>`;
    t.addEventListener('click', () => onTileClick(t));
    grid.appendChild(t);
  });
}

function onTileClick(t){
  if(lock || t.classList.contains('matched') || t === first) return;
  t.classList.remove('hidden-face');
  t.classList.add('flipped');

  if(!first){ first = t; return; }

  second = t;
  lock = true;
  tries++; document.getElementById('tries').textContent = tries;

  const isMatch = first.dataset.id === second.dataset.id;
  const msg = document.getElementById('msg');

  setTimeout(() => {
    if(isMatch){
      first.classList.add('matched'); second.classList.add('matched');
      first.classList.remove('flipped'); second.classList.remove('flipped');
      foundCount++;
      document.getElementById('found').textContent = foundCount;
      msg.textContent = "✓ Great! That's a match.";
      msg.className = "msg good";
      if(foundCount === WORDS.length){
        document.getElementById('winText').textContent =
          `You matched all ${WORDS.length} space words in ${tries} tries!`;
        document.getElementById('win').classList.add('show');
      }
    } else {
      msg.textContent = "Not quite — try again!";
      msg.className = "msg bad";
      first.classList.add('hidden-face'); second.classList.add('hidden-face');
      first.classList.remove('flipped'); second.classList.remove('flipped');
    }
    first = null; second = null; lock = false;
  }, 700);
}

buildStars();
init();
</script>
</body>
</html>
