<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الوحدة الثانية - متوسطين | Unit 2 Intermediate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC;--paper:#FFFFFF;--ink:#243138;--ink-soft:#5B6B72;
  --primary:#4A5FBF;--primary-dark:#333F8C;--primary-soft:#E4E7F7;
  --accent:#E8A23D;--accent-soft:#FBEAD0;--success:#3E8E5B;--success-soft:#DCEEDD;
  --error:#B85C42;--error-soft:#F5E1DA;--radius:18px;--radius-sm:12px;--shadow:0 10px 28px rgba(36,49,56,.09);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Lexend',sans-serif;display:inline-block;}
h1,h2,h3,.heading{font-family:'Baloo 2','Tajawal',sans-serif;}
#app{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.topbar .unit-label{font-size:13px;color:var(--ink-soft);font-weight:500;}
.progress-dots{display:flex;gap:8px;}
.dot{width:11px;height:11px;border-radius:50%;background:#DDD8C8;transition:background .3s, transform .3s;}
.dot.done{background:var(--success);}
.dot.active{background:var(--primary);transform:scale(1.3);}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;margin-bottom:16px;}
.title{font-size:22px;font-weight:700;margin:0 0 4px;}
.title .en{font-size:16px;color:var(--ink-soft);font-weight:600;display:block;margin-top:2px;}
.subtitle{font-size:15px;color:var(--ink-soft);margin:0 0 18px;line-height:1.7;}
.instruction{background:var(--primary-soft);border-radius:var(--radius-sm);padding:13px 16px;font-size:15px;margin-bottom:20px;line-height:1.7;}
.instruction .en{font-size:13.5px;color:var(--primary-dark);display:block;margin-top:5px;}
label{display:block;font-size:14px;margin:16px 0 6px;font-weight:500;}
input[type=text]{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:2px solid #E3DFD1;font-size:16px;font-family:'Tajawal',sans-serif;background:#FCFBF7;color:var(--ink);}
input[type=text]:focus{outline:3px solid var(--primary-soft);border-color:var(--primary);}
button{font-family:inherit;cursor:pointer;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;padding:15px 26px;border-radius:999px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(74,95,191,.25);transition:transform .15s, background .2s, opacity .2s;width:100%;margin-top:6px;}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none;}
.hero-row{display:flex;justify-content:center;gap:10px;margin-bottom:10px;font-size:34px;}

.mcq-progress{font-size:13px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
.mcq-sentence{font-size:17px;line-height:1.9;margin-bottom:18px;text-align:center;}
.mcq-sentence .blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--primary);margin:0 4px;font-weight:700;color:var(--primary);}
.mcq-feedback{text-align:center;margin-top:14px;font-size:14px;min-height:20px;}
.mcq-feedback.ok{color:var(--success);font-weight:600;}
.mcq-feedback.no{color:var(--error);font-weight:600;}

.typed-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
.typed-input{flex:1;min-width:140px;max-width:220px;padding:12px 16px;border-radius:999px;border:2px solid #E3DFD1;font-size:16px;text-align:center;background:#FCFBF7;}
.typed-input:focus{outline:3px solid var(--primary-soft);border-color:var(--primary);}
.typed-input.correct-input{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.typed-input.wrong-input{border-color:var(--error);background:var(--error-soft);color:var(--error);}
.typed-row .btn{width:auto;margin-top:0;padding:12px 22px;flex-shrink:0;}

.builder-num{font-size:13px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
.builder-slots{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:12px;border:2px dashed #D8D2BE;border-radius:var(--radius-sm);margin-bottom:16px;justify-content:center;align-items:center;}
.builder-slots .placeholder{color:#B9B3A0;font-size:14px;}
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--primary);background:#fff;color:var(--primary);font-size:14.5px;font-weight:600;}
.chip.placed{background:var(--primary);color:#fff;}
.chip.locked-correct{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.chip.locked-wrong{border-color:var(--error);background:var(--error-soft);color:var(--error);}
.builder-feedback{text-align:center;margin-top:14px;font-size:14px;min-height:40px;}
.builder-feedback .correct-sentence{color:var(--ink-soft);font-size:14px;margin-top:4px;}

.passage-box{background:var(--bg);border-radius:var(--radius-sm);padding:16px;margin-bottom:18px;}
.passage-text{font-size:16px;line-height:1.9;}
.passage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tf-row{background:var(--paper);border:2px solid #E3DFD1;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
.tf-sentence{font-size:15px;margin-bottom:10px;}
.tf-btns{display:flex;gap:10px;}
.tf-btn{flex:1;padding:10px;border-radius:10px;border:2px solid #E3DFD1;background:#fff;font-weight:700;font-size:14px;}
.tf-btn.correct{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.tf-btn.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error);}
.tf-btn:disabled{cursor:default;}
.tf-row.answered{opacity:.92;}
.followup-box{background:var(--paper);border:2px solid #E3DFD1;border-radius:var(--radius-sm);padding:14px;margin-top:6px;}
.speak-btn{border:none;background:none;font-size:16px;cursor:pointer;line-height:1;padding:0;color:inherit;}

.sort-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
.sort-word{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:2px solid var(--primary);background:#fff;color:var(--primary);font-size:15px;font-weight:600;}
.sort-word.selected{background:var(--primary);color:#fff;}
.sort-word.placed{opacity:.3;pointer-events:none;}
.sort-buckets{display:flex;gap:12px;}
.bucket{flex:1;min-height:130px;border:2px dashed #D8D2BE;border-radius:var(--radius-sm);padding:10px;text-align:center;transition:border-color .2s, background .2s;}
.bucket.target{border-color:var(--primary);background:var(--primary-soft);}
.bucket-label{font-weight:700;margin-bottom:2px;color:var(--primary);font-size:14.5px;}
.bucket-sub{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.bucket-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.bucket-chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;}
.bucket-chip.correct{background:var(--success-soft);color:var(--success);}
.sort-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px;min-height:18px;}

.result-header{text-align:center;margin-bottom:6px;}
.result-score{font-size:54px;font-weight:800;color:var(--primary);text-align:center;margin:4px 0;}
.result-msg{text-align:center;font-size:16px;line-height:1.8;margin-bottom:22px;}
.result-name{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:2px;}
.result-breakdown{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg);border-radius:var(--radius-sm);font-size:14px;}
.result-row .en{font-size:13px;color:var(--ink-soft);}

.hidden{display:none !important;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important; transition-duration:.001s !important;}}
@media (max-width:380px){.result-score{font-size:42px;}.card{padding:20px 15px;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   الوحدة الثانية - مستوى المتوسطين | Unit 2 (Then and Now) - Intermediate
   Team Together 5A - Oman MOE
   ============================================================ */
const JOTFORM_FORM_ID = "262434452585057";
const REPORT_UNIT = "Unit 2 - Intermediate";
function sendReport(name, cls, percent) {
  try {
    const studentName = (typeof scormGetStudentName === "function" && scormGetStudentName()) || name || "بدون اسم";
    const studentId = typeof supportGetStudentId === "function" ? supportGetStudentId(studentName, cls) : "";
    const attempt = typeof scormNextAttempt === "function" ? scormNextAttempt(REPORT_UNIT) : 1;
    const duration = typeof scormGetElapsedSeconds === "function" ? scormGetElapsedSeconds() : 0;
    const details = { version: 2, studentId, studentName, cls, level: "intermediate", unit: REPORT_UNIT, percent, raw: totalScore(), max: totalMax(), attempt, duration, scores: state.scores, skillMax: state.max, completedAt: new Date().toISOString() };
    if (typeof scormSetDetailedProgress === "function") scormSetDetailedProgress(details);
    const fd = new FormData();
    fd.append("formID", JOTFORM_FORM_ID);
    fd.append("submitSource", "intermediate-scorm");
    fd.append("q2_q2_textbox0", studentName);
    fd.append("q3_q3_textbox1", cls || "غير محدد");
    fd.append("q4_q4_textbox2", REPORT_UNIT);
    fd.append("q5_q5_textbox3", percent + "%");
    fd.append("q7_input", studentId);
    fd.append("q8_input", "intermediate");
    fd.append("q9_input", String(attempt));
    fd.append("q10_input", String(duration));
    fd.append("q11_input", JSON.stringify(details));
    fd.append("q12_input", "مكتمل");
    fetch("https://submit.jotform.com/submit/" + JOTFORM_FORM_ID, { method: "POST", mode: "no-cors", keepalive: true, body: fd }).catch(function () {});
  } catch (e) {}
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function shuffleUntilDifferent(arr) { if (arr.length < 2) return arr.slice(); let a = shuffle(arr); let tries = 0; while (a.join("|") === arr.join("|") && tries < 8) { a = shuffle(arr); tries++; } return a; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function speak(text) { if (!("speechSynthesis" in window)) return; try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 0.85; window.speechSynthesis.speak(u); } catch (e) {} }
function normalizeAnswer(s) { return String(s).trim().toLowerCase().replace(/[.!?]+$/, ""); }

/* ---------- content data ---------- */
const TECH_TYPED = [
  { pre: "A small device you can carry, with a touchscreen, bigger than a phone. = ", post: "", answer: "tablet" },
  { pre: "You use this to type words on a computer. = ", post: "", answer: "keyboard" },
  { pre: "You click and move this to point at things on a screen. = ", post: "", answer: "mouse" },
  { pre: "You send this using the internet instead of paper. = ", post: "", answer: "email" },
  { pre: "People used to send this on paper before email was common. = ", post: "", answer: "letter" },
  { pre: "A machine at home you use to talk to people - it wasn't mobile. = ", post: "", answer: "telephone" },
  { pre: "You carry this in your pocket to call, text, and use apps. = ", post: "", answer: "mobile phone" },
  { pre: "The machine that runs programs, usually sits on a desk. = ", post: "", answer: "computer" }
];

const PASTSIMPLE_TYPED = [
  { pre: "Yesterday, I ", post: " (play) football with my friends.", answer: "played" },
  { pre: "Last week, she ", post: " (write) a letter to her granny.", answer: "wrote" },
  { pre: "Ten years ago, we ", post: " (have) a big computer at home.", answer: "had" },
  { pre: "Yesterday, he ", post: " (clean) his room.", answer: "cleaned" },
  { pre: "Last year, they ", post: " (go) to Salalah.", answer: "went" }
];

const COULD = [
  { answer: ["I", "could", "ride a bike"], distractor: "swim" },
  { answer: ["She", "couldn't", "tie a shoelace"], distractor: "read" },
  { answer: ["He", "could", "make a sandwich"], distractor: "cook" },
  { answer: ["They", "couldn't", "win the race"], distractor: "run" }
];

const PASSAGE = "Ten years ago, Ali didn't have a mobile phone. He wrote letters to his cousin instead. Now Ali has a mobile phone, and he sends emails every day. He says the mobile phone is faster, but he still likes writing letters sometimes.";
const READING_TF = [
  { s: "Ali has a mobile phone now.", answer: true },
  { s: "Ten years ago, Ali sent emails.", answer: false },
  { s: "Ali writes letters to his cousin.", answer: true },
  { s: "Ali thinks the mobile phone is slower.", answer: false }
];
const READING_TYPED = { pre: "What does Ali still like doing sometimes? He still likes writing ", post: ".", answer: "letters" };

const VERBS = [
  { word: "play", group: "regular" }, { word: "watch", group: "regular" }, { word: "clean", group: "regular" }, { word: "talk", group: "regular" }, { word: "jump", group: "regular" },
  { word: "have", group: "irregular" }, { word: "go", group: "irregular" }, { word: "write", group: "irregular" }, { word: "eat", group: "irregular" }, { word: "see", group: "irregular" }
];
const VERB_BUCKETS = [ { id: "regular", label: "+ed", sub: "played, watched..." }, { id: "irregular", label: "irregular", sub: "went, had..." } ];

/* ---------- state ---------- */
const state = {
  screen: "start", name: "", cls: "",
  scores: { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 },
  max: { a1: TECH_TYPED.length, a2: PASTSIMPLE_TYPED.length, a3: COULD.length, a4: READING_TF.length + 1, a5: VERBS.length }
};
function totalScore() { return state.scores.a1 + state.scores.a2 + state.scores.a3 + state.scores.a4 + state.scores.a5; }
function totalMax() { return state.max.a1 + state.max.a2 + state.max.a3 + state.max.a4 + state.max.a5; }
function goTo(screen) { state.screen = screen; render(); window.scrollTo(0, 0); }

function renderTopbar(app, activeIndex) {
  const bar = el("div", "topbar");
  const label = el("div", "unit-label"); label.innerHTML = 'الوحدة الثانية <span class="en">Unit 2 \u00b7 Intermediate</span>';
  const dots = el("div", "progress-dots");
  for (let i = 1; i <= 5; i++) { const d = el("div", "dot"); if (i < activeIndex) d.classList.add("done"); if (i === activeIndex) d.classList.add("active"); dots.appendChild(d); }
  bar.appendChild(label); bar.appendChild(dots); app.appendChild(bar);
}
function nextButton(app, label, enabledGetter, onClick) {
  const btn = el("button", "btn"); btn.type = "button"; btn.innerHTML = label; btn.disabled = !enabledGetter();
  btn.addEventListener("click", onClick); app.appendChild(btn); return btn;
}

/* ================= START ================= */
function renderStartScreen(app) {
  const card = el("div", "card");
  const heroRow = el("div", "hero-row"); heroRow.textContent = "💻 ✉️ ⌨️ 📱";
  card.appendChild(heroRow);
  const title = el("div", "title heading"); title.innerHTML = 'الوحدة الثانية <span class="en">Then and Now \u00b7 Intermediate</span>'; card.appendChild(title);
  const sub = el("div", "subtitle");
  sub.innerHTML = '<span class="en">Team Together 5A</span> - مستوى المتوسطين<br>' + "بنراجع التقنية والماضي البسيط - تكتبين إجاباتك بنفسك.";
  card.appendChild(sub);
  const nameLabel = el("label", "", "اسمك"); nameLabel.setAttribute("for", "nameInput"); card.appendChild(nameLabel);
  const nameInput = document.createElement("input"); nameInput.type = "text"; nameInput.id = "nameInput"; nameInput.placeholder = "اكتبي اسمك هنا"; nameInput.value = state.name;
  card.appendChild(nameInput);
  const clsLabel = el("label", "", "صفك"); clsLabel.setAttribute("for", "clsInput"); card.appendChild(clsLabel);
  const clsInput = document.createElement("input"); clsInput.type = "text"; clsInput.id = "clsInput"; clsInput.placeholder = "مثال: 5/2"; clsInput.value = state.cls;
  card.appendChild(clsInput);
  app.appendChild(card);
  const startBtn = el("button", "btn"); startBtn.type = "button"; startBtn.innerHTML = 'ابدئي <span class="en">Start</span> 🚀';
  startBtn.addEventListener("click", function () { state.name = nameInput.value.trim(); state.cls = clsInput.value.trim(); goTo("a1"); });
  app.appendChild(startBtn);
  if (typeof scormGetStudentName === "function") { const nm = scormGetStudentName(); if (nm && !state.name) { state.name = nm; nameInput.value = nm; } }
}

/* ---------- typed fill-in-blank renderer ---------- */
function renderTypedActivity(app, cfg) {
  renderTopbar(app, cfg.stepIndex);
  const card = el("div", "card");
  const title = el("div", "title heading"); title.innerHTML = cfg.titleHtml; card.appendChild(title);
  const instr = el("div", "instruction"); instr.innerHTML = cfg.instrHtml; card.appendChild(instr);
  let qIndex = 0; const qWrap = el("div", ""); card.appendChild(qWrap); app.appendChild(card);
  const nextBtn = nextButton(app, cfg.nextLabel, function () { return false; }, function () { qIndex++; if (qIndex >= cfg.items.length) cfg.onNext(); else renderQuestion(); });
  nextBtn.classList.add("hidden");
  function renderQuestion() {
    qWrap.innerHTML = ""; nextBtn.classList.add("hidden"); nextBtn.disabled = true;
    const progress = el("div", "mcq-progress"); progress.innerHTML = '<span class="en">' + (qIndex + 1) + " / " + cfg.items.length + "</span>"; qWrap.appendChild(progress);
    const item = cfg.items[qIndex];
    const sentence = el("div", "mcq-sentence en"); sentence.innerHTML = escapeHtml(item.pre) + '<span class="blank">____</span>' + escapeHtml(item.post); qWrap.appendChild(sentence);
    const row = el("div", "typed-row");
    const input = document.createElement("input"); input.type = "text"; input.className = "typed-input en"; input.setAttribute("dir", "ltr"); input.autocomplete = "off"; input.spellcheck = false;
    const checkBtn = document.createElement("button"); checkBtn.type = "button"; checkBtn.className = "btn"; checkBtn.innerHTML = 'تأكيد <span class="en">Check</span>';
    row.appendChild(input); row.appendChild(checkBtn); qWrap.appendChild(row);
    const feedback = el("div", "mcq-feedback"); qWrap.appendChild(feedback);
    let answered = false;
    function doCheck() {
      if (answered) return; const val = input.value.trim(); if (!val) { input.focus(); return; }
      answered = true; const correct = normalizeAnswer(val) === normalizeAnswer(item.answer);
      input.disabled = true; checkBtn.disabled = true;
      if (correct) { input.classList.add("correct-input"); state.scores[cfg.scoreKey]++; feedback.textContent = "صحيح! أحسنتِ 🌿"; feedback.className = "mcq-feedback ok"; }
      else {
        input.classList.add("wrong-input"); feedback.innerHTML = "قريبة! الصح: ";
        const fs = document.createElement("span"); fs.className = "en"; fs.style.fontWeight = "700"; fs.textContent = item.answer; feedback.appendChild(fs); feedback.className = "mcq-feedback no";
      }
      nextBtn.classList.remove("hidden"); nextBtn.disabled = false;
    }
    checkBtn.addEventListener("click", doCheck);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doCheck(); } });
    input.focus();
  }
  renderQuestion();
}

/* ================= ACTIVITY 1 - tech vocab, typed ================= */
function renderActivity1(app) {
  renderTypedActivity(app, {
    stepIndex: 1, titleHtml: 'مفردات التقنية <span class="en">Technology</span>',
    instrHtml: "اقرئي الوصف واكتبي الكلمة المناسبة." + '<span class="en">Read the clue and type the word.</span>',
    items: TECH_TYPED, scoreKey: "a1", nextLabel: 'التالي <span class="en">Next</span> ←', onNext: function () { goTo("a2"); }
  });
}
/* ================= ACTIVITY 2 - past simple, typed ================= */
function renderActivity2(app) {
  renderTypedActivity(app, {
    stepIndex: 2, titleHtml: 'الماضي البسيط <span class="en">Past Simple</span>',
    instrHtml: "اكتبي الفعل بالماضي الصحيح." + '<span class="en">Type the correct past tense form.</span>',
    items: PASTSIMPLE_TYPED, scoreKey: "a2", nextLabel: 'التالي <span class="en">Next</span> ←', onNext: function () { goTo("a3"); }
  });
}

/* ================= ACTIVITY 3 - could/couldn't builder with distractor ================= */
function renderActivity3(app) {
  renderTopbar(app, 3);
  const card = el("div", "card");
  const title = el("div", "title heading"); title.innerHTML = 'كنت أقدر... <span class="en">Could / Couldn\u2019t</span>'; card.appendChild(title);
  const instr = el("div", "instruction"); instr.innerHTML = "رتّبي الكلمات - فيه كلمة زايدة!" + '<span class="en">One extra word won\u2019t be needed.</span>'; card.appendChild(instr);
  let qIndex = 0; const qWrap = el("div", ""); card.appendChild(qWrap); app.appendChild(card);
  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return false; }, function () { qIndex++; if (qIndex >= COULD.length) goTo("a4"); else renderQuestion(); });
  nextBtn.classList.add("hidden");
  function renderQuestion() {
    qWrap.innerHTML = ""; nextBtn.classList.add("hidden");
    const num = el("div", "builder-num"); num.innerHTML = '<span class="en">' + (qIndex + 1) + " / " + COULD.length + "</span>"; qWrap.appendChild(num);
    const item = COULD[qIndex];
    let bank = shuffleUntilDifferent(item.answer.concat([item.distractor])); let built = []; let locked = false;
    const slots = el("div", "builder-slots"); const bankEl = el("div", "builder-bank"); const feedback = el("div", "builder-feedback");
    qWrap.appendChild(slots); qWrap.appendChild(bankEl); qWrap.appendChild(feedback);
    function draw() {
      slots.innerHTML = "";
      if (built.length === 0) { slots.appendChild(el("span", "placeholder", "...")); }
      else { built.forEach(function (w, i) { const c = document.createElement("button"); c.type = "button"; c.className = "chip placed en"; c.textContent = w; c.disabled = locked; c.addEventListener("click", function () { if (locked) return; built.splice(i, 1); bank.push(w); draw(); }); slots.appendChild(c); }); }
      bankEl.innerHTML = "";
      bank.forEach(function (w, i) {
        const c = document.createElement("button"); c.type = "button"; c.className = "chip en"; c.textContent = w; c.disabled = locked;
        c.addEventListener("click", function () { if (locked) return; bank.splice(i, 1); built.push(w); draw(); if (built.length === item.answer.length) checkAnswer(); });
        bankEl.appendChild(c);
      });
    }
    function checkAnswer() {
      const correct = built.join("|") === item.answer.join("|"); locked = true;
      if (correct) {
        state.scores.a3++; feedback.innerHTML = "ممتاز! جملة صحيحة 🎉"; feedback.className = "builder-feedback ok";
        Array.prototype.forEach.call(slots.children, function (c) { c.classList.add("locked-correct"); });
        nextBtn.classList.remove("hidden"); nextBtn.disabled = false;
      } else {
        feedback.innerHTML = "مو تمامًا. الجملة الصحيحة:";
        const cs = document.createElement("div"); cs.className = "correct-sentence en"; cs.textContent = item.answer.join(" ") + "."; feedback.appendChild(cs);
        Array.prototype.forEach.call(slots.children, function (c) { c.classList.add("locked-wrong"); });
        const retry = document.createElement("button"); retry.type = "button"; retry.className = "btn btn-ghost"; retry.style.marginTop = "10px";
        retry.innerHTML = 'حاولي مرة ثانية <span class="en">Try again</span>';
        retry.addEventListener("click", function () { built = []; bank = shuffleUntilDifferent(item.answer.concat([item.distractor])); locked = false; feedback.innerHTML = ""; feedback.className = "builder-feedback"; draw(); });
        feedback.appendChild(retry);
        nextBtn.classList.remove("hidden"); nextBtn.disabled = false;
      }
    }
    draw();
  }
  renderQuestion();
}

/* ================= ACTIVITY 4 - reading + TF + typed follow-up ================= */
function renderActivity4(app) {
  renderTopbar(app, 4);
  const card = el("div", "card");
  const title = el("div", "title heading"); title.innerHTML = 'اقرئي وجاوبي <span class="en">Read and Answer</span>'; card.appendChild(title);
  const instr = el("div", "instruction"); instr.innerHTML = "اقرئي، جاوبي صح/خطأ، وبعدين جاوبي بسؤال مكتوب." + '<span class="en">Read, mark True/False, then answer in writing.</span>'; card.appendChild(instr);
  const pbox = el("div", "passage-box");
  const phead = el("div", "passage-head");
  const plabel = el("span", "", ""); plabel.innerHTML = '<span class="en" style="font-weight:700;">Ten Years Ago</span>';
  const speakBtn = document.createElement("button"); speakBtn.type = "button"; speakBtn.className = "speak-btn"; speakBtn.setAttribute("aria-label", "استمعي"); speakBtn.textContent = "🔊";
  speakBtn.addEventListener("click", function () { speak(PASSAGE); });
  phead.appendChild(plabel); phead.appendChild(speakBtn); pbox.appendChild(phead);
  const ptext = el("div", "passage-text en", PASSAGE); pbox.appendChild(ptext); card.appendChild(pbox);
  const firstAttempt = {}; let answeredCount = 0;
  READING_TF.forEach(function (item, idx) {
    const row = el("div", "tf-row"); const s = el("div", "tf-sentence en", item.s); row.appendChild(s);
    const btns = el("div", "tf-btns");
    const trueBtn = document.createElement("button"); trueBtn.type = "button"; trueBtn.className = "tf-btn en"; trueBtn.textContent = "True";
    const falseBtn = document.createElement("button"); falseBtn.type = "button"; falseBtn.className = "tf-btn en"; falseBtn.textContent = "False";
    let answered = false;
    function handle(choice, btnEl) {
      if (answered) return; answered = true;
      const correct = choice === item.answer;
      if (!firstAttempt[idx]) { firstAttempt[idx] = true; if (correct) state.scores.a4++; }
      btnEl.classList.add(correct ? "correct" : "wrong");
      if (!correct) { const rightBtn = item.answer ? trueBtn : falseBtn; rightBtn.classList.add("correct"); }
      trueBtn.disabled = true; falseBtn.disabled = true; row.classList.add("answered"); answeredCount++; updateNext();
    }
    trueBtn.addEventListener("click", function () { handle(true, trueBtn); });
    falseBtn.addEventListener("click", function () { handle(false, falseBtn); });
    btns.appendChild(trueBtn); btns.appendChild(falseBtn); row.appendChild(btns); card.appendChild(row);
  });
  const fbox = el("div", "followup-box");
  const fsent = el("div", "mcq-sentence en"); fsent.style.marginBottom = "10px"; fsent.innerHTML = escapeHtml(READING_TYPED.pre) + '<span class="blank">____</span>' + escapeHtml(READING_TYPED.post);
  fbox.appendChild(fsent);
  const frow = el("div", "typed-row");
  const finput = document.createElement("input"); finput.type = "text"; finput.className = "typed-input en"; finput.setAttribute("dir", "ltr"); finput.autocomplete = "off"; finput.spellcheck = false;
  const fcheck = document.createElement("button"); fcheck.type = "button"; fcheck.className = "btn"; fcheck.innerHTML = 'تأكيد <span class="en">Check</span>';
  frow.appendChild(finput); frow.appendChild(fcheck); fbox.appendChild(frow);
  const ffeedback = el("div", "mcq-feedback"); fbox.appendChild(ffeedback);
  card.appendChild(fbox); app.appendChild(card);
  let fAnswered = false;
  function doFollowupCheck() {
    if (fAnswered) return; const val = finput.value.trim(); if (!val) { finput.focus(); return; }
    fAnswered = true; const correct = normalizeAnswer(val) === normalizeAnswer(READING_TYPED.answer);
    finput.disabled = true; fcheck.disabled = true;
    if (correct) { finput.classList.add("correct-input"); state.scores.a4++; ffeedback.textContent = "صحيح! أحسنتِ 🌿"; ffeedback.className = "mcq-feedback ok"; }
    else {
      finput.classList.add("wrong-input"); ffeedback.innerHTML = "قريبة! الصح: ";
      const fs = document.createElement("span"); fs.className = "en"; fs.style.fontWeight = "700"; fs.textContent = READING_TYPED.answer; ffeedback.appendChild(fs); ffeedback.className = "mcq-feedback no";
    }
    answeredCount++; updateNext();
  }
  fcheck.addEventListener("click", doFollowupCheck);
  finput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doFollowupCheck(); } });
  const nextBtn = nextButton(app, 'التالي <span class="en">Next</span> ←', function () { return false; }, function () { goTo("a5"); });
  function updateNext() { nextBtn.disabled = answeredCount !== READING_TF.length + 1; }
}

/* ================= ACTIVITY 5 - regular/irregular verb sort ================= */
function renderActivity5(app) {
  renderTopbar(app, 5);
  const card = el("div", "card");
  const title = el("div", "title heading"); title.innerHTML = 'أفعال منتظمة وغير منتظمة <span class="en">Regular &amp; Irregular</span>'; card.appendChild(title);
  const instr = el("div", "instruction"); instr.innerHTML = "اضغطي 🔊 عشان تسمعي الفعل، وبعدين حطيه بالمجموعة الصحيحة." + '<span class="en">Listen to the verb, then sort it.</span>'; card.appendChild(instr);
  const pool = el("div", "sort-pool"); const bucketsWrap = el("div", "sort-buckets"); const hint = el("div", "sort-hint");
  card.appendChild(pool); card.appendChild(bucketsWrap); card.appendChild(hint); app.appendChild(card);
  const items = shuffle(VERBS); const firstAttempt = {}; let placedCount = 0; let selected = null;
  const bucketEls = {};
  VERB_BUCKETS.forEach(function (b) {
    const bEl = el("div", "bucket");
    const lab = el("div", "bucket-label"); lab.innerHTML = '<span class="en">' + b.label + "</span>";
    const sub = el("div", "bucket-sub"); sub.innerHTML = '<span class="en">' + b.sub + "</span>";
    const itemsEl = el("div", "bucket-items");
    bEl.appendChild(lab); bEl.appendChild(sub); bEl.appendChild(itemsEl);
    bEl.addEventListener("click", function () { placeSelected(b.id, bEl); });
    bucketsWrap.appendChild(bEl); bucketEls[b.id] = { root: bEl, items: itemsEl };
  });
  items.forEach(function (item) {
    const chip = el("div", "sort-word");
    const wordSpan = document.createElement("span"); wordSpan.className = "en"; wordSpan.textContent = item.word;
    const speakBtn = document.createElement("button"); speakBtn.type = "button"; speakBtn.className = "speak-btn"; speakBtn.setAttribute("aria-label", "استمعي"); speakBtn.textContent = "🔊";
    speakBtn.addEventListener("click", function (e) { e.stopPropagation(); speak(item.word); });
    chip.appendChild(wordSpan); chip.appendChild(speakBtn);
    chip.addEventListener("click", function () {
      if (chip.classList.contains("placed")) return;
      if (selected && selected.chip) selected.chip.classList.remove("selected");
      selected = { item: item, chip: chip }; chip.classList.add("selected");
      hint.textContent = "الحين اضغطي على المجموعة الصحيحة";
    });
    pool.appendChild(chip); item._chip = chip;
  });
  function placeSelected(bucketId, bucketEl) {
    if (!selected) { hint.textContent = "اختاري فعل أول"; return; }
    const item = selected.item; const correct = item.group === bucketId;
    if (!firstAttempt[item.word]) { firstAttempt[item.word] = true; if (correct) state.scores.a5++; }
    if (correct) {
      selected.chip.classList.remove("selected"); selected.chip.classList.add("placed");
      const bc = el("span", "bucket-chip correct"); const en = document.createElement("span"); en.className = "en"; en.textContent = item.word; bc.appendChild(en);
      bucketEls[bucketId].items.appendChild(bc);
      placedCount++; hint.textContent = ""; selected = null; updateNext();
    } else {
      bucketEl.classList.add("target"); selected.chip.classList.add("wrong"); hint.textContent = "مو هالمجموعة، جربي مرة ثانية";
      setTimeout(function () { bucketEl.classList.remove("target"); if (selected && selected.chip) selected.chip.classList.remove("wrong"); }, 500);
    }
  }
  const nextBtn = nextButton(app, 'شوفي نتيجتك <span class="en">See results</span> 🎉', function () { return placedCount === VERBS.length; }, function () { finishAndGoResults(); });
  function updateNext() { nextBtn.disabled = placedCount !== VERBS.length; }
}

/* ================= FINISH / RESULTS ================= */
function finishAndGoResults() {
  const total = totalScore(); const max = totalMax(); const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  if (typeof scormSetScore === "function") scormSetScore(total, max);
  if (typeof scormSetComplete === "function") scormSetComplete();
  sendReport(state.name, state.cls, percent);
  goTo("results");
}
function renderResultsScreen(app) {
  const card = el("div", "card");
  const header = el("div", "result-header heading"); header.innerHTML = '<span style="font-size:20px;font-weight:700;">نتيجتك! <span class="en">Your Results</span> 🎉</span>'; card.appendChild(header);
  if (state.name) { const nm = el("div", "result-name"); nm.textContent = state.name + (state.cls ? " - " + state.cls : ""); card.appendChild(nm); }
  const total = totalScore(), max = totalMax(); const percent = max > 0 ? Math.round((total / max) * 100) : 0;
  const score = el("div", "result-score"); score.innerHTML = '<span class="en">' + percent + "%</span>"; card.appendChild(score);
  const msg = el("div", "result-msg");
  if (percent >= 85) msg.textContent = "ممتازة! دقة وثقة عالية 🌟";
  else if (percent >= 60) msg.textContent = "أحسنتِ! تقدّم واضح، كملي كذا 👏";
  else msg.textContent = "بداية حلوة! راجعي وحاولي مرة ثانية 💚";
  card.appendChild(msg);
  const breakdown = el("div", "result-breakdown");
  const rows = [
    ["التقنية", "Technology", state.scores.a1, state.max.a1],
    ["الماضي البسيط", "Past Simple", state.scores.a2, state.max.a2],
    ["كنت أقدر", "Could", state.scores.a3, state.max.a3],
    ["اقرئي وجاوبي", "Reading", state.scores.a4, state.max.a4],
    ["منتظم/غير منتظم", "Verbs", state.scores.a5, state.max.a5]
  ];
  rows.forEach(function (r) {
    const row = el("div", "result-row");
    const left = document.createElement("span"); left.innerHTML = r[0] + ' <span class="en">' + r[1] + "</span>";
    const right = document.createElement("span"); right.className = "en"; right.textContent = r[2] + " / " + r[3];
    row.appendChild(left); row.appendChild(right); breakdown.appendChild(row);
  });
  card.appendChild(breakdown); app.appendChild(card);
  const retryBtn = el("button", "btn btn-ghost"); retryBtn.type = "button"; retryBtn.innerHTML = 'أعيدي المحاولة <span class="en">Try again</span>';
  retryBtn.addEventListener("click", function () { state.scores = { a1: 0, a2: 0, a3: 0, a4: 0, a5: 0 }; goTo("a1"); });
  app.appendChild(retryBtn);
}

function render() {
  const app = document.getElementById("app"); app.innerHTML = "";
  if (state.screen === "start") renderStartScreen(app);
  else if (state.screen === "a1") renderActivity1(app);
  else if (state.screen === "a2") renderActivity2(app);
  else if (state.screen === "a3") renderActivity3(app);
  else if (state.screen === "a4") renderActivity4(app);
  else if (state.screen === "a5") renderActivity5(app);
  else if (state.screen === "results") renderResultsScreen(app);
}
render();
</script>
