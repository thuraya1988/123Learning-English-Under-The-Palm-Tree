<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Palm O' Chaos — a 1930s Run &amp; Gun</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0805;overflow:hidden;touch-action:none;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
  #touchUI{position:fixed;inset:0;pointer-events:none;z-index:10;display:none;user-select:none;-webkit-user-select:none;}
  body.touch #touchUI{display:block;}
  .tbtn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    background:rgba(36,26,18,.45);color:#f3e2c2;border:2px solid rgba(243,226,194,.55);border-radius:50%;
    font:900 13px Arial,sans-serif;touch-action:none;}
  #tLeft{left:14px;bottom:92px;width:62px;height:62px;font-size:24px;}
  #tRight{left:84px;bottom:92px;width:62px;height:62px;font-size:24px;}
  #tJump{left:49px;bottom:164px;width:62px;height:62px;}
  #tShoot{right:90px;bottom:92px;width:68px;height:68px;}
  #tDash{right:16px;bottom:150px;width:54px;height:54px;font-size:11px;}
  #tSuper{right:150px;bottom:150px;width:54px;height:54px;font-size:11px;}
  #tPause{right:16px;top:14px;width:40px;height:40px;font-size:16px;}
  #tStart{left:50%;bottom:22px;transform:translateX(-50%);width:150px;height:42px;border-radius:21px;font-size:14px;}
  /* اللعبة تُعرض بالعرض، فنُدير المسرح تلقائيًا بدل أن نطلب إدارة الجهاز */
  @media (orientation:portrait) and (pointer:coarse){
    html{overflow:hidden}
    body{position:fixed;top:0;left:0;width:100vh;height:100vw;
         transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="touchUI">
  <div id="tLeft" class="tbtn">◀</div>
  <div id="tRight" class="tbtn">▶</div>
  <div id="tJump" class="tbtn">JUMP</div>
  <div id="tShoot" class="tbtn">SHOOT</div>
  <div id="tDash" class="tbtn">DASH</div>
  <div id="tSuper" class="tbtn">SUPER</div>
  <div id="tPause" class="tbtn">❚❚</div>
  <div id="tStart" class="tbtn">START / OK</div>
</div>
<!-- منهج الموقع المشترك: مئة مستوى وبنوك المحتوى -->
<script src="./curriculum.js"></script>

<script>
'use strict';
/* =====================================================================
   CUP O' CHAOS — a 1930s rubber-hose run & gun (single file, no deps)
   ---------------------------------------------------------------------
   Sections:
     1. utils / canvas / palette
     2. input
     3. audio  (procedural WebAudio: ragtime loop + all SFX)
     4. object pools (projectiles / particles / floating text)
     5. camera, shake, hitstop
     6. level data (platforms, decos, parallax sets)
     7. player (state machine + procedural rubber-hose animation)
     8. enemies (Walker "Radish Rascal", Flyer "Buzzy Bloom")
     9. boss  (OLD KING KETTLE — 3 phases, tells, expressions)
    10. game state machine + iris transitions
    11. rendering: sky / parallax / world / HUD / screens
    12. film post-processing (grain, vignette, flicker, scratches)
    13. main loop
   ===================================================================== */

/* ============================ 1. UTILS ============================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const NF=m=>440*Math.pow(2,(m-69)/12);                 // midi -> freq
function mix(c1,c2,t){                                  // hex color mix
  const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,t)),gg=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));
  return 'rgb('+r+','+gg+','+bl+')';
}

const VW=960,VH=540;                                    // internal 16:9 stage
const cv=document.getElementById('screen');
const dc=cv.getContext('2d');
const game=document.createElement('canvas'); game.width=VW; game.height=VH;
const g=game.getContext('2d');
let dpr=1;
/* مقاس المسرح بعد الإدارة التلقائية */
const ROT=()=>innerHeight>innerWidth&&matchMedia('(pointer:coarse)').matches;
const SW=()=>ROT()?innerHeight:innerWidth;
const SH=()=>ROT()?innerWidth:innerHeight;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=SW()*dpr; cv.height=SH()*dpr; }
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,140));
resize();

/* warm vintage palette */
const INK='#241a12', CREAM='#f3e2c2', PAPER='#e9d3a8', RED='#c0492f',
      BLUE='#5f7f9e', PINK='#e77fa8', YEL='#e8b84b', BROWN='#7a5230', GREEN='#6f8f4f';

/* ============================ 2. INPUT ============================ */
const keys=Object.create(null), pressed=Object.create(null);
const GAME_CODES=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS',
 'Space','KeyZ','KeyX','ShiftLeft','ShiftRight','KeyC','ControlLeft','ControlRight','KeyQ','Enter','Escape','KeyM','KeyR']);
addEventListener('keydown',e=>{
  if(GAME_CODES.has(e.code)) e.preventDefault();
  if(!e.repeat){ pressed[e.code]=true; ensureAudio(); }
  keys[e.code]=true;
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
const kL=()=>keys.ArrowLeft||keys.KeyA;
const kR=()=>keys.ArrowRight||keys.KeyD;
const kJump=()=>pressed.ArrowUp||pressed.KeyW;
const kJumpHeld=()=>keys.ArrowUp||keys.KeyW;
const kShoot=()=>keys.KeyZ||keys.Space;
const kDash=()=>pressed.KeyX||pressed.ShiftLeft||pressed.ShiftRight;
const kCrouch=()=>keys.KeyC||keys.ControlLeft||keys.ControlRight;

/* ---- touch controls (mobile — same key states, no visual/game changes) ---- */
if('ontouchstart' in window || navigator.maxTouchPoints>0) document.body.classList.add('touch');
function bindHold(id,code){ const el=document.getElementById(id); if(!el)return;
  const on=e=>{ e.preventDefault(); if(!keys[code])pressed[code]=true; keys[code]=true; ensureAudio(); };
  const off=e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function bindTap(id,code){ const el=document.getElementById(id); if(!el)return;
  el.addEventListener('touchstart',e=>{ e.preventDefault(); pressed[code]=true; keys[code]=true; ensureAudio(); },{passive:false});
  const up=e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('touchcancel',up,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
/* شبكة أمان: أيّ إفلات أو خروج من الصفحة يُطفئ كلّ الأزرار المضغوطة */
['pointerup','pointercancel','touchcancel','blur'].forEach(ev=>
  addEventListener(ev,()=>{ for(const k in keys) keys[k]=false; }));
bindHold('tLeft','ArrowLeft'); bindHold('tRight','ArrowRight');
bindHold('tJump','ArrowUp'); bindHold('tShoot','KeyZ');
bindTap('tDash','KeyX'); bindTap('tSuper','KeyQ');
bindTap('tPause','Escape'); bindTap('tStart','Enter');

/* ============================ 3. AUDIO ============================ */
let AC=null, master=null, musicG=null, sfxG=null, noiseBuf=null, muted=false;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createDynamicsCompressor(); master.threshold.value=-18; master.connect(AC.destination);
    musicG=AC.createGain(); musicG.gain.value=.5; musicG.connect(master);
    sfxG=AC.createGain(); sfxG.gain.value=.65; sfxG.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    music.start();
  }catch(e){ AC=null; }
}
function env(gn,t,a,peak,dur){ gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(peak,t+a); gn.gain.exponentialRampToValueAtTime(.0001,t+dur); }
function tone(o){ if(!AC)return;
  const type=o.type||'sine',f0=o.f0||440,f1=(o.f1===undefined?f0:o.f1),dur=o.dur||.15,vol=o.vol||.2,
        t=AC.currentTime+(o.t0||0),dest=o.dest||sfxG,lp=o.lp||0;
  const osc=AC.createOscillator(),gn=AC.createGain();
  osc.type=type; osc.frequency.setValueAtTime(f0,t);
  if(f1!==f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  env(gn,t,.004,vol,dur);
  let node=osc;
  if(lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; osc.connect(f); node=f; }
  node.connect(gn); gn.connect(dest); osc.start(t); osc.stop(t+dur+.06);
}
function noiseHit(o){ if(!AC)return;
  const dur=o.dur||.2,vol=o.vol||.2,t=AC.currentTime+(o.t0||0),dest=o.dest||sfxG;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.f0||1000,t);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t+dur); f.Q.value=o.q||1;
  const gn=AC.createGain(); env(gn,t,.004,vol,dur);
  src.connect(f); f.connect(gn); gn.connect(dest); src.start(t); src.stop(t+dur+.06);
}
const sfx={
  shoot(){ tone({type:'square',f0:920,f1:320,dur:.07,vol:.09}); },
  hit(){ noiseHit({dur:.07,vol:.18,f0:1400}); tone({type:'square',f0:200,f1:90,dur:.08,vol:.12}); },
  jump(){ tone({f0:260,f1:660,dur:.16,vol:.12}); },
  land(){ noiseHit({dur:.05,vol:.08,f0:500}); },
  dash(){ noiseHit({type:'bandpass',f0:500,f1:3200,dur:.18,vol:.14,q:1.4}); },
  parry(){ tone({f0:1568,dur:.35,vol:.16}); tone({f0:2093,dur:.3,vol:.1,t0:.02}); },
  hurt(){ tone({type:'sawtooth',f0:420,f1:110,dur:.28,vol:.16,lp:1400}); },
  coin(){ tone({type:'square',f0:988,dur:.08,vol:.1}); tone({type:'square',f0:1319,dur:.22,vol:.1,t0:.08}); },
  explosion(){ noiseHit({dur:.5,vol:.32,f0:2600,f1:120}); tone({f0:100,f1:32,dur:.45,vol:.26}); },
  slam(){ tone({f0:80,f1:34,dur:.3,vol:.32}); noiseHit({dur:.2,vol:.2,f0:400}); },
  roar(){ tone({type:'sawtooth',f0:90,f1:46,dur:.7,vol:.26,lp:420}); noiseHit({dur:.5,vol:.12,f0:300,f1:900}); },
  super(){ tone({type:'sawtooth',f0:220,f1:880,dur:.4,vol:.18,lp:3000}); noiseHit({type:'highpass',f0:1200,dur:.5,vol:.12}); tone({f0:1046,dur:.5,vol:.12,t0:.15}); },
  steam(){ noiseHit({type:'highpass',f0:3500,dur:.25,vol:.035}); },
  clink(){ tone({f0:1200,f1:880,dur:.06,vol:.08}); },
};
function fanfare(){ const n=[72,76,79,84];
  n.forEach((m,i)=>tone({type:'square',f0:NF(m),dur:.18,vol:.12,t0:i*.11,lp:2600}));
  [72,76,79,84,88].forEach(m=>tone({type:'triangle',f0:NF(m),dur:.9,vol:.08,t0:.5}));
}

/* ---- ragtime loop: I I VI7 VI7 II7 II7 V7 V7 in C ---- */
const PROG=[
 {b:[48,55,52,55],c:[60,64,67]},{b:[48,55,52,55],c:[60,64,67]},
 {b:[45,52,49,52],c:[57,61,64]},{b:[45,52,49,52],c:[57,61,64]},
 {b:[50,57,54,57],c:[62,66,69]},{b:[50,57,54,57],c:[62,66,69]},
 {b:[43,50,47,50],c:[55,59,62]},{b:[43,50,47,50],c:[55,59,62]}];
const MELODY=[
 [[0,72,.5],[.5,76,.5],[1,79,1],[2,76,.5],[2.5,72,.5],[3,74,.5],[3.5,71,.5]],
 [[0,72,1],[1,79,.5],[1.5,77,.5],[2,76,.5],[2.5,74,.5],[3,72,1]],
 [[0,73,.5],[.5,76,.5],[1,80,1],[2,79,.5],[2.5,76,.5],[3,73,.5],[3.5,71,.5]],
 [[0,69,.5],[.5,73,.5],[1,76,1],[2,74,.5],[2.5,73,.5],[3,71,1]],
 [[0,74,.5],[.5,78,.5],[1,81,1],[2,79,.5],[2.5,78,.5],[3,76,.5],[3.5,74,.5]],
 [[0,78,1],[1,76,.5],[1.5,74,.5],[2,73,.75],[3,74,1]],
 [[0,71,.5],[.5,74,.5],[1,79,1],[2,77,.5],[2.5,74,.5],[3,71,.5],[3.5,67,.5]],
 [[0,74,.5],[.5,71,.5],[1,67,1],[2,67,.5],[2.5,71,.5],[3,74,1]]];
const music={
  tempo:138,boss:false,bar:0,nextBar:0,timer:null,
  bd(){ return 60/(this.boss?172:this.tempo); },
  start(){ if(!AC||this.timer)return; this.nextBar=AC.currentTime+.06; this.bar=0;
    this.timer=setInterval(()=>this.tick(),30); },
  stop(){ if(this.timer){clearInterval(this.timer); this.timer=null;} },
  setBoss(b){ this.boss=b; },
  tick(){ if(!AC)return; const ahead=AC.currentTime+.18;
    while(this.nextBar<ahead){ this.playBar(this.bar%8,this.nextBar); this.bar++; this.nextBar+=4*this.bd(); } },
  piano(m,t,d,v){ const f=NF(m),t0=t-AC.currentTime,dd=Math.min(d*this.bd(),.5);
    tone({type:'square',f0:f*(1+rand(-.003,.003)),dur:dd,vol:v,t0,lp:2400,dest:musicG});
    tone({f0:f*2,dur:dd*.7,vol:v*.4,t0,lp:3000,dest:musicG}); },
  plunk(m,t,v){ tone({type:'sawtooth',f0:NF(m),dur:.16,vol:v,t0:t-AC.currentTime,lp:1300,dest:musicG}); },
  bassN(m,t){ tone({type:'triangle',f0:NF(m),dur:this.bd()*.85,vol:.16,t0:t-AC.currentTime,dest:musicG}); },
  hat(t,acc){ noiseHit({type:'highpass',f0:6500,dur:.03,vol:acc?.055:.03,t0:t-AC.currentTime,dest:musicG}); },
  kick(t){ tone({f0:130,f1:44,dur:.11,vol:.2,t0:t-AC.currentTime,dest:musicG}); },
  snare(t){ noiseHit({type:'bandpass',f0:1900,q:.8,dur:.09,vol:.1,t0:t-AC.currentTime,dest:musicG}); },
  playBar(i,t0){ const bd=this.bd(),ch=PROG[i],boss=this.boss;
    for(let b=0;b<4;b++){ const t=t0+b*bd;
      this.bassN(ch.b[b],t);
      if(b===1||b===3){ ch.c.forEach((m,k)=>this.plunk(m,t+k*.014,boss?.075:.06)); if(boss)this.snare(t); }
      if(b===0||b===2)this.kick(t);
      this.hat(t,false); this.hat(t+bd/2,true);
      if(boss){ this.hat(t+bd*.25,false); this.hat(t+bd*.75,false); }
    }
    for(const nt of MELODY[i]){ let b=nt[0]; const fr=b%1; if(Math.abs(fr-.5)<.01)b+=.16; // swing the off-beats
      this.piano(nt[1],t0+b*bd,nt[2],boss?.13:.11); }
  }
};

/* ==================== VOCAB + VOICE (learning logic only — no visual changes) ==================== */
/* ---------------------------------------------------------------
   بنك العبارات — عبارات اللعبة الأصلية + كل مفردات منهج الموقع.
   كل جولة تسحب ٣٦ عبارة من شريحة أعلى في المنهج، فالمحتوى يكبر
   مع كل إعادة لعب ولا يتكرّر.
--------------------------------------------------------------- */
const BASE_PHRASES=[
 'GOOD MORNING','TAKE A SEAT','MAKE A WISH','HEAVY RAIN','CLOSE FRIEND','BRIGHT STAR',
 'CLOSE THE DOOR','DO YOUR BEST','SAVE SOME TIME','THANK YOU FRIEND','OPEN YOUR EYES','FOLLOW THE LIGHT',
 'NEVER GIVE UP','TAKE CARE','HAVE FUN','MAKE A DECISION','CATCH A COLD','LOSE YOUR WAY',
 'FIND THE PATH','BUILD A HOME','KEEP A PROMISE','TELL THE TRUTH','ASK A QUESTION','GIVE A HAND',
 'SHARE YOUR STORY','TRUST YOUR HEART','LEARN A LESSON','SPEND THE DAY','WATCH THE SUNSET','FEEL AT HOME',
 'STAY STRONG','DREAM BIG','WORK HARD','BE KIND','STAY CURIOUS','KEEP LEARNING'];

/* كل عناصر المنهج كعبارات: {en, ar} */
const PHRASE_BANK=(function(){
  const out=BASE_PHRASES.map(p=>({en:p,ar:''}));
  if(typeof PALM==='undefined')return out;
  for(const v of PALM.VOCAB_ALL)   out.push({en:v.en.toUpperCase(),ar:v.ar});
  for(const o of PALM.OPPOSITES)   out.push({en:o.o.toUpperCase(),ar:'ضدّ '+o.w});
  for(const q of PALM.PLURALS)     out.push({en:q.p.toUpperCase(),ar:'جمع '+q.s});
  return out;
})();

/* الجولة محفوظة، فكل مرة يبدأ اللاعب من محتوى جديد */
let round=0;
try{ round=Math.max(0,parseInt(localStorage.getItem('poc-round')||'0',10)||0); }catch(e){}
const PER_ROUND=36;
const ROUNDS_TOTAL=Math.max(1,Math.ceil(PHRASE_BANK.length/PER_ROUND));
function roundPhrases(r){
  const n=PHRASE_BANK.length;
  const out=[];
  for(let i=0;i<PER_ROUND;i++) out.push(PHRASE_BANK[(r*PER_ROUND+i)%n]);
  return out;
}
let LEVEL_SET=roundPhrases(round);
const LEVELS=LEVEL_SET.map(p=>p.en);
function roundLabel(){
  const u=(typeof PALM!=='undefined'&&PALM.UNITS)?PALM.UNITS[round%PALM.UNITS.length]:null;
  return 'ROUND '+(round+1)+'/'+ROUNDS_TOTAL+(u?' — '+u.en:'');
}
const BOSS_PHRASES=['OPEN YOUR EYES','FOLLOW THE LIGHT','NEVER GIVE UP'];
let ttsVoice=null;
if('speechSynthesis' in window){
  const pickVoice=()=>{ const vs=speechSynthesis.getVoices();
    ttsVoice=vs.find(v=>/^en/.test(v.lang))||null; };
  pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(word){ if(!('speechSynthesis' in window)||muted)return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US'; u.rate=.85; if(ttsVoice)u.voice=ttsVoice; speechSynthesis.speak(u); }catch(e){} }
function pickWord(){ return BOSS_PHRASES[irand(0,BOSS_PHRASES.length-1)]; }
let targetWord='', targetWordAr='', targetSeq=[], targetPtr=0, curLevel=0;
function setTarget(w,ar){ targetWord=w; targetWordAr=ar||''; say(player.x,player.y-90,'SAY: '+w,CREAM,15); speak(w); }
function announceLevel(n,label){ curLevel=n; say(player.x,player.y-130,label,RED,26); sfx.parry(); }
function advanceTarget(){ targetPtr++;
  if(targetPtr<targetSeq.length){ const e=targetSeq[targetPtr];
    if(e.level!==curLevel)announceLevel(e.level,'LEVEL '+(e.level+1)+'!');
    setTarget(e.word,e.wordAr);
  } else { if(curLevel!==LEVELS.length)announceLevel(LEVELS.length,'FINAL STRETCH!'); setTarget(pickWord()); } }

/* ==================== 4. POOLS (projectiles/particles/text) ==================== */
class Pool{
  constructor(make,n){ this.items=[]; for(let i=0;i<n;i++)this.items.push(make()); }
  spawn(init){ for(const it of this.items){ if(!it.active){ for(const k in it)if(k!=='active')delete it[k];
      Object.assign(it,init); it.active=true; return it; } } return null; }
  each(fn){ for(const it of this.items) if(it.active) fn(it); }
  clear(){ for(const it of this.items) it.active=false; }
}
const shots=new Pool(()=>({active:false}),160);
function fireShot(o){ shots.spawn(Object.assign({type:'pellet',x:0,y:0,vx:0,vy:0,r:6,life:1.2,dmg:8,
  grav:0,parry:false,friendly:true,spin:0,t:0},o)); }
const parts=new Pool(()=>({active:false}),700);
function puff(o){ const it=parts.spawn(Object.assign({type:'smoke',x:0,y:0,vx:0,vy:0,life:.6,size:6,
  color:CREAM,grav:0,rot:0,vr:0},o)); if(it)it.maxLife=it.life; return it; }
function burst(x,y,n,o){ o=o||{}; for(let i=0;i<n;i++){ const a=rand(TAU),s=rand(o.sp0||60,o.sp1||240);
  puff({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||40),life:rand(.3,.7),size:rand(3,7),
    color:o.color||YEL,type:o.type||'spark',grav:o.grav===undefined?500:o.grav}); } }
const texts=new Pool(()=>({active:false}),48);
function say(x,y,txt2,color,size){ texts.spawn({x,y,txt:txt2,color:color||'#fff',size:size||18,life:.9,t:0,vy:-46,maxLife:.9}); }

/* ==================== 5. CAMERA / SHAKE / HITSTOP ==================== */
const cam={x:0,y:0,shakeT:0,shakeMag:0};
let shakeX=0,shakeY=0,hitstop=0;
function shake(m,t){ cam.shakeMag=Math.max(cam.shakeMag,m); cam.shakeT=Math.max(cam.shakeT,t||.3); }
function stop(m){ hitstop=Math.max(hitstop,m); }
function updateCamera(dt){
  let tx,ty,maxX;
  if(bossActive){ tx=ARENA_X; ty=0; maxX=ARENA_X; }
  else{ tx=player.x+player.facing*80+player.vx*.15-VW/2; ty=clamp((player.y-330)*.5,-70,0); maxX=LW-VW; }
  tx=clamp(tx,0,maxX);
  const k=1-Math.exp(-8*dt);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k;
  cam.shakeT=Math.max(0,cam.shakeT-dt);
  if(cam.shakeT>0){ shakeX=rand(-1,1)*cam.shakeMag; shakeY=rand(-1,1)*cam.shakeMag;
    cam.shakeMag=lerp(cam.shakeMag,0,dt*5); }
  else{ cam.shakeMag=0; shakeX=0; shakeY=0; }
}

/* ==================== 7. PLAYER ==================== */
class Player{
  constructor(){ this.reset(); }
  reset(){ Object.assign(this,{x:120,y:GY,vx:0,vy:0,facing:1,onGround:true,hp:3,super:0,
    invuln:0,coyote:0,jbuf:0,dashT:0,dashCd:0,shootT:0,recoil:0,runPh:0,blinkT:rand(2,4),
    steamT:0,dead:false,deathT:0,crouch:false,landSq:0,jumpStr:0,parryPose:0,superAnim:0,
    muzzle:0,hurtT:0,carry:null,ghost:[],superSaid:false}); }
  hurtbox(){ const h=this.crouch?38:52; return {x:this.x-13,y:this.y-h,w:26,h}; }
  damage(from){ if(this.invuln>0||this.dashT>0||this.dead||this.superAnim>0)return;
    this.hp--; this.invuln=1.3; this.hurtT=.4;
    const dir=this.x>=from?1:-1; this.vx=dir*380; this.vy=-330; this.onGround=false;
    sfx.hurt(); shake(6,.35); burst(this.x,this.y-30,8,{color:RED,sp1:260});
    if(this.hp<=0){ this.dead=true; this.deathT=0; this.vy=-430; } }
  update(dt,t){
    const P=this;
    if(P.dead){ P.deathT+=dt; P.vy+=2000*dt; P.y=Math.min(GY,P.y+P.vy*dt); return; }
    P.invuln=Math.max(0,P.invuln-dt); P.hurtT=Math.max(0,P.hurtT-dt);
    P.dashCd=Math.max(0,P.dashCd-dt); P.recoil=Math.max(0,P.recoil-dt);
    P.muzzle=Math.max(0,P.muzzle-dt); P.parryPose=Math.max(0,P.parryPose-dt);
    P.superAnim=Math.max(0,P.superAnim-dt); P.landSq=Math.max(0,P.landSq-dt*5);
    P.jumpStr=Math.max(0,P.jumpStr-dt);
    /* movement input */
    let ax=0; if(kL())ax--; if(kR())ax++;
    if(ax!==0&&P.hurtT<=0)P.facing=ax;
    P.crouch=kCrouch()&&P.onGround&&P.dashT<=0;
    const spd=P.crouch?120:340;
    if(P.dashT>0){ P.dashT-=dt; P.vx=P.facing*920; P.vy=0;
      P.ghost.push({x:P.x,y:P.y,f:P.facing,life:.22}); if(P.ghost.length>9)P.ghost.shift();
    }else{
      P.vx=approach(P.vx,ax*spd,(P.onGround?2600:1600)*dt);
      P.vy+=2300*dt; if(P.vy>1100)P.vy=1100;
    }
    /* jump buffering + coyote time */
    if(kJump())P.jbuf=.12; else P.jbuf=Math.max(0,P.jbuf-dt);
    P.coyote=P.onGround?.09:P.coyote-dt;
    if(P.jbuf>0&&P.coyote>0&&P.dashT<=0){ P.vy=-800; P.onGround=false; P.coyote=0; P.jbuf=0;
      P.jumpStr=.14; sfx.jump(); puff({x:P.x,y:P.y,type:'smoke',size:8,vy:20,life:.35}); }
    if(!kJumpHeld()&&P.vy<-280)P.vy=-280;              // variable jump height
    /* dash */
    if(kDash()&&P.dashCd<=0&&P.dashT<=0){ P.dashT=.16; P.dashCd=.5;
      P.invuln=Math.max(P.invuln,.22); sfx.dash(); }
    /* integrate */
    const prevBottom=P.y;
    P.x+=P.vx*dt; P.y+=P.vy*dt;
    const minX=bossActive?ARENA_X+24:18, maxX=bossActive?LW-24:LW-18;
    P.x=clamp(P.x,minX,maxX);
    /* ground + one-way platforms */
    P.onGround=false;
    if(P.y>=GY){ if(P.vy>520){P.landSq=1;sfx.land();puff({x:P.x,y:GY,type:'smoke',size:10,vy:10,life:.35});}
      P.y=GY; P.vy=0; P.onGround=true; }
    else if(P.vy>=0){ for(const pr of plats){ const q=platPos(pr,t);
      if(prevBottom<=q.y+6&&P.y>=q.y&&P.x>q.x-10&&P.x<q.x+q.w+10){
        P.y=q.y; P.vy=0; P.onGround=true; P.carry=q; break; } } }
    if(P.carry&&P.onGround){ P.x+=(P.carry.vx||0)*dt; P.y+=(P.carry.vy||0)*dt; } else P.carry=null;
    if(P.onGround&&Math.abs(P.vx)>20)P.runPh+=Math.abs(P.vx)*dt*.05;
    /* shooting (hold for rapid fire) */
    P.shootT-=dt;
    if(kShoot()&&P.shootT<=0&&P.hurtT<=0){ P.shootT=.13; P.recoil=.09; P.muzzle=.06; sfx.shoot();
      const hy=P.y-(P.crouch?26:40);
      fireShot({type:'pellet',x:P.x+P.facing*24,y:hy,vx:P.facing*760,vy:0,dmg:8,life:.9,r:6,friendly:true});
      P.vx-=P.facing*26; }
    /* super */
    if(P.super>=100&&!P.superSaid){ say(P.x,P.y-86,'SUPER READY! [Q]',YEL,15); P.superSaid=true; }
    if(P.super<100)P.superSaid=false;
    if(pressed.KeyQ&&P.super>=100&&P.superAnim<=0){ P.super=0; P.superAnim=.9;
      P.invuln=Math.max(P.invuln,1); sfx.super(); stop(.12); shake(10,.4); superFlash=.55; doSuper(); }
    /* idle steam puff from the cup */
    P.steamT-=dt; if(P.steamT<=0){ P.steamT=rand(.9,1.6);
      puff({x:P.x-P.facing*2,y:P.y-60,type:'steam',size:5,vy:-30,vx:rand(-8,8),life:.9}); }
    P.blinkT-=dt; if(P.blinkT<-.1)P.blinkT=rand(1.6,4);
    /* parry: jumping into pink objects */
    if(!P.onGround){ shots.each(s=>{ if(s.parry&&Math.abs(s.x-P.x)<26&&Math.abs(s.y-(P.y-30))<36){
      s.active=false; P.super=Math.min(100,P.super+25); P.parryPose=.3; P.vy=Math.min(P.vy,-300);
      sfx.parry(); stop(.06); burst(s.x,s.y,10,{color:PINK,sp1:300,grav:200});
      say(s.x,s.y-14,'PING!',PINK,20); shake(3,.2); } }); }
  }
  /* ---- procedural rubber-hose rendering ---- */
  draw(gg,t){
    const P=this;
    for(let i=P.ghost.length-1;i>=0;i--){ const gh=P.ghost[i]; gh.life-=.016;
      if(gh.life<=0){P.ghost.splice(i,1);continue;}
      gg.save(); gg.globalAlpha=gh.life*2.4; gg.translate(gh.x,gh.y); gg.scale(gh.f,1);
      P.body(gg,t,true); gg.restore(); }
    gg.save(); gg.translate(P.x,P.y);
    if(P.invuln>0&&!P.dead&&Math.floor(t*18)%2===0)gg.globalAlpha=.35;
    if(P.dead)gg.rotate(Math.sin(P.deathT*12)*.5);
    gg.scale(P.facing,1);
    let sx=1,sy=1;
    if(P.landSq>0){sx=1+P.landSq*.28;sy=1-P.landSq*.26;}
    if(P.jumpStr>0){sx=1-P.jumpStr*.9;sy=1+P.jumpStr*1.1;}
    gg.scale(sx,sy);
    P.body(gg,t,false);
    gg.restore();
  }
  body(gg,t,ghost){
    const P=this;
    const crouch=P.crouch, running=P.onGround&&Math.abs(P.vx)>30&&!crouch,
          air=!P.onGround, dashing=P.dashT>0;
    const q=Math.floor(P.runPh*7)/7, ph=q*TAU;              // stepped "twos" frames
    const bob=running?Math.sin(ph*2)*2.2:Math.sin(t*2.4)*1.6;
    const hipY=crouch?-16:-25+bob*.4, bodyY=crouch?-26:-37+bob*.6, headY=crouch?-40:-55+bob;
    /* legs */
    let f1x,f1y,f2x,f2y;
    if(running){ f1x=Math.sin(ph)*15+4; f1y=-Math.max(0,Math.cos(ph))*12;
                 f2x=Math.sin(ph+Math.PI)*15+4; f2y=-Math.max(0,Math.cos(ph+Math.PI))*12; }
    else if(air){ if(P.vy<0){f1x=10;f1y=-10;f2x=-4;f2y=-4;} else {f1x=8;f1y=-2;f2x=-6;f2y=0;} }
    else if(crouch){f1x=13;f1y=0;f2x=-9;f2y=0;}
    else if(dashing){f1x=14;f1y=-6;f2x=-2;f2y=0;}
    else{f1x=7+Math.sin(t*2.4)*1.2;f1y=0;f2x=-6;f2y=0;}
    function leg(hx,hy,fx,fy,bend){
      gg.lineCap='round'; gg.strokeStyle=INK; gg.lineWidth=7;
      gg.beginPath(); gg.moveTo(hx,hy);
      gg.quadraticCurveTo((hx+fx)/2+bend,(hy+fy)/2-3,fx,fy); gg.stroke();
      gg.fillStyle=INK; gg.beginPath(); gg.ellipse(fx+3,fy-2,10,6,0,0,TAU); gg.fill();
      gg.strokeStyle='rgba(243,226,194,.5)'; gg.lineWidth=1.6;
      gg.beginPath(); gg.arc(fx+1,fy-4,4,Math.PI,Math.PI*1.7); gg.stroke();
    }
    function arm(sx2,sy2,hx,hy,bend){
      gg.lineCap='round'; gg.strokeStyle=INK; gg.lineWidth=6;
      gg.beginPath(); gg.moveTo(sx2,sy2);
      gg.quadraticCurveTo((sx2+hx)/2+bend,(sy2+hy)/2+4,hx,hy); gg.stroke();
      gg.fillStyle=INK; gg.beginPath(); gg.arc(hx,hy,8.4,0,TAU); gg.fill();   // glove outline
      gg.fillStyle='#f6f1e4'; gg.beginPath(); gg.arc(hx,hy,6.4,0,TAU); gg.fill();
    }
    /* arms pose */
    const aiming=(kShoot()&&P.hurtT<=0&&!P.dead)||P.recoil>0||P.superAnim>0;
    let hF,hB;
    if(P.dead){hF={x:10,y:bodyY-14};hB={x:-10,y:bodyY-12};}
    else if(aiming){const hy=bodyY+4;hF={x:26-P.recoil*46,y:hy+2};hB={x:-2,y:hy+8};}
    else if(P.parryPose>0){hF={x:14,y:bodyY-16};hB={x:-10,y:bodyY+8};}
    else if(P.hurtT>0){hF={x:12,y:bodyY-12};hB={x:-12,y:bodyY-10};}
    else if(air){hF={x:13,y:bodyY-8};hB={x:-11,y:bodyY-4};}
    else if(dashing){hF={x:-12,y:bodyY+2};hB={x:-18,y:bodyY+8};}
    else if(crouch){hF={x:16,y:bodyY+6};hB={x:-6,y:bodyY+8};}
    else if(running){const sw=Math.sin(ph+Math.PI)*13;hF={x:sw+4,y:bodyY+8-Math.abs(sw)*.2};hB={x:-sw-2,y:bodyY+8};}
    else{hF={x:9,y:bodyY+12+Math.sin(t*2.4)*1.5};hB={x:-8,y:bodyY+12};}
    /* super aura */
    if(P.super>=100&&!ghost){ gg.save(); gg.globalAlpha=.25+Math.sin(t*10)*.12;
      gg.fillStyle=YEL; gg.beginPath(); gg.ellipse(0,bodyY+4,26,38,0,0,TAU); gg.fill(); gg.restore(); }
    /* draw order: back arm, back leg, torso, front leg, head, front arm */
    arm(-2,bodyY+5,hB.x,hB.y,-5);
    leg(-3,hipY,f2x,f2y,-6);
    /* torso */
    gg.fillStyle=INK; gg.beginPath(); gg.ellipse(0,bodyY+8,13.4,14.4,0,0,TAU); gg.fill();
    gg.fillStyle=RED; gg.beginPath(); gg.ellipse(0,bodyY+8,11.4,12.4,0,0,TAU); gg.fill();
    gg.fillStyle=CREAM; gg.beginPath(); gg.arc(0,bodyY+4,2,0,TAU); gg.arc(0,bodyY+11,2,0,TAU); gg.fill();
    leg(3,hipY,f1x,f1y,6);
    /* head = human */
    gg.save(); gg.translate(0,headY); gg.rotate(dashing?.22:(running?.06:0));
    // ears
    gg.fillStyle=INK; gg.beginPath(); gg.ellipse(-18,-2,6,8,0,0,TAU); gg.fill();
    gg.fillStyle=INK; gg.beginPath(); gg.ellipse(18,-2,6,8,0,0,TAU); gg.fill();
    gg.fillStyle=CREAM; gg.beginPath(); gg.ellipse(-18,-2,4,6,0,0,TAU); gg.fill();
    gg.fillStyle=CREAM; gg.beginPath(); gg.ellipse(18,-2,4,6,0,0,TAU); gg.fill();
    // neck
    gg.fillStyle=INK; gg.fillRect(-5,10,10,8);
    gg.fillStyle=CREAM; gg.fillRect(-3,11,6,6);
    // face base
    gg.fillStyle=INK; gg.beginPath(); gg.ellipse(0,-6,20,22,0,0,TAU); gg.fill();
    gg.fillStyle=CREAM; gg.beginPath(); gg.ellipse(0,-6,17,19,0,0,TAU); gg.fill();
    // hair (curly / كيراي)
    gg.fillStyle=INK; gg.beginPath(); gg.moveTo(-18,-16); gg.quadraticCurveTo(-10,-32,0,-30); gg.quadraticCurveTo(10,-32,18,-16); gg.quadraticCurveTo(14,-8,12,-12); gg.quadraticCurveTo(0,-18,-12,-12); gg.quadraticCurveTo(-14,-8,-18,-16); gg.closePath(); gg.fill();
    gg.fillStyle='#5a3a22'; gg.beginPath(); gg.moveTo(-15,-14); gg.quadraticCurveTo(-8,-26,0,-24); gg.quadraticCurveTo(8,-26,15,-14); gg.quadraticCurveTo(12,-10,10,-13); gg.quadraticCurveTo(0,-18,-10,-13); gg.quadraticCurveTo(-12,-10,-15,-14); gg.closePath(); gg.fill();
    // nose
    gg.fillStyle=INK; gg.beginPath(); gg.ellipse(0,2,4.5,3.5,0,0,TAU); gg.fill();
    gg.fillStyle=CREAM; gg.beginPath(); gg.ellipse(0,2,3,2.2,0,0,TAU); gg.fill();
    // face
    const closed=P.blinkT<0||P.dashing;
    if(P.dead){ gg.strokeStyle=INK; gg.lineWidth=2.4;
      [[-5,-6],[5,-6]].forEach(e=>{ gg.beginPath();
        gg.moveTo(e[0]-3,e[1]-3); gg.lineTo(e[0]+3,e[1]+3);
        gg.moveTo(e[0]+3,e[1]-3); gg.lineTo(e[0]-3,e[1]+3); gg.stroke(); });
      gg.beginPath(); gg.arc(0,8,3,0,TAU); gg.stroke();
    }else if(P.hurtT>0){ pieEye(gg,-5,-6,4.6,t,true); pieEye(gg,5,-6,4.6,t,true);
      gg.strokeStyle=INK; gg.lineWidth=2.4; gg.beginPath(); gg.arc(0,8,3.2,0,TAU); gg.stroke();
    }else{
      if(closed){ gg.strokeStyle=INK; gg.lineWidth=2.2;
        gg.beginPath(); gg.arc(-5,-6,3.4,0,Math.PI); gg.stroke();
        gg.beginPath(); gg.arc(5,-6,3.4,0,Math.PI); gg.stroke();
      }else{ pieEye(gg,-5,-6,4.6,t*.7); pieEye(gg,5,-6,4.6,t*.7+2.4); }
      gg.strokeStyle=INK; gg.lineWidth=2.4; gg.lineCap='round';
      gg.beginPath();
      if(P.superAnim>0||P.parryPose>0) gg.arc(0,5,4.4,0,Math.PI);
      else gg.arc(0,4,4.6,.15*Math.PI,.85*Math.PI);
      gg.stroke();
      gg.fillStyle='rgba(231,127,168,.55)'; gg.beginPath(); gg.arc(7,3,2.4,0,TAU); gg.fill();
    }
    gg.restore();
    /* front arm + finger-gun + muzzle flash */
    arm(2,bodyY+5,hF.x,hF.y,5);
    if(aiming&&!P.dead){ gg.fillStyle=INK;
      gg.beginPath(); gg.ellipse(hF.x+7,hF.y,5,3.4,0,0,TAU); gg.fill();
      if(P.muzzle>0){ const m=P.muzzle/.06; gg.save(); gg.translate(hF.x+16,hF.y); gg.rotate(t*40);
        gg.fillStyle=YEL; star(gg,0,0,10*m,4.5*m,4); gg.fill();
        gg.fillStyle='#fff'; star(gg,0,0,5*m,2*m,4); gg.fill(); gg.restore(); } }
    if(P.dead){ for(let i=0;i<3;i++){ const a=t*6+i*TAU/3;
      star(gg,Math.cos(a)*16,headY-8+Math.sin(a)*6,4,1.8,5);
      gg.fillStyle=YEL; gg.fill(); gg.strokeStyle=INK; gg.lineWidth=1.4; gg.stroke(); } }
  }
}
/* pie-eye: white ellipse + rotating black "pie slice" */
function pieEye(gg,x,y,r,a,hurt){
  gg.fillStyle=INK; gg.beginPath(); gg.ellipse(x,y,r+1.6,r+2.6,0,0,TAU); gg.fill();
  gg.fillStyle='#fff'; gg.beginPath(); gg.ellipse(x,y,r,r+1,0,0,TAU); gg.fill();
  if(hurt){ gg.strokeStyle=INK; gg.lineWidth=1.8;
    gg.beginPath(); gg.moveTo(x-r*.6,y-r*.6); gg.lineTo(x+r*.6,y+r*.6);
    gg.moveTo(x+r*.6,y-r*.6); gg.lineTo(x-r*.6,y+r*.6); gg.stroke(); return; }
  gg.fillStyle=INK; gg.beginPath(); gg.moveTo(x,y);
  gg.arc(x,y,r*.8,a,a+1.15); gg.closePath(); gg.fill();
}
function star(gg,x,y,ro,ri,n){ gg.beginPath();
  for(let i=0;i<n*2;i++){ const r2=i%2===0?ro:ri,a=i/(n*2)*TAU-Math.PI/2;
    const px=x+Math.cos(a)*r2,py=y+Math.sin(a)*r2; i===0?gg.moveTo(px,py):gg.lineTo(px,py); }
  gg.closePath(); }

/* ==================== 8. ENEMIES ==================== */
class Walker{ /* "Radish Rascal" — patrols, winds up, lobs a seed */
  constructor(x){ Object.assign(this,{x,y:GY,hp:24,dir:-1,t:rand(9),state:'walk',st:0,

class Boss{
  constructor(){ Object.assign(this,{x:6060,y:GY-700,hp:320,max:320,phase:1,state:'intro',st:0,word:null,
    t:0,attack:null,face:'idle',faceT:0,dir:-1,tintT:0,tintAmt:0,flinch:0,squash:1,vy:0,
    airborne:false,slamVX:0,volleyN:0,spiralN:0,rained:false,beamOn:false,beamHigh:false,
    dashVX:0,windDur:.6,landed:false,lidPopped:false,finalPop:false,dying:false,deathT:0}); }
  center(){ return {x:this.x,y:this.y-95}; }
  hurt(d){ if(this.dying||this.state==='intro')return;
    this.hp-=d; this.flinch=.16; this.face='hurt'; this.faceT=.25;
    player.super=Math.min(100,player.super+2);
    if(this.hp<=0){ this.dying=true; this.state='dying'; this.deathT=0; this.beamOn=false;
      sfx.explosion(); shake(14,.6); return; }
    const p=this.hp/this.max;
    if(this.phase===1&&p<=.5){ this.phase=2; this.transform(2); }
    else if(this.phase===2&&p<=.2){ this.phase=3; this.transform(3); } }
  transform(p){ this.state='transform'; this.st=0; this.tintT=p===2?1:2; this.face='rage';
    this.beamOn=false; this.airborne=false; this.word=pickWord(); targetWord=this.word; speak(this.word);
    sfx.roar(); shake(10,.5); stop(.1);
    shots.each(s=>{ if(!s.friendly){s.active=false; burst(s.x,s.y,5,{color:PINK});} });
    say(this.x,this.y-210,p===2?'ANGRY!!':'DESPERATE!!',RED,26); }
  choose(){ const pool=this.phase===1?['volley','volley','slam','beam']
      :this.phase===2?['volley','slam','beam','rain','dash']
      :['volley','slam','beam','rain','dash','spiral'];
    return pool[irand(0,pool.length-1)]; }
  onAttackStart(pl){ const a=this.attack;
    this.volleyN=0; this.spiralN=0; this.rained=false; this.airborne=false;
    if(a==='beam'){ this.beamHigh=Math.random()<.5; sfx.dash(); }
    if(a==='dash'){ this.dashVX=(pl.x<this.x?-1:1)*(this.phase===3?820:700); sfx.dash(); } }
  update(dt,pl){ const B=this; B.t+=dt;
    B.flinch=Math.max(0,B.flinch-dt); B.faceT=Math.max(0,B.faceT-dt);
    if(B.faceT<=0&&B.face==='hurt')B.face=B.phase>1?'rage':'idle';
    B.tintAmt=approach(B.tintAmt,B.tintT/2,dt*1.5);
    switch(B.state){
      case 'intro': B.st+=dt;
        if(B.st<.45){ B.y=GY-(.45-B.st)*1600; }
        else{ if(!B.landed){ B.landed=true; B.y=GY; B.squash=1; shake(12,.5); sfx.roar(); sfx.slam();
            burst(B.x,GY,16,{color:PAPER,sp1:320}); }
          B.y=GY; if(B.st>1.7){ B.state='idle'; B.st=0; } }
        break;
      case 'idle': B.st+=dt; B.squash=lerp(B.squash,1,dt*8); B.dir=pl.x<B.x?-1:1;
        if(B.st>(B.phase===3?.55:.9)){ B.st=0; B.attack=B.choose(); B.state='wind'; B.face='wind';
          B.windDur={volley:.6,slam:.7,beam:.8,rain:.6,dash:.5,spiral:.7}[B.attack]*(B.phase===3?.7:1); }
        break;
      case 'wind': B.st+=dt;
        if(B.st>=B.windDur){ B.st=0; B.state='attack'; B.onAttackStart(pl); }
        break;
      case 'attack': B.st+=dt; B.runAttack(dt,pl); break;
      case 'recover': B.st+=dt;
        if(B.st>(B.phase===3?.35:.6)){ B.st=0; B.state='idle'; B.face=B.phase>1?'rage':'idle'; }
        break;
      case 'transform': B.st+=dt; B.squash=1+Math.sin(B.st*30)*.06;

        if(d>1.7&&!B.finalPop){ B.finalPop=true; sfx.explosion(); shake(16,.7);

  }

        gg.fillStyle='#c96a5a'; gg.beginPath(); gg.arc(-2,-74,7,0,TAU); gg.fill(); }
      else if(hurtF){ gg.fillStyle=INK; gg.fillRect(-18,-82,32,12);
        gg.fillStyle='#fff'; gg.fillRect(-15,-79,26,6);

      else if(rage){ gg.fillStyle=INK; gg.beginPath(); gg.ellipse(-2,-74,15,12,0,0,TAU); gg.fill();
        gg.fillStyle='#c96a5a'; gg.beginPath(); gg.ellipse(-2,-69,8,5,0,0,TAU); gg.fill(); }
      else{ gg.lineWidth=4; gg.beginPath(); gg.arc(-2,-80,14,.15*Math.PI,.85*Math.PI); gg.stroke(); }
      if(B.phase===3){ gg.fillStyle='#9fd3e8';
        gg.beginPath(); gg.moveTo(40,ey-24); gg.quadraticCurveTo(45,ey-14,40,ey-8);

/* ==================== 10. GAME STATE / FLOW ==================== */
let state='title', paused=false, tGlobal=0, playT=0, bossActive=false, boss=null;
let victoryT=-1, cardT=0, hintT=0, superFlash=0, bossBarT=0;
let superRing=null;
const player=new Player();
function doSuper(){ const px=player.x;
  shots.each(s=>{ if(!s.friendly){ s.active=false; burst(s.x,s.y,6,{color:PINK}); } });
  for(const e of enemies) if(!e.dead&&Math.abs(e.x-px)<640) e.hurt(40);
  if(boss&&!boss.dying&&boss.state!=='intro')boss.hurt(40);
  superRing={t:0,x:px,y:player.y-30}; }
function resetGame(){ player.reset(); initEnemies(); initPickups(); shots.clear(); parts.clear(); texts.clear();
  boss=null; bossActive=false; victoryT=-1; cam.x=0; cam.y=0; hintT=7; playT=0;
  superRing=null; superFlash=0; bossBarT=0; paused=false; music.setBoss(false); }
function startGame(){ resetGame(); state='play'; if(AC)music.start(); }
function toTitle(){ state='title'; paused=false; music.setBoss(false); if(AC)music.start(); }
function spawnBoss(){ boss=new Boss(); bossActive=true; player.x=ARENA_X+70; cam.x=ARENA_X;
  curLevel=LEVELS.length; boss.word=pickWord(); targetWord=boss.word; speak(boss.word);
  music.setBoss(true); sfx.roar(); }
/* iris transitions */
const iris={on:true,r:0,closing:false,t:0,dur:.5,cb:null,cx:VW/2,cy:VH/2};
const IRIS_R=Math.hypot(VW,VH)/2+30;
function startIris(cb,cx,cy){ iris.on=true; iris.closing=true; iris.t=0; iris.cb=cb;
  iris.cx=cx===undefined?VW/2:cx; iris.cy=cy===undefined?VH/2:cy; }
function updateIris(dt){ if(!iris.on)return; iris.t+=dt;
  if(iris.closing){ iris.r=1-clamp(iris.t/iris.dur,0,1);
    if(iris.t>=iris.dur){ const cb=iris.cb; iris.cb=null; iris.closing=false; iris.t=0; if(cb)cb(); } }
  else{ iris.r=clamp(iris.t/iris.dur,0,1); if(iris.t>=iris.dur){iris.on=false;iris.r=1;} } }
function drawIris(){ if(!iris.on)return; const R=IRIS_R*iris.r;
  g.save(); g.fillStyle='#0d0906'; g.beginPath(); g.rect(0,0,VW,VH);
  if(R>1){ g.moveTo(iris.cx+R,iris.cy); g.arc(iris.cx,iris.cy,R,0,TAU,true); }
  g.fill('evenodd');
  if(R>6){ g.strokeStyle=CREAM; g.lineWidth=3; g.beginPath(); g.arc(iris.cx,iris.cy,R-2,0,TAU); g.stroke(); }
  g.restore(); }
function meta(){
  if(pressed.KeyM&&AC){ muted=!muted; master.gain.value=muted?0:1; }
  if(iris.on)return;
  if(state==='title'&&pressed.Enter){ ensureAudio(); startIris(()=>startGame()); }
  else if(state==='play'){
    if(pressed.Escape)paused=!paused;
    if(paused){ if(pressed.KeyR){paused=false;startIris(()=>startGame());}
      if(pressed.KeyQ){paused=false;startIris(toTitle);} } }
  else if(state==='gameover'){ if(pressed.Enter)startIris(()=>startGame());
    if(pressed.Escape)startIris(toTitle); }
  else if(state==='victory'&&pressed.Enter)startIris(toTitle);
}

/* ==================== world updates ==================== */
function explodeAt(x,y){ sfx.explosion(); shake(8,.4);
  burst(x,y-10,18,{color:YEL,sp1:380}); burst(x,y-10,10,{color:RED});
  puff({x,y:y-16,type:'smoke',size:16,vy:-40,life:.6});
  if(!player.dead&&Math.abs(player.x-x)<80&&player.y>y-95)player.damage(x); }
function updateShots(dt){ shots.each(s=>{ s.t+=dt; s.life-=dt;
  if(s.life<=0){s.active=false;return;}
  if(s.grav)s.vy+=s.grav*dt;
  s.x+=s.vx*dt; s.y+=s.vy*dt; s.spin+=dt*8;
  if(s.type==='wave')s.y=GY-10;
  if(s.type==='seed'&&s.y>=GY-2){ s.active=false; puff({x:s.x,y:GY-4,type:'smoke',size:6,life:.3}); }
  if(s.type==='bomb'&&s.y>=GY-6){ s.active=false; explodeAt(s.x,GY); }
  if(s.x<cam.x-100||s.x>cam.x+VW+100||s.y>VH+90){ if(s.type!=='wave'&&s.type!=='bomb')s.active=false; } }); }
function updateParts(dt){ parts.each(p=>{ p.t+=dt; p.life-=dt;
  if(p.life<=0){p.active=false;return;}
  if(p.grav)p.vy+=p.grav*dt;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=(p.vr||0)*dt;
  if(p.type==='steam'||p.type==='smoke')p.size+=dt*14; }); }
function updatePlay(dt){
  playT+=dt; hintT=Math.max(0,hintT-dt);
  player.update(dt,tGlobal);
  for(const e of enemies)e.update(dt,player);
  enemies=enemies.filter(e=>!(e.dead&&e.deadT>.6));
  if(boss){ boss.update(dt,player); if(bossActive)bossBarT=Math.min(1,bossBarT+dt*2); }
  updateShots(dt); updateParts(dt);
  texts.each(tx2=>{ tx2.t+=dt; tx2.life-=dt; tx2.y+=tx2.vy*dt; if(tx2.life<=0)tx2.active=false; });
  /* player pellets vs enemies / boss — only the CORRECT word lands a hit */
  shots.each(s=>{ if(!s.friendly)return;
    for(const e of enemies){ if(e.dead)continue; const hb=e.hurtbox();
      if(s.x>hb.x-4&&s.x<hb.x+hb.w+4&&s.y>hb.y-4&&s.y<hb.y+hb.h+4){
        s.active=false;
        if(e.word===targetWord){ e.hurt(s.dmg); burst(s.x,s.y,4,{color:CREAM}); if(e.dead)advanceTarget(); }
        else{ sfx.clink(); burst(s.x,s.y,3,{color:PAPER,sp1:90,grav:200}); }
        break; } }
    if(s.active&&boss&&bossActive&&!boss.dying&&boss.state!=='intro'){
      const c=boss.center();
      if(dist2(s.x,s.y,c.x,c.y)<105*105){ s.active=false;
        if(boss.word===targetWord){ boss.hurt(s.dmg);
          say(s.x,s.y-10,String(s.dmg),'#fff',13); burst(s.x,s.y,4,{color:YEL}); }
        else{ sfx.clink(); burst(s.x,s.y,3,{color:PAPER,sp1:90,grav:200}); } } } });
  /* enemy shots vs player */
  if(!player.dead)shots.each(s=>{ if(s.friendly)return;
    const hb=player.hurtbox();
    const hit=s.type==='wave'?(Math.abs(s.x-player.x)<26&&player.y>GY-26)
      :(Math.abs(s.x-player.x)<s.r+12&&s.y>hb.y-6&&s.y<hb.y+hb.h+8);
    if(hit){ s.active=false; player.damage(s.x); } });
  /* contact damage */
  if(!player.dead){
    for(const e of enemies){ if(!e.dead&&aabb(player.hurtbox(),e.hurtbox())){player.damage(e.x);break;} }
    if(boss&&bossActive&&!boss.dying&&boss.state!=='intro'){
      if(aabb(player.hurtbox(),{x:boss.x-70,y:GY-185,w:140,h:185}))player.damage(boss.x);
      if(boss.beamOn){ const x0=boss.x+boss.dir*50,len=boss.dir<0?boss.x-ARENA_X-30:LW-boss.x-30;
        const bx=boss.dir<0?x0-len:x0,by=boss.beamHigh?GY-80:GY-30,bh=boss.beamHigh?34:30;
        if(aabb(player.hurtbox(),{x:bx,y:by,w:len,h:bh}))player.damage(boss.x); }
      if(boss.attack==='dash'&&boss.state==='attack'&&
        aabb(player.hurtbox(),{x:boss.x-95,y:GY-170,w:190,h:170}))player.damage(boss.x); } }
  /* pickups */
  for(const p of pickups){ if(!p.active)continue; p.t+=dt;
    if(!player.dead&&Math.abs(p.x-player.x)<26&&Math.abs(p.y-(player.y-30))<42){
      p.active=false; sfx.coin(); burst(p.x,p.y,10,{color:YEL,grav:100});
      if(p.type==='heart'){ player.hp=Math.min(3,player.hp+1); say(p.x,p.y-16,'+1 HP',RED,18); }
      else{ player.super=Math.min(100,player.super+30); say(p.x,p.y-16,'SUPER UP!',YEL,18); } } }
  updateCamera(dt);
  /* boss trigger */
  if(!bossActive&&!boss&&player.x>5300&&!iris.on)
    startIris(()=>{state='card';cardT=0;},player.x-cam.x,player.y-40);
  /* victory / defeat flow */
  if(victoryT>0){ victoryT-=dt; if(victoryT<=0&&!iris.on)startIris(()=>{state='victory';}); }
  if(player.dead&&player.deathT>1.3&&!iris.on)startIris(()=>{state='gameover';});
}

/* ==================== 11. RENDERING ==================== */
function txt(gg,s,x,y,size,fill,align,outline){
  gg.font='900 '+size+"px 'Arial Black',Arial,sans-serif";
  gg.textAlign=align||'center'; gg.textBaseline='middle';
  if(outline!==false){ gg.lineWidth=Math.max(3,size*.16); gg.lineJoin='round';
    gg.strokeStyle=INK; gg.strokeText(s,x,y); }
  gg.fillStyle=fill||'#fff'; gg.fillText(s,x,y); }
function bouncy(gg,s,x,y,size,fill,t,amp){
  gg.font='900 '+size+"px 'Arial Black',Arial,sans-serif";
  gg.textAlign='center'; gg.textBaseline='middle';
  const cs=[...s],ws=cs.map(c=>gg.measureText(c).width);
  let cx2=x-ws.reduce((a,b)=>a+b,0)/2;
  for(let i=0;i<cs.length;i++){ const w=ws[i];
    gg.save(); gg.translate(cx2+w/2,y+Math.sin(t*4+i*.6)*(amp||6)); gg.rotate(Math.sin(t*3+i)*.06);
    gg.lineWidth=Math.max(3,size*.16); gg.lineJoin='round'; gg.strokeStyle=INK; gg.strokeText(cs[i],0,0);
    gg.fillStyle=fill; gg.fillText(cs[i],0,0); gg.restore(); cx2+=w; } }

    if(Math.sin(t*5+p.t)>.96){ star(gg,10,-10,5,2,4); gg.fillStyle='#fff'; gg.fill(); }
    if(p.type==='heart')drawHeart(gg,0,0,1.5,RED);
    else{ star(gg,0,0,13,5.6,5); gg.fillStyle=INK; gg.fill();
      star(gg,0,0,10.6,4.4,5); gg.fillStyle=YEL; gg.fill();
      gg.fillStyle='rgba(255,255,255,.8)'; gg.beginPath(); gg.arc(-3,-3,2,0,TAU); gg.fill(); }
    gg.restore(); }
  for(const e of enemies)e.draw(gg,t);
  if(boss)boss.draw(gg,t);
  player.draw(gg,t);
  drawShots(gg,t);
  drawParts(gg);
  drawTexts(gg);
  if(superRing){ const r2=superRing.t*760;
    gg.save(); gg.globalAlpha=Math.max(0,1-superRing.t);
    gg.strokeStyle=YEL; gg.lineWidth=16*(1-superRing.t)+3;
    gg.beginPath(); gg.arc(superRing.x,superRing.y,r2,0,TAU); gg.stroke();
    gg.strokeStyle='#fff'; gg.lineWidth=5;
    gg.beginPath(); gg.arc(superRing.x,superRing.y,r2*.92,0,TAU); gg.stroke();
    gg.restore(); }
  gg.restore(); }
function render(t){
  g.setTransform(1,0,0,1,0,0);
  if(state==='title')drawTitle(g,t);
  else{
    drawSky(t,cam.x);
    drawParallax(t,cam.x,cam.y);
    drawWorld(g,t);
    if(state==='play')drawHUD(g,t);
    if(state==='card')drawCard(g,t);
    if(state==='gameover')drawGameOver(g,t);
    if(state==='victory')drawVictory(g,t);
    if(state==='play'&&paused)drawPause(g,t);
    /* red damage flash */
    if(state==='play'&&player.hurtT>.28){ g.fillStyle='rgba(192,73,47,'+((player.hurtT-.28)*1.6)+')';
      g.fillRect(0,0,VW,VH); }
    if(superFlash>0){ g.fillStyle='rgba(243,226,194,'+Math.min(.85,superFlash)+')'; g.fillRect(0,0,VW,VH); }
  }
  drawIris(); }

/* ==================== 12. FILM POST-PROCESSING ==================== */
const grain=[];
for(let k=0;k<3;k++){ const c=document.createElement('canvas'); c.width=c.height=160;
  const gc2=c.getContext('2d'),id=gc2.createImageData(160,160);
  for(let i=0;i<id.data.length;i+=4){ const v=irand(0,255);
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=30; }
  gc2.putImageData(id,0,0); grain.push(c); }
let scratches=[],dustMotes=[],bandY=-200; const flickSeed=rand(9);
function updateFilm(dt,t){
  if(Math.random()<dt*1.2)scratches.push({x:rand(VW),w:rand(.6,1.6),life:rand(.15,.5),t:0,a:rand(.05,.14),dark:Math.random()<.5});
  for(const s of scratches)s.t+=dt;
  scratches=scratches.filter(s=>s.t<s.life);
  if(dustMotes.length<14&&Math.random()<dt*6)dustMotes.push({x:rand(VW),y:-10,r:rand(.8,2.4),vy:rand(20,60),a:rand(.05,.16)});
  for(const m of dustMotes){ m.y+=m.vy*dt; m.x+=Math.sin(t+m.y*.01)*8*dt; }
  dustMotes=dustMotes.filter(m=>m.y<VH+10);
  bandY+=dt*90; if(bandY>VH+160)bandY=-160-rand(500); }
function present(t){
  const w=SW(),h=SH();
  dc.setTransform(dpr,0,0,dpr,0,0);
  dc.fillStyle='#0b0805'; dc.fillRect(0,0,w,h);
  const sc=Math.min(w/VW,h/VH),dw=VW*sc,dh=VH*sc,dx=(w-dw)/2,dy=(h-dh)/2;
  const jx=Math.sin(t*1.3+flickSeed)*1.1+rand(-.5,.5),jy=Math.cos(t*1.7)*.9+rand(-.5,.5);
  dc.imageSmoothingEnabled=true;
  dc.drawImage(game,dx+jx,dy+jy,dw,dh);
  dc.save();
  dc.globalCompositeOperation='overlay';
  dc.fillStyle='rgba(255,176,92,0.10)'; dc.fillRect(dx,dy,dw,dh);          // warm sepia wash
  const fl=Math.sin(t*43)*.5+Math.sin(t*9.7)*.5;
  const fb=fl*.028+rand(-.012,.012);                                       // flicker
  dc.globalCompositeOperation=fb>0?'screen':'multiply';
  dc.fillStyle=fb>0?'rgba(255,240,210,'+fb+')':'rgba(40,28,16,'+(-fb)+')';
  dc.fillRect(dx,dy,dw,dh);
  dc.globalCompositeOperation='overlay';                                   // grain
  const gr=grain[(t*24|0)%3],ox=irand(0,80),oy=irand(0,80);
  for(let yy=-oy;yy<dh;yy+=160)for(let xx=-ox;xx<dw;xx+=160)dc.drawImage(gr,dx+xx,dy+yy);
  dc.restore();
  dc.save(); dc.globalCompositeOperation='screen';                         // projector band
  const bg=dc.createLinearGradient(0,dy+bandY-60,0,dy+bandY+60);
  bg.addColorStop(0,'rgba(255,240,210,0)'); bg.addColorStop(.5,'rgba(255,240,210,0.05)');
  bg.addColorStop(1,'rgba(255,240,210,0)');
  dc.fillStyle=bg; dc.fillRect(dx,dy+bandY-60,dw,120); dc.restore();
  const vg=dc.createRadialGradient(w/2,h/2,Math.min(dw,dh)*.42,w/2,h/2,Math.max(dw,dh)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(16,8,4,0.55)');
  dc.fillStyle=vg; dc.fillRect(0,0,w,h);                                   // vignette
  dc.save();
  for(const s of scratches){ dc.globalAlpha=s.a*(1-s.t/s.life)*(Math.random()<.5?1:.6);
    dc.fillStyle=s.dark?'#1c120a':'#f7ecd8';
    dc.fillRect(dx+s.x*sc,dy,s.w,dh); }
  dc.globalAlpha=1;
  for(const m of dustMotes){ dc.globalAlpha=m.a; dc.fillStyle='#f7ecd8';
    dc.beginPath(); dc.arc(dx+m.x*sc,dy+m.y*sc,m.r*sc*.6,0,TAU); dc.fill(); }
  dc.restore(); }

/* ==================== 13. MAIN LOOP ==================== */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let rdt=(now-last)/1000; last=now;
  if(rdt>.05)rdt=.05;
  tGlobal+=rdt;
  updateIris(rdt); updateFilm(rdt,tGlobal);
  if(hitstop>0)hitstop-=rdt;
  meta();
  if(state==='card'){ cardT+=rdt;
    if(cardT>2.4&&!iris.on)startIris(()=>{state='play';spawnBoss();}); }
  const dt=(state==='play'&&!paused&&hitstop<=0)?rdt:0;
  if(state==='play')updatePlay(dt);
  if(superFlash>0)superFlash-=rdt*1.6;
  if(superRing){ superRing.t+=rdt*1.5; if(superRing.t>1)superRing=null; }
  render(tGlobal);
  present(tGlobal);
  for(const k in pressed)pressed[k]=false;
}
requestAnimationFrame(loop);
</script>
