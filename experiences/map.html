<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Palm Tree - خريطة عمان التعليمية</title>
<style>
:root{ --sand:#F5EDD8; --linen:#EDE0C4; --clay:#C9AA80; --earth:#8C6A3F; --soil:#4A3520; --burgundy:#360304; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Almarai','Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
body { background:var(--sand); min-height:100vh; color:var(--soil); }
#container { max-width:900px; margin:0 auto; padding:20px; }
h1 { text-align:center; color:var(--burgundy); margin-bottom:6px; font-size:22px; }
#subtitle { text-align:center; color:var(--earth); margin-bottom:4px; font-size:14px; }
#note { text-align:center; color:var(--earth); opacity:.75; margin-bottom:18px; font-size:11px; }

#map-container { position:relative; width:100%; max-width:520px; margin:0 auto; background:var(--linen); border-radius:16px; padding:16px; border:1px solid var(--clay); }

.region { fill:rgba(140,106,63,0.12); stroke:var(--clay); stroke-width:1.5; cursor:pointer; transition:all 0.3s; }
.region:hover { fill:rgba(140,106,63,0.3); stroke:var(--burgundy); stroke-width:2.5; }
.region.active { fill:rgba(54,3,4,0.25); stroke:var(--burgundy); stroke-width:3; }

.city-dot { fill:var(--burgundy); stroke:#fff; stroke-width:1.2; cursor:pointer; transition:all 0.3s; }
.city-dot:hover { r:7; fill:var(--earth); }

.city-label { fill:var(--soil); font-size:9px; font-weight:600; pointer-events:none; text-anchor:middle; }
.region-label { fill:var(--soil); font-size:8.5px; font-weight:700; pointer-events:none; text-anchor:middle; opacity:.85; }

#info-panel { margin-top:18px; background:var(--linen); padding:16px; border-radius:12px; border:1px solid var(--clay); min-height:120px; }
#info-title { color:var(--burgundy); font-size:18px; font-weight:700; margin-bottom:8px; }
#info-en { color:#2E5C8A; font-size:16px; font-weight:700; margin-bottom:4px; }
#info-ar { color:var(--earth); font-size:14px; margin-bottom:8px; }
#info-fact { color:var(--soil); opacity:.85; font-size:13px; line-height:1.6; }

#score-bar { display:flex; justify-content:center; gap:20px; margin-top:15px; flex-wrap:wrap; }
.score-item { background:var(--linen); border:1px solid var(--clay); padding:8px 16px; border-radius:10px; font-size:13px; font-weight:600; color:var(--soil); }

#quiz-btn { display:block; margin:20px auto 0; background:var(--soil); color:var(--sand); border:1.5px solid var(--soil); padding:10px 28px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; transition:background .25s; }
#quiz-btn:hover { background:var(--earth); border-color:var(--earth); }
#quiz-btn:active { transform:scale(0.95); }

#quiz-panel { display:none; margin-top:15px; background:var(--linen); padding:16px; border-radius:12px; border:1px solid var(--clay); }
#quiz-cat { color:#2E5C8A; font-size:11px; font-weight:700; text-align:center; margin-bottom:6px; letter-spacing:.5px; }
#quiz-progress { color:var(--earth); font-size:11px; text-align:center; margin-bottom:10px; }
#quiz-question { color:var(--soil); font-size:14px; margin-bottom:12px; text-align:center; }
.quiz-option { display:block; width:100%; background:var(--sand); border:1px solid var(--clay); color:var(--soil); padding:10px; margin-bottom:6px; border-radius:8px; font-size:13px; cursor:pointer; text-align:center; }
.quiz-option:active { background:var(--clay); }
.quiz-option.correct-answer { background:rgba(76,175,80,0.35); border-color:#4CAF50; }
.quiz-option.wrong-answer { background:rgba(220,53,69,0.3); border-color:#dc3545; }
#quiz-result { color:var(--burgundy); font-size:14px; margin-top:10px; text-align:center; font-weight:700; }

@media (max-width:480px) {
    h1 { font-size:18px; }
    #map-container { padding:10px; }
}
</style>
<link rel="icon" type="image/png" href="../public/favicon.png">
<link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
</head>
<body>

    </div>

    <div id="info-panel">

    <div id="score-bar">

<script>
const regions = {
    'musandam': { en: 'Musandam', ar: 'مسندم', fact: 'شبه جزيرة منفصلة جغرافياً عن باقي عمان (تفصلها أراضي الإمارات)، تطل على مضيق هرمز وتُعرف بـ"جبال عمان" ومناظرها الفيوردية الخلابة.' },
    'buraimi': { en: 'Al Buraimi', ar: 'البريمي', fact: 'أصغر محافظات عمان مساحة، واحة حدودية تاريخية تجاور مدينة العين الإماراتية مباشرة.' },
    'batinah-north': { en: 'Al Batinah North', ar: 'شمال الباطنة', fact: 'شريط ساحلي خصب على بحر عمان، تضم مدينة صحار الميناء التاريخي الذي وُلد فيه الرحالة أحمد بن ماجد.' },
    'batinah-south': { en: 'Al Batinah South', ar: 'جنوب الباطنة', fact: 'منطقة زراعية غنية بمزارع النخيل والموز، تضم قلعة الرستاق التاريخية إحدى أقدم عواصم عمان.' },
    'muscat': { en: 'Muscat', ar: 'مسقط', fact: 'عاصمة السلطنة وقلبها السياسي والتجاري، تضم قصر العلم وجامع السلطان قابوس الأكبر ودار الأوبرا السلطانية.' },
    'dhahirah': { en: 'Ad Dhahirah', ar: 'الظاهرة', fact: 'منطقة داخلية تاريخية تجاور المملكة العربية السعودية، تشتهر بواحاتها الزراعية القديمة ومدينة عبري.' },
    'dakhiliyah': { en: 'Ad Dakhiliyah', ar: 'الداخلية', fact: 'قلب عمان التاريخي وموطن جبل الأخضر، تضم قلعة نزوى وقلعة بهلاء (المسجّلة في اليونسكو) وقلعة جبرين. وهي المحافظة التي تقع فيها ولاية سمائل، قرية أحداث الرواية!' },
    'sharqiyah-north': { en: 'Ash Sharqiyah North', ar: 'شمال الشرقية', fact: 'تطل على بحر العرب، تضم مدينة صور المشهورة تاريخياً ببناء السفن الشراعية التقليدية (الدهو والسنبوك).' },
    'sharqiyah-south': { en: 'Ash Sharqiyah South', ar: 'جنوب الشرقية', fact: 'موطن رمال الشرقية (وهيبة ساندز) الصحراء الذهبية الشهيرة برحلات السفاري ومراقبة النجوم.' },
    'wusta': { en: 'Al Wusta', ar: 'الوسطى', fact: 'ثاني أكبر محافظات عمان مساحة، منطقة صحراوية شاسعة تضم ميناء الدقم التنموي الضخم ومحمية المها العربي الطبيعية.' },
    'dhofar': { en: 'Dhofar', ar: 'ظفار', fact: 'أكبر محافظات عمان مساحة (حوالي ثلث مساحة السلطنة)، تشتهر بموسم الخريف الأخضر وأشجار اللبان المسجّلة في قائمة اليونسكو، وعاصمتها صلالة.' }
};

const cities = {
    'muscat': { en: 'Muscat', ar: 'مسقط', fact: 'عاصمة عمان، ميناء تاريخي عريق حكمته البرتغال لفترة قبل تحريره، ومقر الحكومة اليوم.' },
    'sohar': { en: 'Sohar', ar: 'صحار', fact: 'يُعتقد أنها كانت عاصمة حضارة "مجان" القديمة المرتبطة بتجارة النحاس قبل آلاف السنين.' },
    'nizwa': { en: 'Nizwa', ar: 'نزوى', fact: 'كانت عاصمة عمان قديماً، وقلعتها الدائرية الشهيرة من أهم المعالم التاريخية في البلاد.' },
    'bahla': { en: 'Bahla', ar: 'بهلاء', fact: 'قلعتها التاريخية أول موقع عماني يُسجَّل في قائمة التراث العالمي لليونسكو (1987).' },
    'jabrin': { en: 'Jabrin', ar: 'جبرين', fact: 'قصر تاريخي يُلقَّب بـ"جوهرة القلاع العمانية" لسقوفه المزخرفة وزخارفه الفنية الدقيقة.' },
    'sur': { en: 'Sur', ar: 'صور', fact: 'مدينة الصناعة البحرية التقليدية، لا تزال ورش بناء السفن الخشبية (الدهو) تعمل فيها حتى اليوم.' },
    'salalah': { en: 'Salalah', ar: 'صلالة', fact: 'عاصمة محافظة ظفار، تتحول إلى واحة خضراء كل صيف خلال موسم الخريف الاستوائي.' },
    'buraimi_city': { en: 'Al Buraimi', ar: 'البريمي', fact: 'مدينة واحة حدودية، تتصل مباشرة بمدينة العين الإماراتية دون حدود مرئية بين المدينتين.' },
    'ibri': { en: 'Ibri', ar: 'عبري', fact: 'مدينة تاريخية في الظاهرة، معروفة بأسواقها التقليدية وموقعها على طرق القوافل القديمة.' },
    'rustaq': { en: 'Rustaq', ar: 'الرستاق', fact: 'كانت من عواصم عمان القديمة، وقلعتها من أضخم القلاع العمانية وتضم ينابيع مياه معدنية حارة قريبة.' },
    'haima': { en: 'Haima', ar: 'هيماء', fact: 'بلدة صحراوية في قلب محافظة الوسطى، محطة رئيسية على طريق مسقط - صلالة.' },
    'duqm': { en: 'Duqm', ar: 'الدقم', fact: 'ميناء ومنطقة اقتصادية خاصة ضخمة على بحر العرب، من أهم مشاريع التنمية في عمان.' },
    'khasab': { en: 'Khasab', ar: 'خصب', fact: 'عاصمة مسندم، تشتهر برحلات "الداو" بين الخلجان الجبلية الشبيهة بالفيوردات النرويجية.' },
    'jalan': { en: 'Jalan', ar: 'جعلان', fact: 'بوابة رمال الشرقية (وهيبة ساندز)، ونقطة انطلاق شهيرة لرحلات السفاري الصحراوية.' },
    'yanqul': { en: 'Yanqul', ar: 'ينقل', fact: 'ولاية جبلية في شمال الباطنة، قريبة من الحدود مع الإمارات وسلسلة جبال الحجر الغربي.' }
};

let score = 0, words = 0, correct = 0;

function showInfo(data) {
    document.getElementById('info-title').textContent = '📍 ' + data.ar;
    document.getElementById('info-en').textContent = data.en;
    document.getElementById('info-ar').textContent = data.ar;
    document.getElementById('info-fact').textContent = '💡 ' + data.fact;
    score += 5; words++;
    document.getElementById('score').textContent = score;
    document.getElementById('words').textContent = words;
    localStorage.setItem('upt_map_score', JSON.stringify({score, words, correct}));
}

// Region clicks
document.querySelectorAll('.region').forEach(r => {
    r.addEventListener('click', function() {
        document.querySelectorAll('.region').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        const key = this.getAttribute('data-region');
        if(regions[key]) showInfo(regions[key]);
    });
});

// City clicks
document.querySelectorAll('.city-dot').forEach(c => {
    c.addEventListener('click', function(e) {
        e.stopPropagation();
        const key = this.getAttribute('data-city');
        if(cities[key]) showInfo(cities[key]);
    });
});

// ==================== COMPREHENSIVE OMAN QUIZ BANK (78 questions) ====================
const quizQuestions = [
    // --- Geography ---
    { cat: 'الجغرافيا · Geography', q: 'ما هي عاصمة عمان؟', options: ['نزوى', 'مسقط', 'صلالة', 'صحار'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'What is the capital of Oman?', options: ['Nizwa', 'Muscat', 'Salalah', 'Sohar'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'ما اسم أعلى جبل في عمان؟', options: ['جبل شمس', 'جبل الأخضر', 'جبل حفيت', 'جبل قارة'], correct: 0 },
    { cat: 'الجغرافيا · Geography', q: 'What is the highest mountain in Oman?', options: ['Jebel Akhdar', 'Jebel Shams', 'Jebel Hafeet', 'Jebel Qara'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'ما اسم الصحراء الشاسعة التي يشترك فيها جزء من عمان مع السعودية واليمن؟', options: ['الربع الخالي', 'صحراء سيناء', 'صحراء النقب', 'صحراء الصحراء الكبرى'], correct: 0 },
    { cat: 'الجغرافيا · Geography', q: 'Which strait lies near Musandam, one of the world\'s most important shipping lanes?', options: ['Strait of Gibraltar', 'Strait of Hormuz', 'Bab-el-Mandeb', 'Strait of Malacca'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'كم عدد محافظات سلطنة عمان؟', options: ['9', '11', '13', '7'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'Which is the largest governorate in Oman by area?', options: ['Muscat', 'Al Batinah', 'Dhofar', 'Musandam'], correct: 2 },
    { cat: 'الجغرافيا · Geography', q: 'أي محافظة عمانية منفصلة جغرافياً عن باقي البلاد؟', options: ['ظفار', 'مسندم', 'الوسطى', 'الظاهرة'], correct: 1 },
    { cat: 'الجغرافيا · Geography', q: 'What sea borders northern Oman, connecting to the Arabian Sea via the Strait of Hormuz?', options: ['Red Sea', 'Gulf of Oman', 'Caspian Sea', 'Mediterranean Sea'], correct: 1 },

    // --- History ---
    { cat: 'التاريخ · History', q: 'من هو مؤسس النهضة العمانية الحديثة؟', options: ['السلطان سعيد بن تيمور', 'السلطان قابوس بن سعيد', 'السلطان هيثم بن طارق', 'الإمام أحمد بن سعيد'], correct: 1 },
    { cat: 'التاريخ · History', q: 'In what year did Oman\'s modern renaissance begin under Sultan Qaboos?', options: ['1965', '1970', '1980', '1975'], correct: 1 },
    { cat: 'التاريخ · History', q: 'ما اسم الحضارة القديمة المرتبطة بتجارة النحاس في عمان، والمذكورة في نصوص سومرية قديمة؟', options: ['مجان (Magan)', 'دلمون', 'سبأ', 'إبلا'], correct: 0 },
    { cat: 'التاريخ · History', q: 'Which European power built forts along Oman\'s coast in the 16th century?', options: ['Britain', 'France', 'Portugal', 'Spain'], correct: 2 },

let currentQuiz = 0;
let shuffledQuiz = [];

function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

document.getElementById('quiz-btn').addEventListener('click', () => {
    document.getElementById('quiz-panel').style.display = 'block';
    shuffledQuiz = shuffleArray(quizQuestions);
    currentQuiz = 0;
    showQuizQuestion();
    document.getElementById('quiz-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

function showQuizQuestion() {
    if(currentQuiz >= shuffledQuiz.length) {
        document.getElementById('quiz-cat').textContent = '';
        document.getElementById('quiz-progress').textContent = '';
        document.getElementById('quiz-question').textContent = '🎉 اكتمل الاختبار الشامل!';
        document.getElementById('quiz-options').innerHTML = '';
        document.getElementById('quiz-result').textContent = 'أحسنتم! أجبتم بشكل صحيح على ' + correct + ' من ' + shuffledQuiz.length + ' سؤال. تعلمتم ' + words + ' معلومة عن عُمان!';
        return;
    }
    const q = shuffledQuiz[currentQuiz];
    document.getElementById('quiz-cat').textContent = q.cat;
    document.getElementById('quiz-progress').textContent = 'سؤال ' + (currentQuiz + 1) + ' / ' + shuffledQuiz.length;
    document.getElementById('quiz-question').textContent = q.q;
    document.getElementById('quiz-result').textContent = '';
    const opts = document.getElementById('quiz-options');
    opts.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
            opts.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');
            if(idx === q.correct) {
                btn.classList.add('correct-answer');
                document.getElementById('quiz-result').textContent = '✅ صحيح! +10 نقاط';
                score += 10; correct++;
            } else {
                btn.classList.add('wrong-answer');
                opts.children[q.correct].classList.add('correct-answer');
                document.getElementById('quiz-result').textContent = '❌ الإجابة الصحيحة: ' + q.options[q.correct];
            }
            document.getElementById('score').textContent = score;
            document.getElementById('correct').textContent = correct;
            localStorage.setItem('upt_map_score', JSON.stringify({score, words, correct}));
            setTimeout(() => { currentQuiz++; showQuizQuestion(); }, 1800);
        });
        opts.appendChild(btn);
    });
}

// Load saved
const saved = localStorage.getItem('upt_map_score');
if(saved) {
    const data = JSON.parse(saved);
    score = data.score || 0; words = data.words || 0; correct = data.correct || 0;
    document.getElementById('score').textContent = score;
    document.getElementById('words').textContent = words;
    document.getElementById('correct').textContent = correct;
}
