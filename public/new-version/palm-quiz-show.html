<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Palm Quiz Show</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet"/>
<style>
:root {
  color-scheme: light only;
  --paper-light:#f5e9d0;--paper-mid:#e8d5b0;--paper-deep:#c5ac80;
  --paper-shadow:#f0dfb8;--burgundy:#5a1a1f;--burgundy-deep:#2b0102;
  --burgundy-dark:#4a0a14;--green:#6f8a44;--green-deep:#3a5024;
  --green-soft:#8a9a4e;--gold:#c79a4a;--gold-bright:#d8b06a;
  --gold-soft:#b3927c;--olive:#5e4a2e;--olive-deep:#3a2c1a;
  --ink:#1a0a06;--ink-soft:#3a2418;--cream:#dbc7a6;--cream-card:#faf3e0;
  --error:#a83a3a;--success:#5a8a3a;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper-light);
  font-family:'Cormorant Garamond',Georgia,serif;
  min-height:100vh;color:var(--ink);overflow-x:hidden;
}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(94,74,46,.06) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(90,26,31,.05) 0%,transparent 50%);pointer-events:none;z-index:0}

.back-link{
  position:fixed;top:14px;left:14px;z-index:50;
  color:var(--burgundy);text-decoration:none;
  font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  background:var(--cream-card);padding:6px 14px;
  border-radius:20px;border:1.5px solid var(--olive);
}

/* ── LOBBY ── */
#lobbyScreen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lobby-palm{font-size:5rem;animation:sway 4s ease-in-out infinite;display:block;margin-bottom:16px}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.lobby-title{font-family:'Aref Ruqaa',serif;font-size:clamp(2rem,8vw,3.5rem);color:var(--burgundy-deep);text-shadow:0 4px 30px rgba(43,1,2,.15);margin-bottom:8px;text-align:center}
.lobby-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(.85rem,2vw,1rem);color:var(--olive);margin-bottom:36px;text-align:center;font-style:italic}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:480px;margin-bottom:20px}
.mode-btn{
  padding:18px 14px;border-radius:20px;border:2px solid var(--olive);
  cursor:pointer;font-family:'Aref Ruqaa',serif;font-size:1.05rem;
  color:var(--cream);text-align:center;transition:all .25s;line-height:1.35;
}
.mode-btn:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(58,31,14,.2)}
.mode-btn.m1{background:linear-gradient(135deg,var(--burgundy),var(--burgundy-dark))}
.mode-btn.m2{background:linear-gradient(135deg,var(--olive),var(--olive-deep))}
.mode-btn.m3{background:linear-gradient(135deg,var(--green),var(--green-deep))}
.mode-btn.m4{background:linear-gradient(135deg,var(--gold),var(--gold-soft))}
.mode-btn .mode-icon{font-size:1.8rem;display:block;margin-bottom:5px}
.mode-btn .mode-sub{font-size:.72rem;opacity:.82;display:block;margin-top:3px;font-family:'Cormorant Garamond',serif;font-weight:600}

/* ── GAME ── */
#gameScreen{display:none;min-height:100vh;position:relative;z-index:1}
.top-bar{
  background:linear-gradient(180deg,var(--burgundy-deep),var(--burgundy-dark));
  border-bottom:3px solid var(--gold);
  padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.tb-score{font-family:'Aref Ruqaa',serif;font-size:1.1rem;color:var(--gold-bright)}
.tb-streak{font-family:'Cormorant Garamond',serif;font-size:.85rem;font-weight:700;color:var(--cream)}
.tb-q{font-family:'Special Elite',monospace;font-size:.78rem;color:var(--cream);letter-spacing:1px}

.timer-section{display:flex;flex-direction:column;align-items:center;padding:16px 18px 8px}
.timer-ring-wrap{position:relative;width:80px;height:80px;margin-bottom:6px}
.timer-ring-svg{width:80px;height:80px;transform:rotate(-90deg)}
.timer-track{fill:none;stroke:var(--paper-mid);stroke-width:6}
.timer-fill{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:201;transition:stroke-dashoffset .5s linear,stroke .3s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Aref Ruqaa',serif;font-size:1.6rem;color:var(--burgundy-deep)}

.q-box{
  background:var(--cream-card);border:2px solid var(--olive);border-radius:20px;
  padding:20px 20px;margin:0 14px 16px;text-align:center;
  box-shadow:0 4px 14px rgba(58,31,14,.06);
}
.q-tag{font-family:'Special Elite',monospace;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.q-text{font-family:'Aref Ruqaa',serif;font-size:clamp(1.1rem,3.5vw,1.5rem);color:var(--burgundy-deep);line-height:1.35}

.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 20px}
.ans-btn{
  padding:18px 12px;border-radius:18px;border:2px solid var(--olive);
  cursor:pointer;font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(.85rem,2.5vw,1rem);color:var(--cream);text-align:center;line-height:1.4;
  transition:all .18s;position:relative;display:flex;align-items:center;gap:10px;
}
.ans-btn:hover:not(:disabled){transform:scale(1.03);filter:brightness(1.1)}
.ans-btn:disabled{cursor:not-allowed}
.ans-btn.a0{background:var(--burgundy)}
.ans-btn.a1{background:var(--olive)}
.ans-btn.a2{background:var(--green-deep)}
.ans-btn.a3{background:var(--gold)}
.ans-btn.dim{opacity:.35;transform:none!important}
.ans-btn.correct{box-shadow:0 0 0 4px var(--cream-card),0 0 0 6px var(--green);animation:correctPop .4s cubic-bezier(.34,1.56,.64,1)}
.ans-btn.wrong{box-shadow:0 0 0 4px var(--cream-card),0 0 0 6px var(--error);animation:wrongShake .35s}
@keyframes correctPop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ans-shape{font-size:1.3rem;flex-shrink:0}
.ans-text{flex:1}

.fb-banner{
  background:var(--cream-card);border:2px solid var(--olive);border-radius:16px;
  padding:14px 18px;margin:0 14px 14px;text-align:center;
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:.95rem;
  display:none;line-height:1.55;
}
.fb-banner.ok{background:rgba(106,138,58,.12);border-color:var(--green-deep);color:var(--green-deep);display:block}
.fb-banner.no{background:rgba(168,58,58,.08);border-color:var(--error);color:var(--burgundy);display:block}
.fb-ar{font-family:'Aref Ruqaa',serif;font-size:.85rem;opacity:.75;direction:rtl;text-align:right;margin-top:3px}

.btn-next-q{
  display:none;width:calc(100% - 28px);margin:0 14px 20px;
  background:linear-gradient(180deg,var(--gold),var(--olive));
  color:var(--cream);border:2px solid var(--burgundy-deep);
  font-family:'Cinzel',serif;font-size:.88rem;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
  padding:14px;border-radius:16px;cursor:pointer;
  box-shadow:0 4px 0 var(--burgundy-deep);
}
.btn-next-q:hover{transform:translateY(-2px)}

/* ── WIN ── */
#winScreen{
  display:none;min-height:100vh;
  background:var(--paper-light);position:relative;z-index:1;
  flex-direction:column;align-items:center;justify-content:center;padding:28px;
}
.win-confetti{font-size:3rem;margin-bottom:10px;animation:sway 3s ease-in-out infinite;display:block}
.win-title{font-family:'Aref Ruqaa',serif;font-size:clamp(1.8rem,6vw,3rem);color:var(--burgundy-deep);text-align:center;margin-bottom:4px}
.win-score{font-family:'Cinzel',serif;font-size:clamp(2.5rem,8vw,4rem);color:var(--gold);letter-spacing:4px;margin:10px 0}
.win-stars{font-size:2.5rem;margin-bottom:10px}
.win-msg{font-family:'Cormorant Garamond',serif;font-size:clamp(.88rem,2vw,1rem);color:var(--olive);text-align:center;font-style:italic;margin-bottom:28px;line-height:1.6;max-width:380px}
.win-stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.win-stat{text-align:center;background:var(--cream-card);border:1.5px solid var(--olive);border-radius:16px;padding:14px 20px}
.ws-val{font-family:'Aref Ruqaa',serif;font-size:1.6rem;color:var(--gold)}
.ws-lbl{font-family:'Special Elite',monospace;font-size:.65rem;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.btn-play-again{
  background:linear-gradient(180deg,var(--gold),var(--olive));
  color:var(--cream);border:2px solid var(--burgundy-deep);
  font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;
  padding:14px 40px;border-radius:24px;cursor:pointer;
  box-shadow:0 5px 0 var(--burgundy-deep);letter-spacing:3px;text-transform:uppercase;
  transition:all .1s;margin:6px;
}
.btn-play-again:hover{transform:translateY(-2px)}
.btn-back-lobby{
  background:var(--cream-card);border:1.5px solid var(--olive);
  color:var(--burgundy);font-family:'Cinzel',serif;font-weight:600;
  font-size:.85rem;padding:12px 28px;border-radius:20px;
  cursor:pointer;margin:6px;transition:all .25s;letter-spacing:2px;text-transform:uppercase;
}
.btn-back-lobby:hover{background:var(--paper-shadow)}

@media(max-width:380px){.mode-grid{grid-template-columns:1fr}.ans-grid{grid-template-columns:1fr}}

/* ── THURAYA GUIDE ── */
#thurayaGuide{
  position:fixed;right:16px;bottom:16px;z-index:9999;
  display:flex;align-items:end;gap:12px;font-family:'Cormorant Garamond',serif;
}
#thurayaGuide .tg-avatar{
  width:92px;height:92px;border-radius:50%;object-fit:cover;
  border:4px solid var(--gold);box-shadow:0 10px 30px rgba(58,31,14,.18);background:#fff;
}
#thurayaGuide .tg-panel{
  max-width:320px;background:var(--cream-card);color:var(--ink);
  border-radius:18px;padding:14px 14px 12px;
  box-shadow:0 10px 30px rgba(58,31,14,.12);border:1.5px solid var(--olive);
}
#thurayaGuide .tg-name{font-family:'Cinzel',serif;font-weight:600;font-size:.82rem;letter-spacing:2px;color:var(--burgundy);margin-bottom:4px;text-transform:uppercase}
#thurayaGuide .tg-text{font-size:.9rem;line-height:1.5}
#thurayaGuide .tg-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#thurayaGuide button{border:1.5px solid var(--olive);border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.78rem;font-family:'Special Elite',monospace;letter-spacing:1px}
#thurayaGuide .tg-play{background:var(--green-deep);color:var(--cream)}
#thurayaGuide .tg-mute{background:var(--paper-shadow);color:var(--burgundy)}
#thurayaGuide.min .tg-panel{display:none}
@media(max-width:640px){#thurayaGuide{right:10px;left:10px;bottom:10px;justify-content:end}#thurayaGuide .tg-avatar{width:74px;height:74px}#thurayaGuide .tg-panel{max-width:240px}}
</style>
<style id="hide-iframe-chrome">.top-bar,.header,.game-header,.back-link,.header-icon,.header-palm{display:none !important;}</style>
<script src="../js/piper-client.js"></script>
<script src="../js/palm-sfx.js" defer></script>
<script src="../js/palm-globe-fab.js" defer></script>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<a class="back-link" href="index.html">← Home</a>

<div id="lobbyScreen">
  <span class="lobby-palm">🌴</span>
  <h1 class="lobby-title">Palm Quiz Show!</h1>
  <p class="lobby-sub">Fast quiz — big fun — real English! 🎉<br>اختر مودك وابدأ!</p>
  <div class="mode-grid">
    <button class="mode-btn m1" onclick="startGame('vocab')"><span class="mode-icon">📚</span>Vocabulary<span class="mode-sub">Words from all 12 stories</span></button>
    <button class="mode-btn m2" onclick="startGame('grammar')"><span class="mode-icon">📌</span>Grammar<span class="mode-sub">Present · Past · Future</span></button>
    <button class="mode-btn m3" onclick="startGame('characters')"><span class="mode-icon">👥</span>Characters<span class="mode-sub">Who said / did / is...</span></button>
    <button class="mode-btn m4" onclick="startGame('mix')"><span class="mode-icon">🌴</span>Full Mix<span class="mode-sub">All topics — hardest!</span></button>
  </div>
</div>

<div id="gameScreen">
  <div class="top-bar">
    <div class="tb-score">⭐ <span id="tbScore">0</span></div>
    <div class="tb-streak" id="tbStreak"></div>
    <div class="tb-q" id="tbQ">Q 1 / 15</div>
  </div>
  <div class="timer-section">
    <div class="timer-ring-wrap">
      <svg class="timer-ring-svg" viewBox="0 0 80 80"><circle class="timer-track" cx="40" cy="40" r="32"/><circle class="timer-fill" id="timerFill" cx="40" cy="40" r="32"/></svg>
      <div class="timer-num" id="timerNum">10</div>
    </div>
  </div>
  <div class="q-box"><div class="q-tag" id="qTag"></div><div class="q-text" id="qText"></div></div>
  <div class="ans-grid" id="ansGrid"></div>
  <div class="fb-banner" id="fbBanner"></div>
  <button class="btn-next-q" id="btnNextQ" onclick="nextQ()">Next Question →</button>
</div>

<div id="winScreen">
  <span class="win-confetti">🌴</span>
  <div class="win-title" id="winTitle">Round Complete!</div>
  <div class="win-stars" id="winStars">⭐⭐⭐</div>
  <div class="win-score" id="winScore">0 pts</div>
  <div class="win-stats">
    <div class="win-stat"><div class="ws-val" id="wsCorrect">0</div><div class="ws-lbl">Correct</div></div>
    <div class="win-stat"><div class="ws-val" id="wsAcc">0%</div><div class="ws-lbl">Accuracy</div></div>
    <div class="win-stat"><div class="ws-val" id="wsTime">0s</div><div class="ws-lbl">Avg Time</div></div>
    <div class="win-stat"><div class="ws-val" id="wsStreak">0🔥</div><div class="ws-lbl">Best Streak</div></div>
  </div>
  <div class="win-msg" id="winMsg"></div>
  <button class="btn-play-again" onclick="replayMode()">🎲 Play Again</button>
  <button class="btn-back-lobby" onclick="goLobby()">← Change Mode</button>
</div>

<script>
const BANKS={
  vocab:[
    {q:'What does FALAJ mean?',opts:['A palm tree','A water channel','A school','A market'],answer:'A water channel',tag:'Vocabulary',story:'Story 2',exp:'The falaj is the ancient water channel of Al-Qurawashiyah.',expAr:'الفلج هو قناة الماء القديمة في القرواشية.'},
    {q:'What does BRAVE mean?',opts:['Very tired','Not afraid of danger','Very loud','Running fast'],answer:'Not afraid of danger',tag:'Vocabulary',story:'Story 5',exp:'Brave = not afraid of danger. Mansoor was brave!',expAr:'brave = شجاع — غير خائف من الخطر. منصور كان شجاعاً!'},
    {q:'What does HERITAGE mean?',opts:['A type of food','Culture passed down through generations','A school subject','A new invention'],answer:'Culture passed down through generations',tag:'Vocabulary',story:'Story 6',exp:'Heritage is culture and traditions passed from one generation to the next.',expAr:'التراث هو الثقافة والتقاليد التي تنتقل من جيل إلى آخر.'},
    {q:'What does PATIENT mean?',opts:['Moving very fast','Being very loud','Waiting calmly without complaining','Knowing everything'],answer:'Waiting calmly without complaining',tag:'Vocabulary',story:'Story 4',exp:'Patient = waiting calmly. John was very patient with his students.',expAr:'patient = صبور. جون كان صبوراً جداً مع طلابه.'},
    {q:'What does WISDOM mean?',opts:['A type of plant','Deep understanding and knowledge','A traditional food','A style of building'],answer:'Deep understanding and knowledge',tag:'Vocabulary',story:'Story 10',exp:'Wisdom = deep knowledge and good judgment.',expAr:'الحكمة = معرفة عميقة وحكم صحيح.'},
    {q:'What does RELIEF mean?',opts:['A type of spice','The feeling when danger is over','A traditional tool','A kind of music'],answer:'The feeling when danger is over',tag:'Vocabulary',story:'Story 5',exp:'Relief is the good feeling you have when something scary is over.',expAr:'الارتياح هو الشعور الجيد حين ينتهي شيء مخيف.'},
    {q:'What does HARVEST mean?',opts:['To plant seeds','To water trees','To collect crops from the farm','To build a house'],answer:'To collect crops from the farm',tag:'Vocabulary',story:'Story 8',exp:'Harvest = collect crops. Sadoo climbed the palm tree to harvest dates.',expAr:'الحصاد = جمع المحاصيل.'},
    {q:'What does NARROW mean?',opts:['Very wide','Not wide — small path','Very tall','Very dark'],answer:'Not wide — small path',tag:'Vocabulary',story:'Story 2',exp:'Narrow = not wide. The paths between the mud houses were narrow.',expAr:'ضيّق = غير عريض.'},
    {q:'What does INSPIRE mean?',opts:['To make someone tired','To make someone afraid','To make someone want to try harder','To make someone sleep'],answer:'To make someone want to try harder',tag:'Vocabulary',story:'Story 12',exp:'Inspire = encourage someone to try.',expAr:'يُلهم = يشجع أحداً على المحاولة.'},
    {q:'What does TRADITION mean?',opts:['Something new and modern','Something done for a long time','A type of machine','A kind of animal'],answer:'Something done for a long time',tag:'Vocabulary',story:'Story 6',exp:'Tradition = something done for a very long time.',expAr:'التقليد = شيء يُفعل منذ زمن طويل.'},
    {q:'What does HESITATE mean?',opts:['To run very fast','To speak very loudly','To pause nervously before doing something','To laugh loudly'],answer:'To pause nervously before doing something',tag:'Vocabulary',story:'Story 11',exp:'Hesitate = pause before doing.',expAr:'يتردد = يتوقف قبل الفعل.'},
    {q:'What does IDENTITY mean?',opts:['A type of food','A kind of building','Who you are — your name and story','A traditional tool'],answer:'Who you are — your name and story',tag:'Vocabulary',story:'Story 6',exp:'Identity = who you are.',expAr:'الهوية = من أنت.'},
    {q:'What does HUMBLE mean?',opts:['Very loud and proud','Modest — not showing off','Always running','Very hungry'],answer:'Modest — not showing off',tag:'Vocabulary',story:'Story 10',exp:'Humble = modest. Khalaf was quiet and humble.',expAr:'متواضع = لا يتباهى.'},
    {q:'What does WONDER mean?',opts:['A type of food','A building material','A feeling of amazement','A kind of tool'],answer:'A feeling of amazement',tag:'Vocabulary',story:'Story 9',exp:'Wonder = amazement.',expAr:'الدهشة = الإعجاب والذهول.'},
    {q:'What does ANCESTOR mean?',opts:['A new invention','A family member from the past','A type of plant','A school subject'],answer:'A family member from the past',tag:'Vocabulary',story:'Story 6',exp:'Ancestor = a family member from the past.',expAr:'الجد = فرد من العائلة من الماضي.'},
  ],
  grammar:[
    {q:'John ___ English every day.',opts:['teach','teaches','taught','is teach'],answer:'teaches',tag:'Simple Present',story:'Story 1',exp:'He/She/It → verb + s.',expAr:'نضيف s للفعل مع he في المضارع البسيط.'},
    {q:'The wasp ___ on John\'s shoulder.',opts:['land','lands','landed','was land'],answer:'landed',tag:'Simple Past',story:'Story 5',exp:'land + ed = landed.',expAr:'land فعل منتظم ماضيه landed.'},
    {q:'Khamees ___ read perfectly one day.',opts:['will','is','was','does'],answer:'will',tag:'Simple Future',story:'Story 12',exp:'will + base verb = Simple Future.',expAr:'will + الفعل الأساسي = المستقبل البسيط.'},
    {q:'___ Sadoo know everyone in the village?',opts:['Do','Does','Did','Will'],answer:'Does',tag:'Questions',story:'Story 8',exp:'Does for He/She/It in Simple Present questions.',expAr:'Does للأسئلة مع he/she/it في المضارع البسيط.'},
    {q:'Uncle Nasser ___ them to the village.',opts:['drive','drives','drove','drived'],answer:'drove',tag:'Simple Past',story:'Story 6',exp:'drive → drove. Irregular past tense.',expAr:'drive فعل شاذ ماضيه drove.'},
    {q:'Sophia\'s face ___ bright yellow.',opts:['turn','turns','turned','was turn'],answer:'turned',tag:'Simple Past',story:'Story 7',exp:'turn + ed = turned.',expAr:'turn فعل منتظم ماضيه turned.'},
    {q:'Trust slowly ___ in the classroom.',opts:['grow','grows','grew','growed'],answer:'grew',tag:'Simple Past',story:'Story 4',exp:'grow → grew. Irregular past tense.',expAr:'grow فعل شاذ ماضيه grew.'},
    {q:'The falaj ___ water to the farms.',opts:['carry','carries','carried','is carry'],answer:'carries',tag:'Simple Present',story:'Story 2',exp:'carry → carries (y to ies).',expAr:'carry تصبح carries مع it.'},
    {q:'Mansoor ___ sit quietly in class.',opts:["don't","doesn't","didn't","won't"],answer:"doesn't",tag:'Simple Present Negative',story:'Story 3',exp:"doesn't = does not.",expAr:"doesn't للنفي مع he/she/it."},
    {q:'John ___ get a letter last week.',opts:["don't","doesn't","didn't","won't"],answer:"didn't",tag:'Simple Past Negative',story:'Story 1',exp:"didn't = did not.",expAr:"didn't للنفي في الماضي البسيط."},
    {q:'___ did the wasp land?',opts:['What','Where','Who','How'],answer:'Where',tag:'Questions',story:'Story 5',exp:'Where asks about PLACE.',expAr:'Where للسؤال عن المكان.'},
    {q:'The children ___ "Good morning" together.',opts:['say','says','said','sayed'],answer:'said',tag:'Simple Past',story:'Story 3',exp:'say → said. Irregular.',expAr:'say فعل شاذ ماضيه said.'},

BANKS.mix=shuffle([...BANKS.vocab,...BANKS.grammar,...BANKS.characters]).slice(0,20);
const SHAPES=['▲','⬟','●','■'];
let pool=[],qIdx=0,score=0,streak=0,bestStreak=0,correct=0,answered=false,timerVal=10,timerID=null,totalTime=0,currentMode='vocab';
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function startGame(mode){currentMode=mode;pool=shuffle([...BANKS[mode]]);if(mode!=='mix')pool=pool.slice(0,15);qIdx=0;score=0;streak=0;bestStreak=0;correct=0;totalTime=0;answered=false;document.getElementById('lobbyScreen').style.display='none';document.getElementById('winScreen').style.display='none';document.getElementById('gameScreen').style.display='block';showQ();}
function showQ(){if(qIdx>=pool.length){showWin();return;}answered=false;const q=pool[qIdx];const opts=shuffle([...q.opts]);document.getElementById('tbScore').textContent=score;document.getElementById('tbQ').textContent=`Q ${qIdx+1} / ${pool.length}`;document.getElementById('tbStreak').textContent=streak>=3?`🔥 ${streak} streak!`:streak>0?`✨ ${streak}`:'';document.getElementById('qTag').textContent=`${q.tag} · ${q.story}`;document.getElementById('qText').textContent=q.q;const COLORS=['a0','a1','a2','a3'];document.getElementById('ansGrid').innerHTML=opts.map((o,i)=>`<button class="ans-btn ${COLORS[i]}" onclick="answer('${o.replace(/'/g,"\\'").replace(/"/g,"&quot;")}',this)"><span class="ans-shape">${SHAPES[i]}</span><span class="ans-text">${o}</span></button>`).join('');document.getElementById('fbBanner').className='fb-banner';document.getElementById('fbBanner').innerHTML='';document.getElementById('btnNextQ').style.display='none';startTimer();}
function startTimer(){timerVal=10;clearInterval(timerID);updateTimerUI(10);timerID=setInterval(()=>{timerVal--;totalTime++;updateTimerUI(timerVal);if(timerVal<=0){clearInterval(timerID);if(!answered)timeUp();}},1000);}
function updateTimerUI(t){document.getElementById('timerNum').textContent=t;const offset=201-(201*t/10);const fill=document.getElementById('timerFill');fill.style.strokeDashoffset=offset;fill.style.stroke=t<=3?'var(--error)':t<=5?'var(--gold)':'var(--green)';}
function answer(chosen,btn){if(answered)return;answered=true;clearInterval(timerID);const q=pool[qIdx];const isOk=chosen===q.answer;document.querySelectorAll('.ans-btn').forEach(b=>{b.disabled=true;const isC=b.querySelector('.ans-text').textContent===q.answer;if(isC)b.classList.add('correct');else if(b===btn&&!isOk)b.classList.add('wrong');else if(!isC)b.classList.add('dim');});if(isOk){streak++;correct++;if(streak>bestStreak)bestStreak=streak;const pts=100+(timerVal*20)+(streak>=3?50:0);score+=pts;showFb('ok',`✅ Correct! +${pts} pts ${streak>=3?'🔥 STREAK!':''}`,q.exp,q.expAr);}else{streak=0;showFb('no',`❌ Answer: "${q.answer}"`,q.exp,q.expAr);}document.getElementById('tbScore').textContent=score;document.getElementById('tbStreak').textContent=streak>=3?`🔥 ${streak} streak!`:'';document.getElementById('btnNextQ').style.display='block';}
function timeUp(){answered=true;streak=0;const q=pool[qIdx];document.querySelectorAll('.ans-btn').forEach(b=>{b.disabled=true;const isC=b.querySelector('.ans-text').textContent===q.answer;if(isC)b.classList.add('correct');else b.classList.add('dim');});showFb('no',`⏰ Time up! Answer: "${q.answer}"`,q.exp,q.expAr);document.getElementById('tbStreak').textContent='';document.getElementById('btnNextQ').style.display='block';}
function showFb(cls,msg,exp,expAr){const fb=document.getElementById('fbBanner');fb.className='fb-banner '+cls;fb.innerHTML=`${msg}<br><span style="font-size:.85rem;font-weight:600;opacity:.85">${exp}</span><div class="fb-ar">${expAr}</div>`;}
function nextQ(){qIdx++;showQ();}
function showWin(){clearInterval(timerID);document.getElementById('gameScreen').style.display='none';document.getElementById('winScreen').style.display='flex';const pct=Math.round(correct/pool.length*100);const avgTime=pool.length>0?Math.round(totalTime/pool.length):0;document.getElementById('winScore').textContent=score+' pts';document.getElementById('wsCorrect').textContent=correct+'/'+pool.length;document.getElementById('wsAcc').textContent=pct+'%';document.getElementById('wsTime').textContent=avgTime+'s';document.getElementById('wsStreak').textContent=bestStreak+'🔥';const stars=pct===100?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';document.getElementById('winStars').textContent=stars;const titles={vocab:'Vocabulary Master! 📚',grammar:'Grammar Champion! 📌',characters:'Character Expert! 👥',mix:'Palm Tree Master! 🌴'};document.getElementById('winTitle').textContent=titles[currentMode]||'Round Complete!';const msg=pct===100?'🌟 Perfect score!':pct>=80?'🌴 Excellent!':pct>=60?'✦ Good job!':'💪 Keep going!';document.getElementById('winMsg').textContent=msg;}
function replayMode(){startGame(currentMode);}
function goLobby(){document.getElementById('winScreen').style.display='none';document.getElementById('lobbyScreen').style.display='flex';}
</script>

<div id="thurayaGuide">
  <div class="tg-panel">
    <div class="tg-name">Thuraya Guide | ثريا</div>
    <div class="tg-text" id="thurayaText">Hello! Choose a quiz mode, and I'll help you step by step. هيا نبدأ واختاري مود اللعب.</div>
    <div class="tg-actions">
      <button class="tg-play" id="thurayaReplay">🔊 Replay</button>
      <button class="tg-mute" id="thurayaMute">Mute</button>
    </div>
  </div>
  <img class="tg-avatar" src="thuraya-reference.png" alt="Thuraya guide"/>
</div>

<script>
(function(){
  const s={muted:false,lastText:''};
  const l={welcome:"Hello! Choose a quiz mode. هيا نبدأ.",mode:"Great choice! Read carefully. اختيار ممتاز.",question:"Read the question and choose. اقرئي واختاري.",correct:"Excellent! Correct. ممتاز، صحيحة.",wrong:"Not this one. Try the next. ليست هذه، حاولي.",timeout:"Time is up. Try again. انتهى الوقت.",win:"Wonderful work! عمل رائع!"};
  function speak(t){s.lastText=t;const box=document.getElementById('thurayaText');if(box)box.textContent=t;if(s.muted||!window.speechSynthesis)return;try{window.speechSynthesis.cancel();
    // These strings are "English sentence. Arabic sentence." mashed together \u2014 tagging
    // the whole thing by whichever script appears anywhere sent the entire line (both
    // languages) to a single voice. Split at the first Arabic character instead, so
    // each half is spoken with its own correct voice.
    const m=t.match(/^([\s\S]*?)([\u0600-\u06FF][\s\S]*)$/);
    const en=(m?m[1]:t).trim(), ar=(m?m[2]:'').trim();
    if(en){const u=new SpeechSynthesisUtterance(en);u.lang='en-US';window.speechSynthesis.speak(u);}
    if(ar){const u2=new SpeechSynthesisUtterance(ar);u2.lang='ar-SA';window.speechSynthesis.speak(u2);}
  }catch(e){}}
  window.thurayaSpeak=speak;
  document.addEventListener('click',function(e){if(e.target.id==='thurayaReplay')speak(s.lastText||l.welcome);if(e.target.id==='thurayaMute'){s.muted=!s.muted;e.target.textContent=s.muted?'Unmute':'Mute';if(s.muted)window.speechSynthesis?.cancel();}});
  const og=window.startGame;if(og)window.startGame=function(m){speak(l.mode);return og.apply(this,arguments);};
  const os=window.showQ;if(os)window.showQ=function(){const r=os.apply(this,arguments);setTimeout(()=>speak(l.question),120);return r;};
  const oa=window.answer;if(oa)window.answer=function(i,b){const r=oa.apply(this,arguments);setTimeout(()=>{const fb=document.querySelector('.fb-banner');const txt=fb?fb.textContent.toLowerCase():'';if(txt.includes('correct'))speak(l.correct);else speak(l.wrong);},180);return r;};
  const ot=window.timeUp;if(ot)window.timeUp=function(){speak(l.timeout);return ot.apply(this,arguments);};
  const ow=window.showWin;if(ow)window.showWin=function(){const r=ow.apply(this,arguments);setTimeout(()=>speak(l.win),150);return r;};
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>speak(l.welcome),250));
})();
</script>

<script id="palm-tree-tracker">(function(){var slug="palm-quiz-show",kind="game";var t0=Date.now();function post(a,e){try{var m={source:"palm-tree-activity",activity:slug,kind:kind,title:document.title||slug,action:a};if(e)Object.assign(m,e);window.parent.postMessage(m,"*");}catch(e){}}post("opened");window.addEventListener("beforeunload",function(){post("closed",{timeSpentMs:Date.now()-t0});});})();</script>
