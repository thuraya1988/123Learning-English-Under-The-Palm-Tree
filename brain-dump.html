<!DOCTYPE html>
<html lang="en">
<head>

<title>BRAIN DUMP - 100 Micro Puzzles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;background:#1d1430;background-image:radial-gradient(circle at 20% 15%,#2c1e4a 0%,transparent 55%),radial-gradient(circle at 85% 85%,#241640 0%,transparent 50%);color:#4a2f1b}
#app{height:100%;display:flex;justify-content:center}
.phone{width:100%;max-width:520px;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .3s}
.hidden{opacity:0;pointer-events:none}
#menu{align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(circle at 50% 30%,#3a2a63 0%,#1d1430 75%)}
.mStars span{position:absolute;animation:twk 3s infinite;font-size:18px;opacity:.8}
@keyframes twk{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.logo{display:flex;gap:2px;margin-bottom:2px;flex-wrap:wrap;justify-content:center}
.logo b{font-size:clamp(38px,11vw,58px);color:#ffd98a;text-shadow:0 4px 0 #8a5a2b,0 7px 14px #00000066;display:inline-block;animation:bob 2.6s ease-in-out infinite}
.logo b:nth-child(odd){color:#ffb3c7;text-shadow:0 4px 0 #a34d68,0 7px 14px #00000066}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.subT{color:#c9b8ff;font-weight:700;letter-spacing:3px;font-size:13px;margin-bottom:16px;text-transform:uppercase}
.bigBtn{font-family:inherit;font-weight:800;font-size:24px;letter-spacing:2px;padding:14px 56px;border-radius:999px;border:none;cursor:pointer;color:#5b3317;background:linear-gradient(#ffe6a3,#ffc95e);box-shadow:0 6px 0 #b07b2e,0 10px 18px #00000055;transition:transform .12s}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b07b2e}
.bigBtn.alt{background:linear-gradient(#cfe3ff,#9db9f0);box-shadow:0 6px 0 #5877b8,0 10px 18px #00000055;color:#20315c;font-size:18px;padding:11px 40px}
.bigBtn.pink{background:linear-gradient(#ffd3e0,#ff9db8);box-shadow:0 6px 0 #b85e7d,0 10px 18px #00000055;color:#6e2140;font-size:18px;padding:11px 40px}
.menuMascot{width:96px;height:96px;margin-top:8px;position:relative}
.coinRow{color:#ffd98a;font-weight:800;font-size:16px;margin-top:6px}
#levelsel{background:linear-gradient(#2c1e4a,#1d1430)}
.lsHead{padding:14px;display:flex;align-items:center;gap:10px;color:#fff}
.lsHead h2{font-size:20px;font-weight:800;color:#ffd98a;flex:1;text-align:center;letter-spacing:2px}
.iconBtn{width:42px;height:42px;border-radius:14px;border:none;font-size:19px;background:linear-gradient(#ffe6a3,#ffc95e);box-shadow:0 4px 0 #b07b2e;cursor:pointer;transition:transform .1s}
.iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b07b2e}
.lsScroll{flex:1;overflow-y:auto;padding:4px 14px 30px;-webkit-overflow-scrolling:touch}
.chTitle{color:#c9b8ff;font-size:14px;font-weight:800;letter-spacing:1.5px;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.chTitle i{flex:1;height:2px;background:#ffffff22;border-radius:2px}
.lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lvBtn{aspect-ratio:1;border-radius:16px;border:none;font-weight:800;font-size:19px;cursor:pointer;background:linear-gradient(#fff6e6,#ffe3b8);box-shadow:0 4px 0 #c89a5b;color:#6e4a22;position:relative;transition:transform .1s}
.lvBtn:active{transform:translateY(3px)}
.lvBtn.locked{background:#3a2f58;color:#6e6395;box-shadow:0 4px 0 #241b40;cursor:default}
.lvBtn.done{background:linear-gradient(#c8f0b8,#93d97e);box-shadow:0 4px 0 #5d9948;color:#27531c}

.lvBtn.locked .lvStars{display:none}
#game{background:linear-gradient(#2c1e4a,#171028)}

#hudTitle small{display:block;color:#b7a6e8;font-size:11px;font-weight:700}
.hudCoins{font-size:13px;color:#ffe6a3;font-weight:800}
#bubbleWrap{padding:2px 14px 8px;display:flex;gap:8px;align-items:flex-end}
#mascot{width:52px;height:52px;flex:none;position:relative;transition:transform .2s}

.bg-paper{background:radial-gradient(circle at 30% 20%,#fff8e8,#f7e7c3 70%)}
.bg-meadow{background:linear-gradient(#bfe6ff 0%,#e8f7d8 55%,#a8d678 56%,#7fb95a 100%)}
.bg-night{background:linear-gradient(#1b2350,#3a3572 70%,#241d4d)}
.bg-room{background:linear-gradient(#ffe9c9 0 70%,#c98d5a 70% 76%,#a96f42 76%)}
.bg-water{background:linear-gradient(#bfe6ff 0 45%,#78c4e8 45% 55%,#4d9fd6 55%)}
.bg-snow{background:linear-gradient(#dcecff 0 62%,#f4f9ff 62%)}
.bg-cave{background:linear-gradient(#5a4a3a,#3a2f26)}
.bg-sunset{background:linear-gradient(#ffd9a0,#ff9e7a 55%,#c96a8a)}
.emo{display:inline-block;line-height:1;filter:drop-shadow(0 3px 2px #00000025)}
.emo.idle{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06) translateY(-2px)}}
.tapable{cursor:pointer}
.draggable{cursor:grab;touch-action:none}
.draggable.lifting{cursor:grabbing;filter:drop-shadow(0 10px 8px #00000055);scale:1.12;z-index:50}
.wig{animation:wig .45s}
@keyframes wig{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-9deg)}75%{transform:translate(-50%,-50%) rotate(9deg)}}
.pop{animation:popIn .35s cubic-bezier(.5,1.8,.5,1)}

.floaty{animation:flt 3.4s ease-in-out infinite}
@keyframes flt{0%,100%{translate:0 0}50%{translate:0 -9px}}
.sway{animation:swy 3.5s ease-in-out infinite;transform-origin:bottom center}
@keyframes swy{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.shakeS{animation:shk .4s}
@keyframes shk{0%,100%{translate:0 0}25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-4px 0}}
.toast{position:absolute;font-weight:800;color:#fff;background:#4a2f1bde;padding:6px 13px;border-radius:14px;font-size:14px;z-index:90;pointer-events:none;animation:toastUp 1.6s forwards;white-space:nowrap;max-width:90%;text-align:center}
@keyframes toastUp{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.curtain{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#7a5fa0 0 26px,#6a5090 26px 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:80;transition:opacity .35s}

.curtain .cf{font-size:60px;animation:breathe 2s infinite}

.card{background:#fff8ec;border:3px solid #7a5230;border-radius:16px;box-shadow:0 4px 0 #c89a5b;display:flex;align-items:center;justify-content:center;font-weight:800;color:#5b3317;cursor:pointer;transition:transform .1s}

.slotBox{background:#00000014;border:3px dashed #b08a55;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a6a3d}
.confetti{position:absolute;width:10px;height:14px;top:-20px;z-index:95;pointer-events:none;animation:confFall linear forwards}

#winOv{position:absolute;inset:0;background:#1d1430d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:200}

@keyframes starPop{from{transform:scale(0) rotate(-120deg)}}
#winOv .wSub{color:#c9b8ff;font-weight:800;text-align:center;padding:0 20px}
.btnRow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#modalBg{position:absolute;inset:0;background:#00000088;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
#modalBox{background:#fff6e6;border:4px solid #7a5230;border-radius:22px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 16px 40px #00000070;animation:popIn .25s}
#modalBox h3{color:#8a5a2b;font-size:21px;margin-bottom:8px;font-weight:800}
#modalBox p{font-weight:700;color:#6e4a22;font-size:14px;margin-bottom:12px;line-height:1.4}
.hintTxt{background:#ffe9b0;border:3px solid #d8a83e;border-radius:14px;padding:10px 14px;font-weight:800;color:#7a5210;margin-bottom:12px}
.mBody{position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,#ffcf8e,#f0a75a);border-radius:48% 52% 55% 45%/52% 48% 55% 45%;border:3px solid #8a5a2b;box-shadow:0 4px 8px #00000040}
.mEye{position:absolute;width:9px;height:11px;background:#3a2416;border-radius:50%;top:34%;animation:blink 4s infinite}
.mEye.l{left:26%}.mEye.r{right:26%;animation-delay:.1s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mMouth{position:absolute;left:50%;top:60%;width:20px;height:11px;transform:translateX(-50%);border:3px solid #3a2416;border-top:none;border-radius:0 0 20px 20px}
#mascot.m-huh{transform:rotate(-9deg)}
#mascot.m-huh .mMouth{width:11px;height:11px;border:3px solid #3a2416;border-radius:50%;top:62%}
#mascot.m-happy{animation:mJump .6s}
#mascot.m-happy .mMouth{height:16px;width:26px}
#mascot.m-wow .mMouth{width:13px;height:15px;border-radius:50%}
@keyframes mJump{0%,100%{translate:0 0}35%{translate:0 -18px}60%{translate:0 0}78%{translate:0 -8px}}
.finale #sceneWrap{border-color:#ffb3c7;box-shadow:0 0 40px #ffb3c788,0 10px 30px #00000060}
#errToast{position:fixed;bottom:8px;left:8px;right:8px;background:#8a1f1f;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;z-index:999;display:none;word-break:break-all}
</style>
</head>

<script>
window.onerror=function(m,s,l){var e=document.getElementById('errToast');if(e){e.style.display='block';e.textContent='ERR L'+l+': '+m;}return false;};
var $=function(s){return document.querySelector(s);};
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function h(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
var SAVE={s:{},coins:3,muted:false};

var AC=null;

function tone(f,d,type,v,slide,delay){
  if(SAVE.muted)return;
  try{var c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(delay||0);

  g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

function flowerSVG(petals,hue){var p='';for(var k=0;k<petals;k++){var a=k*2*Math.PI/petals-Math.PI/2,cx=30+14*Math.cos(a),cy=30+14*Math.sin(a);p+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="10" ry="6.5" fill="hsl('+hue+',82%,76%)" stroke="hsl('+hue+',60%,60%)" stroke-width="1.5" transform="rotate('+(a*180/Math.PI+90)+' '+cx+' '+cy+')"/>';}return '<svg viewBox="0 0 60 60">'+p+'<circle cx="30" cy="30" r="8.5" fill="#ffcf3f" stroke="#c8951e" stroke-width="2"/></svg>';}

 function P(a,l){return [40+l*Math.sin(a*Math.PI/180),40-l*Math.cos(a*Math.PI/180)];}

 return '<svg viewBox="0 0 80 80" width="'+size+'"><circle cx="40" cy="40" r="37" fill="#fff8ec" stroke="#7a5230" stroke-width="4"/>'+ticks+'<line x1="40" y1="40" x2="'+hp[0]+'" y2="'+hp[1]+'" stroke="#4a2f1b" stroke-width="5" stroke-linecap="round"/><line x1="40" y1="40" x2="'+mp[0]+'" y2="'+mp[1]+'" stroke="#b06a3a" stroke-width="3.5" stroke-linecap="round"/><circle cx="40" cy="40" r="3.4" fill="#4a2f1b"/></svg>';}

   var gate=A.add('<div style="width:30%;height:30%;background:repeating-linear-gradient(90deg,#6e5a45 0 12px,#5a4835 12px 16px);border:5px solid #4a3a2c;border-radius:12px 12px 0 0;position:relative;transition:transform 1s"><div class="rope" style="position:absolute;left:50%;top:-18px;width:4px;height:18px;background:#b08a45"></div></div>',{x:50,y:72,z:3});
   var slotsW=A.add('<div style="display:flex;gap:6px"><div class="slotBox" style="width:42px;height:44px;font-size:20px"></div><div class="slotBox" style="width:42px;height:44px;font-size:20px"></div><div class="slotBox" style="width:42px;height:44px;font-size:20px"></div><div class="slotBox" style="width:42px;height:44px;font-size:20px"></div></div>',{x:50,y:42,z:4});
   var idx=0;var need=['O','P','E','N'];
   shuf(['N','E','P','O','X','B']).forEach(function(l,i){var c=A.add('<div class="card" style="width:50px;height:50px;font-size:22px">'+l+'</div>',{x:16+(i%3)*34,y:58+Math.floor(i/3)*16,z:5});
     A.tap(c,function(){if(l===need[idx]){play('ding');slotsW.children[idx].textContent=l;c.style.opacity=.3;idx++;
       if(idx===4){A.say('TRIAL 4: Rotate the mirror until moonlight BURNS the rope!');startMirror(gate);}}else{A.nope('Spell O-P-E-N!',c);}});});}
 function startMirror(gate){
   var mirr=A.add('<div class="card" style="width:56px;height:56px;font-size:26px">\uD83E\uDE9E</div>',{x:20,y:84,z:6});
   var beam=A.add('<div style="position:absolute;left:20%;top:84%;width:120px;height:5px;background:linear-gradient(90deg,#dcefff,#fff);box-shadow:0 0 10px #dcefff;transform-origin:left center;transform:rotate(-40deg);z-index:4;opacity:.85"></div>',{});
   var ang=0;
   A.tap(mirr,function(){ang+=20;beam.style.transform='rotate('+(-40+ang)+'deg)';play('tick');
     if(ang===100){play('crack');gate.querySelector('.rope').style.opacity=0;A.emo('\uD83D\uDD25',18,50,56,{z:5});
       gate.style.transform=TR+' translateY(60%)';A.say('TRIAL 5: How many moons shine above?');startCount();}});}
 function startCount(){
   [[2,25],[3,50],[4,75]].forEach(function(c){var b=A.add('<div class="card" style="width:64px;height:64px;font-size:20px">'+c[0]+' \uD83C\uDF19</div>',{x:c[1],y:66,z:6});
     A.tap(b,function(){if(c[0]===3){play('chime');finale();}else{A.nope('Count the real moons in the sky!',b);}});});}
 function finale(){A.say('FINAL: Tap THE BRAIN!');
   A.add('<div style="width:24%;height:8%;background:#c9b8a0;border-radius:8px;border:3px solid #8a7a60"></div>',{x:50,y:74,z:4});
   var brain=A.emo('\uD83E\uDDE0',64,50,62,{cls:'idle',z:6});
   A.tap(brain,function(){play('yay');document.querySelector('.phone').classList.add('finale');
     A.scene.style.background='linear-gradient(#ffd9e8 0%,#ffe9c9 40%,#c8f0d8 100%)';
     A.confetti(60);play('chime');
     ['\uD83D\uDC38','\uD83D\uDC30','\uD83D\uDC31','\uD83E\uDD86','\uD83D\uDC36','\uD83D\uDC18'].forEach(function(ch,i){var c=A.emo(ch,34,-10,20+i*12,{z:8});c.style.transition='left '+(3+i*.3)+'s linear';A.after(100,function(){c.style.left='110%';});});
     A.after(1200,function(){A.toast('MASTER BRAIN UNLOCKED!',50,14);A.after(900,function(){A.win();});});});}
});
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.add('hidden');});$('#'+id).classList.remove('hidden');}
function mascotFace(el){el.innerHTML='<div class="mBody"></div><div class="mEye l"></div><div class="mEye r"></div><div class="mMouth"></div>';}
mascotFace($('#menuMascot'));
for(var mi=0;mi<14;mi++){var ms=h('<span style="left:'+rnd(100)+'%;top:'+rnd(100)+'%;animation-delay:'+(rnd(30)/10)+'s">'+pick(['\u2726','\u2727','\u2B50','\uD83D\uDCAB'])+'</span>');$('#mStars').appendChild(ms);}
function updateCoinUI(){$('#menuCoins').textContent=SAVE.coins;$('#lsCoins').textContent=SAVE.coins;}
function buildLevelSelect(){
  var sc=$('#lsScroll');sc.innerHTML='';
  for(var c=0;c<10;c++){
    sc.appendChild(h('<div class="chTitle">CHAPTER '+(c+1)+' — '+CHAPTERS[c].toUpperCase()+'<i></i></div>'));
    var grid=h('<div class="lvGrid"></div>');
    for(var n=c*10+1;n<=c*10+10;n++){(function(n){
      var stars=SAVE.s[n];var unl=unlocked(n);
      var starTxt=stars>0?new Array(stars+1).join('\u2605')+new Array(4-stars).join('\u2606'):(stars===0?'\u00BB':'');
      var b=h('<button class="lvBtn '+(unl?(stars!==undefined?'done':''):'locked')+'">'+(unl?String(n).padStart(2,'0'):'\uD83D\uDD12')+'<div class="lvStars">'+starTxt+'</div></button>');
      if(unl){b.addEventListener('click',function(){startLevel(n);});}
      grid.appendChild(b);})(n);}
    sc.appendChild(grid);}
}
var HINT_STATE=0;
function startLevel(n){
  killAPI();HINT_STATE=0;
  var ov=$('#winOv');if(ov){ov.remove();}
  CUR=makeAPI(n);
  $('#hudTitle').innerHTML='LEVEL '+String(n).padStart(2,'0')+' — '+LEVELS[n].t.toUpperCase()+'<small>CH '+(chOf(n)+1)+' \u00B7 '+CHAPTERS[chOf(n)].toUpperCase()+'</small>';
  show('game');
  if((n-1)%10===0){CUR.toast('CHAPTER '+(chOf(n)+1)+' — '+CHAPTERS[chOf(n)].toUpperCase(),50,10);}
  CUR.say(LEVELS[n].intro);
  LEVELS[n].build(CUR);
}
function showWin(n,stars){
  var first=SAVE.s[n]===undefined;
  SAVE.s[n]=Math.max(SAVE.s[n]||0,stars);
  var hintGain=0;if(first){hintGain=1;SAVE.coins++;}
  persist();updateCoinUI();
  var nextBtn=n<100?'<button class="bigBtn" id="wNext" style="font-size:18px;padding:11px 30px">NEXT \u25B6</button>':'';
  var ov=h('<div id="winOv"><div class="wTitle">'+(n===100?'MASTER BRAIN!':'LEVEL CLEAR!')+'</div><div class="wStars">'+[1,2,3].map(function(i){return '<span style="color:'+(i<=stars?'#ffd93d':'#5b5580')+'">\u2605</span>';}).join('')+'</div><div class="wSub">'+(n===100?'You solved all 100 puzzles. Dumpy salutes you.':(hintGain?'+1 hint bulb earned!':'Puzzle mastered!'))+'</div><div class="btnRow"><button class="bigBtn alt" id="wLv" style="font-size:15px;padding:9px 20px">LEVELS</button><button class="bigBtn alt" id="wRe" style="font-size:15px;padding:9px 20px">REPLAY</button>'+nextBtn+'</div></div>');
  $('#game').appendChild(ov);
  ov.querySelector('#wLv').onclick=function(){ov.remove();killAPI();buildLevelSelect();show('levelsel');};
  ov.querySelector('#wRe').onclick=function(){ov.remove();startLevel(n);};
  var nx=ov.querySelector('#wNext');if(nx){nx.onclick=function(){ov.remove();startLevel(n+1);};}
}
function modal(html){$('#modalBox').innerHTML=html;$('#modalBg').classList.remove('hidden');}
function closeModal(){$('#modalBg').classList.add('hidden');}
window.closeModal=closeModal;
$('#modalBg').addEventListener('click',function(e){if(e.target.id==='modalBg'){closeModal();}});
$('#btnPlay').onclick=function(){try{ac();}catch(e){}var n=1;while(n<100&&SAVE.s[n]!==undefined){n++;}startLevel(unlocked(n)?n:1);};
$('#btnLevels').onclick=function(){try{ac();}catch(e){}buildLevelSelect();updateCoinUI();show('levelsel');};
$('#btnHintsMenu').onclick=function(){modal('<h3>Hint Bulbs</h3><p>You have <b>'+SAVE.coins+'</b> bulbs.<br><br>Each puzzle has 3 hint levels — each costs 1 bulb.<br>Earn +1 bulb every time you solve a NEW puzzle.<br><br>Hints nudge you. They never solve it for you.</p><button class="bigBtn" style="font-size:16px;padding:9px 34px" onclick="closeModal()">OK!</button>');};
$('#btnSettings').onclick=function(){modal('<h3>Settings</h3><p><button class="bigBtn alt" style="font-size:15px;padding:8px 24px" id="sndBtn">'+(SAVE.muted?'Sound OFF':'Sound ON')+'</button></p><p><button class="bigBtn pink" style="font-size:15px;padding:8px 24px" id="resetBtn">Reset Progress</button></p><button class="bigBtn" style="font-size:15px;padding:8px 30px" onclick="closeModal()">CLOSE</button>');};
document.addEventListener('click',function(e){
 if(e.target&&e.target.id==='sndBtn'){SAVE.muted=!SAVE.muted;persist();e.target.textContent=SAVE.muted?'Sound OFF':'Sound ON';}
 if(e.target&&e.target.id==='resetBtn'){if(confirm('Erase ALL progress?')){SAVE={s:{},coins:3,muted:SAVE.muted};persist();closeModal();updateCoinUI();}}
});
$('#lsBack').onclick=function(){show('menu');};
$('#gHome').onclick=function(){killAPI();var ov=$('#winOv');if(ov){ov.remove();}buildLevelSelect();updateCoinUI();show('levelsel');};
$('#gRestart').onclick=function(){var n=CUR.n;startLevel(n);};
$('#gSkip').onclick=function(){var n=CUR.n;
 modal('<h3>Skip Level '+n+'?</h3><p>It unlocks the next level, but you earn NO stars and NO bulb. The puzzle will wait for your return!</p><div class="btnRow"><button class="bigBtn alt" style="font-size:14px;padding:8px 22px" onclick="closeModal()">STAY</button><button class="bigBtn pink" style="font-size:14px;padding:8px 22px" id="skipYes">SKIP</button></div>');
 $('#skipYes').onclick=function(){if(SAVE.s[n]===undefined){SAVE.s[n]=0;}persist();closeModal();if(n<100){startLevel(n+1);}else{killAPI();buildLevelSelect();show('levelsel');}};};
$('#gHint').onclick=function(){
 if(!CUR||CUR.done){return;}
 if(HINT_STATE>=3){modal('<h3>Hints used</h3><p>That was the last hint! The rest is between you and the puzzle.</p><button class="bigBtn" style="font-size:15px;padding:8px 30px" onclick="closeModal()">I GOT THIS</button>');return;}
 if(SAVE.coins<=0){modal('<h3>Out of bulbs!</h3><p>Solve new puzzles to earn more hint bulbs. Or struggle beautifully. The struggle IS the fun.</p><button class="bigBtn" style="font-size:15px;padding:8px 30px" onclick="closeModal()">FINE!</button>');return;}
 var hTxt=LEVELS[CUR.n].hints[HINT_STATE];
 SAVE.coins--;HINT_STATE++;CUR.hintsUsed++;persist();updateCoinUI();play('ding');
 modal('<h3>Hint '+HINT_STATE+' of 3</h3><div class="hintTxt">'+hTxt+'</div><p style="font-size:12px">Bulbs left: '+SAVE.coins+'</p><button class="bigBtn" style="font-size:15px;padding:8px 30px" onclick="closeModal()">GOT IT</button>');};
updateCoinUI();
show('menu');
</script>
</body>
</html>
