<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Palm Story Content</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:transparent;color:#fff}
    .stage{max-width:980px;margin:2vh auto;padding:16px}
    .panel{background:rgba(10,20,10,.42);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:26px}
    .label{letter-spacing:2px;text-transform:uppercase;font-size:.8rem;color:#d9d9d9}
    h1{margin:6px 0 8px;font-size:2.2rem;line-height:1.25;color:#f8f2dc}
    .scene{font-style:italic;color:#f0e7bd;font-size:1.3rem;margin-bottom:14px}
    .content{font-size:1.45rem;line-height:2;color:#f8f5eb;white-space:pre-line}
    .pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
    button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.35;cursor:not-allowed}
    .count{font-weight:700;color:#f5c518;display:flex;align-items:center}
  </style>
</head>
<body>
  <main class="stage">
    <section class="panel">
      <div class="label">CHAPTER 1</div>
      <h1 id="storyTitle">Story 1 – The Road to Al-Qurawashiyah</h1>
      <div class="scene" id="storyScene">Scene 1 – The Letter</div>
      <div class="content" id="storyText"></div>

      <div class="pager">
        <button id="prevBtn" onclick="prevPage()">⬅ Previous</button>
        <div id="pageCount" class="count">1 / 1</div>
        <button id="nextBtn" onclick="nextPage()">Next ➡</button>
      </div>
    </section>
  </main>

  <script>
    const pages = [
      {
        scene: 'Scene 1 – The Letter',
        text: `The sky over London hung low and heavy that morning, wrapped in a dull gray.
John sat at the wooden table, a cup of tea gone cold in front of him.
He held a letter, folded more than once, and read it slowly again.
Sophia sat nearby with her book, The Palm Tree, waiting for him to speak.`
      },
      {
        scene: 'Scene 2 – The Decision',
        text: `"I got the job," John said quietly.
"Where?" Sophia asked.
"Oman. Al-Qurawashiyah."
The room went silent for a moment, then both of them smiled.
A new chapter had opened.`
      },
      {
        scene: 'Scene 3 – The Journey Begins',
        text: `By dawn they were already moving.
Suitcases packed, hearts racing, and dreams louder than fear.
At the airport, Thuraya stood waiting with a warm smile.
"Welcome," she said, "your story starts here."`
      }
    ];

    let current = 0;
    const textEl = document.getElementById('storyText');
    const sceneEl = document.getElementById('storyScene');
    const countEl = document.getElementById('pageCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderPage() {
      const page = pages[current];
      sceneEl.textContent = page.scene;
      textEl.textContent = page.text;
      countEl.textContent = `${current + 1} / ${pages.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === pages.length - 1;
    }

    function nextPage() { if (current < pages.length - 1) { current++; renderPage(); } }
    function prevPage() { if (current > 0) { current--; renderPage(); } }

    renderPage();
  </script>
</body>
</html>
