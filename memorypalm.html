<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌴 Palm Tree Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --green:#2d9e62; --greenl:#e8fdf2; --greenb:#7dd4a8;
  --blue:#2878c4;  --bluel:#e6f4ff;  --blueb:#7ac0f0;
  --gold:#d08000;  --goldl:#fff4e0;  --goldb:#f0c060;
  --purple:#7040c0;--purplel:#f2ecff;--purpleb:#b090e0;
  --ink:#1a2030;   --bg:#f0f7ff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Nunito',sans-serif;min-height:100vh;padding:14px 14px 60px}

/* HEADER */
.header{background:linear-gradient(135deg,var(–green),var(–blue));border-radius:22px;padding:18px 20px;text-align:center;margin-bottom:14px;position:relative}
.header h1{font-family:‘Fredoka One’,cursive;font-size:clamp(1.2rem,4vw,1.8rem);color:white;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.header p{font-size:0.8rem;color:rgba(255,255,255,.82);margin-top:3px}
.back-link{position:absolute;top:12px;left:14px;color:rgba(255,255,255,.8);text-decoration:none;font-size:0.75rem;font-weight:700;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px}

/* SCOREBOARD */
.scoreboard{background:white;border-radius:18px;padding:12px 18px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:14px}
.sc-item{text-align:center}
.sc-val{font-family:‘Fredoka One’,cursive;font-size:1.5rem;line-height:1}
.sc-lbl{font-size:0.62rem;font-weight:800;color:#90a0b8;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sc-div{width:1px;background:#e8eef4}

/* LEVEL SELECTOR */
.level-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.lvl-btn{padding:9px 20px;border-radius:20px;font-size:0.82rem;font-weight:800;cursor:pointer;border:2.5px solid transparent;transition:all 0.2s;font-family:‘Nunito’,sans-serif}
.lvl-btn.l1{background:var(–greenl);color:var(–green);border-color:var(–greenb)}
.lvl-btn.l2{background:var(–bluel);color:var(–blue);border-color:var(–blueb)}
.lvl-btn.l3{background:var(–goldl);color:var(–gold);border-color:var(–goldb)}
.lvl-btn.active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12);color:white}
.lvl-btn.l1.active{background:var(–green)}
.lvl-btn.l2.active{background:var(–blue)}
.lvl-btn.l3.active{background:var(–gold)}

/* GRID */
.grid-wrap{background:white;border-radius:24px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:14px}
.grid{display:grid;gap:10px;justify-content:center}
/* grid columns set by JS */

/* CARD */
.card{
aspect-ratio:1;
perspective:700px;
cursor:pointer;
min-width:0;
}
.card-inner{
width:100%;height:100%;
position:relative;
transition:transform .55s cubic-bezier(.4,0,.2,1);
transform-style:preserve-3d;
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}

.card-front,.card-back{
position:absolute;inset:0;
backface-visibility:hidden;
border-radius:16px;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
padding:8px;text-align:center;
font-family:‘Nunito’,sans-serif;
}
/* BACK = question mark side */
.card-back{
background:linear-gradient(135deg,var(–green),var(–blue));
box-shadow:0 4px 14px rgba(40,120,196,.2);
font-size:2rem;color:white;
}
.card-back::after{content:‘🌴’;font-size:1.6rem}

/* FRONT = content side */
.card-front{
transform:rotateY(180deg);
border:2.5px solid transparent;
font-size:.75rem;font-weight:700;line-height:1.4;
color:var(–ink);
}
/* colour by pair type */
.card-front.char  {background:linear-gradient(135deg,#cce8ff,#e6f4ff);border-color:var(–blueb)}
.card-front.desc  {background:linear-gradient(135deg,#d4f5e4,#e8fdf2);border-color:var(–greenb)}
.card-front.word  {background:linear-gradient(135deg,#fff4d8,#fffdf0);border-color:var(–goldb)}
.card-front.def   {background:linear-gradient(135deg,#f2ecff,#faf5ff);border-color:var(–purpleb)}

.card.matched .card-front{
background:linear-gradient(135deg,#b8edcf,#d4f5e4)!important;
border-color:var(–green)!important;
box-shadow:0 0 0 3px var(–green);
animation:matchPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes matchPop{0%{transform:rotateY(180deg) scale(.9)}50%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}

.card.wrong .card-inner{animation:shake .35s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

.card-emoji{font-size:1.5rem;margin-bottom:4px;display:block}
.card-text{font-size:.72rem;font-weight:700;line-height:1.35;color:var(–ink)}

/* FEEDBACK BAR */
.fb-bar{
background:white;border-radius:16px;padding:12px 18px;
text-align:center;font-weight:700;font-size:.9rem;
box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:14px;
min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;
transition:all .3s;
}
.fb-bar.ok{background:var(–greenl);color:var(–green);border:2px solid var(–greenb)}
.fb-bar.no{background:#fff0f0;color:var(–red,#c04040);border:2px solid #f09090}
.fb-bar.idle{color:#90a0b8;border:2px solid #e0eaf4}

/* WIN OVERLAY */
#winOverlay{
display:none;position:fixed;inset:0;
background:rgba(10,20,40,.55);backdrop-filter:blur(4px);
z-index:200;align-items:center;justify-content:center;padding:20px;
}
#winOverlay.show{display:flex}
.win-card{
background:white;border-radius:26px;padding:36px 28px;
text-align:center;width:100%;max-width:380px;
animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-palm{font-size:3.5rem;animation:sway 4s ease-in-out infinite;display:block;margin-bottom:8px}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.win-title{font-family:‘Fredoka One’,cursive;font-size:1.8rem;color:var(–green);margin-bottom:6px}
.win-score{font-family:‘Fredoka One’,cursive;font-size:2.8rem;color:var(–blue);margin:8px 0}
.win-msg{font-size:.9rem;color:#5080a0;font-style:italic;margin-bottom:20px;line-height:1.6}
.btn-again{background:linear-gradient(135deg,var(–green),var(–blue));color:white;border:none;font-family:‘Nunito’,sans-serif;font-weight:800;font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;box-shadow:0 4px 16px rgba(40,120,196,.28);transition:all .25s}
.btn-again:hover{transform:translateY(-3px)}
.btn-next-lvl{background:linear-gradient(135deg,var(–gold),var(–orange,#e06820));color:white;border:none;font-family:‘Nunito’,sans-serif;font-weight:800;font-size:.95rem;padding:13px 32px;border-radius:20px;cursor:pointer;margin-left:10px;transition:all .25s}
.btn-next-lvl:hover{transform:translateY(-3px)}

@media(max-width:400px){.card-text{font-size:.62rem}}
</style>

<script src="public/js/palm-globe-fab.js" defer></script>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<script src="public/js/palm-games-fab.js" defer></script>
</head>
<body>

<!-- HEADER -->

<div class="header">
  <a class="back-link" href="index.html">← Home</a>
  <h1>🃏 Palm Tree Memory</h1>
  <p>Match the character with their description! اربط الشخصية بوصفها!</p>
</div>

<!-- SCOREBOARD -->

<div class="scoreboard">
  <div class="sc-item"><div class="sc-val" id="scMatches" style="color:var(--green)">0</div><div class="sc-lbl">Matches</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scMoves" style="color:var(--blue)">0</div><div class="sc-lbl">Moves</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scScore" style="color:var(--gold)">0</div><div class="sc-lbl">Score</div></div>
  <div class="sc-div"></div>
  <div class="sc-item"><div class="sc-val" id="scTime" style="color:var(--purple)">0s</div><div class="sc-lbl">Time</div></div>
</div>

<!-- LEVEL BUTTONS -->

<div class="level-row">
  <button class="lvl-btn l1 active" id="lvl1" onclick="startLevel(1)">🌱 Level 1 — Characters (8 pairs)</button>
  <button class="lvl-btn l2"        id="lvl2" onclick="startLevel(2)">🌴 Level 2 — Vocabulary (8 pairs)</button>
  <button class="lvl-btn l3"        id="lvl3" onclick="startLevel(3)">⭐ Level 3 — Mixed (10 pairs)</button>
</div>

<!-- FEEDBACK -->

<div class="fb-bar idle" id="fbBar">Flip two cards and find the matching pair! 🌴</div>

<!-- GRID -->

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<!-- WIN -->

<div id="winOverlay">
  <div class="win-card">
    <span class="win-palm">🌴</span>
    <div class="win-title" id="winTitle">All Matched!</div>
    <div class="win-score" id="winScore">0 pts</div>
    <div class="win-msg" id="winMsg"></div>
    <button class="btn-again" onclick="startLevel(currentLevel)">🔄 Play Again</button>
    <button class="btn-next-lvl" id="nextLvlBtn" onclick="goNextLevel()">Next Level →</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// PAIRS DATA — 3 levels
//
// Each pair: { id, a:{type,emoji,text}, b:{type,emoji,text} }
// When cards are dealt, each pair produces 2 cards on the board.
// Matching = both cards have the same id.
// ══════════════════════════════════════════

const LEVEL_PAIRS = {

  // ── LEVEL 1 — Characters (8 pairs) ──
  // Card A = character name + emoji
  // Card B = their famous description
  1: [
    { id:'thuraya',
      a:{type:'char', emoji:'👩‍🏫', text:'Thuraya'},
      b:{type:'desc', emoji:'🌴', text:'One look… the whole class goes silent'} },
    { id:'john',
      a:{type:'char', emoji:'👨‍🏫', text:'John'},
      b:{type:'desc', emoji:'🫖', text:'His tea is always cold'} },
    { id:'sophia',
      a:{type:'char', emoji:'👩', text:'Sophia'},
      b:{type:'desc', emoji:'🟡', text:'Her face turned bright yellow'} },
    { id:'mansoor',
      a:{type:'char', emoji:'👦', text:'Mansoor'},
      b:{type:'desc', emoji:'🌪️', text:'Human storm — runs without reason'} },
    { id:'khamees',
      a:{type:'char', emoji:'🧑', text:'Khamees'},
      b:{type:'desc', emoji:'👁️', text:'I can watch. Watching is learning'} },
    { id:'sadoo',
      a:{type:'char', emoji:'🧑', text:'Sadoo'},
      b:{type:'desc', emoji:'🛒', text:'Unofficial hero of the village'} },
    { id:'khalaf',
      a:{type:'char', emoji:'🧔', text:'Shayb Khalaf'},
      b:{type:'desc', emoji:'🌿', text:'He knows what others don\'t'} },
    { id:'malood',
      a:{type:'char', emoji:'🐐', text:'Malood'},
      b:{type:'desc', emoji:'📄', text:'Eats papers like inspection reports'} },
  ],

  // ── LEVEL 2 — Vocabulary (8 pairs) ──
  // Card A = English word
  // Card B = definition
  2: [
    { id:'falaj',
      a:{type:'word', emoji:'💧', text:'falaj'},
      b:{type:'def',  emoji:'🌊', text:'A traditional water channel'} },
    { id:'trust',
      a:{type:'word', emoji:'🤝', text:'trust'},
      b:{type:'def',  emoji:'💛', text:'Believing someone is good'} },
    { id:'brave',
      a:{type:'word', emoji:'🦁', text:'brave'},
      b:{type:'def',  emoji:'💪', text:'Not afraid of danger'} },
    { id:'heritage',
      a:{type:'word', emoji:'🏺', text:'heritage'},
      b:{type:'def',  emoji:'📜', text:'Culture passed down through generations'} },
    { id:'patient',
      a:{type:'word', emoji:'⏳', text:'patient'},
      b:{type:'def',  emoji:'😌', text:'Waiting calmly without complaining'} },
    { id:'wisdom',
      a:{type:'word', emoji:'🦉', text:'wisdom'},
      b:{type:'def',  emoji:'💎', text:'Deep understanding and knowledge'} },
    { id:'harvest',
      a:{type:'word', emoji:'🌾', text:'harvest'},
      b:{type:'def',  emoji:'🌴', text:'To collect crops from the farm'} },
    { id:'relief',
      a:{type:'word', emoji:'😮‍💨', text:'relief'},
      b:{type:'def',  emoji:'✅', text:'Good feeling when danger passes'} },
  ],

  // ── LEVEL 3 — Mixed: characters + vocabulary (10 pairs) ──
  3: [
    { id:'nasser',
      a:{type:'char', emoji:'🚐', text:'Nasser'},
      b:{type:'desc', emoji:'🛣️', text:'Drives even when the road disappears'} },
    { id:'marhoona',
      a:{type:'char', emoji:'👵', text:'Marhoona'},
      b:{type:'desc', emoji:'💄', text:'Her salon has no sign outside'} },
    { id:'khalil',
      a:{type:'char', emoji:'😄', text:'Khalil'},
      b:{type:'desc', emoji:'🎤', text:'Laughs at jokes that haven\'t started yet'} },
    { id:'marhoon',
      a:{type:'char', emoji:'🌱', text:'Marhoon'},
      b:{type:'desc', emoji:'👔', text:'Man in overalls — lives for farming'} },
    { id:'wasp',
      a:{type:'word', emoji:'🐝', text:'wasp'},
      b:{type:'def',  emoji:'😬', text:'A flying insect that stings'} },
    { id:'curious',
      a:{type:'word', emoji:'🤔', text:'curious'},
      b:{type:'def',  emoji:'❓', text:'Wanting to know and learn more'} },
    { id:'ancestor',
      a:{type:'word', emoji:'👴', text:'ancestor'},
      b:{type:'def',  emoji:'🌳', text:'A family member from the past'} },
    { id:'identity',
      a:{type:'word', emoji:'🪪', text:'identity'},
      b:{type:'def',  emoji:'🔍', text:'Who you are — your name and story'} },
    { id:'narrow',
      a:{type:'word', emoji:'↔️', text:'narrow'},
      b:{type:'def',  emoji:'🛤️', text:'Not wide — a small path or space'} },
    { id:'inspire',
      a:{type:'word', emoji:'💫', text:'inspire'},
      b:{type:'def',  emoji:'🌟', text:'To make someone want to try harder'} },
  ],
};

// ── GAME STATE ──
let currentLevel = 1;
let flipped = [];      // cards currently face-up (max 2)
let matched = 0;       // pairs found
let moves = 0;         // total flips
let score = 0;
let locked = false;    // prevent clicking during check
let timerSec = 0;
let timerID = null;
let totalPairs = 0;

// ── START / RESTART ──
function startLevel(lvl) {
  currentLevel = lvl;

  // Update pill buttons
  [1,2,3].forEach(i => {
    document.getElementById('lvl'+i).classList.toggle('active', i === lvl);
  });

  // Reset state
  flipped = []; matched = 0; moves = 0; score = 0;
  locked = false;
  clearInterval(timerID);
  timerSec = 0;

  // Build card deck: each pair → 2 cards
  const pairs = LEVEL_PAIRS[lvl];
  totalPairs = pairs.length;
  let deck = [];
  pairs.forEach(pair => {
    deck.push({ id:pair.id, side:'a', ...pair.a });
    deck.push({ id:pair.id, side:'b', ...pair.b });
  });

  // Shuffle
  deck = shuffle(deck);

  // Render grid
  renderGrid(deck, lvl);
  updateScoreboard();
  setFb('idle', 'Flip two cards and find the matching pair! 🌴');

  // Start timer
  timerID = setInterval(() => {
    timerSec++;
    document.getElementById('scTime').textContent = timerSec + 's';
  }, 1000);
}

// ── RENDER GRID ──
function renderGrid(deck, lvl) {
  const grid = document.getElementById('grid');
  // Choose columns: 4 cols for ≤8 pairs, 5 cols for 10 pairs
  const cols = deck.length <= 16 ? 4 : 5;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.maxWidth = (cols * 90 + (cols-1) * 10) + 'px';
  grid.style.margin = '0 auto';

  grid.innerHTML = '';
  deck.forEach((card, idx) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = card.id;
    div.dataset.idx = idx;
    div.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front ${card.type}">
          <span class="card-emoji">${card.emoji}</span>
          <span class="card-text">${card.text}</span>
        </div>
      </div>`;
    div.addEventListener('click', () => flipCard(div));
    grid.appendChild(div);
  });
}

// ── FLIP LOGIC ──
function flipCard(card) {
  if (locked) return;
  if (card.classList.contains('flipped')) return;
  if (card.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    moves++;
    updateScoreboard();
    locked = true;
    setTimeout(checkMatch, 900);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const isMatch = a.dataset.id === b.dataset.id;

  if (isMatch) {
    // Mark matched
    a.classList.add('matched');
    b.classList.add('matched');
    matched++;
    // Score = 20 pts base, bonus for speed
    const pts = Math.max(5, 20 - Math.floor(timerSec / 10));
    score += pts;
    setFb('ok', `✅ Match! +${pts} pts 🌴`);
    updateScoreboard();
    if (matched === totalPairs) setTimeout(showWin, 600);
  } else {
    a.classList.add('wrong');
    b.classList.add('wrong');
    setFb('no', '❌ Not a match! Try again.');
    setTimeout(() => {
      a.classList.remove('flipped','wrong');
      b.classList.remove('flipped','wrong');
      setFb('idle', 'Keep going! اكمل! 🌴');
    }, 900);
  }

  flipped = [];
  locked = false;
}

// ── WIN ──
function showWin() {
  clearInterval(timerID);
  const timeBonus = Math.max(0, 60 - timerSec) * 2;
  const moveBonus = Math.max(0, (totalPairs * 3) - moves) * 5;
  const finalScore = score + timeBonus + moveBonus;

  document.getElementById('winScore').textContent = finalScore + ' pts';
  const titles = {1:'Characters Mastered! 🎉', 2:'Vocabulary Expert! 📚', 3:'Palm Tree Champion! 🏆'};
  document.getElementById('winTitle').textContent = titles[currentLevel] || 'All Matched!';
  const msg = finalScore >= 300 ? '🌟 Outstanding! Speed + accuracy = perfect!'
            : finalScore >= 200 ? '🌴 Excellent! Great memory!'
            : finalScore >= 100 ? '✦ Good job! Try faster next time!'
            :                     '💪 Well done! Practice makes perfect!';
  document.getElementById('winMsg').innerHTML = `${msg}<br><span style="font-size:.8rem;color:#7090a8">Time: ${timerSec}s | Moves: ${moves} | Bonus: +${timeBonus + moveBonus}</span>`;

  // Show/hide next level button
  document.getElementById('nextLvlBtn').style.display = currentLevel < 3 ? 'inline-block' : 'none';

  document.getElementById('winOverlay').classList.add('show');
}

function goNextLevel() {
  document.getElementById('winOverlay').classList.remove('show');
  startLevel(currentLevel + 1);
}

// ── HELPERS ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function setFb(cls, msg) {
  const bar = document.getElementById('fbBar');
  bar.className = 'fb-bar ' + cls;
  bar.textContent = msg;
}

function updateScoreboard() {
  document.getElementById('scMatches').textContent = matched + '/' + totalPairs;
  document.getElementById('scMoves').textContent   = moves;
  document.getElementById('scScore').textContent   = score;
}

// ── INIT ──
window.addEventListener('load', () => startLevel(1));
</script>

</body>
</html>
