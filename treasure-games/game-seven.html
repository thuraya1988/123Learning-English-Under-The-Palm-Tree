<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12072f">
<title>قفزة النجوم — مغامرة ١٢٠ مستوى</title>
<style>
:root{--gold:#bfa587;--teal:#31e6c0;--pink:#ff5fa2;--ink:#12072f;--glass:rgba(18,7,47,.78)}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#080318;color:#fff;font-family:Tahoma,Arial,sans-serif;user-select:none}button{font:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#43207d,#100626 66%);overflow:hidden}.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}.menu{align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(circle at 50% 15%,#6e36ae66,transparent 42%)}
.orb{font-size:78px;filter:drop-shadow(0 0 28px #bfa587);animation:b 2.4s ease-in-out infinite}@keyframes b{50%{transform:translateY(-10px) rotate(9deg)}}h1{font-size:clamp(44px,10vw,82px);color:var(--gold);text-shadow:0 4px 0 #5c4831,0 0 28px #ffb12f66}p{line-height:1.8;color:#e7dffc;max-width:650px}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}.btn{border:0;border-radius:16px;padding:12px 24px;color:#221b13;font-weight:900;background:linear-gradient(#d0bea9,#b59775);box-shadow:0 5px 0 #6d553a;cursor:pointer}.btn.alt{background:linear-gradient(#8bf7e0,#1fc9a8);box-shadow:0 5px 0 #087865}.btn.ghost{color:#fff;background:#ffffff18;border:1px solid #ffffff33;box-shadow:0 4px 0 #0005}.stats{display:flex;gap:9px;margin-top:18px}.chip{padding:7px 13px;border:1px solid #ffffff2b;border-radius:999px;background:#0007;font-weight:800}.top{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:#070218aa;z-index:4}.top h2{color:var(--gold);font-size:20px}.grow{flex:1}.map{flex-direction:column}.grid{overflow:auto;flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;align-content:start}.lv{aspect-ratio:1;border:2px solid #ffffff29;border-radius:16px;background:#ffffff0f;color:#fff;font-weight:900;font-size:19px;cursor:pointer}.lv small{display:block;color:var(--gold);font-size:11px}.lv.lock{opacity:.3}.lv.now{border-color:var(--teal);box-shadow:0 0 18px #31e6c088}.game{flex-direction:column}.hud{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#08031bd9;z-index:3}.hud .chip{font-size:14px}.wrap{position:relative;flex:1;display:grid;place-items:center;overflow:hidden}canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 16px 50px #000b,0 0 0 2px #ffffff22;max-width:100%;max-height:100%}.tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#000a;white-space:nowrap;font-weight:800}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#050211cc;z-index:10;padding:18px}.modal.on{display:flex}.card{width:min(440px,94vw);padding:24px;border:2px solid #ffd44755;border-radius:24px;text-align:center;background:linear-gradient(#32166a,#18083d);box-shadow:0 26px 70px #000}.card h2{font-size:30px;color:var(--gold)}.stars{font-size:50px;margin:12px 0}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);z-index:20;background:var(--teal);color:#042e26;border-radius:999px;padding:10px 20px;font-weight:900;transition:.3s}.toast.on{transform:translate(-50%,0)}
@media(max-height:540px){.orb{font-size:48px}h1{font-size:44px}.menu p{font-size:13px}.actions{margin-top:10px}.btn{padding:9px 18px}}
</style>
</head>
<body><div id="app">
<section id="menu" class="screen menu on"><div class="orb">🌴</div><h1>قفزة النجوم</h1><p>اسحب البطل إلى الخلف ثم أفلته، واجمع التيجان الثلاثة قبل فتح صندوق النهاية. ١٢٠ مستوى في ثمانية عوالم متغيّرة.</p><div class="actions"><button class="btn" id="play">ابدأ المغامرة</button><button class="btn ghost" id="levels">خريطة المستويات</button></div><div class="stats"><span class="chip" id="mCoins">🪙 ٠</span><span class="chip" id="mStars">🌴 ٠/٣٦٠</span></div></section>
<section id="map" class="screen map"><header class="top"><button class="btn ghost" id="home">🏠</button><h2>خريطة قفزة النجوم</h2><span class="grow"></span><span class="chip" id="mapStat"></span></header><div class="grid" id="grid"></div></section>
<section id="game" class="screen game"><header class="hud"><button class="btn ghost" id="pause">⏸</button><span class="chip" id="level">المستوى ١</span><span class="grow"></span><span class="chip" id="crowns">👑 ٠/٣</span><span class="chip" id="coins">🪙 ٠</span></header><div class="wrap" id="wrap"><canvas id="cv"></canvas><div class="tip" id="tip">اسحب النجمة وأفلتها للقفز</div></div></section>
</div>
<div class="modal" id="pauseM"><div class="card"><h2>استراحة قصيرة</h2><p>توقّف الزمن، ويمكنك المتابعة من المكان نفسه.</p><div class="actions"><button class="btn alt" id="resume">متابعة</button><button class="btn" id="restart">إعادة</button><button class="btn ghost" id="toMap">الخريطة</button></div></div></div>
<div class="modal" id="winM"><div class="card"><h2>🎉 مستوى مكتمل!</h2><div class="stars" id="winStars"></div><p id="reward"></p><div class="actions"><button class="btn alt" id="next">التالي</button><button class="btn ghost" id="winMap">الخريطة</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TOTAL=120;
const THEMES=[['مرج النجوم','#4fb9e8','#c8f5c0','#63d14a'],['كهوف الكريستال','#241050','#5b3aa0','#9d7bff'],['صحراء الأسرار','#ff9d5c','#dacbb9','#ccb7a0'],['أعماق المحيط','#05355c','#0a7fa8','#4fd6e8'],['قمم الجليد','#7cc4f0','#e8f7ff','#ffffff'],['غابة الظلال','#0c2418','#1d4d33','#4fa85c'],['مدينة الغيوم','#ff9ecf','#c9b6ff','#ffffff'],['قلب البركان','#38080f','#8c1f14','#ff6b35']];
function rnd(a){return()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='hub_star_jump_v2',DEF={unlocked:1,coins:0,stars:{}};let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{S={...DEF}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]),starTotal=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
let L=null,P=null,state='menu',paused=false,drag=null,last=performance.now(),acc=0,toastT;
const cv=$('#cv'),ctx=cv.getContext('2d');
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');state=id;paused=false;if(id==='menu')refresh();if(id==='map')buildMap();if(id==='game')requestAnimationFrame(fit)}
function refresh(){$('#mCoins').textContent='🪙 '+ar(S.coins);$('#mStars').textContent='🌴 '+ar(starTotal())+'/٣٦٠'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),1700)}
function buildMap(){const g=$('#grid');g.innerHTML='';for(let n=1;n<=TOTAL;n++){const b=document.createElement('button'),open=n<=S.unlocked,st=S.stars[n]||0;b.className='lv '+(!open?'lock ':!st&&n===S.unlocked?'now ':'');b.innerHTML=ar(n)+'<small>'+('🌴'.repeat(st)+'🌱'.repeat(3-st))+'</small>';b.disabled=!open;b.onclick=()=>start(n);g.appendChild(b)}$('#mapStat').textContent='🌴 '+ar(starTotal())+' · 🪙 '+ar(S.coins)}
function gen(n){const r=rnd(n*9217+41),world=Math.floor((n-1)/15),theme=THEMES[world],plats=[{x:35,y:500,w:150,h:24}],count=5+Math.floor((n-1)/28);let x=220,y=480;for(let i=0;i<count;i++){const w=90+r()*55;x=220+i*(650/count)+r()*45;y=150+r()*350;plats.push({x,y,w,h:22,type:r()<Math.min(.36,n/280)?'bounce':'normal'})}const goal={x:835+r()*80,y:170+r()*300,w:120,h:26};plats.push(goal);const crowns=[];for(let i=0;i<3;i++){const p=plats[1+Math.floor(r()*count)];crowns.push({x:p.x+p.w/2,y:p.y-48,got:false})}const coins=[];for(let i=0;i<14;i++){const p=plats[1+Math.floor(r()*count)];coins.push({x:p.x+15+r()*(p.w-30),y:p.y-28-r()*42,got:false})}return{n,world,theme,plats,goal,crowns,coins,chest:{x:goal.x+goal.w/2,y:goal.y-28},t:0,deaths:0,won:false}}
function start(n){L=gen(n);P={x:105,y:475,vx:0,vy:0,r:15,ready:true,sx:105,sy:475,inv:0};drag=null;$('#level').textContent='المستوى '+ar(n);$('#tip').style.opacity=1;updateHud();screen('game')}
function fit(){const r=$('#wrap').getBoundingClientRect(),s=Math.min((r.width-16)/1000,(r.height-16)/620),d=Math.min(devicePixelRatio||1,2);cv.style.width=1000*s+'px';cv.style.height=620*s+'px';cv.width=Math.round(1000*s*d);cv.height=Math.round(620*s*d);ctx.setTransform(s*d,0,0,s*d,0,0)}addEventListener('resize',()=>state==='game'&&fit());
function collide(p,r){const cx=clamp(p.x,r.x,r.x+r.w),cy=clamp(p.y,r.y,r.y+r.h),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>=p.r)return null;if(d<.01)return{nx:0,ny:-1,pen:p.r};return{nx:dx/d,ny:dy/d,pen:p.r-d}}
function step(){if(!L||L.won)return;L.t++;if(P.inv>0)P.inv--;if(P.ready)return;P.vy+=.43;P.x+=P.vx;P.y+=P.vy;P.vx*=.997;P.vy*=.997;let ground=false;for(const q of L.plats){const c=collide(P,q);if(!c)continue;P.x+=c.nx*c.pen;P.y+=c.ny*c.pen;const vn=P.vx*c.nx+P.vy*c.ny;if(vn<0){const rest=q.type==='bounce'?1.05:.48;P.vx-=(1+rest)*vn*c.nx;P.vy-=(1+rest)*vn*c.ny}if(c.ny<-.55)ground=true}if(ground&&Math.hypot(P.vx,P.vy)<.7){P.ready=true;P.sx=P.x;P.sy=P.y;P.vx=P.vy=0}for(const c of L.coins)if(!c.got&&Math.hypot(P.x-c.x,P.y-c.y)<25){c.got=true;S.coins++;updateHud()}for(const c of L.crowns)if(!c.got&&Math.hypot(P.x-c.x,P.y-c.y)<28){c.got=true;toast('👑 تاج جديد!');updateHud()}if(Math.hypot(P.x-L.chest.x,P.y-L.chest.y)<45){const got=L.crowns.filter(c=>c.got).length;if(got===3)win();else if(L.t%90===0)toast('اجمع التيجان الثلاثة أولًا')}if(P.y>720||P.x<-90||P.x>1090){L.deaths++;P.x=P.sx=105;P.y=P.sy=475;P.vx=P.vy=0;P.ready=true;toast('🌴 عادت النجمة إلى البداية') }}
function updateHud(){$('#crowns').textContent='👑 '+ar(L?L.crowns.filter(c=>c.got).length:0)+'/٣';$('#coins').textContent='🪙 '+ar(S.coins)}
function win(){L.won=true;const st=L.deaths===0?3:L.deaths===1?2:1,bonus=15+st*10;S.stars[L.n]=Math.max(S.stars[L.n]||0,st);S.unlocked=Math.max(S.unlocked,Math.min(TOTAL,L.n+1));S.coins+=bonus;save();$('#winStars').textContent='🌴'.repeat(st)+'🌱'.repeat(3-st);$('#reward').textContent='مكافأة الإنهاء: '+ar(bonus)+' عملة';$('#next').style.display=L.n<TOTAL?'':'none';$('#winM').classList.add('on')}
function draw(){if(!L)return;const [name,a,b,top]=L.theme,g=ctx.createLinearGradient(0,0,0,620);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,1000,620);ctx.globalAlpha=.25;for(let i=0;i<40;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((i*137)%1000,(i*83)%620,1+(i%3),0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const q of L.plats){ctx.fillStyle='#0005';round(q.x+3,q.y+5,q.w,q.h,9);ctx.fill();ctx.fillStyle=q.type==='bounce'? '#ff5fa2':'#5b3822';round(q.x,q.y,q.w,q.h,9);ctx.fill();ctx.fillStyle=q.type==='bounce'?'#bfa587':top;round(q.x,q.y,q.w,7,5);ctx.fill()}for(const c of L.coins)if(!c.got){ctx.font='22px serif';ctx.textAlign='center';ctx.fillText('🪙',c.x,c.y+Math.sin(L.t*.08+c.x)*3)}for(const c of L.crowns)if(!c.got){ctx.font='30px serif';ctx.fillText('👑',c.x,c.y+Math.sin(L.t*.09)*4)}ctx.font='48px serif';ctx.fillText(L.crowns.every(c=>c.got)?'🎁':'🔒',L.chest.x,L.chest.y);if(drag&&P.ready){ctx.strokeStyle='#fff';ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([])}ctx.globalAlpha=P.inv&&L.t%6<3?.4:1;ctx.font='38px serif';ctx.fillText('🌴',P.x,P.y);ctx.globalAlpha=1;ctx.fillStyle='#ffffffbb';ctx.font='700 16px Tahoma';ctx.fillText(name,920,36)}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function local(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*620/r.height}}
cv.onpointerdown=e=>{if(paused||!P||!P.ready)return;drag=local(e);cv.setPointerCapture(e.pointerId);$('#tip').style.opacity=0};cv.onpointermove=e=>{if(drag)drag=local(e)};cv.onpointerup=e=>{if(!drag||!P.ready)return;const d=local(e),dx=P.x-d.x,dy=P.y-d.y,len=Math.hypot(dx,dy);if(len>9){const p=Math.min(175,len)/175*23;P.vx=dx/len*p;P.vy=dy/len*p;P.ready=false}drag=null};cv.onpointercancel=()=>drag=null;
function togglePause(on){paused=on;$('#pauseM').classList.toggle('on',on)}
$('#play').onclick=()=>start(Math.min(S.unlocked,TOTAL));$('#levels').onclick=()=>screen('map');$('#home').onclick=()=>screen('menu');$('#pause').onclick=()=>togglePause(true);$('#resume').onclick=()=>togglePause(false);$('#restart').onclick=()=>{togglePause(false);start(L.n)};$('#toMap').onclick=()=>{togglePause(false);screen('map')};$('#winMap').onclick=()=>{$('#winM').classList.remove('on');screen('map')};$('#next').onclick=()=>{$('#winM').classList.remove('on');start(Math.min(TOTAL,L.n+1))};addEventListener('visibilitychange',()=>document.hidden&&state==='game'&&togglePause(true));
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.1,(t-last)/1000);last=t;acc+=dt;while(acc>=1/60){if(state==='game'&&!paused)step();acc-=1/60}if(state==='game')draw()}refresh();requestAnimationFrame(loop);
</script></body></html>
