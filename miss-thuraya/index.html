/* ============================================================
   مس ثريا — دماغ محلّي يعرف كتاب الصفّ الخامس 5A كاملاً،
   وإن فُعّل مفتاح الـAPI انضمّ إليه وضعٌ ذكيّ للأسئلة الحرّة.
   ============================================================ */

/* ---------- ١) المنهج ---------- */
const IRREGULAR = {
  be:'was/were', buy:'bought', do:'did', drink:'drank', drive:'drove', eat:'ate', find:'found',
  get:'got', give:'gave', go:'went', have:'had', hold:'held', keep:'kept', know:'knew', lose:'lost',
  make:'made', put:'put', ride:'rode', run:'ran', see:'saw', sell:'sold', send:'sent', sing:'sang',

};
const PARTICIPLE = {
  be:'been', buy:'bought', do:'done', drink:'drunk', drive:'driven', eat:'eaten', find:'found',
  get:'got', give:'given', go:'gone/been', have:'had', hold:'held', keep:'kept', know:'known', lose:'lost',
  make:'made', put:'put', ride:'ridden', run:'run', see:'seen', sell:'sold', send:'sent', sing:'sung',
  sleep:'slept', stand:'stood', take:'taken', tell:'told', throw:'thrown', wear:'worn', win:'won', write:'written'
};
const IRREG_ADJ = {
  good:['better','the best'], bad:['worse','the worst'], far:['further','the furthest'],
  little:['less','the least'], many:['more','the most'], much:['more','the most']
};
const UNITS = [

     model:'Hi, Basma. You asked for some advice about great shops to visit in my town. In the toy shop, you can buy some amazing kites. They are big, but they are not expensive. The toy shop is in the shopping mall, where there\'s a lot to see and do.'}
};

/* ---------- ٢) محرّكات القواعد ---------- */
const VOWEL='aeiou';
const isVowel=c=>VOWEL.includes(c);
function syllables(w){ const m=w.toLowerCase().replace(/e$/,'').match(/[aeiouy]+/g); return m?m.length:1; }
function isShortAdj(a){ return syllables(a)<=1 || (syllables(a)===2 && /(y|er|ow|le)$/.test(a)); }

function comparative(adj){
  const a=adj.toLowerCase().trim();
  if(IRREG_ADJ[a]) return {form:IRREG_ADJ[a][0], why:'صفة شاذّة — تُحفظ كما هي.'};
  if(!isShortAdj(a)) return {form:'more '+a, why:'صفة طويلة (مقطعان فأكثر) → نضع <code>more</code> قبلها.'};
  if(/[^aeiou]y$/.test(a)) return {form:a.slice(0,-1)+'ier', why:'تنتهي بحرف ساكن + <code>y</code> → نقلب الـy إلى <code>i</code> ونضيف <code>-er</code>.'};
  if(/e$/.test(a)) return {form:a+'r', why:'تنتهي بـ<code>e</code> → نضيف <code>-r</code> فقط.'};
  if(a.length>=3 && !isVowel(a.slice(-1)) && isVowel(a.slice(-2,-1)) && !isVowel(a.slice(-3,-2)) && !/[wxy]$/.test(a))
    return {form:a+a.slice(-1)+'er', why:'ساكن + متحرّك + ساكن → نُضاعف الحرف الأخير ونضيف <code>-er</code>.'};
  return {form:a+'er', why:'صفة قصيرة → نضيف <code>-er</code>.'};
}
function superlative(adj){
  const a=adj.toLowerCase().trim();
  if(IRREG_ADJ[a]) return {form:IRREG_ADJ[a][1], why:'صفة شاذّة — تُحفظ كما هي.'};
  if(!isShortAdj(a)) return {form:'the most '+a, why:'صفة طويلة → <code>the most</code> قبلها.'};
  const c=comparative(a).form;
  return {form:'the '+c.replace(/er$/,'est'), why:'صفة قصيرة → <code>the</code> + الصفة + <code>-est</code> (بنفس تغيّر الإملاء).'};
}
function pastSimple(verb){
  const v=verb.toLowerCase().trim();
  if(IRREGULAR[v]) return {form:IRREGULAR[v], why:'فعل شاذّ — من قائمة الأفعال الشاذّة في آخر الكتاب (صفحة ٧٤).', irr:true};
  if(/e$/.test(v)) return {form:v+'d', why:'ينتهي بـ<code>e</code> → نضيف <code>-d</code> فقط.'};
  if(/[^aeiou]y$/.test(v)) return {form:v.slice(0,-1)+'ied', why:'ساكن + <code>y</code> → نقلب الـy إلى <code>i</code> ونضيف <code>-ed</code> (مثل <code>try → tried</code>).'};
  if(v.length>=3 && !isVowel(v.slice(-1)) && isVowel(v.slice(-2,-1)) && !isVowel(v.slice(-3,-2)) && !/[wxy]$/.test(v))
    return {form:v+v.slice(-1)+'ed', why:'ساكن + متحرّك + ساكن → نُضاعف الحرف الأخير ونضيف <code>-ed</code> (مثل <code>stop → stopped</code>).'};
  return {form:v+'ed', why:'فعل منتظم → نضيف <code>-ed</code> (مثل <code>play → played</code>).'};
}
function ing(verb){
  const v=verb.toLowerCase().trim();
  if(/ie$/.test(v)) return v.slice(0,-2)+'ying';
  if(/e$/.test(v) && v!=='be') return v.slice(0,-1)+'ing';
  if(v.length>=3 && !isVowel(v.slice(-1)) && isVowel(v.slice(-2,-1)) && !isVowel(v.slice(-3,-2)) && !/[wxy]$/.test(v))
    return v+v.slice(-1)+'ing';
  return v+'ing';
}

/* ---------- ٣) شروح القواعد ---------- */
const G = {
  comparative:{
    title:'المقارنة والتفضيل — Comparatives & Superlatives (الوحدة ١)',
    body:`نستعمل <b>المقارنة</b> بين اثنين، و<b>التفضيل</b> لواحدٍ بين الجميع.

<b>١) الصفات القصيرة</b> (مقطع واحد)
<code>kind → kinder than → the kindest</code>
مثال الكتاب: <code>Zaid is kinder than Qais.</code>
<code>My friends are the quietest in the library.</code>

<b>٢) الصفات الطويلة</b> (مقطعان فأكثر) → <code>more</code> و<code>the most</code>
<code>hard-working → more hard-working than → the most hard-working</code>
مثال الكتاب: <code>My brother is more hard-working than my sister.</code>
<code>Jasim and Younis are the most confident students in class.</code>

<b>٣) الشاذّة</b> — تُحفظ:
<code>good → better → the best</code>
<code>bad → worse → the worst</code>
مثال الكتاب: <code>Noora is the best at juggling.</code>

<b>تغيّرات الإملاء</b>
<code>shy → shier → the shiest</code> (ساكن + y ← i)
<code>big → bigger → the biggest</code> (مضاعفة الحرف الأخير)

اكتب لي أيّ صفة وأصرّفها لك فوراً — جرّب: <b>صرّفي tidy</b>`
  },
  goodat:{
    title:'be good / great / terrible at + V-ing (الوحدة ١)',
    body:`نتحدّث عن المهارة بـ<code>be + صفة + at + فعل ينتهي بـ-ing</code>.

<code>I <b>am</b> great at juggling.</code>
<code>He / She / It <b>is</b> good at spelling.</code>
<code>You / They <b>are</b> not very good at making pizza.</code>
<code>She <b>is</b> terrible at throwing a ball.</code>

انتبه: بعد <code>at</code> يأتي الفعل بـ<code>-ing</code> دائماً.
<code>make → making</code> · <code>bake → baking</code> · <code>juggle → juggling</code>`
  },
  past:{
    title:'الماضي البسيط — Past simple (الوحدة ٢)',
    body:`<b>المثبت</b> — الفعل في الماضي مع كلّ الضمائر:
<code>I lost the race two days ago.</code>

<b>المنفي</b> — <code>didn't</code> + الفعل في المصدر (بلا ماضٍ!):
<code>I didn't play football last month.</code>

<b>السؤال</b> — <code>Did</code> + الفاعل + المصدر:
<code>Did you use the tablet?</code>
<code>Did he find the email?</code>
الجواب: <code>Yes, I did.</code> / <code>No, I didn't.</code>

<b>تغيّرات الإملاء (الأفعال المنتظمة)</b>
<code>play → played</code> · <code>try → tried</code> · <code>stop → stopped</code>

<b>الأفعال الشاذّة</b> — من قائمة صفحة ٧٤:
<code>have → had</code> · <code>give → gave</code> · <code>go → went</code> · <code>write → wrote</code>

اكتب لي أيّ فعل وأصرّفه لك — جرّب: <b>ماضي verb send</b>`
  },
  could:{
    title:'could / couldn\'t (الوحدة ٢)',
    body:`نتحدّث عن قدرةٍ في الماضي.

<b>المثبت</b>: <code>I could throw a ball at the age of one.</code>
<b>المنفي</b>: <code>She couldn't spell words at the age of one.</code>
<b>السؤال</b>: <code>What could you do at the age of five?</code>
<code>Could they write an email?</code>
الجواب: <code>Yes, I could.</code> / <code>No, I couldn't.</code>

انتبه: بعد <code>could</code> يأتي الفعل في المصدر دائماً — بلا <code>to</code> وبلا <code>-ed</code>.`
  },
  will:{
    title:'المستقبل — will / won\'t (الوحدة ٣)',
    body:`<b>المثبت</b>: <code>I will travel to space next week.</code>
<b>المنفي</b>: <code>They won't go on Tuesday.</code> (<code>won't = will not</code>)
<b>السؤال</b>: <code>Will you write the email?</code>
<code>Will he wear the spacesuit?</code>
الجواب: <code>Yes, I will.</code> / <code>No, I won't.</code>

القاعدة الذهبيّة: بعد <code>will</code> الفعل في المصدر — مع كلّ الضمائر، بلا <code>s</code>.
✗ <code>He will goes</code> ✓ <code>He will go</code>`
  },
  measure:{
    title:'القياسات — Measurements (الوحدة ٣)',
    body:`نسأل عن الحجم بـ<code>How</code> + صفة القياس:

<code>How <b>high</b> is the mountain?</code> — الارتفاع
<code>How <b>deep</b> is the lake?</code> — العمق
<code>How <b>far</b> are the houses?</code> — البُعد
<code>How <b>wide</b> are the houses?</code> — العرض

<b>الجواب</b>:
<code>It's 5,400 metres high.</code>
<code>It's 5 metres deep.</code>
<code>They're 2 metres from my house.</code>
<code>They're 20 metres wide.</code>

انتبه: للمفرد <code>It's</code> وللجمع <code>They're</code>، والوحدة قبل الصفة.`
  },
  relative:{
    title:'جمل الوصل — who / which / where (الوحدة ٤)',
    body:`نصل جملتين بكلمةٍ واحدة حسب نوع ما نتحدّث عنه:

<code><b>who</b></code> ← لشخص
<code>It's the man who lives opposite.</code>

<code><b>which</b></code> ← لشيء
<code>It's the email which I sent you.</code>

<code><b>where</b></code> ← لمكان
<code>It's the house where my aunt lives.</code>

من الكتاب: <code>Sultan wants to go to the shop which sells necklaces.</code>
<code>Juma is the boy who will buy a phone case.</code>

اسأل نفسك: شخص؟ → who · شيء؟ → which · مكان؟ → where`
  },
  haveto:{
    title:'have to / has to (الوحدة ٤)',
    body:`نتحدّث عن <b>واجبٍ لازم</b>.

<b>المثبت</b>
<code>I / We / You / They <b>have to</b> go to school.</code>
<code>He / She / It <b>has to</b> stay at home.</code>

<b>المنفي</b>
<code>I don't have to go.</code>
<code>He doesn't have to stay.</code>

<b>السؤال</b>
<code>What <b>do</b> they have to do?</code>
<code>What <b>does</b> he have to do?</code>
<code>Do you have to stay here?</code> → <code>Yes, I do.</code> / <code>No, I don't.</code>
<code>Does she have to stay here?</code> → <code>Yes, she does.</code> / <code>No, she doesn't.</code>

القاعدة: <code>has to</code> مع he/she/it فقط. وفي السؤال والنفي نستعمل <code>do/does</code> ويعود الفعل <code>have</code>.`
  }
};

/* ---------- ٤) الواجهة ---------- */
const chat=document.getElementById('chat'), chips=document.getElementById('chips');
const form=document.getElementById('f'), input=document.getElementById('q'), modeEl=document.getElementById('mode');
let aiOn=false, history=[];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){
  return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
               .replace(/&lt;code&gt;/g,'<code>').replace(/&lt;\/code&gt;/g,'</code>')
               .replace(/&lt;i&gt;/g,'<i>').replace(/&lt;\/i&gt;/g,'</i>')
               .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
               .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function bubble(who,html){
  const d=document.createElement('div');
  d.className='msg '+(who==='me'?'me':'her');
  d.innerHTML='<div class="pic">'+(who==='me'?'🧒':'👩‍🏫')+'</div><div class="bub">'+html+'</div>';
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function say(text){ return bubble('her',fmt(text)); }
function typing(){
  const d=bubble('her','<span class="typing"><span></span><span></span><span></span></span>');
  return d;
}
function setChips(list){
  chips.innerHTML='';
  list.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=c.t;
    b.onclick=()=>{ input.value=c.q||c.t; form.dispatchEvent(new Event('submit')); };
    chips.appendChild(b);
  });
}
const HOME_CHIPS=[
  {t:'📘 وحدات الكتاب',q:'الوحدات'},
  {t:'⚖️ المقارنة والتفضيل',q:'اشرحي المقارنة'},
  {t:'⏳ الماضي البسيط',q:'اشرحي الماضي البسيط'},
  {t:'🔮 المستقبل will',q:'اشرحي will'},
  {t:'🔗 who / which / where',q:'اشرحي جمل الوصل'},
  {t:'✅ have to',q:'اشرحي have to'},
  {t:'📏 القياسات',q:'اشرحي القياسات'},
  {t:'🎯 could',q:'اشرحي could'},
  {t:'📝 نماذج الكتابة',q:'نماذج الكتابة'},
  {t:'📖 الأفعال الشاذّة',q:'الأفعال الشاذة'},
  {t:'🧠 اختبريني',q:'اختبريني'}
];

/* ---------- ٥) الدماغ المحلّي ---------- */
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْ]/g,'').trim();
const has=(s,...k)=>k.some(x=>s.includes(x));

let quiz=null;

function unitsList(){
  let s='📘 <b>كتاب النشاط — الصفّ الخامس · الفصل الأوّل (5A)</b>\n\n';
  UNITS.forEach(u=>{
    s+=`<b>${u.n===0?'Welcome':'Unit '+u.n}</b> — ${u.name} · ${u.ar}  <code>ص ${u.pages}</code>\n`;
  });
  s+='\nوفي آخر الكتاب: نماذج الكتابة (ص ٦٦) · الإملاء (ص ٧٠) · الأفعال الشاذّة (ص ٧٤) · قصص القراءة (ص ٧٦).\n\nاكتب مثلاً: <b>الوحدة ٢</b> لأعرض لك كلماتها وقواعدها.';
  return s;
}
function unitDetail(n){
  const u=UNITS.find(x=>x.n===n); if(!u) return null;
  let s=`📗 <b>${u.n===0?'Welcome back':'Unit '+u.n+' — '+u.name}</b> · ${u.ar}  <code>ص ${u.pages}</code>\n\n<b>الكلمات</b>\n`;
  for(const k in u.vocab) s+=`• ${k}: <code>${u.vocab[k].join(' · ')}</code>\n`;
  s+='\n<b>القواعد</b>\n';
  u.grammar.forEach(g=>{ s+= G[g] ? `• ${G[g].title}\n` : `• ${g}\n`; });
  if(WRITING[u.n]) s+=`\n<b>الكتابة</b>: ${WRITING[u.n].t} — اكتب <b>نموذج ${u.n}</b> لتراه.`;
  return s;
}
function irregularTable(){
  let s='📖 <b>الأفعال الشاذّة — صفحة ٧٤</b>\n\n<code>Infinitive · Past · Participle</code>\n';
  Object.keys(IRREGULAR).forEach(v=>{ s+=`<code>${v} · ${IRREGULAR[v]} · ${PARTICIPLE[v]}</code>\n`; });
  s+='\nاكتب <b>ماضي</b> ثمّ أيّ فعل وأصرّفه لك.';
  return s;
}
function writingModels(){
  let s='📝 <b>نماذج الكتابة — صفحة ٦٦</b>\n\n';
  [1,2,3,4].forEach(i=>{ s+=`<b>${i}</b> — ${WRITING[i].t} (${WRITING[i].ar})\n`; });
  s+='\nاكتب <b>نموذج ٢</b> مثلاً لتقرأ النموذج كاملاً مع أسئلته.';
  return s;
}
function writingModel(i){
  const w=WRITING[i]; if(!w) return null;
  let s=`📝 <b>${w.ar}</b> — ${w.t}\n\n<b>أسئلة تساعدك</b>\n`;
  w.q.forEach(q=>s+='• '+q+'\n');
  s+=`\n<b>النموذج</b>\n<code>${w.model}</code>\n\n<b>تذكّر</b>: حرف كبير في أوّل كلّ جملة · نقطة في آخرها · استعمل كلمات الربط (and, but, because, so) · تحقّق من الإملاء والخطّ.`;
  return s;
}

const QBANK=[
  {q:'Zaid is ____ (kind) than Qais.',a:'kinder',hint:'صفة قصيرة → -er + than'},
  {q:'My brother is ____ (hard-working) than my sister.',a:'more hard-working',hint:'صفة طويلة → more'},
  {q:'Noora is ____ (good) at juggling.',a:'the best',hint:'تفضيل شاذّ'},
  {q:'I ____ (lose) the race two days ago.',a:'lost',hint:'فعل شاذّ'},
  {q:"I ____ (not play) football last month.",a:"didn't play",hint:"didn't + مصدر"},
  {q:'____ you use the tablet yesterday?',a:'Did',hint:'سؤال ماضٍ'},
  {q:'She ____ (not can) spell words at the age of one.',a:"couldn't",hint:'قدرة في الماضي'},
  {q:'I ____ travel to space next week.',a:'will',hint:'مستقبل'},
  {q:'They ____ go on Tuesday. (negative)',a:"won't",hint:'will not'},
  {q:'How ____ is the lake? (العمق)',a:'deep',hint:'قياس'},
  {q:"It's the man ____ lives opposite.",a:'who',hint:'شخص'},
  {q:'It\'s the email ____ I sent you.',a:'which',hint:'شيء'},
  {q:"It's the house ____ my aunt lives.",a:'where',hint:'مكان'},
  {q:'He ____ stay at home. (واجب)',a:'has to',hint:'he/she/it'},
  {q:'____ she have to stay here?',a:'Does',hint:'سؤال he/she/it'},
  {q:'She is terrible at ____ (throw) a ball.',a:'throwing',hint:'بعد at يأتي -ing'}
];

function startQuiz(){
  quiz={i:0,score:0,items:QBANK.slice().sort(()=>Math.random()-0.5).slice(0,6)};
  return '🧠 <b>اختبار سريع — ٦ أسئلة</b>\nاكتب الإجابة فقط.\n\n<b>١)</b> <code>'+quiz.items[0].q+'</code>';
}
function answerQuiz(txt){
  const it=quiz.items[quiz.i];
  const ok=norm(txt).replace(/[.،,!؟?]/g,'')===norm(it.a).replace(/[.،,!؟?]/g,'');
  let s= ok ? '✅ <b>صحيح!</b>\n' : `❌ ليس بعد. الإجابة: <code>${it.a}</code>\n<i>${it.hint}</i>\n`;
  if(ok) quiz.score++;
  quiz.i++;
  if(quiz.i>=quiz.items.length){
    const sc=quiz.score, tot=quiz.items.length; quiz=null;
    s+=`\n🏁 <b>انتهى الاختبار: ${sc} من ${tot}</b>\n`;
    s+= sc===tot?'ممتاز! أنت جاهز للامتحان 🌟' : sc>=tot/2?'جيّد! راجع القاعدة التي أخطأت فيها.' : 'لا بأس — اكتب <b>اشرحي المقارنة</b> أو <b>اشرحي الماضي البسيط</b> ولنراجع معاً.';
    return s;
  }
  s+=`\n<b>${'١٢٣٤٥٦'[quiz.i]})</b> <code>${quiz.items[quiz.i].q}</code>`;
  return s;
}

function localBrain(raw){
  const t=norm(raw);
  if(quiz) return answerQuiz(raw);

  if(has(t,'سلام','مرحب','هلا','هاي','hello','hi ','صباح','مساء'))
    return 'وعليكم السلام 🌷 أنا <b>مس ثريا</b>، معلّمتك للصفّ الخامس.\nأشرح القواعد، وأحلّ أسئلة الكتاب، وأجيب عن كلّ ما يخصّ المنهج.\nاختر من الأزرار تحت، أو اسألني مباشرة.';

  if(has(t,'وحدات','الوحدات','محتويات','فهرس','units','contents')) return unitsList();
  const um=t.match(/(?:وحده|وحدة|unit)\s*(?:ال)?\s*([0-4]|١|٢|٣|٤|الاولي|اولي|واحد|الثانيه|ثانيه|اثنين|الثالثه|ثالثه|ثلاث|الرابعه|رابعه|اربع)/);
  if(um){ const map={'١':1,'٢':2,'٣':3,'٤':4,'واحد':1,'اثنين':2,'ثلاث':3,'اربع':4,
    'الاولي':1,'اولي':1,'الثانيه':2,'ثانيه':2,'الثالثه':3,'ثالثه':3,'الرابعه':4,'رابعه':4};
    const n=map[um[1]]!==undefined?map[um[1]]:parseInt(um[1],10);
    const d=unitDetail(n); if(d) return d; }

  if(has(t,'الافعال الشاذه','افعال شاذه','irregular','قائمه الافعال')) return irregularTable();
  if(has(t,'نماذج الكتابه','نماذج كتابه','writing model','الكتابه')) {
    const wm=t.match(/نموذج\s*([1-4]|١|٢|٣|٤)/);
    if(wm){ const map={'١':1,'٢':2,'٣':3,'٤':4}; const n=map[wm[1]]||parseInt(wm[1],10); const w=writingModel(n); if(w) return w; }
    return writingModels();
  }
  const wm2=t.match(/نموذج\s*([1-4]|١|٢|٣|٤)/);
  if(wm2){ const map={'١':1,'٢':2,'٣':3,'٤':4}; const n=map[wm2[1]]||parseInt(wm2[1],10); const w=writingModel(n); if(w) return w; }

  if(has(t,'اختبرني','اختبريني','اختبار','quiz','تمرين','مرني','امتحان')) return startQuiz();

  /* تصريف مباشر */
  const FILL='(?:of\\s+|for\\s+|the\\s+|form\\s+of\\s+|كلمه\\s+|كلمة\\s+|لي\\s+)*';
  /* كلماتٌ لا تصلح أن تكون هي الكلمة المطلوب تصريفها */
  const STOP=/^(of|for|the|a|an|is|are|was|were|simple|tense|verb|adjective|word|form|and|to|in|on|please|me|my)$/i;
  let m=raw.match(new RegExp('(?:صرفي|صرّفي|صرف|قارن|مقارنة|مقارنه|comparative|superlative)\\s+'+FILL+'([A-Za-z-]{2,})','i'));
  if(m&&STOP.test(m[1])) m=null;
  if(m){ const a=m[1]; const c=comparative(a), s=superlative(a);
    return `⚖️ <b>${a}</b>\nالمقارنة: <code>${c.form} than</code>\nالتفضيل: <code>${s.form}</code>\n\n<b>لماذا؟</b> ${c.why}\n\nمثال: <code>Ali is ${c.form} than Salim.</code>\n<code>Ali is ${s.form} in the class.</code>`;
  }
  m=raw.match(new RegExp('(?:ماضي|الماضي|past)\\s+(?:verb\\s+|tense\\s+|simple\\s+)?'+FILL+'([A-Za-z]{2,})','i'));
  if(m&&STOP.test(m[1])) m=null;
  if(m){ const v=m[1].toLowerCase(); const p=pastSimple(v);
    return `⏳ <b>${v}</b>\nالماضي: <code>${p.form}</code>${PARTICIPLE[v]?'\nالتصريف الثالث: <code>'+PARTICIPLE[v]+'</code>':''}\n\n<b>لماذا؟</b> ${p.why}\n\n<code>I ${p.irr?p.form.split('/')[0]:p.form} yesterday.</code>\n<code>I didn't ${v} yesterday.</code>\n<code>Did you ${v} yesterday?</code>`;
  }
  m=raw.match(/(?:ing|اي ان جي)\s+([A-Za-z]+)/i);
  if(m) return `<code>${m[1]} → ${ing(m[1])}</code>\nبعد <code>at</code> أو مع الاستمرار نستعمل هذه الصيغة.`;

  /* شروح القواعد */
  if(has(t,'مقارنه','تفضيل','comparative','superlative','er ','the most','more than')) return G.comparative.title+'\n\n'+G.comparative.body;
  if(has(t,'good at','great at','terrible at','ماهر','بارع')) return G.goodat.title+'\n\n'+G.goodat.body;
  if(has(t,'الماضي البسيط','ماضي بسيط','past simple','did','didnt',"didn't")) return G.past.title+'\n\n'+G.past.body;
  if(has(t,'could','كود','قدره في الماضي')) return G.could.title+'\n\n'+G.could.body;
  if(has(t,'المستقبل','will','wont',"won't")) return G.will.title+'\n\n'+G.will.body;
  if(has(t,'قياس','القياسات','how high','how deep','how far','how wide','measurement')) return G.measure.title+'\n\n'+G.measure.body;
  if(has(t,'جمل الوصل','who which','which where','relative','الوصل')) return G.relative.title+'\n\n'+G.relative.body;
  if(has(t,'have to','has to','واجب','لازم')) return G.haveto.title+'\n\n'+G.haveto.body;

  /* بحث في الكلمات — كلمةً مفردة، أو داخل سؤالٍ مثل «معنى كلمة telescope» */
  let word=null;
  const bare=raw.trim().toLowerCase();
  if(/^[a-z' -]{2,22}$/.test(bare)) word=bare;
  else{
    const qm=raw.match(/(?:معنى|معني|وش يعني|ايش يعني|شو يعني|ترجمة|ترجمه|meaning|means|كلمة|كلمه)\s+(?:كلمة\s+|كلمه\s+|of\s+|the\s+|word\s+)*([A-Za-z' -]{2,22})/i);
    if(qm) word=qm[1].trim().toLowerCase();
  }
  if(word){
    for(const u of UNITS) for(const k in u.vocab){
      const hit=u.vocab[k].find(w=>w.toLowerCase()===word);
      if(hit) return `📚 <code>${hit}</code>\nمن <b>${u.n===0?'Welcome':'Unit '+u.n+' — '+u.name}</b> · قائمة «${k}» · <code>ص ${u.pages}</code>\n\nاكتب <b>الوحدة ${u.n}</b> لترى بقيّة كلماتها.`;
    }
    if(IRREGULAR[word]) return `📖 <code>${word} → ${IRREGULAR[word]} → ${PARTICIPLE[word]}</code>\nفعل شاذّ من قائمة صفحة ٧٤.`;
    if(bare!==word){
      /* سُئلتُ عن كلمةٍ بعينها لكنّها ليست في قوائم الكتاب */
      return `🔎 <code>${esc(word)}</code> ليست في قوائم كلمات كتاب <b>5A</b>.\n\nاكتب <b>الوحدات</b> لترى كلّ كلمات الكتاب الأربع.\n\nوإن كانت صفةً فاكتب <b>صرّفي ${esc(word)}</b>، وإن كانت فعلاً فاكتب <b>ماضي ${esc(word)}</b>.`;
    }
  }

  /* حلّ فراغ — نجرّب الحلّ أوّلاً، ثمّ نرشد */
  if(raw.includes('__')||raw.includes('....')||raw.includes('؟؟')){
    const sol=solveBlank(raw);
    if(sol) return '✏️ <code>'+esc(raw.trim())+'</code>\n\n'+sol;
    return 'أرسل الجملة ومعها الكلمة بين قوسين، مثل:\n<code>Zaid is ____ (kind) than Qais.</code>\nوسأحلّها وأشرح القاعدة.\n\nأو اكتب <b>اختبريني</b> لنتمرّن معاً.';
  }
  return null;
}

/* حلّ فراغٍ ذكيّ بالقواعد */
function solveBlank(raw){
  const m=raw.match(/\(([A-Za-z ']+)\)/);
  if(!m) return null;
  const w=m[1].trim().toLowerCase();
  const neg=/not\s+/.test(w);
  const base=w.replace(/^not\s+/,'');
  const line=raw.toLowerCase();
  if(/than/.test(line)) { const c=comparative(base); return `الإجابة: <code>${c.form}</code>\n<b>القاعدة</b>: ${c.why}`; }
  if(/\bthe\b\s*_+/.test(line)||/most|est\b/.test(line)) { const s=superlative(base); return `الإجابة: <code>${s.form}</code>\n<b>القاعدة</b>: ${s.why}`; }
  if(/\bat\s+_+/.test(line)) return `الإجابة: <code>${ing(base)}</code>\n<b>القاعدة</b>: بعد <code>at</code> يأتي الفعل بـ<code>-ing</code>.`;
  if(/yesterday|ago|last |في الماضي/.test(line)){
    const p=pastSimple(base);
    return neg ? `الإجابة: <code>didn't ${base}</code>\n<b>القاعدة</b>: النفي في الماضي = <code>didn't</code> + المصدر (بلا تغيير).`
               : `الإجابة: <code>${p.form}</code>\n<b>القاعدة</b>: ${p.why}`;
  }
  if(/next |tomorrow|will/.test(line)) return neg?`الإجابة: <code>won't ${base}</code>`:`الإجابة: <code>will ${base}</code>\n<b>القاعدة</b>: بعد <code>will</code> يأتي المصدر مع كلّ الضمائر.`;
  const p=pastSimple(base);
  return `الأرجح: <code>${p.form}</code>\n<b>القاعدة</b>: ${p.why}\n\nلو كانت الجملة عن المستقبل فالإجابة <code>will ${base}</code>.`;
}

/* ---------- ٦) الوصل بالوضع الذكيّ ---------- */
async function askAI(question){
  const r=await fetch('/api/ask',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question,history:history.slice(-10)})
  });
  return r.json();
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const q=input.value.trim(); if(!q) return;
  input.value='';
  bubble('me',esc(q));
  history.push({role:'user',content:q});

  const local = localBrain(q) || solveBlank(q);
  if(local){
    say(local); history.push({role:'assistant',content:local.replace(/<[^>]+>/g,'')});
    return;
  }
  if(!aiOn){
    say('هذا السؤال خارج ما أحفظه من الكتاب 📘\nجرّب أن تسألني عن:\n• قاعدة من قواعد الوحدات الأربع\n• كلمة من كلمات الكتاب\n• تصريف صفة أو فعل — مثل <b>صرّفي big</b> أو <b>ماضي write</b>\n• أو اكتب <b>اختبريني</b>');
    return;
  }
  const t=typing();
  try{
    const r=await askAI(q);
    t.remove();
    if(r.ok){ say(r.answer); history.push({role:'assistant',content:r.answer}); }
    else say(r.message||'تعذّر الاتّصال الآن.');
  }catch(_){ t.remove(); say('تعذّر الاتّصال بالإنترنت. الدماغ المحلّي ما زال يعمل — جرّب سؤالاً من الكتاب.'); }
});

/* ---------- ٧) الإقلاع ---------- */
setChips(HOME_CHIPS);
say('أهلاً بك 🌷 أنا <b>مس ثريا</b>، معلّمة الإنجليزيّة للصفّ الخامس.\n\nأعرف كتاب النشاط <b>5A</b> كاملاً: وحداته الأربع، وكلماته، وقواعده، ونماذج الكتابة، والأفعال الشاذّة.\n\n<b>أستطيع أن</b>\n• أشرح أيّ قاعدة بالعربيّة مع أمثلة الكتاب\n• أحلّ أسئلة الفراغات وأشرح لماذا\n• أصرّف أيّ صفة أو فعل فوراً\n• أختبرك باختبارٍ سريع\n\nاختر من الأزرار تحت، أو اكتب سؤالك.');

fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:'ping'})})
  .then(r=>r.json()).then(j=>{ if(j && j.ok){ aiOn=true; modeEl.textContent='✨ وضع ذكيّ'; modeEl.classList.add('on'); } })
  .catch(()=>{});
