<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest — Grade 5A | Multaqa Marrif School | 2026–2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cairo:wght@700&family=Press+Start+2P&display=swap">
<style>
:root{
  --sky1:#2aa9e8; --sky2:#7dd8fa; --sky3:#c9f2ff;
  --ink:#17324a; --mut:#54748f; --panel:#fffdf4; --edge:#14324f;
  --grn1:#57e06b; --grn2:#2fbf4f; --grn3:#1e8f3e; --grnE:#0c4d22;
  --red1:#ff6b6b; --red2:#e03131; --redE:#7f1d1d;
  --yel1:#ffd93d; --yel2:#f0a500; --yelE:#8a5a00;
  --blu1:#5bc9ff; --blu2:#2196d9; --bluE:#0d5c8c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Tajawal","Cairo","Segoe UI",Tahoma,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 78%,#e8fbff 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3,.brand b{font-family:"Cairo","Tajawal",sans-serif}
.px{font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:1px;direction:ltr}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90}
#floatLayer{position:fixed;inset:0;pointer-events:none;z-index:95}
.floatPts{position:absolute;font-weight:900;font-size:22px;color:#8a5a00;background:linear-gradient(#ffd93d,#f0a500);border:3px solid #8a5a00;border-radius:12px;padding:3px 10px;box-shadow:0 4px 0 #8a5a00;animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-12px) scale(1.12);opacity:1}100%{transform:translateY(-80px) scale(1);opacity:0}}
.floatEmoji{position:absolute;font-size:32px;animation:fl2 1.4s ease-out forwards}
@keyframes fl2{0%{transform:translateY(0) scale(.5) rotate(0);opacity:0}25%{opacity:1;transform:translateY(-20px) scale(1.25)}100%{transform:translateY(-120px) scale(.9) rotate(24deg);opacity:0}}
.cloud{position:fixed;z-index:0;background:#fff;border-radius:60px;opacity:.95;pointer-events:none;box-shadow:0 8px 0 rgba(0,60,110,.08)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:150%;top:-70%;left:12%}
.cloud::after{width:42%;height:110%;top:-40%;right:10%}
.c1{width:150px;height:44px;top:9%;animation:drift 70s linear infinite}
.c2{width:110px;height:34px;top:24%;animation:drift 95s linear infinite;animation-delay:-30s}
.c3{width:180px;height:50px;top:48%;animation:drift 120s linear infinite;animation-delay:-60s}
.c4{width:90px;height:28px;top:66%;animation:drift 85s linear infinite;animation-delay:-15s}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.pipe{position:fixed;bottom:26px;z-index:0;width:86px;height:120px;border:4px solid var(--grnE);border-bottom:none;border-radius:14px 14px 0 0;background:linear-gradient(90deg,var(--grn3),var(--grn1) 32%,var(--grn2) 68%,#157a33);pointer-events:none}
.pipe::before{content:"";position:absolute;top:-26px;left:-12px;right:-12px;height:30px;border:4px solid var(--grnE);border-radius:10px;background:linear-gradient(90deg,var(--grn3),var(--grn1) 32%,var(--grn2) 68%,#157a33)}
.pipeL{left:14px}.pipeR{right:14px;height:88px}
.ground{position:fixed;left:0;right:0;bottom:0;height:26px;z-index:2;pointer-events:none;border-top:4px solid #7c3a12;background-color:#c96a32;background-image:linear-gradient(#a34d1f 2px,transparent 2px),linear-gradient(90deg,#a34d1f 2px,transparent 2px);background-size:34px 12px}
@media(max-width:760px){.pipe{width:52px;height:80px}.pipe::before{height:24px;top:-20px;left:-8px;right:-8px}.pipeR{display:none}}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:linear-gradient(180deg,var(--grn2),var(--grn3));border-bottom:4px solid var(--grnE);box-shadow:0 6px 18px rgba(0,50,20,.25)}
.tb-in{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(#ffd93d,#f0a500);border:3px solid #8a5a00;box-shadow:0 4px 0 #8a5a00}
.brand small{display:block;color:#d8ffe3;font-weight:400;font-size:10px}
.nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
.nav button{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);color:#fff;padding:8px 13px;border-radius:12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.nav button:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.nav button.on{background:#fff;color:var(--grn3);border-color:#fff}
.pill{font-size:12.5px;padding:7px 13px;border-radius:999px;background:linear-gradient(#ffd93d,#f0a500);border:2px solid #8a5a00;color:#5b3a00;font-weight:800;box-shadow:0 3px 0 #8a5a00}
main{max-width:1180px;margin:0 auto;padding:22px 16px;position:relative;z-index:1}
.card{background:var(--panel);border:4px solid var(--edge);border-radius:18px;padding:20px;box-shadow:0 6px 0 var(--edge),0 16px 30px rgba(0,40,80,.16)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mut{color:var(--mut)}
.small{font-size:13px}.tiny{font-size:11.5px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stag>*{animation:fade .5s ease both}
.stag>*:nth-child(1){animation-delay:.03s}.stag>*:nth-child(2){animation-delay:.08s}
.stag>*:nth-child(3){animation-delay:.13s}.stag>*:nth-child(4){animation-delay:.18s}
.stag>*:nth-child(5){animation-delay:.23s}.stag>*:nth-child(6){animation-delay:.28s}
.btn{font:inherit;font-weight:800;border-radius:14px;padding:13px 22px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 currentColor}
.primary{background:linear-gradient(var(--red1),var(--red2));color:#fff;border-color:var(--redE);box-shadow:0 5px 0 var(--redE);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.primary:hover{filter:brightness(1.07);transform:translateY(-2px);box-shadow:0 7px 0 var(--redE)}
.green{background:linear-gradient(var(--grn1),var(--grn2));color:#08300f;border-color:var(--grnE);box-shadow:0 5px 0 var(--grnE)}
.green:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--grnE)}
.amber{background:linear-gradient(var(--yel1),var(--yel2));color:#5b3a00;border-color:var(--yelE);box-shadow:0 5px 0 var(--yelE)}
.amber:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--yelE)}
.blue{background:linear-gradient(var(--blu1),var(--blu2));color:#fff;border-color:var(--bluE);box-shadow:0 5px 0 var(--bluE);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.blue:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--bluE)}
.wa{background:linear-gradient(#4be07a,#128c7e);color:#fff;border-color:#0b5c53;box-shadow:0 5px 0 #0b5c53}
.wa:hover{transform:translateY(-2px)}
.ghost{background:#fff;color:var(--edge);border-color:var(--edge);box-shadow:0 5px 0 var(--edge)}
.ghost:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--edge)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px;border-width:2px;box-shadow:0 3px 0 currentColor}
.blink{animation:blink 1.15s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
input,select{font:inherit;background:#fff;border:3px solid var(--edge);color:var(--ink);border-radius:13px;padding:13px 15px;width:100%;outline:none;box-shadow:inset 0 3px 0 rgba(20,50,79,.12)}
input:focus,select:focus{border-color:var(--blu2);box-shadow:0 0 0 4px rgba(33,150,217,.2)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:7px;font-weight:800}
.hero{text-align:center;padding:34px 14px 10px;position:relative}
.hero .big{font-size:clamp(30px,6.4vw,56px);font-weight:800;line-height:1.3;color:#fff;text-shadow:0 3px 0 var(--bluE),0 6px 0 rgba(0,40,80,.35),0 10px 24px rgba(0,40,80,.4)}
.hero .sub{color:#0b4a74;font-weight:800;font-size:clamp(14px,2.6vw,18px);margin-top:10px}
.qbrow{display:flex;gap:14px;justify-content:center;margin:22px 0 6px;flex-wrap:wrap}
.qb{width:56px;height:56px;background:linear-gradient(var(--yel1),var(--yel2));border:3px solid var(--yelE);border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:28px;color:#fff;text-shadow:0 2px 0 var(--yelE);box-shadow:0 5px 0 var(--yelE);animation:bob 2s ease-in-out infinite}
.qb.m{background:linear-gradient(#ff8787,var(--red2));border-color:var(--redE);box-shadow:0 5px 0 var(--redE);text-shadow:none}
.qb.g{background:linear-gradient(var(--grn1),var(--grn2));border-color:var(--grnE);box-shadow:0 5px 0 var(--grnE);text-shadow:none}
.qb:nth-child(2){animation-delay:.2s}.qb:nth-child(3){animation-delay:.4s}.qb:nth-child(4){animation-delay:.6s}.qb:nth-child(5){animation-delay:.8s}.qb:nth-child(6){animation-delay:1s}.qb:nth-child(7){animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.story{max-width:820px;margin:18px auto 0;text-align:start;line-height:2.1;font-size:15px;background:linear-gradient(#fffef8,#fff6d8)}
.story b{color:var(--red2)}
.box{max-width:540px;margin:22px auto 0;text-align:start}
.how{max-width:980px;margin:26px auto 0}
.how .card{position:relative;overflow:hidden}
.how .n{position:absolute;top:-2px;left:-2px;width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(var(--yel1),var(--yel2));border-radius:0 0 0 14px;border-bottom:3px solid var(--yelE);border-left:3px solid var(--yelE);font-weight:900;color:#5b3a00}
.stat{position:relative;overflow:hidden}
.stat .n{font-size:30px;font-weight:800;line-height:1.1;font-family:"Cairo",sans-serif}
.stat .l{font-size:12.5px;color:var(--mut);margin-top:4px;font-weight:700}
.stat .ic{position:absolute;left:12px;top:10px;font-size:26px}
.bar{height:14px;border-radius:99px;background:#dceffb;border:2px solid var(--edge);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(90deg,var(--yel1) 0 12px,var(--yel2) 12px 16px);border-right:2px solid var(--yelE);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.secH{display:flex;align-items:center;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.secH h2{font-size:20px;color:#0b4a74}
.secH .line{flex:1;height:4px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--grn2) 0 14px,transparent 14px 22px)}
.lesson{border:4px solid var(--edge);border-radius:18px;padding:16px;background:var(--panel);box-shadow:0 6px 0 var(--edge);transition:.2s;position:relative}
.lesson:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--edge)}
.lesson.done{background:linear-gradient(#f4fff2,#e6ffe9)}
.lhead{display:flex;gap:12px;align-items:flex-start}
.lemo{width:50px;height:50px;flex:0 0 50px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(var(--blu1),var(--blu2));border:3px solid var(--bluE);box-shadow:0 4px 0 var(--bluE)}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:800;border:2px solid var(--edge);background:#eef6ff;color:var(--edge);white-space:nowrap}
.badge.g{background:#dcf7e3;border-color:var(--grnE);color:#0c5a2c}
.badge.y{background:#fff3c9;border-color:var(--yelE);color:#6b4a00}
.badge.r{background:#ffe1e1;border-color:var(--redE);color:#8c1d1d}
.badge.c{background:#dff4ff;border-color:var(--bluE);color:#0b4a74}
.arow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:#f4faff;border:3px dashed #9db8cf;margin-top:9px;flex-wrap:wrap}
.arow.lock{opacity:.66;background:#f1f1f1}
.arow.pass{border-style:solid;border-color:var(--grn2);background:#eaffef}
.anum{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:16px;background:linear-gradient(var(--yel1),var(--yel2));color:#fff;text-shadow:0 2px 0 var(--yelE);border:2px solid var(--yelE);box-shadow:0 3px 0 var(--yelE);flex:0 0 34px}
.player{max-width:860px;margin:0 auto}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qtext{font-size:clamp(17px,3.2vw,23px);font-weight:800;line-height:1.6;margin:12px 0 16px;color:#0b4a74;direction:ltr;text-align:left}
.qen{direction:ltr;text-align:left;font-family:"Segoe UI",Tahoma,sans-serif;background:linear-gradient(#fffef8,#fff6d8);border:3px solid var(--yelE);border-radius:16px;padding:16px 18px;font-size:clamp(17px,3vw,22px);line-height:1.75;box-shadow:0 4px 0 var(--yelE);color:#4a3200;font-weight:700}
.opts{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{background:#fff;border:3px solid var(--bluE);border-radius:15px;padding:15px 16px;cursor:pointer;font:inherit;font-weight:800;color:var(--ink);text-align:center;transition:.15s;font-size:16px;direction:ltr;box-shadow:0 4px 0 var(--bluE)}
.opt:hover:not(:disabled){background:#e6f6ff;transform:translateY(-3px);box-shadow:0 7px 0 var(--bluE)}
.opt.ok{background:#dcf7e3;border-color:var(--grnE);box-shadow:0 4px 0 var(--grnE);animation:pop .4s}
.opt.no{background:#ffe1e1;border-color:var(--redE);box-shadow:0 4px 0 var(--redE);animation:shk .45s}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{margin-top:16px;border-radius:16px;padding:15px 17px;line-height:1.9;font-size:15px;border:3px solid;animation:fade .3s}
.fb.ok{background:#eaffef;border-color:var(--grn2);color:#0c5a2c}
.fb.no{background:#fff0f0;border-color:var(--red2);color:#8c1d1d}
.fb b{font-size:16px}
.hidden{display:none!important}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.mcols{grid-template-columns:1fr}}
.mitem{background:#fff;border:3px solid var(--bluE);border-radius:14px;padding:13px;cursor:pointer;font-weight:800;transition:.15s;display:flex;align-items:center;gap:9px;font-size:15px;box-shadow:0 4px 0 var(--bluE)}
.mitem:hover:not(.lock){transform:translateY(-3px);background:#e6f6ff}
.mitem.sel{border-color:var(--yelE);background:#fff6d8;box-shadow:0 4px 0 var(--yelE)}
.mitem.lock{background:#dcf7e3;border-color:var(--grnE);box-shadow:0 3px 0 var(--grnE);cursor:default}
.mitem.bad{animation:shk .45s;border-color:var(--redE);background:#ffe1e1}
.mitem .ar{direction:rtl}.mitem .en{direction:ltr;font-family:"Segoe UI",sans-serif}
.slots{display:grid;gap:9px;margin-bottom:18px}
.slot{border:3px dashed #9db8cf;border-radius:13px;padding:12px 14px;min-height:54px;display:flex;align-items:center;gap:10px;background:#f4faff;font-size:15px;font-weight:700;direction:ltr;text-align:left}
.slot.filled{border-style:solid;border-color:var(--grn2);background:#eaffef;animation:pop .35s}
.slot .idx{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(var(--yel1),var(--yel2));border:2px solid var(--yelE);color:#fff;text-shadow:0 1px 0 var(--yelE);font-weight:900;font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:9px}
.pitem{background:linear-gradient(#e6f6ff,#c9ecff);border:3px solid var(--bluE);border-radius:13px;padding:12px 15px;cursor:pointer;font-weight:800;font-size:14.5px;transition:.15s;direction:ltr;text-align:left;box-shadow:0 4px 0 var(--bluE);color:#0b4a74}
.pitem:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--bluE)}
.pitem.used{opacity:.25;pointer-events:none;filter:grayscale(1)}
.pitem.bad{animation:shk .45s;border-color:var(--redE);background:#ffe1e1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-top:16px}
.bin{border:3px dashed #9db8cf;border-radius:16px;padding:13px;min-height:130px;background:#f4faff;transition:.2s}
.bin.ok{border-color:var(--grn2);background:#eaffef}
.bin.bad{border-color:var(--red2);background:#fff0f0;animation:shk .4s}
.bin h4{text-align:center;margin-bottom:10px;font-size:15px;color:#0b4a74;direction:ltr}
.bin .in{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.tag{background:#dcf7e3;border:2px solid var(--grnE);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:800;direction:ltr;animation:pop .35s;color:#0c5a2c}
.pbar{height:16px;border-radius:99px;background:#dceffb;border:3px solid var(--edge);overflow:hidden}
.pbar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--yel1) 0 12px,var(--yel2) 12px 16px);transition:width .5s}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hud .hb{background:#fff;border:2px solid var(--edge);border-radius:11px;padding:7px 12px;font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 var(--edge)}
.stars{display:flex;gap:12px;justify-content:center;margin:8px 0 4px}
.star{font-size:56px;filter:grayscale(1);opacity:.3;transform:scale(.7)}
.star.on{filter:none;opacity:1;transform:scale(1);animation:st .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes st{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.bigScore{font-size:52px;font-weight:800;font-family:"Cairo",sans-serif;text-align:center;line-height:1}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.kb{grid-template-columns:1fr}}
.kcol{background:#f2fbff;border:3px solid var(--edge);border-radius:18px;padding:14px;min-height:180px;box-shadow:0 5px 0 var(--edge)}
.kcol h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px;color:#0b4a74}
.kcard{background:#fff;border:2px solid var(--edge);border-radius:13px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.2s;font-size:13.5px;font-weight:700;box-shadow:0 3px 0 var(--edge)}
.kcard:hover{transform:translateX(-4px)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 8px;border-bottom:2px solid #dceafb;text-align:center}
th{color:#0b4a74;font-size:12.5px;font-weight:800;background:#e6f6ff}
td.nm{text-align:start;font-weight:800}
.ring{position:relative;width:150px;height:150px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:30px;font-family:"Cairo",sans-serif;display:block;line-height:1;color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{background:#fff;border:2px solid var(--edge);border-radius:14px;padding:10px 13px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center;transition:.2s;box-shadow:0 3px 0 var(--edge)}

/* ==================== SOUND ==================== */
let AC=null;
function ctx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,d,type,vol,delay){
  const c=ctx(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  const t=c.currentTime+(delay||0);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}
function sweep(f1,f2,d,type,vol){
  const c=ctx(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||"square";
  o.frequency.setValueAtTime(f1,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+d);
  g.gain.setValueAtTime(vol||.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.04);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.06);
}
const SFX={
  click(){tone(660,.07,"triangle",.12);},
  jump(){sweep(300,900,.18,"square",.11);},
  coin(){tone(987.77,.09,"square",.14);tone(1318.51,.26,"square",.14,.09);},
  correct(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.22,"triangle",.16,i*.075));},
  wrong(){tone(196,.16,"sawtooth",.12);tone(147,.28,"sawtooth",.12,.1);},
  star(){[784,988,1175].forEach((f,i)=>tone(f,.2,"sine",.15,i*.09));},
  unlock(){[392,523,659,880,1047].forEach((f,i)=>tone(f,.14,"square",.11,i*.06));},
  power(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.12,"square",.12,i*.06));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",.16,i*.11));tone(1568,.5,"sine",.12,.6);},
  fail(){[440,349,262].forEach((f,i)=>tone(f,.28,"sine",.13,i*.13));}
};

 {id:"t9",code:"L9P1",page:"CB p.21",en:"Project · Good Manners Book",ar:"مشروع: كتاب الآداب الحسنة",emoji:"📕",skill:"writing",
  obj:"يخطط الطالب ويكتب ويقدّم كتيبًا قصيرًا عن الآداب الحسنة في سلطنة عُمان.",

    {t:"Choose three good manners in Oman."},{t:"Write sentences with must / should / it's polite to."},

  {id:"t9a2",ar:"النشاط ٢ · Complete the phrases",type:"fill",items:[

   {q:"You ___ say thank you when someone helps you.",options:["should","are","is","do"],a:0,fb:"should للنصيحة: ينبغي أن…"},

   {q:"You mustn't be ___ to your friends.",options:["rude","polite","tidy","kind"],a:0,fb:"mustn't للنهي، والممنوع هنا هو الوقاحة rudeness."},

 {id:"t10",code:"L10P1",page:"CB p.22",en:"English in Action",ar:"وصف الناس + الأصوات",emoji:"💬",skill:"speaking",
  obj:"يصف الطالب مظهر شخص وشخصيته ويميّز صوتَي /eə/ و /eɪ/.",
  acts:[
  {id:"t10a1",ar:"النشاط ١ · What do we say?",type:"mcq",items:[
   {q:"___ she like?  — She's really friendly.",options:["What's","Where's","Who's","When's"],a:0,fb:"للسؤال عن الشخصية: What's she like?"},
   {q:"She's really ___.",options:["friendly","friend","friends","friendship"],a:0,fb:"بعد really نحتاج صفة: friendly."},
   {q:"He ___ tall and he has fair hair.",options:["is","are","am","be"],a:0,fb:"مع He نستخدم is."},
   {q:"What does Arthur look ___?",options:["like","at","for","to"],a:0,fb:"السؤال عن المظهر: What does he look like?"},
   {q:"She's very confident — she's not ___ at all.",options:["shy","rude","tidy","hard-working"],a:0,fb:"عكس confident (واثق) هو shy (خجول)."},
   {q:"He's got dark, ___ hair.",options:["curly","curl","curls","curling"],a:0,fb:"نحتاج صفة لوصف الشعر: curly."}]},
  {id:"t10a2",ar:"النشاط ٢ · Sort the sounds",type:"sort",
   cats:["/eə/  like hair","/eɪ/  like play"],
   items:[{t:"hair",c:0},{t:"fair",c:0},{t:"Clare",c:0},{t:"chair",c:0},{t:"play",c:1},{t:"day",c:1},{t:"name",c:1},{t:"they",c:1}]}
 ]},
 {id:"t11",code:"L11P1",page:"CB p.23",en:"Reading · Detective Report",ar:"القراءة: تقرير المحقق",emoji:"🕵️",skill:"reading",
  obj:"يقرأ الطالب تقرير محقق بحثًا عن التفاصيل ويصحّح العبارات الخاطئة عن المشتبه بهم.",
  acts:[
  {id:"t11a1",ar:"النشاط ١ · Understand the report",type:"mcq",items:[
   {q:"What is missing in the report?",options:["a diamond","a book","a cat","a ball"],a:0,fb:"التقرير يتحدث عن الماسة المفقودة a missing diamond."},
   {q:"Who writes the report?",options:["Chief Inspector Fleming","Bailey","Arthur","Maite"],a:0,fb:"كاتب التقرير هو المفتش Chief Inspector Fleming."},
   {q:"A \"suspect\" is a person who ___.",options:["may have done the crime","sells diamonds","cleans the house","writes stories"],a:0,fb:"suspect = مشتبه به، قد يكون ارتكب الجريمة."},
   {q:"What kind of text is this?",options:["a report","a poem","a song","a comic"],a:0,fb:"العنوان والتخطيط (حقائق وأسماء) يدلان على تقرير."},
   {q:"The diamond was kept in a ___ box.",options:["glass","wooden","paper","metal"],a:0,fb:"من مفردات الدرس: a glass box صندوق زجاجي."},
   {q:"To find the truth, the inspector looks for ___.",options:["clues","jokes","colours","songs"],a:0,fb:"clues = الأدلة/القرائن."}]},
  {id:"t11a2",ar:"النشاط ٢ · Complete with unit words",type:"fill",items:[
   {q:"The circus has a ___ high above the ring.",options:["trapeze","magnet","glass","cake"],a:0,fb:"trapeze = الأرجوحة الطائرة في السيرك."},
   {q:"A ___ can pick up metal objects.",options:["magnet","diamond","report","suspect"],a:0,fb:"magnet = المغناطيس يجذب المعادن."},
   {q:"The inspector felt ___ , so he went home to rest.",options:["ill","tidy","fair","great"],a:0,fb:"ill = مريض، ولذلك ذهب للراحة."},
   {q:"Be careful — that ___ box can break easily.",options:["glass","wooden","paper","dark"],a:0,fb:"الزجاجي glass سهل الكسر."},
   {q:"There are four ___ in the story.",options:["suspects","manners","songs","balls"],a:0,fb:"suspects = المشتبه بهم (أربعة)."},
   {q:"The thief took the ___ from the museum.",options:["diamond","magnet","trapeze","pizza"],a:0,fb:"diamond = الماسة المسروقة."}]}
 ]},
 {id:"t12",code:"L12P1",page:"CB p.24",en:"Listening & Speaking",ar:"الاستماع والتحدث عن العائلة",emoji:"🎧",skill:"speaking",
  obj:"يلتقط الطالب معلومات رئيسية أثناء الاستماع ويتحدث عن شخص مهم في عائلته.",
  acts:[
  {id:"t12a1",ar:"النشاط ١ · Choose the correct word",type:"mcq",items:[
   {q:"My Uncle Hashim is my ___ uncle.",options:["favourite","favour","favouring","favours"],a:0,fb:"favourite صفة بمعنى المفضّل."},
   {q:"He's very ___ — he always helps people.",options:["kind","mean","rude","lazy"],a:0,fb:"المساعدة دليل على الطيبة kind."},
   {q:"My aunt ___ beautiful dark hair.",options:["has","have","is","does"],a:0,fb:"مع she نستخدم has لوصف المظهر."},
   {q:"___ is your favourite person in your family?",options:["Who","What","Where","Which book"],a:0,fb:"للسؤال عن شخص نستخدم Who."},
   {q:"My cousin is good ___ fixing toys.",options:["at","in","on","to"],a:0,fb:"good at + ing."},
   {q:"She is my mother's sister, so she is my ___.",options:["aunt","uncle","granny","cousin"],a:0,fb:"أخت الأم = aunt (خالة)."}]},
  {id:"t12a2",ar:"النشاط ٢ · Order the paragraph",type:"order",items:[
    {t:"My Uncle Hashim is my favourite uncle."},{t:"He is tall and he has short dark hair."},
    {t:"He is very kind and hard-working."},{t:"He is good at fixing toys and making pizza."},
    {t:"On Fridays he visits us and we play football."},{t:"I love my uncle because he always makes me laugh."}]}
 ]},
 {id:"t13",code:"L13P1",page:"CB p.24",en:"Writing · Linking Words",ar:"الكتابة: أدوات الربط",emoji:"✍️",skill:"writing",
  obj:"يخطط الطالب ويكتب وصفًا لشخص مهم في حياته مستخدمًا أدوات الربط and, or, but, so, because.",
  acts:[
  {id:"t13a1",ar:"النشاط ١ · Choose the linking word",type:"fill",items:[
   {q:"My granny is 80, ___ she is very strong.",options:["but","and","or","so"],a:0,fb:"but للتناقض بين العمر والقوة."},
   {q:"She likes tea ___ coffee.",options:["or","but","so","because"],a:0,fb:"or للاختيار بين شيئين."},
   {q:"It was late, ___ we went home.",options:["so","but","or","and"],a:0,fb:"so للنتيجة."},
   {q:"She is happy ___ all her family is here.",options:["because","but","or","so"],a:0,fb:"because للسبب."},
   {q:"My granny is kind ___ she helps everyone.",options:["and","but","or","because"],a:0,fb:"and لإضافة معلومة مؤيدة."},
   {q:"He is shy, ___ he is very clever.",options:["but","and","or","so"],a:0,fb:"but تربط بين صفتين متعارضتين."}]},
  {id:"t13a2",ar:"النشاط ٢ · Order Maite's description",type:"order",items:[
    {t:"This is my granny, Rosa."},{t:"She is short and she has fair, curly hair."},
    {t:"She is very kind and patient."},{t:"She likes gardening and baking bread."},
    {t:"She doesn't like loud music or late nights."},{t:"I love her because she tells the best stories."}]}
 ]},
 {id:"t14",code:"L14P1",page:"CB p.25",en:"Unit 1 Review",ar:"مراجعة الوحدة الأولى",emoji:"🔁",skill:"review",
  obj:"يراجع الطالب مفردات وقواعد الوحدة الأولى: أوصاف الشخصية، الهوايات، المقارنة والتفضيل.",
  acts:[
  {id:"t14a1",ar:"النشاط ١ · Quick review quiz",type:"mcq",items:[
   {q:"My sister is ___ than me. (old)",options:["older","old","oldest","the oldest"],a:0,fb:"المقارنة: older + than."},
   {q:"I brush my teeth ___ I go to bed.",options:["before","after","when","so"],a:0,fb:"before = قبل النوم."},
   {q:"Which word is a personality adjective?",options:["polite","tennis","book","run"],a:0,fb:"polite (مهذب) صفة شخصية."},
   {q:"She is great ___ spelling.",options:["at","in","on","for"],a:0,fb:"great at + ing."},
   {q:"He has a long white ___.",options:["beard","manner","diamond","trapeze"],a:0,fb:"beard = اللحية (صفة مظهر)."},
   {q:"This is the ___ cake in the world! (good)",options:["best","good","better","well"],a:0,fb:"التفضيل من good هو the best."}]},
  {id:"t14a2",ar:"النشاط ٢ · Match word & category",type:"match",items:[
    {l:"better",r:"comparative of good",e:"📊"},{l:"the worst",r:"superlative of bad",e:"🏆"},
    {l:"hard-working",r:"personality adjective",e:"🙂"},{l:"curly",r:"appearance adjective",e:"💇"},
    {l:"juggle",r:"hobby verb",e:"🤹"},{l:"It's polite to…",r:"good-manners phrase",e:"🙏"}]}
 ]}
]},

 {id:"tn2",code:"L2P1",page:"CB p.38–39",en:"Story · The Secret Code",ar:"القصة: الرمز السري",emoji:"🕹️",skill:"reading",
  obj:"يفهم الطالب قصة مشروع سامي عن التقنية القديمة ورمز فريق الاستكشاف السري (أنبوب التحدث) ويعيد سردها.",
  acts:[

    {t:"Sami decodes the secret message with the code key."},{t:"The team laughs and plans their next discovery."}]},
  {id:"tn2a2",ar:"النشاط ٢ · Story comprehension",type:"mcq",items:[
   {q:"A speaking tube is an old way to ___ with someone in another room.",options:["talk","swim","cook","read"],a:0,fb:"أنبوب التحدث وسيلة قديمة للتحدث talk بين الغرف."},
   {q:"The Discovery Team hides their messages in a secret ___.",options:["code","cake","cloud","coin"],a:0,fb:"الرمز السري code يُخفي معنى الرسالة."},
   {q:"Sami's project is about ___ technology.",options:["old","new","future","digital"],a:0,fb:"مشروع سامي عن التقنية القديمة old."},
   {q:"Long ago, people sent messages by ___ , not email.",options:["letter","tablet","mouse","keyboard"],a:0,fb:"قبل البريد الإلكتروني كانت الرسائل الورقية letter."},
   {q:"Which sentence happened FIRST in the story?",options:["First, Sami chooses his project topic.","Then, the team finds the tube.","After that, they write a code.","Finally, they decode it."],a:0,fb:"كلمة First تدل على الحدث الأول."},

 {id:"tn3",code:"L3P1",page:"CB p.40",en:"Past Simple",ar:"الماضي البسيط",emoji:"⏳",skill:"grammar",
  obj:"يستخدم الطالب الماضي البسيط بأفعاله المنتظمة والشاذة للحديث عن الماضي: Did you have a phone ten years ago?",
  acts:[
  {id:"tn3a1",ar:"النشاط ١ · Choose the past form",type:"mcq",items:[
   {q:"I ___ football yesterday.",options:["played","play","plays","playing"],a:0,fb:"فعل منتظم: play + ed = played."},
   {q:"She ___ her granny last weekend.",options:["visited","visit","visits","visiting"],a:0,fb:"visit + ed = visited مع إشارة الماضي last weekend."},
   {q:"___ you have a phone ten years ago?",options:["Did","Do","Does","Are"],a:0,fb:"السؤال في الماضي البسيط بأداة Did."},
   {q:"He ___ his keys an hour ago.",options:["found","find","finds","finding"],a:0,fb:"فعل شاذ: find → found."},
   {q:"They ___ very happy at the party.",options:["were","was","is","are"],a:0,fb:"مع They في الماضي: were."},
   {q:"My grandpa ___ us stories every night when he was young.",options:["told","tell","tells","telling"],a:0,fb:"فعل شاذ: tell → told."}]},
  {id:"tn3a2",ar:"النشاط ٢ · Complete with the past",type:"fill",items:[
   {q:"Yesterday I ___ (try) the new tablet.",options:["tried","try","tries","trying"],a:0,fb:"try → tried (y تصبح i ثم ed)."},
   {q:"Sami ___ (have) a small bicycle when he was four.",options:["had","have","has","having"],a:0,fb:"فعل شاذ: have → had."},
   {q:"We ___ (watch) a film about museums last night.",options:["watched","watch","watches","watching"],a:0,fb:"watch + ed = watched."},
   {q:"She ___ (find) an old letter in the box.",options:["found","find","finds","founded"],a:0,fb:"find → found (شاذ)."},
   {q:"___ they ___ (play) tennis last Friday?",options:["Did / play","Do / play","Did / played","Were / play"],a:0,fb:"بعد Did يعود الفعل للمصدر: Did they play."},
   {q:"My mum ___ (study) in Muscat ten years ago.",options:["studied","study","studies","studyed"],a:0,fb:"study → studied (y تصبح i ثم ed)."}]}
 ]},
 {id:"tn4",code:"L4P1",page:"CB p.41",en:"could / couldn't",ar:"أفعال الحركة + could",emoji:"👟",skill:"grammar",

    {l:"make a face",r:"يصنع وجهًا مضحكًا",e:"😝"},{l:"tell a story",r:"يحكي قصة",e:"📖"},

    {l:"make a sandwich",r:"يصنع شطيرة",e:"🥪"},{l:"tie a shoelace",r:"يربط رباط الحذاء",e:"👟"}]},

 {id:"le9",code:"L9P1",page:"CB p.68",en:"Listening · An Astronaut's Day",ar:"الاستماع: يوم رائد فضاء",emoji:"🎧",skill:"speaking",

  acts:[

   {q:"On the ISS, you can't ___ your hair with running water.",options:["wash","brush? no","cut","dry"],a:0,fb:"لا ماء جارٍ في الفضاء، لذا لا غسل تقليدي."},
   {q:"Astronauts ___ their food from special packets.",options:["make","buy","sell","plant"],a:0,fb:"يُجهَّز الطعام من أكياس خاصة make."},
   {q:"If something breaks, astronauts must ___ it themselves.",options:["repair","watch","throw","forget"],a:0,fb:"الإصلاح الذاتي ضروري repair."},
   {q:"In space, water doesn't fall — it ___.",options:["floats","falls","runs","drops"],a:0,fb:"انعدام الوزن يجعل الماء يطفو floats."},

  {id:"le9a2",ar:"النشاط ٢ · Order an astronaut's day",type:"order",items:[

function rec(lid,k){return (S.progress[lid]||{})[k]||null;}

function lessonStatus(l){const a1=rec(l.id,"a1"),a2=rec(l.id,"a2");if(lessonDone(l))return "done";if(a1||a2)return "doing";return "todo";}

function stats(){

  ALL.forEach(l=>{if(lessonDone(l))done++;["a1","a2"].forEach(k=>{const r=rec(l.id,k);if(r){q+=r.total;ok+=r.score;time+=r.time;att+=r.attempts||1;}});});
  return {done,total:ALL.length,q,ok,time,att,pct:q?Math.round(ok/q*100):0};
}

}

/* confetti */
const cv=$("#cf"),cx2=cv.getContext("2d");let parts=[],raf=null;
function sizeC(){cv.width=innerWidth;cv.height=innerHeight;}sizeC();addEventListener("resize",sizeC);
function burst(n,power){
  const cols=["#ffd93d","#f0a500","#57e06b","#2fbf4f","#ff6b6b","#e03131","#5bc9ff","#ffffff"];
  for(let i=0;i<(n||90);i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,
      vx:(Math.random()-.5)*(power||9),vy:-(Math.random()*(power||9)+3),
      g:.28,s:Math.random()*9+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.35,life:110});
  }
  if(!raf)loopC();
}
function loopC(){
  cx2.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx2.save();cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.globalAlpha=Math.max(0,p.life/110);
    cx2.fillStyle=p.c;cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx2.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  if(parts.length)raf=requestAnimationFrame(loopC);else{raf=null;cx2.clearRect(0,0,cv.width,cv.height);}
}

/* ==================== LESSONS ==================== */

  const u=UNITS.find(x=>x.id===R.unit)||UNITS[0];

    let acts="";

      const key="a"+(ai+1);

      const cls=locked?"lock":(passed(l.id,key)?"pass":"");
      let st2=`<span class="badge r">Not started</span>`;
      if(r&&pct>=70)st2=`<span class="badge g">✅ ${r.score}/${r.total} · ${pct}%</span>`;

        </div>
        <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">

            <span class="badge">${l.ar}</span>
            <span class="badge c">${l.code}</span>
            <span class="badge" style="border-color:${sk.c};color:${sk.c}">${sk.ic} ${sk.ar}</span>
            <span class="badge">${l.page}</span>
            ${stT==="done"?'<span class="badge g">🚩 Done</span>':stT==="doing"?'<span class="badge y">⏳ In progress</span>':'<span class="badge">📌 New</span>'}
          </div>
          <div class="small mut" style="margin-top:6px;line-height:1.75">🎯 ${l.obj}</div>
        </div>
      </div>
      ${acts}
    </div>`;
  });
  app.innerHTML=`<div class="fade">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn ghost sm" data-go="dash">→ الخريطة</button>
      <button class="btn amber sm" data-go="scrum">📋 لوحة سكروم</button>
    </div>
    <div class="card" style="margin-bottom:16px;background:linear-gradient(#e6f6ff,#d3f0ff)">
      <div class="lhead"><div class="lemo" style="font-size:30px">${u.icon}</div>
      <div><h2 style="font-size:22px;color:#0b4a74;direction:ltr;text-align:start">${u.en}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><span class="badge">${u.ar}</span><span class="badge c px">WORLD ${u.world}</span><span class="badge">${u.month}</span></div>
      <div class="small mut" style="margin-top:8px;line-height:1.7;direction:ltr;text-align:left">${u.note}</div></div></div>
    </div>
    <div class="grid">${rows}</div>
  </div>${footHTML()}`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{sfx("click");go(b.dataset.go);});
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const [lid,ai]=b.dataset.act.split("|");
    if(ai==="1"&&!passed(lid,"a1")){sfx("wrong");toast("🔒 أكمل النشاط الأول بنسبة 70٪ أولًا","no");return;}
    sfx("jump");startActivity(lid,+ai);
  });
}
function typeLabel(t){return {match:"Matching 🧩",mcq:"Multiple Choice ✏️",fill:"Fill in the Blank 📝",order:"Sequencing 🔢",sort:"Sorting 🔀"}[t]||t;}


/* ==================== SCRUM ==================== */

        <div class="tiny mut" style="margin-top:5px">${l.unitName} · ${l.code} · ${SKILLS[l.skill].ic} ${SKILLS[l.skill].ar}</div>
        <div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap">

      <button class="btn ghost sm" data-go="dash">→ الخريطة</button>

    </div>
    <div class="card" style="margin-bottom:16px;background:linear-gradient(#fffef8,#fff6d8)">
      <h2 style="font-size:20px;color:#6b4a00">📋 لوحة سكروم للتقدّم — ${S.student.name}</h2>
      <div class="small mut" style="margin-top:6px;line-height:1.8">بطاقات الدروس تتحرك تلقائيًا بين الأعمدة حسب إنجازك: لم يبدأ ← قيد التعلّم ← أتقنه.
      <b>الشرط:</b> اجتياز النشاط الأول (70٪) يفتح النشاط الثاني، واجتياز الاثنين ينقل البطاقة إلى «أتقنه 🚩».</div>
      <div class="bar" style="margin-top:12px"><i style="width:${Math.round(st.done/st.total*100)}%"></i></div>
      <div class="tiny mut" style="margin-top:6px">الإنجاز الكلي: ${st.done} / ${st.total} درسًا (${Math.round(st.done/st.total*100)}٪) · ${TOTAL_ACTS} نشاطًا تفاعليًا</div>
    </div>
    <div class="kb">${html}</div>
  </div>${footHTML()}`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{sfx("click");go(b.dataset.go);});

/* ==================== ACTIVITY ENGINE ==================== */
function startActivity(lid,ai){
  const l=LESSON(lid),a=l.acts[ai];
  if(ai===1&&!passed(lid,"a1")){sfx("wrong");toast("🔒 يجب اجتياز النشاط الأول أولًا (70٪)","no");return;}
  const prev=rec(lid,"a"+(ai+1));
  Sess={l,a,ai,key:"a"+(ai+1),i:0,score:0,mistakes:0,total:a.items.length,answered:false,
        t0:Date.now(),elapsed:0,sel:null,tried:{},pairs:0,orderIdx:0,sorted:0};
  R={v:"activity"};render();
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{if(Sess){Sess.elapsed=Math.floor((Date.now()-Sess.t0)/1000);const e=$("#tEl");if(e)e.textContent=fmtTime(Sess.elapsed);}},1000);
}
function progressCount(){
  if(Sess.a.type==="mcq"||Sess.a.type==="fill")return Math.min(Sess.i,Sess.total);
  if(Sess.a.type==="match")return Sess.pairs;
  if(Sess.a.type==="order")return Sess.orderIdx;
  return Sess.sorted;
}
function hud(){
  return `<div class="phead">
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <button class="btn ghost sm" id="quitBtn">✖ Exit</button>
      <div><b style="color:#0b4a74;direction:ltr">${Sess.l.emoji} ${Sess.l.en}</b>
      <div class="tiny mut">${Sess.a.ar} · ${typeLabel(Sess.a.type)}</div></div>
    </div>
    <div class="hud">
      <span class="hb">🪙 <b id="sEl">${Sess.score*10}</b></span>
      <span class="hb">✅ <b id="cEl">${progressCount()}</b>/${Sess.total}</span>
      <span class="hb">⏱️ <b id="tEl">${fmtTime(Sess.elapsed)}</b></span>
      <span class="hb">❌ <b id="mEl">${Sess.mistakes}</b></span>
      <button class="btn ghost sm" id="sndBtn">${S.muted?"🔇":"🔊"}</button>
    </div>
  </div>
  <div class="pbar"><i id="pbi" style="width:${progressCount()/Sess.total*100}%"></i></div>`;
}
function viewActivity(){
  const t=Sess.a.type;
  app.innerHTML=`<div class="player fade">${hud()}<div id="qbox" style="margin-top:18px"></div></div>`;
  bindHud();
  if(t==="mcq"||t==="fill")renderChoice();
  else if(t==="match")renderMatch();
  else if(t==="order")renderOrder();
  else if(t==="sort")renderSort();
}
function bindHud(){
  $("#quitBtn").onclick=()=>{sfx("click");stopT();toast("👋 تم حفظ تقدمك — عد للنشاط لاحقًا","info");go("lessons",{unit:Sess.l.unitId});};
  $("#sndBtn").onclick=()=>{S.muted=!S.muted;save();renderNav();$("#sndBtn").textContent=S.muted?"🔇":"🔊";};
}
function updHud(){
  const s=$("#sEl");if(s)s.textContent=Sess.score*10;
  const c=$("#cEl");if(c)c.textContent=progressCount();
  const m=$("#mEl");if(m)m.textContent=Sess.mistakes;
  const p=$("#pbi");if(p)p.style.width=(progressCount()/Sess.total*100)+"%";
}
function stopT(){if(timer){clearInterval(timer);timer=null;}}


function renderChoice(){
  const it=Sess.a.items[Sess.i];
  const opts=shuffle(it.options.map((o,i)=>({o,i})));
  $("#qbox").innerHTML=`
    <div class="card" style="padding:22px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span class="badge c">Question ${Sess.i+1} of ${Sess.total}</span>
        <span class="badge" style="border-color:${SKILLS[Sess.l.skill].c};color:${SKILLS[Sess.l.skill].c}">${SKILLS[Sess.l.skill].ic} ${SKILLS[Sess.l.skill].ar}</span>
      </div>
      <div class="qtext">📌 Choose the correct answer:</div>
      <div class="qen">${it.q}</div>
      <div class="opts" id="opts" style="margin-top:16px">
        ${opts.map((o,k)=>`<button class="opt" data-k="${o.i}">${o.o}</button>`).join("")}
      </div>
      <div id="fb" class="fb hidden"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button class="btn green hidden" id="nextBtn">${Sess.i+1<Sess.total?"Next ←":"🏁 Finish"}</button>
      </div>
    </div>`;
  $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(Sess.answered)return;
    Sess.answered=true;
    const k=+b.dataset.k, ok=k===it.a;
    $("#opts").querySelectorAll(".opt").forEach(x=>{x.disabled=true;
      if(+x.dataset.k===it.a)x.classList.add("ok");
      else if(x===b)x.classList.add("no");
      else x.classList.add("dim");});
    if(ok){Sess.score++;sfx("coin");sfx("correct");
      const r=b.getBoundingClientRect();floatAt(r.left+r.width/2-26,r.top-6,"+10 🪙");
      floatAt(r.left+r.width/2+16,r.top-14,["🍄","⭐","🪙"][Math.floor(Math.random()*3)],"floatEmoji");
      burst(26,6);toast(PRAISE[Math.floor(Math.random()*PRAISE.length)],"ok");
    }else{Sess.mistakes++;sfx("wrong");toast(ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)],"no");}
    const fb=$("#fb");fb.className="fb "+(ok?"ok":"no");
    fb.innerHTML=`<b>${ok?"✅ إجابة صحيحة! "+PRAISE[Math.floor(Math.random()*PRAISE.length)]:"❌ ليست الصحيحة — الصحيحة: "+it.options[it.a]}</b><br>💡 ${it.fb}`;
    updHud();$("#nextBtn").classList.remove("hidden");
  });
  $("#nextBtn").onclick=()=>{
    sfx("click");Sess.answered=false;
    if(Sess.i+1<Sess.total){Sess.i++;renderChoice();}
    else finish();
  };
}


function renderMatch(){
  const items=Sess.a.items;
  const lefts=shuffle(items.map((it,i)=>({...it,i})));
  const rights=shuffle(items.map((it,i)=>({...it,i})));
  $("#qbox").innerHTML=`
  <div class="card">
    <div class="qtext">🧩 Click a word in column A, then click its match in column B.</div>
    <div class="tiny mut" style="margin-bottom:14px;direction:ltr;text-align:left">💡 A first-try match = 10 coins 🪙</div>
    <div class="mcols">
      <div class="grid" id="lc" style="gap:9px">${lefts.map(x=>`<div class="mitem" data-l="${x.i}"><span>${x.e}</span><span class="en">${x.l}</span></div>`).join("")}</div>
      <div class="grid" id="rc" style="gap:9px">${rights.map(x=>`<div class="mitem" data-r="${x.i}"><span class="ar">${x.r}</span></div>`).join("")}</div>
    </div>
    <div id="fb" class="fb hidden" style="margin-top:14px"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px">
      <button class="btn green hidden" id="nextBtn">🏁 Finish</button></div>
  </div>`;
  $("#lc").querySelectorAll(".mitem").forEach(el=>el.onclick=()=>{
    if(el.classList.contains("lock"))return;
    sfx("click");
    $("#lc").querySelectorAll(".mitem").forEach(x=>x.classList.remove("sel"));
    el.classList.add("sel");Sess.sel=+el.dataset.l;
  });
  $("#rc").querySelectorAll(".mitem").forEach(el=>el.onclick=()=>{
    if(el.classList.contains("lock"))return;
    if(Sess.sel===null){sfx("wrong");toast("👈 اختر الكلمة من العمود الأول أولًا","no");return;}
    const li=Sess.sel, ri=+el.dataset.r;
    const le=$("#lc").querySelector(`[data-l="${li}"]`);
    if(li===ri){
      Sess.pairs++;
      if(!Sess.tried["p"+li]){Sess.score++;sfx("coin");const r=el.getBoundingClientRect();floatAt(r.left+r.width/2,r.top,"+10 🪙");burst(22,5);}
      else sfx("star");
      le.classList.add("lock");le.classList.remove("sel");el.classList.add("lock");
      const fb=$("#fb");fb.className="fb ok";fb.innerHTML=`<b>✅ مطابق! ${items[li].l}</b> = ${items[li].r}`;
      Sess.sel=null;updHud();
      if(Sess.pairs===Sess.total){setTimeout(()=>{$("#nextBtn").classList.remove("hidden");sfx("power");burst(80,9);
        const f=$("#fb");f.className="fb ok";f.innerHTML="<b>🎉 أحسنت! أكملت كل الأزواج.</b>";},400);}
    }else{
      Sess.mistakes++;Sess.tried["p"+li]=1;sfx("wrong");
      el.classList.add("bad");setTimeout(()=>el.classList.remove("bad"),460);
      le.classList.add("bad");setTimeout(()=>le.classList.remove("bad"),460);
      const fb=$("#fb");fb.className="fb no";fb.innerHTML=`<b>❌ ليسا متطابقين.</b> 💡 فكّر في المعنى بالعربية ثم أعد المحاولة.`;
      updHud();
    }
  });
  $("#nextBtn").onclick=()=>{sfx("click");finish();};
}


function renderOrder(){
  const items=Sess.a.items;
  const pool=shuffle(items.map((it,i)=>({...it,i})));
  $("#qbox").innerHTML=`
  <div class="card">
    <div class="qtext">🔢 Click the sentences in the correct order.</div>
    <div class="slots" id="slots">${items.map((x,i)=>`<div class="slot" data-i="${i}"><span class="idx">${i+1}</span><span class="mut tiny">…</span></div>`).join("")}</div>
    <div class="tiny mut" style="margin-bottom:8px;direction:ltr;text-align:left">📦 Pick the next correct sentence:</div>
    <div class="pool" id="pool">${pool.map(x=>`<button class="pitem" data-i="${x.i}">${x.t}</button>`).join("")}</div>
    <div id="fb" class="fb hidden" style="margin-top:14px"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px">
      <button class="btn green hidden" id="nextBtn">🏁 Finish</button></div>
  </div>`;
  $("#pool").querySelectorAll(".pitem").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===Sess.orderIdx){
      const slot=document.querySelector(`.slot[data-i="${i}"]`);
      slot.classList.add("filled");slot.innerHTML=`<span class="idx">${i+1}</span><span>${items[i].t}</span>`;
      b.classList.add("used");Sess.orderIdx++;
      if(!Sess.tried["o"+i]){Sess.score++;sfx("coin");const r=slot.getBoundingClientRect();floatAt(r.left+40,r.top,"+10 🪙");burst(20,5);}
      else sfx("star");
      const fb=$("#fb");fb.className="fb ok";fb.innerHTML=`<b>✅ ترتيب صحيح!</b> ${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`;
      updHud();
      if(Sess.orderIdx===Sess.total){setTimeout(()=>{$("#nextBtn").classList.remove("hidden");sfx("power");burst(85,9);
        const f=$("#fb");f.className="fb ok";f.innerHTML="<b>🎉 ممتاز! الترتيب مكتمل وصحيح.</b>";},400);}
    }else{
      Sess.mistakes++;Sess.tried["o"+Sess.orderIdx]=1;sfx("wrong");
      b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),460);
      const fb=$("#fb");fb.className="fb no";fb.innerHTML=`<b>❌ هذه ليست الجملة رقم ${Sess.orderIdx+1}.</b> 💡 ابحث عن كلمات الترتيب: First / Then / After that / Finally أو before / after.`;
      updHud();
    }
  });
  $("#nextBtn").onclick=()=>{sfx("click");finish();};
}


function renderSort(){
  const items=Sess.a.items;
  const pool=shuffle(items.map((it,i)=>({...it,i})));
  $("#qbox").innerHTML=`
  <div class="card">
    <div class="qtext">🔀 Click a word, then click the box it belongs to.</div>
    <div class="pool" id="pool" style="justify-content:center">${pool.map(x=>`<button class="pitem" data-i="${x.i}" style="font-size:18px">${x.t}</button>`).join("")}</div>
    <div class="bins">
      ${Sess.a.cats.map((c,i)=>`<div class="bin" data-b="${i}"><h4>${c}</h4><div class="in" id="in${i}"></div></div>`).join("")}

function gradeOf(p){return p>=95?["ممتاز جدًا 🏆","#1e8f3e"]:p>=85?["ممتاز 🌟","#1e8f3e"]:p>=75?["جيد جدًا 👍","#2196d9"]:p>=60?["جيد 🙂","#f0a500"]:p>=1?["يحتاج دعم 🌱","#e03131"]:["لا توجد بيانات","#54748f"];}
function ring(p,color){
  const c=2*Math.PI*62;
  return `<div class="ring"><svg width="150" height="150">
    <circle cx="75" cy="75" r="62" fill="none" stroke="#dceafb" stroke-width="14"/>
    <circle cx="75" cy="75" r="62" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" style="transition:stroke-dashoffset 1.2s"/>
  </svg><div class="mid"><div><b>${p}%</b><span class="tiny mut">الإتقان</span></div></div></div>`;
}

          <div class="mut small" style="margin:6px 0 12px;line-height:1.8">${S.student.name} · الصف ${S.student.cls} · ${SCHOOL} · العام 2026–2027</div>
          <div class="grid g4" style="gap:10px">
            <div><div class="n" style="font-size:24px;font-weight:800">${st.done}/${st.total}</div><div class="tiny mut">دروس مكتملة</div></div>
            <div><div class="n" style="font-size:24px;font-weight:800">${st.ok}/${st.q}</div><div class="tiny mut">إجابات صحيحة</div></div>
            <div><div class="n" style="font-size:24px;font-weight:800;color:#8a5a00">🪙 ${pts}</div><div class="tiny mut">عملة/نقطة</div></div>
            <div><div class="n" style="font-size:24px;font-weight:800">${fmtTime(st.time)}</div><div class="tiny mut">زمن التعلّم</div></div>
          </div>
          <div style="margin-top:12px"><span class="badge" style="border-color:${g[1]};color:${g[1]};font-size:14px;padding:7px 14px">التقدير: ${g[0]}</span></div>
        </div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <h3 style="font-size:17px;margin-bottom:14px;color:#0b4a74">🧭 الأداء حسب المهارة</h3>
        ${skillBars}
        <div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap">
          ${strong?`<span class="badge g">🏆 الأقوى: ${SKILLS[strong[0]].ar} ${Math.round(strong[1].ok/strong[1].q*100)}%</span>`:""}
          ${weak?`<span class="badge ${weak[1].ok/weak[1].q<.7?"r":"y"}">🌱 تحتاج تدريبًا: ${SKILLS[weak[0]].ar} ${Math.round(weak[1].ok/weak[1].q*100)}%</span>`:""}
        </div>
      </div>
      <div class="card">
        <h3 style="font-size:17px;margin-bottom:14px;color:#0b4a74">🏅 الأوسمة المكتسبة</h3>
        <div class="badges">${bdg}</div>
        <h3 style="font-size:17px;margin:18px 0 12px;color:#0b4a74">🩺 توصيات المعلمة (تلقائية)</h3>
        ${recs().map(r=>`<div class="rec ${r.lv==="g"?"g":r.lv==="r"?"r":""}">${r.t}</div>`).join("")}
      </div>
    </div>
    <div class="secH"><h2>🧾 سجل تفصيلي لكل درس ونشاطيه (${TOTAL_ACTS} نشاطًا)</h2><div class="line"></div></div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>الدرس · Lesson</th><th>المهارة</th><th>النشاط ١</th><th>النشاط ٢</th><th>الزمن</th><th>الحالة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="tiny mut" style="margin-top:10px">🔒 النشاط الثاني لا يُفتح إلا بعد اجتياز النشاط الأول بنسبة 70٪ فأعلى.</div>
    </div>
    <div class="secH" id="dl"><h2>📤 تنزيل التقرير ومشاركته</h2><div class="line"></div></div>
    <div class="grid g3">
      <div class="card">
        <div style="font-size:34px;text-align:center;margin-bottom:8px">📄</div>
        <h3 style="font-size:16px;text-align:center;margin-bottom:8px">تقرير أداء TXT</h3>
        <div class="tiny mut" style="line-height:1.8;text-align:center;margin-bottom:14px">ملف نصي كامل: البيانات، نتائج كل درس ونشاط، تحليل المهارات والتوصيات — جاهز للأرشفة والطباعة.</div>
        <button class="btn amber" style="width:100%" id="dlBtn">⬇️ تنزيل التقرير (TXT)</button>
      </div>
      <div class="card">
        <div style="font-size:34px;text-align:center;margin-bottom:8px">🟢</div>
        <h3 style="font-size:16px;text-align:center;margin-bottom:8px">مشاركة عبر واتساب</h3>
        <div class="tiny mut" style="line-height:1.8;text-align:center;margin-bottom:14px">ملخّص منسّق يُفتح مباشرة في واتساب لإرساله لولي الأمر أو مجموعة المادة.</div>
        <button class="btn wa" style="width:100%" id="waBtn">📤 مشاركة الملخّص</button>
      </div>
      <div class="card">
        <div style="font-size:34px;text-align:center;margin-bottom:8px">📋</div>
        <h3 style="font-size:16px;text-align:center;margin-bottom:8px">نسخ التقرير كاملًا</h3>
        <div class="tiny mut" style="line-height:1.8;text-align:center;margin-bottom:14px">انسخ التقرير النصي الكامل للحافظة للصقه في البريد أو المستندات أو سجل المتابعة.</div>
        <button class="btn ghost" style="width:100%" id="cpBtn">📋 نسخ النص الكامل</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="font-size:16px;margin-bottom:10px;color:#0b4a74">👁️ معاينة التقرير</h3>
      <pre id="prev"></pre>
    </div>
    <div class="card" style="margin-top:16px;border-color:var(--redE);background:#fff5f5">
      <h3 style="font-size:16px;margin-bottom:8px;color:#8c1d1d">⚠️ منطقة الخطر</h3>
      <div class="tiny mut" style="margin-bottom:12px">حذف كل التقدم والعملات والنتائج المحفوظة على هذا الجهاز.</div>
      <button class="btn ghost" id="resetBtn" style="border-color:var(--redE);color:#8c1d1d">🗑️ إعادة تعيين التقدم</button>
    </div>
  </div>${footHTML()}`;
  $("#prev").textContent=buildReport();
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{sfx("click");go(b.dataset.go);});
  $("#editBtn").onclick=()=>{sfx("click");go("home");};
  $("#dlBtn").onclick=dlTxt;
  $("#waBtn").onclick=shareWA;
  $("#cpBtn").onclick=()=>{
    const t=buildReport();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{sfx("star");toast("📋 تم نسخ التقرير الكامل","ok");},()=>fallbackCopy(t));
    else fallbackCopy(t);
  };
  $("#resetBtn").onclick=()=>{
    if(confirm("هل تريد حذف كل التقدم والعملات؟ لا يمكن التراجع.")){
      S.progress={};save();sfx("fail");toast("🗑️ تم إعادة تعيين التقدم","no");go("report");
    }
  };
  if(R.tab==="dl"){setTimeout(()=>$("#dl").scrollIntoView({behavior:"smooth"}),120);}
}
function fallbackCopy(t){
  const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");sfx("star");toast("📋 تم نسخ التقرير الكامل","ok");}catch(e){toast("تعذّر النسخ","no");}
  ta.remove();
}
function dlTxt(){
  if(!stats().q){sfx("wrong");toast("📭 لا توجد نتائج بعد — أكمل نشاطًا واحدًا على الأقل","no");return;}
  const txt=buildReport();
  const name=(S.student.name||"student").replace(/\s+/g,"_");
  const fn="تقرير_أداء_"+name+"_"+new Date().toISOString().slice(0,10)+".txt";
  const blob=new Blob(["\uFEFF"+txt],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},600);
  sfx("win");burst(70,8);toast("⬇️ تم تنزيل التقرير: "+fn,"ok");
}
function shareWA(){
  if(!stats().q){sfx("wrong");toast("📭 لا توجد نتائج بعد — أكمل نشاطًا واحدًا على الأقل","no");return;}
  sfx("unlock");toast("🟢 جارٍ فتح واتساب للمشاركة…","info");
  const url="https://wa.me/?text="+encodeURIComponent(waText());
  setTimeout(()=>window.open(url,"_blank"),350);
}


/* ==================== BOOT ==================== */
if(S.student)R={v:"dash"};
render();
document.addEventListener("click",()=>ctx(),{once:true});
</script>
</body>
</html>
