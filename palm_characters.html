<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meet The Palm Characters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Cormorant Garamond', serif;
    background: url('cover.jpeg') center center / cover no-repeat fixed;
  }
  body::before { content:''; position:fixed; inset:0; background:rgba(255,255,255,0.15); pointer-events:none; }
  .scene { position:relative; z-index:1; width:100%; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:28px 20px 36px; }
  .panel { width:min(1220px,96vw); background:rgba(255,255,255,.22); border-radius:36px; padding:28px 24px 30px; backdrop-filter:blur(5px); box-shadow:0 12px 40px rgba(0,0,0,.08); text-align:center; }
  .sub-label { font-family:'Cinzel',serif; font-size:clamp(.6rem,1.4vw,.75rem); letter-spacing:.3em; color:#000; text-transform:uppercase; margin-bottom:10px; }
  .divider { width:56px; height:1px; background:#000; margin:12px auto 16px; }
  .title { font-family:'Cinzel',serif; font-size:clamp(1.55rem,4vw,2.4rem); font-weight:600; color:#000; line-height:1.3; margin-bottom:8px; }
  .tagline { font-size:clamp(.9rem,1.8vw,1rem); color:#111; font-style:italic; line-height:1.6; margin-bottom:28px; }
  .characters-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:28px; }
  .character-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }

  /* ── Arch ── */
  .char-arch {
    width:100%; height:320px;
    border-radius:160px 160px 28px 28px;
    background: rgba(245,235,215,0.88);
    border: 1.5px solid rgba(255,255,255,0.60);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12),
      inset 0 1px 0 rgba(255,255,255,0.65),
      inset 0 -1px 0 rgba(255,255,255,0.25);
    overflow:hidden; display:flex; align-items:flex-start; justify-content:center;
    padding:0; position:relative;
  }
  .char-arch::before {
    content:""; position:absolute; inset:8px; z-index:1;
    border-radius:152px 152px 22px 22px;
    border:1px solid rgba(255,255,255,0.30); pointer-events:none;
  }
  .char-arch img {
    width:100%; height:100%;
    object-fit:contain;
    object-position:center top;
    display:block;
  }
  .char-arch.no-image::after {
    content:attr(data-name); font-family:'Cinzel',serif;
    color:#888; font-size:.85rem; text-align:center; padding:12px;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  }

  .char-name-label { font-family:'Cinzel',serif; font-size:.82rem; font-weight:600; color:#111; text-align:center; letter-spacing:.04em; }

  /* ── Buttons ── */
  .char-icons { display:flex; gap:10px; align-items:stretch; justify-content:center; }
  .icon-btn {
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    background:rgba(255,255,255,0.30); border:1.5px solid rgba(255,255,255,0.55);
    border-radius:18px; padding:10px 14px; backdrop-filter:blur(5px);
    transition:transform .15s, box-shadow .15s, background .15s;
    box-shadow:0 4px 14px rgba(0,0,0,0.10); min-width:90px; max-width:130px;
  }
  .icon-btn:hover { transform:translateY(-3px) scale(1.06); box-shadow:0 8px 22px rgba(0,0,0,0.16); background:rgba(255,255,255,0.50); }
  .btn-palm-img { width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.22)); display:block; }
  .btn-palm-em  { font-size:28px; line-height:1; display:none; }
  .btn-label { font-family:'Cinzel',serif; font-size:.65rem; font-weight:700; color:#2a1a0e; letter-spacing:.04em; text-align:center; word-break:break-word; line-height:1.3; }

  /* ── Modal ── */
  .modal-overlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.48); backdrop-filter:blur(5px); align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.active { display:flex; }
  .modal-card { background:rgba(255,252,245,0.97); border-radius:28px; padding:32px 28px 26px; max-width:490px; width:100%; max-height:82vh; overflow-y:auto; position:relative; box-shadow:0 28px 70px rgba(0,0,0,0.28); border:1.5px solid rgba(255,255,255,0.75); animation:popIn .25s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from{transform:scale(0.75);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:22px; cursor:pointer; color:#666; line-height:1; transition:color .15s; }
  .modal-close:hover { color:#000; }
  .modal-char-name { font-family:'Cinzel',serif; font-size:1.1rem; font-weight:600; color:#1a1a1a; margin-bottom:14px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px; }
  .lang-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .lang-tab { font-family:'Cinzel',serif; font-size:.72rem; font-weight:700; letter-spacing:.12em; padding:5px 20px; border-radius:999px; border:1.5px solid #bbb; background:transparent; cursor:pointer; color:#666; transition:all .15s; }
  .lang-tab.active { background:#2a1a0e; color:#fff; border-color:#2a1a0e; }
  .modal-desc { font-size:1rem; line-height:1.75; color:#111; font-weight:600; white-space:pre-line; text-align:left; }
  .modal-desc[dir="rtl"] { text-align:right; }

  .back-link { display:inline-block; margin-top:28px; text-decoration:none; color:#000; background:rgba(255,255,255,.7); padding:10px 18px; border-radius:999px; font-family:'Cinzel',serif; font-size:.85rem; transition:transform .15s; }
  .back-link:hover { transform:translateY(-2px); }
  @media(max-width:600px) { .char-arch { height:260px; } }
</style>
</head>
<body>

<div class="modal-overlay" id="descModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-char-name">
      <img src="palmtreeicon.png" width="26" height="26" style="object-fit:contain" onerror="this.outerHTML='<span style=font-size:22px>🌴</span>'">
      <span id="modalName"></span>
    </div>
    <div class="lang-tabs">
      <button class="lang-tab active" id="tabEN" onclick="switchLang('en')">EN</button>
      <button class="lang-tab"        id="tabAR" onclick="switchLang('ar')">عربي</button>
    </div>
    <div class="modal-desc" id="modalDesc"></div>
  </div>
</div>

<div class="scene">
  <div class="panel">
    <p class="sub-label">Meet The Cast</p>
    <div class="divider"></div>
    <h1 class="title">Meet The Palm Characters</h1>
    <p class="tagline">Tap a character's name to discover their story.</p>
    <div class="characters-grid" id="characters-grid"></div>
    <a class="back-link" href="index.html">← Back to Home</a>
  </div>
</div>

<audio id="bg-music" autoplay loop><source src="joyfull.mp3" type="audio/mpeg"></audio>
<audio id="click-sfx" preload="auto"><source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg"></audio>

<script>
let currentChar = null;

const characters = [
  {
    id:'card1', image:'thuraya-classroom.png',
    char1:{ name:'Thuraya',
      en:`Thuraya is the village leader who cannot be stopped.
• Omani English teacher • Story creator
• The one who brought John and Sophia into Al-Qurawashiyah without warning

Super Power: She can silence the whole class with one look 👀
Weakness: A wall crocodile 🐊
Secret: She carries a secret stretching from 1973 to 2027.
Dream: To finish her master's degree in Turkey 🇹🇷
Funny Fact: Even Kalaf speaks politely in front of her.`,
      ar:`ثريا قائدة القرية التي لا يوقفها شيء.
• مؤلفة القصة • مدرّسة اللغة الإنجليزية العُمانية

القوة الخارقة: تسكت الصف بنظرة واحدة 👀
نقطة الضعف: تمساح الجدار 🐊
السر: معها سر يمتد من 1973 إلى 2027.
الحلم: تكمل الماجستير في تركيا 🇹🇷
معلومة مضحكة: حتى الشايب خلف يتكلم بهدوء أمامها.`
    },
    char2:{ name:'Class Room',
      en:`The classroom is the heart of Al-Qurawashiyah.
Where English meets Omani traditions every day.
Where surprises, laughter, and real learning happen together.
This is not just a room — it is a whole world.`,
      ar:`صف القرواشية هو قلب القرية.
حيث تلتقي اللغة الإنجليزية بالتقاليد العُمانية كل يوم.
حيث تجتمع المفاجآت والضحك والتعلم.
هذا ليس مجرد صف — هو عالم كامل.`
    }
  },
  { id:'card2', image:'sophia-john.png',
    char1:{ name:'John',
      en:`John came to teach and learned shock instead.
• English teacher • Started speaking Arabic without permission
• Gets scared, but denies it immediately

Funny Fact: He says I am not afraid, then hides behind Sophia 😄
Weakness: Kalaf, the heat, and Malood.`,
      ar:`جون جاء يعلّم فتعلم الصدمة.
• معلم إنجليزي • بدأ يتكلم عربي بدون إذن

معلومة مضحكة: يقول I am not afraid ثم يختبئ خلف صوفيا 😄
نقطة الضعف: الشايب خلف والحر ومالود.`
    },
    char2:{ name:'Sophia',
      en:`Sophia arrived as Sophia and became Safiya without discussion.
Super Power: Organizing chaos with quiet elegance.
Weakness: Omani heat, the slow fan, and Marhoon's salon.
Funny Fact: Sophia's silence is more dangerous than Mansoor's shouting.`,
      ar:`صوفيا جاءت Sophia وأصبحت Safiya بدون نقاش.
القوة الخارقة: تنظيم الفوضى بهدوء.
نقطة الضعف: حر عمان والمروحة البطيئة وصالون مرهونه.
معلومة مضحكة: صمت صوفيا أخطر من صراخ منصور.`
    }
  },
  { id:'card3', image:'malood-falaj.png',
    char1:{ name:'Malood',
      en:`Malood is the unofficial school manager 🐐
• Walks into class • Eats papers • Watches everyone like he owns the place
Favorite Food: Papers… especially Sophia's ring.
Funny Fact: He is Sadoo's most loyal customer and always in debt.
Secret: He appears exactly when the lesson gets important.`,
      ar:`مالود هو مدير المدرسة غير الرسمي 🐐
• يدخل الصف • يأكل الأوراق • يراقب الجميع
الأكل المفضل: الأوراق وخاصة خاتم صوفيا.
معلومة مضحكة: زبون سادو الدائم وعليه ديون.
سر: يظهر فجأة عندما تكون الحصة مهمة.`
    },
    char2:{ name:'Falaj',
      en:`The Falaj is the lifeline of Al-Qurawashiyah.
It carries water, stories, memories, and endless village drama.
Funny Fact: The falaj works harder than half the village 😄`,
      ar:`الفلج شريان حياة القرواشية.
يحمل الماء والقصص والذكريات.
معلومة مضحكة: الفلج يشتغل أكثر من نصف أهل القرية 😄`
    }
  },
  { id:'card4', image:'kalaf-obaid.png',
    char1:{ name:'Kalaf',
      en:`Kalaf is the mysterious man who knows things nobody explains.
• Few words • Sharp eyes • Strong presence
Funny Fact: He makes everyone feel he knows secrets from another world 👀`,
      ar:`الشايب خلف يعرف أشياء لا يعرفها أحد.
• قليل الكلام • كثير النظر • غامض
معلومة مضحكة: يعطيك إحساس أنه يعرف علوم العالم الآخر 👀`
    },
    char2:{ name:'Obaid',
      en:`Obaid is the wise young man with glasses.
He returned with knowledge and calm.
He knows herbs, listens before speaking, and thinks five steps ahead.
Funny Fact: When Obaid speaks, even the noisy ones listen.`,
      ar:`عبيد الهادئ الحكيم صاحب النظارة.
رجع بعلم ومعرفة ويعرف الأعشاب ويتكلم بعد تفكير.
معلومة مضحكة: إذا بدأ عبيد يتكلم حتى المزعجين يسمعون.`
    }
  },
  { id:'card5', image:'saeed-ali.png',
    char1:{ name:'Saeed',
      en:`Saeed is quiet, observant, and smarter than he first looks.
He watches more than he speaks and surprises everyone with brilliant answers.
Funny Fact: He looks silent, but his brain is louder than the whole class.`,
      ar:`سعيد طفل هادئ يراقب أكثر مما يتكلم.
خجول لكنه يفاجئ الجميع بإجابات ذكية.
معلومة مضحكة: شكله هادئ لكن مخه شغال أكثر من الصف كله.`
    },
    char2:{ name:'Ali',
      en:`Ali is the calm artist who notices tiny details others miss.
He loves drawing and seeing beauty in the small things.
Funny Fact: Even the dust on the board cannot hide from Ali's eyes 🎨`,
      ar:`علي الفنان الهادئ يرى ما لا يراه غيره.
يحب الرسم والتأمل.
معلومة مضحكة: حتى الغبار على السبورة ما يمر من علي 🎨`
    }
  },
  { id:'card6', image:'khamis-marhoon.png',
    char1:{ name:'Marhoon',
      en:`Marhoon is the farmer whose whole life belongs to the land.
He knows water, soil, palms, weather, and seasons.
He believes planting is not a job, it is a mission.
Funny Fact: If Marhoon talks too much, it is still about farming 🌱`,
      ar:`مرهون المزارع الذي كل حياته للأرض.
يعرف الماء والنخيل والتربة والطقس.
ويؤمن أن الزراعة قضية لا وظيفة.
معلومة مضحكة: إذا تكلم كثير فالأغلب لا زال يتكلم عن الزراعة 🌱`
    },
    char2:{ name:'Khamis',
      en:`Khamis is quiet, brilliant, and ahead of everyone.
He understands before the question finishes.
Funny Fact: Mansoor fears one thing only — Khamis understanding faster than him 😄`,
      ar:`خميس هادئ وعبقري ويفهم قبل أن يكتمل السؤال.
يكره الضوضاء ويحب التعلم.
معلومة مضحكة: منصور يخاف من شيء واحد: أن يفهم خميس أسرع منه 😄`
    }
  },
  { id:'card7', image:'khalil-mansoor.png',
    char1:{ name:'Khalil',
      en:`Khalil is the official laughter machine.
He jokes, laughs, escapes homework, and laughs even at bad jokes.
Funny Fact: If no one laughs, Khalil will do it on behalf of the village 😄`,
      ar:`خليل آلة الضحك الرسمية.
يمزح ويضحك ويهرب من الواجب.
معلومة مضحكة: إذا لم يضحك أحد، خليل يضحك نيابة عن أهل القرية 😄`
    },
    char2:{ name:'Mansoor',
      en:`Mansoor is a human storm.
He runs for no reason, talks without pause, and laughs before the joke ends.
Funny Fact: When someone shouts seriously, Mansoor becomes a statue for exactly 3 seconds.`,
      ar:`منصور إعصار بشري.
يركض بلا سبب ويتكلم بلا توقف.
معلومة مضحكة: إذا زعق عليه أحد بجد يتحول لتمثال لثلاث ثوانٍ.`
    }
  },
  { id:'card8', image:'mohamadin-fatakat.png',
    char1:{ name:'Mohamadin',
      en:`Mohamadin is the mathematics mind of the village.
He loves order, precision, and serious focus.
One look is enough to make students sit properly.
Funny Fact: His silence can solve the problem before chalk touches the board.`,
      ar:`محمدين عقل الرياضيات في القرية.
يعشق النظام والدقة والترتيب.
معلومة مضحكة: صمته أحياناً يحل المسألة قبل أن يكتبها على السبورة.`
    },
    char2:{ name:'Fatakat',
      en:`Fatakat is energetic and impossible to ignore.
Her voice can shake the whole village 📣
Funny Fact: Her voice arrives before she does 😄`,
      ar:`فتكات حركية ونشيطة وصوتها يهز القرية 📣
معلومة مضحكة: صوتها يوصل قبلها 😄`
    }
  },
  { id:'card9', image:'mustafa-minnah.png',
    char1:{ name:'Mustafa',
      en:`Mustafa brings a lighter rhythm into the village world.
He belongs to side stories and quiet observations.
Even when his role looks small, he stays in memory.`,
      ar:`مصطفى يضيف إيقاعاً خفيفاً إلى عالم القرية.
هو من الشخصيات التي تكمل الجو العام.
حتى لو بدا دوره بسيطاً يظل عالقاً في الذاكرة.`
    },
    char2:{ name:'Minnah',
      en:`Minnah moves quietly through the village story.
She completes the world without asking for attention.
Small presence, big impact.`,
      ar:`منة تتحرك بهدوء في قصة القرية.
تكمل العالم من حولها بدون أن تطلب الاهتمام.
حضور بسيط، أثر كبير.`
    }
  },
  { id:'card10', image:'sadoo-zahran.png',
    char1:{ name:'Sadoo',
      en:`Sadoo is the unofficial hero of the village.
Tailor, seller, palm worker, cook, fixer, and still available.
Special Skill: Opening five jobs at the same time.
Funny Fact: Nobody knows if Sadoo owns the shop or the shop owns Sadoo.`,
      ar:`سادو البطل غير المعترف به في القرية.
خياط وبياع ويخرف النخيل ويصلح كل شيء.
المهارة: يفتح خمس وظائف في نفس الوقت.
معلومة مضحكة: لا أحد يعرف هل سادو صاحب الدكان أم الدكان ملك سادو.`
    },
    char2:{ name:'Zahran',
      en:`Zahran is simple, confused, and unforgettable in his own way.
His presence adds a unique flavour to village life.`,
      ar:`زهران بسيط ومخرف لكن ذكره يبقى.
حضوره يضيف نكهة خاصة لحياة القرية.`
    }
  },
  { id:'card11', image:'palm-ahmad.png',
    char1:{ name:'Palm Tree',
      en:`The Palm Tree is the queen of the village.
It gives shade, wood, leaves, dates, and half the memories of the place.
Funny Fact: If the village had a royal family, the palm tree would be the queen 🌴`,
      ar:`نخلة الفرض ملكة القرية.
تعطي ظل وخشب وسعف ورطب ونصف ذكريات المكان.
معلومة مضحكة: لو عند القرية عائلة ملكية فالنخلة هي الملكة 🌴`
    },
    char2:{ name:'Ahmad',
      en:`Ahmad is the silent soldier.
Straight, accurate, organized, and respectful.
Funny Fact: Even Ahmad's smile looks disciplined 😄`,
      ar:`أحمد الجندي الصامت.
مستقيم ودقيق ومرتب ومحترم.
معلومة مضحكة: حتى ابتسامة أحمد تطلع مرتبة 😄`
    }
  },
  { id:'card12', image:'dokan-best-products.png',
    char1:{ name:'Dokan',
      en:`Sadoo's dokan is the certified supermarket of the village.
If you need it, it is there. If you do not need it, it is probably there too.
Funny Fact: The more beautiful the session, the faster people end up at the dokan 😄`,
      ar:`دكان سادو السوبرماركت المعتمد للقرية.
ما في شيء ما تحصله.
معلومة مضحكة: كلما زانت الجلسة الناس كلهم ينتهون عند الدكان 😄`
    },
    char2:{ name:'Best Products',
      en:`Favorite Visitor: Malood 🐐
The best products of the village all pass through here.
From dates to tools, from thread to everything imaginable.`,
      ar:`الزائر المفضل: مالود 🐐
أفضل منتجات القرية كلها تمر من هنا.
من التمر إلى الأدوات إلى كل ما يمكن تخيله.`
    }
  },
  { id:'card13', image:'pickup-nasser.png',
    char1:{ name:'Nasser',
      en:`Nasser is the village driver and unofficial navigator.
He knows roads, stories, shortcuts, and how to keep moving.
Favorite Sentence: Ya saiqna… doos doos!
Funny Fact: He drives the pickup even if the road is still under construction 😄`,
      ar:`ناصر سائق القرية والنافيجيتور غير الرسمي.
يعرف الطرق والقصص والاختصارات.
الجملة المفضلة: يا سايقنا دوس دوس.
معلومة مضحكة: يقود البيك أب حتى لو الطريق ما اكتمل بعد 😄`
    },
    char2:{ name:'Pick Up',
      en:`The pickup is not just a vehicle.
It is part taxi, part moving story, part village legend.
Every seat has a story. Every road has a memory.`,
      ar:`البيك أب ليس مجرد سيارة.
هو تاكسي وقصة متحركة وأسطورة من أساطير القرية.
كل مقعد له قصة. كل طريق له ذكرى.`
    }
  },
  { id:'card14', image:'muthla-noura.png',
    char1:{ name:'Noura',
      en:`Noura is full of questions, fast thinking, and restless curiosity.
She raises her hand before the idea finishes.
Funny Fact: Noura's questions arrive faster than most answers 😄`,
      ar:`نورة كثيرة الأسئلة وسريعة التفكير وفضولها لا يهدأ.
ترفع يدها قبل أن تكتمل الفكرة.
معلومة مضحكة: أسئلة نورة تصل أسرع من الإجابات 😄`
    },
    char2:{ name:'Muthla',
      en:`Muthla is calm, kind, shy, and helpful.

/* ── Build Grid ── */
const grid = document.getElementById('characters-grid');
characters.forEach((c) => {
  const combinedName = c.char1.name + ' + ' + c.char2.name;
  const wrap = document.createElement('div');
  wrap.className = 'character-wrap';

  function makeBtn(charKey, charName) {
    const btn = document.createElement('div');
    btn.className = 'icon-btn';
    btn.onclick = () => showChar(c.id, charKey);
    const img = document.createElement('img');
    img.className = 'btn-palm-img';
    img.src = 'palmtreeicon.png';
    img.alt = 'palm';
    const em = document.createElement('span');
    em.className = 'btn-palm-em';
    em.textContent = '🌴';
    img.onerror = function() { this.style.display='none'; em.style.display='block'; };
    const lbl = document.createElement('span');
    lbl.className = 'btn-label';
    lbl.textContent = charName;
    btn.appendChild(img); btn.appendChild(em); btn.appendChild(lbl);
    return btn;
  }

  const arch = document.createElement('div');
  arch.className = 'char-arch';
  arch.dataset.name = combinedName;
  const archImg = document.createElement('img');
  archImg.src = c.image; archImg.alt = combinedName;
  archImg.onerror = function() { this.style.display='none'; arch.classList.add('no-image'); };
  arch.appendChild(archImg);

  const nameLabel = document.createElement('div');
  nameLabel.className = 'char-name-label';
  nameLabel.textContent = combinedName;

  const iconsWrap = document.createElement('div');
  iconsWrap.className = 'char-icons';
  iconsWrap.appendChild(makeBtn('char1', c.char1.name));
  iconsWrap.appendChild(makeBtn('char2', c.char2.name));

  wrap.appendChild(arch);
  wrap.appendChild(nameLabel);
  wrap.appendChild(iconsWrap);
  grid.appendChild(wrap);
});

function playClick() {
  const a = document.getElementById('click-sfx');
  if (!a) return; a.currentTime = 0; a.play().catch(() => {});
}

function showChar(id, charKey) {
  playClick();
  const c = characters.find(x => x.id === id);
  if (!c) return;
  currentChar = c[charKey];
  document.getElementById('modalName').textContent = currentChar.name;
  document.getElementById('tabEN').classList.add('active');
  document.getElementById('tabAR').classList.remove('active');
  const desc = document.getElementById('modalDesc');
  desc.textContent = currentChar.en;
  desc.removeAttribute('dir');
  document.getElementById('descModal').classList.add('active');
}

function switchLang(lang) {
  if (!currentChar) return;
  document.getElementById('tabEN').classList.toggle('active', lang==='en');
  document.getElementById('tabAR').classList.toggle('active', lang==='ar');
  const desc = document.getElementById('modalDesc');
  desc.textContent = lang==='en' ? currentChar.en : currentChar.ar;
  if (lang==='ar') desc.setAttribute('dir','rtl'); else desc.removeAttribute('dir');
}

function closeModal() {
  document.getElementById('descModal').classList.remove('active');
  currentChar = null;
}
document.getElementById('descModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
<script src="sound.js"></script>
