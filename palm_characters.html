<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meet The Palm Characters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Cormorant Garamond', serif;
    background: url('cover.jpeg') center center / cover no-repeat fixed;
  }
  body::before{content:'';position:fixed;inset:0;background:rgba(255,255,255,0.18);pointer-events:none;}
  .scene{position:relative;z-index:1;width:100%;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px 36px;}
  .panel{width:min(1220px,96vw);background:rgba(255,255,255,.28);border-radius:36px;padding:28px 24px 30px;backdrop-filter:blur(5px);box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center;}
  .sub-label{font-family:'Cinzel',serif;font-size:clamp(.6rem,1.4vw,.75rem);letter-spacing:.3em;color:#000;text-transform:uppercase;margin-bottom:10px;}
  .divider{width:56px;height:1px;background:#000;margin:12px auto 16px;}
  .title{font-family:'Cinzel',serif;font-size:clamp(1.55rem,4vw,2.4rem);font-weight:600;color:#000;line-height:1.3;margin-bottom:8px;}
  .tagline{font-size:clamp(.9rem,1.8vw,1rem);color:#111;font-style:italic;line-height:1.6;margin-bottom:28px;}
  .characters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;}
  .character-wrap{display:flex;flex-direction:column;align-items:center;}
  .flip-card{background:transparent;width:100%;height:360px;perspective:1400px;}
  .flip-card-inner{position:relative;width:100%;height:100%;transition:transform .8s ease;transform-style:preserve-3d;}
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;overflow:hidden;box-shadow:none;}
  .flip-front{background:rgba(235,227,215,.82);display:flex;align-items:center;justify-content:center;padding:10px;}
  .flip-front img{width:100%;height:100%;object-fit:contain;display:block;background:transparent;border-radius:24px;}
  .flip-front.no-image{background:rgba(235,227,215,.95);}
  .flip-front.no-image::after{content:attr(data-name);font-family:'Cinzel',serif;color:#333;font-size:1rem;}
  .flip-back{transform:rotateY(180deg);background:rgba(255,255,255,.92);padding:18px 16px;text-align:left;overflow:auto;}
  .char-name{font-family:'Cinzel',serif;font-size:1rem;color:#111;margin-bottom:10px;text-align:center;}
  .desc-block{font-size:.98rem;line-height:1.5;color:#111;font-weight:700;white-space:pre-line;}
  .desc-divider{height:1px;background:#000;opacity:.22;margin:12px 0;}
  .flip-trigger{margin-top:12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:#000;font-family:'Cinzel',serif;font-size:.84rem;}
  .flip-trigger .palm{font-size:1.45rem;filter:grayscale(1) brightness(0);}
  .back-link{display:inline-block;margin-top:28px;text-decoration:none;color:#000;background:rgba(255,255,255,.7);padding:10px 16px;border-radius:999px;font-family:'Cinzel',serif;font-size:.85rem;}
</style>
</head>
<body>
<div class="scene">
  <div class="panel">
    <p class="sub-label">Meet The Cast</p>
    <div class="divider"></div>
    <h1 class="title">Meet The Palm Characters</h1>
    <p class="tagline">Click the palm under each arch to flip it and discover the character behind the story.</p>

    <div class="characters-grid" id="characters-grid"></div>

    <a class="back-link" href="index.html" onclick="playClick()">Back to Home</a>
  </div>
</div>

<audio id="bg-music" autoplay loop>
  <source src="joyfull.mp3" type="audio/mpeg">
</audio>
<audio id="click-sfx" preload="auto">
  <source src="soundreality-whoosh-bamboo-389752.mp3" type="audio/mpeg">
</audio>

<script>
const characters = [
  {
    id:'card1', image:'thuraya-classroom.png', name:'Thuraya + Class Room',
    en:`Thuraya is the village leader who cannot be stopped.
• Omani English teacher
• Story creator
• The one who brought John and Sophia into Al-Qurawashiyah without warning

Super Power
She can silence the whole class with one look 👀

Smile Warning
When Thuraya smiles, even Mansoor double-checks his life choices 😄

Weakness
A wall crocodile 🐊
The only thing that can make her step back.

Secret
She carries a secret stretching from 1973 to 2027.

Dream
To finish her master’s degree in Turkey 🇹🇷

Funny Fact
Even Kalaf speaks politely in front of her.`,
    ar:`ثريا قائدة القرية التي لا يوقفها شيء.
• مؤلفة القصة
• مدرّسة اللغة الإنجليزية العُمانية
• هي التي أدخلت جون وصوفيا عالم القرواشية بدون إنذار مسبق

القوة الخارقة
تسكت الصف بنظرة واحدة 👀

تحذير الابتسامة
حتى منصور يراجع حساباته إذا ابتسمت 😄

نقطة الضعف
تمساح الجدار 🐊

السر
معها سر يمتد من 1973 إلى 2027.

الحلم
تكمل الماجستير في تركيا 🇹🇷

معلومة مضحكة
حتى الشايب خلف يتكلم بهدوء أمامها.`
  },
  {
    id:'card2', image:'sophia-john.png', name:'Sophia + John',
    en:`John is the man who came to teach and learned shock instead.
• English teacher
• Started speaking Arabic without permission
• Gets scared, but denies it immediately

Funny Fact
He says: I am not afraid, then quietly hides behind Sophia 😄

Weakness
Kalaf, the heat, and Malood.

Sophia arrived as Sophia and became Safiya without discussion.

Super Power
Organizing chaos with quiet elegance.

Weakness
Omani heat, the slow fan, and Marhoon’s salon.

Funny Fact
Sophia’s silence is more dangerous than Mansoor’s shouting.`,
    ar:`جون هو الرجل الذي جاء يعلّم فتعلم الصدمة.
• معلم إنجليزي
• بدأ يتكلم عربي بدون إذن
• يخاف لكن ينكر فوراً

معلومة مضحكة
يقول: I am not afraid ثم يختبئ خلف صوفيا 😄

نقطة الضعف
الشايب خلف والحر ومالود.

أما صوفيا فقد جاءت Sophia وأصبحت Safiya بدون نقاش.

القوة الخارقة
تنظيم الفوضى بهدوء.

نقطة الضعف
حر عمان والمروحة البطيئة وصالون مرهونه.

معلومة مضحكة
صمت صوفيا أخطر من صراخ منصور.`
  },
  {
    id:'card3', image:'malood-falaj.png', name:'Malood + Falaj',
    en:`Malood is the unofficial school manager 🐐
• Walks into class
• Eats papers
• Watches everyone like he owns the place

Favorite Food
Papers… especially Sophia’s ring if possible.

Funny Fact
He is Sadoo’s most loyal customer and still always in debt.

Secret
He appears exactly when the lesson gets important.

The Falaj is the lifeline of Al-Qurawashiyah.
It carries water, stories, memories, and endless village drama.

Funny Fact
The falaj works harder than half the village 😄`,
    ar:`مالود هو مدير المدرسة غير الرسمي 🐐
• يدخل الصف
• يأكل الأوراق
• يراقب الجميع وكأنه صاحب المكان

الأكل المفضل
الأوراق وخاصة خاتم صوفيا لو أمكن.

معلومة مضحكة
هو زبون سادو الدائم وعليه ديون من زمان.

سر
يظهر فجأة عندما تكون الحصة مهمة.

الفلج شريان حياة القرواشية، يحمل الماء والقصص والذكريات.

معلومة مضحكة
الفلج يشتغل أكثر من نصف أهل القرية 😄`
  },
  {
    id:'card4', image:'kalaf-obaid.png', name:'Kalaf + Obaid',
    en:`Kalaf is the mysterious man who knows things nobody explains.
• Few words
• Sharp eyes
• Strong presence

Funny Fact
He makes everyone feel he knows secrets from another world 👀

Obaid is the wise young man with glasses.
He returned with knowledge and calm.
He knows herbs, listens before speaking, and thinks five steps ahead.

Funny Fact
When Obaid speaks, even the noisy ones listen.`,
    ar:`الشايب خلف هو الرجل الذي يعرف أشياء لا يعرفها أحد.
• قليل الكلام
• كثير النظر
• غامض

معلومة مضحكة
يعطيك إحساس أنه يعرف علوم العالم الآخر 👀

عبيد هو الهادئ الحكيم صاحب النظارة.
رجع بعلم ومعرفة ويعرف الأعشاب ويتكلم بعد تفكير.

معلومة مضحكة
إذا بدأ عبيد يتكلم حتى المزعجين يسمعون.`
  },
  {
    id:'card5', image:'saeed-ali.png', name:'Saeed + Ali',
    en:`Saeed is quiet, observant, and smarter than he first looks.
He watches more than he speaks and surprises everyone with brilliant answers.

Funny Fact
He looks silent, but his brain is louder than the whole class.

Ali is the calm artist.
He notices tiny details others miss.
He loves drawing and quietly seeing beauty in details.

Funny Fact
Even the dust on the board cannot hide from Ali’s eyes 🎨`,
    ar:`سعيد طفل هادئ يراقب أكثر مما يتكلم.
خجول لكنه يفاجئ الجميع بإجابات ذكية من العدم.

معلومة مضحكة
شكله هادئ لكن مخه شغال أكثر من الصف كله.

علي هو الفنان الهادئ.
يرى الأشياء الصغيرة التي لا يراها غيره.
يحب الرسم والتأمل.

معلومة مضحكة
حتى الغبار على السبورة ما يمر من علي بدون ملاحظة 🎨`
  },
  {
    id:'card6', image:'khamis-marhoon.png', name:'Khamis + Marhoon',
    en:`Marhoon is the farmer whose whole life belongs to the land.
He knows water, soil, palms, weather, and seasons.
He believes planting is not a job, it is a mission.

Funny Fact
If Marhoon talks too much, it is probably still about farming 🌱

Khamis is quiet, brilliant, and ahead of everyone.
He understands before the question finishes.
He dislikes noise, loves learning, and thinks beyond the frame.

Funny Fact
Mansoor fears one thing only: Khamis understanding faster than him 😄`,
    ar:`مرهون هو المزارع الذي كل حياته للأرض.
يعرف الماء والنخيل والتربة والطقس.
ويؤمن أن الزراعة ليست وظيفة بل قضية.

معلومة مضحكة
إذا تكلم مرهون كثير فالأغلب أنه ما زال يتكلم عن الزراعة 🌱

خميس هادئ وعبقري ويفهم قبل أن يكتمل السؤال.
يكره الضوضاء ويحب التعلم ويفكر خارج الإطار.

معلومة مضحكة
منصور يخاف من شيء واحد: أن يفهم خميس أسرع منه 😄`
  },
  {
    id:'card7', image:'khalil-mansoor.png', name:'Khalil + Mansoor',
    en:`Khalil is the official laughter machine.
He jokes, laughs, escapes homework, and laughs even at bad jokes.

Funny Fact
If no one laughs, Khalil will do it on behalf of the village 😄

Mansoor is a human storm.
He runs for no reason, talks without pause, and laughs before the joke ends.

Funny Fact
When someone shouts seriously, Mansoor becomes a statue for exactly three seconds.`,
    ar:`خليل هو آلة الضحك الرسمية.
يمزح ويضحك ويهرب من الواجب ويضحك حتى على النكتة البايخة.

معلومة مضحكة
إذا لم يضحك أحد، خليل يضحك نيابة عن أهل القرية 😄

أما منصور فهو إعصار بشري.
يركض بلا سبب ويتكلم بلا توقف.

معلومة مضحكة
إذا أحد زعق عليه بجد يتحول لتمثال لثلاث ثوانٍ.`
  },
  {
    id:'card8', image:'mohamadin-fatakat.png', name:'Mohamadin + Fatakat',
    en:`Mohamadin is the mathematics mind of the village.
He loves order, precision, and serious focus.
One look is enough to make students sit properly.

Funny Fact
His silence can solve the problem before chalk touches the board.

Fatakat is energetic and impossible to ignore.
Her voice can shake the whole village 📣

Funny Fact
Her voice arrives before she does 😄`,
    ar:`محمدين هو عقل الرياضيات في القرية.
يعشق النظام والدقة والترتيب.
نظرة واحدة منه تكفي ليجلس الطلاب في أماكنهم.

معلومة مضحكة
أحياناً صمته يحل المسألة قبل أن يكتبها على السبورة.

فتكات مصرية حركية ونشيطة وصوتها يهز القرية 📣

معلومة مضحكة
صوتها يوصل قبلها 😄`
  },
  {
    id:'card9', image:'mustafa-minnah.png', name:'Mustafa + Minnah',
    en:`Mustafa and Minnah bring a lighter rhythm into the village world.
They belong to side stories and quiet observations.
Even when their role looks small, they stay in memory.`,
    ar:`مصطفى ومنة يضيفان إيقاعاً خفيفاً إلى عالم القرية.
هما من الشخصيات التي تكمل الجو العام.
حتى لو بدا دورهم بسيطاً يظلون عالقين في الذاكرة.`
  },
  {
    id:'card10', image:'sadoo-zahran.png', name:'Sadoo + Zahran',
    en:`Sadoo is the unofficial hero of the village.
Tailor, seller, palm worker, cook, fixer, and still available.

Special Skill
Opening five jobs at the same time.

Favorite Sentence
Sadoo knows everything!

Funny Fact
Nobody knows whether Sadoo owns the shop or the shop owns Sadoo.

Zahran is simple, confused, and unforgettable in his own way.`,
    ar:`سادو هو البطل غير المعترف به في القرية.
خياط وبياع ويخرف النخيل ويصلح كل شيء.

المهارة الخاصة
يفتح خمس وظائف في نفس الوقت.

الجملة المفضلة
سادو يعرف كل شي.

معلومة مضحكة
لا أحد يعرف هل سادو صاحب الدكان أم الدكان ملك سادو.

زهران بسيط ومخرف ودوره بسيط لكن ذكره يبقى.`
  },
  {
    id:'card11', image:'palm-ahmad.png', name:'Palm Tree + Ahmad',
    en:`The Palm Tree is the queen of the village.
It gives shade, wood, leaves, dates, and half the memories of the place.

Funny Fact
If the village had a royal family, the palm tree would be the queen 🌴

Ahmad is the silent soldier.
Straight, accurate, organized, and respectful.

Funny Fact
Even Ahmad’s smile looks disciplined 😄`,
    ar:`نخلة الفرض هي ملكة القرية.
تعطي ظل وخشب وسعف ورطب ونصف ذكريات المكان.

معلومة مضحكة
لو عند القرية عائلة ملكية فالنخلة هي الملكة 🌴

أحمد هو الجندي الصامت.
مستقيم ودقيق ومرتب ومحترم.

معلومة مضحكة
حتى ابتسامة أحمد تطلع مرتبة 😄`
  },
  {
    id:'card12', image:'dokan-best-products.png', name:'Dokan + Best Products',
    en:`Sadoo’s dokan is the certified supermarket of the village.
If you need it, it is there.
If you do not need it, it is probably there too.

Funny Fact
The more beautiful the sitting session becomes, the faster people end up at the dokan 😄

Favorite Visitor
Malood 🐐`,
    ar:`دكان سادو هو السوبرماركت المعتمد للقرية.
ما في شيء ما تحصله.
وإذا ما تحتاج شيء ستروح له أيضاً.

معلومة مضحكة
كلما زانت الجلسة فجأة الناس كلهم ينتهون عند الدكان 😄

الزائر المفضل
مالود 🐐`
  },
  {
    id:'card13', image:'pickup-nasser.png', name:'Pick up + Nasser',
    en:`Nasser is the village driver and unofficial navigator.
He knows roads, stories, shortcuts, and how to keep moving.

Favorite Sentence
Ya saiqna… doos doos!

Funny Fact
He drives the pickup even if the road is still under construction 😄

The pickup is not just a vehicle.
It is part taxi, part moving story, part village legend.`,
    ar:`ناصر هو سائق القرية والنافيجيتور غير الرسمي.
يعرف الطرق والقصص والاختصارات.

الجملة المفضلة
يا سايقنا دوس دوس.

معلومة مضحكة
يقود البيك أب حتى لو الطريق ما اكتمل بعد 😄

البيك أب ليس مجرد سيارة.
هو تاكسي وقصة متحركة وأسطورة من أساطير القرية.`
  },
  {
    id:'card14', image:'muthla-noura.png', name:'Muthla + Noura',
    en:`Noura is full of questions, fast thinking, and restless curiosity.
She raises her hand before the idea finishes.

Funny Fact
Noura’s questions arrive faster than most answers 😄

Muthla is calm, kind, shy, and helpful.
She listens well and keeps everything neat around her.

Funny Fact
If peace became a student, it would probably look like Muthla.`,
    ar:`نورة كثيرة الأسئلة وسريعة التفكير وفضولها لا يهدأ.
ترفع يدها قبل أن تكتمل الفكرة.

معلومة مضحكة
أسئلة نورة تصل أسرع من الإجابات 😄

مثلة هادئة ولطيفة وخجولة وتساعد الآخرين بهدوء.

معلومة مضحكة
لو صار السلام طالبة فالأغلب أنه سيكون مثلة.`
  }
];

const grid = document.getElementById('characters-grid');
characters.forEach((c) => {
  const item = document.createElement('div');
  item.className = 'character-wrap';
  item.innerHTML = `
    <div class="flip-card" id="${c.id}">
      <div class="flip-card-inner">
        <div class="flip-face flip-front" data-name="${c.name}"><img src="${c.image}" alt="${c.name}" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.onerror=null;}else{this.style.display='none'; this.parentElement.classList.add('no-image');}" data-fallback='cover.jpeg'></div>
        <div class="flip-face flip-back">
          <div class="char-name">${c.name}</div>
          <div class="desc-block">${c.en}</div>
          <div class="desc-divider"></div>
          <div class="desc-block">${c.ar}</div>
        </div>
      </div>
    </div>
    <div class="flip-trigger" onclick="toggleCard('${c.id}')"><span class="palm">🌴</span><span>Click Here</span></div>
  `;
  grid.appendChild(item);
});

function playClick() {
  const clickAudio = document.getElementById('click-sfx');
  if (!clickAudio) return;
  clickAudio.currentTime = 0;
  clickAudio.play().catch(() => {});
}

function toggleCard(id){
  playClick();
  document.getElementById(id).classList.toggle('flipped');
}
</script>
<script src="sound.js"></script>
</body>
</html>
