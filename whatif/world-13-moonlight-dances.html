<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Moonlight Dances — مشهد تفاعلي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.6/arabic-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/great-vibes@latest/latin-400.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ background:#0a1a24; font-family:'Cairo',sans-serif; }
  #stage{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #scene{ height:100vh; max-width:100vw; display:block; box-shadow:0 0 90px rgba(0,0,0,.8); }

  header{ position:fixed; top:14px; right:14px; z-index:6; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  header h1{ font-size:15px; font-weight:700; color:#f2e3c8; background:rgba(10,26,36,.85); border:2px solid #f2e3c8; border-radius:30px; padding:6px 16px; }
  header button{ font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:#f2e3c8; background:rgba(10,26,36,.85); border:2px solid #f2e3c8; border-radius:30px; padding:6px 14px; cursor:pointer; transition:transform .2s, background .3s; }
  header button:hover{ transform:translateY(-3px); background:#17374a; }
  header button:active{ transform:scale(.94); }

  #hint{ position:fixed; bottom:12px; right:50%; transform:translateX(50%); z-index:6; background:rgba(242,227,200,.92); color:#17374a; font-size:12.5px; padding:8px 20px; border-radius:30px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #tip{ position:fixed; z-index:9; pointer-events:none; background:#f2e3c8; color:#17374a; font-size:13px; font-weight:700; padding:4px 14px; border-radius:20px; opacity:0; transition:opacity .2s; transform:translate(-50%,-150%); }

  .layer{ will-change:transform; }
  .spark{ animation:tw 2.6s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.15; } to{ opacity:1; } }
  #moonG{ cursor:pointer; transform-box:fill-box; transform-origin:center; }

  .tower{ transform-box:fill-box; transition:transform .6s cubic-bezier(.2,.8,.2,1), filter .4s; cursor:pointer; }
  .tower:hover{ transform:translateY(-7px); filter:brightness(1.1); }

  .win{ cursor:pointer; }
  .win .main{ transition:fill .3s; }
  .win .halo{ fill:#ffb35c; opacity:0; transition:opacity .4s; pointer-events:none; }
  .win.lit .main{ fill:#f2a04a !important; }
  .win.lit .halo{ opacity:.55; }

  .dancerIn{ transform-box:fill-box; transform-origin:50% 60%; }
  .dancer{ transform-box:fill-box; transform-origin:50% 62%; animation:dance 4s ease-in-out infinite alternate; cursor:pointer; }
  @keyframes dance{ 0%{ transform:rotate(-2.4deg) translateY(0); } 50%{ transform:rotate(0deg) translateY(-7px); } 100%{ transform:rotate(2.4deg) translateY(0); } }
  .tree{ transform-box:fill-box; transform-origin:50% 100%; animation:sway 9s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(-.8deg); } to{ transform:rotate(.8deg); } }
  .refl{ animation:shim 4s ease-in-out infinite alternate; }
  @keyframes shim{ from{ opacity:.15; } to{ opacity:.6; } }
  .scriptT{ font-family:'Great Vibes','Cairo',cursive; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid meet" aria-label="لوحة رقصة ضوء القمر التفاعلية">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#17475a"/>
        <stop offset=".5" stop-color="#2a6a7a"/>
        <stop offset="1" stop-color="#7ab8c4"/>
      </linearGradient>
      <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6ab0c8"/>
        <stop offset="1" stop-color="#2a5a78"/>
      </linearGradient>
      <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#f4d9b8" stop-opacity=".9"/>
        <stop offset="1" stop-color="#f4d9b8" stop-opacity="0"/>
      </radialGradient>
      <filter id="blurG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .4  0 0 0 0 .4  0 0 0 0 .4  0 0 0 0.06 0"/></filter>
      <clipPath id="danceClip"><rect x="232" y="572" width="56" height="91" rx="26"/></clipPath>
    </defs>

    <rect x="0" y="0" width="1000" height="1250" fill="url(#skyG)"></rect>
    <g id="starsG"></g>
    <g id="moonG">
      <circle cx="470" cy="150" r="200" fill="url(#moonGlow)"></circle>
      <circle cx="470" cy="150" r="140" fill="#f4d9b8" filter="url(#glowF)"></circle>
      <circle cx="430" cy="120" r="18" fill="#e8c9a0" opacity=".5"></circle>
      <circle cx="510" cy="190" r="13" fill="#e8c9a0" opacity=".5"></circle>
    </g>
    <text class="scriptT" x="790" y="90" text-anchor="middle" font-size="58" fill="#f2e3c8">Where Moonlight</text>
    <text class="scriptT" x="790" y="170" text-anchor="middle" font-size="58" fill="#f2e3c8">Dances,</text>
    <text class="scriptT" x="790" y="250" text-anchor="middle" font-size="58" fill="#f2e3c8">Hearts Awaken</text>

    <g id="layerMid" class="layer" data-depth="8"></g>
    <g id="layerWater" class="layer" data-depth="11"></g>
    <g id="layerFront" class="layer" data-depth="15"></g>
    <rect x="0" y="0" width="1000" height="1250" filter="url(#paper)" opacity=".6" pointer-events="none"></rect>
    <g id="fxG" pointer-events="none"></g>
  </svg>

  <header>
    <h1>🌙 رقصة ضوء القمر</h1>
    <button id="danceBtn">💃 رقصة</button>
    <button id="sparkBtn">✨ بريق</button>
    <button id="lightBtn">💡 إضاءة الكل</button>
    <button id="resetBtn">🔄 إعادة</button>
  </header>
  <div id="hint">مرّر المؤشر لتحريك الطبقات • انقر نافذة الراقصة • انقر النوافذ • انقر الماء • انقر السماء لنثر النجوم</div>
  <div id="tip"></div>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg', INK='#101418';
  var seed=101;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function rr(a,b){ return a+rnd()*(b-a); }
  function el(t,a,p){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); if(p) p.appendChild(n); return n; }

  var svg=document.getElementById('scene');
  var starsG=document.getElementById('starsG');
  var layerMid=document.getElementById('layerMid'), layerWater=document.getElementById('layerWater'), layerFront=document.getElementById('layerFront');
  var fxG=document.getElementById('fxG'), tip=document.getElementById('tip');

  for(var s=0;s<90;s++){
    el('circle',{cx:rr(4,996).toFixed(1),cy:rr(4,520).toFixed(1),r:rr(.8,2.2).toFixed(1),fill:'#f2e3c8','class':'spark',style:'animation-delay:'+rr(0,3).toFixed(1)+'s',opacity:rr(.3,.9).toFixed(2)},starsG);
  }

  function spiralD(cx,cy,rmax,turns){
    var d='M '+cx+' '+cy, tot=turns*Math.PI*2;
    for(var a=0;a<=tot;a+=0.2){ var r=rmax*a/tot; d+=' L '+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1); }
    return d;
  }
  function qpt(t,x0,y0,cx,cy,x1,y1){ var a=(1-t)*(1-t), b=2*(1-t)*t, c=t*t; return [a*x0+b*cx+c*x1, a*y0+b*cy+c*y1]; }

  /* ---------- البيوت ---------- */
  function tower(parent,name){ var g=el('g',{'class':'tower'},parent); if(name) g.dataset.name=name; return g; }
  function addWin(g,x,y,w,h,type,fill,lit,grid){
    var grp=el('g',{'class':'win'},g), cx=x+w/2;
    el('circle',{cx:cx,cy:y+h/2,r:Math.max(w,h)*1.05,'class':'halo',filter:'url(#blurG)'},grp);
    var main;
    if(type==='arch'){ main=el('path',{d:'M '+x+' '+(y+h)+' L '+x+' '+(y+h*0.45)+' Q '+x+' '+y+' '+cx+' '+y+' Q '+(x+w)+' '+y+' '+(x+w)+' '+(y+h*0.45)+' L '+(x+w)+' '+(y+h)+' Z','class':'main'},grp); }
    else { main=el('rect',{x:x,y:y,width:w,height:h,'class':'main'},grp); }
    main.setAttribute('fill',fill); main.setAttribute('stroke',INK); main.setAttribute('stroke-width',2.5);
    if(grid){
      el('line',{x1:cx,y1:y+3,x2:cx,y2:y+h-3,stroke:INK,'stroke-width':1.6},grp);
      el('line',{x1:x+3,y1:y+h/2,x2:x+w-3,y2:y+h/2,stroke:INK,'stroke-width':1.6},grp);
    }
    if(lit) grp.classList.add('lit');
    grp.addEventListener('click',function(ev){ ev.stopPropagation(); grp.classList.toggle('lit'); });
    return grp;
  }

  var h1=tower(layerMid,'البيت الرمادي');
  el('rect',{x:0,y:380,width:140,height:430,fill:'#7a9aa8',stroke:INK,'stroke-width':3},h1);
  el('polygon',{points:'-6,386 146,386 120,300 0,300',fill:'#2a3a44',stroke:INK,'stroke-width':3},h1);
  el('rect',{x:85,y:210,width:55,height:170,fill:'#3a4a54',stroke:INK,'stroke-width':3},h1);
  addWin(h1,30,420,60,90,'arch','#f2a04a',true);

  var h2=tower(layerMid,'البيت البرتقالي');
  el('rect',{x:90,y:490,width:230,height:420,fill:'#d97a2a',stroke:INK,'stroke-width':3},h2);
  el('polygon',{points:'84,496 326,496 205,310',fill:'#c96a20',stroke:INK,'stroke-width':3},h2);
  addWin(h2,180,400,60,90,'arch','#f2a04a',true,true);
  addWin(h2,130,540,55,85,'arch','#f2a04a',true,true);
  var danceWin=addWin(h2,230,570,60,95,'arch','#f2a04a',true);

  var h3=tower(layerMid,'البيت الأزرق الصغير');
  el('rect',{x:20,y:640,width:190,height:270,fill:'#6a9ab0',stroke:INK,'stroke-width':3},h3);
  el('polygon',{points:'14,646 216,646 170,580 40,580',fill:'#2a3a44',stroke:INK,'stroke-width':3},h3);
  addWin(h3,40,720,50,60,'rect','#d98a9a',false,true);
  addWin(h3,115,700,55,90,'arch','#f2a04a',true);

  var h4=tower(layerMid,'بيت النهر الأزرق');
  el('rect',{x:640,y:520,width:180,height:390,fill:'#7ab0c4',stroke:INK,'stroke-width':3},h4);
  el('polygon',{points:'634,526 826,526 780,450 660,450',fill:'#2a3a44',stroke:INK,'stroke-width':3},h4);
  el('rect',{x:780,y:440,width:45,height:120,fill:'#3a4a54',stroke:INK,'stroke-width':3},h4);
  addWin(h4,665,610,45,80,'rect','#f2e3c8',true,true);
  addWin(h4,750,595,50,80,'arch','#f2a04a',true,true);

  var h5=tower(layerMid,'البيت البرتقالي الكبير');
  el('rect',{x:830,y:470,width:170,height:440,fill:'#d97a2a',stroke:INK,'stroke-width':3},h5);
  el('polygon',{points:'824,476 1006,476 915,340',fill:'#c96a20',stroke:INK,'stroke-width':3},h5);
  addWin(h5,870,430,55,85,'arch','#f2a04a',true,true);
  addWin(h5,850,555,50,80,'arch','#f2a04a',true,true);
  addWin(h5,855,700,40,50,'rect','#8a5a2a',false,true);

  var h6=tower(layerMid,'البيت الفيروزي');
  el('rect',{x:890,y:620,width:110,height:290,fill:'#4a9a8a',stroke:INK,'stroke-width':3},h6);
  el('polygon',{points:'884,626 1006,626 990,560 900,560',fill:'#2a3a44',stroke:INK,'stroke-width':3},h6);
  addWin(h6,920,670,30,60,'arch','#7ac49a',false);
  addWin(h6,965,750,35,60,'rect','#f2a04a',true);

  /* أشجار */
  function bare(parent,x,baseY,h){
    var g=el('g',{'class':'tree'},parent);
    el('path',{d:'M '+x+' '+baseY+' C '+(x+14)+' '+(baseY-h*0.4)+' '+(x-8)+' '+(baseY-h*0.7)+' '+(x+6)+' '+(baseY-h),fill:'none',stroke:INK,'stroke-width':16,'stroke-linecap':'round'},g);
    [[.5,1,.5],[.62,-1,.45],[.74,1,.4],[.84,-1,.35],[.92,1,.3]].forEach(function(b){
      el('path',{d:'M '+(x+6*(1-b[0]))+' '+(baseY-h*b[0])+' Q '+(x+b[1]*h*0.25)+' '+(baseY-h*b[0]-h*0.1)+' '+(x+b[1]*h*b[2])+' '+(baseY-h*b[0]-h*0.22),fill:'none',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},g);
      el('path',{d:'M '+(x+b[1]*h*0.18)+' '+(baseY-h*b[0]-h*0.07)+' Q '+(x+b[1]*h*0.32)+' '+(baseY-h*b[0]-h*0.02)+' '+(x+b[1]*h*0.45)+' '+(baseY-h*b[0]-h*0.12),fill:'none',stroke:INK,'stroke-width':2.5,'stroke-linecap':'round'},g);
    });
    return g;
  }
  bare(layerMid,20,920,640);
  bare(layerMid,980,930,660);

  /* ---------- الماء ---------- */
  el('path',{d:'M 0 1250 L 0 960 Q 120 990 200 1060 Q 260 1130 240 1250 Z',fill:'#1a2a4a'},layerWater);
  el('path',{d:'M 1000 1250 L 1000 950 Q 880 985 800 1060 Q 740 1130 760 1250 Z',fill:'#1a2a4a'},layerWater);
  el('path',{d:'M 200 1250 C 240 1050 300 950 420 900 C 480 880 560 880 620 900 C 740 950 780 1080 800 1250 Z',fill:'url(#waterG)'},layerWater);
  for(var wI=0;wI<22;wI++){
    var wy=rr(920,1240), wx=rr(280,700);
    el('path',{d:'M '+wx.toFixed(0)+' '+wy.toFixed(0)+' q 10 6 0 14 q -10 8 0 16',fill:'none',stroke:(wI%3===0?'#f2c9a0':(wI%3===1?'#a8d4e4':'#e8e2d0')),'stroke-width':rr(2,4).toFixed(1),'class':'refl',style:'animation-delay:'+rr(0,4).toFixed(1)+'s'},layerWater);
  }
  var waterHit=el('path',{d:'M 200 1250 C 240 1050 300 950 420 900 C 480 880 560 880 620 900 C 740 950 780 1080 800 1250 Z',fill:'transparent',cursor:'pointer'},layerWater);
  waterHit.addEventListener('click',function(ev){
    ev.stopPropagation();
    var m=svg.getScreenCTM().inverse(), p=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(m);
    for(var k=0;k<3;k++){
      var c=el('ellipse',{cx:p.x,cy:p.y,rx:4,ry:1.5,fill:'none',stroke:'#a8d4e4','stroke-width':2},fxG);
      c.animate([{transform:'scale(1)',opacity:.8},{transform:'scale('+(8+k*5)+')',opacity:0}],{duration:1400+k*350,easing:'ease-out'}).onfinish=(function(c2){ return function(){ c2.remove(); }; })(c);
    }
  });

  /* ---------- الجسر المزخرف ---------- */
  var bridge=tower(layerFront,'الجسر المزخرف');
  el('path',{d:'M 40 900 Q 500 680 960 900 L 960 934 Q 500 714 40 934 Z',fill:'#2a2018',stroke:INK,'stroke-width':2},bridge);
  el('path',{d:'M 60 862 Q 500 640 940 862',fill:'none',stroke:INK,'stroke-width':6},bridge);
  el('path',{d:'M 120 1060 Q 500 790 880 1060',fill:'none',stroke:INK,'stroke-width':16},bridge);
  el('path',{d:'M 140 1080 Q 500 812 860 1080',fill:'none',stroke:INK,'stroke-width':5},bridge);
  for(var t=0.04;t<0.97;t+=0.04){
    var pt=qpt(t,60,862,500,640,940,862), pd=qpt(t,40,900,500,680,960,900);
    el('line',{x1:pt[0].toFixed(1),y1:pt[1].toFixed(1),x2:pd[0].toFixed(1),y2:pd[1].toFixed(1),stroke:INK,'stroke-width':3},bridge);
  }
  for(var t2=0.06;t2<0.95;t2+=0.08){
    var pm=qpt(t2,60,862,500,640,940,862), pm2=qpt(t2,40,900,500,680,960,900);
    var mx=(pm[0]+pm2[0])/2, my=(pm[1]+pm2[1])/2;
    el('path',{d:spiralD(mx,my,9,2.5),fill:'none',stroke:INK,'stroke-width':2},bridge);
  }
  for(var t3=0.1;t3<0.92;t3+=0.1){
    var pa=qpt(t3,120,1060,500,790,880,1060);
    el('circle',{cx:pa[0].toFixed(1),cy:pa[1].toFixed(1),r:15,fill:'none',stroke:INK,'stroke-width':3},bridge);
    el('path',{d:spiralD(pa[0],pa[1],10,2.5),fill:'none',stroke:INK,'stroke-width':2},bridge);
  }
  [0.25,0.5,0.75].forEach(function(t4){
    var ph=qpt(t4,60,862,500,640,940,862);
    el('path',{d:'M '+ph[0]+' '+(ph[1]-4)+' C '+ph[0]+' '+(ph[1]-9)+' '+(ph[0]-7)+' '+(ph[1]-11)+' '+(ph[0]-7)+' '+(ph[1]-6)+' C '+(ph[0]-7)+' '+(ph[1]-3)+' '+(ph[0]-2)+' '+(ph[1]-1)+' '+ph[0]+' '+(ph[1]+3)+' C '+(ph[0]+2)+' '+(ph[1]-1)+' '+(ph[0]+7)+' '+(ph[1]-3)+' '+(ph[0]+7)+' '+(ph[1]-6)+' C '+(ph[0]+7)+' '+(ph[1]-11)+' '+ph[0]+' '+(ph[1]-9)+' '+ph[0]+' '+(ph[1]-4)+' Z',fill:INK},bridge);
  });

  /* ---------- الراقصة ---------- */
  var danceHolder=el('g',{'clip-path':'url(#danceClip)'},danceWin);
  var danceFit=el('g',{transform:'translate(137.5,480) scale(0.25)'},danceHolder);
  var dancer=el('g',{'class':'dancer'},danceFit);
  dancer.dataset.name='راقصة ضوء القمر';
  var dIn=el('g',{'class':'dancerIn'},dancer);
  el('circle',{cx:500,cy:405,r:20,fill:INK},dIn);
  el('circle',{cx:516,cy:392,r:8,fill:INK},dIn);
  el('path',{d:'M 486 396 q -10 -2 -14 4 M 488 404 q -12 2 -14 8',fill:'none',stroke:INK,'stroke-width':2.5},dIn);
  el('path',{d:'M 500 424 C 497 445 497 460 500 478',fill:'none',stroke:INK,'stroke-width':7,'stroke-linecap':'round'},dIn);
  el('path',{d:'M 497 440 C 470 452 442 462 415 470',fill:'none',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},dIn);
  el('path',{d:'M 503 440 C 530 455 556 468 580 472',fill:'none',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},dIn);
  el('path',{d:'M 500 470 C 482 500 472 520 466 545 C 430 570 380 586 328 586 C 350 612 402 626 452 631 C 474 642 522 646 562 633 C 602 620 612 600 597 585 C 570 560 540 520 506 470 Z',fill:'#141a2e',stroke:INK,'stroke-width':2},dIn);
  el('path',{d:'M 340 590 q 14 10 30 8 M 560 630 q 16 -4 24 -14',fill:'none',stroke:INK,'stroke-width':2},dIn);
  for(var dS=0;dS<14;dS++) el('circle',{cx:rr(360,590).toFixed(0),cy:rr(560,630).toFixed(0),r:rr(1,2).toFixed(1),fill:'#f2e3c8','class':'spark',style:'animation-delay:'+rr(0,2).toFixed(1)+'s'},dIn);
  el('path',{d:'M 495 632 L 488 700',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},dIn);
  el('path',{d:'M 505 632 Q 522 660 508 686',fill:'none',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},dIn);
  function spinDancer(){
    dIn.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:1400,easing:'ease-in-out'});
    for(var i=0;i<16;i++){
      var c=el('circle',{cx:260+rr(-16,16),cy:614+rr(-30,30),r:rr(1.2,2.2),fill:'#f2e3c8'},fxG);
      var a=rnd()*Math.PI*2, d=rr(40,110);
      c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px)',opacity:0}],{duration:rr(900,1500),easing:'ease-out'}).onfinish=(function(c2){ return function(){ c2.remove(); }; })(c);
    }
  }
  danceWin.addEventListener('click',function(){ if(danceWin.classList.contains('lit')) spinDancer(); });

  /* ---------- تفاعل عام ---------- */
  svg.addEventListener('click',function(e){
    if(e.target.tagName==='rect'&&e.target.getAttribute('fill')==='url(#skyG)'){
      var m=svg.getScreenCTM().inverse(), p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);
      for(var i=0;i<6;i++){
        var c=el('circle',{cx:p.x,cy:p.y,r:rr(1,2.5),fill:'#f2e3c8','class':'spark'},fxG);
        var a=rnd()*Math.PI*2, d=rr(15,60);
        c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px)',opacity:0}],{duration:rr(800,1400),easing:'ease-out'}).onfinish=(function(c2){ return function(){ c2.remove(); }; })(c);
      }
    }
  });
  document.getElementById('moonG').addEventListener('click',function(ev){
    ev.stopPropagation();
    var mg=document.getElementById('moonG');
    mg.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:900,easing:'ease-in-out'});
  });

  document.querySelectorAll('.tower').forEach(function(g){
    if(!g.dataset.name) return;
    g.addEventListener('pointerenter',function(){ tip.textContent=g.dataset.name; tip.style.opacity=1; });
    g.addEventListener('pointermove',function(e){ tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-8)+'px'; });
    g.addEventListener('pointerleave',function(){ tip.style.opacity=0; });
  });

  var tx=0,ty=0,cx2=0,cy2=0;
  window.addEventListener('pointermove',function(e){ tx=(e.clientX/window.innerWidth)*2-1; ty=(e.clientY/window.innerHeight)*2-1; });
  (function loop(){
    cx2+=(tx-cx2)*0.06; cy2+=(ty-cy2)*0.06;
    [layerMid,layerWater,layerFront].forEach(function(L){
      var d=parseFloat(L.dataset.depth);
      L.style.transform='translate('+(cx2*d)+'px,'+(cy2*d*0.4)+'px)';
    });
    requestAnimationFrame(loop);
  })();

  document.getElementById('danceBtn').addEventListener('click',spinDancer);
  document.getElementById('sparkBtn').addEventListener('click',function(){
    for(var i=0;i<26;i++){
      var c=el('circle',{cx:rr(100,900),cy:rr(80,700),r:rr(1,2.6),fill:'#f2e3c8'},fxG);
      c.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:rr(1200,2200),delay:rr(0,800)}).onfinish=(function(c2){ return function(){ c2.remove(); }; })(c);
    }
  });
  document.getElementById('lightBtn').addEventListener('click',function(){
    var wins=Array.prototype.slice.call(document.querySelectorAll('.win'));
    var allLit=wins.every(function(w){ return w.classList.contains('lit'); });
    wins.forEach(function(w){ w.classList.toggle('lit',!allLit); });
  });
  document.getElementById('resetBtn').addEventListener('click',function(){ location.reload(); });
})();
</script>
</body>
</html>
