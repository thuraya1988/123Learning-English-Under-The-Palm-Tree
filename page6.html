<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Page 6 - Lets Palm</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * {{ margin: 0; padding: 0; box-sizing: border-box; }}
  html, body {{ width: 100%; height: 100%; overflow: hidden; background: #FDF3DD; }}

  .page-container {{
    position: relative;
    width: 100vw; height: 100vh;
    background: #FDF3DD;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 18px);
  }}

  /* المسامير */
  .corner-btn {{
    position: absolute;
    border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 400; transition: transform 0.2s;
    width: clamp(28px, 3.5vw, 42px); height: clamp(28px, 3.5vw, 42px);
    font-size: clamp(1rem, 2vw, 1.5rem); margin: clamp(8px, 1.5vw, 18px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.3);
    z-index: 10;
  }}
  .corner-btn:hover  {{ transform: scale(1.1); }}
  .corner-btn:active {{ transform: scale(0.93); }}
  .top-left     {{ top: 0; left: 0;     background: radial-gradient(circle at 35% 35%, #f07030, #E8611A); }}
  .top-right    {{ top: 0; right: 0;    background: radial-gradient(circle at 35% 35%, #dde8f5, #CBD8E8); color: #5a7a9a; }}
  .bottom-left  {{ bottom: 0; left: 0;  background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }}
  .bottom-right {{ bottom: 0; right: 0; background: radial-gradient(circle at 35% 35%, #ddb040, #C9952A); }}

  /* العنوان */
  .page-title {{
    font-family: "Fredoka One", cursive;
    font-size: clamp(1rem, 3vw, 2rem);
    color: #4a9a5a;
    letter-spacing: clamp(1px, 0.5vw, 5px);
    text-shadow: 2px 2px 0px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.12);
    text-transform: uppercase;
    align-self: flex-start;
    padding-left: 4%;
  }}

  /* المنطقة الرئيسية */
  .main-area {{
    display: flex;
    align-items: stretch;
    gap: clamp(8px, 2vw, 18px);
    width: 92%;
    max-width: 1100px;
    /* مساحة للصور الطالعة فوق */
    padding-top: clamp(50px, 10vw, 100px);
    height: clamp(280px, 62vh, 560px);
  }}

  /* المستطيل الأيسر */
  .rect-box {{
    background: #ec9973;
    border-radius: clamp(14px, 2vw, 22px);
    box-shadow:
      0 12px 32px rgba(0,0,0,0.3),
      0 4px 10px rgba(0,0,0,0.18),
      inset 0 3px 8px rgba(255,255,255,0.35),
      inset 0 -3px 8px rgba(0,0,0,0.2);
    width: clamp(110px, 19vw, 210px);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: clamp(8px, 1.5vw, 16px);
    position: relative;
    overflow: visible;
  }}

  .rect-char {{
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    object-fit: contain;
    margin-bottom: clamp(-40px, -8vw, -70px);
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    pointer-events: none;
  }}

  .rect-btn {{
    width: 75%;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
    z-index: 2;
  }}
  .rect-btn:hover {{ transform: scale(1.06); }}

  /* شبكة البوكسات */
  .grid-area {{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(6px, 1.5vw, 14px);
    flex: 1;
    overflow: visible;
  }}

  /* wrapper لكل بوكس مربع */
  .sq-wrapper {{
    position: relative;
    display: flex;
    justify-content: center;
    overflow: visible;
  }}

  .sq-box {{
    border-radius: clamp(12px, 1.8vw, 20px);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.22),
      0 3px 8px rgba(0,0,0,0.14),
      inset 0 3px 6px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: clamp(6px, 1.2vw, 12px);
    cursor: pointer;
    transition: transform 0.25s;
    width: 100%;
    position: relative;
    overflow: visible;
  }}
  .sq-box:hover {{ transform: scale(1.04); }}

  /* الصورة تطلع من فوق البوكس */
  .sq-img {{
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(60px, 14vw, 130px);
    object-fit: contain;
    margin-bottom: clamp(-25px, -5vw, -45px);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    pointer-events: none;
  }}

  .sq-btn {{
    width: 70%;
    object-fit: contain;
    position: relative;
    z-index: 2;
  }}

  /* Rise up للبوكسات */
  .sq-box {
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease !important;
  }
  .sq-box:hover {
    transform: translateY(-10px) scale(1.03) !important;
    box-shadow:
      0 20px 40px rgba(0,0,0,0.28),
      0 8px 16px rgba(0,0,0,0.18),
      inset 0 3px 6px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.18) !important;
  }

  /* تأثير الأزرار */
  .sq-btn, .rect-btn, .box-btn {
    transition: transform 0.2s ease, filter 0.2s ease !important;
    cursor: pointer;
  }
  .sq-btn:hover, .rect-btn:hover, .box-btn:hover {
    transform: scale(1.15) !important;
    filter: drop-shadow(0 0 8px rgba(255,255,200,0.9)) drop-shadow(0 0 16px rgba(255,220,80,0.7)) brightness(1.15) !important;
  }
  .sq-btn:active, .rect-btn:active, .box-btn:active {
    transform: scale(0.95) !important;
  }

</style>
<script src="public/js/palm-globe-fab.js" defer></script>
</head>
<body>
<div class="page-container">

  <button class="corner-btn top-left">+</button>
  <button class="corner-btn top-right">+</button>
  <button class="corner-btn bottom-left">+</button>
  <button class="corner-btn bottom-right">+</button>

  <div class="page-title">Let's Palm</div>

  <div class="main-area">

    <!-- المستطيل الأيسر -->
    <div class="rect-box">
      <video class="rect-char" src="Talking.mp4" autoplay muted loop playsinline style="border-radius:12px;object-fit:cover;"></video>
      <img class="rect-btn" src="storyB.png" alt="Story">
    </div>

    <!-- الشبكة 3x2 -->
    <div class="grid-area">

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#ffc2c2;">
          <img class="sq-img" src="3dsocks.png" alt="">
          <img class="sq-btn" src="oddB.png" onclick="window.location.href='oddpalm.html'" alt="">
        </div>
      </div>

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#caaacd;">
          <img class="sq-img" src="3dboxbox.png" alt="">
          <img class="sq-btn" src="wordB.png" onclick="window.location.href='wordhuntpalm.html'" alt="">
        </div>
      </div>

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#c2f6ff;">
          <img class="sq-img" src="3dblocks.png" alt="">
          <img class="sq-btn" src="scraB.png" onclick="window.location.href='scramblepalm.html'" alt="">
        </div>
      </div>

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#aacdb5;">
          <img class="sq-img" src="3dpho.png" alt="">
          <img class="sq-btn" src="driB.png" onclick="window.location.href='crosspalm.html'" alt="">
        </div>
      </div>

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#cccccc;">
          <img class="sq-img" src="3dcolor.png" alt="">
          <img class="sq-btn" src="PicB.png" onclick="window.location.href='memorypalm.html'" alt="">
        </div>
      </div>

      <div class="sq-wrapper">
        <div class="sq-box" style="background:#eee984;">
          <img class="sq-img" src="3dca.png" alt="">
          <img class="sq-btn" src="kahootB.png" onclick="window.location.href='khootpalm.html'" alt="">
        </div>
      </div>

    </div>
  </div>
</div>
<script>
  // صوت النقر
  function playClick() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(800, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.08);
    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    oscillator.start(ctx.currentTime);
    oscillator.stop(ctx.currentTime + 0.08);
  }

  document.querySelectorAll('.sq-btn, .rect-btn, .box-btn').forEach(btn => {
    btn.addEventListener('click', playClick);
  });
</script>
</body>
</html>
