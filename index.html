<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Let's Learn English Under The Palm Tree</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>

<style>

,::before,::after{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
font-family:'Cormorant Garamond',serif;
}

/ الخلفية المعدلة /

.scene{
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
rgba(255,255,255,.35),
rgba(255,255,255,.35)
),
url('cover.jpeg');

background-position:center;
background-size:cover;
background-repeat:no-repeat;
}

/ المحتوى /

.content{
text-align:center;
opacity:0;
animation:fadeIn 1.2s .4s ease forwards;
}

@keyframes fadeIn{
to{opacity:1;}
}

/ العنوان /

.sub-label{
font-family:'Cinzel',serif;
letter-spacing:.3em;
margin-bottom:10px;
}

.divider{
width:50px;
height:1px;
background:#000;
margin:12px auto;
}

.title{
font-family:'Cinzel',serif;
font-size:2.3rem;
animation:fadeDown 1s ease;
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.year-tag{
margin-top:6px;
}

.tagline{
margin-top:10px;
margin-bottom:25px;
}

/ النخيل /

.palm-icons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px 28px;
margin-top:15px;
}

/ زر النخلة /

.palm-btn{
position:relative;
font-size:3rem;
filter:grayscale(1) brightness(0);
cursor:pointer;
transition:.3s;
text-decoration:none;
display:block;
}

/ تكبير /

.palm-btn:hover{
transform:scale(1.18);
}

/ لمعة /

.palm-btn::after{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border-radius:50%;
background:rgba(255,255,255,.3);
opacity:0;
transition:.3s;
}

.palm-btn:hover::after{
opacity:1;
}

/ نص نصف الدائرة */

.label{
position:absolute;
left:-22px;
top:28px;
background:white;
padding:5px 10px;
border-radius:30px;
font-size:10px;
font-weight:600;
box-shadow:0 5px 18px rgba(0,0,0,.15);
white-space:nowrap;
}

</style>

</head>

<body>

<div class="scene">

<div class="content">

<p class="sub-label">An Educational Journey</p>
<div class="divider"></div>

<h1 class="title">
Let's Learn English<br/>
Under The Palm Tree
</h1>

<p class="year-tag">From 1973 to 2027</p>

<p class="tagline">
Stories that might happen<br/>
in Thuraya's deep mind
</p>

<div class="palm-icons">

<a class="palm-btn" href="THEPALM1973.html" onclick="playSound()">
🌴
<span class="label">The Palm Stories</span>
</a>

<a class="palm-btn" href="characters.html" onclick="playSound()">
🌴
<span class="label">Characters</span>
</a>

<a class="palm-btn" href="challenges.html" onclick="playSound()">
🌴
<span class="label">Challenges</span>
</a>

<a class="palm-btn" href="tour.html" onclick="playSound()">
🌴
<span class="label">The Palm Tour</span>
</a>

<a class="palm-btn" href="#" onclick="playSound()">
🌴
<span class="label">Coming Soon</span>
</a>

<a class="palm-btn" href="#" onclick="playSound()">
🌴
<span class="label">Coming Soon</span>
</a>

</div>

</div>

</div>

<script>

function playSound(){
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.setValueAtTime(523,ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+.4);

gain.gain.setValueAtTime(.4,ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);

osc.start();
osc.stop(ctx.currentTime+.5);
}

</script>

</body>
</html>
