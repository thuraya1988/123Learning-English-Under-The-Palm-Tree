name: بناء صوت مس ثريا

# اضغطي Run workflow في تبويب Actions فيجري كلّ شيءٍ وحده:
# يُنزّل صوت Piper من HuggingFace، ويُولّد مقاطع الكلمات والجمل، ويرفعها
# إلى المستودع. لا يحتاج منك تنزيلاً ولا رفعاً ولا مفتاحاً — خادم GitHub
# يملك إنترنتاً مفتوحاً ويستعمل مفتاح المستودع نفسه.

on:
  workflow_dispatch:
    inputs:
      voice_en:
        description: "الصوت الإنجليزيّ"
        required: true
        default: en_GB-cori-medium
        type: choice
        options:
          - en_GB-cori-medium              # امرأة بريطانيّة — المقترَح
          - en_GB-southern_english_female-low
          - en_GB-jenny_dioco-medium
          - en_GB-alba-medium
          - en_US-amy-medium
          - en_US-hfc_female-medium
          - en_GB-alan-medium              # رجل
      voice_ar:
        description: "الصوت العربيّ (Piper ليس فيه صوت امرأة عربيّ)"
        required: true
        default: ar_JO-kareem-medium
        type: choice
        options:
          - ar_JO-kareem-medium
          - ar_JO-kareem-low
          - none                            # بلا عربيّ
      pitch_ar:
        description: "رفع طبقة الصوت العربيّ بأنصاف النغمات (٠ = كما هو، ٣ = أخفّ)"
        required: false
        default: "0"
      force:
        description: "إعادة توليد كلّ المقاطع من جديد"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت الأدوات
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --quiet piper-tts

      - name: تنزيل الأصوات من HuggingFace
        env:
          VOICE_EN: ${{ inputs.voice_en }}
          VOICE_AR: ${{ inputs.voice_ar }}
        run: |
          set -euo pipefail
          mkdir -p voice
          # المسار في مستودع rhasspy مبنيٌّ من اسم الصوت:
          # en_GB-cori-medium -> en/en_GB/cori/medium
          fetch () {
            local V="$1"
            [ -z "$V" ] || [ "$V" = "none" ] && return 0
            local lang="${V%%-*}" rest="${V#*-}"
            local name="${rest%-*}" qual="${rest##*-}" fam="${lang%%_*}"
            local base="https://huggingface.co/rhasspy/piper-voices/resolve/main/$fam/$lang/$name/$qual/$V"
            echo "downloading $V"
            curl -fL --retry 3 --retry-delay 3 "$base.onnx"      -o "voice/$V.onnx"
            curl -fL --retry 3 --retry-delay 3 "$base.onnx.json" -o "voice/$V.onnx.json"
          }
          fetch "$VOICE_EN"
          fetch "$VOICE_AR"
          ls -lh voice

      - name: استخراج كلّ سطرٍ تنطقه مس ثريا
        run: node scripts/extract-lines.js

      - name: توليد المقاطع
        env:
          VOICE_EN: ${{ inputs.voice_en }}
          VOICE_AR: ${{ inputs.voice_ar }}
          PITCH_AR: ${{ inputs.pitch_ar }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=()
          [ -n "$VOICE_EN" ] && [ "$VOICE_EN" != "none" ] && args+=(--voice-en "voice/$VOICE_EN")
          [ -n "$VOICE_AR" ] && [ "$VOICE_AR" != "none" ] && args+=(--voice-ar "voice/$VOICE_AR")
          args+=(--pitch-ar "${PITCH_AR:-0}")
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 scripts/build-voice.py "${args[@]}"

      - name: رفع النتيجة إلى المستودع
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # التوليد يأخذ دقائق، وقد يُدفَع إلى main شيءٌ في أثنائها فيُرفض
          # الدفع وتضيع كلُّ المقاطع — وهذا ما حدث في التشغيلة الثانية.
          # فنُبقي المقاطع جانباً، ونتحرّك إلى آخر main، ثمّ نُعيدها ونُعيد
          # المحاولة. المقاطع مُولَّدةٌ فهي الأحدث، ولا معنى لدمجها مع أقدم.
          tmp="$(mktemp -d)"
          cp -a public/tts-audio/. "$tmp/"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public/tts-audio
            rm -f public/tts-audio/*.mp3 public/tts-audio/manifest.json
            cp -a "$tmp/." public/tts-audio/
            git add -A public/tts-audio
            if git diff --cached --quiet; then
              echo "لا جديد — المقاطع كما هي."
              exit 0
            fi
            git commit -m "صوت مس ثريا: توليد المقاطع — ${{ inputs.voice_en }} و ${{ inputs.voice_ar }}"
            if git push origin HEAD:main; then
              echo "رُفعت في المحاولة $attempt."
              exit 0
            fi
            echo "دُفع شيءٌ إلى main في أثناء البناء — أُعيد المحاولة ($attempt)."
            sleep 5
          done
          echo "::error::تعذّر الرفع بعد خمس محاولات."
          exit 1

      - name: الخلاصة
        run: |
          {
            echo "### 🔊 صوت مس ثريا"
            echo ""
            echo "- الإنجليزيّ: \`${{ inputs.voice_en }}\`"
            echo "- العربيّ: \`${{ inputs.voice_ar }}\` (رفع ${{ inputs.pitch_ar }})"
            echo "- عدد المقاطع: $(ls public/tts-audio/*.mp3 2>/dev/null | wc -l)"
            echo "- الحجم: $(du -sh public/tts-audio 2>/dev/null | cut -f1)"
            echo ""
            echo "افتحي مس ثريا بعد دقيقةٍ وستجدين أزرار 🔊 تعمل."
          } >> "$GITHUB_STEP_SUMMARY"
