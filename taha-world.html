<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عالم طه · TAHA’S WORLD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.8/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.0.8/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.14/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.14/700.css">
<style>
:root{
  --cream:#fff8ee; --peach:#ffd9c2; --mint:#cdeee1; --sky:#cfe8ff; --lilac:#e7ddff;
  --rose:#ffd1e0; --sun:#ffe8a3; --ink:#544e63; --ink2:#8a8299; --card:#ffffffee;
  --ok:#9ad8b0; --shadow:0 10px 30px rgba(90,70,120,.14);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);
  font-family:'Nunito','Cairo',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none}
[dir="rtl"] body{font-family:'Cairo','Nunito',system-ui,sans-serif}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;background:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #7fb4ff;outline-offset:3px;border-radius:14px}
canvas{display:block}
#scene-container{position:fixed;inset:0}
#scene-container canvas{touch-action:none}

/* ---------- generic UI ---------- */
.icon-btn{width:60px;height:60px;border-radius:20px;font-size:27px;line-height:1;
  background:var(--card);box-shadow:var(--shadow);border:2px solid #ffffffaa;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s ease, box-shadow .18s ease}
.icon-btn:hover{transform:translateY(-2px) scale(1.04)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.big{width:68px;height:68px;font-size:31px}
.big-btn{min-width:96px;min-height:64px;padding:10px 20px;border-radius:22px;font-size:19px;font-weight:800;
  background:var(--card);box-shadow:var(--shadow);border:2px solid #ffffffaa;
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;justify-content:center;
  transition:transform .18s ease}
.big-btn:hover{transform:translateY(-2px)}
.big-btn:active{transform:scale(.95)}
.big-btn .bi{font-size:26px;line-height:1}
.big-btn.calm{background:linear-gradient(160deg,#e6f6ff,#e0fff4)}
.big-btn.primary{background:linear-gradient(160deg,#ffe6a8,#ffc9ab);font-size:22px;padding:16px 34px}
.chip{background:var(--card);border:2px solid #ffffffaa;border-radius:999px;
  padding:10px 20px;font-weight:800;font-size:17px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px}

/* ---------- layout ---------- */
#topbar{position:fixed;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;gap:10px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar .grow{flex:1}
#left-rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:30}
#cam-rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:30}
#bottombar{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;
  align-items:flex-end;padding:0 16px;z-index:30;pointer-events:none}
#bottombar>*{pointer-events:auto}
#btn-calm{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
#btn-calm:hover{transform:translateX(-50%) translateY(-2px)}
body.text-off .lbl{display:none}
body.text-simple .lbl-sub{display:none}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:12px;z-index:28;
  background:var(--card);padding:12px 14px;border-radius:28px;box-shadow:var(--shadow);
  border:2px solid #ffffffaa;flex-wrap:wrap;justify-content:center;max-width:94vw}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:18px;
  font-weight:800;font-size:13px;transition:transform .18s, background .3s;min-width:76px}
.dock-btn .de{font-size:33px;line-height:1}
.dock-btn:hover{transform:translateY(-3px);background:#ffffffaa}
.dock-btn:active{transform:scale(.94)}

/* ---------- zone panel ---------- */
#zone-panel{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:29;
  width:min(720px,94vw);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);
  border:2px solid #ffffffaa;padding:16px 18px;backdrop-filter:blur(10px);
  animation:rise .4s cubic-bezier(.2,.9,.3,1.2);max-height:46vh;overflow:auto}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(26px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.zp-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.zp-head .ze{font-size:30px}
.zp-head h3{margin:0;font-size:20px;flex:1}
.zp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.zp-hint{font-size:14px;color:var(--ink2);font-weight:700;margin:4px 0}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px;padding:10px 12px;
  border-radius:18px;background:#ffffffb0;border:2px solid #00000008;font-weight:800;font-size:13px;
  transition:transform .15s, background .3s, box-shadow .3s}
.tool-btn .te{font-size:29px;line-height:1}
.tool-btn:hover{transform:translateY(-2px)}
.tool-btn:active{transform:scale(.94)}
.tool-btn.on{background:linear-gradient(160deg,#d8f6e6,#cfeaff);box-shadow:inset 0 0 0 3px #8fd6b4}
.seg{display:flex;background:#ffffffb0;border-radius:16px;padding:4px;gap:4px;border:2px solid #00000008}
.seg button{padding:8px 14px;border-radius:12px;font-weight:800;font-size:15px;min-width:52px;transition:background .25s}
.seg button.on{background:linear-gradient(160deg,#ffe6a8,#ffc9ab);box-shadow:0 3px 8px rgba(0,0,0,.08)}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:#eadff5;outline:none;min-width:120px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(160deg,#ffd97a,#ffab7a);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#ffcf8a;border:3px solid #fff;cursor:pointer}
.pat-chip{font-size:36px;padding:4px 6px;border-radius:14px;background:#ffffffb0}
.pat-q{background:#ffe8a3;animation:softPulse 2.2s ease-in-out infinite}
@keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.shake{animation:gentleShake .5s ease}
@keyframes gentleShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.swatch{width:44px;height:44px;border-radius:14px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12);transition:transform .15s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{outline:4px solid #8fd6b4}

/* ---------- modals ---------- */
#modal-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.modal-back{position:absolute;inset:0;background:rgba(120,100,140,.28);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--cream);border-radius:30px;box-shadow:0 24px 60px rgba(60,40,90,.25);
  width:min(560px,96vw);max-height:88vh;overflow:auto;padding:24px;border:3px solid #ffffffcc;
  animation:popIn .35s cubic-bezier(.2,.9,.3,1.2)}
.modal-card.wide{width:min(760px,96vw)}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head h2{margin:0;font-size:23px;flex:1}
.x-btn{width:48px;height:48px;border-radius:16px;font-size:20px;background:#ffffffb0;font-weight:800}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:18px;background:#ffffff90;margin-bottom:8px;flex-wrap:wrap}
.set-row .si{font-size:25px;width:34px;text-align:center}
.set-row .sl{font-weight:800;font-size:16px;flex:1;min-width:140px}
.toggle{width:64px;height:36px;border-radius:999px;background:#e4dcef;position:relative;transition:background .3s}
.toggle::after{content:'';position:absolute;top:3px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .25s}
.toggle.on{background:linear-gradient(160deg,#9ad8b0,#7fd0c8)}
.toggle.on::after{left:30px}
.feel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.feel-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:22px;
  background:#ffffffb0;font-weight:800;font-size:15px;border:2px solid #00000006;transition:transform .15s,background .3s}
.feel-btn .fe{font-size:44px;line-height:1}
.feel-btn:hover{transform:translateY(-3px);background:#fff}
.feel-btn:active{transform:scale(.94)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip-btn{padding:12px 18px;border-radius:999px;background:#ffffffb0;font-weight:800;font-size:17px;
  border:2px solid #00000006;display:flex;align-items:center;gap:8px;transition:transform .15s,background .3s}
.chip-btn .ce{font-size:24px}
.chip-btn:hover{transform:translateY(-2px)}
.chip-btn.on{background:linear-gradient(160deg,#ffe6a8,#ffc9ab);box-shadow:inset 0 0 0 3px #ffc26b}
.sentence-view{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:#fff;border-radius:22px;padding:20px;margin:14px 0;font-size:30px;font-weight:800;min-height:86px}
.prefs-card{text-align:center}
.prefs-q{font-size:24px;font-weight:800;margin:10px 0 22px}
.prefs-opts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.pref-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 30px;border-radius:26px;
  background:#fff;font-weight:800;font-size:18px;min-width:150px;border:3px solid #ffe0b8;
  transition:transform .18s, box-shadow .3s}
.pref-opt .pe{font-size:56px;line-height:1}
.pref-opt:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(255,170,90,.25)}
.pref-opt:active{transform:scale(.95)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.dot{width:10px;height:10px;border-radius:50%;background:#e0d6ee}
.dot.on{background:#ffb27a}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:55;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);border:2px solid #ffffffaa;border-radius:999px;padding:12px 24px;font-weight:800;
  font-size:17px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;
  animation:toastIn .45s cubic-bezier(.2,.9,.3,1.3)}
.toast.out{animation:toastOut .5s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.94)}}

/* ---------- calm UI ---------- */
#calm-ui{position:fixed;inset:0;z-index:40;pointer-events:none}
#calm-back{position:absolute;top:14px;left:14px;pointer-events:auto}
#breath-wrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:26px;pointer-events:auto}
#breath{width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffffffdd,#bfe6ff88 55%,#bfe6ff22 75%);
  box-shadow:0 0 60px #bfe6ff88;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
#breath-hide{background:#ffffffb0;border-radius:999px;padding:8px 18px;font-weight:800}

/* ---------- title card / fade ---------- */
#title-card{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fff3e0,#ffe3ec 45%,#e3ecff);transition:opacity .8s ease}
#title-card.gone{opacity:0;pointer-events:none}
.title-inner{text-align:center;animation:popIn .8s cubic-bezier(.2,.9,.3,1.2)}
.title-emoji{font-size:84px;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#title-card h1{font-size:clamp(30px,6vw,54px);margin:8px 0 4px;letter-spacing:2px}
#title-card .tag{color:var(--ink2);font-weight:700;font-size:clamp(15px,2.5vw,20px);margin-bottom:30px}
#fade{position:fixed;inset:0;background:#fff8ee;z-index:70;pointer-events:none;opacity:0;transition:opacity .6s ease}

#tint{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:opacity 1.2s ease}


#title-card .tsub{font-family:'Nunito',sans-serif;letter-spacing:6px;font-size:clamp(12px,2vw,16px);
  color:var(--ink2);font-weight:800;margin-bottom:10px}
#dedication{max-width:min(660px,92vw);margin:0 auto 26px;background:#ffffffb0;border:2px solid #ffffffcc;
  border-radius:24px;padding:18px 22px;box-shadow:0 10px 30px rgba(90,70,120,.12);
  font-size:clamp(13px,2.2vw,16px);line-height:2.05;font-weight:700;color:#6b6480;
  font-family:'Cairo','Nunito',sans-serif;direction:rtl}
#dedication .from{display:block;color:#a89ec0;font-size:.86em;margin-bottom:8px;letter-spacing:1px}
#dedication .who{color:#d98a6a}
#btn-ded{margin-top:6px;font-weight:800;color:var(--ink2);padding:8px 16px;font-size:14px}
#how-to{list-style:none;margin:18px auto 6px;padding:0;max-width:340px;text-align:start;
  display:flex;flex-direction:column;gap:9px}
#how-to li{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;line-height:1.5;opacity:.92}
#how-to .ht-i{flex:0 0 auto;font-size:1.05rem;line-height:1.4}
@media (max-width:640px){
  #how-to{max-width:300px;font-size:.9rem}

  .big-btn{min-width:76px;min-height:58px;padding:8px 12px;font-size:15px}
  .icon-btn{width:52px;height:52px;font-size:23px;border-radius:16px}
  .icon-btn.big{width:58px;height:58px;font-size:26px}
  #dock{bottom:90px;gap:6px;padding:8px}
  .dock-btn{min-width:60px;font-size:11px;padding:6px 8px}
  .dock-btn .de{font-size:27px}
  #zone-panel{bottom:86px;padding:12px}
  #left-rail{top:auto;bottom:170px;transform:none}
  #cam-rail{top:80px;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important}
}
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="tint"></div>

<header id="topbar">
  <div id="zone-chip" class="chip" aria-live="polite">🕊️ <span class="lbl" data-i18n="title"></span></div>
  <div class="grow"></div>
  <button id="btn-sound" class="icon-btn" aria-label="Sound on/off">🔊</button>
</header>

<nav id="left-rail" aria-label="Communication">
  <button id="btn-feel" class="icon-btn big" aria-label="Feelings">🙂</button>
  <button id="btn-talk" class="icon-btn big" aria-label="Talk">💬</button>
</nav>

<nav id="cam-rail" aria-label="Camera">
  <button id="btn-zoom-in" class="icon-btn" aria-label="Zoom in">➕</button>
  <button id="btn-zoom-out" class="icon-btn" aria-label="Zoom out">➖</button>
  <button id="btn-camlock" class="icon-btn" aria-pressed="false" aria-label="Lock camera">🔓</button>
</nav>

<footer id="bottombar">
  <button id="btn-home" class="big-btn" aria-label="Home"><span class="bi">🏠</span><span class="lbl lbl-sub" data-i18n="home"></span></button>
  <button id="btn-calm" class="big-btn calm" aria-label="Calm space"><span class="bi">🫧</span><span class="lbl lbl-sub" data-i18n="calm"></span></button>
  <button id="btn-settings" class="big-btn" aria-label="Settings"><span class="bi">⚙️</span><span class="lbl lbl-sub" data-i18n="settings"></span></button>
</footer>

<nav id="dock" hidden aria-label="Worlds"></nav>
<section id="zone-panel" hidden></section>

<div id="calm-ui" hidden>
  <button id="calm-back" class="big-btn"><span class="bi">⬅️</span><span class="lbl" data-i18n="back"></span></button>
  <div id="breath-wrap">
    <div id="breath"></div>
    <button id="breath-hide">🙈 <span class="lbl" data-i18n="hide"></span></button>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="fade"></div>

<div id="title-card">
  <div class="title-inner">
    <div class="title-emoji">🕊️</div>
    <h1>عالم طه</h1>
    <div class="tsub">TAHA’S WORLD</div>
    <p class="tag" data-i18n="tagline"></p>
    <div id="dedication">
      <span class="from">إهداء من تحت النخلة</span>
      إلى <span class="who">الكنز الغالي</span>، والرُّوح الثمينة، والقلب الطاهر،
      والعينَين اللامعتَين — إلى القلب النقيّ، إلى الشجاع الذكيّ:
      <b>طه</b>، وإلى جميع أطفال التوحّد في العالم.
    </div>
    <ul id="how-to">
      <li><span class="ht-i">👆</span> <span data-i18n="how1"></span></li>
      <li><span class="ht-i">🕊️</span> <span data-i18n="how2"></span></li>
      <li><span class="ht-i">🗺️</span> <span data-i18n="how3"></span></li>
      <li><span class="ht-i">🤍</span> <span data-i18n="how4"></span></li>
    </ul>
    <button id="btn-begin" class="big-btn primary">▶️ <span data-i18n="begin"></span></button>
  </div>
</div>

<script type="importmap">

const AudioSys={ctx:null,master:null,sfx:null,musicG:null,muted:S.d.settings.muted,noise:null,

  $('#btn-sound').textContent=m?'🔇':'🔊';},

  const o=this.ctx.createOscillator(),ga=this.ctx.createGain();
  o.type=type;o.frequency.value=f;ga.gain.setValueAtTime(0,t0);
  ga.gain.linearRampToValueAtTime(g,t0+.03);ga.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(ga);ga.connect(this.sfx);o.start(t0);o.stop(t0+dur+.05)},

  let nodes=[g],timer=null;
  if(name==='rain'||name==='water'||name==='wind'){

    if(name==='rain'){f.type='lowpass';f.frequency.value=1400}

    if(name==='wind'){f.type='bandpass';f.frequency.value=420;f.Q.value=.8}
    src.connect(f);f.connect(g);src.start();nodes.push(src,f);}

  if(name==='piano'){let step=0;const scale=[523.25,587.33,659.25,783.99,880];

  setTimeout(()=>{lp.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}})},600);

/* ============================================================
   POINTER INPUT
============================================================ */
let dragObj=null,orbiting=false,pinchDist=0;
const pointers=new Map();
let downX=0,downY=0,downTime=0,movedFar=false;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const p=[...pointers.values()];pinchDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);return}
 downX=e.clientX;downY=e.clientY;downTime=performance.now();movedFar=false;
 const list=activeGroupChildren();
 const hit=raycastAt(e.clientX,e.clientY,[...dragTargets,...tapTargets].filter(m=>m.visible&&list===m.userData._grp||true));
 if(hit&&hit.obj.userData.dragCfg&&camSpeedScale>=0){
  dragObj={mesh:hit.obj,cfg:hit.obj.userData.dragCfg};
  if(hit.obj.userData.targetPos)hit.obj.userData.targetPos=null;
 }else if(hit&&hit.obj.userData.onTap){dragObj={mesh:hit.obj,cfg:null,tapOnly:true}}
 else orbiting=true});
window.addEventListener('pointermove',e=>{
 if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  if(pinchDist){cam.tRadius=clamp(cam.tRadius*(pinchDist/d),cam.minR,cam.maxR)}pinchDist=d;return}
 const dx=e.movementX||0,dy=e.movementY||0;
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>9)movedFar=true;
 if(dragObj&&dragObj.cfg&&movedFar){
  ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-(dragObj.cfg.planeY+(dragObj.cfg.center?dragObj.cfg.center.position.y:0)));
  const pt=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(plane,pt)){
   const c=dragObj.cfg.center?dragObj.cfg.center.position:new THREE.Vector3();
   let nx=pt.x-c.x,nz=pt.z-c.z;
   if(dragObj.cfg.radius){const d=Math.hypot(nx,nz);if(d>dragObj.cfg.radius){nx*=dragObj.cfg.radius/d;nz*=dragObj.cfg.radius/d}}
   if(dragObj.cfg.box){nx=clamp(nx,-dragObj.cfg.box.x,dragObj.cfg.box.x);nz=clamp(nz,-dragObj.cfg.box.z,dragObj.cfg.box.z)}
   dragObj.mesh.position.set(nx+c.x,dragObj.cfg.planeY+c.y+.3,nz+c.z)}}
 else if(orbiting&&movedFar&&!cam.locked){cam.tTheta-=dx*.0045;cam.tPhi=clamp(cam.tPhi-dy*.0035,.35,1.45)}
 else if(!dragObj&&!orbiting&&!movedFar){/* hover */
  const h=raycastAt(e.clientX,e.clientY,tapTargets.filter(m=>m.visible));
  const nm=h?h.obj:null;
  if(nm!==hoverObj){if(hoverObj&&!hoverObj.userData._s)hoverObj.scale.setScalar(1);
   hoverObj=nm;cvs.style.cursor=nm?'pointer':'default';
   if(nm){nm.userData._s=nm.scale.x;nm.scale.setScalar(nm.userData._s*1.06)}}}});
window.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);pinchDist=0;
 const wasTap=!movedFar&&performance.now()-downTime<650;
 if(dragObj){if(dragObj.cfg){dragObj.mesh.position.y=dragObj.cfg.planeY+(dragObj.cfg.center?dragObj.cfg.center.position.y:0);
   if(dragObj.mesh.userData.sortPiece)dragObj.mesh.userData.sortPiece.placed=false;
   saveFurnitureIf(dragObj.mesh)}
  else if(wasTap&&dragObj.mesh.userData.onTap){dragObj.mesh.userData.onTap(null)}}
 else if(orbiting&&wasTap){const h=raycastAt(e.clientX,e.clientY,tapTargets.filter(m=>m.visible));
  if(h&&h.obj.userData.onTap)h.obj.userData.onTap(h)}
 dragObj=null;orbiting=false});
function activeGroupChildren(){return worldG.visible?worldG:bedroomG}
function saveFurnitureIf(mesh){if(!furnitureGroup||!furnitureGroup.children.includes(mesh))return;
 const idx=furnitureGroup.children.indexOf(mesh);
 if(S.d.furniture[idx]){S.d.furniture[idx].x=mesh.position.x;S.d.furniture[idx].z=mesh.position.z;S.save()}}

/* keyboard */
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeTopModal();if(state.calm)toggleCalm(false);return}
 if(state.phase!=='play')return;
 const pan=.8;
 if(e.key==='ArrowLeft'||e.key==='a')cam.tTheta+=.09;

 if(e.key==='ArrowUp'||e.key==='w')cam.tPhi=clamp(cam.tPhi-.06,.35,1.45);
 if(e.key==='ArrowDown'||e.key==='s')cam.tPhi=clamp(cam.tPhi+.06,.35,1.45);
 if(e.key==='+'||e.key==='=')cam.tRadius=clamp(cam.tRadius*.9,cam.minR,cam.maxR);
 if(e.key==='-'||e.key==='_')cam.tRadius=clamp(cam.tRadius*1.1,cam.minR,cam.maxR);

function toast(emoji,txt,ms=2600){const el=document.createElement('div');el.className='toast';
 el.innerHTML=`<span>${emoji}</span><span>${txt}</span>`;$('#toasts').appendChild(el);

const modalStack=[];
function openModal({title,emoji,build,wide,onClose}){
 const back=document.createElement('div');back.className='modal-back';
 const card=document.createElement('div');card.className='modal-card'+(wide?' wide':'');
 card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');
 const head=document.createElement('div');head.className='modal-head';
 head.innerHTML=`<span style="font-size:30px">${emoji||''}</span><h2>${title||''}</h2>`;
 const x=document.createElement('button');x.className='x-btn';x.textContent='✖';x.setAttribute('aria-label',t('close'));
 x.onclick=()=>closeModal(back);head.appendChild(x);card.appendChild(head);
 const body=document.createElement('div');card.appendChild(body);
 back.appendChild(card);
 back.addEventListener('pointerdown',e=>{if(e.target===back)closeModal(back)});
 $('#modal-root').appendChild(back);
 modalStack.push({back,onClose});
 build(body,()=>closeModal(back));
 const fb=card.querySelector('button');if(fb)fb.focus();
 return back}
function closeModal(back){const i=modalStack.findIndex(m=>m.back===back);
 if(i<0)return;const m=modalStack.splice(i,1)[0];
 m.back.style.opacity=0;setTimeout(()=>m.back.remove(),250);if(m.onClose)m.onClose()}
function closeTopModal(){if(modalStack.length)closeModal(modalStack[modalStack.length-1].back)}

function applyWindowView(){const v=S.d.windowView;
 const cols={day:['#bfe0ff','#cfe8ff',.8],night:['#3a3a6a','#5a5aa0',.5],rain:['#9aa8c0','#b0bcd0',.4]}[v];
 windowPane.material.color.set(cols[0]);windowPane.material.emissive.set(cols[1]);
 windowPane.material.emissiveIntensity=cols[2]}

/* ---- movement panel ---- */
function movePanel(p){
 const r0=row(p);r0.style.justifyContent='center';
 const go=toolBtn(r0,trainS.on?'⏸️':'▶️',trainS.on?t('stop'):t('start'),trainS.on,b=>{
  trainS.on=!trainS.on;trainS.target=null;if(trainS.on)discover('train','🚂','d_train');AudioSys.soft();refreshPanel()});
 const r1=row(p);r1.style.alignItems='center';r1.style.gap='12px';
 const sl1=document.createElement('span');sl1.style.cssText='font-weight:800;font-size:14px';sl1.textContent=t('speed');r1.appendChild(sl1);
 segRow(r1,[{v:.18,l:'🐢 '+t('slow')},{v:.35,l:t('normal')},{v:.55,l:'🚄 '+t('fast')}],trainS.spd,v=>{trainS.spd=v;AudioSys.soft()});
 const r2=row(p);r2.style.alignItems='center';r2.style.gap='12px';
 const sd=document.createElement('span');sd.style.cssText='font-weight:800;font-size:14px';sd.textContent=t('dest');r2.appendChild(sd);
 stations.forEach(st=>{const b=document.createElement('button');b.className='tool-btn';b.style.minWidth='64px';
  b.innerHTML=`<span class="te">${st.e}</span>`;b.onclick=()=>setTrainDest(st);r2.appendChild(b)});
 const r3=row(p);r3.style.alignItems='center';r3.style.gap='12px';
 const wt=document.createElement('span');wt.style.cssText='font-weight:800;font-size:14px';wt.textContent=t('weather');r3.appendChild(wt);
 segRow(r3,[{v:'clear',l:'☀️'},{v:'rain',l:'🌧️'},{v:'snow',l:'❄️'}],weatherType,v=>{
  weatherType=v;weatherPts.visible=v!=='clear'&&particleScale()>0;
  weatherPts.material.color.set(v==='snow'?'#ffffff':'#8fd0ea');AudioSys.soft()});
 const r4=row(p);
 toolBtn(r4,'🌳',t('addTree'),false,()=>placeScenery('tree'));
 toolBtn(r4,'🏠',t('addHouse'),false,()=>placeScenery('house'));
 toolBtn(r4,'🌉',t('bridge'),bridge.visible,b=>{bridge.visible=!bridge.visible;b.classList.toggle('on');AudioSys.soft()})}

/* ============================================================
   CALM SPACE
============================================================ */
let calmBubbles=[];
function toggleCalm(force){const on=force!==undefined?force:!state.calm;
 if(on===state.calm)return;state.calm=on;applySettings();
 if(on){AudioSys.duck(true);$('#dock').hidden=true;closeZonePanel();
  $('#calm-ui').hidden=false;$('#breath-wrap').style.display='flex';
  hint('calm1','🫧',t('calmHere'));
  cam.tPhi=1.25;cam.locked=true;$('#btn-camlock').textContent='🔒';
  for(let i=0;i<16*particleScale()+4;i++){const b=sprite('#dff4ff',rand(.2,.5));
   b.position.set(cam.tLook.x+rand(-6,6),rand(-1,6),cam.tLook.z+rand(-6,6));
   b.userData.v=rand(.3,.7);scene.add(b);calmBubbles.push(b)}}
 else{AudioSys.duck(false);$('#calm-ui').hidden=true;cam.locked=false;$('#btn-camlock').textContent='🔓';
  calmBubbles.forEach(b=>scene.remove(b));calmBubbles=[];
  if(worldG.visible){if(state.zone){$('#dock').hidden=true}else{$('#dock').hidden=false}}}
 updateLighting()}
$('#btn-calm').onclick=()=>{AudioSys.init();toggleCalm()};
$('#calm-back').onclick=()=>toggleCalm(false);
$('#breath-hide').onclick=()=>{$('#breath-wrap').style.display='none'};

/* ============================================================
   EMOTIONS
============================================================ */
$('#btn-feel').onclick=()=>{AudioSys.init();
 openModal({title:t('feel'),emoji:'🙂',build:(body)=>{
  const grid=document.createElement('div');grid.className='feel-grid';
  [['😀','e_happy','r_happy','#ffe6a8'],['😐','e_ok','r_ok','#cdeee1'],
   ['😟','e_worried',null,'#cfe8ff'],['😡','e_angry',null,'#ffd1e0'],
   ['😴','e_tired',null,'#e7ddff'],['🤗','e_help',null,'#ffe0b8'],['🫧','e_break',null,'#dff4ff']]
  .forEach(([em,key,resp,col])=>{const b=document.createElement('button');b.className='feel-btn';
   b.style.background=col+'88';
   b.innerHTML=`<span class="fe">${em}</span><span class="lbl">${t(key)}</span>`;
   b.onclick=()=>emotionPick(key,em);grid.appendChild(b)});
  body.appendChild(grid)}})};
function emotionPick(key,em){closeTopModal();AudioSys.soft();
 if(key==='e_break'){toggleCalm(true);return}
 if(key==='e_help'){toast('🤗','🏠 🫧 💬 ⚙️',4200);
  ['#btn-home','#btn-calm','#btn-talk','#btn-settings'].forEach((id,i)=>{
   const el=$(id);setTimeout(()=>{el.style.transition='transform .5s';el.style.transform='scale(1.15)';
    setTimeout(()=>el.style.transform='',520)},i*450)});return}
 if(key==='e_tired'){tint('#e7ddff');toggleCalm(true);return}
 if(key==='e_worried'||key==='e_angry'){tint(key==='e_angry'?'#ffd1e0':'#cfe8ff');
  openModal({title:em+' '+t(key),emoji:'💛',build:body=>{
   hintRow(body,t('pickOne'));
   const r=row(body);r.style.justifyContent='center';
   toolBtn(r,'🫧',t('calm'),false,()=>{closeTopModal();toggleCalm(true)});
   toolBtn(r,'🏠',t('home'),false,()=>{closeTopModal();goHub()});
   toolBtn(r,'🤗',t('e_help'),false,()=>{closeTopModal();emotionPick('e_help','🤗')})}});
  return}
 tint(key==='e_happy'?'#ffe6a8':'#cdeee1');
 toast(em,key==='e_happy'?t('r_happy'):t('r_ok'))}

/* ============================================================
   COMMUNICATION
============================================================ */
const COMM={starter:null,item:null};
const STARTERS=[['i_want','🙋'],['i_need','🫶'],['i_like','💛'],['i_dontlike','🙅']];
const ITEMS=[['it_water','💧'],['it_home','🏠'],['it_train','🚂'],['it_sound','🔊'],
 ['it_quiet','🤫'],['it_calm','🫧'],['it_break','⏸️'],['it_play','🧸'],['it_garden','🌱']];
$('#btn-talk').onclick=()=>{AudioSys.init();
 openModal({title:t('talkTitle'),emoji:'💬',build:(body,close)=>{
  const view=document.createElement('div');view.className='sentence-view';body.appendChild(view);
  const s1=document.createElement('div');s1.className='chips';body.appendChild(s1);
  const s2=document.createElement('div');s2.className='chips';s2.style.marginTop='10px';body.appendChild(s2);
  const withText=S.d.settings.comm==='iconsText';
  function render(){
   s1.innerHTML='';s2.innerHTML='';
   STARTERS.forEach(([k,e])=>{const b=document.createElement('button');
    b.className='chip-btn'+(COMM.starter===k?' on':'');
    b.innerHTML=`<span class="ce">${e}</span>${withText?`<span>${t(k)}</span>`:''}`;
    b.onclick=()=>{COMM.starter=k;AudioSys.soft();render()};s1.appendChild(b)});
   ITEMS.forEach(([k,e])=>{const b=document.createElement('button');
    b.className='chip-btn'+(COMM.item===k?' on':'');
    b.innerHTML=`<span class="ce">${e}</span>${withText?`<span>${t(k)}</span>`:''}`;
    b.onclick=()=>{COMM.item=k;AudioSys.soft();render()};s2.appendChild(b)});
   view.innerHTML=COMM.starter&&COMM.item?
    `${STARTERS.find(s=>s[0]===COMM.starter)[1]} <span style="font-size:20px">${withText?t(COMM.starter):''}</span> ${ITEMS.find(i=>i[0]===COMM.item)[1]} <span style="font-size:20px">${withText?t(COMM.item):''}</span>`
    :'💭'}
  render();
  const r=row(body);r.style.justifyContent='center';r.style.marginTop='14px';
  const say=document.createElement('button');say.className='big-btn primary';
  say.innerHTML=`🗣️ <span>${t('say')}</span>`;
  say.onclick=()=>{if(!COMM.starter||!COMM.item)return;
   AudioSys.chime();toast('💛',t('said'));
   if(S.d.settings.voice&&'speechSynthesis'in window){try{
    const u=new SpeechSynthesisUtterance(t(COMM.starter)+' '+t(COMM.item));
    u.lang=S.d.settings.lang==='ar'?'ar':'en';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
   commAction(COMM.starter,COMM.item);close()};
  r.appendChild(say)}})};
function commAction(starter,item){
 if(starter==='i_dontlike'&&item==='it_sound'){AudioSys.init();AudioSys.setMuted(true);return}
 if(item==='it_break'||item==='it_calm'){toggleCalm(true);return}
 if(item==='it_home'){goHub();return}
 if(item==='it_water'&&worldG.visible){goToZone('water');return}
 if(item==='it_train'&&worldG.visible){goToZone('move');return}
 if(item==='it_garden'&&worldG.visible){goToZone('nature');return}
 if(item==='it_quiet'){AudioSys.init();AudioSys.setMuted(true)}
 if(item==='it_play'&&worldG.visible)goToZone('shapes')}

/* ============================================================
   SETTINGS PANEL
============================================================ */
$('#btn-settings').onclick=()=>openSettings();
function openSettings(){AudioSys.init();
 openModal({title:t('settings'),emoji:'⚙️',wide:true,build:(body)=>{
  const defs=[
   {k:'sound',i:'🔊',l:'s_sound',type:'range'},
   {k:'music',i:'🎵',l:'s_music',type:'seg',o:[['off','opt_off'],['low','opt_low'],['normal','opt_normal']]},
   {k:'effects',i:'✨',l:'s_effects',type:'seg',o:[['off','opt_off'],['low','opt_low'],['normal','opt_normal']]},
   {k:'anim',i:'🌀',l:'s_anim',type:'seg',o:[['low','opt_low'],['normal','opt_normal']]},
   {k:'camera',i:'🎥',l:'s_camera',type:'seg',o:[['off','opt_off'],['low','opt_low'],['normal','opt_normal']]},
   {k:'particles',i:'🫧',l:'s_particles',type:'seg',o:[['off','opt_off'],['low','opt_low'],['normal','opt_normal']]},
   {k:'light',i:'💡',l:'s_light',type:'seg',o:[['soft','opt_soft'],['normal','opt_normal']]},
   {k:'charMove',i:'🚶',l:'s_charmove',type:'seg',o:[['off','opt_off'],['low','opt_low'],['normal','opt_normal']]},
   {k:'text',i:'🔤',l:'s_text',type:'seg',o:[['off','opt_off'],['simple','opt_simple'],['normal','opt_normal']]},
   {k:'comm',i:'🖼️',l:'s_comm',type:'seg',o:[['icons','opt_icons'],['iconsText','opt_iconsText']]},
   {k:'chars',i:'👧',l:'s_chars',type:'toggle'},
   {k:'voice',i:'🗣️',l:'s_voice',type:'toggle'},
   {k:'lang',i:'🌐',l:'s_lang',type:'seg',o:[['en','EN'],['ar','عربي']]}];
  defs.forEach(d=>{const r=document.createElement('div');r.className='set-row';
   r.innerHTML=`<span class="si">${d.i}</span><span class="sl">${t(d.l)}</span>`;
   if(d.type==='range'){const sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=100;
    sl.value=S.d.settings[d.k];sl.setAttribute('aria-label',t(d.l));
    sl.oninput=()=>{S.d.settings[d.k]=+sl.value;S.save();applySettings()};r.appendChild(sl)}
   if(d.type==='seg'){const sg=document.createElement('div');sg.className='seg';
    d.o.forEach(([v,lab])=>{const b=document.createElement('button');b.textContent=t(lab);
     if(S.d.settings[d.k]===v)b.classList.add('on');
     b.onclick=()=>{S.d.settings[d.k]=v;S.save();applySettings();openSettingsRefresh(body)};
     sg.appendChild(b)});r.appendChild(sg)}
   if(d.type==='toggle'){const tg=document.createElement('button');
    tg.className='toggle'+(S.d.settings[d.k]?' on':'');tg.setAttribute('aria-pressed',S.d.settings[d.k]);
    tg.setAttribute('aria-label',t(d.l));
    tg.onclick=()=>{S.d.settings[d.k]=!S.d.settings[d.k];S.save();applySettings();tg.classList.toggle('on')};
    r.appendChild(tg)}
   body.appendChild(r)});
  const philo=document.createElement('p');
  philo.style.cssText='text-align:center;color:var(--ink2);font-weight:700;margin:18px 0 6px;font-size:14px';
  philo.textContent=t('philo');body.appendChild(philo);
  const rb=row(body);rb.style.justifyContent='center';
  const reset=document.createElement('button');reset.className='tool-btn';
  reset.innerHTML=`<span class="te">🌱</span><span>${t('s_reset')}</span>`;
  reset.onclick=()=>{try{localStorage.removeItem(S.key)}catch(e){}location.reload()};
  rb.appendChild(reset)}})}
function openSettingsRefresh(body){/* re-render labels on lang change */
 closeTopModal();setTimeout(openSettings,280)}

/* ============================================================
   PERSONALIZATION (first session, gentle)
============================================================ */
const PREFS=[
 {q:'pq_sound',opts:[['🔊','p_soundOn',{music:'normal',sound:60}],['🤫','p_soundOff',{music:'off',effects:'low',sound:22}]]},
 {q:'pq_speed',opts:[['🐇','p_fast',{anim:'normal',camera:'normal'}],['🐢','p_slow',{anim:'low',camera:'low'}]]},
 {q:'pq_light',opts:[['☀️','p_color',{light:'normal'}],['🌙','p_soft',{light:'soft',particles:'low'}]]},
 {q:'pq_focus',opts:[['👧','p_chars',{chars:true}],['🌳','p_env',{chars:false}]]}];
function runPrefs(idx=0){
 if(idx>=PREFS.length){S.d.prefsDone=true;S.save();toast('🕊️',t('p_done'));return}
 const q=PREFS[idx];
 const back=openModal({title:'',emoji:'',build:(body,close)=>{
  body.classList.add('prefs-card');
  body.innerHTML=`<div style="font-size:16px;color:var(--ink2);font-weight:800">${idx+1} / ${PREFS.length}</div>
   <div class="prefs-q">${t(q.q)}</div>`;
  const opts=document.createElement('div');opts.className='prefs-opts';
  q.opts.forEach(([em,lbl,fx])=>{const b=document.createElement('button');b.className='pref-opt';
   b.innerHTML=`<span class="pe">${em}</span><span>${t(lbl)}</span>`;
   b.onclick=()=>{Object.assign(S.d.settings,fx);S.save();applySettings();
    AudioSys.soft();close();setTimeout(()=>runPrefs(idx+1),320)};
   opts.appendChild(b)});
  body.appendChild(opts);
  const sk=document.createElement('button');
  sk.style.cssText='margin-top:18px;font-weight:800;color:var(--ink2);padding:10px 18px';
  sk.textContent='➡️ '+t('skip');
  sk.onclick=()=>{close();setTimeout(()=>runPrefs(idx+1),300)};
  body.appendChild(sk);
  const dots=document.createElement('div');dots.className='dots';
  PREFS.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===idx?' on':'');dots.appendChild(d)});
  body.appendChild(dots)}})}

/* ============================================================
   WORLD ENTRY / TITLE
============================================================ */
$('#btn-begin').onclick=()=>{AudioSys.init();AudioSys.resume();
 $('#title-card').classList.add('gone');
 state.phase='play';state.ready=true;
 skyMat.uniforms.uTop.value.set('#d8cfe8');skyMat.uniforms.uBot.value.set('#ffe9d8');
 setCam({look:{x:0,y:1.4,z:-1},theta:.9,phi:1.3,radius:11.5});
 setTimeout(()=>setCam({look:{x:4,y:1.8,z:-5.2},theta:.35,phi:1.18,radius:6}),400);
 cam.minR=4;cam.maxR=15;
 setChip('🛏️','zoneBedroom');
 updateLighting();
 setTimeout(()=>hint('door','🕊️',t('h_door')),2500)};
function enterWorld(){if(!worldG.visible){
 $('#fade').style.opacity=1;AudioSys.soft();
 setTimeout(()=>{bedroomG.visible=false;worldG.visible=true;
  skyMat.uniforms.uTop.value.set('#bfe0ff');skyMat.uniforms.uBot.value.set('#fff1e0');
  buildDock();$('#dock').hidden=false;
  setCam(zoneCamView(null));cam.minR=8;cam.maxR=46;
  setChip('🏝️','zoneHub');applyWindowView();
  $('#fade').style.opacity=0;
  if(!S.d.firstWorld){S.d.firstWorld=true;S.save();
   setTimeout(()=>runPrefs(0),1200)}
  else setTimeout(()=>hint('map1','👆',t('h_map')),1200);
 },650)}}

/* top buttons */
$('#btn-home').onclick=()=>{AudioSys.init();AudioSys.soft();goHub()};
$('#btn-sound').onclick=()=>{AudioSys.init();AudioSys.setMuted(!AudioSys.muted)};
$('#btn-sound').textContent=S.d.settings.muted?'🔇':'🔊';
$('#btn-zoom-in').onclick=()=>cam.tRadius=clamp(cam.tRadius*.82,cam.minR,cam.maxR);
$('#btn-zoom-out').onclick=()=>cam.tRadius=clamp(cam.tRadius*1.22,cam.minR,cam.maxR);
$('#btn-camlock').onclick=e=>{cam.locked=!cam.locked;
 e.currentTarget.textContent=cam.locked?'🔒':'🔓';e.currentTarget.setAttribute('aria-pressed',cam.locked)};

/* ============================================================
   MAIN LOOP
============================================================ */
const clock=new THREE.Clock();let clockTime=0;
function animate(){requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);clockTime+=dt*timeScale;
 const ts=dt*timeScale;
 if(bedroomG.visible)bedroomAnims.forEach(f=>f(ts));
 if(worldG.visible)worldAnims.forEach(f=>f(ts));
 for(let i=bubbles3D.length-1;i>=0;i--){const b=bubbles3D[i];
  b.position.y+=b.userData.v*ts;b.material.opacity=clamp((5-b.position.y)/3,.0,0.7);
  if(b.position.y>5){worldG.remove(b);bubbles3D.splice(i,1)}}
 for(let i=calmBubbles.length-1;i>=0;i--){const b=calmBubbles[i];
  b.position.y+=b.userData.v*ts;
  if(b.position.y>8)b.position.y=-1}
 if(dragObj&&dragObj.mesh.userData.wob){}
 shapeMeshes&&shapeMeshes.forEach(m=>{if(m.userData.wob&&m.userData.wob>0){m.userData.wob-=dt;
  m.rotation.z=Math.sin(m.userData.wob*18)*.12*m.userData.wob}});
 floaters.forEach(f=>{if(f.mesh.userData.wob&&f.mesh.userData.wob>0){f.mesh.userData.wob-=dt;
  f.mesh.rotation.z=Math.sin(f.mesh.userData.wob*18)*.12*f.mesh.userData.wob}
  else f.mesh.rotation.z=lerp(f.mesh.rotation.z,0,.1)});
 updateCam(dt);
 renderer.render(scene,camera)}
function fitTaha(){camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',fitTaha);
/* بعض الهواتف لا تُطلق resize عند الإدارة، فنُصغي لها صراحةً */
addEventListener('orientationchange',()=>setTimeout(fitTaha,160));
if(screen.orientation&&screen.orientation.addEventListener)
 screen.orientation.addEventListener('change',()=>setTimeout(fitTaha,160));

/* init */
applySettings();applyI18n();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches&&S.d.settings.camera==='normal'){
 S.d.settings.camera='low';S.d.settings.particles='low';applySettings()}
animate();
</script>
