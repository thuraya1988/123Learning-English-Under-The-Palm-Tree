<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بطاقة تهنئة باسمك · اليوم الوطني 20 نوفمبر · الجمعية التاريخية العُمانية</title>
<meta name="description" content="اكتب اسمك واحصل على بطاقة تهنئة باليوم الوطني لسلطنة عُمان من الجمعية التاريخية العُمانية، جاهزة للحالة.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta property="og:title" content="اصنع بطاقة تهنئتك باسمك ✨ اليوم الوطني 20 نوفمبر">
<meta property="og:description" content="من الجمعية التاريخية العُمانية">
<meta property="og:image" content="https://play.under-palm-tree.com/ohs/greeting/assets/og-greeting.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
:root{--night:#07080c;--ink:#f4efe7;--muted:#b9b0a4;--orange:#f0913f;--gold:#ffcf7a;--line:rgba(255,255,255,.14);
  --font:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font)}
body{min-height:100svh;background:radial-gradient(120% 70% at 50% 0%,#1a1410 0%,#07080c 60%) fixed;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{width:clamp(110px,14vw,150px);height:auto;display:block;order:2}
.top h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800;line-height:1.5}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--gold)}
.wrap{max-width:1040px;margin:18px auto 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:start}
.panel{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
label{display:block;font-weight:700;font-size:15px;margin:0 0 8px}
input[type=text]{width:100%;font:700 20px var(--font);color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input[type=text]:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(240,145,63,.25)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.sizes{display:flex;gap:8px;margin:18px 0 0;padding:0;border:0}
.sizes legend{font-weight:700;font-size:15px;margin-bottom:8px;padding:0}
.sizes label{flex:1;margin:0;cursor:pointer}
.sizes input{position:absolute;opacity:0;pointer-events:none}
.sizes span{display:block;text-align:center;font-weight:500;font-size:14px;padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.sizes input:checked+span{border-color:var(--orange);background:rgba(240,145,63,.16);color:#fff}
.sizes input:focus-visible+span{outline:2px solid var(--orange);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
button{font:700 16px var(--font);border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid transparent;flex:1;min-width:140px}
.primary{background:linear-gradient(180deg,#f6a356,#e57b22);color:#1a1006}
.primary:hover{filter:brightness(1.06)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.ghost:hover{background:rgba(255,255,255,.06)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{min-height:1.6em;margin:10px 0 0;font-size:13px;color:var(--gold)}
.preview{display:flex;justify-content:center}
.preview canvas{width:100%;max-width:400px;height:auto;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px var(--line);display:block}
.preview.square canvas{max-width:460px}
.foot{max-width:1040px;margin:26px auto 0;text-align:center;font-size:12px;color:rgba(244,239,231,.55)}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  .preview{order:2}
  .preview canvas{max-width:320px}
}
</style>
</head>
<body>
<header class="top">
  <img src="assets/logo-full-dark.png" alt="الجمعية التاريخية العُمانية · The Historical Association of Oman" width="415" height="300">
  <h1><small>اليوم الوطني لسلطنة عُمان · 20 نوفمبر</small>اصنع بطاقة تهنئتك باسمك</h1>
</header>

<main class="wrap">
  <section class="panel">
    <form id="form" autocomplete="off">
      <label for="name">اكتب اسمك</label>
      <input id="name" type="text" maxlength="40" placeholder="مثال: ثرياء الناعبية" enterkeyhint="done">
      <p class="hint">يظهر الاسم في البطاقة تحت عبارة «تهنئة من». لا يُحفظ الاسم ولا يُرسل إلى أي مكان.</p>
      <fieldset class="sizes">
        <legend>مقاس البطاقة</legend>
        <label><input type="radio" name="size" value="story" checked><span>حالة واتساب وستوري</span></label>
        <label><input type="radio" name="size" value="square"><span>مربعة للمنشورات</span></label>
      </fieldset>
      <div class="actions">
        <button class="primary" id="share" type="button">مشاركة البطاقة</button>
        <button class="ghost" id="download" type="button">تنزيل الصورة</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
  </section>
  <section class="preview" id="preview" aria-label="معاينة البطاقة">
    <canvas id="card" width="1080" height="1920" role="img" aria-label="بطاقة تهنئة باليوم الوطني"></canvas>
  </section>
</main>
<p class="foot">الجمعية التاريخية العُمانية · لجنة تقنية المعلومات</p>

<script>
(function(){
  "use strict";
  var cv = document.getElementById("card"), g = cv.getContext("2d");
  var nameEl = document.getElementById("name"), statusEl = document.getElementById("status");
  var FONT = "'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif";
  var logo = new Image(); logo.src = "assets/logo-full-dark.png";
  var size = "story";

  function rnd(seed){ var s = seed; return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; }; }
  function font(w, px){ return w + " " + px + "px " + FONT; }
  function fitText(text, weight, px, maxW){
    g.font = font(weight, px);
    var m = g.measureText(text).width;
    if (m > maxW){ px = Math.floor(px*maxW/m); g.font = font(weight, px); }
    return px;
  }

  function burst(x, y, R, colors, r){
    var n = 46;
    for (var i=0;i<n;i++){
      var a = Math.PI*2*i/n;
      for (var k=1;k<=5;k++){
        var d = R*(k/5)*(0.92 + r()*0.12), c = colors[(i+k)%colors.length];
        g.globalAlpha = 0.25 + 0.75*(k/5);
        g.fillStyle = c; g.beginPath(); g.arc(x + Math.cos(a)*d, y + Math.sin(a)*d, 2.2 + k*0.9, 0, 6.29); g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  function skyline(W, H, h){
    var pts = "M0 140V104h70v-10h40v10h40V86h8v-6h8v6h8v-6h8v6h8v-6h8v6h8v58h40V96h60v-8h12v8h60v-30h10v-8h10v8h10v-8h10v8h10v-8h10v8h10v78h50v-24h90v-14h20v14h90V70h10v-8h10v8h10v-8h10v8h10v-8h10v8h10v62h50v-18h70v-10h10v10h40V90h10v-8h10v8h10v-8h10v8h10v42h60V100h80v40z";
    g.save(); g.translate(0, H - h); g.scale(W/1200, h/140);
    var p = new Path2D(pts);
    var gr = g.createLinearGradient(0,0,0,140); gr.addColorStop(0,"#2a1a10"); gr.addColorStop(.12,"#0b0c10"); gr.addColorStop(1,"#050608");
    g.fillStyle = gr; g.fill(p);
    g.restore();
  }

  function ribbon(cx, cy, text, px){
    g.font = font(700, px);
    var tw = g.measureText(text).width, w = tw + px*2.2, h = px*1.9, x = cx - w/2, y = cy - h/2, tail = px*1.4;
    // tails
    g.fillStyle = "#7c090d";
    g.beginPath(); g.moveTo(x + tail*.4, y + h*.35); g.lineTo(x - tail, y + h*.35); g.lineTo(x - tail*.55, y + h*.35 + h*.5); g.lineTo(x - tail, y + h*1.35); g.lineTo(x + tail*.4, y + h*1.35); g.fill();
    g.beginPath(); g.moveTo(x + w - tail*.4, y + h*.35); g.lineTo(x + w + tail, y + h*.35); g.lineTo(x + w + tail*.55, y + h*.35 + h*.5); g.lineTo(x + w + tail, y + h*1.35); g.lineTo(x + w - tail*.4, y + h*1.35); g.fill();
    g.fillStyle = "#4d0507";
    g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + tail*.4, y + h); g.lineTo(x + tail*.4, y + h*1.35); g.fill();
    g.beginPath(); g.moveTo(x + w, y + h); g.lineTo(x + w - tail*.4, y + h); g.lineTo(x + w - tail*.4, y + h*1.35); g.fill();
    // body
    var gr = g.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0,"#f2484d"); gr.addColorStop(.45,"#d11b21"); gr.addColorStop(1,"#a80f15");
    g.shadowColor = "rgba(219,22,27,.45)"; g.shadowBlur = px*.8; g.shadowOffsetY = px*.2;
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.setLineDash([px*.28, px*.22]); g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = Math.max(2, px*.05);
    g.beginPath(); g.moveTo(x + px*.4, y + px*.22); g.lineTo(x + w - px*.4, y + px*.22); g.moveTo(x + px*.4, y + h - px*.22); g.lineTo(x + w - px*.4, y + h - px*.22); g.stroke();
    g.setLineDash([]);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 4; g.shadowOffsetY = 2;
    g.fillText(text, cx, cy + px*.08);
    g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0;
  }

  function glowText(text, x, y, px, weight){
    g.font = font(weight, px); g.textAlign = "center"; g.textBaseline = "middle";
    var layers = [[px*.5,"rgba(219,22,27,.45)"],[px*.25,"rgba(240,145,63,.75)"],[px*.09,"rgba(255,190,120,.9)"],[px*.025,"#fff"]];
    g.fillStyle = "#fff";
    layers.forEach(function(l){ g.shadowColor = l[1]; g.shadowBlur = l[0]; g.fillText(text, x, y); });
    g.shadowColor = "transparent"; g.shadowBlur = 0;
    g.fillText(text, x, y);
  }

  function draw(){
    var story = size === "story", W = 1080, H = story ? 1920 : 1080;
    if (cv.height !== H){ cv.height = H; }
    document.getElementById("preview").classList.toggle("square", !story);
    g.direction = "rtl";
    // sky
    var bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#05060a"); bg.addColorStop(.6,"#0b0d16"); bg.addColorStop(1,"#1d130f");
    g.fillStyle = bg; g.fillRect(0,0,W,H);
    var halo = g.createRadialGradient(W/2, H*(story?.36:.42), 0, W/2, H*(story?.36:.42), W*.62);
    halo.addColorStop(0,"rgba(240,145,63,.26)"); halo.addColorStop(1,"rgba(240,145,63,0)");
    g.fillStyle = halo; g.fillRect(0,0,W,H);
    var r = rnd(20), i;
    g.fillStyle = "#fff";
    for (i=0;i<(story?260:150);i++){ g.globalAlpha = .25 + r()*.6; var s = r()*2.6 + .6; g.fillRect(r()*W, r()*H*.8, s, s); }
    g.globalAlpha = 1;
    // fireworks
    var flag = ["#ff2a2f","#ffffff","#22c55e"], orange = ["#f0913f","#ffc27a","#fff3e0"];
    if (story){ burst(870, 265, 130, flag, r); burst(640, 140, 85, orange, r); burst(950, 930, 85, orange, r); burst(140, 1010, 95, flag, r); }
    else { burst(880, 190, 120, flag, r); burst(690, 90, 70, orange, r); burst(120, 520, 70, orange, r); }

    // logo, top-left, complete
    var lw = story ? 330 : 250, lh = lw*300/415;
    if (logo.complete && logo.naturalWidth){
      g.shadowColor = "rgba(240,145,63,.45)"; g.shadowBlur = 30;
      g.drawImage(logo, 64, story ? 80 : 54, lw, lh);
      g.shadowColor = "transparent"; g.shadowBlur = 0;
    }

    g.textAlign = "center"; g.textBaseline = "middle";
    var cx = W/2, y;
    if (story){
      g.font = font(700, 54); g.fillStyle = "#f0913f"; g.fillText("اليوم الوطني لسلطنة عُمان", cx, 440);
      glowText("20", cx, 770, 380, 800);
      g.font = font(800, 96); g.fillStyle = "#fff"; g.fillText("نوفمبر", cx, 1000);
      ribbon(cx, 1150, "كل عام وعُمان بخير", 58);
      g.font = font(500, 38); g.fillStyle = "#c9c0b4"; g.fillText("ذكرى تأسيس الدولة البوسعيدية عام 1744م", cx, 1300);
      nameBlock(cx, 1575, 940, true);
      skyline(W, H, 190);
      g.font = font(500, 30); g.fillStyle = "rgba(244,239,231,.75)"; g.fillText("الجمعية التاريخية العُمانية · لجنة تقنية المعلومات", cx, H - 52);
    } else {
      // square: text block on the right half below the logo row
      y = 300;
      g.font = font(700, 42); g.fillStyle = "#f0913f"; g.fillText("اليوم الوطني لسلطنة عُمان", cx, y);
      glowText("20", cx - 130, y + 175, 250, 800);
      g.font = font(800, 84); g.fillStyle = "#fff"; g.fillText("نوفمبر", cx + 175, y + 185);
      ribbon(cx, 640, "كل عام وعُمان بخير", 46);
      g.font = font(500, 30); g.fillStyle = "#c9c0b4"; g.fillText("ذكرى تأسيس الدولة البوسعيدية عام 1744م", cx, 752);
      nameBlock(cx, 905, 900, false);
      skyline(W, H, 96);
      g.font = font(500, 24); g.fillStyle = "rgba(244,239,231,.75)"; g.fillText("الجمعية التاريخية العُمانية · لجنة تقنية المعلومات", cx, H - 36);
    }
  }

  function nameBlock(cx, y, maxW, story){
    var raw = nameEl.value.replace(/\s+/g," ").trim(), name = raw || "اسمك هنا";
    g.font = font(500, story ? 44 : 34); g.fillStyle = "#c9c0b4"; g.textAlign = "center";
    g.fillText("تهنئة من", cx, y - (story ? 100 : 74));
    var px = fitText(name, 800, story ? 104 : 80, maxW);
    var gr = g.createLinearGradient(0, y - px*.6, 0, y + px*.6);
    gr.addColorStop(0,"#fffaf0"); gr.addColorStop(.5,"#ffd88f"); gr.addColorStop(1,"#f0913f");
    g.shadowColor = "rgba(255,190,110,.5)"; g.shadowBlur = 28;
    g.fillStyle = raw ? gr : "rgba(255,255,255,.35)";
    g.fillText(name, cx, y);
    g.shadowColor = "transparent"; g.shadowBlur = 0;
  }

  /* ---------- export ---------- */
  function fileName(){ return "tahniah-national-day-" + (size === "story" ? "story" : "square") + ".png"; }
  function toBlob(){ return new Promise(function(res){ cv.toBlob(res, "image/png"); }); }
  function needName(){
    if (nameEl.value.trim()) return false;
    statusEl.textContent = "اكتب اسمك أولاً لتظهر البطاقة باسمك.";
    nameEl.focus(); return true;
  }
  function download(blob){
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    statusEl.textContent = "تم تنزيل البطاقة ✓";
  }
  document.getElementById("download").addEventListener("click", function(){
    if (needName()) return;
    draw(); toBlob().then(download);
  });
  document.getElementById("share").addEventListener("click", function(){
    if (needName()) return;
    draw();
    toBlob().then(function(blob){
      var file = new File([blob], fileName(), {type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:"تهنئة باليوم الوطني"}).then(function(){ statusEl.textContent = "تمت المشاركة ✓"; })
          .catch(function(err){ if (err && err.name !== "AbortError") download(blob); });
      } else {
        download(blob);
        statusEl.textContent = "تم تنزيل البطاقة، ويمكنك مشاركتها من معرض الصور ✓";
      }
    });
  });

  var tmr;
  nameEl.addEventListener("input", function(){ statusEl.textContent = ""; clearTimeout(tmr); tmr = setTimeout(draw, 60); });
  document.getElementById("form").addEventListener("submit", function(e){ e.preventDefault(); nameEl.blur(); });
  Array.prototype.forEach.call(document.querySelectorAll("input[name=size]"), function(r){
    r.addEventListener("change", function(){ size = r.value; draw(); });
  });
  var pre = new URLSearchParams(location.search).get("name");
  if (pre) nameEl.value = pre.slice(0,40);

  var fontsReady = document.fonts ? Promise.race([
    Promise.all([document.fonts.load(font(800,80)), document.fonts.load(font(700,40)), document.fonts.load(font(500,30))]),
    new Promise(function(r){ setTimeout(r, 3000); })]) : Promise.resolve();
  var logoReady = new Promise(function(r){ if (logo.complete) r(); else { logo.onload = r; logo.onerror = r; } });
  draw();
  Promise.all([fontsReady, logoReady]).then(draw);
})();
</script>
</body>
</html>
